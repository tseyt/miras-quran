  - verse: 65
    segments:
      - text: "(Resulım!) Şubesiz, saña da, senden evelkilerine de, boyle vahiy olunğandır ki: Ant olsun, Allaһqa ortaq qoşar iseñ, işleriñ mıtalqa boşuna keter ve ziyanda qalğanlardan olursıñ!"
        cid: 0
  - verse: 66
    segments:
      - text: "Yoq! Yalıñız Allaһqa qullıq et ve şukür etkenlerden ol."
        cid: 0
  - verse: 67
    segments:
      - text: "Olar Allaһnı haqqı ile tanıp bilalmadılar. Qıyamet kunü butün yer yuzü Onıñ tasarrufındadır. Kokler Onıñ qudret elinen türülgen olacaq. O, muşriklerniñ ortaq qoşuvlarından yuce ve uzaqtır."
        cid: 0
  - verse: 68
    segments:
      - text: "Suurğa uflengeninen, Allaһnıñ tilegenleri istisna olmaq uzre, koklerde ve yerde ne bar ise, episi olecek. Soñ oña bir daa uflengeninen, bir de ne korersiñ, olar ayaqqa qalqqan, baqmaqtalar! (Birinci Suurda Allaһnıñ isteginen olmeyip qalğanlarnıñ, Cebrail, Mikail, İsrafil, Azrail ya da hamele-i ari ya da ridvan melekleri, uriyler, cennetniñ hazinedarı Maliknen ceennem bekçileri zebaniyler olğanı bildirilmekte. Bu ayetke kore, nefha yani suurğa ufürmek eki keredir. Birincisi - olüm suurı, ekincisi de - ba’s yani tirilüv suurıdır)."
        cid: 0
  - verse: 69
    segments:
      - text: "Yer yuzü, Rabbiñniñ nurınen aydınlanır, kitap qoyulır, peyğamberler ve şaatlar ketirilir ve aralarında aqqaniyetnen uküm berilir. Olarğa asla zulum etilmez. («Er yuzü» mahşer olaraq yorumlanır eken, «kitap» da, amel defterleri ya da levh-i mahfuznen tefsir etilgendir. Ketirilgen şaatlarnıñ da peyğamberlerniñ ummetinen, melekler ve salih insanlar olğanı izaatlanğandır)."
        cid: 0
  - verse: 70
    segments:
      - text: "Er kes ne yapqan olsa, qarşılığı tamamınen berilir. Allaһ olarnıñ yapqanlarını eñ yahşı bilicidir."
        cid: 0
  - verse: 71
    segments:
      - text: "O kufür etkenler, bolük alında ceennemge sürülir. Niayet, o yerge kelgen vaqıtlarında, qapuları açılır, bekçileri olarğa: Sizge, arañızdan Rabbiñizniñ ayetlerini oquğan ve bugunge qavuşacağıñıznı ihtar etken peyğamberler kelmedimi? derler. «Ebet, keldi», derler, amma, azap sözü kâfirlerniñ uzerine haq olğandır. (Ayetten, şeriat kelmeden evel, teklifniñ olmağanı añlaşılmaqta, çünki melekler, ceennem ehliniñ tenqit etilüvini, peyğamberlerniñ kelüvi ve kitaplarnıñ tebliğ etilüvine rağmen, inanmayuvları sebebine esaslandırğanlar)."
        cid: 0
  - verse: 72
    segments:
      - text: "Olarğa: İçinde ebediy qalacağıñız ceennemniñ qapularından kiriñ; kibrlengenlerniñ yeri ne fena! denilir."
        cid: 0
  - verse: 73
    segments:
      - text: "Rabblerine qarşı kelüvden saqınğanlar ise, top-top cennetke yeteklenilir, o yerge barıp da, qapuları açılğanda, bekçileri olarğa: Selâm, sizge! Ter-temiz keldiñiz. Artıq ebediy qalmaq uzre kiriñ bu yerge, derler."
        cid: 0
  - verse: 74
    segments:
      - text: "Olar: Bizge bergen sözde sadıq olğan ve bizni, tilegen yerimizde oturacaq bu cennet yurtuna varis yapqan Allaһqa hamd olsun. Yahşı amelde olğanlarnıñ mukâfatı ne guzel eken! derler."
        cid: 0
  - verse: 75
    segments:
      - text: "Meleklerni korersiñ ki, Rabblerine hamd ile tesbih eterek, Arşnıñ etrafını sarğandırlar. Artıq aralarında adaletnen uküm olunğan ve «Alemlerniñ Rabbi olğan Allaһqa hamd olsun», denilgendir."
        cid: 0