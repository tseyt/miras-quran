surah_id: 39
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "Bu Kitap izzet ve ikmet saibi Allaһ qatından endirilgendir."
        cid: 0
  - verse: 2
    segments:
      - text: "(Resulım!) Şubesiz ki, Kitapnı saña haq olaraq endirdik. O alda, sen de dinni Allaһqa has qılaraq (ihlâsnen) qullıq et."
        cid: 0
  - verse: 3
    segments:
      - text: "Diqqat et, halis din yalıñız Allaһnıñdır. Onı bıraqıp, ozlerine bir taqım dostlar edingenler: Olarğa bizni, sadece Allaһqa yaqlaştırsınlar, diye qullıq etmektemiz, derler. Doğrusı, Allaһ davalaşqan şeylerinde aralarında uküm berecek. Şubesiz, Allaһ, yalancı ve inkârcı kimseni doğru yolğa qavuştırmaz. (Araplar, putları vastasınen, Allaһqa yaqınlaşacaqlarına inana ediler. İslâm dini Allaһtan başqa iç bir şeyge qullıq etilmeycegini, olarnıñ bu areketleri Allaһqa ortaq qoşuv olğanını bildirdi ve bunı kesen-kes yasaqladı)."
        cid: 0
  - verse: 4
    segments:
      - text: "Eger Allaһ bir evlât edinmek istese edi, elbette yaratqanlarından istegenini seçer edi. O, yucedir. O, tek ve qahhar olğan Allaһtır."
        cid: 0
  - verse: 5
    segments:
      - text: "Allaһ, koklerni ve yerni haq ile yarattı. Geceni kundüzniñ ustüne ortmekte, kundüzni de geceniñ ustüne sarmaqta. Kuneşni ve aynı emiri altına alğan. Er biri belli bir devirge qadar aqıp keter. Diqqat et! O, azizdir ve çoq bağışlayıcıdır. (Gece ve kundüzniñ bir-birine ortülip sarıluvınen, vaqıtlarınıñ uzalıpqısqarğanına, yerniñ yuvarlaqlığına, em ozüniñ, em de kuneş etrafında aylanğanına işaret etilgen. Zikr etilgen ayetler, tevhid inançını ve bu inançnı quvetlendirgen delillerni izaatlamaqta)."
        cid: 0
  - verse: 6
    segments:
      - text: "Allaһ sizni tek bir kişiden (Ademden) yarattı, soñ ondan da, zevcesini yarattı. Siz içün ayvanlardan sekiz eş meydanğa ketirdi. Sizni de, analarıñıznıñ qarınlarında uç qatlı qaranlıq içinde çeşit devirlerden keçirerek, yaratmaqta. İşte, bu, yaratıcı Rabbiñiz Allaһtır. Mulk Onıñdır. Ondan başqa tañrı yoqtır. Oyle eken, nasıl ola da, (Oña qullıqtan) çevirilmektesiñiz? (Yaratılğan «sekiz eş» - erkegi ve ırğaçısınen beraber, deve, sığır, qoyun ve eçkidir. «Uç qaranlıq» qarın - tol yatağı ve bala kisesidir. «Çeşit devirler»nen balanıñ ana rahimine tüşüvinden doğuvına qadar keçirgen devirler ve osüvi nazarda tutula)."
        cid: 0
  - verse: 7
    segments:
      - text: "Eger inkâr eter iseñiz, şubesiz, Allaһ, sizge muhtac degildir. Bunıñnen beraber, O, qullarınıñ kufürine razı olmaz. Eger şukür eter iseñiz, sizden bunı qabul eter. İç bir gunahkâr başqasınıñ gunahını çekmez. Niayet, epiñizniñ qaytıp baracağıñız Rabbiñizgedir. Yapqanlarıñıznı O sizge haber berir. Çünki, O, qalplerde olğan er şeyni haqqı ile bilicidir."
        cid: 0
  - verse: 8
    segments:
      - text: "İnsannıñ başına bir sıqıntı kelgende, Rabbine yonelerek, Oña yalvarır. Soñ Allaһ ozünden oña bir nimet bergeninen, evelden yalvarğanını unutır. Allaһnıñ yolundan saptırmaq içün Oña ortaqlar qoşar. (Ey, Muһammed!) de ki: Kufriñ ile biraz eglenip tur; çünki, sen muaqaq ceennem ehlindensiñ."
        cid: 0
  - verse: 9
    segments:
      - text: "Yoqsa, geceleyin secde eterek ve qıyamda turaraq, ibadet etken, ahiretten çekingen ve Rabbiniñ rahmetini tilegen kimse (o inkârcı kibi)dirmi? (Resulım!) de ki: İç bilgenlernen bilmegenler bir olurmı? Doğrusı, ancaq aqıl saipleri bularnı haqqı ile tüşünir."
        cid: 0
  - verse: 10
    segments:
      - text: "(Resulım!) Söyle: Ey, inanğan qullarım! Rabbiñizge qarşı kelüvden saqınıñ. Bu dünyada eyilik yapqanlarğa eyilik bar. Allaһ (yaratqan) yer yuzü keniştir. Yalıñız sabır etkenlerge mukâfatları esapsız odenecek. (Eyi davranğanlarğa haber berilgen yahşılıq - cennet, sağlıq ve afiyettir. «Allaһnıñ yeri keniştir» cumlesinden, kâfirler arasında Allaһqa ibadet ve itaatını yapalmağan kimselerniñ, inançını yaşaycaq yerlerine icret ete bilecekleri manası añlaşıla). (Aşağıdaki ayetlerde ibadet ve ihlâsnen birlikte, Allaһtan başqalarına ve Taağutqa tabınuvdan qaçınmaq lâzimligi izaatlana)."
        cid: 0
  - verse: 11
    segments:
      - text: "De ki: Maña, dinni Allaһqa halis qılaraq, Oña qullıq etüvim emir olundı."
        cid: 0
  - verse: 12
    segments:
      - text: "Maña musulmanlarnıñ ilkisi oluvım emir olundı."
        cid: 0
  - verse: 13
    segments:
      - text: "De ki: Rabbime qarşı kelir isem, doğrusı, buyuk kunniñ azabından qorqarım."
        cid: 0
  - verse: 14
    segments:
      - text: "De ki: Men dinimde ihlâs ile yalıñız Allaһqa ibadet eterim."
        cid: 0
  - verse: 15
    segments:
      - text: "Ey, Allaһqa ortaq qoşqanlar!): Siz de Ondan başqa tilegeniñizge tabınıñ! De ki: Aqiqaten ziyanğa oğrağanlar, qıyamet kunü em ozlerini, em de ailelerini ziyanğa soqqanlardır. Bilesiñiz ki, bu, ap-açıq ziyandır."
        cid: 0
  - verse: 16
    segments:
      - text: "Olarnıñ ustlerinde qat-qat ateş, altlarında da (oyle) ateş qat-qattır. İşte, Allaһ qullarını bunıñnen qorquzır. Ey, qullarım! Yalıñız menden qorquñ."
        cid: 0
  - verse: 17
    segments:
      - text: "Taağutqa qullıq etmekten qaçınıp, Allaһqa yonelgenlerge mujde bardır. (Ey, Muһammed!) Diñlep de, sözniñ eñ guzeline uyğan qullarımnı mujdele. İşte, Allaһ doğru yolğa qavuştırğan kimseler olardıң. Aqiqiy aqıl saipleri de olardıң. (Taağut aqqında Nisaa 4/60- ayetniñ izaatına baq. Vasıfları añlatılğan kimselerniñ diñledikleri söz, Allaһ kelâmı, Az. Peyğamberniñ sözleri ya da ashab-ı kiramnıñ fikrleri olaraq yorumlanğan. Sözniñ eñ guzeli, şubesiz Qur’andır)."
        cid: 0
  - verse: 18
    segments:
      - text: "[17 ayetine baq.]"
        cid: 0
  - verse: 19
    segments:
      - text: "(Resulım!) Aqqında azap ukümi kerçekleşken kimseni ve ateşte olğanlarnı sen qurtaracaqsıñmı!"
        cid: 0
  - verse: 20
    segments:
      - text: "Faqat Rabblerinden saqınğanlarğa ust-ustüne yapılğan, altlarından irmaqlar aqqan koşkler bardır. Bu Allaһnıñ bergen sözüdir. Allaһ, bergen sözünden qaytmaz."
        cid: 0
  - verse: 21
    segments:
      - text: "Kormediñmi? Allaһ kokten bir suv endirdi, onı yerdeki çoqraqlarğa yerleştirdi, soñ onıñnen türlü-türlü renklerde ekinler yetiştire. Soñ olar qurır da, sapsarı olğanlarını korersiñ. Soñ onı quru bir qırıntı yapar. Şubesiz, bularda aqıl saipleri içün bir ogüt bar."
        cid: 0
  - verse: 22
    segments:
      - text: "Allaһ kimniñ goñlüni İslâmğa açqan ise o, Rabbiñden bir nur uzerinde degildirmi? Allaһnı añmaq hususında qalpleri qattılaşqanlarğa yazıqlar olsun! İşte, bular ap-açıq bir sapıqlıq içindedirler."
        cid: 0
  - verse: 23
    segments:
      - text: "Allaһ sözniñ eñ guzelini, bir-birinen uyğun ve bıkılmadan tekrar-tekrar oqulğan bir kitap olaraq endirdi. Rabblerinden qorqqanlarnıñ, bu Kitapnıñ tesirinden tükleri tiklenir, der eken, em bedenleri, em de goñyulleri Allaһһnıñ zikrine ısınıp yımşar. İşte, bu Kitap, Allaһnıñ, tilegenini onıñnen doğru yolğa qavuştırğan hidayet reberidir. Allaһ kimni de saptırsa, artıq oña yol kosterici olmaz. (Ayette zikr etilgen «Kitaben, muteşaabihen» ifadelerinden, ayetlerniñ birbirini pekiştirgeni manası çıqarılğan. Qur’an, 23 yılda çeşit vaqıt ve şartlarda engenine rağmen, ayetlerniñ iç biri digerinen çatışmaz. Aksine, birbirini tasdiq ve tefsir eter. «Oqulıp toyulmağan» şeklinde tercime etilgen «mesaaniye» kelimesi «çeşit uslüplerde tekrarlanğan» şeklinde añlaşılğandır)."
        cid: 0
  - verse: 24
    segments:
      - text: "Qıyamet kunünde yuzüni azapnıñ şiddetinden qorçalamağa çalışqan kimse (ozüni ondan emin etken kibi)dirmi? Zalımlarğa: «Qazanğanıñıznı tatıñ!», denilir."
        cid: 0
  - verse: 25
    segments:
      - text: "Olardan evelkiler (peyğamberlerni) yalanladılar da, farqına barmağan bir yerlerinden, olarğa azap çattı."
        cid: 0
  - verse: 26
    segments:
      - text: "Bu suretnen Allaһ dünya ayatında olarğa rezillikni tattırdı. Ahiret azabı daa buyuk. Keşke bunı bilseler edi!"
        cid: 0
  - verse: 27
    segments:
      - text: "Ant olsun ki, biz, ogüt alsınlar diye, bu Qur’anda insanlarğa er türlü misalni berdik."
        cid: 0
  - verse: 28
    segments:
      - text: "Qorçalansınlar diye, eksiksiz (sade ve dos-doğru) arapça bir Qur’an endirdik."
        cid: 0
  - verse: 29
    segments:
      - text: "Allaһ, çekişip turğan bir çoq ortaqlarnıñ saip olğan bir adam (hızmetkâr)nen, yalıñız bir kişige bağlı olğan bir adamnı misal olaraq berir. Bu ekisi birmi? Hamd Allaһqa mahsustır. Faqat olarnıñ çoqu bilmezler."
        cid: 0
  - verse: 30
    segments:
      - text: "Muaqqaq, sen de oleceksiñ, olar da olecekler. (Ayet, kâfirlerniñ Resulullahnıñ olümini istegenleri ve bunı beklevleri uzerine nazil olğan)."
        cid: 0
  - verse: 31
    segments:
      - text: "Soñ, şubesiz, siz de qıyamet kunü Rabbiñizniñ uzurında davalaşacaqsıñız."
        cid: 0
  - verse: 32
    segments:
