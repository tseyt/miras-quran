        cid: 0
  - verse: 52
    segments:
      - text: "Bilmeylermi ki, Allaһ rızqnı tilegenine bol-bol berir, tilegeninden de qısar. Şubesiz, bunda inanğan bir qavm içün ibretler bar."
        cid: 0
  - verse: 53
    segments:
      - text: "De ki: Ey, oz nefisleri aleyhine adden aşqan qullarım! Allaһnıñ rahmetinden umüt kesmeñ! Çünki, Allaһ butün gunahlarnı bağışlar. Şubesiz ki, o çoq bağışlayıcı, çoq merhametlidir. (Bu ayet-i kerimede Allaһnıñ rahmeti ve sevgisiniñ soñsızlığı ifade etilmekte. Onıñ rahmeti er şeyni quşatqandır, er insan bu ilâhiy rahmetten faydalana bilir. Ancaq, şuña diqqat etmek kerek ki, «Allaһnıñ rahmetinden umüt kesmeñ», demek, gunah işlemege devam etiñ, demek degil. Bunıñ manası, eñ gunahkâr insanlarnıñ bile tövbeleri qabul etilecegini bildirmek, tolayısınen bir an evel fenalıqtan vazgeçip, Allaһqa dönüvlerini teşviq etmektir)."
        cid: 0
  - verse: 54
    segments:
