surah_id: 39
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >
          Bu Kitap izzet ve ikmet saibi Allah qatından endirilgendir.
        cid: 0
  - verse: 2
    segments:
      - text: >
          (Resulım!) Şübesiz ki, Kitapnı saña haq olaraq endirdik. O alda, sen de dinni
          Allahqa has qılaraq (ihlâsnen) qullıq et.
        cid: 0
  - verse: 3
    segments:
      - text: >
          Diqqat et, halis din yalıñız Allahnıñdır. Onı bıraqıp, özlerine bir taqım
          dostlar edingenler: Olarğa bizni, sadece Allahqa yaqlaştırsınlar, diye qullıq
          etmektemiz, derler. Doğrusı, Allah davalaşqan şeylerinde aralarında üküm
          berecek. Şübesiz, Allah, yalancı ve inkârcı kimseni doğru yolğa qavuştırmaz.
          (Araplar, putları vastasınen, Allahqa yaqınlaşacaqlarına inana ediler. İslâm
          dini Allahtan başqa iç bir şeyge qullıq etilmeycegini, olarnıñ bu areketleri
          Allahqa ortaq qoşuv olğanını bildirdi ve bunı kesen-kes yasaqladı).
        cid: 0
  - verse: 4
    segments:
      - text: >
          Eger Allah bir evlât edinmek istese edi, elbette yaratqanlarından istegenini
          seçer edi. O, yücedir. O, tek ve qahhar olğan Allahtır.
        cid: 0
  - verse: 5
    segments:
      - text: >
          Allah, köklerni ve yerni haq ile yarattı. Geceni kündüzniñ üstüne örtmekte,
          kündüzni de geceniñ üstüne sarmaqta. Küneşni ve aynı emiri altına alğan. Er biri
          belli bir devirge qadar aqıp keter. Diqqat et! O, azizdir ve çoq bağışlayıcıdır.
          (Gece ve kündüzniñ bir-birine örtülip sarıluvınen, vaqıtlarınıñ
          uzalıp-qısqarğanına, yerniñ yuvarlaqlığına, em özüniñ, em de küneş etrafında
          aylanğanına işaret etilgen. Zikr etilgen ayetler, tevhid inançını ve bu inançnı
          quvetlendirgen delillerni izaatlamaqta).
        cid: 0
  - verse: 6
    segments:
      - text: >
          Allah sizni tek bir kişiden (Ademden) yarattı, soñ ondan da, zevcesini yarattı.
          Siz içün ayvanlardan sekiz eş meydanğa ketirdi. Sizni de, analarıñıznıñ
          qarınlarında üç qatlı qaranlıq içinde çeşit devirlerden keçirerek, yaratmaqta.
          İşte, bu, yaratıcı Rabbiñiz Allahtır. Mülk Onıñdır. Ondan başqa tañrı yoqtır.
          Öyle eken, nasıl ola da, (Oña qullıqtan) çevirilmektesiñiz? (Yaratılğan «sekiz
          eş» - erkegi ve ırğaçısınen beraber, deve, sığır, qoyun ve eçkidir. «Üç
          qaranlıq» qarın - töl yatağı ve bala kisesidir. «Çeşit devirler»nen balanıñ ana
          rahimine tüşüvinden doğuvına qadar keçirgen devirler ve ösüvi nazarda tutula).
        cid: 0
  - verse: 7
    segments:
      - text: >
          Eger inkâr eter iseñiz, şübesiz, Allah, sizge muhtac degildir. Bunıñnen beraber,
          O, qullarınıñ küfürine razı olmaz. Eger şükür eter iseñiz, sizden bunı qabul
          eter. İç bir günahkâr başqasınıñ günahını çekmez. Niayet, epiñizniñ qaytıp
          baracağıñız Rabbiñizgedir. Yapqanlarıñıznı O sizge haber berir. Çünki, O,
          qalplerde olğan er şeyni haqqı ile bilicidir.
        cid: 0
  - verse: 8
    segments:
      - text: >
          İnsannıñ başına bir sıqıntı kelgende, Rabbine yönelerek, Oña yalvarır. Soñ Allah
          özünden oña bir nimet bergeninen, evelden yalvarğanını unutır. Allahnıñ yolundan
          saptırmaq içün Oña ortaqlar qoşar. (Ey, Muhammed!) de ki: Küfriñ ile biraz
          eglenip tur; çünki, sen muaqaq ceennem ehlindensiñ.
        cid: 0
  - verse: 9
    segments:
      - text: >
          Yoqsa, geceleyin secde eterek ve qıyamda turaraq, ibadet etken, ahiretten
          çekingen ve Rabbiniñ rahmetini tilegen kimse (o inkârcı kibi)dirmi? (Resulım!)
          de ki: İç bilgenlernen bilmegenler bir olurmı? Doğrusı, ancaq aqıl saipleri
          bularnı haqqı ile tüşünir.
        cid: 0
  - verse: 10
    segments:
      - text: >
          (Resulım!) Söyle: Ey, inanğan qullarım! Rabbiñizge qarşı kelüvden saqınıñ. Bu
          dünyada eyilik yapqanlarğa eyilik bar. Allah (yaratqan) yer yüzü keniştir.
          Yalıñız sabır etkenlerge mükâfatları esapsız ödenecek. (Eyi davranğanlarğa haber
          berilgen yahşılıq - cennet, sağlıq ve afiyettir. «Allahnıñ yeri keniştir»
          cumlesinden, kâfirler arasında Allahqa ibadet ve itaatını yapalmağan
          kimselerniñ, inançını yaşaycaq yerlerine icret ete bilecekleri manası añlaşıla).
          (Aşağıdaki ayetlerde ibadet ve ihlâsnen birlikte, Allahtan başqalarına ve
          Taağutqa tabınuvdan qaçınmaq lâzimligi izaatlana).
        cid: 0
  - verse: 11
    segments:
      - text: >
          De ki: Maña, dinni Allahqa halis qılaraq, Oña qullıq etüvim emir olundı.
        cid: 0
  - verse: 12
    segments:
      - text: >
          Maña musulmanlarnıñ ilkisi oluvım emir olundı.
        cid: 0
  - verse: 13
    segments:
      - text: >
          De ki: Rabbime qarşı kelir isem, doğrusı, büyük künniñ azabından qorqarım.
        cid: 0
  - verse: 14
    segments:
      - text: >
          De ki: Men dinimde ihlâs ile yalıñız Allahqa ibadet eterim.
        cid: 0
  - verse: 15
    segments:
      - text: >
          (Ey, Allahqa ortaq qoşqanlar!): Siz de Ondan başqa tilegeniñizge tabınıñ! De ki:
          Aqiqaten ziyanğa oğrağanlar, qıyamet künü em özlerini, em de ailelerini ziyanğa
          soqqanlardır. Bilesiñiz ki, bu, ap-açıq ziyandır.
        cid: 0
  - verse: 16
    segments:
      - text: >
          Olarnıñ üstlerinde qat-qat ateş, altlarında da (öyle) ateş qat-qattır. İşte,
          Allah qullarını bunıñnen qorquzır. Ey, qullarım! Yalıñız menden qorquñ.
        cid: 0
  - verse: 17
    segments:
      - text: >
          Taağutqa qullıq etmekten qaçınıp, Allahqa yönelgenlerge müjde bardır. (Ey,
          Muhammed!) Diñlep de, sözniñ eñ güzeline uyğan qullarımnı müjdele. İşte, Allah
          doğru yolğa qavuştırğan kimseler olardır. Aqiqiy aqıl saipleri de olardır.
          (Taağut aqqında Nisaa 4/60- ayetniñ izaatına baq. Vasıfları añlatılğan
          kimselerniñ diñledikleri söz, Allah kelâmı, Az. Peyğamberniñ sözleri ya da
          ashab-ı kiramnıñ fikrleri olaraq yorumlanğan. Sözniñ eñ güzeli, şübesiz
          Qur'andır).
        cid: 0
  - verse: 18
    segments:
      - text: >
          [17 ayetine baq.]
        cid: 0
  - verse: 19
    segments:
      - text: >
          (Resulım!) Aqqında azap ükümi kerçekleşken kimseni ve ateşte olğanlarnı sen
          qurtaracaqsıñmı!
        cid: 0
  - verse: 20
    segments:
      - text: >
          Faqat Rabblerinden saqınğanlarğa üst-üstüne yapılğan, altlarından irmaqlar aqqan
          köşkler bardır. Bu Allahnıñ bergen sözüdir. Allah, bergen sözünden qaytmaz.
        cid: 0
  - verse: 21
    segments:
      - text: >
          Körmediñmi? Allah kökten bir suv endirdi, onı yerdeki çoqraqlarğa yerleştirdi,
          soñ onıñnen türlü-türlü renklerde ekinler yetiştire. Soñ olar qurır da, sap-sarı
          olğanlarını körersiñ. Soñ onı quru bir qırıntı yapar. Şübesiz, bularda aqıl
          saipleri içün bir ögüt bar.
        cid: 0
  - verse: 22
    segments:
      - text: >
          Allah kimniñ göñlüni İslâmğa açqan ise o, Rabbiñden bir nur üzerinde degildirmi?
          Allahnı añmaq hususında qalpleri qattılaşqanlarğa yazıqlar olsun! İşte, bular
          ap-açıq bir sapıqlıq içindedirler.
        cid: 0
  - verse: 23
    segments:
      - text: >
          Allah sözniñ eñ güzelini, bir-birinen uyğun ve bıqılmadan tekrar-tekrar oqulğan
          bir kitap olaraq endirdi. Rabblerinden qorqqanlarnıñ, bu Kitapnıñ tesirinden
          tükleri tiklenir, der eken, em bedenleri, em de goñülleri Allahnıñ zikrine
          ısınıp yımşar. İşte, bu Kitap, Allahnıñ, tilegenini onıñnen doğru yolğa
          qavuştırğan hidayet reberidir. Allah kimni de saptırsa, artıq oña yol kösterici
          olmaz. (Ayette zikr etilgen «Kitaben, müteşaabihen» ifadelerinden, ayetlerniñ
          bir-birini pekiştirgeni manası çıqarılğan. Qur'an, 23 yılda çeşit vaqıt ve
          şartlarda engenine rağmen, ayetlerniñ iç biri digerinen çatışmaz. Aksine,
          bir-birini tasdiq ve tefsir eter. «Oqulıp toyulmağan» şeklinde tercime etilgen
          «mesaaniye» kelimesi «çeşit üslüplerde tekrarlanğan» şeklinde añlaşılğandır).
        cid: 0
  - verse: 24
    segments:
      - text: >
          Qıyamet kününde yüzüni azapnıñ şiddetinden qorçalamağa çalışqan kimse (özüni
          ondan emin etken kibi)dirmi? Zalımlarğa: «Qazanğanıñıznı tatıñ!», denilir.
        cid: 0
  - verse: 25
    segments:
      - text: >
          Olardan evelkiler (peyğamberlerni) yalanladılar da, farqına barmağan bir
          yerlerinden, olarğa azap çattı.
        cid: 0
  - verse: 26
    segments:
      - text: >
          Bu suretnen Allah dünya ayatında olarğa rezillikni tattırdı. Ahiret azabı daa
          büyük. Keşke bunı bilseler edi!
        cid: 0
  - verse: 27
    segments:
      - text: >
          Ant olsun ki, biz, ögüt alsınlar diye, bu Qur'anda insanlarğa er türlü misalni
          berdik.
        cid: 0
  - verse: 28
    segments:
      - text: >
          Qorçalansınlar diye, eksiksiz (sade ve dos-doğru) arapça bir Qur'an endirdik.
        cid: 0
  - verse: 29
    segments:
      - text: >
          Allah, çekişip turğan bir çoq ortaqlarnıñ saip olğan bir adam (hızmetkâr)nen,
          yalıñız bir kişige bağlı olğan bir adamnı misal olaraq berir. Bu ekisi birmi?
          Hamd Allahqa mahsustır. Faqat olarnıñ çoqu bilmezler.
        cid: 0
  - verse: 30
    segments:
      - text: >
          Muaqqaq, sen de öleceksiñ, olar da ölecekler. (Ayet, kâfirlerniñ Resulullahnıñ
          ölümini istegenleri ve bunı beklevleri üzerine nazil olğan).
        cid: 0
  - verse: 31
    segments:
      - text: >
          Soñ, şübesiz, siz de qıyamet künü Rabbiñizniñ uzurında davalaşacaqsıñız.
        cid: 0
  - verse: 32
    segments:
      - text: >
          Allahqa nisbeten yalan uydırğan, özüne kelgen aqiqatnı (Qur'annı) yalan
          sayğandan daa zalım kimdir? Kâfirlerniñ yeri ceennemde degilmi?
        cid: 0
  - verse: 33
    segments:
      - text: >
          Doğrunı ketirgen ve onı tasdiq etkenler bar ya, işte fenalıqtan saqınğanlar
          olardır. («Doğru» kelimesiniñ manası - tevhid inançı ve Qur'andır. Doğrunı
          ketirgen Az. Muhammed ve diger peyğamberlerdir. Onı tasdiq etkenler de,
          peyğamberlerniñ ümmetleridir).
        cid: 0
  - verse: 34
    segments:
      - text: >
          Olar içün Rabbleri yanında istegen er şeyleri bardır. İşte, bu, eyilik
          etkenlerniñ mükâfatıdır.
        cid: 0
  - verse: 35
    segments:
      - text: >
          Böylece, Allah olarnıñ keçmişte yapqan eñ fena areketlerini bile örtecek ve
          yapqanlarınıñ eñ güzeline musaviy olaraq, mükâfatlarını berecek.
        cid: 0
  - verse: 36
    segments:
      - text: >
          Allah quluna kâfi degilmi? Seni Ondan başqalarnen qorquzmaqtalar. Allah kimni
          saptırır ise, artıq onıñ yolunı doğrultacaq biri yoqtır. (Müşrikler, Az.
          Peyğamberge «Tañrılarımıznı yamanlama, soñra olar seni çarpar!» degen ediler.
          Az. Peyğamber, Haalid b. Veliidni Uzzaa adlı putnı parlamaq içün yollağanda,
          putnıñ bekçileri Haalidge: «Baq, o öpkelidir, saqın başıña bir şey kelmesin!»
          degen ediler. Haalid kelip, putnıñ burnını parlağan, qorquzuvlarnıñ da bir
          netice bermegeni böylece ortağa çıqqan).
        cid: 0
  - verse: 37
    segments:
      - text: >
          Allah kimge de hidayet etse, artıq onı saptıracaq yoqtır. Allah mutlaq küç saibi
          ve intiqam alıcı degilmi?
        cid: 0
  - verse: 38
    segments:
      - text: >
          Ant olsun ki, olarğa: Köklerni ve yerni kim yarattı? diye sorasañ, elbette:
          «Allah», derler. De ki: Öyle ise, maña söylersiñizmi? Allah maña bir zarar
          bermek istese, Allahnı bıraqıp da, tabınğlarıñız, Onıñ bergen zararını ketkize
          bilirmi? Yahut Allah, maña bir rahmet tiler ise, olar Onıñ bu rahmetiniñ ögüni
          kese bilirlermi? De ki: Maña Allah yeter. Tevekkül yapqanlar, ancaq Oña ışanıp
          tayanırlar.
        cid: 0
  - verse: 39
    segments:
      - text: >
          De ki: Ey, qavmım! Eliñizden kelgenini yapıñ; doğrusı, men de yapacağım! Özüni
          rezil etecek azap kimge kelecek, kimge devamlı azap enecek, yaqında
          bileceksiñiz! (Müşriklerni rezil etecek azap, Bedir mağlubiyetinen kelgen eken,
          Ceennem azabı da devamlı olaraq üzerlerine çökecek).
        cid: 0
  - verse: 40
    segments:
      - text: >
          [39 ayetine baq.]
        cid: 0
  - verse: 41
    segments:
      - text: >
          (Resulım!) Şübesiz, biz bu Kitapni saña insanlar içün haq olaraq endirdik. Artıq
          kim doğru yolnı seçer ise, öz lehinedir; kim de sapsa, ancaq öz aleyhine sapqan
          olur. Sen olarnıñ üzerinde vekil degilsiñ. (Ayetke köre, Az. Peyğamber dalâletke
          sapqanlarnı zorlap hidayetke yeteklegen ya da olarğa bekçilik yapqan kimse
          degildir).
        cid: 0
  - verse: 42
    segments:
      - text: >
          Allah ölgenniñ ölüm vaqıtı kelgeninen, ölmegenniñ de, yuquda ekende, canlarını
          alır da, ölümine üküm ettigi cannı alır, o birini belli bir vaqıtqa qadar
          bıraqır. Şübe yoq ki, bunda yahşı tüşünecek bir qavm içün ibretler bar.
        cid: 0
  - verse: 43
    segments:
      - text: >
          Yoqsa, olar Allahtan başqasını şefaatçılar ettilermi? De ki: Olar iç bir şeyge
          küç yetiştiralmazlar ve aqıl iriştiralmaz iseler de, (şefaatçı eteceksiñiz)mi?
        cid: 0
  - verse: 44
    segments:
      - text: >
          De ki: Bütün şefaat Allahnıñdır. Köklerniñ ve yerniñ ükümranlığı Onıñdır.
          Soñunda Oña döndürileceksiñiz.
        cid: 0
  - verse: 45
    segments:
      - text: >
          Allah, tek olaraq añılğan vaqıtta, ahiretke inanmağanlarnıñ içlerini sıqıntı
          basar. Amma, Allahtan başqası añılğan vaqıtta aman yüzleri küler.
        cid: 0
  - verse: 46
    segments:
      - text: >
          De ki: Ey, köklerni ve yerni yaratqan, gizlini de, aşkârnı da bilgen Allah!
          Qullarıñnıñ arasında, davalaşqan şeyleriniñ ükümini ancaq sen bereceksiñ.
        cid: 0
  - verse: 47
    segments:
      - text: >
          Eger yerde ne bar ise, episi ve onıñnen birlikte, bir qatı daa o zulum
          etkenlerniñki olsa edi, qıyamet kününde azapnıñ fenalığından (qurtulmaq içün)
          elbette bularnı feda eter ediler. Albuki, (o künü) olar içün, Allah tarafından,
          iç esapqa qoşmağan şeyleri ortağa çıqqandır. (Zulum etkenlerniñ qarşılarına
          çıqacaq şeyler - ilâhiy ğadap ve azaptır. Çünki, bular iç itimal etmey ve
          hatırlarına ketirmey ediler).
        cid: 0
  - verse: 48
    segments:
      - text: >
          Olarnıñ qazanğan fenalıqları (o künü) aşkâr olğan, alayğa alğan şeyleri özlerini
          sarğandır.
        cid: 0
  - verse: 49
    segments:
      - text: >
          İnsanğa bir zarar toqunğan vaqıtta bizge yalvarır. Soñ, oña tarafımızdan bir
          nimet bergen vaqtımızda: «Bu maña ancaq bilgimden tolayı berilgendir», der. Yoq,
          o, bir imtiandır, faqat çoqları bilmezler.
        cid: 0
  - verse: 50
    segments:
      - text: >
          Bunı olardan evelkiler de söylegen edi; amma qazanğan şeyleri olarğa fayda
          bermedi.
        cid: 0
  - verse: 51
    segments:
      - text: >
          Bunıñ içün yapqan fenalıqlarınıñ vebalı olarnı yaqaladı. Bulardan da zulum
          etkenlerniñ yapqan fenalıqları başlarına kelecek. Bu hususta Allahnı aciz
          bıraqalmazlar.
        cid: 0
  - verse: 52
    segments:
      - text: >
          Bilmeylermi ki, Allah rızqnı tilegenine bol-bol berir, tilegeninden de qısar.
          Şübesiz, bunda inanğan bir qavm içün ibretler bar.
        cid: 0
  - verse: 53
    segments:
      - text: >
          De ki: Ey, öz nefisleri aleyhine adden aşqan qullarım! Allahnıñ rahmetinden ümüt
          kesmeñ! Çünki, Allah bütün günahlarnı bağışlar. Şübesiz ki, o çoq bağışlayıcı,
          çoq merhametlidir. (Bu ayet-i kerimede Allahnıñ rahmeti ve sevgisiniñ soñsızlığı
          ifade etilmekte. Onıñ rahmeti er şeyni quşatqandır, er insan bu ilâhiy rahmetten
          faydalana bilir. Ancaq, şuña diqqat etmek kerek ki, «Allahnıñ rahmetinden ümüt
          kesmeñ», demek, günah işlemege devam etiñ, demek degil. Bunıñ manası, eñ
          günahkâr insanlarnıñ bile tövbeleri qabul etilecegini bildirmek, tolayısınen bir
          an evel fenalıqtan vazgeçip, Allahqa dönüvlerini teşviq etmektir).
        cid: 0
  - verse: 54
    segments:
      - text: >
          Sizge azap kelip çatmadan evel, Rabbiñizge dönüñ, Oña teslim oluñ, soñunda sizge
          yardım etilmez.
        cid: 0
  - verse: 55
    segments:
      - text: >
          Siz farqına barmadan, apansızdan başıñızğa azap kelmeden evel, Rabbiñizden sizge
          endirilgenniñ eñ güzeline (Qur'anğa) tabiy oluñ.
        cid: 0
  - verse: 56
    segments:
      - text: >
          Kişiniñ: Allahqa qarşı adden aşuvımdan tolayı, maña yazıqlar olsun! Aqiqaten,
          men alay etkenlerden edim (deycek kününden saqınıñ)!
        cid: 0
  - verse: 57
    segments:
      - text: >
          YA da: Allah maña hidayet berse edi, elbette saqınğanlardan olur edim, deycegi,
          yahut azapnı körgende: Keşke, men içün bir kere (dönmege) imkân tapılsa da,
          eyilerden olsam! deycegi künden saqınıñ.
        cid: 0
  - verse: 58
    segments:
      - text: >
          [57 ayetine baq.]
        cid: 0
  - verse: 59
    segments:
      - text: >
          Yoq (dönalmaycaqsıñ)! Ayetlerim saña kelgen edi de, sen olarnı yalanlağan,
          büyüklik taslağan ve inkârcılardan olğan ediñ.
        cid: 0
  - verse: 60
    segments:
      - text: >
          Qıyamet kününde Allah aqqında yalan söylegenlerniñ yüzleri qap-qara olğanını
          körersiñ. Kibrlengenlerniñ qalacaq yeri ceennemde degilmi? (Müşrikler Allah
          aqqında uydırğan yalanlarınıñ başında Oña ortaq qoşuvları, evlât nisbet etüvleri
          ve sıfatlarını inkâr etüvleridir).
        cid: 0
  - verse: 61
    segments:
      - text: >
          Allah, taqva saiplerini qurtulışqa iriştirir. Olarğa iç bir fenalıq toqunmaz.
          Olar kederlenmezler de.
        cid: 0
  - verse: 62
    segments:
      - text: >
          Allah er şeyniñ yaratıcısıdır. O, er şeyge vekildir.
        cid: 0
  - verse: 63
    segments:
      - text: >
          Köklerniñ ve yerniñ anahtarları (mutlaq ükümranlığı) Onıñdır. Allahnıñ
          ayetlerini inkâr etkenler bar ya, işte olar ziyanğa oğrağanlardır.
        cid: 0
  - verse: 64
    segments:
      - text: >
          De ki: Ey, cailler! Maña Allahtan başqasına qullıq etüvimni emir etmektesiñizmi?
        cid: 0
  - verse: 65
    segments:
      - text: >
          (Resulım!) Şübesiz, saña da, senden evelkilerine de, böyle vahiy olunğandır ki:
          Ant olsun, Allahqa ortaq qoşar iseñ, işleriñ mıtalqa boşuna keter ve ziyanda
          qalğanlardan olursıñ!
        cid: 0
  - verse: 66
    segments:
      - text: >
          Yoq! Yalıñız Allahqa qullıq et ve şükür etkenlerden ol.
        cid: 0
  - verse: 67
    segments:
      - text: >
          Olar Allahnı haqqı ile tanıp bilalmadılar. Qıyamet künü bütün yer yüzü Onıñ
          tasarrufındadır. Kökler Onıñ qudret elinen türülgen olacaq. O, müşriklerniñ
          ortaq qoşuvlarından yüce ve uzaqtır.
        cid: 0
  - verse: 68
    segments:
      - text: >
          Suurğa üflengeninen, Allahnıñ tilegenleri istisna olmaq üzre, köklerde ve yerde
          ne bar ise, episi ölecek. Soñ oña bir daa üflengeninen, bir de ne körersiñ, olar
          ayaqqa qalqqan, baqmaqtalar! (Birinci Suurda Allahnıñ isteginen ölmeyip
          qalğanlarnıñ, Cebrail, Mikail, İsrafil, Azrail ya da hamele-i arş ya da ridvan
          melekleri, uriyler, cennetniñ hazinedarı Maliknen ceennem bekçileri zebaniyler
          olğanı bildirilmekte. Bu ayetke köre, nefha yani suurğa üfürmek eki keredir.
          Birincisi - ölüm suurı, ekincisi de - ba's yani tirilüv suurıdır).
        cid: 0
  - verse: 69
    segments:
      - text: >
          Yer yüzü, Rabbiñniñ nurınen aydınlanır, kitap qoyulır, peyğamberler ve şaatlar
          ketirilir ve aralarında aqqaniyetnen üküm berilir. Olarğa asla zulum etilmez.
          («Yer yüzü» mahşer olaraq yorumlanır eken, «kitap» da, amel defterleri ya da
          levh-i mahfuznen tefsir etilgendir. Ketirilgen şaatlarnıñ da peyğamberlerniñ
          ümmetinen, melekler ve salih insanlar olğanı izaatlanğandır).
        cid: 0
  - verse: 70
    segments:
      - text: >
          Er kes ne yapqan olsa, qarşılığı tamamınen berilir. Allah olarnıñ yapqanlarını
          eñ yahşı bilicidir.
        cid: 0
  - verse: 71
    segments:
      - text: >
          O küfür etkenler, bölük alında ceennemge sürülir. Niayet, o yerge kelgen
          vaqıtlarında, qapuları açılır, bekçileri olarğa: Sizge, arañızdan Rabbiñizniñ
          ayetlerini oquğan ve bugünge qavuşacağıñıznı ihtar etken peyğamberler kelmedimi?
          derler. «Ebet, keldi», derler, amma, azap sözü kâfirlerniñ üzerine haq olğandır.
          (Ayetten, şeriat kelmeden evel, teklifniñ olmağanı añlaşılmaqta, çünki melekler,
          ceennem ehliniñ tenqit etilüvini, peyğamberlerniñ kelüvi ve kitaplarnıñ tebliğ
          etilüvine rağmen, inanmayuvları sebebine esaslandırğanlar).
        cid: 0
  - verse: 72
    segments:
      - text: >
          Olarğa: İçinde ebediy qalacağıñız ceennemniñ qapularından kiriñ;
          kibrlengenlerniñ yeri ne fena! denilir.
        cid: 0
  - verse: 73
    segments:
      - text: >
          Rabblerine qarşı kelüvden saqınğanlar ise, top-top cennetke yeteklenilir, o
          yerge barıp da, qapuları açılğanda, bekçileri olarğa: Selâm, sizge! Ter-temiz
          keldiñiz. Artıq ebediy qalmaq üzre kiriñ bu yerge, derler.
        cid: 0
  - verse: 74
    segments:
      - text: >
          Olar: Bizge bergen sözde sadıq olğan ve bizni, tilegen yerimizde oturacaq bu
          cennet yurtuna varis yapqan Allahqa hamd olsun. Yahşı amelde olğanlarnıñ
          mükâfatı ne güzel eken! derler.
        cid: 0
  - verse: 75
    segments:
      - text: >
          Meleklerni körersiñ ki, Rabblerine hamd ile tesbih eterek, Arşnıñ etrafını
          sarğandırlar. Artıq aralarında adaletnen üküm olunğan ve «Alemlerniñ Rabbi olğan
          Allahqa hamd olsun», denilgendir.
        cid: 0
