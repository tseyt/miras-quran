        cid: 0
  - verse: 49
    segments:
      - text: "İnsanğa bir zarar toqunğan vaqıtta bizge yalvarır. Soñ, oña tarafımızdan bir nimet bergen vaqtımızda: «Bu maña ancaq bilgimden tolayı berilgendir», der. Yoq, o, bir imtiandır, faqat çoqları bilmezler."
        cid: 0
  - verse: 50
