        cid: 0
  - verse: 33
    segments:
      - text: "Doğrunı ketirgen ve onı tasdiq etkenler bar ya, işte fenalıqtan saqınğanlar olardır. («Doğru» kelimesiniñ manası - tevhid inançı ve Qur’andır. Doğrunı ketirgen Az. Muһammed ve diger peyğamberlerdir. Onı tasdiq etkenler de, peyğamberlerniñ ummetleridir)."
        cid: 0
  - verse: 34
    segments:
      - text: "Olar içün Rabbleri yanında istegen er şeyleri bardır. İşte, bu, eyilik etkenlerniñ mukâfatıdır."
        cid: 0
  - verse: 35
    segments:
      - text: "Boylece, Allaһ olarnıñ keçmişte yapqan eñ fena areketlerini bile ortecek ve yapqanlarınıñ eñ guzeline musaviy olaraq, mukâfatlarını berecek."
        cid: 0
  - verse: 36
    segments:
      - text: "Allaһ quluna kâfi degilmi? Seni Ondan başqalarnen qorquzmaqtalar. Allaһ kimni saptırır ise, artıq onıñ yolunı doğrultacaq biri yoqtır. (Muşrikler, Az. Peyğamberge «Tañrılarımıznı yamanlama, soñra olar seni çarpar!» degen ediler. Az. Peyğamber, Haalid b. Veliidni Uzzaa adlı putnı parlamaq içün yollağanda, putnıñ bekçileri Haalidge: «Baq, o opkelidir, saqın başıña bir şey kelmesin!» degen ediler. Haalid kelip, putnıñ burnınıi parlağan, qorquzuvlarnıñ da bir netice bermegeni boylece ortağa çıqqan)."
        cid: 0
  - verse: 37
    segments:
