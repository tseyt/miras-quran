        cid: 0
  - verse: 47
    segments:
      - text: "Eger yerde ne bar ise, episi ve onıñnen birlikte, bir qatı daa o zulum etkenlerniñki olsa edi, qıyamet kunünde azapnıñ fenalığından (qurtulmaq içün) elbette bularnı feda eter ediler. Albuki, (o kunü) olar içün, Allaһ tarafından, iç esapqa qoşmağan şeyleri ortağa çıqqandır. (Zulum etkenlerniñ qarşılarına çıqacaq şeyler - ilâhiy ğadap ve azaptır. Çünki, bular iç itimal etmey ve hatırlarına ketirmey ediler)."
