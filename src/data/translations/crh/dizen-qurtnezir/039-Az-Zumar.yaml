        cid: 0
  - verse: 38
    segments:
      - text: "Ant olsun ki, olarğa: Koklerni ve yerni kim yarattı? diye sorasañ, elbette: «Allaһ», derler. De ki: Oyle ise, maña söylersiñizmi? Allaһ maña bir zarar bermek istese, Allaһnı bıraqıp da, tabınğlarıñız, Onıñ bergen zararını ketkize bilirmi? Yahut Allaһ, maña bir rahmet tiler ise, olar Onıñ bu rahmetiniñ ogüni kese bilirlermi? De ki: Maña Allaһ yeter. Tevekkül yapqanlar, ancaq Oña ışanıp tayanırlar."
        cid: 0
  - verse: 39
    segments:
      - text: "De ki: Ey, qavmım! Eliñizden kelgenini yapıñ; doğrusı, men de yapacağım! Ozüni rezil etecek azap kimge kelecek, kimge devamlı azap enecek, yaqında bileceksiñiz! (Muşriklerni rezil etecek azap, Bedir mağlubiyetinen kelgen eken, Ceennem azabı da devamlı olaraq uzerlerine çökecek)."
