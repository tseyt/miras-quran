      - text: >-
          biz onı (Qur'annı) mubarek bir gecede endirdik. Şübesiz, biz tenbiyecimiz. (Bu
          ayette keçken «mubarek gece» - Qadir gecesi ya da Berat gecesi olğanına dair
          rivayetler bar. Ancaq Qur'an-ı Kerimniñ Az. Peyğamberge Qadir gecesinde
          endirilgenini bildirgen ayetni köz ögüne alğan İslâm alimleriniñ çoqu bu yerde Qadir
          gecesine işaret etilgeni rivayetini daa quvetli sayğanlar. Ayrıca, baq. Baqara
          2/182-niñ añlatuvı ve Kadir, 97/1).
