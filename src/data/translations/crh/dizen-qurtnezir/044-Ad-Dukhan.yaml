surah_id: 44
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >
          Haa. Miim.
        cid: 0
  - verse: 2
    segments:
      - text: >
          Ap-açıq Kitapqa ant olsun ki, biz onı (Qur'annı) mubarek bir gecede endirdik.
          Şübesiz, biz tenbiyecimiz. (Bu ayette keçken «mubarek gece» - Qadir gecesi ya da
          Berat gecesi olğanına dair rivayetler bar. Ancaq Qur'an-ı Kerimniñ Az.
          Peyğamberge Qadir gecesinde endirilgenini bildirgen ayetni köz ögüne alğan İslâm
          alimleriniñ çoqu bu yerde Qadir gecesine işaret etilgeni rivayetini daa quvetli
          sayğanlar. Ayrıca, baq. Baqara 2/182-niñ añlatuvı ve Kadir, 97/1).
        cid: 0
  - verse: 3
    segments:
      - text: >
          [2 ayetine baq.]
        cid: 0
  - verse: 4
    segments:
      - text: >
          Qatımızdan bir emir ile er ikmetli işke o gecede üküm etilir. Çünki, biz,
          Rabbiniñ bir rahmeti olaraq peyğamberler yollamaqtamız. O, eşiticidir,
          bilicidir.
        cid: 0
  - verse: 5
    segments:
      - text: >
          [4 ayetine baq.]
        cid: 0
  - verse: 6
    segments:
      - text: >
          [4 ayetine baq.]
        cid: 0
  - verse: 7
    segments:
      - text: >
          Eger kesen-kes inana iseñiz (biliñ ki, Allah), köklerniñ, yerniñ ve ekisi
          arasında olğanlarnıñ Rabbidir.
        cid: 0
  - verse: 8
    segments:
      - text: >
          Ondan başqa ilâh yoqtır. (Er şeyni O) tiriltir ve öldürir. Siziñ de Rabbiñiz,
          evelki atalarıñıznıñ da Rabbidir.
        cid: 0
  - verse: 9
    segments:
      - text: >
          Faqat olar, şübe içinde eglenip turalar.
        cid: 0
  - verse: 10
    segments:
      - text: >
          Şimdi sen, kökniñ insanlarnı saracaq açıq bir duman çıqaracaq künni közle. Bu,
          elem berici bir azaptır.
        cid: 0
  - verse: 11
    segments:
      - text: >
          [10 ayetine baq.]
        cid: 0
  - verse: 12
    segments:
      - text: >
          (İşte, o vaqıtta insanlar:) Rabbimiz! Bizden azapnı çetlet. Doğrusı, biz artıq
          inanmaqtamız (derler). (Bu duman aqqında esaslı eki çeşit yorum yapalğan: 1.
          Duman - qıtlıq ve qurğaqlıqtır. Çünki, Arabistanda büyük bir qıtlıq olğan, onıñ
          ortadan qaldırıluvı içün Qureyş, Az. Peyğamberge baş urğan. 2. Bu duman -
          qıyamet alâmetlerinden olup, kökni qaplaycaq dumandır. Peyğamberimizden rivayet
          etilgenine köre, qıyamet alâmetlerinden biri de, şarq ve ğarp arasını qaplaycaq
          duman vaqiasıdır).
        cid: 0
  - verse: 13
    segments:
      - text: >
          Qayda olarda ögüt almaq? Albuki, özlerine kerçekni añlatkan bir elçi kelgen edi.
        cid: 0
  - verse: 14
    segments:
      - text: >
          Soñ ondan yüz çevirdiler ve: Bu, ögretilgen bir deli! dediler.
        cid: 0
  - verse: 15
    segments:
      - text: >
          Biz azapnı biraz ortadan qaldıracaqmız, amma, siz kene (eski alıñızğa)
          döneceksiñiz. (Az. Peyğamberniñ duasınen, qıtlıq ortadan qaldırılğanından soñ,
          inkârlarına qaytqan ediler. Başqa bir yorumğa köre de, qıyamet qopmadan evel,
          etrafnı qaplağan dumannı kâfirler körgeninen, Allahqa sığınıp dua etecekler,
          Allah qısqa bir müddet dumannı ortadan qaldıracaq, faqat olar buña rağmen,
          tekrar küfürge dönecekler).
        cid: 0
  - verse: 16
    segments:
      - text: >
          Faqat biz büyük bir şiddetnen yaqalaycaq künümiz, intiqamımıznı kesen-kes
          alırmız.
        cid: 0
  - verse: 17
    segments:
      - text: >
          Ant olsun, olardan evel biz, Fıravunnıñ qavmını da imtian etken edik. Olarğa:
          Allahnıñ qulları! Maña keliñ! Çünki, men sizge (yollanılğan) işançlı bir
          Resulım, diye (davette bulunğan) şerefli bir elçi kelgen edi.
        cid: 0
  - verse: 18
    segments:
      - text: >
          [17 ayetine baq.]
        cid: 0
  - verse: 19
    segments:
      - text: >
          Allahqa nisbeten büyüklik taslamañ. Çünki, men sizge ap-açıq bir delil
          ketirmektem. (Ap-açıq delil, Az. Musanıñ köstergen mucizeleridir).
        cid: 0
  - verse: 20
    segments:
      - text: >
          Men, meni taşboranğa tutuvıñızdan, menim ve siziñ Rabbiñiz olğan Allahqa
          sığındım. (Ayet, taşboran eterek, öldürecek tehdidlerini darqatqanlarğa qarşı
          Az. Musanıñ eskencege, aqaretke ve ölümge diqqat etmeyip, Allahqa sığınacağını
          beyan etkenine diqqat çekmekte).
        cid: 0
  - verse: 21
    segments:
      - text: >
          Eger maña inanmaz iseñiz, iç olmağanda, yanımdan uzaqlaşıñ.
        cid: 0
  - verse: 22
    segments:
      - text: >
          Bunıñ üzerine Musa: Bular qabaat işlegen bir toplumdır, diye Rabbine arz etti.
        cid: 0
  - verse: 23
    segments:
      - text: >
          Allah: O alda, qullarımnı geceleyin yolğa çıqar. Çünki, taqip etileceksiñiz,
          buyurdı. (Aqkiqaten, Fıravun ve ordusı şeerden çıqqanlarından haber alğanınen,
          Az. Musanı ve İsrail oğullarını taqip etken ediler).
        cid: 0
  - verse: 24
    segments:
      - text: >
          Deñizni açıq alda bıraq. Çünki, olar boğulacaq bir ordudır. (Başqa ayetlerde yer
          alğanına köre, Az. Musa rastkelgen deñizge tayağını uraraq, suvnıñ açıluvını
          teminlegen, qavmı raat bir şekilde qarşı tarafqa keçken, taqip etken Fıravun ve
          ordusı ise, aynı suv içinde boğularaq elâk olğan).
        cid: 0
  - verse: 25
    segments:
      - text: >
          Olar artta nice bağçalar, çoqraqlar, ekinler, güzel qonaqlar, zevq ve sefasını
          sürgen nice nimetlerini bıraqqan ediler.
        cid: 0
  - verse: 26
    segments:
      - text: >
          [25 ayetine baq.]
        cid: 0
  - verse: 27
    segments:
      - text: >
          [25 ayetine baq.]
        cid: 0
  - verse: 28
    segments:
      - text: >
          İşte, böylece, biz de olarnı başqa bir toplumğa miras qaldırdıq.
        cid: 0
  - verse: 29
    segments:
      - text: >
          Kök ve yer olarnıñ artından ağlamadı; olarğa muhlet de berilmedi.
        cid: 0
  - verse: 30
    segments:
      - text: >
          Ant olsun, biz İsrail oğullarını o alçaltıcı azaptan qurtardıq.
        cid: 0
  - verse: 31
    segments:
      - text: >
          Yani Fıravundan. Çünki, o bir zorbacı edi, adden aşqanlardan edi. (Başqa
          ayetlerde bildirilgeni kibi, Fıravun İsrail oğullarını özüne qul ve hızmetçi
          yapa, oğullarını öldüre edi. Bu, İsrail oğullarını aşşalayıcı bir vaziyet edi).
        cid: 0
  - verse: 32
    segments:
      - text: >
          Ant olsun, biz İsrail oğullarına, bilerek, (öz zamanlarında) alemlerniñ üstünde
          bir imtiyaz berdik.
        cid: 0
  - verse: 33
    segments:
      - text: >
          Olarğa, içinde açıq bir imtian bulunğan, işaretler berdik. (Bu işaretler -
          deñziniñ yarıluvı, bulutnıñ kölgesi, qudret elvası ve bödena kebabı kibi lütfler
          şeklinde sayıla bilir).
        cid: 0
  - verse: 34
    segments:
      - text: >
          Olar (müşrikler) deyler ki: İlk ölümimizden soñ bir şey yoqtır. Biz tiriltilecek
          degilmiz. Doğru söyley iseñiz, atalarımıznı ketiriñ.
        cid: 0
  - verse: 35
    segments:
      - text: >
          [34 ayetine baq.]
        cid: 0
  - verse: 36
    segments:
      - text: >
          [34 ayetine baq.]
        cid: 0
  - verse: 37
    segments:
      - text: >
          Bular daa hayırlımı, yoqsa, Tubba' qavmınen, olardan evelkilermi? Olarnı yoq
          ettik, çünki, olar qabaatlı ediler. (Tubba' - Yemen ükümdarlarına berilgen
          isimdir. Peyğamberimizden rivayet etilgenine köre, bu ükümdar yahşı bir insan
          edi, faqat qavmı yoldan çıqqan edi. Ayette, Tubba' ve başqa qavmlarğa köre,
          Qureyşniñ küç, quvet ve sayı itibarınen, daa zayıf olğanı hatırlatılğan).
        cid: 0
  - verse: 38
    segments:
      - text: >
          Biz köklerni, yerni ve bular arasında olğanlarnı, oyun ve eglence olsun, diye
          yaratmadıq.
        cid: 0
  - verse: 39
    segments:
      - text: >
          Olarnı sadece kerçek bir sebepnen yarattıq. Faqat olarnıñ çoqu bilmeyler.
        cid: 0
  - verse: 40
    segments:
      - text: >
          Şübesiz, (haqnı batıldan ayırğan) üküm künü, episiniñ bir yerde buluşacaq
          künüdir. (Qıyamet künü haq batıldan, aqlı aqsızdan ayırdı etilecek. YA da
          insanlar yaqınlarından ve dostlarından ayırılacaq. Bu vaziyet ayetteki «fasıl»
          kelimesi ile ifade etilgen.)
        cid: 0
  - verse: 41
    segments:
      - text: >
          O künü dostnıñ dostqa iç bir faydası olmaz, olarğa yardım da etilmez.
        cid: 0
  - verse: 42
    segments:
      - text: >
          Ancaq, Allahnıñ merhamet etken kimseleri böyle degildir. Şübesiz, O, üstündir,
          merhametlidir.
        cid: 0
  - verse: 43
    segments:
      - text: >
          Şübesiz, zaqqum teregi günahkârlarnıñ yemegidir.
        cid: 0
  - verse: 44
    segments:
      - text: >
          [43 ayetine baq.]
        cid: 0
  - verse: 45
    segments:
      - text: >
          O, qarınlarda maden iritmesi kibi, suvnıñ qaynaması kibi qaynar.
        cid: 0
  - verse: 46
    segments:
      - text: >
          [45 ayetine baq.]
        cid: 0
  - verse: 47
    segments:
      - text: >
          (Allah zebaniylerge emir eter): «Tutıñ onı! Ceennemniñ ortasına süyrekleñ! Soñ
          başına azap olaraq, qaynağan suv töküñ!» ve deñ ki: «Tat, baqayıq. Qana, sen
          özüñce üstün ediñ, şerefli ediñ! İşte, bu, şübelenip turğan şeyiñizdir».
        cid: 0
  - verse: 48
    segments:
      - text: >
          [47 ayetine baq.]
        cid: 0
  - verse: 49
    segments:
      - text: >
          [47 ayetine baq.]
        cid: 0
  - verse: 50
    segments:
      - text: >
          [47 ayetine baq.]
        cid: 0
  - verse: 51
    segments:
      - text: >
          Muttaqiyler ise, aqiqaten işançlı bir maqamdadırlar. Bağçalarda ve çoqraq
          başlarındadırlar. İnce yipekten ve parlaq atlastan kiyerek, qarşı-qarşığa
          oturırlar.
        cid: 0
  - verse: 52
    segments:
      - text: >
          [51 ayetine baq.]
        cid: 0
  - verse: 53
    segments:
      - text: >
          [51 ayetine baq.]
        cid: 0
  - verse: 54
    segments:
      - text: >
          İşte, böyle, bunıñnen beraber, biz olarnı iri közlü uriylernen evlendirirmiz.
        cid: 0
  - verse: 55
    segments:
      - text: >
          O yerde, işanç içinde (canları çekken, er meyvanı isterler).
        cid: 0
  - verse: 56
    segments:
      - text: >
          İlk tatqan ölümlerinden ğayrı, o yerde artıq ölüm tatamazlar. Ve Allah olarnı
          ceennem azabından qorçalağandır (devamlı ayatqa qavuşqandırlar).
        cid: 0
  - verse: 57
    segments:
      - text: >
          Bular Rabbiñden bir lütf olaraq (berilgendir). İşte, büyük qurtulış budır.
        cid: 0
  - verse: 58
    segments:
      - text: >
          Biz onı Qur'annı, ögüt alalar diye, seniñ tiliñde endirerek, qolay añlaşılmasını
          teminledik.
        cid: 0
  - verse: 59
    segments:
      - text: >
          (Kene de inanmağanlarnıñ başlarına keleceklerni) bekle; olar da beklemekteler.
        cid: 0
