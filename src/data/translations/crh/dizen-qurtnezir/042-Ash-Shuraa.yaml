surah_id: 42
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "Haa. Miim. Ayn. Siin. Qaaf."
        cid: 0
  - verse: 3
    segments:
      - text: "Aziz ve hakim olğan Allaһ saña ve senden evelkilerine, işte boyle vahiy eter. (Cenab-ı Haq Qur’an-ı Kerimde añlatqan hususlarnıñ ozüni daa evelki kitaplarda da bildirgen. Hususen, Haa, Miim ve Ayn, Siin, Qaaf kibi arifler işaret ve sır olaraq, butün peyğamberlerge vahiy etilgen)."
        cid: 0
  - verse: 4
    segments:
      - text: "Koklerde ve yerde ne bar ise, episi Onıñdır. O, yucedir, uludır."
        cid: 0
  - verse: 5
    segments:
      - text: "Aman-aman tepelerinden kokler çatlaycaq! Melekler de, Rabblerini hamd ile tesbih etmekteler ve yerdekiler içün mağfiret istemekteler. Yahşı biliñ ki, Allaһ çoq bağışlayıcı, çoq merhametlidir. («Koklerniñ ustlerinden çatlavı», Allaһnıñ azametinden ve şanınıñ yuceligindendir)."
        cid: 0
  - verse: 6
    segments:
      - text: "Allaһtan başqasını dost tutqanlarını Allaһ daima nezaret etmektedir. Sen olarğa vekil degilsiñ. (Ayette Az. Peyğamberniñ vazifesi, sadece tebliğ olğanı ifade etile)."
        cid: 0
  - verse: 7
    segments:
      - text: "Şeerlerniñ anası (olğan Mekkede) ve onıñ çevresinde olğanlarnı tenbiyeleviñ ve asla şube olmağan toplanuv kunü ile olarnı qorqızuvıñ içün, saña boyle arapça bir Qur’an vahiy ettik. (İnsanlarnıñ) bir topu cennette, bir topu da çılğın alevli ceennemdedir. (Qur’an Mekke halqına ve yer yuzündeki butün insanlarğa endirilgendir. Mekke, içinde Kâbe ve Maqam-ı İbrahim olğanı içün, şanı yuksek bir şeerdir. Ayette qıyametniñ qorqunçl vaziyeti ve insanlarnıñ cennetliler ve ceennemliler olaraq, ekige ayırılacaqları ifadelengen)."
        cid: 0
  - verse: 8
    segments:
      - text: "Allaһ istese edi, olarnı tek bir millet yapar edi. Faqat O, istegenini rahmetine qavuştırır; zalımlarnıñ ise, iç bir dostu ve yardımcısı yoqtır. (Başqa dinlerdeki butün insanlar İslâm dinine kire bile ediler. Amma, hidayet ve dalâlet ilâhiy iradege bağlıdır. Bunıñnen birlikte, inkârnen ozlerine zulum etkenler azaptan iç bir şekilde qurtulalmaycaqlar)."
        cid: 0
  - verse: 9
    segments:
      - text: "Yoqsa, olar Allaһtan başqa dostlar taptılarmı? Albuki, dost yalıñız Allaһtır. O, olülerni tiriltir, er şeyge qadirdir."
        cid: 0
  - verse: 10
    segments:
      - text: "İhtilâfqqa tüşken er angi bir şeyiñizde uküm bermek Allaһqa mahsustır. İşte, bu, Allaһ, menim Rabbimdir. Oña tayandım ve oña yonelirim."
        cid: 0
  - verse: 11
    segments:
      - text: "O, koklerniñ ve yerniñ yoqtan yaratıcısıdır. Sizge ozüñizden çiftler, ayvanlardan da (ozlerine) çiftler yaratqan. Boylece, çoqlaşuvıñıznı teminlegen. Oña beñzegen iç bir şey yoqtır. O, eşiticidir, korücidir."
        cid: 0
  - verse: 12
    segments:
      - text: "Koklerniñ ve yerniñ anahtarı Onıñdır. İstegenine rızıqnı bol berir, istegeninden de qısar. O, er şeyni bilicidir."
        cid: 0
  - verse: 13
    segments:
      - text: "«Dinni ayaqta tutıñ ve onda ihtilâfqa tüşmeñ», diye Nuһqa tevsiye etkenini, saña vahiy etkenimizni, İbrahimge, Musağa ve İsağa tevsiye etkenimizni Allaһ sizge de din qıldı. Faqat olarnı çağırdığıñ bu (din), Allaһqa ortaq qoşqanlarğa ağır keldi, Allaһ istegenini ozüne (peyğamber) seçer ve ozüne yonelgenni de, doğru yolğa qavuştırır."
        cid: 0
  - verse: 14
    segments:
      - text: "Olar ozlerine ilim kelgenden soñ, sadece aralarındaki asedçilik sebebinden, bolünüvge tüştiler. Eger belli bir devirgece Rabbiñden bir (keçiktirüv) sözü keçken olmasa edi, aralarında aman uküm berilir edi. Olardan soñ, kitapqa varis qılınğanlar da, onıñ aqqında teren bir şube içindedirler. (Bolünüvge tüşkenlerge kelgen ilim tabiri, azap haberiniñ bildirilüvi, Az. Peyğamberniñ yollanılacağı haberi, peyğamberlerniñ ve kitaplarnıñ bildirgen hususlar şeklinde ifade etile bilir. Bu bilgige rağmen, ihtlâfqa tüşülgen, inanğan ve inanmağanlar çıqqan. İnanmağanlarğa ceza olaraq aman azap berilmemesi ve qıyamet kunüne qaldırıluvı, Allaһnıñ bu hususta bergen bir sözünden tolayıdır)."
        cid: 0
  - verse: 15
    segments:
      - text: "İşte, şunıñ içün sen (tevhidge) davet et ve emir olunğanıñ kibi dos-doğru ol. Olarnıñ aveslerine uyma ve de ki: Men Allaһnıñ endirgen Kitabına inandım ve arañızda adaletni tiklemeknen emir olundım. Allaһ bizim de Rabbimiz, siziñ de Rabbiñizdir. Bizim yapqanlarımız bizge, siziñ yapqanlarıñız da sizgedir. Aramızda tartışıla bilecek bir mevzu yoqtır. Allaһ epimizni bir yerge toplar, dönüş de Oñadır. (Ayette Az. Peyğamebrniñ insanlarnı davet etecek priniipleri ifade etilirken, uyacaq esasları da beyan etilgen. Buña kore, davetke devam etilecek, inanmağanlarnıñ teklif ve israrları diñlenmeycek)."
        cid: 0
  - verse: 16
    segments:
      - text: "Daveti qabul etilgenden soñ, Allaһ aqqında tartışmağa kirişkenlerniñ delilleri, Rabbleri qatında boştır. Olar içün bir ğadap, kene olar içün çetin bir azap bardır. (Ayette açıq kosterilgen mucizelerge ya da kitaplarğa inanğandan soñ, tartışuvğa kirişken yeudiylerniñ vaziyetine işaret etilerek, delilleriniñ keçmeycegi ifade etilgen)."
        cid: 0
  - verse: 17
    segments:
      - text: "Kitapnı ve mizannı haq olaraq endirgen Allaһtır. Ne bilmektesiñ, belki de, qıyamet saatı yaqındır!"
        cid: 0
  - verse: 18
    segments:
      - text: "Oña inanmağanlar, onıñ çabuk qopuvını isterler. İnanğanlar ise, ondan qorqarlar ve onıñ aqiqat olğanını bilirler. Yahşı biliñ ki, qıyamet kunü aqqında tartışqanlar teren bir sapıqlıq içindeler."
        cid: 0
  - verse: 19
    segments:
      - text: "Allaһ qullarına lütfkârdır, istegenini rızıqlandırır. O, quvetlidir, kuçlüdir. (Bu yerde Allaһ qullarınıñ yahşısına da, yamanına da lütfte bulunğanı añlaşılmaqta. O, fenalarnı bile, qabaatları sebebinden, aç bıraqmağan)."
        cid: 0
  - verse: 20
    segments:
      - text: "Kim ahiret qazançını istey ise, onıñ qazançını arttırırmız. Kim de dünya kârını istey ise, oña da dünyadan bir şeyler berirmiz. Faqat onıñ ahirette bir nasibi olmaz. (Ayette ahiret qazançı, yahşı niyet ve davranışlar içün alınğan savaplar olaraq ifade etilgen. Allaһ savapnı ekinge beñzetken. Çünki, savap salih amelnen qazanılğan bir faydadır. Bu sebepten, «dünya, ahiretniñ tarlasıdır», denilgen. Qazançnıñ arttırıluvına kelgende, bu savapnıñ birge nisteben onğa, yedi yuzge ve daa ziyadesine çıqarıluvı ve bu artuvnıız dünya işlerine de ait oluvı demektir)."
        cid: 0
  - verse: 21
    segments:
      - text: "Yoqsa, olarnıñ Allaһ izin bermegen bir dinni ketirgen ortaqları barmı? Eger keçiktirme sözü olmasa edi, der’al aralarında uküm berilir edi. Şubesiz, zalımlarğa can yaqıcı bir azap bar. (Ayette kâfirlerge Allaһqa ortaq qoşmaq, tirilmekni inkâr etmek ve dünyağa tabınmaq kibi saqat tüşüncelerni telqin etken şeytanlarğa ve Allaһtan başqa din icat etkenlerge uyuvlarınıñ sebebi soralmaqta ve bu ortaqlarğa uyuvnıñ neticelerine diqqat çekilmekte)."
        cid: 0
  - verse: 22
    segments:
      - text: "Yapqan şeyleri başlarına kelgende, zalımlarnıñ qorqudan titregenlerini koreceksiñ. İman etip, yahşı işler yapqanlar da, cennet bağçalarındadırlar. Rabbleriniñ yanında olarğa istegen er şeyleri mecvuttır. İşte, buyuk lütf budır."
        cid: 0
  - verse: 23
    segments:
      - text: "İşte, Allaһnıñ, iman etken ve yahşı işler yapqan qullarına mujdelegen nimeti budır. De ki: Men buña nisbeten sizden aqrabalıq sevgisinden başka bir ucret istemeyim. Kim bir yahşılıq yapsa, onıñ savabını artqaçınen berermiz. Şubesiz, Allaһ bağışlıyıcı, şukürniñ qarşılığını bericidir. (Ayette keçken aqrabalıq sevgisi «Sizden aqrabamnı sevgeniñizni isteyim» ya da «Aqarbañız olaraq meni sevip, desteklemiñizni isteyim», şeklinde beyan etilgen)."
        cid: 0
  - verse: 24
    segments:
      - text: "Yoqsa, olar (sen içün) Allaһqa nisbeten yalan uydurdımı? derler. Allaһ ister ise, seniñ qalbiñni de muurler. Ve Allaһ batılnı yoq eter; sözlerinen haqnı ortağa qoyar. Şubesiz, O, qalplerde olğanlarnı bilicidir. (Az. Peyğamberniñ Qur’an-ı Kerimni Cenab-ı Haqqa nisbet etüvine inanmağanlar Peyğamberimizni Allaһ qarşısında iftiracı vaziyetine tüşürmege cesaret eteken ediler. Amma, Allaһ Resulınıñ yalan uyduruvdan uzaq olğanını, boyle bir şeyge cesaret etse bile, onıñ qalbi muurlenecegini beyan etmektedir)."
        cid: 0
  - verse: 25
    segments:
      - text: "O, kullarınıñ tövbesini qabul etici fenalıqlarnı bağışlayıcı ve yapqanlarıñıznı bilicidir. (Gunahlarğa aman tövbe etmek kerektir. Qul aqqından başqa, Allaһqa qarşı işlengen gunahnıñ tövbesi uç şartqa bağlıdır: 1). Gunahtan tamamen vazgeçmek. 2). Yapqanına peşman olmaq. 3). Bir daa oña dönmemek. Eger kişi qul aqqınnen bağlı bir yamanlıq işlegen olsa, aq saibiniñ aqqını odemek, onıñ rizasını almaq tövbesiniñ qabul şartlarındandır)."
        cid: 0
  - verse: 26
    segments:
      - text: "Allaһ, iman etip, yahşı işler yapqanlarnıñ tövbesini qabul eter, lütfindan olarğa, ziyadesini berir. Kâfirlerge kelgende, olarğa da çetin bir azap bardır."
        cid: 0
  - verse: 27
    segments:
      - text: "Allaһ qullarına rızqnı bol-bol berse edi, yer yuzünde adden aşar ediler. Faqat O, (rızqnı) istegen olçüde endirir. Çünki O, qullarınıñ haberini alıcıdır, olarnı korücidir."
        cid: 0
  - verse: 28
    segments:
      - text: "O, (insanlar) umütlerini keskenden soñ, yağmurnı endirici, rahmetini er tarafqa yayıcıdır. O, aqiqiy dosttır, maqtavğa lâyıqtır."
        cid: 0
  - verse: 29
    segments:
      - text: "Koklerni, yerni ve olarnıñ içine yayıp çoqlaştırğan canlılarını yaratuvı da, Onıñ delillerindendir. O, istegen vaqtında olarnı bir yerge toplamağa da qadirdir."
        cid: 0
  - verse: 30
    segments:
      - text: "Başıñızğa kelgen er angi bir musibet, oz elleriñiznen yapqanlarıñız sebebindendir. (Bunıñnen beraber) Allaһ çoqunı afu eter. (Ayette hitap etilgenler - gunahkâr mu’minlerdir. Gunahı olmağan mu’minlerniñ başına kelgen musibetlerniñ sebepleri başqadır. Meselâ, olarnıñ sabır etüvleri ecirlerini arttıracaq sebeplerden biri olaraq sayıla bilir)."
        cid: 0
  - verse: 31
    segments:
      - text: "Yer yuzünde (Onı) aciz bıraqalmazsıñız. Allaһtan başqa bir dostuñız ve bir yardımcıñız da yoqtır."
        cid: 0
  - verse: 32
    segments:
      - text: "Deñizde dağlar kibi yaldap yurgenler (gemiler) de Onıñ (barlığınıñ) delillerindendir."
        cid: 0
  - verse: 33
    segments:
      - text: "İstese, O, ruzgârnı toqtatır da, onıñ (deñizniñ) ustünde qala qoyarlar. Elbette bunda çoq sabır etici, çoq şukür etici er kes içün ibretler bardır."
        cid: 0
  - verse: 34
    segments:
      - text: "Yahut yapqanları sebebinden, olarnı elâk eter. Bir çoqusını da afu eter (qurtarır)."
        cid: 0
  - verse: 35
    segments:
      - text: "Boylece, ayetlerimiz uzerinde tartışqanlar, ozlerine qaçacaq bir yer olmağanını bilsinler."
        cid: 0
  - verse: 36
    segments:
      - text: "Sizge berilgen şey, yalıñız dünya ayatınıñ keçici metahlarıdır. Allaһnıñ yanında olğanlar ise, daa yahşı ve daa baqiydir. Bu mukâfat iman etip, Rabblerine tayanıp işanğanlar içündir. (Dünyada insanlarğa berilgen maddiy imkân ve bolluq, sadece bir keçiniş vastasıdır. Allaһnıñ yanındaki savap ise, daimiy ve daa faydalıdır. Ayet-i kerime, Az. Ebu Bekir butün malını Allaһ yoluna arclağan vaqtında, bir toplulıqnıñ onı tenqit etkeni uzerine nazil olğan. Albuki, bu davranışınen Az. Ebu Bekir Allaһqa tayanıp işanuvnıñ eñ guzel ornegini bergen)."
        cid: 0
  - verse: 37
    segments:
      - text: "Olar buyuk gunahlardan ve ayasızlıqtan qaçınırlar; qızğan vaqıtlarında da, qusurlarnı bağışlarlar."
        cid: 0
  - verse: 38
    segments:
      - text: "Kene olar, Rabbleriniñ davetine uyarlar ve namaznı qılarlar. Olarnıñ işleri, aralarında tanışuvnendir. Olarğa bergen rızqımızdan da arclarlar. (Bu ayet İslâmiy idare şekliniñ, musulmanlarnıı oz aralarından seçecek şuranıñ qararlarına esaslanğanlarına delil olaraq kosterilgen)."
        cid: 0
  - verse: 39
    segments:
      - text: "Bir aqsızlıqqa oğrağan vaqıtlarında, yardımlaşırlar."
        cid: 0
  - verse: 40
    segments:
      - text: "Bir yamanlıqnıñ cezası, oña musaviy bir yamanlıqtır. Kim bağışlar ve barışnı teminler ise, onıñ mukâfatı Allaһqa aittir. Doğrusı, O, zalımlarnı sevmez."
        cid: 0
  - verse: 41
    segments:
      - text: "Kim zulumğa oğrağandan soñ, aqqını alır ise, artıq olarğa yapılacaq bir şey yoqtır."
        cid: 0
  - verse: 42
    segments:
      - text: "Ancaq insanlarğa zulum eticilerge ve yer yuzünde aqsız yerde adden aşqanlarğa ceza bardır. İşte, elem berici azap bularğadır."
        cid: 0
  - verse: 43
    segments:
      - text: "Kim sabır eter ve afu eter ise, şubesiz bu areketi, yapıluvğa deger işlerdendir. (Yamanlıq qarşısında sabır etken ve onı bağışlağan kimse, merd ve azimli insanlarnıñ yaptığı işini yapqandır. Dinniñ istegi budır)."
        cid: 0
  - verse: 44
    segments:
      - text: "Allaһ kimni saptırsa, ondan soñ artıq onıñ iç bir dostu yoqtır. Azapnı korgenlerinde zalımlarnıñ: Dünecek bir yol barmı? degenlerini korersiñ."
        cid: 0
  - verse: 45
    segments:
      - text: "Ateşke atılır ekenler, olarnıñ zilletten başlarını töben egerek, koz qıyığınen gizli-gizli baqqanlarını koreceksiñ. İnanğanlar da: İşte, asıl ziyanğa oğrağanlar, qıyamet kunü ozlerini ve ailelerini ziyanğa soqqanlardır, deycekler. Kesen-kes biliñ ki, zalımlar, devamlı bir azap içindedirler. (Qıyamette ziyanğa oğramaq, ceennemde ebediy qalmaq ve cennette azırlanğan nimetlerden marum bıraqılmaq şeklinde beyan etilgen)."
        cid: 0
  - verse: 46
    segments:
      - text: "Olarnıñ Allaһtan başqa ozlerine yardım etken iç bir dostları yoqtır. Allaһ kimni saptırır ise, artıq onıñ qurtulışqa çıqacaq bir yolu yoqtır."
        cid: 0
  - verse: 47
    segments:
      - text: "Allaһtan keri çevirilüvi imkânsız bir kun kelmezden evel, Rabbiñizge uyıñ. Çünki, o kunü iç biriñiz sığınacaq bir yer tapalmazsıñız, itiraz da etalmazsıñız."
        cid: 0
  - verse: 48
    segments:
      - text: "Eger yuz çevirir iseler, bilesiñ ki, biz seni olarnıñ uzerine bekçi yollamdıq. Saña tüşkeni sadece tebliğdir. Biz insanğa qatımızdan bir rahmet tattırğan vaqtımızda, oña sevinir. Amma, ellerinen yapqanları sebebinden, başlarına bir fenalıq kelir ise, işte, o zaman insan pek nankordir! (Ayette, inkâr etkenlerniñ vaziyetine Az. Peyğamberniñ kederlenmemesi istenilgen, ayrıca insanlarnıñ zenginlik ve sağlıq kibi nimetlerge nisbeten areketleri ile yapqan gunahlardan tolayı, oğrağan sıqıntıları qarşısındaki menfiy tavurlarına diqqat çekilgen)."
        cid: 0
  - verse: 49
    segments:
      - text: "Koklerniñ ve yerniñ mulki Allaһnıñdır. İstegenini yaratır; istegenine qız balalar, istegenine de oğlan balalar bağışlar."
        cid: 0
  - verse: 50
    segments:
      - text: "Yahut olarnı em oğlan, em de qız balaları olmaq uzre, çift berir. İstegenini de qısır qaldırır. O, er şeyni bilicidir, er şeyge kuçü yeticidir."
        cid: 0
  - verse: 51
    segments:
      - text: "Allaһ bir insannen, ancaq vahiy yolunen ya da perde artından qonuşır, yahut bir elçi yollap, izninen oña istegenini vahiy eter. O, yucedir, akimdir. (Vahiyniñ kelüv şekillerini beyan etken bu ayetke kore, vahiy qalpke ilham ya da Cenab-ı Haqnı kormeden, perde arktından qonuşuv ya da vahiy melegi (Cebrail) vastası ile kelâm eşitmek suretinen de kerçekleşmekte)."
        cid: 0
  - verse: 52
    segments:
      - text: "İşte, boylece, saña da emrimiznen Qur’annı vahiy ettik. Sen kitap nedir, iman nedir bilmez ediñ. Faqat biz onı qullarımızdan istegenimizni kendisi ile doğru yolğa iriştirdigimiz bir nur qıldıq. Şubesiz ki, sen doğru bir yolnı kostermektesiñ. (Qur’an diye tercime etilgen «ruh» kelimesi, ayrıca Cebrailni de ifade etken. Bu ayette risalet ve kitapnıñ emiyeti beyan etilgen, Az. Peyğamberniñ ozüne kelgen vahiynen, doğru yol reberi olğanı añlatılğan)."
        cid: 0
  - verse: 53
    segments:
      - text: "(O yol) koklerniñ ve yerniñ saibi olğan Allaһnıñ yoludır. Diqqat etiñ, butün işler soñunda Allaһqa döner. (Mu’minlerge mujde, gunahkârlarğa da tehdit bulunğan bu ayette, artıq qarşılıqlı sebep ve alâqalarnıñ ortadan qalqqanı, er şeyniñ Allaһqa döngen kunü hatırlatılğan)."
        cid: 0