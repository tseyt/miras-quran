surah_id: 42
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >
          Haa. Miim. Ayn. Siin. Qaaf.
        cid: 0
  - verse: 2
    segments:
      - text: >
          [1 ayetine baq.]
        cid: 0
  - verse: 3
    segments:
      - text: >
          Aziz ve hakim olğan Allah saña ve senden evelkilerine, işte böyle vahiy eter.
          (Cenab-ı Haq Qur'an-ı Kerimde añlatqan hususlarnıñ özüni daa evelki kitaplarda
          da bildirgen. Hususen, Haa, Miim ve Ayn, Siin, Qaaf kibi arifler işaret ve sır
          olaraq, bütün peyğamberlerge vahiy etilgen).
        cid: 0
  - verse: 4
    segments:
      - text: >
          Köklerde ve yerde ne bar ise, episi Onıñdır. O, yücedir, uludır.
        cid: 0
  - verse: 5
    segments:
      - text: >
          Aman-aman tepelerinden kökler çatlaycaq! Melekler de, Rabblerini hamd ile tesbih
          etmekteler ve yerdekiler içün mağfiret istemekteler. Yahşı biliñ ki, Allah çoq
          bağışlayıcı, çoq merhametlidir. («Köklerniñ üstlerinden çatlavı», Allahnıñ
          azametinden ve şanınıñ yüceligindendir).
        cid: 0
  - verse: 6
    segments:
      - text: >
          Allahtan başqasını dost tutqanlarını Allah daima nezaret etmektedir. Sen olarğa
          vekil degilsiñ. (Ayette Az. Peyğamberniñ vazifesi, sadece tebliğ olğanı ifade
          etile).
        cid: 0
  - verse: 7
    segments:
      - text: >
          Şeerlerniñ anası (olğan Mekkede) ve onıñ çevresinde olğanlarnı tenbiyeleviñ ve
          asla şübe olmağan toplanuv künü ile olarnı qorqızuvıñ içün, saña böyle arapça
          bir Qur'an vahiy ettik. (İnsanlarnıñ) bir topu cennette, bir topu da çılğın
          alevli ceennemdedir. (Qur'an Mekke halqına ve yer yüzündeki bütün insanlarğa
          endirilgendir. Mekke, içinde Kâbe ve Maqam-ı İbrahim olğanı içün, şanı yüksek
          bir şeerdir. Ayette qıyametniñ qorqunçlı vaziyeti ve insanlarnıñ cennetliler ve
          ceennemliler olaraq, ekige ayırılacaqları ifadelengen).
        cid: 0
  - verse: 8
    segments:
      - text: >
          Allah istese edi, olarnı tek bir millet yapar edi. Faqat O, istegenini rahmetine
          qavuştırır; zalımlarnıñ ise, iç bir dostu ve yardımcısı yoqtır. (Başqa
          dinlerdeki bütün insanlar İslâm dinine kire bile ediler. Amma, hidayet ve
          dalâlet ilâhiy iradege bağlıdır. Bunıñnen birlikte, inkârnen özlerine zulum
          etkenler azaptan iç bir şekilde qurtulalmaycaqlar).
        cid: 0
  - verse: 9
    segments:
      - text: >
          Yoqsa, olar Allahtan başqa dostlar taptılarmı? Albuki, dost yalıñız Allahtır. O,
          ölülerni tiriltir, er şeyge qadirdir.
        cid: 0
  - verse: 10
    segments:
      - text: >
          İhtilâfqqa tüşken er angi bir şeyiñizde üküm bermek Allahqa mahsustır. İşte, bu,
          Allah, menim Rabbimdir. Oña tayandım ve oña yönelirim.
        cid: 0
  - verse: 11
    segments:
      - text: >
          O, köklerniñ ve yerniñ yoqtan yaratıcısıdır. Sizge özüñizden çiftler,
          ayvanlardan da (özlerine) çiftler yaratqan. Böylece, çoqlaşuvıñıznı teminlegen.
          Oña beñzegen iç bir şey yoqtır. O, eşiticidir, körücidir.
        cid: 0
  - verse: 12
    segments:
      - text: >
          Köklerniñ ve yerniñ anahtarı Onıñdır. İstegenine rızıqnı bol berir, istegeninden
          de qısar. O, er şeyni bilicidir.
        cid: 0
  - verse: 13
    segments:
      - text: >
          «Dinni ayaqta tutıñ ve onda ihtilâfqa tüşmeñ», diye Nuhqa tevsiye etkenini, saña
          vahiy etkenimizni, İbrahimge, Musağa ve İsağa tevsiye etkenimizni Allah sizge de
          din qıldı. Faqat olarnı çağırdığıñ bu (din), Allahqa ortaq qoşqanlarğa ağır
          keldi, Allah istegenini özüne (peyğamber) seçer ve özüne yönelgenni de, doğru
          yolğa qavuştırır.
        cid: 0
  - verse: 14
    segments:
      - text: >
          Olar özlerine ilim kelgenden soñ, sadece aralarındaki asedçilik sebebinden,
          bölünüvge tüştiler. Eger belli bir devirgece Rabbiñden bir (keçiktirüv) sözü
          keçken olmasa edi, aralarında aman üküm berilir edi. Olardan soñ, kitapqa varis
          qılınğanlar da, onıñ aqqında teren bir şübe içindedirler. (Bölünüvge tüşkenlerge
          kelgen ilim tabiri, azap haberiniñ bildirilüvi, Az. Peyğamberniñ yollanılacağı
          haberi, peyğamberlerniñ ve kitaplarnıñ bildirgen hususlar şeklinde ifade etile
          bilir. Bu bilgige rağmen, ihtlâfqa tüşülgen, inanğan ve inanmağanlar çıqqan.
          İnanmağanlarğa ceza olaraq aman azap berilmemesi ve qıyamet kününe qaldırıluvı,
          Allahnıñ bu hususta bergen bir sözünden tolayıdır).
        cid: 0
  - verse: 15
    segments:
      - text: >
          İşte, şunıñ içün sen (tevhidge) davet et ve emir olunğanıñ kibi dos-doğru ol.
          Olarnıñ aveslerine uyma ve de ki: Men Allahnıñ endirgen Kitabına inandım ve
          arañızda adaletni tiklemeknen emir olundım. Allah bizim de Rabbimiz, siziñ de
          Rabbiñizdir. Bizim yapqanlarımız bizge, siziñ yapqanlarıñız da sizgedir.
          Aramızda tartışıla bilecek bir mevzu yoqtır. Allah epimizni bir yerge toplar,
          dönüş de Oñadır. (Ayette Az. Peyğamebrniñ insanlarnı davet etecek printsipleri
          ifade etilirken, uyacaq esasları da beyan etilgen. Buña köre, davetke devam
          etilecek, inanmağanlarnıñ teklif ve israrları diñlenmeycek).
        cid: 0
  - verse: 16
    segments:
      - text: >
          Daveti qabul etilgenden soñ, Allah aqqında tartışmağa kirişkenlerniñ delilleri,
          Rabbleri qatında boştır. Olar içün bir ğadap, kene olar içün çetin bir azap
          bardır. (Ayette açıq kösterilgen mucizelerge ya da kitaplarğa inanğandan soñ,
          tartışuvğa kirişken yeudiylerniñ vaziyetine işaret etilerek, delilleriniñ
          keçmeycegi ifade etilgen).
        cid: 0
  - verse: 17
    segments:
      - text: >
          Kitapnı ve mizannı haq olaraq endirgen Allahtır. Ne bilmektesiñ, belki de,
          qıyamet saatı yaqındır!
        cid: 0
  - verse: 18
    segments:
      - text: >
          Oña inanmağanlar, onıñ çabuk qopuvını isterler. İnanğanlar ise, ondan qorqarlar
          ve onıñ aqiqat olğanını bilirler. Yahşı biliñ ki, qıyamet künü aqqında
          tartışqanlar teren bir sapıqlıq içindeler.
        cid: 0
  - verse: 19
    segments:
      - text: >
          Allah qullarına lütfkârdır, istegenini rızıqlandırır. O, quvetlidir, küçlüdir.
          (Bu yerde Allah qullarınıñ yahşısına da, yamanına da lütfte bulunğanı
          añlaşılmaqta. O, fenalarnı bile, qabaatları sebebinden, aç bıraqmağan).
        cid: 0
  - verse: 20
    segments:
      - text: >
          Kim ahiret qazançını istey ise, onıñ qazançını arttırırmız. Kim de dünya kârını
          istey ise, oña da dünyadan bir şeyler berirmiz. Faqat onıñ ahirette bir nasibi
          olmaz. (Ayette ahiret qazançı, yahşı niyet ve davranışlar içün alınğan savaplar
          olaraq ifade etilgen. Allah savapnı ekinge beñzetken. Çünki, savap salih amelnen
          qazanılğan bir faydadır. Bu sebepten, «dünya, ahiretniñ tarlasıdır», denilgen.
          Qazançnıñ arttırıluvına kelgende, bu savapnıñ birge nisteben onğa, yedi yüzge ve
          daa ziyadesine çıqarıluvı ve bu artuvnıñ dünya işlerine de ait oluvı demektir).
        cid: 0
  - verse: 21
    segments:
      - text: >
          Yoqsa, olarnıñ Allah izin bermegen bir dinni ketirgen ortaqları barmı? Eger
          keçiktirme sözü olmasa edi, der'al aralarında üküm berilir edi. Şübesiz,
          zalımlarğa can yaqıcı bir azap bar. (Ayette kâfirlerge Allahqa ortaq qoşmaq,
          tirilmekni inkâr etmek ve dünyağa tabınmaq kibi saqat tüşüncelerni telqin etken
          şeytanlarğa ve Allahtan başqa din icat etkenlerge uyuvlarınıñ sebebi soralmaqta
          ve bu ortaqlarğa uyuvnıñ neticelerine diqqat çekilmekte).
        cid: 0
  - verse: 22
    segments:
      - text: >
          Yapqan şeyleri başlarına kelgende, zalımlarnıñ qorqudan titregenlerini
          köreceksiñ. İman etip, yahşı işler yapqanlar da, cennet bağçalarındadırlar.
          Rabbleriniñ yanında olarğa istegen er şeyleri mecvuttır. İşte, büyük lütf budır.
        cid: 0
  - verse: 23
    segments:
      - text: >
          İşte, Allahnıñ, iman etken ve yahşı işler yapqan qullarına müjdelegen nimeti
          budır. De ki: Men buña nisbeten sizden aqrabalıq sevgisinden başqa bir ücret
          istemeyim. Kim bir yahşılıq yapsa, onıñ savabını artqaçınen berermiz. Şübesiz,
          Allah bağışlayıcı, şükürniñ qarşılığını bericidir. (Ayette keçken aqrabalıq
          sevgisi «Sizden aqrabamnı sevgeniñizni isteyim» ya da «Aqarbañız olaraq meni
          sevip, desteklemiñizni isteyim», şeklinde beyan etilgen).
        cid: 0
  - verse: 24
    segments:
      - text: >
          Yoqsa, olar (sen içün) Allahqa nisbeten yalan uydurdımı? derler. Allah ister
          ise, seniñ qalbiñni de müurler. Ve Allah batılnı yoq eter; sözlerinen haqnı
          ortağa qoyar. Şübesiz, O, qalplerde olğanlarnı bilicidir. (Az. Peyğamberniñ
          Qur'an-ı Kerimni Cenab-ı Haqqa nisbet etüvine inanmağanlar Peyğamberimizni Allah
          qarşısında iftiracı vaziyetine tüşürmege cesaret eteken ediler. Amma, Allah
          Resulınıñ yalan uyduruvdan uzaq olğanını, böyle bir şeyge cesaret etse bile,
          onıñ qalbi müurlenecegini beyan etmektedir).
        cid: 0
  - verse: 25
    segments:
      - text: >
          O, qullarınıñ tövbesini qabul etici fenalıqlarnı bağışlayıcı ve yapqanlarıñıznı
          bilicidir. (Günahlarğa aman tövbe etmek kerektir. Qul aqqından başqa, Allahqa
          qarşı işlengen günahnıñ tövbesi üç şartqa bağlıdır: 1). Günahtan tamamen
          vazgeçmek. 2). Yapqanına peşman olmaq. 3). Bir daa oña dönmemek. Eger kişi qul
          aqqınen bağlı bir yamanlıq işlegen olsa, aq saibiniñ aqqını ödemek, onıñ
          rizasını almaq tövbesiniñ qabul şartlarındandır).
        cid: 0
  - verse: 26
    segments:
      - text: >
          Allah, iman etip, yahşı işler yapqanlarnıñ tövbesini qabul eter, lütfindan
          olarğa, ziyadesini berir. Kâfirlerge kelgende, olarğa da çetin bir azap bardır.
        cid: 0
  - verse: 27
    segments:
      - text: >
          Allah qullarına rızqnı bol-bol berse edi, yer yüzünde adden aşar ediler. Faqat
          O, (rızqnı) istegen ölçüde endirir. Çünki O, qullarınıñ haberini alıcıdır,
          olarnı körücidir.
        cid: 0
  - verse: 28
    segments:
      - text: >
          O, (insanlar) ümütlerini keskenden soñ, yağmurnı endirici, rahmetini er tarafqa
          yayıcıdır. O, aqiqiy dosttır, maqtavğa lâyıqtır.
        cid: 0
  - verse: 29
    segments:
      - text: >
          Köklerni, yerni ve olarnıñ içine yayıp çoqlaştırğan canlılarını yaratuvı da,
          Onıñ delillerindendir. O, istegen vaqtında olarnı bir yerge toplamağa da
          qadirdir.
        cid: 0
  - verse: 30
    segments:
      - text: >
          Başıñızğa kelgen er angi bir musibet, öz elleriñiznen yapqanlarıñız
          sebebindendir. (Bunıñnen beraber) Allah çoqunı afu eter. (Ayette hitap
          etilgenler - günahkâr mü'minlerdir. Günahı olmağan mü'minlerniñ başına kelgen
          musibetlerniñ sebepleri başqadır. Meselâ, olarnıñ sabır etüvleri ecirlerini
          arttıracaq sebeplerden biri olaraq sayıla bilir).
        cid: 0
  - verse: 31
    segments:
      - text: >
          Yer yüzünde (Onı) aciz bıraqalmazsıñız. Allahtan başqa bir dostuñız ve bir
          yardımcıñız da yoqtır.
        cid: 0
  - verse: 32
    segments:
      - text: >
          Deñizde dağlar kibi yaldap yürgenler (gemiler) de Onıñ (barlığınıñ)
          delillerindendir.
        cid: 0
  - verse: 33
    segments:
      - text: >
          İstese, O, rüzgârnı toqtatır da, onıñ (deñizniñ) üstünde qala qoyarlar. Elbette
          bunda çoq sabır etici, çoq şükür etici er kes içün ibretler bardır.
        cid: 0
  - verse: 34
    segments:
      - text: >
          Yahut yapqanları sebebinden, olarnı elâk eter. Bir çoqusını da afu eter
          (qurtarır).
        cid: 0
  - verse: 35
    segments:
      - text: >
          Böylece, ayetlerimiz üzerinde tartışqanlar, özlerine qaçacaq bir yer olmağanını
          bilsinler.
        cid: 0
  - verse: 36
    segments:
      - text: >
          Sizge berilgen şey, yalıñız dünya ayatınıñ keçici metahlarıdır. Allahnıñ yanında
          olğanlar ise, daa yahşı ve daa baqiydir. Bu mükâfat iman etip, Rabblerine
          tayanıp işanğanlar içündir. (Dünyada insanlarğa berilgen maddiy imkân ve bolluq,
          sadece bir keçiniş vastasıdır. Allahnıñ yanındaki savap ise, daimiy ve daa
          faydalıdır. Ayet-i kerime, Az. Ebu Bekir bütün malını Allah yoluna arclağan
          vaqtında, bir toplulıqnıñ onı tenqit etkeni üzerine nazil olğan. Albuki, bu
          davranışınen Az. Ebu Bekir Allahqa tayanıp işanuvnıñ eñ güzel örnegini bergen).
        cid: 0
  - verse: 37
    segments:
      - text: >
          Olar büyük günahlardan ve ayasızlıqtan qaçınırlar; qızğan vaqıtlarında da,
          qusurlarnı bağışlarlar.
        cid: 0
  - verse: 38
    segments:
      - text: >
          Kene olar, Rabbleriniñ davetine uyarlar ve namaznı qılarlar. Olarnıñ işleri,
          aralarında tanışuvnendir. Olarğa bergen rızqımızdan da arclarlar. (Bu ayet
          İslâmiy idare şekliniñ, musulmanlarnıñ öz aralarından seçecek şuranıñ
          qararlarına esaslanğanlarına delil olaraq kösterilgen).
        cid: 0
  - verse: 39
    segments:
      - text: >
          Bir aqsızlıqqa oğrağan vaqıtlarında, yardımlaşırlar.
        cid: 0
  - verse: 40
    segments:
      - text: >
          Bir yamanlıqnıñ cezası, oña musaviy bir yamanlıqtır. Kim bağışlar ve barışnı
          teminler ise, onıñ mükâfatı Allahqa aittir. Doğrusı, O, zalımlarnı sevmez.
        cid: 0
  - verse: 41
    segments:
      - text: >
          Kim zulumğa oğrağandan soñ, aqqını alır ise, artıq olarğa yapılacaq bir şey
          yoqtır.
        cid: 0
  - verse: 42
    segments:
      - text: >
          Ancaq insanlarğa zulum eticilerge ve yer yüzünde aqsız yerde adden aşqanlarğa
          ceza bardır. İşte, elem berici azap bularğadır.
        cid: 0
  - verse: 43
    segments:
      - text: >
          Kim sabır eter ve afu eter ise, şübesiz bu areketi, yapıluvğa deger işlerdendir.
          (Yamanlıq qarşısında sabır etken ve onı bağışlağan kimse, merd ve azimli
          insanlarnıñ yaptığı işini yapqandır. Dinniñ istegi budır).
        cid: 0
  - verse: 44
    segments:
      - text: >
          Allah kimni saptırsa, ondan soñ artıq onıñ iç bir dostu yoqtır. Azapnı
          körgenlerinde zalımlarnıñ: Dünecek bir yol barmı? degenlerini körersiñ.
        cid: 0
  - verse: 45
    segments:
      - text: >
          Ateşke atılır ekenler, olarnıñ zilletten başlarını töben egerek, köz qıyığınen
          gizli-gizli baqqanlarını köreceksiñ. İnanğanlar da: İşte, asıl ziyanğa
          oğrağanlar, qıyamet künü özlerini ve ailelerini ziyanğa soqqanlardır, deycekler.
          Kesen-kes biliñ ki, zalımlar, devamlı bir azap içindedirler. (Qıyamette ziyanğa
          oğramaq, ceennemde ebediy qalmaq ve cennette azırlanğan nimetlerden marum
          bıraqılmaq şeklinde beyan etilgen).
        cid: 0
  - verse: 46
    segments:
      - text: >
          Olarnıñ Allahtan başqa özlerine yardım etken iç bir dostları yoqtır. Allah kimni
          saptırır ise, artıq onıñ qurtulışqa çıqacaq bir yolu yoqtır.
        cid: 0
  - verse: 47
    segments:
      - text: >
          Allahtan keri çevirilüvi imkânsız bir kün kelmezden evel, Rabbiñizge uyıñ.
          Çünki, o künü iç biriñiz sığınacaq bir yer tapalmazsıñız, itiraz da
          etalmazsıñız.
        cid: 0
  - verse: 48
    segments:
      - text: >
          Eger yüz çevirir iseler, bilesiñ ki, biz seni olarnıñ üzerine bekçi yollamadıq.
          Saña tüşkeni sadece tebliğdir. Biz insanğa qatımızdan bir rahmet tattırğan
          vaqtımızda, oña sevinir. Amma, ellerinen yapqanları sebebinden, başlarına bir
          fenalıq kelir ise, işte, o zaman insan pek nankordir! (Ayette, inkâr etkenlerniñ
          vaziyetine Az. Peyğamberniñ kederlenmemesi istenilgen, ayrıca insanlarnıñ
          zenginlik ve sağlıq kibi nimetlerge nisbeten areketleri ile yapqan günahlardan
          tolayı, oğrağan sıqıntıları qarşısındaki menfiy tavurlarına diqqat çekilgen).
        cid: 0
  - verse: 49
    segments:
      - text: >
          Köklerniñ ve yerniñ mülki Allahnıñdır. İstegenini yaratır; istegenine qız
          balalar, istegenine de oğlan balalar bağışlar.
        cid: 0
  - verse: 50
    segments:
      - text: >
          Yahut olarnı em oğlan, em de qız balaları olmaq üzre, çift berir. İstegenini de
          qısır qaldırır. O, er şeyni bilicidir, er şeyge küçü yeticidir.
        cid: 0
  - verse: 51
    segments:
      - text: >
          Allah bir insannen, ancaq vahiy yolunen ya da perde artından qonuşır, yahut bir
          elçi yollap, izninen oña istegenini vahiy eter. O, yücedir, akimdir. (Vahiyniñ
          kelüv şekillerini beyan etken bu ayetke köre, vahiy qalpke ilham ya da Cenab-ı
          Haqnı körmeden, perde arktından qonuşuv ya da vahiy melegi (Cebrail) vastası ile
          kelâm eşitmek suretinen de kerçekleşmekte).
        cid: 0
  - verse: 52
    segments:
      - text: >
          İşte, böylece, saña da emrimiznen Qur'annı vahiy ettik. Sen kitap nedir, iman
          nedir bilmez ediñ. Faqat biz onı qullarımızdan istegenimizni kendisi ile doğru
          yolğa iriştirdigimiz bir nur qıldıq. Şübesiz ki, sen doğru bir yolnı
          köstermektesiñ. (Qur'an diye tercime etilgen «ruh» kelimesi, ayrıca Cebrailni de
          ifade etken. Bu ayette risalet ve kitapnıñ emiyeti beyan etilgen, Az.
          Peyğamberniñ özüne kelgen vahiynen, doğru yol reberi olğanı añlatılğan).
        cid: 0
  - verse: 53
    segments:
      - text: >
          (O yol) köklerniñ ve yerniñ saibi olğan Allahnıñ yoludır. Diqqat etiñ, bütün
          işler soñunda Allahqa döner. (Mü'minlerge müjde, günahkârlarğa da tehdit
          bulunğan bu ayette, artıq qarşılıqlı sebep ve alâqalarnıñ ortadan qalqqanı, er
          şeyniñ Allahqa döngen künü hatırlatılğan).
        cid: 0
