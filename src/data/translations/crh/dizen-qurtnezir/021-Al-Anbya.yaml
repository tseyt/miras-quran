          imanğa kelgenlerinden habersiz olğan Az.Yunus, bildirgen azapnıñ vaqtında yüz
          bermegenini körgeninen, özüniñ alay etilecegini tüşünerek, qızışqan bir alda, çıqıp
          ketken edi. Bir gemi yolculığında, ağır yükten gemi batayatqanda, yüküni yengiletmek
          ve gemini qurtarmaq içün çekilgen qur'a neticesinde deñizge atlamağa mecbur ola. Onı
