  - verse: 80
    segments:
      - text: "Davud ve Suleymannı da (añ). Bir zaman, bir ekin mevzusında uküm bermekte ediler: bir top insannıñ qoyun sürüsi, geceleyin başı boş bir vaziyette, bu ekinniñ içine dağılıp, ziyan bergen edi. Biz olarnıñ ukmini korüp-bilmekte edik. (Tefsirlerde añlatılğanına kore, ekin saibinen qoyun sürüsiniñ saipleri arasındaki davada akimlik yapqan Davud ile Suleyman farqlı ukümler bergen ediler. Az.Davud taptalğan ekinniñ qıymeti, qoyunlarnıı qıymeti qadar olğanını koz ogüne alaraq, qoyunlarnıı ekin saibine qarşılıq berülivini uküm ete. Oğlu Suleyman ise, şu ukümge kele: Ekin tarlası qoyun saiplerine berilmeli, olar, ziyandan evelki alına kelgenge qadar, tarlanıñ baqımını boyunlarına almalılar. Qoyunlar da, tarla saibine berilmeli, tarlası eski alına kelgenge qadar, bu qoyunlarnıı sütünden, yunünden ve qozularından faydalansınlar. Az.Davud, oğlunıñ bu ukmini begenerek, oz fikrinden vazgeçken)."
        cid: 0
