      - text: >-
          (Tabiat ilimlerindeki inkişaf, bu ayetniñ daa yahşı añlaşıluvına yardımcı ola. Bunıñ
          kibi, bazı ilim adamlarına köre, semadaki cısımlar, vaqtı ile bir gaz topu alında
          edi. Zamanınen, bu gaz topundan topraqlar şeklinde parçalar qopqan ve sema boşluğına
          fırlanğan. Aynı şekilde dünyamız da bir gaz topu olğan küneşten qopqan ve zaman
          içinde suvuyaraq qabuq bağlağan. Bu arada dünyamızdan yükselgen gazlar ve buvlar,
          qoyulaşaraq, yağmur şeklinde tekrar dünyağa tökülgen ve böylece, deñizler ve okean
          suvları meydanğa kelgen, suvda yosunlaşuvnen başlağan canlılar ilâhiy qanunlarğa
          köre inkişaf etken. Allah eñ mükemmel canlı tür olaraq da, kene içinde suv bulunğan
          ayrı bir çamurdan insannı yaratqan).
