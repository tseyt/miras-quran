      - text: >-
          (Bu ayet Allahnıñ birligini köstergen eñ küçlü delillerden birini ortağa qoya. Bu
          delil - alemniñ nizamıdır. Aqiqaten, eger birden ziyade ilâh olsa edi, bular
          bir-birinen ya añlaşır, ya da añlaşamaz ediler. Bir-birinen añlaşqanları, beraber
          aynı şeyni yapqanları, yaratqanları, alemge beraber nizam bergenleri taqdirde, ya
          biri digerine muhtac olur edi ki, muhtac olğan ilâh olalmaz; ya da yardımğa muhtac
          olmaz edi; bu vaziyette de, digerleriniñ barlığı kerekmez edi. Bu alda, Allah
          birdir. Diger taraftan, eger bu ilâhlar bir-birilerinen añlaşamasalar, biriniñ
          yapqanına, yaratqanına digeri qarşı çıqsa, o vaqıtta alemde nizamdan eser qalmaz;
          ayette de buyurılğanı kibi, «yer ve kök bozulıp keter edi». Albuki, alemde aqransız
          bir nizam mevcuttır. Bu alda, Allah bardır ve birdir).
        cid: 0
