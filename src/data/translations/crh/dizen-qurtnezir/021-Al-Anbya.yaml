surah_id: 21
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "İnsanlar esapqa çekilecek (kun) yaqlaştı. Al boyle eken, olar ğaflet içinde yuz çevirdiler."
        cid: 0
  - verse: 2
    segments:
      - text: "Rabblerinden ozlerine ne zaman yañı bir ihtar kelse, olar bunı ep alayğa alaraq, qalpleri oyunğa, eglencege dalaraq diñlegendirler. O zalımlar boyle fısıldaştılar: Bu (Muһammed), siz kibi bir beşer olmaqtan başqa nedir ya! Siz şimdi kozüñiz kore-kore tılsımğa qapılmaqtasızmı?"
        cid: 0
  - verse: 3
    segments:
      - text: "[2 ayetine baq.]"
        cid: 0
  - verse: 4
    segments:
      - text: "(Peyğamber) dedi ki: Rabbim, yerde ve kokte (söylengen) er sözni bilir. O, haqqı ile eşitici ve bilicidir."
        cid: 0
  - verse: 5
    segments:
      - text: "«Öq, dediler, (bular) saçma-sapıq ruyalardır; mıtlaqa onı ozü uydurğandır; belki de, o, şairdir. (Eger oyle olmasa (bizge) aman evelkilerine yollanlığanına beñzegen bir ayet ketirsin»."
        cid: 0
  - verse: 6
    segments:
      - text: "Bulardan evel elâk etken iç bir bolgemiz iman etmegen edi; şimdi bular iman eteceklermi?"
        cid: 0
  - verse: 7
    segments:
      - text: "Biz, senden evel de, ozlerine vahiy bergen adamlarımızdan başqasını peyğamber olaraq yollamadıq. Eger bilmeseñiz, bilgenlerden sorañ. (Bu ayette keçken «ehlu’z-zikr» yani (bilgenler) demek, tefsircilerge kore, Tevrat ve İncil aqqında doğru ve yeterli bilgisi olğan ehl-i kitap alimleridir)."
        cid: 0
  - verse: 8
    segments:
      - text: "Biz olarnı (peyğamberlerni), aş aşamaz birer (cansız) ceset olaraq yaratmadıq. Olar (bu dünyada) ebediy de degiller."
        cid: 0
  - verse: 9
    segments:
      - text: "Soñ olarğa (bergen) sözümizni yerine ketirdik; boylece, em olarnı, em de istedigimiz (başqa) kimselerni qurtulışqa iriştirdik; musriflerni de elâk ettik. (Bu yerdeki musriflerniñ manası, iman ve hidayetke iriimek içün ozlerine berilgen fırsatlarğa qıymet kesmegen, peyğamberlerni yalanlamaqta israr etken kâfirlerdir)."
        cid: 0
  - verse: 10
    segments:
      - text: "Ant olsun, sizge içinde siz içün ogüt bulunğan bir kitap endirdik. Alâ aqıllanmazsıñızmı?"
        cid: 0
  - verse: 11
    segments:
      - text: "Zalım olğan nice bolgeni qırıp keçirdik; artından da, nice başqa toplulıqlar vucütke ketirdik."
        cid: 0
  - verse: 12
    segments:
      - text: "Azabımıznı is etkenlerinde, bir de baqarsıñ ki, o yerlerden (azap bolgesinden) qaçmaqtalar!"
        cid: 0
  - verse: 13
    segments:
      - text: "«Qaçmañ! İçinde bulundığıñız ferahqa ve yurtlarıñızğa döniñ! Çünki, sizden sualler soralacaq!»"
        cid: 0
  - verse: 14
    segments:
      - text: "«Vay, başımızğa kelgenlerge! dediler; aqiqaten biz zalım insanlar ekenmiz»."
        cid: 0
  - verse: 15
    segments:
      - text: "Biz olarnı, qurıp çalınğan ekinge, söngen ateşke çevirgenge qadar, bu feryadları devam eter."
        cid: 0
  - verse: 16
    segments:
      - text: "Biz, kokni, yerni ve bular arasındakilerni, oyuncılar (işi, eglencesi) olaraq yaratmadıq. (Yani Allaһ butün bularnı ozü içün bir oyun olsun diye, boş ve manasız şeyler olaraq degil, buyuk ikmetler ve muim faydalar içün yaratqan)."
        cid: 0
  - verse: 17
    segments:
      - text: "Eger bir eglence yapmağa istese edik, onı oz tarafımızdan yapar edik. (Bu irademizniñ eseri olur edi. Amma) biz (bunı) yapqanlardan degilmiz."
        cid: 0
  - verse: 18
    segments:
      - text: "Doğrusı, biz haqnı batılnıñ tepesine mindirirmiz de, o, batılnıñ işini bitirir. Bir de baqarsıñız ki, batıl yoq olup ketken. (Allaһqa) yaqıştırğan sıfatlarıñızdan tolayı, yazıqlar olsun sizge!"
        cid: 0
  - verse: 19
    segments:
      - text: "Koklerde ve yerde kimler bar ise, Oña aittir. Onıñ uzurunda olğanlar, Oña ibadet hususında kibirlenmezler ve yorulmazlar."
        cid: 0
  - verse: 20
    segments:
      - text: "Olar bıqmadan-usanmadan, gece-kundüz (Allaһnı) tesbih eterler."
        cid: 0
  - verse: 21
    segments:
      - text: "Yoqsa (o muşrikler), yerden bir taqım tañrılar edindiler de, (olülerni) olar tirilteceklermi?"
        cid: 0
  - verse: 22
    segments:
      - text: "Eger yerde ve kokte Allaһtan başqa tañrılar olsa edi, yer ve kok, (bularnıñ nizamı) kesen-kes bozulıp keter edi. Demek ki, Arşnıñ Rabbi olğan Allaһ olarnıñ yaqıştırğan sıfatlarından uzaqtır. (Bu ayet Allaһnıñ birligini kostergen eñ kuçlü delillerden birini ortağa qoya. Bu delil - alemniñ nizamıdır. Aqiqaten, eger birden ziyade ilâh olsa edi, bular birbirinen ya añlaşır, ya da añlaşamaz ediler. Bir-birinen añlaşqanları, beraber aynı şeyni yapqanları, yaratqanları, alemge beraber nizam bergenleri taqdirde, ya biri digerine muhtac olur edi ki, muhtac olğan ilâh olalmaz; ya da yardımğa muhtac olmaz edi; bu vaziyette de, digerleriniñ barlığı kerekmez edi. Bu alda, Allaһ birdir. Diger taraftan, eger bu ilâhlar bir-birilerinen añlaşamasalar, biriniñ yapqanına, yaratqanına digeri qarşı çıqsa, o vaqıtta alemde nizamdan eser qalmaz; ayette de buyurılğanı kibi, «er ve kok bozulıp keter edi». Albuki, alemde aqransız bir nizam mevcuttır. Bu alda, Allaһ bardır ve birdir)."
        cid: 0
  - verse: 25
    segments:
      - text: "Allaһ, yapqanından mesul tutulamaz; olar ise, sorğuğa çekilecekler."
        cid: 0
  - verse: 26
    segments:
      - text: "Yoqsa, Ondan başqa bir taqım tañrılar edindilermi? De ki: Aydı, delillerñizni ketiriñ! İşte, mennen beraber olğanlarnıñ Kitabı ve menden evelkelerniñ Kitabı. Yoq, olarnıñ çoqu haqnı bilmezler; bu sebepten de, yuz çevirirler."
        cid: 0
  - verse: 27
    segments:
      - text: "Senden evel iç bir resul yollamadıq ki, oña: «Menden başqa İlâh yoqtır; o alda, maña qullıq etiñ», diye vahiy etken olmayıq."
        cid: 0
  - verse: 28
    segments:
      - text: "Rahman (olğan Allaһ, meleklerni) evlât etti, dediler. O bundan uzaqtır. Doğrusı, (melekler), lütf ve ihsanğa lâyıq qullardır."
        cid: 0
  - verse: 29
    segments:
      - text: "Ondan (emir almadan) evel qonuşmazlar; olar, sadece Onıñ emrinen areket eterler."
        cid: 0
  - verse: 30
    segments:
      - text: "Allaһ, olarnıñ oglerindekini de, artlarındakini de (yapqanlarını da, yapacaqlarını da) bilir. Allaһ rizasına irişkenlerden başqasına şefaat etmezler. Olar, Allaһ qorqusından titrerler!"
        cid: 0
  - verse: 31
    segments:
      - text: "Olardan er kim: «Tañrı O degil, menim!» dese, biz onı ceennemnen cezalandırırmız. İşte, biz, zalımlarğa boyle ceza berirmiz."
        cid: 0
  - verse: 32
    segments:
      - text: "İnkâr etkenler, koklernen yer bitişik bir alda eken, biz, olarnı bir-birinden qoparğanımıznı ve er canlı şeyni suvdan yaratqanımıznı korüp, tüşünmedilermi? Kene de, inanmazlarmı? (Tabiat ilimlerindeki inkişaf, bu ayetniñ daa yahşı añlaşıluvına yardımcı ola. Bunıñ kibi, bazı ilim adamlarına kore, semadaki cısımlar, vaqtı ile bir gaz topu alında edi. Zamanınen, bu gaz topundan topraqlar şeklinde parçalar qopqan ve sema boşluğına fırlanğan. Aynı şekilde dünyamız da bir gaz topu olğan kuneşten qopqan ve zaman içinde suvuyaraq qabuq bağlağan. Bu arada dünyamızdan yukselgen gazlar ve buvlar, qoyulaşaraq, yağmur şeklinde tekrar dünyağa tökülgen ve boylece, deñizler ve okean suvları meydanğa kelgen, suvda yosunlaşuvnen başlağan canlılar ilâhiy qanunlarğa kore inkişaf etken. Allaһ eñ mukemmel canlı tür olaraq da, kene içinde suv bulunğan ayrı bir çamurdan insannı yaratqan)."
        cid: 0
  - verse: 33
    segments:
      - text: "Olarnı sarsmasın diye, yer yuzünde bir taqım dağlar tiktik. O yerde keniş-keniş yollar açtıq. Ta ki, maqsatlarına irişsinler."
        cid: 0
  - verse: 34
    segments:
      - text: "Biz, kok yuzüni qorçalanğan bir tavan kibi yaptıq. Olar ise, kok yuzüniñ ayetlerinden yuz çevirirler. («Qorçalanğan tavan» - bir beñzetüvdir. Dünyanı sarğan atmosfera ve onıñ etrafındaki kok cısımları aqıllarğa ayret berecek bir tertip ve nizam içinde yaratılğan ve bu tertip nezaret etilmektedir. Tefsircilerge kore, bu yerde inkârcılarnıñ yuz çevirgenleri ifadesi «kok yuzüniñ ayetleri» demek - er biri Allaһnıñ barlığınıñ ve qudretiniñ birer delili olğan ay, kuneş ve diger kok cısımlarıdır)."
        cid: 0
  - verse: 35
    segments:
      - text: "O, geceni, kundüzni, kuneşni, aynı… yaratqandır. Er biri bir yolaqta dolaşmaqta."
        cid: 0
  - verse: 36
    segments:
      - text: "Biz, senden evel de, iç bir beşerge ebedeylik bermedik. Şimdi sen olseñ, sanki olar ebediy qalacaqlarmı?"
        cid: 0
  - verse: 37
    segments:
      - text: "Er bir canlı olümni tatar. Bir sınav olaraq, sizni hayırnen de, şerrnen de imtian etermiz ve siz ancaq bizge döndürileceksiñiz."
        cid: 0
  - verse: 38
    segments:
      - text: "(Resulım!) Kâfirler seni korgen vaqıtlarında: «Siziñ ilâhlarıñıznı tilinden tüşürmegen bumı?», diyerek, seni ep alayğa alırlar. Albuki, olar, çoq merhametli Allaһnıñ Kitabını inkâr etkenlerniñ tam ozleridir."
        cid: 0
  - verse: 39
    segments:
      - text: "İnsan, aceleci (bir tabiatta) yaratılğandır. Sizge ayetlerimni kosterecem; menden acele istemeñ."
        cid: 0
  - verse: 40
    segments:
      - text: "«Eger, deyler, doğru olsañız, ne zaman (kerçekleşecek) bu tehdit?»"
        cid: 0
  - verse: 41
    segments:
      - text: "İnkâr etkenler, yuzlerinden ve sırtlarından (sarğan) ateşni uzaqlaştırılmaycaq, ozlerine yardım bile etilmeycek zamannı bir bilseler edi!"
        cid: 0
  - verse: 42
    segments:
      - text: "Doğrusı, olarğa o (qıyamet) oyle apansızdan kelir ki, olarnı şaşmalatır. Artıq, ne red ete bilirler onı, ne de olarğa muhlet berilir."
        cid: 0
  - verse: 43
    segments:
      - text: "Ant olsun, senden evelki peyğamberlerge de alay etildi; amma olarnı alayğa alğanlarnı, o alay mevzusı etken şeyleri sardı-qoydı."
        cid: 0
  - verse: 44
    segments:
      - text: "De ki: Allaһtan sizni gece-kundüz kim qorçalaycaq? Buña rağmen, olar Rabblerini añuvdan yuz çevirirler."
        cid: 0
  - verse: 45
    segments:
      - text: "Yoqsa, olarnı bizden qorçalaycaq bir taqım ilâhları barmı? (O ilâh degen şeyleri) ozlerine bile yardım etecek kuçte degiller. Olar bizden de, alâqa ve destek kormezler."
        cid: 0
  - verse: 46
    segments:
      - text: "Ebet, olarnı da, atalarını da barındırdıq (yaşattıq). Niayet, omür olarğa (iç bitmeycek kibi) uzun keldi. Albuki, olar, bizim kelip (kâfirlerge ait) topraqnı çevresinden eksiltecegmizni kormezlermi? O alda, olar ustünlermi? (Tefsircilerniñ yorumına kore, ayette Allaһ çevresinden eksiltecegini haber bergen toprağı - muşriklerniñ o devirde uzerinde yaşağan topraqlarıdır. Bu ayet Mekkede engenine kore, Allaһ Taalânıñ Resulına, muşrikler yaşağan topraqlarnıñ bir mudetten soñ, musulmanlarnıñ eline keçecegini mujdelemesi - Qur’annıñ bir mucizesidir. Bazı tefsircilerge kore ise, sure Mekkede engeninen beraber, bu ayet Medinede nazil olğan. Buña kore manası: «… etrafından eksiltmekte olğanımıznı» şeklinde olacaq. Topraqnı eksiltmek demek - muşriklerniñ topraq ğayıp etüvleridir ki, bu da musulmanlarnıñ fethlerinen sadir olğan)."
        cid: 0
  - verse: 47
    segments:
      - text: "De ki: Men, sadece, vahiy ile sizni tenbiyelemektem. Tek sağırlar, tenbiyelengen vaqıtta bu davetni eşitmezler."
        cid: 0
  - verse: 48
    segments:
      - text: "Ant olsun, olarğa Rabbiñniñ azabından ufaq bir esinti toqunsa, iç şubesiz, «Vay, bizge! Aqiqaten, biz zalım kimseler ekenmiz!», derler."
        cid: 0
  - verse: 49
    segments:
      - text: "Biz, qıyamet kunü içün, adalet terazelerini qurarmız. Artıq kimsege, iç bir şekilde, aqsızlıq yapılmaz. (Yapılğan iş,) bir hardal danesi qadar olsa bile, onı (adalet terazesine) qoyarmız. Esap korüci olaraq biz (er keske) kâfimiz."
        cid: 0
  - verse: 50
    segments:
      - text: "Ant olsun, biz, Musa ve Harunğa, taqva saipleri içün bir ışıq, bir ogüt ve Furqannı berdik. (Ayetteki «Furqan» kelimesiniñ termin olaraq manası - haqnı batıldan, yani yahşı ve doğrunı yaman ve yañlşşan ayırğan, bunıñ içün olçüler ketirgen şey demektir ki, Qur’an-ı Kerimde bu söz, daa ziyade semaviy kitaplar içün qullanılğan. Bunıñ kibi de, Qur’annıñ bir adı da Furqandır)."
        cid: 0
  - verse: 51
    segments:
      - text: "(O taqva saipleri ki), olar, kormegenleri alda, Rabblerine yurekten sayğı kosterirler. Kene olar, qıyametten qorqqan kimselerdir."
        cid: 0
  - verse: 52
    segments:
      - text: "İşte, bu (Qur’an) da, bizim endirgen hayırlı ve faydalı bir ogütimizdir. Şimdi onı inkâr etmektesiñizmi?"
        cid: 0
  - verse: 53
    segments:
      - text: "Ant olsun, biz İbrahimge daa evel ruşdini bergen edik. Biz onı yahşı tanıy edik. (Tefsirlerde, ayetteki “ruşd” kelimesiniñ peyğamberlik manasına, yahut Az.İbrahimniñ peyğamberlikten evel de, saip olğan hidayeti ve doğrulığı manasında ekeni bildirilgen)."
        cid: 0
  - verse: 54
    segments:
      - text: "O, babasına ve qavmına: Şu qarşısına keçip, tabınayatqan eykelleriñiz de ne olmaqta? degen edi."
        cid: 0
  - verse: 55
    segments:
      - text: "Dediler ki: Biz, babalarımıznı bularğa tabınğan kimseler buldıq."
        cid: 0
  - verse: 56
    segments:
      - text: "Doğrusı, siz de, babalarıñız da, açıq bir sapıqlıq içindesiñiz, dedi."
        cid: 0
  - verse: 57
    segments:
      - text: "Dediler ki: Bizge, aqiqatnı ketirdiñmi, yoqsa sen oyunbazlardan birisiñmi?"
        cid: 0
  - verse: 58
    segments:
      - text: "Yoq, dedi, siziñ Rabbiñiz, yarattığı koklerniñ ve yerniñ de Rabbidir ve men buña şaatlıq eticilerdenim."
        cid: 0
  - verse: 59
    segments:
      - text: "Allaһqa yemin eterim ki, siz artıñıznı çevirip ketkenden soñ, putlarıñızğa bir oyun oynaycam! (Az.İbrahimniñ bu sözni gizli söylegeni ve onı yalıñız bir adam eşitkeni aqqında rivayet de bar)."
        cid: 0
  - verse: 60
    segments:
      - text: "Soñunda İbrahim olarnı parça-parça etti. Yalıñız olarnıñ buyugine toqunmadı; belki oña muracaat eterler diye. (Tefsirlerde aytılğanına kore, Az.İbrahim, putlarnı parlağandan soñ, baltanı, toqunmağan buyuk putnıñ boynuna asqan. Bir bayram şeñligine barğan halq qaytqanda putlarnıñ parçalanğanını kore)."
        cid: 0
  - verse: 61
    segments:
      - text: "Bunı tañrılarımızğa kim yaptı? Muaqqaq, o, zalımlardan biridir, dediler."
        cid: 0
  - verse: 62
    segments:
      - text: "(Bir qısmı:) Bularnı yamanlağan bir genç diye eşittik; oña İbrahim denile eken, dediler."
        cid: 0
  - verse: 63
    segments:
      - text: "O alda, dediler, onı aman insanlarnıñ kozü ogüne ketiriñ. Belki, şaatlıq eterler."
        cid: 0
  - verse: 64
    segments:
      - text: "Bunı ilâhlarımızğa sen ettiñmi, ey, İbrahim? dediler."
        cid: 0
  - verse: 65
    segments:
      - text: "Belki de, bu işni şu buyukleri yapqandır. Aydı, olardan sorañ; eger qonuşa iseler! dedi."
        cid: 0
  - verse: 66
    segments:
      - text: "Bunıñ uzerine, kendi vijdanlarına dönüp, (oz-ozlerine) “Zalımlar sizlersiñiz, sizler!”, dediler. (Ayet şu şekilde de, añlaşıla bilir: Soñra bir-birlerine dönerek: «(Putlarnı yanğız ve qorçalavsız bıraqqanıñız içün) aslı siz zalımsıñız», diyerek, birbirilerini qabaatladılar)."
        cid: 0
  - verse: 67
    segments:
      - text: "Soñ, tekrar eski inanç ve tartışuvlarına qayttılar: Sen bularnıñ qonuşmağanlarını pek alâ bilesiñ, dediler."
        cid: 0
  - verse: 68
    segments:
      - text: "İbrahim: Oyle ise, dedi, Allaһnı bıraqıp da, sizge iç bir fayda ve zarar bermegen bir şeyge alâ tabınacaqsıñızmı?"
        cid: 0
  - verse: 69
    segments:
      - text: "Sizge de, Allaһnı bıraqıp, tabınayatqan şeyleriñizge de, yazıqlar olsun! Siz aqıllanmazsıñızmı?"
        cid: 0
  - verse: 70
    segments:
      - text: "(Bir qısmı:) Eger iş yapacaq olsañız, onı yaqıñ da, tañrılarıñızğa yardım etiñ! dediler. (Az.İbrahimniñ qavmı bu teklifni qabul eterek, onı yaqmaq içün buyuk bir ateş azırladı ve eli-ayağı bağlı alda, ateşke attılar. İbrahim (a.s.) ise: «Maña Allaһnıñ saip çıquvı yeter; O, ne guzel bir saip!», diyerek, Allaһqa sığına edi)."
        cid: 0
  - verse: 71
    segments:
      - text: "Ey, ateş! İbrahim içün serinlik ve selâmetlik ol!», dedik."
        cid: 0
  - verse: 72
    segments:
      - text: "Boylece, oña bir tuzaq qurmaq istediler; faqat biz olarnı daa çoq ziyanğa oğrağanlar vaziyetine soqtıq."
        cid: 0
  - verse: 73
    segments:
      - text: "Biz, onı ve Luutnı qurtararaq, içinde cumle alemge bereketler bergen ulkemizge qavuştırdıq. (Az.İbrahim, qadını Sare ve qardaşınıñ oğlu ya da emcezadesi Luut, putperestlerniñ elinden qurtarılğan, tebliğlerini yayacaq bir ulkege qavuştrılğanlar. Tefsircilerge kore, bu bereketli ulke Şam ve Felestin bolgeleridir. Bu bolgelerniñ cumle alem içün bereketli oluvı ise, peyğamberlerniñ pek çoqunıñ o yerlerde yetişkeni ve dinlerni o yerlerden yayğanları sebebindendir)."
        cid: 0
  - verse: 74
    segments:
      - text: "Oña (İbrahimge), İshaqnı ve bir de Yaqubnı lütf ettik; er birini salih insanlar yaptıq."
        cid: 0
  - verse: 75
    segments:
      - text: "Olarnı, emrimiz boyunca doğru yolnı kostergen reberler yaptıq ve ozlerine hayırlı işler yapmaqnı, namaz qılmaqnı, zekât bermekni vahiy ettik. Olar daima bizge ibadet etken kimseler edi."
        cid: 0
  - verse: 76
    segments:
