          taptalğan ekinniñ qıymeti, qoyunlarnıñ qıymeti qadar olğanını köz ögüne alaraq,
          qoyunlarnıñ ekin saibine qarşılıq berülivini üküm ete. Oğlu Süleyman ise, şu ükümge
          kele: Ekin tarlası qoyun saiplerine berilmeli, olar, ziyandan evelki alına kelgenge
          qadar, tarlanıñ baqımını boyunlarına almalılar. Qoyunlar da, tarla saibine
          berilmeli, tarlası eski alına kelgenge qadar, bu qoyunlarnıñ sütünden, yününden ve
          qozularından faydalansınlar. Az.Davud, oğlunıñ bu ükmini begenerek, öz fikrinden
          vazgeçken).
