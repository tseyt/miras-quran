      - text: >-
          (Müşriklerniñ añlatqan vaziyeti, guya ileride musulmanlarnıñ oğraycağı zillet ve
          mağlübiyet vaziyeti edi. Olar, aqıllarına köre, qısqa zamanda musulmanlarnıñ
          zayıflaycağına, soñra da İslâmnıñ bus-bütün ortadan qalqacağına işana ediler.
          Ayetten añlaşılğanı üzre, Az. Peyğamber olarnıñ bu isteklerine qarşı Allahnıñ
          yardımına işana edi. Başqa bir yorumğa köre, müşriklerniñ añlatqan vaziyetlerinden
          maqsat, olarnıñ Qur'annı «sihr, hayal mahsulı, uydırma» kibi vasıflarnen
          esaslandırğanlarıdır. İşte, Az. Muhammed (s.a.), olarnıñ bu bötenleri qarşısında
          Qur'annı muzaffer etmek içün, Allahqa sığına ve Onıñ yardımına işana edi).
