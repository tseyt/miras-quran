surah_id: 20
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "Taa. haa."
        cid: 0
  - verse: 2
    segments:
      - text: "Biz Qur’annı saña, kuçlik çekersiñ diye degil, ancaq Allaһtan qorqqanlarğa bir ogüt olsun, diye endirdik."
        cid: 0
  - verse: 4
    segments:
      - text: "(Qur’an) yerni ve yuce koklerni yaratqan Allaһ tarafından peş-peşine endirilgendir."
        cid: 0
  - verse: 5
    segments:
      - text: "Rahman, Arşnı istiva etkendir. (Ya da:»Rahman, Arşnı ukmi altına alğandır». Baq. A’raaf, 7/54)."
        cid: 0
  - verse: 6
    segments:
      - text: "Koklerde, yerde ve ekisi arasında olğan şeylernen, topraqnıñ altında olğanlar ep Onıñdır."
        cid: 0
  - verse: 7
    segments:
      - text: "Eger sen, sözni açıq söyler iseñ, bilesiñ ki, O, gizlini de, gizliniñ gizlisini de bilir."
        cid: 0
  - verse: 8
    segments:
      - text: "Allaһ - ozünden başqa ilâh olmağandır. Eñ guzel isimler Oña mahsustır."
        cid: 0
  - verse: 9
    segments:
      - text: "(Resulım!) Musa (vaqiasınıñ) haberi saña kelip yettimi?"
        cid: 0
  - verse: 10
    segments:
      - text: "O vaqıtta, o bir ateş korgen ve ailesine: Bekleñ! Eminim ki, bir ateş kordim. Belki, ondan sizge bir meşale ketiririm ya da ateşniñ yanında bir reber taparım, degen edi. (Az.Musa, ailesinen birlikte Medyenden anası bulunğan Mısırğa kete edi. Yolda suvuq bir gecede, bir balaları doğğanınddan, ateşke itiyacıları bar edi. Aslında, onıñ korgen bu ateşi, ozüni vahiyge azırlamaq içün bir işaret edi)."
        cid: 0
  - verse: 11
    segments:
      - text: "O yerge barğanda oña (tarafımızdan): Ey, Musa! diye seslenildi:"
        cid: 0
  - verse: 12
    segments:
      - text: "Muaqqaq ki, men, ebet men seniñ Rabbiñim! Aman papuçlarıñnı çıqar! Çünki, sen muqaddes vadiy Tuvaadasıñ!"
        cid: 0
  - verse: 13
    segments:
      - text: "Men seni seçtim. Şimdi vahiy etilgenge qulaq ber."
        cid: 0
  - verse: 14
    segments:
      - text: "Muaqqaq ki, men, yalıñız men Allaһım. Menden başqa ilâh yoqtır. Maña qullıq et; meni añmaq içün namaz qıl."
        cid: 0
  - verse: 15
    segments:
      - text: "Qıyamet kunü mıtlaqa kelecek. Er kes peşinden çapqan şeyiniñ qarşılığını bulsın, diye aman-aman, onı (ozümden) gizleycem."
        cid: 0
  - verse: 16
    segments:
      - text: "Oña inanmağan ve nefsiniñ isteklerine uyğan kimseler saqın seni ondan (qıyametke inanuvdan) vazgeçtirmesin; soñunda mahv olursıñ!"
        cid: 0
  - verse: 17
    segments:
      - text: "Şu sağ eliñdeki nedir, ey, Musa?"
        cid: 0
  - verse: 18
    segments:
      - text: "O, menim asamdır, dedi, oña tayanır, onıñnen mallarıma yapraq silkitirim; menim oña başqa itiyacilarım da bar."
        cid: 0
  - verse: 19
    segments:
      - text: "Allaһ: Yerge at onı, ey, Musa! dedi."
        cid: 0
  - verse: 20
    segments:
      - text: "Onı aman yerge attı. Bir de ne korsin, tezde süyreklengen bir yılan degilmi!"
        cid: 0
  - verse: 21
    segments:
      - text: "Allaһ buyurdı: Al onı! Qorqma! Biz onı şimdi ilk alına ketirecekmiz."
        cid: 0
  - verse: 22
    segments:
      - text: "Bir de eliñni qoltuğıñnıñ altına soq ki, bir başqa mucize olmaq uzre, o qusursız ve lekesiz beyazlıqta çıqsın."
        cid: 0
  - verse: 23
    segments:
      - text: "Ta ki, saña, (boylece) eñ buyuk ayetlerimizden bazılarını kostereyik."
        cid: 0
  - verse: 24
    segments:
      - text: "Fıravunğa bar. Çünki, o çoq adden aştı."
        cid: 0
  - verse: 25
    segments:
      - text: "Musa: Rabbim! dedi, yuregime kenişlik ber."
        cid: 0
  - verse: 26
    segments:
      - text: "İşimni maña qolaylaştır."
        cid: 0
  - verse: 27
    segments:
      - text: "Tilimden (şu) bağnı çez."
        cid: 0
  - verse: 28
    segments:
      - text: "Ki sözümni añlasınlar."
        cid: 0
  - verse: 29
    segments:
      - text: "Maña ailemden bir de vezir (yardımci) ber,"
        cid: 0
  - verse: 30
    segments:
      - text: "Qardaşım Harunnı."
        cid: 0
  - verse: 31
    segments:
      - text: "Onıñ sayesinde arqamnı quvetlendir."
        cid: 0
  - verse: 32
    segments:
      - text: "Ve onı işime ortaq yap."
        cid: 0
  - verse: 33
    segments:
      - text: "Boylece, seni çoq-çoq tesbih eteyik."
        cid: 0
  - verse: 34
    segments:
      - text: "Ve çoq-çoq añayıq seni."
        cid: 0
  - verse: 35
    segments:
      - text: "Şubesiz, sen bizni kormektesiñ."
        cid: 0
  - verse: 36
    segments:
      - text: "Allaһ: Ey, Musa! dedi, istegeniñ saña berildi."
        cid: 0
  - verse: 37
    segments:
      - text: "Ant olsun, biz saña bir kere daa lütf etken edik."
        cid: 0
  - verse: 38
    segments:
      - text: "Bir vaqıt, vahiy etilecek şeyni anaña (şoyle) vahiy etken edik:"
        cid: 0
  - verse: 39
    segments:
      - text: "Musanı sandıqqa qoy; soñ onı deñizge (Nilge) taşla; deñiz onı yalığa atsın da, menim duşmanım ve onıñ duşmanı olğan birisi onı alsın. (Ey, Musa! Sevilmeñ) ve menim nezaretimde yetiştirilüviñ içün saña ozümden sevgi berdim. (Musa (a.s.)nıñ anası, diger oğlan balalar kibi, onıñ oğlunı da, Fıravunnıñ oldirüvinden saqına edi. Bu sebepten, yuqarıdaki ayette bildirilgen ilâhiy işaretke uyaraq, oğlunı deñizge ya da Nil nehrine taşladı. Qadını Asiyenen bağçasında kezingen Fıravun suvda korgen sandıqnı çıqartıp, içindeki balanı korgeninen, şaşmaladı; ayette bildirilgeni kibi, Allaһnıñ Musağa bir lütfi olaraq, balağa nisbeten biraz sevgi issini duydı. Az.Musanıñ tatası, qardaşına ne olğanını araştırıp-sürüştirer eken, oña bir emçek anası qıdırılğanını bildi. Bunı fırsat bilerek, Fıravunnıñ sarayına bardı:)"
        cid: 0
  - verse: 40
    segments:
      - text: "Hatırañdamı, qız qardaşıñ barıp, «Oña baqacaq birisini sizge tapayımmı?» dey edi. Boylece, seni, kozü, goñyuli sevinç tolsun ve ğam çekmesin, diye anaña qaytarıp berdik. Ve sen birisini oldürdiñ de, seni qasevetten qurtardıq. Seni yahşıdan-yahşı imtiandan keçirdik. Bunıñ içün yıllar boyu Medyen halqı arasında qaldıñ. Soñ, taqdirge kore (bu maqamğa) keldiñ, Ey, Musa! (Ayetniñ soñki cumlesi tefsirlerde deñişik şekillerde izaatlanğan olup, esaslıları şulardır: «Soñ, taqdirge kore, bu ulkege ya da peyğamberlik mertebesine iriştiñ, ey, Musa!», «Soñ peyğamberlik içün tayin ve taqdir etilgen bu kunge qadar keldiñ, ey, Musa!»)."
        cid: 0
  - verse: 41
    segments:
      - text: "Seni, ozüm içün elçi seçtim."
        cid: 0
  - verse: 42
    segments:
      - text: "Sen ve qardaşıñ birlikte, ayetlerimni alıp barıñ. Meni añuvda tenbellik etmeñ."
        cid: 0
  - verse: 43
    segments:
      - text: "Fıravunğa barıñ. Çünki, o, ziyade adden aştı."
        cid: 0
  - verse: 44
    segments:
      - text: "Oña yımşaq söz söyleñ. Belki, o aqılını başına toplar ya da qorqar."
        cid: 0
  - verse: 45
    segments:
      - text: "Dediler ki: Rabbimiz! Doğrusı, biz onıñ bizge artqaç derecede fena davranuvından yahut ziyade adden aşuvından qorqmaqtamız."
        cid: 0
  - verse: 46
    segments:
      - text: "Buyurdı ki: Qorqmañ, çünki, men siznen beraberim; eşitir ve korerim."
        cid: 0
  - verse: 47
    segments:
      - text: "Aydı, oña barıñ da, aytıñ ki: Biz seniñ Rabbiñniñ elçilerimiz. İsrail oğullarını aman biznen birlikte yolla; olarğa eziyet etme! Biz, seniñ Rabbiñden bir ayet ketirdik. Qurtılış - hidayetke uyğanlarnıñdır. (Tefsircilerniñ çoquna kore, ayetniñ soñki cumlesi, bur dua ve tilek cumlesi olmayıp, hidayetke uyğanlarnıñ, Fıravunnıñ eziyetinden erte-keç qurtulacaqları bildirilgen bir haber cumlesidir. İşte, bu söz ile Musa ve Harun, Fıravunğa bunı hatırlatmaqtadırlar)."
        cid: 0
  - verse: 48
    segments:
      - text: "Aqiqaten, bizge vahiy olundı ki: (Peyğamberlerni) yalanlağan ve yuz çevirgenlerge azap etilecek."
        cid: 0
  - verse: 49
    segments:
      - text: "Fıravun: Rabbiñiz de kim eken, ey, Musa? dedi."
        cid: 0
  - verse: 50
    segments:
      - text: "O da: Bizim Rabbimiz, er şeyge hilqatını (varlıq ve hususiyetini) berici, soñra da, doğru yolnı kostericidir, dedi."
        cid: 0
  - verse: 51
    segments:
      - text: "Fıravun: Oyle ise, evelki milletlerniñ alı ne olacaq? dedi."
        cid: 0
  - verse: 52
    segments:
      - text: "Musa: Olar aqqında bilgi Rabbimniñ yanında bir kitapta bulunır. Rabbim ne yañılır, ne de unutır, dedi."
        cid: 0
  - verse: 53
    segments:
      - text: "O, yerni sizge beşik yapıcı ve onda sizge yollar açıcı, kokten de suv endiricidir. Onıñnen biz çeşit ekinlerden çiftler çıqardıq."
        cid: 0
  - verse: 54
    segments:
      - text: "Aşañız; ayvanlarıñıznı otlatıñız. Şubesiz, bunda aqıl saipleri içün (Allaһnıñ qudretine) işaretler bardır."
        cid: 0
  - verse: 55
    segments:
      - text: "Sizni ondan (topraqtan) yarattıq; sizni kene o yerge qaytaracaqmız ve bir kere daa sizni ondan çıqaracaqmız."
        cid: 0
  - verse: 56
    segments:
      - text: "Ant olsun, biz oña (Fıravunğa) butün (bu) delillerimizni kosterdik; kene de yalanladı ve tireldi."
        cid: 0
  - verse: 57
    segments:
      - text: "Dedi ki: Bizni, yapqan tılsımıñnen yurtumızdan çıqarırım, diye keldiñmi, ey, Musa?"
        cid: 0
  - verse: 58
    segments:
      - text: "Oyle ise, muaqqaq surette biz de saña, tamam onıñ kibi bir ırım yapacaqmız. Şimdi sen, sennen bizim aramızda, ne sen, ne de biz muhalefet etmeycek uyğun bir yerde buluşmaq zamanını belgile."
        cid: 0
  - verse: 59
    segments:
      - text: "Musa: Buluşmaq zamanıñız, bayram kunü, quşluq vaqtında insanlarnıñ toplanuv zamanı olsun, dedi."
        cid: 0
  - verse: 60
    segments:
      - text: "Bunıñ uzerine Fıravun qaytıp ketti. İylesini (sihirbazlarını) topladı. Soñ, keri keldi. (Fıravun, usta tılsımcılarnı toplağan, tılsım eşyalarınen birlikte Musanıñ qarşısına çıqarğan. Az.Musa da, qardaşı Harunnen birlikte edi. Bayram şeñligi içün toplanğan halq, olacaqlarnı seyir etmek içün sabırzıslana edi)."
        cid: 0
  - verse: 61
    segments:
      - text: "Musa olarğa: Yazıq sizge! dedi, Allaһ aqqında yalan uydırmañ! Soñ O, bir azapnen tamırıñıznı keser! İftira etken, muaqqaq perişan olur."
        cid: 0
  - verse: 62
    segments:
      - text: "Bunıñ uzerine olar, vaziyetlerini ozara tartıştılar; gizli-gizli fısıldaştılar."
        cid: 0
  - verse: 63
    segments:
      - text: "Boyle dediler: «Bu ekisi, muaqqaq ki, sihirlerinen sizni yurtuñızdan çıqarmaq ve siziñ ornek yoluñıznı ortadan qaldırmaq istegen eki sehirbazdır sadece»."
        cid: 0
  - verse: 64
    segments:
      - text: "«Oyle ise, iyleñizni qurıñ; soñra, sıranen keliñ. Muaqqaq ki, bugun ustün kelgen qazanacaq»."
        cid: 0
  - verse: 65
    segments:
      - text: "Dediler ki: Ey, Musa! Ya sen at, ya da evel atqan biz olayıq."
        cid: 0
  - verse: 66
    segments:
      - text: "Yoq, siz atıñ, dedi. Bir de baqtı ki, tılsımları sayesinde yipleri ve sopaları oña kerçekten çapışayatqan kibi korüle."
        cid: 0
  - verse: 67
    segments:
      - text: "Musa birden içinde bir qorqu duydı."
        cid: 0
  - verse: 68
    segments:
      - text: "«Qorqma! dedik, ustün kelecek qatiyen sensiñ»."
        cid: 0
  - verse: 69
    segments:
      - text: "«Sağ eliñdekini at da, olarnıñ yapqanlarını yutsın. Yapqanları, sadece bir tılsımcı iylesidir. Tılsımcı ise, ne yerge barsa, (ne yapsa) qurtulışqa irişalmaz». (Az.Musa vahiyge uyaraq, elindeki asanı yerge atqan, bir mucize ifadesi olaraq, acderha alına kelgen asa, kerçekten, Fıravunnıñ sihirbazlarınıñ tılsıml yiplerini ve sopalarını yuta qoyğan)."
        cid: 0
  - verse: 70
    segments:
      - text: "Bunıñ uzerine, sihirbazlar secdege qapandılar; «Harunnıñ ve Musanıñ Rabbinne iman ettik», dediler."
        cid: 0
  - verse: 71
    segments:
      - text: "(Fıravun) boyle dedi: Men sizge izin bermeden evel, oña inandıñız, oylemi! Aqiqat şu ki, o, sizge tılsım ogretken buyugiñizdir. Şimdi elleriñiznen ayaqlarıñıznı, tüşünmeden, çaprazlama kesecem ve sizni hurma dallarına asacam! Boylece, angimizniñ azabımız daa şiddetli ve devamlı olğanını yahşıca añlaycaqsıñız. (Menfaatqa tayanğan birlik ve beraberlikniñ omüri de menfaatqa bağlıdır. Menfaat bitkeninen, birlik dağılır, menfaatlar çatıiqanınen, korünişte mevcut dostluqlar duşmanlıqqa çevirilir. Sihirbazlar iman etmeyip, Fıravunnı desteklevde devam etseler edi, maqbul adamlar olacaq, nimetler içinde yaldaycaq ediler. Ancaq iman kozlerini açqanınen, baqiyni (ebediy nimetni) faniyden (keçiciden) ustün kordiler)."
        cid: 0
  - verse: 72
    segments:
      - text: "Dediler ki: «Seni, bizge kelgen açıq-açıq mucizelerden ve bizni yaratqandan ustün tutalmaymız. Oyle ise, yapacağıñnı yap! Sen yalıñız bu dünya ayatında ukümiñni keçire bilirsiñ»."
        cid: 0
  - verse: 73
    segments:
      - text: "«Bizge hatalırımıznı ve seniñ bizge zornen yaptırğan tılsımnı bağışlavı içün, Rabbimizge iman ettik. Allaһ, (mukâfatı) eñ hayırlı ve (cezası) eñ devamlı olğandır»."
        cid: 0
  - verse: 74
    segments:
      - text: "Şu yeri muaqqaq ki, kim Rabbine gunahkâr olaraq barsa, ceennem tamam onıñ içündir. O ise, o yerde ne olür, ne de yaşar!"
        cid: 0
  - verse: 75
    segments:
      - text: "Kim de yahşı davranışlarda bulunğan bir mu’min olaraq, oña barsa, ustün dereceler, işte, tamam bular içündir."
        cid: 0
  - verse: 76
    segments:
      - text: "İçinde ebediy qalacaqları, zemeninden irmaqlar aqqan Adn cenetleri! İşte, arınğanlarnıñ mukâfatı budır."
        cid: 0
  - verse: 77
    segments:
      - text: "Ant olsun ki, biz Musağa: Qullarımnen birlikte geceleyin yolğa çıq da, (sizge) yetişilüvinden qorqmadan ve (boğuluvdan) saqınmadan, olarğa deñizde quru bir yol aç, diye vahiy etken edik. (Bu emir uzerine Az.Musa aqşam qaranlığında yolğa çıqtı. Fıravun bunı bilgen edi)."
        cid: 0
  - verse: 78
    segments:
      - text: "Bunıñ ustüne, o, askerlerinen birlikte, olarnıñ peşine tüşti. Deñiz olarnı komüp, boğa qoydı."
        cid: 0
  - verse: 79
    segments:
      - text: "Fıravun qavmını saptırdı, doğru yolğa yeteklemedi. (Peyğamberniñ davetine qulaq asacaq yerde, onı ve mu’minlerni cezalandıruvğa areket etken Fıravun, Allaһnıñ qudretinen, mu’minlerge açılğan deñiz yolunıñ, Fıravun ve ordusı uzerine qapaluvınen elâk oldı)."
        cid: 0
  - verse: 80
    segments:
      - text: "Ey, İsrail oğulları! Sizni duşmanıñızdan qurtardıq; Tuurnıñ sağ tarafına (kelüviñiz içün) sizge vade berdik ve sizge qudret elvasınen bodene eti lütf ettik. (Tefsirlerde añlatılğanına kore, Allaһ Taalâ, Az.Musağa, Tuur dağınıñ sağ tarafına kelüvi, ayrıca, Tevratnıñ nazil oluvı sırasında azır olmaq uzre, seçecek yetmiş adamlıq bir gruppanı da beraber alıp kelüvi içün, bir muddet bergen edi. Baq. Baqara, 2/57)."
        cid: 0
  - verse: 81
    segments:
      - text: "Sizge rızıq olaraq, bergenlerimizniñ temizlerinden aşañ, bu hususta adden aşuv ve nankorlik de etmeñ; soñunda sizni ğadabım çarpar. Er kim ki, onı ğadabım çarpsa, aqiqaten o, yıqılıp ketkendir."
        cid: 0
  - verse: 82
    segments:
      - text: "Şu da muaqqaq ki, men, tövbe etken, inanğan ve faydalı iş yapqan, soñra (boylece) doğru yolda yurgen kimseni bağışlarım. (Az.Musa qavmını Mısırdan çıqarıp, Sinağa keçirgenden soñ, Cenab-ı Haqtan vahiy almaq uzre, alel-acele Tuurğa keter eken, qavmınıñ başında oz yerine Az.Harunnı qaldırğan edi. Allaһ Taalâ Az.Musağa boyle buyurğan edi:)"
        cid: 0
  - verse: 83
    segments:
      - text: "Seni aceleliknen qavmıñdan ayrılmağa yeteklegen nedir, ey, Musa!"
        cid: 0
  - verse: 84
    segments:
      - text: "Musa: İşte, dedi, olar da menim peşimdeler. Men, memnun olursıñ diye, saña acele keldim, Rabbim."
        cid: 0
  - verse: 85
    segments:
      - text: "Allaһ buyurdı: Senden soñ biz qavmıñnı (Harunnen qalğan İsrail oğularını) imtian ettik ve Saamiriy olarnı yoldan çıqardı. (Rivayetke kore, Saamiriy - İsrail oğularınıñ Saamire qabilesine mensüp edi. Bu kişi bir buzavnıñ eykelini yasağan ve halqqa onıñ tañrı olğanını telqin etüv suretinen, olarnı Musa ve Harunnıñ haq dininden uzaqlaştırmağa areket etken edi)."
        cid: 0
  - verse: 86
    segments:
      - text: "Bunıñ uzerine Musa, opkeli ve kederli olaraq qavmına qayttı. Ey, qavmım! dedi, Rabbiñiz sizge guzel bir vadede bulunmağan edimi? Bu alda, sizge vaqıt çoq uzun keldimi, yoqsa, ustüñizge Rabbiñizniñ ğadabı enüvini istediñizmi ki, maña olğan vadeñizden qayttıñız?"
        cid: 0
  - verse: 87
    segments:
      - text: "Dediler ki: Biz saña bergen vademizden, oz qudret ve irademiznen qaytmadıq. Faqat biz, o qavmnıñ (mısırlılarnıñ) ziynet eşyasından bir taqım ağırlıqlar yuklengen, soñra da olarnı atqan edik; aynı şekilde Saamiriy de atqan edi. (Saamiriyniñ telqinınen ziynetlerni iritmek ve buzav yapmaq içün ateşke attılar)."
        cid: 0
  - verse: 88
    segments:
