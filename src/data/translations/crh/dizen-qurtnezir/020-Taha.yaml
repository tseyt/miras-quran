surah_id: 20
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >
          Taa. haa.
        cid: 0
  - verse: 2
    segments:
      - text: >
          Biz Qur'annı saña, küçlik çekersiñ diye degil, ancaq Allahtan qorqqanlarğa bir
          ögüt olsun, diye endirdik.
        cid: 0
  - verse: 3
    segments:
      - text: >
          [2 ayetine baq.]
        cid: 0
  - verse: 4
    segments:
      - text: >
          (Qur'an) yerni ve yüce köklerni yaratqan Allah tarafından peş-peşine
          endirilgendir.
        cid: 0
  - verse: 5
    segments:
      - text: >
          Rahman, Arşnı istiva etkendir. (YA da:»Rahman, Arşnı ükmi altına alğandır». Baq.
          A'raaf, 7/54).
        cid: 0
  - verse: 6
    segments:
      - text: >
          Köklerde, yerde ve ekisi arasında olğan şeylernen, topraqnıñ altında olğanlar -
          ep Onıñdır.
        cid: 0
  - verse: 7
    segments:
      - text: >
          Eger sen, sözni açıq söyler iseñ, bilesiñ ki, O, gizlini de, gizliniñ gizlisini
          de bilir.
        cid: 0
  - verse: 8
    segments:
      - text: >
          Allah - özünden başqa ilâh olmağandır. Eñ güzel isimler Oña mahsustır.
        cid: 0
  - verse: 9
    segments:
      - text: >
          (Resulım!) Musa (vaqiasınıñ) haberi saña kelip yettimi?
        cid: 0
  - verse: 10
    segments:
      - text: >
          O vaqıtta, o bir ateş körgen ve ailesine: Bekleñ! Eminim ki, bir ateş kördim.
          Belki, ondan sizge bir meşale ketiririm ya da ateşniñ yanında bir reber taparım,
          degen edi. (Az.Musa, ailesinen birlikte Medyenden anası bulunğan Mısırğa kete
          edi. Yolda suvuq bir gecede, bir balaları doğğanından, ateşke itiyacıları bar
          edi. Aslında, onıñ körgen bu ateşi, özüni vahiyge azırlamaq içün bir işaret
          edi).
        cid: 0
  - verse: 11
    segments:
      - text: >
          O yerge barğanda oña (tarafımızdan): Ey, Musa! diye seslenildi:
        cid: 0
  - verse: 12
    segments:
      - text: >
          Muaqqaq ki, men, ebet men seniñ Rabbiñim! Aman papuçlarıñnı çıqar! Çünki, sen
          muqaddes vadiy Tuvaadasıñ!
        cid: 0
  - verse: 13
    segments:
      - text: >
          Men seni seçtim. Şimdi vahiy etilgenge qulaq ber.
        cid: 0
  - verse: 14
    segments:
      - text: >
          Muaqqaq ki, men, yalıñız men Allahım. Menden başqa ilâh yoqtır. Maña qullıq et;
          meni añmaq içün namaz qıl.
        cid: 0
  - verse: 15
    segments:
      - text: >
          Qıyamet künü mıtlaqa kelecek. Er kes peşinden çapqan şeyiniñ qarşılığını bulsın,
          diye aman-aman, onı (özümden) gizleycem.
        cid: 0
  - verse: 16
    segments:
      - text: >
          Oña inanmağan ve nefsiniñ isteklerine uyğan kimseler saqın seni ondan (qıyametke
          inanuvdan) vazgeçtirmesin; soñunda mahv olursıñ!
        cid: 0
  - verse: 17
    segments:
      - text: >
          Şu sağ eliñdeki nedir, ey, Musa?
        cid: 0
  - verse: 18
    segments:
      - text: >
          O, menim asamdır, dedi, oña tayanır, onıñnen mallarıma yapraq silkitirim; menim
          oña başqa itiyacilarım da bar.
        cid: 0
  - verse: 19
    segments:
      - text: >
          Allah: Yerge at onı, ey, Musa! dedi.
        cid: 0
  - verse: 20
    segments:
      - text: >
          Onı aman yerge attı. Bir de ne körsin, tezde süyreklengen bir yılan degilmi!
        cid: 0
  - verse: 21
    segments:
      - text: >
          Allah buyurdı: Al onı! Qorqma! Biz onı şimdi ilk alına ketirecekmiz.
        cid: 0
  - verse: 22
    segments:
      - text: >
          Bir de eliñni qoltuğıñnıñ altına soq ki, bir başqa mucize olmaq üzre, o qusursız
          ve lekesiz beyazlıqta çıqsın.
        cid: 0
  - verse: 23
    segments:
      - text: >
          Ta ki, saña, (böylece) eñ büyük ayetlerimizden bazılarını köstereyik.
        cid: 0
  - verse: 24
    segments:
      - text: >
          Fıravunğa bar. Çünki, o çoq adden aştı.
        cid: 0
  - verse: 25
    segments:
      - text: >
          Musa: Rabbim! dedi, yüregime kenişlik ber.
        cid: 0
  - verse: 26
    segments:
      - text: >
          İşimni maña qolaylaştır.
        cid: 0
  - verse: 27
    segments:
      - text: >
          Tilimden (şu) bağnı çez.
        cid: 0
  - verse: 28
    segments:
      - text: >
          Ki sözümni añlasınlar.
        cid: 0
  - verse: 29
    segments:
      - text: >
          Maña ailemden bir de vezir (yardımci) ber,
        cid: 0
  - verse: 30
    segments:
      - text: >
          Qardaşım Harunnı.
        cid: 0
  - verse: 31
    segments:
      - text: >
          Onıñ sayesinde arqamnı quvetlendir.
        cid: 0
  - verse: 32
    segments:
      - text: >
          Ve onı işime ortaq yap.
        cid: 0
  - verse: 33
    segments:
      - text: >
          Böylece, seni çoq-çoq tesbih eteyik.
        cid: 0
  - verse: 34
    segments:
      - text: >
          Ve çoq-çoq añayıq seni.
        cid: 0
  - verse: 35
    segments:
      - text: >
          Şübesiz, sen bizni körmektesiñ.
        cid: 0
  - verse: 36
    segments:
      - text: >
          Allah: Ey, Musa! dedi, istegeniñ saña berildi.
        cid: 0
  - verse: 37
    segments:
      - text: >
          Ant olsun, biz saña bir kere daa lütf etken edik.
        cid: 0
  - verse: 38
    segments:
      - text: >
          Bir vaqıt, vahiy etilecek şeyni anaña (şöyle) vahiy etken edik:
        cid: 0
  - verse: 39
    segments:
      - text: >
          Musanı sandıqqa qoy; soñ onı deñizge (Nilge) taşla; deñiz onı yalığa atsın da,
          menim duşmanım ve onıñ duşmanı olğan birisi onı alsın. (Ey, Musa! Sevilmeñ) ve
          menim nezaretimde yetiştirilüviñ içün saña özümden sevgi berdim. (Musa (a.s.)nıñ
          anası, diger oğlan balalar kibi, onıñ oğlunı da, Fıravunnıñ öldirüvinden saqına
          edi. Bu sebepten, yuqarıdaki ayette bildirilgen ilâhiy işaretke uyaraq, oğlunı
          deñizge ya da Nil nehrine taşladı. Qadını Asiyenen bağçasında kezingen Fıravun
          suvda körgen sandıqnı çıqartıp, içindeki balanı körgeninen, şaşmaladı; ayette
          bildirilgeni kibi, Allahnıñ Musağa bir lütfi olaraq, balağa nisbeten biraz sevgi
          issini duydı. Az.Musanıñ tatası, qardaşına ne olğanını araştırıp-sürüştirer
          eken, oña bir emçek anası qıdırılğanını bildi. Bunı fırsat bilerek, Fıravunnıñ
          sarayına bardı:)
        cid: 0
  - verse: 40
    segments:
      - text: >
          Hatırañdamı, qız qardaşıñ barıp, «Oña baqacaq birisini sizge tapayımmı?» dey
          edi. Böylece, seni, közü, goñüli sevinç tolsun ve ğam çekmesin, diye anaña
          qaytarıp berdik. Ve sen birisini öldürdiñ de, seni qasevetten qurtardıq. Seni
          yahşıdan-yahşı imtiandan keçirdik. Bunıñ içün yıllar boyu Medyen halqı arasında
          qaldıñ. Soñ, taqdirge köre (bu maqamğa) keldiñ, Ey, Musa! (Ayetniñ soñki cumlesi
          tefsirlerde deñişik şekillerde izaatlanğan olup, esaslıları şulardır: «Soñ,
          taqdirge köre, bu ülkege ya da peyğamberlik mertebesine iriştiñ, ey, Musa!»,
          «Soñ peyğamberlik içün tayin ve taqdir etilgen bu künge qadar keldiñ, ey,
          Musa!»).
        cid: 0
  - verse: 41
    segments:
      - text: >
          Seni, özüm içün elçi seçtim.
        cid: 0
  - verse: 42
    segments:
      - text: >
          Sen ve qardaşıñ birlikte, ayetlerimni alıp barıñ. Meni añuvda tenbellik etmeñ.
        cid: 0
  - verse: 43
    segments:
      - text: >
          Fıravunğa barıñ. Çünki, o, ziyade adden aştı.
        cid: 0
  - verse: 44
    segments:
      - text: >
          Oña yımşaq söz söyleñ. Belki, o aqılını başına toplar ya da qorqar.
        cid: 0
  - verse: 45
    segments:
      - text: >
          Dediler ki: Rabbimiz! Doğrusı, biz onıñ bizge artqaç derecede fena davranuvından
          yahut ziyade adden aşuvından qorqmaqtamız.
        cid: 0
  - verse: 46
    segments:
      - text: >
          Buyurdı ki: Qorqmañ, çünki, men siznen beraberim; eşitir ve körerim.
        cid: 0
  - verse: 47
    segments:
      - text: >
          Aydı, oña barıñ da, aytıñ ki: Biz seniñ Rabbiñniñ elçilerimiz. İsrail oğullarını
          aman biznen birlikte yolla; olarğa eziyet etme! Biz, seniñ Rabbiñden bir ayet
          ketirdik. Qurtılış - hidayetke uyğanlarnıñdır. (Tefsircilerniñ çoquna köre,
          ayetniñ soñki cumlesi, bur dua ve tilek cumlesi olmayıp, hidayetke uyğanlarnıñ,
          Fıravunnıñ eziyetinden erte-keç qurtulacaqları bildirilgen bir haber cumlesidir.
          İşte, bu söz ile Musa ve Harun, Fıravunğa bunı hatırlatmaqtadırlar).
        cid: 0
  - verse: 48
    segments:
      - text: >
          Aqiqaten, bizge vahiy olundı ki: (Peyğamberlerni) yalanlağan ve yüz
          çevirgenlerge azap etilecek.
        cid: 0
  - verse: 49
    segments:
      - text: >
          Fıravun: Rabbiñiz de kim eken, ey, Musa? dedi.
        cid: 0
  - verse: 50
    segments:
      - text: >
          O da: Bizim Rabbimiz, er şeyge hilqatını (varlıq ve hususiyetini) berici, soñra
          da, doğru yolnı köstericidir, dedi.
        cid: 0
  - verse: 51
    segments:
      - text: >
          Fıravun: Öyle ise, evelki milletlerniñ alı ne olacaq? dedi.
        cid: 0
  - verse: 52
    segments:
      - text: >
          Musa: Olar aqqında bilgi Rabbimniñ yanında bir kitapta bulunır. Rabbim ne
          yañılır, ne de unutır, dedi.
        cid: 0
  - verse: 53
    segments:
      - text: >
          O, yerni sizge beşik yapıcı ve onda sizge yollar açıcı, kökten de suv
          endiricidir. Onıñnen biz çeşit ekinlerden çiftler çıqardıq.
        cid: 0
  - verse: 54
    segments:
      - text: >
          Aşañız; ayvanlarıñıznı otlatıñız. Şübesiz, bunda aqıl saipleri içün (Allahnıñ
          qudretine) işaretler bardır.
        cid: 0
  - verse: 55
    segments:
      - text: >
          Sizni ondan (topraqtan) yarattıq; sizni kene o yerge qaytaracaqmız ve bir kere
          daa sizni ondan çıqaracaqmız.
        cid: 0
  - verse: 56
    segments:
      - text: >
          Ant olsun, biz oña (Fıravunğa) bütün (bu) delillerimizni kösterdik; kene de
          yalanladı ve tireldi.
        cid: 0
  - verse: 57
    segments:
      - text: >
          Dedi ki: Bizni, yapqan tılsımıñnen yurtumızdan çıqarırım, diye keldiñmi, ey,
          Musa?
        cid: 0
  - verse: 58
    segments:
      - text: >
          Öyle ise, muaqqaq surette biz de saña, tamam onıñ kibi bir ırım yapacaqmız.
          Şimdi sen, sennen bizim aramızda, ne sen, ne de biz muhalefet etmeycek uyğun bir
          yerde buluşmaq zamanını belgile.
        cid: 0
  - verse: 59
    segments:
      - text: >
          Musa: Buluşmaq zamanıñız, bayram künü, quşluq vaqtında insanlarnıñ toplanuv
          zamanı olsun, dedi.
        cid: 0
  - verse: 60
    segments:
      - text: >
          Bunıñ üzerine Fıravun qaytıp ketti. İylesini (sihirbazlarını) topladı. Soñ, keri
          keldi. (Fıravun, usta tılsımcılarnı toplağan, tılsım eşyalarınen birlikte
          Musanıñ qarşısına çıqarğan. Az.Musa da, qardaşı Harunnen birlikte edi. Bayram
          şeñligi içün toplanğan halq, olacaqlarnı seyir etmek içün sabırzıslana edi).
        cid: 0
  - verse: 61
    segments:
      - text: >
          Musa olarğa: Yazıq sizge! dedi, Allah aqqında yalan uydırmañ! Soñ O, bir azapnen
          tamırıñıznı keser! İftira etken, muaqqaq perişan olur.
        cid: 0
  - verse: 62
    segments:
      - text: >
          Bunıñ üzerine olar, vaziyetlerini özara tartıştılar; gizli-gizli fısıldaştılar.
        cid: 0
  - verse: 63
    segments:
      - text: >
          Böyle dediler: «Bu ekisi, muaqqaq ki, sihirlerinen sizni yurtuñızdan çıqarmaq ve
          siziñ örnek yoluñıznı ortadan qaldırmaq istegen eki sehirbazdır sadece».
        cid: 0
  - verse: 64
    segments:
      - text: >
          «Öyle ise, iyleñizni qurıñ; soñra, sıranen keliñ. Muaqqaq ki, bugün üstün kelgen
          qazanacaq».
        cid: 0
  - verse: 65
    segments:
      - text: >
          Dediler ki: Ey, Musa! YA sen at, ya da evel atqan biz olayıq.
        cid: 0
  - verse: 66
    segments:
      - text: >
          Yoq, siz atıñ, dedi. Bir de baqtı ki, tılsımları sayesinde yipleri ve sopaları
          oña kerçekten çapışayatqan kibi körüle.
        cid: 0
  - verse: 67
    segments:
      - text: >
          Musa birden içinde bir qorqu duydı.
        cid: 0
  - verse: 68
    segments:
      - text: >
          «Qorqma! dedik, üstün kelecek qatiyen sensiñ».
        cid: 0
  - verse: 69
    segments:
      - text: >
          «Sağ eliñdekini at da, olarnıñ yapqanlarını yutsın. Yapqanları, sadece bir
          tılsımcı iylesidir. Tılsımcı ise, ne yerge barsa, (ne yapsa) qurtulışqa
          irişalmaz». (Az.Musa vahiyge uyaraq, elindeki asanı yerge atqan, bir mucize
          ifadesi olaraq, acderha alına kelgen asa, kerçekten, Fıravunnıñ sihirbazlarınıñ
          tılsımlı yiplerini ve sopalarını yuta qoyğan).
        cid: 0
  - verse: 70
    segments:
      - text: >
          Bunıñ üzerine, sihirbazlar secdege qapandılar; «Harunnıñ ve Musanıñ Rabbinne
          iman ettik», dediler.
        cid: 0
  - verse: 71
    segments:
      - text: >
          (Fıravun) böyle dedi: Men sizge izin bermeden evel, oña inandıñız, öylemi!
          Aqiqat şu ki, o, sizge tılsım ögretken büyügiñizdir. Şimdi elleriñiznen
          ayaqlarıñıznı, tüşünmeden, çaprazlama kesecem ve sizni hurma dallarına asacam!
          Böylece, angimizniñ azabımız daa şiddetli ve devamlı olğanını yahşıca
          añlaycaqsıñız. (Menfaatqa tayanğan birlik ve beraberlikniñ ömüri de menfaatqa
          bağlıdır. Menfaat bitkeninen, birlik dağılır, menfaatlar çatışqanınen, körünişte
          mevcut dostluqlar duşmanlıqqa çevirilir. Sihirbazlar iman etmeyip, Fıravunnı
          desteklevde devam etseler edi, maqbul adamlar olacaq, nimetler içinde yaldaycaq
          ediler. Ancaq iman közlerini açqanınen, baqiyni (ebediy nimetni) faniyden
          (keçiciden) üstün kördiler).
        cid: 0
  - verse: 72
    segments:
      - text: >
          Dediler ki: «Seni, bizge kelgen açıq-açıq mucizelerden ve bizni yaratqandan
          üstün tutalmaymız. Öyle ise, yapacağıñnı yap! Sen yalıñız bu dünya ayatında
          ükümiñni keçire bilirsiñ».
        cid: 0
  - verse: 73
    segments:
      - text: >
          «Bizge hatalırımıznı ve seniñ bizge zornen yaptırğan tılsımnı bağışlavı içün,
          Rabbimizge iman ettik. Allah, (mükâfatı) eñ hayırlı ve (cezası) eñ devamlı
          olğandır».
        cid: 0
  - verse: 74
    segments:
      - text: >
          Şu yeri muaqqaq ki, kim Rabbine günahkâr olaraq barsa, ceennem tamam onıñ
          içündir. O ise, o yerde ne ölür, ne de yaşar!
        cid: 0
  - verse: 75
    segments:
      - text: >
          Kim de yahşı davranışlarda bulunğan bir mü'min olaraq, oña barsa, üstün
          dereceler, işte, tamam bular içündir.
        cid: 0
  - verse: 76
    segments:
      - text: >
          İçinde ebediy qalacaqları, zemeninden irmaqlar aqqan Adn cenetleri! İşte,
          arınğanlarnıñ mükâfatı budır.
        cid: 0
  - verse: 77
    segments:
      - text: >
          Ant olsun ki, biz Musağa: Qullarımnen birlikte geceleyin yolğa çıq da, (sizge)
          yetişilüvinden qorqmadan ve (boğuluvdan) saqınmadan, olarğa deñizde quru bir yol
          aç, diye vahiy etken edik. (Bu emir üzerine Az.Musa aqşam qaranlığında yolğa
          çıqtı. Fıravun bunı bilgen edi).
        cid: 0
  - verse: 78
    segments:
      - text: >
          Bunıñ üstüne, o, askerlerinen birlikte, olarnıñ peşine tüşti. Deñiz olarnı
          kömüp, boğa qoydı.
        cid: 0
  - verse: 79
    segments:
      - text: >
          Fıravun qavmını saptırdı, doğru yolğa yeteklemedi. (Peyğamberniñ davetine qulaq
          asacaq yerde, onı ve mü'minlerni cezalandıruvğa areket etken Fıravun, Allahnıñ
          qudretinen, mü'minlerge açılğan deñiz yolunıñ, Fıravun ve ordusı üzerine
          qapaluvınen elâk oldı).
        cid: 0
  - verse: 80
    segments:
      - text: >
          Ey, İsrail oğulları! Sizni duşmanıñızdan qurtardıq; Tuurnıñ sağ tarafına
          (kelüviñiz içün) sizge vade berdik ve sizge qudret elvasınen bödene eti lütf
          ettik. (Tefsirlerde añlatılğanına köre, Allah Taalâ, Az.Musağa, Tuur dağınıñ sağ
          tarafına kelüvi, ayrıca, Tevratnıñ nazil oluvı sırasında azır olmaq üzre,
          seçecek yetmiş adamlıq bir gruppanı da beraber alıp kelüvi içün, bir müddet
          bergen edi. Baq. Baqara, 2/57).
        cid: 0
  - verse: 81
    segments:
      - text: >
          Sizge rızıq olaraq, bergenlerimizniñ temizlerinden aşañ, bu hususta adden aşuv
          ve nankorlik de etmeñ; soñunda sizni ğadabım çarpar. Er kim ki, onı ğadabım
          çarpsa, aqiqaten o, yıqılıp ketkendir.
        cid: 0
  - verse: 82
    segments:
      - text: >
          Şu da muaqqaq ki, men, tövbe etken, inanğan ve faydalı iş yapqan, soñra
          (böylece) doğru yolda yürgen kimseni bağışlarım. (Az.Musa qavmını Mısırdan
          çıqarıp, Sinağa keçirgenden soñ, Cenab-ı Haqtan vahiy almaq üzre, alel-acele
          Tuurğa keter eken, qavmınıñ başında öz yerine Az.Harunnı qaldırğan edi. Allah
          Taalâ Az.Musağa böyle buyurğan edi:)
        cid: 0
  - verse: 83
    segments:
      - text: >
          Seni aceleliknen qavmıñdan ayrılmağa yeteklegen nedir, ey, Musa!
        cid: 0
  - verse: 84
    segments:
      - text: >
          Musa: İşte, dedi, olar da menim peşimdeler. Men, memnun olursıñ diye, saña acele
          keldim, Rabbim.
        cid: 0
  - verse: 85
    segments:
      - text: >
          Allah buyurdı: Senden soñ biz qavmıñnı (Harunnen qalğan İsrail oğularını) imtian
