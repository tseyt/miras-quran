      - text: >-
          (Bu ayette Allah duşmanlıqta adden aşmamaqnı, duşman bir toplulıqnıñ bir kün dost
          ola bilecegini bildirgen. Bunıñ kibi, Peyğamberniñ ve musulmanlarnıñ can duşmanı
          olğan Mekke ve etrafındaki müşriklerniñ çoqu soñundan İslâmğa kirgenler, olarnıñ
          balaları, Allah yolunda cihad etken mü'minler olğanlar. Böylece, ayette bildirilgen
          ilâhiy vade yerine kelgen).
