      - text: >-
          (Ayetniñ nazil oluvına sebep şu: Haatib b. Beltea adlı sahabi, Az.Peyğamberniñ gizli
          tutqan Mekkeni fetih etüv niyetini Sare adındaki yırcı kâfir bir qadınğa bergen
          mektübinen, Mekke müşriklerine bildirmek istegen edi. Hatib, Mekkede qalğan evlât ve
          ailesine telükeni haber bermek maqsadınen, böyle bir işke kirişken edi. Cenab-ı Haq
          bu vaziyetni Az.Peyğamberge bildirdi. Resulullah Mekkege qaytmaqta olğan qadınnı
          taqip etmek içün, beş adamlıq atlını yolğa çıqardı. Olar qadınnı Az.Peyğamberniñ
          aytqan yerinde yaqaladılar. Sıqıştırılğan qadın saqlağan mektübini saçlarınıñ
          arasından çıqardı ve serbest bıraqıldı. Mektüp Az.Peyğamberge teslim etilgeninen,
          Haatib çağırıldı ve yapqanınıñ sebebi soraldı. Az.Umerniñ iddet kösterüvine rağmen,
          Az.Peyğamber Haatibni afu etti. Böylece, Haatibniñ şahsında bütün musulmanlar,
          duşmanlarına nisbeten tenbiyelengen oldular).
        cid: 0
