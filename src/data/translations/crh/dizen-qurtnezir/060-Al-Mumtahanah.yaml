surah_id: 60
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >
          Ey, iman etkenler! Eger menim yolumda cenkleşmek ve rizamnı qazanmaq içün çıqqan
          iseñiz, menim de duşmanım, siziñ de duşmanıñız olğanlarğa sevgi köstererek,
          gizli muhabbet beslereyek, olarnı dost tutmañ. Albuki, olar sizge kelgen
          aqiqatnı inkâr etkenlerdir. Rabbiñiz Allahqa inanğañızdan tolayı, Peyğamberni
          de, sizni de, yurtuñızdan çıqarmaqtalar. Men siziñ gizli tutqañıznı da, aşkâr
          etkeniñizni de, eñ yahşı biliciyim. Sizden kim bunı yapar ise (olarnı dost
          tutsa), doğru yoldan sapqan olur. (Ayetniñ nazil oluvına sebep şu: Haatib b.
          Beltea adlı sahabi, Az.Peyğamberniñ gizli tutqan Mekkeni fetih etüv niyetini
          Sare adındaki yırcı kâfir bir qadınğa bergen mektübinen, Mekke müşriklerine
          bildirmek istegen edi. Hatib, Mekkede qalğan evlât ve ailesine telükeni haber
          bermek maqsadınen, böyle bir işke kirişken edi. Cenab-ı Haq bu vaziyetni
          Az.Peyğamberge bildirdi. Resulullah Mekkege qaytmaqta olğan qadınnı taqip etmek
          içün, beş adamlıq atlını yolğa çıqardı. Olar qadınnı Az.Peyğamberniñ aytqan
          yerinde yaqaladılar. Sıqıştırılğan qadın saqlağan mektübini saçlarınıñ arasından
          çıqardı ve serbest bıraqıldı. Mektüp Az.Peyğamberge teslim etilgeninen, Haatib
          çağırıldı ve yapqanınıñ sebebi soraldı. Az.Umerniñ iddet kösterüvine rağmen,
          Az.Peyğamber Haatibni afu etti. Böylece, Haatibniñ şahsında bütün musulmanlar,
          duşmanlarına nisbeten tenbiyelengen oldular).
        cid: 0
  - verse: 2
    segments:
      - text: >
          Eger olar sizni elge keçirseler, sizge duşman kesilecekler, sizge ellerini ve
          tillerini yamanlıqnen uzatacaqlar. Zaten, inkâr etmeñizni istemektedirler.
        cid: 0
  - verse: 3
    segments:
      - text: >
          Qıyamet künü yaqınlarıñız ve balalarıñız sizge fayda bermezler. Çünki, Allah
          arañıznı ayırır. Allah yapqanlarıñıznı körücidir.
        cid: 0
  - verse: 4
    segments:
      - text: >
          İbrahimde ve onıñnen beraber olğanlarda siz içün, aqiqaten güzel bir örnek
          bardır. Olar qavmlarına degen ediler ki: «Biz sizden ve Allahnı bıraqıp
          tabınğanlarıñızdan uzaqmız. Sizni tanımaymız. Siz tek bir Allahqa inanğan qadar,
          siznen bizim aramızda devamlı bir duşmanlıq ve öpke mevcuttır». Şu qadar bar ki,
          İbrahim babasını: «Ant olsun, sen içün mağfiret tileycem. Faqat Allahtan saña
          kelecek er angi bir şeyniñ ögüni almağa küçüm yetmez», degen edi. (O mü'minler
          böyle dediler:) Rabbimiz! Ancaq saña tayandıq, saña yöneldik. Dönüş de, ancaq
          sañadır. (Az.İbrahim iman etmegen babasına onıñ içün istiğfar etecegini
          söylegen, imanı içün muhlet bergen edi, daa soñra da, istiğfardan men etilgen
          edi. Çünki, kâfirler içün istiğfar caiz degil).
        cid: 0
  - verse: 5
    segments:
      - text: >
          Rabbimiz! Bizni, inkâr etkenler içün sınav mevzusı yapma, bizni bağışla! Ey,
          Rabbimiz! Yekâne ğalip ve ikmet saibi ancaq sensiñ.
        cid: 0
  - verse: 6
    segments:
      - text: >
          Ant olsun, olar siz içün, Allahnı ve ahiret kününi arzu etkenler içün, güzel bir
          örnektir. Kim yüz çevirse, şübesiz, Allah zengindir, hamdge lâyıqtır.
        cid: 0
  - verse: 7
    segments:
      - text: >
          Belki, Allah siznen duşman olğanlarıñız arasında yaqında bir dostluq meydanğa
          ketirir. Allah küçü yeticidir. Allah çoq bağışlayıcı, çoq merhametlidir. (Bu
          ayette Allah duşmanlıqta adden aşmamaqnı, duşman bir toplulıqnıñ bir kün dost
          ola bilecegini bildirgen. Bunıñ kibi, Peyğamberniñ ve musulmanlarnıñ can duşmanı
          olğan Mekke ve etrafındaki müşriklerniñ çoqu soñundan İslâmğa kirgenler, olarnıñ
          balaları, Allah yolunda cihad etken mü'minler olğanlar. Böylece, ayette
          bildirilgen ilâhiy vade yerine kelgen).
        cid: 0
  - verse: 8
    segments:
      - text: >
          Allah, siznen din oğrunda cenkleşmegen ve sizni yurtlarıñızdan çıqarmağanlarğa
          eyilik yapuvıñıznı ve olarğa adil davranuvıñznı yasaqlamaz. Çünki, Allah
          adaletli olğanlarnı sever. (Tefsirlerde, din hususında cenkleşmegenlerniñ
          Az.Peyğambernen añlaşuv yapqan ve oña sadaqat köstergen Huzaad qabilesi olğanı,
          çoqluq tarafından qayd etilgen. Bazılarına köre, bular - Mekkede iman etken,
          faqat icret etmegenler ya da qadınlar ve balalardır. Ayet Az.Ebu Bekirniñ qızı
          Esmanıñ Mekkede qalğan müşrik anasınıñ, onı ziyaret etmek içün kelgende, qabul
          etmegeni üzerine nazil olğan. Ancaq, ayetniñ ükmi umumiydir).
        cid: 0
  - verse: 9
    segments:
      - text: >
          Allah, yalıñız siznen din oğrunda cenkleşkenlerni, sizni yurtlarıñızdan
          çıqarğanlarnı ve çıqarıluvıñız içün olarğa yardım etkenlerni dost tutunuvıñıznı
          yasaqlar. Kim olarnen dost olsa, işte, zalımlar olardır.
        cid: 0
  - verse: 10
    segments:
      - text: >
          Ey, iman etkenler! Mü'min qadınlar icret eterek, sizge kelgen vaqıtta, olarnı
          imtian etiñ. Allah olarnıñ imanlarını daa yahşı bilir. Eger siz de olarnıñ
          inanğan qadınlar olğanlarını ögrenseñiz, olarnı kâfirlerge keri döndürmeñ. Bular
          olarğa elâl degildir. Olar da bularğa elâl olmazlar. Olarnıñ (qocalarnıñ) sarf
          etkenlerini (mehirlerini) keri beriñ. Mehirlerini özlerine bergen vaqtıñızda,
          olarnen evlenüviñzde sizge bir günah yoq. Kâfir qadınlarnı nikâhıñızda tutmañ,
          sarf etkeniñizni isteñ. Olar da sarf etkenlerini istesinler. Allahnıñ ükmi
          budır. Arañızda O üküm eter. Allah bilicidir, ikmet saibidir. (Hudaybiye
          antlaşuvınen yüz bergen vaziyetni nizamğa qoyğan bu ayetke köre, musulmanlarğa
          sığınğan mü'min qadınlar, kâfirlerge qaytarılmaycaq, olarğa ayette beyan etilgen
          esaslar tedbiq etilecek. Çünki, Hudaybiye antlaşuvına köre, kâfirlerden kelgen
          mü'minler olarğa qaytarılacaq ediler. Ayet qaytarılacaq olğanlarnıñ yalıñız
          mü'min erkekler olğanını, mü'min qadınlarnıñ kâfirler nikâhında qalalmaycaqları
          içün, antlaşuvğa kirseltmeycegini beyan etmekte).
        cid: 0
  - verse: 11
    segments:
      - text: >
          Eger zevceleriñizden biri, sizni bıraqıp, kâfirlerge qaçsa, siz de (olarnen
          cenkleşip) ğalip kelseñiz, zevceleri ketkenlerge (ğanimetten) arclağanları qadar
          beriñ. İnandığıñız Allahqa qarşı kelüvden saqınıñ.
        cid: 0
  - verse: 12
    segments:
      - text: >
          Ey, Peyğamber! İnanğan qadınlar, Allahqa iç bir şeyni ortaq qoşmamaq, hırsızlıq
          yapmamaq, zina etmemek, balalarnı öldürmemek, ellerinen ayaqları arasında bir
          iftira uydurıp ketirmemek, yahşı iş yapuvda saña qarşı kelmemek hususında saña
          biat etmege kelgen vaqıtlarında, biatlarını qabul et ve olar içün Allahtan
          mağfiret iste. Şübesiz, Allah çoq bağışlayıcıdır, çoq merhametlidir. (Biat
          şartları arasıda sayılğan «ellerinen ayaqları arasında bir iftira uydurmamaq»
          tabiri, nikâhsız bir balanı dünyağa ketirip, onı qocasına nisbet eterek,
          iftirada bululunmamaq manasına kelmekte. Ayet Mekke fethi künü nazil olğan,
          Az.Peyğamber erkeklerden soñ, qadınlarnıñ biatını qabul etken).
        cid: 0
  - verse: 13
    segments:
      - text: >
          Ey, iman etkenler! Allahnıñ ğadabına oğrağan bir qavmnı dost tutmañ. Zira, olar
          kâfirlerniñ qabirdekilerden (olarnıñ tirilüvinden) ümüt keskenleri kibi,
          ahiretten ümüt keskenlerdir. (Bu ayetniñ soñki cumlesi böyle de anlaşıla bilir:
          Zira, olar qabirlerde bulunğan kâfirlerniñ qurtuluştan ümüt keskenleri kibi,
          ahiretten de ümüt keskendirler).
        cid: 0
