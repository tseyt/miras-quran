surah_id: 60
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "Ey, iman etkenler! Eger menim yolumda cenkleşmek ve rizamnı qazanmaq içün çıqqan iseñiz, menim de duşmanım, siziñ de duşmanıñız olğanlarğa sevgi kostererek, gizli muhabbet beslereyek, olarnı dost tutmañ. Albuki, olar sizge kelgen aqiqatnı inkâr etkenlerdir. Rabbiñiz Allaһqa inanğañızdan tolayı, Peyğamberni de, sizni de, yurtuñızdan çıqarmaqtalar. Men siziñ gizli tutqañıznı da, aşkâr etkeniñizni de, eñ yahşı biliciyim. Sizden kim bunı yapar ise (olarnı dost tutsa), doğru yoldan sapqan olur. (Ayetniñ nazil oluvına sebep şu: Haatib b. Beltea adlı sahabi, Az. Peyğamberniñ gizli tutqan Mekkeni fetih etüv niyetini Sare adındaki yırcı kâfir bir qadınğa bergen mektübinen, Mekke muşriklerine bildirmek istegen edi. Hatib, Mekkede qalğan evlât ve ailesine telükeni haber bermek maqsadınen, boyle bir işke kirişken edi. Cenab-ı Haq bu vaziyetni Az.Peyğamberge bildirdi. Resulullah Mekkege qaytmaqta olğan qadınnı taqip etmek içün, beş adamlıq atlını yolğa çıqardı. Olar qadınnı Az.Peyğamberniñ aytqan yerinde yaqaladılar. Sıqıştırılğan qadın saqlağan mektübini saçlarınıñ arasından çıqardı ve serbest bıraqıldı. Mektüp Az.Peyğamberge teslim etilgeninen, Haatib çağırıldı ve yapqanınıñ sebebi soraldı. Az.Umerniñ iddet kosterüvine rağmen, Az.Peyğamber Haatibni afu etti. Boylece, Haatibniñ şahsında butün musulmanlar, duşmanlarına nisbeten tenbiyelengen oldular)."
        cid: 0
  - verse: 2
    segments:
      - text: "Eger olar sizni elge keçirseler, sizge duşman kesilecekler, sizge ellerini ve tillerini yamanlıqnen uzatacaqlar. Zaten, inkâr etmeñizni istemektedirler."
        cid: 0
  - verse: 3
    segments:
      - text: "Qıyamet kunü yaqınlarıñız ve balalarıñız sizge fayda bermezler. Çünki, Allaһ arañıznı ayırır. Allaһ yapqanlarıñıznı korücidir."
        cid: 0
  - verse: 4
    segments:
      - text: "İbrahimde ve onıñnen beraber olğanlarda siz içün, aqiqaten guzel bir ornek bardır. Olar qavmlarına degen ediler ki: «Biz sizden ve Allaһnı bıraqıp tabınğanlarıñızdan uzaqmız. Sizni tanımaymız. Siz tek bir Allaһqa inanğan qadar, siznen bizim aramızda devamlı bir duşmanlıq ve opke mevcuttır». Şu qadar bar ki, İbrahim babasını: «Ant olsun, sen içün mağfiret tileycem. Faqat Allaһtan saña kelecek er angi bir şeyniñ ogüni almağa kuçüm yetmez», degen edi. (O mu’minler boyle dediler:) Rabbimiz! Ancaq saña tayandıq, saña yoneldik. Dönüş de, ancaq sañadır. (Az.İbrahim iman etmegen babasına onıñ içün istiğfar etecegini söylegen, imanı içün muhlet bergen edi, daa soñra da, istiğfardan men etilgen edi. Çünki, kâfirler içün istiğfar caiz degil)."
        cid: 0
  - verse: 5
    segments:
      - text: "Rabbimiz! Bizni, inkâr etkenler içün sınav mevzusı yapma, bizni bağışla! Ey, Rabbimiz! Yekâne ğalip ve ikmet saibi ancaq sensiñ."
        cid: 0
  - verse: 6
    segments:
      - text: "Ant olsun, olar siz içün, Allaһnı ve ahiret kunüni arzu etkenler içün, guzel bir ornektir. Kim yuz çevirse, şubesiz, Allaһ zengindir, hamdge lâyıqtır."
        cid: 0
  - verse: 7
    segments:
      - text: "Belki, Allaһ siznen duşman olğanlarıñız arasında yaqında bir dostluq meydanğa ketirir. Allaһ kuçü yeticidir. Allaһ çoq bağışlayıcı, çoq merhametlidir. (Bu ayette Allaһ duşmanlıqta adden aşmamaqnı, duşman bir toplulıqnıñ bir kun dost ola bilecegini bildirgen. Bunıñ kibi, Peyğamberniñ ve musulmanlarnıñ can duşmanı olğan Mekke ve etrafındaki muşriklerniñ çoqu soñundan İslâmğa kirgenler, olarnıñ balaları, Allaһ yolunda cihad etken mu’minler olğanlar. Boylece, ayette bildirilgen ilâhiy vade yerine kelgen)."
        cid: 0
  - verse: 8
    segments:
      - text: "Allaһ, siznen din oğrunda cenkleşmegen ve sizni yurtlarıñızdan çıqarmağanlarğa eyilik yapuvıñıznı ve olarğa adil davranuvıñznı yasaqlamaz. Çünki, Allaһ adaletli olğanlarnı sever. (Tefsirlerde, din hususında cenkleşmegenlerniñ Az.Peyğambernen añlaşuv yapqan ve oña sadaqat kostergen Huzaad qabilesi olğanı, çoqluq tarafından qayd etilgen. Bazılarına kore, bular - Mekkede iman etken, faqat icret etmegenler ya da qadınlar ve balalardır. Ayet Az.Ebu Bekirniñ qızı Esmanıñ Mekkede qalğan muşrik anasınıñ, onı ziyaret etmek içün kelgende, qabul etmegeni uzerine nazil olğan. Ancaq, ayetniñ ukmi umimiydir)."
        cid: 0
  - verse: 9
    segments:
      - text: "Allaһ, yalıñız siznen din oğrunda cenkleşkenlerni, sizni yurtlarıñızdan çıqarğanlarnı ve çıqarıluvıñız içün olarğa yardım etkenlerni dost tutunuvıñıznı yasaqlar. Kim olarnen dost olsa, işte, zalımlar olardıң."
        cid: 0
  - verse: 10
    segments:
      - text: "Ey, iman etkenler! Mu’min qadınlar icret eterek, sizge kelgen vaqıtta, olarnı imtian etiñ. Allaһ olarnıñ imanlarını daa yahşı bilir. Eger siz de olarnıñ inanğan qadınlar olğanlarını ogrenseñiz, olarnı kâfirlerge keri döndürmeñ. Bular olarğa elâl degildir. Olar da bularğa elâl olmazlar. Olarnıñ (qocalarnıñ) sarf etkenlerini (mehirlerini) keri beriñ. Mehirlerini ozlerine bergen vaqtıñızda, olarnen evlenüviñzde sizge bir gunah yoq. Kâfir qadınlarnı nikâhıñızda tutmañ, sarf etkeniñizni isteñ. Olar da sarf etkenlerini istesinler. Allaһnıñ ukmi budır. Arañızda O uküm eter. Allaһ bilicidir, ikmet saibidir. (Hudaybiye antlaşuvınen yuz bergen vaziyetni nizamğa qoyğan bu ayetke kore, musulmanlarğa sığınğan mu’min qadınlar, kâfirlerge qaytarılmaycaq, olarğa ayette beyan etilgen esaslar tedbiq etilecek. Çünki, Hudaybiye antlaşuvına kore, kâfirlerden kelgen mu’minler olarğa qaytarılacaq ediler. Ayet qaytarılacaq olğanlarnıñ yalıñız mu’min erkekler olğanını, mu’min qadınlarnıñ kâfirler nikâhında qalalmaycaqları içün, antlaşuvğa kirseltmeycegini beyan etmekte)."
        cid: 0
  - verse: 11
    segments:
      - text: "Eger zevceleriñizden biri, sizni bıraqıp, kâfirlerge qaçsa, siz de (olarnen cenkleşip) ğalip kelseñiz, zevceleri ketkenlerge (ğanimetten) arclağanları qadar beriñ. İnandığıñız Allaһqa qarşı kelüvden saqınıñ."
        cid: 0
  - verse: 12
    segments:
      - text: "Ey, Peyğamber! İnanğan qadınlar, Allaһqa iç bir şeyni ortaq qoşmamaq, hırsızlıq yapmamaq, zina etmemek, balalarnı oldürmemek, ellerinen ayaqları arasında bir iftira uydurıp ketirmemek, yahşı iş yapuvda saña qarşı kelmemek hususında saña biat etmege kelgen vaqıtlarında, biatlarını qabul et ve olar içün Allaһtan mağfiret iste. Şubesiz, Allaһ çoq bağışlayıcıdır, çoq merhametlidir. (Biat şartları arasıda sayılğan «ellerinen ayaqları arasında bir iftira uydurmamaq» tabiri, nikâhsız bir balanı dünyağa ketirip, onı qocasına nisbet eterek, iftirada bululunmamaq manasına kelmekte. Ayet Mekke fethi kunü nazil olğan, Az.Peyğamber erkeklerden soñ, qadınlarnıñ biatını qabul etken)."
        cid: 0
  - verse: 13
    segments:
      - text: "Ey, iman etkenler! Allaһnıñ ğadabına oğrağan bir qavmnı dost tutmañ. Zira, olar kâfirlerniñ qabirdekilerden (olarnıñ tirilüvinden) umüt keskenleri kibi, ahiretten umüt keskenlerdir. (Bu ayetniñ soñki cumlesi boyle de anlaşıla bilir: Zira, olar qabirlerde bulunğan kâfirlerniñ qurtuluitan umüt keskenleri kibi, ahiretten de umüt keskendirler)."
        cid: 0