surah_id: 60
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "Koklerde ve yerde olğanlarnıñ episi mulkniñ saibi, eksiklikten uzaq, aziz ve hakim olğan Allaһnı tesbih eter."
        cid: 0
  - verse: 2
    segments:
      - text: "Çünki, ummiylerge aralarından, ozlerine ayetlerini oquğan, olarnı temizlegen, olarğa Kitapnı ve ikmetni ogretken bir Peyğamber yollağan Odır. Şubesiz, olar evelden ap-açıq bir sapıqlıq içinde ediler."
        cid: 0
  - verse: 3
    segments:
      - text: "(Peyğamberni) mu’minlerden alâ olarğa qoşulmağan diger insanlarğa da yollağandır. O, azizdir, hakimdir. (Az.Peyğamber araplardan başqa milletlerge de Peyğamber olaraq yollanılğandır. Çünki, Peyğamberimiznişç peyğamberligi ve risaleti umumiy ve devamiydir. O qıyametke qadar kelecek butün insanlarğa Peyğamber olaraq yollanılğan)."
        cid: 0
  - verse: 4
    segments:
      - text: "Bu, Allaһnıñ lütfidir. Onı istegenine berir. Allaһ buyuk lütf saibidir."
        cid: 0
  - verse: 5
    segments:
      - text: "Tevratnen mesuliyetli tutılıp da, onen amel etmegenlerniñ vaziyeti, cıltlarnen kitap yuklengen eşekniñ vaziyeti kibidir. Allaһnıñ ayetlerini yalanlağan qavmnıñ vaziyeti ne fenadır! Allaһ zalımlar toplulığını doğru yolğa qavuştırmaz. (Bu teşbihten añlaşılğanı kibi, kitap insanlarğa amel etilüvi içün yollanılğan; aks alda, yuk oluvdan başqa bir fayda teminlemez)."
        cid: 0
  - verse: 6
    segments:
      - text: "De ki: Ey, yeudiyler! Butün insanlar degil de, yalıñız ozüñiz Allaһnıñ dostları olğanıñıznı idda etmekte iseñiz, bunda da samimiy iseñiz, aydı, olümni isteñ (baqayıq)! («Biz Allaһnıñ oğulları ve dostlarımız», degen yeudiylerden aman olümni arzu etüvleri istengen. Çünki, Allaһnıñ dostları ahiretni ustün korgenler. Olüm ise, ahiretniñ başlanğıçıdır)."
        cid: 0
  - verse: 7
    segments:
      - text: "Amma olar, evelden yapqanları sebebinden, olümni asla istemezler. Allaһ zalımlarnı pek yahşı bilir. (Çünki, zalımlarnıı işleri, inkâr ve isyan olğan. Bularnı yapqanlar olümni istep olamazlar)."
        cid: 0
  - verse: 8
    segments:
      - text: "De ki: Siziñ ondan qaçtığıñız olüm mıtlaqa sizni tapacaq. Soñra da, korülgenni ve korülmegenni bilici Allaһqa döndürileceksiñiz de, O sizge butün yapqanlarıñıznı haber berecek."
        cid: 0
  - verse: 9
    segments:
      - text: "Ey, iman etkenler! Cuma kunü namazğa çağırılğan (ezan oqulğan) vaqıtta, aman Allaһnı añmağa çapışıñ ve alış-verişni braqıñ. Eger bilmiş olsañız, elbette bu siz içün daa hayırlıdır."
        cid: 0
  - verse: 10
    segments:
      - text: "Namaz qılınğanınen, artıq yer yuzüne dağılıñ ve Allaһnıñ lütfinden isteñ. Allaһnı çoq zikr etiñ; umüt etilir ki, qurtulışqa irişirsiñiz."
        cid: 0
  - verse: 11
    segments:
      - text: "Olar bir ticaret ve eglence korgen vaqıtlarında, aman dağılıp, oña barırlar ve seni ayaqta bıraqırlar. De ki: Allaһnıñ yanında bulunğanı, eglenceden ve ticaretten daa faydalıdır. Allaһ rızıq bergenlerniñ eñ hayırlısıdır. (Rivayetke kore, Medinede qıtlıq yaşanğan bir devirde Az.Peyğamber, cuma hutbesi oquğanda, o yerden aşayt yuklü bir kervan keçe edi. Kervannıñ kelgenini bildirgen def sesini eşitkeninen, er kes kervanğa çaptı, yalıñız on eki adam qaldı. Ayet bunıñ uzerine nazil oldı, eski zamanlarda bir kervan kelgen vaqıtta oña nisbeten quvanç kosterişi olmaq uzvre, def çalınır edi)."
        cid: 0
  - verse: 12
    segments:
      - text: "İşte, bu taqdirde, O, siziñ gunahlarıñıznı bağışlar, sizni zemininden irmaqlar aqqan cennetlerge, Adn cennetlerindeki guzel meskenlerge qoyar. İşte, eñ buyuk qurtulış budır."
        cid: 0
  - verse: 13
    segments:
      - text: "Sevecek başqa bir şeyiñiz daa bar: Allaһtan yardım ve yaqın bir fetih. Mu’minlerni (bularnen) mujdele. («Yaqın bir fetih» aqqında şu yorumlar yapılğan: Mekkeniñ musulmanlar tarafından fetih etilecegi; Qureyş uzerinden ğalebe elde etilecegi; İran ve şarqiy Rimniñ musulmanlarnıñ akimiyeti altına kirecegi)."
        cid: 0
  - verse: 14
    segments:
      - text: "Ey, iman etkenler! Allaһnıñ yardımcıları oluñ. Doğrusı, Meryem oğlu İsa havariylerge: Allaһqa (barğan yolda) menim yardımcılarım kim? degen edi. Havariyler de: Allaһ (ölunıñ) yardımcıları bizmiz, degen ediler. İsrail oğullarından bir qısmı inanğan, bir qısmı da, inkâr etken edi. Niayet, biz inanğanlarnı, duşmanlarına qarşı destekledik. Boylece, ustün keldiler. («Havariyler» Az.İsağa er kesten evel inañğan ve yardımcı olğan 12 ihlâsl ve temiz insanğa berilgen isimdir. Az.İsağa inanğanlar, o Allaһnıñ qulı ve Peyğamberi olğanını tasdiq eterek, kokke yukseltilgenine inanğanlardır. Az.İsanı inkâr etkenler ise, o Allaһnıñ oğlu ve uçniñ uçüncisi olğanını söylegenlerdir)."
        cid: 0
  - verse: 61
    segments:
      - text: "es-SAFF Adını mu’minlerniñ saf tutaraq, Allaһ yolunda cenkleşkenlerini bildirgen 4-nci ayetinden alğan, Medinede engen, 14 ayettir. Bismilâaһirraһmaanirraһiim (Rahman ve rahim olğan Allaһnıñ adınen)."
        cid: 0
  - verse: 62
    segments:
      - text: "el-CUM’A Adını 9-nci ayette keçken «cum’a» kelimesinden ala. Medinede engen, 11 ayettir. Bismilâaһirraһmaanirraһiim (Rahman ve rahim olğan Allaһnıñ adınen)."
        cid: 0