      - text: >-
          (Hudaybiye antlaşuvınen yüz bergen vaziyetni nizamğa qoyğan bu ayetke köre,
          musulmanlarğa sığınğan mü'min qadınlar, kâfirlerge qaytarılmaycaq, olarğa ayette
          beyan etilgen esaslar tedbiq etilecek. Çünki, Hudaybiye antlaşuvına köre,
          kâfirlerden kelgen mü'minler olarğa qaytarılacaq ediler. Ayet qaytarılacaq
          olğanlarnıñ yalıñız mü'min erkekler olğanını, mü'min qadınlarnıñ kâfirler nikâhında
          qalalmaycaqları içün, antlaşuvğa kirseltmeycegini beyan etmekte).
