surah_id: 51
language: crh
author: dizen-qurtnezir
verses:
  - verse: 10
    segments:
      - text: "Qahr olsun o adden aşqan yalancılar!"
        cid: 0
  - verse: 11
    segments:
      - text: "Olar qoyu bir cehalet içerisinde qalğan ğafillerdir."
        cid: 0
  - verse: 12
    segments:
      - text: "Ceza kunüniñ ne zaman olğanını sorarlar."
        cid: 0
  - verse: 13
    segments:
      - text: "O kunü olar ateşke atılacaqlar."
        cid: 0
  - verse: 14
    segments:
      - text: "Azabıñıznı tatıñ. Acele kelüvini beklegen şeyiñiz budır işte! (denilir). 15-16. Şubesiz ki, Allaһqa isyandan saqınğanlar, Rabbleriniñ olarğa bergenini alaraq, cennetlerde ve çoqraq başlarında bulunacaqlar. Şubesiz, olar bundan evel dünyada guzel davranğanlar ediler."
        cid: 0
  - verse: 17
    segments:
      - text: "Geceleri pek az yuqlar ediler."
        cid: 0
  - verse: 18
    segments:
      - text: "Saar vaqıtlarında da, istiğfar eter ediler."
        cid: 0
  - verse: 19
    segments:
      - text: "Mallarında muhtac ve yoqsullar içün bir aq bar edi."
        cid: 0
  - verse: 20
    segments:
      - text: "Kesen-kes olaraq inanğanlar içün, yer yuzünde ayetler bardır. (Er yuzüniñ dağlarında, deñizlerinde, tereklerinde, osümliklerinde, madenlerinde ve canlılarında Cenab-ı Haqnıñ qudret, irade ve birligine delâlet etici alâmetler açıq sergilenmektedir)."
        cid: 0
  - verse: 21
    segments:
      - text: "Oz nefislerinizde de oyle, kormeysiñizmi?"
        cid: 0
  - verse: 22
    segments:
      - text: "Semada da rızqıñız ve sizge vade etilgen başqa şeyler bar."
        cid: 0
  - verse: 23
    segments:
      - text: "Kokniñ ve yerniñ Rabbine ant olsun ki, bu vade siziñ laqırdıñız kibi, kesen-kes ve aqiqattır. (Buña kore, insan oz laqırdısınıñ ozüne ait oluvından nasıl şube etmez ise, Allaһnıñ bildirgen şeylerinden de, oyle şube etmemelidir)."
        cid: 0
  - verse: 24
    segments:
      - text: "İbrahimniñ urmetli musafirleriniñ haberleri saña keldimi? (Bular melekler edi)."
        cid: 0
  - verse: 25
    segments:
      - text: "Olar İbrahimniñ yanına barğan, selâm bergen ediler. İbrahim de, selâmnı alğan, içinden «Bular - yabancılar», degen edi."
        cid: 0
  - verse: 26
    segments:
      - text: "Aman ailesiniñ yanına bararaq, semiz bir tana (kebabını) ketirgen,"
        cid: 0
  - verse: 27
    segments:
      - text: "Olarnıñ ogüne qoyup: «Aşamazsıñızmı?», degen edi."
        cid: 0
  - verse: 28
    segments:
      - text: "Derken, olardan qorqmağa başladı. «Qorqma», dediler ve oña bilgili bir oğlan balanı mujdelediler. (Bu - İshaq (a.s.) edi)."
        cid: 0
  - verse: 29
    segments:
      - text: "Qadını vayvalap keldi. Elini yuzüne uraraq: «Men doğurmaz bir qart qadınım!», dedi."
        cid: 0
  - verse: 30
    segments:
      - text: "Olar: «Bu - boyledir. Rabbiñ söylegendir. O, ikmet saibidir, bilicidir», dediler. (Az. İbrahimniñ ihtiyar qadını Sare, ayette bildirilgeni kibi, bala haberini alğanınen, şaşqınlıq içinde elini yuzüne uraraq, qartlığını ifade etken edi)."
        cid: 0
  - verse: 31
    segments:
      - text: "(İbrahim:) O alda, işiñiz nedir, ey, elçiler? dedi. 32. «Biz, dediler, qabaatlı bir qavmğa yollanıldıq». 33. «Uzerlerine çamurdan taş yağdırmağa (keldik)»."
        cid: 0
  - verse: 34
    segments:
      - text: "(Bu taşlar,) adden aşqanlar içün Rabbiñniñ qatında belgilengen (taşlardır)."
        cid: 0
  - verse: 35
    segments:
      - text: "Bunıñ uzerine o yerde bulunğan mu’minlerni çıqardıq."
        cid: 0
  - verse: 36
    segments:
      - text: "Zaten, o yerden musulmanlardan, bir ev halqından başqa, kimseni tapmadıq."
        cid: 0
  - verse: 37
    segments:
      - text: "Accı azaptan qorqqanlar içün, o yerde bir belgi taşladıq."
        cid: 0
  - verse: 38
    segments:
      - text: "Musada da (ibretler bardır). Onı ap-açıq bir delil ile Fıravunğa yollağan edik."
        cid: 0
  - verse: 39
    segments:
      - text: "Fıravun orudsınen birlikte yuz çevirgen: «O, bir tılsımcıdır, ya da bir delidir», degen edi."
        cid: 0
  - verse: 40
    segments:
      - text: "Niayet, onı da, ordularını da, yaqalap, deñizge attıq. Bu sırada ozüni tenqit etip tura edi. (Fıravun inkâr ve inatçılığından, peyğamberni yalanlamasından ve tañrılıq davasına qalqışmasından tolayı, ozüni tenqit ete edi)."
        cid: 0
  - verse: 41
    segments:
      - text: "Aad qavmında da (ibretler bardır). Olarğa tamırından söküp-savurğan ruzgârnı yollağan edik."
        cid: 0
  - verse: 42
    segments:
      - text: "Ustünden keçken şeyni canlı bıraqmay, onı kul etip savura edi."
        cid: 0
  - verse: 43
    segments:
      - text: "Semuud qavmında da (ibretler bardır). Olarğa: Bir mudetke qadar faydalanıñ, denilgen edi."
        cid: 0
  - verse: 44
    segments:
      - text: "Rabbleriniñ emrine qarşı keldiler. Bu sebepten, baqıp turğanlarında, olarnı yıldırım çarpa qoydı."
        cid: 0
  - verse: 45
    segments:
      - text: "Ayaqqa turacaq kuçleri qalmağan, yardım eticileri de olmağan edi."
        cid: 0
  - verse: 46
    segments:
      - text: "Bulardan evel de, Nuһ qavmını elâk etken edik. Çünki, olar yoldan çıqqan bir toplum ediler."
        cid: 0
  - verse: 47
    segments:
      - text: "Kokni oz ellerimiznen biz qurdıq ve biz (onı), elbette kenişletecekmiz. (Galaktikanıñ ve bir Galaktikada bulunğan yıldızlarnıñ devamlı birbirilerinden uzaqlaşuvını ifade etken «kenişlev nazariası»na işaret bardır)."
        cid: 0
  - verse: 48
    segments:
      - text: "Yerni de töşedik. (Baq) ne guzel töşeyicimiz!"
        cid: 0
  - verse: 49
    segments:
      - text: "Er şeyden de çift-çift yarattıq ki, belki, tüşünip ogüt alırsıñız."
        cid: 0
  - verse: 50
    segments:
      - text: "O alda, Allaһqa qoşuñ (çapışıñ). Çünki, men sizge Onıñ qatından (kelgen) açıq bir tenbiyeciyim."
        cid: 0
  - verse: 51
    segments:
      - text: "Allaһnen beraber başqa bir tañrı edinmeñ. Zira, men sizge Onıñ tarafından (kelgen) açıq bir tenbiyeciyim."
        cid: 0
  - verse: 52
    segments:
      - text: "İşte, boylece, olardan evelkilerine er angi bir peyğamber kelgeninde, aman: O, bir tılsımcıdır ya da delidir, dediler."
        cid: 0
  - verse: 53
    segments:
      - text: "Bunı (nesilden nesilge) bir-birilerine vasiyet ettilermi? Doğrusı, olar yoldan azğan bir toplulıqtır."
        cid: 0
  - verse: 54
    segments:
      - text: "Artıq olarğa emiyet berme. (Davetke uymağanlarından tolayı) sen tenqit etilecek degilsiñ. (Çünki, Az. Peyğamber devamlı olaraq haqqa davet etken ve bu yolda butün ğayretini kostergen)."
        cid: 0
  - verse: 55
    segments:
      - text: "Sen kene de ogüt ber. Çünki, ogüt mu’minlerge fayda berir."
        cid: 0
  - verse: 56
    segments:
      - text: "Men cinlerni ve insanlarnı, ancaq maña qullıq etsinler diye yarattım."
        cid: 0
  - verse: 57
    segments:
      - text: "Men olardan rızıq istemeyim. Meni toyuruvlarını da istemeyim."
        cid: 0
  - verse: 58
    segments:
      - text: "Şubesiz, rızıq bergen, kuç ve quvet saibi olğan ancaq Allaһtır. (Rızıqnı bergen ve beslegen Allaһtır. Vaziyet boyle olğanda, Allaһnıñ insanlarğa ve cinlerge itiyacı yoqtır. Bunıñ ustüne, olarnıñ da, başqalarınıñ da, rızıqlarını O qarşılamaktadır)."
        cid: 0
  - verse: 59
    segments:
      - text: "Muaqqaq ki, bu zulum etkenlerniñ de kemişleriniñ payı kibi, (azaptan) bir payları bar! O alda aşıqmasınlar! (Mekkeliler kibi, kufür ve inkârğa bataraq, Az. Peyğamberni yalanlağanlarğa, evelden yoq etilgen qavmlarnıñ başına kelgen azap kelecek. Evelkiler azaptan nasiplerini alğanları kibi, bular da alacaqlar)."
        cid: 0
  - verse: 60
    segments:
      - text: "Başlarına kelecek (elemli) kunlerinden tolayı, vay o kâfirlerniñ alına!"
        cid: 0