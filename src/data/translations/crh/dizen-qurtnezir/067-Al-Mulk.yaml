surah_id: 67
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >
          Mutlaq ükümranlıq elinde olğan Allah yüceler yücesidir ve Onıñ er şeyge küçü
          yeter.
        cid: 0
  - verse: 2
    segments:
      - text: >
          O ki, angiñizniñ daa güzel davranacağıñıznı sınamaq içün ölümni ve ayatnı
          yaratqandır. O, mutlaq ğaliptir, çoq bağışlayıcıdır. (Ayat manasız bir varlıq
          olmağanı kibi, ölüm de soñu olmağan bir yoq oluv degil. Aksine, ayat bir hayırlı
          faaliyetler meydanı, ölüm ise, bu faaliyetlerniñ qarşılığını tapacaq ebediy
          varlıq saasına keçüvni temilegen bir dönüş noqtası ve -Peyğamber (s.a.)nıñ da
          bildirgenı kibi- bir tenbiyecidir).
        cid: 0
  - verse: 3
    segments:
      - text: >
          O ki, bir-birinen aenkdar yedi kökni yaratqan. Rahman olğan Allahnıñ yaratışında
          iç bir uyğunsızlıq koralmazsıñ. Közüñni çevir de, bir baq, bir bozuqlıq köre
          bilesiñmi?
        cid: 0
  - verse: 4
    segments:
      - text: >
          Soñra közüñni tekrar-tekrar çevirip baq, köz (qıdırğan bozuqlıqnı tapmaqtan)
          aciz ve perişan alda saña dönecek.
        cid: 0
  - verse: 5
    segments:
      - text: >
          Ant olsun ki, biz (dünyağa) eñ yaqın olğan kökni qandillernen donattıq. Bularnı
          şeytanlarğa ateş daneleri yaptıq ve olarğa alevli ateş azabını azırladıq. (Bazı
          tefserlerge köre, bu yerde avada parıldağan, bir ateş danesi kibi, tez ve tek
          bir yolda areket etip söngen «şihab»lar közde tutulmaqta. Bu aqta Hicr suresiniñ
          16-18 ve Saaffaat suresiniñ 6-10-nci ayetlerine baq.).
        cid: 0
  - verse: 6
    segments:
      - text: >
          Rabblerini inkâr etkenler içün, ceennem azabı bar. O ne fena dönüştir!
        cid: 0
  - verse: 7
    segments:
      - text: >
          O yerge atılğanlarında, onıñ qaynağanda çıqarğan uvultısını eşitirler.
        cid: 0
  - verse: 8
    segments:
      - text: >
          Aman-aman ceennem öpkesinden çatlaycaq! Er ne vaqıt o yerge bir toplulıq atılsa,
          onıñ bekçileri olarğa: «Sizge, (bu azap ile) qorqutıcı bir peyğamber kelmegen
          edimi?» diye sorarlar.
        cid: 0
  - verse: 9
    segments:
      - text: >
          Olar böyle cevap berirler: «Ebet, doğrusı bizge (bu azap ile) qorqutqan bir
          peyğamber kelgen edi; faqat biz (onı) yalan sayğan ve Allahnıñ yollağan bir şeyi
          yoq, siz olğan-olacağı büyük bir sapıqlıq içindesiñiz!» degen edik.
        cid: 0
  - verse: 10
    segments:
      - text: >
          Ve eger qulaq asqan ya da aqlımıznı qullanğan olsa edik, (şimdi) şu alevli
          ceennemniñ mahkumleri arasında olmaz edik! diye ilâve eterler.
        cid: 0
  - verse: 11
    segments:
      - text: >
          Böylece, günahlarını itiraf eterler. Artıq (Allahnıñ rahmetinden) uzaq olsun o
          alevli ceennemniñ mahkumleri!
        cid: 0
  - verse: 12
    segments:
      - text: >
          Faqat daa körmeden, Rabblerinden (azabından) qorqqanlarğa kelgende, olar içün,
          kerçekten em bağışlanma, em de büyük mükâfat bar.
        cid: 0
  - verse: 13
    segments:
      - text: >
          Sözüñizni ister gizleñ, ister aşkâr etiñ; biliñ ki, O, qalplerniñ içindekini
          bilmekte.
        cid: 0
  - verse: 14
    segments:
      - text: >
          Yaratqan iç bilmezmi? O eñ ince işlerni körüp bilmektedir ve er şeyden
          haberdardır.
        cid: 0
  - verse: 15
    segments:
      - text: >
          Yer yüzüni sizge boyun egdirgen Odır. O alda, yerniñ omuzlarında (üzerinde)
          dolaşıñ ve Allahnıñ rızqından aşañ. Dönüş, ancaq Oñadır. (Bu yerde yer yüzüniñ
          insanlarnıñ faydalanuvlarına azır ve uyğun bir vaziyette yaratılğanını ifade
          etici bir misal mevcuttır. Yer yüzü, omuzlarında dolaşılacaq bir alda emirge
          boysundırılğanına köre, artıq dünyada insanlarğa boyun egmeycek iç bir maddiy
          varlıq yoq demektir. Bu ayet-i kerimede insanlıqnı ve hususen musulmanlarnı
          daima yükselmege bir teşviq bar).
        cid: 0
  - verse: 16
    segments:
      - text: >
          Kökte olğannıñ sizni yerge batırıp yibermeyceginden eminsiñizmi? O zaman yer
          sarsıldıqça sarsılır. (Alemniñ tedbiri ile vazifedar meleklerge işaret olğanı
          bildirilmeknen beraber; asıl fiilni yaratıci ve cezanı berici Cenab-ı Allahtır,
          er şey Onıñ izni ve emrinen meydanğa kelmektedir).
        cid: 0
  - verse: 17
    segments:
      - text: >
          Yahut kökte olğannıñ üzeriñizge taş yağdırğan (bir fırtına) yollamaycağından
          eminsiñizmi? İşte, bu tehdidimniñ ne olğanını yaqında bileceksiñiz!
        cid: 0
  - verse: 18
    segments:
      - text: >
          Ant olsun ki, olardan evelkiler de (bunı) yalan sayğan ediler; amma benim
          qarşılığına bergen azabım nasıl olğan edi!
        cid: 0
  - verse: 19
    segments:
      - text: >
          Üstlerinde qanatlarını açıp-qapatıp uçqan quşlarnı (iç) körmedilermi? Olarnı
          (avada) Rahman olğan Allahtan başqası tutmay. Şübesiz, O, er şeyni körmektedir.
        cid: 0
  - verse: 20
    segments:
      - text: >
          Rahman olğan Allahqa nisbeten şu sizge yardım etecek askerleriñiz qana, kimdir?
          İnkârcılar, ancaq teren bir ğaflet içinde bulunmaqtadırlar.
        cid: 0
  - verse: 21
    segments:
      - text: >
          Allah sizge bergen rızıqnı kesse, sizge rızıq bere bilecek kim? Yoq, olar
          azğınlıq ve nefrette tirelip turmaqtadırlar.
        cid: 0
  - verse: 22
    segments:
      - text: >
          Şimdi (tüşüniñiz baqayıq) yüzüqoyun qapanaraq yürgen, (barılacaq) yerge daa eyi
          yetişirmi, yoqsa doğru yolda tüzgün yürgenmi?
        cid: 0
  - verse: 23
    segments:
      - text: >
          (Resulım!) De ki: Sizni yaratqan, sizge eşitmek duyğusı, közler ve yürekler
          bergen Odır! Ne de az şükür etesiñiz!
        cid: 0
  - verse: 24
    segments:
      - text: >
          De ki: Sizni yer yüzünde çoqlaştırıp darqatqan Odır; ancaq Onıñ uzurına kelip
          toplanacaqsıñız.
        cid: 0
  - verse: 25
    segments:
      - text: >
          «Doğru sözlü olsañız (söyleñ), bu tehdid ne vaqıt (kerçekleşecek)» derler.
        cid: 0
  - verse: 26
    segments:
      - text: >
          De ki: O bilgi ancaq Allahqa mahsustır. Men ise, sadece ap-açıq bir
          tenbiyeciyim.
        cid: 0
  - verse: 27
    segments:
      - text: >
          Amma, onı (azapnı) yaqından körgen vaqıtlarında inkâr etkenlerniñ yüzleri
          qararacaq ve (olarğa): İşte, siziñ istep turğanıñız budır! denilecek.
        cid: 0
  - verse: 28
    segments:
      - text: >
          De ki: Allah meni ve yanımdakilerni (siziñ istegiñizge köre) yoq etse ya da
          (öyle olmayıp) bizni qorçalasa (söyleñ baqayıq), inkârcılarnı yaqıcı azaptan
          qurtaracaq kim?
        cid: 0
  - verse: 29
    segments:
      - text: >
          De ki: (Sizni imanğa davet ettigimiz) O (Allah) çoq merhametlidir; biz Oña iman
          etken ve tek Oña işanıp tayanğandırmız. Siz kimniñ ap-açıq sapıqlıq içinde
          olğanını yaqında ögreneceksiñiz!
        cid: 0
  - verse: 30
    segments:
      - text: >
          De ki: Suvuñız çekile qoysa, söyleñ, baqayıq, sizge kim bir aqar suv ketire
          bilir?
        cid: 0
