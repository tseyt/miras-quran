surah_id: 67
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >-
          Mutlaq ukümranlıq elinde olğan Allaһ yuceler yucesidir ve Onıñ er şeyge kuçü
          yeter.
        cid: 0
  - verse: 2
    segments:
      - text: >-
          O ki, angiñizniñ daa guzel davranacağıñıznı sınamaq içün olümni ve ayatnı
          yaratqandır. O, mutlaq ğaliptir, çoq bağışlayıcıdır. (Ayat manasız bir varlıq
          olmağanı kibi, olüm de soñu olmağan bir yoq oluv degil. Aksine, ayat bir hayırlı
          faaliyetler meydanı, olüm ise, bu faaliyetlerniñ qarşılığını tapacaq ebediy
          varlıq saasına keçüvni temilegen bir dönüş noqtası ve -Peyğamber (s.a.)nıñ da
          bildirgenı kibi- bir tenbiyecidir).
        cid: 0
  - verse: 3
    segments:
      - text: >-
          O ki, bir-birinen aenkdar yedi kokni yaratqan. Rahman olğan Allaһnıñ
          yaratışında iç bir uyğunsızlıq koralmazsıñ. Kozüñni çevir de, bir baq, bir
          bozuqlıq kore bilesiñmi?
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Soñra kozüñni tekrar-tekrar çevirip baq, koz (qıdırğan bozuqlıqnı tapmaqtan)
          aciz ve perişan alda saña dönecek.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Ant olsun ki, biz (dünyağa) eñ yaqın olğan kokni qandillernen donattıq. Bularnı
          şeytanlarğa ateş daneleri yaptıq ve olarğa alevli ateş azabını azırladıq. (Bazı
          tefserlerge kore, bu yerde avada parıldağan, bir ateş danesi kibi, tez ve tek
          bir yolda areket etip söngen «şihab»lar kozde tutulmaqta. Bu aqta Hicr suresiniñ
          16-18 ve Saaffaat suresiniñ 6-10-nci ayetlerine baq.).
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Rabblerini inkâr etkenler içün, ceennem azabı bar. O ne fena dönüştir!
        cid: 0
  - verse: 7
    segments:
      - text: >-
          O yerge atılğanlarında, onıñ qaynağanda çıqarğan uvultısını eşitirler.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Aman-aman ceennem opkesinden çatlaycaq! Er ne vaqıt o yerge bir toplulıq
          atılsa, onıñ bekçileri olarğa: «Sizge, (bu azap ile) qorqutıcı bir peyğamber
          kelmegen edimi?» diye sorarlar.
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Olar boyle cevap berirler: «Ebet, doğrusı bizge (bu azap ile) qorqutqan bir
          peyğamber kelgen edi; faqat biz (onı) yalan sayğan ve Allaһnıñ yollağan bir şeyi
          yoq, siz olğan-olacağı buyuk bir sapıqlıq içindesiñiz!» degen edik.
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Ve eger qulaq asqan ya da aqlımıznı qullanğan olsa edik, (şimdi) şu alevli
          ceennemniñ mahkumleri arasında olmaz edik! diye ilâve eterler.
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Boylece, gunahlarını itiraf eterler. Artıq (Allaһnıñ rahmetinden) uzaq olsun o
          alevli ceennemniñ mahkumleri!
        cid: 0
  - verse: 12
    segments:
      - text: >-
          Faqat daa kormeden, Rabblerinden (azabından) qorqqanlarğa kelgende, olar içün,
          kerçekten em bağışlanma, em de buyuk mukâfat bar.
        cid: 0
  - verse: 13
    segments:
      - text: >-
          Sözüñizni ister gizleñ, ister aşkâr etiñ; biliñ ki, O, qalplerniñ içindekini
          bilmekte.
        cid: 0
  - verse: 14
    segments:
      - text: >-
          Yaratqan iç bilmezmi? O eñ ince işlerni korüp bilmektedir ve er şeyden
          haberdardır.
        cid: 0
  - verse: 15
    segments:
      - text: >-
          Yer yuzüni sizge boyun egdirgen Odır. O alda, yerniñ omuzlarında (uzerinde)
          dolaşıñ ve Allaһnıñ rızqından aşañ. Dönüş, ancaq Oñadır. (Bu yerde yer yuzüniñ
          insanlarnıñ faydalanuvlarına azır ve uyğun bir vaziyette yaratılğanını ifade
          etici bir misal mevcuttır. Yer yuzü, omuzlarında dolaşılacaq bir alda emirge
          boysundırılğanına kore, artıq dünyada insanlarğa boyun egmeycek iç bir maddiy
          varlıq yoq demektir. Bu ayet-i kerimede insanlıqnı ve hususen musulmanlarnı
          daima yukselmege bir teşviq bar).
        cid: 0
  - verse: 16
    segments:
      - text: >-
          Kokte olğannıñ sizni yerge batırıp yibermeyceginden eminsiñizmi? O zaman yer
          sarsıldıqça sarsılır. (Alemniñ tedbiri ile vazifedar meleklerge işaret olğanı
          bildirilmeknen beraber; asıl fiilni yaratıci ve cezanı berici Cenab-ı Allaһtır,
          er şey Onıñ izni ve emrinen meydanğa kelmektedir).
        cid: 0
  - verse: 17
    segments:
      - text: >-
          Yahut kokte olğannıñ uzeriñizge taş yağdırğan (bir fırtına) yollamaycağından
          eminsiñizmi? İşte, bu tehdidimniñ ne olğanını yaqında bileceksiñiz!
        cid: 0
  - verse: 18
    segments:
      - text: >-
          Ant olsun ki, olardan evelkiler de (bunı) yalan sayğan ediler; amma benim
          qarşılığına bergen azabım nasıl olğan edi!
        cid: 0
  - verse: 19
    segments:
      - text: >-
          Ustlerinde qanatlarını açıp-qapatıp uçqan quşlarnı (iç) kormedilermi? Olarnı
          (avada) Rahman olğan Allaһtan başqası tutmay. Şubesiz, O, er şeyni kormektedir.
        cid: 0
  - verse: 20
    segments:
      - text: >-
          Rahman olğan Allaһqa nisbeten şu sizge yardım etecek askerleriñiz qana, kimdir?
          İnkârcılar, ancaq teren bir ğaflet içinde bulunmaqtadırlar.
        cid: 0
  - verse: 21
    segments:
      - text: >-
          Allaһ sizge bergen rızıqnı kesse, sizge rızıq bere bilecek kim? Yoq, olar
          azğınlıq ve nefrette tirelip turmaqtadırlar.
        cid: 0
  - verse: 22
    segments:
      - text: >-
          Şimdi (tüşüniñiz baqayıq) yuzüqoyun qapanaraq yurgen, (barılacaq) yerge daa eyi
          yetişirmi, yoqsa doğru yolda tüzgün yurgenmi?
        cid: 0
  - verse: 23
    segments:
      - text: >-
          (Resulım!) De ki: Sizni yaratqan, sizge eşitmek duyğusı, kozler ve yurekler
          bergen Odır! Ne de az şukür etesiñiz!
        cid: 0
  - verse: 24
    segments:
      - text: >-
          De ki: Sizni yer yuzünde çoqlaştırıp darqatqan Odır; ancaq Onıñ uzurına kelip
          toplanacaqsıñız.
        cid: 0
  - verse: 25
    segments:
      - text: >-
          «Doğru sözlü olsañız (söyleñ), bu tehdid ne vaqıt (kerçekleşecek)» derler.
        cid: 0
  - verse: 26
    segments:
      - text: >-
          De ki: O bilgi ancaq Allaһqa mahsustır. Men ise, sadece ap-açıq bir
          tenbiyeciyim.
        cid: 0
  - verse: 27
    segments:
      - text: >-
          Amma, onı (azapnı) yaqından korgen vaqıtlarında inkâr etkenlerniñ yuzleri
          qararacaq ve (olarğa): İşte, siziñ istep turğanıñız budır! denilecek.
        cid: 0
  - verse: 28
    segments:
      - text: >-
          De ki: Allaһ meni ve yanımdakilerni (siziñ istegiñizge kore) yoq etse ya da
          (oyle olmayıp) bizni qorçalasa (söyleñ baqayıq), inkârcılarnı yaqıcı azaptan
          qurtaracaq kim?
        cid: 0
  - verse: 29
    segments:
      - text: >-
          De ki: (Sizni imanğa davet ettigimiz) O (Allaһ) çoq merhametlidir; biz Oña iman
          etken ve tek Oña işanıp tayanğandırmız. Siz kimniñ ap-açıq sapıqlıq içinde
          olğanını yaqında ogreneceksiñiz!
        cid: 0
  - verse: 30
    segments:
      - text: >-
          De ki: Suvuñız çekile qoysa, söyleñ, baqayıq, sizge kim bir aqar suv ketire
          bilir?
        cid: 0