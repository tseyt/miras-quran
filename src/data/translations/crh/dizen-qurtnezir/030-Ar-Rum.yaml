      - text: >-
          (Bunıñ kibi, Az. Ebu Bekir (r.a.) Allahnıñ bu kerçek vadesine yürekten inanaraq,
          mecusiy iranlılarnıñ ğlabesine sevingen, müşriklerge: «Allah siziñ sevinçiñizni
          ziyade sürdirmeycek; çünki, O, bir qaç sene içinde rumlarnıñ tekrar ğalip
          keleceklerini haber berdi», degeninen, müşriklerden Ubey b. Halef baaske kirişmekni
          teklif etti. On deve üzerine ve üç yıl içinde rumlarnıñ ğalip kelip-kelmeycegi
          meselesinde baas ettiler. Az. Ebu Bekir, olıp-bitkenini Cenab-ı Peyğamberge
          añlatqanınen, Efendimiz (s.a.) «bid'(bir-qaç) sene» sözüniñ üç ile doquz sene
          arasındaki bir müddetni ifade etkenini, bu sebepnen, müddetni de, deve sayısını da
          üç qatına çıqaruvını teklif etti. Bu sefer doquz sene içinde rumlarnıñ ğalip
          kelecegine dair yüz deve üzerine baasnı yañıladılar. Aqiqaten, Tirmiziyniñ
          bildirgenine köre, Bedir cenkine doğru kelgen künlerde rumlar iranlılarğa qarşı
          yapqan cenklerinde ğalip keldiler, böylece, Allahnıñ vadesi yerine keldi; Az. Ebu
          Bekir de Ubey b. Halefniñ varislerinden qazanğan develerini alaraq, Peyğamberniñ
          tevsiyesine köre, faqırlarğa dağıttı).
