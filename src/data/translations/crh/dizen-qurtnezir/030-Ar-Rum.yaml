      - text: Elif. Lâam. Miim.
        cid: 1
  - verse: 2
    segments:
      - text: Rumlar,
        cid: 2
      - text: >-
          (araplar bulunğan bölgege) eñ yaqın bir yerde mağlubiyetke oğradılar. Albuki, olar,
          bu mağlubiyetlerinden soñ, bir qaç yıl içinde ğalip kelecekler. Eñ soñunda emir
          Allahnıñdır. O künü mü'minler de Allahnıñ yardımınen sevinecekler. Allah tilegenine
          yardım eter. O, mutlaq küç saibidir, çoq merhametlidir. (Ehl-i kitap olğan
          vizantiyalılar, mecusiy iranlılar tarafından mağlüp etilgen edi. Mekke müşrikleri bu
          neticege çoq sevindiler ve musulmanlarğa: «Eger Allah, siziñ degeniñiz kibi, yekâne
          ğalip olsa edi, ehl-i kitaptan olğan vizantiyalılarnı üstün ketirir edi», kibi
          qopayçoraca söylenmege başladılar. Bunıñ üstüne, Qur'an bir mucize olaraq,
          kelecekteki bir neticeni haber berdi: Üç ile doquz yıl içinde vizantiyalılar
          iranlılarnı yeñecek ve mü'minler sevinecek ediler. Buña köre, 624-nci senesi
          vizantiyalılar İranğa kirdiler. Bundan başqa, aynı sene musulmanlar Bedirde müim
          zaferler elde ettiler).
        cid: 0
