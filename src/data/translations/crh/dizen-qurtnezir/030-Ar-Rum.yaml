surah_id: 30
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >-
          Elif. Lâam. Miim.
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Rumlar, (araplar bulunğan bolgege) eñ yaqın bir yerde mağlubiyetke oğradılar.
          Albuki, olar, bu mağlubiyetlerinden soñ, bir qaç yıl içinde ğalip kelecekler. Eñ
          soñunda emir Allaһnıñdır. O kunü mu’minler de Allaһnıñ yardımınen sevinecekler.
          Allaһ tilegenine yardım eter. O, mutlaq kuç saibidir, çoq merhametlidir. (Ehl-i
          kitap olğan vizantiyalılar, mecusiy iranlılar tarafından mağlüp etilgen edi.
          Mekke muşrikleri bu neticege çoq sevindiler ve musulmanlarğa: «Eger Allaһ, siziñ
          degeniñiz kibi, yekâne ğalip olsa edi, ehl-i kitaptan olğan vizantiyalılarnı
          ustün ketirir edi», kibi qopayçoraca söylenmege başladılar. Bunıñ ustüne, Qur’an
          bir mucize olaraq, kelecekteki bir neticeni haber berdi: Uç ile doquz yıl içinde
          vizantiyalılar iranlılarnı yeñyecek ve mu’minler sevinecek ediler. Buña kore,
          624-nci senesi vizantiyalılar İranğa kirdiler. Bundan başqa, aynı sene
          musulmanlar Bedirde muim zaferler elde ettiler).
        cid: 0
  - verse: 3
    segments:
      - text: >-
          [2 ayetine baq.]
        cid: 0
  - verse: 4
    segments:
      - text: >-
          [2 ayetine baq.]
        cid: 0
  - verse: 5
    segments:
      - text: >-
          [2 ayetine baq.]
        cid: 0
  - verse: 6
    segments:
      - text: >-
          (Bu) Allaһnıñ vadesidir. Allaһ vadesinden qaytmaz; faqat insanlarnıñ çoqu
          bilmezler. (Bunıñ kibi, Az. Ebu Bekir (r.a.) Allaһnıñ bu kerçek vadesine
          yurekten inanaraq, mecusiy iranlılarnıñ ğlabesine sevingen, muşriklerge: «Allaһ
          siziñ sevinçiñizni ziyade sürdirmeycek; çünki, O, bir qaç sene içinde rumlarnıñ
          tekrar ğalip keleceklerini haber berdi», degeninen, muşriklerden Ubey b. Halef
          baaske kirişmekni teklif etti. On deve uzerine ve uç yıl içinde rumlarnıñ ğalip
          kelip-kelmeycegi meselesinde baas ettiler. Az. Ebu Bekir, olıp-bitkenini Cenabı
          Peyğamberge añlatqanınen, Efendimiz (s.a.) «bid’(bir-qaç) sene» sözüniñ uç ile
          doquz sene arasındaki bir muddetni ifade etkenini, bu sebepnen, muddetni de,
          deve sayısını da uç qatına çıqaruvını teklif etti. Bu sefer doquz sene içinde
          rumlarnıñ ğalip kelecegine dair yuz deve uzerine baasnı yañıladılar. Aqiqaten,
          Tirmiziyniñ bildirgenine kore, Bedir cenkine doğru kelgen kunlerde rumlar
          iranlılarğa qarşı yapqan cenklerinde ğalip keldiler, boylece, Allaһnıñ vadesi
          yerine keldi; Az. Ebu Bekir de Ubey b. Halefniñ varislerinden qazanğan
          develerini alaraq, Peyğamberniñ tevsiyesine kore, faqırlarğa dağıttı).
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Olar dünya ayatınıñ korüngen yuzüni bilirler. Ahiretten ise, olar tamamen
          ğafildirler.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Oz-ozlerine, Allaһnıñ, koklerni, yerni ve ekisinni arasında olğanlarnı, ancaq
          haq olaraq, muayen bir devir içün yaratqanını iç tüşünmedilermi? İnsanlarnıñ bir
          çoqu Rabblerine qavuşmaqnı, aqiqaten inkâr etmektedirler.
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Olar yer yuzünde kezip de, ozlerinden evelkilerniñ aqibetleri nasıl olğanına
          baqmadılarmı? Ki olar, ozlerinden daa kuçlü ediler; yer yuzüni qazıp, alt-ust
          etkenler, onı bularnıñ abadanlaştırğanlarından daa çoq abadanlaştırğan ediler.
          Peyğamberleri olarğa da nice açıq deliller ketirgen ediler. Zaten, Allaһ olarğa
          zulum etecek degil edi; faqat olar oz-ozlerine zulum etmekte ediler. (Ayette suv
          ve maden çıqarmaq ya da ekip-tikmek içün topraqnı işlegen ve menimsilgen
          bolgeler meydanğa ketirgen, soñra da, inkârcılıqları sebebinden, Allaһnıñ
          azabına oğrağan Aad ve Semuud kibi eski qavmlarğa işaret etilmekte ve olarnıñ
          qalımtılarına baqılıp, ibret alınuvı ogütlenmekte).
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Soñunda, Allaһnıñ ayetlerini yalan sayaraq ve olarnı alayğa alaraq, fenalıq
          yapqanlarnıñ aqibetleri pek fena oldı.
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Allaһ evelâ mahlüqnı yaratır, (olümden) soñra da, bunı (yaratmaqnı) tekrarlar.
          Soñunda ep Oña döndürileceksiñiz.
        cid: 0
  - verse: 12
    segments:
      - text: >-
          Qıyamet qopacaq kunü, gunahkârlar (umütsizlik içinde) susacaqlar.
        cid: 0
  - verse: 13
    segments:
      - text: >-
          (Allaһqa qoşqan) ortaqlarından ozlerine iç bir şefaatçı çıqmaycaq. Zaten, olar
          ortaqlarını da inkâr etedejkler.
        cid: 0
  - verse: 14
    segments:
      - text: >-
          Qıyamet qopacaq kunü, işte o kunü (mu’minlernen inkârcılar) birbirilerinden
          ayırılacaqlar.
        cid: 0
  - verse: 15
    segments:
      - text: >-
          İman etip, yahşı işler yapqanlarğa kelgende, olar cennette nimetlerge ve
          sevinçke nail olacaqlar.
        cid: 0
  - verse: 16
    segments:
      - text: >-
          İnkâr etkenler, ayetlerimizni ve olgenden soñ tirilüvni yalan sayğanlar ise,
          işte olar azapnen yuz-yuzge bıraqılacaqlar.
        cid: 0
  - verse: 17
    segments:
      - text: >-
          Aydı, siz, aqşamğa qavuşqanıñızda (aqşam ve yatsı vaqtında), sabağa
          qavuşqanıñızda, kundüzniñ soñunda ve uyle vaqtına irişkeniñizde, Allaһnı tesbih
          etiñ (namaz qılıñ), ki, koklerde ve yerde hamd Oña mahsustır. (Abdullah b. Abbas
          (r.a.)dan kelgen rivayetke kore, bu ayet beş vaqıt namaznı içine almaqta. Bu
          sebepnen, ekseri alimler beş vaqıt namaznıñ Mekkede farz qılınğanı
          qanaatindedirler. Az. Peyğamber (s.a.) bir hadis-i şerifte buyuk savap qazanmaq
          istegenlerge bu ayetni oqumalarını tevsiye etken).
        cid: 0
  - verse: 18
    segments:
      - text: >-
          [17 ayetine baq.]
        cid: 0
  - verse: 19
    segments:
      - text: >-
          Olüden tirini, tiriden de olüni O çıqarmaqta; yer yuzüni olüminiñ artından O
          canlandırmaqta. İşte, siz de (qabirleriñizden) boyle çıqarılacaqsıñız. (Ayette
          olgenden soñ tirilüvniñ iç de oyle aqılğa sığmaz bir şey olmağanı, yer yuzündeki
          devamlı yañılanuv adiselerine işaret ile muim bir şekilde añlatılmaqta.
          Aqiqaten, qup-quru topraqtan yem-yeşil ekinler ve tereklerden meyvalar ve
          yapraqlar, çeşit renkte çeçekler çıqarğan ilâhiy qudret içün, yoqtan bar etken
          insannı tekrar tiriltüviniñ qıyın olacağı aqılğa sığmaz. Esapsız «baa’s
          ba’de’l-mevt» (olgenden soñ tirilüv) adisesine sahna olğan yer yuzüne bir kere
          ibret kozünen baqmaq bile, Allaһnıñ qudretini añlamaq içün yetecek).
        cid: 0
  - verse: 20
    segments:
      - text: >-
          Sizni topraqtan yaratuvı, Onıñ (barlığınıñ) delillerindendir. Soñra siz, (er
          tarafqa) darqağan insanlar ola qoydıñız.
        cid: 0
  - verse: 21
    segments:
      - text: >-
          Qavuşuvlarıñız içün sizge oz (cınsı)ñızdan zevceler yaratıp, arañızda sevgi ve
          merhamet peyda etüvi de, Onıñ (barlığınıñ) delillerindendir. Doğrusı, bunda
          yahşı tüşüngen bir qavm içün ibretler bar.
        cid: 0
  - verse: 22
    segments:
      - text: >-
          Onıñ delillerinden biri de, koklerni ve yerni yaratuvı, tilleriñizniñ ve
          renkleriñizniñ çeşit oluvıdır. Şubesiz, bunda bilgenler içün (alınacaq) dersler
          bar. (İnsanlarnıñ bir erkek ve bir qadından yaratılmaqnen beraber, farql
          hususiyetlerge saip toplulıqlarğa ayırılğanları mevzusında Hucuraat suresiniñ
          13-nci ayeti izaatına baqıñ).
        cid: 0
  - verse: 23
    segments:
      - text: >-
          Gece olsun, kundüz olsun, yuqlamañız ve Allaһnıñ lütfinden (nasibiñizni)
          aramañız da, Onıñ (barlığınıñ) delillerindendir. Aqiqaten, bunda eşitken bir
          qavm içün ibretler bar. (Ayet «geceleyin yuqlamañız ve kundüzi Allaһnıñ
          lütfinden (nasibiñzni) qıdıruvıñız…», şeklinde de manalandırılğan. Ancaq, er eki
          vaqıtnıñ er eki işke elverişli olğanı manası daa quvetlidir).
        cid: 0
  - verse: 24
    segments:
      - text: >-
          Kene Onıñ delillerinden ki, sizge qorqu ve umüt bermek uzre, şemşekni kostere,
          kokten suv endirip, olüminiñ artından yerni onıñnen tirilte. Doğrusı, bunda
          aqlını işletken bir qavm içün (alınacaq) dersler bar.
        cid: 0
  - verse: 25
    segments:
      - text: >-
          Kokniñ ve yerniñ Onıñ emrinen toqtavı da, Onıñ (barlığınıñ) delillerindendir.
          Soñra sizni topraqtan bir çağırdımı, aman (qabirleriñizden) çıqa qoyarsıñız.
        cid: 0
  - verse: 26
    segments:
      - text: >-
          Koklerde ve yerde olğanlar ep Onıñdır. Episi Oña boyun eggendir.
        cid: 0
  - verse: 27
    segments:
      - text: >-
          İlk defa mahlüqını yaratıp, (olümden) soñ, bunı (yaratmaqnı) tekrarlağan Odır,
          ki bu, Onıñ içün pek qolay. Koklerde ve yerde (tecelli etken) eñ yuce sıfat
          Onıñdır. O, mutlaq kuç ve ikmet saibidir.
        cid: 0
  - verse: 28
    segments:
      - text: >-
          Allaһ sizge ozüñizden bir misal ketirmekte: Mulkiyetiñiz altında bulunğan
          hızmetkârlar içün de, sizge berdigimiz rızıqlarda -bir-biriñizden çekingeniñiz
          kibi, olardan çekinecek dereceñizde siznen musaviy (aqıllarğa saip)ortaqlarıñız
          barmı? İşte, biz ayetlerimizni, aqlını işletecek bir qavm içün, boylece
          izaatlamaqtamız. (Ayette insanlarnıñ, oz cıinslarından ve aynı yaratılış vasfına
          saip olğan hızmetkârlarını bile, ozlerine musaviy tutmağa, keçici dünya
          mulklerine ortaq etmege razılıq kostermegenleri aqiqatına işaret etilerek;
          ortağı ve oña beñzegeni olmağan Yuce Allaһqa şirk qoşuvnıñ, onıñ mutlaq
          mulkiyetine ortaqlıq qoşuvnıñ ne qadar aqılğa sığmaz bir iş olğanı, temsil
          yolunen añlatılmaqta ve hızmetkârnıñ efendisine ortaq olalmaycağı kibi, qulnıñ
          da, Allaһqa ortaq olalmaycağı añlatılmaqta. Ayrıca, Qur’an ayetleriniñ tüşüngen
          qafalarğa hitap etkeni de, ayrıca bildirile).
        cid: 0
  - verse: 29
    segments:
      - text: >-
          Kel, kor ki, aqsızlıq etkenler, bilgisizliknen fena arzularına uydılar.
          Allaһnıñ saptırğanını kim doğru yolğa iriştire bilir? Olar içün iç bir yardımcı
          yoqtır.
        cid: 0
  - verse: 30
    segments:
      - text: >-
          (Resulım!) Sen yuzüñni hanif olaraq, dinge, Allaһ insanlarnı angi tabiyatta
          yaratqan ise, oña çevir. Allaһnıñ yaratuvında deñişme yoqtır. İşte, dos-doğru
          din budır; faqat insanlarnıñ çoqu bilmezler. («Hanif» - egrilikke sapmadan,
          doğru yoldan yurgen demektir. Termin olaraq, İbrahim Peyğamberniñ tevhid, yani
          «Allaһnı bir tanımaq dini» manasında qullanılır. Bir Allaһqa inanğan kimsege de
          «hanif» denilir. Buhariy, Ebu Hureyradan rivayet etken bir hadiske kore, er bir
          bala, tabiyatınen (tevhidge meyilli) doğa; soñ, ana-babası onı yeudiy, hristian
          ya da mecusiy yapar. İşte, ayette zikr etilgen «fitrat» (tabiyat) Allaһ,
          insanlarnı doğuvdan «tek Allaһ inançı»na meylli yaratqanını ifade ete).
        cid: 0
  - verse: 31
    segments:
      - text: >-
          Epiñiz Oña yonelerek, Oña qarşı kelüvden saqınıñ, namaznı qılıñ; muşriklerden
          olmañ.
        cid: 0
  - verse: 32
    segments:
      - text: >-
          Dinlerni parçalağan ve bolük-bolük olğanlardan (olmañ. Bulardan) er fırqa
          ozlerinde olğanınen ğururlanmaqta.
        cid: 0
  - verse: 33
    segments:
      - text: >-
          İnsanlarnıñ başına bir sıqıntı kelgeninen, Rabblerine yonelerek, Oña
          yalvarırlar. Soñra, Allaһ qatından olarğa bir rahmet (nimet ve bollıq)
          tattırğanınen, baqarsıñız ki, olardan bir topu kene Rabblerine ortaq
          qoşmaqtalar.
        cid: 0
  - verse: 34
    segments:
      - text: >-
          Olarğa bergenlerimizge nankorlik etsinler baqayıq! Aydı, sefa süriñ; amma
          yaqında bileceksiñiz!
        cid: 0
  - verse: 35
    segments:
      - text: >-
          Yoqsa, olarğa bir kesen-kes delil endirdik de, o delil, muşrik oluvlarını
          söylemektemi?
        cid: 0
  - verse: 36
    segments:
      - text: >-
          İnsanlarğa bir rahmet tattırğanımızda, oña sevinirler. Eger yapqanlarından
          otrü, başlarına bir yamanlıq kelse, aman umütsizlikke tüşe qoyarlar.
        cid: 0
  - verse: 37
    segments:
      - text: >-
          Kormedilermi ki, Allaһ rızqnı istegenine bol-bol bermekte, istegeniniñkini de
          tarlaştırmaqta. Şubesiz, imanlı bir qavm içün bunda ibretler bar.
        cid: 0
  - verse: 38
    segments:
      - text: >-
          O alda, sen aqarabağa, yoqsulğa, yolda qalganğa aqqını ber. Allaһ rizasını
          istegenler içün bu, eñ yahşısıdır. İşte, olar qurtulışqa irişkenlerdir.
          (Ayetteki «aqqını ber» diye ifade etilgen emir sila-i rahimde bulunuv, zekât
          berüv, yahşılıq etüv kibi manalarnen tefsir etile).
        cid: 0
  - verse: 39
    segments:
      - text: >-
          İnsanlarnıñ mallarında artış olsun diye, bergen er angi bir fayızıñız, Allaһ
          qatında artmaz. Allaһ rizasını isteyerek bergen zekâtıñızğa kelgende, işte
          zekâtnı bergen o kimseler, ebet olar (savaplarını ve mallarını) qat-qat
          arttırğanlardır. (Ayetniñ ilk cumlesindeki «ribaa» esasen şu şekillerde tefsir
          etilgen: Berilgen fayıznıñ ozü, qarşılığında maddiy menfaat umüt etilgen er angi
          bir bahşış, fayızğa berilgen mal ya da para. Soñki mana esasqa alınğanda,
          ayetniñ «insanlarnıñ malları arasında degerlensin, artsın diye bergeniñiz…»,
          şeklindeki tercimesi uyğun olur. Ayette musulmanlarnı ileride kesen-kes olaraq
          ukümge bağlanacaq olğan ribaa yasağına azırlayıcı bir ifade qullanılğan).
        cid: 0
  - verse: 40
    segments:
      - text: >-
          Allaһ, (o yuce barlıqtır) ki, sizni yaratqan, soñra rızıqlandırğan; soñra O,
          ayatıñıznı soñuna iriştirecek, daa soñunda da, sizni (tekrar) tiriltecek. Yahşı,
          siziñ (Allaһqa ortaq qoşqan) ortaqlarıñız arasında bulardan birini yapa bilecek
          barmı? Allaһ olarnıñ ortaq qoşqanlarından uzaqtır ve yucedir.
        cid: 0
  - verse: 41
    segments:
      - text: >-
          İnsanlar, şahsen ozleri yapqanlarınıñ sebebinden, qarada ve deñizde tertip
          bozuldı ki, Allaһ yapqanlarınıñ bir qısmını olarğa tattırsın; belki de, (tutqan
          yaman yollarından) qaytırlar. (Ayette yaman fiillerge, ibret olsun diye, dünyada
          olğanda berilgen qarşılıqlar içün «bir qısmı» denilmekte ve asıl cezanıñ
          ahirette olğanına işaret etilmekte).
        cid: 0
  - verse: 42
    segments:
      - text: >-
          (Resulım!) De ki: Yer yuzünde kezip dolaşıñ da, daa evelkilerniñ aqibetleri
          nasıl oldı, korüñ. Olarnıñ çoqu muşrik edi.
        cid: 0
  - verse: 43
    segments:
      - text: >-
          Allaһ qatından dönüş olmağan bir kun (qıyamet kunü) kelmeden evel, yuzüñni o
          aqiqiy dinge çevir! O kunü (insanlar) bolük-bolük ayırılacaqlar.
        cid: 0
  - verse: 44
    segments:
      - text: >-
          Kim inkâr etse, inkârı oz aleyhine olur. Yahşı işler yapqanlarğa kelgende, olar
          da ozleri içün (cenneteki yerlerini) azırlağan olurlar.
        cid: 0
  - verse: 45
    segments:
      - text: >-
          Zira, Allaһ, iman etip, yahşı işler yapqanlarğa oz lütfinden qarşılıq berecek.
          Şubesiz, O, kâfirlerni sevmez.
        cid: 0
  - verse: 46
    segments:
      - text: >-
          Sizge rahmetinden tattırsın, emrinen gemiler yursin, nimetinden (nasibiñizni)
          qıdırasıñız ve şukür etesiñiz, diye (ayat ve bereket) mujdecileri olaraq,
          ruzgârlarnı yollavı da, Allaһnıñ (barlığınıñ ve qudretiniñ) delillerindendir.
          (Kâinatnı yaratqan da, idare etken de Allaһtır. Yaratuvnı nasıl bir sıra ve
          tertip (qanun) içinde yapqan ise, idaresini de, aynı şekilde qanunlarınen icra
          etmekte. Sebep-netice bağlılığı ilâhiy bir qanundır. Yağmurnıñ yağuvı da bir
          tertip sebep-netice munasebetlerine bağlıdır. Ğafiller yalıñız sebep ve neticeni
          korerler, mu’minler ise, sebeplerniñ yaratıcısınıı (musebbibu’lesbaabnı) da,
          korer ve Oña şukür eterler).
        cid: 0
  - verse: 47
    segments:
      - text: >-
          Ant olsun ki, biz senden evel oz qavmlarına nice peyğamber yolladıq da, olarğa
          açıq deliller ketirdiler. (Olarnı diñlemeyip) gunahqa dalğanlarnıñ ise,
          cezalarını haqqı ile bergendirmiz. Mu’minlerge yardım etmek de bizge ait.
        cid: 0
  - verse: 48
    segments:
      - text: >-
          Allaһ Odır ki, ruzgârlarnı yollar, bular da bulutnı quvar. Derken, Allaһ onı
          kokte istegeni kibi yayar ve parça-parça eter; niayet, arasından yağmurnıñ
          çıqqanını korersiñ. Allaһ tilegen qullarına yağumurnı nasip etkeninen, olar
          sevine qoyarlar.
        cid: 0
  - verse: 49
    segments:
      - text: >-
          Albuki, olar daa evel ustlerine yağmur yağdırıluvından umütlerini eyice kesken
          ediler.
        cid: 0
  - verse: 50
    segments:
      - text: >-
          Allaһ rahmetiniñ eserlerine bir baq: Yerni, olüminiñ artından nasıl
          tiriltmekte! Şubesiz, O, olülerni de mıtlaqa tiriltecek. O, er şeyge qadirdir.
        cid: 0
  - verse: 51
    segments:
      - text: >-
          Ant olsun ki, bir ruzgâr yollasaq da, onı (ekinni) sararğan korseler, artından
          muaqqaq nankorlikke başlarlar. (Ayetteki «onı sararğan korseler» diye manası
          berilgen cumlede yer alğan «onı» manasındaki zamir şu şekillerde tefsir etilgen:
          a). Allaһ rahmetiniñ yani yağmurnıñ eseri olğan ekin ve yeşilliktir, b).
          Buluttır; sararğanınen yağmur yağmaz).
        cid: 0
  - verse: 52
    segments:
      - text: >-
          (Resulım!) Elbette sen olülelerge duyuralmazsıñ; arqalarını çevirip keter
          ekenler, sağırlarğa o davetni eşittiralmazsıñ.
        cid: 0
  - verse: 53
    segments:
      - text: >-
          Korlerni de, sapıqlıqlarından (vazgeçtirip) doğru yolğa qavuştıralmazsıñ.
          Ancaq, teslimiyet kostererek, ayetlerimizge iman etkenlerge eşittire bilirsiñ.
          (Bu eki ayette keçken olü, sağır ve kor kelimeleri, qalpleri olgen, haqqa kulaq
          asmağan ve qalp kozü kor olup, aqiqatnı koralmağan manasında tefsir etilmekte).
        cid: 0
  - verse: 54
    segments:
      - text: >-
          Sizni kuçsiz yaratqan soñ, kuçsizlikniñ artından quvet bergen ve soñra quvetniñ
          artından kuçsizlik ve ihtiyarlıq bergen Allaһtır. O, tilegenini yaratır. O,
          haqqı ile bilicidir, ustün qudret saibidir. (İnsan hamile ve balalıq devrinde
          zayıf ve çaresizdir. Soñ osüp quvetlenir, daa soñra ise, ihtiyarlaşıp, kene
          kuçsiz alğa kelir. Ayette insan ayatınıñ bu devirlerine ve episi Allaһ
          qudretiniñ eseri olğanına işaret etilerek, insannıñ yalıñız Allaһqa qullıq etüvi
          kerekligi hatırlatıla).
        cid: 0
  - verse: 55
    segments:
      - text: >-
          Qıyamet qopqan kunü gunahkârlar (dünyada) ancaq pek qısqa bir muddet
          qalğanlarına yemin eterler. İşte, olar, (dünyada da haqtan) boyle döndürilmekte
          ediler. (Ayette, bir yorumğa kore, gunahkârlarnıñ bu yemininiñ aqiqatnen uyğun
          olmağanına; diger bir yorumğa kore ise, ozlerine qullıq ete bilmek içün, yeterli
          vaqıt berilmegeni şeklinde yañlış bir iddada bulunacjkљlarına işaret olunmaqta).
        cid: 0
  - verse: 56
    segments:
      - text: >-
          Ozlerine ilim ve iman berilgenler boyle derler: Ant olsun ki, siz Allaһnıñ
          yazısında (uküm etilgeni kibi) yañıdan tirilüv kunüne qadar qaldıñız. İşte,
          bugun yañıdan tirilüv kunüdir; faqat siz onı tanımay ediñiz.
        cid: 0
  - verse: 57
    segments:
      - text: >-
          Artıq o kunü zulum etkenlerniñ (beyan etecek) uzürleri fayda bermeycegi kibi,
          olardan Allaһnı hoşnut etmege areketleri de istenilmez. (Qıyamet kunü artıq
          iş-işten keçken olacaq, ileri sürülecek uzürler bir fayda bermeycegi kibi,
          yapılğanlardan peşmanlıq duyuv, tövbe etüv ve başqa yollarnen Allaһnı hoşnut
          etmege davranuvlar da, bu zalımlardan istenilmeycek).
        cid: 0
  - verse: 58
    segments:
      - text: >-
          Ant olsun ki, biz bu Qur’anda insanlar içün er çeşit misalge yer bergendirmiz.
          Eger olarğa bir mucize ketirseñ, inkârcılar kesen-kes boyle deycekler: Siz ancaq
          batıl şeylerni ortağa çıqarmaqtasıñız.
        cid: 0
  - verse: 59
    segments:
      - text: >-
          İşte, bilmegenlerniñ (haqnı tanımağanlarnıñ) qalplerini Allaһ boylece muurler.
        cid: 0
  - verse: 60
    segments:
      - text: >-
          (Resulım!) Sen şimdi sabır et. Bil ki, Allaһnıñ vadesi kerçektir. (Buña)
          yahşıca inanmağanlar saqın seni tenbellikke yeteklemesin! (Soñki cumle «Yahşıca
          iman etmegenler seni aciz korüvlerine saqın fırsat berme!» şeklinde de
          añlaşılğan).
