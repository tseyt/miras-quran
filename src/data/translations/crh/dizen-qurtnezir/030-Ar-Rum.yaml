          artından küçsizlik ve ihtiyarlıq bergen Allahtır. O, tilegenini yaratır. O,
          haqqı ile bilicidir, üstün qudret saibidir. (İnsan hamile ve balalıq devrinde
          zayıf ve çaresizdir. Soñ ösüp quvetlenir, daa soñra ise, ihtiyarlaşıp, kene
