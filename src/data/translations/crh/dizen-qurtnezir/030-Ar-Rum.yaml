surah_id: 30
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >
          Elif. Lâam. Miim.
        cid: 0
  - verse: 2
    segments:
      - text: >
          Rumlar, (araplar bulunğan bölgege) eñ yaqın bir yerde mağlubiyetke oğradılar.
          Albuki, olar, bu mağlubiyetlerinden soñ, bir qaç yıl içinde ğalip kelecekler. Eñ
          soñunda emir Allahnıñdır. O künü mü'minler de Allahnıñ yardımınen sevinecekler.
          Allah tilegenine yardım eter. O, mutlaq küç saibidir, çoq merhametlidir. (Ehl-i
          kitap olğan vizantiyalılar, mecusiy iranlılar tarafından mağlüp etilgen edi.
          Mekke müşrikleri bu neticege çoq sevindiler ve musulmanlarğa: «Eger Allah, siziñ
          degeniñiz kibi, yekâne ğalip olsa edi, ehl-i kitaptan olğan vizantiyalılarnı
          üstün ketirir edi», kibi qopayçoraca söylenmege başladılar. Bunıñ üstüne, Qur'an
          bir mucize olaraq, kelecekteki bir neticeni haber berdi: Üç ile doquz yıl içinde
          vizantiyalılar iranlılarnı yeñecek ve mü'minler sevinecek ediler. Buña köre,
          624-nci senesi vizantiyalılar İranğa kirdiler. Bundan başqa, aynı sene
          musulmanlar Bedirde müim zaferler elde ettiler).
        cid: 0
  - verse: 3
    segments:
      - text: >
          [2 ayetine baq.]
        cid: 0
  - verse: 4
    segments:
      - text: >
          [2 ayetine baq.]
        cid: 0
  - verse: 5
    segments:
      - text: >
          [2 ayetine baq.]
        cid: 0
  - verse: 6
    segments:
      - text: >
          (Bu) Allahnıñ vadesidir. Allah vadesinden qaytmaz; faqat insanlarnıñ çoqu
          bilmezler. (Bunıñ kibi, Az. Ebu Bekir (r.a.) Allahnıñ bu kerçek vadesine
          yürekten inanaraq, mecusiy iranlılarnıñ ğlabesine sevingen, müşriklerge: «Allah
          siziñ sevinçiñizni ziyade sürdirmeycek; çünki, O, bir qaç sene içinde rumlarnıñ
          tekrar ğalip keleceklerini haber berdi», degeninen, müşriklerden Ubey b. Halef
          baaske kirişmekni teklif etti. On deve üzerine ve üç yıl içinde rumlarnıñ ğalip
          kelip-kelmeycegi meselesinde baas ettiler. Az. Ebu Bekir, olıp-bitkenini Cenab-ı
          Peyğamberge añlatqanınen, Efendimiz (s.a.) «bid'(bir-qaç) sene» sözüniñ üç ile
          doquz sene arasındaki bir müddetni ifade etkenini, bu sebepnen, müddetni de,
          deve sayısını da üç qatına çıqaruvını teklif etti. Bu sefer doquz sene içinde
          rumlarnıñ ğalip kelecegine dair yüz deve üzerine baasnı yañıladılar. Aqiqaten,
          Tirmiziyniñ bildirgenine köre, Bedir cenkine doğru kelgen künlerde rumlar
          iranlılarğa qarşı yapqan cenklerinde ğalip keldiler, böylece, Allahnıñ vadesi
          yerine keldi; Az. Ebu Bekir de Ubey b. Halefniñ varislerinden qazanğan
          develerini alaraq, Peyğamberniñ tevsiyesine köre, faqırlarğa dağıttı).
        cid: 0
  - verse: 7
    segments:
      - text: >
          Olar dünya ayatınıñ körüngen yüzüni bilirler. Ahiretten ise, olar tamamen
          ğafildirler.
        cid: 0
  - verse: 8
    segments:
      - text: >
          Öz-özlerine, Allahnıñ, köklerni, yerni ve ekisiniñ arasında olğanlarnı, ancaq
          haq olaraq, muayen bir devir içün yaratqanını iç tüşünmedilermi? İnsanlarnıñ bir
          çoqu Rabblerine qavuşmaqnı, aqiqaten inkâr etmektedirler.
        cid: 0
  - verse: 9
    segments:
      - text: >
          Olar yer yüzünde kezip de, özlerinden evelkilerniñ aqibetleri nasıl olğanına
          baqmadılarmı? Ki olar, özlerinden daa küçlü ediler; yer yüzüni qazıp, alt-üst
          etkenler, onı bularnıñ abadanlaştırğanlarından daa çoq abadanlaştırğan ediler.
          Peyğamberleri olarğa da nice açıq deliller ketirgen ediler. Zaten, Allah olarğa
          zulum etecek degil edi; faqat olar öz-özlerine zulum etmekte ediler. (Ayette suv
          ve maden çıqarmaq ya da ekip-tikmek içün topraqnı işlegen ve menimsilgen
          bölgeler meydanğa ketirgen, soñra da, inkârcılıqları sebebinden, Allahnıñ
          azabına oğrağan Aad ve Semuud kibi eski qavmlarğa işaret etilmekte ve olarnıñ
          qalımtılarına baqılıp, ibret alınuvı ögütlenmekte).
        cid: 0
  - verse: 10
    segments:
      - text: >
          Soñunda, Allahnıñ ayetlerini yalan sayaraq ve olarnı alayğa alaraq, fenalıq
          yapqanlarnıñ aqibetleri pek fena oldı.
        cid: 0
  - verse: 11
    segments:
      - text: >
          Allah evelâ mahlüqnı yaratır, (ölümden) soñra da, bunı (yaratmaqnı) tekrarlar.
          Soñunda ep Oña döndürileceksiñiz.
        cid: 0
  - verse: 12
    segments:
      - text: >
          Qıyamet qopacaq künü, günahkârlar (ümütsizlik içinde) susacaqlar.
        cid: 0
  - verse: 13
    segments:
      - text: >
          (Allahqa qoşqan) ortaqlarından özlerine iç bir şefaatçı çıqmaycaq. Zaten, olar
          ortaqlarını da inkâr etecekler.
        cid: 0
  - verse: 14
    segments:
      - text: >
          Qıyamet qopacaq künü, işte o künü (mü'minlernen inkârcılar) bir-birilerinden
          ayırılacaqlar.
        cid: 0
  - verse: 15
    segments:
      - text: >
          İman etip, yahşı işler yapqanlarğa kelgende, olar cennette nimetlerge ve
          sevinçke nail olacaqlar.
        cid: 0
  - verse: 16
    segments:
      - text: >
          İnkâr etkenler, ayetlerimizni ve ölgenden soñ tirilüvni yalan sayğanlar ise,
          işte olar azapnen yüz-yüzge bıraqılacaqlar.
        cid: 0
  - verse: 17
    segments:
      - text: >
          Aydı, siz, aqşamğa qavuşqanıñızda (aqşam ve yatsı vaqtında), sabağa
          qavuşqanıñızda, kündüzniñ soñunda ve üyle vaqtına irişkeniñizde, Allahnı tesbih
          etiñ (namaz qılıñ), ki, köklerde ve yerde hamd Oña mahsustır. (Abdullah b. Abbas
          (r.a.)dan kelgen rivayetke köre, bu ayet beş vaqıt namaznı içine almaqta. Bu
          sebepnen, ekseri alimler beş vaqıt namaznıñ Mekkede farz qılınğanı
          qanaatindedirler. Az. Peyğamber (s.a.) bir hadis-i şerifte büyük savap qazanmaq
          istegenlerge bu ayetni oqumalarını tevsiye etken).
        cid: 0
  - verse: 18
    segments:
      - text: >
          [17 ayetine baq.]
        cid: 0
  - verse: 19
    segments:
      - text: >
          Ölüden tirini, tiriden de ölüni O çıqarmaqta; yer yüzüni ölüminiñ artından O
          canlandırmaqta. İşte, siz de (qabirleriñizden) böyle çıqarılacaqsıñız. (Ayette
          ölgenden soñ tirilüvniñ iç de öyle aqılğa sığmaz bir şey olmağanı, yer yüzündeki
          devamlı yañılanuv adiselerine işaret ile müim bir şekilde añlatılmaqta.
          Aqiqaten, qup-quru topraqtan yem-yeşil ekinler ve tereklerden meyvalar ve
          yapraqlar, çeşit renkte çeçekler çıqarğan ilâhiy qudret içün, yoqtan bar etken
          insannı tekrar tiriltüviniñ qıyın olacağı aqılğa sığmaz. Esapsız «baa's
          ba'de'l-mevt» (ölgenden soñ tirilüv) adisesine sahna olğan yer yüzüne bir kere
          ibret közünen baqmaq bile, Allahnıñ qudretini añlamaq içün yetecek).
        cid: 0
  - verse: 20
    segments:
      - text: >
          Sizni topraqtan yaratuvı, Onıñ (barlığınıñ) delillerindendir. Soñra siz, (er
          tarafqa) darqağan insanlar ola qoydıñız.
        cid: 0
  - verse: 21
    segments:
      - text: >
          Qavuşuvlarıñız içün sizge öz (cınsı)ñızdan zevceler yaratıp, arañızda sevgi ve
          merhamet peyda etüvi de, Onıñ (barlığınıñ) delillerindendir. Doğrusı, bunda
          yahşı tüşüngen bir qavm içün ibretler bar.
        cid: 0
  - verse: 22
    segments:
      - text: >
          Onıñ delillerinden biri de, köklerni ve yerni yaratuvı, tilleriñizniñ ve
          renkleriñizniñ çeşit oluvıdır. Şübesiz, bunda bilgenler içün (alınacaq) dersler
          bar. (İnsanlarnıñ bir erkek ve bir qadından yaratılmaqnen beraber, farqlı
          hususiyetlerge saip toplulıqlarğa ayırılğanları mevzusında Hucuraat suresiniñ
          13-nci ayeti izaatına baqıñ).
        cid: 0
  - verse: 23
    segments:
      - text: >
          Gece olsun, kündüz olsun, yuqlamañız ve Allahnıñ lütfinden (nasibiñizni)
          aramañız da, Onıñ (barlığınıñ) delillerindendir. Aqiqaten, bunda eşitken bir
          qavm içün ibretler bar. (Ayet «geceleyin yuqlamañız ve kündüzi Allahnıñ
          lütfinden (nasibiñzni) qıdıruvıñız...», şeklinde de manalandırılğan. Ancaq, er
          eki vaqıtnıñ er eki işke elverişli olğanı manası daa quvetlidir).
        cid: 0
  - verse: 24
    segments:
      - text: >
          Kene Onıñ delillerinden ki, sizge qorqu ve ümüt bermek üzre, şemşekni köstere,
          kökten suv endirip, ölüminiñ artından yerni onıñnen tirilte. Doğrusı, bunda
          aqlını işletken bir qavm içün (alınacaq) dersler bar.
        cid: 0
  - verse: 25
    segments:
      - text: >
          Kökniñ ve yerniñ Onıñ emrinen toqtavı da, Onıñ (barlığınıñ) delillerindendir.
          Soñra sizni topraqtan bir çağırdımı, aman (qabirleriñizden) çıqa qoyarsıñız.
        cid: 0
  - verse: 26
    segments:
      - text: >
          Köklerde ve yerde olğanlar ep Onıñdır. Episi Oña boyun eggendir.
        cid: 0
  - verse: 27
    segments:
      - text: >
          İlk defa mahlüqını yaratıp, (ölümden) soñ, bunı (yaratmaqnı) tekrarlağan Odır,
          ki bu, Onıñ içün pek qolay. Köklerde ve yerde (tecelli etken) eñ yüce sıfat
          Onıñdır. O, mutlaq küç ve ikmet saibidir.
        cid: 0
  - verse: 28
    segments:
      - text: >
          Allah sizge özüñizden bir misal ketirmekte: Mülkiyetiñiz altında bulunğan
          hızmetkârlar içün de, sizge berdigimiz rızıqlarda -bir-biriñizden çekingeniñiz
          kibi, olardan çekinecek dereceñizde siznen musaviy (aqıllarğa saip)-
          ortaqlarıñız barmı? İşte, biz ayetlerimizni, aqlını işletecek bir qavm içün,
          böylece izaatlamaqtamız. (Ayette insanlarnıñ, öz cınslarından ve aynı yaratılış
          vasfına saip olğan hızmetkârlarını bile, özlerine musaviy tutmağa, keçici dünya
          mülklerine ortaq etmege razılıq köstermegenleri aqiqatına işaret etilerek;
          ortağı ve oña beñzegeni olmağan Yüce Allahqa şirk qoşuvnıñ, onıñ mutlaq
          mülkiyetine ortaqlıq qoşuvnıñ ne qadar aqılğa sığmaz bir iş olğanı, temsil
          yolunen añlatılmaqta ve hızmetkârnıñ efendisine ortaq olalmaycağı kibi, qulnıñ
          da, Allahqa ortaq olalmaycağı añlatılmaqta. Ayrıca, Qur'an ayetleriniñ tüşüngen
          qafalarğa hitap etkeni de, ayrıca bildirile).
        cid: 0
  - verse: 29
    segments:
      - text: >
          Kel, kör ki, aqsızlıq etkenler, bilgisizliknen fena arzularına uydılar. Allahnıñ
          saptırğanını kim doğru yolğa iriştire bilir? Olar içün iç bir yardımcı yoqtır.
        cid: 0
  - verse: 30
    segments:
      - text: >
          (Resulım!) Sen yüzüñni hanif olaraq, dinge, Allah insanlarnı angi tabiyatta
          yaratqan ise, oña çevir. Allahnıñ yaratuvında deñişme yoqtır. İşte, dos-doğru
          din budır; faqat insanlarnıñ çoqu bilmezler. («Hanif» - egrilikke sapmadan,
          doğru yoldan yürgen demektir. Termin olaraq, İbrahim Peyğamberniñ tevhid, yani
          «Allahnı bir tanımaq dini» manasında qullanılır. Bir Allahqa inanğan kimsege de
          «hanif» denilir. Buhariy, Ebu Hureyradan rivayet etken bir hadiske köre, er bir
          bala, tabiyatınen (tevhidge meyilli) doğa; soñ, ana-babası onı yeudiy, hristian
          ya da mecusiy yapar. İşte, ayette zikr etilgen «fitrat» (tabiyat) Allah,
          insanlarnı doğuvdan «tek Allah inançı»na meylli yaratqanını ifade ete).
        cid: 0
  - verse: 31
    segments:
      - text: >
          Epiñiz Oña yönelerek, Oña qarşı kelüvden saqınıñ, namaznı qılıñ; müşriklerden
          olmañ.
        cid: 0
  - verse: 32
    segments:
      - text: >
          Dinlerni parçalağan ve bölük-bölük olğanlardan (olmañ. Bulardan) er fırqa
          özlerinde olğanınen ğururlanmaqta.
        cid: 0
  - verse: 33
    segments:
      - text: >
          İnsanlarnıñ başına bir sıqıntı kelgeninen, Rabblerine yönelerek, Oña
          yalvarırlar. Soñra, Allah qatından olarğa bir rahmet (nimet ve bollıq)
          tattırğanınen, baqarsıñız ki, olardan bir topu kene Rabblerine ortaq
          qoşmaqtalar.
        cid: 0
  - verse: 34
    segments:
      - text: >
          Olarğa bergenlerimizge nankorlik etsinler baqayıq! Aydı, sefa süriñ; amma
          yaqında bileceksiñiz!
        cid: 0
  - verse: 35
    segments:
      - text: >
          Yoqsa, olarğa bir kesen-kes delil endirdik de, o delil, müşrik oluvlarını
          söylemektemi?
        cid: 0
  - verse: 36
    segments:
      - text: >
          İnsanlarğa bir rahmet tattırğanımızda, oña sevinirler. Eger yapqanlarından ötrü,
          başlarına bir yamanlıq kelse, aman ümütsizlikke tüşe qoyarlar.
        cid: 0
  - verse: 37
    segments:
      - text: >
          Körmedilermi ki, Allah rızqnı istegenine bol-bol bermekte, istegeniniñkini de
          tarlaştırmaqta. Şübesiz, imanlı bir qavm içün bunda ibretler bar.
        cid: 0
  - verse: 38
    segments:
      - text: >
          O alda, sen aqarabağa, yoqsulğa, yolda qalganğa aqqını ber. Allah rizasını
          istegenler içün bu, eñ yahşısıdır. İşte, olar qurtulışqa irişkenlerdir.
          (Ayetteki «aqqını ber» diye ifade etilgen emir sila-i rahimde bulunuv, zekât
          berüv, yahşılıq etüv kibi manalarnen tefsir etile).
        cid: 0
  - verse: 39
    segments:
      - text: >
          İnsanlarnıñ mallarında artış olsun diye, bergen er angi bir fayızıñız, Allah
          qatında artmaz. Allah rizasını isteyerek bergen zekâtıñızğa kelgende, işte
          zekâtnı bergen o kimseler, ebet olar (savaplarını ve mallarını) qat-qat
          arttırğanlardır. (Ayetniñ ilk cumlesindeki «ribaa» esasen şu şekillerde tefsir
          etilgen: Berilgen fayıznıñ özü, qarşılığında maddiy menfaat ümüt etilgen er angi
          bir bahşış, fayızğa berilgen mal ya da para. Soñki mana esasqa alınğanda,
          ayetniñ «insanlarnıñ malları arasında degerlensin, artsın diye bergeniñiz...»,
          şeklindeki tercimesi uyğun olur. Ayette musulmanlarnı ileride kesen-kes olaraq
          ükümge bağlanacaq olğan ribaa yasağına azırlayıcı bir ifade qullanılğan).
        cid: 0
  - verse: 40
    segments:
      - text: >
          Allah, (o yüce barlıqtır) ki, sizni yaratqan, soñra rızıqlandırğan; soñra O,
          ayatıñıznı soñuna iriştirecek, daa soñunda da, sizni (tekrar) tiriltecek. Yahşı,
          siziñ (Allahqa ortaq qoşqan) ortaqlarıñız arasında bulardan birini yapa bilecek
          barmı? Allah olarnıñ ortaq qoşqanlarından uzaqtır ve yücedir.
        cid: 0
  - verse: 41
    segments:
      - text: >
          İnsanlar, şahsen özleri yapqanlarınıñ sebebinden, qarada ve deñizde tertip
          bozuldı ki, Allah yapqanlarınıñ bir qısmını olarğa tattırsın; belki de, (tutqan
          yaman yollarından) qaytırlar. (Ayette yaman fiillerge, ibret olsun diye, dünyada
          olğanda berilgen qarşılıqlar içün «bir qısmı» denilmekte ve asıl cezanıñ
          ahirette olğanına işaret etilmekte).
        cid: 0
  - verse: 42
    segments:
      - text: >
          (Resulım!) De ki: Yer yüzünde kezip dolaşıñ da, daa evelkilerniñ aqibetleri
          nasıl oldı, körüñ. Olarnıñ çoqu müşrik edi.
        cid: 0
  - verse: 43
    segments:
      - text: >
          Allah qatından dönüş olmağan bir kün (qıyamet künü) kelmeden evel, yüzüñni o
          aqiqiy dinge çevir! O künü (insanlar) bölük-bölük ayırılacaqlar.
        cid: 0
  - verse: 44
    segments:
      - text: >
          Kim inkâr etse, inkârı öz aleyhine olur. Yahşı işler yapqanlarğa kelgende, olar
          da özleri içün (cenneteki yerlerini) azırlağan olurlar.
        cid: 0
  - verse: 45
    segments:
      - text: >
          Zira, Allah, iman etip, yahşı işler yapqanlarğa öz lütfinden qarşılıq berecek.
          Şübesiz, O, kâfirlerni sevmez.
        cid: 0
  - verse: 46
    segments:
      - text: >
          Sizge rahmetinden tattırsın, emrinen gemiler yürsin, nimetinden (nasibiñizni)
          qıdırasıñız ve şükür etesiñiz, diye (ayat ve bereket) müjdecileri olaraq,
          rüzgârlarnı yollavı da, Allahnıñ (barlığınıñ ve qudretiniñ) delillerindendir.
          (Kâinatnı yaratqan da, idare etken de Allahtır. Yaratuvnı nasıl bir sıra ve
          tertip (qanun) içinde yapqan ise, idaresini de, aynı şekilde qanunlarınen icra
          etmekte. Sebep-netice bağlılığı ilâhiy bir qanundır. Yağmurnıñ yağuvı da bir
          tertip sebep-netice munasebetlerine bağlıdır. Ğafiller yalıñız sebep ve neticeni
          körerler, mü'minler ise, sebeplerniñ yaratıcısını (musebbibu'l-esbaabnı) da,
          körer ve Oña şükür eterler).
        cid: 0
  - verse: 47
    segments:
      - text: >
          Ant olsun ki, biz senden evel öz qavmlarına nice peyğamber yolladıq da, olarğa
          açıq deliller ketirdiler. (Olarnı diñlemeyip) günahqa dalğanlarnıñ ise,
          cezalarını haqqı ile bergendirmiz. Mü'minlerge yardım etmek de bizge ait.
        cid: 0
  - verse: 48
    segments:
      - text: >
          Allah Odır ki, rüzgârlarnı yollar, bular da bulutnı quvar. Derken, Allah onı
          kökte istegeni kibi yayar ve parça-parça eter; niayet, arasından yağmurnıñ
          çıqqanını körersiñ. Allah tilegen qullarına yağumurnı nasip etkeninen, olar
          sevine qoyarlar.
        cid: 0
  - verse: 49
    segments:
      - text: >
          Albuki, olar daa evel üstlerine yağmur yağdırıluvından ümütlerini eyice kesken
          ediler.
        cid: 0
  - verse: 50
    segments:
      - text: >
          Allah rahmetiniñ eserlerine bir baq: Yerni, ölüminiñ artından nasıl tiriltmekte!
          Şübesiz, O, ölülerni de mıtlaqa tiriltecek. O, er şeyge qadirdir.
        cid: 0
  - verse: 51
    segments:
      - text: >
          Ant olsun ki, bir rüzgâr yollasaq da, onı (ekinni) sararğan körseler, artından
          muaqqaq nankorlikke başlarlar. (Ayetteki «onı sararğan körseler» diye manası
          berilgen cumlede yer alğan «onı» manasındaki zamir şu şekillerde tefsir etilgen:
          a). Allah rahmetiniñ yani yağmurnıñ eseri olğan ekin ve yeşilliktir, b).
