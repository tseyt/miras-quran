surah_id: 81
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >-
          Kuneş qatlanıp tüyurilgende,
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Yıldızlar (qararıp) tökülgende,
        cid: 0
  - verse: 3
    segments:
      - text: >-
          Dağlar (sallanıp) yurütilgende,
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Balalaycaq develer başları boş qoyup yiberilgende,
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Vahşiy ayvanlar toplanıp, bir yerge ketirilgende,
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Deñizler qaynatılğanda,
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Ruhlar (bedenlernen) birleştirilgende,
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Tirileyin topraqqa komülgen qızğa, angi gunah sebebinen, oldürilgeni
          soralğanda,
        cid: 0
  - verse: 9
    segments:
      - text: >-
          [8 ayetine baq.]
        cid: 0
  - verse: 10
    segments:
      - text: >-
          (Ameller yazılı olğan) defterler açılğanda,
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Kok yuzü sokülip alınğanda,
        cid: 0
  - verse: 12
    segments:
      - text: >-
          Ceennem tutaştırılğanda ve cennet yaqlaştırılğanda,
        cid: 0
  - verse: 13
    segments:
      - text: >-
          [12 ayetine baq.]
        cid: 0
  - verse: 14
    segments:
      - text: >-
          İnsan neler ketirgenini bilecek.
        cid: 0
  - verse: 15
    segments:
      - text: >-
          Yoq! Aqıp ketken, bir ğayıp olup, bir etrafnı aydınlatqan yıldızlarğa ant
          olsun,
        cid: 0
  - verse: 16
    segments:
      - text: >-
          [15 ayetine baq.]
        cid: 0
  - verse: 17
    segments:
      - text: >-
          Qararmağa yuz tutqanda, gecege ant olsun,
        cid: 0
  - verse: 18
    segments:
      - text: >-
          Ağarmağa başlağanda, sabağa ant olsun ki,
        cid: 0
  - verse: 19
    segments:
      - text: >-
          O (Qur’an), şubesiz degerli, kuçlü ve Arşnıñ saibi (Allaһnıñ) qatında itibarlı
          bir elçi (Cebrail) ketirgen sözdir.
        cid: 0
  - verse: 20
    segments:
      - text: >-
          [19 ayetine baq.]
        cid: 0
  - verse: 21
    segments:
      - text: >-
          O, o yerde itibarlı, işanılğan (bir elçi)dir.
        cid: 0
  - verse: 22
    segments:
      - text: >-
          Arqadaşıñız (Muһammed) de mecnun degildir.
        cid: 0
  - verse: 23
    segments:
      - text: >-
          Ant olsun ki, onı (Cebrailni) ap-açıq ufuqta korgendir.
        cid: 0
  - verse: 24
    segments:
      - text: >-
          O, ğaybnıñ bilgilerini (sizden) gizlemez.
        cid: 0
  - verse: 25
    segments:
      - text: >-
          O lânetlengen şeytannıñ sözü de degildir.
        cid: 0
  - verse: 26
    segments:
      - text: >-
          Al boyle eken, ne yerge barmaqtasıñız.
        cid: 0
  - verse: 27
    segments:
      - text: >-
          O, er kes içün, sizden doğru yolda yurmek istegenler içün, bir ogüttir.
        cid: 0
  - verse: 28
    segments:
      - text: >-
          [27 ayetine baq.]
        cid: 0
  - verse: 29
    segments:
      - text: >-
          Alemlerniñ Rabbi Allaһ istemegence, siz istep olamazsıñız. (Ayetteki «ğayb»
          sözü - duyğu azalarınen idrak etilalmağan ve faqat inanılması kerek olğan iman
          esaslarını içine almaqta. Allaһ Resulı olar aqqında saranlıqnen davranmağanı,
          yani er angi bir şeyni gizlemegeni izaatlanğan).
        cid: 0