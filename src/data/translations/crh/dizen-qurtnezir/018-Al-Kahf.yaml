      - text: >-
          (Tefsircilerge köre, «kehf» - dağda bulunğan kenişçe mağara demektir. «Raqiim»niñ ne
          olğanı mevzusında kesen-kes bir neticege kelinmegen. Ancaq, şu manalardan birine
          kele bilecegi bildirilgen: Mağara bulunğan dağ ya da vadiy; Ashab-ı Kehfniñ isimleri
          yazılı olğan kitabe. Sahiih-i Buhariydeki bir rivayetke köre de, Ashab-ı raqiim,
          Ashab-ı Kehfhten ğayrı, üç adamlıq bir toplulıqtır ki, bular yağmurlı bir avada
          sığınğan mağaranıñ kirişini büyük bir qayanıñ qapatuvınen, mağara içinde qalğanlar.
          Er biri, vaqtı ile yapqan güzel bir davranışnı hatırlayaraq, qurtulmaq içün
          yalvarırlar. Olar dua etkeninen, qaya biraz daa açılır ve soñunda qurtulırlar.
          Ancaq, üstünlikke lâyıq fikr - Raqiim Ashab-ı Kehfniñ ismileri yazılı kitapnıñ
          adıdır).
