surah_id: 18
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >
          Hamd olsun Allahqa ki, O, (insanlarnı) öz tarafından çetin bir azap ile
          tenbiyelemek, yahşı iş ve davranışlarda bulunğan mü'minlerge, özleri içün,
          içinde ebediy qalacaqları (cennette) güzel bir ecir bulunğanını müjdelemek ve
          «Allah evlât edindi», degenlerni de tenbiyelemek içün qulına (Muhammedge),
          özünde iç bir (zıtlıq ve) egrilik olmağan dos-doğru Kitapnı endirdi.
        cid: 0
  - verse: 2
    segments:
      - text: >
          [1 ayetine baq.]
        cid: 0
  - verse: 3
    segments:
      - text: >
          [1 ayetine baq.]
        cid: 0
  - verse: 4
    segments:
      - text: >
          [1 ayetine baq.]
        cid: 0
  - verse: 5
    segments:
      - text: >
          Ne olarnıñ (Allah evlât edindi, degenlerniñ), ne de atalarınıñ, bu meselede iç
          bir bilgisi yoqtır. Ağızlarından çıqqan bu söz ne büyük oldı! Yalandan başqa bir
          şey söylemeyler. (Fahreddin Raiziyge köre, şu üç gruppa Allahnıñ balası olğanını
          söylegenlerdir: 1. «Melekler Allahnıñ qızlarıdır», degen müşrik araplar, 2. «İsa
          Allahnıñ oğludır», degen hristianlar, 3. «Uzeyr Allahnıñ oğludır», degen
          yeudiyler. İslâm ise, bu inançlarnı red ete).
        cid: 0
  - verse: 6
    segments:
      - text: >
          Bu yañı Kitapqa inanmaz iseler (ve bu sebepten elâk olur iseler), artlarından
          ğam-kedernen, aman-aman, özüñni harap eteceksiñ.
        cid: 0
  - verse: 7
    segments:
      - text: >
          Biz, insanlarnıñ angisiniñ daa güzel amel etecegini sınayıq, diye yer yüzündeki
          er şeyni dünyanıñ özüne mahsus bir ziynet yaptıq.
        cid: 0
  - verse: 8
    segments:
      - text: >
          (Bunıñen beraber) biz mıtlaqa o yerdeki er şeyni qup-quru bir topraq yapacaqmız.
        cid: 0
  - verse: 9
    segments:
      - text: >
          (Resulım!) Yoqsa, sen bizim ayetlerimizden (sadece) Kehf ve Raqiim saipleriniñ
          ibretke lâyıq zan ettiñmi? (Tefsircilerge köre, «kehf» - dağda bulunğan kenişçe
          mağara demektir. «Raqiim»niñ ne olğanı mevzusında kesen-kes bir neticege
          kelinmegen. Ancaq, şu manalardan birine kele bilecegi bildirilgen: Mağara
          bulunğan dağ ya da vadiy; Ashab-ı Kehfniñ isimleri yazılı olğan kitabe. Sahiih-i
          Buhariydeki bir rivayetke köre de, Ashab-ı raqiim, Ashab-ı Kehfhten ğayrı, üç
          adamlıq bir toplulıqtır ki, bular yağmurlı bir avada sığınğan mağaranıñ kirişini
          büyük bir qayanıñ qapatuvınen, mağara içinde qalğanlar. Er biri, vaqtı ile
          yapqan güzel bir davranışnı hatırlayaraq, qurtulmaq içün yalvarırlar. Olar dua
          etkeninen, qaya biraz daa açılır ve soñunda qurtulırlar. Ancaq, üstünlikke lâyıq
          fikr - Raqiim Ashab-ı Kehfniñ ismileri yazılı kitapnıñ adıdır).
        cid: 0
  - verse: 10
    segments:
      - text: >
          O (yigit) gençler mağarağa sığınğanlar ve: Rabbimiz! Bizge tarafıñdan rahmet ber
          ve bizge (şu) vaziyetimizden bir qurtulış yolu azırla! degen ediler.
        cid: 0
  - verse: 11
    segments:
      - text: >
          Bunıñ üzerine biz de o mağarada olarnıñ qulaqlarına nice yıllar perde qoydıq
          (yuquğa daldırdıq).
        cid: 0
  - verse: 12
    segments:
      - text: >
          Soñra da, eki toplumdan (Ashab-ı Kehf ile duşmanlarından) angisiniñ qalğan
          müddetleri daa yahşı esap etecegini köreyik, diye olarnı uyandırdıq.
        cid: 0
  - verse: 13
    segments:
      - text: >
          Biz saña olarnıñ başından keçkenlerni kerçek olaraq añlatmaqtamız. Aqiqaten,
          olar Rabblerine inanğan gençler ediler. Biz de olarnıñ hidayetini arttırdıq.
        cid: 0
  - verse: 14
    segments:
      - text: >
          Olarnıñ qalplerini metin yaptıq. O yigitler (o yerniñ ükümdarı qarşısında)
          ayaqqa qalqaraq, dediler ki: «Bizim Rabbimiz köklerniñ ve yerniñ Rabbidir. Biz
          Ondan başqasına tañrı dememiz. Yoqsa, saçma-sapıq qonuşqan olurmız.
        cid: 0
  - verse: 15
    segments:
      - text: >
          Şu bizim qavmımız Allahtan başqa tañrılar edindiler. Bare, bu tañrılar
          mevzusında, açıq bir delil ketirseler. (Mümkünmi!) Öyle ise, Allah aqqında yalan
          uydurğandan daa zalımı barmı?.
        cid: 0
  - verse: 16
    segments:
      - text: >
          (Aralarından birisi böyle degen edi:) «Madam ki, siz olardan ve olarnıñ Allahtan
          ğayrı tabınğan varlıqlarından uzaqlaştıñız, o alda, mağarağa sığınıñ ki,
          Rabbiñiz sizge rahmetini yaysın ve işiñizde siz içün fayda ve qolaylık
          teminlesin».
        cid: 0
  - verse: 17
    segments:
      - text: >
          (Resulım! O yerde olsa ediñ) küneşni körer ediñ: Doğgan zamanı mağaralarınıñ
          sağına meyl eter; batqanında da, sol tarafından olarğa toqunmadan keçer edi.
          (Böylece) olar (küneş ışığından raatsız olmadan) mağaranıñ bir köşesinde (yuqlar
          ediler). İşte, bu Allahnıñ ayetlerindendir. Allah kimge hidayet etse, işte, o
          haqqa qavuşqandır, kimni de hidayetten mahrum etse, artıq onı doğruğa yöneltecek
          bir dost tapalmazsıñ.
        cid: 0
  - verse: 18
    segments:
      - text: >
          Olar yuquda olğanları alda, sen olarnı uyanıq sanar ediñ. Olarnı sağğa-solğa
          çevire edik. Köpekleri de mağaranıñ kirişinde ög ayaqlarını uzataraq yatmaqta
          edi. Eger olarnıñ vaziyetlerine şaat olsa ediñ, çevirilip, olardan qaçar ediñ ve
          körgenliriñniñ sebebinden, içiñ qorqunen tolar edi.
        cid: 0
  - verse: 19
    segments:
      - text: >
          Böylece, biz aralarında bir-birilerinden soramaları içün, olarnı uyandırdıq.
          Aralarından biri: «Ne qadar qaldıñız?» dedi. (Kimi) «Bir kün ya da künniñ bir
          qısmı qadar qaldıq», dediler; (Kimi de) böyle dediler: «Rabbiñiz qalğan
          müddetiñizni daa yahşı bilir. Şimdi siz arañızdan birini şu kümüş parañıznen
          şeerge yollañ da, baqsın (şeerniñ) angi aşalacağı daa temiz ise, sizge ondan
          erzaq ketirsin; ayrıca nazik davransın (gizli areket etsin) ve saqın sizni
          kimsege sezdirmesin».
        cid: 0
  - verse: 20
    segments:
      - text: >
          «Çünki, olar eger sizni duysalar, ya sizni taşborannen öldürirler, ya da öz
          dinlerine çekerler ki, o vaqıtta ebediyen qurtulışqa irişalmazsıñız».
          (Beyzaviyniñ naql etkenine köre, şeerge yollanılğan adam elindeki paranı
          arclamaq içün çıqarğanınen, şeer halqı paranıñ üstündeki qıral Dekânosnıñ
          resimini köre ve adamnı bir hazine tapqan sanaraq, onı devirnıñ ükümdarına alıp
          baralar. Aradan uzun vaqıt keçken. Artıq bu ükümdar tevhid aqidesine bağlı bir
          hristiandır. Genç adam qıralğa başlarından keçkenni añlata. Beraber mağarağa
          baralar ve gençniñ añlatqanlarınıñ doğrulığını ayretler içinde köreler. Yañıdan
          tirilüvniñ imkânını isbatlağan bu muşaadeden soñ, Allah Taalâ bu gençlerni
          tekrar ebediy yuquğa daldıra).
        cid: 0
  - verse: 21
    segments:
      - text: >
          Böylece, (insanlarnı) olardan haberdar ettik ki, Allah vadesiniñ haq olğanını,
          qıyametniñ şübesiz olğanını bilsinler. O vaqıtta olar aralarında Ashab-ı Kehfniñ
          vaziyetini tartışa ediler. Dediler ki: «Üzerlerine bir bina yapıñ. Rabbleri
          olarnı daa yahşı bilir». Olarnıñ vaziyetine şaat olğanlar ise: «Bizler kesen-kes
          olarnıñ yanbaşlarına bir mescid yapacaqmız», dediler.
        cid: 0
  - verse: 22
    segments:
      - text: >
          (İnsanlarnıñ kimi:) «Olar üç adamdır; dörtüncileri de köpekleridir», deycekler;
          kene: «Beş adamdır; Altıncıları köpekleridir», deycekler. (Bular) bilinmegen şey
          aqqında tahmin yürütmektir. (Kimleri de:) «Olar yedi adamdır; sekizincisi
          köpekleridir», derler. De ki: Olarnıñ sayılarını Rabbim daa yahşı bilir. Olar
          aqqında bilgisi olğan pek azdır. Öyle ise, Ashab-ı Kehf aqqında delillerniñ açıq
          oluvından ğayrı, bir munaqaşağa kirişme ve olar aqqında (aşağı-yuqarı qonuşqan)
          kimselerniñ iç birinden malümat sorama.
        cid: 0
  - verse: 23
    segments:
      - text: >
          Allahnıñ istegenine bağlamağance (inşaaallah demegence) iç bir şey içün «bunı
          yarın yapacam» deme. Bunı unutqan taqdiriñde, Allahnı añ ve: «Ümüt eterim ki,
          Rabbim meni doğruğa - bundan daa yaqın bir yolğa qavuştırır», de.
        cid: 0
  - verse: 24
    segments:
      - text: >
          [23 ayetine baq.]
        cid: 0
  - verse: 25
    segments:
      - text: >
          Olar mağaralarında üç yüz yıl ve buña qoşma olaraq doquz yıl qalğandırlar. (Buña
          köre, Ashab-ı Kehf mağarada uç yüz doquz yıl qalğan. Bazı tefsirlerde bu sayınıñ
          qameriy taqvimge köre olğanı bildirilmekte. Üç yüz doquz qameriy yılnıñ
          qarşılığı ise, milâdiy üç asırdır. Rivayetke köre, ehl-i kitaptan bazıları
          Ashab-ı Kehfniñ mağarağa kirüvinden itibaren, Az.Muhammed (s.a.)niñ zamanına
          qadar keçken vaqıtnıñ üç yüz yıl olğanını idda etken ki, Allah Taalâ şu beyanı
          ile olarnıñ bu iddasını red etmektedir:)
        cid: 0
  - verse: 26
    segments:
      - text: >
          De ki: Ne qadar qalğanlarını Allah daa yahşı bilir. Köklerniñ ve yerniñ gizli
          bilgisi Oña aittır. Onıñ körmesi de, eşitmesi de ayretlidir. Olarnıñ (köklerde
          ve yerde olğanlarnıñ), Ondan başqa bir yöneticisi yoqtır. O, öz ükümranlığına
          kimseni ortaq etmez.
        cid: 0
  - verse: 27
    segments:
      - text: >
          Rabbiñniñ Kitabından saña vahiy etilgenini oqu. Onıñ kelimelerini deñiştire
          bilecek yoqtır. Ondan başqa bir sığınılacaq da tapamazsıñ.
        cid: 0
  - verse: 28
    segments:
      - text: >
          Saba-aqşam Rabblerine, Onıñ rızasını tileyerek, dua etkenlernen birlikte
          yürekten sebat et. Dünya ayatınıñ süsüni isteyerek, közleriñni olardan çevirme.
          Qalbini bizni añuvdan ğafil qıldığımız, fena arzularına uyğan ve işi-gücü adden
          aşuv olğan kimsege boyun egme. (Bazı Qureyş ileri kelgenleri Az.Peyğamberden
          Allahqa ve Resulına yürekten bağlı, faqat maddiy taraftan, faqır mü'minlerni
          yanından quvğanını istegenler, böyle yapqan taqdirinde, onıñnen körüşip, qonuşa
          bileceklerini söylegen ediler. İşte, bu ayet Beyzaviyniñ tefsirinde de
          bildirilgeni kibi, üstünlik ve şerefniñ, bedeniy ve maddiy ziynette degil, goñül
          ziynetinde, yani iman ve güzel yaşayışta olğanını, tolayısınen, müşriklerniñ bu
          istegine deger bermemek kerekligini ifade etmekte).
        cid: 0
  - verse: 29
    segments:
      - text: >
          Ve de ki: Haq, Rabbiñizdendir. Öyle ise, istegen iman etsin, istegen inkâr
          etsin. Biz zalımlarğa öyle bir ceennem azırladıq ki, onıñ divarları olarnı
          çepe-çevre sarğandır. (Suvsızlıqtan) imdat tileycek olsaler, imdatlarına irigen
          maden kibi yüzlerni aşlağan bir suvnen cevap berilir. Ne fena bir içilecek ve ne
          fena bir qalınacaq yer!
        cid: 0
  - verse: 30
    segments:
      - text: >
          İman etip de, güzel davranışlarda bulunğanlar (bilmeliler ki) biz güzel işler
          yapqanlarnıñ ecrini zaya etmeymiz.
        cid: 0
  - verse: 31
    segments:
      - text: >
          İşte, olarğa alt taraflarından irmaqlar aqqan Adn cennetleri bardır. Olar Adn
          cennetlerinde tahtlar üzerine qurularaq, o yerde altın bilezliklernen
          bezenecekler; ince ve qalın yipek yeşil basmadan urbalar kiyecekler. Ne güzel
          qarşılıq ve ne güzel qalınacaq yer!
        cid: 0
  - verse: 32
    segments:
      - text: >
          Olarğa şu eki adamnı misal olaraq añlat: Bulardan birine eki yüzüm bağı bergen,
          er ekisiniñ de etrafını hurmalarnen donatqan, aralarında da ekinler östürgen
          edik.
        cid: 0
  - verse: 33
    segments:
      - text: >
          Eki bağnıñ ekisi de yemişlerini bergen, iç birini eksik bıraqmağan edi. Ekisiniñ
          arasından bir de irmaq fışqırtqan edik.
        cid: 0
  - verse: 34
    segments:
      - text: >
          Bu adamnıñ başqa keliri de bar edi. Bu sebepten, arqadaşınen laf etkende, oña
          böyle dedi: «Men servet ceetinden senden daa zenginim; insan sayısı noqtai
          nazarından da senden daa küçlüm». (Bu eki adamnıñ kimligi meselesinde mevcut
          körüşler şulardır: 1. Mahzum qabilesinden mekkeli eki qardaştır. 2. Allah
          Resulınen mekkeli müşriklerdir. 3. Allahqa inanğan ve inanmağan er kes içün
          keçerli bir misaldir. 4. Lu'ayne b. Hısn ve ashabınen Selman, Suheyb ve ashabı
          arasında bir beñzetüvdir. 5. Babalarından qalğan büyük capta bir mirasçı birisi
          inançınıñ keregi kibi, digeri de inançsızlıqnıñ keregi kibi arcalağan eki
          israilli qardaşlardır... Episindeki bir noqta - iman etmeyip, servetni yekâne
          ğaye qabul eterek, mal toplamaqnıñ inasannı zulumğa ve ziyanğa süyrekleycegi
          aqiqatıdır).
        cid: 0
  - verse: 35
    segments:
      - text: >
          (Böyle ğurur ve kibrnen) özüne zulum eterek, bağına kirdi. böyle dedi: «Bunıñ iç
          bir zaman yoq olacağını zan etmeyim».
        cid: 0
  - verse: 36
    segments:
      - text: >
          «Qıyametniñ qopacağını da zan etmeyim. Şayet Rabbimniñ uzuruna alıp barılsam, iç
          bir şübem yoq ki, (o yerde) bundan daa hayırlı bir aqibet bulurım».
        cid: 0
  - verse: 37
    segments:
      - text: >
          Onıñnen qonuşqan arqadaşı oña hitaben: «Sen, dedi, seni topraqtan, soñra
          nutfeden (spermadan) yaratqan, daa soñra seni bir adam şekline ketirgen Allahnı
          inkâr ettiñmi?» (Servetiniñ ve adamlarınıñ çoqluğınen ğururlanğan bu adamnıñ
          ahiretni inkâr etkeni, 36-ncı ayetniñ başında añlatılğan edi. 37-nci ayette ise,
          bu adam Allahnı inkâr etüvde qabaatlana. Bu alda, Beyzaviyniñ de qayd etkeni
          kibi, ahiretni inkâr etmek, bir baqışta, Allahnı inkâr etmek demektir. Zira,
          ahiretniñ imkânsızlığını idda etmek, Allah küçüniñ sıñırsızlığından şübe
          etmekniñ bir neticesidir. Aqiqaten, bu adamğa özüniñ yaratıluv devirlerini
          hatırlatmaqnen, bu qudretniñ saibi olğan Allahnıñ qıyametni de kerçekleştirmek
          küçünde olğanı isbatlanmaq istenilgen).
        cid: 0
  - verse: 38
    segments:
      - text: >
          «Faqat O Allah menim Rabbimdir ve men Rabbime iç bir şeyni ortaq qoşmam».
        cid: 0
  - verse: 39
    segments:
      - text: >
          «Bağına kirgende: Maaşaaallah! Quvet yalıñız Allahnıñdır, dese ediñ ya! Eger mal
          ve evlâtnen meni özüñden küçsüz köre iseñ (şunı bil ki):
        cid: 0
  - verse: 40
    segments:
      - text: >
          «Belki, Rabbim maña seniñ bağıñdan daa yahşısını berir; seniñ bağıña ise, kökten
          yıldırımlar yollar da, bağ qup-quru bir topraq alına kelir».
        cid: 0
  - verse: 41
    segments:
      - text: >
          «Yahut, bağnıñ suvı tübge çekilir de, bir daa onı qıdırıp tapalmazsıñ».
        cid: 0
  - verse: 42
    segments:
      - text: >
          Derken, onıñ serveti quşatılıp, yoq etildi. Böylece, bağı oğrunda yapqan
          masraflardan ötrü, ellerini oqalap qaldı. Bağnıñ asmaları yerge çökken edi. «Ah,
          dey edi, keşke men Rabbime iç bir ortaq qoşmağan olsa edim!»
        cid: 0
  - verse: 43
    segments:
      - text: >
          Oña Allahtan başqa yardım etecek yardımcıları olmağanı kibi, öz-özüni de
          qurtaracaq küçte degil edi.
        cid: 0
  - verse: 44
    segments:
      - text: >
          İşte, bu yerde yardım ve dostluq, Haq olğan Allahqa aittir. Mükâfatı eñ eyi
          olğan O, eñ güzel aqibetni berici, kene Odır.
        cid: 0
  - verse: 45
    segments:
      - text: >
          Olarğa şunı da misal köster: Dünya ayatı - kökten endirgen bir suvımız kibidir,
          bu suv sayesinde yer yüzüniñ ekini (evelâ yetişip) bir-birine qarışqan; artından
          rüzgâr savurğan çör-çöplük alına kelgendir. Allah er şey üzerinde iqtidar
          saibidir. (Allah Taalâ 45-nci ayetteki teşbihnen dünya ayatınıñ keçici olğanını,
          ibret nazarınen baqqan insannıñ, bir ekinde bile, öz ayatınıñ başlanuvı,
          pişkinleşüvi ve tükenip, soñuna irişüvi devirlerini açıq bir şekilde köre
          bilecegini beyan etkenden soñ, insanğa yaraşqanı - dünyanıñ keçici ziynetlerine
          aldanmaq yerine, qısqa sürgen dünya ayatında yapacaq yahşı işlerinen ebediy
          saadetke irişmek olğanına böyle işaret etmekte):
        cid: 0
  - verse: 46
    segments:
      - text: >
          Servet ve oğullar dünya ayatınıñ süsüdir; ölümsiz olğan yahşı şeyler ise,
          Rabbiñniñ nezdinde em savap ceetinden daa hayırlı, em de ümüt bağlamağa daa
          lâyıqtır.
        cid: 0
  - verse: 47
    segments:
      - text: >
          (Tüşün) o künni ki, dağlarnı yerinden qoparırmız ve yer yüzüniñ çır-çıplaq
          olğanını körersiñ. İç birini bıraqmadan, olarnı (bütün ölülerni) mahşerde
          toplaycaqmız.
        cid: 0
  - verse: 48
    segments:
      - text: >
          Ve episi sıra-sıra Rabbiñniñ uzuruna çıqarılğandırlar: Ant olsun ki, sizni ilk
          defasında yaratqan şeklimizde bizge keldiñiz. Albuki, sizge vade etilgenlerniñ
          ortağa çıqacaq bir vaqtını tayin etmegenimizni zan etken ediñiz degilmi? (Bu
          ayetnen bağlı olaraq, Qurtubiy bir hadis naql ete ve hadisni bu ayetke eñ güzel
