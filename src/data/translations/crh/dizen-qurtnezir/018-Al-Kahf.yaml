surah_id: 18
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "Mahzum qabilesinden mekkeli eki qardaştır."
        cid: 0
  - verse: 2
    segments:
      - text: "Allaһ Resulınen mekkeli muşriklerdir."
        cid: 0
  - verse: 3
    segments:
      - text: "Allaһqa inanğan ve inanmağan er kes içün keçerli bir misaldir."
        cid: 0
  - verse: 4
    segments:
      - text: "Lu’ayne b. Hısn ve ashabınen Selman, Suheyb ve ashabı arasında bir beñzetüvdir."
        cid: 0
  - verse: 5
    segments:
      - text: "Babalarından qalğan buyuk capta bir mirasçı birisi inançınıñ keregi kibi, digeri de inançsızlıqnıñ keregi kibi arcalağan eki israilli qardaşlardır… Episindeki bir noqta - iman etmeyip, servetni yekâne ğaye qabul eterek, mal toplamaqnıñ inasannı zulumğa ve ziyanğa süyrekleycegi aqiqatıdır)."
        cid: 0
  - verse: 6
    segments:
      - text: "(Boyle ğurur ve kibrnen) ozüne zulum eterek, bağına kirdi. boyle dedi: «Bunıñ iç bir zaman yoq olacağını zan etmeyim»."
        cid: 0
  - verse: 7
    segments:
      - text: "«Qıyametniñ qopacağını da zan etmeyim. Şayet Rabbimniñ uzuruna alıp barılsam, iç bir şubem yoq ki, (o yerde) bundan daa hayırlı bir aqibet bulurım»."
        cid: 0
  - verse: 8
    segments:
      - text: "Onıñnen qonuşqan arqadaşı oña hitaben: «Sen, dedi, seni topraqtan, soñra nutfeden (spermadan) yaratqan, daa soñra seni bir adam şekline ketirgen Allaһnı inkâr ettiñmi?» (Servetiniñ ve adamlarınıñ çoqluğınen ğururlanğan bu adamnıñ ahiretni inkâr etkeni, 36-ncı ayetniñ başında añlatılğan edi. 37-nci ayette ise, bu adam Allaһnı inkâr etüvde qabaatlana. Bu alda, Beyzaviyniñ de qayd etkeni kibi, ahiretni inkâr etmek, bir baqışta, Allaһnı inkâr etmek demektir. Zira, ahiretniñ imkânsızlığını idda etmek, Allaһ kuçüniñ sıñırsızlığından şube etmekniñ bir neticesidir. Aqiqaten, bu adamğa ozüniñ yaratıluv devirlerini hatırlatmaqnen, bu qudretniñ saibi olğan Allaһnıñ qıyametni de kerçekleştirmek kuçünde olğanı isbatlanmaq istenilgen). 38. «Faqat O Allaһ menim Rabbimdir ve men Rabbime iç bir şeyni ortaq qoşmam». 39. «Bağına kirgende: Maaşaaallaһ! Quvet yalıñız Allaһnıñdır, dese ediñ ya! Eger mal ve evlâtnen meni ozüñden kuçsüz kore iseñ (şunı bil ki): 40. «Belki, Rabbim maña seniñ bağıñdan daa yahşısını berir; seniñ bağıña ise, kokten yıldırımlar yollar da, bağ qup-quru bir topraq alına kelir». 41. «Yahut, bağnıñ suvı tübge çekilir de, bir daa onı qıdırıp tapalmazsıñ»."
        cid: 0
  - verse: 9
    segments:
      - text: "(Resulım!) Yoqsa, sen bizim ayetlerimizden (sadece) Keһf ve Raqiim saipleriniñ ibretke lâyıq zan ettiñmi? (Tefsircilerge kore, «keһf» - dağda bulunğan keniiçe mağara demektir. «Raqiim»niñ ne olğanı mevzusında kesen-kes bir neticege kelinmegen. Ancaq, şu manalardan birine kele bilecegi bildirilgen: Mağara bulunğan dağ ya da vadiy; Ashab-ı Keһfniñ isimleri yazılı olğan kitabe. Sahiih-i Buhariydeki bir rivayetke kore de, Ashab-ı raqiim, Ashab-ı Keһfhten ğayrı, uç adamlıq bir toplulıqtır ki, bular yağmurl bir avada sığınğan mağaranıñ kirişini buyuk bir qayanıñ qapatuvınen, mağara içinde qalğanlar. Er biri, vaqtıi ile yapqan guzel bir davranışnı hatırlayaraq, qurtulmaq içün yalvarırlar. Olar dua etkeninen, qaya biraz daa açılır ve soñunda qurtulırlar. Ancaq, ustünlikke lâyıq fikr - Raqiim Ashab-ı Keһfniñ ismileri yazıl kitapnıñ adıdır)."
        cid: 0
  - verse: 10
    segments:
      - text: "O (yigit) gençler mağarağa sığınğanlar ve: Rabbimiz! Bizge tarafıñdan rahmet ber ve bizge (şu) vaziyetimizden bir qurtulış yolu azırla! degen ediler."
        cid: 0
  - verse: 11
    segments:
      - text: "Bunıñ uzerine biz de o mağarada olarnıñ qulaqlarına nice yıllar perde qoydıq (üquğa daldırdıq)."
        cid: 0
  - verse: 12
    segments:
      - text: "Soñra da, eki toplumdan (Ashab-ı Keһf ile duşmanlarından) angisiniñ qalğan muddetleri daa yahşı esap etecegini koreyik, diye olarnı uyandırdıq."
        cid: 0
  - verse: 13
    segments:
      - text: "Biz saña olarnıñ başından keçkenlerni kerçek olaraq añlatmaqtamız. Aqiqaten, olar Rabblerine inanğan gençler ediler. Biz de olarnıñ hidayetini arttırdıq."
        cid: 0
  - verse: 14
    segments:
      - text: "Olarnıñ qalplerini metin yaptıq. O yigitler (o yerniñ ukümdarı qarşısında) ayakqa qalqaraq, dediler ki: «Bizim Rabbimiz koklerniñ ve yerniñ Rabbidir. Biz Ondan başqasına tañrı dememiz. Yoqsa, saçma-sapıq qonuşqan olurmız."
        cid: 0
  - verse: 15
    segments:
      - text: "Şu bizim qavmımız Allaһtan başqa tañrılar edindiler. Bare, bu tañrılar mevzusında, açıq bir delil ketirseler. (Mumkünmi!) Oyle ise, Allaһ aqqında yalan uydurğandan daa zalımı barmı?."
        cid: 0
  - verse: 16
    segments:
      - text: "(Aralarından birisi boyle degen edi:) «Madam ki, siz olardan ve olarnıñ Allaһtan ğayrı tabınğan varlıqlarından uzaqlaştıñız, o alda, mağarağa sığınıñ ki, Rabbiñiz sizge rahmetini yaysın ve işiñizde siz içün fayda ve qolaylık teminlesin»."
        cid: 0
  - verse: 17
    segments:
      - text: "(Resulım! O yerde olsa ediñ) kuneşni korer ediñ: Doğgan zamanı mağaralarınıñ sağına meyl eter; batqanında da, sol tarafından olarğa toqunmadan keçer edi. (Boylece) olar (kuneş ışığından raatsız olmadan) mağaranıñ bir koşesinde (üqlar ediler). İşte, bu Allaһnıñ ayetlerindendir. Allaһ kimge hidayet etse, işte, o haqqa qavuşqandır, kimni de hidayetten mahrum etse, artıq onı doğruğa yoneltecek bir dost tapalmazsıñ."
        cid: 0
  - verse: 18
    segments:
      - text: "Olar yuquda olğanları alda, sen olarnı uyanıq sanar ediñ. Olarnı sağğa-solğa çevire edik. Kopekleri de mağaranıñ kirişinde og ayaqlarını uzataraq yatmaqta edi. Eger olarnıñ vaziyetlerine şaat olsa ediñ, çevirilip, olardan qaçar ediñ ve korgenliriñniñ sebebinden, içiñ qorqunen tolar edi."
        cid: 0
  - verse: 19
    segments:
      - text: "Boylece, biz aralarında bir-birilerinden soramaları içün, olarnı uyandırdıq. Aralarından biri: «Ne qadar qaldıñız?» dedi. (Kimi) «Bir kun ya da kunniñ bir qısmı qadar qaldıq», dediler; (Kimi de) boyle dediler: «Rabbiñiz qalğan muddetiñizni daa yahşı bilir. Şimdi siz arañızdan birini şu kumüş parañıznen şeerge yollañ da, baqsın (şeerniñ) angi aşalacağı daa temiz ise, sizge ondan erzaq ketirsin; ayrıca nazik davransın (gizli areket etsin) ve saqın sizni kimsege sezdirmesin»."
        cid: 0
  - verse: 20
    segments:
      - text: "«Çünki, olar eger sizni duysalar, ya sizni taşborannen oldürirler, ya da oz dinlerine çekerler ki, o vaqıtta ebediyen qurtulışqa irişalmazsıñız». (Beyzaviyniñ naql etkenine kore, şeerge yollanılğan adam elindeki paranı arclamaq içün çıqarğanınen, şeer halqı paranıñ ustündeki qıral Dekânosnıñ resimini kore ve adamnı bir hazine tapqan sanaraq, onı devirnıñ ukümdarına alıp baralar. Aradan uzun vaqıt keçken. Artıq bu ukümdar tevhid aqidesine bağlı bir hristiandır. Genç adam qıralğa başlarından keçkenni añlata. Beraber mağarağa baralar ve gençniñ añlatqanlarını doğrulığını ayretler içinde koreler. Yañıdan tirilüvniñ imkânını isbatlağan bu muşaadeden soñ, Allaһ Taalâ bu gençlerni tekrar ebediy yuquğa daldıra)."
        cid: 0
  - verse: 21
    segments:
      - text: "Boylece, (insanlarnı) olardan haberdar ettik ki, Allaһ vadesiniñ haq olğanını, qıyametniñ şubesiz olğanını bilsinler. O vaqıtta olar aralarında Ashab-ı Keһfniñ vaziyetini tartışa ediler. Dediler ki: «Uzerlerine bir bina yapıñ. Rabbleri olarnı daa yahşı bilir». Olarnıñ vaziyetine şaat olğanlar ise: «Bizler kesen-kes olarnıñ yanbaşlarına bir mesjid yapacaqmız», dediler."
        cid: 0
  - verse: 22
    segments:
      - text: "(İnsanlarnıñ kimi:) «Olar uç adamdır; dörtüncileri de kopekleridir», deycekler; kene: «Beş adamdır; Altıncıları kopekleridir», deycekler. (Bular) bilinmegen şey aqqında tahmin yurütmektir. (Kimleri de:) «Olar yedi adamdır; sekizincisi kopekleridir», derler. De ki: Olarnıñ sayılarını Rabbim daa yahşı bilir. Olar aqqında bilgisi olğan pek azdır. Oyle ise, Ashab-ı Keһf aqqında delillerniñ açıq oluvından ğayrı, bir munaqaşağa kirişme ve olar aqqında (aşağı-yuqarı qonuşqan) kimselerniñ iç birinden malümat sorama."
        cid: 0
  - verse: 25
    segments:
      - text: "Olar mağaralarında uç yuz yıl ve buña qoşma olaraq doquz yıl qalğandırlar. (Buña kore, Ashab-ı Keһf mağarada uç yuz doquz yıl qalğan. Bazı tefsirlerde bu sayınıñ qameriy taqvimge kore olğanı bildirilmekte. Uç yuz doquz qameriy yılnı qarşılığı ise, milâdiy uç asırdır. Rivayetke kore, ehl-i kitaptan bazıları Ashab-ı Keһfniñ mağarağa kirüvinden itibaren, Az.Muһammed (s.a.)niñ zamanına qadar keçken vaqıtnıñ uç yuz yıl olğanını idda etken ki, Allaһ Taalâ şu beyanı ile olarnı bu iddasını red etmektedir:)"
        cid: 0
  - verse: 26
    segments:
      - text: "De ki: Ne qadar qalğanlarını Allaһ daa yahşı bilir. Koklerniñ ve yerniñ gizli bilgisi Oña aittır. Onıñ kormesi de, eşitmesi de ayretlidir. Olarnıñ (koklerde ve yerde olğanlarnıñ), Ondan başqa bir yoneticisi yoqtır. O, oz ukümranlığına kimseni ortaq etmez."
        cid: 0
  - verse: 27
    segments:
      - text: "Rabbiñniñ Kitabından saña vahiy etilgenini oqu. Onıñ kelimelerini deñiştire bilecek yoqtır. Ondan başqa bir sığınılacaq da tapamazsıñ."
        cid: 0
  - verse: 28
    segments:
      - text: "Saba-aqşam Rabblerine, Onıñ rızasını tileyerek, dua etkenlernen birlikte yurekten sebat et. Dünya ayatınıñ süsüni isteyerek, kozleriñni olardan çevirme. Qalbini bizni añuvdan ğafil qıldığımız, fena arzularına uyğan ve işigucü adden aşuv olğan kimsege boyun egme. (Bazı Qureyş ileri kelgenleri Az. Peyğamberden Allaһqa ve Resulına yurekten bağlı, faqat maddiy taraftan, faqır mu’minlerni yanından quvğanını istegenler, boyle yapqan taqdirinde, onıñnen korüşip, qonuşa bileceklerini söylegen ediler. İşte, bu ayet Beyzaviyniñ tefsirinde de bildirilgeni kibi, ustünlik ve şerefniñ, bedeniy ve maddiy ziynette degil, goñyul ziynetinde, yani iman ve guzel yaşayışta olğanını, tolayısınen, muşriklerniñ bu istegine deger bermemek kerekligini ifade etmekte)."
        cid: 0
  - verse: 29
    segments:
      - text: "Ve de ki: Haq, Rabbiñizdendir. Oyle ise, istegen iman etsin, istegen inkâr etsin. Biz zalımlarğa oyle bir ceennem azırladıq ki, onıñ divarları olarnı çepeçevre sarğandır. (Suvsızlıqtan) imdat tileycek olsaler, imdatlarına irigen maden kibi yuzlerni aşlağan bir suvnen cevap berilir. Ne fena bir içilecek ve ne fena bir qalınacaq yer!"
        cid: 0
  - verse: 30
