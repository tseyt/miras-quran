    segments:
      - text: >
          O yerde ebediy qalacaqlar. O yerden iç ayrılmaq istemezler.
        cid: 0
  - verse: 109
    segments:
      - text: >
          De ki: Rabbimniñ sözleri içün derya merekep olsa ve bir o qadar da ilâve
          ketirsek dahi, Rabbimniñ sözleri bitmeden evel, deñiz tükenecektir. (Bu ayette
          Allahnıñ sözleri demek, Onıñ ilmi ve ikmetidir. Allah Taalânıñ ilim ve ikmeti
          soñsız ve sıñırsız; deñizler ise, çoqluğına baqmadan, soñlu ve sıñırlıdır. Bu
          alda, Allahnıñ ilim ve ikmetini yazmaq içün merekep olaraq, deryalarnıñ dahi,
          kifayesiz olacağı aşkârdır).
        cid: 0
  - verse: 110
    segments:
      - text: >
          De ki: Men, yalıñız siz kibi bir beşerim. (Şu bar ki) maña İlâhıñıznıñ, sadece
          bir İlâh olğanı vahiy olunmaqta, Artıq er kim Rabbine qavuşmaqnı ümüt ete ise,
          yahşı iş yapsın ve Rabbine ibadette iç bir şeyni ortaq qoşmasın.
        cid: 0
