          adamnı bir hazine tapqan sanaraq, onı devirnıñ ükümdarına alıp baralar. Aradan uzun
          vaqıt keçken. Artıq bu ükümdar tevhid aqidesine bağlı bir hristiandır. Genç adam
          qıralğa başlarından keçkenni añlata. Beraber mağarağa baralar ve gençniñ
          añlatqanlarınıñ doğrulığını ayretler içinde köreler. Yañıdan tirilüvniñ imkânını
