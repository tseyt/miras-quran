        cid: 0
  - verse: 45
    segments:
      - text: "Olarğa şunı da misal koster: Dünya ayatı - kokten endirgen bir suvımız kibidir, bu suv sayesinde yer yuzüniñ ekini (evelâ yetişip) bir-birine qarışqan; artından ruzgâr savurğan çör-çöplük alına kelgendir. Allaһ er şey uzerinde iqtidar saibidir. (Allaһ Taalâ 45-nci ayetteki teşbihnen dünya ayatınıñ keçici olğanını, ibret nazarınen baqqan insannı, bir ekinde bile, oz ayatınıñ başlanuvı, pişkinleşüvi ve tükenip, soñuna irişüvi devirlerini açıq bir şekilde kore bilecegini beyan etkenden soñ, insanğa yaraşqanı - dünyanışç keçici ziynetlerine aldanmaq yerine, qısqa sürgen dünya ayatında yapacaq yahşı işlerinen ebediy saadetke iriimek olğanına boyle işaret etmekte):"
