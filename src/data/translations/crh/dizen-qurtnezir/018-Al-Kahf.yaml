        cid: 0
  - verse: 48
    segments:
      - text: "Ve episi sıra-sıra Rabbiñniñ uzuruna çıqarılğandırlar: Ant olsun ki, sizni ilk defasında yaratqan şeklimizde bizge keldiñiz. Albuki, sizge vade etilgenlerniñ ortağa çıqacaq bir vaqtını tayin etmegenimizni zan etken ediñiz degilmi? (Bu ayetnen bağlı olaraq, Qurtubiy bir hadis naql ete ve hadisni bu ayetke eñ guzel tefsir saya: «Qıyamet kunü Allaһ Taalâ yuksek bir sesnen seslenir ve boyle der: Ey, qullarım! Men Allaһım, menden başqa ilâh yoqtırr. Men acığanlarnışç eñ acığanı, uküm bergenlerniñ eñ adili ve esap korücelerniñ eñ sur’atlısıyım. Bugun sizge qorqu yoq. Kederlenmeyceksiñiz de. Delilleriñizni azırlañ, qolay cevap beriñ. Çünki, mesuliyetlisiñiz, esapqa çekileceksiñiz. Ey, meleklerim! Esaplarnı kormek içün, qullarımnı ayaq ucları uzerinde sıra-sıra tiziñ»)."
        cid: 0
  - verse: 49
    segments:
      - text: "Kitap ortağa qoyulğandır: Suçlılarnıñ onda yazılğanlardan qorqqanlarını korersiñ. «Vay, alımızğa! derler, bu nasıl kitap eken! Kuçük-buyuk iç bir şey bıraqılmayıp (yapqanlarımıznıñ), episini sayıp çıqqan!» Boylece, yapqanlarını qarşılarında bulğandırlar. Seniñ Rabbiñ iç kimsege zulum etmez."
        cid: 0
  - verse: 50
    segments:
      - text: "O zaman biz meleklerge: Ademge secde etiñ, degen edik; İblisten ğayrı, olar aman secde ettiler. İblis cinlerden edi; Rabbiniñ emrine kirmedi. Şimdi siz, meni bıraqıp da, onı ve onıñ soyunı dost tutmaqtasıñızmı? Albuki, olar siziñ duşmanıñızdır. zalımlar içün bu ne fena bir deñişmedir!"
