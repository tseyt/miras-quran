surah_id: 84
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >
          Kök yarılğan, Rabbiñe qulaq asıp, boyun egecek alğa ketirilgen vaqıtta,
        cid: 0
  - verse: 2
    segments:
      - text: >
          [1 ayetine baq.]
        cid: 0
  - verse: 3
    segments:
      - text: >
          Yer tüm-tüz etilgen, içinde olğanlarnı atıp boşalğan ve Rabbini diñlep, Oña
          haqqı ile itaatqa mecbur etilgen vaqıtta (insan oğlu yapqanlarınen qarşılaşır).
        cid: 0
  - verse: 4
    segments:
      - text: >
          [3 ayetine baq.]
        cid: 0
  - verse: 5
    segments:
      - text: >
          [3 ayetine baq.]
        cid: 0
  - verse: 6
    segments:
      - text: >
          Ey, insan! Şübe yoq ki, sen Rabbiñge nisbeten ğayret üstüne ğayret
          köstermektesiñ; soñunda Oña baracaqsıñ.
        cid: 0
  - verse: 7
    segments:
      - text: >
          Kimniñ kitabı sağından berilse,
        cid: 0
  - verse: 8
    segments:
      - text: >
          Qolay bir esap ile esapqa çekilecek;
        cid: 0
  - verse: 9
    segments:
      - text: >
          Ve sevinçli olaraq ailesine dönecek.
        cid: 0
  - verse: 10
    segments:
      - text: >
          Kimniñ de kitabı artından berilse, der'al yoq olmaqnı isteycek; alevli ateşke
          kirecek. Zira o, (dünyada) ailesi içinde (mal-mülk sebebinen) qopayğan edi. (Bu
          ayetlerde dünyada zengin olup, etrafına yardım etmegen, menliknen yaşağan,
          zenginligini özü içün bir imtiyaz sayaraq, faqırlarnı, yoqsullarnı iç de
          tüşünmegen kimselerniñ ahiretteki elemli alı kösterilmekte. Bu ayetten kerekli
          ibret dersini almağanlar, ölümnen özlerini azapnıñ ve ateşniñ içinde bulacaqlar.
          Albuki, olar zenginlik ve ferahlıq alı devam etecek, yañıdan tirilgen
          taqdirlerinde, dünyadaki vazifelerine köre tirilecek belley ediler. Netice
          beklegenleri kibi olmaycaq).
        cid: 0
  - verse: 11
    segments:
      - text: >
          [10 ayetine baq.]
        cid: 0
  - verse: 12
    segments:
      - text: >
          [10 ayetine baq.]
        cid: 0
  - verse: 13
    segments:
      - text: >
          [10 ayetine baq.]
        cid: 0
  - verse: 14
    segments:
      - text: >
          O, iç bir vaqıt Rabbine dönmeycek belledi.
        cid: 0
  - verse: 15
    segments:
      - text: >
          Albuki, aqiqaten, Rabbi onı körmekte edi.
        cid: 0
  - verse: 16
    segments:
      - text: >
          Yoq! Çabaqqa, gecege ve onda basqan qaranlıqqa, tolğun ayğa yemin eterim ki,
          al-aldan keçersiñiz.
        cid: 0
  - verse: 17
    segments:
      - text: >
          [16 ayetine baq.]
        cid: 0
  - verse: 18
    segments:
      - text: >
          [16 ayetine baq.]
        cid: 0
  - verse: 19
    segments:
      - text: >
          [16 ayetine baq.]
        cid: 0
  - verse: 20
    segments:
      - text: >
          Böyle eken, olar, aceba, niçün iman etmezler?
        cid: 0
  - verse: 21
    segments:
      - text: >
          Olar özlerine Qur'an oqulğanınen, secde de etmezler. (Manada keçken «secde
          etmezler» ifadesi şu şekillerde izaatlanğan: 1. Sayğı köstermezler; 2. Az.
          Peyğamber ve mü'minler, secde ayeti oqulğanda, secdege barğanları alda, olar
          tikilip turarlar; 3. Namaz qılmazlar).
        cid: 0
  - verse: 22
    segments:
      - text: >
          Doğrusı, kâfirler yalanlamaqtalar.
        cid: 0
  - verse: 23
    segments:
      - text: >
          Albuki, Allah olarnıñ gizlegen şeylerini çoq yahşı bilir.
        cid: 0
  - verse: 24
    segments:
      - text: >
          (Resulım!) Olarğa elem berici azapnı müjdele!
        cid: 0
  - verse: 25
    segments:
      - text: >
          İman etip, salih amel işlegenler başqadır; olar içün ardı kesilmegen bir mükâfat
          bardır.
        cid: 0
