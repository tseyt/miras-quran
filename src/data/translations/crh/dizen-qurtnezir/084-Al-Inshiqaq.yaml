surah_id: 84
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "Sayğı kostermezler;"
        cid: 0
  - verse: 2
    segments:
      - text: "Az. Peyğamber ve mu’minler, secde ayeti okulğanda, secdege barğanları alda, olar tikilip turarlar;"
        cid: 0
  - verse: 3
    segments:
      - text: "Namaz qılmazlar)."
        cid: 0
  - verse: 6
    segments:
      - text: "Ey, insan! Şube yoq ki, sen Rabbiñge nisbeten ğayret ustüne ğayret kostermektesiñ; soñunda Oña baracaqsıñ."
        cid: 0
  - verse: 7
    segments:
      - text: "Kimniñ kitabı sağından berilse,"
        cid: 0
  - verse: 8
    segments:
      - text: "Qolay bir esap ile esapqa çekilecek;"
        cid: 0
  - verse: 9
    segments:
      - text: "Ve sevinçli olaraq ailesine dönecek. 10-13. Kimniñ de kitabı artından berilse, der’al yoq olmaqnı isteycek; alevli ateşke kirecek. Zira o, (dünyada) ailesi içinde (mal-mulk sebebinen) qopayğan edi. (Bu ayetlerde dünyada zengin olup, etrafına yardımm etmegen, menliknen yaşağan, zenginligini ozü içün bir imtiyaz sayaraq, faqırlarnı, yoqsullarnı iç de tüşünmegen kimselerniñ ahiretteki elemli al kosterilmekte. Bu ayetten kerekli ibret dersini almağanlar, olümnen ozlerini azapnıñ ve ateşniñ içinde bulacaqlar. Albuki, olar zenginlik ve ferahlq al devam etecek, yañıdan tirilgen taqdirlerinde, dünyadaki vazifelerine kore tirilecek belley ediler. Netice beklegenleri kibi olmaycaq)."
        cid: 0
  - verse: 14
    segments:
      - text: "O, iç bir vaqıt Rabbine dönmeycek belledi."
        cid: 0
  - verse: 15
    segments:
      - text: "Albuki, aqiqaten, Rabbi onı kormekte edi. 16-19. Yoq! Çabaqqa, gecege ve onda basqan qaranlıqqa, tolğun ayğa yemin eterim ki, al-aldan keçersiñiz."
        cid: 0
  - verse: 20
    segments:
      - text: "Boyle eken, olar, aceba, niçün iman etmezler?"
        cid: 0
  - verse: 21
    segments:
      - text: "Olar ozlerine Qur’an oqulğanınen, secde de etmezler. (Manada keçken «secde etmezler» ifadesi şu şekillerde izaatlanğan:"
        cid: 0
  - verse: 22
    segments:
      - text: "Doğrusı, kâfirler yalanlamaktalar."
        cid: 0
  - verse: 23
    segments:
      - text: "Albuki, Allaһ olarnıñ gizlegen şeylerini çoq yahşı bilir."
        cid: 0
  - verse: 24
    segments:
      - text: "(Resulım!) Olarğa elem berici azapnı mujdele!"
        cid: 0
  - verse: 25
    segments:
      - text: "İman etip, salih amel işlegenler başqadır; olar içün ardı kesilmegen bir mukâfat bardır."
        cid: 0