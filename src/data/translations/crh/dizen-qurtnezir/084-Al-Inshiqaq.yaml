  - verse: 10
    segments:
      - text: Kimniñ de
        cid: 2
      - text: kitabı artından
        cid: 4
      - text: berilse, der'al yoq olmaqnı isteycek;
        cid: 3
      - text: >-
          alevli ateşke kirecek. Zira o, (dünyada) ailesi içinde (mal-mülk sebebinen) qopayğan
          edi. (Bu ayetlerde dünyada zengin olup, etrafına yardım etmegen, menliknen yaşağan,
          zenginligini özü içün bir imtiyaz sayaraq, faqırlarnı, yoqsullarnı iç de tüşünmegen
          kimselerniñ ahiretteki elemli alı kösterilmekte. Bu ayetten kerekli ibret dersini
          almağanlar, ölümnen özlerini azapnıñ ve ateşniñ içinde bulacaqlar. Albuki, olar
          zenginlik ve ferahlıq alı devam etecek, yañıdan tirilgen taqdirlerinde, dünyadaki
          vazifelerine köre tirilecek belley ediler. Netice beklegenleri kibi olmaycaq).
        cid: 0
