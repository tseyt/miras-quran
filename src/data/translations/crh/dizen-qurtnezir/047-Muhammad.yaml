surah_id: 47
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >-
          İnkâr etkenlerniñ ve Allaһ yolundan çıqqanlarnıñ işlerini Allaһ boşuna
          çıqarğandır. (Mekke halqı, İslâmğa kirüvden çekine, bunıñ ustüne İslâmğa
          kirgenlerni de qaytarmağa, yoldan çıqarmağa oğraşa ediler. Ayet boyle inkâr
          içinde olğan bir toplulıqnıñ, faqırlarğa yemek aşatmaq, sila-i rahim yapmaq,
          esirlerni azat etmek, Mescid-i Haramnıñ qurucılığında çalışmaq kibi amelleriniñ
          boşuna ketecegini bildirerek, bu davranışlarınıñ dünyada faydasını korseler
          bile, ahirette savaptan mahrum olacaqlarını añlata).
        cid: 0
  - verse: 2
    segments:
      - text: >-
          İman etip, faydalı işler yapqanlarnıñ, Rabbleri tarafından haq olaraq
          Muһammedge endirilgenge inanğanlarnıñ gunahlarını Allaһ ortken ve vaziyetlerini
          tüzeltkendir.
        cid: 0
  - verse: 3
    segments:
      - text: >-
          Bunıñ sebebi, inkâr etkenlerniñ batılğa uyuvları, inanğanlarnıñ da,
          Rabblerinden kelgen haqqa uyğanlarıdır. İşte, boylece, Allaһ insanlarğa
          ozlerinden misallerini añlatır.
        cid: 0
  - verse: 4
    segments:
      - text: >-
          (Cenkte) inkâr etkenlernen rastkelişken vaqıtlarıñızda boyunlarını urıñ.
          Niayet, olarnı yahşıca urıp, mecalsız alğa ketirgeniñiznen, bağnı sıqı bağlañ
          (esir alıñ). Cenk soñuna yetkende de, artıq ya qarşılıqsız, ya da fidye
          qarşılığına serbest bıraqıñ. Vaziyet şu ki, Allaһ istese edi, olardan intiqam
          alır edi. Faqat sizni bir-biriñiznen sınamaq ister. Allaһ yolunda
          oldürilgenlerge kelgende, Allaһ olarnıñ yapqanlarını boşuna çıqarmaz. (Cenkte,
          evelâ, zaferge qavuşmaq içün kerek olğan şeyler yapılır. Duşman mağlüp
          olğanınen, sağ qalğanları esir alınır. Esirler, ya bağışlanaraq, ya da fidye
          alınaraq, serbest bıraqılır. Fidye aluv, mal ya da esir deñişüv şeklinde ola
          bilir. Cenk ulviy bir ğaye içün emir etilgendir; bu ğayeni kerçekleştirerek,
          imtian bergenlerniñ amelleri boşuna çıqarılmaycağı da ayrıca bildirilgen).
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Allaһ olarnı muratlarına iriştirecek, goñyullerini şad etecek ve olarnı
          ozlerine tanıtqan cennetine qoyacaq.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          [5 ayetine baq.]
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Ey, iman etkenler! Eger siz Allaһqa (Allaһnıñ dinine) yardım eter iseñiz, O da
          sizge yardım eter, ayaqlarıñıznı taydırmaz.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          İnkâr etkenlerge kelgende, olarnıñ aqqı yıqmaqtır. Allaһ olarnıñ yapqanlarını
          boşunı çıqarğandır.
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Bunıñ sebebi, Allaһnıñ endirgenini begenmeyuvleridir. Allaһ da olarnıñ
          amellerini boşuna çıqarğandır.
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Yer yuzünde dolaşıp, ozlerinden evelkilerniñ aqibetleri nasıl olğanını
          kormezlermi? Allaһ olarnı yerge batırğan. Kâfirlerge de olarğa beñzegeni bar.
          (Ayette Mekke kâfirlerine evelki milletlerniñ evlât ve mallarınıñ butüni yoq
          etilgeni hatırlatılğan, evelkilerine beñzegen neticelerniñ ve elâketniñ olarnıñ
          da başlarına kelecegi beyan etilgen. Esas manada ise, inkârcılar içün bu
          şekildeki bir ornek er an keçerlidir).
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Bu, Allaһnıñ inanğanlarğa yardımcı oluvındandır. Kâfirlerge kelgende, olarnıñ
          yardımcıları yoqtır.
        cid: 0
  - verse: 12
    segments:
      - text: >-
          Muaqqaq ki, Allaһ, inanıp yahşı işler yapqanlarnı, altlarından irmaqlar aqqan
          cennetlerge qoyar; inkâr etkenler ise, (dünyadan) faydalanırlar, ayvanlar
          aşağanı kibi aşarlar. Olarnıñ yeri ateştir. (Ayet, inkâr etkenlerni, ahiretni
          tanımağan, başlarına kelecekten habersiz, butün imkânlarını midelerine ve
          şehvetlerine arclağan hırslı yaratıqlar şeklinde tanıtmaqtadır).
        cid: 0
  - verse: 13
    segments:
      - text: >-
          Seniñ şeeriñden -ki o yer (halqı) seni çıqardı- daa kuvetli nice şeerler yoq
          ettik; olarğa bir yardım etken de çıqmadı. (Bu yerde Resulullaһnıñ icretke
          zorlap çıqarılğan Mekke şeerine işaret etilgen).
        cid: 0
  - verse: 14
    segments:
      - text: >-
          Rabbiñden ap-açıq bir delil uzerinde bulunğan kimse, yaman işi ozüne guzel
          korüngen ve aveslerine uyğan kimse kibi olurmı?
        cid: 0
  - verse: 15
    segments:
      - text: >-
          Muttaqiylerge vade olunğan cennetniñ vaziyeti boyledir: İçinde bozulmağan
          suvdan irmaqlar, dadı deñişmegen sütten irmaqlar, içkenlerge lezet berici
          şaraptan irmaqlar ve süzme baldan irmaqlar bardır. O yerde meyvalarnıñ er çeşiti
          olarnıñdır. Rabblerinden de, bağışlav bardır. İç bu, ateşte ebediy qalğan ve
          içeklerini parça-parça etecek qaynaq suv içirilgen kimselerniñ vaziyeti kibi
          olurmı?
        cid: 0
  - verse: 16
    segments:
      - text: >-
          Olarnıñ arasında, seni diñlegenler bardır. Faqat seniñ yanıñdan çıqqanınen,
          ozlerine bilgi berilgenlerge: «Biraz evel ne degen edi?», diye sorarlar. Bular,
          Allaһ qalplerini muurlegen, arzu ve aveslerine uyğan kimselerdir. (Kâfirlerniñ
          eki yuzlülerini teşkil etken munafıqlar, Az. Peyğamberniñ uzurında ya da hutbede
          diñlegenlerini soñundan alayğa almaq, ya da masharalıq etmek içün, İbn Mesud ve
          İbn Abbas kibi alim sahabilerge yanaşaraq, Az. Peyğamberniñ biraz evel neler
          söylegenini soramağa areket ete ediler. Ayet, olarnıñ bu areketini añlataraq,
          davranışlarını yamanlamaqta).
        cid: 0
  - verse: 17
    segments:
      - text: >-
          Doğru yolnı tapqanlarğa kelgende, Allaһ olarnıñ hidayetlerini arttırır ve
          saqınmalarını teminler.
        cid: 0
  - verse: 18
    segments:
      - text: >-
          Olar qıyamet kunüniñ apansızdan kelip çatuvını beklemektelermi? Şubesiz, onıñ
          alâmetleri kelgendir. Olarğa kelip çatqanınen, ibret aluvları nege yarar! (Mekke
          kâfirleri qıyametniñ qopuvını beklegenlerini tenqit etken ayet, qıyametniñ
          alâmetleri kelgenini hatırlatmaqta. Az. Peyğameberniñ yollanuvı, aynıñ ekige
          bolünüvi kibi vaqialar bu cumledendir).
        cid: 0
  - verse: 19
    segments:
      - text: >-
          Bil ki, Allaһtan başqa ilâh yoqtır. (Habibim!) em ozüñniñ, em de mu’min
          erkeklerniñ ve mu’min qadınlarnıñ gunahları bağışlanuvını iste! Allaһ, kezip
          dolaşqan yeriñizni de, toqtaycaq yeriñizni de bilir. («Dalaşılğan yer»
          kundüzleri barıp-kelingen yer, ya da dünya, «toqtalğan yer» ise, geceleri
          qalınıp yerleşilgen (sınılğan) yer ya da ahiret şeklinde yorumlanğan).
        cid: 0
  - verse: 20
    segments:
      - text: >-
          İman etkenler: Keşke cihad aqqından bir sure endirilgen olsa edi! derler. Amma,
          ukümi açıq bir sure endirilip de, onda cenkten söz etilgeninen, qalplerinde
          maraz olğanlar, olüm bayğınlığı keçireyatqan kimseniñ baqışı kibi, saña
          baqqanlarını korersiñ. Olarğa yaqışqanı da, budır! («Ukümi açıq sure» - muhkem
          olğan, muteşabih olmağan sure demektir. Boylece, muarebeniñ ukümi muhkem
          ayetlernen kesen-kes olaraq ortağa qoyulğan. Zaten, cenk zikr etilgen er sureniñ
          muhkem olğanı ve uzerinde nesh olmağanı ifade etilgen).
        cid: 0
  - verse: 21
    segments:
      - text: >-
          (Olarnıñ vazifesi) itaat ve guzel sözdir. İş ciddiyleşkende, Allaһqa sadaqat
          kosterseler edi, elbette olar içün daa hayırlı olur edi. (Ayetniñ ifade etkenine
          kore, vazifeleri itaat ve guzel söz söylemek vaziyetinde olğanlar, cenk
          isteklerinde de sadıq olmalı, cenkke qarar berilgeninen, qorqup
          vazgeçmemelidirler).
        cid: 0
  - verse: 22
    segments:
      - text: >-
          Keri döner iseñiz, yer yuzünde bozğuncılıq yapmağa ve aqrabalıq bağlarını
          kesmege döngen olmazsıñızmı? (Ayet, Allaһqa berilgen sözlerine sadaqt
          kostermegenlerni qabaatlar eken, olarnıñ iman ve İslâmdan yuz çevirgen
          vaqıtlarında, cahiliye devriniñ adetlerine döneceklerini, yağma, talan, aqraba
          arasında çekkeleşüv ve qız balalarını tirileyin topraqqa komüv kibi adden
          aşuvlar yapa bileceklerini haber bermekte).
        cid: 0
  - verse: 23
    segments:
      - text: >-
          İşte, bular, Allaһ lânetlegen, sağır yapqan ve kozlerini kor etken kimselerdir.
        cid: 0
  - verse: 24
    segments:
      - text: >-
          Olar Qur’annı tüşünmeylermi? Yoqsa, qalpleri kilitlimi?
        cid: 0
  - verse: 25
    segments:
      - text: >-
          Şubesiz ki, ozlerine doğru yol belli olğandan soñ, artlarına qaytqanları,
          şeytan süyreklegen ve olarğa umüt bergendir. (Bu yerde, açıq delil ve
          mucizelerni korgenden soñ, kufürge ya da eki yuzlülikke döngenlerniñ, şeytanğa
          uyğanlarına, şeytannıñ da, boylelerine uzun omür telqin eterek, emellerini
          arttırğanına diqqat çekilgen).
        cid: 0
  - verse: 26
    segments:
      - text: >-
          Bunıñ sebebi: olar, Allaһnıñ endirgeninden oşlanmağanlarğa: Bazı hususlarda
          sizge itaat etecekmiz, deyuvleridir. Albuki, Allaһ olarnıñ gizlegelerini
          bilmekte. (Ayette munafıqlarnıñ, Allaһ Resulına duşmanlıq yapacaqlarını ve
          bunıñnen birlikte, musulmanlarnıñ cenkleşüvleri ogüni alacaqlarına dair yeudiy
          ve muşriklerge vadede bulunğanlarına işaret etilgen).
        cid: 0
  - verse: 27
    segments:
      - text: >-
          Ya melekler olarnıñ yuzlerine ve sırtlarına uraraq, canlarını alğanda
          vaziyetleri nasıl olacaq!
        cid: 0
  - verse: 28
    segments:
      - text: >-
          Bunıñ sebebi, olarnıñ Allaһnı ğadablandırğan şeylerniñ artından ketüvleri ve
          Onı razı etecek şeylerden oşlanmağanlarıdır. Bu sebepten, Allaһ olarnıñ işlerini
          boşuna çıqarğandır.
        cid: 0
  - verse: 29
    segments:
      - text: >-
          Qalplerinde maraz olğanlar, yoqsa Allaһ, kinlerini ortağa çıqarmaycaq
          belledilermi? (Em Az. Peyğamberge, em de mu’minlerge kin beslegen munafıqlar,
          kâfirlerge yardım ete, buña nisbeten iman ve cihad kibi ilâhiy hoşnutlıqqa sebep
          olacaq davranışlarğa yonelmey ediler. Bu sebepten, korünüşteki amelleriniñ
          boşuna ketkeni keçken ayetlerde ifade etilgendir).
        cid: 0
  - verse: 30
    segments:
      - text: >-
          Biz istesek edi, olarnı saña kosterir edik de, sen olarnı yuzlerinden tanır
          ediñ. Ant olsun ki, sen olarnı laqırdı tarzlarından tanırsıñ. Allaһ
          yapqanlarıñıznı bilir. (Rivayet etilgenine kore, bu ayet nazil olğandan soñ, Az.
          Peyğamberge iç bir munafıq gizli qalmay, episini sımalarından tanıy edi.
          Munafıqlarnıñ bir başqa tanıluv tarafları da, laqırdıları edi. Çünki, olar
          Resulullahnıñ uzurında laf etkenlerinde, musulmanlar aqqında ustü qapalı,
          ıncıtıdcı laflar ayta ediler).
        cid: 0
  - verse: 31
    segments:
      - text: >-
          Ant olsun ki, içiñizden cihad etkenlernen sabır etkenlerni belgilegenge qadar
          ve haberleriñizni beyan etkenge qadar, imtian etecekmiz. (Ayet, mu’minlerniñ
          cihadnen ve qıyın diger vazifelernen imtian etileceklerini, ayrıca itaat ve
          isyanlarınıñ beyan etilecegini haber bere).
        cid: 0
  - verse: 32
    segments:
      - text: >-
          İnkâr etkenler, Allaһ yolundan uzaqlaştırğanlar ve ozlerine doğru yol belli
          olğandan soñ, Peyğamberge qarşı kelgenler, Allaһqa iç bir zarar beralmazlar.
          Allaһ olarnıñ yapqanlarını boşuna çıqaracaq. (Az. Peyğamberge qarşı kelgenler -
          Qureyş muşriklerinen olarnı desteklegen yeudiylerdir. Bularnıñ Az. Peyğamberge
          duşmanlıq içün yapqanları boşuna ketkeni kibi, sadaqa ve oña beñzegen
          amelleriniñ de, boşuna çıqacağı bellidir).
        cid: 0
  - verse: 33
    segments:
      - text: >-
          Ey, iman etkenler! Allaһqa itaat etiñ, Peyğamberge itaat etiñ. İşleriñizni
          boşuna çıqarmañ.
        cid: 0
  - verse: 34
    segments:
      - text: >-
          İnkâr etip, Allaһ youlandan uzaqlaştırğanlarnı ve soñunda da kâfir olaraq
          olgenlerni Allaһ asla bağışlamaz.
        cid: 0
  - verse: 35
    segments:
      - text: >-
          Ustün vaziyette olğanda zayıflıq kosterip, barışqa çağırmañ. Allaһ siznen
          beraberdir. O, amelleriñizni asla eksiltmeycek. (Buña kore, musulmanlar duşman
          qarşısında ustün vaziyette olğanda, sulh isteginde bulunmazlar. Asl duşman
          qarşısında zayıflıq kostermemek, aşşalıq is eterek, panikağa qapılmamaqtır).
        cid: 0
  - verse: 36
    segments:
      - text: >-
          Doğrusı, dünya ayatı ancaq bir oyun ve eglencedir. Eger iman eter ve saqınır
          iseñiz, Allaһ sizge mukâfatıñıznı berir. Ve sizden mallarıñıznı (butünley sarf
          etüviñizni) istemez. (Sarf etilüvi istenilgeni, sadece zekât ve sadaqa kibi az
          bir miqdardır).
        cid: 0
  - verse: 37
    segments:
      - text: >-
          Eger olarnı (episini) istese edi ve sizni zorlasa edi, saranlıq eter ediñiz ve
          bu da siziñ kinleriñizni ortağa çıqarır edi. (Ayet, mallarnıñ episi istenilgeni
          alda, belli olacaq saranlıq duyğusınıñ, İslâmğa ve Az. Peyğamberge kin beslev
          olüçüsine qadar baracağına işaret eterek, inasannıñ malğa nisbeten psihologik
          vaziyetini talil etmekte).
        cid: 0
  - verse: 38
    segments:
      - text: >-
          İşte, sizler, Allaһ yolunda arcalamağa çağırılmaqtasıñız. Arañızdan bazıñız
          saranlıq yapmaqta. Amma, kim saranlıq eter ise, ancaq ozüne saranlıq yapqan
          olur. Allaһ zengindir, siz ise, faqırsıñız. Eger Ondan yuz çevirseñiz, yeriñizge
          sizden başqa bir toplum ketirir, artıq olar siziñ kibi de olmazlar. (Ayetke
          kore, insanlar farz olğan arcalavnı yapmağa mecburdırlar. Eger bunı yerine
          ketirmeseler, elâketni haq etici bir toplum olurlar).
        cid: 0