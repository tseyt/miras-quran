          alınaraq, serbest bıraqılır. Fidye aluv, mal ya da esir deñişüv şeklinde ola bilir.
          Cenk ülviy bir ğaye içün emir etilgendir; bu ğayeni kerçekleştirerek, imtian
          bergenlerniñ amelleri boşuna çıqarılmaycağı da ayrıca bildirilgen).
