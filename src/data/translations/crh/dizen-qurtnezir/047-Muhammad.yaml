surah_id: 47
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >
          İnkâr etkenlerniñ ve Allah yolundan çıqqanlarnıñ işlerini Allah boşuna
          çıqarğandır. (Mekke halqı, İslâmğa kirüvden çekine, bunıñ üstüne İslâmğa
          kirgenlerni de qaytarmağa, yoldan çıqarmağa oğraşa ediler. Ayet böyle inkâr
          içinde olğan bir toplulıqnıñ, faqırlarğa yemek aşatmaq, sila-i rahim yapmaq,
          esirlerni azat etmek, Mescid-i Haramnıñ qurucılığında çalışmaq kibi amelleriniñ
          boşuna ketecegini bildirerek, bu davranışlarınıñ dünyada faydasını körseler
          bile, ahirette savaptan mahrum olacaqlarını añlata).
        cid: 0
  - verse: 2
    segments:
      - text: >
          İman etip, faydalı işler yapqanlarnıñ, Rabbleri tarafından haq olaraq Muhammedge
          endirilgenge inanğanlarnıñ günahlarını Allah örtken ve vaziyetlerini
          tüzeltkendir.
        cid: 0
  - verse: 3
    segments:
      - text: >
          Bunıñ sebebi, inkâr etkenlerniñ batılğa uyuvları, inanğanlarnıñ da, Rabblerinden
          kelgen haqqa uyğanlarıdır. İşte, böylece, Allah insanlarğa özlerinden
          misallerini añlatır.
        cid: 0
  - verse: 4
    segments:
      - text: >
          (Cenkte) inkâr etkenlernen rastkelişken vaqıtlarıñızda boyunlarını urıñ. Niayet,
          olarnı yahşıca urıp, mecalsız alğa ketirgeniñiznen, bağnı sıqı bağlañ (esir
          alıñ). Cenk soñuna yetkende de, artıq ya qarşılıqsız, ya da fidye qarşılığına
          serbest bıraqıñ. Vaziyet şu ki, Allah istese edi, olardan intiqam alır edi.
          Faqat sizni bir-biriñiznen sınamaq ister. Allah yolunda öldürilgenlerge
          kelgende, Allah olarnıñ yapqanlarını boşuna çıqarmaz. (Cenkte, evelâ, zaferge
          qavuşmaq içün kerek olğan şeyler yapılır. Duşman mağlüp olğanınen, sağ
          qalğanları esir alınır. Esirler, ya bağışlanaraq, ya da fidye alınaraq, serbest
          bıraqılır. Fidye aluv, mal ya da esir deñişüv şeklinde ola bilir. Cenk ülviy bir
          ğaye içün emir etilgendir; bu ğayeni kerçekleştirerek, imtian bergenlerniñ
          amelleri boşuna çıqarılmaycağı da ayrıca bildirilgen).
        cid: 0
  - verse: 5
    segments:
      - text: >
          Allah olarnı muratlarına iriştirecek, goñüllerini şad etecek ve olarnı özlerine
          tanıtqan cennetine qoyacaq.
        cid: 0
  - verse: 6
    segments:
      - text: >
          [5 ayetine baq.]
        cid: 0
  - verse: 7
    segments:
      - text: >
          Ey, iman etkenler! Eger siz Allahqa (Allahnıñ dinine) yardım eter iseñiz, O da
          sizge yardım eter, ayaqlarıñıznı taydırmaz.
        cid: 0
  - verse: 8
    segments:
      - text: >
          İnkâr etkenlerge kelgende, olarnıñ aqqı yıqmaqtır. Allah olarnıñ yapqanlarını
          boşunı çıqarğandır.
        cid: 0
  - verse: 9
    segments:
      - text: >
          Bunıñ sebebi, Allahnıñ endirgenini begenmeyüvleridir. Allah da olarnıñ
          amellerini boşuna çıqarğandır.
        cid: 0
  - verse: 10
    segments:
      - text: >
          Yer yüzünde dolaşıp, özlerinden evelkilerniñ aqibetleri nasıl olğanını
          körmezlermi? Allah olarnı yerge batırğan. Kâfirlerge de olarğa beñzegeni bar.
          (Ayette Mekke kâfirlerine evelki milletlerniñ evlât ve mallarınıñ bütüni yoq
          etilgeni hatırlatılğan, evelkilerine beñzegen neticelerniñ ve elâketniñ olarnıñ
          da başlarına kelecegi beyan etilgen. Esas manada ise, inkârcılar içün bu
          şekildeki bir örnek er an keçerlidir).
        cid: 0
  - verse: 11
    segments:
      - text: >
          Bu, Allahnıñ inanğanlarğa yardımcı oluvındandır. Kâfirlerge kelgende, olarnıñ
          yardımcıları yoqtır.
        cid: 0
  - verse: 12
    segments:
      - text: >
          Muaqqaq ki, Allah, inanıp yahşı işler yapqanlarnı, altlarından irmaqlar aqqan
          cennetlerge qoyar; inkâr etkenler ise, (dünyadan) faydalanırlar, ayvanlar
          aşağanı kibi aşarlar. Olarnıñ yeri ateştir. (Ayet, inkâr etkenlerni, ahiretni
          tanımağan, başlarına kelecekten habersiz, bütün imkânlarını midelerine ve
          şehvetlerine arclağan hırslı yaratıqlar şeklinde tanıtmaqtadır).
        cid: 0
  - verse: 13
    segments:
      - text: >
          Seniñ şeeriñden -ki o yer (halqı) seni çıqardı- daa quvetli nice şeerler yoq
          ettik; olarğa bir yardım etken de çıqmadı. (Bu yerde Resulullahnıñ icretke
          zorlap çıqarılğan Mekke şeerine işaret etilgen).
        cid: 0
  - verse: 14
    segments:
      - text: >
          Rabbiñden ap-açıq bir delil üzerinde bulunğan kimse, yaman işi özüne güzel
          körüngen ve aveslerine uyğan kimse kibi olurmı?
        cid: 0
  - verse: 15
    segments:
      - text: >
          Muttaqiylerge vade olunğan cennetniñ vaziyeti böyledir: İçinde bozulmağan suvdan
          irmaqlar, dadı deñişmegen sütten irmaqlar, içkenlerge lezet berici şaraptan
          irmaqlar ve süzme baldan irmaqlar bardır. O yerde meyvalarnıñ er çeşiti
          olarnıñdır. Rabblerinden de, bağışlav bardır. İç bu, ateşte ebediy qalğan ve
          içeklerini parça-parça etecek qaynaq suv içirilgen kimselerniñ vaziyeti kibi
          olurmı?
        cid: 0
  - verse: 16
    segments:
      - text: >
          Olarnıñ arasında, seni diñlegenler bardır. Faqat seniñ yanıñdan çıqqanınen,
          özlerine bilgi berilgenlerge: «Biraz evel ne degen edi?», diye sorarlar. Bular,
          Allah qalplerini müurlegen, arzu ve aveslerine uyğan kimselerdir. (Kâfirlerniñ
          eki yüzlülerini teşkil etken munafıqlar, Az. Peyğamberniñ uzurında ya da hutbede
          diñlegenlerini soñundan alayğa almaq, ya da masharalıq etmek içün, İbn Mesud ve
          İbn Abbas kibi alim sahabilerge yanaşaraq, Az. Peyğamberniñ biraz evel neler
          söylegenini soramağa areket ete ediler. Ayet, olarnıñ bu areketini añlataraq,
          davranışlarını yamanlamaqta).
        cid: 0
  - verse: 17
    segments:
      - text: >
          Doğru yolnı tapqanlarğa kelgende, Allah olarnıñ hidayetlerini arttırır ve
          saqınmalarını teminler.
        cid: 0
  - verse: 18
    segments:
      - text: >
          Olar qıyamet kününiñ apansızdan kelip çatuvını beklemektelermi? Şübesiz, onıñ
          alâmetleri kelgendir. Olarğa kelip çatqanınen, ibret aluvları nege yarar! (Mekke
          kâfirleri qıyametniñ qopuvını beklegenlerini tenqit etken ayet, qıyametniñ
          alâmetleri kelgenini hatırlatmaqta. Az. Peyğameberniñ yollanuvı, aynıñ ekige
          bölünüvi kibi vaqialar bu cumledendir).
        cid: 0
  - verse: 19
    segments:
      - text: >
          Bil ki, Allahtan başqa ilâh yoqtır. (Habibim!) em özüñniñ, em de mü'min
          erkeklerniñ ve mü'min qadınlarnıñ günahları bağışlanuvını iste! Allah, kezip
          dolaşqan yeriñizni de, toqtaycaq yeriñizni de bilir. («Dalaşılğan yer»
          kündüzleri barıp-kelingen yer, ya da dünya, «toqtalğan yer» ise, geceleri
          qalınıp yerleşilgen (sınılğan) yer ya da ahiret şeklinde yorumlanğan).
        cid: 0
  - verse: 20
    segments:
      - text: >
          İman etkenler: Keşke cihad aqqından bir sure endirilgen olsa edi! derler. Amma,
          ükümi açıq bir sure endirilip de, onda cenkten söz etilgeninen, qalplerinde
          maraz olğanlar, ölüm bayğınlığı keçireyatqan kimseniñ baqışı kibi, saña
          baqqanlarını körersiñ. Olarğa yaqışqanı da, budır! («Ükümi açıq sure» - muhkem
          olğan, muteşabih olmağan sure demektir. Böylece, muarebeniñ ükümi muhkem
          ayetlernen kesen-kes olaraq ortağa qoyulğan. Zaten, cenk zikr etilgen er sureniñ
          muhkem olğanı ve üzerinde nesh olmağanı ifade etilgen).
        cid: 0
  - verse: 21
    segments:
      - text: >
          (Olarnıñ vazifesi) itaat ve güzel sözdir. İş ciddiyleşkende, Allahqa sadaqat
          kösterseler edi, elbette olar içün daa hayırlı olur edi. (Ayetniñ ifade etkenine
          köre, vazifeleri itaat ve güzel söz söylemek vaziyetinde olğanlar, cenk
          isteklerinde de sadıq olmalı, cenkke qarar berilgeninen, qorqup
          vazgeçmemelidirler).
        cid: 0
  - verse: 22
    segments:
      - text: >
          Keri döner iseñiz, yer yüzünde bozğuncılıq yapmağa ve aqrabalıq bağlarını
          kesmege döngen olmazsıñızmı? (Ayet, Allahqa berilgen sözlerine sadaqt
          köstermegenlerni qabaatlar eken, olarnıñ iman ve İslâmdan yüz çevirgen
          vaqıtlarında, cahiliye devriniñ adetlerine döneceklerini, yağma, talan, aqraba
          arasında çekkeleşüv ve qız balalarını tirileyin topraqqa kömüv kibi adden
          aşuvlar yapa bileceklerini haber bermekte).
        cid: 0
  - verse: 23
    segments:
      - text: >
          İşte, bular, Allah lânetlegen, sağır yapqan ve közlerini kör etken kimselerdir.
        cid: 0
  - verse: 24
    segments:
      - text: >
          Olar Qur'annı tüşünmeylermi? Yoqsa, qalpleri kilitlimi?
        cid: 0
  - verse: 25
    segments:
      - text: >
          Şübesiz ki, özlerine doğru yol belli olğandan soñ, artlarına qaytqanları, şeytan
          süyreklegen ve olarğa ümüt bergendir. (Bu yerde, açıq delil ve mucizelerni
          körgenden soñ, küfürge ya da eki yüzlülikke döngenlerniñ, şeytanğa uyğanlarına,
          şeytannıñ da, böylelerine uzun ömür telqin eterek, emellerini arttırğanına
          diqqat çekilgen).
        cid: 0
  - verse: 26
    segments:
      - text: >
          Bunıñ sebebi: olar, Allahnıñ endirgeninden oşlanmağanlarğa: Bazı hususlarda
          sizge itaat etecekmiz, deyüvleridir. Albuki, Allah olarnıñ gizlegelerini
          bilmekte. (Ayette munafıqlarnıñ, Allah Resulına duşmanlıq yapacaqlarını ve
          bunıñnen birlikte, musulmanlarnıñ cenkleşüvleri ögüni alacaqlarına dair yeudiy
          ve müşriklerge vadede bulunğanlarına işaret etilgen).
        cid: 0
  - verse: 27
    segments:
      - text: >
          YA melekler olarnıñ yüzlerine ve sırtlarına uraraq, canlarını alğanda
          vaziyetleri nasıl olacaq!
        cid: 0
  - verse: 28
    segments:
      - text: >
          Bunıñ sebebi, olarnıñ Allahnı ğadablandırğan şeylerniñ artından ketüvleri ve Onı
          razı etecek şeylerden oşlanmağanlarıdır. Bu sebepten, Allah olarnıñ işlerini
          boşuna çıqarğandır.
        cid: 0
  - verse: 29
    segments:
      - text: >
          Qalplerinde maraz olğanlar, yoqsa Allah, kinlerini ortağa çıqarmaycaq
          belledilermi? (Em Az. Peyğamberge, em de mü'minlerge kin beslegen munafıqlar,
          kâfirlerge yardım ete, buña nisbeten iman ve cihad kibi ilâhiy hoşnutlıqqa sebep
          olacaq davranışlarğa yönelmey ediler. Bu sebepten, körünüşteki amelleriniñ
          boşuna ketkeni keçken ayetlerde ifade etilgendir).
        cid: 0
  - verse: 30
    segments:
      - text: >
          Biz istesek edi, olarnı saña kösterir edik de, sen olarnı yüzlerinden tanır
          ediñ. Ant olsun ki, sen olarnı laqırdı tarzlarından tanırsıñ. Allah
          yapqanlarıñıznı bilir. (Rivayet etilgenine köre, bu ayet nazil olğandan soñ, Az.
          Peyğamberge iç bir munafıq gizli qalmay, episini sımalarından tanıy edi.
          Munafıqlarnıñ bir başqa tanıluv tarafları da, laqırdıları edi. Çünki, olar
          Resulullahnıñ uzurında laf etkenlerinde, musulmanlar aqqında üstü qapalı,
          ıncıtıcı laflar ayta ediler).
        cid: 0
  - verse: 31
    segments:
      - text: >
          Ant olsun ki, içiñizden cihad etkenlernen sabır etkenlerni belgilegenge qadar ve
          haberleriñizni beyan etkenge qadar, imtian etecekmiz. (Ayet, mü'minlerniñ
          cihadnen ve qıyın diger vazifelernen imtian etileceklerini, ayrıca itaat ve
          isyanlarınıñ beyan etilecegini haber bere).
        cid: 0
  - verse: 32
    segments:
      - text: >
          İnkâr etkenler, Allah yolundan uzaqlaştırğanlar ve özlerine doğru yol belli
          olğandan soñ, Peyğamberge qarşı kelgenler, Allahqa iç bir zarar beralmazlar.
          Allah olarnıñ yapqanlarını boşuna çıqaracaq. (Az. Peyğamberge qarşı kelgenler -
          Qureyş müşriklerinen olarnı desteklegen yeudiylerdir. Bularnıñ Az. Peyğamberge
          duşmanlıq içün yapqanları boşuna ketkeni kibi, sadaqa ve oña beñzegen
          amelleriniñ de, boşuna çıqacağı bellidir).
        cid: 0
  - verse: 33
    segments:
      - text: >
          Ey, iman etkenler! Allahqa itaat etiñ, Peyğamberge itaat etiñ. İşleriñizni
          boşuna çıqarmañ.
        cid: 0
  - verse: 34
    segments:
      - text: >
          İnkâr etip, Allah yolundan uzaqlaştırğanlarnı ve soñunda da kâfir olaraq
          ölgenlerni Allah asla bağışlamaz.
        cid: 0
  - verse: 35
    segments:
      - text: >
          Üstün vaziyette olğanda zayıflıq kösterip, barışqa çağırmañ. Allah siznen
          beraberdir. O, amelleriñizni asla eksiltmeycek. (Buña köre, musulmanlar duşman
          qarşısında üstün vaziyette olğanda, sulh isteginde bulunmazlar. Aslı duşman
          qarşısında zayıflıq köstermemek, aşşalıq is eterek, panikağa qapılmamaqtır).
        cid: 0
  - verse: 36
    segments:
      - text: >
          Doğrusı, dünya ayatı ancaq bir oyun ve eglencedir. Eger iman eter ve saqınır
          iseñiz, Allah sizge mükâfatıñıznı berir. Ve sizden mallarıñıznı (bütünley sarf
          etüviñizni) istemez. (Sarf etilüvi istenilgeni, sadece zekât ve sadaqa kibi az
          bir miqdardır).
        cid: 0
  - verse: 37
    segments:
      - text: >
          Eger olarnı (episini) istese edi ve sizni zorlasa edi, saranlıq eter ediñiz ve
          bu da siziñ kinleriñizni ortağa çıqarır edi. (Ayet, mallarnıñ episi istenilgeni
          alda, belli olacaq saranlıq duyğusınıñ, İslâmğa ve Az. Peyğamberge kin beslev
          ölüçüsine qadar baracağına işaret eterek, inasannıñ malğa nisbeten psihologik
          vaziyetini talil etmekte).
        cid: 0
  - verse: 38
    segments:
      - text: >
          İşte, sizler, Allah yolunda arcalamağa çağırılmaqtasıñız. Arañızdan bazıñız
          saranlıq yapmaqta. Amma, kim saranlıq eter ise, ancaq özüne saranlıq yapqan
          olur. Allah zengindir, siz ise, faqırsıñız. Eger Ondan yüz çevirseñiz, yeriñizge
          sizden başqa bir toplum ketirir, artıq olar siziñ kibi de olmazlar. (Ayetke
          köre, insanlar farz olğan arcalavnı yapmağa mecburdırlar. Eger bunı yerine
          ketirmeseler, elâketni haq etici bir toplum olurlar).
        cid: 0
