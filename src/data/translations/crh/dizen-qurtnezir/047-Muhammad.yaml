          qaytarmağa, yoldan çıqarmağa oğraşa ediler. Ayet böyle inkâr içinde olğan bir
          toplulıqnıñ, faqırlarğa yemek aşatmaq, sila-i rahim yapmaq, esirlerni azat etmek,
          Mescid-i Haramnıñ qurucılığında çalışmaq kibi amelleriniñ boşuna ketecegini
          bildirerek, bu davranışlarınıñ dünyada faydasını körseler bile, ahirette savaptan
          mahrum olacaqlarını añlata).
