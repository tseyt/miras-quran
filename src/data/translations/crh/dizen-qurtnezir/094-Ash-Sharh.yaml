surah_id: 94
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >-
          Biz seniñ koksüñni açıp kenişletmedikmi?
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Beliñni bukken yuküñni senden alıp atmadıqmı?
        cid: 0
  - verse: 3
    segments:
      - text: >-
          [2 ayetine baq.]
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Seniñ şanıñnı ve şuretiñni yuceltmedikmi?
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Elbette, qıyınlıqnıñ yanında bir qolaylıq bar. Aqiqaten, zorluqnen beraber, bir
          qolaylıq daa bardır.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          [5 ayetine baq.]
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Boş qaldıñmı, aman (başqa) işke sarıl ve yalıñız Rabbiñye yonel! (Bazı
          tefsirciler bitirilgen işni, bazıları da, başlanacaq işni «ibadet» olaraq
          yorumlağanlar. Bu yorumlarnıñ beraberlik noqtası dünya ve ahiret arasındaki
          olçüge diqqat etilüvi kerekligine berilüvidir).
        cid: 0
  - verse: 8
    segments:
      - text: >-
          [7 ayetine baq.]
        cid: 0