surah_id: 94
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "Biz seniñ koksüñni açıp kenişletmedikmi? 2-3. Beliñni bukken yuküñni senden alıp atmadıqmı?"
        cid: 0
  - verse: 4
    segments:
      - text: "Seniñ şanıñnı ve şuretiñni yuceltmedikmi? 5-6. Elbette, qıyınlıqnıñ yanında bir qolaylıq bar. Aqiqaten, zorluqnen beraber, bir qolaylıq daa bardır. 7-8. Boş qaldıñmı, aman (başqa) işke sarıl ve yalıñız Rabbiñye yonel! (Bazı tefsirciler bitirilgen işni, bazıları da, başlanacaq işni «ibadet» olaraq yorumlağanlar. Bu yorumlarnıñ beraberlik noqtası dünya ve ahiret arasındaki olçüge diqqat etilüvi kerekligine berilüvidir)."
        cid: 0
  - verse: 6
    segments:
      - text: "Faqat iman etip, salih amel işegenler içün, eksilmegen, devamlı bir ecir bar."
        cid: 0
  - verse: 7
    segments:
      - text: "Artıq bundan soñ ceza kunü mevzusında seni kim yalanlay bilir?"
        cid: 0
  - verse: 8
    segments:
      - text: "Allaһ - uküm bericilerniñ eñ ustüni degilmi?"
        cid: 0
  - verse: 95
    segments:
      - text: "et-TİİN «Tiin» - dağ adı ya da incir demektir. Buruuc suresinden soñ Mekkede engen, 8 ayettir. Bismilâaһirraһmaanirraһiim (Rahman ve rahim olğan Allaһnıñ adınen). 1-5. İncirge, zeytunğa, Sina dağına ve şu emin bolgege yemin eterim ki, biz insannı eñ guzel biçimde yarattıq. Soñ onı aşşağılarnıñ aşşağısına endirdik. (Allaһ Taalâ insannı, ruh ve beden qabiliyetleri noqtai nazarından, canlılarnıñ eñ mukemmeli yapqan. Surede «eñ guzel biçimde yarattıq» ifadesi bu hususnı añlatmaqta. İnsan serbest iradesinen, ya bu qabiliyetlerni guzel qullanaraq, «kâmil insan» olacaq, ya da aks tarafnı tutaraq, şuurl barlıqlarnıñ ve canlılarnıñ eñ aşşağı mertebesinden yer alacaq)."
        cid: 0