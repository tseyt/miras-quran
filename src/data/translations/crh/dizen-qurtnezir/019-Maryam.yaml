surah_id: 19
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "Qaaf. һaa. Yaa. Ayn. Saad."
        cid: 0
  - verse: 2
    segments:
      - text: "(Bu,) Rabbiñniñ, Zekeriyya qulına rahmetiniñ añıluvıdır."
        cid: 0
  - verse: 3
    segments:
      - text: "Hatırlaysızmı, o, hafif bir sesnen Rabbine yalvarğan edi;"
        cid: 0
  - verse: 4
    segments:
      - text: "Rabbim! dedi, menden (vucudımdan) kemiklerim zayıflaştı, başım-saçım ağardı. Ve men, Rabbim, saña (etken) duam sayesinde iç bedbaht olmadım."
        cid: 0
  - verse: 5
    segments:
      - text: "Doğrusı, men, artımdan iş başına keçecek olğan yaqınlarımdan saqınam. Qadınım da doğurmaz. Tarafıñdan maña bir veli (oğul) ber."
        cid: 0
  - verse: 6
    segments:
      - text: "Ki, o maña varis olsun; Yaqub hanedanına da varis olsun. Rabbim, onı rizaña lâyıq et!"
        cid: 0
  - verse: 7
    segments:
      - text: "(Allaһ boyle buyurdı:) Ey, Zekeriyya! Biz saña bir oğul mujdelermiz ki, onıñ adı Yahyadır. Daa evel oña kimseni addaş yapmadıq. (Ayetniñ soñki cumlesi «daa evel iç kimseni onıñ beñzeri yapmadıq” şeklinde de añlaşılğan. Zira, Az.Yahyanıñ doğurmaz bir anadan doğuvı aqransız bir adise, yani mucizedir)."
        cid: 0
  - verse: 8
    segments:
      - text: "Zekeriyya: Rabbim! dedi, qadınım doğurmaz olğanı, men de qartlıqnıñ soñki sıñrına barğanım alda, menim nasıl oğlum ola bilir?"
        cid: 0
  - verse: 9
    segments:
      - text: "Allaһ: Oyledir, dedi; Rabbiñ: O maña qolaydır. Daa evel, sen iç bir şey olmağanıñda, seni de yaratqan edim, buyurdı."
        cid: 0
  - verse: 10
    segments:
      - text: "O: Rabbim! dedi, (balam olacağına dair) maña bir işaret ber. Allaһ: Saña işaret, sap-sağlam olğanıñ alda, uç kun insanlarnen laf etmemeñdir, buyurdı."
        cid: 0
  - verse: 11
    segments:
      - text: "Bunıñ uzerine Zekeriyya mabetten qavmınıñ qarşısına çıqaraq, olarğa: «Saba-aqşam tesbihte bulunıñ», diye, işaret berdi. («Mabet»ten şeklinde tercime etilgen «mihrab» o zamanlarda ibadet etilgen yer ya da Beyt-i Maqdis içinde yuksek bir yerdeki ucre manasında qullanıla edi). (Allaһ Taalâ ihtiyar Zekeriyyanen qart qadınından bir bala dünyağa yollamaqnen, qudretiniñ sıñırsızlığını ortağa qoyğan. Yuqarıdaki ayetlerde buña işaret etilgenden soñ, şimdi doğuvı mucizeli bir şekilde kerçekleşken Yahya (a.s.)ğa hitap etilmekte:)"
        cid: 0
  - verse: 12
    segments:
      - text: "«Ey, Yahya! Kitapqa (Tevratqa) bar kuçüñnen sarıl!» (dedik) ve daa sabiy ekende, oña (ilim ve) ikmet berdik."
        cid: 0
  - verse: 13
    segments:
      - text: "Tarafımızdan oña qalp yımşaqlığı ve temizlik de (berdik). O, çoq saqınğan bir kimse edi."
        cid: 0
  - verse: 14
    segments:
      - text: "Ana-babasına çoq yahşı davrana edi; o, isyankâr bir zorbacı degil edi."
        cid: 0
  - verse: 15
    segments:
      - text: "Doğğan kunü, olecek kunü ve tiri olaraq qabirden çıqarılacaq kunü oña selâm olsun! (Yahya (a.s.)nıñ mucizeviy doğuvından soñ, Az.Meryemniñ kene mucize olaraq, Az.İsağa yuklü qaluvı ve onı dünyağa ketirüvi adisesine keçilmekte)."
        cid: 0
  - verse: 16
    segments:
      - text: "(Resulım!) Kitapta Meryemni de añ. Hatırıñdamı, o, ailesinden ayrılaraq, doğu tarafından bir yerge çekilgen edi. (Bu yerdeki «doğu tarafı», tefsircilerge kore, Mescid-i Aqsanıñ doğu tarafı, ya da Meryemniñ eviniñ doğu tarafı şeklinde tefsir etilgen, bu sebeple, hristianlarnıñ, qıbla olaraq doğuğa yonelgenleri ifade etilgen)."
        cid: 0
  - verse: 17
    segments:
      - text: "Meryem, olarnen ozü arasına bir perde çekken edi. Der eken, biz oña ruhımıznı yolladıq da, o, oña tamamınen bir insan şeklinde koründi. (Tefsircilerniñ çoquna kore, ayetteki ruhnıñ manasıt - Cebrail (a.s.)dir. Az.Meryem qorqmasın ve sözüni añlasın diye, Allaһ Taalâ Cebrailni bir insan şeklinde yollağan. Baq. Baqara, 2/87)."
        cid: 0
  - verse: 18
    segments:
      - text: "Meryem dedi ki: Senden, çoq merhametli olğan Allaһqa sığınırım! Eger Allaһtan saqınğan bir kimse iseñ (maña toqunma)."
        cid: 0
  - verse: 19
    segments:
      - text: "Melek: Men, yalıñız saña ter-temiz bir oğlan bala bağışlavım içün, Rabbiniñ bir elçisiyim, dedi."
        cid: 0
  - verse: 20
    segments:
      - text: "Meryem: Maña bir insan eli tiymegeni, iffetsiz de olmağanım alda, menim nasıl balam ola bilir? dedi."
        cid: 0
  - verse: 21
    segments:
      - text: "Melek: Oyle, dedi; (Zira) Rabbiñ buyurdı ki: Bu maña qolaydır. Çünki, biz onı insanlarğa bir delil ve ozümizden bir rahmet yapacaqmız. Bu, uküm ve qararğa bağlanğan (ezelde olup bitken) bir iş edi."
        cid: 0
  - verse: 22
    segments:
      - text: "Meryem oña yuklü qaldı. Bunıñ uzerine, onıñnen (qarnındaki balanen) uzaq bir yerge çekildi."
        cid: 0
  - verse: 23
    segments:
      - text: "Doğum sancısı onı bir hurma teregine (tayanmağa) mecbur etti. «Keşke, dedi, bundan evel olse edim de, unutılıp ketse edim!»"
        cid: 0
  - verse: 24
    segments:
      - text: "Aşağısından (İsa ya da melek) oña boyle seslendi: «Tasalanma! Rabbiñ seniñ alt tarafıñda bir suv ağı peyda etkendir». (Ayetke boyle mana da berilgen: “Tasalanma! Rabbiñ seniñ altıñdakini (İsanı) şerefli bir reber olaraq yaratqandır»)."
        cid: 0
  - verse: 25
    segments:
      - text: "«Hurma dalını ozüñye doğru silki ki, ustüñye taze, pişken hurma tökülsin»."
        cid: 0
  - verse: 26
    segments:
      - text: "«Aşa, iç. Kozüñ aydın! Eger insanlardan birini korseñ, de ki: Men çoq merhametli olğan Allaһqa oraza adadım; artıq bugun iç bir insannen laf etmeycem». (Rivayetke kore, Meryemniñ qavmı aşamamaq, içmemek suretinen, oraza tutqanları kibi, laf etmemeknen de, tuta ekenler. Ya da orazalı olğanda, aşamaqiçmekten qaçınğanları kibi, laf etmekten de qaçına ekenler. Az.Meryem de buña uyğun olaraq suküt orazası adağan)."
        cid: 0
  - verse: 27
    segments:
      - text: "Niayet, onı (qucağında) koterip, qavmına ketirdi. Dediler ki: Ey, Meryem! Aqiqaten sen cirenç bir şey yaptıñ!"
        cid: 0
  - verse: 28
    segments:
      - text: "Ey, Harunnıñ qız qardaşı! Seniñ babañ yaman bir insan degil edi; anañ da iffetsiz degil edi. (Ayette añıiğan Harun, Az.Musanıñ qardaşı ve peyğamber Harun degil. Bu Harunnıñ kimliginen bağlı noqtai nazarlarnıñ aqiqatqa eñ yaqınına kore, o, Az.Meryemniñ aqiqiy qardaşıdır. Ana-babası kibi, o da iffetli ve salih bir kimse edi. Bu sebepten, işniñ aslını bilmegenler, boyle birisiniñ qız qardaşı olğan Meryemge zina etüvni asla yaqıştıralmağanını bildirmek istegenler)."
        cid: 0
  - verse: 29
    segments:
      - text: "Bunıñ ustüne Meryem balanı kosterdi. «Biz, dediler, beşikteki bir sabiynen nasıl söyleşirmiz?» (Allaһnıñ kelecekte elçisi olacaq bala, Onıñ bergen qonuşuv qabiliyetinen tilge kirdi ve)"
        cid: 0
  - verse: 30
    segments:
      - text: "Bala boyle dedi: «Men, Allaһnıñ qulıyım. O, maña Kitapnı berdi ve meni peyğamber yaptı»."
        cid: 0
  - verse: 31
    segments:
      - text: "«Ne yerde olsam-olayım, O, meni mubarek qıldı; yaşaycaq muddetimce maña namaznı ve zekâtnı emir etti»."
        cid: 0
  - verse: 32
    segments:
      - text: "«Meni anama sayğılı qıldı; meni bedbaht bir zorbacı yapmadı»."
        cid: 0
  - verse: 33
    segments:
      - text: "«Doğğan kunüm, olecek kunüm ve tiri olaraq qabirden çıqarılacaq kunüm selâmetlik mañadır»."
        cid: 0
  - verse: 34
    segments:
      - text: "İşte, aqqında şube etkenleri Meryem oğlu İsa -haq söz olaraq- budır. (Tefsirciler, bu ayetke şu mananı da bergenler: «İşte, Meryem oğlu İsa, (onıñ aqqındaki bu beyan), haq sözdir ki, olar bunña şubelenirler». Metndeki manağa kore, İsanıñ haq söz oluvı, Allaһnıñ «kun - ol» emriniñ eseri oluvındandır)."
        cid: 0
  - verse: 35
    segments:
      - text: "Allaһnıñ bir evlât edinüvi olacaq şey degil. O, bundan uzaqtır. Bir işke uküm etken vaqtında, oña sadece «Ol!» der ve aman olur."
        cid: 0
  - verse: 36
    segments:
      - text: "(İsa şunı da söyledi:) Muaqqaq ki, Allaһ, menim de Rabbim, siziñ de Rabbiñizdir. Oyle ise, Oña qullıq etiñ. İşte, doğru yol budır."
        cid: 0
  - verse: 37
    segments:
      - text: "Soñra, toplulıqlar oz aralarında ayırıldılar. Buyuk kunge şaat olunğan vaqıtta, vay o kâfirlerniñ alına! (Tefsirciler, aralarında bolüngen bu gruppalarnıñ yeudiylernen hristianlar ya da hristianlarnıñ oz aralarındaki meshepler olğanına, bulardan kiminiñ Az.İsağa «Allaһ oğlu», kiminiñ «Allaһnıñ ozü», bir qısmınıñ «uç unsurdan biri», bazısınıñ da «Allaһnıñ qulı ve Resulı» degenlerini, boylece, ihtilâfqa tüşkenlirini bildireler)."
        cid: 0
  - verse: 38
    segments:
      - text: "Olar, bizim uzurımızğa çıqacaq kunleri (başlarına keleceklerni) ne yahşı eşitir ve ne yahşı korerler (bir korseñ)! Faqat o zalımlar bugun açıq bir sapıqlıq içindeler."
        cid: 0
  - verse: 39
    segments:
      - text: "(Resulım!) Sen olarnı peşmanlıq ve ğam-keder kunü aqqında tenbiyele. Çünki, olar bir ğaflet içine dalğanları alda ve alâ iman etmegen ekenler (baqarsıñ) iş olup bitkendir. (Yani er kesniñ esabı korülgen; bu esap soñunda cennetke baracaqlarnen ceennemni boylaycaqlar bir-birinden ayırılğandır)."
        cid: 0
  - verse: 40
    segments:
      - text: "Yer yuzüne ve onıñ uzerindekilerge ancaq biz varis olurmız (er şey keter, biz qalırmız) ve olar ancaq bizge döndürilirler."
        cid: 0
  - verse: 41
    segments:
      - text: "Kitapta İbrahimni añ. Zira, o, sadaqatı butün bir peyğamber edi."
        cid: 0
  - verse: 42
    segments:
      - text: "Bir zaman o babasına dedi ki: Babacığım! Eşitmegen, kormegen ve saña iç bir faydası tiymegen bir şeyge niçün tabınasıñ?"
        cid: 0
  - verse: 43
    segments:
      - text: "Babacığım! Aqiqaten, saña kelmegen bir ilim maña keldi. Oyle ise, maña uy ki, seni tüz yolğa çıqarayım."
        cid: 0
  - verse: 44
    segments:
      - text: "Babacığım! Şeytanğa qullıq etme! Çünki, şeytan, çoq merhametli Allaһqa asiy oldı."
        cid: 0
  - verse: 45
    segments:
      - text: "Babacığım! Allaһ tarafından saña azap toqunıp da, şeytannıñ yaqını oluvıñdan qorqam."
        cid: 0
  - verse: 46
    segments:
      - text: "(Babası:) Ey, İbrahim! dedi, sen menim tañrılarımdan yuz çevirmektesiñmi? Eger vazgeçmeseñ, ant olsun, seni taşboranğa tutarım! Uzun bir zaman menden uzaq tur!"
        cid: 0
  - verse: 47
    segments:
      - text: "İbrahim: Selâm saña (esen qal) dedi, Rabbimden sen içün mağfiret isteycem. Çünki, O, maña çoq lütfkârdır."
        cid: 0
  - verse: 48
    segments:
      - text: "Sizden de, Allaһtan ğayrı tabınğan şeyleriñizden de, uzaqlaşa ve Rabbime yalvaram. Umüt etilir ki, (sen içün) Rabbime dua etüvimnen, bedbaht (emegi boşuna ketken) olmam."
        cid: 0
  - verse: 49
    segments:
      - text: "Niayet, İbrahim olardan ve Allaһtan başqa tabınğan şeylerinden uzaqlaşıp, bir tarafqa çekilgen vaqtında, biz oña İshaq ve Yaqubnı bağışladıq ve er birini peyğamber yaptıq. (Az.İbrahim, qavmından uzaqlaşaraq, icret etken beldeniñ Şam ya da Felestin ekeni rivayet etile. Beyzaviyniñ naql etkenine kore, Az.İbrahim Şamğa doğru yolğa çıqqanda, başta Harranğa barğan, o yerde Saranen evlengen ve bu evlilekten Az.İshaq dünyağa kelgen. Az.Yaqub ise, İshaqnıñ oğlu ve İbrahimniñ torunıdır)."
        cid: 0
  - verse: 50
    segments:
      - text: "Olarğa rahmetimizden bağışlavda bulundıq; olarğa aqlı ve yuksek bir şuret nasip ettik."
        cid: 0
  - verse: 51
    segments:
      - text: "(Resulım!) Kitapta Musanı da añ. Aqiqaten, o ihlâs saibi edi ve em resul, em de nebiy edi. (Keniş darqağan añlayışqa kore, sadece eski peyğamberlerden biriniñ kitap ve şeriatını devam ettirgen peyğamber «nebiy», ozüne yañı bir kitap endirilgen ve yañı bir din tebliğ etken peyğamber ise, em «nebiy», em de «resul»dır. Az.Musağa Tevrat nazil olğanından, yuqarıdaki ayette nebiy ve resul olaraq añılğan)."
        cid: 0
  - verse: 52
    segments:
      - text: "Oña Tuurnıñ sağ tarafından seslendik ve onı, fısıldaşqan kimse qadar, (ozümizge) yaqlaştırdıq."
        cid: 0
  - verse: 53
    segments:
      - text: "Rahmetimizniñ bir neticesi olaraq, oña qardaşı Harunnı peyğamber olaraq ediye ettik. (Az.Musa, aile azalarından Harunnıñ ozüne vekil ve yardımcı tayin etülivi içün, Allaһqa yalvarğan, Allaһ Taalâ da, onıñ bu tilegini qabul etken)."
        cid: 0
  - verse: 54
    segments:
      - text: "(Resulım!) Kitapta İsmailni da añ. Aqiqaten, o, sözüne sadıq edi, resul ve nebiy edi."
        cid: 0
  - verse: 55
    segments:
      - text: "Halqına namaznı ve zekâtnı emir eter edi; Rabbi nezdinde de hoşnutlıq qazanğan bir kimse edi."
        cid: 0
  - verse: 56
    segments:
      - text: "Kitapta İdrisni de añ. Aqiqaten, o, pek doğru bir insan, bir peyğamber edi."
        cid: 0
  - verse: 57
    segments:
      - text: "Onı ustün bir maqamğa yukselttik. (Tefsircilerniñ bildirgenlerine kore, Az.İdrisniñ asıl adı Uhnuuhtır; Az.Nuһnıñ uçünci neslinden dedesidir. Ozünden evel insanlar ayvan terisi kiygenleri alda, o urba tikmekni icat etken, ayrıca ilk defa qalem qullanğan, yıldızlar ve esap ilmi uzerinde tüşüngen insan olğan. Oña otuz saife vahiy engen)."
        cid: 0
  - verse: 58
    segments:
      - text: "İşte, bular Allaһ olarğa nimetler bergen peyğamberlerinden, Ademniñ soyundan, Nuһ ile birlikte (gemide) taşığanlarımızdan, İbrahim ve İsrail (Yaqub)nıñ soyundan, doğruğa iriştirdigimiz ve seçken kimselerimizdendir. Olarğa çoq merhametli olğan Allaһnıñ ayetleri oqulğanda, ağlayaraq secedege qapana ediler."
        cid: 0
  - verse: 59
    segments:
      - text: "Niayet, olarnıñ artından oyle bir nesil keldi ki, bular namaznı bıraqtılar; nefisleriniñ arzularına uydılar. Bu sebepten, ileride sapıqlıqlarınıñ cezasını çekecekler."
        cid: 0
  - verse: 60
    segments:
      - text: "Ancaq, tövbe etken, iman etken ve yahşı davranışta bulunğan kimseler istisnadır. Bular, iç bir aqsızlıqa oğratılmayıp, cennetke, çoq merhametli Allaһnıñ, qullarına ğiyaben vade etken Adn cennetlerine kirecekler. Şubesiz, Onıñ vadesi yerini tapacaq. (Ayetniñ soñki cumlesi boyle de añlaşılğan: «Muaqqaq ki, Allaһnıñ yahşı qulları, Onıñ vade etken cenetine qavuşacaqlar»)."
        cid: 0
  - verse: 62
    segments:
      - text: "O yerde boş söz degil, hoş söz eşitirler. Ve o yerde saba-aqşam ozlerine ait rızıqları bardır."
        cid: 0
  - verse: 63
    segments:
      - text: "Qullarımızdan taqva saiplerine bergen cennetimiz, işte budır. (Abdullah b. Abbasnıñ bir rivayetine kore, Resulullah (s.a.) Cebrailge: «Ey, Cebrail, bizni şimdi yapqan ziyaretleriñden daa ziyade ziyaret etüviñden saña mani olğan bir şey barmı?» diyerek, Cebrailniñ onı daa çoq ziyaret etkenini istegen; bir başqa rivayetke kore, inanmağanlar Az.Peyğamberden bazı mevzularda sualler sorağanlar; Az.Peyğamber olarğa yaqında bilgi berecegini söylegen, faqat Cebrail beklegen vaqtında kelmegeni içün, kerekli bilgini almağa keçikken; bu fırsatnı qaçırmağan muşrikler: «Muһammedniñ Rabbi onı unuttı»», kibi laflar etkeninen, o buña çoq kederlengen. Bunıñ uzerine, Cebrailniñ sözüni naql etken şu ayet endi:)."
        cid: 0
  - verse: 64
    segments:
      - text: "Biz, ancaq Rabbiniñ emrinen energiiz. Ogümizde, artımızda ve bular arasında olğan er şey Oña aittir. Seniñ Rabbiñ unutqan degildir."
        cid: 0
  - verse: 65
    segments:
      - text: "(O) koklerniñ, yerniñ ve ekisiniñ arasıdaki şeylerniñ Rabbidir. O alda, Oña qullıq et; Oña qullıq etmek içün sabırlı ve metanetli ol. Onıñ bir addaşı (beñzeri) olğanını bilesiñmi? (Asla beñzeri yoqtır). (Muşrik araplar, Allaһ ismini, sadece eñ buyuk yaratıdcı olğan Cenab-ı Haq içün qullana, ondan ğayrı tabınğan putlarına, Allaһ demeyip, «ilâh» dey ediler)."
        cid: 0
  - verse: 66
    segments:
      - text: "İnsan der ki: «Olgen zamanımda, aqiqaten tiri olaraq (qabrimden) çıqarılacammı?"
        cid: 0
  - verse: 67
    segments:
      - text: "İnsan tüşünmezmi ki, daa evel o iç bir şey olmağanı alda, biz onı yaratqandırmız?"
        cid: 0
  - verse: 68
    segments:
      - text: "Oyle ise, Rabbiñye ant olsun ki, muaqqaq surette olarnı şeytanlarnen birlikte mahşerde toplaycaqmız; soñ olarnı tiz ustüne çökken vaziyette ceennemniñ etrafında azır tutacaqmız."
        cid: 0
  - verse: 69
    segments:
      - text: "Soñ, er milletten, rahman olğan Allaһqa eñ çoq asiy olğanlar angileri ise, çekip ayıracaqmız. (Allaһqa eñ çoq asiy olğanlarnıñ ayırıluvı, tefsirciler tarafından boyle yorumlanğan: İsyankârlarnıñ bir qısmı ayırılıp, ceennemge atılacaq; isyanı daa yengil olğan ve vaziyeti uyğun kelgenler ise, bağışlanacaqlar. Ancaq, eger ayet butüninen kâfirlerge dair ise, o taqdirde, bu ayırıluv, er kesniñ, inkârcılıq ve isyan derecesine kore, çeşit gruppalarğa ayırıluvıdır ki, buña kore, er gruppa sırasınen ceennemde, vaziyetine uyğun bir tabaqağa atılacaq)."
        cid: 0
  - verse: 70
    segments:
      - text: "Soñ, o yerni boylamağa daa ziyade lâyıq olğanlarnı, elbette biz daa yahşı bilirmiz."
        cid: 0
  - verse: 71
    segments:
