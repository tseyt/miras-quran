  - verse: 5
    segments:
      - text: Artıq kim
        cid: 2
      - text: berir
        cid: 3
      - text: ve saqınır ise,
        cid: 4
      - text: >-
          eñ yahşısı da, tasdiq eter ise, biz de onı eñ qolayğa azırlarmız (onda muvafaqiyetli
          yaparmız).
        cid: 0
