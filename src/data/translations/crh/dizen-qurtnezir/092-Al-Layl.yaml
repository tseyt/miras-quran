surah_id: 92
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: (Qaranlığınen etrafnı)
        cid: 0
      - text: bürüp örtken vaqıtta
        cid: 3
      - text: gecege, açılıp ağarğan vaqıtta
        cid: 1
      - text: >-
          kündüzge, erkekni ve ırğaçını yaratqanğa yemin eterim ki, işleriñiz başqa-başqadır.
        cid: 0
  - verse: 2
    segments:
