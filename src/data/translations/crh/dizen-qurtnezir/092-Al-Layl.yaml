surah_id: 92
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "(Qaranlığınen etrafnı) burüp ortken vaqıtta gecege, açılıp ağarğan vaqıtta kundüzge, erkekni ve ırğaçını yaratqanğa yemin eterim ki, işleriñiz başqa-başqadır."
        cid: 0
  - verse: 2
    segments:
      - text: "[1 ayetine baq.]"
        cid: 0
  - verse: 3
    segments:
      - text: "[1 ayetine baq.]"
        cid: 0
  - verse: 4
    segments:
      - text: "[1 ayetine baq.]"
        cid: 0
  - verse: 5
    segments:
      - text: "Artıq kim berir ve saqınır ise, eñ yahşısı da, tasdiq eter ise, biz de onı eñ qolayğa azırlarmız (onda muvafaqiyetli yaparmız)."
        cid: 0
  - verse: 6
    segments:
      - text: "[5 ayetine baq.]"
        cid: 0
  - verse: 7
    segments:
      - text: "[5 ayetine baq.]"
        cid: 0
  - verse: 8
    segments:
      - text: "Kim saranlıq etip, ozüni muhtac saymaz, eñ yahşısı da, yalanlar ise, biz de onı eñ zoruna azırlarmız. Tüşken vaqtında da, malı ozüne iç fayda bermez."
        cid: 0
  - verse: 9
    segments:
      - text: "[8 ayetine baq.]"
        cid: 0
  - verse: 10
    segments:
      - text: "[8 ayetine baq.]"
        cid: 0
  - verse: 11
    segments:
      - text: "[8 ayetine baq.]"
        cid: 0
  - verse: 12
    segments:
      - text: "Doğru yolnı kostermek bizge aittir. Şubesiz, ahiret de, dünya da bizimdir."
        cid: 0
  - verse: 13
    segments:
      - text: "[12 ayetine baq.]"
        cid: 0
  - verse: 14
    segments:
      - text: "(Ey, insanlar!) Alev-alev yanğan bir ateşnen sizni tenbiyeledim."
        cid: 0
  - verse: 15
    segments:
      - text: "O ateşke, ancaq yalanlap yuz çevirgen yamanlar, kirer."
        cid: 0
  - verse: 16
    segments:
      - text: "[15 ayetine baq.]"
        cid: 0
  - verse: 17
    segments:
      - text: "Temizlenmek uzre, malını hayırğa bergen yahşılar ondan (ateşten) uzaq tutular."
        cid: 0
  - verse: 18
    segments:
      - text: "[17 ayetine baq.]"
        cid: 0
  - verse: 19
    segments:
      - text: "Yuce Rabbiniñ rizasını istemekten başqa, onıñ nezdinde iç bir kimsege ait şukran ile qarşılanacaq bir nimet yoqtır. Ve o (buña qavuşaraq) hoşnut olacaq."
        cid: 0
  - verse: 20
    segments:
      - text: "[19 ayetine baq.]"
        cid: 0
  - verse: 21
    segments:
      - text: "[19 ayetine baq.]"
        cid: 0