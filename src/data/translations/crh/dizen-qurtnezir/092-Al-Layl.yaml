surah_id: 92
language: crh
author: dizen-qurtnezir
verses:
  - verse: 4
    segments:
      - text: "Aqiqaten, sen içün ahiret dünyadan daa hayırlıdır."
        cid: 0
  - verse: 5
    segments:
      - text: "Pek yaqında Rabbiñ saña berecek de, hoşnut olacaqsıñ."
        cid: 0
  - verse: 6
    segments:
      - text: "O, seni yetim bulıp, barındırmadımı?"
        cid: 0
  - verse: 7
    segments:
      - text: "Şaşmalağan bulıp da, yol kostermedimi?"
        cid: 0
  - verse: 8
    segments:
      - text: "Seni faqır bulıp, zengin etmedimi?"
        cid: 0
  - verse: 9
    segments:
      - text: "Oyle ise, yetimni saqın ezme!"
        cid: 0
  - verse: 10
    segments:
      - text: "El açıp, istegenni de, saqın azarlama."
        cid: 0
  - verse: 11
    segments:
      - text: "Ve Rabbiñniñ nimetini minnetdarlıq ve şukran ile añ."
        cid: 0
  - verse: 14
    segments:
      - text: "(Ey, insanlar!) Alev-alev yanğan bir ateşnen sizni tenbiyeledim. 15-16. O ateşke, ancaq yalanlap yuz çevirgen yamanlar, kirer. 17-18. Temizlenmek uzre, malını hayırğa bergen yahşılar ondan (ateşten) uzaq tutular. 19-21. Yuce Rabbiniñ rizasını istemekten başqa, onıñ nezdinde iç bir kimsege ait şukran ile qarşılanacaq bir nimet yoqtır. Ve o (buña qavuşaraq) hoşnut olacaq."
        cid: 0
  - verse: 93
    segments:
      - text: "ed-DUһAA Duһaa - quşluq vaqtı demektir. Sure adını ilk ayette keçken bu kelimeden ala, Fecr suresinden soñ, Mekkede engen, 11 ayettir. Surede ahırzaman Peyğamberiniñ hususiyetlerinden biri yani yetim olğanı tilge alına ve oña teselli berile. Bismilâaһirraһmaanirraһiim (Rahman ve rahim olğan Allaһnıñ adınen). 1-3. Quşluq vaqtına ve sukünetke irişkeniñde gecege yemin eterim ki, Rabbiñ seni bıraqmadı ve saña darılmadı. (Biraz vaqıt vahiyniñ kelüvi keçikti. Muşrikler: «Rabbi onı terk etti, oña darıldı!», dediler. Bu laqırdılar ve sataşuvlar Efendimizge ağır kele edi. İşte, bu, husus ayetlernen izaat etildi)."
        cid: 0