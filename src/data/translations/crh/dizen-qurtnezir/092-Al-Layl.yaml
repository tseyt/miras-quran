      - text: Kim saranlıq etip, özüni muhtac saymaz,
        cid: 2
      - text: >-
          eñ yahşısı da, yalanlar ise, biz de onı eñ zoruna azırlarmız. Tüşken vaqtında da,
          malı
        cid: 0
      - text: özüne iç
        cid: 4
      - text: fayda bermez.
        cid: 0
