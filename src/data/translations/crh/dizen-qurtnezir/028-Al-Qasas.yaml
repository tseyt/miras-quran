        cid: 0
  - verse: 36
    segments:
      - text: "İnsanlarğa bir rahmet tattırğanımızda, oña sevinirler. Eger yapqanlarından otrü, başlarına bir yamanlıq kelse, aman umütsizlikke tüşe qoyarlar."
        cid: 0
  - verse: 37
    segments:
