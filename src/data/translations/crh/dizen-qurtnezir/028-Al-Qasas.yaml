      - text: >-
          (Allah Taalânıñ lütfi sıñırsızdır; buña muqabil O, iç bir şekilde qullarına zulum
          etmez. Bunıñ kibi, bu ayette de, yapılğan yahşılıqlarnıñ qat-qat savapnen
          qarşılanacağı, faqat yamanlıqlarnıñ o derecede cezalandırılacağı añlatıla. Ancaq, bu
          şahsiy plandaki yahşılıq ve fenalıqlar aqqındadır. Bir yahşılıq ya da fenalıqnı ilki
          başlatqan, toplumğa bu doğruda örnek ve teşviqatçı kimseniñ alı ise başqadır. İmam
          Muslimniñ «Sahih»inde yer alğan bir hadis-i şerifnen bu noqtağa böyle izaat
          berilgen: «Kim ki, İslâmda maqbul olğan güzel bir işni ilk olaraq işler de, bunıñ
          yol alına kelüvine sebep olur ise, özüne em işlegen bu hayırınıñ savabı berilir, em
          de -eñ küçük bir eksiklik olmadan - özünden soñ aynı yahşılıqnı yapacaq olğanlarnıñ
          savabı qadar savab berilir. Kene, kim İslâmda yamanlığı bildirilgen bir işni ilk
          evelâ işler de, bunıñ yol alına kelüvine sebepçi olur ise, özüne em işlegen
          yamanlığınıñ günahı yüklenir, em de -eñ küçük bir eksiklik olmadan- özünden soñ aynı
          yamanlıqnı işleycek olğanlarnıñ günahı qadar daa günah yüklenir).
