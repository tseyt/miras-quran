surah_id: 28
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >
          Taa. Siin. Miim.
        cid: 0
  - verse: 2
    segments:
      - text: >
          Bular, ap-açıq kitapnıñ ayetleridir.
        cid: 0
  - verse: 3
    segments:
      - text: >
          İman etken bir qavm içün (faydalı olmaq üzre), Musanen Fıravunnıñ haberlerinden
          bir qısmını saña aqiqat şeklinen naql etecekmiz.
        cid: 0
  - verse: 4
    segments:
      - text: >
          Fıravun, (Mısır) toprağında, aqiqaten adden aşqan, halqını çeşit toplulıqlarğa
          bölgen edi. Olardan bir topunı küçsiz köre, bularnıñ oğullarını soya, qızlarını
          ise, sağ qaldıra edi. Çünki, o bozğuncılardan edi. (Ayette söz etilgen toplulıq
          İsrail oğullarıdır. Bir kâhin Fıravunğa İsrail oğulları arasından bir oğlan bala
          dünyağa kelecegini ve onıñ saltanatını elinden alacağını söylegen edi. Bunıñ
          üzerine, Fıravun İsrail oğullarınıñ oğlan balaları öldürilmesini emir etti).
        cid: 0
  - verse: 5
    segments:
      - text: >
          Biz ise, o yerde ezileyatqanlarğa lütfte bulunmaq, olarnı reberler yapmaq ve
          olarnı (muqaddes topraqlarğa) varis etmek istey edik.
        cid: 0
  - verse: 6
    segments:
      - text: >
          Ve o yerde olarnı hakim yapmaq; Fıravunnen Haamaanğa ve ordularına, olardan
          (İsrail oğullarından kelecek diye) qorqqan şeylerini köstermek (istey edik).
        cid: 0
  - verse: 7
    segments:
      - text: >
          Musanıñ anasına: Onı emiz, oña zarar keleceginden qorqqanıñda, onı deñizge (Nil
          nehrine) taşla, iç qorqup, qayğılanma, çünki, biz onı saña qaytarıp berecekmiz
          ve onı peyğamberlerden biri yapacaqmız, diye bildirdik.
        cid: 0
  - verse: 8
    segments:
      - text: >
          Niayet, Fıravun ailesi onı coyuq bala olaraq (nehrden) aldı. O, soñunda olar
          içün bir duşman ve bir qasevet olacaq edi. Şübesiz, Fıravunnen Haamaan ve
          askerleri yañlış yolda ediler.
        cid: 0
  - verse: 9
    segments:
      - text: >
          Fıravunnıñ qadını (sepetniñ içinden oğlan bala çiqqanınen qocasını:) men ve sen
          içün köz aydınlığı! Onı öldürmeñ, belki, bizge faydası tiyer, ya da onı evlât
          etermiz, dedi. Albuki, olar (işniñ soñunı) sezalmay ediler.
        cid: 0
  - verse: 10
    segments:
      - text: >
          Musanıñ anasınıñ yüreginde yalıñız balasınıñ qasevetı qaldı. Eger biz,
          (vademizge) inanğanlarından oluvı içün, onıñ qalbini pekiştirmegen olsa edik, ne
          yerde ise, işni meydanğa çıqaracaq edi.
        cid: 0
  - verse: 11
    segments:
      - text: >
          Anası Musanıñ tatasına: Onıñ izini taqip et, dedi. O da, olarğa duydırmadan,
          uzaqtan qardaşını közetti.
        cid: 0
  - verse: 12
    segments:
      - text: >
          Biz daa evelden (anasına qaytarıp berilgenge qadar) onıñ emçek analarını
          qabulına (emmesine) musaade etmedik. Bunıñ üstüne tatası: Sizge, onı baquvnı siz
          içün becerecek, em de oña yahşı davranacaq bir aile köstereyimmi? dedi.
        cid: 0
  - verse: 13
    segments:
      - text: >
          Böyleliknen, biz onı anasına, közü aydın olsun, ğam çekmesin ve Allahnıñ vadesi
          kerçek olğanını bilsin diye, qaytarıp berdik. Faqat kene de pek çoqu (bunı)
          bilmezler. (Fıravunnen qadını Az.Musanı evlât etmek ister eken, er alda, onıñ
          ellerinde terbiye olınuvınen, özlerine uyacaq bellegen ediler. Albuki, insan
          ayatınıñ içinde eki müim amil bar: nesep ve terbiye. İnsan bazıda nesepniñ,
          bazıda da terbiyeniñ, bazıda da, er ekisiniñ tesiri altında qalır. 9-nci ayette
          bu incelikke işaret etilgen. Bilgi insan davranışını qısmen deñiştirir. Bunıñnen
          beraber, insannıñ bilginen etraf tesirleri ve terbiyenen tamamen deñiştire
          bilecegini, istenilgen qalıpqa soqula bilecegi mümkün, diye sanmaq yañlıştır.
          Yahşı terbiye körgen, yahşı toplumda yetişken, bilgili ve medeniyetli olmaqnen
          beraber, yaman insanlar olğanı kibi, yaman toplum içinde yetişken, yaman terbiye
          körgen... faqat yahşı olaraq qala bilgen insanlar da bar).
        cid: 0
  - verse: 14
    segments:
      - text: >
          Musa yigitlik çağına irişkeninen, biz oña ikmet ve ilim berdik. İşte, güzel
          davranğanlarnı biz böyle mükâfatlandırırmız. («İkmet» manası berilgen «hukm»
          kelimesi tefserlerde çoq yerde «peyğamberlik» şeklinde izaatlana).
        cid: 0
  - verse: 15
    segments:
      - text: >
          Musa, ealisi habersiz olğan bir vaqıtta, şeerge kirdi. O yerde, biri öz
          tarafından, digeri duşman tarafından olğan eki adamnı bir-birinen dögüşken alda
          kördı. Onıñ tarafından olğanı duşmanğa qarşı ondan yardım istedi. Musa da, o
          birine bir yumruq urup, ölümine sebep oldı. (Bunıñ üstüne:) Bu, şeytan işidir.
          O, aqiqaten saptırıcı, ap-açıq bir duşman, dedi. (Az.Musa, haqnı tebliğ etmege
          başlağanı içün, qıptiyler oña qarşı küreş başladılar. Bu sebepnen, ealisiniñ
          evlerine çekilgen bir vaqıtta şeerge kirgen edi. «Bu şeytan işi» demek -
          Az.Musanıñ öz işine degil, zaten ölüm cezasını qazanğan maqtülniñ (öldürilgen
          insannıñ) qabaatına işaret etkeni ifadesidir. Bu qabaatnıñ bazı yerlerde bir
          yeudiy qadınnı zinağa zorlav, bazı yerlerde mutlaq tarzda, Allahqa isyan olğanı
          qayd etile. Bunıñnen beraber, daa öldürmek emrini almağanından, Az.Musanıñ bu
          sözünen özüniñ areketini nazarda tutqanı da ifade olunmaqta).
        cid: 0
  - verse: 16
    segments:
      - text: >
          Musa: Rabbim! Doğrusı, özüme zulum ettim.(Başıma iş açtım). Meni bağışla, dedi.
          Allah da onı bağışladı. Çünki, çoq bağışlayıcı, çoq merhametli ancaq Odır.
        cid: 0
  - verse: 17
    segments:
      - text: >
          Musa: Rabbim! Maña lütf etken nimetleriñe ant olsun ki, artıq qabaatlılarğa (ve
          qabaatqa iteklengenlerge) asla arqa olmaycam, dedi.
        cid: 0
  - verse: 18
    segments:
      - text: >
          Şeerde qorqu içinde, (etrafını) közeterek, sabanı açtı. Bir de ne körsin, dün
          özünden yardım istegen kimse, feryad eterek, kene ondan imdat soray. Musa oña
          (yardım istegenge) dedi ki: Doğrusı, sen bes-belli bir adden aşqansıñ!
        cid: 0
  - verse: 19
    segments:
      - text: >
          Musa ekisiniñ de duşmanı olğan adamnı yaqalamaq istegeninen, o adam dedi ki: Ey,
          Musa! Dün bir cannı qıyğanıñ kibi, meni de qıymaq isteysiñmi? Demek,
          tüzelticilerden olmaq istemey de, bu yerde ille yaman bir zorbacı olmaqnı
          arzulaysıñ sen!
        cid: 0
  - verse: 20
    segments:
      - text: >
          Şeerniñ o bir ucundan bir adam çapıp keldi: Ey, Musa! İleri kelgenler seni
          öldürmek içün aqqıñda muzakere etmekteler. Der'al (bu yerden) çıq! İnan ki, men
          saña eyilik istegenlerdenim, dedi.
        cid: 0
  - verse: 21
    segments:
      - text: >
          Musa qorqa-qorqa, (etrafnı) közeterek, o yerden çıqtı. «Rabbim! Meni zalımlar
          topundan qurtar», dedi.
        cid: 0
  - verse: 22
    segments:
      - text: >
          Medyenge doğru yönelgeninde: Ümüt eterim, Rabbim, meni doğru yolğa qavuştırır,
          dedi. (Medyenlilernen Az.Musa arasında aqrabalıq olğanı rivayet etile.
          Medyenliler de, Musa (a.s.)da, Az.İbrahimniñ evlâtlarından edi. Atta «Medyen»,
          İbrahim peyğamberniñ oğularından biriniñ adı edi ve bu şeer Fıravunnıñ
          idareciligi altında degil edi).
        cid: 0
  - verse: 23
    segments:
      - text: >
          Musa Medyen suvına barğanınen, o yerde (ayvanlarını) suvarğan bir çoq insannı
          buldı. Olarnıñ artında da, (ayvanlarını) bıraqmağan eki qadın kördi. Olarğa:
          Derdiñiz nedir? dedi. Böyle cevap berdiler: Çobanlar suvarıp çekilmeden, biz
          (olarnıñ arasına soqulıp, ayvanlarımıznı) suvarmaymız; babamız da pek qart.
        cid: 0
  - verse: 24
    segments:
      - text: >
          Bunıñ üzerine, Musa olarnıñ yerine (mallarnı) suvardı. Soñra kölgege çekildi ve:
          Rabbim! Doğrusı, maña endirecek er hayırıña (lütfiñe) muhtacım, dedi. (Az.Musa
          yedi kündir aç edi, ne berilse aşaycaq alda edi. Bu sözlerinen Rabbine er angi
          bir aşaycaq ihsan etüvi içün yalvarmaqta edi. Ayetniñ soñuna: «Doğrusı, maña
          endirgen hayırıñdan tolayı muhtacım», manası da berile bilir. Bu manağa köre,
          Az.Musa özüne berilgen yüksek vazifege, ve bu sebepnen, dünyada faqır olğanına
          işaret ete edi. Zira, o, Fıravunnıñ yanında olğanda bolluq içinde edi. Elbette,
          bu sözler şikâyet içün degil, şükür maqsadınen aytılğandır).
        cid: 0
  - verse: 25
    segments:
      - text: >
          Derken, o eki qadından biri utana-utana yürerek, oña keldi: Babam, dedi, bizim
          yerimizge (ayvanlarnı) suvarğanıñnıñ aqqını ödemek içün seni çağıra. Musa oña
          (Az.Şuaybğa) kelip, başından keçkenni añlatqanınen, o: Qorqma, o zalım qavmdan
          qurtuldıñ, dedi.
        cid: 0
  - verse: 26
    segments:
      - text: >
          (Şuaybnıñ) eki qızından biri: Babacığım! Onı ücretnen (çoban) tut. Çünki,
          ücretnen çalıştıracaq eñ yahşı kimseñ, küçlü ve işançlı olğanıdır, dedi.
        cid: 0
  - verse: 27
    segments:
      - text: >
          (Şuayb) dedi ki: Maña sekiz yıl çalışuvıña qarşılıq, şu eki qızımdan birini saña
          nikâhlamaq isteyim. Eger on yılğa tamamlasañ, artıq o özüñden; yoqsa, saña
          ağırlıq bermek istemem. İnşaallah, meni yahşı kimselerden (iş bergenlerden)
          bulacaqsıñ.
        cid: 0
  - verse: 28
    segments:
      - text: >
          Musa böyle cevap berdi: Bu sennen menim aramdadır. Bu eki müddetten angisini
          toldursam-toldurayım, demek ki, maña nisbeten husumet yoq. Aytqanlarımızğa Allah
          vekildir.
        cid: 0
  - verse: 29
    segments:
      - text: >
          Soñunda Musa müddetni toldurıp, ailesinen yolğa çıqqanınen, Tuur tarafında bir
          ateş kördi. Ailesine: Siz (bu yerde) bekleñ; men bir ateş kördim, belki o yerden
          sizge bir haber ya da qızınmañız içün bir ateş parçası ketiririm, dedi.
        cid: 0
  - verse: 30
    segments:
      - text: >
          O yerge kelgeninen, o mubarek yerdeki vadiniñ sağ çetinden, (o yerdeki) terek
          tarafından oña böyle seslenildi: Ey, Musa! Bil ki, men - bütün alemlerniñ Rabbi
          olğan Allahım.
        cid: 0
  - verse: 31
    segments:
      - text: >
          Ve «Tayağıñnı at!» (denildi). Musa (atqan) tayağı yılan kibi teprengenini
          körgeninen, çevirilip, artına baqmadan, qaçtı. «Ey, Musa! Bu yaqqa kel, qorqma.
          Çünki, sen eminlikte olğanlardansıñ» (buyurıldı).
        cid: 0
  - verse: 32
    segments:
      - text: >
          «Eliñni qoynuña soq; Qusursız, bem-beyaz çıqacaq. Qorqudan (açılğan) qollarıñnı
          özüñe çek. İşte, bu ekisi Fıravun ve onıñ adamlarına qarşı Rabbiñ tarafından eki
          kesen-kes delildir. Çünki, olar yoldan çıqqan bir qavm olğan ediler» (diye
          seslenildi).
        cid: 0
  - verse: 33
    segments:
      - text: >
          Musa dedi ki: Rabbim! Men olardan birini öldürgen edim, meni öldirüvlerinden
          qorqam.
        cid: 0
  - verse: 34
    segments:
      - text: >
          Qardaşım Harunnıñ tili menimkinden daa tüzgün. Onı da meni doğrulağan bir
          yardımcı olaraq, mennen birlikte yolla. Zira, maña yalancılıq iftirasında
          olğanlarından qorqam.
        cid: 0
  - verse: 35
    segments:
      - text: >
          Allah buyurdı: Seni qardaşıñnen destekleycekmiz ve sizge öyle bir qudret
          berecekmiz ki, ayetlerimiz (mucize yardımlarımız) sayesinde, olar sizge
          yetişalmaycaqlar. Siz ve sizge tabiy olğanlar üstün keleceksiñiz.
        cid: 0
  - verse: 36
    segments:
      - text: >
          Musa olarğa ap-açıq ayetlerimizni ketirgeninen: Bu, olsa-olsa, uydırılğan bir
          tılsımdır. Biz evelki atalarımızdan böylesini eşitmegen edik, dediler.
        cid: 0
  - verse: 37
    segments:
      - text: >
          Musa böyle dedi: Rabbim öz qatından kimniñ hidayet (haqqa reberlik) ketirgenini
          ve hayırlı aqibetniñ kimge nasip olacağını eñ yahşı bilicidir. Muaqqaq ki,
          zalımlar qurtulışqa irişalmazlar.
        cid: 0
  - verse: 38
    segments:
      - text: >
          Fıravun: Ey, ileri kelgenler! Siz içün menden başqa bir ilâh tanımayım. Ey,
          Haamaan! Aydı, men içün çamur üzerine ateş yaq (ve tola yap), maña bir qulle yap
          ki, Musanıñ tañrısına çıqayım; amma belleyim ki, o mıtlaqa yalan
          söylegenlerdendir, dedi.
        cid: 0
  - verse: 39
    segments:
      - text: >
          O ve askerleri, yer yüzünde aqsız yerde büyüklik tasladılar ve aqiqaten bizge
          döndürilmeycekler bellediler.
        cid: 0
  - verse: 40
    segments:
      - text: >
          Biz de, onı ve askerlerini yaqalap, deñizge attıq qoydıq. Baq, işte, zalımlarnıñ
          soñu nasıl oldı!
        cid: 0
  - verse: 41
    segments:
      - text: >
          Olarnı, (insanlarnı) ateşke çağırğan reberler yaptıq. Qıyamet künü olar yardım
          körmeycekler.
        cid: 0
  - verse: 42
    segments:
      - text: >
          Bu dünyada arqalarına lânet taqtıq. Olar qıyamet kününde de yamanlanğanlar
          arasındadır.
        cid: 0
  - verse: 43
    segments:
      - text: >
          Ant olsun, biz ilk nesillerni yoq etkenden soñ, Musağa -tüşünip ögüt alsınlar
          diye- insanlar içün ap-açıq deliller, hidayet reberi ve rahmet olaraq o Kitapnı
          (Tevratnı) bergenmiz.
        cid: 0
  - verse: 44
    segments:
      - text: >
          (Resulım!) Musağa emrimizni vahiy etken vaqtımızda, sen batı tarafta bulunmay
          ediñ ve (o adiseni) körgenlerden de degil ediñ. (Az. Musanıñ Tuur dağında ilâhiy
          kelâmğa nail olğan vaqıtqa işaret etile ve Az. Peyğamberniñ o esnada Tuurda
          şahsen azır olmağanı ve batı tarafında Az. Musanı beklegenler arasında olmağanı
          hatıratıla; bütün bularnıñ, oña vahiy yolunen ögretilgeni ifade etile).
        cid: 0
  - verse: 45
    segments:
      - text: >
          Faqat biz nice nesiller bar ettik de, olarnıñ üzerinden uzun zamanlar keçti.
          Sen, ayetlerimizni olardan oquyaraq ögrenmek üzre, Medyen halqı arasında oturğan
          da degilsiñ; aksine (olarnı saña) yollağan bizmiz.
        cid: 0
  - verse: 46
    segments:
      - text: >
          (Musağa) seslengen vaqtımızda da, sen Tuurnıñ yanında degil ediñ. Aksine, senden
          evel olarğa tenbiyeci (peyğamber) kelmegen bir qavmnı tenbiyeleviñ içün,
          Rabbiñden bir rahmet olaraq (o yerde keçkenlerni saña bildirdik); ümüt etilir
          ki, tüşünip, ögüt alırlar. (Tefsirlerde 44, 45 ve 46-nci ayetlerde «sen ...
          degil ediñ» şeklinde işaret etilgen vaqialarnıñ ayrı zamanlarğa ait ve Az.
          Musanıñ ayatında ayrı-ayrı müim birer adise olğanı beyan etilmekte. Az.
          Muhammedden evel peyğamber yollanılmağan devirge «fetret» devri denile. Az.
          İsanen Az. Muhammed arasındaki 570 yıllıq zaman kesegi olğanı söylene. Az. İsa
          ve Az. Musanıñ davetleri İsrail oğulları ve olarnıñ avalesindekilerge ait
          olğanından, bu yerde nazarda tutulğan devir - Az. İsmailnen Az. Muhammed
          arasındaki vaqıt şeklinde de, izaat etilmekte).
        cid: 0
  - verse: 47
    segments:
      - text: >
          Şahsen özleri yapqanlarından tolayı, başlarına bir musibet kelgende: Rabbimiz!
          Ne olur edi, bizge bir peyğamber yollasa ediñ de, ayetleriñe uysaq ve
          mü'minlerden olsa edik! diyecek olmasalar edi (seni yollamaz edik).
        cid: 0
  - verse: 48
    segments:
      - text: >
          Faqat olarğa tarafımızdan o haq (Peyğamber) kelgeninen: «Musağa berilgen
          (mucizeler) kibi, oña da berilmeli degil edimi?», dediler. Yahşı, daa evel
          Musağa berilgenini de inkâr etmegen edilermi? «Bir-birini desteklegen eki
          sihir!», degenler ve şunı söylegen ediler: Doğrusı, biz iç birine inanmaymız.
          (Bu yerdeki manağa köre, Qur'an ve Tevrat köz ögüne alına bilir. Diger
          qıraatlarğa köre, «yardımlaşqan eki sihirbaz!» şeklinde mana bermek kerekir. Bu
          taqdirde, Az. Musanen Az. Harun ya da Az. Musanen Az. Muhammed köz ögüne alınğan
          ola bilir).
        cid: 0
  - verse: 49
    segments:
      - text: >
          (Resulım!) De ki: Eger doğru sözlüler iseñiz, Allah qatından bu ekisinden (maña
          ve Musağa engen kitaplardan) daa doğru bir kitap ketiriñ de, men oña uyayım!
        cid: 0
  - verse: 50
    segments:
      - text: >
          Eger saña cevap bermeseler, bil ki, olar yalıñız aveslerine uymaqtalar. Allahtan
          bir yol kösterici olmadan, öz avesine uyğandan daa sapıq kim ola bilir! Elbette,
          Allah zalım qavmnı doğru yolğa qavuştırmaz.
        cid: 0
  - verse: 51
    segments:
      - text: >
          Ant olsun ki, biz tüşünip, ögüt alsınlar diye, sözni (vahiyni) bir-biri artından
          yetiştirgendirmiz. (Vahiylerimizni aralıqsız yollağandırmız).
        cid: 0
  - verse: 52
    segments:
      - text: >
          Ondan (Qur'andan) evel özlerine kitap bergenlerimiz, oña da iman eterler. (Ehl-i
          kitaptan olıp da, musulmanlıqnı qabul etkenlerge işaret olunmaqta).
        cid: 0
  - verse: 53
    segments:
      - text: >
          Olarğa (Qur'an) oqulğan vaqıtta: Oña iman ettik. Çünki, o Rabbimizden kelgen
          aqiqattır. Esasen, biz daa evel de musulman edik, derler.
        cid: 0
  - verse: 54
    segments:
      - text: >
          İşte, olarğa, sabır etüvlerinden ötrü, mükâfatları eki qat berilecek. Bular
          yamanlıqnı yahşlıqnen def eterler, özlerine bergen rızıqlarımızdan da, Allah
          rizası içün arclarlar.
