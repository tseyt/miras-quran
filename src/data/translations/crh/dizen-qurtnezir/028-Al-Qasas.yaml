surah_id: 28
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "Elif. Lâam. Miim. 2-5. Rumlar, (araplar bulunğan bolgege) eñ yaqın bir yerde mağlubiyetke oğradılar. Albuki, olar, bu mağlubiyetlerinden soñ, bir qaç yıl içinde ğalip kelecekler. Eñ soñunda emir Allaһnıñdır. O kunü mu’minler de Allaһnıñ yardımınen sevinecekler. Allaһ tilegenine yardım eter. O, mutlaq kuç saibidir, çoq merhametlidir. (Ehl-i kitap olğan vizantiyalılar, mecusiy iranlılar tarafından mağlüp etilgen edi. Mekke muşrikleri bu neticege çoq sevindiler ve musulmanlarğa: «Eger Allaһ, siziñ degeniñiz kibi, yekâne ğalip olsa edi, ehl-i kitaptan olğan vizantiyalılarnı ustün ketirir edi», kibi qopayçoraca söylenmege başladılar. Bunıñ ustüne, Qur’an bir mucize olaraq, kelecekteki bir neticeni haber berdi: Uç ile doquz yıl içinde vizantiyalılar iranlılarnı yeñyecek ve mu’minler sevinecek ediler. Buña kore, 624-nci senesi vizantiyalılar İranğa kirdiler. Bundan başqa, aynı sene musulmanlar Bedirde muim zaferler elde ettiler)."
        cid: 0
  - verse: 2
    segments:
      - text: "İnsanlar, imtiandan keçirilmeden, sadece «İman ettik», deyuvlerinen, bıraqıla berilecek belledilermi? (Bu ayetniñ imanları sebebinden, çeşit eskencelerge oğrağan bazı sahabiler aqqında nazil olğanı rivayet etilgen)."
        cid: 0
  - verse: 3
    segments:
      - text: "Ant olsun ki, biz olardan evelkilerni de imtiandan keçirgen edik. Elbette, Allaһ doğrularnı ortağa çıqaracaq, yalancılarnı da mıtlaqa ortağa qoyacaq."
        cid: 0
  - verse: 4
    segments:
      - text: "Yoqsa, yamanlıqlarnı yapqanlar bizden qaça bilecekler zan ettilermi, ne qadar fena (ne yañlış) uküm bermekteler!"
        cid: 0
  - verse: 5
    segments:
      - text: "Kim Allaһqa qavuşmaqnı umüt etse, bilsin ki, Allaһnıñ tayin etken o vaqıtı elbette kelecek. O er şeyni eşitici ve bilicidir."
        cid: 0
  - verse: 6
    segments:
      - text: "(Bu) Allaһnıñ vadesidir. Allaһ vadesinden qaytmaz; faqat insanlarnıñ çoqu bilmezler. (Bunıñ kibi, Az. Ebu Bekir (r.a.) Allaһnıñ bu kerçek vadesine yurekten inanaraq, mecusiy iranlılarnıñ ğlabesine sevingen, muşriklerge: «Allaһ siziñ sevinçiñizni ziyade sürdirmeycek; çünki, O, bir qaç sene içinde rumlarnıñ tekrar ğalip keleceklerini haber berdi», degeninen, muşriklerden Ubey b. Halef baaske kirişmekni teklif etti. On deve uzerine ve uç yıl içinde rumlarnıñ ğalip kelip-kelmeycegi meselesinde baas ettiler. Az. Ebu Bekir, olıp-bitkenini Cenabı Peyğamberge añlatqanınen, Efendimiz (s.a.) «bid’(bir-qaç) sene» sözüniñ uç ile doquz sene arasındaki bir muddetni ifade etkenini, bu sebepnen, muddetni de, deve sayısını da uç qatına çıqaruvını teklif etti. Bu sefer doquz sene içinde rumlarnıñ ğalip kelecegine dair yuz deve uzerine baasnı yañıladılar. Aqiqaten, Tirmiziyniñ bildirgenine kore, Bedir cenkine doğru kelgen kunlerde rumlar iranlılarğa qarşı yapqan cenklerinde ğalip keldiler, boylece, Allaһnıñ vadesi yerine keldi; Az. Ebu Bekir de Ubey b. Halefniñ varislerinden qazanğan develerini alaraq, Peyğamberniñ tevsiyesine kore, faqırlarğa dağıttı)."
        cid: 0
  - verse: 7
    segments:
      - text: "Olar dünya ayatınıñ korüngen yuzüni bilirler. Ahiretten ise, olar tamamen ğafildirler."
        cid: 0
  - verse: 8
    segments:
      - text: "Oz-ozlerine, Allaһnıñ, koklerni, yerni ve ekisinni arasında olğanlarnı, ancaq haq olaraq, muayen bir devir içün yaratqanını iç tüşünmedilermi? İnsanlarnıñ bir çoqu Rabblerine qavuşmaqnı, aqiqaten inkâr etmektedirler."
        cid: 0
  - verse: 9
    segments:
      - text: "Olar yer yuzünde kezip de, ozlerinden evelkilerniñ aqibetleri nasıl olğanına baqmadılarmı? Ki olar, ozlerinden daa kuçlü ediler; yer yuzüni qazıp, alt-ust etkenler, onı bularnıñ abadanlaştırğanlarından daa çoq abadanlaştırğan ediler. Peyğamberleri olarğa da nice açıq deliller ketirgen ediler. Zaten, Allaһ olarğa zulum etecek degil edi; faqat olar oz-ozlerine zulum etmekte ediler. (Ayette suv ve maden çıqarmaq ya da ekip-tikmek içün topraqnı işlegen ve menimsilgen bolgeler meydanğa ketirgen, soñra da, inkârcılıqları sebebinden, Allaһnıñ azabına oğrağan Aad ve Semuud kibi eski qavmlarğa işaret etilmekte ve olarnıñ qalımtılarına baqılıp, ibret alınuvı ogütlenmekte)."
        cid: 0
  - verse: 10
    segments:
      - text: "Soñunda, Allaһnıñ ayetlerini yalan sayaraq ve olarnı alayğa alaraq, fenalıq yapqanlarnıñ aqibetleri pek fena oldı."
        cid: 0
  - verse: 11
    segments:
      - text: "Allaһ evelâ mahlüqnı yaratır, (olümden) soñra da, bunı (yaratmaqnı) tekrarlar. Soñunda ep Oña döndürileceksiñiz."
        cid: 0
  - verse: 12
    segments:
      - text: "Qıyamet qopacaq kunü, gunahkârlar (umütsizlik içinde) susacaqlar."
        cid: 0
  - verse: 13
    segments:
      - text: "(Allaһqa qoşqan) ortaqlarından ozlerine iç bir şefaatçı çıqmaycaq. Zaten, olar ortaqlarını da inkâr etedejkler."
        cid: 0
  - verse: 14
    segments:
      - text: "Qıyamet qopacaq kunü, işte o kunü (mu’minlernen inkârcılar) birbirilerinden ayırılacaqlar."
        cid: 0
  - verse: 15
    segments:
      - text: "İman etip, yahşı işler yapqanlarğa kelgende, olar cennette nimetlerge ve sevinçke nail olacaqlar."
        cid: 0
  - verse: 16
    segments:
      - text: "İnkâr etkenler, ayetlerimizni ve olgenden soñ tirilüvni yalan sayğanlar ise, işte olar azapnen yuz-yuzge bıraqılacaqlar. 17-18. Aydı, siz, aqşamğa qavuşqanıñızda (aqşam ve yatsı vaqtında), sabağa qavuşqanıñızda, kundüzniñ soñunda ve uyle vaqtına irişkeniñizde, Allaһnı tesbih etiñ (namaz qılıñ), ki, koklerde ve yerde hamd Oña mahsustır. (Abdullah b. Abbas (r.a.)dan kelgen rivayetke kore, bu ayet beş vaqıt namaznı içine almaqta. Bu sebepnen, ekseri alimler beş vaqıt namaznıñ Mekkede farz qılınğanı qanaatindedirler. Az. Peyğamber (s.a.) bir hadis-i şerifte buyuk savap qazanmaq istegenlerge bu ayetni oqumalarını tevsiye etken)."
        cid: 0
  - verse: 17
    segments:
      - text: "Siz Allaһnı bıraqıp, bir taqım putlarğa tabınmaqta, asılsız sözler uydurmaqtasıñız. Bilmelisiñiz ki, Allaһnı bıraqıp da, tabınğanlarıñız sizge rızıq beralmazlar. O alda, rızıqnı Allaһ qatında arañ. Oña qullıq etiñ ve Oña şukür etiñ, ancaq Oña dündürileceksiñiz."
        cid: 0
  - verse: 18
    segments:
      - text: "Eger (sizge tebliğ etilgenni) yalan sayar iseñiz, biliñ ki, sizden evelki bir çoq milletler de (ozlerine tebliğ etilgenni) yalan sayğan ediler. Peyğamberge tüşkeni, yalıñız açıq bir tebliğdir."
        cid: 0
  - verse: 19
    segments:
      - text: "Olüden tirini, tiriden de olüni O çıqarmaqta; yer yuzüni olüminiñ artından O canlandırmaqta. İşte, siz de (qabirleriñizden) boyle çıqarılacaqsıñız. (Ayette olgenden soñ tirilüvniñ iç de oyle aqılğa sığmaz bir şey olmağanı, yer yuzündeki devamlı yañılanuv adiselerine işaret ile muim bir şekilde añlatılmaqta. Aqiqaten, qup-quru topraqtan yem-yeşil ekinler ve tereklerden meyvalar ve yapraqlar, çeşit renkte çeçekler çıqarğan ilâhiy qudret içün, yoqtan bar etken insannı tekrar tiriltüviniñ qıyın olacağı aqılğa sığmaz. Esapsız «baa’s ba’de’l-mevt» (olgenden soñ tirilüv) adisesine sahna olğan yer yuzüne bir kere ibret kozünen baqmaq bile, Allaһnıñ qudretini añlamaq içün yetecek)."
        cid: 0
  - verse: 20
    segments:
      - text: "Sizni topraqtan yaratuvı, Onıñ (barlığınıñ) delillerindendir. Soñra siz, (er tarafqa) darqağan insanlar ola qoydıñız."
        cid: 0
  - verse: 21
    segments:
      - text: "Qavuşuvlarıñız içün sizge oz (cınsı)ñızdan zevceler yaratıp, arañızda sevgi ve merhamet peyda etüvi de, Onıñ (barlığınıñ) delillerindendir. Doğrusı, bunda yahşı tüşüngen bir qavm içün ibretler bar."
        cid: 0
  - verse: 22
    segments:
      - text: "Onıñ delillerinden biri de, koklerni ve yerni yaratuvı, tilleriñizniñ ve renkleriñizniñ çeşit oluvıdır. Şubesiz, bunda bilgenler içün (alınacaq) dersler bar. (İnsanlarnıñ bir erkek ve bir qadından yaratılmaqnen beraber, farql hususiyetlerge saip toplulıqlarğa ayırılğanları mevzusında Hucuraat suresiniñ 13-nci ayeti izaatına baqıñ)."
        cid: 0
  - verse: 23
    segments:
      - text: "Gece olsun, kundüz olsun, yuqlamañız ve Allaһnıñ lütfinden (nasibiñizni) aramañız da, Onıñ (barlığınıñ) delillerindendir. Aqiqaten, bunda eşitken bir qavm içün ibretler bar. (Ayet «geceleyin yuqlamañız ve kundüzi Allaһnıñ lütfinden (nasibiñzni) qıdıruvıñız…», şeklinde de manalandırılğan. Ancaq, er eki vaqıtnıñ er eki işke elverişli olğanı manası daa quvetlidir)."
        cid: 0
  - verse: 24
    segments:
      - text: "Kene Onıñ delillerinden ki, sizge qorqu ve umüt bermek uzre, şemşekni kostere, kokten suv endirip, olüminiñ artından yerni onıñnen tirilte. Doğrusı, bunda aqlını işletken bir qavm içün (alınacaq) dersler bar."
        cid: 0
  - verse: 25
    segments:
      - text: "Kokniñ ve yerniñ Onıñ emrinen toqtavı da, Onıñ (barlığınıñ) delillerindendir. Soñra sizni topraqtan bir çağırdımı, aman (qabirleriñizden) çıqa qoyarsıñız."
        cid: 0
  - verse: 26
    segments:
      - text: "Koklerde ve yerde olğanlar ep Onıñdır. Episi Oña boyun eggendir."
        cid: 0
  - verse: 27
    segments:
      - text: "İlk defa mahlüqını yaratıp, (olümden) soñ, bunı (yaratmaqnı) tekrarlağan Odır, ki bu, Onıñ içün pek qolay. Koklerde ve yerde (tecelli etken) eñ yuce sıfat Onıñdır. O, mutlaq kuç ve ikmet saibidir."
        cid: 0
  - verse: 28
    segments:
      - text: "Allaһ sizge ozüñizden bir misal ketirmekte: Mulkiyetiñiz altında bulunğan hızmetkârlar içün de, sizge berdigimiz rızıqlarda -bir-biriñizden çekingeniñiz kibi, olardan çekinecek dereceñizde siznen musaviy (aqıllarğa saip)ortaqlarıñız barmı? İşte, biz ayetlerimizni, aqlını işletecek bir qavm içün, boylece izaatlamaqtamız. (Ayette insanlarnıñ, oz cıinslarından ve aynı yaratılış vasfına saip olğan hızmetkârlarını bile, ozlerine musaviy tutmağa, keçici dünya mulklerine ortaq etmege razılıq kostermegenleri aqiqatına işaret etilerek; ortağı ve oña beñzegeni olmağan Yuce Allaһqa şirk qoşuvnıñ, onıñ mutlaq mulkiyetine ortaqlıq qoşuvnıñ ne qadar aqılğa sığmaz bir iş olğanı, temsil yolunen añlatılmaqta ve hızmetkârnıñ efendisine ortaq olalmaycağı kibi, qulnıñ da, Allaһqa ortaq olalmaycağı añlatılmaqta. Ayrıca, Qur’an ayetleriniñ tüşüngen qafalarğa hitap etkeni de, ayrıca bildirile)."
        cid: 0
  - verse: 29
    segments:
      - text: "Kel, kor ki, aqsızlıq etkenler, bilgisizliknen fena arzularına uydılar. Allaһnıñ saptırğanını kim doğru yolğa iriştire bilir? Olar içün iç bir yardımcı yoqtır."
        cid: 0
  - verse: 30
    segments:
      - text: "(Resulım!) Sen yuzüñni hanif olaraq, dinge, Allaһ insanlarnı angi tabiyatta yaratqan ise, oña çevir. Allaһnıñ yaratuvında deñişme yoqtır. İşte, dos-doğru din budır; faqat insanlarnıñ çoqu bilmezler. («Hanif» - egrilikke sapmadan, doğru yoldan yurgen demektir. Termin olaraq, İbrahim Peyğamberniñ tevhid, yani «Allaһnı bir tanımaq dini» manasında qullanılır. Bir Allaһqa inanğan kimsege de «hanif» denilir. Buhariy, Ebu Hureyradan rivayet etken bir hadiske kore, er bir bala, tabiyatınen (tevhidge meyilli) doğa; soñ, ana-babası onı yeudiy, hristian ya da mecusiy yapar. İşte, ayette zikr etilgen «fitrat» (tabiyat) Allaһ, insanlarnı doğuvdan «tek Allaһ inançı»na meylli yaratqanını ifade ete)."
        cid: 0
  - verse: 31
    segments:
      - text: "Epiñiz Oña yonelerek, Oña qarşı kelüvden saqınıñ, namaznı qılıñ; muşriklerden olmañ."
        cid: 0
  - verse: 32
    segments:
      - text: "Dinlerni parçalağan ve bolük-bolük olğanlardan (olmañ. Bulardan) er fırqa ozlerinde olğanınen ğururlanmaqta."
        cid: 0
  - verse: 33
    segments:
      - text: "İnsanlarnıñ başına bir sıqıntı kelgeninen, Rabblerine yonelerek, Oña yalvarırlar. Soñra, Allaһ qatından olarğa bir rahmet (nimet ve bollıq) tattırğanınen, baqarsıñız ki, olardan bir topu kene Rabblerine ortaq qoşmaqtalar."
        cid: 0
  - verse: 34
    segments:
