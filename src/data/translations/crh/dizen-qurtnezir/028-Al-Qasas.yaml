        cid: 0
  - verse: 82
    segments:
      - text: "Kim bir eyilik ketirse, oña bundan daa hayırlı qarşılıq bardır. Kim bir yamanlıq ketirse, o yamanlıqlarnı işlegenler, ancaq yapqanları qadar ceza korerler. (Allaһ Taalânıñ lütfi sıñırsızdır; buña muqabil O, iç bir şekilde qullarına zulum etmez. Bunıñ kibi, bu ayette de, yapılğan yahşılıqlarnıñ qat-qat savapnen qarşılanacağı, faqat yamanlıqlarnıñ o derecede cezalandırılacağı añlatıla. Ancaq, bu şahsiy plandaki yahşılıq ve fenalıqlar aqqındadır. Bir yahşılıq ya da fenalıqnı ilki başlatqan, toplumğa bu doğruda ornek ve teşviqatçı kimseniñ alı ise başqadır. İmam Muslimniñ «Sahih»inde yer alğan bir hadis-i şerifnen bu noqtağa boyle izaat berilgen: «Kim ki, İslâmda maqbul olğan guzel bir işni ilk olaraq işler de, bunıñ yol alına kelüvine sebep olur ise, ozüne em işlegen bu hayırınıñ savabı berilir, em de -eñ kuçük bir eksiklik olmadanozünden soñ aynı yahşılıqnı yapacaq olğanlarnıñ savabı qadar savab berilir. Kene, kim İslâmda yamanlığı bildirilgen bir işni ilk evelâ işler de, bunıñ yol alına kelüvine sebepçi olur ise, ozüne em işlegen yamanlığınıñ gunahı yuklenir, em de -eñ kuçük bir eksiklik olmadan- ozünden soñ aynı yamanlıqnı işleycek olğanlarnıñ gunah qadar daa gunah yuklenir)."
        cid: 0
