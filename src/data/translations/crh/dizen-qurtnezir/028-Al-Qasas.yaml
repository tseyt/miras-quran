        cid: 0
  - verse: 46
    segments:
      - text: "Sizge rahmetinden tattırsın, emrinen gemiler yursin, nimetinden (nasibiñizni) qıdırasıñız ve şukür etesiñiz, diye (ayat ve bereket) mujdecileri olaraq, ruzgârlarnı yollavı da, Allaһnıñ (barlığınıñ ve qudretiniñ) delillerindendir. (Kâinatnı yaratqan da, idare etken de Allaһtır. Yaratuvnı nasıl bir sıra ve tertip (qanun) içinde yapqan ise, idaresini de, aynı şekilde qanunlarınen icra etmekte. Sebep-netice bağlılığı ilâhiy bir qanundır. Yağmurnıñ yağuvı da bir tertip sebep-netice munasebetlerine bağlıdır. Ğafiller yalıñız sebep ve neticeni korerler, mu’minler ise, sebeplerniñ yaratıcısınıı (musebbibu’lesbaabnı) da, korer ve Oña şukür eterler)."
