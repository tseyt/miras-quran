        cid: 0
  - verse: 38
    segments:
      - text: "O alda, sen aqarabağa, yoqsulğa, yolda qalganğa aqqını ber. Allaһ rizasını istegenler içün bu, eñ yahşısıdır. İşte, olar qurtulışqa irişkenlerdir. (Ayetteki «aqqını ber» diye ifade etilgen emir sila-i rahimde bulunuv, zekât berüv, yahşılıq etüv kibi manalarnen tefsir etile)."
        cid: 0
  - verse: 39
    segments:
      - text: "İnsanlarnıñ mallarında artış olsun diye, bergen er angi bir fayızıñız, Allaһ qatında artmaz. Allaһ rizasını isteyerek bergen zekâtıñızğa kelgende, işte zekâtnı bergen o kimseler, ebet olar (savaplarını ve mallarını) qat-qat arttırğanlardır. (Ayetniñ ilk cumlesindeki «ribaa» esasen şu şekillerde tefsir etilgen: Berilgen fayıznıñ ozü, qarşılığında maddiy menfaat umüt etilgen er angi bir bahşış, fayızğa berilgen mal ya da para. Soñki mana esasqa alınğanda, ayetniñ «insanlarnıñ malları arasında degerlensin, artsın diye bergeniñiz…», şeklindeki tercimesi uyğun olur. Ayette musulmanlarnı ileride kesen-kes olaraq ukümge bağlanacaq olğan ribaa yasağına azırlayıcı bir ifade qullanılğan)."
        cid: 0
  - verse: 40
    segments:
      - text: "Allaһ, (o yuce barlıqtır) ki, sizni yaratqan, soñra rızıqlandırğan; soñra O, ayatıñıznı soñuna iriştirecek, daa soñunda da, sizni (tekrar) tiriltecek. Yahşı, siziñ (Allaһqa ortaq qoşqan) ortaqlarıñız arasında bulardan birini yapa bilecek barmı? Allaһ olarnıñ ortaq qoşqanlarından uzaqtır ve yucedir."
        cid: 0
