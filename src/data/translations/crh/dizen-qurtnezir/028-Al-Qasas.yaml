      - text: >-
          (Fıravunnen qadını Az.Musanı evlât etmek ister eken, er alda, onıñ ellerinde terbiye
          olınuvınen, özlerine uyacaq bellegen ediler. Albuki, insan ayatınıñ içinde eki müim
          amil bar: nesep ve terbiye. İnsan bazıda nesepniñ, bazıda da terbiyeniñ, bazıda da,
          er ekisiniñ tesiri altında qalır. 9-nci ayette bu incelikke işaret etilgen. Bilgi
          insan davranışını qısmen deñiştirir. Bunıñnen beraber, insannıñ bilginen etraf
          tesirleri ve terbiyenen tamamen deñiştire bilecegini, istenilgen qalıpqa soqula
          bilecegi mümkün, diye sanmaq yañlıştır. Yahşı terbiye körgen, yahşı toplumda
          yetişken, bilgili ve medeniyetli olmaqnen beraber, yaman insanlar olğanı kibi, yaman
          toplum içinde yetişken, yaman terbiye körgen... faqat yahşı olaraq qala bilgen
          insanlar da bar).
        cid: 0
