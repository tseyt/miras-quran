surah_id: 28
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "Taa. Siin. Miim."
        cid: 0
  - verse: 2
    segments:
      - text: "Bular, ap-açıq kitapnıñ ayetleridir."
        cid: 0
  - verse: 3
    segments:
      - text: "İman etken bir qavm içün (faydalı olmaq uzre), Musanen Fıravunnıñ haberlerinden bir qısmını saña aqiqat şeklinen naql etecekmiz."
        cid: 0
  - verse: 4
    segments:
      - text: "Fıravun, (Mısır) toprağında, aqiqaten adden aşqan, halqını çeşit toplulıqlarğa bolgen edi. Olardan bir topunı kuçsiz kore, bularnıñ oğullarını soya, qızlarını ise, sağ qaldıra edi. Çünki, o bozğuncılardan edi. (Ayette söz etilgen toplulıq İsrail oğullarıdır. Bir kâhin Fıravunğa İsrail oğulları arasından bir oğlan bala dünyağa kelecegini ve onıñ saltanatını elinden alacağını söylegen edi. Bunıñ uzerine, Fıravun İsrail oğullarınıñ oğlan balaları oldürilmesini emir etti)."
        cid: 0
  - verse: 5
    segments:
      - text: "Biz ise, o yerde ezileyatqanlarğa lütfte bulunmaq, olarnı reberler yapmaq ve olarnı (muqaddes topraqlarğa) varis etmek istey edik."
        cid: 0
  - verse: 6
    segments:
      - text: "Ve o yerde olarnı hakim yapmaq; Fıravunnen Haamaanğa ve ordularına, olardan (İsrail oğullarından kelecek diye) qorqqan şeylerini kostermek (istey edik)."
        cid: 0
  - verse: 7
    segments:
      - text: "Musanıñ anasına: Onı emiz, oña zarar keleceginden qorqqanıñda, onı deñizge (Nil nehrine) taşla, iç qorqup, qayğılanma, çünki, biz onı saña qaytarıp berecekmiz ve onı peyğamberlerden biri yapacaqmız, diye bildirdik."
        cid: 0
  - verse: 8
    segments:
      - text: "Niayet, Fıravun ailesi onı coyuq bala olaraq (nehrden) aldı. O, soñunda olar içün bir duşman ve bir qasevet olacaq edi. Şubesiz, Fıravunnen Haamaan ve askerleri yañlış yolda ediler."
        cid: 0
  - verse: 9
    segments:
      - text: "Fıravunnıñ qadını (sepetniñ içinden oğlan bala çiqqanınen qocasını:) men ve sen içün koz aydınlığı! Onı oldürmeñ, belki, bizge faydası tiyer, ya da onı evlât etermiz, dedi. Albuki, olar (işniñ soñunı) sezalmay ediler."
        cid: 0
  - verse: 10
    segments:
      - text: "Musanıñ anasınıñ yureginde yalıñız balasınıñ qasevetı qaldı. Eger biz, (vademizge) inanğanlarından oluvı içün, onıñ qalbini pekiştirmegen olsa edik, ne yerde ise, işni meydanğa çıqaracaq edi."
        cid: 0
  - verse: 11
    segments:
      - text: "Anası Musanıñ tatasına: Onıñ izini taqip et, dedi. O da, olarğa duydırmadan, uzaqtan qardaşını kozetti."
        cid: 0
  - verse: 12
    segments:
      - text: "Biz daa evelden (anasına qaytarıp berilgenge qadar) onıñ emçek analarını qabulına (emmesine) musaade etmedik. Bunıñ ustüne tatası: Sizge, onı baquvnı siz içün becerecek, em de oña yahşı davranacaq bir aile kostereyimmi? dedi."
        cid: 0
  - verse: 13
    segments:
      - text: "Boyleliknen, biz onı anasına, kozü aydın olsun, ğam çekmesin ve Allaһnıñ vadesi kerçek olğanını bilsin diye, qaytarıp berdik. Faqat kene de pek çoqu (bunı) bilmezler. (Fıravunnen qadını Az.Musanı evlât etmek ister eken, er alda, onıñ ellerinde terbiye olınuvınen, ozlerine uyacaq bellegen ediler. Albuki, insan ayatınıñ içinde eki muim amil bar: nesep ve terbiye. İnsan bazıda nesepniñ, bazıda da terbiyeniñ, bazıda da, er ekisiniñ tesiri altında qalır. 9-nci ayette bu incelikke işaret etilgen. Bilgi insan davranışınıı qısmen deñiştirir. Bunıñnen beraber, insannıñ bilginen etraf tesirleri ve terbiyenen tamamen deñiştire bilecegini, istenilgen qalpqa soqula bilecegi mumkün, diye sanmaq yañlştırr. Yahşı terbiye korgen, yahşı toplumda yetişken, bilgili ve medeniyetli olmaqnen beraber, yaman insanlar olğanı kibi, yaman toplum içinde yetişken, yaman terbiye korgen… faqat yahşı olaraq qala bilgen insanlar da bar)."
        cid: 0
  - verse: 14
    segments:
      - text: "Musa yigitlik çağına irişkeninen, biz oña ikmet ve ilim berdik. İşte, guzel davranğanlarnı biz boyle mukâfatlandırırmız. («İkmet» manası berilgen «hukm» kelimesi tefserlerde çoq yerde «peyğamberlik» şeklinde izaatlana)."
        cid: 0
  - verse: 15
    segments:
      - text: "Musa, ealisi habersiz olğan bir vaqıtta, şeerge kirdi. O yerde, biri oz tarafından, digeri duşman tarafından olğan eki adamnı bir-birinen dögüşken alda kordı. Onıñ tarafından olğanı duşmanğa qarşı ondan yardım istedi. Musa da, o birine bir yumruq urup, olümine sebep oldı. (Bunıñ ustüne:) Bu, şeytan işidir. O, aqiqaten saptırıcı, ap-açıq bir duşman, dedi. (Az.Musa, haqnı tebliğ etmege başlağanı içün, qıptiyler oña qarşı kureş başladılar. Bu sebepnen, ealisiniñ evlerine çekilgen bir vaqıtta şeerge kirgen edi. «Bu şeytan işi» demek - Az.Musanıñ oz işine degil, zaten olüm cezasını qazanğan maqtülniñ (oldürilgen insannıñ) qabaatına işaret etkeni ifadesidir. Bu qabaatnıñ bazı yerlerde bir yeudiy qadınnı zinağa zorlav, bazı yerlerde mutlaq tarzda, Allaһqa isyan olğanı qayd etile. Bunıñnen beraber, daa oldürmek emrini almağanından, Az.Musanıñ bu sözünen ozüniñ areketini nazarda tutqanı da ifade olunmaqta)."
        cid: 0
  - verse: 16
    segments:
      - text: "Musa: Rabbim! Doğrusı, ozüme zulum ettim.(Başıma iş açtım). Meni bağışla, dedi. Allaһ da onı bağışladı. Çünki, çoq bağışlayıcı, çoq merhametli ancaq Odır."
        cid: 0
  - verse: 17
    segments:
      - text: "Musa: Rabbim! Maña lütf etken nimetleriñye ant olsun ki, artıq qabaatlılarğa (ve qabaatqa iteklengenlerge) asla arqa olmaycam, dedi."
        cid: 0
  - verse: 18
    segments:
      - text: "Şeerde qorqu içinde, (etrafını) kozeterek, sabanı açtı. Bir de ne korsin, dün ozünden yardım istegen kimse, feryad eterek, kene ondan imdat soray. Musa oña (yardım istegenge) dedi ki: Doğrusı, sen bes-belli bir adden aşqansıñ!"
        cid: 0
  - verse: 19
    segments:
      - text: "Musa ekisiniñ de duşmanı olğan adamnı yaqalamaq istegeninen, o adam dedi ki: Ey, Musa! Dün bir cannı qıyğanıñ kibi, meni de qıymaq isteysiñmi? Demek, tüzelticilerden olmaq istemey de, bu yerde ille yaman bir zorbacı olmaqnı arzulaysıñ sen!"
        cid: 0
  - verse: 20
    segments:
      - text: "Şeerniñ o bir ucundan bir adam çapıp keldi: Ey, Musa! İleri kelgenler seni oldürmek içün aqqıñda muzakere etmekteler. Der’al (bu yerden) çıq! İnan ki, men saña eyilik istegenlerdenim, dedi."
        cid: 0
  - verse: 21
    segments:
      - text: "Musa qorqa-qorqa, (etrafnı) kozeterek, o yerden çıqtı. «Rabbim! Meni zalımlar topundan qurtar», dedi."
        cid: 0
  - verse: 22
    segments:
      - text: "Medyenge doğru yonelgeninde: Umüt eterim, Rabbim, meni doğru yolğa qavuştırır, dedi. (Medyenlilernen Az.Musa arasında aqrabalıq olğanı rivayet etile. Medyenliler de, Musa (a.s.)da, Az.İbrahimniñ evlâtlarından edi. Atta «Medyen», İbrahim peyğamberniñ oğularından biriniñ adı edi ve bu şeer Fıravunnıñ idareciligi altında degil edi)."
        cid: 0
  - verse: 23
    segments:
      - text: "Musa Medyen suvına barğanınen, o yerde (ayvanlarını) suvarğan bir çoq insannı buldı. Olarnıñ artında da, (ayvanlarını) bıraqmağan eki qadın kordi. Olarğa: Derdiñiz nedir? dedi. Boyle cevap berdiler: Çobanlar suvarıp çekilmeden, biz (olarnıñ arasına soqulıp, ayvanlarımıznı) suvarmaymız; babamız da pek qart."
        cid: 0
  - verse: 24
    segments:
      - text: "Bunıñ uzerine, Musa olarnıñ yerine (mallarnı) suvardı. Soñra kolgege çekildi ve: Rabbim! Doğrusı, maña endirecek er hayırıña (lütfiñye) muhtacım, dedi. (Az.Musa yedi kundir aç edi, ne berilse aşaycaq alda edi. Bu sözlerinen Rabbine er angi bir aşaycaq ihsan etüvi içün yalvarmaqta edi. Ayetniñ soñuna: «Doğrusı, maña endirgen hayırıñdan tolayı muhtacım», manası da berile bilir. Bu manağa kore, Az.Musa ozüne berilgen yuksek vazifege, ve bu sebepnen, dünyada faqır olğanına işaret ete edi. Zira, o, Fıravunnıñ yanında olğanda bolluq içinde edi. Elbette, bu sözler şikâyet içün degil, şukür maqsadınen aytılğandır)."
        cid: 0
  - verse: 25
    segments:
      - text: "Derken, o eki qadından biri utana-utana yurerek, oña keldi: Babam, dedi, bizim yerimizge (ayvanlarnı) suvarğanıñnıñ aqqını odemek içün seni çağıra. Musa oña (Az.Şuaybğa) kelip, başından keçkenni añlatqanınen, o: Qorqma, o zalım qavmdan qurtuldıñ, dedi."
        cid: 0
  - verse: 26
    segments:
      - text: "(Şuaybnıñ) eki qızından biri: Babacığım! Onı ucretnen (çoban) tut. Çünki, ucretnen çalıştıracaq eñ yahşı kimseñ, kuçlü ve işançlı olğanıdır, dedi."
        cid: 0
  - verse: 27
    segments:
      - text: "(Şuayb) dedi ki: Maña sekiz yıl çalışuvıña qarşılıq, şu eki qızımdan birini saña nikâhlamaq isteyim. Eger on yılğa tamamlasañ, artıq o ozüñden; yoqsa, saña ağırlıq bermek istemem. İnşaallaһ, meni yahşı kimselerden (iş bergenlerden) bulacaqsıñ."
        cid: 0
  - verse: 28
    segments:
      - text: "Musa boyle cevap berdi: Bu sennen menim aramdadır. Bu eki muddetten angisini toldursam-toldurayım, demek ki, maña nisbeten husumet yoq. Aytqanlarımızğa Allaһ vekildir."
        cid: 0
  - verse: 29
    segments:
      - text: "Soñunda Musa muddetni toldurıp, ailesinen yolğa çıqqanınen, Tuur tarafında bir ateş kordi. Ailesine: Siz (bu yerde) bekleñ; men bir ateş kordim, belki o yerden sizge bir haber ya da qızınmañız içün bir ateş parçası ketiririm, dedi."
        cid: 0
  - verse: 30
    segments:
      - text: "O yerge kelgeninen, o mubarek yerdeki vadiniñ sağ çetinden, (o yerdeki) terek tarafından oña boyle seslenildi: Ey, Musa! Bil ki, men - butün alemlerniñ Rabbi olğan Allaһım."
        cid: 0
  - verse: 31
    segments:
      - text: "Ve «Tayağıñnı at!» (denildi). Musa (atqan tayağı yılan kibi teprengenini korgeninen, çevirilip, artına baqmadan, qaçtı. «Ey, Musa! Bu yaqqa kel, qorqma. Çünki, sen eminlikte olğanlardansıñ») buyurıldı). 32. «Eliñni qoynuña soq; Qusursız, bem-beyaz çıqacaq. Qorqudan (açılğan) qollarıñnı ozüñye çek. İşte, bu ekisi Fıravun ve onıñ adamlarına qarşı Rabbiñ tarafından eki kesen-kes delildir. Çünki, olar yoldan çıqqan bir qavm olğan ediler» (diye seslenildi)."
        cid: 0
  - verse: 32
    segments:
      - text: "Musa dedi ki: Rabbim! Men olardan birini oldürgen edim, meni oldirüvlerinden qorqam."
        cid: 0
  - verse: 33
    segments:
      - text: "Qardaşım Harunnıñ tili menimkinden daa tüzgün. Onı da meni doğrulağan bir yardımcı olaraq, mennen birlikte yolla. Zira, maña yalancılıq iftirasında olğanlarından qorqam."
        cid: 0
  - verse: 34
    segments:
      - text: "Allaһ buyurdı: Seni qardaşıñnen destekleycekmiz ve sizge oyle bir qudret berecekmiz ki, ayetlerimiz (mucize yardımlarımız) sayesinde, olar sizge yetişalmaycaqlar. Siz ve sizge tabiy olğanlar ustün keleceksiñiz."
        cid: 0
  - verse: 35
    segments:
      - text: "Musa olarğa ap-açıq ayetlerimizni ketirgeninen: Bu, olsa-olsa, uydırılğan bir tılsımdır. Biz evelki atalarımızdan boylesini eşitmegen edik, dediler."
        cid: 0
  - verse: 36
    segments:
      - text: "Musa boyle dedi: Rabbim oz qatından kimniñ hidayet (haqqa reberlik) ketirgenini ve hayırlı aqibetniñ kimge nasip olacagını eñ yahşı bilicidir. Muaqqaq ki, zalımlar qurtulışqa irişalmazlar."
        cid: 0
  - verse: 37
    segments:
      - text: "Fıravun: Ey, ileri kelgenler! Siz içün menden başqa bir ilâh tanımayım. Ey, Haamaan! Aydı, men içün çamur uzerine ateş yaq (ve tola yap), maña bir qulle yap ki, Musanıñ tañrısına çıqayım; amma belleyim ki, o mıtlaqa yalan söylegenlerdendir, dedi."
        cid: 0
  - verse: 38
    segments:
      - text: "O ve askerleri, yer yuzünde aqsız yerde buyuklik tasladılar ve aqiqaten bizge döndürilmeycekler bellediler."
        cid: 0
  - verse: 39
    segments:
      - text: "Biz de, onı ve askerlerini yaqalap, deñizge attıq qoydıq. Baq, işte, zalımlarnıñ soñu nasıl oldı!"
        cid: 0
  - verse: 40
    segments:
      - text: "Olarnı, (insanlarnı) ateşke çağırğan reberler yaptıq. Qıyamet kunü olar yardım kormeycekler."
        cid: 0
  - verse: 41
    segments:
      - text: "Bu dünyada arqalarına lânet taqtıq. Olar qıyamet kunünde de yamanlanğanlar arasındadır."
        cid: 0
  - verse: 42
    segments:
      - text: "Ant olsun, biz ilk nesillerni yoq etkenden soñ, Musağa -tüşünip ogüt alsınlar diye- insanlar içün ap-açıq deliller, hidayet reberi ve rahmet olaraq o Kitapnı (Tevratnı) bergenmiz."
        cid: 0
  - verse: 43
    segments:
      - text: "(Resulım!) Musağa emrimizni vahiy etken vaqtımızda, sen batı tarafta bulunmay ediñ ve (o adiseni) korgenlerden de degil ediñ. (Az. Musanıñ Tuur dağında ilâhiy kelâmğa nail olğan vaqıtqa işaret etile ve Az. Peyğamberniñ o esnada Tuurda şahsen azır olmağanı ve batı tarafında Az. Musanı beklegenler arasında olmağanı hatıratıla; butün bularnıñ, oña vahiy yolunen ogretilgeni ifade etile)."
        cid: 0
  - verse: 44
    segments:
      - text: "Faqat biz nice nesiller bar ettik de, olarnıñ uzerinden uzun zamanlar keçti. Sen, ayetlerimizni olardan oquyaraq ogrenmek uzre, Medyen halqı arasında oturğan da degilsiñ; aksine (olarnı saña) yollağan bizmiz."
        cid: 0
  - verse: 45
    segments:
      - text: "(Musağa) seslengen vaqtımızda da, sen Tuurnıñ yanında degil ediñ. Aksine, senden evel olarğa tenbiyeci (peyğamber) kelmegen bir qavmnı tenbiyeleviñ içün, Rabbiñden bir rahmet olaraq (o yerde keçkenlerni saña bildirdik); umüt etilir ki, tüşünip, ogüt alırlar. (Tefsirlerde 44, 45 ve 46-nci ayetlerde «sen … degil ediñ» şeklinde işaret etilgen vaqialarnıñ ayrı zamanlarğa ait ve Az. Musanıñ ayatında ayrı-ayrı muim birer adise olğanı beyan etilmekte. Az. Muһammedden evel peyğamber yollanılmağan devirge «fetret» devri denile. Az. İsanen Az. Muһammed arasındaki 570 yıllıq zaman kesegi olğanı söylene. Az. İsa ve Az. Musanıñ davetleri İsrail oğulları ve olarnıñ avalesindekilerge ait olğanından, bu yerde nazarda tutulğan devir - Az. İsmailnen Az. Muһammed arasındaki vaqıt şeklinde de, izaat etilmekte)."
        cid: 0
  - verse: 46
    segments:
      - text: "Şahsen ozleri yapqanlarından tolayı, başlarına bir musibet kelgende: Rabbimiz! Ne olur edi, bizge bir peyğamber yollasa ediñ de, ayetleriñye uysaq ve mu’minlerden olsa edik! diyecek olmasalar edi (seni yollamaz edik)."
        cid: 0
  - verse: 47
    segments:
      - text: "Faqat olarğa tarafımızdan o haq (Peyğamber) kelgeninen: «Musağa berilgen (mucizeler) kibi, oña da berilmeli degil edimi?», dediler. Yahşı, daa evel Musağa berilgenini de inkâr etmegen edilermi? «Bir-birini desteklegen eki sihir!», degenler ve şunı söylegen ediler: Doğrusı, biz iç birine inanmaymız. (Bu yerdeki manağa kore, Qur’an ve Tevrat koz ogüne alına bilir. Diger qıraatlarğa kore, «yardımlaşqan eki sihirbaz!» şeklinde mana bermek kerekir. Bu taqdirde, Az. Musanen Az. Harun ya da Az. Musanen Az. Muһammed koz ogüne alınğan ola bilir)."
        cid: 0
  - verse: 48
    segments:
      - text: "(Resulım!) De ki: Eger doğru sözlüler iseñiz, Allaһ qatından bu ekisinden (maña ve Musağa engen kitaplardan) daa doğru bir kitap ketiriñ de, men oña uyayım!"
        cid: 0
  - verse: 49
    segments:
      - text: "Eger saña cevap bermeseler, bil ki, olar yalıñız aveslerine uymaqtalar. Allaһtan bir yol kosterici olmadan, oz avesine uyğandan daa sapıq kim ola bilir! Elbette, Allaһ zalım qavmnı doğru yolğa qavuştırmaz."
        cid: 0
  - verse: 50
    segments:
      - text: "Ant olsun ki, biz tüşünip, ogüt alsınlar diye, sözni (vahiyni) bir-biri artından yetiştirgendirmiz. (Vahiylerimizni aralıqsız yollağandırmız)."
        cid: 0
  - verse: 51
    segments:
      - text: "Ondan (Qur’andan) evel ozlerine kitap bergenlerimiz, oña da iman eterler. (Ehl-i kitaptan olp da, musulmanlıqnı qabul etkenlerge işaret olunmaqta)."
        cid: 0
  - verse: 52
    segments:
      - text: "Olarğa (Qur’an) oqulğan vaqıtta: Oña iman ettik. Çünki, o Rabbimizden kelgen aqiqattır. Esasen, biz daa evel de musulman edik, derler."
        cid: 0
  - verse: 53
    segments:
      - text: "İşte, olarğa, sabır etüvlerinden otrü, mukâfatları eki qat berilecek. Bular yamanlıqnı yahşlıqnen def eterler, ozlerine bergen rızıqlarımızdan da, Allaһ rizası içün arclarlar."
        cid: 0
  - verse: 54
    segments:
      - text: "Olar, boş söz eşitken vaqıtlarında, ondan yuz çevirir ve: Bizim işlerimiz bizge, siziñ işleriñiz sizge. Sizge selâm olsun. Biz ozüni bilmegenlerni (arqadaş etmek) istemeymiz, derler."
        cid: 0
  - verse: 55
    segments:
      - text: "(Resulım!) Sen sevdigiñni hidayetke iriştiralmazsıñ; faqat Allaһ istegenine hidayet berir ve hidayetke kirecek olğanlarnı eñ yahşı O bilir. (Rivayetke kore, Resul-ı Ekrem (s.a.), emcesi Ebu Talipke hitaben boyle buyurğan edi: «Lâa ilâahe illallaah» de ki, qıyamet kunü seniñ lehiñye şeadette bulunayım. Ebu Talip ise: «Qureyş qadınları meni qıynarlar, qorqudan bunı söyledi, derler. Eger boyle demeycek olsalar edi, musulman olup, seni sevindirir edim», degen edi. Az. Peyğamberniñ pek sevgen, çoq yardımlarını korgen emcesiniñ hidayeti içün boyle ğayreti uzerine bu ayet nazil oldıl). 57. «Biz sennen beraber doğru yolğa uyar isek, yurtumızdan çıqarılırmız», dediler. Biz olarnı oz qatımızdan bir rızıq olaraq, er şeyniñ bereketi toplanıp ketirilgen, işançlı, toqunılmaz bir yerge (Mekke-i Mukerremege) yerleştirmedikmi? Faqat olarnıñ çoqu bilmezler."
        cid: 0
  - verse: 56
    segments:
      - text: "Biz ferahlığından adden aşqan nice memleketni elâk etkendirmiz. İşte, yerleri! Ozlerinden soñ, o yerlerde pek az oturıla bilgendir. Olarğa biz varis olğandırmız."
        cid: 0
  - verse: 57
    segments:
      - text: "Rabbiñ, olarğa ayetlerimizni oquğan bir peyğamberni memleketlerniñ baş merkezine yollamağance, o memleketlerni elâk etici degildir. Zaten, biz ancaq halqı zalım memleketlerni elâk etkendirmiz. (Ayetteki «baş merkezine» olaraq mana berilgen «fii ummiһaa» Mekke şeeri olaraq beyan etilgen. Zira, Mekkeniñ bir adı da «Ummu’l-Quraa» edi. Aynı söz memleketniñ ileri kelgenleri şeklinde de tefsir etilgen)."
        cid: 0
  - verse: 58
    segments:
