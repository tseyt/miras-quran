  - verse: 74
    segments:
      - text: "Qarun, Musanıñ qavmından edi de, olarğa qarşı addinden aşqan edi. Biz oña oyle hazineler bergen edik ki, anahtarlarını kuçlü-qretli bir toplulıq zor taşır edi. Qavmı oña boyle degen edi: Qopayma! Bil ki, Allaһ qopayğanlarnı sevmez. (Qarun Az. Musanıñ emce-zadesi olğanı rivayet etile. Evel Az. Musağa iman etken edi. Faqat hırsı ve kuncüligi sebebinden, munafıqlıqqa meyl berdi. İsrail oğullarınıñ başında Fıravunnıñ vazifedarı olaraq bulundı, olarğa nisbeten zalımlıq yaptı. Bir taraftan, servetinen, bir taraftan da, ilminen maqtana, qopaya edi. Rivayetke kore, İsrail oğulları arasında Tevratnı eñ yahşı oquğan kimse o edi. Kimya ve ticaret saalarında da çoq bilgili olğanına dair qaydlar bar. Lâkin, soñunda ister ilmi, ister serveti oña yar olmağan, inançsızlığı ve adden aşuvı sebebinden, elâk olup ketken)."
        cid: 0
  - verse: 75
    segments:
      - text: "Allaһnıñ saña bergeninden (Onıñ yolunda arcalayaraq) ahiret yurtunı iste; amma dünyadan da, nasibiñni unutma. Allaһ saña ihsan etkeni kibi, sen de (insanlarğa) yahşılıq yap. Yer yuzünde bozğuncılıqnı arzulama. Şubesiz ki, Allaһ bozğuncılarnı sevmez. (Qarun kibi hazineler saibi olğan birisiniñ şahsında yapılğan bir ogütte bile, Qur’annıñ: «Dünyadan da nasibiñni unutma», tevsiyesinde bulunuvı, İslâmnıñ dünya içün çalşuvğa ne qadar emiyet bergenini kostermekte. Bunıñnen beraber, Qur’an daa soñki ayetlerde bus-butün dünyağa daluvnıñ ketirecek felâketlerini de canl bir şekilde kozler ogüne sererek, dünya ve ahiretni musaviyleştirgen mutedil bir yol tutuluvını tevsiye ete)."
        cid: 0
