          işi» demek - Az.Musanıñ öz işine degil, zaten ölüm cezasını qazanğan maqtülniñ
          (öldürilgen insannıñ) qabaatına işaret etkeni ifadesidir. Bu qabaatnıñ bazı yerlerde
          bir yeudiy qadınnı zinağa zorlav, bazı yerlerde mutlaq tarzda, Allahqa isyan olğanı
          qayd etile. Bunıñnen beraber, daa öldürmek emrini almağanından, Az.Musanıñ bu
          sözünen özüniñ areketini nazarda tutqanı da ifade olunmaqta).
