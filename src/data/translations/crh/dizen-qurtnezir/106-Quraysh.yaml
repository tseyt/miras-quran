surah_id: 106
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >
          Qureyşke qolaylaştırılğanı, ebet, qış ve yaz seyaatları olarğa qolaylaştırılğanı
          içün, olar özlerini açlıqtan toyurğan ve er çeşit qorqudan emin qılğan şu evniñ
          Rabbine qullıq etsinler. (Qureyş qabilesi bütün araplar arasında muqaddes
          sayılğan Kâbeni közetüv ve baquv vazifesinde olğanları içün, bütün qabileler
          olarğa sayğı köstere edi; bu sayede olar yazda Taaifniñ serin yaylâlarına, qışta
          da Yemenniñ sıcaq bölgülerine serbest bara ediler. İşte, bu, Allahnıñ olarğa bir
          ihsanı edi, çünki, bu şekilde serbest dolaşuv, soñunda büyük ölçüde, ticaret
          yapa ve qazanç elde ete ediler).
        cid: 0
  - verse: 2
    segments:
      - text: >
          [1 ayetine baq.]
