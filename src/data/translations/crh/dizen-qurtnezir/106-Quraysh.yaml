surah_id: 106
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "Qureyşke qolaylaştırılğanı, ebet, qış ve yaz seyaatları olarğa qolaylaştırılğanı içün, olar ozlerini açlıqtan toyurğan ve er çeşit qorqudan emin qılğan şu evniñ Rabbine qullıq etsinler. (Qureyş qabilesi butün araplar arasında muqaddes sayılğan Kâbeni kozetüv ve baquv vazifesinde olğanları içün, butün qabileler olarğa sayğı kostere edi; bu sayede olar yazda Taaifniñ serin yaylâlarına, qışta da Yemenniñ sıcaq bolgülerine serbest bara ediler. İşte, bu, Allaһnıñ olarğa bir ihsanı edi, çünki, bu şekilde serbest dolaşuv, soñunda buyuk olçüde, ticaret yapa ve qazanç elde ete ediler)."
        cid: 0
  - verse: 2
    segments:
      - text: "[1 ayetine baq.]"
