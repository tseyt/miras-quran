      - text: >-
          (Bu ve aşağıdaki doquz ayetniñ nazil oluvına sebep olğan ve «ifq» (iftira) adisesi»
          diye bilingen vaqia qısqadan böyledir: Az. Peyğamberniñ bir askeriy seferine Az.
          Ayşe de qatılğan edi. Qaytqanda, bir ara Az. Ayşe itiyacından qurtulmaq içün
          çekilgen bir köşede gerdanlığını tüşüre. Soñ, bunıñ farqına barıp, qıdırmağa kete.
          Bu arada, kervan Az. Ayşeni devesiniñ üstündeki hevdec adı berilgen qapalı, tomalaq
          ve üstü qubbeli qafesi içinde zan eterek, qonaqlav yerinden ayrılğanı içün, Az. Ayşe
          o yerde qala. Ordunı artından taqip etmeknen vazifeli bir zat Az. Ayşeni alıp,
          kervanğa yetiştire. Aralarında munafıqlarnıñ reberlerinden Abdullah b. Ubeyy de
          olğan bir qaç adam, bu adisege esaslanıp, Az. Ayşenen onı kervanğa yetiştirgen adam
          arasında alâqa yapılğanı iftirasını uyduralar. Bu iftira Az. Peyğamberni ziyade
          kederlendire. Bu sırada, zaten raatsız olğan Az. Ayşe aqqında böyle bir iftira
          uydurılğanını bir müddet soñ bile ve büyük bir istirapqa tüşe; artıq özü kibi
          kederli olğan ailesine, babası Az. Ebu Bekir (r.a.)niñ evine barmaqnı doğru tanıy.
          Bu arada Az. Peyğamber (s.a.) zaman-zaman Az. Ebu Bekirniñ evine barıp, olardan Az.
          Ayşeniñ sağlığını, al ve hatirini soray edi. İşte, kene böyle bir ziyaret sırasında
          ve iftira vaqiasınıñ çıqqanından tahminen bir ay soñ, Ayşe validemizniñ
          qabaatsızlığını ifade etken bu ayetler nazil oldı:)
        cid: 0
