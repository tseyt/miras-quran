surah_id: 24
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >
          (Bu) Bizim nazil ettigimiz ve (ükümlerini üzeriñizge) farz qıldığımız bir
          suredir. Belki, tüşünip, ögüt alırsıñız diye, onda açıq-aydın ayetler endirdik.
        cid: 0
  - verse: 2
    segments:
      - text: >
          Zina etken qadın ve zina etken erkekten er birine yüz sopa urıñ; Allahqa ve
          ahiret kününe inanır iseñiz, Allahnıñ dininde (ükümlerini tedbiq etkende) olar
          acıycaq kibi olmañ. Mü'minlerden bir topu da, olarğa berilgen cezağa şaat olsun.
          (İslâm uquq tilinde bu cezalandıruv şekline «had» denile. Ayette emir etilgen bu
          tedbiqat yalıñız bekâr olup da, zina etkenler içündir. Eger evli bir erkek ve
          qadın zina etken olsalar, buña «recm» cezası tedbiq etilir).
        cid: 0
  - verse: 3
    segments:
      - text: >
          Zina etken erkek, zina etken ya da müşrik bir qadından başqasınen evlenmez. Zina
          etken qadınnen de, ancaq zina etken ya da müşrik erkek evlenir. Bu, mü'minlerge
          aram qılınğandır. (İslâmda müşrik qadın ve erkeknen evlenmek caiz degil. Ve
          böyle bir nikâh keçmez. Ayette zina etken musulmannen evelnüvniñ çirkinligi de
          ifade etilmeknen birlikte, ayetniñ nazil oluv sebebi ve diger deliller diqatqa
          alınaraq, İslâm alimleriniñ çoqu böyle bir nikâhnıñ keçerli olğanına üküm
          etkenler).
        cid: 0
  - verse: 4
    segments:
      - text: >
          Namuslı qadınlarğa zina iftirasında bulunıp, soñ (buña isbat içün) dört şaat
          ketiralmağanlarğa seksener sopa urıñ ve artıq olarnıñ şaatlığını iç bir vaqıt
          qabul etmeñ. Olar tamamen günahkârlardır.
        cid: 0
  - verse: 5
    segments:
      - text: >
          Ancaq, bundan soñ tövbe etip, islâh olğanlar istisnadır. Allah çoq bağışlayıcı
          ve merhametlidir.
        cid: 0
  - verse: 6
    segments:
      - text: >
          Qadınlarına zina iftirasında bulunıp da, özlerinden başqa şaatları olmağanlarğa
          kelgende, olarnıñ er biriniñ şaatlığı, özleriniñ doğru söylegenlerden
          olğanlarına dair dört defa Allah adına yemin eterek, şaatlıq etüvi, beşinci defa
          da, eger yalan söylegenlerden ise, Allahnıñ lânetiniñ öz üzerine oluvını
          tilevidir.
        cid: 0
  - verse: 7
    segments:
      - text: >
          [6 ayetine baq.]
        cid: 0
  - verse: 8
    segments:
      - text: >
          Qadınnıñ, qocası yalan söylegenlerden olğanına dair dört defa Allah adına yemin
          ve şaatlıq etüvi, beşinci defa da, eger (qocası) doğru söylegenlerden ise,
          Allahnıñ ğadabınıñ öz üzerine alğanını tilevi ondan cezanı saqıt eter. (Soñki
          dört ayetteki tedbiqat, İslâm aile uquqında «liaan» termini ile ifade etilir.
          Qadınnıñ zina qabaatı işlegenini idda etken bir qoca, eger iddasını isbat etmek
          içün dört şaat ketirip olamasa, qadın ve qoca hakim uzurına celp etilerek,
          liaanğa davet etilir. Er eki taraf da doğrulıqlarını bu ifadelernen beyan
          etseler, erkek iftira (kazf) cezasından, qadın da, zina cezasından qurtulır, ve
          bu şekilde, evlilik bağı soñuna yeter).
        cid: 0
  - verse: 9
    segments:
      - text: >
          [8 ayetine baq.]
        cid: 0
  - verse: 10
    segments:
      - text: >
          YA Allahnıñ sizge bol lütfi ve merhameti olmasa edi ve Allah tövbelerni qabul
          etken üküm ve ikmet saibi olmasa edi (alıñız ne olur edi)!
        cid: 0
  - verse: 11
    segments:
      - text: >
          (Peyğamberniñ qadınına) bu ağır iftiranı uydurğanlar, şübesiz, siziñ arañızdan
          bir topudır. Bunı özüñiz içün bir fenalıq sanmañ, aksine o, siz içün bir
          yahşılıqtır. Olardan er bir adamğa, günah olaraq, ne işlegen ise (onıñ qarşılığı
          ceza) bardır. Olardan (ilge yolbaşçılıq yapıp) bu günahnıñ büyükligini arqalağan
          kimse içün de, çoq büyük bir azap bardır. (Bu ve aşağıdaki doquz ayetniñ nazil
          oluvına sebep olğan ve «ifq» (iftira) adisesi» diye bilingen vaqia qısqadan
          böyledir: Az. Peyğamberniñ bir askeriy seferine Az. Ayşe de qatılğan edi.
          Qaytqanda, bir ara Az. Ayşe itiyacından qurtulmaq içün çekilgen bir köşede
          gerdanlığını tüşüre. Soñ, bunıñ farqına barıp, qıdırmağa kete. Bu arada, kervan
          Az. Ayşeni devesiniñ üstündeki hevdec adı berilgen qapalı, tomalaq ve üstü
          qubbeli qafesi içinde zan eterek, qonaqlav yerinden ayrılğanı içün, Az. Ayşe o
          yerde qala. Ordunı artından taqip etmeknen vazifeli bir zat Az. Ayşeni alıp,
          kervanğa yetiştire. Aralarında munafıqlarnıñ reberlerinden Abdullah b. Ubeyy de
          olğan bir qaç adam, bu adisege esaslanıp, Az. Ayşenen onı kervanğa yetiştirgen
          adam arasında alâqa yapılğanı iftirasını uyduralar. Bu iftira Az. Peyğamberni
          ziyade kederlendire. Bu sırada, zaten raatsız olğan Az. Ayşe aqqında böyle bir
          iftira uydurılğanını bir müddet soñ bile ve büyük bir istirapqa tüşe; artıq özü
          kibi kederli olğan ailesine, babası Az. Ebu Bekir (r.a.)niñ evine barmaqnı doğru
          tanıy. Bu arada Az. Peyğamber (s.a.) zaman-zaman Az. Ebu Bekirniñ evine barıp,
          olardan Az. Ayşeniñ sağlığını, al ve hatirini soray edi. İşte, kene böyle bir
          ziyaret sırasında ve iftira vaqiasınıñ çıqqanından tahminen bir ay soñ, Ayşe
          validemizniñ qabaatsızlığını ifade etken bu ayetler nazil oldı:)
        cid: 0
  - verse: 12
    segments:
      - text: >
          Bu iftiranı eşitkeniñizde, erkek ve qadın mü'minlerniñ öz vicdanları ile eyi
          zanda bulunıp da: «Bu, ap-açıq bir iftira», deyüvleri kerekmey edimi?
        cid: 0
  - verse: 13
    segments:
      - text: >
          Olarnıñ (iftiracılarnıñ) da bu meselede dört şaat ketirüvleri kerekmey edimi?
          Madam ki, şaatlar ketiralmadılar, öyle ise, olar Allahnıñ nezdinde,
          yalancılarnıñ tam özleridir.
        cid: 0
  - verse: 14
    segments:
      - text: >
          Eger dünyada ve ahirette Allahnıñ lütf ve merhameti üstüñizde olmasa edi, içine
          dalğan bu iftirañızdan tolayı, sizge mıtlaqa büyük bir azap toqunır edi.
        cid: 0
  - verse: 15
    segments:
      - text: >
          Çünki, siz bu iftiranı, tilden tilge bir-biriñizge yetiştire, aqqında bilgiñiz
          olmağan şeyni ağızlarıñızda çaynap turasıñız. Bunı müim sanmaysıñız. Albuki,
          Allah qatında çoq büyük (bir suç)tır.
        cid: 0
  - verse: 16
    segments:
      - text: >
          Onı eşitkeniñizde: «Bunı qonuşıp yayuvımız bizge yaqışmaz. Bu, çoq büyük bir
          iftiradır», demeli degil ediñizmi?
        cid: 0
  - verse: 17
    segments:
      - text: >
          Eger inanğan insalar iseñiz, Allah, bir daa buña beñzegen areketni tekrarlavdan
          sizni saqındırıp tenbiyeler.
        cid: 0
  - verse: 18
    segments:
      - text: >
          Ve Allah ayetlerni sizge izaatlamaqta. Allah, (işniñ asılını) çoq yahşı bilir,
          üküm ve ikmet saibidir.
        cid: 0
  - verse: 19
    segments:
      - text: >
          İnanğanlar arasında çirkin şeylerniñ yapıluvını istegen kimseler içün, dünyada
          da, ahirette de çetin bir ceza bardır. Allah bilir, siz bilmezsiñiz.
        cid: 0
  - verse: 20
    segments:
      - text: >
          YA siziñ üstüñizge Allahnıñ lütf ve merhameti olmasa edi, Allah çoq şefqatlı ve
          merhametli olmasa edi (alıñız nice olur edi)!
        cid: 0
  - verse: 21
    segments:
      - text: >
          Ey, iman etkenler! Şeytannıñ adımlarını taqip etmeñ. Kim şeytannıñ adımlarını
          taqip etse, muaqqaq ki o, edepsizlikni (yüz qızartıcı qabaatlarnı) ve fenalıqnı
          emir eter. Eger üstüñizde Allahnıñ lütf ve merhameti olmasa edi, arañızdan iç
          bir kimse asla temizge çıqalmaz edi. Faqat Allah istegenini arındırır. Allah
          eşitir ve bilir.
        cid: 0
  - verse: 22
    segments:
      - text: >
          Arañızdan faziletli ve servet saibi kimseler aqarabağa, yoqsullarğa, Allah
          yolunda köç etkenlerge (mallarından) bermeyceklerine yemin etmesinler;
          bağışlasınlar; ferağat köstersinler. Allahnıñ sizni bağışlavunı
          arzulamazsıñızmı? Allah çoq bağışlayıcıdır, çoq merhametlidir. (Az. Ayşege
          iftira etkenlerden biri de, Az. Ebu Bekirniñ, imayesini ve baqımını üzerine
          alğan Mıstah adlı bir adam edi. Bu adise üzerine, Az. Ebu Bekir bir daa bu
          adamğa maddiy yardımda bulunmaycağına dair yemin etti. İşte, tefsircilerge köre,
          yuqarıdaki ayette em Az. Ebu Bekir (r.a.)niñ faziletine işaret etile, em de oña
          ve başqa mü'minlerge Allah rizası içün yapıp kelgen yardımlarını kesmemeleri
          ögütlene).
        cid: 0
  - verse: 23
    segments:
      - text: >
          Namuslı, fenalıqlardan habersiz mü'min qadınlarğa zina iftirası yapqanlar, dünya
          ve ahirette lânetlengenlerdir. Yapqanlarına, tilleri, elleri ve ayaqlarınıñ
          aleyhlerinde şaatlıq etecek künü, olar içün çoq büyük bir azap bardır.
        cid: 0
  - verse: 24
    segments:
      - text: >
          [23 ayetine baq.]
        cid: 0
  - verse: 25
    segments:
      - text: >
          O künü Allah olarğa aqiqiy cezalarını tas-tamam berecek ve olar Allahnıñ ap-açıq
          kerçek olğanını añlaycaqlar.
        cid: 0
  - verse: 26
    segments:
      - text: >
          Yaman qadınlar yaman erkeklerge, yaman erkekler ise, yaman qadınlarğa; temiz
          qadınlar temiz erkeklerge, temiz erkekler de, temiz qadınlarğa yaraşır. Bu
          soñkiler, (iftiiracılarnıñ) söylegenlerinden çoq uzaqtırlar. Olar içün bağışlav
          ve güzel bir rızıq bardır.
        cid: 0
  - verse: 27
    segments:
      - text: >
          Ey, iman etkenler! Öz eviñizden başqa evlerge, kelgeniñizni duydırıp (izin
          alıp), ev halqına selâm bermegence, kirmeñ. Bu siz içün daa yahşıdır; er alda
          (bunı) tüşünip añlarsıñız.
        cid: 0
  - verse: 28
    segments:
      - text: >
          O yerde iç bir kimse tapalmadı iseñiz, sizge izin berilgenge qadar o yerge
          kirmeñ. Eger sizge «keri dönüñ!», denilir ise, aman dönüñ. Çünki, bu, siz içün
          daa temiz bir davranıştır. Allah yapqanıñıznı bilir.
        cid: 0
  - verse: 29
    segments:
      - text: >
          İçinde sizge ait eşyanıñ bulunğan, oturılmağan evlerge kirüviñizde, iç bir
          saqınmaq yoq. Allah siziñ aşkâr etkenleriñizni de, gizlegenleriñizni de bilir.
        cid: 0
  - verse: 30
    segments:
      - text: >
          (Resulım!) Mü'min erkeklerge, közlerini (aramğa) tikmemelerini, ırızlarını da
          qorçalavlarını söyle. Çünki bu, özleri içün daa temiz bir davranıştır. Şübesiz,
          Allah olarnıñ yapayatqanlarından haberdardır.
        cid: 0
  - verse: 31
    segments:
      - text: >
          Mü'min qadınlarğa da söyle: Közlerini (aramğa baqmaqtan) qorçalasınlar; namus ve
          iffetlerini qorçalasınlar. Körüngen qısımları istisna olmaq üzre, ziynetlerini
          köstermesinler. Baş örtülerini, yaqalarınıñ üzerine (qadar) örtsinler. Qocaları,
          babaları, qocalarınıñ babaları, öz oğulları, qocalarınıñ oğulları, erkek
          qardaşları, erkek qardaşlarınıñ oğulları, qız qardaşlarınıñ oğulları, öz
          qadınları (mü'min qadınlar), elleriniñ altında bulunğanlar (hızmetkârları),
          erkeklerden, aileniñ qadınına şehvet duymağan hızmetçi ve başqa tabiy kimseler,
          yahut alâ qadınlarnıñ gizli qadınlıq hususiyetleriniñ farqına barmağan
          balalardan başqasına, ziynetlerini köstermesinler. Gizlemekte olğan ziynetlerni,
          añlaşılsın diye, ayaqlarını yerge urmasınlar (diqqatlarnı üzerine çekecek tarzda
          yürmesinler). Ey, mü'minler! Ep birden Allahqa tövbe etiñ ki, qurtulışqa
          irişirsiñiz. (Yuqarıdaki ayette qadınlarğa kösterüvleri yasaqlanğan «ziynet»niñ
          ne olğanı aqqında çeşit fikirler bar: bir zanğa köre, bu ziynetlerniñ küpe,
          bilezlik, yüzük ve gerdanlıq kibi süs taqınçaqlarınen sürme, hına kibi
          şeylerdir. Bu yorumğa köre, bu çeşit ziynet eşyasınıñ bedende kösterilüvi
          qadınlar içün aramdır. Urbada da, ziynet olmaqnen beraber, gizlenmesi mümkün
          olmağanı içün, ayette digerlerinden istisna etilgendir. Ancaq, daa esaslı bir
          noqtai nazarğa köre, ayetteki «ziynet» tabiri qadın vucudını ifade eter ki, buña
          köre, yasaqlanğan süs eşyalarınıñ kösterilüvi degil, vucutnıñ kösterilüvidir. Bu
          yasaqlavdan istisna etilgen «körüngen» qısım ise, qadınnıñ yüzü, elleri ve, bir
          noqtai nazarğa köre, ayaqlarıdır).
        cid: 0
  - verse: 32
    segments:
      - text: >
          Arañızdaki bekârlarnı erkek ve qadın hızmetkârlarıñızdan elverişli olğanlarnı
          evlendiriñ. Eger olar faqır iseler, Allah öz lütfi ile olarnı zenginleştirir.
          Allah (lütfi) keniş ve (er şeyni) bilicidir.
        cid: 0
  - verse: 33
    segments:
      - text: >
          Evlenüv imkânını tapalmağanlar ise, Allah lütfi ile olarnı varlıqlı etkenge
          qadar, iffetlerini qorçalasınlar. Elleriñizniñ astında olğanlarından (erkek ve
          qadın hızmetkârlardan) mükâtebe yapmaq istegenlernen, eger özlerinde bir hayır
          (qabiliyet ve işançlılıq) köre iseñiz, aman mükâtebe yapıñ. Allahnıñ sizge
          bergen malından siz de olarğa beriñ. Dünya ayatınıñ keçici menfaatlarını elde
          eteceksiñiz diye, namuslı qalmaq istegen cariyeleriñizni fuhuşqa zorlamañ. Kim
          olarnı zorbalıq altında bıraqır ise, bilinmelidir ki, zorlanuvlarından soñ,
          Allah (olar içün) çoq bağışlayıcı ve merhametlidir. (Mükâtebe - erkek ya da
          qadın hızmetkârnen efendisi arasında yapılğan bir qayd olup, bu qaydda hızmetkâr
          belli bir aq ödegeni taqdirde, efendisinden özüne ürriyetini bermesini ister ya
          da aynı teklifni oña efendisi yapar. Üzerinde añlaşuvğa barılğan bu aq azır ise,
          hızmetkâr bu aqnı aman ödemek, yoq ise, efendisiniñ özüne belli bir müddet
          içinde temin etkeninden soñ, ödemek şartınen, ürriyetine qavuşır. Yuqarıdaki
          ayette «Allahnıñ sizge bergen malından siz de olarğa beriñ» buyurulmaqnen,
          insannıñ elindeki malınıñ asıl saibi Allah olğanı, bu alda Allahnıñ malından
          hızmetkârğa da bermeknen, olarnıñ ürriyetke qavuşuvlarını qolaylaştırmaqnıñ
          diniy, ahlâqiy ve içtimaiy bir vazife olğanı ortağa çıqmaqta. Bu vazife İslâmnıñ
          asırlar boyu tedbiq etilip kelingen ve bir anda ortadan qaldırıluvı mümkün
          olmağan hızmetkârlıq müessisesini ortadan qaldırmaq içün alğan bir sıra
          tedbirden biridir).
        cid: 0
  - verse: 34
    segments:
      - text: >
          Ant olsun ki, biz sizge (kerekkenni) açıq-açıq bildirgen ayetler, sizden evel
          yaşap ketkenlerden örnekler ve taqvağa qavuşqan kimseler içün ögütler endirdik.
        cid: 0
  - verse: 35
    segments:
      - text: >
          Allah - köklerniñ ve yerniñ nurıdır. Onıñ nurınıñ temsili, içinde lampa bulunğan
          bir qandillik kibidir. O lampa kristal bir fanus içindedir; o fanus da sanki
          incige beñzegen bir yıldız kibidir ki, şarqqa da, ğarpqa da nisbet etilmegen
          mubarek bir terekten, yani zeytundan (çıqqan yağdan) tutaştırılır. Onıñ yağı,
          nerede ise, oña ateş tiymese bile, ışıq berir. (Bu,) nur üstüne nurdır. Allah
          istegen kimsesini nurına qavuştırır. Allah insanlarğa (işte böyle) temsiller
          ketirir. Allah er şeyni bilir. (Allahnıñ nur oluvınıñ manası - bütün alemniñ ve
          alemdeki bütün issiy nurlarnıñ ve idrak etici küçlerniñ yaratıcısı ve icat
          eticisi oluvıdır. Bu alda nurdan asıl ümüt etilgen aydınlatuv, aşkâr etüv,
          ortağa çıquv ve inkişaf manalarınıñ temeli, nurdan ve nurnı alğandan çoq, nurnı
          yapıp yaratqanğa ait olacağı içün «Nuur» ismi Allahqa daa lâyıqtır. Ancaq,
          bundan tolayı, nurnı yaratqnğa «Nuur» denilüvi, til noqtai nazarından, aqiqat
          degil, micazdır).
        cid: 0
  - verse: 36
    segments:
      - text: >
          (Bu qandil) bir taqım evlerdedir ki, Allah (o evlerniñ) yücelüvine ve içlerinde
          isminiñ añıluvına izin bergendir. O yerde saba-aqşam Onı (öyle kimseler) tesbih
          eter ki;
        cid: 0
  - verse: 37
    segments:
      - text: >
          Olar ne ticaret, ne de alış-verişniñ, özlerini Allahnı añuvdan, namaz qıluvdan
          ve zekât berüvden çetlendirmegen insanlardır. Olar, qalper ve közler alaq-bulaq
          olğan bir künden korqarlar.
        cid: 0
  - verse: 38
    segments:
      - text: >
          Çünki (o künde) Allah olarnı yapqanlarınıñ eñ güzelinen mükâfatlandıracaq ve
          lütfinden olarğa ziyadesinen berecek. Allah istegenini esapsız rızıqlandırır.
        cid: 0
  - verse: 39
    segments:
      - text: >
          İnkâr etkenlerge kelgende, olarnıñ amelleri boş çöllerdeki ılğım kibidir ki,
          suvsağan suv zan eter; niayet oña yetkende, o yerde iç bir şey tapalmağan, bunıñ
          üstüne, yanında da (inanmağan, ondan saqınmağan) Allahnı bulğandır; Allah ise,
          onıñ esabını tas-tamam körgendir. Allah esapnı çoq çabuk körer. (İman insannıñ
          ayatına ve bu ayat devam etkenge qadar, sarf etken ğayretlerine, yapqan işlerine
          bir mana ve deger qoşqan yekâne amildir. Çünki, inanğan insan, bütün amellerini,
          faaliyetlerini üstün bir ğaye içün, Allah rizası içün yapar; üstün bir
          talimatqa, Allahnıñ emir ve yasaqlarına uyğun olaraq yapar. Niayet, yapqan er
          işinden tolayı, ince bir esap berecek qayğısı ve nizamı içinde yapar. Albuki,
          inançsız insanlarnıñ faaliyetleri, bu iman ve mesuliyetlilik nizamından uzaq
          olğanından -ayette de bediiy bir teşbihnen ifade etilgeni kibi- boş, degersiz ve
          manasız bir meşğuliyetler obasından ibaret olmaqnen qalmaz, ziyade olaraq,
