      - text: >-
          (Soñki dört ayetteki tedbiqat, İslâm aile uquqında «liaan» termini ile ifade etilir.
          Qadınnıñ zina qabaatı işlegenini idda etken bir qoca, eger iddasını isbat etmek içün
          dört şaat ketirip olamasa, qadın ve qoca hakim uzurına celp etilerek, liaanğa davet
          etilir. Er eki taraf da doğrulıqlarını bu ifadelernen beyan etseler, erkek iftira
          (kazf) cezasından, qadın da, zina cezasından qurtulır, ve bu şekilde, evlilik bağı
          soñuna yeter).
