          elindeki malınıñ asıl saibi Allah olğanı, bu alda Allahnıñ malından hızmetkârğa da
          bermeknen, olarnıñ ürriyetke qavuşuvlarını qolaylaştırmaqnıñ diniy, ahlâqiy ve
