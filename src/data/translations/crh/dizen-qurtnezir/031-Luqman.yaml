      - text: >-
          (Bu ayet Nadir b. Haarisniñ davranışı üzerine nazil olğanı naql etile. Rivayetke
          köre, bu şahıs Acem masallarını beyan etken kitaplar satın alıp ketirir ve
          mekkelilerge böyle der edi: «Muhammed sizge Aad ve Semuud qavmlarınıñ masallarını
          añlatmaqta; men de sizge Rum ve Acem masalları söyleycem». Böylece, bularnı oqur,
          müşriklerni eglendirir ve insanlarnı Qur'an diñlemekten uzaqlaştırmağa areket eter
          edi).
