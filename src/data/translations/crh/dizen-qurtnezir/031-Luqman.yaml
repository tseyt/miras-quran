      - text: lâyıqtır.
        cid: 18
      - text: >-
          (Soyu aqqındaki rivayetler, Luqmannıñ Eyup Peyğambernen aqraba olğanı aqqındadır.
          İslâm alimleriniñ eksiriyeti, onıñ peyğamber degil, ikmet saibi bir zat olğanı
          qanaatindedirler. «İkmet»niñ bir manası da, nazariy ilimlerni elde etkenden soñ,
          qazanılğan ruhiy pişkinlik, söz ve areketlerdeki tam noqtağa uruv melekesedir.
          Zemahşeriyniñ «Keşşaaf» adlı tefsir kitabında onıñ ikmetlerinden bir örnek olaraq şu
          vaqia naql etilgen: Bir kün Davut Peyğamber Luqmandan bir qoyun soyup, eñ yahşı
          yerinden eki parça et ketirmesini istey; Luqman da, oña soyğan ayvanınıñ tilini ve
          yüregini ketire. Bir qaç kün keçken soñ, Davut aleyhisselâm bu keresinde ayvannıñ eñ
          yaman yerinden eki parça et ketirmesini istey; o kene tilini ve yüregini ketire. Az.
          Davut bunıñ sebebini sorağanda, Luqman böyle dey: «Bu ekisi yahşı olsa, bulardan daa
          yahşısı; fena olsa, kene bulardan daa fenası olmaz»).
        cid: 0
