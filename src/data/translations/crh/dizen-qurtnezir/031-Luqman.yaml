surah_id: 31
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "Elif. Lâam. Miim."
        cid: 0
  - verse: 2
    segments:
      - text: "İşte, bu ayetler ikmet tolu Kitapnıñ ayetleridir."
        cid: 0
  - verse: 3
    segments:
      - text: "Guzel davranğanlar içün bir hidayet reberi ve rahmet olmaq uzre (endirilgendir)."
        cid: 0
  - verse: 4
    segments:
      - text: "O kimseler namaznı qılarlar, zekâtnı berirler; olar ahiretke de kesen-kes iman eterler."
        cid: 0
  - verse: 5
    segments:
      - text: "İşte olar, Rabbleri tarafından kosterilgen doğru yol uzerindedirler ve olar qurtulışqa irişkenlerdir."
        cid: 0
  - verse: 6
    segments:
      - text: "İnsanlardan oylesi bar ki, er angi bir ilmiy delilge esaslanmadan, Allaһ yolundan saptırmaq ve soñunda da, onıñnen alay etmek içün boş lafnı satın alır. İşte, olarğa şiddetli bir azap bar. (Bu ayet Nadir b. Haarisniñ davranışı uzerine nazil olğanı naql etile. Rivayetke kore, bu şahıs Acem masallarını beyan etken kitaplar satın alp ketirir ve mekkelilerge boyle der edi: «Muһammed sizge Aad ve Semuud qavmlarınıñ masallarını añlatmaqta; men de sizge Rum ve Acem masalları söyleycem». Boylece, bularnı oqur, muşriklerni eglendirir ve insanlarnı Qur’an diñlemekten uzaqlaştırmağa areket eter edi)."
        cid: 0
  - verse: 7
    segments:
      - text: "Oña ayetlerimiz oqulğan vaqıtta, sanki bularnı eşitmegen, sanki qulaqları ağır kibi, buyuklik taslayaraq, yuz çevirir. Sen de oña elem berici bir azapnıñ mujdesini ber!"
        cid: 0
  - verse: 8
    segments:
      - text: "Şubesiz, iman etip de, guzel davranışlarda bulunğanlar içün, içinde devamlı qalacaqları ve nimetleri bol cennetler bardır. Bu, Allaһnıñ bergen aqiqiy sözüdir. O, mutlaq kuç ve ikmet saibidir."
        cid: 0
  - verse: 9
    segments:
      - text: "[8 ayetine baq.]"
        cid: 0
  - verse: 10
    segments:
      - text: "O, koklerni kore bilgeniñiz bir direk olmadan yarattı, sizni sarsmasın diye, yerge de buyuk dağlar qoydı. Ve o yerde er çeşit canlını darqattı. Biz kok yuzünden suv endirip, o yerde er faydalı ekinden çift-çift çıqardıq. (Koklerniñ korülgen bir diregi olmadan yaratıluvından, koklerni tutıp, olarnıñ bir-birine çarpışuvınıñ ogüni alğan korünmez maneviy bir direk olğanı manası çıqarılmaqta ve bu direk «çeküv qanunı»» olğanı bildirilmekte. Ayetniñ aynı qısmına «O, koklerni, -korgeniñiz uzre- direksiz yarattı»» ve «O, korüp turğanıñız koklerni direksiz yarattı»» manaları da berilgen. Ayetniñ soñki qısmında ise, ekinlerniñ erkek-ırğaçı yaratılğanı aqiqatına işaret etilmekte)."
        cid: 0
  - verse: 11
    segments:
      - text: "İşte, bular Allaһnıñ yaratıqlarıdır. Şimdi (ey, kâfirler!) Ondan başqasınıñ ne yaratqanını maña kosteriñ! Yoq (kosteralmazlar)! Zalımlar açıq bir sapıqlıq içindedirler."
        cid: 0
  - verse: 12
    segments:
      - text: "Ant olsun, biz Luqmanğa: Allaһqa şukür et! diyerek ikmet berdik. Şukür etken ancaq ozü içün şukür eter. Nankorlik etken de, bilsin ki, Allaһ iç bir şeyge muhtac degil, er türlü maqtavğa lâyıqtır. (Soyu aqqındaki rivayetler, Luqmannıñ Eyup Peyğambernen aqraba olğanı aqqındadır. İslâm alimleriniñ eksiriyeti, onıñ peyğamber degil, ikmet saibi bir zat olğanı qanaatindedirler. «İkmet»niñ bir manası da, nazariy ilimlerni elde etkenden soñ, qazanılğan ruhiy pişkinlik, söz ve areketlerdeki tam noqtağa uruv melekesedir. Zemahşeriyniñ «Keşşaaf» adlı tefsir kitabında onıñ ikmetlerinden bir ornek olaraq şu vaqia naql etilgen: Bir kun Davut Peyğamber Luqmandan bir qoyun soyup, eñ yahşı yerinden eki parça et ketirmesini istey; Luqman da, oña soyğan ayvanınıñ tilini ve yuregini ketire. Bir qaç kun keçken soñ, Davut aleyhisselâm bu keresinde ayvannıñ eñ yaman yerinden eki parça et ketirmesini istey; o kene tilini ve yuregini ketire. Az. Davut bunıñ sebebini sorağanda, Luqman boyle dey: «Bu ekisi yahşı olsa, bulardan daa yahşısı; fena olsa, kene bulardan daa fenası olmaz»)."
        cid: 0
  - verse: 13
    segments:
      - text: "Luqman oğluna ogüt bererek: Yavrucığım! Allaһqa ortaq qoşma! Doğrusı, şirk buyuk bir zulumdır, degen edi."
        cid: 0
  - verse: 14
    segments:
      - text: "Biz insanğa, ana-babasına eyi davranuvını tevsiye etkendirmiz. Çünki, anası onı nice sıqıntılarğa qatlanaraq taşığan. Sütten ayırıluvı da, eki yıl içinde olur. (İşte, bunıñ içün) başta maña, soñra da ana-babaña şukür et, diye tevsiyede bulunğandırmız. Dönüş ancaq mañadır."
        cid: 0
  - verse: 15
    segments:
      - text: "Eger olar seni aqqında bilgiñ olmağan bir şeyni (kor-korane) maña ortaq qoşuvıñ içün zorlasalar, olarğa itaat etme. Olarnen dünyada yahşı keçin, maña yonelgenlerniñ yoluna uy. Soñunda dönüşiñiz ancaq mañadır. O zaman sizge yapqanlarıñıznı haber beririm."
        cid: 0
  - verse: 16
    segments:
      - text: "(Lukman ogütlerine boyle devam etken edi:) Yavrucığım! Yapqan işiñ (yahşılıq ya da yamanlıq), bir hardal danesi ağırlığında bile olsa ve bu, bir qayanıñ içinde ya da koklerde, yahut yerniñ terenliklerinde bulunsa, kene de Allaһ onı (seniñ qarşıña) ketirir. Doğrusı, Allaһ eñ ufaq işlerni korip bilmekte ve er şeyden haberdardır."
        cid: 0
  - verse: 17
    segments:
      - text: "Yavrucığım! Namaz qıl, yahşılıqnı emir et, yamanlıqtan vazgeçtirmege çalış, başıña kelgenlerge sabır et. Doğrusı, bular, azm etilmege degerli işlerdir."
        cid: 0
  - verse: 18
    segments:
      - text: "Biysinmeden, insanlardan yuz çevirme ve yer yuzünde ğururlanaraq yurme. Zira, Allaһ ozüni begengen, maqtanıp turğan kimselerni asla sevmez."
        cid: 0
  - verse: 19
    segments:
      - text: "Yer yuzünde sade (addiy) ol, sesiñni sakinlet. Unutma ki, seslerniñ eñ çirkini eşeklerniñ sesidir."
        cid: 0
  - verse: 20
    segments:
      - text: "Allaһ, koklerde ve yerdeki (nice varlıq ve imkânları) siziñ emriñizge bergenini, nimetlerini aşkâr ve gizli olaraq sizge bol ihsan etkenini kormediñizmi? Kene de, insanlar arasında -bilgisi, reberi ve aydınlatıcı bir kitabı yoq eken- Allaһ aqqında tartışqan kimseler bar."
        cid: 0
  - verse: 21
    segments:
      - text: "Olarğa «Allaһnıñ endirgenine uyıñ», denilgende: Yoq, biz babalarımıznı uzerinde bulğan yolumızğa uyarmız, dediler. Ya şeytan, olarnı alevli ateşniñ azabına çağırmakta edi ise!"
        cid: 0
  - verse: 22
    segments:
      - text: "Yahşı davranışlar içinde ozüni butünley Allaһqa bergen kimse, aqiqaten eñ qaviy tutquçqa yapışqandır. Zaten, butün işlerniñ soñu Allaһqa barır. (Ayette keçken muhsin bir hadiske kore, «Allaһqa, onı korgen kibi qullıq etkenlerdir». Qullıq, yalıñız kunlik, vaqıtlı, belli tabınuv şekillerinen degil, butün ayatnıñ Allaһ rizasına teslimiyetinen kerçekleşir. «Ameller niyetlerge kore» deger qazanır. Allaһ rizası içün, bu niyetnen atılğan er adım, alınğan er nefes… ibadettir, qullıqtır, ihsandır)."
        cid: 0
  - verse: 23
    segments:
      - text: "(Resulım!) İnkâr etkenniñ inkârı seni kederlendirmesin. Olarnıñ dönüşi ancaq bizgedir. İşte, o zaman yapqanlarını ozlerine haber berirmiz. Allaһ qalplerde olğanını, şubesiz çoq yahşı bilir."
        cid: 0
  - verse: 24
    segments:
      - text: "Olarnı biraz faydalandırır, soñ ozlerini ağır bir azapqa süyreklermiz."
        cid: 0
  - verse: 25
    segments:
      - text: "Ant olsun ki, olarğa «Koklerni ve yerni kim yarattı?», diye sorasañ, mıtlaqa «Allaһ…» derler. De ki: (Oyle ise) maqtav da yalıñız Allaһqa aittir. Amma, olarnıñ çoqu bilmezler."
        cid: 0
  - verse: 26
    segments:
      - text: "Koklerde ve yerde ne bar ise, episi Allaһnıñdır. Bilinmeli ki, asıl ğaniy ve maqtavğa lâyıq - Allaһtır."
        cid: 0
  - verse: 27
    segments:
      - text: "Eger yer yuzündeki terekler qalem, diñiz de, arqasından yedi deñiz qoşularaq (merekep olsa), kene Allaһnıñ sözleri (yazmaqnen) tükenmez. Şube yoq ki, Allaһ mutlaq ğalip ve ikmet saibidir."
        cid: 0
  - verse: 28
    segments:
      - text: "(İnsanlar!) Siziñ yaratıluvıñız ve tiriltilüviñiz, ancaq tek bir kişiniñ yaratıluvı ve tiriltilüvi kibidir. Unıtılmasın ki, Allaһ er şeyni bilici ve korücidir."
        cid: 0
  - verse: 29
    segments:
      - text: "Bilmezmisiñ ki, Allaһ geceni kundüzge ve kundüzni gecege qatmaqta. Kuneşni ve aynı emiri altına alğandır. Bularnıñ er biri belli bir vadege qadar areketine devam eter. Ve Allaһ yapqanlarıñızdan tamamen haberdardır."
        cid: 0
  - verse: 30
    segments:
      - text: "Çünki, Allaһ haqnıñ tam ozüdir; Ondan başqa tabınğanları ise, iç şubesiz, batıldır. Aqiqaten, Allaһ çoq yuce, çoq uludır."
        cid: 0
  - verse: 31
    segments:
      - text: "Sizge barlığınıñ delillerini kosterüvi içün, Allaһnıñ lütfi ile gemilerniñ deñizde yaldağanını kormediñmi? Şubesiz, bunda çoq sabır etken, çoq şukür etken er kes içün, ibretler bardır."
        cid: 0
  - verse: 32
    segments:
      - text: "Dağlar kibi dalğalar olarnı sarğan vaqıtta, dinni tamamen Allaһqa ait qılaraq, (ihlâsnen) Oña yalvarırlar. Allaһ olarnı qarağa çıqararaq, qurtarğan vaqıtta, aralarından bir qısmı orta yolnı tutar. Zaten, bizim ayetlerimizni, ancaq nankor hainler bilerek inkâr eter. (Ayetteki «orta yolnı tutar» şeklinde mana berilgen qısmı içün çeşit tefsirler mevcut. Daa doğru yol, yani iman uzre qaluv, sıqıntı anında Allaһqa bergen sözge sadaqat kosterüv şeklinde izaatlanmaqta. Bu ayet Ebu Cehilniñ oğlu İkrime aqqında nazil olğanı rivayet etilgen. İkrime Mekkeniñ fethini taqip eterek, deñiz yolunen qaçmğa areket etken, faqat yolda şiddetli bir fırtınağa oğrağan ve bu esanada, yapqanlarından peşmanlıq duyaraq, qurtulğan taqdirinde, Resulullaһqa barıp, afu soraycağına ait söz bergen. Boylece, qurtulğanınen, Az. Peyğamebrniñ uzurına barğan, musulman olğanını bildirgen ve bundan soñ omüriniñ soñuna qadar musulmanlarnıñ safında cihad etken)."
        cid: 0
  - verse: 33
    segments:
      - text: "Ey, insanlar! Rabbiñizge qarşı kelüvden saqınıñ. Ne babanıñ evlâdı, ne evlâtnıñ babası adına bir şey odep olamaycaq kunünden çekiniñ. Biliñ ki, Allaһnıñ bergen sözü kerçektir. Saqın dünya ayatı sizni aldatmasın ve şeytan Allaһnıñ afu etüvine işandıraraq, sizni qandırmasın. (Er kesniñ oz qayğısına tüşecek qıyamet kunüniñ alı aqqında çoq esasl bilgi bergen bu ayetnen kâfir olğan babasına ahirette faydası toquna bilecek umüdini beslegen bazı mu’minlerge bu imkânnıñ olmağanı da bildirilmekte)."
        cid: 0
  - verse: 34
    segments:
      - text: "Qıyamet vaqıtı aqqındaki bilgi, ancaq Allaһnıñ qatındadır. Yağmurnı O yağdırır, rahimlerde olğanını O bilir. İç kimse yarın ne qazanacağını bilalmaz. Kene iç kimse ne yerde olecegini bilalmaz. Şubesiz, Allaһ er şeyni bilicidir, er şeyden haberdardır. (İnsanlar bilmegen, yalıñız Allaһ bilgen şeylerine «ğayb, muğayyebaat» denilir. Allaһnıñ bildirüvi ile qullarnıñ, meleklerniñ… bularnıñ bazılarını bilüvi, olarnı ğayb oluvdan çıqrmaz)."
        cid: 0