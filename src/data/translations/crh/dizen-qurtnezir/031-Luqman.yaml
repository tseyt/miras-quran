      - text: >-
          (Köklerniñ körülgen bir diregi olmadan yaratıluvından, köklerni tutıp, olarnıñ
          bir-birine çarpışuvınıñ ögüni alğan körünmez maneviy bir direk olğanı manası
          çıqarılmaqta ve bu direk «çeküv qanunı» olğanı bildirilmekte. Ayetniñ aynı qısmına
          «O, köklerni, -körgeniñiz üzre- direksiz yarattı» ve «O, körüp turğanıñız köklerni
          direksiz yarattı» manaları da berilgen. Ayetniñ soñki qısmında ise, ekinlerniñ
          erkek-ırğaçı yaratılğanı aqiqatına işaret etilmekte).
