surah_id: 31
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >
          Elif. Lâam. Miim.
        cid: 0
  - verse: 2
    segments:
      - text: >
          İşte, bu ayetler ikmet tolu Kitapnıñ ayetleridir.
        cid: 0
  - verse: 3
    segments:
      - text: >
          Güzel davranğanlar içün bir hidayet reberi ve rahmet olmaq üzre (endirilgendir).
        cid: 0
  - verse: 4
    segments:
      - text: >
          O kimseler namaznı qılarlar, zekâtnı berirler; olar ahiretke de kesen-kes iman
          eterler.
        cid: 0
  - verse: 5
    segments:
      - text: >
          İşte olar, Rabbleri tarafından kösterilgen doğru yol üzerindedirler ve olar
          qurtulışqa irişkenlerdir.
        cid: 0
  - verse: 6
    segments:
      - text: >
          İnsanlardan öylesi bar ki, er angi bir ilmiy delilge esaslanmadan, Allah
          yolundan saptırmaq ve soñunda da, onıñnen alay etmek içün boş lafnı satın alır.
          İşte, olarğa şiddetli bir azap bar. (Bu ayet Nadir b. Haarisniñ davranışı
          üzerine nazil olğanı naql etile. Rivayetke köre, bu şahıs Acem masallarını beyan
          etken kitaplar satın alıp ketirir ve mekkelilerge böyle der edi: «Muhammed sizge
          Aad ve Semuud qavmlarınıñ masallarını añlatmaqta; men de sizge Rum ve Acem
          masalları söyleycem». Böylece, bularnı oqur, müşriklerni eglendirir ve
          insanlarnı Qur'an diñlemekten uzaqlaştırmağa areket eter edi).
        cid: 0
  - verse: 7
    segments:
      - text: >
          Oña ayetlerimiz oqulğan vaqıtta, sanki bularnı eşitmegen, sanki qulaqları ağır
          kibi, büyüklik taslayaraq, yüz çevirir. Sen de oña elem berici bir azapnıñ
          müjdesini ber!
        cid: 0
  - verse: 8
    segments:
      - text: >
          Şübesiz, iman etip de, güzel davranışlarda bulunğanlar içün, içinde devamlı
          qalacaqları ve nimetleri bol cennetler bardır. Bu, Allahnıñ bergen aqiqiy
          sözüdir. O, mutlaq küç ve ikmet saibidir.
        cid: 0
  - verse: 9
    segments:
      - text: >
          [8 ayetine baq.]
        cid: 0
  - verse: 10
    segments:
      - text: >
          O, köklerni köre bilgeniñiz bir direk olmadan yarattı, sizni sarsmasın diye,
          yerge de büyük dağlar qoydı. Ve o yerde er çeşit canlını darqattı. Biz kök
          yüzünden suv endirip, o yerde er faydalı ekinden çift-çift çıqardıq. (Köklerniñ
          körülgen bir diregi olmadan yaratıluvından, köklerni tutıp, olarnıñ bir-birine
          çarpışuvınıñ ögüni alğan körünmez maneviy bir direk olğanı manası çıqarılmaqta
          ve bu direk «çeküv qanunı» olğanı bildirilmekte. Ayetniñ aynı qısmına «O,
          köklerni, -körgeniñiz üzre- direksiz yarattı» ve «O, körüp turğanıñız köklerni
          direksiz yarattı» manaları da berilgen. Ayetniñ soñki qısmında ise, ekinlerniñ
          erkek-ırğaçı yaratılğanı aqiqatına işaret etilmekte).
        cid: 0
  - verse: 11
    segments:
      - text: >
          İşte, bular Allahnıñ yaratıqlarıdır. Şimdi (ey, kâfirler!) Ondan başqasınıñ ne
          yaratqanını maña kösteriñ! Yoq (kösteralmazlar)! Zalımlar açıq bir sapıqlıq
          içindedirler.
        cid: 0
  - verse: 12
    segments:
      - text: >
          Ant olsun, biz Luqmanğa: Allahqa şükür et! diyerek ikmet berdik. Şükür etken
          ancaq özü içün şükür eter. Nankorlik etken de, bilsin ki, Allah iç bir şeyge
          muhtac degil, er türlü maqtavğa lâyıqtır. (Soyu aqqındaki rivayetler, Luqmannıñ
          Eyup Peyğambernen aqraba olğanı aqqındadır. İslâm alimleriniñ eksiriyeti, onıñ
          peyğamber degil, ikmet saibi bir zat olğanı qanaatindedirler. «İkmet»niñ bir
          manası da, nazariy ilimlerni elde etkenden soñ, qazanılğan ruhiy pişkinlik, söz
          ve areketlerdeki tam noqtağa uruv melekesedir. Zemahşeriyniñ «Keşşaaf» adlı
          tefsir kitabında onıñ ikmetlerinden bir örnek olaraq şu vaqia naql etilgen: Bir
          kün Davut Peyğamber Luqmandan bir qoyun soyup, eñ yahşı yerinden eki parça et
          ketirmesini istey; Luqman da, oña soyğan ayvanınıñ tilini ve yüregini ketire.
          Bir qaç kün keçken soñ, Davut aleyhisselâm bu keresinde ayvannıñ eñ yaman
          yerinden eki parça et ketirmesini istey; o kene tilini ve yüregini ketire. Az.
          Davut bunıñ sebebini sorağanda, Luqman böyle dey: «Bu ekisi yahşı olsa, bulardan
          daa yahşısı; fena olsa, kene bulardan daa fenası olmaz»).
        cid: 0
  - verse: 13
    segments:
      - text: >
          Luqman oğluna ögüt bererek: Yavrucığım! Allahqa ortaq qoşma! Doğrusı, şirk büyük
          bir zulumdır, degen edi.
        cid: 0
  - verse: 14
    segments:
      - text: >
          Biz insanğa, ana-babasına eyi davranuvını tevsiye etkendirmiz. Çünki, anası onı
          nice sıqıntılarğa qatlanaraq taşığan. Sütten ayırıluvı da, eki yıl içinde olur.
          (İşte, bunıñ içün) başta maña, soñra da ana-babaña şükür et, diye tevsiyede
          bulunğandırmız. Dönüş ancaq mañadır.
        cid: 0
  - verse: 15
    segments:
      - text: >
          Eger olar seni aqqında bilgiñ olmağan bir şeyni (kör-korane) maña ortaq qoşuvıñ
          içün zorlasalar, olarğa itaat etme. Olarnen dünyada yahşı keçin, maña
          yönelgenlerniñ yoluna uy. Soñunda dönüşiñiz ancaq mañadır. O zaman sizge
          yapqanlarıñıznı haber beririm.
        cid: 0
  - verse: 16
    segments:
      - text: >
          (Luqman ögütlerine böyle devam etken edi:) Yavrucığım! Yapqan işiñ (yahşılıq ya
          da yamanlıq), bir hardal danesi ağırlığında bile olsa ve bu, bir qayanıñ içinde
          ya da köklerde, yahut yerniñ terenliklerinde bulunsa, kene de Allah onı (seniñ
          qarşıña) ketirir. Doğrusı, Allah eñ ufaq işlerni körip bilmekte ve er şeyden
          haberdardır.
        cid: 0
  - verse: 17
    segments:
      - text: >
          Yavrucığım! Namaz qıl, yahşılıqnı emir et, yamanlıqtan vazgeçtirmege çalış,
          başıña kelgenlerge sabır et. Doğrusı, bular, azm etilmege degerli işlerdir.
        cid: 0
  - verse: 18
    segments:
      - text: >
          Biysinmeden, insanlardan yüz çevirme ve yer yüzünde ğururlanaraq yürme. Zira,
          Allah özüni begengen, maqtanıp turğan kimselerni asla sevmez.
        cid: 0
  - verse: 19
    segments:
      - text: >
          Yer yüzünde sade (addiy) ol, sesiñni sakinlet. Unutma ki, seslerniñ eñ çirkini
          eşeklerniñ sesidir.
        cid: 0
  - verse: 20
    segments:
      - text: >
          Allah, köklerde ve yerdeki (nice varlıq ve imkânları) siziñ emriñizge bergenini,
          nimetlerini aşkâr ve gizli olaraq sizge bol ihsan etkenini körmediñizmi? Kene
          de, insanlar arasında -bilgisi, reberi ve aydınlatıcı bir kitabı yoq eken- Allah
          aqqında tartışqan kimseler bar.
        cid: 0
  - verse: 21
    segments:
      - text: >
          Olarğa «Allahnıñ endirgenine uyıñ», denilgende: Yoq, biz babalarımıznı üzerinde
          bulğan yolumızğa uyarmız, dediler. YA şeytan, olarnı alevli ateşniñ azabına
          çağırmaqta edi ise!
        cid: 0
  - verse: 22
    segments:
      - text: >
          Yahşı davranışlar içinde özüni bütünley Allahqa bergen kimse, aqiqaten eñ qaviy
          tutquçqa yapışqandır. Zaten, bütün işlerniñ soñu Allahqa barır. (Ayette keçken
          muhsin bir hadiske köre, «Allahqa, onı körgen kibi qullıq etkenlerdir». Qullıq,
          yalıñız künlik, vaqıtlı, belli tabınuv şekillerinen degil, bütün ayatnıñ Allah
          rizasına teslimiyetinen kerçekleşir. «Ameller niyetlerge köre» deger qazanır.
          Allah rizası içün, bu niyetnen atılğan er adım, alınğan er nefes... ibadettir,
          qullıqtır, ihsandır).
        cid: 0
  - verse: 23
    segments:
      - text: >
          (Resulım!) İnkâr etkenniñ inkârı seni kederlendirmesin. Olarnıñ dönüşi ancaq
          bizgedir. İşte, o zaman yapqanlarını özlerine haber berirmiz. Allah qalplerde
          olğanını, şübesiz çoq yahşı bilir.
        cid: 0
  - verse: 24
    segments:
      - text: >
          Olarnı biraz faydalandırır, soñ özlerini ağır bir azapqa süyreklermiz.
        cid: 0
  - verse: 25
    segments:
      - text: >
          Ant olsun ki, olarğa «Köklerni ve yerni kim yarattı?», diye sorasañ, mıtlaqa
          «Allah...» derler. De ki: (Öyle ise) maqtav da yalıñız Allahqa aittir. Amma,
          olarnıñ çoqu bilmezler.
        cid: 0
  - verse: 26
    segments:
      - text: >
          Köklerde ve yerde ne bar ise, episi Allahnıñdır. Bilinmeli ki, asıl ğaniy ve
          maqtavğa lâyıq - Allahtır.
        cid: 0
  - verse: 27
    segments:
      - text: >
          Eger yer yüzündeki terekler qalem, diñiz de, arqasından yedi deñiz qoşularaq
          (merekep olsa), kene Allahnıñ sözleri (yazmaqnen) tükenmez. Şübe yoq ki, Allah
          mutlaq ğalip ve ikmet saibidir.
        cid: 0
  - verse: 28
    segments:
      - text: >
          (İnsanlar!) Siziñ yaratıluvıñız ve tiriltilüviñiz, ancaq tek bir kişiniñ
          yaratıluvı ve tiriltilüvi kibidir. Unıtılmasın ki, Allah er şeyni bilici ve
          körücidir.
        cid: 0
  - verse: 29
    segments:
      - text: >
          Bilmezmisiñ ki, Allah geceni kündüzge ve kündüzni gecege qatmaqta. Küneşni ve
          aynı emiri altına alğandır. Bularnıñ er biri belli bir vadege qadar areketine
          devam eter. Ve Allah yapqanlarıñızdan tamamen haberdardır.
        cid: 0
  - verse: 30
    segments:
      - text: >
          Çünki, Allah haqnıñ tam özüdir; Ondan başqa tabınğanları ise, iç şübesiz,
          batıldır. Aqiqaten, Allah çoq yüce, çoq uludır.
        cid: 0
  - verse: 31
    segments:
      - text: >
          Sizge barlığınıñ delillerini kösterüvi içün, Allahnıñ lütfi ile gemilerniñ
          deñizde yaldağanını körmediñmi? Şübesiz, bunda çoq sabır etken, çoq şükür etken
          er kes içün, ibretler bardır.
        cid: 0
  - verse: 32
    segments:
      - text: >
          Dağlar kibi dalğalar olarnı sarğan vaqıtta, dinni tamamen Allahqa ait qılaraq,
          (ihlâsnen) Oña yalvarırlar. Allah olarnı qarağa çıqararaq, qurtarğan vaqıtta,
          aralarından bir qısmı orta yolnı tutar. Zaten, bizim ayetlerimizni, ancaq nankor
          hainler bilerek inkâr eter. (Ayetteki «orta yolnı tutar» şeklinde mana berilgen
          qısmı içün çeşit tefsirler mevcut. Daa doğru yol, yani iman üzre qaluv, sıqıntı
          anında Allahqa bergen sözge sadaqat kösterüv şeklinde izaatlanmaqta. Bu ayet Ebu
          Cehilniñ oğlu İkrime aqqında nazil olğanı rivayet etilgen. İkrime Mekkeniñ
          fethini taqip eterek, deñiz yolunen qaçmğa areket etken, faqat yolda şiddetli
          bir fırtınağa oğrağan ve bu esanada, yapqanlarından peşmanlıq duyaraq, qurtulğan
          taqdirinde, Resulullahqa barıp, afu soraycağına ait söz bergen. Böylece,
          qurtulğanınen, Az. Peyğamebrniñ uzurına barğan, musulman olğanını bildirgen ve
          bundan soñ ömüriniñ soñuna qadar musulmanlarnıñ safında cihad etken).
        cid: 0
  - verse: 33
    segments:
      - text: >
          Ey, insanlar! Rabbiñizge qarşı kelüvden saqınıñ. Ne babanıñ evlâdı, ne evlâtnıñ
          babası adına bir şey ödep olamaycaq kününden çekiniñ. Biliñ ki, Allahnıñ bergen
          sözü kerçektir. Saqın dünya ayatı sizni aldatmasın ve şeytan Allahnıñ afu
          etüvine işandıraraq, sizni qandırmasın. (Er kesniñ öz qayğısına tüşecek qıyamet
          kününiñ alı aqqında çoq esaslı bilgi bergen bu ayetnen kâfir olğan babasına
          ahirette faydası toquna bilecek ümüdini beslegen bazı mü'minlerge bu imkânnıñ
          olmağanı da bildirilmekte).
        cid: 0
  - verse: 34
    segments:
      - text: >
          Qıyamet vaqıtı aqqındaki bilgi, ancaq Allahnıñ qatındadır. Yağmurnı O yağdırır,
          rahimlerde olğanını O bilir. İç kimse yarın ne qazanacağını bilalmaz. Kene iç
          kimse ne yerde ölecegini bilalmaz. Şübesiz, Allah er şeyni bilicidir, er şeyden
          haberdardır. (İnsanlar bilmegen, yalıñız Allah bilgen şeylerine «ğayb,
          muğayyebaat» denilir. Allahnıñ bildirüvi ile qullarnıñ, meleklerniñ... bularnıñ
          bazılarını bilüvi, olarnı ğayb oluvdan çıqrmaz).
        cid: 0
