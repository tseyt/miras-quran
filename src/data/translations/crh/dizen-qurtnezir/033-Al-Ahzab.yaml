      - text: >-
          (Bu ayette zikr etilgen ve Qur'anda adı keçken tek sahabi zat Zeyd b. Harisedir.
          Balalığında esir tüşken, Az.Hatice onı hızmetkâr olaraq satın alğan. Az.Hatice oña
          ediye etken bu balanı Peyğamberimiz azat etip, evlât etken edi. Resulullah Zeydni
          çoq sever edi. Oña alasınıñ qızı Zeyneb binti Cahışnı nikâhlağan edi. Faqat Zeyneb
          Zeydnen keçinalmadı. Zeyneb, asıllı bir aileden olğanı içün, bir azat olğan
          hızmetkârnen evlenmek istemegen, ancaq bu doğruda vahiy kelgeninen, onıñnen evlengen
          edi. Zeydge bir türlü ısınalmağan, bu sebepten, oña nisbeten asaletinen
          ğururlanuvdan artta qalmağan edi. Zeyd bir müddet daa buña sabır etse de, soñunda
          Allahnıñ Resulına barıp, Zeynebden ayırılmaq istegenini söyledi. Bunıñ üzerine,
          Resulullah hoşnutsızlıqnıñ bitmesi içün, ayırıluvlarını uyğun körse de, bunı Zeydniñ
          yüzüne aytmadı, oña sadece (qadınıñnı yanıñda tut), dedi. Az.Peyğamberniñ içinde
          gizlegen şeyi, Zeynebniñ soñundan özüne zevce olacağını bilgeni alda, bunı
          aytmağanıdır. Bu mevzuda uydurılğan bir taqım iftiralarnıñ esası yoqtır.
          Peyğamberimiz Zeynebniñ güzelligine qızğanı içün evlenmegen. Zeyneb onıñ alasınıñ
          qızı edi ve Peyğamber onı er vaqıt köre edi. İstese, onıñnen Zeydden evel özü evlene
          bilir edi).
        cid: 0
