  - verse: 57
    segments:
      - text: "Allaһ ve Resulını ıncıtqanlarğa Allaһ dünyada ve ahirette lânet etken ve olar içün horlayıcı bir azap azırlağandır. (Bularnıñ, esasen, «Uzeyr Allaһnıñ oğludır, Allaһnıñ eli bağlıdırr, Allaһ faqır, biz zenginmiz», degen yeudiyler; «Mesih - Allaһnıñ oğludır, o uçniñ uçüncisidir», degen hristianlar; «Melekler - Allaһnıñ qızlarıdır, putlar onıñ ortaqlarıdır», degen muşrikler olğanı bildirilgen)."
        cid: 0
  - verse: 58
    segments:
      - text: "Mu’min erkeklerge ve mu’min qadınlarğa, yapmağan bir şeylerinden tolayı, eziyet etkenler, şubesiz bir iftira ve ap-açıq bir gunah arqalağanlardır."
        cid: 0
  - verse: 59
    segments:
      - text: "Ey, Peyğamber! Qadınlarıña, qızlarıña ve mu’minlerniñ qadınlarına (bir itiyac içün tışqa çıqqan vaqıtlarında) tış ortülerini ustlerine aluvlarını söyle. Olarnıñ tanıluvı ve ıncıtılmaması içün, eñ elverişli olğanı budır. Allaһ bağışlayıcıdır, merhametlidir."
        cid: 0
  - verse: 60
    segments:
      - text: "Ant olsun, eki yuzlüler, qalplerinde maraz olğanlar (fuhuş tüşüncesi taşığanlar), şeerde yaman haber yayğanlar (bu allarından) vazgeçmeseler, seni olarğa musallat etermiz (olarnen cenkleşmeñni ve olarnı şeerden sürüp çıqarmañnı saña emir etermiz). Soñ o yerde, seniñ yanıñda ancaq az bir vaqıt qala bilirler."
        cid: 0
  - verse: 61
    segments:
      - text: "Episi de lânetlengen olaraq, ne yerde elge keçirilseler, yaqalanır ve mıtlaqa oldürilirler."
        cid: 0
  - verse: 62
    segments:
      - text: "Allaһnıñ evelden keçkenler aqqındaki qanunı budır. Allaһnıñ qanunında asla bir deñişiklik tapalmazsıñ."
        cid: 0
  - verse: 63
    segments:
      - text: "İnsanlar senden qıyametniñ vaqtını soramaqtalar. De ki: Onıñ bilgisi Allaһ qatındadır. Ne bilirsiñ, belki de vaqtı yaqındır."
        cid: 0
  - verse: 64
    segments:
      - text: "Şu muaqqaq ki, Allaһ kâfirlerni rahmetinden quvğan ve olarğa çılğın bir ateş azırlağandır."
        cid: 0
  - verse: 65
    segments:
      - text: "(Olar) o yerde ebediy qalacaqlar, (olarnı qorçalaycaq) ne bir dost, ne de bir yardımcı tapacaqlar."
        cid: 0
  - verse: 66
    segments:
      - text: "Yuzleri ateşte evrilip-çevirilgen kunü: Ey-vah bizge! Keşke Allaһqa itaat etse edik, Peyğamberge itaat etse edik! derler."
        cid: 0
  - verse: 67
    segments:
      - text: "Ey, Rabbimiz! Biz reberlerimizge ve buyuklerimizge uydıq da, olar bizni yoldan saptırdılar, derler."
        cid: 0
  - verse: 68
    segments:
      - text: "Rabbimiz! Olarğa eki qat azap ber ve olarnı buyuk bir lânetnen rahmetiñden quv."
        cid: 0
  - verse: 69
    segments:
      - text: "Ey, iman etkenler! Siz de Musağa eziyet etkenler kibi olmañ. Niayet, Allaһ onı dedikleri şeyden temizge çıqardı. O, Allaһ yanında şerefli edi. (Az.Musanıñ, qavmınen birlikte soyunıp, yiqanmağanını korgenler, bedeniy bir hastalığı olğanını söyleyerek, onı ıncıttılar. Bir kunü Az.Musa yanğız başına yiqanır eken, urbalarını bir taşnıñ ustüne qoyğan edi. Kiyinmek içün kelgende, taş urbanen areket etip qavmınıñ yanına keldi. Boylece, onda bir hastalıq olmağanını kordiler. Bu iddalarınıñ esassızlığı, oz şaatlıqlarınen, ortağa çıqarıldı. Az.Peyğamber de bir ğanimet taqsimatı esnasında munasebetsiz bir itirazğa oğradı. Ayet bu kibi eziyetlerge işaret eterek, mu’minlerni tenbiyelemekte)."
        cid: 0
  - verse: 70
    segments:
      - text: "Ey, iman etkenler! Allaһtan qorquñ ve doğru söz seyleñ."
        cid: 0
  - verse: 71
    segments:
      - text: "(Boyle davranır ekensiz) Allaһ işleriñizni tüzeltir ve gunahlarıñıznı bağışlar. Kim Allaһ ve Resulına itaat eter ise, buyuk bir qurtulışqa irişken olur."
        cid: 0
  - verse: 72
    segments:
      - text: "Biz emanetni, koklerge, yerge ve dağlarğa teklif ettik de, olar bunı arqalamaqtan çekindiler, (mesuliyetliginden) qorqtılar. Onı insan arqaladı. Doğrusı, o çoq zalım, çoq caildir. (İnsan arqalağan emanet - işlenüvinde savap, terk etilüvinde ceza qazanılğan ibadet ve davranışlarnen, aqıl ve tüşünce qabiliyetidir. Qullıq ve aqıl emanetine riayet etilmez ise, zulum ve bilgisizlikke sapılmış olur. Bu emanetni bermeknen, Allaһ insannı tekliflerinen mesuliyetli tutqan ve boylece, onı imtian etken)."
        cid: 0
  - verse: 73
    segments:
      - text: "(Allaһ bu emanetni insanğa berüv suretinen), munafıq erkeklerge ve munafıq qadınlarğa, muşrik erkeklerge ve muşrik qadınlarğa azap etecek, inanğan erkeklerniñ ve inanğan qadınlarnıñ da tövbesini qabul buyuracaq. Allaһ bağışlayıcıdır, merhamet eticidir. (Şirk - iman ve amel hususında Allaһqa ortaq qoşmaq demektir. Bunı yapqanğa da, muşrik denilir)."
