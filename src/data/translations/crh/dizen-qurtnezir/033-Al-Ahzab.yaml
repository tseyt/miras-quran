        cid: 0
  - verse: 53
    segments:
      - text: "Ey, iman etkenler! Siz vaqtını kozetmeden, bir yemekke davet etilmegence, Peyğamberniñ evlerine kirmeñ. Ancaq, davet etilgen vaqtıñızda kiriñ. Aşnı aşağanıñıznen, aman dağılıñ, subetke dalmañ. Çünki, bu areketiñiz Peyğamberni kederlendirmekte, faqat o (sizge bunı söylemekten) utanmaqta. Amma, Allaһ haqnı söylemekten çekinmez. Peyğamberniñ qadınlarından bir şey istegen vaqtıñızda, perde artından isteñ. Bu, em siziñ qalpleriñiz, em de olarnıñ qalpleri içün daa temiz bir davranıştır. Siz Allaһnıñ Resulını kederlendirüviñiz ve ozünden soñ onıñ qadınlarını nikâhlamañız, asla caiz olamaz. Çünki, bu Allaһ qatında buyuk (bir gunah)tır. (Bu ayet Az.Peyğamberniñ evine aştan evel kelgen, aş azır olğanğa qadar beklegen, aştan soñ da, turıp ketmegenler aqqında nazil olğan. Ayet-i kerime musulmanlarnıñ Resulullahqa ve hane-i saadetke nisbeten nasıl davranacaqlarını, bir-birilerine nisbeten nasıl muamele eteceklerini bildirmekte. Buña kore, bir kimseniñ, başqasını raatsız etmemesi, evinde uzur ve istiraatını bozmaması, davet etilgeninde, belgilenilgen vaqıttan evel barmaması, aştan soñ, ziyade oturmaması kerektir)."
        cid: 0
  - verse: 54
    segments:
