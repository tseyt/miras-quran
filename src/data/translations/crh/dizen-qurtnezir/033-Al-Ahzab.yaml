        cid: 0
  - verse: 28
    segments:
      - text: "Ey, Peyğamber! Qadınlarına boyle söyle: Eger dünya tiriligini ve ziynetini (ferahını) istey iseñiz, keliñ, sizge ayırıluv aqlarıñıznı bereyim de, sizni guzelliknen ayırayım. (Ayet nazil olğan vaqıtlarda, artıq Az.Peyğamber aman-aman butün Arabistanğa akim vaziyette edi. İçtimaiy ayatta buyuk deñişüvler meydanğa kelgen edi. Artıq faqırlıq yerine ferah ortalıqnı qaplamaqta edi. Bu şartlar altında Az.Peyğamberniñ qadınları da, umumiy ferahtan pay aluvnı arzulayaraq, Resulullahtan bazı ziynet eşyalarnı ve daa yahşı bir keçinüv istegen ediler. İşte, bu sırada kelgen vahiy, Az.Peyğamberge, kene eskisi kibi, sadelikten ayrılmamasını emir etti. Boyle bir emir, dünya ayatına hırslı, er keçken kun kuçüne kuç, servetine servet qoşmaq içün talaşqan malperest bir insan tarafından tebliğ etilmez edi. Eger Resulullah qadınlarına da, bu umumiy ferahnı teminlegen olsa edi, eñ kuçük bir itiraznen qarşılaşmaz edi. Lâkin, Resul-ı Ekrem yaşayışını ve yaşayışınıñ sadeligini asla deñiştirmeycek edi. Cemiyetniñ yaşayışında ne qadar deñişiklik olsa-olsun, dünyanıñ keçici ziynetleri Resulullahnıñ evinde yer almaycaq, peyğamberlik hanesi, dünya ziynetinden uzaq, iqtidar saiplerine ornek olacaq edi. Az.Peyğamberniñ qadınları tarafından bildirilgen istekler uzerine nazil olğan bu ayetke «Tahyiir» (serbest bıraquv) ayeti denilir. Neticede, qadınları ferah ve ziynet yerine Az.Peyğamberni ustün korgenler)."
        cid: 0
