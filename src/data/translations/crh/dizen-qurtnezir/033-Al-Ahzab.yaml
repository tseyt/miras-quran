surah_id: 33
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "Ey, Peyğamber! Allaһtan qorq, kâfirlerge ve munafıqarğa boyun egme. Elbette, Allaһ er şeyni bilmekte ve yerli-yerince yapmaqta."
        cid: 0
  - verse: 2
    segments:
      - text: "Rabbiñden saña vahiy etilgenge uy. Şubesiz, Allaһ butün yapqanlarıñızdan haberdardır."
        cid: 0
  - verse: 3
    segments:
      - text: "Allaһqa işan. Vekil olaraq Allaһ yeter."
        cid: 0
  - verse: 4
    segments:
      - text: "Allaһ adamnıñ içinde eki yurek yaratmağanı kibi, «zıhaar» yapqan qadınlarıñıznı da, analarıñız yerinde tutmadı ve evlâtlıqlarıñıznı da, oz oğullarıñız olaraq tanımadı. Bular siziñ ağızlarıñızğa kele qoygan sözlerden ibarettir. Allaһ ise, aqiqatnı söyley ve doğru yolğa O iriştirir. (Araplar arasındaki bir adetke kore, bir adam qadınına «sen maña anamnıñ sırtı kibisiñ» dedimi, o qadın oz anası kibi sayıla ve artıq o adam oña yanaşalmaz edi. İşte, buña «zıhaar» denilir edi. Ayette bir insanda eki yurekniñ olmağanı kibi, em analıq, em qadınlıq, em başqa soydan evlâtlıq, em aqiqiy oğul oluv vasfınıñ birleşalmaycağı añlatılmaqta. Qur’an araplardaki bu eki adetni (zıhaar ve evlâtlıqnı) tanımağan. Zıhaar yapıluvı alında, ceza olmaq uzre «keffaaret» ukümi ketirilgen (baq. Mucaadele, 58/1-4). Ayette araplar arasında aqıll adamlarnıñ eki yurek taşığanı yolundaki inançqa işaret olunğanı da bazı tefsirlerde bildirilmekte)."
        cid: 0
  - verse: 5
    segments:
      - text: "Olarnı (evlât etkenleriñizni) babalarına nisbet eterek çağırıñ. Allaһ yanında eñ doğrusı budır. Eger babalarınıñ kim olğanını bilmeseñiz, o taqdirde, olarnı din qardaşlarıñız ve korüp-kozetken kimseler olaraq qabul etiñ. Yañılaraq yapqanlarıñızda sizge vebal yoq; faqat qalpleriñizniñ bile-bile yonelgeninde gunah bar. Allaһ bağışlayıcıdır, merhametlidir."
        cid: 0
  - verse: 6
    segments:
      - text: "Peyğamber mu’minlerge oz canlarından daa yaqındır. Qadınları olarnıñ analarıdır. Aqaraba olğanlar, Allaһnıñ Kitabına kore, (mirasçılıq noqtai nazarından) bir-birilerine diger mu’minlerden ve muhacirlerden daa yaqındır; ancaq dostlarıñızğa uyğun bir vasiyet yapuvıñız istisnadır. Bular Kitapta yazılı bulunmaqtadır. (Evelleri mu’minler bir aile kibi, bir-birilerine mirasçı ola ekenler; bu ayetnen mirasçılıqta aqrabalıqqa birincilik berilgen)."
        cid: 0
  - verse: 7
    segments:
      - text: "O vaqıtta biz peyğamberlerden söz alğan edik; senden, Nuһtan, İbrahimden, Musadan ve Meryem oğlu İsadan da. (Ebet) biz olardan pek sağlam bir söz aldıq."
        cid: 0
  - verse: 8
    segments:
      - text: "Allaһ bu sözni doğrularnı doğrulıqları ile mesuliyetli yapmaq içün aldı. Kâfirler içün de, çoq elem berici bir azap azırladı. (İcertniñ beşinci yılında Qureyş ve Ğatafaan qabileleri toplu olup, Medine uzerine yurgenler; musulmanlarnen ittifaqı bulunğan Medinedeki Beni Qureyza qabilesi de hıyanetlik eterek, olarnen birleşken. Boylece, duşman ordusınıñ sayısı 12.000 adamğa barğan. Az. Peyğamber keñyeşerek, araplarda adet olmağan bir cenk taktikası işlep çıqa: Medine etrafına endek qazdıra ve askerlerini endekten çıqqan topraqlarnıñ artına yerleştire. Duşman endekten keçalmay, bir ay qadar sürgen sarım sırasında, yardım alalmağan musulmanlar bunalğan ediler. İşte, bu vaziyette bir mucize meydanğa keldi: Birden ortağa çıqqan suvuq bir fırtına duşman çadırlarını söke, ateşlerni söndüre, atlarnı urküte, duşmannı tozğa boğa. Musulman askerleriniñ etrafında saipleri korülmegen seslerden tekbirler eşitile. Soñunda duşman perişan ola, çekilip kete. Daa soñra Beni Qureyza qabilesinden de, bu hiyanetlikleriniñ esabı soraldı. İşte, aşağıdaki ayetlerniñ bu vaqia aqqında nazil olğanı rivayet etilmekte)."
        cid: 0
  - verse: 9
    segments:
      - text: "Ey, iman etkenler! Allaһnıñ sizge olğan nimetini hatırlañ; o vaqıtta sizge ordular bastırğan edi de, biz olarğa qarşı bir ruzgâr ve siz kormegen ordular yollağan edik. Allaһ ne yapqanıñıznı çoq eyi kormekte edi."
        cid: 0
  - verse: 10
    segments:
      - text: "Olar em yuqarıñızdan, em aşağı tarafıñızdan (vadiniñ ustünden ve altından) ustüñizge yurgen vaqıtlarında; kozler patlağan, yurekler ğırtlaqqa kelgen ve siz Allaһ aqqında türlü-türlü şeyler tüşüngen vaqtıñızda;"
        cid: 0
  - verse: 11
    segments:
      - text: "İşte, o yerde iman saipleri imtiandan keçirilgen ve şiddetli bir sarsıntığa oğratılğan ediler."
        cid: 0
  - verse: 12
    segments:
      - text: "Ve o zaman, munafıqlarnen qalplerinde maraz (iman zayıflığı) olğanlar: Meger Allaһ ve Resulı bizge sadece quru vadelerde bulunğanlar! dey ediler. (Rivayetke kore, olardan biri, «Muһammed em bizge İran ve Vizantiyanıñ fethini vade etmekte, em de biz qorqumızdan meydanğa çıqalmayıp, endek qazamız», degen edi)."
        cid: 0
  - verse: 13
    segments:
      - text: "Olardan bir topu da degen edi ki: Ey, Yesribliler (medineliler)! Artıq siz içün toqtamaqnıñ sırası degil, aydı, qaytıñ! Aralarından bir qısmı ise: aqiqaten evlerimiz emniyette degil, diyerek Peyğamberden izin istey edi; albuki, evleri telükede degil edi, sadece qaçmaq istey ediler."
        cid: 0
  - verse: 14
    segments:
      - text: "Medineniñ er tarafından ustlerine bastırılsa edi de, o zaman cenkleşüvleri istenilse edi, şubesiz aman cenkke qatılır ve evlerinde pek eglenmez ediler. (Ayet «… Eger fitne çıqaruvları (dinden dönüvleri) istenilse edi, bunı aman yapar ediler» şeklinde de manalandırılmaqta)."
        cid: 0
  - verse: 15
    segments:
      - text: "Ant olsun ki, daa evel olar, arqa çevirip qayçmaycaqlarına dair, Allaһqa söz bergen ediler. Allaһqa berilgen söz mesuliyetni kerektirir!"
        cid: 0
  - verse: 16
    segments:
      - text: "(Resulım!) De ki: Eger olümden ya da oldürilüvden qaçsañız, qaçmaqnıñ sizge asla faydası olmaz! (Eceliñiz kelmegen ise) o taqdirde de, yaşatılacaq muddetiñiz çoq degil."
        cid: 0
  - verse: 17
    segments:
      - text: "De ki: Allaһ sizge bir yamanlıq istese, Oña qarşı sizni kim qorçalar; ya da sizge rahmet istese, (sizge kim zarar bere bilir)? Olar, ozlerine Allaһtan başqa ne bir dost taparlar, ne de bir yardımcı."
        cid: 0
  - verse: 18
    segments:
      - text: "Allaһ, arañızdan (cenkten) toqtatqanlarnı ve qardaşlarına: «Bizge qoşulıñ», degenlerni aqiqaten bilmekte. Zaten, bularnıñ pek azı cenkke kelir."
        cid: 0
  - verse: 19
    segments:
      - text: "(Kelseler de) sizge nisbeten pek hasistirler. Bir de qorqu kelip çattımı, uzerine olüm bayğınlığı çökken kibi, kozleri dönerek, saña baqqanlarını korersiñ. Qorqu ketkeninen ise, malğa hırs kostererek, sizni keskin demir tillerinen ıncıtırlar. Olar iman etmiş degiller; bunıñ içün Allaһ olarnıñ yapqanlarını boşuna çıqarğandır. Bu, Allaһqa kore qolaydır. («Qorqu ketkeninen ise…», diye başlanğan cumle aşağıdaki şekillerde de izaatlana bilir: «… çoq hayırsever adamlar tavrınen sizni keskin tillerinen ıncjıtırlar», «… mal hırsından mulâyim sözlernen sizge soqulırlar»)."
        cid: 0
  - verse: 20
    segments:
      - text: "Bular, duşman birlikleriniñ dağılıp ketmegenleri vaimesindedirler. Muttefiqler ordusı kene kelecek olsa, isterler ki, çölde koçebe araplar arasında olsunlar da, siziñ haberleriñizni (uzaqtan) sorasınlar. Zaten, arañızda olsalar bile, pek cenkleşecek degil ediler."
        cid: 0
  - verse: 21
    segments:
      - text: "Ant olsun ki, Resulullah, siz içün, Allaһqa ve ahiret kunüne qavuşmaqnı umüt etkenler ve Allaһnı çoq zikr etkenler içün, guzel bir ornektir. (Ayette Az.Peyğamberniñ Allaһ hoşnutlığını qazandıracjj davranışlarda bulunmaq istegenler içün, mukemmel ve canl bir ornek, eñ buyuk fazilet numünesi olğanı añlatılmaqta. Boylece, Resulullahnıñ islerine mağlüp insanlarnı memnun etmek ve olarğa ameliy degerden marum bir taqım nazariy qaideler ogretmeknen vazifedar olmayıp, onıñ ğayesi, insanlıqqa ameliy qaideler ogretmek ve bu qaidelerni oz yaşayışınen kostermek ve tarif etmek olğanı añlaşıla. Bunıñ kibi, onıñ ayatı ve faaliyeti talil etilgende, bu noqta asla kozden qaçırılmamalıdır)."
        cid: 0
  - verse: 22
    segments:
      - text: "Mu’minler ise, duşman birliklerini korgenlerinde: İşte, Allaһ ve Resulınıñ bizge vade etkeni! Allaһ ve Resulı doğru söylegen, dediler. Bu (ordularnıñ kelişi), olarnıñ ancaq imanlarını ve Allaһqa bağlılıqlarını arttırdı. (Allaһ biraz qıyınlıq ve sıqıntığa qatlanğandan soñ, zaferniñ mu’minlerge ait olacağını mujdelegen; Az.Peyğamber de, muttefiq ordularnıñ qısqa bir muddetten soñ kelecegini, biraz sıqıntıdan soñra, neticeniñ mu’minler faydasına al olacağını haber bergen edi. İşte, bu yerde bu vadelerge yurekten inanğan mu’minlerniñ teslimiyetine işaret olunmaqta)."
        cid: 0
  - verse: 23
    segments:
      - text: "Mu’minler arasında Allaһqa bergen sözlerinde turğan nice erkekler bar. İşte, olardan kimi sözüni yerine ketirip, o yolda canını bergen; kimi de (şeitlikni) beklemekte. Olar iç bir şekilde (sözlerini) deñiştirmegenlerdir."
        cid: 0
  - verse: 24
    segments:
      - text: "Çünki, Allaһ sadaqat kostergenlerni, sadaqatları sebebinden, mukâfatlandıracaq, munafıqlarğa -ister ise- azap etecek yahut da (tövbe etseler) tövbelerini qabul etecek. Şubesiz, Allaһ bağışlayıcıdar, merhametlidir."
        cid: 0
  - verse: 25
    segments:
      - text: "Allaһ, o inkâr etkenlerni, iç bir fayda elde etalmadan, opkelerinen keri çevirdi. Allaһ(nıñ yardımı) cenkte mu’minlerge yetti. Allaһ kuçlüdir, mutlaq ğaliptir."
        cid: 0
  - verse: 26
    segments:
      - text: "Allaһ ehl-i kitaptan, olarğa (muşrik ordularına) yardım etkenlerni qalelerinden endirdi ve qalplerine qorqu tüşürdi; Bir qısmını oldüre, bir qısmını da esir ala ediñiz. (Muşrik qabileler ketkenden soñ, kelgen vahiyge binaen, Az.Peyğamber musulmanlarnen olğan ahtlarını bozup, hainlik etken Beni Qureyza adlı yeudiy qabilesi ustüne yurdi. Musulmanlar 25 kun qadar qureyzalılarnıñ qalesini sardılar. Soñunda qale musulmanlarnıñ eline keçti)."
        cid: 0
