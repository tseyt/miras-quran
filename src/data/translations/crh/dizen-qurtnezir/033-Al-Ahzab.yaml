      - text: >-
          (İcertniñ beşinci yılında Qureyş ve Ğatafaan qabileleri toplu olup, Medine üzerine
          yürgenler; musulmanlarnen ittifaqı bulunğan Medinedeki Beni Qureyza qabilesi de
          hıyanetlik eterek, olarnen birleşken. Böylece, duşman ordusınıñ sayısı 12.000 adamğa
          barğan. Az. Peyğamber keñeşerek, araplarda adet olmağan bir cenk taktikası işlep
          çıqa: Medine etrafına endek qazdıra ve askerlerini endekten çıqqan topraqlarnıñ
          artına yerleştire. Duşman endekten keçalmay, bir ay qadar sürgen sarım sırasında,
          yardım alalmağan musulmanlar bunalğan ediler. İşte, bu vaziyette bir mucize meydanğa
          keldi: Birden ortağa çıqqan suvuq bir fırtına duşman çadırlarını söke, ateşlerni
          söndüre, atlarnı ürküte, duşmannı tozğa boğa. Musulman askerleriniñ etrafında
          saipleri körülmegen seslerden tekbirler eşitile. Soñunda duşman perişan ola, çekilip
          kete. Daa soñra Beni Qureyza qabilesinden de, bu hiyanetlikleriniñ esabı soraldı.
          İşte, aşağıdaki ayetlerniñ bu vaqia aqqında nazil olğanı rivayet etilmekte).
