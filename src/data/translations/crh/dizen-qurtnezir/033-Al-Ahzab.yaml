      - text: >-
          (Ayet nazil olğan vaqıtlarda, artıq Az.Peyğamber aman-aman bütün Arabistanğa akim
          vaziyette edi. İçtimaiy ayatta büyük deñişüvler meydanğa kelgen edi. Artıq faqırlıq
          yerine ferah ortalıqnı qaplamaqta edi. Bu şartlar altında Az.Peyğamberniñ qadınları
          da, umumiy ferahtan pay aluvnı arzulayaraq, Resulullahtan bazı ziynet eşyalarnı ve
          daa yahşı bir keçinüv istegen ediler. İşte, bu sırada kelgen vahiy, Az.Peyğamberge,
          kene eskisi kibi, sadelikten ayrılmamasını emir etti. Böyle bir emir, dünya ayatına
          hırslı, er keçken kün küçüne küç, servetine servet qoşmaq içün talaşqan malperest
          bir insan tarafından tebliğ etilmez edi. Eger Resulullah qadınlarına da, bu umumiy
          ferahnı teminlegen olsa edi, eñ küçük bir itiraznen qarşılaşmaz edi. Lâkin, Resul-ı
          Ekrem yaşayışını ve yaşayışınıñ sadeligini asla deñiştirmeycek edi. Cemiyetniñ
          yaşayışında ne qadar deñişiklik olsa-olsun, dünyanıñ keçici ziynetleri Resulullahnıñ
          evinde yer almaycaq, peyğamberlik hanesi, dünya ziynetinden uzaq, iqtidar saiplerine
          örnek olacaq edi. Az.Peyğamberniñ qadınları tarafından bildirilgen istekler üzerine
          nazil olğan bu ayetke «Tahyiir» (serbest bıraquv) ayeti denilir. Neticede, qadınları
          ferah ve ziynet yerine Az.Peyğamberni üstün körgenler).
        cid: 0
