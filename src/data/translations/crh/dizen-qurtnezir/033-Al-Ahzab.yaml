      - text: >-
          (Araplar arasındaki bir adetke köre, bir adam qadınına «sen maña anamnıñ sırtı
          kibisiñ» dedimi, o qadın öz anası kibi sayıla ve artıq o adam oña yanaşalmaz edi.
          İşte, buña «zıhaar» denilir edi. Ayette bir insanda eki yürekniñ olmağanı kibi, em
          analıq, em qadınlıq, em başqa soydan evlâtlıq, em aqiqiy oğul oluv vasfınıñ
          birleşalmaycağı añlatılmaqta. Qur'an araplardaki bu eki adetni (zıhaar ve
          evlâtlıqnı) tanımağan. Zıhaar yapıluvı alında, ceza olmaq üzre «keffaaret» ükümi
          ketirilgen (baq. Mucaadele, 58/1-4). Ayette araplar arasında aqıllı adamlarnıñ eki
          yürek taşığanı yolundaki inançqa işaret olunğanı da bazı tefsirlerde bildirilmekte).
