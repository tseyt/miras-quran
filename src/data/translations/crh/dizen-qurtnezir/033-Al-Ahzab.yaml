        cid: 0
  - verse: 33
    segments:
      - text: "Evleriñizde oturıñ, eski cahiliye adetinde olğanı kibi, açılıp-saçılmañ. Namaz qılıñ, zekât beriñ, Allaһqa ve Resulına itaat etiñ.Ey, ehl-i Beyt! Allaһ sizden sadece gunahnı ketkizmek ve sizni ter-temiz yapmaq istemekte. (Ayette hitap etilgen ehl-i Beyt, Resulullahnıñ ev halqıdır. Ehl-i Beyt hususında eñ uyğun noqtai nazar şu: Allaһ Resulınıñ evlâtları, qadınları, torunları Asan ve Usein ve kiyevi Az.Ali ehl-i Beytni teşkil eterler)."
        cid: 0
  - verse: 34
    segments:
