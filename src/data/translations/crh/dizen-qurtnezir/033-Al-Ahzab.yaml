surah_id: 33
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >
          Ey, Peyğamber! Allahtan qorq, kâfirlerge ve munafıqarğa boyun egme. Elbette,
          Allah er şeyni bilmekte ve yerli-yerince yapmaqta.
        cid: 0
  - verse: 2
    segments:
      - text: >
          Rabbiñden saña vahiy etilgenge uy. Şübesiz, Allah bütün yapqanlarıñızdan
          haberdardır.
        cid: 0
  - verse: 3
    segments:
      - text: >
          Allahqa işan. Vekil olaraq Allah yeter.
        cid: 0
  - verse: 4
    segments:
      - text: >
          Allah adamnıñ içinde eki yürek yaratmağanı kibi, «zıhaar» yapqan qadınlarıñıznı
          da, analarıñız yerinde tutmadı ve evlâtlıqlarıñıznı da, öz oğullarıñız olaraq
          tanımadı. Bular siziñ ağızlarıñızğa kele qoygan sözlerden ibarettir. Allah ise,
          aqiqatnı söyley ve doğru yolğa O iriştirir. (Araplar arasındaki bir adetke köre,
          bir adam qadınına «sen maña anamnıñ sırtı kibisiñ» dedimi, o qadın öz anası kibi
          sayıla ve artıq o adam oña yanaşalmaz edi. İşte, buña «zıhaar» denilir edi.
          Ayette bir insanda eki yürekniñ olmağanı kibi, em analıq, em qadınlıq, em başqa
          soydan evlâtlıq, em aqiqiy oğul oluv vasfınıñ birleşalmaycağı añlatılmaqta.
          Qur'an araplardaki bu eki adetni (zıhaar ve evlâtlıqnı) tanımağan. Zıhaar
          yapıluvı alında, ceza olmaq üzre «keffaaret» ükümi ketirilgen (baq. Mucaadele,
          58/1-4). Ayette araplar arasında aqıllı adamlarnıñ eki yürek taşığanı yolundaki
          inançqa işaret olunğanı da bazı tefsirlerde bildirilmekte).
        cid: 0
  - verse: 5
    segments:
      - text: >
          Olarnı (evlât etkenleriñizni) babalarına nisbet eterek çağırıñ. Allah yanında eñ
          doğrusı budır. Eger babalarınıñ kim olğanını bilmeseñiz, o taqdirde, olarnı din
          qardaşlarıñız ve körüp-közetken kimseler olaraq qabul etiñ. Yañılaraq
          yapqanlarıñızda sizge vebal yoq; faqat qalpleriñizniñ bile-bile yönelgeninde
          günah bar. Allah bağışlayıcıdır, merhametlidir.
        cid: 0
  - verse: 6
    segments:
      - text: >
          Peyğamber mü'minlerge öz canlarından daa yaqındır. Qadınları olarnıñ analarıdır.
          Aqaraba olğanlar, Allahnıñ Kitabına köre, (mirasçılıq noqtai nazarından)
          bir-birilerine diger mü'minlerden ve muhacirlerden daa yaqındır; ancaq
          dostlarıñızğa uyğun bir vasiyet yapuvıñız istisnadır. Bular Kitapta yazılı
          bulunmaqtadır. (Evelleri mü'minler bir aile kibi, bir-birilerine mirasçı ola
          ekenler; bu ayetnen mirasçılıqta aqrabalıqqa birincilik berilgen).
        cid: 0
  - verse: 7
    segments:
      - text: >
          O vaqıtta biz peyğamberlerden söz alğan edik; senden, Nuhtan, İbrahimden,
          Musadan ve Meryem oğlu İsadan da. (Ebet) biz olardan pek sağlam bir söz aldıq.
        cid: 0
  - verse: 8
    segments:
      - text: >
          Allah bu sözni doğrularnı doğrulıqları ile mesuliyetli yapmaq içün aldı.
          Kâfirler içün de, çoq elem berici bir azap azırladı. (İcertniñ beşinci yılında
          Qureyş ve Ğatafaan qabileleri toplu olup, Medine üzerine yürgenler;
          musulmanlarnen ittifaqı bulunğan Medinedeki Beni Qureyza qabilesi de hıyanetlik
          eterek, olarnen birleşken. Böylece, duşman ordusınıñ sayısı 12.000 adamğa
          barğan. Az. Peyğamber keñeşerek, araplarda adet olmağan bir cenk taktikası işlep
          çıqa: Medine etrafına endek qazdıra ve askerlerini endekten çıqqan topraqlarnıñ
          artına yerleştire. Duşman endekten keçalmay, bir ay qadar sürgen sarım
          sırasında, yardım alalmağan musulmanlar bunalğan ediler. İşte, bu vaziyette bir
          mucize meydanğa keldi: Birden ortağa çıqqan suvuq bir fırtına duşman çadırlarını
          söke, ateşlerni söndüre, atlarnı ürküte, duşmannı tozğa boğa. Musulman
          askerleriniñ etrafında saipleri körülmegen seslerden tekbirler eşitile. Soñunda
          duşman perişan ola, çekilip kete. Daa soñra Beni Qureyza qabilesinden de, bu
          hiyanetlikleriniñ esabı soraldı. İşte, aşağıdaki ayetlerniñ bu vaqia aqqında
          nazil olğanı rivayet etilmekte).
        cid: 0
  - verse: 9
    segments:
      - text: >
          Ey, iman etkenler! Allahnıñ sizge olğan nimetini hatırlañ; o vaqıtta sizge
          ordular bastırğan edi de, biz olarğa qarşı bir rüzgâr ve siz körmegen ordular
          yollağan edik. Allah ne yapqanıñıznı çoq eyi körmekte edi.
        cid: 0
  - verse: 10
    segments:
      - text: >
          Olar em yuqarıñızdan, em aşağı tarafıñızdan (vadiniñ üstünden ve altından)
          üstüñizge yürgen vaqıtlarında; közler patlağan, yürekler ğırtlaqqa kelgen ve siz
          Allah aqqında türlü-türlü şeyler tüşüngen vaqtıñızda;
        cid: 0
  - verse: 11
    segments:
      - text: >
          İşte, o yerde iman saipleri imtiandan keçirilgen ve şiddetli bir sarsıntığa
          oğratılğan ediler.
        cid: 0
  - verse: 12
    segments:
      - text: >
          Ve o zaman, munafıqlarnen qalplerinde maraz (iman zayıflığı) olğanlar: Meger
          Allah ve Resulı bizge sadece quru vadelerde bulunğanlar! dey ediler. (Rivayetke
          köre, olardan biri, «Muhammed em bizge İran ve Vizantiyanıñ fethini vade
          etmekte, em de biz qorqumızdan meydanğa çıqalmayıp, endek qazamız», degen edi).
        cid: 0
  - verse: 13
    segments:
      - text: >
          Olardan bir topu da degen edi ki: Ey, Yesribliler (medineliler)! Artıq siz içün
          toqtamaqnıñ sırası degil, aydı, qaytıñ! Aralarından bir qısmı ise: aqiqaten
          evlerimiz emniyette degil, diyerek Peyğamberden izin istey edi; albuki, evleri
          telükede degil edi, sadece qaçmaq istey ediler.
        cid: 0
  - verse: 14
    segments:
      - text: >
          Medineniñ er tarafından üstlerine bastırılsa edi de, o zaman cenkleşüvleri
          istenilse edi, şübesiz aman cenkke qatılır ve evlerinde pek eglenmez ediler.
          (Ayet «... Eger fitne çıqaruvları (dinden dönüvleri) istenilse edi, bunı aman
          yapar ediler» şeklinde de manalandırılmaqta).
        cid: 0
  - verse: 15
    segments:
      - text: >
          Ant olsun ki, daa evel olar, arqa çevirip qayçmaycaqlarına dair, Allahqa söz
          bergen ediler. Allahqa berilgen söz mesuliyetni kerektirir!
        cid: 0
  - verse: 16
    segments:
      - text: >
          (Resulım!) De ki: Eger ölümden ya da öldürilüvden qaçsañız, qaçmaqnıñ sizge asla
          faydası olmaz! (Eceliñiz kelmegen ise) o taqdirde de, yaşatılacaq müddetiñiz çoq
          degil.
        cid: 0
  - verse: 17
    segments:
      - text: >
          De ki: Allah sizge bir yamanlıq istese, Oña qarşı sizni kim qorçalar; ya da
          sizge rahmet istese, (sizge kim zarar bere bilir)? Olar, özlerine Allahtan başqa
          ne bir dost taparlar, ne de bir yardımcı.
        cid: 0
  - verse: 18
    segments:
      - text: >
          Allah, arañızdan (cenkten) toqtatqanlarnı ve qardaşlarına: «Bizge qoşulıñ»,
          degenlerni aqiqaten bilmekte. Zaten, bularnıñ pek azı cenkke kelir.
        cid: 0
  - verse: 19
    segments:
      - text: >
          (Kelseler de) sizge nisbeten pek hasistirler. Bir de qorqu kelip çattımı,
          üzerine ölüm bayğınlığı çökken kibi, közleri dönerek, saña baqqanlarını
          körersiñ. Qorqu ketkeninen ise, malğa hırs köstererek, sizni keskin demir
          tillerinen ıncıtırlar. Olar iman etmiş degiller; bunıñ içün Allah olarnıñ
          yapqanlarını boşuna çıqarğandır. Bu, Allahqa köre qolaydır. («Qorqu ketkeninen
          ise...», diye başlanğan cumle aşağıdaki şekillerde de izaatlana bilir: «... çoq
          hayırsever adamlar tavrınen sizni keskin tillerinen ıncıtırlar», «... mal
          hırsından mulâyim sözlernen sizge soqulırlar»).
        cid: 0
  - verse: 20
    segments:
      - text: >
          Bular, duşman birlikleriniñ dağılıp ketmegenleri vaimesindedirler. Muttefiqler
          ordusı kene kelecek olsa, isterler ki, çölde köçebe araplar arasında olsunlar
          da, siziñ haberleriñizni (uzaqtan) sorasınlar. Zaten, arañızda olsalar bile, pek
          cenkleşecek degil ediler.
        cid: 0
  - verse: 21
    segments:
      - text: >
          Ant olsun ki, Resulullah, siz içün, Allahqa ve ahiret kününe qavuşmaqnı ümüt
          etkenler ve Allahnı çoq zikr etkenler içün, güzel bir örnektir. (Ayette
          Az.Peyğamberniñ Allah hoşnutlığını qazandıracaq davranışlarda bulunmaq
          istegenler içün, mükemmel ve canlı bir örnek, eñ büyük fazilet nümünesi olğanı
          añlatılmaqta. Böylece, Resulullahnıñ islerine mağlüp insanlarnı memnun etmek ve
          olarğa ameliy degerden marum bir taqım nazariy qaideler ögretmeknen vazifedar
          olmayıp, onıñ ğayesi, insanlıqqa ameliy qaideler ögretmek ve bu qaidelerni öz
          yaşayışınen köstermek ve tarif etmek olğanı añlaşıla. Bunıñ kibi, onıñ ayatı ve
          faaliyeti talil etilgende, bu noqta asla közden qaçırılmamalıdır).
        cid: 0
  - verse: 22
    segments:
      - text: >
          Mü'minler ise, duşman birliklerini körgenlerinde: İşte, Allah ve Resulınıñ bizge
          vade etkeni! Allah ve Resulı doğru söylegen, dediler. Bu (ordularnıñ kelişi),
          olarnıñ ancaq imanlarını ve Allahqa bağlılıqlarını arttırdı. (Allah biraz
          qıyınlıq ve sıqıntığa qatlanğandan soñ, zaferniñ mü'minlerge ait olacağını
          müjdelegen; Az.Peyğamber de, muttefiq ordularnıñ qısqa bir müddetten soñ
          kelecegini, biraz sıqıntıdan soñra, neticeniñ mü'minler faydasına al olacağını
          haber bergen edi. İşte, bu yerde bu vadelerge yürekten inanğan mü'minlerniñ
          teslimiyetine işaret olunmaqta).
        cid: 0
  - verse: 23
    segments:
      - text: >
          Mü'minler arasında Allahqa bergen sözlerinde turğan nice erkekler bar. İşte,
          olardan kimi sözüni yerine ketirip, o yolda canını bergen; kimi de (şeitlikni)
          beklemekte. Olar iç bir şekilde (sözlerini) deñiştirmegenlerdir.
        cid: 0
  - verse: 24
    segments:
      - text: >
          Çünki, Allah sadaqat köstergenlerni, sadaqatları sebebinden, mükâfatlandıracaq,
          munafıqlarğa -ister ise- azap etecek yahut da (tövbe etseler) tövbelerini qabul
          etecek. Şübesiz, Allah bağışlayıcıdar, merhametlidir.
        cid: 0
  - verse: 25
    segments:
      - text: >
          Allah, o inkâr etkenlerni, iç bir fayda elde etalmadan, öpkelerinen keri
          çevirdi. Allah(nıñ yardımı) cenkte mü'minlerge yetti. Allah küçlüdir, mutlaq
          ğaliptir.
        cid: 0
  - verse: 26
    segments:
      - text: >
          Allah ehl-i kitaptan, olarğa (müşrik ordularına) yardım etkenlerni qalelerinden
          endirdi ve qalplerine qorqu tüşürdi; Bir qısmını öldüre, bir qısmını da esir ala
          ediñiz. (Müşrik qabileler ketkenden soñ, kelgen vahiyge binaen, Az.Peyğamber
          musulmanlarnen olğan ahtlarını bozup, hainlik etken Beni Qureyza adlı yeudiy
          qabilesi üstüne yürdi. Musulmanlar 25 kün qadar qureyzalılarnıñ qalesini
          sardılar. Soñunda qale musulmanlarnıñ eline keçti).
        cid: 0
  - verse: 27
    segments:
      - text: >
          Allah, olarnıñ yerlerine, yurtlarına, mallarına ve ayaq basmadığıñız topraqlarğa
          sizni mirasçı yaptı. Allahnıñ er şeyge küçü yeter.
        cid: 0
  - verse: 28
    segments:
      - text: >
          Ey, Peyğamber! Qadınlarıña böyle söyle: Eger dünya tiriligini ve ziynetini
          (ferahını) istey iseñiz, keliñ, sizge ayırıluv aqlarıñıznı bereyim de, sizni
          güzelliknen ayırayım. (Ayet nazil olğan vaqıtlarda, artıq Az.Peyğamber aman-aman
          bütün Arabistanğa akim vaziyette edi. İçtimaiy ayatta büyük deñişüvler meydanğa
          kelgen edi. Artıq faqırlıq yerine ferah ortalıqnı qaplamaqta edi. Bu şartlar
          altında Az.Peyğamberniñ qadınları da, umumiy ferahtan pay aluvnı arzulayaraq,
          Resulullahtan bazı ziynet eşyalarnı ve daa yahşı bir keçinüv istegen ediler.
          İşte, bu sırada kelgen vahiy, Az.Peyğamberge, kene eskisi kibi, sadelikten
          ayrılmamasını emir etti. Böyle bir emir, dünya ayatına hırslı, er keçken kün
          küçüne küç, servetine servet qoşmaq içün talaşqan malperest bir insan tarafından
          tebliğ etilmez edi. Eger Resulullah qadınlarına da, bu umumiy ferahnı teminlegen
          olsa edi, eñ küçük bir itiraznen qarşılaşmaz edi. Lâkin, Resul-ı Ekrem
          yaşayışını ve yaşayışınıñ sadeligini asla deñiştirmeycek edi. Cemiyetniñ
          yaşayışında ne qadar deñişiklik olsa-olsun, dünyanıñ keçici ziynetleri
          Resulullahnıñ evinde yer almaycaq, peyğamberlik hanesi, dünya ziynetinden uzaq,
          iqtidar saiplerine örnek olacaq edi. Az.Peyğamberniñ qadınları tarafından
          bildirilgen istekler üzerine nazil olğan bu ayetke «Tahyiir» (serbest bıraquv)
          ayeti denilir. Neticede, qadınları ferah ve ziynet yerine Az.Peyğamberni üstün
          körgenler).
        cid: 0
  - verse: 29
    segments:
      - text: >
          Eger Allahnı, Peyğamberini ve ahiret yurtunı tiley iseñiz, biliñ ki, Allah,
          arañızdan güzel davranğanlar içün, büyük bir mükâfat azırlağandır.
        cid: 0
  - verse: 30
    segments:
      - text: >
          Ey, Peyğamber qadınları! Sizden kim açıq bir ayasızlıq yapar ise, onıñ azabı eki
          qatına çıqarılır. Bu, Allahqa köre qolaydır.
        cid: 0
  - verse: 31
    segments:
      - text: >
          Sizden kim Allahqa ve Resulına itaat eter ve faydalı iş yapar ise, oña
          mükâfatını eki qat berirmiz. Ve oña (cennette) bol rızıq azırlağandırmız.
        cid: 0
  - verse: 32
    segments:
      - text: >
          Ey, Peyğamber qadınları! Siz qadınlardan er angi biri kibi degilsiñiz. Eger
          (Allahtan) qorqa iseñiz, (yabancı erkeklerge nisbeten) celp etici bir şekilde
          qonuşmañ; soñra qalbinde bozuqlıq olğan kimse ümütke qapılır. Güzel söz seyleñ.
          (Ayette keçken emir, er ne qadar Resulullah (s.a.)nıñ qadınları içün buyurılğan
          ve olarnıñ ayrı vaziyetlerine diqqat çekilgen ise de, üküm bütün musulman
          qadınlarğa aittir ).
        cid: 0
  - verse: 33
    segments:
      - text: >
          Evleriñizde oturıñ, eski cahiliye adetinde olğanı kibi, açılıp-saçılmañ. Namaz
          qılıñ, zekât beriñ, Allahqa ve Resulına itaat etiñ.Ey, ehl-i Beyt! Allah sizden
          sadece günahnı ketkizmek ve sizni ter-temiz yapmaq istemekte. (Ayette hitap
          etilgen ehl-i Beyt, Resulullahnıñ ev halqıdır. Ehl-i Beyt hususında eñ uyğun
          noqtai nazar şu: Allah Resulınıñ evlâtları, qadınları, torunları Asan ve Usein
          ve kiyevi Az.Ali ehl-i Beytni teşkil eterler).
        cid: 0
  - verse: 34
    segments:
      - text: >
          Evleriñizde oqulğan Allahnıñ ayetlerini ve ikmetini hatırlañ. Şübesiz, Allah er
          şeyniñ sırını bilicidir ve er şeyden haberi olucıdır.
        cid: 0
  - verse: 35
    segments:
      - text: >
          Musulman erkekler ve musulman qdınlar, mü'min erkekler ve mu'mun qadınlar,
          ibadetke devam etken erkekler ve ibadetke devam etken qadınlar, doğru erkekler
          ve doğru qadınlar, sabır etken erkekler ve sabır etken qadınlar, mutevazi
          erkekler ve mutevazi qadınlar, sadaqa bergen erkekler ve sadaqa bergen qadınlar,
          oraza tutqan erkekler ve oraza tutqan qadınlar, ırızlarını qorçalağan erkekler
          ve (ırızlarını) qarçalağan qadınlar, Allahnı çoq zikr etken erkekler ve zikr
          etken qadınlar bar ya; işte, Allah bular içün bir mağfiret ve büyük bir mükâfat
          azırlağandır.
        cid: 0
  - verse: 36
    segments:
      - text: >
          Allah ve Rusulı bir işke üküm bergen vaqıtta, inanğan bir erkek ve qadınğa o
          işni öz isteklerine köre seçüv aqqı yoqtır. Er kim Allah ve Resulına qarşı kelir
          ise, ap-açıq bir sapıqlıqqa tüşken olur.
        cid: 0
  - verse: 37
    segments:
      - text: >
          (Resulım!) O vaqıtta Allahnimet bergen, sen de oña yahşılıq etken kimsege:
          Qadınıñnı yanıñda tut, Allahtan qorq! dey ediñ. Allah aşkâr etecek şeyini,
          insanlardan çekinerek, içiñde gizley ediñ. Albuki, asıl qorqmaña lâyıq Allahtır.
          Zeyd, o qadından bağını keskeninen, biz onı saña nikâhladıq ki, evlâtlıqları
          qadınlarınen bağlarını keskenlerinde (O qadınlarnen evlenmek isteseler)
          mü'minlerge bir küçlik olmasın. Allahnıñ emiri yerine ketirilmiştir. (Bu ayette
          zikr etilgen ve Qur'anda adı keçken tek sahabi zat Zeyd b. Harisedir.
          Balalığında esir tüşken, Az.Hatice onı hızmetkâr olaraq satın alğan. Az.Hatice
          oña ediye etken bu balanı Peyğamberimiz azat etip, evlât etken edi. Resulullah
          Zeydni çoq sever edi. Oña alasınıñ qızı Zeyneb binti Cahışnı nikâhlağan edi.
          Faqat Zeyneb Zeydnen keçinalmadı. Zeyneb, asıllı bir aileden olğanı içün, bir
          azat olğan hızmetkârnen evlenmek istemegen, ancaq bu doğruda vahiy kelgeninen,
          onıñnen evlengen edi. Zeydge bir türlü ısınalmağan, bu sebepten, oña nisbeten
          asaletinen ğururlanuvdan artta qalmağan edi. Zeyd bir müddet daa buña sabır etse
          de, soñunda Allahnıñ Resulına barıp, Zeynebden ayırılmaq istegenini söyledi.
          Bunıñ üzerine, Resulullah hoşnutsızlıqnıñ bitmesi içün, ayırıluvlarını uyğun
          körse de, bunı Zeydniñ yüzüne aytmadı, oña sadece (qadınıñnı yanıñda tut), dedi.
          Az.Peyğamberniñ içinde gizlegen şeyi, Zeynebniñ soñundan özüne zevce olacağını
          bilgeni alda, bunı aytmağanıdır. Bu mevzuda uydurılğan bir taqım iftiralarnıñ
          esası yoqtır. Peyğamberimiz Zeynebniñ güzelligine qızğanı içün evlenmegen.
          Zeyneb onıñ alasınıñ qızı edi ve Peyğamber onı er vaqıt köre edi. İstese,
          onıñnen Zeydden evel özü evlene bilir edi).
        cid: 0
  - verse: 38
    segments:
      - text: >
