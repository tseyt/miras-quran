        cid: 0
  - verse: 56
    segments:
      - text: "Allaһ ve melekleri Peyğamberge çoq salavat ketirirler. Ey, mu’minler! Siz de oña salavat ketiriñ ve tam bir teslimiyetnen selâm beriñ. (Allaһnıñ salavatı, rahmet etmek ve qulunıñ şanını yuceltmektir. Meleklerniñ salavatı, Peyğamberniñ şanını yuceltmek, mu’minlerge bağışiav tilemek manasındadır. Mu’minlerniñ salâtıi ise, dua manasına kelmekte. Allaһ butün mu’minlerge, peyğamberlerine salât ve selâm ketirüvlerini emir etmekte ve oña sayğı kosterüvlerini istemekte. «Allaaһumme salli alâa Muhammedin» demek salât, «Esselâamu aleyke eyyuһe’n nebiyyu» demek - selâmdir. Peyğamberimizden rivayet etilgen bir çoq salâvat-ı şerife bardır. Bularnıi oqumaq, mumkün olğanı qadar çoq salât ve selâm ketirmek, Peyğamberniñ sevgisini celp eter, şefaatına sebep olur)."
