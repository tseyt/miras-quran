        cid: 0
  - verse: 37
    segments:
      - text: "(Resulım!) O vaqıtta Allaһnimet bergen, sen de oña yahşılıq etken kimsege: Qadınıñnı yanıñda tut, Allaһtan qorq! dey ediñ. Allaһ aşkâr etecek şeyini, insanlardan çekinerek, içiñde gizley ediñ. Albuki, asıl qorqmaña lâyıq Allaһtır. Zeyd, o qadından bağını keskeninen, biz onı saña nikâhladıq ki, evlâtlıqları qadınlarınen bağlarını keskenlerinde (O qadınlarnen evlenmek isteseler) mu’minlerge bir kuçlik olmasın. Allaһnıñ emiri yerine ketirilmiştir. (Bu ayette zikr etilgen ve Qur’anda adı keçken tek sahabi zat Zeyd b. Harisedir. Balalığında esir tüşken, Az.Hatice onı hızmetkâr olaraq satın alğan. Az.Hatice oña ediye etken bu balanı Peyğamberimiz azat etip, evlât etken edi. Resulullah Zeydni çoq sever edi. Oña alasınıñ qızı Zeyneb binti Cahışşı nikâhlağan edi. Faqat Zeyneb Zeydnen keçinalmadı. Zeyneb, asıllı bir aileden olğanı içün, bir azat olğan hızmetkârnen evlenmek istemegen, ancaq bu doğruda vahiy kelgeninen, onıñnen evlengen edi. Zeydge bir türlü ısınalmağan, bu sebepten, oña nisbeten asaletinen ğururlanuvdan artta qalmağan edi. Zeyd bir muddet daa buña sabır etse de, soñunda Allaһnıñ Resulına barıp, Zeynebden ayırılmaq istegenini söyledi. Bunıñ uzerine, Resulullah hoşnutsızlıqnıñ bitmesi içün, ayırıluvlarını uyğun korse de, bunı Zeydniñ yuzüne aytmadıi, oña sadece (qadınıñnı yanıñda tut), dedi. Az.Peyğamberniñ içinde gizlegen şeyi, Zeynebniñ soñundan ozüne zevce olacağını bilgeni alda, bunı aytmağanıdır. Bu mevzuda uydurılğan bir taqım iftiralarnıñ esası yoqtır. Peyğamberimiz Zeynebniñ guzelligine qızğanı içün evlenmegen. Zeyneb onıñ alasınıñ qızı edi ve Peyğamber onı er vaqıt kore edi. İstese, onıñnen Zeydden evel ozü evlene bilir edi)."
