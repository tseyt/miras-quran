surah_id: 108
language: crh
author: dizen-qurtnezir
verses:
  - verse: 3
    segments:
      - text: "Siz de menim tabınğanıma tabınmaysıñız."
        cid: 0
  - verse: 4
    segments:
      - text: "Men de siziñ tabınğanlarıñızğa asla tabınacaq degilim."
        cid: 0
  - verse: 5
    segments:
      - text: "Ebet, siz de menim tabınğanımğa tabınamakta degilsiñiz."
        cid: 0
  - verse: 6
    segments:
      - text: "Siziñ diniñiz - sizge, menim dinim de - maña."
        cid: 0
  - verse: 109
    segments:
      - text: "el-KYaAFİRUUN Kâfirlerden söz yursetilgeni içün, bu adnı alğan. Maauun suresinden soñ, Mekkede engen, 6 ayettir. Bismilâaһirraһmaanirraһiim (Rahman ve rahim olğan Allaһnıñ adınen). 1-2. (Resulım!) De ki: Ey, kâfirler! Men siz tabınayatqanlarıñızğa tabınmam."
        cid: 0
  - verse: 110
    segments:
      - text: "en-NASR Nasr - yardım demektir. Surede Allaһnıñ Az. Peyğamberge yardım eterek, fetihlerge qavuştırğanı ifade etilgeni içün, bu adnı alğan. Bu sure Mekkeniñ fethi sırasında engen olmaqnen beraber, Medine devrinde icretten soñ engeni içün, mediniy (Medinede engen) surelerdendir, 3 ayettir. İslâm zaferinden haber berir. İbn Umerden kelgen rivayetke kore, bu sure engenden soñ, Peyğamberimiz 80 kun yaşağan. Bismilâaһirraһmaanirraһiim (Rahman ve rahim olğan Allaһnıñ adınen). 1-3. Allaһnıñ yardımı ve zaferi kelip de, insanlarnıñ top-top Allaһnıñ dinine kirgenlerini korgen vaqtıñda, Rabbiñye hamd eterek, Onı tesbih et ve Ondan mağfiret tile. Çünki, O, tövbelerni çoq qabul eticidir."
        cid: 0