surah_id: 108
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: (Resulım!) Şübesiz,
        cid: 0
      - text: biz
        cid: 1
      - text: saña
        cid: 2
      - text: Kevserni
        cid: 3
      - text: berdik.
        cid: 2
      - text: >-
          Şimdi sen Rabbiñe qullıq et ve qurban çal. Aslı soñu kesilgen, şübesiz saña boğuz
          kütücidir. (Bu surede qurban çaluv emir etilgen. Qurban - yaqınlıq demektir. Qurban
          çaluvdan asıl maqsat, bu ibadetnen Allahqa yaqınlıq qazanmaqtır).
        cid: 0
  - verse: 2
    segments:
