surah_id: 108
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >
          (Resulım!) Şübesiz, biz saña Kevserni berdik. Şimdi sen Rabbiñe qullıq et ve
          qurban çal. Aslı soñu kesilgen, şübesiz saña boğuz kütücidir. (Bu surede qurban
          çaluv emir etilgen. Qurban - yaqınlıq demektir. Qurban çaluvdan asıl maqsat, bu
          ibadetnen Allahqa yaqınlıq qazanmaqtır).
        cid: 0
  - verse: 2
    segments:
      - text: >
          [1 ayetine baq.]
        cid: 0
  - verse: 3
    segments:
      - text: >
          [1 ayetine baq.]
        cid: 0
