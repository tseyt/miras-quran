surah_id: 108
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >-
          (Resulım!) Şubesiz, biz saña Kevserni berdik.
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Şimdi sen Rabbiñye qullıq et ve qurban çal.
        cid: 0
  - verse: 3
    segments:
      - text: >-
          Aslı soñu kesilgen, şubesiz saña boğuz kutücidir. (Bu surede qurban çaluv emir
          etilgen. Kurban - yaqınlıq demektir. Qurban çaluvdan asıl maqsat, bu ibadetnen
          Allaһqa yaqınlıq qazanmaqtır).
        cid: 0