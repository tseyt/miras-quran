surah_id: 27
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "Taa. Siin. Bular Qur’anıñ, (aqiqatlarnı) añlatqan Kitapnıñ ayetleridir."
        cid: 0
  - verse: 2
    segments:
      - text: "Namaznı qılğan, zekâtnı bergen ve ahiretke de kesen-kes iman etken mu’minler içün, bir hidayet reberi ve bir mujdedir."
        cid: 0
  - verse: 3
    segments:
      - text: "[2 ayetine baq.]"
        cid: 0
  - verse: 4
    segments:
      - text: "Şubesiz, biz, ahiretke inanmağanlarnıñ işlerini ozlerine süslü kosterdik; o sebepten, bocalar turarlar."
        cid: 0
  - verse: 5
    segments:
      - text: "İşte, bular, azabı eñ ağır olğanlardıң; ahirette eñ çoq ziyanğa oğraycaqlar da olardıң."
        cid: 0
  - verse: 6
    segments:
      - text: "(Resulım!) Şubesiz ki, bu Qur’an, ikmet saibi ve er şeyni bilici Allaһ tarafından saña berilmekte."
        cid: 0
  - verse: 7
    segments:
      - text: "O zaman Musa, ailesine boyle degen edi: Aqiqaten, men bir ateş kordim. (Barıp) sizge o yerden bir haber ketirecem, yahut bir ateş parçası ketirecem, umüt etem ki, qızınırsıñız!"
        cid: 0
  - verse: 8
    segments:
      - text: "O yerge barğanında, boyle seslenildi: Ateş bulunğan yerdeki ve etrafındekiler mubarek qılınğandır! Alemlerniñ Rabbi olğan Allaһ eksikliklerden uzaqtır!"
        cid: 0
  - verse: 9
    segments:
      - text: "Ey, Musa! Yahşı bil ki, men, mutlaq ğalip ve ikmet saibi olğan Allaһım!"
        cid: 0
  - verse: 10
    segments:
      - text: "Tayağıñnı at! Musa (tayağını atıp) onıñ yılan kibi qıbırdağanını korgeninen, çevirilip, artına baqmadan, qaçtı. (Oña dedik ki): Ey, Musa! Qorqma; çünki, menim uzurımda peyğamberler qorqmaz."
        cid: 0
  - verse: 11
    segments:
      - text: "Ancaq, kim aqsızlıq etip, soñra yapqan fenalığı yerine yahşılıq yapsa, bilsin ki, men (oña nisbeten de) çoq bağışlayıcıyım, çoq merhamet saibiyim."
        cid: 0
  - verse: 12
    segments:
      - text: "Eliñni qoynuña soq da, qusursız bem-beyaz çıqsın. Doquz mucizenen Fıravun ve qavmına (bar). Çünki, olar artıq yoldan çıqqan bir qavm olğanlar."
        cid: 0
  - verse: 13
    segments:
      - text: "Mucizelerimiz olarnıñ kozleri ogüne serilgeninen: «Bu, ap-açıq bir tılsımdır», dediler."
        cid: 0
  - verse: 14
    segments:
      - text: "Ozleriniñ de qalpleri bularğa inanğanları alda, zulum ve kibrlerinden otrü, olarnı inkâr ettiler. Bozğuncılarnıñ soñu nasıl olğanına bir baq!"
        cid: 0
  - verse: 15
    segments:
      - text: "Ant olsun ki, biz Davudğa ve Suylemanğa ilim berdik. Olar: Bizni, mu’min qullarınıñ bir çoqundan ustün qılğan Allaһqa hamd olsun, dediler."
        cid: 0
  - verse: 16
    segments:
      - text: "Suyleman Davudğa varis oldı ve dedi ki: Ey, insanlar! Bizge quş tili ogretildi ve bizge er şeyden (nasip) berildi. Doğrusı, bu, ap-açıq bir lütftir. (Allaһ Taalâ peyğamberi Suyleman (a.s.)ğa buyuk nimetler bergen, bu arada quşlarnıñ tilini añlamaq qabiliyetini de -mucize olaraq- lütf etken)."
        cid: 0
  - verse: 17
    segments:
      - text: "Suleymannıñ cinlerden, insanlardan ve quşlardan teşkil olğan orduları toplandı; episi bir arada (onıñ tarafından) tertipli olaraq idare etile edi."
        cid: 0
  - verse: 18
    segments:
      - text: "Niayet, Qarınca vadisine kelgen vaqıtlarında, bir qarınca: Ey, qarıncalar! Yuvalarıñızğa kiriñ; Suleyman ve ordusı farqına barmadan, sizni ezmesin! dedi."
        cid: 0
  - verse: 19
    segments:
      - text: "(Suleyman) Onıñ sözünden tolayı, kulümsiredi ve dedi ki: Ey, Rabbim! Meni ister maña, ister ana-babama bergen nimetiñye şukür etmege ve hoşnut olacağıñ yahşı işler yapmağa muvaffaq et. Rahmetiñnen meni yahşı qullarnıñ arasına qoş."
        cid: 0
  - verse: 20
    segments:
      - text: "(Suleyman) Quşlarnı kozden keçirdi ve boyle dedi: Hudhudnı niçün koralmayım? Yoqsa, ğayıplarğa qarıştımı?"
        cid: 0
  - verse: 21
    segments:
      - text: "Ya maña (uzürini kostergen) ap-açıq bir delil ketirecek, ya da onıñ canını yahşı yaqacam, yahut onı boğazlaycam!"
        cid: 0
  - verse: 22
    segments:
      - text: "Çoq keçmeden, (Hudhud) kelip: Men, dedi, sen bilmegen bir şeyni ogrendim. Sebe’den saña çoq doğru (ve muim) bir haber ketirdim. (Sebe’ - Yemende dedeleriniñ isminen añılğan bir qabileniñ adı)."
        cid: 0
  - verse: 23
    segments:
      - text: "Aqiqaten, olarğa (sebe’lelirge) ukümdarlıq yapqan, ozüne er şey berilgen ve buyuk bir tahtı olğan bir qadınnen rastkeliştim."
        cid: 0
  - verse: 24
    segments:
      - text: "Onıñ ve qavmınıñ, Allaһnı bıraqıp, kuneşke secde etkenlerini kordim. Şeytan olarğa yapqanlarını süslü kostergen de, olarnı doğru yoldan çıqarğan. Bunıñ içün, doğru yolnı tapalmaylar."
        cid: 0
  - verse: 25
    segments:
      - text: "(Şeytan oyle yapqan ki:) Koklerde ve yerde gizlengenni açıqqa çıqarğan, gizlegeniñizni ve aşkâr etkeniñizni bilgen Allaһqa secde etmesinler."
        cid: 0
  - verse: 26
    segments:
      - text: "(Albuki) Buyuk Arşnıñ saibi olğan Allaһtan başqa tañrı yoqtır."
        cid: 0
  - verse: 27
    segments:
      - text: "(Suleyman Hudhudğa) dedi ki: Doğru söylediñmi, yoqsa, yalancılardansıñmı, baqcaqmız."
        cid: 0
  - verse: 28
    segments:
      - text: "Şu mektübimni alıp bar, onı ozlerine ber, soñra olardan biraz çekil de, ne neticege keleceklerine baq."
        cid: 0
  - verse: 29
    segments:
      - text: "(Suleymanıñ mektübini alğan Sebe’ melikesi:) «Beyler, ulular! Maña çoq muim bir mektüp bıraqıldı», dedi."
        cid: 0
  - verse: 30
    segments:
      - text: "«Mektüp Suleymandan, rahman ve rahim olğan Allaһnıñ adı ile (başlamaqta)»."
        cid: 0
  - verse: 31
    segments:
      - text: "«Maña baş qaldırmañ, teslimiyet kosterip, maña keliñ, diye (yazmaqta)»."
        cid: 0
  - verse: 32
    segments:
      - text: "(Soñra Melike) dedi ki: Beyler, ulular! Bu işimde maña bir fikir beriñ. (Bilesiñiz) Siz yanımda olmadan (siznen aqıl tanışmadan), iç bir işni kestirip atmam."
        cid: 0
  - verse: 33
    segments:
      - text: "Olar şu cevapnı berdiler: Biz kuçlü-quvetli kimselermiz, kuçlü cenk erbabımız; emir ise, seniñdir; artıq ne buyuracağıñnı sen tüşün."
        cid: 0
  - verse: 34
    segments:
      - text: "Melike: Ukümdarlar bir memleketke kirdilermi, o yerni perişan eterler ve halqınıñ buyuklerini alçaltırlar. (Er alda) olar da boyle yapacaqtırlar, dedi."
        cid: 0
  - verse: 35
    segments:
      - text: "Men (şimdi) olarğa bir ediye yollayım da, baqayım elçiler ne (kibi bir netice) ile qaytacaqlar."
        cid: 0
  - verse: 36
    segments:
      - text: "(Elçiler ediyelernen) Suleymanğa kelgeninen, boyle dedi: Siz maña malnen yardım etesiñizmi? Allaһnıñ maña bergeni sizge bergeninden daa yahşıdır. Ediyeñiznen (men degil) siz sevinirsiñiz."
        cid: 0
  - verse: 37
    segments:
      - text: "(Ey, elçi!) Olarğa dön; yahşı bilsinler ki, ozlerine asla qarşı qoyalmaycaq ordularnen kelir, olarnı muaqqaq surette hor ve aşşalanğan alda o yerden çıqarırmız!"
        cid: 0
  - verse: 38
    segments:
      - text: "(Soñ Suleyman muşavirlerine) dedi ki: Ey, ulular! Olar teslimiyet kosterip, maña kelmeden evel, angiñiz o melikeniñ tahtını maña ketire bilir?"
        cid: 0
  - verse: 39
    segments:
      - text: "Cinlerden bir ifrit: Sen maqamıñdan qalqmadan, men onı saña ketiririm. Aqiqaten, bu işke kuçüm yeter ve maña işana bilirsiñiz, dedi."
        cid: 0
  - verse: 40
    segments:
      - text: "Kitaptan (Allaһ tarafından berilgen) bir ilmi olğan kimse ise: Kozüñni açıpümğance, men onı saña ketiririm, dedi. (Suleyman) onı (melikeniñ tahtını) yanbaşına yerleşken alda korgeninen: Bu, dedi, şukür etecegimmi, yoqsa, nankorlik etecegimmi, diye meni sınamaq içün Rabbimniñ (kostergen) lütfindendir. Şukür etken, ancaq ozü içün şukür etken olur, nankorlik etkenge kelgende, o bilsin ki, Rabbimniñ iç bir şeyge itiyacı yoqtır, çoq kerem saibidir. (İlim saibi zatnıñ Suleyman (a.s.)nıñ veziri Asaf bin Berhiya, yahut da Hızır olğanı rivayet etile)."
        cid: 0
  - verse: 41
    segments:
      - text: "(Suleyman devam etip) dedi ki: Onıñ tahtını bilalmaycaq bir alğa ketiriñ; baqayıq tanıycaqmı, yoqsa tanımaycaqlar arasında olacaqmı."
        cid: 0
  - verse: 42
    segments:
      - text: "Melike kelgeninen: Seniñ tahtıñ da, boyle edimi? denildi. O boyle cevap berdi: Tıpqı o! (Suleyman boyle dedi): Bizge daa evel (Allaһtan) bilgi berilgen ve biz musulman olğan edik."
        cid: 0
  - verse: 43
    segments:
      - text: "Onı Allaһtan başqa tabınğan şeyleri (o zamanğa qadar tevhid dinine kirüvden) çetke bıraqqan edi. Çünki, o inkârcı bir qavmdan edi."
        cid: 0
  - verse: 44
    segments:
      - text: "Oña: Koşkke kir! denildi. Melike onı korgeninen, teren bir suv belledi ve etegini yuqarı çekti. Suleyman: Bu, billürden yapılğan, şeffaf bir zemindir, dedi. (Rivayetke kore, Az.Suleyman Sebe’ melikesi Belqıs kelmeden evel, bir koşk yaptırğan edi. Bu koşkniñ azbarı billürden yapılğan, astından suv aqızılğan ve suvğa balkqlar qoyulğan. Belqıs zemininiñ şeffaf bir madde olğanını farq etalmağanı ve suvdan kecegini zan etkeni içün, etegini çekken. Butün bu tedbir ve tertipler onıñ aqıl ve bilgesine işançını sarsqan, ozüni ilâhiy tebliğatnı qabul etmege azırlağan). Melike dedi ki: Rabbim! Men, aqiqaten ozüme yazıq etkenim. Suleymannen beraber, alemlerniñ Rabbi olğan Allaһqa teslim oldım."
        cid: 0
  - verse: 45
    segments:
      - text: "Ant olsun ki, «Allaһqa qullıq etiñ!» (deyuvi içün) Semuud qavmına qardaşları Salihni yolladıq. Aman bir-birilerinen çekişken eki toplum ola qoydılar."
        cid: 0
  - verse: 46
    segments:
      - text: "Salih dedi ki: Ey, qavmım! Yahşılıq turğanda, niçün yamanlıqqa çapışasıñız? Allaһtan mağfiret tileseñiz olmazmı? Belki, sizge merhamet etilir."
        cid: 0
  - verse: 47
    segments:
      - text: "boyle dediler: Seniñ ve yanındakilerniñ sebebinden, oğursızlıqqa oğradıq. Salih: Sizge kelgen oğursızlıq (sebebi), Allaһ qatında (yazılı)dır. Yoq, siz imtianğa çekilgen bir qavmsıñız, dedi. (Az. Salih, peyğamber olğanınen, onı yalancılıqta qabaatlağanlarından, Cenab-ı Allaһ olarğa qıtlıq bergen edi. «Oğursızlıq» degenleri bu edi)."
        cid: 0
  - verse: 48
    segments:
      - text: "O şeerde doquz adam bar edi ki, olar yer yuzünde bozğuncılıq yapa, yahşılıq tarafına iç yanaşmay ediler. (Bu yer - semuudlılarnıñ Hicr adlı şeeri olğanı bildirmekte. Doquz kişi demek, doquz insan ola bilecegi kibi, doquz toplulıq da olar bilir)."
        cid: 0
  - verse: 49
    segments:
      - text: "Allaһqa ant içerek, bir-birilerine boyle dediler: Gece oña ve ailesine basqıncılıq yapayıq (episini oldüreyik); soñra da velisine: «Biz (Salih) ailesiniñ yoq etilüvi sırasında o yerde degil edik, inanıñ ki, doğru söyleymiz», deyik."
        cid: 0
  - verse: 50
    segments:
      - text: "Olar boyle bir tuzaq qurdılar. Biz de, olar farqında olmadan, olarnıñ iylelerini alt-ust ettik."
        cid: 0
  - verse: 51
    segments:
      - text: "Baq, işte, tuzaqlarınıñ aqibeti nasıl oldı: Olarnı da, olarğa uyğan qavmlarnı da, (nasıl) toptan elâk ettik!"
        cid: 0
  - verse: 52
    segments:
      - text: "İşte, aqsızlıqları sebebinden çökken evleri! Añlağan bir qavm içün, elbette bunda bir ibret bar."
        cid: 0
  - verse: 53
    segments:
      - text: "İman etip, Allaһqa qarşı kelüvden saqınğanlarnı ise, qurtardıq."
        cid: 0
  - verse: 54
    segments:
      - text: "Luutnı da (peyğamber olaraq qavmına yolladıq). Qavmına boyle degen edi: Koz kore-kore, alâ o ayasızlıqnı yapacaqsıñızmı?"
        cid: 0
  - verse: 55
    segments:
      - text: "(Bu ilâhiy tenbiyeden soñ alâ) siz ille de qadınlarnı bıraqıp, şehvetnen erkeklerge yaqlaşacaqsıñızmı? Doğrusı, siz fikrsizlikte devam etip kelgen bir qavmsıñız!"
        cid: 0
  - verse: 56
    segments:
      - text: "Qavmınıñ cevabı sadece: «Luut ailesini memlekitiñizden çıqarıñ; çünki, olar, (bizim yapqanlarımızdan) uzaq qalmaq istegen insanlar eken!», deyuvlerinden ibaret oldı."
        cid: 0
  - verse: 57
    segments:
      - text: "Bunıñ uzerine, onı ve ailesini qurtardıq. Yalıñız qadını istisna; onıñ artta (azapqa oğrağanlarnıñ arasında) qaluvını taqdir ettik."
        cid: 0
  - verse: 58
    segments:
      - text: "Olarnıñ ustlerine muthiş bir yağmur endirdik. Bu sebepnen, tenbiyelengen (faqat uymağan)larnıñ yağmurı ne yaman olğandır! (Tefsirlerde bu yağmur aqqında añlatuv yapılğanda, uzerlerinde, kimniñ başına tüşecek olsa, onıñ adı yazılı taşlar yağdırılğanı ifade etile)."
        cid: 0
  - verse: 59
    segments:
      - text: "(Resulım!) De ki: Hamd olsun Allaһqa, selâm olsun ustün qılğan qullarına. Allaһ daa hayırlımı, yoqsa, Oña qoşqan ortaqlarımı? (Allaһnıñ ustün qılğan qulları - peyğamberler ya da Az.Peyğamberniñ ashabı, ya da ilâhiy rizağa nail olğan, kelgen-kelecek butün mu’minler ola bilecegi ifade etile)."
        cid: 0
  - verse: 60
    segments:
      - text: "(Olar hayırlımı) yoqsa, koklerni ve yerni yaratqan, kokten sizge suv endirgenmi? O suvnen, bir teregini bile ostürmege kuçiñiz yetmegen guzel bağçalar ostürdik. Allaһtan başqa bir tañrı barmı! Doğrusı, olar sapıqlıqta devam etken bir toplulıqtır."
        cid: 0
  - verse: 61
    segments:
      - text: "(Olar hayırlımı) yoqsa, yer yuzüni oturmağa elverişli yapqan, aralarından (er altından ve ustünden) nehrler aqızğan (er içün qaviy dağlar yaratqan), eki deñiz arasına mani qoyğanmı? Allaһtan başqa bir tañrı barmı! Doğrusı, olarnıñ çoqu (aqiqatlarnı) bilmeyler."
        cid: 0
  - verse: 62
    segments:
      - text: "(Olar hayırlımı) yoqsa, tarlıqqa qalğanğa, Oña yalvarğan vaqtıñda, qarşılıq bergen ve (başıñdaki) sıqıntını ketkizgen, sizni yer yuzüniñ akimleri qılğanmı? Allaһtan başqa bir tañrı barmı! Ne qadar da say tüşünmektesiñiz!"
        cid: 0
  - verse: 63
    segments:
      - text: "(Olar hayırlımı) yoqsa, qaranıñ ve deñizniñ qaranlıqları içinde sizge yol taptırğan, rahmetiniñ (yağmurınıñ) ogünde ruzgârlarnı mujdeci olaraq yollağanmı? Allaһtan başqa bir tañrı barmı! Allaһ, olarnıñ qoşqan ortaqlarından çoq yucedir, uzaqtır."
        cid: 0
  - verse: 64
    segments:
      - text: "(Olar hayırlımı) yoqsa, ilk baştan yaratqan, soñra yaratuvnı tekrar etken ve sizni em kokten, em yerden rızıqlandarğanmı? Allaһtan başqa bir tañrı barmı! De ki: Eger doğru söyley iseñiz, siz kesen-kes deliliñizni ketirñ!"
        cid: 0
  - verse: 65
    segments:
      - text: "De ki: Koklerde ve yerde, Allaһtan başqa kimse ğaybnı bilmez. Ve olar ne zaman tiriltileceklerini de bilmezler."
        cid: 0
  - verse: 66
    segments:
      - text: "Yoq; olarnıñ ahiret aqqındaki bilgeleri eksiktir. Daa da, bu hususta şube içindedirler. Bundan da ğayrı, olar ahiret hususında kordirler."
        cid: 0
  - verse: 67
    segments:
      - text: "İnkârcılar dediler ki: Aqiqaten, biz ve atalarmız topraq olğandan soñ, aqiqaten (tiriltilip) çıqarılacaqmızmı?"
        cid: 0
  - verse: 68
    segments:
      - text: "Ant olsun ki, bu tehdit bizge yapılğanı kibi, daa evel atalarımızğa da yapılğan. Bu, evelkilerniñ masallarından başqa bir şey degil."
        cid: 0
  - verse: 69
    segments:
      - text: "De ki: Yer yuzünde keziñ de, gunahkârlarnıñ aqibeti nasıl oldı, koriñ!"
        cid: 0
  - verse: 70
    segments:
      - text: "(Resulım!) Olarnıñ sebebinden kederlenme, qurayatqan tuzaqlarından otrü, sıqıntı duyma."
        cid: 0
  - verse: 71
    segments:
      - text: "Olar: Eger doğru sözlü iseñiz (söyleñ baqayıq) bu tehdit ne vaqıt kerçekleşecek? derler."
        cid: 0
  - verse: 72
    segments:
      - text: "De ki: Çabuk kelüvini istegen şeyiñizniñ (azapnıñ) bir qısmı, er alda, yaqında başıñızğa kelecek. (Kâfirlerniñ, daa dünyada olğanda, çekken bir qısım cezalarına işaret olunmaqta ve asıl cezanıñ ahirette olğanı, ifade etilmekte)."
        cid: 0
  - verse: 73
    segments:
      - text: "Şubesiz, Rabbiñ, insanlarğa nisbeten lütf saibidir; faqat insanlarnıñ çoqu şukür etmezler."
        cid: 0
  - verse: 74
    segments:
      - text: "Rabbiñ, elbette olarnıñ qalpleri gizlegenlerini de, aşkâr etkenlerini de bilir."
        cid: 0
  - verse: 75
    segments:
      - text: "Kokte ve yerde kozge korünmegen iç bir şey yoqtır ki, ap-açıq bir kitapta (levh-i mahfuzda) olmasın."
        cid: 0
  - verse: 76
    segments:
      - text: "Doğrusı, bu Qur’an İsrail oğularına, aqqında ihtilaf etip kelgen şeylerniñ pek çoqunı añlatmaqta."
        cid: 0
  - verse: 77
    segments:
      - text: "Ve o, mu’minler içün, aqiqaten bir hidayet reberi ve rahmettir."
        cid: 0
  - verse: 78
    segments:
      - text: "Rabbiñ, şubesiz olar arasında ukmini berecek. O, mutlaq ğaliptir, er şeyni bilicidir."
        cid: 0
  - verse: 79
    segments:
      - text: "O alda, sen Allaһqa işanıp tayan. Çünki, sen ap-açıq aqiqat uzresiñ."
        cid: 0
  - verse: 80
    segments:
      - text: "Bil ki, sen olülerge eşittiralmazsıñ, artlarına qaytıp keter ekenler, sağırlarğa da davetni duyuralmazsıñ."
        cid: 0
  - verse: 81
    segments:
      - text: "Sen korlerni sapıqlıqlarından çevirip, doğru yolğa ketiralmazsıñ. Ancaq, ayetlerimizge inanıp da, teslim olğanlarğa duyura bilirsiñ."
        cid: 0
  - verse: 82
    segments:
      - text: "O söz başlarına kelgen (qıyamet yaqlaşqan) zamanda, olarğa yerden bir daabbe (mahlüq) çıqarırmız da, bu olarğa insanlarnıñ ayetlerimizge kesen-kes bir iman ketirmegenlerini söyler."
        cid: 0
  - verse: 83
    segments:
      - text: "O kunü er ummet arasından ayetlerimizni yalan sayğanlardan bir cemaat toplarmız da, olar toplu olaraq (esap yerine) alınıp barırırlar. (Tefsirlerde, bu yerde añılğan cemaat - ozlerine uyılğan reberler olğanı ifade etile)."
        cid: 0
  - verse: 84
    segments:
      - text: "Niayet, (esap yerine) kelgen vaqıtlarında Allaһ buyurır: Siz menim ayetlerimni, ne olğanını añlamadan, yalan saydıñız, oylemi? Degil ise, yapqanıñız ne edi?"
        cid: 0
  - verse: 85
    segments:
      - text: "Yapqan aqsızlıqlarından otrü, (azapqa oğraycaqlarını bildirgen) o söz kerçekleşkendir; artıq olar söylep olamazlar."
        cid: 0
  - verse: 86
    segments:
      - text: "Raatlansınlar diye, geceni (qaranlıq) ve (çalışsınlar diye) kundüzni aydınlıq yapqanımıznı kormedilermi? İman etken bir qavm içün, elbette bunda bir çoq ibretler bar."
        cid: 0
  - verse: 87
    segments:
      - text: "Suurğa ufürilgen kunü, -Allaһnıñ istegenleri istisna- koklerde ve yerde olğanlar ep deşetke qapılır. Episi, boyunları bukük alda, Oña kelirler."
        cid: 0
  - verse: 88
    segments:
      - text: "Sen dağlarnı korersiñ de, olarnı yerinde turğan sanarsıñ. Albuki, olar bulutlarnıñ yurmesi kibi yurmektedirler. (Bu,) er şeyni sap-sağlam yapqan Allaһnıñ sanatıdır. Şubesiz ki, O, yapqanlarıñızdan tamamınen haberdardır. (Bu ayet dünyanıñ sabit olmayıp, areket alında olğanına işaret etmekte. Dağlarnıñ areket etüvi demek, olarnıñ da uzerinde bulunğan yerniñ areket etüvi demektir)."
        cid: 0
  - verse: 89
    segments:
      - text: "Kim yahşılıqnen (ilâhiy uzurğa) kelir ise, oña daa yahşısı berilir. Ve olar o kunü qorqudan emin olurlar."
        cid: 0
  - verse: 90
    segments:
      - text: "(Rabbleriniñ uzuruna) yamanlıqnen kelgen kimseler ise, yuzüqoyun ceennemge atılırlar. (Olarğa:) «Ancaq yapqanlarıñıznıñ qarşılığnı kormektesiñiz!», (denilir.)."
        cid: 0
  - verse: 91
    segments:
      - text: "(De ki:) Men ancaq, bu şeerniñ (Mekkeniñ) Rabbine -ki O, bu yerni toqunılmaz yapqan- qullıq etmeknen emir olundım. Er şey de, zaten Oña aittir. Maña musulmanlardan oluvım ve Qur’an oquvım emir etildi. Artıq kim doğru yolğa kelse, yalıñız ozü içün kelgen olur; kim de sapsa, oña de ki: Men, sadece tenbiyecilerdenim."
        cid: 0
  - verse: 92
    segments:
      - text: "[91 ayetine baq.]"
        cid: 0
  - verse: 93
    segments:
      - text: "Ve boyle de: Hamd Allaһqa mahsustır. O, ayetlerini sizge kosterecek, siz de olarnı korüp tanıycaqsıñız (amma artıq faydası olmaycaq). Rabbiñ, yapqanlarıñızdan habersiz degil."
