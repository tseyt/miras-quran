surah_id: 27
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >
          Taa. Siin. Bular Qur'annıñ, (aqiqatlarnı) añlatqan Kitapnıñ ayetleridir.
        cid: 0
  - verse: 2
    segments:
      - text: >
          Namaznı qılğan, zekâtnı bergen ve ahiretke de kesen-kes iman etken mü'minler
          içün, bir hidayet reberi ve bir müjdedir.
        cid: 0
  - verse: 3
    segments:
      - text: >
          [2 ayetine baq.]
        cid: 0
  - verse: 4
    segments:
      - text: >
          Şübesiz, biz, ahiretke inanmağanlarnıñ işlerini özlerine süslü kösterdik; o
          sebepten, bocalar turarlar.
        cid: 0
  - verse: 5
    segments:
      - text: >
          İşte, bular, azabı eñ ağır olğanlardır; ahirette eñ çoq ziyanğa oğraycaqlar da
          olardır.
        cid: 0
  - verse: 6
    segments:
      - text: >
          (Resulım!) Şübesiz ki, bu Qur'an, ikmet saibi ve er şeyni bilici Allah
          tarafından saña berilmekte.
        cid: 0
  - verse: 7
    segments:
      - text: >
          O zaman Musa, ailesine böyle degen edi: Aqiqaten, men bir ateş kördim. (Barıp)
          sizge o yerden bir haber ketirecem, yahut bir ateş parçası ketirecem, ümüt etem
          ki, qızınırsıñız!
        cid: 0
  - verse: 8
    segments:
      - text: >
          O yerge barğanında, böyle seslenildi: Ateş bulunğan yerdeki ve etrafındekiler
          mubarek qılınğandır! Alemlerniñ Rabbi olğan Allah eksikliklerden uzaqtır!
        cid: 0
  - verse: 9
    segments:
      - text: >
          Ey, Musa! Yahşı bil ki, men, mutlaq ğalip ve ikmet saibi olğan Allahım!
        cid: 0
  - verse: 10
    segments:
      - text: >
          Tayağıñnı at! Musa (tayağını atıp) onıñ yılan kibi qıbırdağanını körgeninen,
          çevirilip, artına baqmadan, qaçtı. (Oña dedik ki): Ey, Musa! Qorqma; çünki,
          menim uzurımda peyğamberler qorqmaz.
        cid: 0
  - verse: 11
    segments:
      - text: >
          Ancaq, kim aqsızlıq etip, soñra yapqan fenalığı yerine yahşılıq yapsa, bilsin
          ki, men (oña nisbeten de) çoq bağışlayıcıyım, çoq merhamet saibiyim.
        cid: 0
  - verse: 12
    segments:
      - text: >
          Eliñni qoynuña soq da, qusursız bem-beyaz çıqsın. Doquz mucizenen Fıravun ve
          qavmına (bar). Çünki, olar artıq yoldan çıqqan bir qavm olğanlar.
        cid: 0
  - verse: 13
    segments:
      - text: >
          Mucizelerimiz olarnıñ közleri ögüne serilgeninen: «Bu, ap-açıq bir tılsımdır»,
          dediler.
        cid: 0
  - verse: 14
    segments:
      - text: >
          Özleriniñ de qalpleri bularğa inanğanları alda, zulum ve kibrlerinden ötrü,
          olarnı inkâr ettiler. Bozğuncılarnıñ soñu nasıl olğanına bir baq!
        cid: 0
  - verse: 15
    segments:
      - text: >
          Ant olsun ki, biz Davudğa ve Suylemanğa ilim berdik. Olar: Bizni, mü'min
          qullarınıñ bir çoqundan üstün qılğan Allahqa hamd olsun, dediler.
        cid: 0
  - verse: 16
    segments:
      - text: >
          Suyleman Davudğa varis oldı ve dedi ki: Ey, insanlar! Bizge quş tili ögretildi
          ve bizge er şeyden (nasip) berildi. Doğrusı, bu, ap-açıq bir lütftir. (Allah
          Taalâ peyğamberi Suyleman (a.s.)ğa büyük nimetler bergen, bu arada quşlarnıñ
          tilini añlamaq qabiliyetini de -mucize olaraq- lütf etken).
        cid: 0
  - verse: 17
    segments:
      - text: >
          Süleymannıñ cinlerden, insanlardan ve quşlardan teşkil olğan orduları toplandı;
          episi bir arada (onıñ tarafından) tertipli olaraq idare etile edi.
        cid: 0
  - verse: 18
    segments:
      - text: >
          Niayet, Qarınca vadisine kelgen vaqıtlarında, bir qarınca: Ey, qarıncalar!
          Yuvalarıñızğa kiriñ; Süleyman ve ordusı farqına barmadan, sizni ezmesin! dedi.
        cid: 0
  - verse: 19
    segments:
      - text: >
          (Süleyman) Onıñ sözünden tolayı, külümsiredi ve dedi ki: Ey, Rabbim! Meni ister
          maña, ister ana-babama bergen nimetiñe şükür etmege ve hoşnut olacağıñ yahşı
          işler yapmağa muvaffaq et. Rahmetiñnen meni yahşı qullarnıñ arasına qoş.
        cid: 0
  - verse: 20
    segments:
      - text: >
          (Süleyman) Quşlarnı közden keçirdi ve böyle dedi: Hudhudnı niçün koralmayım?
          Yoqsa, ğayıplarğa qarıştımı?
        cid: 0
  - verse: 21
    segments:
      - text: >
          YA maña (üzürini köstergen) ap-açıq bir delil ketirecek, ya da onıñ canını yahşı
          yaqacam, yahut onı boğazlaycam!
        cid: 0
  - verse: 22
    segments:
      - text: >
          Çoq keçmeden, (Hudhud) kelip: Men, dedi, sen bilmegen bir şeyni ögrendim.
          Sebe'den saña çoq doğru (ve müim) bir haber ketirdim. (Sebe' - Yemende
          dedeleriniñ isminen añılğan bir qabileniñ adı).
        cid: 0
  - verse: 23
    segments:
      - text: >
          Aqiqaten, olarğa (sebe'lelirge) ükümdarlıq yapqan, özüne er şey berilgen ve
          büyük bir tahtı olğan bir qadınnen rastkeliştim.
        cid: 0
  - verse: 24
    segments:
      - text: >
          Onıñ ve qavmınıñ, Allahnı bıraqıp, küneşke secde etkenlerini kördim. Şeytan
          olarğa yapqanlarını süslü köstergen de, olarnı doğru yoldan çıqarğan. Bunıñ
          içün, doğru yolnı tapalmaylar.
        cid: 0
  - verse: 25
    segments:
      - text: >
          (Şeytan öyle yapqan ki:) Köklerde ve yerde gizlengenni açıqqa çıqarğan,
          gizlegeniñizni ve aşkâr etkeniñizni bilgen Allahqa secde etmesinler.
        cid: 0
  - verse: 26
    segments:
      - text: >
          (Albuki) Büyük Arşnıñ saibi olğan Allahtan başqa tañrı yoqtır.
        cid: 0
  - verse: 27
    segments:
      - text: >
          (Süleyman Hudhudğa) dedi ki: Doğru söylediñmi, yoqsa, yalancılardansıñmı,
          baqcaqmız.
        cid: 0
  - verse: 28
    segments:
      - text: >
          Şu mektübimni alıp bar, onı özlerine ber, soñra olardan biraz çekil de, ne
          neticege keleceklerine baq.
        cid: 0
  - verse: 29
    segments:
      - text: >
          (Süleymanıñ mektübini alğan Sebe' melikesi:) «Beyler, ulular! Maña çoq müim bir
          mektüp bıraqıldı», dedi.
        cid: 0
  - verse: 30
    segments:
      - text: >
          «Mektüp Süleymandan, rahman ve rahim olğan Allahnıñ adı ile (başlamaqta)».
        cid: 0
  - verse: 31
    segments:
      - text: >
          «Maña baş qaldırmañ, teslimiyet kösterip, maña keliñ, diye (yazmaqta)».
        cid: 0
  - verse: 32
    segments:
      - text: >
          (Soñra Melike) dedi ki: Beyler, ulular! Bu işimde maña bir fikir beriñ.
          (Bilesiñiz) Siz yanımda olmadan (siznen aqıl tanışmadan), iç bir işni kestirip
          atmam.
        cid: 0
  - verse: 33
    segments:
      - text: >
          Olar şu cevapnı berdiler: Biz küçlü-quvetli kimselermiz, küçlü cenk erbabımız;
          emir ise, seniñdir; artıq ne buyuracağıñnı sen tüşün.
        cid: 0
  - verse: 34
    segments:
      - text: >
          Melike: Ükümdarlar bir memleketke kirdilermi, o yerni perişan eterler ve
          halqınıñ büyüklerini alçaltırlar. (Er alda) olar da böyle yapacaqtırlar, dedi.
        cid: 0
  - verse: 35
    segments:
      - text: >
          Men (şimdi) olarğa bir ediye yollayım da, baqayım elçiler ne (kibi bir netice)
          ile qaytacaqlar.
        cid: 0
  - verse: 36
    segments:
      - text: >
          (Elçiler ediyelernen) Süleymanğa kelgeninen, böyle dedi: Siz maña malnen yardım
          etesiñizmi? Allahnıñ maña bergeni sizge bergeninden daa yahşıdır. Ediyeñiznen
          (men degil) siz sevinirsiñiz.
        cid: 0
  - verse: 37
    segments:
      - text: >
          (Ey, elçi!) Olarğa dön; yahşı bilsinler ki, özlerine asla qarşı qoyalmaycaq
          ordularnen kelir, olarnı muaqqaq surette hor ve aşşalanğan alda o yerden
          çıqarırmız!
        cid: 0
  - verse: 38
    segments:
      - text: >
          (Soñ Süleyman muşavirlerine) dedi ki: Ey, ulular! Olar teslimiyet kösterip, maña
          kelmeden evel, angiñiz o melikeniñ tahtını maña ketire bilir?
        cid: 0
  - verse: 39
    segments:
      - text: >
          Cinlerden bir ifrit: Sen maqamıñdan qalqmadan, men onı saña ketiririm. Aqiqaten,
          bu işke küçüm yeter ve maña işana bilirsiñiz, dedi.
        cid: 0
  - verse: 40
    segments:
      - text: >
          Kitaptan (Allah tarafından berilgen) bir ilmi olğan kimse ise: Közüñni
          açıp-yumğance, men onı saña ketiririm, dedi. (Süleyman) onı (melikeniñ tahtını)
          yanbaşına yerleşken alda körgeninen: Bu, dedi, şükür etecegimmi, yoqsa,
          nankorlik etecegimmi, diye meni sınamaq içün Rabbimniñ (köstergen) lütfindendir.
          Şükür etken, ancaq özü içün şükür etken olur, nankorlik etkenge kelgende, o
          bilsin ki, Rabbimniñ iç bir şeyge itiyacı yoqtır, çoq kerem saibidir. (İlim
          saibi zatnıñ Süleyman (a.s.)nıñ veziri Asaf bin Berhiya, yahut da Hızır olğanı
          rivayet etile).
        cid: 0
  - verse: 41
    segments:
      - text: >
          (Süleyman devam etip) dedi ki: Onıñ tahtını bilalmaycaq bir alğa ketiriñ;
          baqayıq tanıycaqmı, yoqsa tanımaycaqlar arasında olacaqmı.
        cid: 0
  - verse: 42
    segments:
      - text: >
          Melike kelgeninen: Seniñ tahtıñ da, böyle edimi? denildi. O böyle cevap berdi:
          Tıpqı o! (Süleyman böyle dedi): Bizge daa evel (Allahtan) bilgi berilgen ve biz
          musulman olğan edik.
        cid: 0
  - verse: 43
    segments:
      - text: >
          Onı Allahtan başqa tabınğan şeyleri (o zamanğa qadar tevhid dinine kirüvden)
          çetke bıraqqan edi. Çünki, o inkârcı bir qavmdan edi.
        cid: 0
  - verse: 44
    segments:
      - text: >
          Oña: Köşkke kir! denildi. Melike onı körgeninen, teren bir suv belledi ve
          etegini yuqarı çekti. Süleyman: Bu, billürden yapılğan, şeffaf bir zemindir,
          dedi. (Rivayetke köre, Az.Süleyman Sebe' melikesi Belqıs kelmeden evel, bir köşk
          yaptırğan edi. Bu köşkniñ azbarı billürden yapılğan, astından suv aqızılğan ve
          suvğa balıqlar qoyulğan. Belqıs zemininiñ şeffaf bir madde olğanını farq
          etalmağanı ve suvdan kecegini zan etkeni içün, etegini çekken. Bütün bu tedbir
          ve tertipler onıñ aqıl ve bilgesine işançını sarsqan, özüni ilâhiy tebliğatnı
          qabul etmege azırlağan). Melike dedi ki: Rabbim! Men, aqiqaten özüme yazıq
          etkenim. Süleymannen beraber, alemlerniñ Rabbi olğan Allahqa teslim oldım.
        cid: 0
  - verse: 45
    segments:
      - text: >
          Ant olsun ki, «Allahqa qullıq etiñ!» (deyüvi içün) Semuud qavmına qardaşları
          Salihni yolladıq. Aman bir-birilerinen çekişken eki toplum ola qoydılar.
        cid: 0
  - verse: 46
    segments:
      - text: >
          Salih dedi ki: Ey, qavmım! Yahşılıq turğanda, niçün yamanlıqqa çapışasıñız?
          Allahtan mağfiret tileseñiz olmazmı? Belki, sizge merhamet etilir.
        cid: 0
  - verse: 47
    segments:
      - text: >
          böyle dediler: Seniñ ve yanındakilerniñ sebebinden, oğursızlıqqa oğradıq. Salih:
          Sizge kelgen oğursızlıq (sebebi), Allah qatında (yazılı)dır. Yoq, siz imtianğa
          çekilgen bir qavmsıñız, dedi. (Az.Salih, peyğamber olğanınen, onı yalancılıqta
          qabaatlağanlarından, Cenab-ı Allah olarğa qıtlıq bergen edi. «Oğursızlıq»
          degenleri bu edi).
        cid: 0
  - verse: 48
    segments:
      - text: >
          O şeerde doquz adam bar edi ki, olar yer yüzünde bozğuncılıq yapa, yahşılıq
          tarafına iç yanaşmay ediler. (Bu yer - semuudlılarnıñ Hicr adlı şeeri olğanı
          bildirmekte. Doquz kişi demek, doquz insan ola bilecegi kibi, doquz toplulıq da
          olar bilir).
        cid: 0
  - verse: 49
    segments:
      - text: >
          Allahqa ant içerek, bir-birilerine böyle dediler: Gece oña ve ailesine
          basqıncılıq yapayıq (episini öldüreyik); soñra da velisine: «Biz (Salih)
          ailesiniñ yoq etilüvi sırasında o yerde degil edik, inanıñ ki, doğru söyleymiz»,
          deyik.
        cid: 0
  - verse: 50
    segments:
      - text: >
          Olar böyle bir tuzaq qurdılar. Biz de, olar farqında olmadan, olarnıñ iylelerini
          alt-üst ettik.
        cid: 0
  - verse: 51
    segments:
      - text: >
          Baq, işte, tuzaqlarınıñ aqibeti nasıl oldı: Olarnı da, olarğa uyğan qavmlarnı
          da, (nasıl) toptan elâk ettik!
        cid: 0
  - verse: 52
    segments:
      - text: >
          İşte, aqsızlıqları sebebinden çökken evleri! Añlağan bir qavm içün, elbette
          bunda bir ibret bar.
        cid: 0
  - verse: 53
    segments:
      - text: >
          İman etip, Allahqa qarşı kelüvden saqınğanlarnı ise, qurtardıq.
        cid: 0
  - verse: 54
    segments:
      - text: >
          Luutnı da (peyğamber olaraq qavmına yolladıq). Qavmına böyle degen edi: Köz
          köre-köre, alâ o ayasızlıqnı yapacaqsıñızmı?
        cid: 0
  - verse: 55
    segments:
      - text: >
          (Bu ilâhiy tenbiyeden soñ alâ) siz ille de qadınlarnı bıraqıp, şehvetnen
          erkeklerge yaqlaşacaqsıñızmı? Doğrusı, siz fikrsizlikte devam etip kelgen bir
          qavmsıñız!
        cid: 0
  - verse: 56
    segments:
      - text: >
          Qavmınıñ cevabı sadece: «Luut ailesini memlekitiñizden çıqarıñ; çünki, olar,
          (bizim yapqanlarımızdan) uzaq qalmaq istegen insanlar eken!», deyüvlerinden
          ibaret oldı.
        cid: 0
  - verse: 57
    segments:
      - text: >
          Bunıñ üzerine, onı ve ailesini qurtardıq. Yalıñız qadını istisna; onıñ artta
          (azapqa oğrağanlarnıñ arasında) qaluvını taqdir ettik.
        cid: 0
  - verse: 58
    segments:
      - text: >
          Olarnıñ üstlerine müthiş bir yağmur endirdik. Bu sebepnen, tenbiyelengen (faqat
          uymağan)larnıñ yağmurı ne yaman olğandır! (Tefsirlerde bu yağmur aqqında añlatuv
          yapılğanda, üzerlerinde, kimniñ başına tüşecek olsa, onıñ adı yazılı taşlar
          yağdırılğanı ifade etile).
        cid: 0
  - verse: 59
    segments:
      - text: >
          (Resulım!) De ki: Hamd olsun Allahqa, selâm olsun üstün qılğan qullarına. Allah
          daa hayırlımı, yoqsa, Oña qoşqan ortaqlarımı? (Allahnıñ üstün qılğan qulları -
          peyğamberler ya da Az.Peyğamberniñ ashabı, ya da ilâhiy rizağa nail olğan,
          kelgen-kelecek bütün mü'minler ola bilecegi ifade etile).
        cid: 0
  - verse: 60
    segments:
      - text: >
          (Olar hayırlımı) yoqsa, köklerni ve yerni yaratqan, kökten sizge suv endirgenmi?
          O suvnen, bir teregini bile östürmege küçiñiz yetmegen güzel bağçalar östürdik.
          Allahtan başqa bir tañrı barmı! Doğrusı, olar sapıqlıqta devam etken bir
          toplulıqtır.
        cid: 0
  - verse: 61
    segments:
      - text: >
          (Olar hayırlımı) yoqsa, yer yüzüni oturmağa elverişli yapqan, aralarından (yer
          altından ve üstünden) nehrler aqızğan (yer içün qaviy dağlar yaratqan), eki
          deñiz arasına mani qoyğanmı? Allahtan başqa bir tañrı barmı! Doğrusı, olarnıñ
          çoqu (aqiqatlarnı) bilmeyler.
        cid: 0
  - verse: 62
    segments:
      - text: >
          (Olar hayırlımı) yoqsa, tarlıqqa qalğanğa, Oña yalvarğan vaqtıñda, qarşılıq
          bergen ve (başıñdaki) sıqıntını ketkizgen, sizni yer yüzüniñ akimleri qılğanmı?
          Allahtan başqa bir tañrı barmı! Ne qadar da say tüşünmektesiñiz!
        cid: 0
  - verse: 63
    segments:
      - text: >
          (Olar hayırlımı) yoqsa, qaranıñ ve deñizniñ qaranlıqları içinde sizge yol
          taptırğan, rahmetiniñ (yağmurınıñ) ögünde rüzgârlarnı müjdeci olaraq yollağanmı?
          Allahtan başqa bir tañrı barmı! Allah, olarnıñ qoşqan ortaqlarından çoq yücedir,
          uzaqtır.
        cid: 0
  - verse: 64
    segments:
      - text: >
          (Olar hayırlımı) yoqsa, ilk baştan yaratqan, soñra yaratuvnı tekrar etken ve
          sizni em kökten, em yerden rızıqlandarğanmı? Allahtan başqa bir tañrı barmı! De
          ki: Eger doğru söyley iseñiz, siz kesen-kes deliliñizni ketirñ!
        cid: 0
  - verse: 65
    segments:
      - text: >
          De ki: Köklerde ve yerde, Allahtan başqa kimse ğaybnı bilmez. Ve olar ne zaman
          tiriltileceklerini de bilmezler.
        cid: 0
  - verse: 66
    segments:
      - text: >
          Yoq; olarnıñ ahiret aqqındaki bilgeleri eksiktir. Daa da, bu hususta şübe
          içindedirler. Bundan da ğayrı, olar ahiret hususında kördirler.
        cid: 0
  - verse: 67
    segments:
      - text: >
          İnkârcılar dediler ki: Aqiqaten, biz ve atalarmız topraq olğandan soñ, aqiqaten
          (tiriltilip) çıqarılacaqmızmı?
        cid: 0
  - verse: 68
    segments:
      - text: >
          Ant olsun ki, bu tehdit bizge yapılğanı kibi, daa evel atalarımızğa da yapılğan.
          Bu, evelkilerniñ masallarından başqa bir şey degil.
        cid: 0
  - verse: 69
    segments:
      - text: >
          De ki: Yer yüzünde keziñ de, günahkârlarnıñ aqibeti nasıl oldı, köriñ!
        cid: 0
  - verse: 70
    segments:
      - text: >
          (Resulım!) Olarnıñ sebebinden kederlenme, qurayatqan tuzaqlarından ötrü, sıqıntı
          duyma.
        cid: 0
  - verse: 71
    segments:
      - text: >
          Olar: Eger doğru sözlü iseñiz (söyleñ baqayıq) bu tehdit ne vaqıt kerçekleşecek?
          derler.
        cid: 0
  - verse: 72
    segments:
      - text: >
          De ki: Çabuk kelüvini istegen şeyiñizniñ (azapnıñ) bir qısmı, er alda, yaqında
          başıñızğa kelecek. (Kâfirlerniñ, daa dünyada olğanda, çekken bir qısım
          cezalarına işaret olunmaqta ve asıl cezanıñ ahirette olğanı, ifade etilmekte).
        cid: 0
  - verse: 73
    segments:
      - text: >
          Şübesiz, Rabbiñ, insanlarğa nisbeten lütf saibidir; faqat insanlarnıñ çoqu şükür
          etmezler.
        cid: 0
  - verse: 74
    segments:
      - text: >
          Rabbiñ, elbette olarnıñ qalpleri gizlegenlerini de, aşkâr etkenlerini de bilir.
        cid: 0
  - verse: 75
    segments:
      - text: >
          Kökte ve yerde közge körünmegen iç bir şey yoqtır ki, ap-açıq bir kitapta
          (levh-i mahfuzda) olmasın.
        cid: 0
  - verse: 76
    segments:
      - text: >
          Doğrusı, bu Qur'an İsrail oğularına, aqqında ihtilaf etip kelgen şeylerniñ pek
          çoqunı añlatmaqta.
        cid: 0
  - verse: 77
    segments:
      - text: >
          Ve o, mü'minler içün, aqiqaten bir hidayet reberi ve rahmettir.
        cid: 0
  - verse: 78
    segments:
      - text: >
          Rabbiñ, şübesiz olar arasında ükmini berecek. O, mutlaq ğaliptir, er şeyni
          bilicidir.
        cid: 0
  - verse: 79
    segments:
      - text: >
          O alda, sen Allahqa işanıp tayan. Çünki, sen ap-açıq aqiqat üzresiñ.
        cid: 0
  - verse: 80
    segments:
      - text: >
          Bil ki, sen ölülerge eşittiralmazsıñ, artlarına qaytıp keter ekenler, sağırlarğa
          da davetni duyuralmazsıñ.
        cid: 0
  - verse: 81
    segments:
      - text: >
          Sen körlerni sapıqlıqlarından çevirip, doğru yolğa ketiralmazsıñ. Ancaq,
          ayetlerimizge inanıp da, teslim olğanlarğa duyura bilirsiñ.
        cid: 0
  - verse: 82
    segments:
      - text: >
          O söz başlarına kelgen (qıyamet yaqlaşqan) zamanda, olarğa yerden bir daabbe
          (mahlüq) çıqarırmız da, bu olarğa insanlarnıñ ayetlerimizge kesen-kes bir iman
          ketirmegenlerini söyler.
        cid: 0
  - verse: 83
    segments:
      - text: >
          O künü er ümmet arasından ayetlerimizni yalan sayğanlardan bir cemaat toplarmız
          da, olar toplu olaraq (esap yerine) alınıp barırırlar. (Tefsirlerde, bu yerde
          añılğan cemaat - özlerine uyılğan reberler olğanı ifade etile).
        cid: 0
  - verse: 84
    segments:
      - text: >
          Niayet, (esap yerine) kelgen vaqıtlarında Allah buyurır: Siz menim ayetlerimni,
          ne olğanını añlamadan, yalan saydıñız, öylemi? Degil ise, yapqanıñız ne edi?
        cid: 0
  - verse: 85
    segments:
      - text: >
          Yapqan aqsızlıqlarından ötrü, (azapqa oğraycaqlarını bildirgen) o söz
          kerçekleşkendir; artıq olar söylep olamazlar.
        cid: 0
  - verse: 86
    segments:
      - text: >
          Raatlansınlar diye, geceni (qaranlıq) ve (çalışsınlar diye) kündüzni aydınlıq
          yapqanımıznı körmedilermi? İman etken bir qavm içün, elbette bunda bir çoq
          ibretler bar.
        cid: 0
  - verse: 87
    segments:
      - text: >
          Suurğa üfürilgen künü, -Allahnıñ istegenleri istisna- köklerde ve yerde olğanlar
          ep deşetke qapılır. Episi, boyunları bükük alda, Oña kelirler.
        cid: 0
  - verse: 88
    segments:
      - text: >
          Sen dağlarnı körersiñ de, olarnı yerinde turğan sanarsıñ. Albuki, olar
          bulutlarnıñ yürmesi kibi yürmektedirler. (Bu,) er şeyni sap-sağlam yapqan
          Allahnıñ sanatıdır. Şübesiz ki, O, yapqanlarıñızdan tamamınen haberdardır. (Bu
          ayet dünyanıñ sabit olmayıp, areket alında olğanına işaret etmekte. Dağlarnıñ
          areket etüvi demek, olarnıñ da üzerinde bulunğan yerniñ areket etüvi demektir).
        cid: 0
  - verse: 89
    segments:
      - text: >
          Kim yahşılıqnen (ilâhiy uzurğa) kelir ise, oña daa yahşısı berilir. Ve olar o
          künü qorqudan emin olurlar.
        cid: 0
  - verse: 90
    segments:
      - text: >
          (Rabbleriniñ uzuruna) yamanlıqnen kelgen kimseler ise, yüzüqoyun ceennemge
          atılırlar. (Olarğa:) «Ancaq yapqanlarıñıznıñ qarşılığnı körmektesiñiz!»,
          (denilir.).
        cid: 0
  - verse: 91
    segments:
      - text: >
          (De ki:) Men ancaq, bu şeerniñ (Mekkeniñ) Rabbine -ki O, bu yerni toqunılmaz
          yapqan- qullıq etmeknen emir olundım. Er şey de, zaten Oña aittir. Maña
          musulmanlardan oluvım ve Qur'an oquvım emir etildi. Artıq kim doğru yolğa kelse,
          yalıñız özü içün kelgen olur; kim de sapsa, oña de ki: Men, sadece
          tenbiyecilerdenim.
        cid: 0
  - verse: 92
    segments:
      - text: >
          [91 ayetine baq.]
        cid: 0
  - verse: 93
    segments:
      - text: >
          Ve böyle de: Hamd Allahqa mahsustır. O, ayetlerini sizge kösterecek, siz de
          olarnı körüp tanıycaqsıñız (amma artıq faydası olmaycaq). Rabbiñ,
          yapqanlarıñızdan habersiz degil.
        cid: 0
