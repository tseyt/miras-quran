surah_id: 114
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >
          De ki: İnsanlarnıñ qalplerine vesvese soqqan, (insan Allahnı añğanında) pusuğa
          çekilgen cin ve insan şeytanınıñ şerrinden insanlarnıñ Rabbine, insanlarnıñ
          melikine (mutlaq saip ve akimine) insanlarnıñ İlâhine sığınırım!
