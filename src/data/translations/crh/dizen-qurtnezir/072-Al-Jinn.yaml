      - text: >-
          (ve qullıq etmeñ). (Ayetteki «mescitler» kelimesi şu şekillerde tefsir etilgen: 1).
          Namaz qılmaq içün qurulğan yerler; 2). Namaz ve ibadet yalıñız camilerge ve belli
          yerlerge ait olmağanından, bütün yer yüzü; 3). Bütün mescitlerniñ qıblası
          olğanından, «Mescid-i Haram»; 4). Secdede yerge toqunğan azalar. Bu ayette
          hristianlarnıñ kilselerine ve yeudiylerniñ havralarına kirgen vaqıtlarında,
          yapqanları kibi, Allahqa ortaq tutulmaması hatırlatılmaqta).
        cid: 0
