surah_id: 72
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >
          (Resulım!) De ki: Cinlerden bir toplulıqnıñ (men oqğan Qur'annı) diñlep de,
          böyle söylegenleri maña vahiy olunğandır: Aqiqaten, biz doğru yolğa qavuştırğan
          alelhusus güzel bir Qur'an diñledik de, oña iman ettik. (Artıq) kimseni
          Rabbimizge asla ortaq qoşmaycaqmız. (Az. Peyğamberniñ Taiften qaytqanda Batn-ı
          Nahli denilgen yerde qıldırğan saba namazı vaqtında tilge alınğan cinler
          Qur'annı eşitken, diñlegen ediler. Tefsirler bu sırada Az. Peyğamberniñ olarnı
          körmegenini, vaziyetniñ soñunda bu ayetlernen oña beyan etilgenini añlatmaqta).
        cid: 0
  - verse: 2
    segments:
      - text: >
          [1 ayetine baq.]
        cid: 0
  - verse: 3
    segments:
      - text: >
          Aqiqat şu ki, Rabbimizniñ şanı çoq yücedir. O, ne eş, ne de bala edingendir.
        cid: 0
  - verse: 4
    segments:
      - text: >
          Doğrusı, bizim fikrsizlerimiz (İblis ya da yoldan azğan cinler), Allah aqqında
          adden ziyade yalanlar uydurmaqta eken.
        cid: 0
  - verse: 5
    segments:
      - text: >
          Albuki, biz, ister insanlar, ister cinler, Allah aqqında asla yalan söylemezler,
          bellegen edik.
        cid: 0
  - verse: 6
    segments:
      - text: >
          Şu da aqiqat ki, insanlardan bazı kimleser, cinlerden bazı kimselerge sığınır
          ediler de, olarnıñ adden aşuvlarını arttıra ediler.
        cid: 0
  - verse: 7
    segments:
      - text: >
          Olar da, siz bellegeniñiz kibi, Allah iç kimseni tekrar tiriltmeycek bellegen
          ediler.
        cid: 0
  - verse: 8
    segments:
      - text: >
          Doğrusı, biz (cinler), kökni yoqladıq, faqat onı sert bekçilernen, alev
          demetlerinen toldurılğan alda taptıq.
        cid: 0
  - verse: 9
    segments:
      - text: >
          Albuki, (daa evel) biz onıñ bazı qısımlarında (haber) diñlemek içün oturacaq
          yerler (tapıp) otura edik; faqat şimdi kim diñlemek istese, özüni közetken bir
          alev demeti tapmaqta.
        cid: 0
  - verse: 10
    segments:
      - text: >
          Bilmeymiz, yer yüzündekilerine yamanlıq murat etildimi, yoqsa, Rabbleri olarğa
          bir hayır tiledimi?
        cid: 0
  - verse: 11
    segments:
      - text: >
          Aqiqaten, biz -kimimiz salih kişiler, kimimiz ise, bulardan aşağıda olmaq üzre-
          türlü-türlü yollar tutqan edik.
        cid: 0
  - verse: 12
    segments:
      - text: >
          (Artıq) şu aqiqatnı şübesiz añladıq ki, biz yer yüzünde bulunsaq da, Allahnı
          aciz bıraqalmaycaqmız, başqa yerge qaçmaqnen de, elinden qurtulalmaycaqmız.
        cid: 0
  - verse: 13
    segments:
      - text: >
          Doğrusı, biz o hidayetni (Qur'annı) eşitkenimiznen, oña iman ettik. Kim Rabbine
          iman etse, artıq ne bir (ecriniñ) eksiltilüvinden, ne de aqsızlıq etilüvinden
          qorqar.
        cid: 0
  - verse: 14
    segments:
      - text: >
          Aramızda, (Allahqa) teslimiyet köstergenler de bar, haq yoldan sapqanlar da bar.
          Teslimiyet köstergen kimseler, doğru yolnı qıdırğanlardır.
        cid: 0
  - verse: 15
    segments:
      - text: >
          Haq yoldan sapqanlarğa kelgende, olar ceennemge odun olğanlardır. (Cinlerniñ bu
          sözlerini Resulına haber bergenden soñ, Allah Taalâ böyle buyurır:)
        cid: 0
  - verse: 16
    segments:
      - text: >
          Eger doğru yolda yürseler edi, bu hususta özlerini sınamamız içün, olarğa bol
          suv berir edik. Kim Rabbiniñ zikrinden yüz çevirse, (Rabbiñ) onı ket-kete artqan
          çetin bir azapqa oğratır.
        cid: 0
  - verse: 17
    segments:
      - text: >
          [16 ayetine baq.]
        cid: 0
  - verse: 18
    segments:
      - text: >
          Mescitler şübesiz Allahnıñdır. O alda, Allahnen birlikte başqa kimsege yalvarmañ
          (ve qullıq etmeñ). (Ayetteki «mescitler» kelimesi şu şekillerde tefsir etilgen:
          1). Namaz qılmaq içün qurulğan yerler; 2). Namaz ve ibadet yalıñız camilerge ve
          belli yerlerge ait olmağanından, bütün yer yüzü; 3). Bütün mescitlerniñ qıblası
          olğanından, «Mescid-i Haram»; 4). Secdede yerge toqunğan azalar. Bu ayette
          hristianlarnıñ kilselerine ve yeudiylerniñ havralarına kirgen vaqıtlarında,
          yapqanları kibi, Allahqa ortaq tutulmaması hatırlatılmaqta).
        cid: 0
  - verse: 19
    segments:
      - text: >
          Allahnıñ qulı, Oña yalvarmağa (namazğa) qalqqanınen, aman-aman, onıñ etrafında
          kiyiz kibi, bir-birilerine kirişecek ediler. (Resul-ı Ekrem namazğa qalqqanınen,
          cinler Qur'annı diñlemek isteginen bir-birine yapışqan vaziyette, onıñ etrafında
          toplana ediler. Bu ayet içün putperest insanlarnıñ ve cinlerniñ Az. Peyğamberniñ
          dinini yoq etüv ğayesinen bir-birilerine sarılışqanları tefsiri de yapılğan).
        cid: 0
  - verse: 20
    segments:
      - text: >
          (Resulım!) De ki: Men ancaq Rabbime yalvarırım ve oña kimseni ortaq qoşmam.
        cid: 0
  - verse: 21
    segments:
      - text: >
          De ki: Doğrusı, men (öz başıma) sizge ne zarar bermek, ne de fayda teminlemek
          küçüne saibim.
        cid: 0
  - verse: 22
    segments:
      - text: >
          De ki: Aqiqaten, (maña bir yamanlıq tilese) Allahqa nisbeten meni kimse imaye
          etalmaz, Ondan başqa sığınacaq kimse de tapalmam.
        cid: 0
  - verse: 23
    segments:
      - text: >
          (Menim yapqanım) ancaq Allah qatında olğannı, Onıñ yollağanlarını tebliğdir.
          Artıq kim Allah ve Resulına qarşı kelse, bilsin ki, oña (özü kibilernen
          birlikte) içinde ebediy qalacaqları ceennem ateşi bardır.
        cid: 0
  - verse: 24
    segments:
      - text: >
          Soñunda, tehdid etilip turğanlarnı (azapnı, qıyametni) körgen vaqıtlarında, kim
          yardımcı oluvı noqtai nazarından, daa küçsiz ve sayığa köre daa az eken,
          bilecekler.
        cid: 0
  - verse: 25
    segments:
      - text: >
          De ki: Tehdid etilip keldigiñiz (azap), yaqındırmı, yoqsa, Rabbim onıñ içün uzun
          bir vaqıt qoyarmı, men bilmem.
        cid: 0
  - verse: 26
    segments:
      - text: >
          O, bütün körülmegenlerni bilir. Sırlarından kimseni haberdar etmez;
        cid: 0
  - verse: 27
    segments:
      - text: >
          Ancaq, (bildirmekni) istegen Peyğamber bundan istisnadır. Çünki, O, bunıñ
          ögünden ve artından közeticiler yollar,
        cid: 0
  - verse: 28
    segments:
      - text: >
          Ki, böylece, olarnıñ (peyğamberlerniñ), Rabbleri yollağanlarını haqqı ile tebliğ
          etkenlerini bilsin. (Allah) olarnıñ nezdinde olup keçkenlerni çevre-etrafnı
          sarğan ve er şeyni bir-bir sayğandır (qayd etkendir).
        cid: 0
