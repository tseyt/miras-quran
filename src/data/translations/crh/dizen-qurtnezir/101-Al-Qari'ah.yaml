surah_id: 101
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "Qapu qaqqan! Nedir o kapu qaqqan? O qapu qaqqannıñ ne olğanını bilesiñmi?"
        cid: 0
  - verse: 2
    segments:
      - text: "[1 ayetine baq.]"
        cid: 0
  - verse: 3
    segments:
      - text: "[1 ayetine baq.]"
        cid: 0
  - verse: 4
    segments:
      - text: "İnsanlarnıñ, ateşniñ etrafını sarğan pervaneler kibi olğanı, dağlarnıñ da avağa atılğan renkli yunge çevirilgen kunüdir (o Qaaria!)."
        cid: 0
  - verse: 5
    segments:
      - text: "[4 ayetine baq.]"
        cid: 0
  - verse: 6
    segments:
      - text: "O kunü kimniñ tartılğan imeli ağır kelse, işte o, hoşnut etici bir yaşayış içinde olur."
        cid: 0
  - verse: 7
    segments:
      - text: "[6 ayetine baq.]"
        cid: 0
  - verse: 8
    segments:
      - text: "Ameli yengil olğanğa kelgende, işte onıñ anası (eri, yurtı) Haaviyedir. (Amelniñ ağır kelüvi, hayır ve yahşılıqlarnıñ ziyade oluvı; yengil kelüvi ise, hayır ve savapnıñ kefesine (teraze kozüne) qoyulacaq amelniñ azlığı ya da olmağanı demektir)."
        cid: 0
  - verse: 9
    segments:
      - text: "[8 ayetine baq.]"
        cid: 0
  - verse: 10
    segments:
      - text: "Nedir o (Haaviye) bilesiñmi? Qızğın ateş!"
        cid: 0
  - verse: 11
    segments:
      - text: "[10 ayetine baq.]"
        cid: 0