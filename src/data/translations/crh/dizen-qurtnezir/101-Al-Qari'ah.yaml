surah_id: 101
language: crh
author: dizen-qurtnezir
verses:
  - verse: 102
    segments:
      - text: "et-TEKYaASUR Tekâasur - çoqluq yarışı ve çoqluqnen maqtanmaq demektir. Kevser suresinden soñ, Mekkede engen, 8 ayettir. Cdahiliye arapları mal, evlât ve aqrabalarınıñ çoqluğını bir ğurur ve şeref saya, atta bu hususta yaşağanlarnen qanaatlenmeyip, qabileleriniñ ustünligini keçmişlerinen de isbat etmek içün, qabirlerge bara, olgen aqrabalarınıñ çoqluğunen maqtana ediler. Surede olarnıñ bu yapqanları tenqit etilmekte ve aqiqiy ustünlikniñ ahirette ortağa çıqacağı añlatılmaqta. Bismilâaһirraһmaanirraһiim (Rahman ve rahim olğan Allaһnıñ adınen). 1-2. Çoqluq quruntısı sizni o derece meşğul etti ki, niayet qabirlerni ziyaret ettiñiz. 3-4. Yoq! Yaqında bileceksiñiz! Elbette, yaqında bileceksiñiz! 5-8. Aqiqat oyle degil! Kesen-kes bilgi ile bilgen olsa ediñiz, (o yerde) mıtlaqa ceennem ateşini korer ediñiz. Soñra ahirette onı açıq koznen koreceksiñiz. Niayet, o kunü (dünyada faydalanğan) nimetleriñizden, elbette ve elbette esapqa çekileceksiñiz."
