      - text: >-
          (Ayetlerde baas etilgenlerden Az.Nuhnıñ qadını qavmına onıñ mecnun olğanını söyley
          edi. Az.Luutnıñ qadını da, qocasına kelgen erkek musafirlerni, gece ateş yaqaraq,
          kündüz de duman çıqararaq, haber bere edi. Ekisi de lâyıq olğan cezalarına
          oğratıldılar. Fıravunıñ qadını Asiye Az.Musağa iman etken edi. Bundan tolayı, qocası
          Fıravun onı ellerinden ve ayaqlarından dört qazıqqa bağlağan, köküsine qocaman bir
          taş qoyğan, öylece yaqıcı küneşke bıraqqan edi. Eskence vaqtında zikr etilgen duanı
          yapar eken, ruhını teslim etken).
