      - text: >-
          (Ayet işaret etken adise şu: Az.Peyğamber zevcelerinden Zeyneb binti Cahşnıñ evinde
          bal şerbeti içken ve bu sebepnen, onıñ yanında biraz ziyade qalğan. Bu alnı künlegen
          eki zevcesi Ayşe ve Havsa aralarında qararlaştırıp, Peyğamber yanlarına barğanda,
          ondan meğafir qoqusı kelgenini söylediler. Az.Peyğamber meğafir aşamağanını ayttı.
          «Demek ki, balnı yapqan qurt meğafir yalağan», dedi ve bir daa bal şerbeti içmemege
          yemin etti. Sureniñ bu munasebetnen engeni rivayet etilgen).
