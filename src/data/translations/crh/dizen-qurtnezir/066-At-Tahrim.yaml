surah_id: 66
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >
          Ey, Peyğamber! Zevceleriñniñ rizasını közeterek, Allahnıñ saña elâl etken şeyini
          niçün özüñe aram etmektesiñ? Allah çoq bağışlayıcı, çoq merhametlidir. (Ayet
          işaret etken adise şu: Az.Peyğamber zevcelerinden Zeyneb binti Cahşnıñ evinde
          bal şerbeti içken ve bu sebepnen, onıñ yanında biraz ziyade qalğan. Bu alnı
          künlegen eki zevcesi Ayşe ve Havsa aralarında qararlaştırıp, Peyğamber yanlarına
          barğanda, ondan meğafir qoqusı kelgenini söylediler. Az.Peyğamber meğafir
          aşamağanını ayttı. «Demek ki, balnı yapqan qurt meğafir yalağan», dedi ve bir
          daa bal şerbeti içmemege yemin etti. Sureniñ bu munasebetnen engeni rivayet
          etilgen).
        cid: 0
  - verse: 2
    segments:
      - text: >
          Allah, (kerekkende) yeminleriñizni bozuvıñıznı sizge uyğun yapqan. Siziñ
          yardımcıñız Allahtır. O, bilicidir, ikmet saibidir.
        cid: 0
  - verse: 3
    segments:
      - text: >
          Peyğamber zevcelerinden birine gizliden bir söz söylegen edi. Faqat qadını, o
          sözni başqalarına haber berip, Allah da bunı Peyğamberge beyan etkeninen,
          Peyğamber bir qısmını bildirgen, bir qısmındanda vazgeçken edi. Peyğamber bunı
          oña haber bergeninen qadını: Bunı saña kim bildirdi? dedi. Peyğamber: Bilici, er
          şeyden haberi olğan Allah maña haber berdi, dedi. (Rivayetke köre, Resulullah
          qadını Havsa evde olmağan bir vaqıtta, cariyesi Mariyeni onıñ odasına alğan edi.
          Havsa bundan haberdar olğanınen, kederini bildirgen ve darılğan edi. Resulullah
          da Havsağa bundan bu yana Mariyeni töşegine almaycağını aytqan ve bunı gizli
          tutuvını tenbiliyegen edi. Havsa ise, bu meseleni Az.Ayşege añlatqan, bunıñ
          üzerine yuqaradaki ayet nazil olğan. Başqa bir rivayetke köre, Az.Peyğamber
          ölüminden soñ, halifelikke sırasınen Ebu Bekir ve Umerniñ keçeceklerini
          söylegen, Havsa Az.Peyğamberniñ bu sırını Az.Ayşege söylegeninen, vaziyet vahiy
          ile Az.Peyğamberge bildirilgen ve ayette zikr etilgen qonuşma sadir olğan).
        cid: 0
  - verse: 4
    segments:
      - text: >
          Eger ekiñiz de Allahqa tövbe etseñiz, (yerinde olur). Çünki, qalpleriñiz sapqan
          edi ve eger Peyğamberge qarşı bir-biriñizge arqa olsañız, bilesiñiz ki, onıñ
          dostu ve yardımcısı Allah, Cebrail ve mü'minlerniñ eyileridir. Bularnıñ artından
          melekler de (oña) yardımcıdır. (Ayette, Az.Ayşe ve Havsağa hitap etilgen,
          Az.Peyğamberniñ göñlüni aluvları istenilgen, küncülik, sır darqatmaq ve o
          hoşlanmaycaq adden aşuvlardan qaçınmaq meselesinde tenbiyelengenler).
        cid: 0
  - verse: 5
    segments:
      - text: >
          Eger o sizni ayırsa, Rabbi oña sizden daa yahşı, özüni Allahqa bağışlağan,
          inanğan, sebatnen itaat etken, tövbe etken, ibadet etken, oraza tutqan, tul ve
          bakire qadınlar bere bilir. (Ayet Az.Peyğamberniñ iç bir zevcesini ayırmağanınıñ
          delilidir).
        cid: 0
  - verse: 6
    segments:
      - text: >
          Ey, inanğanlar! Özüñizni ve aileñizni, yaqarlığı insanlar ve taşlar olğan
          ateşten qorçalañ. Onıñ başında acımağan, küçlü, Allahnıñ olarğa buyurulğanına
          qarşı kelmegen ve emir etilgenlerini yapqan melekler bardır.
        cid: 0
  - verse: 7
    segments:
      - text: >
          Ey, kâfirler! Bugün üzür tilemeñ! Siz, ancaq işlegenleriñizniñ cezasını
          çekeceksiñiz, (denilir).
        cid: 0
  - verse: 8
    segments:
      - text: >
          Ey, iman etkenler! Samimiy bir tövbe ile Allahqa dönüñ. Ümüt etilir ki, Rabbiñiz
          siziñ yamanlıqlarıñıznı qapatır. Peyğamberni ve onıñnen birlikte iman etkelerni
          utandırmaycaq künde Allah sizni, içlerinden irmaqlar aqqan cennetlerge qoyar.
          Olarnıñ öglerinden ve sağlarından (ameleriniñ) nurları aydınlatıp keter de, «Ey,
          Rabbimiz! Nurımıznı biz içün tamamla, bizni bağışla; çünki, Sen er şeyge
          qadirsiñ», derler. («Samimiy bir tövbe» diye tercime etilgen «tövbe-i nasuuh»
          içün bir çoq yorum yapılğan. Bularnıñ umumiy noqtası şu: «Nasuuh», «nush»
          esasındandır. Buña köre, «tövbe-i nasuuh»; tövbe etkenniñ öz nefsine nasiat
          diñlete bilüvi, günahlarına soñ derece kederlenüvi ve artıq olarğa dönmemege
          qarar berüvi demektir).
        cid: 0
  - verse: 9
    segments:
      - text: >
          Ey, Peyğamber! Kâfirlerge ve munafıqlarğa qarşı cihad et, olarğa nisbeten sert
          davran, olarnıñ baracaq yerleri ceennemdir. O barılacaq yer ne de fenadır!
        cid: 0
  - verse: 10
    segments:
      - text: >
          Allah inkâr etkenlerge Nuhnıñ qadınınen Luutnıñ qadınını misal berdi. Bu ekisi,
          qullarımızdan eki salih kişiniñ nikâhları altında olğanda, olarğa hainlik
          yaptılar. Qocaları Allahtan kelgen iç bir şeyni olardan uzaqlaştıralmadı.
          Olarğa: Aydı, ateşke kirgenlernen beraber sizde kiriñ! denildi.
        cid: 0
  - verse: 11
    segments:
      - text: >
          Allah, inanğalarğa da Fıravunnıñ qadınını misal kösterdi. O: Rabbim! Maña
          qatıñda, cennette bir ev yap; meni Fıravundan ve onıñ (fena) işinden qorçala ve
          meni zalımlar toplulığından qurtar! degen edi.
        cid: 0
  - verse: 12
    segments:
      - text: >
          İffetini qorçalağan, imran qızı Meryemni de (Allah örnek kösterdi). Biz oña
          ruhumızdan üfledik ve Rabbiniñ sözlerini ve kitaplarını tasdiq etti. O, gönülden
          itaat etkenlerden edi. (Ayetlerde baas etilgenlerden Az.Nuhnıñ qadını qavmına
          onıñ mecnun olğanını söyley edi. Az.Luutnıñ qadını da, qocasına kelgen erkek
          musafirlerni, gece ateş yaqaraq, kündüz de duman çıqararaq, haber bere edi.
          Ekisi de lâyıq olğan cezalarına oğratıldılar. Fıravunıñ qadını Asiye Az.Musağa
          iman etken edi. Bundan tolayı, qocası Fıravun onı ellerinden ve ayaqlarından
          dört qazıqqa bağlağan, köküsine qocaman bir taş qoyğan, öylece yaqıcı küneşke
          bıraqqan edi. Eskence vaqtında zikr etilgen duanı yapar eken, ruhını teslim
          etken).
        cid: 0
