surah_id: 66
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "Ey, Peyğamber! Zevceleriñniñ rizasını kozeterek, Allaһnıñ saña elâl etken şeyini niçün ozüñye aram etmektesiñ? Allaһ çoq bağışlayıcı, çoq merhametlidir. (Ayet işaret etken adise şu: Az.Peyğamber zevcelerinden Zeyneb binti Cahşnıñ evinde bal şerbeti içken ve bu sebepnen, onıñ yanında biraz ziyade qalğan. Bu alnı kunlegen eki zevcesi Ayşe ve Havsa aralarında qararlaştırıp, Peyğamber yanlarına barğanda, ondan meğafir qoqusı kelgenini söylediler. Az.Peyğamber meğafir aşamağanını ayttı. «Demek ki, balnı yapqan qurt meğafir yalağan», dedi ve bir daa bal şerbeti içmemege yemin etti. Sureniñ bu munasebetnen engeni rivayet etilgen)."
        cid: 0
  - verse: 2
    segments:
      - text: "Allaһ, (kerekkende) yeminleriñizni bozuvıñıznı sizge uyğun yapqan. Siziñ yardımcıñız Allaһtır. O, bilicidir, ikmet sanbidir."
        cid: 0
  - verse: 3
    segments:
      - text: "Peyğamber zevcelerinden birine gizliden bir söz söylegen edi. Faqat qadını, o sözni başqalarına haber berip, Allaһ da bunı Peyğamberge beyan etkeninen, Peyğamber bir qısmını bildirgen, bir qısmındanda vazgeçken edi. Peyğamber bunı oña haber bergeninen qadını: Bunı saña kim bildirdi? dedi. Peyğamber: Bilici, er şeyden haberi olğan Allaһ maña haber berdi, dedi. (Rivayetke kore, Resulullah qadını Havsa evde olmağan bir vaqıtta, cariyesi Mariyeni onıñ odasına alğan edi. Havsa bundan haberdar olğanınen, kederini bildirgen ve darılğan edi. Resulullah da Havsağa bundan bu yana Mariyeni töşegine almaycağını aytqan ve bunı gizli tutuvını tenbiliyegen edi. Havsa ise, bu meseleni Az.Ayşege añlatqan, bunıñ uzerine yuqaradaki ayet nazil olğan. Başqa bir rivayetke kore, Az.Peyğamber olüminden soñ, halifelikke sırasınen Ebu Bekir ve Umerniñ keçeceklerini söylegen, Havsa Az.Peyğamberniñ bu sırını Az.Ayşege söylegeninen, vaziyet vahiy ile Az.Peyğamberge bildirilgen ve ayette zikr etilgen qonuima sadir olğan)."
        cid: 0
  - verse: 4
    segments:
      - text: "Eger ekiñiz de Allaһqa tövbe etseñiz, (erinde olur). Çünki, qalpleriñiz sapqan edi ve eger Peyğamberge qarşı bir-biriñizge arqa olsañız, bilesiñiz ki, onıñ dostu ve yardımcısı Allaһ, Cebrail ve mu’minlerniñ eyileridir. Bularnıñ artından melekler de (oña) yardımcıdır. (Ayette, Az.Ayşe ve Havsağa hitap etilgen, Az.Peyğamberniñ goñlüni aluvları istenilgen, kuncülik, sır darqatmaq ve o hoşlanmaycaq adden aşuvlardan qaçınmaq meselesinde tenbiyelengenler)."
        cid: 0
  - verse: 5
    segments:
      - text: "Eger o sizni ayırsa, Rabbi oña sizden daa yahşı, ozüni Allaһqa bağışlağan, inanğan, sebatnen itaat etken, tövbe etken, ibadet etken, oraza tutqan, tul ve bakire qadınlar bere bilir. (Ayet Az.Peyğamberniñ iç bir zevcesini ayırmağanınıñ delilidir)."
        cid: 0
  - verse: 6
    segments:
      - text: "Ey, inanğanlar! Ozüñizni ve aileñizni, yaqarlığı insanlar ve taşlar olğan ateşten qorçalañ. Onıñ başında acımağan, kuçlü, Allaһnıñ olarğa buyurulğanına qarşı kelmegen ve emir etilgenlerini yapqan melekler bardır."
        cid: 0
  - verse: 7
    segments:
      - text: "Ey, kâfirler! Bugun uzür tilemeñ! Siz, ancaq işlegenleriñizniñ cezasını çekeceksiñiz, (denilir)."
        cid: 0
  - verse: 8
    segments:
      - text: "Ey, iman etkenler! Samimiy bir tövbe ile Allaһqa dönüñ. Umüt etilir ki, Rabbiñiz siziñ yamanlıqlarıñıznı qapatır. Peyğamberni ve onıñnen birlikte iman etkelerni utandırmaycaq kunde Allaһ sizni, içlerinden irmaqlar aqqan cennetlerge qoyar. Olarnıñ oglerinden ve sağlarından (ameleriniñ) nurları aydınlatıp keter de, «Ey, Rabbimiz! Nurımıznı biz içün tamamla, bizni bağışla; çünki, Sen er şeyge qadirsiñ», derler. («Samimiy bir tövbe» diye tercime etilgen «tövbe-i nasuuһ» içün bir çoq yorum yapılğan. Bularnıñ umumiy noqtası şu: «Nasuuһ», «nusһ» esasındandır. Buña kore, «tövbe-i nasuuһ»; tövbe etkenniñ oz nefsine nasiat diñlete bilüvi, gunahlarına soñ derece kederlenüvi ve artıq olarğa dönmemege qarar berüvi demektir)."
        cid: 0
  - verse: 9
    segments:
      - text: "Ey, Peyğamber! Kâfirlerge ve munafıqlarğa qarşı cihad et, olarğa nisbeten sert davran, olarnıñ baracaq yerleri ceennemdir. O barılacaq yer ne de fenadır!"
        cid: 0
  - verse: 10
    segments:
      - text: "Allaһ inkâr etkenlerge Nuһnıñ qadınınen Luutnıñ qadınını misal berdi. Bu ekisi, qullarımızdan eki salih kişiniñ nikâhları altında olğanda, olarğa hainlik yaptılar. Qocaları Allaһtan kelgen iç bir şeyni olardan uzaqlaştıralmadı. Olarğa: Aydı, ateşke kirgenlernen beraber sizde kiriñ! denildi."
        cid: 0
  - verse: 11
    segments:
      - text: "Allaһ, inanğalarğa da Fıravunnıñ qadınını misal kosterdi. O: Rabbim! Maña qatıñda, cennette bir ev yap; meni Fıravundan ve onıñ (fena) işinden qorçala ve meni zalımlar toplulığından qurtar! degen edi."
        cid: 0
  - verse: 12
    segments:
      - text: "İffetini qorçalağan, imran qızı Meryemni de (Allaһ ornek kosterdi). Biz oña ruhumızdan ufledik ve Rabbiniñ sözlerini ve kitaplarını tasdiq etti. O, gonülden itaat etkenlerden edi. (Ayetlerde baas etilgenlerden Az.Nuһnıñ qadını qavmına onıñ mecnun olğanını söyley edi. Az.Luutnıñ qadını da, qocasına kelgen erkek musafirlerni, gece ateş yaqaraq, kundüz de duman çıqararaq, haber bere edi. Ekisi de lâyıq olğan cezalarına oğratıldılar. Fıravunıñ qadını Asiye Az.Musağa iman etken edi. Bundan tolayı, qocası Fıravun onı ellerinden ve ayaqlarından dört qazıqqa bağlağan, koküsine qocaman bir taş qoyğan, oylece yaqıcı kuneşke bıraqqan edi. Eskence vaqtında zikr etilgen duanı yapar eken, ruhını teslim etken)."
        cid: 0