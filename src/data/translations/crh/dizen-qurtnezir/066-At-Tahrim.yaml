      - text: >-
          (Rivayetke köre, Resulullah qadını Havsa evde olmağan bir vaqıtta, cariyesi Mariyeni
          onıñ odasına alğan edi. Havsa bundan haberdar olğanınen, kederini bildirgen ve
          darılğan edi. Resulullah da Havsağa bundan bu yana Mariyeni töşegine almaycağını
          aytqan ve bunı gizli tutuvını tenbiliyegen edi. Havsa ise, bu meseleni Az.Ayşege
          añlatqan, bunıñ üzerine yuqaradaki ayet nazil olğan. Başqa bir rivayetke köre,
          Az.Peyğamber ölüminden soñ, halifelikke sırasınen Ebu Bekir ve Umerniñ keçeceklerini
          söylegen, Havsa Az.Peyğamberniñ bu sırını Az.Ayşege söylegeninen, vaziyet vahiy ile
          Az.Peyğamberge bildirilgen ve ayette zikr etilgen qonuşma sadir olğan).
        cid: 0
