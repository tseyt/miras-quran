surah_id: 14
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >
          Elif. Lâam. Miim. Raa. (Bu Qur'an), Rabbleriniñ izninen, insanlarnı
          qaranlıqlardan aydınlıqqa, yani er şeyge ğalip (ve) maqtavğa lâyıq Allahnıñ
          yoluna çıqaruvıñ içün, saña endirgen bir Kitabımızdır.
        cid: 0
  - verse: 2
    segments:
      - text: >
          O, Allah ki, köklerde ve yerde ne bar olsa, episi Onıñdır. Şeiddetli azaptan
          tolayı, kâfirlerniñ alına vay!
        cid: 0
  - verse: 3
    segments:
      - text: >
          Dünya ayatını ahiretten üstün tutqanlar, Allah yolundan çevirgenler ve onıñ
          egriligini istegenler bar ya, işte, olar (haqtan) uzaq bir sapıqlıq
          içindedirler.
        cid: 0
  - verse: 4
    segments:
      - text: >
          (Allahnıñ emirlerini) olarğa yahşıca añlatsın, dep er peyğamberni yalıñız öz
          qavmınıñ tilinen yolladıq. Artıq, Allah istegenini saptırır, istegenini de doğru
          yolğa qoyar. Çünki, O küç ve ikmet saibidir. (Er peyğamberniñ, ancaq öz qavmınıñ
          tilinen yollanılğanı - bütün insanlardan tek bir tilnen, meselâ, arapçanen
          añlaşuvlarınıñ, yalvarıp, duada bulunuvlarınıñ istenilmegenini köstere. Zaten,
          bir ayet-i kerimede qonuşılğan tillerniñ çeşit türlü oluvı bile, Allahnıñ
          barlığınıñ ve qudretiniñ deliillerindendir. Bunıñ kibi de, bu ayet-i kerimeniñ
          işaret etken müim noqtalırından biri de, haqqa davet ile oğraşqanlarnıñ içinde
          bulunğan toplumnıñ tilini çoq yahşı bilmeleri kerekligi hususıdır).
        cid: 0
  - verse: 5
    segments:
      - text: >
          Ant olsun ki, Musanı da: Qavmıñnı qaranlıqtan aydınlıqqa çıqar ve olarğa
          Allahnıñ (keçmiş qavmlarnıñ başına ketirgen felâket) künlerini hatırlat, diye
          mucizelerimiznen yolladıq. Şübesiz ki, bunda çoq sabırlı, çoq şükür etken er kes
          içün ibretler bar.
        cid: 0
  - verse: 6
    segments:
      - text: >
          O vaqıtta Musa qavmına degen edi ki: «Allahnıñ üzeriñizdeki nimetini hatırlañ.
          Çünki, O, sizni eskenceniñ eñ fenasına sürmekte ve oğullarñıznı soyup,
          qadınlarıñıznı (qızlarıñıznı) bıraqqan Fıravun ailesinden qurtardı. İşte, bu
          sizge añlatılğanlarda Rabbiñizden büyük bir imtian bardır».
        cid: 0
  - verse: 7
    segments:
      - text: >
          «Hatırlañ ki, Rabbiñiz sizge: Eger şükür etseñiz, elbette sizge (nimetimni)
          arttıracam ve eger nankorlik etseñiz, iç şübesiz, azabım çoq şiddetlidir! diye
          bildirgen edi».
        cid: 0
  - verse: 8
    segments:
      - text: >
          Musa dedi ki: «Eger siz ve yer yüzünde olğanlarnıñ episi nankorlik etseñiz,
          biliñ ki, Allah kerçekten zengindir, hamd etilmege lâyıqtır».
        cid: 0
  - verse: 9
    segments:
      - text: >
          Sizden evelkilerniñ, Nuh, Aad ve Semuud qavmlarınıñ ve olardan soñkilerniñ
          haberleri sizge kelmedimi? Olarnı Allahtan başqası bilmez. Peyğamberleri olarğa
          mucizeler ketirdi de, olar ellerinen peyğamberleriniñ ağızlarını qapattılar ve
          dediler ki: Biz sizge yollanılğannı inkâr ettik ve bizni özüne çağırğan işiñizge
          nisbeten teren bir şübe içindemiz. (İbn Mesud bu ayetni oquğan vaqtında «Nesep
          alimleri yalancıdırlar», der edi. Yani olar neseplerni bilgenlerini idda eter
          ekenler, Allah bunı red ete. İbn Abbas da: «Adnan ile İsmail arasında bilinmegen
          otuz baba (nesil) mevcuttır», der edi. Buña köre, ayetniñ manası: «Olar o qadar
          çoq ediler ki, sayılarını Allahtan başqa kimse bilalmaz», demek olur).
        cid: 0
  - verse: 10
    segments:
      - text: >
          Peyğamberleri dedi ki: Köklerni ve yerni yaratqan Allah aqqında şübe barmı?
          Albuki, O siziñ günahlarıñızdan bir qısmını bağışlamaq ve sizni muayen bir
          vaqıtqa qadar yaşatmaq içün, sizni (haq dinge) çağıra. Olar dediler ki: Siz de
          bizim kibi bir insandan başqa bir şey degilsiñiz. Siz bizni atalarımıznıñ
          tabınğan şeylerinden döndürmek isteysiñiz. Öyle ise, bizge ap-açıq bir delil
          ketiriñ! (Olar özlerine bildirilgen bu qadar açıq delillerge, vesiqalarğa ve
          mucizelerge qaniy olmayıp, inatlıqları sebebinden, daa başqa mucizeler, atta
          özlerini qahr etecek felâketler istey ve mucizelernen sanki eglene ediler).
        cid: 0
  - verse: 11
    segments:
      - text: >
          Peyğamberleri olarğa dediler ki: «(Ebet) biz siziñ kibi bir insandan başqası
          degilmiz. Faqat Allah nimetini qullarından istegenine lütf eter. Allahnıñ izni
          olmadan, bizim sizge bir delil ketirüvimizge imkân yoq. Mü'minler yalıñız
          Allahqa tayansınlar».
        cid: 0
  - verse: 12
    segments:
      - text: >
          «Em bizge yollarımıznı köstergeni alda, ne diye biz Allahqa tayanıp işanmayıq?
          Siziñ bizge bergen eziyetiñizge, elbette qatlanacaqmız. Tevekkül etkenler
          yalıñız Allahqa tevekkülde sebat etsinler».
        cid: 0
  - verse: 13
    segments:
      - text: >
          Kâfir olğanlar peyğamberlerine dediler ki: «Elbet de, sizni ya yurtumızdan
          çıqaracaqmız, ya da mıtlaqa dinimizge döneceksiñiz!" Rabbleri de olarğa:
          «Zalımlarnı mıtlaqa elâk etecekmiz!» diye vahiy etti.
        cid: 0
  - verse: 14
    segments:
      - text: >
          Ve (ey, inanğanlar!) olardan soñ sizni mıtlaqa o yerde yerleştirecekmiz. İşte,
          bu maqamından qorqqan ve tehdidimden saqınğan kimselerge aittir. (Bu ayette
          Az.Peyğamberniñ memlekitinden icret etecegine, faqat soñunda onı çıqarğanlarnıñ
          yurtuna malik olacağına bir işaret bar).
        cid: 0
  - verse: 15
    segments:
      - text: >
          (Peyğamberler) feth istediler (Allah da berdi). Er inatçı zorbacı da felâketke
          oğradı.
        cid: 0
  - verse: 16
    segments:
      - text: >
          Artından da (o inatçı zorbacığa) ceennem bardır; özüne irinli suv içirilecek.
        cid: 0
  - verse: 17
    segments:
      - text: >
          Onı yutumlamağa areket etecek, faqat boğazından keçiralmaycaq ve oña er taraftan
          ölüm kelecek, albuki, o ölecek degildir (ki azaptan qurtulsın). Bundan ğayrı,
          şiddetli bir azap da bardır.
        cid: 0
  - verse: 18
    segments:
      - text: >
          Rabblerini inkâr etkenlerniñ vaziyeti (şudır): Olarnıñ amelleri fırtınalı bir
          künde rüzgâr şiddetnen savurğan külge beñzer. Qazanğanlarından iç bir şeyni elde
          etalmazlar. Olduqça saptırmaq, işte budır. (Allah Taalâ kâfirlerniñ amellerini
          fırtınalı bir künde rüzgâr şiddetnen savurğan bir külge beñzetmekte ki, olarnıñ
          ameli ne qadar eyi ve çoq olsa-olsun, netice itibarınen ahirette fayda
          bermeycek. Çünki, Allah Taalâ insanlarnı evelâ özüne ve yollanılğan
          peyğamberlerniñ episine iman ile mükellef tutmaqta olup, savap ve mükâfatnı
          bundan soñ berecegini bildirimekte. Tolayısınen, imanı olmağanlar yapqan eyi
          işleriniñ qarşılığını dünyada olğanda alırlar, amma ahirette olarğa berilecek iç
          bir şey yoqtır).
        cid: 0
  - verse: 19
    segments:
      - text: >
          Allah köklerni ve yerni haq ile yaratqanını körmediñmi? O istese, sizni yoq
          etip, yap-yañı halq ketirir.
        cid: 0
  - verse: 20
    segments:
      - text: >
          Bu, Allahqa küç degil.
        cid: 0
  - verse: 21
    segments:
      - text: >
          (Qıyamet kününde) episi Allahnıñ uzuruna çıqacaq ve zayıflar o büyüklik
          taslağanlarğa deycekler ki: «Biz sizge tabiyler edik. Şimdi siz Allahnıñ
          azabından er angi bir şeyni bizden uzaqlaştıra bilirsizmi?» Olar da deycekler
          ki: «(Ne yapayıq) Allah bizni hidayetke iriştirse edi, biz de sizni doğru yolğa
          qavuştırır edik. Şimdi sızlansaq da, sabır etsek de birdir. Çünki, bizim içün
          sığınacaq bir yer yoqtır».
        cid: 0
  - verse: 22
    segments:
      - text: >
          (Esapları körülip) iş bitirlgeninen, şeytan deycek ki: «Şübesiz, Allah sizge
          kerçek olğannı vade etti, men de sizge vade ettim, amma, sizge yalancı oldım.
          Zaten, menim sizge qarşı bir küçüm yoq edi. Men, sadece, sizni (inkârğa)
          çağırdım, siz de menim davetime aman çaptıñız. O alda, meni yamanlamañ, özüñizni
          yamanlañ. Ne men sizni, ne de siz meni qurtara bilirsiñiz! Şübesiz, daa evel
          men, meni (Allahqa) ortaq qoşuvıñıznı red ettim». Şübesiz, zalımlar içün elem
          berici bir azap bardır.
        cid: 0
  - verse: 23
    segments:
      - text: >
          İman etip de, yahşı işler yapqanlar, Rabbleriniñ izninen, içinde ebediy
          qalacaqları ve zemininden irmaqlar aqqan cennetlerge kirsetilecekler. O yerde
          (bir-birilerinen rastkelişkende) söylegenleri «Selâm»dır. (Selâm er türlü
          fenalıqlardan, meşaqqat, ğam, qusur ve afattan qurtulmaq demektir Mü'minler em
          dünyada, em de ahirette rastkelişken vaqıtlarında, bir-birilerine böyle bir
          duada bulunırlar).
        cid: 0
  - verse: 24
    segments:
      - text: >
          Körmediñmi, Allah nasıl bir misal ketirdi: Güzel bir sözni, tamırı (yerde)
          qaviy, dalları kökte olğan güzel bir terekke (beñzetti). (Güzel söz güzel
          terekke beñzetilmekte. Çünki, terekniñ tiri qaluvı içün nasıl suvarılmağa,
          baqılmağa itiyacı olsa, bular olmağanda qurusa, qalpteki iman teregi de
          böyledir. Eger saibi faydalı ilim, sahih amel, zikr ve tefekkürnen er zaman
          baqıp, onı közetmese, quruy bile. Bir hadis-i şerifte: «Urba nasıl ipranıp
          eskirse, qalpteki iman da öyle ipranır, eskirir. O alda, imanıñıznı daima
          tazeleñ, denilip, bu aqiqat diqqatlarımızğa taqdim etilgen).
        cid: 0
  - verse: 25
    segments:
      - text: >
          (O terek), Rabbiniñ izninen, er zaman meyvasını berir. Ögüt alsınlar diye, Allah
          insanlarğa misaller ketirir. (Evelke bir ayette Allah Taalâ güzel sözni güzel
          terekke beñzetken edi. Çünki, güzel sözniñ meyvası güzel amel; güzel terekniñ
          bereketi de, faydalı meyvadır. Tefsircilerniñ añlatqanlarına köre, güzel söz -
          kelime-i şeadettir. Bu kelime tışta ve içte daima güzel amelerniñ meydanğa
          kelüvine sebep olur. Allah razı olacaq er güzel iş - bu kelimeniñ meyvasıdır.
          Aşağıdaki ayette keçken «Fena kelime»ge kelgende, o da Allahnı inkâr etmektir.
          Bu kelime er türlü fitneniñ, fesatnıñ, felâket ve musibetniñ menbaıdır. Fena söz
          em dünyada, em de ahirette insannıñ felâketlerge süyreklenmesine sebep olur.
          Tolayısınen, aşağadaki ayette fena söz fena bir terekke beñzetilgen).
        cid: 0
  - verse: 26
    segments:
      - text: >
          Fena bir sözniñ misali - kevdesi yerden qoparılğan, o sebepten tik turmaq imkânı
          olmağan (fena) bir terekke beñzer.
        cid: 0
  - verse: 27
    segments:
      - text: >
          Allah Taalâ sağlam söznen iman etkenlerni em dünya ayatında, em de ahirette
          sap-sağlam tutar. Zalımlarnı ise, Allah saptırır. Allah istegenini yapar.
        cid: 0
  - verse: 28
    segments:
      - text: >
          Allahnıñ nimetine nankorliknen qarşılıq bergen ve soñunda qavmlarını elâk
          yurtuna süyreklegenlerni körmediñmi?
        cid: 0
  - verse: 29
    segments:
      - text: >
          Olar ceennemge kirecekler. O ne fena mekândır.
        cid: 0
  - verse: 30
    segments:
      - text: >
          (İnsanlarnı) Allah yolundan saptırmaq içün Oña ortaqlar qoştılar. De ki :
          (İstegeniñiz kibi) yaşañ! Çünki, ateşke döneceksiñiz.
        cid: 0
  - verse: 31
    segments:
      - text: >
          İman etken qullarıma söyle: Namazlarını dos-doğru qılsınlar, özünde ne
          alış-veriş, ne de dostluq olğan bir kün kelmeden evel, özlerine bergen
          rızıqlarımızdan (Allah içün gizli-aşkâr arclasınlar).
        cid: 0
  - verse: 32
    segments:
      - text: >
          (O, öyle lütfkâr) Allahtır ki, köklerni ve yerni yarattı, kökten suvnı endirip,
          onıñnen rızıq olaraq sizge türli meyvalar çıqardı; izninen deñizde yaldavları
          içün gemilerni emriñizge berdi; nehrlerni de siziñ (faydalanuvıñız) içün aqızdı.
        cid: 0
  - verse: 33
    segments:
      - text: >
          Tertipnen kezici küneşni ve aynı sizge faydalı yaptı; geceni ve kündüzni de
          faydalanuvıñızğa berdi.
        cid: 0
  - verse: 34
    segments:
      - text: >
          O sizge istegen er şeyiñizden berdi. Allahnıñ nimetini sayacaq olsañız,
          sayalmazsıñız. Doğrusı, insan çoq zalım, çoq nankordir.
        cid: 0
  - verse: 35
    segments:
      - text: >
          Hatırla ki, İbrahim böyle degen edi: «Rabbim. Bu şeerni (Mekkeni) işançlı et,
          meni ve oğullarımnı putlarğa tabınuvdan uzaq tut».
        cid: 0
  - verse: 36
    segments:
      - text: >
          «Çünki, olar (putlar) insanlardan bir çoqunıñ sapuvına sebep oldılar, Rabbim.
          Şimdi kim maña uysa, o mendendir. Kim de maña qarşı kelse, artıq sen aqiqaten
          çoq bağışlayıcısıñ, pek merhametlisiñ». (Az.İbrahim Allah Taalâ putperestlerni
          bağışlamaycağını daa bilmey edi. Onıñ içün olarnıñ da bağışlanmasını istedi.
          Müşriklerniñ bağışlanmaycağını añlağandan soñ, artıq olarnıñ afu etelüvi içün
          dua etmedi).
        cid: 0
  - verse: 37
    segments:
      - text: >
          «Ey, Rabbimiz! Ey, saibimiz! Namaznı dos-doğru qıluvları içün men neslimden bir
          qısmını seniñ Beyt-i Haramıñnıñ (Kâbeniñ) yanında ziraat yapılmağan bir vadige
          yerleştirdim. Artıq sen de insanlardan bir qısmınıñ goñüllerini olarğa meyl
          etici yap ve meyvalardan bularğa rızıq ber. Ümüt etilir ki, bu nimetlerge şükür
          eterler». (Rivayet etilgenine köre, Az.İbrahimniñ qadını Sareniñ Hacer isimli
          bir hızmetkârı bar edi. Onı qocası Az.İbrahimge berdi ve İbrahim (a.s.)niñ ondan
          İsmail adlı bir oğlu dünyağa keldi. Az.İbrahim olarnı Mekkege alıp bardı. Kâbi
          yaqınlarında bir yerge yerleştirdi. Mekke suvsız, sazlıq ve qayalı bir yer edi.
          Allah Taalâ Az.İbrahimniñ duasını qabul etti. O yerde zemzem diye añılğan suv
          fışqırdı).
        cid: 0
  - verse: 38
    segments:
      - text: >
          «Ey, Rabbimiz! Şübesiz ki, sen bizim gizleycegimizni de, aşkâr etecegimizni de
          bilirsiñ. Çünki, ne yerde, ne de kökte, iç bir şey Allahqa gizli qalmaz».
        cid: 0
  - verse: 39
    segments:
      - text: >
          «İhtiyar alımda maña İsmailni ve İshaqnı lütf etken Allahqa hamd olsun! Şübesiz,
          Rabbim duanı eşiticidir». (Rivayetke köre, İsmail (a.s.) doğğan vaqıtta babası
          99 yaşında edi. İshaq (a.s.) doğğanda 112 yaşında edi. İshaq Peyğamber İsmailden
          13 sene soñ, Sareden dünyağa kelgen).
        cid: 0
  - verse: 40
    segments:
      - text: >
          «Ey, Rabbim! Meni ve soyumdan keleceklerni namaznı devamlı qılğanlardan eyle;
          Ey, Rabbimiz! Duamnı qabul et!»
        cid: 0
  - verse: 41
    segments:
      - text: >
          «Ey, Rabbimiz! (Amellerniñ) esap olunacaq künü meni, anam-babamnı ve mü'minlerni
          bağışla!»
        cid: 0
  - verse: 42
    segments:
      - text: >
          (Resulım!) Saqın Allahnı zalımlarnıñ yapqalarından habersiz sanma! Ancaq, Allah
          olarnı (cezalandırmaqnı) qorqudan közleri patlap çıqacaq bir künge qaldıra.
        cid: 0
  - verse: 43
    segments:
      - text: >
          Zeinleri bom-boş olaraq, özlerine bile çevirilip baqalmaycaq vaziyette, közleri
          kökke tikilgen bir alda çapışırlar.
        cid: 0
  - verse: 44
    segments:
      - text: >
          Özlerine azapnıñ kelecegi, bu sebepten, zalımlarnıñ: «Ey, Rabbimiz! Yaqın bir
          devirgece bizge müddet ber de, seniñ davetiñe uyayıq ve peyğamberlerge tabiy
          olayıq», deycek künleri aqqında insanlarnı tenbiyele. (Olarğa denilir ki:) «Daa
          evel siz içün bir zeval olmağanına yemin etmegen ediñzmi?»
        cid: 0
  - verse: 45
    segments:
      - text: >
          «(Sizden evel) özlerine zulum etkenlerniñ yurtlarında oturdıñız. Olarğa nasıl
          muamele etkenimiz sizge ap-açıq belli oldı. Ve sizge misaller de berdik».
        cid: 0
  - verse: 46
    segments:
      - text: >
          İyleleriniñ cezası Allah qatında (belli) eken, olar tuzaqlarını qurğan ediler.
          Albuki, olarnıñ iylelerinen dağlar yerinden köçecek degil edi! (Niayet, olarnıñ
          iyleleri de Allahnıñ iznine bağlıdır. O, izin bermegenden soñ, iç bir iyle
          netice bermez).
        cid: 0
  - verse: 47
    segments:
      - text: >
          O alda, saqın Allahnı peyğamberlerine bergen sözünden vazgeçecek sanma! Çünki,
          Allah mutlaq üstündir, kimseniñ yapqanını yanına bıraqmaz.
        cid: 0
  - verse: 48
    segments:
      - text: >
          Yer - başqa bir yer, kökler de (başqa kökler) alına ketirilgen, (insanlar) bir
          ve küçüne qarşı turulamaycaq Allahnıñ uzurına çıqqan künleri (Allah bütün
          zalımlarnıñ cezasını berecek). («Yerlerniñ - başqa bir yer, köklerniñ de başqa
          kökler oluvı» mevzusında yorumlar arasında şular da bar: Yer ateşke, kökler de
          cennetke dönüşecek, yer kümüş kibi bem-beyaz, üzerinde qan tökülmegen, günah
          işlenmegen bam-başqa bir yer olacaq. İbn Abbastan bir rivayetke köre de, yer -
          bu yerdir. Ancaq, sıfatları deñişecek. Qısqası, dağları yürecek, deñizleri
          yarılacaq, er taraf tüz olacaq, egrilik-bügrilik körülmeycek).
        cid: 0
  - verse: 49
    segments:
      - text: >
          O künü günahkârlarnıñ zıncırlanğanlarını körersiñ.
        cid: 0
  - verse: 50
    segments:
      - text: >
          Olarnıñ kölmekleri qatrandandır, yüzlerini de ateş sarmaqtadır.
        cid: 0
  - verse: 51
    segments:
      - text: >
          Allah er keske qazanğanınıñ qarşılığını bermek içün (olarnı tıriltecek).
          Şübesiz, Allah esapnı çabuk körücir.
        cid: 0
  - verse: 52
    segments:
      - text: >
          İşte, bu (Qur'an), onıñnen tenbiyelensinler, Allahnıñ ancaq tek bir tañrı
          olğanını bilsinler ve aqıl saipleri yahşıca tüşünip, ögüt alsınlar, diye
          insanlarğa (yollanılğan) bir bildirüvdir.
        cid: 0
