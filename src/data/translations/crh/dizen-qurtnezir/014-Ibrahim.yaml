surah_id: 14
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >-
          Elif. Lâam. Miim. Raa. (Bu Qur’an), Rabbleriniñ izninen, insanlarnı
          qaranlıqlardan aydınlıqqa, yani er şeyge ğalip (ve) maqtavğa lâyıq Allaһnıñ
          yoluna çıqaruvıñ içün, saña endirgen bir Kitabımızdır.
        cid: 0
  - verse: 2
    segments:
      - text: >-
          O, Allaһ ki, koklerde ve yerde ne bar olsa, episi Onıñdır. Şeiddetli azaptan
          tolayı, kâfirlerniñ alına vay!
        cid: 0
  - verse: 3
    segments:
      - text: >-
          Dünya ayatını ahiretten ustün tutqanlar, Allaһ yolundan çevirgenler ve onıñ
          egriligini istegenler bar ya, işte, olar (haktan) uzaq bir sapıqlıq
          içindedirler.
        cid: 0
  - verse: 4
    segments:
      - text: >-
          (Allaһnıñ emirlerini) olarğa yahşıca añlatsın, dep er peyğamberni yalıñız oz
          qavmınıñ tilinen yolladıq. Artıq, Allaһ istegenini saptırır, istegenini de doğru
          yolğa qoyar. Çünki, O kuç ve ikmet saibidir. (Er peyğamberniñ, ancaq oz
          qavmınıın tilinen yollanılğanı - butün insanlardan tek bir tilnen, meselâ,
          arapçanen añlaşuvlarınıñ, yalvarıp, duada bulunuvlarınıı istenilmegenini
          kostere. Zaten, bir ayet-i kerimede qonuşılğan tillerniñ çeşit türlü oluvı bile,
          Allaһnıñ barlıgınıız ve qudretiniñ deliillerindendir. Bunıñ kibi de, bu ayet-i
          kerimeniñ işaret etken muim noqtalirından biri de, haqqa davet ile
          oğraşqanlarnıñ içinde bulunğan toplumnıñ tilini çoq yahşı bilmeleri kerekligi
          hususıdır).
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Ant olsun ki, Musanı da: Qavmıñnı qaranlıqtan aydınlıqqa çıqar ve olarğa
          Allaһnıñ (keçmiş qavmlarnıñ başına ketirgen felâket) kunlerini hatırlat, diye
          mucizelerimiznen yolladıq. Şubesiz ki, bunda çoq sabırlı, çoq şukür etken er kes
          içün ibretler bar.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          O vaqıtta Musa qavmına degen edi ki: «Allaһnıñ uzeriñizdeki nimetini hatırlañ.
          Çünki, O, sizni eskenceniñ eñ fenasına sürmekte ve oğullarñıznı soyup,
          qadınlarıñıznı (qızlarıñıznı) bıraqqan Fıravun ailesinden qurtardı. İşte, bu
          sizge añlatılğanlarda Rabbiñizden buyuk bir imtian bardır». 7. «Hatırlañ ki,
          Rabbiñiz sizge: Eger şukür etseñiz, elbette sizge (nimetimni) arttıracam ve eger
          nankorlik etseñiz, iç şubesiz, azabım çoq şiddetlidir! diye bildirgen edi».
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Musa dedi ki: «Eger siz ve yer yuzünde olğanlarnıñ episi nankorlik etseñiz,
          biliñ ki, Allaһ kerçekten zengindir, hamd etilmege lâyıqtır».
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Sizden evelkilerniñ, Nuһ, Aad ve Semuud qavmlarınıñ ve olardan soñkilerniñ
          haberleri sizge kelmedimi? Olarnı Allaһtan başqası bilmez. Peyğamberleri olarğa
          mucizeler ketirdi de, olar ellerinen peyğamberleriniñ ağızlarını qapattılar ve
          dediler ki: Biz sizge yollanılğannı inkâr ettik ve bizni ozüne çağırğan işiñizge
          nisbeten teren bir şube içindemiz. (İbn Mesud bu ayetni oquğan vaqtında «Nesep
          alimleri yalancıdırlar», der edi. Yani olar neseplerni bilgenlerini idda eter
          ekenler, Allaһ bunı red ete. İbn Abbas da: «Adnan ile İsmail arasında bilinmegen
          otuz baba (nesil) mevcuttır», der edi. Buña kore, ayetniñ manası: «Olar o qadar
          çoq ediler ki, sayılarını Allaһtan başqa kimse bilalmaz», demek olur).
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Peyğamberleri dedi ki: Koklerni ve yerni yaratqan Allaһ aqqında şube barmı?
          Albuki, O siziñ gunahlarıñızdan bir qısmını bağışlamaq ve sizni muayen bir
          vaqıtqa qadar yaşatmaq içün, sizni (haq dinge) çağıra. Olar dediler ki: Siz de
          bizim kibi bir insandan başqa bir şey degilsiñiz. Siz bizni atalarımıznıñ
          tabınğan şeylerinden döndürmek isteysiñiz. Oyle ise, bizge ap-açıq bir delil
          ketiriñ! (Olar ozlerine bildirilgen bu qadar açıq delillerge, vesiqalarğa ve
          mucizelerge qaniy olmayıp, inatlıqları sebebinden, daa başqa mucizeler, atta
          ozlerini qahr etecek felâketler istey ve mucizelernen sanki eglene ediler).
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Peyğamberleri olarğa dediler ki: «(Ebet) biz siziñ kibi bir insandan başqası
          degilmiz. Faqat Allaһ nimetini qullarından istegenine lütf eter. Allaһnıñ izni
          olmadan, bizim sizge bir delil ketirüvimizge imkân yoq. Mu’minler yalıñız
          Allaһqa tayansınlar». 12. «Em bizge yollarımıznı kostergeni alda, ne diye biz
          Allaһqa tayanıp işanmayıq? Siziñ bizge bergen eziyetiñizge, elbette
          qatlanacaqmız. Tevekkül etkenler yalıñız Allaһqa tevekkülde sebat etsinler».
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Kâfir olğanlar peyğamberlerine dediler ki: «Elbet de, sizni ya yurtumızdan
          çıqaracaqmız, ya da mıtlaqa dinimizge döneceksiñiz!” Rabbleri de olarğa:
          «Zalımlarnı mıtlaqa elâk etecekmiz!» diye vahiy etti.
        cid: 0
  - verse: 12
    segments:
      - text: >-
          Ve (ey, inanğanlar!) olardan soñ sizni mıtlaqa o yerde yerleştirecekmiz. İşte,
          bu maqamından qorqqan ve tehdidimden saqınğan kimselerge aittir. (Bu ayette
          Az.Peyğamberniñ memlekitinden icret etecegine, faqat soñunda onı çıqarğanlarnıñ
          yurtuna malik olacağına bir işaret bar).
        cid: 0
  - verse: 13
    segments:
      - text: >-
          (Peyğamberler) feth istediler (Allaһ da berdi). Er inatçı zorbacı da felâketke
          oğradı.
        cid: 0
  - verse: 14
    segments:
      - text: >-
          Artından da (o inatçı zorbacığa) ceennem bardır; ozüne irinli suv içirilecek.
        cid: 0
  - verse: 15
    segments:
      - text: >-
          Onı yutumlamağa areket etecek, faqat boğazından keçiralmaycaq ve oña er
          taraftan olüm kelecek, albuki, o olecek degildir (ki azaptan qurtulsın). Bundan
          ğayrı, şiddetli bir azap da bardır.
        cid: 0
  - verse: 16
    segments:
      - text: >-
          Rabblerini inkâr etkenlerniñ vaziyeti (şudır): Olarnıñ amelleri fırtınalı bir
          kunde ruzgâr şiddetnen savurğan kulge beñzer. Qazanğanlarından iç bir şeyni elde
          etalmazlar. Olduqça saptırmaq, işte budır. (Allaһ Taalâ kâfirlerniñ amellerini
          fırtınalı bir kunde ruzgâr şiddetnen savurğan bir kulge beñletmekte ki, olarnıñ
          ameli ne qadar eyi ve çoq olsa-olsun, netice itibarınen ahirette fayda
          bermeycek. Çünki, Allaһ Taalâ insanlarnı evelâ ozüne ve yollanılğan
          peyğamberlerniñ episine iman ile mukellef tutmaqta olup, savap ve mukâfatnı
          bundan soñ berecegini bildirimekte. Tolayısınen, imanı olmağanlar yapqan eyi
          işleriniñ qarşılığını dünyada olğanda alırlar, amma ahirette olarğa berilecek iç
          bir şey yoqtır).
        cid: 0
  - verse: 17
    segments:
      - text: >-
          Allaһ koklerni ve yerni haq ile yaratqanını kormediñmi? O istese, sizni yoq
          etip, yap-yañı halq ketirir.
        cid: 0
  - verse: 18
    segments:
      - text: >-
          Bu, Allaһqa kuç degil.
        cid: 0
  - verse: 19
    segments:
      - text: >-
          (Qıyamet kunünde) episi Allaһnıñ uzuruna çıqacaq ve zayıflar o buyuklik
          taslağanlarğa deycekler ki: «Biz sizge tabiyler edik. Şimdi siz Allaһnıñ
          azabından er angi bir şeyni bizden uzaqlaştıra bilirsizmi?» Olar da deycekler
          ki: «(Ne yapayıq) Allaһ bizni hidayetke iriştirse edi, biz de sizni doğru yolğa
          qavuştırır edik. Şimdi sızlansaq da, sabır etsek de birdir. Çünki, bizim içün
          sığınacaq bir yer yoqtır».
        cid: 0
  - verse: 20
    segments:
      - text: >-
          (Esapları korülip) iş bitirlgeninen, şeytan deycek ki: «Şubesiz, Allaһ sizge
          kerçek olğannı vade etti, men de sizge vade ettim, amma, sizge yalancı oldım.
          Zaten, menim sizge qarşı bir kuçüm yoq edi. Men, sadece, sizni (inkârğa)
          çağırdım, siz de menim davetime aman çaptıñız. O alda, meni yamanlamañ, ozüñizni
          yamanlañ. Ne men sizni, ne de siz meni qurtara bilirsiñiz! Şubesiz, daa evel
          men, meni (Allaһqa) ortaq qoşuvıñıznı red ettim». Şubesiz, zalımlar içün elem
          berici bir azap bardır.
        cid: 0
  - verse: 21
    segments:
      - text: >-
          İman etip de, yahşı işler yapqanlar, Rabbleriniñ izninen, içinde ebediy
          qalacaqları ve zemininden irmaqlar aqqan cennetlerge kirsetilecekler. O yerde
          (bir-birilerinen rastkelişkende söylegenleri «Selâm»dır. (Selâm er türlü
          fenalıqlardan, meşaqqat, ğam, qusur ve afattan qurtulmaq demektir Mu’minler em
          dünyada, em de ahirette rastkelişken vaqıtlarında, birbirilerine boyle bir duada
          bulunırlar).
        cid: 0
  - verse: 24
    segments:
      - text: >-
          Kormediñmi, Allaһ nasıl bir misal ketirdi: Guzel bir sözni, tamırı (erde)
          qaviy, dalları kokte olğan guzel bir terekke (beñzetti). (Guzel söz guzel
          terekke beñzetilmekte. Çünki, terekniñ tiri qaluvı içün nasıl suvarılmağa,
          baqılmağa itiyacı olsa, bular olmağanda qurusa, qalpteki iman teregi de
          boyledir. Eger saibi faydalı ilim, sahih amel, zikr ve tefekkürnen er zaman
          baqıp, onı kozetmese, quruy bile. Bir hadis-i şerifte: «Urba nasıl ipranıp
          eskirse, qalpteki iman da oyle ipranır, eskirir. O alda, imanıñıznı daima
          tazeleñ, denilip, bu aqiqat diqqatlarımızğa taqdim etilgen).
        cid: 0
  - verse: 25
    segments:
      - text: >-
          (O terek), Rabbiniñ izninen, er zaman meyvasını berir. Ogüt alsınlar diye,
          Allaһ insanlarğa misaller ketirir. (Evelke bir ayette Allaһ Taalâ guzel sözni
          guzel terekke beñzetken edi. Çünki, guzel sözniñ meyvası guzel amel; guzel
          terekniñ bereketi de, faydalı meyvadır. Tefsircilerniñ añlatqanlarına kore,
          guzel söz - kelime-i şeadettir. Bu kelime tışta ve içte daima guzel amelerniñ
          meydanğa kelüvine sebep olur. Allaһ razı olacaq er guzel iş - bu kelimeniñ
          meyvasıdır. Aşağıdaki ayette keçken «Fena kelime»ge kelgende, o da Allaһnı inkâr
          etmektir. Bu kelime er türlü fitneniñ, fesatnıñ, felâket ve musibetniñ
          menbaıdır. Fena söz em dünyada, em de ahirette insannıñ felâketlerge
          süyreklenmesine sebep olur. Tolayısınen, aşağadaki ayette fena söz fena bir
          terekke beñzetilgen).
        cid: 0
  - verse: 26
    segments:
      - text: >-
          Fena bir sözniñ misali - kevdesi yerden qoparılğan, o sebepten tik turmaq
          imkânı olmağan (fena) bir terekke beñzer.
        cid: 0
  - verse: 27
    segments:
      - text: >-
          Allaһ Taalâ sağlam söznen iman etkenlerni em dünya ayatında, em de ahirette
          sapsağlam tutar. Zalımlarnı ise, Allaһ saptırır. Allaһ istegenini yapar.
        cid: 0
  - verse: 28
    segments:
      - text: >-
          Allaһnıñ nimetine nankorliknen qarşılıq bergen ve soñunda qavmlarını elâk
          yurtuna süyreklegenlerni kormediñmi?
        cid: 0
  - verse: 29
    segments:
      - text: >-
          Olar ceennemge kirecekler. O ne fena mekândır.
        cid: 0
  - verse: 30
    segments:
      - text: >-
          (İnsanlarnı) Allaһ yolundan saptırmaq içün Oña ortaqlar qoştılar. De ki :
          (İstegeniñiz kibi) yaşañ! Çünki, ateşke döneceksiñiz.
        cid: 0
  - verse: 31
    segments:
      - text: >-
          İman etken qullarıma söyle: Namazlarını dos-doğru qılsınlar, ozünde ne
          alışveriş, ne de dostluq olğan bir kun kelmeden evel, ozlerine bergen
          rızıqlarımızdan (Allaһ içün gizli-aşkâr arclasınlar).
        cid: 0
  - verse: 32
    segments:
      - text: >-
          (O, oyle lütfkâr) Allaһtır ki, koklerni ve yerni yarattı, kokten suvnı endirip,
          onıñnen rızıq olaraq sizge türli meyvalar çıqardı; izninen deñizde yaldavları
          içün gemilerni emriñizge berdi; nehrlerni de siziñ (faydalanuvıñız) içün aqızdı.
        cid: 0
  - verse: 33
    segments:
      - text: >-
          Tertipnen kezici kuneşni ve aynı sizge faydalı yaptı; geceni ve kundüzni de
          faydalanuvıñızğa berdi.
        cid: 0
  - verse: 34
    segments:
      - text: >-
          O sizge istegen er şeyiñizden berdi. Allaһnıñ nimetini sayacaq olsañız,
          sayalmazsıñız. Doğrusı, insan çoq zalım, çoq nankordir.
        cid: 0
  - verse: 35
    segments:
      - text: >-
          Hatırla ki, İbrahim boyle degen edi: «Rabbim. Bu şeerni (Mekkeni) işançlı et,
          meni ve oğullarımnı putlarğa tabınuvdan uzaq tut».
        cid: 0
  - verse: 36
    segments:
      - text: >-
          «Çünki, olar (putlar) insanlardan bir çoqunıñ sapuvına sebep oldılar, Rabbim.
          Şimdi kim maña uysa, o mendendir. Kim de maña qarşı kelse, artıq sen aqiqaten
          çoq bağışlayıcısıñ, pek merhametlisiñ». (Az.İbrahim Allaһ Taalâ putperestlerni
          bağışlamaycağını daa bilmey edi. Onıñ içün olarnıñ da bağışlanmasınıi istedi.
          Muşriklerniñ bağışlanmaycağını añlağandan soñ, artıq olarnıñ afu etelüvi içün
          dua etmedi).
        cid: 0
  - verse: 37
    segments:
      - text: >-
          «Ey, Rabbimiz! Ey, saibimiz! Namaznı dos-doğru qıluvları içün men neslimden bir
          qısmını seniñ Beyt-i Haramıñnıñ (Kâbeniñ) yanında ziraat yapılmağan bir vadige
          yerleştirdim. Artıq sen de insanlardan bir qısmınıñ goñyullerini olarğa meyl
          etici yap ve meyvalardan bularğa rızıq ber. Umüt etilir ki, bu nimetlerge şukür
          eterler». (Rivayet etilgenine kore, Az.İbrahimniñ qadını Sareniñ Hacer isimli
          bir hızmetkârı bar edi. Onı qocası Az.İbrahimge berdi ve İbrahim (a.s.)niñ ondan
          İsmail adlı bir oğlu dünyağa keldi. Az.İbrahim olarnı Mekkege alıp bardı. Kâbi
          yaqınlarında bir yerge yerleştirdi. Mekke suvsız, sazlıq ve qayalı bir yer edi.
          Allaһ Taalâ Az.İbrahimniñ duasını qabul etti. O yerde zemzem diye añılğan suv
          fışqırdıl).
        cid: 0
  - verse: 38
    segments:
      - text: >-
          «Ey, Rabbimiz! Şubesiz ki, sen bizim gizleycegimizni de, aşkâr etecegimizni de
          bilirsiñ. Çünki, ne yerde, ne de kokte, iç bir şey Allaһqa gizli qalmaz».
        cid: 0
  - verse: 39
    segments:
      - text: >-
          «İhtiyar alımda maña İsmailni ve İshaqnı lütf etken Allaһqa hamd olsun!
          Şubesiz, Rabbim duanı eşiticidir». (Rivayetke kore, İsmail (a.s.) doğğan vaqıtta
          babası 99 yaşında edi. İshaq (a.s.) doğğanda 112 yaşında edi. İshaq Peyğamber
          İsmailden 13 sene soñ, Sareden dünyağa kelgen).
        cid: 0
  - verse: 40
    segments:
      - text: >-
          «Ey, Rabbim! Meni ve soyumdan keleceklerni namaznı devamlı qılğanlardan eyle;
          Ey, Rabbimiz! Duamnı qabul et!»
        cid: 0
  - verse: 41
    segments:
      - text: >-
          «Ey, Rabbimiz! (Amellerniñ) esap olunacaq kunü meni, anam-babamnı ve
          mu’minlerni bağışla!»
        cid: 0
  - verse: 42
    segments:
      - text: >-
          (Resulım!) Saqın Allaһnı zalımlarnıñ yapqalarından habersiz sanma! Ancaq, Allaһ
          olarnı (cezalandırmaqnı) qorqudan kozleri patlap çıqacaq bir kunge qaldıra.
        cid: 0
  - verse: 43
    segments:
      - text: >-
          Zeinleri bom-boş olaraq, ozlerine bile çevirilip baqalmaycaq vaziyette, kozleri
          kokke tikilgen bir alda çapışırlar.
        cid: 0
  - verse: 44
    segments:
      - text: >-
          Ozlerine azapnıñ kelecegi, bu sebepten, zalımlarnıñ: «Ey, Rabbimiz! Yaqın bir
          devirgece bizge muddet ber de, seniñ davetiñye uyayıq ve peyğamberlerge tabiy
          olayıq», deycek kunleri aqqında insanlarnı tenbiyele. (Olarğa denilir ki:) «Daa
          evel siz içün bir zeval olmağanına yemin etmegen ediñzmi?»
        cid: 0
  - verse: 45
    segments:
      - text: >-
          «(Sizden evel) ozlerine zulum etkenlerniñ yurtlarında oturdıñız. Olarğa nasıl
          muamele etkenimiz sizge ap-açıq belli oldı. Ve sizge misaller de berdik».
        cid: 0
  - verse: 46
    segments:
      - text: >-
          İyleleriniñ cezası Allaһ qatında (belli) eken, olar tuzaqlarını qurğan ediler.
          Albuki, olarnıñ iylelerinen dağlar yerinden koçecek degil edi! (Niayet, olarnıñ
          iyleleri de Allaһnıñ iznine bağlıdır. O, izin bermegenden soñ, iç bir iyle
          netice bermez).
        cid: 0
  - verse: 47
    segments:
      - text: >-
          O alda, saqın Allaһnı peyğamberlerine bergen sözünden vazgeçecek sanma! Çünki,
          Allaһ mutlaq ustündir, kimseniñ yapqanını yanına bıraqmaz.
        cid: 0
  - verse: 48
    segments:
      - text: >-
          Yer - başqa bir yer, kokler de (başqa kokler) alına ketirilgen, (insanlar) bir
          ve kuçüne qarşı turulamaycaq Allaһnıñ uzurına çıqqan kunleri (Allaһ butün
          zalımlarnıñ cezasını berecek). («Erlerniñ - başqa bir yer, koklerniñ de başqa
          kokler oluvı»» mevzusında yorumlar arasında şular da bar: Yer ateşke, kokler de
          cennetke dönüşecek, yer kumüş kibi bem-beyaz, uzerinde qan tökülmegen, gunah
          işlenmegen bam-başqa bir yer olacaq. İbn Abbastan bir rivayetke kore de, yer -
          bu yerdir. Ancaq, sıfatları deñişecek. Qısqası, dağları yurecek, deñizleri
          yarılacaq, er taraf tüz olacaq, egrilik-bugrilik korülmeycek).
        cid: 0
  - verse: 49
    segments:
      - text: >-
          O kunü gunahkârlarnıñ zıncırlanğanlarını korersiñ.
        cid: 0
  - verse: 50
