          yaratqan, böyle eken, bir qısmı yaratılıştaki qabiliyetiniñ aksine, öz iradesinen
          küfürni seçken. İnsanlarnıñ bir qısmı da, kene öz iradesinen, şahsına uyğun imannı
          seçken).
