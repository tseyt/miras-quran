surah_id: 64
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >
          Köklerde ve yerde ne bar ise, episi Allahnı tesbih eter. Mülk Onıñdır. Hamd
          Oñadır. O, er şeyge qadirdir.
        cid: 0
  - verse: 2
    segments:
      - text: >
          Sizni yaratqan Odır. Böyle eken, kimiñiz kâfir, kimiñiz mü'mindir. Allah
          yapqanlarıñıznı körücidir.
        cid: 0
  - verse: 3
    segments:
      - text: >
          Köklerni ve yerni yerli-yerince yarattı. Sizni şekillendirdi ve şekilleriñizni
          de, güzel yaptı. Dönüş ancaq Oñadır. (Ayetlerden añlaşılğanına köre, Allah
          insanlarnı er taraflı üstün qabiliyetli olaraq yaratqan, böyle eken, bir qısmı
          yaratılıştaki qabiliyetiniñ aksine, öz iradesinen küfürni seçken. İnsanlarnıñ
          bir qısmı da, kene öz iradesinen, şahsına uyğun imannı seçken).
        cid: 0
  - verse: 4
    segments:
      - text: >
          Köklerde ve yerde olğanlarnı bilir. Gizlegenleriñizni ve aşkâr etkenleriñizni de
          bilir. Allah qalplerde olğannı bilicidir.
        cid: 0
  - verse: 5
    segments:
      - text: >
          Daa evel inkâr etkenlerniñ haberi sizge kelip yetmedimi? İşte, olar (dünyada)
          yapqanlarınıñ cezasını tattılar. Olar içün elem berici bir azap da bar. (Bular -
          Nuh, huud, Salih ve Luut Peyğamberlerniñ küfürde israr etken toplumlarıdır).
        cid: 0
  - verse: 6
    segments:
      - text: >
          (O azapnıñ sebebi) şu ki, olarğa Peyğamberleri ap-açıq deliller ketirgen ediler,
          faqat olar: Bir beşer bizni doğru yolğa alıp baracaq ekenmi? dediler, inkâr
          ettiler ve yüz çevirdiler. Allah da, iç bir şeyge muhtac olmağanını kösterdi.
          Allah zengindir, hamdge lâyıqtır.
        cid: 0
  - verse: 7
    segments:
      - text: >
          İnkâr etkenler, kesen-kes tiriltilmeyceklerini ileri sürdiler. De ki: Yoq!
          Rabbime ant olsun ki, mıtlaqa tiriltileceksiñiz, soñra yapqanlarıñız sizge haber
          berilecek. Bu, Allahqa köre qolaydır.
        cid: 0
  - verse: 8
    segments:
      - text: >
          Şunıñ içün Allahqa, Peyğamberine ve endirgen o nurımızğa (Qur'anğa) inanıñ.
          Allah yapqanlarıñızdan haberdardır.
        cid: 0
  - verse: 9
    segments:
      - text: >
          Mahşer vaqtında sizni toplaycaq künü, işte o zarar künüdir. (Ancaq) kim Allahqa
          inansa ve faydalı iş yapsa, Allah onıñ yamanlıqlarını qapatır, onı (ve oña
          beñzegenlerini), içinde ebediy qalacaq, altlarından irmaqlar aqqan cennetlerge
          qoyar. İşte, büyük qurtulış budır. (Qıyamet künü er kes bir yerge ketirlip
          toplanacaq ve yapqanlarınıñ esabı soralacaq. O künü yamanlarnıñ aldanğanı,
          yahşılarnıñ da aqlı olğanı ortağa çıqacaq. Ayetteki «yevmu't-teğaabun» ifadesine
          «kâr-zarar künü» manası da berilgen).
        cid: 0
  - verse: 10
    segments:
      - text: >
          İnkâr etken ve ayetlerimizni yalanlağanlarğa kelgende, işte olar ceennem
          ehlidirler. O yerde ebediy qalacaqlar. Ne fena barılacaq yerdir o yer!
        cid: 0
  - verse: 11
    segments:
      - text: >
          Allahnıñ izni olmadan, iç bir musibet toqunmaz. Kim Allahqa inansa, Allah onıñ
          qalbini doğruğa alıp barır. Allah er şeyni bilicidir. (Allahnıñ ilmi, iradesi ve
          taqdiri olmadan, insanğa iç bir musibet kelmez. Faqırlıq, hastalıq, ölüm ve
          qasevet kibi sıqıntılar Allahnıñ taqdirinen olğanına inanğan kimse bu
          musibetlerni sabır ve metanetnen qarşılar).
        cid: 0
  - verse: 12
    segments:
      - text: >
          Allahqa itaat etiñ, Peyğamberge de itaat etiñ. Yüz çevirseñiz, biliñ ki,
          elçimizge tüşkeni, ap-açıq bir tebliğdir.
        cid: 0
  - verse: 13
    segments:
      - text: >
          Allah; Ondan başqa iç bir ilâh yoqtır. Mü'minler yalıñız Allahqa tayanıp
          işansınlar.
        cid: 0
  - verse: 14
    segments:
      - text: >
          Ey, iman etkenler! Zevceleriñizden ve balalarıñızdan sizge duşman olğanlar da
          bar, olardan saqınıñ, amma afu eter, qusurlarını közlerine türtmez, qusurlarını
          qapatır iseñiz, biliñ ki, Allah çoq bağışlayıcı, çoq merhametlidir.
        cid: 0
  - verse: 15
    segments:
      - text: >
          Doğrusı, mallarıñız ve balalarıñız siz içün bir imtiandır. Büyük mükâfat ise,
          Allahnıñ yanındadır. (Rivayetke köre, Mekkeden icret arzusında olğan bazı
          musulmanlarnıñ zevceleri ve balaları, olarnıñ perişan alğa qalacaqlarını ögge
          surerek, babalarını icretten qaldırmaq istediler. Faqat icretnen qazanılğan
          yüksek mertebelerni ögrengen musulmanlar qadın ve evlâtlarını, özlerine mani
          olmağa qalqqanları içün, cezalandırmaq istegeninen, bu ayet endi; olarnıñ afu
          etilüvini emir etti. Bundan da ğayrı, mal ve balalarnıñ beklenmegen yerde ve
          vaziyetlerde insannı günahqa soqup, ahiret azırlığından çetleştire bilecegine
          de, işaret etilgen).
        cid: 0
  - verse: 16
    segments:
      - text: >
          O alda, küçüñiz yetkeni qadar, Allahqa isyandan qaçınıñ. Diñleñ, itaat etiñ, öz
          eyiligiñiz içün arclañ. Kim nefsiniñ saranlığından qorçalansa, işte olar
          qurtulışqa irişkenlerdir.
        cid: 0
  - verse: 17
    segments:
      - text: >
          Eger Allahqa (rizası oğrunda) ödünç berir iseñiz, Allah onı siz içün qat-qat
          arttırır ve sizni bağışlar. Allah çoq mükâfat bericidir, ceza berüvde acele
          etmeyicidir.
        cid: 0
  - verse: 18
    segments:
      - text: >
          Körülmegenni ve körülgenni bilicidir. Üstündir, ikmet saibidir.
        cid: 0
