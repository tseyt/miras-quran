surah_id: 64
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >-
          Koklerde ve yerde ne bar ise, episi Allaһnı tesbih eter. Mulk Onıñdır. Hamd
          Oñadır. O, er şeyge qadirdir.
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Sizni yaratqan Odır. Boyle eken, kimiñiz kâfir, kimiñiz mu’mindir. Allaһ
          yapqanlarıñıznı korücidir.
        cid: 0
  - verse: 3
    segments:
      - text: >-
          Koklerni ve yerni yerli-yerince yarattı. Sizni şekillendirdi ve şekilleriñizni
          de, guzel yaptı. Dönüş ancaq Oñadır. (Ayetlerden añlaşılğanına kore, Allaһ
          insanlarnı er tarafl ustün qabiliyetli olaraq yaratqan, boyle eken, bir qısmı
          yaratılıştaki qabiliyetiniñ aksine, oz iradesinen kufürni seçken. İnsanlarnıñ
          bir qısmı da, kene oz iradesinen, şahsına uyğun imannı seçken).
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Koklerde ve yerde olğanlarnı bilir. Gizlegenleriñizni ve aşkâr etkenleriñizni
          de bilir. Allaһ qalplerde olğannı bilicidir.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Daa evel inkâr etkenlerniñ haberi sizge kelip yetmedimi? İşte, olar (dünyada)
          yapqanlarınıñ cezasını tattılar. Olar içün elem berici bir azap da bar. (Bular -
          Nuһ, һuud, Salih ve Luut Peyğamberlerniñ kufürde israr etken toplumlarıdır).
        cid: 0
  - verse: 6
    segments:
      - text: >-
          (O azapnıñ sebebi) şu ki, olarğa Peyğamberleri ap-açıq deliller ketirgen
          ediler, faqat olar: Bir beşer bizni doğru yolğa alıp baracaq ekenmi? dediler,
          inkâr ettiler ve yuz çevirdiler. Allaһ da, iç bir şeyge muhtac olmağanını
          kosterdi. Allaһ zengindir, hamdge lâyıqtır.
        cid: 0
  - verse: 7
    segments:
      - text: >-
          İnkâr etkenler, kesen-kes tiriltilmeyceklerini ileri sürdiler. De ki: Yoq!
          Rabbime ant olsun ki, mıtlaqa tiriltileceksiñiz, soñra yapqanlarıñız sizge haber
          berilecek. Bu, Allaһqa kore qolaydır.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Şunıñ içün Allaһqa, Peyğamberine ve endirgen o nurımızğa (Qur’anğa) inanıñ.
          Allaһ yapqanlarıñızdan haberdardır.
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Mahşer vaqtında sizni toplaycaq kunü, işte o zarar kunüdir. (Ancaq) kim Allaһqa
          inansa ve faydalı iş yapsa, Allaһ onıñ yamanlıqlarını qapatır, onı (ve oña
          beñzegenlerini), içinde ebediy qalacaq, altlarından irmaqlar aqqan cennetlerge
          qoyar. İşte, buyuk qurtulış budır. (Qıyamet kunü er kes bir yerge ketirlip
          toplanacaq ve yapqanlarınıñ esabı soralacaq. O kunü yamanlarnıñ aldanğanı,
          yahşılarnıñ da aqlı olğanı ortağa çıqacaq. Ayetteki «yevmu’t-teğaabun» ifadesine
          «kâr-zarar kunü» manası da berilgen).
        cid: 0
  - verse: 10
    segments:
      - text: >-
          İnkâr etken ve ayetlerimizni yalanlağanlarğa kelgende, işte olar ceennem
          ehlidirler. O yerde ebediy qalacaqlar. Ne fena barılacaq yerdir o yer!
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Allaһnıñ izni olmadan, iç bir musibet toqunmaz. Kim Allaһqa inansa, Allaһ onıñ
          qalbini doğruğa alıp barır. Allaһ er şeyni bilicidir. (Allaһnıñ ilmi, iradesi ve
          taqdiri olmadan, insanğa iç bir musibet kelmez. Faqırlıq, hastalıq, olüm ve
          qasevet kibi sıqıntılar Allaһnıñ taqdirinen olğanına inanğan kimse bu
          musibetlerni sabır ve metanetnen qarşılar).
        cid: 0
  - verse: 12
    segments:
      - text: >-
          Allaһqa itaat etiñ, Peyğamberge de itaat etiñ. Yuz çevirseñiz, biliñ ki,
          elçimizge tüşkeni, ap-açıq bir tebliğdir.
        cid: 0
  - verse: 13
    segments:
      - text: >-
          Allaһ; Ondan başqa iç bir ilâh yoqtır. Mu’minler yalıñız Allaһqa tayanıp
          işansınlar.
        cid: 0
  - verse: 14
    segments:
      - text: >-
          Ey, iman etkenler! Zevceleriñizden ve balalarıñızdan sizge duşman olğanlar da
          bar, olardan saqınıñ, amma afu eter, qusurlarını kozlerine türtmez, qusurlarını
          qapatır iseñiz, biliñ ki, Allaһ çoq bağışlayıcı, çoq merhametlidir.
        cid: 0
  - verse: 15
    segments:
      - text: >-
          Doğrusı, mallarıñız ve balalarıñız siz içün bir imtiandır. Buyuk mukâfat ise,
          Allaһnıñ yanındadır. (Rivayetke kore, Mekkeden icret arzusında olğan bazı
          musulmanlarnıñ zevceleri ve balaları, olarnıñ perişan alğa qalacaqlarını ogge
          surerek, babalarını icretten qaldırmaq istediler. Faqat icretnen qazanılğan
          yuksek mertebelerni ogrengen musulmanlar qadın ve evlâtlarını, ozlerine mani
          olmağa qalqqanları içün, cezalandırmaq istegeninen, bu ayet endi; olarnıñ afu
          etilüvini emir etti. Bundan da ğayrı, mal ve balalarnıñ beklenmegen yerde ve
          vaziyetlerde insannı gunahqa soqup, ahiret azırlığından çetleştire bilecegine
          de, işaret etilgen).
        cid: 0
  - verse: 16
    segments:
      - text: >-
          O alda, kuçüñiz yetkeni qadar, Allaһqa isyandan qaçınıñ. Diñleñ, itaat etiñ, oz
          eyiligiñiz içün arclañ. Kim nefsiniñ saranlığından qorçalansa, işte olar
          qurtulışqa irişkenlerdir.
        cid: 0
  - verse: 17
    segments:
      - text: >-
          Eger Allaһqa (rizası oğrunda) odünç berir iseñiz, Allaһ onı siz içün qat-qat
          arttırır ve sizni bağışlar. Allaһ çoq mukâfat bericidir, ceza berüvde acele
          etmeyicidir.
        cid: 0
  - verse: 18
    segments:
      - text: >-
          Korülmegenni ve korülgenni bilicidir. Ustündir, ikmet saibidir.
        cid: 0