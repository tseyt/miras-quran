      - text: >-
          (Rivayetke köre, Mekkeden icret arzusında olğan bazı musulmanlarnıñ zevceleri ve
          balaları, olarnıñ perişan alğa qalacaqlarını ögge surerek, babalarını icretten
          qaldırmaq istediler. Faqat icretnen qazanılğan yüksek mertebelerni ögrengen
          musulmanlar qadın ve evlâtlarını, özlerine mani olmağa qalqqanları içün,
          cezalandırmaq istegeninen, bu ayet endi; olarnıñ afu etilüvini emir etti. Bundan da
          ğayrı, mal ve balalarnıñ beklenmegen yerde ve vaziyetlerde insannı günahqa soqup,
          ahiret azırlığından çetleştire bilecegine de, işaret etilgen).
