surah_id: 110
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >-
          Allaһnıñ yardımı ve zaferi kelip de, insanlarnıñ top-top Allaһnıñ dinine
          kirgenlerini korgen vaqtıñda, Rabbiñye hamd eterek, Onı tesbih et ve Ondan
          mağfiret tile. Çünki, O, tövbelerni çoq qabul eticidir.
