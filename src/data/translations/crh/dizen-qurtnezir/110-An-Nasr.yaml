surah_id: 110
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >
          Allahnıñ yardımı ve zaferi kelip de, insanlarnıñ top-top Allahnıñ dinine
          kirgenlerini körgen vaqtıñda, Rabbiñe hamd eterek, Onı tesbih et ve Ondan
          mağfiret tile. Çünki, O, tövbelerni çoq qabul eticidir.
        cid: 0
