surah_id: 46
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >
          Haa. Miim.
        cid: 0
  - verse: 2
    segments:
      - text: >
          Bu Kitap aziz ve hakim olğan Allah tarafından endirilgendir.
        cid: 0
  - verse: 3
    segments:
      - text: >
          Köklerni, yerni ve ekisi arasında olğanlarnı biz, şübesiz yerli-yerince ve belli
          bir müddetke yarattıq. İnkâr etkenler, tenbiyelengen şeylerinden yüz
          çevirmektedirler. (Ayet yaratılğanlarnıñ, Allahnıñ qudreti ve birligine delâlet
          etkenlerini, bularnıñ qıyametke qadar barlıqlarını devam ettireceklerini, amma
          inkârcılarnıñ qıyametni ve deşetini qabul etmegenlerini haber bermekte).
        cid: 0
  - verse: 4
    segments:
      - text: >
          De ki: Söyleñ ya! Allahnı bıraqıp, tabınğan şeyleriñiz yer yüzünde ne
          yaratqanlar; kösterseñiz ya maña! Yoqsa, olarnıñ köklerge ortaqlıqları barmı?
          Eger doğru söylegenlerden iseñiz, bundan evel (sizge endirilgen) bir kitap yahut
          bir bilgi qalımtısı bar ise, onı maña ketiriñ.
        cid: 0
  - verse: 5
    segments:
      - text: >
          Allahnı bıraqıp da, qıyamet kününe qadar özüne savap beralmaz şeylerge
          tabınğandan daa sapıq kim ola bilir? (Albuki) olar, bularnıñ tabınuvlarından
          habersizdirler.
        cid: 0
  - verse: 6
    segments:
      - text: >
          İnsanlar bir yerge toplanğan vaqıtta, (müşrikler) olarğa (tabınğanlarına) duşman
          kesilirler ve olarğa qullıq etkenlerini inkâr eterler. (İzaatta esasqa alınğan
          yorumnen birlikte, ayette özlerine tabınılğan barlıqlarnıñ müşrikler aleyhine
          şaatlıq yapacaqları aqqında manası da berilgen).
        cid: 0
  - verse: 7
    segments:
      - text: >
          Ayetlerimiz olarğa açıqça oqulğan vaqıtta, aqiqat özlerine kelgende, onı inkâr
          etkenler: «Bu, ap-açıq bir tılsımdır», dediler.
        cid: 0
  - verse: 8
    segments:
      - text: >
          Yoqsa, «Onı uydurdı»mı demekteler. De ki: Eger men onı uydurğan isem, Allah
          tarafından maña kelecek şeyni uzaqlaştırmağa küçüñiz yetmez. O, siziñ Qur'an
          aqqında yapqan adden aşuvlarıñıznı daa yahşı bilir. Mennen siziñ arañızda şaat
          olaraq O yeter. O, bağışlayıcı, merhametlidir.
        cid: 0
  - verse: 9
    segments:
      - text: >
          De ki: Men peyğamberlerniñ ilki degilim. Maña ve sizge ne yapılacağını da
          bilmem. Men, sadece maña vahiy etilgen uyarım. Men, sadece ap-açıq bir
          tenbiyeciyim. (Ayetten añlaşılğanına köre, Az. Peyğamber, özünden evel bir çoq
          peyğamber kelip-keçkenini hatırlatqan, özüniñ ve qavmınıñ dünyadaki vaziyeti ne
          olacağını bilmegenini beyan etken, diqqatlarını eski peyğamberler ve ümmetlerge
          çekerek, olarnı tenbiyelegen).
        cid: 0
  - verse: 10
    segments:
      - text: >
          De ki: İç tüşündiñizmi; eger bu, Allah qatından ise ve siz onı inkâr etken
          iseñiz, İsrail oğullarından bir şaat da buña beñzegenni körüp, inanğanı alda,
          siz kene de büyüklik taslağan iseñiz, (aqsızlıq etken olmazsıñızmı)? Şübesiz,
          Allah zalımlar toplulığını doğru yolğa qavuştırmaz. (Ayette diqqat çekken husus,
          Qur'an Allah tarafından yollanılğanınıñ tasdiqıdır. Bunıñ İsrail oğullarından
          olğan, şaatı da bir rivayetke köre, Az. Musadır, diger bir rivayetke köre ise,
          Abdullah b. Selâmdır. Tefsirlerde sureniñ Mekkiy sayıluvı alında, yeudiy eken,
          Medinede musulmanlıqnı qabul etken bu zatqa işaretniñ ğayb haberi olaraq qabul
          etilecegi bildirile. Diger taraftan, sureniñ sadece bu ayeti Medinede engeni
          aqqında da fikir bar).
        cid: 0
  - verse: 11
    segments:
      - text: >
          İnkâr etkenler, iman etkenler aqqında dediler ki: «Bu iş bir hayır olsa edi,
          olar bizni keçalmaz ediler». Faqat olar bunıñnen doğru yolğa kirmek arzusında
          olmağanları içün: «Bu eski bir yalandır», deycekler. (İlk evelâ hızmetkârlar ve
          faqırlar musulman olğanınen, Qureyşniñ ileri kelgenleri, iman ve İslâmnıñ hayır
          ketirmegenini, bunıñ, bu dinge birinci kirgenlerniñ seviyelerinden belli
          olğanını söylegen, Kitapqa da til uzatqan ediler. Ayet inkârcılarnıñ bu
          areketlerini ortağa çıqarıp, tenqit etmekte).
        cid: 0
  - verse: 12
    segments:
      - text: >
          Ondan evel de, bir rahmet ve reber olaraq Musanıñ kitabı bardır. Bu (Qur'an) da,
          zulum etkenlerni tenbiyelemek ve eyilik yapqanlarğa müjde olmaq üzre, arap
          tilinde endirilgen, doğrulayıcı bir kitaptır. (Ayet, Qur'andan evel Tevratnıñ
          bar olğanını, Qur'annıñ özünden evelki kitaplarnı ve Tevratnı doğrulap,
          tasdiqlağanını ifade ete).
        cid: 0
  - verse: 13
    segments:
      - text: >
          «Rabimiz Allahtır», dep, soñunda da dos-doğru yaşağanlarğa qorqu yoqtır ve olar
          kederlenmeycekler.
        cid: 0
  - verse: 14
    segments:
      - text: >
          Olar cennet ehlidirler. Yapayatqanlarına qarşılıq o yerde ebediy qalacaqlar.
        cid: 0
  - verse: 15
    segments:
      - text: >
          Biz insanğa ana-babasına yahşılıq yapuvını tevsiye ettik. Anası onı zahmetnen
          taşıdı ve zahmetnen doğurdı. Taşınuvı ile sütten kesilüvi, otuz ay sürer.
          Niayet, insan, küçlü çağına irişip, qırq yaşına barğanınen, der ki: Rabbim! Maña
          ve ana-babama bergen nimetleriñe şükür etüvimni ve sen razı olacaq faydalı iş
          yapuvımnı temin et. Men içün de, zurriyetim içün de, eyilikni devam ettir. Men
          saña döndim. Ve, elbete ki, men musulmanlardanım. (Tevhidke yönelmek ve İslâmğa
          kirmek eñ büyük nimettir. Allah hoşnut olacaq davranışlarnı yapmağa areket
          etmek, meselâ, Az. Ebu Bekir yapqanı kibi, kâfirlerniñ eskencesi altında
          qıynalğan mü'minlerniñ qurtuluvını teminlemek, yapıluvı kerek olğan faydalı
          işlerdendir. Ayrıca, bütün nesliniñ salih musulmanlardan oluvını istemek de,
          isannıñ yapacaq duaları sırasında olmalıdır).
        cid: 0
  - verse: 16
    segments:
      - text: >
          İşte, yapqanlarınıñ eyisini qabul etecegimiz ve günahlarını bağışlaycağımız bu
          kimseler - cennetliler arasındadırlar. Bu, olarğa berilgen doğru bir sözdir. (Bu
          ayet, yuqarıdaki duanı yapqan Az. Ebu Bekir ve diger mü'minlerniñ itaatları
          qarşılığını, savap ve mükâfatnen köreceklerine işaret etmekte).
        cid: 0
  - verse: 17
    segments:
      - text: >
          Ana ve babasına: Uf sizge! Menden evel nice nesiller kelip-keçken eken, meni
          tekrar tiriltüvnen tehdit etmektesiñizmi? degen kimsege, ana ve babası Allahnıñ
          yardımına sığınaraq: Yazıqlar olsun saña! İman et. Allahnıñ vadesi kerçektir,
          degenleri alda, o: Bu, eskilerniñ masallarından başqa bir şey degil, der.
        cid: 0
  - verse: 18
    segments:
      - text: >
          İşte, olar özlerinden evel cinlerden ve insanlardan kelip-keçken toplulıqlar
          arasında, aqlarında azap kerçekleşken kimselerdir. Aqiqaten, olar ziyanğa
          oğrağanlardır.
        cid: 0
  - verse: 19
    segments:
      - text: >
          Er kesniñ yapqanlarına köre, dereceleri bardır. Allah olarğa yapqanlarınıñ
          qarşılığını berir. Asla olarğa aqsızlıq etilmez. (Ayet, mü'minlerniñ ve
          kâfirlerniñ yapqanları qarşılığına köre, derece alğanlarını bildirmekte; iman
          etkenlerniñ cennette, inkâr etkenlerniñ de, aşşalarnıñ aşşağısı olğan
          ceeyennemde olacaqlarına işaret etmekte).
        cid: 0
  - verse: 20
    segments:
      - text: >
          İnkâr etkenler ateşke qoyulacaq künleri (olarğa böyle denilir): Dünyadaki
          ayatıñızda bütün güzel şeyleriñizni arcladıñız, olarnıñ zevqını sürdiñiz. Bugün
          ise, yer yüzünde aqsız yerde büyüklik taslavuñızdan ve yoldan çıquvıñızdan
          tolayı, alçaltıcı bir azap köreceksiñiz.
        cid: 0
  - verse: 21
    segments:
      - text: >
          Aad qavmınıñ qardaşını (huudnı) añ. Zira, o özünden evel ve soñ tenbiyecilerniñ
          de kelip-keçken Ahqaf bölgesindeki qavmına: Allahtan başqasına qullıq etmeñ. Men
          siziñ büyük bir künniñ azabına oğravuñızdan qorqam, degen edi. (Ayette keçken
          «ahqaf» uzun ve yüksek qum yığını manasındaki «hıqfnıñ» sözüniñ çoqluğıdır.
          huudnıñ qavmı olğan Aad, Yemende deñiz çetindeki qum obaları arasında
          oturğanından, bu bölgege «Ahqaf» denilgen).
        cid: 0
  - verse: 22
    segments:
      - text: >
          «Sen bizni tañrılarımızdan çevirmek içün bizge keldiñmi? Aydı, doğru
          söylegenlerden iseñ, bizni tehdit etken şeyiñni başımızğa ketir», dediler.
        cid: 0
  - verse: 23
    segments:
      - text: >
          huud da: Bilgi ancaq Allahnıñ qatındadır. Men sizge, maña yollanılğan şeyni
          tebliğ etem. Faqat siziñ cail bir qavm olğanıñıznı körmektem, dedi. (huud
          (a.s.), bu sözünen, başlarına kelecek azapnıñ vaqtını Allah bilgenini añlatqan).
        cid: 0
  - verse: 24
    segments:
      - text: >
          Niayet, onı vadilerine doğru yayılğan bir bulut şeklinde körgeninen: Bu bizge
          yağmur yağdıracaq yayılğan bir buluttır, dediler. Yoq! O, siziñ acele kelüvini
          istegen şeyiñizdir. İçinde accı azap bulunğan bir rüzgârdır!
        cid: 0
  - verse: 25
    segments:
      - text: >
          O (rüzgâr), Rabbiñniñ emrinen, er şeyni yıqar, mahv eter. Bunıñ kibi (o qasırğa
          kelgeninen) olarnıñ evlerinden beşqa bir şey körülmez oldı. İşte, biz qabaat
          işlegen toplumnı böyle cezalandırırmız. (Rivayet etilgenine köre, bu müdhiş
          qasırğa erkeklerini, qadınlarını, balalarını ve mallarını yernen kök arasında
          savuraraq, parçalağan ve elâk etken. Sadece Az. huud ve oña iman etkenler
          qurtulğanlar).
        cid: 0
  - verse: 26
    segments:
      - text: >
          Ant olsun ki, olarğa da sizge bermegen qudretimiz ve servetimizni bergen edik.
          Olarğa qulaqlar, közler ve yürekler bergen edik. Faqat qulaqaları, közleri ve
          yürekleri olarğa bir fayda bermedi. Zira, bile-bile Allahnıñ ayetlerini inkâr
          ete ediler. Alay etip turğan şeyleri olarnı sara qoydı. (Ayetniñ bildirgenine
          köre, huud qavmı Mekke kâfirlerinden daa büyük qudret ve imkânlarğa saip olğan.
          Bunıñ üstüne, olarğa berilgen köz, qulaq ve yüreknen ilâhiy nimetniñ qadrini
          bilecek ve Allahqa inanacaq ediler. Faqat bularğa rağmen, inkârcılıqta
          tirelgenlerinen, azap olarnı elâk etti).
        cid: 0
  - verse: 27
    segments:
      - text: >
          Ant olsun, biz etrafıñızdaki memleketlerni de yoq ettik. Belki, doğru yolga
          dönerler diye, ayetlerni tekrar-tekrar izaatladıq. (Etraftaki elâk etilgen
          memleketler Semuud, Aad ve olarğa beñzegen qavmlarnıñ ülkeleri olğanı beyan
          etilgen).
        cid: 0
  - verse: 28
    segments:
      - text: >
          Allahtan başqa olarğa yaqınlıq teminlemek içün tañrı etken şeyleri, özlerine
          yardım etseler edi ya! Yoq, olarnı taşlap kettiler. Bu olarnıñ yalanı ve uydurıp
          turğan şeyleridir. (Ayet, huud qavmınıñ Allahqa yaqlaştırıcı şeyler olaraq
          inanğan uydurma tañrılarnıñ iç biri azapnı uzaqlaştıruvda tesirli
          olalmağanlarını haber berir eken, ayrıca putlarnı Allahqa yaqınlıqqa vesile
          sayuvnıñ da, boş ve manasız bir quruntı olğanına diqqat çekmekte).
        cid: 0
  - verse: 29
    segments:
      - text: >
          Hatırañdamı, cinlerden bir topunı, Qur'annı diñlevleri içün, saña yöneltken
          edik. Qur'annı diñlemege azır olğanınen, (bir-birlerine) «Susıñ» degenler.
          Qur'annıñ oquluvı bitkeninen, tenbiyeciler olaraq, qavmlarına döngen ediler.
          (Rivayetlerge köre, Az. Peyğamber Taaif seferinde Nahl vadisinde saba namazı
          qıldırğanda, yedi yahut doquz kişiden ibaret cinler topu, Peyğamberimiz oquğan
          Qur'annı diñlemege kelgen ediler. Qur'annı diñlep, qavmlarına barğanda:)
        cid: 0
  - verse: 30
    segments:
      - text: >
          Ey, qavmımız! dediler, doğrusı, biz Musadan soñ endirilgen, özünden evelkisini
          doğrulağan, haqqa ve doğru yolğa qavuştırıcı bir kitap diñledik.
        cid: 0
  - verse: 31
    segments:
      - text: >
          Ey, qavmımız! Allahnıñ davetçisine uyıñ. Oña iman etiñ ki, Allah da siziñ
          günahlarıñıznı qısmen bağışlasın ve sizni accı bir azaptan qorçalasın. (Ayetniñ
          bildirgeniye köre, cinler, Allah yolunıñ davetçisi Az. Muhammedge qavmlarınıñ
          uyuvlarını isterken, Allah, günahlarınıñ bir qısmını bağışlaycağını beyan
          etkenler. Çünki, qul haqqı ile bağlı günahlar aq saibiniñ rizası olmağance
          bağışlanmaz).
        cid: 0
  - verse: 32
    segments:
      - text: >
          Allahnıñ davetçisine uymağan kimse yer yüzünde Allahnı aciz bıraqacaq degildir.
          Özü içün Allahtan başqa dostlar da bulunmaz. İşte, olar, ap-açıq bir sapıqlıq
          içindedirler.
        cid: 0
  - verse: 33
    segments:
      - text: >
          Köklerni ve yerni yaratqan, bularnı yaratmaqnen yorulmağan Allahnıñ ölülerni
          tiriltmege de küçü yetecegini tüşünmezlermi? Ebet, O, er şeyge qadirdir.
        cid: 0
  - verse: 34
    segments:
      - text: >
          İnkâr etkenlerge, ateşke atılacaq künleri: Nasıl, bu aqiqat degil ekenmi?
          denilgende: Ebet, Rabbimizge ant olsun ki, aqiqat eken, derler. Allah: Öyle ise,
          inkâr etüviñizden tolayı, azapnı tatıñız! der.
        cid: 0
  - verse: 35
    segments:
      - text: >
          O alda (Resulım), peyğamberlerden azim saibi olğanlarnıñ sabır etkeni kibi, sen
          de sabır et. Olar aqqında acele etme, olar vade etilgen azaplarnı körgen
          künleri, sanki dünyada sadece kündüzniñ bir saatı qadar qalğanlarını zan
          eterler. Bu, bir tebliğdir. Yoldan çıqqan toplulıqlardan başqası elâk etilirmi
          iç! (Ayette keçken «ulu'l-azm» (azim saibi peyğamberler) Az. Nuh, İbrahim, Musa,
          İsa ve Muhammed (a.s.)dır. (Baq. Ahzaab, 33/7). Aqiqaten, azim saibi
          peyğamberler şeriatlarınıñ tebliğ ve tevsisinde büyük ğayret sarf etken, ortağa
          çıqqan ağırlıqlarğa ve duşmalıqlarğa köküs kergenler. Ayette, Az. Peyğamberge bu
          büyük peyğamberlerniñ vasıfları hatırlatılır eken, sabırlı oluvı istenilgen,
          inkârcılarnıñ azap qarşısında vaziyetleri ve areketleri de tasvir etilgen).
        cid: 0
