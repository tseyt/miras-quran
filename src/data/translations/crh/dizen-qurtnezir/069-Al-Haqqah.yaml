surah_id: 69
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "Kerçekleşecek olğan;"
        cid: 0
  - verse: 2
    segments:
      - text: "(Ebet) nedir o kerçekleşecek olğan?"
        cid: 0
  - verse: 3
    segments:
      - text: "Kerçekleşecek olğannıñ (qıyametniñ) ne olğanını sen ne yerden bileceksiñ? (Qur’annıñ ifade etüv şekli ve añlatuv usullarını, başqa tillerde aynına beñzeterek tercime etmek imkânı yoqlığı, bu mucize ilâhiy kelâmnıñ tamamı içün söz mevzusı olmaqnen beraber, bu yerdeki ayetlerde ve olarğa beñzegenlerinde daa buyuk zorluqlarğa rastkelinecegi tabiiy aldır. Bu ayetlerde söz etilgen yuz berüvinden qaçınılmaycaq qıyamet kunüniñ deşeti ve emiyetine diqqat etilmekte, aynı noqtanı quvetlendirmek içün Resul-i Ekremge o kunniñ deşetini ve faciasını bilalmaycağı söylenilmekte)."
        cid: 0
  - verse: 4
    segments:
      - text: "Semuud ve Aad qavmları qapularını qaqacaq felâketni (qıyametni) yalan sayğan ediler."
        cid: 0
  - verse: 5
    segments:
      - text: "Semuudğa kelgende: Olar pek zorlu (bir sarsıntı) ile elâk etildiler."
        cid: 0
  - verse: 6
    segments:
      - text: "Aad qavmı ise, uvultılı, toz savurğan bir fırtınanen mahv etildi."
        cid: 0
  - verse: 7
    segments:
      - text: "Allaһ onı ardı-ardına yedi gece, sekiz kun olarnıñ uzerine musallat etti. Oyle ki, (eger o yerde olsa ediñ), o qavmnı içi boş hurma kutükleri kibi, o yerçikte yerge serilgen alda korer ediñ."
        cid: 0
  - verse: 8
    segments:
      - text: "Şimda olardan artta qalğan bir şey koresiñmi?"
        cid: 0
  - verse: 9
    segments:
      - text: "Fıravun, ondan evelkiler ve altı ustüne ketirilgen bolgeler halqı (Luut qavmı) ep o gunahnı (şirkni) işlediler."
        cid: 0
  - verse: 10
    segments:
      - text: "Boylece, Rabbleriniñ peyğamberlerine qarşı keldiler, O da, olarnı pek şiddetli bir şekilde yaqalay qoydı."
        cid: 0
  - verse: 11
    segments:
      - text: "Şubesiz, suv basqan vaqıtta, sizni gemide biz taşıdıq;"
        cid: 0
  - verse: 12
    segments:
      - text: "Onı siz içün bir ibret ve ogüt yapayıq ve añlayışlı qulaqlar onı añlayaraq saqlasın diye. (Nuһ tufanına ve Nuһ (a.s.)nıñ gemisine işaret etilmekte. «Sizni taşıdıq», «Siziñ atalarñıznı qurtardıq; olarnı qurtarmasa edik, sizler de ayat bulamaycaq ediñiz», manasındadır)."
        cid: 0
  - verse: 13
    segments:
      - text: "Artıq Suurğa bir defa uflengen, yer yuzü ve dağlar koterilip bir-birine bir çarpışnen çarpılıp, darma-dağın etilgen vaqıtta, işte o kunü olacaq olur (qıyamet qopar)."
        cid: 0
  - verse: 14
    segments:
      - text: "[13 ayetine baq.]"
        cid: 0
  - verse: 15
    segments:
      - text: "[13 ayetine baq.]"
        cid: 0
  - verse: 16
    segments:
      - text: "Kok de yarılır ve artıq o kunü o, çökmege yuz tutar."
        cid: 0
  - verse: 17
    segments:
      - text: "Melekler onıñ (kokniñ) etrafındadır. O kunü Rabbiñniñ arşını, bularnıñ da ustünde sekiz (melek) yuklenir. («Arş» içün һuud suresiniñ 7-nci ayeti izaatına baq.)."
        cid: 0
  - verse: 18
    segments:
      - text: "(Ey, insanlar!) O kunü (esap içün) uzurğa alınırsıñız; sizge ait iç bir sır gizli qalmaz."
        cid: 0
  - verse: 19
    segments:
      - text: "Kitabı sağ tarafından berilgen: Alıñ, kitabımnı oquñ; doğrusı men, esabımnen qarşılaşacağımnı, zaten bile edim, der."
        cid: 0
  - verse: 20
    segments:
      - text: "[19 ayetine baq.]"
        cid: 0
  - verse: 21
    segments:
      - text: "Artıq o, meyvaları sarqqan yuce bir cennette hoşnut qalacaq bir ayat içindedir."
        cid: 0
  - verse: 22
    segments:
      - text: "[21 ayetine baq.]"
        cid: 0
  - verse: 23
    segments:
      - text: "[21 ayetine baq.]"
        cid: 0
  - verse: 24
    segments:
      - text: "(Olarğa denilir ki:) Keçken kunlerde işlegenleriñizge (yahşı amelleriñizge) qarşılıq afiyetnen aşañ, içiñ."
        cid: 0
  - verse: 25
    segments:
      - text: "Kitabı sol tarafından berilgenge kelgende, o: Keşke, der, maña kitabım berilmese edi de, esabımnıñ ne olğanını bilmese edim!"
        cid: 0
  - verse: 26
    segments:
      - text: "[25 ayetine baq.]"
        cid: 0
  - verse: 27
    segments:
      - text: "Keşke, onıñnen (olümimnen) er iş olup bitse edi!"
        cid: 0
  - verse: 28
    segments:
      - text: "Malım maña iç fayda teminlemedi;"
        cid: 0
  - verse: 29
    segments:
      - text: "Saltanatım da menden (qoptı), yoq olup ketti. (Ayetke «Dünyada olğanda qullanğan uccjetlerim (delliler) artıq yoq olup ketti», degen mana da berilmekte. Boyle kimsa aqqında, vazifedarlarğa (ceennemniñ bekçilerine) şu ilâhiy emirnen hitap etilir:)"
        cid: 0
  - verse: 30
    segments:
      - text: "Onı yaqalañ da, (ellerini boynuna) bağlañ;"
        cid: 0
  - verse: 31
    segments:
      - text: "Soñ onı alevli ateşke atıñ!"
        cid: 0
  - verse: 32
    segments:
      - text: "Soñunda da onı yetmiş arşın uzunlığında bir zıncır içinde o yerge soquñ!"
        cid: 0
  - verse: 33
    segments:
      - text: "Çünki o, ulu Allaһqa iman etmez edi,"
        cid: 0
  - verse: 34
    segments:
      - text: "Yoqsulnı toyurmağa teşviq etmez edi. (Bu ayetnen yoqsulnıñ kozetilmeyuvi ve onıñ alına iç diqqat etilmeyuvi, Allaһqa iman etmemekten soñ, eñ buyuk gunah olaraq zikr etilmekte. Aqiqaten, İslâm qaidileri içinde yer alğan mukellefiyetler yahşı tedqiq etilgende, bularnıñ eki noqtada merkezleşkeni korülir: 1). Allaһnıñ emrini buyuk tanımaq. 2). Allaһnıñ yaratqanlarına şefqat kostermek)."
        cid: 0
  - verse: 35
    segments:
      - text: "Bu sebepnen, bugun bu yerde onıñ bir can dostu yoqtır."
        cid: 0
  - verse: 36
    segments:
      - text: "Ancaq, gunahkârlarnıñ aşağan qanlı irinden başqa aşaycağı da yoqtır."
        cid: 0
  - verse: 37
    segments:
      - text: "[36 ayetine baq.]"
        cid: 0
  - verse: 38
    segments:
      - text: "Kore bilgenleriñiz ve koralmağanlarıñız uzerine yemin eterim ki,"
        cid: 0
  - verse: 39
    segments:
      - text: "[38 ayetine baq.]"
        cid: 0
  - verse: 40
    segments:
      - text: "İç şubesiz, o (Qur’an), çoq şerefli bir elçiniñ sözüdir. (Sözniñ asıl saibi, şubesiz, Cenab-ı Allaһtır. Elçi (Peyğamber ya da Cebrail) vastasınen tebliğ etilgeninden, «söz» elçige nisbet berilgen)."
        cid: 0
  - verse: 41
    segments:
      - text: "Ve o, bir şair sözü degil. Ne de az iman etmektesiñiz!"
        cid: 0
  - verse: 42
    segments:
      - text: "Bir kâhin sözü de degil (o). Ne de az tüşünmektesiñiz!"
        cid: 0
  - verse: 43
    segments:
      - text: "(O), alemlerniñ Rabbi tarafından endirilgendir."
        cid: 0
  - verse: 44
    segments:
      - text: "Eger (peyğamber) bizge nisbeten bazı sözler uydurğan olsa edi,"
        cid: 0
  - verse: 45
    segments:
      - text: "Elbette, onı qapqaçlap yaqalar edik."
        cid: 0
  - verse: 46
    segments:
      - text: "Soñ onıñ can damarını qoparır edik (onı yaşatmaz edik)."
        cid: 0
  - verse: 47
    segments:
      - text: "İç biriñiz buña mani de olalmaz ediñiz."
        cid: 0
  - verse: 48
    segments:
      - text: "Doğrusı, o (Qur’an), taqva saipleri içün bir ogüttir."
        cid: 0
  - verse: 49
    segments:
      - text: "Arañızda (onı) yalan sayğanlar olğanını, şubesiz bilmektemiz."
        cid: 0
  - verse: 50
    segments:
      - text: "Muaqqaq, o, kâfirler içün bir iç yarasıdır."
        cid: 0
  - verse: 51
    segments:
      - text: "Ve o, aqiqaten qatiy bilginiñ tam ozüdir."
        cid: 0
  - verse: 52
    segments:
      - text: "O alda, ulu Rabbiñniñ adını yujeltip, noqsanlardan tenzih et."
        cid: 0