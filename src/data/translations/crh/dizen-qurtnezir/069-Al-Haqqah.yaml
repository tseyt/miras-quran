language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: Kerçekleşecek olğan;
        cid: 1
  - verse: 2
    segments:
      - text: (Ebet)
        cid: 0
      - text: nedir
        cid: 1
      - text: o kerçekleşecek olğan?
        cid: 2
  - verse: 3
    segments:
      - text: Kerçekleşecek olğannıñ
        cid: 4
      - text: (qıyametniñ)
        cid: 0
      - text: ne
        cid: 3
      - text: olğanını sen
        cid: 4
      - text: ne yerden
        cid: 3
      - text: bileceksiñ?
        cid: 2
      - text: >-
          (Qur'annıñ ifade etüv şekli ve añlatuv usullarını, başqa tillerde aynına beñzeterek
          tercime etmek imkânı yoqlığı, bu mucize ilâhiy kelâmnıñ tamamı içün söz mevzusı
          olmaqnen beraber, bu yerdeki ayetlerde ve olarğa beñzegenlerinde daa büyük
          zorluqlarğa rastkelinecegi tabiiy aldır. Bu ayetlerde söz etilgen yüz berüvinden
          qaçınılmaycaq qıyamet kününiñ deşeti ve emiyetine diqqat etilmekte, aynı noqtanı
          quvetlendirmek içün Resul-i Ekremge o künniñ deşetini ve faciasını bilalmaycağı
          söylenilmekte).
        cid: 0
