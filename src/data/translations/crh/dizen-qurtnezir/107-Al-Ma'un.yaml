surah_id: 107
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "Dinni yalanlağannı kordiñmi?"
        cid: 0
  - verse: 2
    segments:
      - text: "İşte, o, yetimni itep, qaqar;"
        cid: 0
  - verse: 3
    segments:
      - text: "Yoqsulnı toyurmağa teşviq etmez;"
        cid: 0
  - verse: 4
    segments:
      - text: "Yazıqlar olsun, o namaz qılğanlarğa ki, olar namazlarını ciddiyge almazlar."
        cid: 0
  - verse: 6
    segments:
      - text: "Olar kosteriş yapıcılardıң; hayırğa da mani olurlar. (Bazı kimseler namazlarına riya qatarlar, bazıları da, namaznıñ erkânını tolu eda etmezler. Ayette bularğa işaret etilgen)."
        cid: 0