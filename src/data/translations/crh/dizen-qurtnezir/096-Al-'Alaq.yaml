surah_id: 96
language: crh
author: dizen-qurtnezir
verses:
  - verse: 13
    segments:
      - text: "Ne dersiñ, o (men etken, Peyğambreni) yalanlamaqta ve doğru yoldan yuz çevirmekte ise!"
        cid: 0
  - verse: 14
    segments:
      - text: "(Bu adam) Allaһnıñ, (yapqanlarını) korgenini bilmezmi! 15-19. Yoq, yoq! Eger vazgeçmese, der’al onı mañlayından (perçeminden), o yalancı, gunahkâr mañlaydan (perçemden) yaqalarmız (ceennemge atarmız). O, aman barıp, meclisini (ozüniñ tarafdarlarını) çağırsın. Biz de zebaniylerni çağıracaqmız. Yoq! Oña uyma! Allaһqa secde et ve (yalıñız Oña) yaqlaş!"
        cid: 0