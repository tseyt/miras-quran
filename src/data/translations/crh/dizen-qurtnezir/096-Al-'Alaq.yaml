surah_id: 96
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >-
          Yaratqan Rabbiñniñ adınen oqu! O, insannı bir aşlanğan yımırtadan yarattı.
        cid: 0
  - verse: 2
    segments:
      - text: >-
          [1 ayetine baq.]
        cid: 0
  - verse: 3
    segments:
      - text: >-
          Oqu! İnsanğa bilmegenlerini bildirgen, qalemnen (yazmaqnı) ogretken Rabbiñ eñ
          buyuk kerem saibidir.
        cid: 0
  - verse: 4
    segments:
      - text: >-
          [3 ayetine baq.]
        cid: 0
  - verse: 5
    segments:
      - text: >-
          [3 ayetine baq.]
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Aqiqat şu ki, insan ozüni ozüne yeterli korerek, adden aşar. Şubesiz, dönüş
          Rabbiñyedir.
        cid: 0
  - verse: 7
    segments:
      - text: >-
          [6 ayetine baq.]
        cid: 0
  - verse: 8
    segments:
      - text: >-
          [6 ayetine baq.]
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Namaz qılğanda bir qulnı (Peyğamberni namazdan) men etkenni kordiñmi?
        cid: 0
  - verse: 10
    segments:
      - text: >-
          [9 ayetine baq.] (Bu ayetler Peyğamberimizge namaz qılğanda sataşqan Ebu Cehil
          aqqında engen. O ve oña beñzegenler aqqında boyle buyurılmaqta:)
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Ne dersiñ, o (Peyğamber) doğru yolda ise, yahut taqvanı emir etmekte ise!
        cid: 0
  - verse: 12
    segments:
      - text: >-
          [11 ayetine baq.]
        cid: 0
  - verse: 13
    segments:
      - text: >-
          Ne dersiñ, o (men etken, Peyğambreni) yalanlamaqta ve doğru yoldan yuz
          çevirmekte ise!
        cid: 0
  - verse: 14
    segments:
      - text: >-
          (Bu adam) Allaһnıñ, (yapqanlarını) korgenini bilmezmi!
        cid: 0
  - verse: 15
    segments:
      - text: >-
          Yoq, yoq! Eger vazgeçmese, der’al onı mañlayından (perçeminden), o yalancı,
          gunahkâr mañlaydan (perçemden) yaqalarmız (ceennemge atarmız). O, aman barıp,
          meclisini (ozüniñ tarafdarlarını) çağırsın. Biz de zebaniylerni çağıracaqmız.
          Yoq! Oña uyma! Allaһqa secde et ve (yalıñız Oña) yaqlaş!
        cid: 0
  - verse: 16
    segments:
