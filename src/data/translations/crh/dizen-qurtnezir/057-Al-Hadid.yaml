surah_id: 57
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >
          Köklerde ve yerde olğan er şey Allahnı tesbih etmektedir. O, azizdir, hakimdir.
        cid: 0
  - verse: 2
    segments:
      - text: >
          Köklerniñ ve yerniñ mülki Onıñdır. O, tiriltir, öldürir. O, er şeyge küçü
          yeticidir.
        cid: 0
  - verse: 3
    segments:
      - text: >
          O, ilktir, soñdır, zahirdir, batındır. O, er şeyni bilicidir. (Allah ilktir, er
          şeyden eveldir, başlanğıçı yoqtır, varlıqlarnı O yaratqandır. Soñdır,
          varlıqlarnıñ yoq oluvından soñ da, O baqiydir. Zahirdir, varlığı bir çoq
          delilnen küneş kibi bellidir. Batındır, zatınıñ aqiqatı duyğular ve aqıllarnen
          idrak etilalmaz).
        cid: 0
  - verse: 4
    segments:
      - text: >
          O, köklerni ve yerni altı künde yaratqan, soñra Arşnıñ üzerine istiva etkendir.
          Yerge kirgenni ve ondan çıqqannı, kökten engenni ve o yerge yükselgenni bilir.
          Ne yerde olsañız, O siznen beraberdir. Allah yapqanlarıñıznı körer. (Allah,
          yağmurlar ve ölüler kibi, yerge kirgenlerni, ösümlikler ve madenler kibi yerden
          çıqqanlarnı, rahmet, azap ve melekler kibi, kökten engenlerni, yahşı, yaman
          tutım ve davranışlarnen dualar, buharlar ve başqa kökke yükselişlerni bilir ve
          körer. Altı kün - altı basamaq ya da devir kibi keniş manalardadır. Bizim
          künlerimiz degildir. «Arşqa istiva» içün baq. huud, 11/7).
        cid: 0
  - verse: 5
    segments:
      - text: >
          Köklerniñ ve yerniñ mülki Onıñdır. Bütün işler ancaq Oña döndürilir.
        cid: 0
  - verse: 6
    segments:
      - text: >
          Geceni kündüzge qoşar, kündüzni de gecege qoşar. O, qalplerde olğannı bilir.
          (Böylece, kündüz uzalır, gece qısqarır, gece uzalır, kündüz qısqarır).
        cid: 0
  - verse: 7
    segments:
      - text: >
          Allahqa ve Resulına iman etiñ. Sizni üzerinde tasarrufqa izin bergen şeylerinden
          arclañ. Sizden iman etip de, (Allah rizası içün) arclağan kimselerge büyük
          mükâfat bar. (Ayet Tebuq seferinen bağlı olaraq engen. Bu seferde büyük
          maliyeviy fedakâlrıqlarda bulunğan Az. Osmanğa işaret etilgen. Ayrıca,
          evelkilerden kelgen malnıñ, aqiqatta Allahnıñ olğanı hatırlatılaraq, Allahnıñ
          bergen malını yerli-yerince qullanılması istenilgen).
        cid: 0
  - verse: 8
    segments:
      - text: >
          Peyğamber sizni Rabbiñizge iman etmege çağırğanı alda, niçün Allahqa
          inanmaysıñız? Albuki, O, sizden kesen-kes söz de alğan edi. Eger inanır iseñiz.
          (Allahnıñ alğan kesen-kes sözü, ruhlar aleminde varlıqlardan alınğan sözdir.
          «Söz»den yahşı qullanılğanda insannı imanğa ketirgen aqıl köz ögünde tutulğanı
          da söylengen).
        cid: 0
  - verse: 9
    segments:
      - text: >
          Sizni qaranlıqlardan aydınlıqqa çıqarmaq içün, qulına ap-açıq ayetler endirgen
          Odır. Şübesiz, Allah sizge nisbeten çoq şefqatlı, çoq merhametlidir.
        cid: 0
  - verse: 10
    segments:
      - text: >
          Sizge ne olmaqta ki, Allah yolunda arclamaysıñız? Albuki, köklerniñ ve yerniñ
          mirası Allahnıñdır. Elbette, arañızdan, fetihten evel arclağan ve cenkleşkenler,
          daa soñunda arclap cenkleşkenlernen bir degildir. Olarnıñ derecesi, soñradan
          nefaqa bergen ve cenkleşkenlerden daa yüksektir. Bunıñnen beraber, Allah episine
          de, eñ güzel olğanını vade etken. Allah yapqanlarıñızdan haberdardır. (Buña
          köre, Mekke fethinden evel arclağan ve cenkleşkenler, fetihten soñ cenkleşkenler
          ve arclağanlar daa faziletlidirler. Faniy malnı, baqiy olğan ahiret içün
          arclavnıñ emiyeti hatırlatılır eken, Az. Ebu Bekirge işaret etilmekte. Çünki, o
          imanınen, nefaqasınen ve cihadınen birincilerdendir).
        cid: 0
  - verse: 11
    segments:
      - text: >
          Kim Allahqa güzel bir ödünç berecek olsa, Allah da onıñ qarşılığını qat-qat
          berir ve ayrıca onıñ çoq degerli bir mükâfatı da bardır. (Allahqa ödünç bermek
          demek, yalıñız yardım ğayesinen ve Allah rizası içün maddiy sıqıntı içinde
          olğanlarğa, fayızsız borc bermek ve bu borcnıñ ödelüvinde qolaylıq
          köstermektir).
        cid: 0
  - verse: 12
    segments:
      - text: >
          Mü'min erkeklernen mü'min qadınlarnı, öglerinden ve sağlarından (amelleriniñ)
          nurları aydınlatıp ketkende körgen kününde, (olarğa): Bugün müjdeñiz, zemininden
          irmaqlar aqqan ve içlerinde ebediy qalacağıñız cennetlerdir, denilir. İşte,
          büyük qurtulış budır.
        cid: 0
  - verse: 13
    segments:
      - text: >
          Munafıq erkeklernen, munafıq qadınlarnıñ mü'minlerge: Bizni bekleñ, nuruñızdan
          bir parça ışıq alayıq, deycek künlerinde, olarğa: Artıñızğa qaytıñ da, bir ışıq
          qıdırıñ! denilir. Niayet, olarnıñ arasına, içinde rahmet, tışında azap olğan
          qapulı bir sur (divar) çekilir. (Munafıqlarnıñ isteklerine, mü'minlerniñ
          cevaplarını tasvir etken bu ayetke köre, mü'minlernen munafıqlarnıñ arası
          kesen-kes olaraq ayırılacaq, çekilgen surnıñ (divarnıñ) bir tarafında cennet,
          diger tarafında ceennem yer alacaq).
        cid: 0
  - verse: 14
    segments:
      - text: >
          Munafıqlar olarğa: Biz siznen beraber degil edikmi? diye seslenirler. (Mü'minler
          de) derler ki: Ebet, amma, siz öz başıñıznı belâğa soqtıñız; fırsat beklediñiz;
          şübege tüştüñiz ve quruntılar sizni aldattı. O çoq aldatqan (şeytan) sizni Allah
          aqqında bile aldattı. Niayet, Allahnıñ emiri kelip çattı! (Azapqa çarptırılğan
          munafıqlar dünyada, körünüşte musulmanlar kibi areket eterler, amma qalpten
          inanmağanları içün, mü'minlerniñ felâketini közler, İslâm aqqında şübe
          beslerler, ihtiraslarınıñ peşinden çapışırlar, şeytannıñ çeşit telqin ve
          aldatuvlarına qapılırlar).
        cid: 0
  - verse: 15
    segments:
      - text: >
          Bugün artıq ne sizden, ne de inkâr etkenlerden bedel qabul etilir, baracaq
          yeriñiz ateştir. Sizge yaraşqanı odır. Ne yaman bir dönüş yeridir!
        cid: 0
  - verse: 16
    segments:
      - text: >
          İman etkenlerniñ Allahnı añuv ve Ondan engen Qur'an sebebinen, qalpleriniñ
          titreycek vaqıtı daa kelmedimi? Olar daa evel özlerine kitap berilgenler kibi
          olmasınlar. Olarnıñ üzerinden uzun zaman keçti de, qalpleri qattılaştı. Olardan
          bir çoqu yoldan çıqqan kimselerdir. (Mü'minlerniñ qalpleriniñ Allah ve Qur'an
          zikrinen ürküvi kerkekkenini hatırlatqan ayet yeudiy ve hristianlarnıñ
          vaziyetine diqqat çekmekte. Bu cumleden olmaq üzre, ayet Mekkede sıqıntı içinde
          yaşağan icretten soñ da, bol rızıq ve nimetlerge qavuşqanları içün, zayıflaşqan
          (tenbelleşken) bir qısım sahabiyni tenbiyelemek içün nazil olğan).
        cid: 0
  - verse: 17
    segments:
      - text: >
          Biliñ ki, Allah, ölüminden soñ yer yüzüni canlandırmaqta. Belki, tüşünirsiñiz,
          diye aqiqaten sizge ayetlerni beyan ettik.
        cid: 0
  - verse: 18
    segments:
      - text: >
          Sadaqa bergen erkeklerge ve sadaqa bergen qadınlarğa ve Allahqa güzel bir ödünç
          bergenlerge, bergenleriniñ qarşılığı qat-qat ödenir ve olarğa degerli bir
          mükâfat bardır.
        cid: 0
  - verse: 19
    segments:
      - text: >
          Allahqa ve peyğamberlerine iman etkenler, (ebet) işte olar, Rabbleri yanında
          sözü, özü doğru olğanlar ve şaatlıq mertebesine irişkenlerdir. Olarnıñ
          mükâfatları ve nurları bardır. İnkâr etip de, ayetlerimizni yalanlağanlarğa
          kelgende, olar da ceennemniñ adamlarıdır.
        cid: 0
  - verse: 20
    segments:
      - text: >
          Biliñ ki, dünya ayatı ancaq bir oyun, eglence, bir süs, arañızda bir maqtanuv ve
          daa çoq mal ve evlât saibi olmaq isteginden ibaretdir. Tıpqı bir yağmur kibidir
          ki, östürgen ziraatçılarnıñ oşuna keter. Soñra qurur da, sen onıñ sap-sarı
          olğanını körersiñ; soñra da çör-çöp olur. Ahirette ise, çetin bir azap bar. Kene
          o yerde Allahnıñ mağfireti ve rizası bar. Dünya ayatı aldatıci bir keçinüv
          menbasından başqa bir şey degil. (Dünya ve ahiret ayatınıñ bu teñeştirilüvi,
          ayette, hususen, dünyanıñ aldatıci tarafları izaat etilgen, olardan qaçınıluvı
          tevsiye olunğan. Çünki, dünya ve dünyadakilerniñ boş yerge yaratılmağanları
          çeşit ayetlerde izaatlanğandır. Dünya ayatı yaman degil. Yamanı - Allahqa ve
          peyğamberge itaat etmemek; ahiretni ve insanlıqnı unutıp, yalıñız dünyağa ve
          dünyanıñ fenalıqlarına qapılmaqtır).
        cid: 0
  - verse: 21
    segments:
      - text: >
          Rabbiñizden bir mağfiretke; Allahqa ve peyğamberlerine inanğanlar içün
          azırlanğan olup, kenişligi köknen yerniñ kenişligi qadar olğan cennetke çapışıñ.
          İşte, bu Allahnıñ lütfidir ki, onı istegenine berir. Allah büyük lütf saibidir.
          (Bu ayet Allahnıñ lütf ve ihsanı olmağance, kimseniñ cennetke kiralmaycağına
          delâlet etmekte).
        cid: 0
  - verse: 22
    segments:
      - text: >
          Yer yüzünde yüz bergen ve siziñ başıñızğa kelgen er angi bir musibet yoq ki, biz
          onı yaratmadan evel, bir kitapta yazılğan olmasın. Şübesiz, bu Allahqa köre
          qolaydır.
        cid: 0
  - verse: 23
    segments:
      - text: >
          (Allah bunı) eliñizden çıqqanğa kederlenmemeñiz ve Allahnıñ sizge bergen
          nimetlerinen qopaymamañız içün añlatmaqta. Çünki, Allah özüni begenip,
          ğururlanğan kimselerni sevmez.
        cid: 0
  - verse: 24
    segments:
      - text: >
          Olar saranlıq etip, insanlarğa da saranlıqnı emir eterler. Kim yüz çevirse,
          şübesiz ki, Allah zengindir, hamdge lâyıqtır. (Bu yerde saranlıq etken ve
          kerekli yerlerge arclamaqtan qaçınğanlarğa mesuliyetlikleri hatırlatılmaqta).
        cid: 0
  - verse: 25
    segments:
      - text: >
          Ant olsun, biz peyğamberlerimizni açıq delillernen yolladıq ve insanlarnıñ
          adaletni yerine ketirüvleri içün, yanlarında kitapnı ve terazeni endirdik. Biz
          demirni de endirdik ki, onda büyük bir quvet ve insanlar içün faydalar bar. Bu,
          Allahnıñ dinine ve peyğamberlerine, ğaybğa inanaraq, yardım etkenlerni
          belgilemesi içündir. Şübesiz, Allah quvetlidir, daima üstündir. (Ayette keçken
          demir micazi olaraq «maddiy quvet» manasında da yorumlanğan. Demir aqiqiy manada
          yorumlanğanda, ayette onıñ insan ayatındaki emiyetine diqqat çekilgen).
        cid: 0
  - verse: 26
    segments:
      - text: >
          Ant olsun ki, biz Nuhnı ve İbrahimni yolladıq, peyğamberlikni de, kitapnı da,
          olarnıñ soyuna berdik. Olardan (insanlardan) kimisi doğru yoldadır; aralarından
          bir çoqu da, yoldan çıqandır. (Qur'anda adları zikr etilgen dört büyük kitap
          olarnıñ soylarından olğan peyğamberlerge endirilgeni añlaşıla).
        cid: 0
  - verse: 27
    segments:
      - text: >
          Soñra bularnıñ izinden peş-peşine peyğamberlerimizni yolladıq. Meryem oğlu İsanı
          da, artlarından yolladıq, oña İncilni berdik; oña uyğanlarnıñ qalplerine şefqat
          ve merhamet bergen edik. Uydurğan ruhbanlıqlarına (monahlıqlarına) kelgende, onı
          biz yazmadıq, faqat özleri Allahnıñ rizasını qazanmaq içün yaptılar. Amma, buña
          da keregi kibi uymadılar. Biz de olardan iman etkenlerge mükâfatlarını berdik.
          Aralarından çoqu da, yoldan çıqanlardır. (Ruhbanlıq - hristianlarnıñ ortağa
          çıqarğan bir añlayışı ve yaşayış tarzıdır. Rivayetlerge köre, Az.İsadan soñ
          mü'minler inkârcı zorbalar tarafından yoq etilmege çalışılğan, kirişilgen üç
          cenkte mü'minler ağır ğayıplar bergenler, sağ qalğan iman ehli, özleriniñ de
          ölümi alında, dinge davet etecek kimseniñ qalmaycağı sebebinen, cenkleşmemek
          qararına kelgen, sadece ibadetnen meşğul olmağa başlağan ediler. İşte, böylece,
          fitneden qaçaraq, dinlerinde ihlâs ve samimiyet köstergen bu insanlar dünyanıñ
          bütün zevqlerinden, ziyade aşap-içmekten ve evlenmekten vazgeçkenler, dağlar,
          mağaralar, oyuqlar ve ücrelerde ibadetnen meşğul olğanlar. Amma bir çoqu buña
          riayet etmeyip, Az.İsanıñ dinini inkâr ettiler; ükümdarlarnıñ dinine kirdiler;
          «üçlik» aqidesini ortağa attılar, Az.Muhammedni inkâr ettiler ve sapıqlıqlarğa
          tüştiler).
        cid: 0
  - verse: 28
    segments:
      - text: >
          Ey, iman etkenler! Allahtan qorquñ ve Peyğamberine inanıñ ki, O sizge
          rahmetinden eki qat bersin ve sizge ışığında yürecegiñiz bir nur lütf etsin;
          sizni bağışlasın. Allah çoq bağışlayıcı, çoq merhametlidir. (Bu yerde ehl-i
          kitapqa hitap etilerek, em Az.Peyğamberge, em de diger peyğamberlerge iman
          etüvleri sebebinen, olarğa eki nur berilecegi vade etilgen).
        cid: 0
  - verse: 29
    segments:
      - text: >
          Böylece, kitap ehl-i, Allahnıñ lütfinden iç bir şey elde etalmaycaqlarını
          bilsinler. Lütf tamamınen Allahnıñ elindedir. Onı istegenine bahş eter. Allah
          büyük lütf saibidir.
        cid: 0
