surah_id: 57
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >-
          Koklerde ve yerde olğan er şey Allaһnı tesbih etmektedir. O, azizdir, hakimdir.
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Koklerniñ ve yerniñ mulki Onıñdır. O, tiriltir, oldürir. O, er şeyge kuçü
          yeticidir.
        cid: 0
  - verse: 3
    segments:
      - text: >-
          O, ilktir, soñdır, zahirdir, batındır. O, er şeyni bilicidir. (Allaһ ilktir, er
          şeyden eveldir, başlanğıçı yoqtır, varlıqlarnı O yaratqandır. Soñdır,
          varlıqlarnıñ yoq oluvından soñ da, O baqiydir. Zahirdir, varlığı bir çoq
          delilnen kuneş kibi bellidir. Batındır, zatınıñ aqiqatı duyğular ve aqıllarnen
          idrak etilalmaz).
        cid: 0
  - verse: 4
    segments:
      - text: >-
          O, koklerni ve yerni altı kunde yaratqan, soñra Arşnıñ uzerine istiva etkendir.
          Yerge kirgenni ve ondan çıqqannı, kokten engenni ve o yerge yukselgenni bilir.
          Ne yerde olsañız, O siznen beraberdir. Allaһ yapqanlarıñıznı korer. (Allaһ,
          yağmurlar ve olüler kibi, yerge kirgenlerni, osümlikler ve madenler kibi yerden
          çıqqanlarnı, rahmet, azap ve melekler kibi, kokten engenlerni, yahşı, yaman
          tutım ve davranışlarnen dualar, buharlar ve başqa kokke yukselişlerni bilir ve
          korer. Alt kun - altı basamaq ya da devir kibi keniş manalardadır. Bizim
          kunlerimiz degildir. «Arşqa istiva» içün baq. һuud, 11/7).
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Koklerniñ ve yerniñ mulki Onıñdır. Butün işler ancaq Oña döndürilir.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Geceni kundüzge qoşar, kundüzni de gecege qoşar. O, qalplerde olğannı bilir.
          (Boylece, kundüz uzalır, gece qısqarır, gece uzalır, kundüz qısqarır).
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Allaһqa ve Resulına iman etiñ. Sizni uzerinde tasarrufqa izin bergen
          şeylerinden arclañ. Sizden iman etip de, (Allaһ rizası içün) arclağan kimselerge
          buyuk mukâfat bar. (Ayet Tebuq seferinen bağlı olaraq engen. Bu seferde buyuk
          maliyeviy fedakâlrıqlarda bulunğan Az. Osmanğa işaret etilgen. Ayrıca,
          evelkilerden kelgen malnıñ, aqiqatta Allaһnıñ olğanı hatırlatılaraq, Allaһnıñ
          bergen malını yerli-yerince qullanılması istenilgen).
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Peyğamber sizni Rabbiñizge iman etmege çağırğanı alda, niçün Allaһqa
          inanmaysıñız? Albuki, O, sizden kesen-kes söz de alğan edi. Eger inanır iseñiz.
          (Allaһnıñ alğan kesen-kes sözü, ruhlar aleminde varlıqlardan alınğan sözdir.
          «Söz»den yahşı qullanılğanda insannı imanğa ketirgen aqıl koz ogünde tutulğanı
          da söylengen).
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Sizni qaranlıqlardan aydınlıqqa çıqarmaq içün, qulına ap-açıq ayetler endirgen
          Odır. Şubesiz, Allaһ sizge nisbeten çoq şefqatlı, çoq merhametlidir.
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Sizge ne olmakta ki, Allaһ yolunda arclamaysıñız? Albuki, koklerniñ ve yerniñ
          mirası Allaһnıñdır. Elbette, arañızdan, fetihten evel arclağan ve cenkleşkenler,
          daa soñunda arclap cenkleşkenlernen bir degildir. Olarnıñ derecesi, soñradan
          nefaqa bergen ve cenkleşkenlerden daa yuksektir. Bunıñnen beraber, Allaһ episine
          de, eñ guzel olğanını vade etken. Allaһ yapqanlarıñızdan haberdardır. (Buña
          kore, Mekke fethinden evel arclağan ve cenkleşkenler, fetihten soñ cenkleşkenler
          ve arclağanlar daa faziletlidirler. Faniy malnı, baqiy olğan ahiret içün
          arclavnıñ emiyeti hatırlatılır eken, Az. Ebu Bekirge işaret etilmekte. Çünki, o
          imanınen, nefaqasınen ve cihadınen birincilerdendir).
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Kim Allaһqa guzel bir odünç berecek olsa, Allaһ da onıñ qarşılığını qatqat
          berir ve ayrıca onıñ çoq degerli bir mukâfatı da bardır. (Allaһqa odünç bermek
          demek, yalıñız yardımm ğayesinen ve Allaһ rizası içün maddiy sıqıntı içinde
          olğanlarğa, fayızsız borc bermek ve bu borcnıñ odelüvinde qolaylıq
          kostermektir).
        cid: 0
  - verse: 12
    segments:
      - text: >-
          Mu’min erkeklernen mu’min qadınlarnı, oglerinden ve sağlarından (amelleriniñ)
          nurları aydınlatıp ketkende korgen kunünde, (olarğa): Bugun mujdeñiz, zemininden
          irmaqlar aqqan ve içlerinde ebediy qalacağıñız cennetlerdir, denilir. İşte,
          buyuk qurtulış budır.
        cid: 0
  - verse: 13
    segments:
      - text: >-
          Munafıq erkeklernen, munafıq qadınlarnıñ mu’minlerge: Bizni bekleñ, nuruñızdan
          bir parça ışıq alayıq, deycek kunlerinde, olarğa: Artıñızğa qaytıñ da, bir ışıq
          qıdırıñ! denilir. Niayet, olarnıñ arasına, içinde rahmet, tışında azap olğan
          qapulı bir sur (divar) çekilir. (Munafıqlarnıñ isteklerine, mu’minlerniñ
          cevaplarını tasvir etken bu ayetke kore, mu’minlernen munafıqlarnıñ arası
          kesen-kes olaraq ayırılacaq, çekilgen surnıñ (divarnıñ) bir tarafında cennet,
          diger tarafında ceennem yer alacaq).
        cid: 0
  - verse: 14
    segments:
      - text: >-
          Munafıqlar olarğa: Biz siznen beraber degil edikmi? diye seslenirler.
          (Mu’minler de) derler ki: Ebet, amma, siz oz başıñıznı belâğa soqtıñız; fırsat
          beklediñiz; şubege tüştüñiz ve quruntılar sizni aldattı. O çoq aldatqan (şeytan)
          sizni Allaһ aqqında bile aldattı. Niayet, Allaһnıñ emiri kelip çattı! (Azapqa
          çarptırılğan munafıqlar dünyada, korünüşte musulmanlar kibi areket eterler, amma
          qalpten inanmağanları içün, mu’minlerniñ felâketini kozler, İslâm aqqında şube
          beslerler, ihtiraslarınıñ peşinden çapışırlar, şeytannıñ çeşit telqin ve
          aldatuvlarına qapılırlar).
        cid: 0
  - verse: 15
    segments:
      - text: >-
          Bugun artıq ne sizden, ne de inkâr etkenlerden bedel qabul etilir, baracaq
          yeriñiz ateştir. Sizge yaraşqanı odır. Ne yaman bir dönüş yeridir!
        cid: 0
  - verse: 16
    segments:
      - text: >-
          İman etkenlerniñ Allaһnı añuv ve Ondan engen Qur’an sebebinen, qalpleriniñ
          titreycek vaqıtı daa kelmedimi? Olar daa evel ozlerine kitap berilgenler kibi
          olmasınlar. Olarnıñ uzerinden uzun zaman keçti de, qalpleri qattılaştı. Olardan
          bir çoqu yoldan çıqqan kimselerdir. (Mu’minlerniñ qalpleriniñ Allaһ ve Qur’an
          zikrinen urküvi kerkekkenini hatırlatqan ayet yeudiy ve hristianlarnıñ
          vaziyetine diqqat çekmekte. Bu cumleden olmaq uzre, ayet Mekkede sıqıntı içinde
          yaşağan icretten soñ da, bol rızı ve nimetlerge qavuşqanları içün, zayıflaşqan
          (tenbelleşken) bir qısım sahabiyni tenbiyelemek içün nazil olğan).
        cid: 0
  - verse: 17
    segments:
      - text: >-
          Biliñ ki, Allaһ, olüminden soñ yer yuzüni canlandırmaqta. Belki, tüşünirsiñiz,
          diye aqiqaten sizge ayetlerni beyan ettik.
        cid: 0
  - verse: 18
    segments:
      - text: >-
          Sadaqa bergen erkeklerge ve sadaqa bergen qadınlarğa ve Allaһqa guzel bir odünç
          bergenlerge, bergenleriniñ qarşılığı qat-qat odenir ve olarğa degerli bir
          mukâfat bardır.
        cid: 0
  - verse: 19
    segments:
      - text: >-
          Allaһqa ve peyğamberlerine iman etkenler, (ebet) işte olar, Rabbleri yanında
          sözü, ozü doğru olğanlar ve şaatlıq mertebesine irişkenlerdir. Olarnıñ
          mukâfatları ve nurları bardır. İnkâr etip de, ayetlerimizni yalanlağanlarğa
          kelgende, olar da ceennemniñ adamlarıdır.
        cid: 0
  - verse: 20
    segments:
      - text: >-
          Biliñ ki, dünya ayatı ancaq bir oyun, eglence, bir süs, arañızda bir maqtanuv
          ve daa çoq mal ve evlât saibi olmaq isteginden ibaretdir. Tıpqı bir yağmur
          kibidir ki, ostürgen ziraatçılarnıñ oşuna keter. Soñra qurur da, sen onıñ
          sap-sarı olğanını korersiñ; soñra da çör-çöp olur. Ahirette ise, çetin bir azap
          bar. Kene o yerde Allaһnıñ mağfireti ve rizası bar. Dünya ayatı aldatıci bir
          keçinüv menbasından başqa bir şey degil. (Dünya ve ahiret ayatınıñ bu
          teñyeştirilüvi, ayette, hususen, dünyanıñ aldatıci tarafları izaat etilgen,
          olardan qaçınıluvı tevsiye olunğan. Çünki, dünya ve dünyadakilerniñ boş yerge
          yaratılmağanları çeşit ayetlerde izaatlanğandır. Dünya ayatı yaman degil. Yamanı
          - Allaһqa ve peyğamberge itaat etmemek; ahiretni ve insanlıqnı unutıp, yalıñız
          dünyağa ve dünyanıñ fenalıqlarına qapılmaqtır).
        cid: 0
  - verse: 21
    segments:
      - text: >-
          Rabbiñizden bir mağfiretke; Allaһqa ve peyğamberlerine inanğanlar içün
          azırlanğan olup, kenişligi koknen yerniñ kenişligi qadar olğan cennetke çapışıñ.
          İşte, bu Allaһnıñ lütfidir ki, onı istegenine berir. Allaһ buyuk lütf saibidir.
          (Bu ayet Allaһnıñ lütf ve ihsanı olmağance, kimseniñ cennetke kiralmaycağına
          delâlet etmekte).
        cid: 0
  - verse: 22
    segments:
      - text: >-
          Yer yuzünde yuz bergen ve siziñ başıñızğa kelgen er angi bir musibet yoq ki,
          biz onı yaratmadan evel, bir kitapta yazılğan olmasın. Şubesiz, bu Allaһqa kore
          qolaydır.
        cid: 0
  - verse: 23
    segments:
      - text: >-
          (Allaһ bunı) eliñizden çıqqanğa kederlenmemeñiz ve Allaһnıñ sizge bergen
          nimetlerinen qopaymamañız içün añlatmaqta. Çünki, Allaһ ozüni begenip,
          ğururlanğan kimselerni sevmez.
        cid: 0
  - verse: 24
    segments:
      - text: >-
          Olar saranlıq etip, insanlarğa da saranlıqnı emir eterler. Kim yuz çevirse,
          şubesiz ki, Allaһ zengindir, hamdge lâyıqtır. (Bu yerde saranlıq etken ve
          kerekli yerlerge arclamaqtan qaçınğanlarğa mesuliyetlikleri hatırlatılmaqta).
        cid: 0
  - verse: 25
    segments:
      - text: >-
          Ant olsun, biz peyğamberlerimizni açıq delillernen yolladıq ve insanlarnıñ
          adaletni yerine ketirüvleri içün, yanlarında kitapnı ve terazeni endirdik. Biz
          demirni de endirdik ki, onda buyuk bir quvet ve insanlar içün faydalar bar. Bu,
          Allaһnıñ dinine ve peyğamberlerine, ğaybğa inanaraq, yardım etkenlerni
          belgilemesi içündir. Şubesiz, Allaһ quvetlidir, daima ustündir. (Ayette keçken
          demir micazi olaraq «maddiy quvet» manasında da yorumlanğan. Demir aqiqiy manada
          yorumlanğanda, ayette onıñ insan ayatındaki emiyetine diqqat çekilgen).
        cid: 0
  - verse: 26
    segments:
      - text: >-
          Ant olsun ki, biz Nuһnı ve İbrahimni yolladıq, peyğamberlikni de, kitapnı da,
          olarnıñ soyuna berdik. Olardan (insanlardan) kimisi doğru yoldadır; aralarından
          bir çoqu da, yoldan çıqandır. (Qur’anda adları zikr etilgen dört buyuk kitap
          olarnıñ soylarından olğan peyğamberlerge endirilgeni añlaşıla).
        cid: 0
  - verse: 27
    segments:
      - text: >-
          Soñra bularnıñ izinden peş-peşine peyğamberlerimizni yolladıq. Meryem oğlu
          İsanı da, artlarından yolladıq, oña İncilni berdik; oña uyğanlarnıñ qalplerine
          şefqat ve merhamet bergen edik. Uydurğan ruhbanlıqlarına (monahlıqlarına)
          kelgende, onı biz yazmadıq, faqat ozleri Allaһnıñ rizasını qazanmaq içün
          yaptılar. Amma, buña da keregi kibi uymadılar. Biz de olardan iman etkenlerge
          mukâfatlarını berdik. Aralarından çoqu da, yoldan çıqanlardır. (Ruhbanlıq -
          hristianlarnıñ ortağa çıqarğan bir añlayışı ve yaşayış tarzıdırr. Rivayetlerge
          kore, Az.İsadan soñ mu’minler inkârcı zorbalar tarafından yoq etilmege
          çalışılğan, kirişilgen uç cenkte mu’minler ağır ğayıplar bergenler, sağ qalğan
          iman ehli, ozleriniñ de olümi alında, dinge davet etecek kimseniñ qalmaycağı
          sebebinen, cenkleşmemek qararına kelgen, sadece ibadetnen meşğul olmağa başlağan
          ediler. İşte, boylece, fitneden qaçaraq, dinlerinde ihlâs ve samimiyet kostergen
          bu insanlar dünyanıñ butün zevqlerinden, ziyade aşap-içmekten ve evlenmekten
          vazgeçkenler, dağlar, mağaralar, oyuqlar ve ucrelerde ibadetnen meşğul olğanlar.
          Amma bir çoqu buña riayet etmeyip, Az.İsanıñ dinini inkâr ettiler; ukümdarlarnıñ
          dinine kirdiler; «uçlik» aqidesini ortağa attılar, Az.Muһammedni inkâr ettiler
          ve sapıqlıqlarğa tüştiler).
        cid: 0
  - verse: 28
    segments:
      - text: >-
          Ey, iman etkenler! Allaһtan qorquñ ve Peyğamberine inanıñ ki, O sizge
          rahmetinden eki qat bersin ve sizge ışığında yurecegiñiz bir nur lütf etsin;
          sizni bağışlasın. Allaһ çoq bağışlayıcı, çoq merhametlidir. (Bu yerde ehl-i
          kitapqa hitap etilerek, em Az.Peyğamberge, em de diger peyğamberlerge iman
          etüvleri sebebinen, olarğa eki nur berilecegi vade etilgen).
        cid: 0
  - verse: 29
    segments:
      - text: >-
          Boylece, kitap ehl-i, Allaһnıñ lütfinden iç bir şey elde etalmaycaqlarını
          bilsinler. Lütf tamamınen Allaһnıñ elindedir. Onı istegenine bahş eter. Allaһ
          buyuk lütf saibidir.
        cid: 0