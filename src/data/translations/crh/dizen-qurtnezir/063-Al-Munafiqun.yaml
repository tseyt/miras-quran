surah_id: 63
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >
          Munafıqlar saña kelgenlerinde: Şaatlıq etermiz ki, sen Allahnıñ Peyğamberisiñ,
          derler. Allah da bilir ki, sen elbette, Onıñ Peyğamberisiñ. Allah munafıqlarnıñ
          kesen-kes yalancı olğanlarını bilmekte.
        cid: 0
  - verse: 2
    segments:
      - text: >
          Yeminlerini qalqan etip, Allah yolundan saptılar. Aqiqaten, olarnıñ yapqanları
          ne fenadır!
        cid: 0
  - verse: 3
    segments:
      - text: >
          Bunıñ sebebi, olarnıñ başta iman etip, soñra inkâr etüvleridir. Bu sebepten,
          qalpleri müurlengendir. Artıq olar iç añlamazlar.
        cid: 0
  - verse: 4
    segments:
      - text: >
          Olarnı körgen vaqtıñda, qıyafetleri oşuña keter, laf etseler, sözlerini
          diñlersiñ. Olar sanki divarğa tayanğan kütükler kibidir. Er gürültini öz
          aleyhilerine sanarlar. Duşman olardır, olardan saqın. Allah olarnıñ canlarını
          alsın. Nasıl bu alğa kelmekteler? (Tasdiq etkenlerini tillerinen söylegenleri
          alda, qalplerinen inkâr etken, böylece, söylegenleri, inançlarınıñ aksi olğan
          munafıqlarnıñ cusseli, iri ve yaqışıqlı insanlar olğanı ifadelenmeknen,
          munafıqlarnıñ reberi Abdullah b. Ubey, Muğiz b. Qays ve Cedb b. Qaysqa işaret
          etilgen. Aqiqaten, bular kösterişli vucutlarınen Az.Peyğamberniñ meclisine
          kelir, divarğa tayanır, bediiy ve tesirli qonuşmalar yapar ediler. Bular bu
          areket ve davranışlarnen urba kiydirilgen kütüklerge ya da divarğa tayandırılğan
          kerestelerge beñzetilgenler. Qalıpları bar, faqat qalp ve idrakleri yoqtır, eki
          yüzlülikleri sebebinden, çoq qorqaqtırlar. Buña rağmen, olar eñ telükeli duşman
          bilinmelidirler).
        cid: 0
  - verse: 5
    segments:
      - text: >
          Olarğa: Keliñ, Allah Peyğamberi siz içün mağfiret tilesin, denilgen vaqıtta,
          başlarını çevrirler ve sen olarnıñ büyüklik taslarayaq, uzaqlaşqanlarını
          körersiñ.
        cid: 0
  - verse: 6
    segments:
      - text: >
          Olarğa mağfiret tileseñ de, tilemeseñ de, birdir. Allah olarnı kesen-kes
          bağışlamaycaq. Çünki, Allah yoldan çıqqan toplulıqnı doğru yolğa qavuştırmaz.
          (Az.Peyğamber, Beni Mustaliq seferinde olğanda, Mureysi suvı başında Cehcah b.
          Said (r.a.)nen Sinan-ı Cuheniy arasında qavğa çıqqan, faqır muhacirlerden biri
          Cehcah lehine qavğağa kirişken. Munafıqlarnıñ büyügi Abdulah b. Ubey de
          muhacirlerge ağır aqaretler savuraraq, yardım etilmemesini söylegen. Daa pek
          genç yaşta olğan Zeyd b. Erqam (r.a.) bu aşşalayıcı sözlerni eşitken edi.
          Vaziyetni Az.Peyğamberge haber bergen. Az.Peyğamber de, İbn Ubeyni çağırtaraq,
          söylegenlerini soraştırğan. İbn Ubey muhacirlernen bağlı qabaatlavlarını inkâr
          etkeninen, Az.Peyğamber ve sahabe yanında yalancı vaziyetine tüşkeninden, soñ
          derece kederlengen Zeydniñ doğrulığı bu sureniñ enüvinen ortağa çıqqan. İbn Ubey
          ise, ayette bildirilgeni kibi, özüne teklif olunğan istiğfar talaplarını red
          etken. Az.Peyğamberniñ uzurına baruvnı şanına sığdırmağan. Aradan çoq vaqıt
          keçmeden, ağır bir hastalıqnen ölgen).
        cid: 0
  - verse: 7
    segments:
      - text: >
          Olar: Allahnıñ elçisi yanında bulunğanlar içün iç bir şey arclamañ ki, dağılıp
          ketsinler, degenler edi. Albuki, köklerniñ ve yerniñ hazineleri Allahnıñdır.
          Faqat munafıqlar bunı añlamazlar.
        cid: 0
  - verse: 8
    segments:
      - text: >
          Olar: Ant olsun, eger Medinege qaytsaq, üstün olğan zayıf olğannı o yerden
          mıtlaqa çıqaracaq, dey ediler. Albuki, asıl üstünlik ancaq Allahnıñ,
          Peyğamberiniñ ve mü'minlerniñdir. Faqat munafıqlar bunı bilmezler. (Munafıqlar
          özlerini küçlü, şerefli, musulmanlarnı zayıf, aşşa körmekteler, Beni Mustalıqtan
          qaytqanda, olarnı Medeniden çıqaracaqlarını söyley ediler).
        cid: 0
  - verse: 9
    segments:
      - text: >
          Ey, iman etkenler! Mallarıñız ve balalarıñız sizni Allahnı añmaqtan
          uzaqlaştırmasın. Kim bunı yapsa, işte olar ziyanğa oğrağanlardır.
        cid: 0
  - verse: 10
    segments:
      - text: >
          Er angi biriñizge ölüm kelip de: Rabbim! Meni yaqın bir müddetkece keçiktirseñ
          de, sadaqa berip, yahşılardan olsam! deyüviñden evel, sizge bergen rızqımızdan
          arclañ.
        cid: 0
  - verse: 11
    segments:
      - text: >
          Allah, eceli kelgende, iç kimseni (ölümini) keçiktirmez. Allah yapqanlarıñızdan
          haberdardır.
        cid: 0
