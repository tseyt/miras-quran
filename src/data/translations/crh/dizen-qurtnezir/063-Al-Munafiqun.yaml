      - text: >-
          (Tasdiq etkenlerini tillerinen söylegenleri alda, qalplerinen inkâr etken, böylece,
          söylegenleri, inançlarınıñ aksi olğan munafıqlarnıñ cusseli, iri ve yaqışıqlı
          insanlar olğanı ifadelenmeknen, munafıqlarnıñ reberi Abdullah b. Ubey, Muğiz b. Qays
          ve Cedb b. Qaysqa işaret etilgen. Aqiqaten, bular kösterişli vucutlarınen
          Az.Peyğamberniñ meclisine kelir, divarğa tayanır, bediiy ve tesirli qonuşmalar yapar
          ediler. Bular bu areket ve davranışlarnen urba kiydirilgen kütüklerge ya da divarğa
          tayandırılğan kerestelerge beñzetilgenler. Qalıpları bar, faqat qalp ve idrakleri
          yoqtır, eki yüzlülikleri sebebinden, çoq qorqaqtırlar. Buña rağmen, olar eñ telükeli
          duşman bilinmelidirler).
        cid: 0
