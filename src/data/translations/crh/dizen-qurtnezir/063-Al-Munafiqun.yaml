surah_id: 63
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "Munafıklar saña kelgenlerinde: Şaatlıq etermiz ki, sen Allaһnıñ Peyğamberisiñ, derler. Allaһ da bilir ki, sen elbette, Onıñ Peyğamberisiñ. Allaһ munafıklarnıñ kesen-kes yalancı olğanlarını bilmekte."
        cid: 0
  - verse: 2
    segments:
      - text: "Yeminlerini qalqan etip, Allaһ yolundan saptılar. Aqiqaten, olarnıñ yapqanları ne fenadır!"
        cid: 0
  - verse: 3
    segments:
      - text: "Bunıñ sebebi, olarnıñ başta iman etip, soñra inkâr etüvleridir. Bu sebepten, qalpleri muurlengendir. Artıq olar iç añlamazlar."
        cid: 0
  - verse: 4
    segments:
      - text: "Olarnı korgen vaqtıñda, qıyafetleri oşuña keter, laf etseler, sözlerini diñlersiñ. Olar sanki divarğa tayanğan kutükler kibidir. Er gurültini oz aleyhilerine sanarlar. Duşman olardıң, olardan saqın. Allaһ olarnıñ canlarını alsın. Nasıl bu alğa kelmekteler? (Tasdiq etkenlerini tillerinen söylegenleri alda, qalplerinen inkâr etken, boylece, söylegenleri, inançlarınıñ aksi olğan munafıqlarnıñ cusseli, iri ve yaqışıqlı insanlar olğanı ifadelenmeknen, munafıklarnıñ reberi Abdullah b. Ubey, Muğiz b. Qays ve Cedb b. Qaysqa işaret etilgen. Aqiqaten, bular kosterişli vucutlarınen Az.Peyğamberniñ meclisine kelir, divarğa tayanır, bediiy ve tesirli qonuşmalar yapar ediler. Bular bu areket ve davranışlarnen urba kiydirilgen kutüklerge ya da divarğa tayandırılğan kerestelerge beñzetilgenler. Qalpları bar, faqat qalp ve idrakleri yoqtır, eki yuzlülikleri sebebinden, çoq qorqaqtırlar. Buña rağmen, olar eñ telükeli duşman bilinmelidirler)."
        cid: 0
  - verse: 5
    segments:
      - text: "Olarğa: Keliñ, Allaһ Peyğamberi siz içün mağfiret tilesin, denilgen vaqıtta, başlarını çevrirler ve sen olarnıñ buyuklik taslarayaq, uzaqlaşqanlarını korersiñ."
        cid: 0
  - verse: 6
    segments:
      - text: "Olarğa mağfiret tileseñ de, tilemeseñ de, birdir. Allaһ olarnı kesen-kes bağışlamaycaq. Çünki, Allaһ yoldan çıqqan toplulıqnı doğru yolğa qavuştırmaz. (Az.Peyğamber, Beni Mustaliq seferinde olğanda, Mureysi suvı başında Cehcah b. Said (r.a.)nen Sinan-ı Cuheniy arasında qavğa çıqqan, faqır muhacirlerden biri Cehcah lehine qavğağa kiriiken. Munafıklarnıñ buyugi Abdulah b. Ubey de muhacirlerge ağır aqaretler savuraraq, yardım etilmemesini söylegen. Daa pek genç yaita olğan Zeyd b. Erqam (r.a.) bu aşşalayıcı sözlerni eşitken edi. Vaziyetni Az.Peyğamberge haber bergen. Az.Peyğamber de, İbn Ubeyni çağırtaraq, söylegenlerini soraştırğan. İbn Ubey muhacirlernen bağlı qabaatlavlarını inkâr etkeninen, Az.Peyğamber ve sahabe yanında yalancı vaziyetine tüşkeninden, soñ derece kederlengen Zeydniñ doğrulığı bu sureniñ enüvinen ortağa çıqqan. İbn Ubey ise, ayette bildirilgeni kibi, ozüne teklif olunğan istiğfar talaplarını red etken. Az.Peyğamberniñ uzurına baruvnı şanına sığdırmağan. Aradan çoq vaqıt keçmeden, ağır bir hastalıqnen olgen)."
        cid: 0
  - verse: 7
    segments:
      - text: "Olar: Allaһnıñ elçisi yanında bulunğanlar içün iç bir şey arclamañ ki, dağılıp ketsinler, degenler edi. Albuki, koklerniñ ve yerniñ hazineleri Allaһnıñdır. Faqat munafıqlar bunı añlamazlar."
        cid: 0
  - verse: 8
    segments:
      - text: "Olar: Ant olsun, eger Medinege qaytsaq, ustün olğan zayıf olğannı o yerden mıtlaqa çıqaracaq, dey ediler. Albuki, asıl ustünlik ancaq Allaһnıñ, Peyğamberiniñ ve mu’minlerniñdir. Faqat munafıqlar bunı bilmezler. (Munafıqlar ozlerini kuçlü, şerefli, musulmanlarnı zayıf, aşia kormekteler, Beni Mustalıqtan qaytqanda, olarnı Medeniden çıqaracaqlarını söyley ediler)."
        cid: 0
  - verse: 9
    segments:
      - text: "Ey, iman etkenler! Mallarıñız ve balalarıñız sizni Allaһnı añmaqtan uzaqlaştırmasın. Kim bunı yapsa, işte olar ziyanğa oğrağanlardır."
        cid: 0
  - verse: 10
    segments:
      - text: "Er angi biriñizge olüm kelip de: Rabbim! Meni yaqın bir muddetkece keçiktirseñ de, sadaqa berip, yahşılardan olsam! deyuviñden evel, sizge bergen rızqımızdan arclañ."
        cid: 0
  - verse: 11
    segments:
      - text: "Allaһ, eceli kelgende, iç kimseni (olümini) keçiktirmez. Allaһ yapqanlarıñızdan haberdardır."
        cid: 0