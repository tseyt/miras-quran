        cid: 18
      - text: >-
          (Az.Peyğamber, Beni Mustaliq seferinde olğanda, Mureysi suvı başında Cehcah b. Said
          (r.a.)nen Sinan-ı Cuheniy arasında qavğa çıqqan, faqır muhacirlerden biri Cehcah
          lehine qavğağa kirişken. Munafıqlarnıñ büyügi Abdulah b. Ubey de muhacirlerge ağır
          aqaretler savuraraq, yardım etilmemesini söylegen. Daa pek genç yaşta olğan Zeyd b.
          Erqam (r.a.) bu aşşalayıcı sözlerni eşitken edi. Vaziyetni Az.Peyğamberge haber
          bergen. Az.Peyğamber de, İbn Ubeyni çağırtaraq, söylegenlerini soraştırğan. İbn Ubey
          muhacirlernen bağlı qabaatlavlarını inkâr etkeninen, Az.Peyğamber ve sahabe yanında
          yalancı vaziyetine tüşkeninden, soñ derece kederlengen Zeydniñ doğrulığı bu sureniñ
          enüvinen ortağa çıqqan. İbn Ubey ise, ayette bildirilgeni kibi, özüne teklif olunğan
          istiğfar talaplarını red etken. Az.Peyğamberniñ uzurına baruvnı şanına sığdırmağan.
          Aradan çoq vaqıt keçmeden, ağır bir hastalıqnen ölgen).
        cid: 0
