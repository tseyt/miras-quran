      - text: >-
          Qabirlerde bulunğanlar tiriltilip, tışqa çıqarılğan ve qalplerde gizlengenler
          ortağa qoyulğan vaqıtta insan (alınıñ ne olacağını) tüşünmezmi? Şubesiz,
          Rabbleri o kunü olardan tamamınen haberdardır.
