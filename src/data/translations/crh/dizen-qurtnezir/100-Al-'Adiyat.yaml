surah_id: 100
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >-
          Har-har qoşqanlarğa, (nallarınen) çaqaraq, qığılçım saçqanlarğa, (apansızdan)
          saba basqını yapqanlarğa, o yerde toznı dumanğa qatqanlarğa, derken o yerde bir
          toplulıqnıñ ta ortasına kirgenlerge yemin eterim ki, insan Rabbine nisbeten pek
          nankordir, şubesiz, buña ozü de şaattır ve o, mal sevgisine de adden aşır
          derecede hırslıdır.
        cid: 0
