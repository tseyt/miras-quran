surah_id: 100
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: Har-har qoşqanlarğa,
        cid: 1
      - text: (nallarınen)
        cid: 0
      - text: çaqaraq,
        cid: 1
      - text: qığılçım saçqanlarğa,
        cid: 2
      - text: >-
          (apansızdan) saba basqını yapqanlarğa, o yerde toznı dumanğa qatqanlarğa, derken o
          yerde bir toplulıqnıñ ta ortasına kirgenlerge yemin eterim ki, insan Rabbine
          nisbeten pek nankordir, şübesiz, buña özü de şaattır ve o, mal sevgisine de adden
          aşır derecede hırslıdır.
        cid: 0
