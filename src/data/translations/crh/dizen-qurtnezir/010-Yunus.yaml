      - text: >-
          (Rivayetke köre, Nadr b. Haaris kibi bir taqım müşrikler Resulullahnıñ
          peyğamberligini inkâr etkenler ve: «YA Allah, eger Muhammedniñ Peyğamberligi doğru
          ise, aman kökten üstümizge taş yağdır ya da bizge ağır bir azap ketir!» degen
          ediler. Bunıñ üzerine, yuqarıdaki ayet endi. Demek ki, Allah Taalâ tilese, qullarını
          işlegen günahları sebebinden, aman cezalandırmaz; belki tövbe eter, peşman olur ve
          haqqa dönerler diye, cezalarını keçiktirir. Tövbe etmegenlerge de özleri öçün taqdir
          etilgen belli bir müddetkece muhlet berir, bu müddet soñunda olarnıñ cezasını ya
          dünyada olğanda berir, ya da ahiretke qaldırır).
        cid: 0
