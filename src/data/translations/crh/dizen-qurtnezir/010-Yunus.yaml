surah_id: 10
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >
          Elif. Lâam. Raa. İşte, bular ikmet tolu Kitapnıñ ayetleridir.
        cid: 0
  - verse: 2
    segments:
      - text: >
          Aralarından bir adamğa: İnsanlarnı tenbiyele ve iman etkenlerge, Rableri qatında
          olar içün yüksek bir doğrulıq maqamı olğanını müjdele, diye vahiy etüvimiz,
          insanlar içün şaşılacaq bir şey oldımı ki, o kâfirler: Bu, elbette ap-açıq bir
          sihirbazdır, dediler?
        cid: 0
  - verse: 3
    segments:
      - text: >
          Şübesiz ki, Rabbiñiz köklerni ve yerni altı künde yaratqan, soñra da işlerni
          yerli-yerince idare eterek, arşqa hakim olğan Allahtır. Onıñ izni olmadan, iç
          kimse şefaatçı olalmaz. İşte, O, Rabbiñiz Allahtır. O alda Oña qullıq etiñ. Alâ
          tüşünmeysiñizmi! (Köklerniñ ve yerniñ altı künde yaratıluvı ve Allahnıñ Arşqa
          hakimligi hususındaki añlatuvlar içün A'raaf suresiniñ 54-nci ayeti izaatına
          baqıñ).
        cid: 0
  - verse: 4
    segments:
      - text: >
          Allahnıñ kerçek bir vadesi olaraq, epiñizniñ dönüşiñiz ancaq Oñadır. Çünki, O,
          mahlüqatnı evelâ (yoqtan) yaratır, soñra da iman etip, yahşı işler yapqanlarğa
          adaletnen mükâfat bermek içün (olarnı uzurına) keri çevirir. Kâfir olğanlarğa
          kelgende, inkâr etmekte olğan şeylerinden ötrü, olar içün qaynap turğan suvdan
          bir içki ve elem berici bir azap bardır.
        cid: 0
  - verse: 5
    segments:
      - text: >
          Küneşni ışıqlı, aynı da parlaq yapqan, yıllarnıñ sayısını ve esabını bilüviñiz
          içün oña (ayğa) bir taqım menziller taqdir etken Odır. Allah bularnı, ancaq bir
          aqiqatqa (ve ikmetke) binaen yaratqan. O, bilgen bir qavmğa ayetlerini beyan
          etmekte.
        cid: 0
  - verse: 6
    segments:
      - text: >
          Gece ve kündüzniñ deñişüvinde (uzayıp-qısqaruvında) Allahnıñ köklerde ve yerde
          yaratqan şeylerinde, (Onı inkâr etmekten) saqınğan bir qavm içün, elbette nice
          deliller bardır!
        cid: 0
  - verse: 7
    segments:
      - text: >
          Uzurımızğa çıqacaqlarını beklemegenler dünya ayatına razı olup, onıñnen raatlıq
          tapqanlar ve ayetlerimizden ğafil olğanlar yoqmı, işte, olarnıñ qazanmaqta olğan
          (günahları) sebebinden, baracaq yerleri ateştir!
        cid: 0
  - verse: 8
    segments:
      - text: >
          [7 ayetine baq.]
        cid: 0
  - verse: 9
    segments:
      - text: >
          İman etip, güzel işler yapqanlarğa kelgende, imanları sebebinen, Rabbleri olarnı
          nimet tolu cennetlerde alt tarafından irmaqlar aqqan (saraylarğa) iriştirir.
        cid: 0
  - verse: 10
    segments:
      - text: >
          Olarnıñ o yerdeki duası: «Allahım! Seni noqsan sıfatlardan uzaq tutarmız!»
          (sözleridir). O yerde bir-birilerinen qarşılaşqanda söylegenleri ise,
          «selâm»dır. Olarnıñ dualarınıñ soñu da şudır: Hamd alemlerniñ Rabbi Allahqa
          mahsustır.
        cid: 0
  - verse: 11
    segments:
      - text: >
          Eger Allah insanlarğa hayırnı çar-çabuk istegenleri kibi, şerrni de acele berse
          edi, elbette olarnıñ ecelleri bitirilgen olur edi. Faqat bizge qavuşmaqnı
          beklemegenlerni biz yoldan azğanları alda, bocalağan bir şekilde (öz başlarına)
          bıraqırmız. (Rivayetke köre, Nadr b. Haaris kibi bir taqım müşrikler
          Resulullahnıñ peyğamberligini inkâr etkenler ve: «YA Allah, eger Muhammedniñ
          Peyğamberligi doğru ise, aman kökten üstümizge taş yağdır ya da bizge ağır bir
          azap ketir!» degen ediler. Bunıñ üzerine, yuqarıdaki ayet endi. Demek ki, Allah
          Taalâ tilese, qullarını işlegen günahları sebebinden, aman cezalandırmaz; belki
          tövbe eter, peşman olur ve haqqa dönerler diye, cezalarını keçiktirir. Tövbe
          etmegenlerge de özleri öçün taqdir etilgen belli bir müddetkece muhlet berir, bu
          müddet soñunda olarnıñ cezasını ya dünyada olğanda berir, ya da ahiretke
          qaldırır).
        cid: 0
  - verse: 12
    segments:
      - text: >
          İnsanğa bir zarar kelgen vaqıtta, yan yataraq, oturaraq, ya da ayaqta turaraq (o
          zararnıñ yoq oluvı içün) bizge dua eter; Faqat biz onı sıqıntısından
          qurtarğanımıznen, sanki özüne toqunğan bir sıqıntıdan ötrü, bizge dua etmegen
          kibi keçip keter. İşte, böylece, adden aşqanlarğa yapayatqan şeyleri güzel
          kösterildi. (Allah Taalâ bu ayette insannıñ belâ ve musibetler qarşısındaki ve
          bularnıñ ortadan qaldırıluvından soñki areket ve davranışlarnı köz ögüne
          sermekte. Yahşı insanğa yaraşqanı, ister sıqıntılı allarda, ister ferahlı
          anlarında, daima Allahnı añmaq ve Oña dua etmektir. Sadece, musibet anında
          Allahnı añıp, ferah anında unutmaq, inançı ve iradesi zayıf, nefsaniy ve addiy
          isteklerniñ qarşısında ezilgen ve yeñilgen acizlerniñ areketidir).
        cid: 0
  - verse: 13
    segments:
      - text: >
          Ant olsun ki, sizden evel, Peyğamberleri özlerine mucizeler ketirgeni alda,
          (yalanlap) zulım etkenleri tolayı, nice milletlerni elâk ettik; zaten, olar iman
          etecek degil ediler. İşte, biz suçlı qavmlarnı böyle cezalandırırmız.
        cid: 0
  - verse: 14
    segments:
      - text: >
          Soñra da nasıl davranacağıñıznı körüvimiz içün, olarnıñ artından sizni yer
          yüzünde halifeler yaptıq (olarnıñ yerine sizni ketirdik).
        cid: 0
  - verse: 15
    segments:
      - text: >
          Olarğa ayetlerimiz açıq-açıq oqulğan vaqıtta (ölgenden soñ), bizge qavuşmaqnı
          beklemegenler: YA bundan başqa bir Qur'an ketir, ya da bunı deñiştir! dediler.
          De ki: Onı özlügimden deñiştirmem, men içün olacaq şey degil. Men, maña vahiy
          olunğandan başqasına uymam. Çünki, Rabbime isyan etsem, elbette büyük künniñ
          azabından qorqarım. (Zamanımızda olğanı kibi, Qur'an-ı Kerim engen devrinde de,
          öz qafalarına köre din istegenler ya da Allahnıñ ükümleriniñ öz arzu ve
          aveslerine köre deñiştirilüvini istegenler olğan. Albuki, Qur'an belli
          devirlerdeki insanlarnıñ keçici ve deñişici arzularını qarşılamaq içün degil,
          qıyametke qadar bütün insanlıqnıñ ruhiy, ahlâqiy ve maneviy itiyacalarını
          qarşılamaq, dünyaviy ve uhreviy seadetniñ yolunı köstermek içün endirilgen. Bu
          sebeplerden ki, ayette bildirilgeni kibi, Peyğamber de dahil olmaq üzre, iç
          kimseniñ Qur'annıñ ükümlerini deñiştirmege aqqı yoqtır).
        cid: 0
  - verse: 16
    segments:
      - text: >
          De ki: Eger Allah tilese edi, onı sizge oqumaz edim, Allah da onı sizge
          bildirmez edi. Men bundan evel bir ömür boyu arañızda turğan edim. Alâ aqıl
          iriştiralmaysıñızmı?
        cid: 0
  - verse: 17
    segments:
      - text: >
          Öyle ise, kim Allahqa qarşı yalan uydırğandan ya da onıñ ayetlerini
          yalanlağandan daa zalımdır! Bilesiñiz ki, suçlılar asla oñmazlar!
        cid: 0
  - verse: 18
    segments:
      - text: >
          Olar Allahnı bıraqıp, özlerine ne zarar, ne de fayda bere bilecek şeylerge
          tabınmaqtalar ve: Bular, Allah qatında bizim şefaatçılarımızdır, deyler. De ki:
          «Siz Allahqa köklerde ve yerde bilalmaycaq bir şeyini haber beresiñizmi? O,
          olarnıñ ortaq qoşqanlarından uzaq ve yücedir».
        cid: 0
  - verse: 19
    segments:
      - text: >
          İnsanlar sadece tek bir ümmet edi, soñradan ayrılıştılar. Eger (azapnıñ
          keçiktirilüvinen bağlı) Rabbiñden bir söz (ezeliy bir taqdir) keçmegen olsa edi,
          davalaşqan mevzularında aman aralarında üküm berilir edi (der'al azap ener ve
          işleri bitirilir edi).
        cid: 0
  - verse: 20
    segments:
      - text: >
          Oña (Muhammedge): Rabbiñden bir mucize endirilse ya! deyler. De ki: Ğayb ancaq
          Allahnıñdır. Bekleñ (baqayıq), men de siznen beraber beklegenlerdenim. (Kâfirler
          azap cınsından bir mucize istemekteler. Bunıñnen beraber, Enfaal suresiniñ
          32-nci ayetinde de: «YA Allah, eger bu Qur'an seniñ qatıñdan kelgen bir haq ise,
          başımızğa kökten taş yağdır!» şeklinde dua etkenleri bildirilmekte. Albuki, azap
          Allah qatındadır. O, istese, şu anda endirip, asiy qavmlarnı elâk eter, istese,
          keçiktirir).
        cid: 0
  - verse: 21
    segments:
      - text: >
          Özlerine toqunğan (qıtlıq ve hastalıq kibi) bir sıqıntıdan soñ, insanlarğa bir
          rahmet (amanlıq) tattırğan vaqtımızda, bir de baqarsıñ ki, ayetlerimiz aqqında
          olarnıñ bir tuzağı bardır. De ki: Allahnıñ tuzağı daa sur'atlıdır. Şübesiz,
          elçilerimiz qurğan tuzaqlarıñıznı yazmaqtalar. (Bu ayet mekkeliler aqqında nazil
          olğan. Rivayetke köre, Allah Taalâ yedi yıl Mekkege yağmur yağdırmadı. Kurğaqlıq
          sebebinden, qıtlıq ve hastalıq baş köterdi, bir çoq insan ve ayvan telef oldı.
          Niayet, Allah Taalâ bol yağmur yağdırdı, memleket yañıdan bolluq ve bereketke
          qavuştı. Faqat kâfirler bu rahmetni Allahtan degil, yıldızlardan ve putlardan
          diye bildiler ve Allahnıñ ayetlerini yalanlamağa devam ettiler).
        cid: 0
  - verse: 22
    segments:
      - text: >
          Sizni qarada ve deñizde kezdirgen Odır. Atta siz gemilerde bulunğan, o gemiler
          de içindekilerni tatlı bir rüzgârnen alıp yürgen ve (yolcular) bu sebepten
          neşelengen vaqıtlarında, o gemige şiddetli bir fırtına kelip çatar, er yerden
          olarğa dalğalar ücüm eter ve olarnıñ etrafları sarılğanını añlarlar da, dinni
          yalıñız Allahqa halis qılaraq: «Ant olsun, eger bizni bundan qurtarsañ, mıtlaqa
          şükür etkenlerden olacaqmız», diye Allahqa yalvarırlar.
        cid: 0
  - verse: 23
    segments:
      - text: >
          Faqat Allah olarnı qurtarğanınen, bir de baqarsıñ ki, olar kene aqsız yerde
          adden aşmaqtalar. Ey, insanlar! Siziñ adden aşuvıñız, ancaq öz aleyhiñizgedir;
          (bunıñnen) sadece faniy dünya ayatınıñ menfaatını elde etersiñiz; soñunda
          dönüşiñiz kene bizgedir. O zaman yapayatqanlarıñıznı haber berecekmiz.
        cid: 0
  - verse: 24
    segments:
      - text: >
          Dünya ayatınıñ vaziyeti, kökten endirgen bir suvımız kibidir ki, insanlarnıñ ve
          ayvanlarnıñ aşaycaqlarından olğan yer yüzü ekinleri o suv sayesinde gürlep,
          dallanıp öserler. Niayet, yer yüzü ziynetini taqınıp, (çeşit renkli) süslengen
          ve saipleri de onıñ üzerinde qudret saibi olğanlarını zan etken bir sırada, bir
          gece ya da kündüz oña emrimiz (afatımız) kelir de, onı sanki dün yerinde yoq
          kibi, tamırından qoparılaraq çalınğan bir alğa ketirirmiz. İşte, yahşı tüşünecek
          qavmlar içün ayetlerimizni böyle beyan etmektemiz.
        cid: 0
  - verse: 25
    segments:
      - text: >
          Allah qullarını esenlik yurtuna çağırmaqta ve O, tilegenini doğru yolğa
          qavuştırır. («Selâm yurtu»nıñ manası cennettir. Selâm, esenlik ve uzur olaraq da
          yorumlanğan. Çünki, cennette bulunğanlar er türlü hoşnutsızlıqtan uzaq, esenlik
          ve selâmetlik içindedirler. Cennetke «Selâm yurtu» denilüviniñ sebebi, o yerde
          bulunğanlarnen melekler arasında selâmlaşuvnıñ keniş darqağanındandır).
        cid: 0
  - verse: 26
    segments:
      - text: >
          Güzel davranğanlarğa daa güzel qarşılıq, bir de ziyadesi bardır. Olarnıñ
          yüzlerine ne bir toz (qara leke) bılaşır, ne de bir horluq (kelir). İşte, olar
          cennet ehlidirler. Ve olar o yerde ebediy qalacaqlar. (Ayette zikr etilgen
          «ihsan» Yüce Allahqa lâyıq ve rizasına muvafıq güzel iş yapmaq ve işlerni lâyıq
          olğan şekilde güzel yapmaq demektir. Peyğamberimiz ihsannı böyle tarif etken:
          «İhsan - Allah Taalâğa, onı körgen kibi, qullıq etüviñdir. Çünki, sen onı
          körmeseñ de, o seni körmektedir». İşte, böyle güzel iş, vazife, ibadet ve
          yahşılıqlar yapqanlarğa, yapqanlarından daa güzel olğan cennetler ve Allahnıñ
          lütfi olaraq, ziyade nimetler de berilecek).
        cid: 0
  - verse: 27
    segments:
      - text: >
          Fenalıq yapqanlarğa kelgende, fenalıqnıñ cezası aynı ölçünendir. Olarnı zillet
          qaplaycaq. Olarnı Allahqa qarşı qorçalaycaq iç kimse yoqtır. Olarnıñ yüzleri
          sanki qaranlıq geceden bir parçağa bürüngendir. İşte, olar da ceennem ehlidir.
          Olar o yerde ebediy qalacaqlar. (Yahşı işlerniñ savabı birge on, birge yedi yüz
          ve daa ziyade olaraq berilir ki, bu, Allah lütfiniñ neticesidir; fena işlerniñ
          cezası ise, yalıñız birge birdir. Bu da Allah adaletiniñ neticesidir).
        cid: 0
  - verse: 28
    segments:
      - text: >
          Olarnıñ episini bir yerge toplaycaqmız, soñra da, Allahqa ortaq qoşqanlarğa: Siz
          ve qoşqan ortaqlarıñız yeriñizde bekleñ», deycek künümiz artıq olarnıñ
          (putlarınen) aralarını tamamen ayırğandırmız. Ve olarnıñ ortaqları (putları)
          derler ki: Siz bizge ibadet etmey ediñiz.
        cid: 0
  - verse: 29
    segments:
      - text: >
          Bu sebepten, biznen siziñ arañızda şaat olaraq Allah yeterlidir. Şübesiz ki, biz
          siziñ (bizge) tabınuvıñızdan tamamen habersiz edik».
        cid: 0
  - verse: 30
    segments:
      - text: >
          O yerde er kes keçmişte yapqanlarını qarşısında bulır. Artıq olar aqiqiy
          saipleri olğan Allahqa döndürilgendirler. Uydurayatqan şeyleri (batıl tañrıları)
          da olarnı terk etip ğayıp olğandır.
        cid: 0
  - verse: 31
    segments:
      - text: >
          (Resulım!) De ki: Sizge kökten ve yerden kim rızıq bermekte? YA da qulaqlarğa ve
          közlerge kim malik (ve hakim) bulunmaqta? Ölüden tirini kim çıqara, tiriden
          ölüni kim çıqara? (Er türlü) işni kim idare ete? «Allah» deycekler. De ki: Öyle
          ise, (Oña asiy oluvdan) saqınmaysıñızmi? (İnsannıñ diger azalarınıñ aqiqiy
          maliki ve hakimi de Allah Taalâ olmaqnen beraber, ayette, hususen közler ve
          qulaqlar zikr etilgen. Çünki, bular insannıñ eñ müim bilgi ve idrak
          vastalarıdır; Allahnıñ yaratqan ve ayette işaret buyurğan rızıqlarından
          faydalanuvnıñ eñ müim vastalarıdır. İşte, bu degerli bilgi ve rızıq vastalarını
          yaratqan, idare etken, olarnıñ nasıl yolda qullanılğanını bilgen üstün qudret
          Allahtan başqa kim ola bilir?)
        cid: 0
  - verse: 32
    segments:
      - text: >
          İşte, O siziñ aqiqiy Rabbiñiz olğan Allahtır. Artıq haqtan (ayrılğandan) soñ,
          sapıqlıqtan başqa ne qalır? O olda, nasıl (sapıqlıqqa) döndürilesiñiz?
        cid: 0
  - verse: 33
    segments:
      - text: >
          İşte, böylece Rabbiñniñ yoldan çıqqanlar aqqındaki «Olar inanmazlar» sözü
          kerçekleşti.
        cid: 0
  - verse: 34
    segments:
      - text: >
          (Resulım!) De ki: (Allahqa) ortaq qoşqanlarıñız arasında, (birini yoq ekende)
          ilk defa yaratacaq, arqasından onı (ölüminden soñ ayatqa) yañıdan qaytaracaq
          birisi barmı? De ki: Allah ilk defa yaratıp, (ölümden soñ) onı yañıdan (ayatqa)
          qaytarır. O alda, nasıl saptırılırsıñız!
        cid: 0
  - verse: 35
    segments:
      - text: >
          De ki: Ortaq qoşqanlarıñızdan haqqa qavuştıracaq olğanı barmı? De ki: «Haqqa
          Allah qavuştırır». Öyle ise, haqqa qavuştırğan uyılmağa daa lâyıqmı; yoqsa,
          hidayet berilmegence öz-özüne doğru yolnı tapalmağanmı? Sizge ne ola? Nasıl
          (böyle yañlış) üküm etesiñiz?
        cid: 0
  - verse: 36
    segments:
      - text: >
          Olarnıñ çoqu zandan başqa bir şeyge uymaz. Şübesiz, zan - haqtan (ilimden) iç
          bir şeyniñ yerini tutmaz. Allah olarnıñ yapayatqanlarını pek yahşı bilicidir.
          (Bu ayette zanğa tabiy olğan müşrikler tenqit etilgeni kibi, musulmanlarnı da
          ilimge teşviq bar. Qadı Beydaviyge köre, bu ayet ilimni menbasından tahsil
          etüvniñ vacip olğanına, taqlit ve zan ile qanaatlenüvniñ caiz olmağanına
          delildir).
        cid: 0
  - verse: 37
    segments:
      - text: >
          Bu Qur'an Allahtan başqası tarafından uydırılğan bir şey degil. Ancaq, özünden
          evelkini doğrultıcı ve o Kitapnı añlatıcıdır. Onda şübe yoqtır, o alemlerniñ
          Rabbindendir.
        cid: 0
  - verse: 38
    segments:
      - text: >
          Yoqsa, onı (Muhammed) uydırdı deylermi? De ki: Eger sizler doğru iseñiz,
          Allahtan başqa, küçüñiz yetkenleriñizni çağırıñ da, (ep beraber), oña beñzegen
          bir sure ketiriñ.
        cid: 0
  - verse: 39
    segments:
      - text: >
          Aksine, olar ilmini qavramağanları ve yorumı özlerine asla kelmegen (Qur'annı)
          yalanladılar. Olardan evelkiler de böyle yalanlağan ediler. Şimdi baq,
          zalımlarnıñ soñu nasıl oldı!
        cid: 0
  - verse: 40
    segments:
      - text: >
          Aralarında öylesi bar ki, oña (Qur'anğa) inanır, kene olardan öylesi de bar ki,
          oña inanmaz. Rabbiñ bozğuncılarnı eñ yahşı bilicidir.
        cid: 0
  - verse: 41
    segments:
      - text: >
          (Resulım!) Olar seni yalanlasalar, de ki: Menim işim maña, siziñ işiñiz de,
          sizge aittir. Siz menim yapqanımdan uzaqsıñız, men de siziñ yapqanıñızdan
          uzaqım. (Qur'an-ı Kerimde çeşit vesilelernen ifade buyurılğanı kibi,
          Az.Peyğamberniñ vazifesi tebliğden ibarettir; O sadece müjdeleyici ve
          tenbiyeleyicidir. İnsanlarnıñ inanuvını temin etmek onıñ elinde degil, çünki,
          hidayet Allahtandır. Bu sebeplernen, Az. Peyğamber kendi aleminden ve tebliğ
          vazifesinden mesuldir. Tenbiyelenüvlerine ve haqqa çağırıluvlarına rağmen, iman
