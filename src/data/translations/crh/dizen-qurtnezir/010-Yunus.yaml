          (Resulım!) Eger saña endirgenimizden (bu añlatqan vaqialardan) şübelenseñ,
          senden evel Kitapnı (Tevratnı) oquğanlardan sora. Ant olsun ki, Rabbiñden saña
          haq kelgendir. Saqın şübecilerden olma!
        cid: 0
  - verse: 95
    segments:
      - text: >
          Allahnıñ ayetlerini yalanğa çıqarğanlardan da olma, soñra ziyanğa oğrağanlardan
          olursıñ.
        cid: 0
  - verse: 96
    segments:
      - text: >
          Aqiqaten, aqlarında Rabbiniñ sözü (ükmi) sabit olğanlar, özlerine (istegen)
          bütün mucizeler kelgen olsa bile, elem berici azapnı körgenge qadar
          inanmaycaqlar.
        cid: 0
  - verse: 97
    segments:
      - text: >
          [96 ayetine baq.]
        cid: 0
  - verse: 98
    segments:
      - text: >
          Yunusnıñ qavmı istisna, (halqını yoq etken ülkelerimizden) er angi bir ülke
          halqı, keşke (özlerine azap kelmeden) iman etse de, bu imanları özlerine fayda
          berse edi! Yunusnıñ qavmı iman etkeninen, özlerinden dünya ayatındaki rezillik
          azabını ortadan qaldırdıq ve olarnı bir müddet (dünya nimetlerinden)
          faydalandırdıq. (Yunus Peyğambernıñ qavmı onı inkâr etkeninen, qızaraq,
          aralarından ayırıldı. Qavmı o haber bergen azapnıñ kelecegini is etti, aman
          yapqanlarına peşman oldı ve azapnıñ kelmemesi içün, Allahqa yalvardı. Cenab-ı
          Allah da olarnı azaptan qurtardı).
        cid: 0
  - verse: 99
    segments:
      - text: >
          (Resulım!) Eger Rabbiñ istese edi, yer yüzündekilerniñ episi, elbette iman eter
          ediler. O alda, sen inanuvları içün insanlarnı zorlaycaqsıñmı?
        cid: 0
  - verse: 100
    segments:
      - text: >
          Allahnıñ izni olmadan, iç kimse inanamaz. O, aqıllarını qulanmağanlarnı murdar
          (inkârcı) yapar.
        cid: 0
  - verse: 101
    segments:
      - text: >
          De ki: «Köklerde ve yerde neler bar, baqıñ (da ibret alıñ!)». Faqat inanmağan
          bir toplumğa deliller ve tenbiyeler fayda bermez.
        cid: 0
  - verse: 102
    segments:
      - text: >
          Olar özlerinden evel kelip-keçken toplumlarnıñ (elemli) künleriniñ
          beñzegenlerinden başqasını beklemektelermi? De ki: Aydı, bekleñ! Şübesiz, men de
          siznen beraber beklegenlerdenim.
        cid: 0
  - verse: 103
    segments:
      - text: >
          Biz soñra peyğamberimizni ve aynı şekilde iman etkenlerni qurtarırmız.
          İnanğanlarnı, üzerimizge bir borc olaraq, qurtaracaqmız.
        cid: 0
  - verse: 104
    segments:
      - text: >
          De ki: «Ey, insanlar! Menim dinimden şübede iseñiz, (biliñ ki) men Allahnı
          bıraqıp da, siziñ tabınğanlarıñızğa tabınmam, faqat, ancaq sizni öldürecek olğan
          Allahqa qullıq eterim. Maña mü'minlerden oluvım emir olundı».
        cid: 0
  - verse: 105
    segments:
      - text: >
          «Ve (maña) hanif (Allahnıñ birligini tanıyıcı) olaraq, yüzüñni dinge çevir;
          saqın müşriklerden olma, diye (emir etildi)».
        cid: 0
  - verse: 106
    segments:
      - text: >
          Allahnı bıraqıp da, saña fayda ya da zarar bermeycek şeylerge tabınma. Eger bunı
          yapsañ, o taqdirde, sen mıtlaqa zalımlardan olursıñ.
        cid: 0
  - verse: 107
    segments:
      - text: >
          Eger Allah saña bir zarar toqundırsa, onı kene Ondan başqa ketkizecek yoqtır.
          Eger saña bir hayır tilese, Onıñ keremini keri çevirecek de yoqtır. O, hayırını
          qullarından istegenine iriştirir. Ve O, bağışlayıcıdır,merhamet eticidir.
        cid: 0
  - verse: 108
    segments:
      - text: >
          De ki: Ey, insanlar! Sizge Rabbiñizden haq (Qur'an) kelgen. Artıq kim doğru
          yolğa kelse, ancaq özü içün kelecek. Kim de yoldan çıqsa, o da ancaq öz aleyhine
          doğru yoldan çıqacaq. Men siziñ üzeriñizge vekil degilim. (Sadece tebliğ etmekle
          memurım).
        cid: 0
  - verse: 109
    segments:
      - text: >
          (Resulım!) Sen, saña vahiy olunğanğa uy ve Allah üküm etkenge qadar sabır et. O,
          hakimlerniñ eñ hayırlısıdır.
        cid: 0
