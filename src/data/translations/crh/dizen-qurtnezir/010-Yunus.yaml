      - text: "Eger Allaһ saña bir zarar toqundırsa, onı kene Ondan başqa ketkizecek yoqtır. Eger saña bir hayır tilese, Onıñ keremini keri çevirecek de yoqtır. O, hayırını qullarından istegenine iriştirir. Ve O, bağışlayıcıdır,merhamet eticidir."
        cid: 0
  - verse: 108
    segments:
      - text: "De ki: Ey, insanlar! Sizge Rabbiñizden haq (Qur’an) kelgen. Artıq kim doğru yolğa kelse, ancaq ozü içün kelecek. Kim de yoldan çıqsa, o da ancaq oz aleyhine doğru yoldan çıqacaq. Men siziñ uzeriñizge vekil degilim. (Sadece tebliğ etmekle memurım)."
        cid: 0
  - verse: 109
    segments:
      - text: "(Resulım!) Sen, saña vahiy olunğanğa uy ve Allaһ uküm etkenge qadar sabır et. O, hakimlerniñ eñ hayırlısıdır."
        cid: 0