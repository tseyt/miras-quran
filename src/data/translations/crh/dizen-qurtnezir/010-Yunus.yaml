surah_id: 10
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "Elif. Lâam. Raa. İşte, bular ikmet tolu Kitapnıñ ayetleridir."
        cid: 0
  - verse: 2
    segments:
      - text: "Aralarından bir adamğa: İnsanlarnı tenbiyele ve iman etkenlerge, Rableri qatında olar içün yuksek bir doğrulıq maqamı olğanını mujdele, diye vahiy etüvimiz, insanlar içün şaşılacaq bir şey oldımı ki, o kâfirler: Bu, elbette ap-açıq bir sihirbazdır, dediler?"
        cid: 0
  - verse: 3
    segments:
      - text: "Şubesiz ki, Rabbiñiz koklerni ve yerni altı kunde yaratqan, soñra da işlerni yerliyerince idare eterek, arşqa hakim olğan Allaһtır. Onıñ izni olmadan, iç kimse şefaatçı olalmaz. İşte, O, Rabbiñiz Allaһtır. O alda Oña qullıq etiñ. Alâ tüşünmeysiñizmi! (Koklerniñ ve yerniñ altı kunde yaratıluvı ve Allaһnıñ Arşqa hakimligi hususındaki añlatuvlar içün A’raaf suresiniñ 54-nci ayeti izaatına baqıñ)."
        cid: 0
  - verse: 4
    segments:
      - text: "Allaһnıñ kerçek bir vadesi olaraq, epiñizniñ dönüşiñiz ancaq Oñadır. Çünki, O, mahlüqatnı evelâ (öqtan) yaratır, soñra da iman etip, yahşı işler yapqanlarğa adaletnen mukâfat bermek içün (olarnı uzurına) keri çevirir. Kâfir olğanlarğa kelgende, inkâr etmekte olğan şeylerinden otrü, olar içün qaynap turğan suvdan bir içki ve elem berici bir azap bardır."
        cid: 0
  - verse: 5
    segments:
      - text: "Kuneşni ışıqlı, aynı da parlaq yapqan, yıllarnıñ sayısını ve esabını bilüviñiz içün oña (ayğa) bir taqım menziller taqdir etken Odır. Allaһ bularnı, ancaq bir aqiqatqa (ve ikmetke) binaen yaratqan. O, bilgen bir qavmğa ayetlerini beyan etmekte."
        cid: 0
  - verse: 6
    segments:
      - text: "Gece ve kundüzniñ deñişüvinde (uzayıp-qısqaruvında) Allaһnıñ koklerde ve yerde yaratqan şeylerinde, (Onı inkâr etmekten) saqınğan bir qavm içün, elbette nice deliller bardır!"
        cid: 0
  - verse: 9
    segments:
      - text: "İman etip, guzel işler yapqanlarğa kelgende, imanları sebebinen, Rabbleri olarnı nimet tolu cennetlerde alt tarafından irmaqlar aqqan (saraylarğa) iriştirir."
        cid: 0
  - verse: 10
    segments:
      - text: "Olarnıñ o yerdeki duası: «Allaһım! Seni noqsan sıfatlardan uzaq tutarmız!» (sözleridir). O yerde bir-birilerinen qarşılaşqanda söylegenleri ise, «selâm»dır. Olarnıñ dualarınıñ soñu da şudır: Hamd alemlerniñ Rabbi Allaһqa mahsustır."
        cid: 0
  - verse: 11
    segments:
      - text: "Eger Allaһ insanlarğa hayırnı çar-çabuk istegenleri kibi, şerrni de acele berse edi, elbette olarnıñ ecelleri bitirilgen olur edi. Faqat bizge qavuşmaqnı beklemegenlerni biz yoldan azğanları alda, bocalağan bir şekilde (oz başlarına) bıraqırmız. (Rivayetke kore, Nadr b. Haaris kibi bir taqım muşrikler Resulullahnıñ peyğamberligini inkâr etkenler ve: «Ya Allaһ, eger Muһammedniñ Peyğamberligi doğru ise, aman kokten ustümizge taş yağdır ya da bizge ağır bir azap ketir!» degen ediler. Bunıñ uzerine, yuqarıdaki ayet endi. Demek ki, Allaһ Taalâ tilese, qullarını işlegen gunahları sebebinden, aman cezalandırmaz; belki tövbe eter, peşman olur ve haqqa dönerler diye, cezalarını keçiktirir. Tövbe etmegenlerge de ozleri oçün taqdir etilgen belli bir muddetkece muhlet berir, bu muddet soñunda olarnıñ cezasını ya dünyada olğanda berir, ya da ahiretke qaldırır)."
        cid: 0
  - verse: 12
    segments:
      - text: "İnsanğa bir zarar kelgen vaqıtta, yan yataraq, oturaraq, ya da ayaqta turaraq (o zararnıñ yoq oluvı içün) bizge dua eter; Faqat biz onı sıqıntısından qurtarğanımıznen, sanki ozüne toqunğan bir sıqıntıdan otrü, bizge dua etmegen kibi keçip keter. İşte, boylece, adden aşqanlarğa yapayatqan şeyleri guzel kosterildi. (Allaһ Taalâ bu ayette insannıız belâ ve musibetler qarşısındaki ve bularnıız ortadan qaldırıluvından soñki areket ve davranışlarnı koz ogüne sermekte. Yahşı insanğa yaraşqanı, ister sıqıntılı allarda, ister ferahl anlarında, daima Allaһnı añmaq ve Oña dua etmektir. Sadece, musibet anında Allaһnı añıp, ferah anında unutmaq, inançı ve iradesi zayıf, nefsaniy ve addiy isteklerniñ qarşısında ezilgen ve yeñilgen acizlerniñ areketidir)."
        cid: 0
  - verse: 13
    segments:
      - text: "Ant olsun ki, sizden evel, Peyğamberleri ozlerine mucizeler ketirgeni alda, (yalanlap) zulım etkenleri tolayı, nice milletlerni elâk ettik; zaten, olar iman etecek degil ediler. İşte, biz suçlı qavmlarnı boyle cezalandırırmız."
        cid: 0
  - verse: 14
    segments:
      - text: "Soñra da nasıl davranacağıñıznı korüvimiz içün, olarnıñ artından sizni yer yuzünde halifeler yaptıq (olarnıñ yerine sizni ketirdik)."
        cid: 0
  - verse: 15
    segments:
      - text: "Olarğa ayetlerimiz açıq-açıq oqulğan vaqıtta (olgenden soñ), bizge qavuşmaqnı beklemegenler: Ya bundan başqa bir Qur’an ketir, ya da bunı deñiştir! dediler. De ki: Onı ozlügimden deñiştirmem, men içün olacaq şey degil. Men, maña vahiy olunğandan başqasına uymam. Çünki, Rabbime isyan etsem, elbette buyuk kunniñ azabından qorqarım. (Zamanımızda olğanı kibi, Qur’an-ı Kerim engen devrinde de, oz qafalarına kore din istegenler ya da Allaһnıñ ukümleriniñ oz arzu ve aveslerine kore deñiştirilüvini istegenler olğan. Albuki, Qur’an belli devirlerdeki insanlarnıñ keçici ve deñişici arzularını qarşılamaq içün degil, qıyametke qadar butün insanlıqnıñ ruhiy, ahlâqiy ve maneviy itiyacalarını qarşılamaq, dünyaviy ve uhreviy seadetniñ yolunı kostermek içün endirilgen. Bu sebeplerden ki, ayette bildirilgeni kibi, Peyğamber de dahil olmaq uzre, iç kimseniñ Qur’annıñ ukümlerini deñiştirmege aqqı yoqtır)."
        cid: 0
  - verse: 16
    segments:
      - text: "De ki: Eger Allaһ tilese edi, onı sizge oqumaz edim, Allaһ da onı sizge bildirmez edi. Men bundan evel bir omür boyu arañızda turğan edim. Alâ aqıl iriştiralmaysıñızmı?"
        cid: 0
  - verse: 17
    segments:
      - text: "Oyle ise, kim Allaһqa qarşı yalan uydırğandan ya da onıñ ayetlerini yalanlağandan daa zalımdır! Bilesiñiz ki, suçlılar asla oñmazlar!"
        cid: 0
  - verse: 18
    segments:
      - text: "Olar Allaһnı bıraqıp, ozlerine ne zarar, ne de fayda bere bilecek şeylerge tabınmaqtalar ve: Bular, Allaһ qatında bizim şefaatçılarımızdır, deyler. De ki: «Siz Allaһqa koklerde ve yerde bilalmaycaq bir şeyini haber beresiñizmi? O, olarnıñ ortaq qoşqanlarından uzaq ve yucedir»."
        cid: 0
  - verse: 19
    segments:
      - text: "İnsanlar sadece tek bir ummet edi, soñradan ayrılıştılar. Eger (azapnıñ keçiktirilüvinen bağlı) Rabbiñden bir söz (ezeliy bir taqdir) keçmegen olsa edi, davalaşqan mevzularında aman aralarında uküm berilir edi (der’al azap ener ve işleri bitirilir edi)."
        cid: 0
  - verse: 20
    segments:
      - text: "Oña (Muһammedge): Rabbiñden bir mucize endirilse ya! deyler. De ki: Ğayb ancaq Allaһnıñdır. Bekleñ (baqayıq), men de siznen beraber beklegenlerdenim. (Kâfirler azap cıinsından bir mucize istemekteler. Bunıñnen beraber, Enfaal suresiniñ 32-nci ayetinde de: «Ya Allaһ, eger bu Qur’an seniñ qatıñdan kelgen bir haq ise, başımızğa kokten taş yağdır!» şeklinde dua etkenleri bildirilmekte. Albuki, azap Allaһ qatındadır. O, istese, şu anda endirip, asiy qavmlarnı elâk eter, istese, keçiktirir."
        cid: 0
  - verse: 21
    segments:
      - text: "Ozlerine toqunğan (qıtlıq ve hastalıq kibi) bir sıqıntıdan soñ, insanlarğa bir rahmet (amanlıq) tattırğan vaqtımızda, bir de baqarsıñ ki, ayetlerimiz aqqında olarnıñ bir tuzağı bardır. De ki: Allaһnıñ tuzağı daa sur’atlıdır. Şubesiz, elçilerimiz qurğan tuzaqlarıñıznı yazmaqtalar. (Bu ayet mekkeliler aqqında nazil olğan. Rivayetke kore, Allaһ Taalâ yedi yıl Mekkege yağmur yağdırmadı. Kurğaqlıq sebebinden, qıtlıq ve hastalıq baş koterdi, bir çoq insan ve ayvan telef oldı. Niayet, Allaһ Taalâ bol yağmur yağdırdı, memleket yañıdan bolluq ve bereketke qavuştı. Faqat kâfirler bu rahmetni Allaһtan degil, yıldızlardan ve putlardan diye bildiler ve Allaһnıñ ayetlerini yalanlamağa devam ettiler)."
        cid: 0
  - verse: 22
    segments:
      - text: "Sizni qarada ve deñizde kezdirgen Odır. Atta siz gemilerde bulunğan, o gemiler de içindekilerni tatlı bir ruzgârnen alıp yurgen ve (ölcular) bu sebepten neşelengen vaqıtlarında, o gemige şiddetli bir fırtına kelip çatar, er yerden olarğa dalğalar ucüm eter ve olarnıñ etrafları sarılğanını añlarlar da, dinni yalıñız Allaһqa halis qılaraq: «Ant olsun, eger bizni bundan qurtarsañ, mıtlaqa şukür etkenlerden olacaqmız», diye Allaһqa yalvarırlar."
        cid: 0
  - verse: 23
    segments:
      - text: "Faqat Allaһ olarnı qurtarğanınen, bir de baqarsıñ ki, olar kene aqsız yerde adden aşmaqtalar. Ey, insanlar! Siziñ adden aşuvıñız, ancaq oz aleyhiñizgedir; (bunıñnen) sadece faniy dünya ayatınıñ menfaatını elde etersiñiz; soñunda dönüşiñiz kene bizgedir. O zaman yapayatqanlarıñıznı haber berecekmiz."
        cid: 0
  - verse: 24
    segments:
      - text: "Dünya ayatınıñ vaziyeti, kokten endirgen bir suvımız kibidir ki, insanlarnıñ ve ayvanlarnıñ aşaycaqlarından olğan yer yuzü ekinleri o suv sayesinde gurlep, dallanıp oserler. Niayet, yer yuzü ziynetini taqınıp, (çeşit renkli) süslengen ve saipleri de onıñ uzerinde qudret saibi olğanlarını zan etken bir sırada, bir gece ya da kundüz oña emrimiz (afatımız) kelir de, onı sanki dün yerinde yoq kibi, tamırından qoparılaraq çalınğan bir alğa ketirirmiz. İşte, yahşı tüşünecek qavmlar içün ayetlerimizni boyle beyan etmektemiz."
        cid: 0
  - verse: 25
    segments:
      - text: "Allaһ qullarını esenlik yurtuna çağırmaqta ve O, tilegenini doğru yolğa qavuştırır. («Selâm yurtu»nıñ manası cennettir. Selâm, esenlik ve uzur olaraq da yorumlanğan. Çünki, cennette bulunğanlar er türlü hoşnutsızlıqtan uzaq, esenlik ve selâmetlik içindedirler. Cennetke «Selâm yurtu» denilüviniñ sebebi, o yerde bulunğanlarnen melekler arasında selâmlaşuvnıñ keniş darqağanındandır)."
        cid: 0
  - verse: 26
    segments:
      - text: "Guzel davranğanlarğa daa guzel qarşılıq, bir de ziyadesi bardır. Olarnıñ yuzlerine ne bir toz (qara leke) bılaşır, ne de bir horluq (kelir). İşte, olar cennet ehlidirler. Ve olar o yerde ebediy qalacaqlar. (Ayette zikr etilgen «ihsan» Yuce Allaһqa lâyıq ve rizasına muvafıq guzel iş yapmaq ve işlerni lâyıq olğan şekilde guzel yapmaq demektir. Peyğamberimiz ihsannı boyle tarif etken: «İhsan - Allaһ Taalâğa, onı korgen kibi, qullıq etüviñdir. Çünki, sen onı kormeseñ de, o seni kormektedir». İşte, boyle guzel iş, vazife, ibadet ve yahşılıqlar yapqanlarğa, yapqanlarından daa guzel olğan cennetler ve Allaһnıñ lütfi olaraq, ziyade nimetler de berilecek)."
        cid: 0
  - verse: 27
    segments:
      - text: "Fenalıq yapqanlarğa kelgende, fenalıqnıñ cezası aynı olçünendir. Olarnı zillet qaplaycaq. Olarnı Allaһqa qarşı qorçalaycaq iç kimse yoqtır. Olarnıñ yuzleri sanki qaranlıq geceden bir parçağa burüngendir. İşte, olar da ceennem ehlidir. Olar o yerde ebediy qalacaqlar. (Yahşı işlerniñ savabı birge on, birge yedi yuz ve daa ziyade olaraq berilir ki, bu, Allaһ lütfiniñ neticesidir; fena işlerniñ cezasıi ise, yalıñız birge birdir. Bu da Allaһ adaletiniñ neticesidir)."
        cid: 0
  - verse: 28
    segments:
      - text: "Olarnıñ episini bir yerge toplaycaqmız, soñra da, Allaһqa ortaq qoşqanlarğa: Siz ve qoşqan ortaqlarıñız yeriñizde bekleñ», deycek kunümiz artıq olarnıñ (putlarınen) aralarını tamamen ayırğandırmız. Ve olarnıñ ortaqları (putları) derler ki: Siz bizge ibadet etmey ediñiz."
        cid: 0
  - verse: 29
    segments:
      - text: "Bu sebepten, biznen siziñ arañızda şaat olaraq Allaһ yeterlidir. Şubesiz ki, biz siziñ (bizge) tabınuvıñızdan tamamen habersiz edik»."
        cid: 0
  - verse: 30
    segments:
      - text: "O yerde er kes keçmişte yapqanlarını qarşısında bulır. Artıq olar aqiqiy saipleri olğan Allaһqa döndürilgendirler. Uydurayatqan şeyleri (batıl tañrıları) da olarnı terk etip ğayıp olğandır."
        cid: 0
  - verse: 31
    segments:
      - text: "(Resulım!) De ki: Sizge kokten ve yerden kim rızıq bermekte? Ya da qulaqlarğa ve kozlerge kim malik (ve hakim) buluimaqta? Olüden tirini kim çıqara, tiriden olüni kim çıqara? (Er türlü) işni kim idare ete? «Allaһ» deycekler. De ki: Oyle ise, (Oña asiy oluvdan) saqınmaysıñızmi? (İnsannıı diger azalarınıı aqiqiy maliki ve hakimi de Allaһ Taalâ olmaqnen beraber, ayette, hususen kozler ve qulaqlar zikr etilgen. Çünki, bular insannıı eñ muim bilgi ve idrak vastalarıdır; Allaһnıı yaratqan ve ayette işaret buyurğan rızıqlarından faydalanuvnıı eñ muim vastalarıdır. İite, bu degerli bilgi ve rızıq vastalarını yaratqan, idare etken, olarnıı nasıl yolda qullanılğanını bilgen ustün qudret Allaһtan başqa kim ola bilir?)"
        cid: 0
  - verse: 32
    segments:
      - text: "İşte, O siziñ aqiqiy Rabbiñiz olğan Allaһtır. Artıq haqtan (ayrılğandan) soñ, sapıqlıqtan başqa ne qalır? O olda, nasıl (sapıqlıqqa) döndürilesiñiz?"
        cid: 0
  - verse: 33
    segments:
      - text: "İşte, boylece Rabbiñniñ yoldan çıqqanlar aqqındaki «Olar inanmazlar» sözü kerçekleşti."
        cid: 0
  - verse: 34
    segments:
      - text: "(Resulım!) De ki: (Allaһqa) ortaq qoşqanlarıñız arasında, (birini yoq ekende) ilk defa yaratacaq, arqasından onı (olüminden soñ ayatqa) yañıdan qaytaracaq birisi barmı? De ki: Allaһ ilk defa yaratıp, (olümden soñ) onı yañıdan (ayatqa) qaytarır. O alda, nasıl saptırılırsıñız!"
        cid: 0
  - verse: 35
    segments:
      - text: "De ki: Ortaq qoşqanlarıñızdan haqqa qavuştıracaq olğanı barmı? De ki: «Haqqa Allaһ qavuştırır». Oyle ise, haqqa qavuştırğan uyılmağa daa lâyıqmı; yoqsa, hidayet berilmegence oz-ozüne doğru yolnı tapalmağanmı? Sizge ne ola? Nasıl (boyle yañlış) uküm etesiñiz?"
        cid: 0
  - verse: 36
    segments:
      - text: "Olarnıñ çoqu zandan başqa bir şeyge uymaz. Şubesiz, zan - haqtan (ilimden) iç bir şeyniñ yerini tutmaz. Allaһ olarnıñ yapayatqanlarını pek yahşı bilicidir. (Bu ayette zanğa tabiy olğan muşrikler tenqit etilgeni kibi, musulmanlarnı da ilimge teşviq bar. Qadı Beydaviyge kore, bu ayet ilimni menbasından tahsil etüvniñ vacip olğanına, taqlit ve zan ile qanaatlenüvniñ caiz olmağanına delildir)."
        cid: 0
  - verse: 37
    segments:
      - text: "Bu Qur’an Allaһtan başqası tarafından uydırılğan bir şey degil. Ancaq, ozünden evelkini doğrultıcı ve o Kitapnı añlatıcıdır. Onda şube yoqtır, o alemlerniñ Rabbindendir."
        cid: 0
  - verse: 38
    segments:
      - text: "Yoqsa, onı (Muһammed) uydırdı deylermi? De ki: Eger sizler doğru iseñiz, Allaһtan başqa, kuçüñiz yetkenleriñizni çağırıñ da, (ep beraber), oña beñzegen bir sure ketiriñ."
        cid: 0
  - verse: 39
    segments:
      - text: "Aksine, olar ilmini qavramağanları ve yorumı ozlerine asla kelmegen (Qur’annı) yalanladılar. Olardan evelkiler de boyle yalanlağan ediler. Şimdi baq, zalımlarnıñ soñu nasıl oldı!"
        cid: 0
  - verse: 40
    segments:
      - text: "Aralarında oylesi bar ki, oña (Qur’anğa) inanır, kene olardan oylesi de bar ki, oña inanmaz. Rabbiñ bozğuncılarnı eñ yahşı bilicidir."
        cid: 0
  - verse: 41
    segments:
      - text: "(Resulım!) Olar seni yalanlasalar, de ki: Menim işim maña, siziñ işiñiz de, sizge aittir. Siz menim yapqanımdan uzaqsıñız, men de siziñ yapqanıñızdan uzaqım. (Qur’an-ı Kerimde çeşit vesilelernen ifade buyurılğanı kibi, Az.Peyğamberniñ vazifesi tebliğden ibarettir; O sadece mujdeleyici ve tenbiyeleyicidir. İnsanlarnıñ inanuvını temin etmek onıñ elinde degil, çünki, hidayet Allaһtandır. Bu sebeplernen, Az. Peyğamber kendi aleminden ve tebliğ vazifesinden mesuldir. Tenbiyelenüvlerine ve haqqa çağırıluvlarına rağmen, iman etmegenlerniñ mesuliyeti ise, sadece ozlerine ait olup, Peyğamber bundan mesul degildir)."
        cid: 0
  - verse: 42
    segments:
      - text: "Olardan seni diñlegenler bardır. Faqat sağırlarğa -bunıñ ustüne aqılları da irmey ise- sen eşittireceksiñmi?"
        cid: 0
  - verse: 43
    segments:
      - text: "Olardan saña baqqan da bardır. Faqat -alâ (aqiqatnı) kormey iseler- korlerni sen doğru yolğa qavuştıracaqsıñmı?"
        cid: 0
  - verse: 44
    segments:
      - text: "Şubesiz ki, Allaһ insanlarğa iç bir şekilde zulum etmez, faqat insanlar ozlerine zulum eterler. (Allaһ insanlarğa aqiqatnı tapuvları ve inanuvları içün yaratılıştan qabiliyetler bergen ve peyğamberler de yollağan. Bu alda, Allaһ olarnıñ sezüv, añlav ve qavrav melekelerini ellerinden çekip alğanı içün degil, olar iradelerini yamanlıqqa qullanğanları içün, haq yoldan çıqqan, peyğamberni qabul etmegen ve cezağa lâyıq olğanlar, tolayısınen oz-ozlerine zulum etkendirler)."
        cid: 0
  - verse: 45
    segments:
      - text: "Allaһnıñ olarnı sanki kunniñ ancaq bir saatı qadar qalğanlarını zan etken vaziyette yañıdan tiriltip, toplaycaq kunü aralarında bir-birilerinen tanışırlar. Allaһnıñ uzurına barmaqnı yalanğa çıqarğanlar, elbette zararğa oğrağandırlar. Zira, olar doğru yolğa yurmegen ediler."
        cid: 0
