surah_id: 83
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "İnsanlardan alğanda olçep- tartqanlarında tam, olarğa bermek içün olçeptartqanlarında ise, eksik tutqan iylekârlarğa yazıqlar oslun!"
        cid: 0
  - verse: 4
    segments:
      - text: "Olar tüşünmezlermi ki, buyuk bir kunde (esap bermek içün) tiriltilecekler! Oyle bir kun ki, insanlar o kunde alemlerniñ Rabbi uzurında tik turacaqlar. (İbn Umer bu sureni oquğanda, altıncı ayetke kelgeninen, okür-okür ağlağan. Bir bedeviy de Abdullah b. Mervanğa: «Allaһnıñ olçü ve çekisinde iyle yapqanlar aqqında ne söylegenini bilgeniñ alda, musulmanlarnıñ malını olçüsiz, çekisiz ve zahmetsiz almaqta devam etesiñ!» degen edi)."
        cid: 0
  - verse: 7
    segments:
      - text: "Doğrusı, gunahkârlırnıñ yazısı, muaqqaq Sicciinde olmaqtır."
        cid: 0
  - verse: 8
    segments:
      - text: "Secciin nedir, bilesiñmi? (Tefsirlerde Sicciinge çeşit manalar berilgen: a). Ziyade tar bir zindan; b). Ceennemde bir quyu; v). Kâfirlerniñ amelleri yazılğan kitap; g). Ya da insanlarnen cinlerniñ amelleri qayd etilgen defter)."
        cid: 0
  - verse: 9
    segments:
      - text: "(O gunahkârlarnıñ yazısı) ameller sayılıp yazılğan bir kitaptır."
        cid: 0
  - verse: 10
    segments:
      - text: "O kunü yalancılarnıñ alına vay!"
        cid: 0
  - verse: 11
    segments:
      - text: "Ki olar, ceza kunüni yalan sayarlar."
        cid: 0
  - verse: 12
    segments:
      - text: "Onı yalıñız ukümlerni taptağan ve gunahqa batqan kimseler yalan der."
        cid: 0
  - verse: 13
    segments:
      - text: "Boyle birisine ayetlerimiz oqulğanınen: «Eskilerniñ masalları», der edi."
        cid: 0
  - verse: 14
    segments:
      - text: "Yoq! Aksine, olarnıñ yapmaqta olğan (yamanlıqları) qalplerini kirletkendir."
        cid: 0
  - verse: 15
    segments:
      - text: "Yoq! Olar, şubesiz, o kunü Rabblerinden (Onı korüvden) mahrum qalğanlardıң. (Tefsircilerniñ çoqu ve Ehl-i Sunnet kelâm alimleri bu ayetni, ahirette mu’minler Allaһnı koreceklerine delil sayğanlar)."
        cid: 0
  - verse: 16
    segments:
      - text: "Soñ olar ceennemge kirerler."
        cid: 0
  - verse: 17
    segments:
      - text: "Soñ olarğa: «İşte, yalanlağanıñız (ceennem) budır», denilir."
        cid: 0
  - verse: 18
    segments:
      - text: "Yoq! Ant olsun, yahşılarnıñ kitabı İlliyundadır."
        cid: 0
  - verse: 19
    segments:
      - text: "İlliyun nedir bilesiñmi?"
        cid: 0
  - verse: 20
    segments:
      - text: "(O İlliyundaki kitap) İçinde ameller qayd etilgen bir kitaptır."
        cid: 0
  - verse: 21
    segments:
      - text: "O kitapnı, Allaһqa yaqın olğanlar korerler."
        cid: 0
  - verse: 22
    segments:
      - text: "Yahşılar kesen-kes cennettedirler."
        cid: 0
  - verse: 23
    segments:
      - text: "Olar o yerde kursiler uzerinde etrafqa baqarlar."
        cid: 0
  - verse: 24
    segments:
      - text: "Olarnıñ yuzünde nimetlerniñ sevinçini korersiñ."
        cid: 0
  - verse: 25
    segments:
      - text: "Olarğa muurli halis bir içki taqdim etilir."
        cid: 0
  - verse: 26
    segments:
      - text: "Onıñ içimi soñunda mis qoqusı bardır. İşte, yarışqanlar ancaq onda yarışsınlar."
        cid: 0
  - verse: 27
    segments:
      - text: "Qarışması Tesniimdendir."
        cid: 0
  - verse: 28
    segments:
      - text: "(O Tesniim Allaһqa) Yaqın olğanlar içecek bir çoqraqtır."
        cid: 0
  - verse: 29
    segments:
      - text: "Şubesiz, gunahkârlar (dünyada) iman etkenlerge kuler ediler."
        cid: 0
  - verse: 30
    segments:
      - text: "Olarnen rastkelişkende qaş-koz oynatıp, alay ete ediler."
        cid: 0
  - verse: 31
    segments:
      - text: "Ailelerine qaytqanlarında, (alayları sebebinden) keyflenerek döne ediler."
        cid: 0
  - verse: 32
    segments:
      - text: "Mu’minlerni korgende: «Şubesiz, bular sapqan», der ediler."
        cid: 0
  - verse: 33
    segments:
      - text: "Albuki, olar mu’minlerni kozetici olaraq yollanılmadılar."
        cid: 0
  - verse: 34
    segments:
      - text: "İşte, o kunü (ahirette) de iman etkenler kâfirlerge kulerler."
        cid: 0
  - verse: 35
    segments:
      - text: "Kursiler uzerinde etrafqa baqarlar."
        cid: 0
  - verse: 36
    segments:
      - text: "Kâfirler yapqanlarınıñ cezasını taptılarmı? (Elbette taptılar)."
        cid: 0