surah_id: 83
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >
          İnsanlardan alğanda ölçep- tartqanlarında tam, olarğa bermek içün
          ölçep-tartqanlarında ise, eksik tutqan iylekârlarğa yazıqlar oslun!
        cid: 0
  - verse: 2
    segments:
      - text: >
          [1 ayetine baq.]
        cid: 0
  - verse: 3
    segments:
      - text: >
          [1 ayetine baq.]
        cid: 0
  - verse: 4
    segments:
      - text: >
          Olar tüşünmezlermi ki, büyük bir künde (esap bermek içün) tiriltilecekler! Öyle
          bir kün ki, insanlar o künde alemlerniñ Rabbi uzurında tik turacaqlar. (İbn Umer
          bu sureni oquğanda, altıncı ayetke kelgeninen, ökür-ökür ağlağan. Bir bedeviy de
          Abdullah b. Mervanğa: «Allahnıñ ölçü ve çekisinde iyle yapqanlar aqqında ne
          söylegenini bilgeniñ alda, musulmanlarnıñ malını ölçüsiz, çekisiz ve zahmetsiz
          almaqta devam etesiñ!» degen edi).
        cid: 0
  - verse: 5
    segments:
      - text: >
          [4 ayetine baq.]
        cid: 0
  - verse: 6
    segments:
      - text: >
          [4 ayetine baq.]
        cid: 0
  - verse: 7
    segments:
      - text: >
          Doğrusı, günahkârlırnıñ yazısı, muaqqaq Sicciinde olmaqtır.
        cid: 0
  - verse: 8
    segments:
      - text: >
          Secciin nedir, bilesiñmi? (Tefsirlerde Sicciinge çeşit manalar berilgen: a).
          Ziyade tar bir zindan; b). Ceennemde bir quyu; v). Kâfirlerniñ amelleri yazılğan
          kitap; g). YA da insanlarnen cinlerniñ amelleri qayd etilgen defter).
        cid: 0
  - verse: 9
    segments:
      - text: >
          (O günahkârlarnıñ yazısı) ameller sayılıp yazılğan bir kitaptır.
        cid: 0
  - verse: 10
    segments:
      - text: >
          O künü yalancılarnıñ alına vay!
        cid: 0
  - verse: 11
    segments:
      - text: >
          Ki olar, ceza kününi yalan sayarlar.
        cid: 0
  - verse: 12
    segments:
      - text: >
          Onı yalıñız ükümlerni taptağan ve günahqa batqan kimseler yalan der.
        cid: 0
  - verse: 13
    segments:
      - text: >
          Böyle birisine ayetlerimiz oqulğanınen: «Eskilerniñ masalları», der edi.
        cid: 0
  - verse: 14
    segments:
      - text: >
          Yoq! Aksine, olarnıñ yapmaqta olğan (yamanlıqları) qalplerini kirletkendir.
        cid: 0
  - verse: 15
    segments:
      - text: >
          Yoq! Olar, şübesiz, o künü Rabblerinden (Onı körüvden) mahrum qalğanlardır.
          (Tefsircilerniñ çoqu ve Ehl-i Sünnet kelâm alimleri bu ayetni, ahirette
          mü'minler Allahnı köreceklerine delil sayğanlar).
        cid: 0
  - verse: 16
    segments:
      - text: >
          Soñ olar ceennemge kirerler.
        cid: 0
  - verse: 17
    segments:
      - text: >
          Soñ olarğa: «İşte, yalanlağanıñız (ceennem) budır», denilir.
        cid: 0
  - verse: 18
    segments:
      - text: >
          Yoq! Ant olsun, yahşılarnıñ kitabı İlliyündadır.
        cid: 0
  - verse: 19
    segments:
      - text: >
          İlliyün nedir bilesiñmi?
        cid: 0
  - verse: 20
    segments:
      - text: >
          (O İlliyündaki kitap) İçinde ameller qayd etilgen bir kitaptır.
        cid: 0
  - verse: 21
    segments:
      - text: >
          O kitapnı, Allahqa yaqın olğanlar körerler.
        cid: 0
  - verse: 22
    segments:
      - text: >
          Yahşılar kesen-kes cennettedirler.
        cid: 0
  - verse: 23
    segments:
      - text: >
          Olar o yerde kürsiler üzerinde etrafqa baqarlar.
        cid: 0
  - verse: 24
    segments:
      - text: >
          Olarnıñ yüzünde nimetlerniñ sevinçini körersiñ.
        cid: 0
  - verse: 25
    segments:
      - text: >
          Olarğa müurli halis bir içki taqdim etilir.
        cid: 0
  - verse: 26
    segments:
      - text: >
          Onıñ içimi soñunda mis qoqusı bardır. İşte, yarışqanlar ancaq onda yarışsınlar.
        cid: 0
  - verse: 27
    segments:
      - text: >
          Qarışması Tesniimdendir.
        cid: 0
  - verse: 28
    segments:
      - text: >
          (O Tesniim Allahqa) Yaqın olğanlar içecek bir çoqraqtır.
        cid: 0
  - verse: 29
    segments:
      - text: >
          Şübesiz, günahkârlar (dünyada) iman etkenlerge küler ediler.
        cid: 0
  - verse: 30
    segments:
      - text: >
          Olarnen rastkelişkende qaş-köz oynatıp, alay ete ediler.
        cid: 0
  - verse: 31
    segments:
      - text: >
          Ailelerine qaytqanlarında, (alayları sebebinden) keyflenerek döne ediler.
        cid: 0
  - verse: 32
    segments:
      - text: >
          Mü'minlerni körgende: «Şübesiz, bular sapqan», der ediler.
        cid: 0
  - verse: 33
    segments:
      - text: >
          Albuki, olar mü'minlerni közetici olaraq yollanılmadılar.
        cid: 0
  - verse: 34
    segments:
      - text: >
          İşte, o künü (ahirette) de iman etkenler kâfirlerge külerler.
        cid: 0
  - verse: 35
    segments:
      - text: >
          Kürsiler üzerinde etrafqa baqarlar.
        cid: 0
  - verse: 36
    segments:
      - text: >
          Kâfirler yapqanlarınıñ cezasını taptılarmı? (Elbette taptılar).
        cid: 0
