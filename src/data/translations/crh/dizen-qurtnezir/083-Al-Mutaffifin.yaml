        cid: 5
      - text: (esap bermek içün)
        cid: 0
      - text: tiriltilecekler!
        cid: 5
      - text: >-
          Öyle bir kün ki, insanlar o künde alemlerniñ Rabbi uzurında tik turacaqlar. (İbn
          Umer bu sureni oquğanda, altıncı ayetke kelgeninen, ökür-ökür ağlağan. Bir bedeviy
          de Abdullah b. Mervanğa: «Allahnıñ ölçü ve çekisinde iyle yapqanlar aqqında ne
          söylegenini bilgeniñ alda, musulmanlarnıñ malını ölçüsiz, çekisiz ve zahmetsiz
          almaqta devam etesiñ!» degen edi).
        cid: 0
