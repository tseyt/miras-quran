          endirilgen. Angi şekilde olsa-olsun, endirilgen ayetler, kitap alında degel, sadece
          oqunaraq Peyğamber (s.a.)ge ögretilip ezberletilgen. İnkârcılar ayetlerni körgenleri
          ve eşitkenleri alda, bu şekildeki bir vahiyni qabul etmeyip, vahiyniñ yazılı
          vesiqalar alında kelüvini istediler. Yüce Allah bu ayette Qur'an olarnıñ istegen
          şeklinde endirilgeni alda bile, kâfirlerniñ kene inkâr etecegini bildire. Zira, daa
          evel Musa (a.s.)ğa Tevrat yazılı alda endirilse de, inanmağanlar kene inamanmğan
          ediler).
