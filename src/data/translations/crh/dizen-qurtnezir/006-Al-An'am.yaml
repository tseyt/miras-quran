surah_id: 6
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >
          Hamd köklerni ve yerni yaratqan, qaranlıqlarnı ve aydınlıqnı bar etken Allahqa
          aittir. (Bu qadar ayet ve delillerden soñ), kâfir olğanlar (alâ putlarnı)
          Rabbleri ile deñ tutmaqtalar.
        cid: 0
  - verse: 2
    segments:
      - text: >
          Sizni bir çamurdan yaratqan, soñra ölüm vaqtını taqdir etken ancaq Odır. Bir de
          Onıñ qatında muayen bir ecel (qıyamet) künü bardır. Siz alâ şübe etmektesiñiz.
        cid: 0
  - verse: 3
    segments:
      - text: >
          O köklerde ve yerde bir Allahtır. Gizliñizni, aşkârıñıznı bilir. (Hayır ve
          şerrden) ne qazanacağınıznı da bilir.
        cid: 0
  - verse: 4
    segments:
      - text: >
          Rabbleriniñ ayetlerinden olarğa (kâfirlerge) bir ayet kelmey tursın, o
          ayetlerden ille de yüz çevirirler.
        cid: 0
  - verse: 5
    segments:
      - text: >
          Aqiqaten olar özlerine Haq kelgeninde onı yalanğa çıqarğan ediler. Faqat yaqında
          olar eglence etken şeyleriniñ haberleri kelecek. (Ayette zikr etilgen «Haq» -
          Qur'annen Peyğamber (s.a.)niñ ketirgen diger mucizeleridir).
        cid: 0
  - verse: 6
    segments:
      - text: >
          Körmedilermi ki, olardan evel yer yüzünde sizge bermegen bütün imkânlarımıznı
          olarğa bergen, kökten üzerlerine bol-bol yağmurlar yağıdırıp, evleriniñ altından
          irmaqlar aqızğan nice nesillerni elâk ettik. Biz olarnı günahları sebebinden
          elâk ettik ve olarnıñ artından başqa nesiller yarattıq. (Bu ayette Yüce Allah,
          keçmiş qavmlarğa bergen nimetlerni bildirmekte. Ve bu nimetlerge nankorlik etip,
          Allahqa isyan etkenlerniñ soñunda elâk olğanlarını haber bere).
        cid: 0
  - verse: 7
    segments:
      - text: >
          Eger saña kâğıt üzerine yazılğan bir kitap endirse edik de, olar ellerinen onı
          tutqan olsalar edi, kene de inkâr eticiler: «Bu açıqtan-açıq tılsımdan başqa bir
          şey degil», der ediler. (Qur'an-ı Kerim ya Cebrail vastasınen, ya da vastasız
          olaraq, Peyğamberimizge endirilgen. Angi şekilde olsa-olsun, endirilgen ayetler,
          kitap alında degel, sadece oqunaraq Peyğamber (s.a.)ge ögretilip ezberletilgen.
          İnkârcılar ayetlerni körgenleri ve eşitkenleri alda, bu şekildeki bir vahiyni
          qabul etmeyip, vahiyniñ yazılı vesiqalar alında kelüvini istediler. Yüce Allah
          bu ayette Qur'an olarnıñ istegen şeklinde endirilgeni alda bile, kâfirlerniñ
          kene inkâr etecegini bildire. Zira, daa evel Musa (a.s.)ğa Tevrat yazılı alda
          endirilse de, inanmağanlar kene inamanmğan ediler).
        cid: 0
  - verse: 8
    segments:
      - text: >
          Muhammedge (köre bilecegimiz) bir melek endirilse edi ya! dediler. Eger biz öyle
          bir melek endirse edik, elbette iş bitirilgen olur, artıq özlerine köz bile
          açtırılmaz edi.
        cid: 0
  - verse: 9
    segments:
      - text: >
          Eger Peyğamberni bir melek yapsa edik, mıtlaqa onı insan şekline soqar, olarnı
          kene tüşken şübelerine tüşürir edik. (Şimdi peyğamber insan olğanı içün: «Sen de
          bizim kibi bir insansıñ», diyerek inanmağan kâfirler, o zaman da melekni insan
          suretinde körecekler ve oña: «Biz seniñ melek olğanıñnı ne yerden bileyik; sen
          de bizim kibi bir insansıñ», diye, onıñ melek olğanına inanmaycaq ve
          ketirgenlerini diñlemeycekler ve peyğamberligini tasdiq etmeycek ediler).
        cid: 0
  - verse: 10
    segments:
      - text: >
          Senden evelki peyğamberlernen de eglence etilgen, bu sebepten, olarnen eglence
          etkenlerni eglence etken şeyleri (azap) quşatqan edi.
        cid: 0
  - verse: 11
    segments:
      - text: >
          De ki: Yer yüzünde dolaşıñ, soñ (peyğamberlerni) yalanlağanlarnıñ soñunıñ nasıl
          olğanlarına baqıñ.
        cid: 0
  - verse: 12
    segments:
      - text: >
          (Olardan) köklerde ve yerde olğanlar kimniñdir? diye sora. «Allahnıñdır», de. O
          merhamet etmekni öz zatına farz qıldı. Sizni barlığında şübe olmağan qıyamet
          kününde elbette toplaycaq. Özlerini ziyanğa soqqanlar bar ya, işte olar
          inanmazlar.
        cid: 0
  - verse: 13
    segments:
      - text: >
          Gecede ve kündüzde barınğan er şey Onıñdır. O, er şeyni eşiticidir, bilicidir.
        cid: 0
  - verse: 14
    segments:
      - text: >
          De ki: Köklerni ve yerni yoqtan bar etken, aşatılğanı alda, aşatılmağan Allahtan
          başqasını dost tutacağımmı! De ki: Maña musulman olğanlarnıñ ilkisi oluvım emir
          etildi ve saqın müşriklerden olma! (denildi).
        cid: 0
  - verse: 15
    segments:
      - text: >
          De ki: Men Rabbime isyan etsem, kerçekten büyük bir künniñ (qıyametniñ)
          azabından qorqarım.
        cid: 0
  - verse: 16
    segments:
      - text: >
          O künü kim azaptan qurtarılsa, aqiqaten Allah onı qorçalağandır. İşte,
          açıqtan-açıq qurtulış budır.
        cid: 0
  - verse: 17
    segments:
      - text: >
          Eger Allah seni bir zararğa oğratsa, onı özünden başqa ketkizecek yoqtır. Ve
          eger saña bir hayır berse, (bunı da keri alacaq yoqtır). Şübesiz, O, er şeyge
          qadirdir. (Bu ayette hitap Peyğamber (s.a.)gedir, ancaq üküm umumiydir. Yani
          Allah bir kimsege zarar bermek istese, bütün insanlıq bir yerge toplansa, o
          zararnı ketkizalmaz ve oña Allahnıñ taqdir etkeninden ziyade fayda etalmaz. Bir
          kimsege de Allah hayır murad etken ise, bütün insanlıq bir yerge toplanıp, o
          hayırnıñ ögüni almaq isteseler, bunı da yapalmazlar. Çünki, hayırnı da, şerrni
          de yaratqan Allahtır).
        cid: 0
  - verse: 18
    segments:
      - text: >
          O, qullarnıñ üstünde er türlü tasarrufqa saiptir. O, üküm ve ikmet saibidir, er
          şeyden haberdardır.
        cid: 0
  - verse: 19
    segments:
      - text: >
          De ki: Angi şey şeadetçe eñ büyüktir? De ki: (Haq Peyğamber olğanıma dair)
          mennen siziñ arañızda Allah şaattır. Bu Qur'an maña onıñnen sizni ve yetişken er
          kesni tenbiyelevim içün vahiy olundı. Yoqsa, siz Allahnen beraber başqa tañırlar
          olğanına şaatlıq etesiñizmi? De ki: «Men buña şaatlıq etmem». «O ancaq tek bir
          Allahtır, men siziñ ortaq qoşqan şeyleriñizden kesen-kes uzaqtırım», de. (Mekke
          halqı Resulullahqa seniñ Peyğamber olğanıña şaat yoq, dediler. İşte, bunıñ
          üzerine yuqarıdaki ayet endi).
        cid: 0
  - verse: 20
    segments:
      - text: >
          Özlerine kitap bergenlerimiz onı (Resulullahnı) öz oğullarını tanığanları kibi
          tanırlar. Özlerini ziyanğa oğratqanlar bar ya, işte, olar inanmazlar.
        cid: 0
  - verse: 21
    segments:
      - text: >
          Yalan sözlernen Allahqa iftira etkenden ya da Onıñ ayetlerini yalanğa
          çıqarğanlardan daa zalım kim! Şübe yoq ki, zalımlar qurtulışqa irişmezler!
        cid: 0
  - verse: 22
    segments:
      - text: >
          Unutma, o künni ki, olarnı ep birden toplaycaqmız; soñ da Allahqa ortaq
          qoşqanlarğa: Boş yerge davasını etken ortaqlarıñız ne yerde? deycekmiz.
        cid: 0
  - verse: 23
    segments:
      - text: >
          Soñra olarnıñ baaneleri: «Rabbimiz Allah haqqı içün biz ortaq qoşqanlar
          olmadıq!», demekten başqa bir şey olmadı. (Ahirette ortağa çıqqan aqiqat
          qarşısında dünyadaki allarından tamamen vazgeçken kimseler tek Allahnıñ
          tañrılığına iqrar olacaqlar, ne çare ki, bu iqrar o yerde bir fayda bermeycek. O
          kün ancaq ceza ve mükâfat künüdir).
        cid: 0
  - verse: 24
    segments:
      - text: >
          Kör ki, öz aleyhlerine nasıl yalan söylediler ve (tañrı diye) uydurğan şeyleri
          öz-özlüginden nasıl ğayıp olıp ketti!
        cid: 0
  - verse: 25
    segments:
      - text: >
          Olardan seni (oquğan Qur'anıñnı) diñlegenler de bar. Faqat onı añlavlarına mani
          olmaq içün qalpleriniñ üstüne perdeler, qulaqlarına da ağırlıq berdik. Olar er
          türlü mucizeni körseler bile, kene de oña inanmazlar. Atta o kâfirler saña
          kelgenlerinde: «Bu Qur'an eskilerniñ masallarından başqa bir şey degil», diyerek
          sennen tartışırlar.
        cid: 0
  - verse: 26
    segments:
      - text: >
          Olar em insanlarnı Peyğamberge yaqlaşmaqtan vazgeçirmege çalışırlar, em de
          özleri ondan uzaqlaşırlar. Albuki, olar farqına barmadan, ancaq özlerini elâk
          eterler.
        cid: 0
  - verse: 27
    segments:
      - text: >
          Olarnıñ ateş qarşısında toqtatılıp: «Ah, keşke dünyağa keri qaytarılsaq da, bir
          daa Rabbimizniñ ayetlerini yalanlamasaq ve inanğanlardan olsaq!», degenlerini
          bir körseñ!..
        cid: 0
  - verse: 28
    segments:
      - text: >
          Yoq! Daa evel gizlegen şeyleri (günahları) özlerine köründi. Eger (dünyağa) keri
          yollansalar, kene özlerine yasaq etilgen şeylerge dönecekler. Zira, olar
          aqiqaten yalancıdırlar.
        cid: 0
  - verse: 29
    segments:
      - text: >
          Olar ayat ancaq bu dünyadaki ayatımızdan ibarettir; biz bir daa da
          tiriltirilecek degilmiz, degen ediler.
        cid: 0
  - verse: 30
    segments:
      - text: >
          Rabbleriniñ uzuruna ketirilgen vaqıtta sen olarnı bir körseñ! Allah: Bu (yañıdan
          tirilüv vaqiası), haq degilmi eken? deycek. Olar da: «Rabbimizge ant olsun ki,
          ebet!», deycekler. Allah da: Öyle ise, inkâr etkeniñizden tolayı, azapnı tatıñ!
          deycek.
        cid: 0
  - verse: 31
    segments:
      - text: >
          Allahnıñ uzurına çıqmaqnı yalanlağanlar kerçekten ziyanğa oğrağandır. Niayet,
          olarğa Qıyamet vaqıtı apansızdan kelip çatqanınen, olar günahlarını sırtlarına
          yüklenerek, deycekler ki: «Dünyada eyi amellerni terk etüvimizden tolayı, vah
          bizge!». Diqqat etiñ, yüklengen şeyleri ne fenadır!
        cid: 0
  - verse: 32
    segments:
      - text: >
          Dünya ayatı bir oyun ve eglenceden başqa bir şey degil. Muttaqiy olğanlar içün
          ahiret yurtu aqiqaten, daa hayırlıdır. Alâ aqıl yetiştirmeysiñizmi? (Ebu Cehil
          Peyğamberge: «Biz saña yalancı demeymiz. Çünki, seniñ emin ve sadıq olğanıña
          epimiz qaniymiz. Biz ancaq Allahnıñ ayetlerini inkâr etmektemiz», degen edi.
          Resulullah bu vaziyetke çoq kederlendi. Allah Taalâ Peyğamberini teselli etmek
          üzre buyurdı ki:)
        cid: 0
  - verse: 33
    segments:
      - text: >
          Olarnıñ söylegenleri aqiqaten seni kederletkenini bilmektemiz. Aslında olar seni
          yalanlamaylar, faqat o zalımlar açıqça Allahnıñ ayetlerini inkâr etmekteler.
        cid: 0
  - verse: 34
    segments:
      - text: >
          Ant olsun ki, senden evelki peyğamberler de yalanlanğan ediler. Olar
          yalanlanuvlarına ve eziyet etilüvlerine rağmen, sabır ettiler, soñunda
          yardımımız olarğa yetişti. Allahnıñ kelimelerini (qanunlarını) deñiştire bilecek
          iç bir kimse yoqtır. Muaqqaq ki, peyğamberlerniñ haberlerinden bazısı saña da
          keldi.
        cid: 0
  - verse: 35
    segments:
      - text: >
          Eger olarnıñ yüz çevirüvi saña ağır kelgen olsa, yapa bilseñ, yerniñ içine ene
          bilecek bir qoba ya da kökke çıqa bilecek bir merdiven qıdır ki, olarğa bir
          mucize ketirirsiñ! Allah tilese edi, elbette olarnı hidayet üzerinde toplap
          birleştirir edi, o alda saqın caillerden olma! (Bu ayetten añlaşılğanına köre,
          mucize köstermek Peyğamberniñ elinde degil. Peyğamber mucize ister; faqat Allah
          tilese, oña mucize berir, tilemese bermez. İşte, bu vaziyet peyğamberlerniñ
          doğru söylegenleriniñ eñ büyük delilidir).
        cid: 0
  - verse: 36
    segments:
      - text: >
          Ancaq (samimiyetnen) diñlegenler davetni qabul eter. Ölülerge kelgende, Allah
          olarnı tiriltecek, soñra da, Oña döndürilecekler.
        cid: 0
  - verse: 37
    segments:
      - text: >
          Oña Rabbiñden bir mucize endirilse edi ya! dediler. De ki: Şübesiz, Allah mucize
          endirmege qadirdir. Faqat olarnıñ çoqu bilmezler.
        cid: 0
  - verse: 38
    segments:
      - text: >
          Yer yüzünde yürgen ayvanlar ve (kök yüzünde) eki qanatınen uçqan quşlardan ne
          bar ise, episi ancaq siziñ kibi toplulıqlardır. Biz o kitapta iç bir şeyni eksik
          bıraqmadıq. Niayet (episi) toplanıp, Rabbleriniñ uzurına ketirelecekler. (Bu
          ayette yer yüzündeki bütün canlılarnıñ insanlar kibi birer tür olğanları
          bildirilmekte. Bir üceyrelilerden omurtqalılarğa, süyreklenicilerden ayaqlarınen
          yürgenlerge ve qanatlarınen uçqanlarğa barğance, bütün canlılar mustaqil birer
          tür teşkil etmektedir. Ancaq insan bu türlerniñ eñ şereflesidir. Er türniñ özüne
          ait ortaq ayat quralları bar. Yüce Allah bularnıñ ayatlarına, ister toplu
          olaraq, ister ayrı-ayrı nezaret eter; itiyaclarını qarşılar. Bu vaziyet Yüce
          Allahnıñ qudreti sıñırsızlığını köstere).
        cid: 0
  - verse: 39
    segments:
      - text: >
          Ayetlerimizni yalanğa çıqarğanlar qaranlıqlar içinde qalğan sağır ve
          tilsizlerdir. Allah kimni istese, onı şaşmalatır, istegen kimsesini de, doğru
          yolğa iriştirir.
        cid: 0
  - verse: 40
    segments:
      - text: >
          De ki: Ne dersiñiz; sizge Allahnıñ azabı kelse, ya da o qıyamet kelip çatsa
          sizge, Allahtan başqasına yalvarırsıñızmı? Doğru sözlü olsañız (söyleñiz
          baqayıq)!
        cid: 0
  - verse: 41
    segments:
      - text: >
          Aksine, yalıñız Allahqa yalvarırsıñız. O da (qaldırıluvı içün), özüne yalvarğan
          belâñıznı, istese ortadan qaldırır; ve siz ortaq qoşqan şeyleriñizni
          unutırsıñız.
        cid: 0
  - verse: 42
    segments:
      - text: >
          Ant olsun ki, senden evelki ümmetlerge de elçiler yolladıq. Artından boyun
          egsinler diye, olarnı tarlıq ve hastalıqlarğa oğrattıq. (Yüce Allah evelki
          milletlerge de peyğamyerler yollağan, faqat peyğamberler inkâr etilgen, Allah da
          inkâr etkenlerni şiddetli faqırlıq, hastalıq ve çeşit afatlarnen cezalandırğan).
        cid: 0
  - verse: 43
    segments:
      - text: >
          İç olmağanda, olarğa bu şekilde azabımız kelgen vaqıtta boyun egse ediler! Faqat
          qalpleri yahşıca qattılaştı ve şeytan da olarğa yapqanlarını cazibeli kösterdi.
        cid: 0
  - verse: 44
    segments:
      - text: >
          Özlerine yapılğan tenbiyelerni unutqanlarında, (endirgen sıqıntı ve
          musibetlerimizni ortadan qaldırıp), üzerlerine er şeyniñ qapularını açtıq.
          Niayet, özlerine berilgenler sebebinden qopayğan zamanları olarnı apansızdan
          yaqaladıq, birden olar bütün ümütlerini ğayıp ettiler. (Evelki ümmetler özlerine
          yollanılğan peyğamberlerge iman etmegenleri içün, Allah olarğa çeşit tarlıq ve
          musibetler berdi; faqat olar kene inanmadılar. Cenab-ı Allah cezalarını daa da
          arttırmaq içün, olarğa bütün nimetlerniñ qapularını açtı, bol rızıq ve
          nimetlerge kömüldiler. Nimetniñ aqiqiy saibine şükür etecek yerlerine, zevq ve
          sefağa daldılar, Onı unutıp, şehvetlerine teslim oldılar. İşte, böyle tam bir
          sarğoşlıq ve dalğınlıq anında Allah olarnı yaqaladı da, nege oğrağanlarını
          bilalmadılar, ne yapacaqlarını tüşünmekten aciz qaldılar ve elâk olup kettiler).
        cid: 0
  - verse: 45
    segments:
      - text: >
          Böylece, zulum etken toplumnıñ tamırı kesildi. Hamd alemlerniñ Rabbi Allahqa
          mahsustır. (Allahnıñ bergen nimetine şükür etecekleri yerine, nankorlik ettiler,
          böylece, özlerine zulum ettiler. Yüce Allah da yer yüzüni olarnıñ zulum ve
          küfürlerinden temizlemek içün, olarnı elâk etti).
        cid: 0
  - verse: 46
    segments:
      - text: >
          De ki: Ne dersiñiz; eger Allah qulaqlarıñıznı sağır, közleriñizni kör eter,
          qalpleriñizni de müurler ise, bularnı sizge Allahtan başqa angi tañrı keri bere
          bilir! Baq, delillerni nasıl beyan etmektemiz. Olar alâ yüz çevirmekteler!
        cid: 0
  - verse: 47
    segments:
      - text: >
          De ki: Söylersiñizmi; sizge Allahnıñ azabı apansızdan ya da açıq kelir ise,
          zalım toplumdan başqası elâk olurmı?
        cid: 0
  - verse: 48
    segments:
      - text: >
          Biz, peyğamberlerni ancaq müjdeleyiciler ve tenbiyeciler olaraq yollarmız. Kim
          iman eter ve özüni tüzeltir ise, olarğa qorqu yoqtır. Olar ğam da çekmeycekler.
        cid: 0
  - verse: 49
    segments:
      - text: >
          Ayetlerimizni yalanlağanlarğa kelgende, yoldan çıqqanları içün, olar azap
          çekecekler.
        cid: 0
  - verse: 50
    segments:
      - text: >
          De ki: Men sizge, Allahnıñ hazineleri menim yanımda, demeyim. Men ğaybnı da
          belmem. Sizge, men bir melekim de, demeyim. Men, sadece maña vahiy olunğanğa
          uyarım. De ki: Kör ile körgen iç bir olurmı? İç tüşünmezsiñizmi? (Müşrikler,
          Resulullah(s.a.)qa: «Sen Allah tarafından yollanılğan bir peyğamber iseñ,
          Allahtan iste de, bizge dünya nimetlerini bol-bol bersin, aks alda, saña
          inanmamız», dediler. Bunıñ üzerine bu ayet endi ve peyğamberniñ insanlarnı
          zenginleştirmek içün degil, olarğa aqiqatnı tebliğ etmek içün yollanılğanı ifade
          etildi).
        cid: 0
  - verse: 51
    segments:
      - text: >
          Rabbleriniñ uzurunda toplanacaqlarından qorqqanlarnı onıñnen (Qur'annen)
          tenbiyele. Olar içün Rabblerinden başqa ne bir dost, ne de bir vastacı bar;
          belki saqınırlar.
        cid: 0
  - verse: 52
    segments:
      - text: >
          Rableriniñ rizasını isteyerek, saba-aqşam Oña yalvarğanlarnı quvma! Olarnıñ
          esabından saña bir mesuliyetlilik; seniñ esabıñdan da olarğa er angi bir
          mesuliyetlilik yoqtır ki, olarnı quvup da, zalımlardan olursıñ! (Qureyş
