        cid: 0
  - verse: 37
    segments:
      - text: "Oña Rabbiñden bir mucize endirilse edi ya! dediler. De ki: Şubesiz, Allaһ mucize endirmege qadirdir. Faqat olarnıñ çoqu bilmezler."
        cid: 0
  - verse: 38
    segments:
      - text: "Yer yuzünde yurgen ayvanlar ve (kok yuzünde) eki qanatınen uçqan quşlardan ne bar ise, episi ancaq siziñ kibi toplulıqlardır. Biz o kitapta iç bir şeyni eksik bıraqmadıq. Niayet (episi) toplanıp, Rabbleriniñ uzurına ketirelecekler. (Bu ayette yer yuzündeki butün canlılarnıñ insanlar kibi birer tür olğanları bildirilmekte. Bir uceyrelilerden omurtqalılarğa, süyreklenicilerden ayaqzarınen yurgenlerge ve qanatlarınen uçqanlarğa barğance, butün canlılar mustaqil birer tür teşkil etmektedir. Ancaq insan bu türlerniñ eñ şereflesidir. Er türniñ ozüne ait ortaq ayat quralları bar. Yuce Allaһ bularnıñ ayatlarına, ister toplu olaraq, ister ayrı-ayrı nezaret eter; itiyaclarını qarşılar. Bu vaziyet Yuce Allaһnıñ qudreti sıñırsızlıgını kostere)."
        cid: 0
  - verse: 39
    segments:
      - text: "Ayetlerimizni yalanğa çıqarğanlar qaranlıqlar içinde qalğan sağır ve tilsizlerdir. Allaһ kimni istese, onı şaşmalatır, istegen kimsesini de, doğru yolğa iriştirir."
        cid: 0
  - verse: 40
    segments:
      - text: "De ki: Ne dersiñiz; sizge Allaһnıñ azabı kelse, ya da o qıyamet kelip çatsa sizge, Allaһtan başqasına yalvarırsıñızmı? Doğru sözlü olsañız (söyleñiz baqayıq)!"
        cid: 0
  - verse: 41
    segments:
      - text: "Aksine, yalıñız Allaһqa yalvarırsıñız. O da (qaldırıluvı içün), ozüne yalvarğan belâñıznı, istese ortadan qaldırır; ve siz ortaq qoşqan şeyleriñizni unutırsıñız."
        cid: 0
  - verse: 42
    segments:
      - text: "Ant olsun ki, senden evelki ummetlerge de elçiler yolladıq. Artından boyun egsinler diye, olarnı tarlıq ve hastalıqlarğa oğrattıq. (Üce Allaһ evelki milletlerge de peyğamyerler yollağan, faqat peyğamberler inkâr etilgen, Allaһ da inkâr etkenlerni şiddetli faqırlıq, hastalıq ve çeşit afatlarnen cezalandırğan)."
        cid: 0
  - verse: 43
    segments:
      - text: "İç olmağanda, olarğa bu şekilde azabımız kelgen vaqıtta boyun egse ediler! Faqat qalpleri yahşıca qattılaştı ve şeytan da olarğa yapqanlarını cazibeli kosterdi."
        cid: 0
  - verse: 44
    segments:
      - text: "Ozlerine yapılğan tenbiyelerni unutqanlarında, (endirgen sıqıntı ve musebetlerimizni ortadan qaldırıp), uzerlerine er şeyniñ qapularını açtıq. Niayet, ozlerine berilgenler sebebinden qopayğan zamanları olarnı apansızdan yaqaladıq, birden olar butün umütlerini ğayıp ettiler. (Evelki ummetler ozlerine yollanılğan peyğamberlerge iman etmegenleri içün, Allaһ olarğa çeşit tarlıq ve musibetler berdi; faqat olar kene inanmadılar. Cenab-ı Allaһ cezalarını daa da arttırmaq içün, olarğa butün nimetlerniñ qapularını açtı, bol rızıq ve nimetlerge komüldiler. Nimetniñ aqiqiy saibine şukür etacek yerlerine, zevq ve sefağa daldılar, Onı unutıp, şehvetlerine teslim oldılar. İşte, boyle tam bir sarğoşlq ve dalğınnlq anında Allaһ olarnı yaqaladı da, nege oğrağanlarını bilalmadılar, ne yapacaqlarını tüşünmekten aciz qaldılar ve elâk olup kettiler)."
        cid: 0
  - verse: 45
    segments:
      - text: "Boylece, zulum etken toplumnıñ tamırı kesildi. Hamd alemlerniñ Rabbi Allaһqa mahsustır. (Allaһnıñ bergen nimetine şukür etecekleri yerine, nankorlik ettiler, boylece, ozlerine zulum ettiler. Yuce Allaһ da yer yuzüni olarnıñ zulum ve kufürlerinden temizlemek içün, olarnı elâk etti)."
        cid: 0
  - verse: 46
    segments:
