surah_id: 6
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "Hamd koklerni ve yerni yaratqan, qaranlıqlarnı ve aydınlıqnı bar etken Allaһqa aittir. (Bu qadar ayet ve delillerden soñ, kâfir olğanlar (alâ putlarnı) Rabbleri ile deñ tutmaqtalar."
        cid: 0
  - verse: 2
    segments:
      - text: "Sizni bir çamurdan yaratqan, soñra olüm vaqtını taqdir etken ancaq Odır. Bir de Onıñ qatında muayen bir ecel (qıyamet) kunü bardır. Siz alâ şube etmektesiñiz."
        cid: 0
  - verse: 3
    segments:
      - text: "O koklerde ve yerde bir Allaһtır. Gizliñizni, aşkârıñıznı bilir. (Hayır ve şerrden) ne qazanacağınıznı da bilir."
        cid: 0
  - verse: 4
    segments:
      - text: "Rabbleriniñ ayetlerinden olarğa (kâfirlerge) bir ayet kelmey tursın, o ayetlerden ille de yuz çevirirler."
        cid: 0
  - verse: 5
    segments:
      - text: "Aqiqaten olar ozlerine Haq kelgeninde onı yalanğa çıqarğan ediler. Faqat yaqında olar eglence etken şeyleriniñ haberleri kelecek. (Ayette zikr etilgen «Haq» - Qur’annen Peyğamber (s.a.)niñ ketirgen diger mucizeleridir)."
        cid: 0
  - verse: 6
    segments:
      - text: "Kormedilermi ki, olardan evel yer yuzünde sizge bermegen butün imkânlarımıznı olarğa bergen, kokten uzerlerine bol-bol yağmurlar yağıdırıp, evleriniñ altından irmaqlar aqızğan nice nesillerni elâk ettik. Biz olarnı gunahları sebebinden elâk ettik ve olarnıñ artından başqa nesiller yarattıq. (Bu ayette Yuce Allaһ, keçmiş qavmlarğa bergen nimetlerni bildirmekte. Ve bu nimetlerge nankorlik etip, Allaһqa isyan etkenlerniñ soñunda elâk olğanlarını haber bere)."
        cid: 0
  - verse: 7
    segments:
      - text: "Eger saña kâğıt uzerine yazılğan bir kitap endirse edik de, olar ellerinen onı tutqan olsalar edi, kene de inkâr eticiler: «Bu açıqtan-açıq tılsımdan başqa bir şey degil», der ediler. (Qur’an-ı Kerim ya Cebrail vastasınen, ya da vastasız olaraq, Peyğamberimizge endirilgen. Angi şekilde olsa-olsun, endirilgen ayetler, kitap alında degel, sadece oqunaraq Peyğamber (s.a.)ge ogretilip ezberletilgen. İnkârcılar ayetlerni korgenleri ve eşitkenleri alda, bu şekildeki bir vahiyni qabul etmeyip, vahiyniñ yazıl vesiqalar alında kelüvini istediler. Yuce Allaһ bu ayette Qur’an olarnıñ istegen şeklinde endirilgeni alda bile, kâfirlerniñ kene inkâr etecegini bildire. Zira, daa evel Musa (a.s.)ğa Tevrat yazıl alda endirilse de, inanmağanlar kene inamanmğan ediler)."
        cid: 0
  - verse: 8
    segments:
      - text: "Muһammedge (kore bilecegimiz) bir melek endirilse edi ya! dediler. Eger biz oyle bir melek endirse edik, elbette iş bitirilgen olur, artıq ozlerine koz bile açtırılmaz edi."
        cid: 0
  - verse: 9
    segments:
      - text: "Eger Peyğamberni bir melek yapsa edik, mıtlaqa onı insan şekline soqar, olarnı kene tüşken şubelerine tüşürir edik. (Şimdi peyğamber insan olğanı içün: «Sen de bizim kibi bir insansıñ», diyerek inanmağan kâfirler, o zaman da melekni insan suretinde korecekler ve oña: «Biz seniñ melek olğanıñnı ne yerden bileyik; sen de bizim kibi bir insansıñ», diye, onıñ melek olğanına inanmaycaq ve ketirgenlerini diñlemeycekler ve peyğamberligini tasdiq etmeycek ediler)."
        cid: 0
  - verse: 10
    segments:
      - text: "Senden evelki peyğamberlernen de eglence etilgen, bu sebepten, olarnen eglence etkenlerni eglence etken şeyleri (azap) quşatqan edi."
        cid: 0
  - verse: 11
    segments:
      - text: "De ki: Yer yuzünde dolaşıñ, soñ (peyğamberlerni) yalanlağanlarnıñ soñunıñ nasıl olğanlarına baqıñ."
        cid: 0
  - verse: 12
    segments:
      - text: "(Olardan) koklerde ve yerde olğanlar kimniñdir? diye sora. «Allaһnıñdır», de. O merhamet etmekni oz zatına farz qıldı. Sizni barlığında şube olmağan qıyamet kunünde elbette toplaycaq. Ozlerini ziyanğa soqqanlar bar ya, işte olar inanmazlar."
        cid: 0
  - verse: 13
    segments:
      - text: "Gecede ve kundüzde barınğan er şey Onıñdır. O, er şeyni eşiticidir, bilicidir."
        cid: 0
  - verse: 14
    segments:
      - text: "De ki: Koklerni ve yerni yoqtan bar etken, aşatılğanı alda, aşatılmağan Allaһtan başqasını dost tutacağımmı! De ki: Maña musulman olğanlarnıñ ilkisi oluvım emir etildi ve saqın muşriklerden olma! (denildi)."
        cid: 0
  - verse: 15
    segments:
      - text: "De ki: Men Rabbime isyan etsem, kerçekten buyuk bir kunniñ (qıyametniñ) azabından qorqarım."
        cid: 0
  - verse: 16
    segments:
      - text: "O kunü kim azaptan qurtarılsa, aqiqaten Allaһ onı qorçalağandır. İşte, açıqtan-açıq qurtulış budır."
        cid: 0
  - verse: 17
    segments:
      - text: "Eger Allaһ seni bir zararğa oğratsa, onı ozünden başqa ketkizecek yoqtır. Ve eger saña bir hayır berse, (bunı da keri alacaq yoqtır). Şubesiz, O, er şeyge qadirdir. (Bu ayette hitap Peyğamber (s.a.)gedir, ancaq uküm umumiydir. Yani Allaһ bir kimsege zarar bermek istese, butün insanlıq bir yerge toplansa, o zararnı ketkizalmaz ve oña Allaһnıñ taqdir etkeninden ziyade fayda etalmaz. Bir kimsege de Allaһ hayır murad etken ise, butün insanlıq bir yerge toplanıp, o hayırnıñ ogüni almaq isteseler, bunı da yapalmazlar. Çünki, hayırnı da, şerrni de yaratqan Allaһtır)."
        cid: 0
  - verse: 18
    segments:
      - text: "O, qullarnıñ ustünde er türlü tasarrufqa saiptir. O, uküm ve ikmet saibidir, er şeyden haberdardır."
        cid: 0
  - verse: 19
    segments:
      - text: "De ki: Angi şey şeadetçe eñ buyuktir? De ki: (Haq Peyğamber olğanıma dair) mennen siziñ arañızda Allaһ şaattır. Bu Qur’an maña onıñnen sizni ve yetişken er kesni tenbiyelevim içün vahiy olundı. Yoqsa, siz Allaһnen beraber başqa tañırlar olğanına şaatlıq etesiñizmi? De ki: «Men buña şaatlıq etmem». «O ancaq tek bir Allaһtır, men siziñ ortaq qoşqan şeyleriñizden kesen-kes uzaqtırım», de. (Mekke halqı Resulullahqa seniñ Peyğamber olğanıña şaat yoq, dediler. İşte, bunıñ uzerine yuqarıdaki ayet endi)."
        cid: 0
  - verse: 20
    segments:
      - text: "Ozlerine kitap bergenlerimiz onı (Resulullahnı) oz oğullarını tanığanları kibi tanırlar. Ozlerini ziyanğa oğratqanlar bar ya, işte, olar inanmazlar."
        cid: 0
  - verse: 21
    segments:
      - text: "Yalan sözlernen Allaһqa iftira etkenden ya da Onıñ ayetlerini yalanğa çıqarğanlardan daa zalım kim! Şube yoq ki, zalımlar qurtulışqa irişmezler!"
        cid: 0
  - verse: 22
    segments:
      - text: "Unutma, o kunni ki, olarnı ep birden toplaycaqmız; soñ da Allaһqa ortaq qoşqanlarğa: Boş yerge davasını etken ortaqlarıñız ne yerde? deycekmiz."
        cid: 0
  - verse: 23
    segments:
      - text: "Soñra olarnıñ baaneleri: «Rabbimiz Allaһ haqqı içün biz ortaq qoşqanlar olmadıq!», demekten başqa bir şey olmadı. (Ahirette ortağa çıqqan aqiqat qarşısında dünyadaki allarından tamamen vazgeçken kimseler tek Allaһnıñ tañrılığına iqrar olacaqlar, ne çare ki, bu iqrar o yerde bir fayda bermeycek. O kun ancaq ceza ve mukâfat kunüdir)."
        cid: 0
  - verse: 24
    segments:
      - text: "Kor ki, oz aleyhlerine nasıl yalan söylediler ve (tañrı diye) uydurğan şeyleri ozozlüginden nasıl ğayıp olıp ketti!"
        cid: 0
  - verse: 25
    segments:
      - text: "Olardan seni (oquğan Qur’anıñnı) diñlegenler de bar. Faqat onı añlavlarına mani olmaq içün qalpleriniñ ustüne perdeler, qulaqlarına da ağırlıq berdik. Olar er türlü mucizeni korseler bile, kene de oña inanmazlar. Atta o kâfirler saña kelgenlerinde: «Bu Qur’an eskilerniñ masallarından başqa bir şey degil», diyerek sennen tartışırlar."
        cid: 0
  - verse: 26
    segments:
      - text: "Olar em insanlarnı Peyğamberge yaqlaşmaqtan vazgeçirmege çalışırlar, em de ozleri ondan uzaqlaşırlar. Albuki, olar farqına barmadan, ancaq ozlerini elâk eterler."
        cid: 0
  - verse: 27
    segments:
      - text: "Olarnıñ ateş qarşısında toqtatılıp: «Ah, keşke dünyağa keri qaytarılsaq da, bir daa Rabbimizniñ ayetlerini yalanlamasaq ve inanğanlardan olsaq!», degenlerini bir korseñ!.."
        cid: 0
  - verse: 28
    segments:
      - text: "Yoq! Daa evel gizlegen şeyleri (gunahları) ozlerine koründi. Eger (dünyağa) keri yollansalar, kene ozlerine yasaq etilgen şeylerge dönecekler. Zira, olar aqiqaten yalancıdırlar."
        cid: 0
  - verse: 29
    segments:
      - text: "Olar ayat ancaq bu dünyadaki ayatımızdan ibarettir; biz bir daa da tiriltirilecek degilmiz, degen ediler."
        cid: 0
  - verse: 30
    segments:
      - text: "Rabbleriniñ uzuruna ketirilgen vaqıtta sen olarnı bir korseñ! Allaһ: Bu (yañıdan tirilüv vaqiası), haq degilmi eken? deycek. Olar da: «Rabbimizge ant olsun ki, ebet!», deycekler. Allaһ da: Oyle ise, inkâr etkeniñizden tolayı, azapnı tatıñ! deycek."
        cid: 0
  - verse: 31
    segments:
      - text: "Allaһnıñ uzurına çıqmaqnı yalanlağanlar kerçekten ziyanğa oğrağandır. Niayet, olarğa Qıyamet vaqıtı apansızdan kelip çatqanınen, olar gunahlarını sırtlarına yuklenerek, deycekler ki: «Dünyada eyi amellerni terk etüvimizden tolayı, vah bizge!». Diqqat etiñ, yuklengen şeyleri ne fenadır!"
        cid: 0
  - verse: 32
    segments:
      - text: "Dünya ayatı bir oyun ve eglenceden başqa bir şey degil. Muttaqiy olğanlar içün ahiret yurtu aqiqaten, daa hayırlıdır. Alâ aqıl yetiştirmeysiñizmi? (Ebu Cehil Peyğamberge: «Biz saña yalancı demeymiz. Çünki, seniñ emin ve sadıq olğanıña epimiz qaniymiz. Biz ancaq Allaһnıñ ayetlerini inkâr etmektemiz», degen edi. Resulullah bu vaziyetke çoq kederlendi. Allaһ Taalâ Peyğamberini teselli etmek uzre buyurdı ki:)"
        cid: 0
  - verse: 33
    segments:
      - text: "Olarnıñ söylegenleri aqiqaten seni kederletkenini bilmektemiz. Aslında olar seni yalanlamaylar, faqat o zalımlar açıqça Allaһnıñ ayetlerini inkâr etmekteler."
        cid: 0
  - verse: 34
    segments:
      - text: "Ant olsun ki, senden evelki peyğamberler de yalanlanğan ediler. Olar yalanlanuvlarına ve eziyet etilüvlerine rağmen, sabır ettiler, soñunda yardımımız olarğa yetişti. Allaһnıñ kelimelerini (qanunlarını) deñiştire bilecek iç bir kimse yoqtır. Muaqqaq ki, peyğamberlerniñ haberlerinden bazısı saña da keldi."
        cid: 0
  - verse: 35
    segments:
      - text: "Eger olarnıñ yuz çevirüvi saña ağır kelgen olsa, yapa bilseñ, yerniñ içine ene bilecek bir qoba ya da kokke çıqa bilecek bir merdiven qıdır ki, olarğa bir mucize ketirirsiñ! Allaһ tilese edi, elbette olarnı hidayet uzerinde toplap birleştirir edi, o alda saqın caillerden olma! (Bu ayetten añlaşılğanına kore, mucize kostermek Peyğamberniñ elinde degil. Peyğamber mucize ister; faqat Allaһ tilese, oña mucize berir, tilemese bermez. İşte, bu vaziyet peyğamberlerniñ doğru söylegenleriniñ eñ buyuk delilidir)."
        cid: 0
  - verse: 36
    segments:
