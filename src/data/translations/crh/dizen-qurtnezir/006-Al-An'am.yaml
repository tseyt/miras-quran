        cid: 0
  - verse: 48
    segments:
      - text: "Biz, peyğamberlerni ancaq mujdeleyiciler ve tenbiyeciler olaraq yollarmız. Kim iman eter ve ozüni tüzeltir ise, olarğa qorqu yoqtır. Olar ğam da çekmeycekler."
        cid: 0
  - verse: 49
    segments:
      - text: "Ayetlerimizni yalanlağanlarğa kelgende, yoldan çıqqanları içün, olar azap çekecekler."
        cid: 0
  - verse: 50
    segments:
      - text: "De ki: Men sizge, Allaһnıñ hazineleri menim yanımda, demeyim. Men ğaybnı da belmem. Sizge, men bir melekim de, demeyim. Men, sadece maña vahiy olunğanğa uyarım. De ki: Kor ile korgen iç bir olurmı? İç tüşünmezsiñizmi? (Muşrikler, Resulullah(s.a.)qa: «Sen Allaһ tarafından yollanılğan bir peyğamber iseñ, Allaһtan iste de, bizge dünya nimetlerini bol-bol bersin, aks alda, saña inanmamız», dediler. Bunıñ uzerine bu ayet endi ve peyğamberniñ insanlarnı zenginleştirmek içün degil, olarğa aqiqatnı tebliğ etmek içün yollanılğanı ifade etildi)."
        cid: 0
  - verse: 51
    segments:
      - text: "Rabbleriniñ uzurunda toplanacaqlarından qorqqanlarnı onıñnen (Qur’annen) tenbiyele. Olar içün Rabblerinden başqa ne bir dost, ne de bir vastacı bar; belki saqınırlar."
        cid: 0
  - verse: 52
    segments:
      - text: "Rableriniñ rizasını isteyerek, saba-aqşam Oña yalvarğanlarnı quvma! Olarnıñ esabından saña bir mesuliyetlilik; seniñ esabıñdan da olarğa er angi bir mesuliyetlilik yoqtır ki, olarnı quvup da, zalımlardan olursıñ! (Qureyş buyukleri Resulullah (s.a.)nıñ yanına kelgen vaqıtlarında faqır mu’minlerniñ yanlarında bulunuvını istemey ediler. Resulullah da olarnı isteklerine uyıp, bu mu’minlerni yanından çıqarmaq istedi. Bunıñ uzerine Cenabı Haq peyğamberimizni yuqarıdaki ayetnen tenbiyeledi). 53. «Aramızdan Allaһnıñ olarğa lütf ve ihsanda bulunğan kimseler de bularmı!», deyuvleri içün olarnıñ bir qısmını digerlerinen, işte boyle imtian ettik. Allaһ şukür etkenlerni daa yahşı bilmezmi? (Kâfirler iman şerefine irişken faqır mu’minlerniñ, peyğamberniñ yanında ozlerinen aynı seviyede tutuluvlarını qabul etalmadılar. Albuki, Allaһ qatında zengin-faqır ayırımı yoqtır, ustünlik iman ve taqvağa tayanmaqtadır. Olar bu şekilde bir imtianğa tabiy tutuldılar, inanğanlar qazandılar, ğururına sığdıralmağanlar ise, zarar ettiler)."
        cid: 0
  - verse: 54
    segments:
