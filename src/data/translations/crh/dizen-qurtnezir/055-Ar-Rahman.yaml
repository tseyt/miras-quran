surah_id: 55
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "Rahmaan Qur’annı ogretti. İnsannı yarattı. Oña beyan etmekni ogretti."
        cid: 0
  - verse: 2
    segments:
      - text: "[1 ayetine baq.]"
        cid: 0
  - verse: 3
    segments:
      - text: "[1 ayetine baq.]"
        cid: 0
  - verse: 4
    segments:
      - text: "[1 ayetine baq.]"
        cid: 0
  - verse: 5
    segments:
      - text: "Kuneş ve ay bir esapqa kore (areket etmekte)dir."
        cid: 0
  - verse: 6
    segments:
      - text: "Osümlikler ve terekler secde eterler. («Osümlikler» diye tercme etilgen «necm» kelimesi «yıldız» manasına da kelir)."
        cid: 0
  - verse: 7
    segments:
      - text: "Kokni Allaһ yukseltti ve mizannı (olçüni) O qoydı. (Keçken ayetlerde bildirilgenine kore, ozüne laqırdı etüv ve tüşünüv hususiyetleri berilgen insan, diger canlılardan farqlıdır. Ay ve kuneş belgilengen ve bilingen bir olçüge kore, oz yollarında aqıp ketmekteler. Kok ve yer yaratılğan, aralarında musaviylik ve tertip teminlengen)."
        cid: 0
  - verse: 8
    segments:
      - text: "Saqın musaviylikni bozmañ."
        cid: 0
  - verse: 9
    segments:
      - text: "Olçüni adaletnen tutıñ ve eksik tartmañ."
        cid: 0
  - verse: 10
    segments:
      - text: "Allaһ yerni canlılar içün yaratqandır."
        cid: 0
  - verse: 11
    segments:
      - text: "O yerde meyvalar ve salqımlı hurma terekleri bar."
        cid: 0
  - verse: 12
    segments:
      - text: "Yapraqlı daneler ve hoş qoqulı osümlikler bar."
        cid: 0
  - verse: 13
    segments:
      - text: "O alda, Rabiñizniñ nimetlerinden angisini yalanlay bilirsiñiz?"
        cid: 0
  - verse: 14
    segments:
      - text: "Allaһ insannı pişken çamurğa beñzegen bir balçıqtan yarattı."
        cid: 0
  - verse: 15
    segments:
      - text: "Cinlerni mahsus ateşten yarattı."
        cid: 0
  - verse: 16
    segments:
      - text: "O alda, Rabbiñizniñ nimetlerinden angisini yalanlay bilirsiñiz?"
        cid: 0
  - verse: 17
    segments:
      - text: "(O,) eki şarqnıñ ve eki ğarbnıñ Rabbidir. (Yaz ve qış mevsimlerine kore, doğuv ve batuvnıñ yerleri deñyeşkeni içün, «eki şarq» ve «eki ğarb» tabiri qullanılğan)."
        cid: 0
  - verse: 18
    segments:
      - text: "Oyle ise, Rabbiñizniñ angi nimetlerini yalanlay bilirsiñiz?"
        cid: 0
  - verse: 19
    segments:
      - text: "Eki deñizni bir-birine qavuşmaq uzre qoya qoyğan."
        cid: 0
  - verse: 20
    segments:
      - text: "Aralarında bir sed bardır, bir-birine keçip qarışmazlar. (Tuzlulıq farqı sebebinen, eki deñiz arasında bir «tik suv tabaqası» - sedi olğanı, soñki keşfiyatlar neticesinde ortağa çıqarıldı)."
        cid: 0
  - verse: 21
    segments:
      - text: "O alda, Rabbiñizniñ nimetlerinden angisini yalanlay bilirsiñiz?"
        cid: 0
  - verse: 22
    segments:
      - text: "Ekisinden de inci ve mercan çıqar."
        cid: 0
  - verse: 23
    segments:
      - text: "Şimdi Rabbiñizniñ nimetlerinden angisini yalanlay bilirsiñiz?"
        cid: 0
  - verse: 24
    segments:
      - text: "Deñizde, yuce dağlar kibi, yukselgen gemiler de, Onıñdır."
        cid: 0
  - verse: 25
    segments:
      - text: "Oyle eken, Rabbiñizniñ nimetlerinden angisini yalanlay bilirsiñiz?"
        cid: 0
  - verse: 26
    segments:
      - text: "Yer yuzünde olğan er canlı yoq olacaq."
        cid: 0
  - verse: 27
    segments:
      - text: "Ancaq azamet ve ikram sanbi Rabbiñiz zatı baqiy qalacaq."
        cid: 0
  - verse: 28
    segments:
      - text: "Oyle eken, Rabbiñizniñ angi nimetlerini yalanlay bilirsiñiz?"
        cid: 0
  - verse: 29
    segments:
      - text: "Koklerde ve yerde bulunğan er kes Ondan ister. O, er an yaratmaq alındadır. (Varlıqlar tilleri ve allarınen, ibadet, rızıq, afu etilüv ve buña beñzegen meselelerde Allaһtan yardım isterler. Allaһ tiriltmek, oldürmek, degerli ya da degersiz yapmaq, zengin ya da faqır yapmaq, istegenge bermek ve buña beñzegen işlerde, er an kâinatta tasarruf etmektedir)."
        cid: 0
  - verse: 30
    segments:
      - text: "O alda, Rabbiñizniñ nimetlerinden angisini yalanlay bilirsiñiz?"
        cid: 0
  - verse: 31
    segments:
      - text: "Ey, insan ve cin! Siziñ de esabıñıznı elge alacaqmız."
        cid: 0
  - verse: 32
    segments:
      - text: "Al bu eken, Rabbiñizniñ nimetlerinden angisini yalanlay bilirsiñiz?"
        cid: 0
  - verse: 33
    segments:
      - text: "Ey, cin ve insan toplulıqları! Koklerniñ ve yerniñ çerçivesinden çıqıp ketmege kuçüñiz yetmekte ise, keçiñ. Ancaq, buyuk bir kuçnen çıqıp kete bilirsiñiz."
        cid: 0
  - verse: 34
    segments:
      - text: "Oyle ise, Rabbiñizniñ angi nimetlerini yalanlay bilirsiñiz?"
        cid: 0
  - verse: 35
    segments:
      - text: "Ustüñizge ateşten alev ve duman yollanılar da, bir-biriñizni qurtaralmaz ve yardımlaşalmazsıñız."
        cid: 0
  - verse: 36
    segments:
      - text: "Oyle eken, Rabbiñizniñ angi nimetlerini yalanlay bilirsiñiz?"
        cid: 0
  - verse: 37
    segments:
      - text: "Kok yarılıp da, qızarğan yağ renkinde gul kibi olğan vaqıtta,"
        cid: 0
  - verse: 38
    segments:
      - text: "Rabbiñizniñ angi nimetlerini yalanlay bilirsiñiz?"
        cid: 0
  - verse: 39
    segments:
      - text: "İşte, o kunü insandan da, cinden de gunahı soralmaz. (Çünki, kok yarılğanında yani qıyamet qopacağında, qabirden çıquvda ya da mahşerde insanlar ve cinler sımmalarından tanılacaqları içün, olardan bir şey soralmaycjq)."
        cid: 0
  - verse: 40
    segments:
      - text: "O alda, Rabbiñizniñ nimetlerinden angisini yalanlay bilirsiñiz?"
        cid: 0
  - verse: 41
    segments:
      - text: "Suçlılar, sımalarından tanılır, perçemlerinden ve ayaqlarından yaqalanırlar."
        cid: 0
  - verse: 42
    segments:
      - text: "Oyle eken, Rabbiñizniñ angi nimetlerini yalanlay bilirsiñiz?"
        cid: 0
  - verse: 43
    segments:
      - text: "İşte, bu suçlılarnıñ yalanlağanları ceennemdir."
        cid: 0
  - verse: 44
    segments:
      - text: "Olar, ceennemde qaynaq suv içinde dolaşır turarlar."
        cid: 0
  - verse: 45
    segments:
      - text: "Şimdi Rabbiñizniñ nimetlerinden angisini yalanlay bilirsiñiz?"
        cid: 0
  - verse: 46
    segments:
      - text: "Rabbiñniñ uzurında turmaqtan qorqqan kimselerge eki cennet bardır."
        cid: 0
  - verse: 47
    segments:
      - text: "Oyle eken, Rabbiñizniñ nimetlerinden anginisini yalanlay bilirsiñiz?"
        cid: 0
  - verse: 48
    segments:
      - text: "Eki cennet de çeşit-çeşit tereklernen toludır."
        cid: 0
  - verse: 49
    segments:
      - text: "Oyle eken, Rabbiñizniñ nimetlerinden anginisini yalanlay bilirsiñiz?"
        cid: 0
  - verse: 50
    segments:
      - text: "Ekisinde de aqıp turğan eki çoqraq bardır."
        cid: 0
  - verse: 51
    segments:
      - text: "Oyle eken, Rabbiñizniñ nimetlerinden anginisini yalanlay bilirsiñiz?"
        cid: 0
  - verse: 52
    segments:
      - text: "Ekisinde de er türlü meyvalar çift-çift bardır."
        cid: 0
  - verse: 53
    segments:
      - text: "Oyle eken, Rabbiñizniñ nimetlerinden anginisini yalanlay bilirsiñiz?"
        cid: 0
  - verse: 54
    segments:
      - text: "Episi de ortüleri atlastan minderlerge yaslanırlar. Eki cennetniñ de meyvasınıñ cıyıluvı yaqındır."
        cid: 0
  - verse: 55
    segments:
      - text: "Oyle eken, Rabbiñizniñ angi nimetlerini yalanlay bilirsiñiz?"
        cid: 0
  - verse: 56
    segments:
      - text: "O yerlerde kozlerini yalıñız qocalarına çevirgen guzeller bar ki, bulardan evel olarğa ne insan, ne cin toqunğandır."
        cid: 0
  - verse: 57
    segments:
      - text: "Oyle eken, Rabbiñizniñ angi nimetlerini yalanlay bilirsiñiz?"
        cid: 0
  - verse: 58
    segments:
      - text: "Sanki olar yaqut ve mercandırlar."
        cid: 0
  - verse: 59
    segments:
      - text: "Oyle eken, Rabbiñizniñ angi nimetlerini yalanlay bilirsiñiz?"
        cid: 0
  - verse: 60
    segments:
      - text: "Yahşılıqnıñ qarşılığı yahşılıqtan başqa bir şeydirmi?"
        cid: 0
  - verse: 61
    segments:
      - text: "Oyle eken, Rabbiñizniñ angi nimetlerini yalanlay bilirsiñiz?"
        cid: 0
  - verse: 62
    segments:
      - text: "Bu ekisinden başqa eki cennet daa bar."
        cid: 0
  - verse: 63
    segments:
      - text: "Oyle eken, Rabbiñizniñ angi nimetlerini yalanlay bilirsiñiz?"
        cid: 0
  - verse: 64
    segments:
      - text: "Bu cennetler qoyu yeşildirler."
        cid: 0
  - verse: 65
    segments:
      - text: "Oyle eken, Rabbiñizniñ angi nimetlerini yalanlay bilirsiñiz?"
        cid: 0
  - verse: 66
    segments:
      - text: "Ekisinde de toqtamadan fışqırğan eki çoqraq bar."
        cid: 0
  - verse: 67
    segments:
      - text: "Oyle eken, Rabbiñizniñ angi nimetlerini yalanlay bilirsiñiz?"
        cid: 0
  - verse: 68
    segments:
      - text: "Ekisinde de er türlü meyvalar, hurma ve nar bardır."
        cid: 0
  - verse: 69
    segments:
      - text: "Oyle eken, Rabbiñizniñ angi nimetlerini yalanlay bilirsiñiz?"
        cid: 0
  - verse: 70
    segments:
      - text: "İçlerinde ahlâqı guzel, yuzü guzel qadınlar bardır."
        cid: 0
  - verse: 71
    segments:
      - text: "Oyle eken, Rabbiñizniñ angi nimetlerini yalanlay bilirsiñiz?"
        cid: 0
  - verse: 72
    segments:
      - text: "Çadırlar içinde saiplerine adalğan uriyler bardır."
        cid: 0
  - verse: 73
    segments:
      - text: "Oyle eken, Rabbiñizniñ angi nimetlerini yalanlay bilirsiñiz?"
        cid: 0
  - verse: 74
    segments:
      - text: "Bularğa olardan evel ne bir insan, ne bir cin toqunğadır."
        cid: 0
  - verse: 75
    segments:
      - text: "Oyle eken, Rabbiñizniñ angi nimetlerini yalanlay bilirsiñiz?"
        cid: 0
  - verse: 76
    segments:
      - text: "Yeşil yastıqlarğa ve alelhusus guzel töşemelerge yaslanırlar."
        cid: 0
  - verse: 77
    segments:
      - text: "Oyle eken, Rabbiñizniñ angi nimetlerini yalanlay bilirsiñiz?"
        cid: 0
  - verse: 78
    segments:
      - text: "Buyuklik ve ikram saibi Rabbiñniñ adı yucelerden yucedir."
        cid: 0