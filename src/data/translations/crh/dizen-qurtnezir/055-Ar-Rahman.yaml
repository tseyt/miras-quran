surah_id: 55
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >
          Rahmaan Qur'annı ögretti. İnsannı yarattı. Oña beyan etmekni ögretti.
        cid: 0
  - verse: 2
    segments:
      - text: >
          [1 ayetine baq.]
        cid: 0
  - verse: 3
    segments:
      - text: >
          [1 ayetine baq.]
        cid: 0
  - verse: 4
    segments:
      - text: >
          [1 ayetine baq.]
        cid: 0
  - verse: 5
    segments:
      - text: >
          Küneş ve ay bir esapqa köre (areket etmekte)dir.
        cid: 0
  - verse: 6
    segments:
      - text: >
          Ösümlikler ve terekler secde eterler. («Ösümlikler» diye tercme etilgen «necm»
          kelimesi «yıldız» manasına da kelir).
        cid: 0
  - verse: 7
    segments:
      - text: >
          Kökni Allah yükseltti ve mizannı (ölçüni) O qoydı. (Keçken ayetlerde
          bildirilgenine köre, özüne laqırdı etüv ve tüşünüv hususiyetleri berilgen insan,
          diger canlılardan farqlıdır. Ay ve küneş belgilengen ve bilingen bir ölçüge
          köre, öz yollarında aqıp ketmekteler. Kök ve yer yaratılğan, aralarında
          musaviylik ve tertip teminlengen).
        cid: 0
  - verse: 8
    segments:
      - text: >
          Saqın musaviylikni bozmañ.
        cid: 0
  - verse: 9
    segments:
      - text: >
          Ölçüni adaletnen tutıñ ve eksik tartmañ.
        cid: 0
  - verse: 10
    segments:
      - text: >
          Allah yerni canlılar içün yaratqandır.
        cid: 0
  - verse: 11
    segments:
      - text: >
          O yerde meyvalar ve salqımlı hurma terekleri bar.
        cid: 0
  - verse: 12
    segments:
      - text: >
          Yapraqlı daneler ve hoş qoqulı ösümlikler bar.
        cid: 0
  - verse: 13
    segments:
      - text: >
          O alda, Rabbiñizniñ nimetlerinden angisini yalanlay bilirsiñiz?
        cid: 0
  - verse: 14
    segments:
      - text: >
          Allah insannı pişken çamurğa beñzegen bir balçıqtan yarattı.
        cid: 0
  - verse: 15
    segments:
      - text: >
          Cinlerni mahsus ateşten yarattı.
        cid: 0
  - verse: 16
    segments:
      - text: >
          O alda, Rabbiñizniñ nimetlerinden angisini yalanlay bilirsiñiz?
        cid: 0
  - verse: 17
    segments:
      - text: >
          (O,) eki şarqnıñ ve eki ğarbnıñ Rabbidir. (Yaz ve qış mevsimlerine köre, doğuv
          ve batuvnıñ yerleri deñeşkeni içün, «eki şarq» ve «eki ğarb» tabiri
          qullanılğan).
        cid: 0
  - verse: 18
    segments:
      - text: >
          Öyle ise, Rabbiñizniñ angi nimetlerini yalanlay bilirsiñiz?
        cid: 0
  - verse: 19
    segments:
      - text: >
          Eki deñizni bir-birine qavuşmaq üzre qoya qoyğan.
        cid: 0
  - verse: 20
    segments:
      - text: >
          Aralarında bir sed bardır, bir-birine keçip qarışmazlar. (Tuzlulıq farqı
          sebebinen, eki deñiz arasında bir «tik suv tabaqası» - sedi olğanı, soñki
          keşfiyatlar neticesinde ortağa çıqarıldı).
        cid: 0
  - verse: 21
    segments:
      - text: >
          O alda, Rabbiñizniñ nimetlerinden angisini yalanlay bilirsiñiz?
        cid: 0
  - verse: 22
    segments:
      - text: >
          Ekisinden de inci ve mercan çıqar.
        cid: 0
  - verse: 23
    segments:
      - text: >
          Şimdi Rabbiñizniñ nimetlerinden angisini yalanlay bilirsiñiz?
        cid: 0
  - verse: 24
    segments:
      - text: >
          Deñizde, yüce dağlar kibi, yükselgen gemiler de, Onıñdır.
        cid: 0
  - verse: 25
    segments:
      - text: >
          Öyle eken, Rabbiñizniñ nimetlerinden angisini yalanlay bilirsiñiz?
        cid: 0
  - verse: 26
    segments:
      - text: >
          Yer yüzünde olğan er canlı yoq olacaq.
        cid: 0
  - verse: 27
    segments:
      - text: >
          Ancaq azamet ve ikram saibi Rabbiñiz zatı baqiy qalacaq.
        cid: 0
  - verse: 28
    segments:
      - text: >
          Öyle eken, Rabbiñizniñ angi nimetlerini yalanlay bilirsiñiz?
        cid: 0
  - verse: 29
    segments:
      - text: >
          Köklerde ve yerde bulunğan er kes Ondan ister. O, er an yaratmaq alındadır.
          (Varlıqlar tilleri ve allarınen, ibadet, rızıq, afu etilüv ve buña beñzegen
          meselelerde Allahtan yardım isterler. Allah tiriltmek, öldürmek, degerli ya da
          degersiz yapmaq, zengin ya da faqır yapmaq, istegenge bermek ve buña beñzegen
          işlerde, er an kâinatta tasarruf etmektedir).
        cid: 0
  - verse: 30
    segments:
      - text: >
          O alda, Rabbiñizniñ nimetlerinden angisini yalanlay bilirsiñiz?
        cid: 0
  - verse: 31
    segments:
      - text: >
          Ey, insan ve cin! Siziñ de esabıñıznı elge alacaqmız.
        cid: 0
  - verse: 32
    segments:
      - text: >
          Al bu eken, Rabbiñizniñ nimetlerinden angisini yalanlay bilirsiñiz?
        cid: 0
  - verse: 33
    segments:
      - text: >
          Ey, cin ve insan toplulıqları! Köklerniñ ve yerniñ çerçivesinden çıqıp ketmege
          küçüñiz yetmekte ise, keçiñ. Ancaq, büyük bir küçnen çıqıp kete bilirsiñiz.
        cid: 0
  - verse: 34
    segments:
      - text: >
          Öyle ise, Rabbiñizniñ angi nimetlerini yalanlay bilirsiñiz?
        cid: 0
  - verse: 35
    segments:
      - text: >
          Üstüñizge ateşten alev ve duman yollanılar da, bir-biriñizni qurtaralmaz ve
          yardımlaşalmazsıñız.
        cid: 0
  - verse: 36
    segments:
      - text: >
          Öyle eken, Rabbiñizniñ angi nimetlerini yalanlay bilirsiñiz?
        cid: 0
  - verse: 37
    segments:
      - text: >
          Kök yarılıp da, qızarğan yağ renkinde gül kibi olğan vaqıtta,
        cid: 0
  - verse: 38
    segments:
      - text: >
          Rabbiñizniñ angi nimetlerini yalanlay bilirsiñiz?
        cid: 0
  - verse: 39
    segments:
      - text: >
          İşte, o künü insandan da, cinden de günahı soralmaz. (Çünki, kök yarılğanında
          yani qıyamet qopacağında, qabirden çıquvda ya da mahşerde insanlar ve cinler
          sımalarından tanılacaqları içün, olardan bir şey soralmaycaq).
        cid: 0
  - verse: 40
    segments:
      - text: >
          O alda, Rabbiñizniñ nimetlerinden angisini yalanlay bilirsiñiz?
        cid: 0
  - verse: 41
    segments:
      - text: >
          Suçlılar, sımalarından tanılır, perçemlerinden ve ayaqlarından yaqalanırlar.
        cid: 0
  - verse: 42
    segments:
      - text: >
          Öyle eken, Rabbiñizniñ angi nimetlerini yalanlay bilirsiñiz?
        cid: 0
  - verse: 43
    segments:
      - text: >
          İşte, bu suçlılarnıñ yalanlağanları ceennemdir.
        cid: 0
  - verse: 44
    segments:
      - text: >
          Olar, ceennemde qaynaq suv içinde dolaşır turarlar.
        cid: 0
  - verse: 45
    segments:
      - text: >
          Şimdi Rabbiñizniñ nimetlerinden angisini yalanlay bilirsiñiz?
        cid: 0
  - verse: 46
    segments:
      - text: >
          Rabbiñniñ uzurında turmaqtan qorqqan kimselerge eki cennet bardır.
        cid: 0
  - verse: 47
    segments:
      - text: >
          Öyle eken, Rabbiñizniñ nimetlerinden anginisini yalanlay bilirsiñiz?
        cid: 0
  - verse: 48
    segments:
      - text: >
          Eki cennet de çeşit-çeşit tereklernen toludır.
        cid: 0
  - verse: 49
    segments:
      - text: >
          Öyle eken, Rabbiñizniñ nimetlerinden anginisini yalanlay bilirsiñiz?
        cid: 0
  - verse: 50
    segments:
      - text: >
          Ekisinde de aqıp turğan eki çoqraq bardır.
        cid: 0
  - verse: 51
    segments:
      - text: >
          Öyle eken, Rabbiñizniñ nimetlerinden anginisini yalanlay bilirsiñiz?
        cid: 0
  - verse: 52
    segments:
      - text: >
          Ekisinde de er türlü meyvalar çift-çift bardır.
        cid: 0
  - verse: 53
    segments:
      - text: >
          Öyle eken, Rabbiñizniñ nimetlerinden anginisini yalanlay bilirsiñiz?
        cid: 0
  - verse: 54
    segments:
      - text: >
          Episi de örtüleri atlastan minderlerge yaslanırlar. Eki cennetniñ de meyvasınıñ
          cıyıluvı yaqındır.
        cid: 0
  - verse: 55
    segments:
      - text: >
          Öyle eken, Rabbiñizniñ angi nimetlerini yalanlay bilirsiñiz?
        cid: 0
  - verse: 56
    segments:
      - text: >
          O yerlerde közlerini yalıñız qocalarına çevirgen güzeller bar ki, bulardan evel
          olarğa ne insan, ne cin toqunğandır.
        cid: 0
  - verse: 57
    segments:
      - text: >
          Öyle eken, Rabbiñizniñ angi nimetlerini yalanlay bilirsiñiz?
        cid: 0
  - verse: 58
    segments:
      - text: >
          Sanki olar yaqut ve mercandırlar.
        cid: 0
  - verse: 59
    segments:
      - text: >
          Öyle eken, Rabbiñizniñ angi nimetlerini yalanlay bilirsiñiz?
        cid: 0
  - verse: 60
    segments:
      - text: >
          Yahşılıqnıñ qarşılığı yahşılıqtan başqa bir şeydirmi?
        cid: 0
  - verse: 61
    segments:
      - text: >
          Öyle eken, Rabbiñizniñ angi nimetlerini yalanlay bilirsiñiz?
        cid: 0
  - verse: 62
    segments:
      - text: >
          Bu ekisinden başqa eki cennet daa bar.
        cid: 0
  - verse: 63
    segments:
      - text: >
          Öyle eken, Rabbiñizniñ angi nimetlerini yalanlay bilirsiñiz?
        cid: 0
  - verse: 64
    segments:
      - text: >
          Bu cennetler qoyu yeşildirler.
        cid: 0
  - verse: 65
    segments:
      - text: >
          Öyle eken, Rabbiñizniñ angi nimetlerini yalanlay bilirsiñiz?
        cid: 0
  - verse: 66
    segments:
      - text: >
          Ekisinde de toqtamadan fışqırğan eki çoqraq bar.
        cid: 0
  - verse: 67
    segments:
      - text: >
          Öyle eken, Rabbiñizniñ angi nimetlerini yalanlay bilirsiñiz?
        cid: 0
  - verse: 68
    segments:
      - text: >
          Ekisinde de er türlü meyvalar, hurma ve nar bardır.
        cid: 0
  - verse: 69
    segments:
      - text: >
          Öyle eken, Rabbiñizniñ angi nimetlerini yalanlay bilirsiñiz?
        cid: 0
  - verse: 70
    segments:
      - text: >
          İçlerinde ahlâqı güzel, yüzü güzel qadınlar bardır.
        cid: 0
  - verse: 71
    segments:
      - text: >
          Öyle eken, Rabbiñizniñ angi nimetlerini yalanlay bilirsiñiz?
        cid: 0
  - verse: 72
    segments:
      - text: >
          Çadırlar içinde saiplerine adalğan uriyler bardır.
        cid: 0
  - verse: 73
    segments:
      - text: >
          Öyle eken, Rabbiñizniñ angi nimetlerini yalanlay bilirsiñiz?
        cid: 0
  - verse: 74
    segments:
      - text: >
          Bularğa olardan evel ne bir insan, ne bir cin toqunğadır.
        cid: 0
  - verse: 75
    segments:
      - text: >
          Öyle eken, Rabbiñizniñ angi nimetlerini yalanlay bilirsiñiz?
        cid: 0
  - verse: 76
    segments:
      - text: >
          Yeşil yastıqlarğa ve alelhusus güzel töşemelerge yaslanırlar.
        cid: 0
  - verse: 77
    segments:
      - text: >
          Öyle eken, Rabbiñizniñ angi nimetlerini yalanlay bilirsiñiz?
        cid: 0
  - verse: 78
    segments:
      - text: >
          Büyüklik ve ikram saibi Rabbiñniñ adı yücelerden yücedir.
        cid: 0
