      - text: >-
          (Bu eki ayetten birincisi cahiliyet deviri adetlerini yıqaraq, mirastan qadınnıñ da
          payı olğanını, Allahnıñ olar içün ayırğan bu paynıñ mıtlaqa özlerine berilüvi
          kerekligini ifade etmekte. Ekinci ayet vise, İslâm ketirgen eñ keniş qardaşlıq ve eñ
          insaniy tayanışma añlamı ve içtimaiy adalet printsipi içinde mirasta payı olmağan
          -nisbeten- uzaq aqaraba, o civarda bulunğan faqır-fuqarege de mirastan bir şeyler
          berilüvini, goñülleriniñ alınuvını, emeksiz elde etilgen servetke nisbeten peyda
          olacaq menfiy duyğularnıñ ögü alınuvını emir emtekte).
