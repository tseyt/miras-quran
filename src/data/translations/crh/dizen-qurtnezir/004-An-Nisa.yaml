      - text: Bu, adaletten ayırılmamañız içün
        cid: 3
      - text: eñ uyğunıdır.
        cid: 26
      - text: >-
          (Yaratılıştan kelgen küncülik duyğusına rağmen, ayetniñ erkeklerge birden ziyade
          qadınnen evlenüvge izin berüvi ezelden berli -daa ziyade ğayrı muslimlerce- tenqit
          ve itirazğa mevzu olğan. Ancaq, İslâmnıñ bu iznini diger talimatı ve ayatnıñ
          deñişici şartlarına köre elge almaq zarur. İslâmğa köre, zina kesen-kes aramdır; şu
          alda zinağa alıp barğan yollarnı kesmek kerek. Erkekniñ küçlü ve qabiliyetli,
          qadınnıñ ise, zayıf ve istkesiz oluvı ya da, doğurmağanı alında, cenk ve başqa
          sebeplernen, erkeklerniñ azaluvı ve qadınlarnıñ çoqlaşuvı kibi vaziyetlerde,
          erkekniñ birden ziyade qadınnen evlenüvi zaruriy ola bilir. Böyle vaziyetlerde
          erkekniñ birden ziyade qadınnen evlenüvi bir emir degil, bir izindir; ekinci ve
          üçünci... qadın olacaq hanım da buña mecbur degil. Ayrıca, bu izin qaydsız, şartsız
          olmayıp, adalet şartına bağlı, buña riayet etalmaycağından qorqqanlarğa bir qadınnen
          qanaatlenmeleri emir etilgen. Bütün bu qaydlar ve şartlar, güzel tüşünilgen vaqıtta,
          İslâmnıñ bu izniniñ vaqtı ile deñişik şartlarğa uyuv noqtai nazarından, eñ maqbul
          yol olğanı açıqça añlaşılacaq).
        cid: 0
