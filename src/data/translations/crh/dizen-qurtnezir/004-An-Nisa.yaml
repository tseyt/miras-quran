surah_id: 4
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >
          Ey, insanlar! Sizni tek bir nefisten yaratqan ve ondan da çiftini yaratqan ve
          ekisinden bir çoq erkekler ve qadınlar töretip yayğan Rabbiñizden saqınıñ. Adını
          añaraq, bir-biriñizden istekte bulunğan Allahtan ve aqarabalıq aqlarına
          riayetsizlik etüvden de saqınıñ. Şübesiz, Allah siziñ üzeriñizden közeticidir.
        cid: 0
  - verse: 2
    segments:
      - text: >
          Yetimlerge mallarını beriñ. temizni pis olğannen deñişmeñ, olarnıñ mallarını
          kendi mallarıñızğa qataraq, (kendi malıñız eken kibi) yemeñ; çünki bu, büyük bir
          günahtır.
        cid: 0
  - verse: 3
    segments:
      - text: >
          Eger (olarnen evlengen taqdiriñizde) yetimlerniñ aqlarına riayet etalmamaqtan
          qorqsañız, begengeniñiz (ya da sizge elâl olğan) qadınlarıñızdan ekişer, üçer,
          dörter alıñız. Aqsızlıq yapuvdan qorqsañız, bir dane alıñız; ya da saip olğan
          (cariyeleriñiz)nen qanaatleniñiz. Bu, adaletten ayırılmamañız içün eñ uyğunıdır.
          (Yaratılıştan kelgen küncülik duyğusına rağmen, ayetniñ erkeklerge birden ziyade
          qadınnen evlenüvge izin berüvi ezelden berli -daa ziyade ğayrı muslimlerce-
          tenqit ve itirazğa mevzu olğan. Ancaq, İslâmnıñ bu iznini diger talimatı ve
          ayatnıñ deñişici şartlarına köre elge almaq zarur. İslâmğa köre, zina kesen-kes
          aramdır; şu alda zinağa alıp barğan yollarnı kesmek kerek. Erkekniñ küçlü ve
          qabiliyetli, qadınnıñ ise, zayıf ve istkesiz oluvı ya da, doğurmağanı alında,
          cenk ve başqa sebeplernen, erkeklerniñ azaluvı ve qadınlarnıñ çoqlaşuvı kibi
          vaziyetlerde, erkekniñ birden ziyade qadınnen evlenüvi zaruriy ola bilir. Böyle
          vaziyetlerde erkekniñ birden ziyade qadınnen evlenüvi bir emir degil, bir
          izindir; ekinci ve üçünci... qadın olacaq hanım da buña mecbur degil. Ayrıca, bu
          izin qaydsız, şartsız olmayıp, adalet şartına bağlı, buña riayet etalmaycağından
          qorqqanlarğa bir qadınnen qanaatlenmeleri emir etilgen. Bütün bu qaydlar ve
          şartlar, güzel tüşünilgen vaqıtta, İslâmnıñ bu izniniñ vaqtı ile deñişik
          şartlarğa uyuv noqtai nazarından, eñ maqbul yol olğanı açıqça añlaşılacaq).
        cid: 0
  - verse: 4
    segments:
      - text: >
          Qadınlarğa mehirlerini goñül rizası ile (cumertçe) beriñ; eger goñül hoşluğı ile
          o mehirniñ bir qısmını sizge bağışlasalar, onı da afiyetnen aşañ.
        cid: 0
  - verse: 5
    segments:
      - text: >
          Allahnıñ keçinişiñizge destek yapqan mallarıñıznı aqılı irmegenlerge (aqıl-baliğ
          olmağanlarğa) bermeñ; o mallarnen olarnı besleñ, kiydiriñ ve olarğa güzel söz
          söyleñ.
        cid: 0
  - verse: 6
    segments:
      - text: >
          Evlilik çağına kelgenge qadar yetimlerni (közetip) deñeñ, eger olarda aqılda bir
          pişkinleşüv körseñiz, aman mallarını özlerine beriñ. Buyuycekler (de, qaytarıp
          alacaqlar,) diye o mallarnı israfnen ve aşıqıp yemeñ. Zengin olğan (veli)
          iffetli olmağa areket etsin, yoqsul olğanda (itiyacı ve emegine) uyğun olaraq
          aşasın. Mallarını özlerine bergen vaqtıñızda yanlarında şaat bulundırıñ. Esap
          soraycaq olaraq da, Allah kâfidir.
        cid: 0
  - verse: 7
    segments:
      - text: >
          Ana-babanıñ ve aqrabalarnıñ qaldırğanlarından erkeklerge bir pay bar;
          ana-babanıñ ve aqrabalarnıñ qaldırğanlarından qadınlarga da bir pay bar. İster
          azından, ister çoqundan, belli bir isse ayırılğandır.
        cid: 0
  - verse: 8
    segments:
      - text: >
          (Mirastan payı olmağan) aqrabalar, yetimler ve yoqsullar miras taqsimatında azır
          bulunsa, bundan olarnı da rızıqlandırıñ ve olarğa güzel söz söyleñ. (Bu eki
          ayetten birincisi cahiliyet deviri adetlerini yıqaraq, mirastan qadınnıñ da payı
          olğanını, Allahnıñ olar içün ayırğan bu paynıñ mıtlaqa özlerine berilüvi
          kerekligini ifade etmekte. Ekinci ayet vise, İslâm ketirgen eñ keniş qardaşlıq
          ve eñ insaniy tayanışma añlamı ve içtimaiy adalet printsipi içinde mirasta payı
          olmağan -nisbeten- uzaq aqaraba, o civarda bulunğan faqır-fuqarege de mirastan
          bir şeyler berilüvini, goñülleriniñ alınuvını, emeksiz elde etilgen servetke
          nisbeten peyda olacaq menfiy duyğularnıñ ögü alınuvını emir emtekte).
        cid: 0
  - verse: 9
    segments:
      - text: >
          Aciz, küçü yetmez balalar qaldırğan taqdirlerinde (alları ne olur) diye,
          qorqacaqlar (yetimlerge aqsızlıq etüvden) qorqıp titresinler; Allahtan
          saqınsınlar ve doğru söz söylesinler. (Yetimlerniñ veli ve vasileri, olarğa öz
          balalarına davranıluvını istegenleri kibi davranmalıdırlar; çünki, öz balaları
          da bir kün yetim ve çaresiz qala bilirler).
        cid: 0
  - verse: 10
    segments:
      - text: >
          Aqsızlıqnen yetimlerniñ mallarını aşağanlar, şübesiz, qarınlarına ancaq ateş
          tıqqan olurlar; zaten olar alevlengen ateşke kirecekler.
        cid: 0
  - verse: 11
    segments:
      - text: >
          Allah sizge, balalarıñız aqqında, oğulğa qız payınıñ eki qatını (miras
          berüviñizni) emir ete. (Balalar) ekiden ziyade qız olsa, ölüniñ qaldırğanınıñ
          üçte ekisi olarnıñdır. Eger yalıñız bir qız ise, yarısı onıñdır. Ölgenniñ balası
          bar ise, ana-babasından er biriniñ mirastan altıda bir issesi bar. Eger balası
          yoq da, ana-babası oña varis olğan ise, anasına üçte bir (tüşer). Eger ölgenniñ
          qardaşları bar ise, anasına altıda bir (tüşer. Bütün bu paylar ölgenniñ) yapacaq
          vasiyetinden ve borc ödelgen soñdır. Babalarıñız ve oğullarıñızdan angisiniñ
          sizge fayda noqtai nazardan daa yaqın olğanını bilalmazsıñız. Bular Allah
          tarafından qoyulğan farzlardır (paylardır). Şübesiz, Allah ilim ve ikmet
          saibidir. (İslâmnıñ miras uquqında paylar ile mükellefiyetler arasında
          musaviylik yolu tutulğan, daa çoq arclama yapmaq mecburiyetinde olğanlarğa çoq,
          daa az arcalama vaziyetinde olğanlarğa az isse berilgen. İslâm aile uququna
          köre, evlengende mehir berecek, dügün masrafı yapacaq - erkektir. Evlengenden
          soñ, ister muhtac olğan yaqın aqrabasına ve ister çifti ve balalarına baqacaq,
          olarğa aşaycaq, kiyecek, mesken kibi eñ az itiyaclarını teminleycek - kene
          erkektir. İşte, bu sebeplerden ki, esas olaraq mirasta erkeklerniñ payı,
          qadınlarnıñkinden eki qat ziyade olğan).
        cid: 0
  - verse: 12
    segments:
      - text: >
          Yapacaq vasiyetten ve borctan soñ, çiftleriñizniñ, eger balaları olmasa,
          qaldırğanlarınıñ yarısı siziñdir. Balaları olsa, qaldırğanlarınıñ dörtte biri
          siziñdir. Balañız olmasa, siziñ de yapacaq vasiyetiñizden ve borctan soñ,
          qaldırğanıñıznıñ dörtte biri olarnıñdır (zevceleriñizniñdir). Balañız olsa,
          qaldırğanıñıznıñ sekizde biri olarnıñdır. Eger bir erkek ve qadınnıñ, ana-babası
          ve balaları olmağanı alda, (kelâle şeklinde) malı mirasçlıarğa qalsa ve bir
          oğlan ya da qız qardaşı olsa, er birine altıda biri tüşer. Bundan ziyade
          olsalar, üçte birge ortaqtırlar. (Bu taqsimat) yapılacaq vasiyetten ve borctan
          soñ, kimse zararğa oğratılmadan (yapılacaq). Bular Allahtan sizge vasiyettir.
          Allah er şeyni haqqı ile bilicidir, halimdir. (Kelâli şeklinde, malnı yan
          hısımlarına qalğan kimselerniñ paylarını añlatqan qısımda keçken oğlan qardaş ve
          qız qardaş - ana bir qardaşlardır. Tuvğan qardaşlarnıñ vaziyeti sureniñ soñunda
          añlatılacaq).
        cid: 0
  - verse: 13
    segments:
      - text: >
          Bular Allahnıñ (qoyğan) sıñırlarıdır. Kim Allahqa ve Peyğamberine itaat etse,
          Allah onı zemininden irmaqlar aqqan cennetlerge qoyacaq; o yerde daimiy
          qalıcılardır; işte, büyük qurtulış budır.
        cid: 0
  - verse: 14
    segments:
      - text: >
          Kim Allahqa ve Peyğamberine qarşı isyan etse ve sıñırlarını aşsa, Allah onı
          daimiy qalacaq bir ateşke soqar ve onıñ içün alçaltıcı bir azap bardır. (Uquq
          sistemaları - varislerniñ alacaq paylarında olğanı kibi, yaqınlıq ve uzaqlıq
          derecelerine köre, aqrabanıñ varis olıp-olmağanını tayin etüv meselesinde de,
          farqlı qabul ve tadbiqlarnı menimsegenler. Meselâ, İslâmdan başqa bazı
          sistemalarda ölgenniñ balaları olsa, ana-babası varis olamaylar. İslâm miras
          uquqı paylarnı dağıtqanda, adil musaviylik esasına riayet etkeni kibi,
          varislerni tayin etkende de, yaqınlıq derecesinen beraber, faydanı köz ögüne
          alğan, dünya ve ahiret ayatında ölüge faydası toqunğan ve toqunacaq aqrabanı
          mirastan mahrum etmegen).
        cid: 0
  - verse: 15
    segments:
      - text: >
          Qadınlarıñızdan faişelik yapqanlarğa nisbeten arañızdan dört şaat ketiriñ. Eger
          şaatlıq etseler, o qadınlarnı ölüm alıp ketkence ya da Allah olarğa bir yol
          açqanğace, evlerde aps etiñ.
        cid: 0
  - verse: 16
    segments:
      - text: >
          Arañızdan fuhuş yapqan er eki tarafqa ceza beriñ; eger tövbe etse, uslansalar,
          artıq olarğa ceza berip, eziyet etüvden vazgeçiñ; çünki, Allah tövbelerni çoq
          qabul etici ve çoq merhametlidir. (Bu eki ayet fuhuş denilgen çirkin fiil ile
          bağlıdır. Tefsircilerniñ çoqu er ekisi de zina şeklindeki fuhuşqa ait olup,
          birincisi evlengenlerniñ zinası, ekincisi ise, bekârlarnıñ zinası aqqında ilk
          devirlerde tedbiq etilgen cezanı añlatmaqta. Daa soñra kelgen ayet (Nuur, 24/2)
          ve hadislernen Az. Peyğamberniñ tedbiqlerine köre, bu ayetler nesh etilgen,
          bekârlarnıñ zinası içün belli sayıda sopa, evlilerniñ zinası içün «recm» cezası
          tayin etilgen. Bazı tefsircelerge köre ise, ayetler nesh etilmegen; yani
          ükümleri areketten toqtatılmağan; bu ayetlerden birincisi qadınlar arasındaki
          sevicilik faişeligine, ekinci ayet ise, erkekler arasındaki livata faişeligine
          ait. Bularnıñ cezası ayetlerde olğanı kibidir. Qadınnen erkek arasındaki zina
          fuhuşınıñ cezası ise, Nuur suresindeki ayette beyan etilgen).
        cid: 0
  - verse: 17
    segments:
      - text: >
          Allahnıñ qabul etecegi tövbe, ancaq bilmeyip fenalıq yapıp da, soñra tez tövbe
          etkenlerniñ tövbesidir; işte, Allah bularnıñ tövbesini qabul eter; Allah er
          şeyni bilicidir, ikmet saibidir.
        cid: 0
  - verse: 18
    segments:
      - text: >
          Yoqsa, fenalıqlarnı yapıp da, aralarından birisine ölüm kelip çatqanınen: «Men
          şimdi tövbe ettim», degenlernen kâfir olaraq ölgenler içün (qabul etilecek)
          tövbe yoqtır. Olar içün accı bir azap azırlağandırmız.
        cid: 0
  - verse: 19
    segments:
      - text: >
          Ey, iman etkenler! Qadınlarğa zornen varis oluvıñız, sizge elâl degil.
          Açıqtan-açıq bir edepsizlik yapmağance, olarğa bergeniñizniñ bir qısmını elge
          keçirüviñiz içün de qadınlarnı sıqıştırmañ. Olarnen eyi keçiniñ. Eger olardan
          hoşlanmasañız, (biliñ ki,) Allahnıñ aqqıñızda çoq hayırlı yapacaq bir şeyinden
          de hoşlanmağan ola bilirsiñiz. (İslâmdan evel araplar qadınğa çoq fena muamele
          eter, bu cumleden, qacası ölgen qadınnı, onıñ miras qaldırğan malı kibi qabul
          ete, qadın istemse bile, onıñnen evlenmek ya da onı başqasına evlendirmek aqqına
          saip olğanlarını tüşüne, qadınnı qullanaraq, maddiy menfaat körmek yoluna kire
          ediler. Ayet bütün bu aqsızlıqlarğa soñ berdi, qadınğa lâyıq olğan aqlarnı
          ketirdi).
        cid: 0
  - verse: 20
    segments:
      - text: >
          Eger bir qadınnı taşlap da, yerine başqa bir qadın almaq isteseñiz, olardan
          birine yüklernen mehir bergen olsañız dahi, ondan iç bir şeyni keri almañ. Siz
          iftira eterek ve açıqtan-açıq günah işleyerek, onı keri alırsıñızmı? (İslâmda
          erkek evlenecek qadınğa mehir adınen bir mal berir. Bunıñ miqdarı urf, adet ve
          teñeşine köre tayin etilir. Mehir qadınnıñ aqqı, onıñ hususiy malıdır, peşin
          berilmegen olsa, qocası ayırğanda ya da ölgen vaqtında qadınğa der'al ödenüvi
          kerek. Erkeklerniñ çeşit yollar ve iylelernen bu aqnı qısmen ya da tamamınen
          yeyüvleri, bergenlerini zorlap qaytarıp aluvları diniy taraftan doğru degil).
        cid: 0
  - verse: 21
    segments:
      - text: >
          Vaqtı ile siz bir-biriñiznen aşır-neşir olğan ve olar sizden doğru bir teminat
          alğanı alda, onı nasıl keri alırsıñız. (Bir qadınnen evlenip birleşken ya da
          birleşecek bir qararda beraber qalğan (halvet olğan) qoca onı ayırğan taqdirde,
          mehirniñ episini öder. Ayette «Bir-biriñiznen aşır-neşir olğan» denilerek,
          bularğa işaret etilmekte. Birleşüv ve halvet olmadan ayırılğan alda ise, qadın
          mehirniñ yarısına aqlı olur).
        cid: 0
  - verse: 22
    segments:
      - text: >
          Keçmişte olğanlar bir yanda, babalarıñıznıñ evlengen qadınlarınen evlenmeñ;
          çünki bu bir ayasızlıqtır, igrenç bir şeydir ve fena bir yoldır. (İslâmdan evel
          araplarnıñ ögey analarınen evlenüv şeklindeki çirkin bir adetini ortadan
          qaldırğan bu ayetten soñ, musulmanlarnıñ başqa kimselernen evelenüvleriniñ caiz
          olmağanını añlatmaq üzre, böyle buyurıla:)
        cid: 0
  - verse: 23
    segments:
      - text: >
          Analarıñız, qızlarıñız, qız qardaşlarıñız, alalarıñız, teyzeleriñiz, qardaş
          qızları, qız qardaşnıñ qızları, sizni emizgen analarıñız, süt tatalarıñız,
          qadınlarıñıznıñ anaları, özleriñiznen birleşken çiftleriñizden olup, evleriñizde
          bulunğan ögey qızlarıñız sizge aram qılındı. Eger olarnen (nikâhlanıp da) daa
          birleşmegen olsañız, qızlarını aluvıñızda sizge bir zarar yoq. Özüñizden olğan
          oğullarıñıznıñ qadınları ve eki qız qardaşnı birden almaq da sizge aram qılındı;
          ancaq keçken keçmiştir. Allah çoq bağışlayıcı ve merhametlidir. (Ayetniñ
          «nikâhlanıp da, birleşmegen qadınlarnıñ qızlarınen evlenüviñizde zarar yoq»
          manasındaki qısmından maqsat, anası nikâhlı olğanda, onıñ qızını da almaq degil.
          Caiz olğanı - bir erkekniñ nikâhlap da, özünen birleşmeden, ayırılğan qadınnıñ
          başqasından olğan qızınen evlenmektir. Ayette evlenilmesi kesen-kes olaraq
          yasaqlanğanlardan başqa, aqarabanen evlenmek bazı şart ve zaruriyetler
          sebebinen, caiz qılınmaqnen beraber, hadisler aqaraba olmağanlarnen evlenüvni
          tevsiye eteler).
        cid: 0
  - verse: 24
    segments:
      - text: >
          (Cenkte esir olaraq) saip olğan cariyeleriñiz istisna, evli qadınlar da sizge
          aram qılındı. Allahnıñ sizge emiri budır. Bulardan başqasını namuslı olmaq ve
          zina etmemek üzre, mallarıñıznen (mehirlerini bererek) isteyüviñiz sizge elâl
          etildi. Olardan faydalanuvıñızğa qarşılıq qararlaştırılğan mehirlerni beriñ.
          Mehir kesilgenden soñ, (bir miqdar eksiltüv içün) qarşılıqlı añlaşuvıñızda sizge
          günah yoqtır. Şübesiz, Allah ilim ve ikmet saibidir. (Bazı dinlerde ve olarğa
          tayanğan uquqlarda qadın özünen evlenecek erkekke bermek üzre, mal (drahoma -
          pridaniye) edinir; yani bu sayede erkeklerniñ özüne rağbet etüvlerini
          teminlemege areket eter. İslâmda ise, qadın öz-özlüginden degerlidir. Onıñ
          malına degil, özüne rağbet etilir. Bunı simvolika etmek üzre de, qadın degil
          onıñnen evlenmek istegen erkek oña bir şeyler berir ki, buña mehir denilgen).
        cid: 0
  - verse: 25
    segments:
      - text: >
          Arañızdan imanlı ür qadınlarnen evlenmege küçü yetmegen kimse, elleriñiz altında
          olğan imanlı yaş qızlarıñız (sayılğan) cariyeleriñizden alsın. Allah siziñ
          imañıznı daa yahşı bilmekte. Ep aynı tamırdansıñız (insanlıq noqtai nazarından
          arañızda farq yoqtır). Öyle ise, iffetli yaşavları, zina etmemeleri ve gizli
          dost da tutmamaları şartı ve saipleriniñ izninen, olarnı (cariyelerni) nikâhlap
          alıñ, mehirlerini de kerek mıqdarda beriñ. Evlengenden soñ, bir faişelik
          yapsalar, olarğa ür qadınlarnıñ cezasınıñ yarısı (tadbiq etilir). Bu, (cariyenen
          evlenmek içün), arañızdan günahqa tüşmekten qorqqanlar içündir. Sabır etivüñiz
          ise, siz içün daa hayırlıdır. Allah çoq bağışlayıcı ve merhametlidir. (Zina
          kesen-kes olaraq aramdır. Bir ücret qarşılığında añlaşaraq, keçici bir zaman
          içün evlenmek dinge köre doğru degil. Nikâhsız yaşamaq ve dost tutmaq da,
          zinanıñ başqa çeşitleridir. Bir musulmannıñ evlenmek itiyacına nisbeten yapacaq
          şeyi, imkânı olsa, evelâ bir mü'min ve ür qadınnen evlenmektir; musulman olmağan
          ehl-i kitap qadınlarınen evlenüvi de caizdir. Soñra, sırasınen mü'min cariye ve
          mü'min olmağan cariyenen evlenmek kelir. Cariye bir başqasına ait olğanı içün,
          onıñnen evlenmekniñ bazı sıñırlavları bar; bu sebepnen, cariyenen evlenüvde
          sabır etip, imkânnıñ doğuvını beklemek insan içün daa hayırlıdır. Ayetniñ
          cariyelerge «qızlarıñız» degen ve «bütün insanlarnıñ bir tamırdan kelgenlerini,
          insan evlâdı olğanlarını» tüşünerek, olarnıñ hor körülmemesini, olarnen
          evlenmekten çekinilmemesini istegen qısmı, İslâmnıñ insanğa bergen degeri noqtai
          nazarından, müim vesiqalar maiyetindedir. Cenk esirleri içün yalıñız alternativ
          - qullıq ve cariyelik degil. Esir, qul ve cariye statusına keçirilgen olsa, bu
