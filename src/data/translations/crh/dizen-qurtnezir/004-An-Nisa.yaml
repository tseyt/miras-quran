      - text: "Namaznı bitirgen soñ da, ayaq ustünde, oturğan alda ve yanbaş uzerinde yataraq (daima) Allaһnı añıñ. Uzurğa qavuşqanıñıznen de, namaznı dos-doğru qılıñ; çünki, namaz mu’minler uzerine vaqıtları belli bir farzdır. (Bu uç ayet yolculıqta ve telükeli vaziyetlerde namaznıñ nasıl qılınuvını añlata. Sunnet ve tedbiqattan añlaşılğanına kore, yolculıq alında dört rekâtlı namazlarnı qısqartıp, eki rekât qılınuvı içün duşman telükesi şart degil. Seksen ile doqsan kilometrlik bir mesafeni keçmek uzre, yolğa çıqqan er bir musulman bu izinden faydalanır. Duşman ya da beklenilgen telüke qarşısında qılınğan farz namaznıñ ayette eki rekât olaraq tarif etilüvi ordunıñ aynı vaqıtta seferiy oluvındandır. Bu vaziyette cemaatnen namaznıñ nasıl qılınuvı mevzusında eki çeşit tadbiqat bar. Hanefiylerge kore, birliklerniñ bir qısmı duşman qarşısında turğanda, diger qısmı kelip, imamnıñ artında namazğa turar, birinci rekât tamam olğanınen, yerlerine barırlar ekinci qısım kelir ve imamnen bir rekât da olar qılar, birnicilernen yer deñişirler. Bu sırada imamnıñ namazı tamamlanır. Bular imamnıñ artında turğan kibi (oqumadan) namazlarını tamamlar ve yerlerine barırlar. Diger qısım ise, kelerek ya da yerlerinde -qalğan rekâtnı qılğanı kibi- oquyaraq, namazlarını tamamlarlar. Şafiy ve Malikiylerge kore, birinci gruppa imamnen ilk rekâtnı qılğanınen, imam ekinci rekâtnıñ qıyayamında bekler, bular namazlarını tamamlap, yerlerine keterler ve ekinci gruppa kelir, imamnen bir rekât qılar, imam soñ oturışta olarnı bekler, qalqıp bir rekât daa qılarlar ve imamnen beraber selâm berirler. Namaz eñ buyuk zikrdir. Allaһnı añuv şekillerinden eñ mukemmelidir. Aql yetken kimse içün onı terk etmekniñ aman iç bir uzüri yoq. Tarlıq vaqıtlarında ruhsetler ve qolaylıqlar bar. Kenişlik ve uzur zamanlarında ise, vaqıt ve erkânına riayet etüvnen tam olaraq qılınır. Allaһnı añmaq yalıñız namazğa ait olmamalı, musulman er angi alında Allaһnı añmaqtan ğafil olmamalı)."
