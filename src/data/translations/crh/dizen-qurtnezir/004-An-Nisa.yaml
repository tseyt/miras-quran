      - text: >-
          (İslâmnıñ miras uquqında paylar ile mükellefiyetler arasında musaviylik yolu
          tutulğan, daa çoq arclama yapmaq mecburiyetinde olğanlarğa çoq, daa az arcalama
          vaziyetinde olğanlarğa az isse berilgen. İslâm aile uququna köre, evlengende mehir
          berecek, dügün masrafı yapacaq - erkektir. Evlengenden soñ, ister muhtac olğan yaqın
          aqrabasına ve ister çifti ve balalarına baqacaq, olarğa aşaycaq, kiyecek, mesken
          kibi eñ az itiyaclarını teminleycek - kene erkektir. İşte, bu sebeplerden ki, esas
          olaraq mirasta erkeklerniñ payı, qadınlarnıñkinden eki qat ziyade olğan).
