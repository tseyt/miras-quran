          ise, bir reberni, bir idarecini zaruriy tanır. İslâmda devlet reberinden aile
          reisine qadar er idareci ilâhiy talimatqa köre areket etmek, yönetmek
          mecburiyetindedir; o alda, olarğa itaat - bu talimatqa itaat demektir. İdare etici
          ya da etilici bu talimattan tışqa çıqsa, itaatsızlıq etse, ceza tedbiq etilir. Bu
          yerde baas mevzusı olğan zevceniñ itaatsızlığdır. Çare olaraq evelâ ögüt bermek, soñ
          töşek ayırmaq ve daa soñra da, dögmek tevsiye etilgen. Qur'annı bizge tebliğ etken
          Az. Peyğamber (s.a.) iç bir vaqıt qadın dögmegeni kibi, «Qadınnı eşek döggen kibi
          dögüp de, künniñ soñunda onı qoynuñızğa alıp yatuvıñız olacaq şeymi?», buyuraraq,
          ümmetini tenbiyelegen. Dögmek cezası qullanılğan taqdirde, qadınnıñ canını yaqmaycaq
          ve vucudında iz qaldırmaycaq şekilde yapıluvı da ifade etilgen. Şu alda tayaqnı
