          añlayışqa köre, Allah onı yeudiylerden qorçalağan, eceli kelgeninen, onı vefat
          ettirgen. Ve ruhunı semadaki yerine kötergen. Qıyametten evel kelecek de onıñ
          ruhudır. Ehl-i kitaptan olğanlar ölümlerinden evel aqiqatnı ögrenip inanacaqlar,
          faqat bunıñ faydası olmaycaq. Bu añlayış üçünci sureniñ 54-56-nci ayetlerine
          esaslandırılğan).
