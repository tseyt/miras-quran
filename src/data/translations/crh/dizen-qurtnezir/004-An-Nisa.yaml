          imkânları olğanı alda, imanlarını qurtarmağa ve İslâm devletini quvetlendirmege
          çapmayıp, evini-barqını, yurtunı, qadınını, dostunı, mal ve mülküni qıymağanlarnıñ
          ve çaresizlik manasınen vaziyetni idare etkenlerniñ facialı aqibetini ayet tasvir
          etmekte. Bulardan soñ sırasınen kerçekten aciz olğanlar, icretke teşebbüs etip de,
          Medinege baralmayıp, yolda ölgenler ve icret yurtuna qavuşqanlar kelir. Buhariy
          rivayet etken bir hadiske köre, Mekke fethinden soñ icret etüv mecburiyeti ortadan
          qaldırılğan. Ancaq ayet, şartlar avdet etse, icret etüv mecburiyetiniñ de avdet
          etecegine işarettir).
