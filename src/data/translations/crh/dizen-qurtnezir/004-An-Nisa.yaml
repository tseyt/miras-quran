      - text: >-
          (İslâm ceza uququna köre, bir musulmannı aqsız yerde ve bilerek öldürgen kimseniñ
          cezası qasastır, yani ölüm cezasıdır. Bunı afu etmek aqqı yalıñız öldürilgenniñ
          ailesine aittir; olar istese, qasas yerine diyet (aq) talap eterler, ve isteseler,
          er ekisini de bağışlarlar. Bu taqdirde, devletniñ tazir yolunen -daa yengil bir
          şekilde- cezalandıruvğa aqqı bar. Qasasnen bağlı ayet 2-nci surede (178-179) keçti .
          Bu yerdeki ayet ise, maneviy ve uhreviy cezanı añlatmaqta. Bir mü'minni
          yañlışlıqnen, meselâ, av ayvanı zan eterek ya da cenkçi duşman sanaraq... öldürgen
          kimseniñ de maddiy ve maneviy cezaları bar; bu cezalar ölü mensüp olğan toplumğa
          köre deñişir. Ölüniñ ailesi musulman ise, öldürgenge eki ceza berilir: 1). Ölüniñ
          ailesine berecek diyet; bu da yüz deve ya da bunıñ başqa mallardan qarşılığı qadar
          bir vergidir. Diyetni öldürgenniñ ailesi öder, olarnıñ küçü yetmese, devletke
          muracaat eter, maliyeniñ ödemesini talap eterler. 2. Yañlışlıqnen olsa da, bir
          insannı ğayıp etkeni içün, bir mü'min qulnı ürriyetke qavuştırmaq suretinen,
          toplumğa ilâve etecek ür bir ayattır. Qul azat etmege küçü yetmegenler ise, eki ay
          bir-biri artından oraza tutarlar. Ölüniñ ailesi musulmanlarğa duşman bir toplum ise,
          olarğa mal bererek, quvetlendirmek musulmanlarnıñ aleyhine olacağı içün, aq
          ödenmez).
