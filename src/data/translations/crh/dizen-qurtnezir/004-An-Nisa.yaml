      - text: >-
          (Bu üç ayet yolculıqta ve telükeli vaziyetlerde namaznıñ nasıl qılınuvını añlata.
          Sünnet ve tedbiqattan añlaşılğanına köre, yolculıq alında dört rekâtlı namazlarnı
          qısqartıp, eki rekât qılınuvı içün duşman telükesi şart degil. Seksen ile doqsan
          kilometrlik bir mesafeni keçmek üzre, yolğa çıqqan er bir musulman bu izinden
          faydalanır. Duşman ya da beklenilgen telüke qarşısında qılınğan farz namaznıñ ayette
          eki rekât olaraq tarif etilüvi ordunıñ aynı vaqıtta seferiy oluvındandır. Bu
          vaziyette cemaatnen namaznıñ nasıl qılınuvı mevzusında eki çeşit tadbiqat bar.
          Hanefiylerge köre, birliklerniñ bir qısmı duşman qarşısında turğanda, diger qısmı
          kelip, imamnıñ artında namazğa turar, birinci rekât tamam olğanınen, yerlerine
          barırlar ekinci qısım kelir ve imamnen bir rekât da olar qılar, birnicilernen yer
          deñişirler. Bu sırada imamnıñ namazı tamamlanır. Bular imamnıñ artında turğan kibi
          (oqumadan) namazlarını tamamlar ve yerlerine barırlar. Diger qısım ise, kelerek ya
          da yerlerinde -qalğan rekâtnı qılğanı kibi- oquyaraq, namazlarını tamamlarlar. Şafiy
          ve Malikiylerge köre, birinci gruppa imamnen ilk rekâtnı qılğanınen, imam ekinci
          rekâtnıñ qıyamında bekler, bular namazlarını tamamlap, yerlerine keterler ve ekinci
          gruppa kelir, imamnen bir rekât qılar, imam soñ oturışta olarnı bekler, qalqıp bir
          rekât daa qılarlar ve imamnen beraber selâm berirler. Namaz eñ büyük zikrdir.
          Allahnı añuv şekillerinden eñ mükemmelidir. Aqlı yetken kimse içün onı terk etmekniñ
          aman iç bir üzüri yoq. Tarlıq vaqıtlarında ruhsetler ve qolaylıqlar bar. Kenişlik ve
          uzur zamanlarında ise, vaqıt ve erkânına riayet etüvnen tam olaraq qılınır. Allahnı
          añmaq yalıñız namazğa ait olmamalı, musulman er angi alında Allahnı añmaqtan ğafil
          olmamalı).
        cid: 0
