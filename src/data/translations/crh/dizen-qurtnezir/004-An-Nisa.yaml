      - text: >-
          (Hristianlar bir türlü Allahnıñ birligi (tevhid) inançına kelalmağan, Allahnen
          peyğamberini bir-birinden ayıralmağanlar. Az. Musa ve Az. İsa ehl-i kitapqa tevhid
          inançını ketirgeni alda, soñradan sapqan bu toplumlar Hatemu'l enbiyanıñ sağlam ve
          aydınlatıcı beyanlarına rağmen, çoqu kerçekni qabul etmegenler. Hristianlar: «Allah
          - baba, oğul ve ruhu'l qudustan ibaret olmaq üzre, üçtir», yahut «Allah üç unsurdan
          meydanğa kelgendir, bularnıñ üçü de bir-biriniñ aynıdır, er biri tam ilâhtır ve üçü
          birden tek bir tañrıdır», diyerek qapa-qarşılıqqa tüşerler. Yuqarıdaki ayetler
          olarnı aqiqiy Allah inançı üzerinde aydınlatmaq içün kelgen. Ayette Az. İsa içün
          «Allahtan bir ruh» ve «Allahnıñ kelimesi» denilgen. Aal-i İmraan suresiniñ 45-47-nci
          ayetlerinde ekinci vasıf añlatılğan, bundan maqsat - Allahnıñ «Ol!», deyüvinden
          ibaret olğanı bildirilgen, Az. İsanıñ mucizeviy bir şekilde yaratılğanı beyan
          etilgen. Meryem suresiniñ 17-nci ayetinden itibaren de birinci vasıf beyan etilgen,
          «Ruh»nıñ Cebrail olğanına işaret etilgen).
