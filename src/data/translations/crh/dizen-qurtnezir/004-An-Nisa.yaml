      - text: >-
          (Uquq sistemaları - varislerniñ alacaq paylarında olğanı kibi, yaqınlıq ve uzaqlıq
          derecelerine köre, aqrabanıñ varis olıp-olmağanını tayin etüv meselesinde de, farqlı
          qabul ve tadbiqlarnı menimsegenler. Meselâ, İslâmdan başqa bazı sistemalarda
          ölgenniñ balaları olsa, ana-babası varis olamaylar. İslâm miras uquqı paylarnı
