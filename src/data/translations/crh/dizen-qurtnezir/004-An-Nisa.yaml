surah_id: 4
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "Yalıñız söznen qanmayıp, alını tüzeltmek,"
        cid: 0
  - verse: 2
    segments:
      - text: "Allaһqa ve Onıı Kitap ve Sunnette ortağa çıqqan iradesine sım-sıqı bağlanmaq,"
        cid: 0
  - verse: 3
    segments:
      - text: "Diniy ayatını insanlarnıı rizası ve dünya menfaatları içün degil, yalıñız Allaһ rizası içün yaşamaq. İşte, bular samimiy ve sağlam bir imannıı tabiiy neticeleridir)."
        cid: 0
  - verse: 4
    segments:
      - text: "Qadınlarğa mehirlerini goñyul rizası ile (cumertçe) beriñ; eger goñyul hoşluğı ile o mehirniñ bir qısmını sizge bağışlasalar, onı da afiyetnen aşañ."
        cid: 0
  - verse: 5
    segments:
      - text: "Allaһnıñ keçinişiñizge destek yapqan mallarıñıznı aqılı irmegenlerge (aqıl-baliğ olmağanlarğa) bermeñ; o mallarnen olarnı besleñ, kiydiriñ ve olarğa guzel söz söyleñ."
        cid: 0
  - verse: 6
    segments:
      - text: "Evlilik çağına kelgenge qadar yetimlerni (kozetip) deñyeñ, eger olarda aqılda bir pişkinleşüv korseñiz, aman mallarını ozlerine beriñ. Buyuycekler (de, qaytarıp alacaqlar,) diye o mallarnı israfnen ve aşıqıp yemeñ. Zengin olğan (veli) iffetli olmağa areket etsin, yoqsul olğanda (itiyacı ve emegine) uyğun olaraq aşasın. Mallarını ozlerine bergen vaqtıñızda yanlarında şaat bulundırıñ. Esap soraycaq olaraq da, Allaһ kâfidir."
        cid: 0
  - verse: 7
    segments:
      - text: "Ana-babanıñ ve aqrabalarnıñ qaldırğanlarından erkeklerge bir pay bar; anababanıñ ve aqrabalarnıñ qaldırğanlarından qadınlarga da bir pay bar. İster azından, ister çoqundan, belli bir isse ayırılğandır."
        cid: 0
  - verse: 8
    segments:
      - text: "(Mirastan payı olmağan) aqrabalar, yetimler ve yoksullar miras taqsimatında azır bulunsa, bundan olarnı da rızıqlandırıñ ve olarğa guzel söz söyleñ. (Bu eki ayetten birincisi cahiliyet deviri adetlerini yıqaraq, mirastan qadınnıñ da payı olğanını, Allaһnıñ olar içün ayırğan bu paynıñ mıtlaqa ozlerine berilüvi kerekligini ifade etmekte. Ekinci ayet vise, İslâm ketirgen eñ keniş qardaşlıq ve eñ insaniy tayanışma añlamı ve içtimaiy adalet priniipi içinde mirasta payı olmağan -nisbeten- uzaq aqaraba, o civarda bulunğan faqır-fuqarege de mirastan bir şeyler berilüvini, goñyulleriniñ alınuvını, emeksiz elde etilgen servetke nisbeten peyda olacaq menfiy duyğularnıñ ogü alınuvını emir emtekte)."
        cid: 0
  - verse: 9
    segments:
      - text: "Aciz, kuçü yetmez balalar qaldırğan taqdirlerinde (alları ne olur) diye, qorqacaqlar (etimlerge aqsızlıq etüvden) qorqıp titresinler; Allaһtan saqınsınlar ve doğru söz söylesinler. (Etimlerniñ veli ve vasileri, olarğa oz balalarına davranıluvını istegenleri kibi davranmaldırlar; çünki, oz balaları da bir kun yetim ve çaresiz qala bilirler)."
        cid: 0
  - verse: 10
    segments:
      - text: "Aqsızlıqnen yetimlerniñ mallarını aşağanlar, şubesiz, qarınlarına ancaq ateş tıqqan olurlar; zaten olar alevlengen ateşke kirecekler."
        cid: 0
  - verse: 11
    segments:
      - text: "Allaһ sizge, balalarıñız aqqında, oğulğa qız payınıñ eki qatını (miras berüviñizni) emir ete. (Balalar) ekiden ziyade qız olsa, olüniñ qaldırğanınıñ uçte ekisi olarnıñdır. Eger yalıñız bir qız ise, yarısı onıñdır. Olgenniñ balası bar ise, ana-babasından er biriniñ mirastan altıda bir issesi bar. Eger balası yoq da, ana-babası oña varis olğan ise, anasına uçte bir (tüşer). Eger olgenniñ qardaşları bar ise, anasına altıda bir (tüşer. Butün bu paylar olgenniñ) yapacaq vasiyetinden ve borc odelgen soñdır. Babalarıñız ve oğullarıñızdan angisiniñ sizge fayda noqtai nazardan daa yaqın olğanını bilalmazsıñız. Bular Allaһ tarafından qoyulğan farzlardır (paylardır). Şubesiz, Allaһ ilim ve ikmet saibidir. (İslâmnıñ miras uquqında paylar ile mukellefiyetler arasında musaviylik yolu tutulğan, daa çoq arclama yapmaq mecburiyetinde olğanlarğa çoq, daa az arcalama vaziyetinde olğanlarğa az isse berilgen. İslâm aile uququna kore, evlengende mehir berecek, dügün masrafı yapacaq - erkektir. Evlengenden soñ, ister muhtac olğan yaqın aqrabasına ve ister çifti ve balalarına baqacaq, olarğa aşaycaq, kiyecek, mesken kibi eñ az itiyaclarını teminleycek - kene erkektir. İşte, bu sebeplerden ki, esas olaraq mirasta erkeklerniñ payı, qadınlarnıñkinden eki qat ziyade olğan)."
        cid: 0
  - verse: 12
    segments:
      - text: "Yapacaq vasiyetten ve borctan soñ, çiftleriñizniñ, eger balaları olmasa, qaldırğanlarınıñ yarısı siziñdir. Balaları olsa, qaldırğanlarınıñ dörtte biri siziñdir. Balañız olmasa, siziñ de yapacaq vasiyetiñizden ve borctan soñ, qaldırğanıñıznıñ dörtte biri olarnıñdır (zevceleriñizniñdir). Balañız olsa, qaldırğanıñıznıñ sekizde biri olarnıñdır. Eger bir erkek ve qadınnıñ, ana-babası ve balaları olmağanı alda, (kelâle şeklinde) malı mirasçlıarğa qalsa ve bir oğlan ya da qız qardaşı olsa, er birine altıda biri tüşer. Bundan ziyade olsalar, uçte birge ortaqtırlar. (Bu taqsimat) yapılacaq vasiyetten ve borctan soñ, kimse zararğa oğratılmadan (yapılacaq). Bular Allaһtan sizge vasiyettir. Allaһ er şeyni haqqı ile bilicidir, halimdir. (Kelâli şeklinde, malnı yan hısımlarına qalğan kimselerniñ paylarını añlatqan qısımda keçken oğlan qardaş ve qız qardaş - ana bir qardaşlardır. Tuvğan qardaşlarnıñ vaziyeti sureniñ soñunda añlatılacaq)."
        cid: 0
  - verse: 13
    segments:
      - text: "Bular Allaһnıñ (qoyğan) sıñırlarıdır. Kim Allaһqa ve Peyğamberine itaat etse, Allaһ onı zemininden irmaqlar aqqan cennetlerge qoyacaq; o yerde daimiy qalıcılardır; işte, buyuk qurtulış budır."
        cid: 0
  - verse: 14
    segments:
      - text: "Kim Allaһqa ve Peyğamberine qarşı isyan etse ve sıñırlarını aşsa, Allaһ onı daimiy qalacaq bir ateşke soqar ve onıñ içün alçaltıcı bir azap bardır. (Uquq sistemaları - varislerniñ alacaq paylarında olğanı kibi, yaqınlıq ve uzaqlıq derecelerine kore, aqrabanını varis olıp-olmağanını tayin etüv meselesinde de, farqlı qabul ve tadbiqlarnı menimsegenler. Meselâ, İslâmdan başqa bazı sistemalarda olgenniñ balaları olsa, ana-babası varis olamaylar. İslâm miras uquqı paylarnı dağıtqanda, adil musaviylik esasına riayet etkeni kibi, varislerni tayin etkende de, yaqınlıq derecesinen beraber, faydanı koz ogüne alğan, dünya ve ahiret ayatında olüge faydası toqunğan ve toqunacaq aqrabanı mirastan mahrum etmegen)."
        cid: 0
  - verse: 15
    segments:
      - text: "Qadınlarıñızdan faişelik yapqanlarğa nisbeten arañızdan dört şaat ketiriñ. Eger şaatlıq etseler, o qadınlarnı olüm alıp ketkence ya da Allaһ olarğa bir yol açqanğace, evlerde aps etiñ."
        cid: 0
  - verse: 16
    segments:
      - text: "Arañızdan fuhuş yapqan er eki tarafqa ceza beriñ; eger tövbe etse, uslansalar, artıq olarğa ceza berip, eziyet etüvden vazgeçiñ; çünki, Allaһ tövbelerni çoq qabul etici ve çoq merhametlidir. (Bu eki ayet fuhuş denilgen çirkin fiil ile bağlıdır. Tefsircilerniñ çoqu er ekisi de zina şeklindeki fuhuşqa ait olup, birincisi evlengenlerniñ zinası, ekincisi ise, bekârlarnıñ zinası aqqında ilk devirlerde tedbiq etilgen cezanı añlatmaqta. Daa soñra kelgen ayet (Nuur, 24/2) ve hadislernen Az. Peyğamberniñ tedbiqlerine kore, bu ayetler nesh etilgen, bekârlarnıñ zinası içün belli sayıda sopa, evlilerniñ zinası içün «recsm» cezası tayin etilgen. Bazı tefsircelerge kore ise, ayetler nesh etilmegen; yani ukümleri areketten toqtatılmağan; bu ayetlerden birincisi qadınlar arasındaki sevicilik faişeligine, ekinci ayet ise, erkekler arasındaki livata faişeligine ait. Bularnıñ cezası ayetlerde olğanı kibidir. Qadınnen erkek arasındaki zina fuhuşınıñ cezası ise, Nuur suresindeki ayette beyan etilgen)."
        cid: 0
  - verse: 17
    segments:
      - text: "Allaһnıñ qabul etecegi tövbe, ancaq bilmeyip fenalıq yapıp da, soñra tez tövbe etkenlerniñ tövbesidir; işte, Allaһ bularnıñ tövbesini qabul eter; Allaһ er şeyni bilicidir, ikmet saibidir."
        cid: 0
  - verse: 18
    segments:
      - text: "Yoqsa, fenalıqlarnı yapıp da, aralarından birisine olüm kelip çatqanınen: «Men şimdi tövbe ettim», degenlernen kâfir olaraq olgenler içün (qabul etilecek) tövbe yoqtır. Olar içün accı bir azap azırlağandırmız."
        cid: 0
  - verse: 19
    segments:
      - text: "Ey, iman etkenler! Qadınlarğa zornen varis oluvıñız, sizge elâl degil. Açıqtan-açıq bir edepsizlik yapmağance, olarğa bergeniñizniñ bir qısmını elge keçirüviñiz içün de qadınlarnı sıqıştırmañ. Olarnen eyi keçiniñ. Eger olardan hoşlanmasañız, (biliñ ki,) Allaһnıñ aqqıñızda çoq hayırlı yapacaq bir şeyinden de hoşlanmağan ola bilirsiñiz. (İslâmdan evel araplar qadınğa çoq fena muamele eter, bu cumleden, qacası olgen qadınnı, onıñ miras qaldırğan malı kibi qabul ete, qadın istemse bile, onıñnen evlenmek ya da onı baiqasına evlendirmek aqqına saip olğanlarını tüşüne, qadınnı qullanaraq, maddiy menfaat kormek yoluna kire ediler. Ayet butün bu aqsızlıqlarğa soñ berdi, qadınğa lâyıq olğan aqlarnı ketirdi)."
        cid: 0
  - verse: 20
    segments:
      - text: "Eger bir qadınnı taşlap da, yerine başqa bir qadın almaq isteseñiz, olardan birine yuklernen mehir bergen olsañız dahi, ondan iç bir şeyni keri almañ. Siz iftira eterek ve açıqtan-açıq gunah işleyerek, onı keri alırsıñızmı? (İslâmda erkek evlenecek qadınğa mehir adınen bir mal berir. Bunıñ miqdarı urf, adet ve teñyeşine kore tayin etilir. Mehir qadınnıñ aqqı, onıñ hususiy malıdır, peşin berilmegen olsa, qocası ayırğanda ya da olgen vaqtında qadınğa der’al odenüvi kerek. Erkeklerniñ çeşit yollar ve iylelernen bu aqnı qısmen ya da tamamınen yeyuvleri, bergenlerini zorlap qaytarıp aluvları diniy taraftan doğru degil)."
        cid: 0
  - verse: 21
    segments:
      - text: "Vaqtı ile siz bir-biriñiznen aşır-neşir olğan ve olar sizden doğru bir teminat alğanı alda, onı nasıl keri alırsıñız. (Bir qadınnen evlenip birleşken ya da birleşecek bir qararda beraber qalğan (halvet olğan) qoca onı ayırğan taqdirde, mehirniñ episini oder. Ayette «Bir-biriñiznen aşır-neşir olğan» denilerek, bularğa işaret etilmekte. Birleşüv ve halvet olmadan ayırılğan alda ise, qadın mehirniñ yarısına aql olur)."
        cid: 0
  - verse: 22
    segments:
      - text: "Keçmişte olğanlar bir yanda, babalarıñıznıñ evlengen qadınlarınen evlenmeñ; çünki bu bir ayasızlıqtır, igrenç bir şeydir ve fena bir yoldır. (İslâmdan evel araplarnıñ ogey analarınen evlenüv şeklindeki çirkin bir adetini ortadan qaldırğan bu ayetten soñ, musulmanlarnıñ baiqa kimselernen evelenüvleriniñ caiz olmağanını añlatmaq uzre, boyle buyurıla:)"
        cid: 0
  - verse: 23
    segments:
      - text: "Analarıñız, qızlarıñız, qız qardaşlarıñız, alalarıñız, teyzeleriñiz, qardaş qızları, qız qardaşnıñ qızları, sizni emizgen analarıñız, süt tatalarıñız, qadınlarıñıznıñ anaları, ozleriñiznen birleşken çiftleriñizden olup, evleriñizde bulunğan ogey qızlarıñız sizge aram qılındı. Eger olarnen (nikâhlanıp da) daa birleşmegen olsañız, qızlarını aluvıñızda sizge bir zarar yoq. Ozüñizden olğan oğullarıñıznıñ qadınları ve eki qız qardaşnı birden almaq da sizge aram qılındı; ancaq keçken keçmiştir. Allaһ çoq bağışlayıcı ve merhametlidir. (Ayetniñ «nikâhlanıp da, birleşmegen qadınlarnıñ qızlarınen evlenüviñizde zarar yoq» manasındaki qısmınıdan maqsat, anası nikâhl olğanda, onıñ qızını da almaq degil. Caiz olğanı - bir erkekniñ nikâhlap da, ozünen birleşmeden, ayırılğan qadınnnıñ başqasından olğan qızınen evlenmektir. Ayette evlenilmesi kesen-kes olaraq yasaqlanğanlardan başqa, aqarabanen evlenmek bazı şart ve zaruriyetler sebebinen, caiz qılınmaqnen beraber, hadisler aqaraba olmağanlarnen evlenüvni tevsiye eteler)."
        cid: 0
  - verse: 24
    segments:
      - text: "(Cenkte esir olaraq) saip olğan cariyeleriñiz istisna, evli qadınlar da sizge aram qılındı. Allaһnıñ sizge emiri budır. Bulardan başqasını namuslı olmaq ve zina etmemek uzre, mallarıñıznen (mehirlerini bererek) isteyuviñiz sizge elâl etildi. Olardan faydalanuvıñızğa qarşılıq qararlaştırılğan mehirlerni beriñ. Mehir kesilgenden soñ, (bir miqdar eksiltüv içün) qarşılıqlı añlaşuvıñızda sizge gunah yoqtır. Şubesiz, Allaһ ilim ve ikmet saibidir. (Bazı dinlerde ve olarğa tayanğan uquqlarda qadın ozünen evlenecek erkekke bermek uzre, mal (drahoma - pridaniye) edinir; yani bu sayede erkeklerniñ ozüne rağbet etüvlerini teminlemege areket eter. İslâmda ise, qadın oz-ozlüginden degerlidir. Onıñ malına degil, ozüne rağbet etilir. Bunı simvolika etmek uzre de, qadın degil onıñnen evlenmek istegen erkek oña bir şeyler berir ki, buña mehir denilgen)."
        cid: 0
  - verse: 25
    segments:
      - text: "Arañızdan imanlı ur qadınlarnen evlenmege kuçü yetmegen kimse, elleriñiz altında olğan imanlı yaş qızlarıñız (sayılğan) cariyeleriñizden alsın. Allaһ siziñ imañıznı daa yahşı bilmekte. Ep aynı tamırdansıñız (insanlıq noqtai nazarından arañızda farq yoqtır). Oyle ise, iffetli yaşavları, zina etmemeleri ve gizli dost da tutmamaları şartı ve saipleriniñ izninen, olarnı (cariyelerni) nikâhlap alıñ, mehirlerini de kerek mıqdarda beriñ. Evlengenden soñ, bir faişelik yapsalar, olarğa ur qadınlarnıñ cezasınıñ yarısı (tadbiq etilir). Bu, (cariyenen evlenmek içün), arañızdan gunahqa tüşmekten qorqqanlar içündir. Sabır etivüñiz ise, siz içün daa hayırlıdır. Allaһ çoq bağışlayıcı ve merhametlidir. (Zina kesen-kes olaraq aramdır. Bir ucret qarşılığında añlaşaraq, keçici bir zaman içün evlenmek dinge kore doğru degil. Nikâhsız yaşamaq ve dost tutmaq da, zinanıñ başqa çeşitleridir. Bir musulmannıñ evlenmek itiyacına nisbeten yapacaq şeyi, imkânı olsa, evelâ bir mu’min ve ur qadınnen evlenmektir; musulman olmağan ehl-i kitap qadınlarınen evlenüvi de caizdir. Soñra, sırasınen mu’min cariye ve mu’min olmağan cariyenen evlenmek kelir. Cariye bir başqasına ait olğanı içün, onıñnen evlenmekniñ bazı sıñırlavları bar; bu sebepnen, cariyenen evlenüvde sabır etip, imkânnıñ doğuvını beklemek insan içün daa hayırlıdır. Ayetniñ cariyelerge «qızlarıñız» degen ve «butün insanlarnıñ bir tamırdan kelgenlerini, insan evlâdı olğanlarını» tüşünerek, olarnıñ hor korülmemesini, olarnen evlenmekten çekinilmemesini istegen qısmı, İslâmnıñ insanğa bergen degeri noqtai nazarından, muim vesiqalar maiyetindedir. Cenk esirleri içün yalıñız alternativ - qullıq ve cariyelik degil. Esir, qul ve cariye statusına keçirilgen olsa, bu taqdirde olarğa yapılğan muamele ur insanlarnıñkine olduqça yaqın ve maqsattaki hidayetke irişüvlerini teminler)."
        cid: 0
  - verse: 26
    segments:
      - text: "Allaһ sizge (bilmegenleriñizni) añlatmaq ve sizni, sizden evelki (eyi)lerniñ yollarına qavuştırmaq ve siziñ gunahlarıñıznı bağışlamaq istey. Allaһ haqqı ile bilicidir, yekâne ikmet saibidir."
        cid: 0
  - verse: 27
    segments:
      - text: "Allaһ siziñ tövbeñizni qabul etmek ister; şehvetlerine uyğanlar (fena arzularınıñ esiri olğanlar) ise, bus-butün yoldan çıqqanıñıznı isterler."
        cid: 0
  - verse: 28
    segments:
      - text: "Allaһ sizden (üküñizni) azaltmaq ister; çünki, insan zayıf yaratılğandır. (Bu alda diniy teklifler ve vazifeler birer yuk degildir; tam aksine, insannı dünya ve ahiret ayatında çıqımsızlıqqa tüimekten, altından çıqıp olamaycaq ya da ozüne fayda yerine zarar ketirecek iş ve davranışlarğa kirüvden qorçalağan, boylece, yuküni yengilletken alıştıruvlar, tertiper ve doğru yolnı kosterüvlerdir)."
        cid: 0
  - verse: 29
    segments:
      - text: "Ey, iman etkenler! Qarşılıqlı rizağa tayanğan ticaret oluvı alı istisna, mallarıñıznı batıl (aqsız ve aram yollar)nen arañızda (alıp-bererek) aşamañ. Ve ozüñizni oldürmeñ. Şubesiz, Allaһ sizni qorçalaycaqtır."
        cid: 0
  - verse: 30
    segments:
      - text: "Kim duşmanlıq ve aqsızlıqnen bunı (aram aşamaqnı ya da oldürmekni) yapsa, (bilsin ki) onı ateşke atacaqmız. Bu ise, Allaһqa çoq qolaydır. (Qarşılıqlı rizağa tayanğan mal-para, emek-ucret ve buña beñzegen deñişüvler em şahıslar, em de olar teşkil etken toplum içün faydalıdır; bu sebepten de, doğrudır. Razılıqsız ve aqsız qazançlar ise, keçici ferah ve menfaatlar ketirmeknen beraber, artından isyanlar, devirüvler ve felâketler ketirir. Ayet «başqasınıñ malını» demek yerine, «mallarıñıznı» demeknen «milliy servet» manasına yaqındır. Maliy aqsızlıqlarnıñ ketirgen felâketlerinden biri ve, belki, eñ muimi - qatldir; aqsızlıqnen ve aram yollarnen servet yapmaq - şahıs ve cemiyet olaraq, yavaş-yavaş olümge barmaq demektir. Çünki, şahsiy intiqam duyğusı, şahsiy oldirüvlerge yol açar eken, içtimaiy sınıflar arasında intiqam duyğusı da içtimaiy patlavlarğa ve devirüvlerge sebep olmaqta)."
        cid: 0
  - verse: 31
    segments:
      - text: "Eger yasaqlandığıñız buyuk gunahlardan qaçınsañız, siziñ kuçük gunahlarıñıznı ortermiz ve sizni şerefli bir yerge qoyarmız. (İnsanlar, yaratılışlarına kore, gunahtan qorçalanğan degiller, gunah ve qabaat işlemek qabiletleri de bar, faziletleri de. Faziletleri nefsaniy arzularına nisbeten kureşlerinden kelmekte. Qul elinden kelgenni yapkanınen, Mevlâ ufaqtüfek qusurlarını ortecek, yuzlemeycek)."
        cid: 0
  - verse: 32
    segments:
