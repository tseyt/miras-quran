    segments:
      - text: "Bunıñ uzerine, Rabbleri olarnıñ dualarını qabul etti. (Dedi ki:) Men erkek olsun, qadın olsun -ki, ep bir-biriñizdensiñiz- arañızdan, çalışqan iç bir kimseniñ yapqanını boşuna çıqarmaycam. Olar ki, icret ettiler, yurtlarından çıqarıldılar, menim yolumda eziyetke oğradılar, cenkleştiler ve oldürildiler; ant olsun, men de olarnıñ fenalıqlarını ortecem ve olarnı altlarından irmaqlar aqqan cennetlerge qoyacam. Bu mukâfat Allaһ tarafındandır. Allaһ; qarşılıqnıñ guzeli Onıñ qatındadır."
        cid: 0
  - verse: 204
    segments:
      - text: "İnkârcılarnıñ (ferah içinde) diyar-diyar dolaşuvı saqın seni aldatmasın! (Bazı mu’minlerniñ muşriklerni keniş maddiy imkânlar içinde korüvleri sebebinen: «Korgenimizge baqılsa, Allaһnıñ duşmanları uzur içinde, biz ise, sıqıntıdamız», deyuvleri, bu ayetniñ engenine sebep olaraq kosterilgen. Elbette ki, bu ve oña beñzegen tenbiyelernen Az. Peyğamberniñ şahısında butün mu’minlerge seslenilmekte)."
        cid: 0
  - verse: 205
    segments:
      - text: "Azaçıq bir menfaattır o. Soñra olarinı baracaq yerleri ceennemdir. O ne fena barılacaq yerdir!"
        cid: 0
  - verse: 206
    segments:
      - text: "Faqat Rabblerine qarşı kelüvden saqınğanlar içün Allaһ tarafından bir ikram olaraq altlarından irmaqlar aqqan, ebediy olaraq qalacaq cennetleri bardır. Eyi insanlar içün Allaһ qatındaki (nimetler) daa hayırlıdır."
        cid: 0
  - verse: 207
    segments:
      - text: "Ehl-i kitaptan oyleleri bar ki, Allaһqa, em sizge endirilgenge, em de ozlerine endirilgenge tam bir samimiyetliknen ve Allaһqa boyun egerek, iman eterler. Allaһnıñ ayetlerini az bir parağa satmazlar. İşte, olar içün Rabbleri qatında ecirleri bar. Şubesiz, Allaһnıñ esabı çabiktir."
        cid: 0
  - verse: 208
    segments:
      - text: "Ey, iman etkenler! Sabır etiñ; (duşman qarşısında) sebat kosteriñ; (cihad içün) azırlıqlı ve açıqkoz oluñ ve Allaһtan qorquñ ki, muvafaqiyetke irişe bilirsiñiz."
