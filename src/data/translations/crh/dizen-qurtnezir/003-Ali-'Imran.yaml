          ilimde yüksek derecege irişkenler bilir». Bu manağa köre, Qur'andaki müteşaabih
          ayetlerniñ manaları zaman içinde ilimniñ inkişafınen çezilecek. Muhkem ve müteşaabih
          - terminler olup, «muhkem ayet» - manası açıq añlaşılğan ve şübege yol bermegen ayet
          demektir. «Müteşaabih» ise - muhkemniñ aksidir ve manası tam olaraq añlaşuvı mümkün
          olmağan ayetni ifade ete).
