      - text: >-
          (İman etmegen ve dinniñ darqaluvına, adaletniñ tedbiq etilüvine mani oluvğa
          çalışqanlarnıñ, ahirette zararğa oğraycaqları tabiiydir. Dünyadaki zararları ise,
          bütün ğayretlerine rağmen haq dinniñ darqaluvına, adeletniñ ortağa çıquvına mani
          olalmayuvlarında özüni köstermekte. Kâfirler istese de, istemese de, Allah haq dinni
          digerlerine hakim yapacaq. Amelniñ dünyada boşuna ketüviniñ bir manası da, ömür
          sermayesini boşuna arcalamaq, ahiret içün bir şey qazanmadan, ölüp ketmektir).
          (Tefsirlerde aşağıda manası berilgen ayetniñ nazil oluvına sebep çeşit vaqialar
          añlatılğan ki, bu vaziyetlerden biri böyledir: Ekisi de yeudiy olğan bir qadınnen
          bir erkek zina yapalar. Tevratta zinanıñ cezası «recim» olmaqnen beraber, yeudiyler,
          asaletleriniñ sebebinen, bu kişilerni recim etmek istemeyler; daa yengil bir ceza
          berilecegi ümüdinen Resulullahqa keleler. O da aynı cezanen üküm etkeninen, bu
          ükümge itiraz bildireler. Buña köre, Az. Peyğamber Tevratnıñ ait ayetini oqutaraq,
          oña köre üküm bere ve qabaatlılarnıñ kene recim etilüvini emir ete. Ümütlerine nail
          olmağan yeudiyler buña öpkeleneler).
