surah_id: 3
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "Elif. Lâam. Miim. (Sure başlarındaki bu kibi arifler aqqında bilmek içün baq.: «Baqara», 2/1)."
        cid: 0
  - verse: 2
    segments:
      - text: "Hayy ve qayyüm olğan Allaһtan başqa ilâh yoktır. (“Hayy ve qayyüm” sıfatlarınıñ manaları içün baq.: «Baqara», 2/255)."
        cid: 0
  - verse: 3
    segments:
      - text: "(Resulım!) O, saña Kitapnı haq ve evelki kitaplarnı tasdiq etici olaraq qısım-qısım endirgen; daa evelde insanlarğa doğru yolnı kostermek uzre Tevratnen İncilni ve Furqannı endirgendir. Bilinmeli ki, Allaһnıñ ayetlerini inkâr etkenler içün şiddetli bir azap bar. Allaһ suçlınıñ aqqından kelici mutlaq kuç saibidir. («Furqan» - doğrunı yañılıştan ve yahşını yamandan ayırdı etken ukümler demek olup, Qur’an-ı Kerimniñ isimlerindendir)."
        cid: 0
  - verse: 4
    segments:
      - text: "[3 ayetine baq.]"
        cid: 0
  - verse: 5
    segments:
      - text: "Şubesiz ki, ne yerde, ne de kokte iç bir şey Allaһqa gizli qalmaz."
        cid: 0
  - verse: 6
    segments:
      - text: "Rahimlerde sizni istegeni kibi şekillendirgen Odır. Ondan başqa ilâh yoktır. O mutlaq kuç ve ikmet saibidir."
        cid: 0
  - verse: 7
    segments:
      - text: "Saña Kitapnı endirgen Odır. Onıñ (Qur’annıñ) bazı ayetleri muhkemdir ki, bular Kitapnıñ esasıdır. Digerleri de muteşabihtir. Kalplerinde qıyışlıq olğanlar, fitne çıqarmaq ve oña başqaca mana bermek içün ondaki muteşabih ayetlerniñ peşine tüşerler. Albuki, Onıñ manasını yalıñız Allaһ bilir. İlimde yuksek derecege irişkenler ise: «Oña inandıq; episi Rabbimiz tarafındandır», derler. (Bu incelikni) ancaq aqılı dürüstler tüşünip añlarlar. (Bazılar «ve’r-raasihuune» kelimesiniñ başındaki «vav» arifini bağlayıcı qabul etkenler ki, bu taqdirde mana şoyle çıqar: «Albuki, onıñ manasını yalıñız Allaһ ve ilimde yuksek derecege iriikenler bilir». Bu manağa kore, Qur’andaki muteşaabih ayetlerniñ manaları zaman içinde ilimniñ inkişafınen çezilecek. Muhkem ve muteşaabih - terminler olup, «muhkem ayet» - manası açıq añlaşılğan ve şubege yol bermegen ayet demektir. «Muteşaabih» ise - muhkemniñ aksidir ve manası tam olaraq añlaşuvı mumkün olmağan ayetni ifade ete)."
        cid: 0
  - verse: 8
    segments:
      - text: "(Olar şoyle yaqarırlar:) Rabbimiz! Bizni doğru yolğa qavuştırğandan soñ, qalplerimizni bozma. Bizge rahmet bağışla. Lütfi eñ bol olğan Sensiñ."
        cid: 0
  - verse: 9
    segments:
      - text: "Rabbimiz! Kelüvine şube etilmegen bir kunde insanlarnı mıtlaqa toplaycaq Sensiñ. Allaһ asla sezünden qaytmaz."
        cid: 0
  - verse: 10
    segments:
      - text: "Bilinmeli ki, inkâr etkenlerniñ ne malları, ne de evlâtları Allaһ uzurında ozlerine bir fayda bermeycekler. İşte, olar ceennemniñ yaqarlığıdır."
        cid: 0
  - verse: 11
    segments:
      - text: "(Olarnıñ yolu) Fıravun hanedanınıñ ve olardan evelkilerniñ tutqan yoluna beñzer. Olar bizim ayetlerimizni yalanğa çıqardılar, Allaһ da olarnı gunahları sebebinden, aman yaqaladı. Allaһnıñ cezası çoq şiddetlidir."
        cid: 0
  - verse: 12
    segments:
      - text: "(Resulım!) İnkâr etkenlerge de ki: Yaqında mağlüp olacaqsıñız ve ceennemge sürüleceksiñiz. O yer qalınacaq ne fena bir yerdir! (Bu ayet, muşriklerniñ ya da, bir başqa rivayetke kore, yeudiylerniñ yaqında musulmanlardan yeñileceklerini Az. Peyğamberge mujdelemekte. Aqiqaten Qur’annıñ bu mucize haberi kerçekleşken ve ister muşrikler, ister yeudiyler ustünden musulmanlar zafer qazanğanlar."
        cid: 0
  - verse: 13
    segments:
      - text: "(Bedirde) qarşı-qarşığa kelgen şu eki toplumnıñ tüşken vaziyetinde siz içün buyuk bir ibret bar. Biri Allaһ yolunda çarpışqan bir toplum, digeri ise, bularnıñ açıktan-açıq ozlerinden eki kere çoq korüngen kâfir bir toplumdır. Allaһ istegenine yardımınen qol tutar. Elbette, bunda ilerini kore bilgenler içün buyuk bir ibret bar."
        cid: 0
  - verse: 16
    segments:
      - text: "Nefsiy isteklerge, (ayrıca) qadınlarğa, oğullarğa, yığın-yığın toplanğan altın ve kumüşke, başı boş atlarğa, sağılğan ayvanlarğa ve ekinlerge nisbeten ziyade hırs insanlarğa cazibeli qılındı. Bular dünya ayatınıñ keçici menfaatlarıdır. Albuki, barılacaq guzel yer - Allaһ qatındadır."
        cid: 0
  - verse: 17
    segments:
      - text: "(Resulım!) De ki: Sizge bulardan daa yahşısını bildireyimmi? Taqva saipleri içün Rabbleri yanında, içinde irmaqlar aqqan, ebediyen qalacaq cennetleri, ter-temiz refiqalar ve (episiniñ ustünde) Allaһnıñ hoşnutlığı bar. Allaһ qullarını çoq eyi korer. (14-nci ayette sayılğan dünya nimetleri ve dünya guzelliginiñ insanğa sevdirilgeni ifade etilgen. Bu davranış tabiiydir, dünyaviydir. Esasen insan oğlu nefsini ve neslini devam ettire bilüvi içün bu nimetlerden belli olçüde faydalanması kerek. Ancaq, insan bularğa qul olmamal. 15-nci ayette bulardan daa guzeli kosterilgen, çünki, evelkiler ne qadar guzel olsa olsun keçicidir, ekinciler ise daimiydir)."
        cid: 0
  - verse: 18
    segments:
      - text: "(Bu nimetler): «Ey, Rabbimiz! İman ettik; bizim gunahlarımıznı bağışla, bizni ateş azabından qorçalar!» degen;"
        cid: 0
  - verse: 19
    segments:
      - text: "Sabır etken, dürüst olğan, uzurda boyun bukken, hayırğa arclağan ve saar vaqtında Allaһtan bahşış tilegenler (içündir)."
        cid: 0
  - verse: 20
    segments:
      - text: "Allaһ adaletni qorçalayaraq, (delillerinen) şu hususnı añlatqan ki, Ondan başqa ilâh yoqtır. Melekler ve ilim saipleri de (bunı iqrar etkenler. Ebet) mutlaq kuç ve ikmet saibi Allaһtan başqa ilâh yoqtır."
        cid: 0
  - verse: 21
    segments:
      - text: "Allaһ nezdinde haq din İslâmdır. Kitap berilgenler, ozlerine ilim kelgenden soñradır ki, aralarındaki kuncilik sebebinden, uyışamadılar. Allaһnıñ ayetlerini inkâr etkenler bilmediler ki, Allaһnıñ esabı çoq çabiktir. («Din» kelimesi - itaat ve ceza, millet ve şeriat manalarındadır. Qur’an-ı Kerimde din kelimesi çeşit manalarda qullanıla. Yuqarıdaki ayette ise, qullar tarafından uyılması istenilgen ilâhiy qanunnıñ kozde tutılğanı añlaşıla. «İslâm» kelimesine de, şu manalar berilmekte: İtaat etmek ve bağlanmaq, selâmetlikke qavuşmaq, ibadette ihlâslı davranmaq. Yuqarıdaki ayette «islâm»dan tek Allaһ inançına tayanğan ve Az. Muһammed (s.a.) risaletinen kemalat noqtasına yetiştirilgen ilâhiy destürlerniñ episi kozde tutılmaqta)."
        cid: 0
  - verse: 22
    segments:
      - text: "Eger sennen tartışmağa kirişseler, de ki: «Maña uyğanlarnen birlikte men ozümni Allaһqa teslim ettim». Ehl-i kitapqa ve ummiylerge de: «Siz de Allaһqa teslim oldıñızmı?», de. Eger teslim olğan iseler, doğru yolnı buldılar demektir. Yoq, eger yuz çevirseler, seniñ vazifeñ - yalıñız tebliğdir. Allaһ qullarını çoq eyi kormektedir. («Ummiy» - luğatta oquvı-yazısı olmağan manasında olsa da, tefsirler, bu ayette ozlerine kitap berilmegen arap muşrikleriniñ nazarda tutılğanlarını bildireler)."
        cid: 0
  - verse: 23
    segments:
      - text: "Allaһnıñ ayetlerini inkâr etkenler, aqsız yerde peyğamberlerniñ canlarını qıyğanlar ve adaletni emir etken insanlarnı oldürgenler (öqmı), olarğa accı bir azapnı haber ber!"
        cid: 0
  - verse: 24
    segments:
      - text: "İşte, bular dünyada da, ahirette de, areketleri boşuna ketken kimselerdir. Olarnıñ iç bir yardımcısı da yoqtır. (İman etmegen ve dinniñ darqaluvına, adaletniñ tedbiq etilüvine mani oluvğa çalşşqanlarnıñ, ahirette zararğa oğraycaqları tabiiydir. Dünyadaki zararları ise, butün ğayretlerine rağmen haq dinniñ darqaluvına, adeletniñ ortağa çıquvına mani olalmayuvlarında ozüni kostermekte. Kâfirler istese de, istemese de, Allaһ haq dinni digerlerine hakim yapacaq. Amelniñ dünyada boşuna ketüviniñ bir manası da, omür sermayesini boşuna arcalamaq, ahiret içün bir şey qazanmadan, olüp ketmektir). (Tefsirlerde aşağıda manası berilgen ayetniñ nazil oluvına sebep çeşit vaqialar añlatılğan ki, bu vaziyetlerden biri boyledir: Ekisi de yeudiy olğan bir qadınnen bir erkek zina yapalar. Tevratta zinanıñ cezası «recim» olmaqnen beraber, yeudiyler, asaletleriniñ sebebinen, bu kişilerni recim etmek istemeyler; daa yengil bir ceza berilecegi umüdinen Resulullahqa keleler. O da aynı cezanen uküm etkeninen, bu ukümge itiraz bildireler. Buña kore, Az. Peyğamber Tevratnıñ ait ayetini oqutaraq, oña kore uküm bere ve qabaatlılarnıñ kene recim etilüvini emir ete. Umütlerine nail olmağan yeudiyler buña opkeleneler)."
        cid: 0
  - verse: 25
    segments:
      - text: "(Resulım!) Kendilerine kitaptan bir pay berilgenlerni (eudiylerni) kormezsiñmi ki, aralarında uküm etüvi içün Allaһnıñ kitabına çağıralar da, soñra aralarından bir topu cayaraq keri döne."
        cid: 0
  - verse: 26
    segments:
      - text: "Olarnıñ bu areketleri: «Bizge ateş, sadece sayılı kunlerde toqunacaq», deyuvleriniñ bir neticesidir. Olarnıñ vaqtı ile uydurğan şeyleri de, dinleri aqqında ozlerini yañıltqandır."
        cid: 0
  - verse: 27
    segments:
      - text: "Faqat olarnı kelüvinde şube etilmegen bir kun içün toplağanımızda ve iç bir aqsızlıqqa oğratmadan, er keske qazanğan şeylerini tamamınen odengen vaqıtta alları nasıl olur?"
        cid: 0
  - verse: 28
    segments:
      - text: "(Resulım!) De ki: Mulkniñ aqiqiy saibi olğan Allaһım! Sen mulkni istegeniñye berirsiñ ve mulkni istegeniñden keri alırsıñ. İstegeniñni yuceltir, istegeniñni de alçaltırsıñ. Er türlü eyilik seniñ eliñdedir. Aqiqaten sen er şeyge qadirsiñ."
        cid: 0
  - verse: 29
    segments:
      - text: "Geceni kundüzge qatar, kundüzni de gecege qatarsıñ. Olüden tirini çıqarır, tiriden de olüni çıqarırsıñ. İstegeniñye de esapsız rızıq berirsiñ. (Bu ayette gece ve kundüzniñ uzap, qısalğanı Allaһnıñ qudretine bir nişane olğanı añlatılğan)."
        cid: 0
  - verse: 30
    segments:
      - text: "Mu’minler mu’minlerni bıraqıp da, kâfirlerni dost tutmasınlar. Kim bunı yapsa, artıq onıñ Allaһ nezdinde iç bir degeri yoqtır. Ancaq kâfirlerden kele bilecek bir telükeden saqınuvıñız istisna. Allaһ, ozüne qarşı (kelüvden) sizni saqındıra. Dönmek yalıñız Allaһqadır. (Ayette yasaqlanğan dostluq kâfirlerge nistebeten goñyulden bağlanmaq ve mu’minlerni bıraqıp, olarğa bağlılıq ve sevgi kostermek manasındaki dostluqtır. Buña qarşılıq bir musulman devletniñ başqa musulmanlarnıñ aleyhine olmamaq şartınen, kâfirlernen barış imzalavı ve başqa bir ğayrımuslim devletnen işbirligi yapuvı caizdir)."
        cid: 0
  - verse: 31
    segments:
      - text: "De ki: İçiñizdikelerni gizleseñiz de, aşkâr etseñiz de, Allaһ onı bilir. Koklerde ve yerde olğanlarnı da bilir. Allaһ er şeyge qadirdir. (Tefsirci Beyzaviy bu ayetni tefsir eter eken, boyle dey: «Eger qalplerimizde kâfirlerge nisbeten bir sevgi ve dostluq meyli olsa, onı gizleseñiz de, aşkâr etseñiz de, Allaһ bilir. Zira, koklerde ve yerde olğan er şeyni bilici Allaһ, elbette siziñ gizliñizni de, aşkârıñıznı da bilir. Ayrıca, O kâfirlerge dost oluvıñıznı yasaqlamasına rağmen, kene de siz bundan vazgeçmeseñiz, sizni cezalandırmağa da qadirdir… Qısqası, Onıñ bilmegen ve cezalandırmağa kuçü yetmegen iç bir fenalıq ve isyan olmağanına kore, emirine asiy olmaq curatını kostermeñ)."
        cid: 0
  - verse: 32
    segments:
      - text: "Er kesniñ, eyilik olaraq yapqanlarını da, fenalıq olaraq yapqanlarını da, qarşısında azır olğan kunde (insan) isteycek ki, fenalıqlarınen ozü arasında uzun bir mesafe bulunsın. Allaһ, ozüne qarşı (kelüvden) sizni saqındıra. Allaһ qullarına çoq şefqatlıdır."
        cid: 0
  - verse: 33
    segments:
      - text: "(Resulım!) De ki: Eger Allaһnı sevseñiz, maña uyıñız ki, Allaһ da sizni sevsin ve gunahlarıñıznı bağışlasın. Allaһ soñ derece bağışlayıcı ve merhametlidir."
        cid: 0
  - verse: 34
    segments:
      - text: "De ki: Allaһqa ve Resulına itaat etiñ. Eger yuz çevirseler, bilsinler ki, Allaһ kâfirlerni sevmez."
        cid: 0
  - verse: 35
    segments:
      - text: "Allaһ bir-birlerinden kelme bir nesil olaraq Ademni, Nuhnı, İbrahim ailesinen İmran ailesini seçip, alemlerge ustün yaptı. Allaһ eşitici ve bilicidir. (İbrahim ve İmran ailesiniñ manası, tefsircilerniñ çoqluğına kore, olardan soñ kelgen peyğamberlerdir)."
        cid: 0
  - verse: 36
    segments:
      - text: "[35 ayetine baq.]"
        cid: 0
  - verse: 37
    segments:
      - text: "İmrannıñ qadını boyle degen edi: «Rabbim! Qarnımdakini azatlı bir qul olaraq tek saña adadım. Adağımnı qabul et. Şubesiz, (niyazımnı) haqqı ile eşitici ve (niyetimni) bilici Sensiñ”."
        cid: 0
  - verse: 38
    segments:
      - text: "Onı doğurğanınen, Allaһ ne doğurğanını bilip turğanda: «Rabbim! Men onı qız doğurdım. Albuki, oğul qız kibi degil. Oña Meryem adını berdim. Quvulğan şeytanğa nisbeten, onı ve soyunı seniñ qorçalağanıñnı tileyim», dedi."
        cid: 0
  - verse: 39
    segments:
      - text: "Rabbi Meryemniñ tilegini qabul etti; onı guzel bir osümlik kibi yetiştirdi. Zekeriyyanı da onı baqmaq ile vazifelendirdi. Zekeriyya onıñ yanına, mabetke er kirgeninde, o yerde bir rızıq kore ve «Ey, Meryem, bu saña nereden kele?», der; o da: «Bu, Allaһ tarafındandır. Allaһ istegenine esapsız rızıq berir», der edi. (Zekeriyya aleyhisselâm, Az. Meryemniñ teyzesiniñ qocası edi. Ayette ifade etilgeni kibi, Az. Meryemniñ Beyt-i Maqdiste baqımını Zekeriyya ustüne alğan edi. Meryemge ayrı bir oda tesis etti ki, oña ayette «mihrap» denilgen. Mihrap cenk ve cihad vastası demektir. Bir çeşiti qıynav odası manasındadır. Ayette keçken «mihrap»nıñ camilerde imamnıñ namaz qıldırğan yeri olğan mihrapnen alâqası yoq. Az. Zekeriyya Meryemniñ yanına er sefer kirgende çeşit-çeşit taze meyvalar kore edi. Bular o mevsimde o bolgede yetişmegen meyvalar edi)."
        cid: 0
  - verse: 40
    segments:
      - text: "O yerde Zekeriyya Rabbine dua etti: «Rabbim, maña tarafıñdan hayırlı bir nesil bağışla. Şubesiz, sen duanı haqqı ile eşiticisiñ», dedi."
        cid: 0
  - verse: 41
    segments:
      - text: "Zekeriyya mabette namaz qılar eken, melekler oña boyle nida ettiler: «Allaһ saña kendisi tarafından kelgen bir Kelimeni tasdiq etici, efendi, iffetli ve salihlerden bir peyğamber olaraq Yahyanı mujdeler. (Tefsirlerniñ beyanına kore, bu ayette «Kelime» sözü ile nazarda tutılğan kişi Az. İsadır. Boylece, bu sureniñ 45-nci ayetinde bunıñ açıq ifade etilgenini kormektemiz)."
        cid: 0
  - verse: 42
    segments:
      - text: "Zekeriyya: «Rabbim! dedi, maña ihtiyarlıq kelip çatqanda, bunıñ ustüne qadınım da doğurmaz olğanına kore, menim nasıl oğlum ola bilir?». Allaһ boyle buyurdı: İşte, boyledir; Allaһ istegenini yapar."
        cid: 0
  - verse: 43
    segments:
      - text: "Zekeriyya: «Rabbim! (Oğlum olacağına dair) maña bir alâmet koster», dedi. Allaһ buyurdı ki: Sen içün alâmet, insanlarğa uç kun işaretten başqa söz söylememeñdir. Ayrıca, Rabbiñni çoq añ, saba-aqşam tesbih et."
        cid: 0
  - verse: 44
    segments:
      - text: "Melekler degen ediler: «Ey, Meryem! Allaһ seni seçti; seni ter-temiz yarattı ve seni butün dünya qadınlarından ustün etti."
        cid: 0
  - verse: 45
    segments:
      - text: "Ey, Meryem! Rabbiñye ibadet et; secdege qapan, (Onıñ uzurında) egilgenlernen beraber, sen de egil."
        cid: 0
  - verse: 46
    segments:
      - text: "(Resulım!) Bular bizim saña vahiy yolunen bildirmekte olğan ğayb haberlerindendir. Aralarından angisi Meryemni imayesine alacaq diye, qur’a çekmek uzre, qalemlerini atqanda, sen olarnıñ yanında degil ediñ; olar (bu sebepten) çekişkenlerinde de, yanlarında degil ediñ. (Tefsircelerniñ beyanına kore, İsrail oğulları Tevratnı yazğanda qullanğan qalemlerini nehirge atuvnen, qur’a çekken ediler ki, boylece, angisiniñ qalemi suv yuzüne çıqsa, Mermeni o imayesine alacaq edi. Bu qur’anı oqlarnen çekkenleri de, rivayet etile)."
        cid: 0
  - verse: 47
    segments:
      - text: "Melekler degen ediler ki: «Ey, Meryem! Allaһ saña kendisinden bir Kelimeni mujdelemekte. Adı Meryem oğlu İsadır. Mesihtir; dünyada da, ahirette de itibarlı ve Allaһnıñ ozüne yaqın tutqanlarındandır. (Mesih - ibraniyce bir kelime olun, asll «meşiyh»tir. Az. İsanıñ bir lağabıdır ve «mubarek» manasındadır."
        cid: 0
  - verse: 48
    segments:
      - text: "O, salihlerden olaraq beşikte ekende ve yetişken çağında insanlarğa (peyğamber sözleri ile) qonuşacaq. (Meryem suresiniñ 27-30-nci ayetlerinde ifade etilgeni kibi, Az. Meryem Az. İsanı dünyağa ketirgeninen, onıñ iffetinden şubelengen qavmına nisbeten, daa yañı doğğan Az. İsa Allaһnıñ qudretinen qonuşmağa başlağan ve ozü Allaһnıñ qulı ve Peyğamberi olğanını, ozüne Kitap berilgenini, Allaһ tarafından mubarek qılınğanını añlata)."
        cid: 0
  - verse: 49
    segments:
      - text: "Meryem: «Rabbim! dedi, maña bir erkek eli toqunmağanı alda, nasıl balam olur?» Allaһ boyle buyurdı: İşte, boyledir, Allaһ tilegenini yaratır. Bir işke uküm etkeninen, oña sadece “Ol!” der; o da olur."
        cid: 0
