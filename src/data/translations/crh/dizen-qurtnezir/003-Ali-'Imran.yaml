surah_id: 3
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >
          Elif. Lâam. Miim. (Sure başlarındaki bu kibi arifler aqqında bilmek içün baq.:
          «Baqara», 2/1).
        cid: 0
  - verse: 2
    segments:
      - text: >
          Hayy ve qayyüm olğan Allahtan başqa ilâh yoqtır. ("Hayy ve qayyüm" sıfatlarınıñ
          manaları içün baq.: «Baqara», 2/255).
        cid: 0
  - verse: 3
    segments:
      - text: >
          (Resulım!) O, saña Kitapnı haq ve evelki kitaplarnı tasdiq etici olaraq
          qısım-qısım endirgen; daa evelde insanlarğa doğru yolnı köstermek üzre Tevratnen
          İncilni ve Furqannı endirgendir. Bilinmeli ki, Allahnıñ ayetlerini inkâr
          etkenler içün şiddetli bir azap bar. Allah suçlınıñ aqqından kelici mutlaq küç
          saibidir. («Furqan» - doğrunı yañılıştan ve yahşını yamandan ayırdı etken
          ükümler demek olup, Qur'an-ı Kerimniñ isimlerindendir).
        cid: 0
  - verse: 4
    segments:
      - text: >
          [3 ayetine baq.]
        cid: 0
  - verse: 5
    segments:
      - text: >
          Şübesiz ki, ne yerde, ne de kökte iç bir şey Allahqa gizli qalmaz.
        cid: 0
  - verse: 6
    segments:
      - text: >
          Rahimlerde sizni istegeni kibi şekillendirgen Odır. Ondan başqa ilâh yoqtır. O
          mutlaq küç ve ikmet saibidir.
        cid: 0
  - verse: 7
    segments:
      - text: >
          Saña Kitapnı endirgen Odır. Onıñ (Qur'annıñ) bazı ayetleri muhkemdir ki, bular
          Kitapnıñ esasıdır. Digerleri de muteşabihtir. Kalplerinde qıyışlıq olğanlar,
          fitne çıqarmaq ve oña başqaca mana bermek içün ondaki muteşabih ayetlerniñ
          peşine tüşerler. Albuki, Onıñ manasını yalıñız Allah bilir. İlimde yüksek
          derecege irişkenler ise: «Oña inandıq; episi Rabbimiz tarafındandır», derler.
          (Bu incelikni) ancaq aqılı dürüstler tüşünip añlarlar. (Bazılar
          «ve'r-raasihuune» kelimesiniñ başındaki «vav» arifini bağlayıcı qabul etkenler
          ki, bu taqdirde mana şöyle çıqar: «Albuki, onıñ manasını yalıñız Allah ve ilimde
          yüksek derecege irişkenler bilir». Bu manağa köre, Qur'andaki müteşaabih
          ayetlerniñ manaları zaman içinde ilimniñ inkişafınen çezilecek. Muhkem ve
          müteşaabih - terminler olup, «muhkem ayet» - manası açıq añlaşılğan ve şübege
          yol bermegen ayet demektir. «Müteşaabih» ise - muhkemniñ aksidir ve manası tam
          olaraq añlaşuvı mümkün olmağan ayetni ifade ete).
        cid: 0
  - verse: 8
    segments:
      - text: >
          (Olar şöyle yaqarırlar:) Rabbimiz! Bizni doğru yolğa qavuştırğandan soñ,
          qalplerimizni bozma. Bizge rahmet bağışla. Lütfi eñ bol olğan Sensiñ.
        cid: 0
  - verse: 9
    segments:
      - text: >
          Rabbimiz! Kelüvine şübe etilmegen bir künde insanlarnı mıtlaqa toplaycaq Sensiñ.
          Allah asla sezünden qaytmaz.
        cid: 0
  - verse: 10
    segments:
      - text: >
          Bilinmeli ki, inkâr etkenlerniñ ne malları, ne de evlâtları Allah uzurında
          özlerine bir fayda bermeycekler. İşte, olar ceennemniñ yaqarlığıdır.
        cid: 0
  - verse: 11
    segments:
      - text: >
          (Olarnıñ yolu) Fıravun hanedanınıñ ve olardan evelkilerniñ tutqan yoluna beñzer.
          Olar bizim ayetlerimizni yalanğa çıqardılar, Allah da olarnı günahları
          sebebinden, aman yaqaladı. Allahnıñ cezası çoq şiddetlidir.
        cid: 0
  - verse: 12
    segments:
      - text: >
          (Resulım!) İnkâr etkenlerge de ki: Yaqında mağlüp olacaqsıñız ve ceennemge
          sürüleceksiñiz. O yer qalınacaq ne fena bir yerdir! (Bu ayet, müşriklerniñ ya
          da, bir başqa rivayetke köre, yeudiylerniñ yaqında musulmanlardan
          yeñileceklerini Az. Peyğamberge müjdelemekte. Aqiqaten Qur'annıñ bu mucize
          haberi kerçekleşken ve ister müşrikler, ister yeudiyler üstünden musulmanlar
          zafer qazanğanlar).
        cid: 0
  - verse: 13
    segments:
      - text: >
          (Bedirde) qarşı-qarşığa kelgen şu eki toplumnıñ tüşken vaziyetinde siz içün
          büyük bir ibret bar. Biri Allah yolunda çarpışqan bir toplum, digeri ise,
          bularnıñ açıqtan-açıq özlerinden eki kere çoq körüngen kâfir bir toplumdır.
          Allah istegenine yardımınen qol tutar. Elbette, bunda ilerini köre bilgenler
          içün büyük bir ibret bar.
        cid: 0
  - verse: 14
    segments:
      - text: >
          Nefsiy isteklerge, (ayrıca) qadınlarğa, oğullarğa, yığın-yığın toplanğan altın
          ve kümüşke, başı boş atlarğa, sağılğan ayvanlarğa ve ekinlerge nisbeten ziyade
          hırs insanlarğa cazibeli qılındı. Bular dünya ayatınıñ keçici menfaatlarıdır.
          Albuki, barılacaq güzel yer - Allah qatındadır.
        cid: 0
  - verse: 15
    segments:
      - text: >
          (Resulım!) De ki: Sizge bulardan daa yahşısını bildireyimmi? Taqva saipleri içün
          Rabbleri yanında, içinde irmaqlar aqqan, ebediyen qalacaq cennetleri, ter-temiz
          refiqalar ve (episiniñ üstünde) Allahnıñ hoşnutlığı bar. Allah qullarını çoq eyi
          körer. (14-nci ayette sayılğan dünya nimetleri ve dünya güzelliginiñ insanğa
          sevdirilgeni ifade etilgen. Bu davranış tabiiydir, dünyaviydir. Esasen insan
          oğlu nefsini ve neslini devam ettire bilüvi içün bu nimetlerden belli ölçüde
          faydalanması kerek. Ancaq, insan bularğa qul olmamalı. 15-nci ayette bulardan
          daa güzeli kösterilgen, çünki, evelkiler ne qadar güzel olsa olsun keçicidir,
          ekinciler ise daimiydir).
        cid: 0
  - verse: 16
    segments:
      - text: >
          (Bu nimetler): «Ey, Rabbimiz! İman ettik; bizim günahlarımıznı bağışla, bizni
          ateş azabından qorçalar!» degen;
        cid: 0
  - verse: 17
    segments:
      - text: >
          Sabır etken, dürüst olğan, uzurda boyun bükken, hayırğa arclağan ve saar
          vaqtında Allahtan bahşış tilegenler (içündir).
        cid: 0
  - verse: 18
    segments:
      - text: >
          Allah adaletni qorçalayaraq, (delillerinen) şu hususnı añlatqan ki, Ondan başqa
          ilâh yoqtır. Melekler ve ilim saipleri de (bunı iqrar etkenler. Ebet) mutlaq küç
          ve ikmet saibi Allahtan başqa ilâh yoqtır.
        cid: 0
  - verse: 19
    segments:
      - text: >
          Allah nezdinde haq din İslâmdır. Kitap berilgenler, özlerine ilim kelgenden
          soñradır ki, aralarındaki küncilik sebebinden, uyışamadılar. Allahnıñ ayetlerini
          inkâr etkenler bilmediler ki, Allahnıñ esabı çoq çabiktir. («Din» kelimesi -
          itaat ve ceza, millet ve şeriat manalarındadır. Qur'an-ı Kerimde din kelimesi
          çeşit manalarda qullanıla. Yuqarıdaki ayette ise, qullar tarafından uyılması
          istenilgen ilâhiy qanunnıñ közde tutılğanı añlaşıla. «İslâm» kelimesine de, şu
          manalar berilmekte: İtaat etmek ve bağlanmaq, selâmetlikke qavuşmaq, ibadette
          ihlâslı davranmaq. Yuqarıdaki ayette «islâm»dan tek Allah inançına tayanğan ve
          Az. Muhammed (s.a.) risaletinen kemalat noqtasına yetiştirilgen ilâhiy
          destürlerniñ episi közde tutılmaqta).
        cid: 0
  - verse: 20
    segments:
      - text: >
          Eger sennen tartışmağa kirişseler, de ki: «Maña uyğanlarnen birlikte men özümni
          Allahqa teslim ettim». Ehl-i kitapqa ve ümmiylerge de: «Siz de Allahqa teslim
          oldıñızmı?», de. Eger teslim olğan iseler, doğru yolnı buldılar demektir. Yoq,
          eger yüz çevirseler, seniñ vazifeñ - yalıñız tebliğdir. Allah qullarını çoq eyi
          körmektedir. («Ümmiy» - luğatta oquvı-yazısı olmağan manasında olsa da,
          tefsirler, bu ayette özlerine kitap berilmegen arap müşrikleriniñ nazarda
          tutılğanlarını bildireler).
        cid: 0
  - verse: 21
    segments:
      - text: >
          Allahnıñ ayetlerini inkâr etkenler, aqsız yerde peyğamberlerniñ canlarını
          qıyğanlar ve adaletni emir etken insanlarnı öldürgenler (yoqmı), olarğa accı bir
          azapnı haber ber!
        cid: 0
  - verse: 22
    segments:
      - text: >
          İşte, bular dünyada da, ahirette de, areketleri boşuna ketken kimselerdir.
          Olarnıñ iç bir yardımcısı da yoqtır. (İman etmegen ve dinniñ darqaluvına,
          adaletniñ tedbiq etilüvine mani oluvğa çalışqanlarnıñ, ahirette zararğa
          oğraycaqları tabiiydir. Dünyadaki zararları ise, bütün ğayretlerine rağmen haq
          dinniñ darqaluvına, adeletniñ ortağa çıquvına mani olalmayuvlarında özüni
          köstermekte. Kâfirler istese de, istemese de, Allah haq dinni digerlerine hakim
          yapacaq. Amelniñ dünyada boşuna ketüviniñ bir manası da, ömür sermayesini boşuna
          arcalamaq, ahiret içün bir şey qazanmadan, ölüp ketmektir). (Tefsirlerde aşağıda
          manası berilgen ayetniñ nazil oluvına sebep çeşit vaqialar añlatılğan ki, bu
          vaziyetlerden biri böyledir: Ekisi de yeudiy olğan bir qadınnen bir erkek zina
          yapalar. Tevratta zinanıñ cezası «recim» olmaqnen beraber, yeudiyler,
          asaletleriniñ sebebinen, bu kişilerni recim etmek istemeyler; daa yengil bir
          ceza berilecegi ümüdinen Resulullahqa keleler. O da aynı cezanen üküm etkeninen,
          bu ükümge itiraz bildireler. Buña köre, Az. Peyğamber Tevratnıñ ait ayetini
          oqutaraq, oña köre üküm bere ve qabaatlılarnıñ kene recim etilüvini emir ete.
          Ümütlerine nail olmağan yeudiyler buña öpkeleneler).
        cid: 0
  - verse: 23
    segments:
      - text: >
          (Resulım!) Kendilerine kitaptan bir pay berilgenlerni (yeudiylerni) körmezsiñmi
          ki, aralarında üküm etüvi içün Allahnıñ kitabına çağıralar da, soñra aralarından
          bir topu cayaraq keri döne.
        cid: 0
  - verse: 24
    segments:
      - text: >
          Olarnıñ bu areketleri: «Bizge ateş, sadece sayılı künlerde toqunacaq»,
          deyüvleriniñ bir neticesidir. Olarnıñ vaqtı ile uydurğan şeyleri de, dinleri
          aqqında özlerini yañıltqandır.
        cid: 0
  - verse: 25
    segments:
      - text: >
          Faqat olarnı kelüvinde şübe etilmegen bir kün içün toplağanımızda ve iç bir
          aqsızlıqqa oğratmadan, er keske qazanğan şeylerini tamamınen ödengen vaqıtta
          alları nasıl olur?
        cid: 0
  - verse: 26
    segments:
      - text: >
          (Resulım!) De ki: Mülkniñ aqiqiy saibi olğan Allahım! Sen mülkni istegeniñe
          berirsiñ ve mülkni istegeniñden keri alırsıñ. İstegeniñni yüceltir, istegeniñni
          de alçaltırsıñ. Er türlü eyilik seniñ eliñdedir. Aqiqaten sen er şeyge qadirsiñ.
        cid: 0
  - verse: 27
    segments:
      - text: >
          Geceni kündüzge qatar, kündüzni de gecege qatarsıñ. Ölüden tirini çıqarır,
          tiriden de ölüni çıqarırsıñ. İstegeniñe de esapsız rızıq berirsiñ. (Bu ayette
          gece ve kündüzniñ uzap, qısalğanı Allahnıñ qudretine bir nişane olğanı
          añlatılğan).
        cid: 0
  - verse: 28
    segments:
      - text: >
          Mü'minler mü'minlerni bıraqıp da, kâfirlerni dost tutmasınlar. Kim bunı yapsa,
          artıq onıñ Allah nezdinde iç bir degeri yoqtır. Ancaq kâfirlerden kele bilecek
          bir telükeden saqınuvıñız istisna. Allah, özüne qarşı (kelüvden) sizni
          saqındıra. Dönmek yalıñız Allahqadır. (Ayette yasaqlanğan dostluq kâfirlerge
          nistebeten goñülden bağlanmaq ve mü'minlerni bıraqıp, olarğa bağlılıq ve sevgi
          köstermek manasındaki dostluqtır. Buña qarşılıq bir musulman devletniñ başqa
          musulmanlarnıñ aleyhine olmamaq şartınen, kâfirlernen barış imzalavı ve başqa
          bir ğayrımuslim devletnen işbirligi yapuvı caizdir).
        cid: 0
  - verse: 29
    segments:
      - text: >
          De ki: İçiñizdikelerni gizleseñiz de, aşkâr etseñiz de, Allah onı bilir.
          Köklerde ve yerde olğanlarnı da bilir. Allah er şeyge qadirdir. (Tefsirci
          Beyzaviy bu ayetni tefsir eter eken, böyle dey: «Eger qalplerimizde kâfirlerge
          nisbeten bir sevgi ve dostluq meyli olsa, onı gizleseñiz de, aşkâr etseñiz de,
          Allah bilir. Zira, köklerde ve yerde olğan er şeyni bilici Allah, elbette siziñ
          gizliñizni de, aşkârıñıznı da bilir. Ayrıca, O kâfirlerge dost oluvıñıznı
          yasaqlamasına rağmen, kene de siz bundan vazgeçmeseñiz, sizni cezalandırmağa da
          qadirdir... Qısqası, Onıñ bilmegen ve cezalandırmağa küçü yetmegen iç bir
          fenalıq ve isyan olmağanına köre, emirine asiy olmaq curatını köstermeñ).
        cid: 0
  - verse: 30
    segments:
      - text: >
          Er kesniñ, eyilik olaraq yapqanlarını da, fenalıq olaraq yapqanlarını da,
          qarşısında azır olğan künde (insan) isteycek ki, fenalıqlarınen özü arasında
          uzun bir mesafe bulunsın. Allah, özüne qarşı (kelüvden) sizni saqındıra. Allah
          qullarına çoq şefqatlıdır.
        cid: 0
  - verse: 31
    segments:
      - text: >
          (Resulım!) De ki: Eger Allahnı sevseñiz, maña uyıñız ki, Allah da sizni sevsin
          ve günahlarıñıznı bağışlasın. Allah soñ derece bağışlayıcı ve merhametlidir.
        cid: 0
  - verse: 32
    segments:
      - text: >
          De ki: Allahqa ve Resulına itaat etiñ. Eger yüz çevirseler, bilsinler ki, Allah
          kâfirlerni sevmez.
        cid: 0
  - verse: 33
    segments:
      - text: >
          Allah bir-birlerinden kelme bir nesil olaraq Ademni, Nuhnı, İbrahim ailesinen
          İmran ailesini seçip, alemlerge üstün yaptı. Allah eşitici ve bilicidir.
          (İbrahim ve İmran ailesiniñ manası, tefsircilerniñ çoqluğına köre, olardan soñ
          kelgen peyğamberlerdir).
        cid: 0
  - verse: 34
    segments:
      - text: >
          [33 ayetine baq.]
        cid: 0
  - verse: 35
    segments:
      - text: >
          İmrannıñ qadını böyle degen edi: «Rabbim! Qarnımdakini azatlı bir qul olaraq tek
          saña adadım. Adağımnı qabul et. Şübesiz, (niyazımnı) haqqı ile eşitici ve
          (niyetimni) bilici Sensiñ".
        cid: 0
  - verse: 36
    segments:
      - text: >
          Onı doğurğanınen, Allah ne doğurğanını bilip turğanda: «Rabbim! Men onı qız
          doğurdım. Albuki, oğul qız kibi degil. Oña Meryem adını berdim. Quvulğan
          şeytanğa nisbeten, onı ve soyunı seniñ qorçalağanıñnı tileyim», dedi.
        cid: 0
  - verse: 37
    segments:
      - text: >
          Rabbi Meryemniñ tilegini qabul etti; onı güzel bir ösümlik kibi yetiştirdi.
          Zekeriyyanı da onı baqmaq ile vazifelendirdi. Zekeriyya onıñ yanına, mabetke er
          kirgeninde, o yerde bir rızıq köre ve «Ey, Meryem, bu saña nereden kele?», der;
          o da: «Bu, Allah tarafındandır. Allah istegenine esapsız rızıq berir», der edi.
          (Zekeriyya aleyhisselâm, Az. Meryemniñ teyzesiniñ qocası edi. Ayette ifade
          etilgeni kibi, Az. Meryemniñ Beyt-i Maqdiste baqımını Zekeriyya üstüne alğan
          edi. Meryemge ayrı bir oda tesis etti ki, oña ayette «mihrap» denilgen. Mihrap
          cenk ve cihad vastası demektir. Bir çeşiti qıynav odası manasındadır. Ayette
          keçken «mihrap»nıñ camilerde imamnıñ namaz qıldırğan yeri olğan mihrapnen
          alâqası yoq. Az. Zekeriyya Meryemniñ yanına er sefer kirgende çeşit-çeşit taze
          meyvalar köre edi. Bular o mevsimde o bölgede yetişmegen meyvalar edi).
        cid: 0
  - verse: 38
    segments:
      - text: >
          O yerde Zekeriyya Rabbine dua etti: «Rabbim, maña tarafıñdan hayırlı bir nesil
          bağışla. Şübesiz, sen duanı haqqı ile eşiticisiñ», dedi.
        cid: 0
  - verse: 39
    segments:
      - text: >
          Zekeriyya mabette namaz qılar eken, melekler oña böyle nida ettiler: «Allah saña
          kendisi tarafından kelgen bir Kelimeni tasdiq etici, efendi, iffetli ve
          salihlerden bir peyğamber olaraq Yahânı müjdeler. (Tefsirlerniñ beyanına köre,
          bu ayette «Kelime» sözü ile nazarda tutılğan kişi Az. İsadır. Böylece, bu
          sureniñ 45-nci ayetinde bunıñ açıq ifade etilgenini körmektemiz).
        cid: 0
  - verse: 40
    segments:
      - text: >
          Zekeriyya: «Rabbim! dedi, maña ihtiyarlıq kelip çatqanda, bunıñ üstüne qadınım
          da doğurmaz olğanına köre, menim nasıl oğlum ola bilir?». Allah böyle buyurdı:
          İşte, böyledir; Allah istegenini yapar.
        cid: 0
  - verse: 41
    segments:
      - text: >
          Zekeriyya: «Rabbim! (Oğlum olacağına dair) maña bir alâmet köster», dedi. Allah
          buyurdı ki: Sen içün alâmet, insanlarğa üç kün işaretten başqa söz
          söylememeñdir. Ayrıca, Rabbiñni çoq añ, saba-aqşam tesbih et.
        cid: 0
  - verse: 42
    segments:
      - text: >
          Melekler degen ediler: «Ey, Meryem! Allah seni seçti; seni ter-temiz yarattı ve
          seni bütün dünya qadınlarından üstün etti.
        cid: 0
  - verse: 43
    segments:
      - text: >
          Ey, Meryem! Rabbiñe ibadet et; secdege qapan, (Onıñ uzurında) egilgenlernen
          beraber, sen de egil.
        cid: 0
  - verse: 44
    segments:
      - text: >
          (Resulım!) Bular bizim saña vahiy yolunen bildirmekte olğan ğayb
          haberlerindendir. Aralarından angisi Meryemni imayesine alacaq diye, qur'a
          çekmek üzre, qalemlerini atqanda, sen olarnıñ yanında degil ediñ; olar (bu
          sebepten) çekişkenlerinde de, yanlarında degil ediñ. (Tefsircelerniñ beyanına
          köre, İsrail oğulları Tevratnı yazğanda qullanğan qalemlerini nehirge atuvnen,
          qur'a çekken ediler ki, böylece, angisiniñ qalemi suv yüzüne çıqsa, Mermeni o
          imayesine alacaq edi. Bu qur'anı oqlarnen çekkenleri de, rivayet etile).
        cid: 0
  - verse: 45
    segments:
      - text: >
          Melekler degen ediler ki: «Ey, Meryem! Allah saña kendisinden bir Kelimeni
          müjdelemekte. Adı Meryem oğlu İsadır. Mesihtir; dünyada da, ahirette de itibarlı
          ve Allahnıñ özüne yaqın tutqanlarındandır. (Mesih - ibraniyce bir kelime olup,
          aslı «meşiyh»tir. Az. İsanıñ bir lağabıdır ve «mubarek» manasındadır).
        cid: 0
  - verse: 46
