surah_id: 25
language: crh
author: dizen-qurtnezir
verses:
  - verse: 3
    segments:
      - text: "(Kâfirler) Onı (Allaһnı) bıraqıp, iç bir şey yaratalmağan, aksine ozleri yaratılğan olup, ozlerine bile ne zarar, ne de fayda bere bilgen, oldürmege ve ayat bermege ve olülerni ğayrıdan tiriltip, qabirden çıqarmağa kuçleri yetmegen tañrılar edindiler."
        cid: 0
  - verse: 4
    segments:
      - text: "İnkâr etkenler: Bu (Qur’an), olsa-olsa onıñ (Muһammedniñ) uydırğan bir yalanıdır, başqa bir toplum da, bu hususta oña yardım etkendir, dediler. Boylece, olar iç şubesiz, aqsızlıqqa ve iftrağa baş urğan ediler."
        cid: 0
  - verse: 5
    segments:
      - text: "Kene olar dediler ki: (Bu ayetler), onıñ, başqasına yazdırıp da, ozüne saba-aqşam oqunmaqta olğan evelkilerge ait masallardır. (Bu ayette, bazı kâfirlerniñ, Qur’an ayetleriniñ evelki qavmlarnıñ masallarından ibaret olğanı, Az.Peyğamberniñ bularnı başqalarına yazdırğanı ve ezberlevi içün oña saba-aqşam oqulğanı aqqında söz etilmekte. Tefsirlerde umumen ustün korülgen bu mana esasqa alınsa, ayetniñ diqqat çekici bir hususqa işaret etkeni korüle ki, bu, Az.Peyğamber ummiy olğanınıñ yani oqumağa-yazmağa bilmegeniniñ, inkârcılarğa kore de, bilinmekte ve qabul etilmekte oluvıdır)."
        cid: 0
  - verse: 6
    segments:
      - text: "(Resulım!) De ki: Onı koklerde ve yerdeki gizliliklerni bilgen Allaһ endirdi. Şubesiz, O, çoq bağışlayıcıdır, ziyade merhametlidir."
        cid: 0
  - verse: 7
    segments:
      - text: "Olar (bir de) boyle dediler: Bu nasıl bir peyğamber; (bizler kibi) aş aşay, çarşılarda dolaşa! Oña bir melek endirilmeli, ozünen birlikte, o da tenbiyeci olmalı edi!"
        cid: 0
  - verse: 8
    segments:
      - text: "Yahut ozüne bir hazine berilmeli ya da içinden aşap (meşaqatsız keçinüvini teminleyici) bir bağçası olmalı edi. (Ayrıca) o zalımlar (mu’minlerge): Siz, ancaq tılsımğa oğrağan bir adamğa uymaqtasıñız! dediler."
        cid: 0
  - verse: 9
    segments:
      - text: "(Resulım!) Seniñ aqqıñda baq ne çeşit misaller ketirdiler! Artıq olar sapıqlardır ve (hidayetke) iç bir yol da tapalmazlar."
        cid: 0
  - verse: 10
    segments:
      - text: "İstese, saña bulardan daa yahşısını, altlarından irmaqlar aqqan cennetlerni berecek ve saña saraylar ihsan ete bilecek Allaһnıñ şanı yujedir. («Bulardan daa yahşısı» denilir eken, kâfirlerniñ, Az.Peyğamberge deger bermek içün, onda arağan imkânlarına işaret olunmaqta. Cenab-ı Allaһ, İraq bolgesindeki zengin topraqlarnı, İran padişalarınıñ ve Rum imperatorlarınıñ saraylarını musulmanlarğa bermek suretinen, bu vadesini yerine ketirgen)."
        cid: 0
  - verse: 11
    segments:
      - text: "Olar bunıñ ustüne qıyametni de yalan saydılar. Biz ise, qıyametni inkâr etkenler içün, alevli bir ateş azırladıq."
        cid: 0
  - verse: 12
    segments:
      - text: "Ceennem ateşi uzaq bir mesafeden olarnı korgence, onıñ opkelenüvini (muthiş qaynavını) ve gurültisini eşitirlir. (Ceennemniñ insanlarnı korüvi, onıñnen qarşılaşmaq manasında micaz ola bilgeni kibi, Allaһnıñ ateşke korüş qabiliyetini berüvi manasında aqiqat da ola bilir)."
        cid: 0
  - verse: 13
    segments:
      - text: "Elleri boyunlarına bağlı olaraq, onıñ (ceennemniñ) tar bir yerine atılğan zamanları, o yerçikte yoq olup ketmekni isterler."
        cid: 0
  - verse: 14
    segments:
      - text: "(Olarğa boyle denilir:) Bugun (yalıñız) bir defa yoq olmaqnı istemeñ; aksine bir çoq kereler yoq olmaqnı isteñ! (Bu hitap ile butün azapnıñ qarşılaşılğan azaptan ibaret olmağanı, daa çoq çeşit azaplar olarnı beklegenini bildirmekte. Bir de, ceennem azabınıñ devamiyligini ifade etken başqa ayetler diqqatqa alınğanda, bu hitaptan inkârcılarnıñ yanğan terileri tazelenecegi, boylece, tekrar-tekrar azapqa oğraycaqları manası añlaşıla)."
        cid: 0
  - verse: 15
    segments:
      - text: "De ki: Bu daa yahşımı, yoqsa taqva saiplerine vade etilgen ebediylik cennetimi? O yer, olar içün bir mukâfat ve (uzurğa qavuşacaq) bir barılacaq yerleridir."
        cid: 0
  - verse: 16
    segments:
      - text: "Olar içün o yerde ebediy qalmaq uzre, istegen er şeyleri bardır. İşte bu, Rabbiñniñ uzerine (alğan ve yerine ketirilüvi) istenilgen bir vadedir. (Mu’minlerniñ dualarında ep bu vadeniñ yerine ketirlüvini istegenleri, ya da bunıñ istenilmege degerli vade olğanı añlatılmaqta)."
        cid: 0
  - verse: 17
    segments:
      - text: "O kunü Rabbiñ olarnı ve Allaһtan başqasına tabınğan şeylerini toplar da, der ki: Şu qullarımnı siz saptırdıñızmı, yoqsa ozleri yoldan çıqtılarmı? («Allaһtan başqa tabınğan şeyleri» aqqında tefsirlerde çeşit izaatlar bar. Bular tañrı diye, tabınğanları (İsa aleyhisselâm, Uzeyr aleyhisselâm kibi) elçiler, cinler ya da putlar ola bilir. «Bular putlardıң» degen tefsirlerde, Cenab-ı Allaһnıñ olarğa til berip, aqiqatnı söyletecegi ifade etilgen)."
        cid: 0
  - verse: 18
    segments:
      - text: "Olar: Seni tenzih etermiz. Seni bıraqıp da, başqalarını dost tutmaq bizge yaraşmaz; faqat sen olarğa ve atalarına o qadar bol nimet berdiñ ki, soñunda (seni) añmaqnı unuttılar ve elâketni haq etken bir qavm oldılar, derler."
        cid: 0
  - verse: 19
    segments:
      - text: "(Bunıñ uzerine o birlerine hitaben boyle denilir:) İşte (tabınğanlarıñız), söylegenleriñizde sizni yalancığa çıqardılar. Artıq ne (azabıñıznı) keri çevire bile, ne de bir yardım isteye bilirsiñiz. Arañızdan zulum etkenlerge buyuk bir azap tattıracaqmız!"
        cid: 0
  - verse: 20
    segments:
      - text: "(Resulım!) Senden evel yollağan butün peyğamberlerimiz de, iç şubesiz, aş aşar, çarşılarda dolaşır ediler. (Ey, insanlar!) Siziñ bir qısmıñıznı diger bir qısmıñızğa imtian (veselisi) yaptıq; (baqayıq) sabır eteceksiñizmi? Rabbiñ er şeyni haqqı ile kormektedir. (Bu ayette mu’minlerden, muşriklerniñ olarğa berecek cezalarğa dayanuvları istenilmekte; Allaһ er şeyni haqqı ile kormekte olğanı bildirilerek, zalımlarnıñ da, iman kureşinde sabır ve metanet kostergenlerniñ de, yapqanlarınıñ qarşılığını korecekleri ifade etilmekte ve mu’minlerge teselli berilmekte)."
        cid: 0
  - verse: 21
    segments:
      - text: "Biznen qarşılaşmaqnı (bir kun uzurumızğa kelecelerini) umüt etmegenler: Bizge ya melekler endirilmeli edi, ya da Rabbimizni kormeli edik, dediler. Ant olsun ki, olar ozleri aqqında kibrge qapılğan ve adden aşuvda ziyade ileri ketken ediler."
        cid: 0
  - verse: 22
    segments:
      - text: "(Faqat) meleklerni korecek kunleri, gunahkârlarğa o kunü iç bir quvançlı haber yoqtır ve: (Sizge sevinmek) yasaqtır, yasaq! deycekler. (Bu sözni muşriklerniñ oz-ozlerine söylep, kederlenecekleri manası tüşünile bilinecegi kibi, zamirniñ meleklerge yollanıluvı ve bu sözniñ melekler tarafından söylenecegi şeklinde añlaşıluvı da mumkün)."
        cid: 0
  - verse: 23
    segments:
      - text: "Olarnıñ yapqan er bir (yahşı) işlerini elge alırmız, onı sepilgen zerreler alına ketirirmiz (degersiz etermiz). (Kâfirlerniñ, musafirge ikram, aqrabağa ziyaret kibi guzel davranışlarınıñ, iman etmegenleri sebebinen, boşına ketecegi, işke yaramağanı añlaşılacağı beyan etilmekte)."
        cid: 0
  - verse: 24
    segments:
      - text: "O kunü cennetlilerniñ qalacaq yerleri çoq uzurlı ve raatlanacaq yerleri pek guzeldir."
        cid: 0
  - verse: 25
    segments:
      - text: "O kunü kok yuzü beyaz bulutlarnen yarılacaq ve melekler top-top endirilecekler."
        cid: 0
  - verse: 26
    segments:
      - text: "İşte, o kunü aqiqiy mulk (ukümranlıq) çoq merhametli olğan Allaһnıñdır. Kâfirler içün de pek çetin bir kundir o."
        cid: 0
  - verse: 27
    segments:
      - text: "O kunü zalım kimse (peşmanlıqtan) ellerini tişlep, boyle der: Keşke o peyğambernen birlikte bir yol tutsam edi!"
        cid: 0
  - verse: 28
    segments:
      - text: "Yazıq maña! Keşke felânçanı (batıl yolcusını) dost tutmasam edi!"
        cid: 0
  - verse: 29
    segments:
      - text: "Çünki, zikr (Qur’an) maña kelgen eken, o, aqiqaten meni ondan sapıttı. Şeytan insannı (uçurımğa süyreklep, soñra) yuzüqoyun bıraqıp, rezil-rusvay eter. (Bu ayetlerniñ Ukbe b. Ebiy Muayt aqqında nazil olğanı ifade etile. Rivayetke kore, Ukbe bergen bir ziyafetine Resul-ı Ekremni de davet etken edi. Az.Peyğamber, o şeadet ketirmegence, yemenginden aşamaycağını söylegeninen, Kelime-i Şeadetni ketirgen; faqat muşriklerniñ ileri kelgenlerinden Ubey b. Halefniñ goñlüni hoş etmek içün, soñunda sözünden qaytqan ve barıp Az.Peyğamberge aqaretlerde bulunğan edi)."
        cid: 0
  - verse: 30
    segments:
      - text: "Peyğamber der ki: Ey, Rabbim! Qavmım bu Qur’annı bus-butün terk etti. (Ayette Az.Peyğamberniñ Qur’anğa kerekli deger bermegen ve atta onıñnen alay etken qavmından şikâyeti añlatıla. Ayetteki «mehcuuran» kelimesi «yaman söz” manasında da añlaşıla. Bu manağa kore, muşriklerniñ Qur’annı sihir ve bunıñ kibi, başqa bir şey, degen davalarına işaret etile)."
        cid: 0
  - verse: 31
    segments:
      - text: "(Resulım!) İşte, biz boylece, er bir peyğamber içün qabaatlılardan duşmanlar peyda ettik. Hidayet berici ve yardımci olaraq Rabbiñ yeterlidir."
        cid: 0
  - verse: 32
    segments:
      - text: "İnkâr etkenler: Qur’an oña bir kereden, toplu alda endirilmeli degil edimi? dediler. Biz onı seniñ qalbiñye yahşıca yerleştirmek içün boyle yaptıq (parçaparça endirdik) ve onı dane-dane (ayıraraq) oqudıq."
        cid: 0
  - verse: 33
    segments:
      - text: "Olarnıñ saña ketirgen iç bir misali yoqtır ki, (onıñ qarşılığında) saña doğrusını ve daa açığını ketirmeyik."
        cid: 0
  - verse: 34
    segments:
      - text: "Yuzüqoyun ceennemge (süyrelip) toplanacaqlar; işte olar, yerleri eñ fena, yolları eñ sapıq olğanlardır."
        cid: 0
  - verse: 35
    segments:
      - text: "Ant olsun, biz Musağa Kitapnı berdik, qardaşı Harunnı da, oña yardımcı yaptıq."
        cid: 0
  - verse: 36
    segments:
      - text: "«Ayetlerimizni yalan sayğan qavmğa barıñ», dedik, soñunda (ölğa kelmegenlerinden), olarnı yernen bir ete qoydıq."
        cid: 0
  - verse: 37
    segments:
      - text: "Nuһ qavmına kelgende, peyğamberlerni yalancılıqnen qabaatlağanlarında, olarnı suvda boğdıq ve ozlerini insanlar içün bir ibret yaptıq. zalımlar içün elem berici bir azap azırladıq."
        cid: 0
  - verse: 38
    segments:
      - text: "Aadnı, Semuudnı, Ress halqını ve bular arasında daa bir çoq nesillerni de (inkârcılıqlarından sebep, elâk ettik). («Aad» һuud (a.s.)nıñ, «Semuud» Salih (a.s.)nıñ qavmıdır. «Ress» aqqında çeşit tefsirler bar; esasen Şuayb (a.s.)nıñ qavmı olaraq bilinmektedir. Bir tefsirge kore ise, Yemaame ozeni boyundaki bir koyniñ adı olup, Semuud qavmından qalğanlar bu yerde otura ediler. Faqat bu malümatlar sahih haberlernen isbat etilmegen. Qur’an tarafından bizge bildirilgen husus «Ashab-ı Ress» denilgen bir insan toplulığı yaşağanı ve kufürleri sebebinden, elâk etilgenidir)."
        cid: 0
  - verse: 39
    segments:
