  - verse: 66
    segments:
      - text: "O yer, aqiqaten, ne fena bir yerleşüv ve yaşalacaq yerdir!"
        cid: 0
  - verse: 67
    segments:
      - text: "(O qullar), arclağanlarında ne israf, ne de saranlıq eterler; ekisiniñ arasında orta bir yol tutarlar."
        cid: 0
  - verse: 68
    segments:
      - text: "Kene olar ki, Allaһnen beraber, (tutqan) başqa bir tañrığa yalvarmazlar, Allaһ aram qılğan cannı aqsız yerde qıymazlar ve zina etmezler. Bularnı yapqan gunahı(nıñ cezasını) bulır;"
        cid: 0
  - verse: 69
    segments:
      - text: "Qıyamet kunü azabı qat-qat arttırılır ve onda (azapta) aşşalanğan olaraq, devamlı qalır."
        cid: 0
  - verse: 70
    segments:
      - text: "Ancaq tövbe ve iman etip, yahşı davranışta bulunğanlar başqadır; Allaһ olarnıñ yamanlıqlarını eyiliklerge çevirir. Allaһ çoq bağışlayıcıdır, ziyade merhamet saibidır;"
        cid: 0
  - verse: 71
    segments:
      - text: "Kim tövbe etip, yahşı davranış kosterse, şubesiz o, tövbesi qabul olunğan alda Allaһqa döner."
        cid: 0
  - verse: 72
    segments:
      - text: "(O qullar), yalan yerde şaatlıq etmezler, boş sözlernen qarşılaşqanlarında eybetli alda (o yerden) keçip keterler."
        cid: 0
  - verse: 73
    segments:
      - text: "Ozlerine Rabbleriniñ ayetleri hatırlatılğanda ise, olarğa nisbeten sağır ve kor davranmazlar;"
        cid: 0
  - verse: 74
    segments:
      - text: "(Ve o qullar): Rabbimiz, bizge kozümizni aydınlatacaq qadınlar ve zurriyetler bağışla ve bizni taqva saiplerine reber et! derler."
        cid: 0
  - verse: 75
    segments:
      - text: "İşte olarğa, sabır etüvlerine qarşılıq, cennetniñ eñ yuksek maqamı berilecek, o yerde urmet ve selâmnen qarşılanacaqlar."
        cid: 0
  - verse: 76
    segments:
      - text: "O yerde ebediy qalacaqlar. O yer ne guzel bir yerleşüv ve yaşalacaq yerdir."
        cid: 0
  - verse: 77
    segments:
      - text: "(Resulım!) De ki: (Qullık ve) yalvaruvıñız olmasa, Rabbim sizge ne dep deger bersin? (Ey, inkârcılar! Sizge Resulnıñ bildergenlerini) kesen-kes yalan saydıñız; onıñ içün azap yaqañıznı bıraqmaycaq."
        cid: 0