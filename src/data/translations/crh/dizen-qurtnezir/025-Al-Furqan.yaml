surah_id: 25
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >
          Alemlerge tenbiyeci olsun diye, qulı Muhammedge Furqannı endirgen, köklerniñ ve
          yerniñ ükümranlığını özüne ait olğan, iç bala edinmegen, mülkinde ortağı
          olmağan, er şeyni yaratıp, oña bir nizam bergen ve taqdirini tayin etken Allah
          yüceler yücesidir.
        cid: 0
  - verse: 2
    segments:
      - text: >
          [1 ayetine baq.]
        cid: 0
  - verse: 3
    segments:
      - text: >
          (Kâfirler) Onı (Allahnı) bıraqıp, iç bir şey yaratalmağan, aksine özleri
          yaratılğan olup, özlerine bile ne zarar, ne de fayda bere bilgen, öldürmege ve
          ayat bermege ve ölülerni ğayrıdan tiriltip, qabirden çıqarmağa küçleri yetmegen
          tañrılar edindiler.
        cid: 0
  - verse: 4
    segments:
      - text: >
          İnkâr etkenler: Bu (Qur'an), olsa-olsa onıñ (Muhammedniñ) uydırğan bir
          yalanıdır, başqa bir toplum da, bu hususta oña yardım etkendir, dediler.
          Böylece, olar iç şübesiz, aqsızlıqqa ve iftrağa baş urğan ediler.
        cid: 0
  - verse: 5
    segments:
      - text: >
          Kene olar dediler ki: (Bu ayetler), onıñ, başqasına yazdırıp da, özüne
          saba-aqşam oqunmaqta olğan evelkilerge ait masallardır. (Bu ayette, bazı
          kâfirlerniñ, Qur'an ayetleriniñ evelki qavmlarnıñ masallarından ibaret olğanı,
          Az.Peyğamberniñ bularnı başqalarına yazdırğanı ve ezberlevi içün oña saba-aqşam
          oqulğanı aqqında söz etilmekte. Tefsirlerde umumen üstün körülgen bu mana esasqa
          alınsa, ayetniñ diqqat çekici bir hususqa işaret etkeni körüle ki, bu,
          Az.Peyğamber ümmiy olğanınıñ yani oqumağa-yazmağa bilmegeniniñ, inkârcılarğa
          köre de, bilinmekte ve qabul etilmekte oluvıdır).
        cid: 0
  - verse: 6
    segments:
      - text: >
          (Resulım!) De ki: Onı köklerde ve yerdeki gizliliklerni bilgen Allah endirdi.
          Şübesiz, O, çoq bağışlayıcıdır, ziyade merhametlidir.
        cid: 0
  - verse: 7
    segments:
      - text: >
          Olar (bir de) böyle dediler: Bu nasıl bir peyğamber; (bizler kibi) aş aşay,
          çarşılarda dolaşa! Oña bir melek endirilmeli, özünen birlikte, o da tenbiyeci
          olmalı edi!
        cid: 0
  - verse: 8
    segments:
      - text: >
          Yahut özüne bir hazine berilmeli ya da içinden aşap (meşaqatsız keçinüvini
          teminleyici) bir bağçası olmalı edi. (Ayrıca) o zalımlar (mü'minlerge): Siz,
          ancaq tılsımğa oğrağan bir adamğa uymaqtasıñız! dediler.
        cid: 0
  - verse: 9
    segments:
      - text: >
          (Resulım!) Seniñ aqqıñda baq ne çeşit misaller ketirdiler! Artıq olar
          sapıqlardır ve (hidayetke) iç bir yol da tapalmazlar.
        cid: 0
  - verse: 10
    segments:
      - text: >
          İstese, saña bulardan daa yahşısını, altlarından irmaqlar aqqan cennetlerni
          berecek ve saña saraylar ihsan ete bilecek Allahnıñ şanı yücedir. («Bulardan daa
          yahşısı» denilir eken, kâfirlerniñ, Az.Peyğamberge deger bermek içün, onda
          arağan imkânlarına işaret olunmaqta. Cenab-ı Allah, İraq bölgesindeki zengin
          topraqlarnı, İran padişalarınıñ ve Rum imperatorlarınıñ saraylarını
          musulmanlarğa bermek suretinen, bu vadesini yerine ketirgen).
        cid: 0
  - verse: 11
    segments:
      - text: >
          Olar bunıñ üstüne qıyametni de yalan saydılar. Biz ise, qıyametni inkâr etkenler
          içün, alevli bir ateş azırladıq.
        cid: 0
  - verse: 12
    segments:
      - text: >
          Ceennem ateşi uzaq bir mesafeden olarnı körgence, onıñ öpkelenüvini (müthiş
          qaynavını) ve gürültisini eşitirlir. (Ceennemniñ insanlarnı körüvi, onıñnen
          qarşılaşmaq manasında micaz ola bilgeni kibi, Allahnıñ ateşke körüş qabiliyetini
          berüvi manasında aqiqat da ola bilir).
        cid: 0
  - verse: 13
    segments:
      - text: >
          Elleri boyunlarına bağlı olaraq, onıñ (ceennemniñ) tar bir yerine atılğan
          zamanları, o yerçikte yoq olup ketmekni isterler.
        cid: 0
  - verse: 14
    segments:
      - text: >
          (Olarğa böyle denilir:) Bugün (yalıñız) bir defa yoq olmaqnı istemeñ; aksine bir
          çoq kereler yoq olmaqnı isteñ! (Bu hitap ile bütün azapnıñ qarşılaşılğan azaptan
          ibaret olmağanı, daa çoq çeşit azaplar olarnı beklegenini bildirmekte. Bir de,
          ceennem azabınıñ devamiyligini ifade etken başqa ayetler diqqatqa alınğanda, bu
          hitaptan inkârcılarnıñ yanğan terileri tazelenecegi, böylece, tekrar-tekrar
          azapqa oğraycaqları manası añlaşıla).
        cid: 0
  - verse: 15
    segments:
      - text: >
          De ki: Bu daa yahşımı, yoqsa taqva saiplerine vade etilgen ebediylik cennetimi?
          O yer, olar içün bir mükâfat ve (uzurğa qavuşacaq) bir barılacaq yerleridir.
        cid: 0
  - verse: 16
    segments:
      - text: >
          Olar içün o yerde ebediy qalmaq üzre, istegen er şeyleri bardır. İşte bu,
          Rabbiñniñ üzerine (alğan ve yerine ketirilüvi) istenilgen bir vadedir.
          (Mü'minlerniñ dualarında ep bu vadeniñ yerine ketirlüvini istegenleri, ya da
          bunıñ istenilmege degerli vade olğanı añlatılmaqta).
        cid: 0
  - verse: 17
    segments:
      - text: >
          O künü Rabbiñ olarnı ve Allahtan başqasına tabınğan şeylerini toplar da, der ki:
          Şu qullarımnı siz saptırdıñızmı, yoqsa özleri yoldan çıqtılarmı? («Allahtan
          başqa tabınğan şeyleri» aqqında tefsirlerde çeşit izaatlar bar. Bular tañrı
          diye, tabınğanları (İsa aleyhisselâm, Uzeyr aleyhisselâm kibi) elçiler, cinler
          ya da putlar ola bilir. «Bular putlardır» degen tefsirlerde, Cenab-ı Allahnıñ
          olarğa til berip, aqiqatnı söyletecegi ifade etilgen).
        cid: 0
  - verse: 18
    segments:
      - text: >
          Olar: Seni tenzih etermiz. Seni bıraqıp da, başqalarını dost tutmaq bizge
          yaraşmaz; faqat sen olarğa ve atalarına o qadar bol nimet berdiñ ki, soñunda
          (seni) añmaqnı unuttılar ve elâketni haq etken bir qavm oldılar, derler.
        cid: 0
  - verse: 19
    segments:
      - text: >
          (Bunıñ üzerine o birlerine hitaben böyle denilir:) İşte (tabınğanlarıñız),
          söylegenleriñizde sizni yalancığa çıqardılar. Artıq ne (azabıñıznı) keri çevire
          bile, ne de bir yardım isteye bilirsiñiz. Arañızdan zulum etkenlerge büyük bir
          azap tattıracaqmız!
        cid: 0
  - verse: 20
    segments:
      - text: >
          (Resulım!) Senden evel yollağan bütün peyğamberlerimiz de, iç şübesiz, aş aşar,
          çarşılarda dolaşır ediler. (Ey, insanlar!) Siziñ bir qısmıñıznı diger bir
          qısmıñızğa imtian (veselisi) yaptıq; (baqayıq) sabır eteceksiñizmi? Rabbiñ er
          şeyni haqqı ile körmektedir. (Bu ayette mü'minlerden, müşriklerniñ olarğa
          berecek cezalarğa dayanuvları istenilmekte; Allah er şeyni haqqı ile körmekte
          olğanı bildirilerek, zalımlarnıñ da, iman küreşinde sabır ve metanet
          köstergenlerniñ de, yapqanlarınıñ qarşılığını körecekleri ifade etilmekte ve
          mü'minlerge teselli berilmekte).
        cid: 0
  - verse: 21
    segments:
      - text: >
          Biznen qarşılaşmaqnı (bir kün uzurumızğa kelecelerini) ümüt etmegenler: Bizge ya
          melekler endirilmeli edi, ya da Rabbimizni körmeli edik, dediler. Ant olsun ki,
          olar özleri aqqında kibrge qapılğan ve adden aşuvda ziyade ileri ketken ediler.
        cid: 0
  - verse: 22
    segments:
      - text: >
          (Faqat) meleklerni körecek künleri, günahkârlarğa o künü iç bir quvançlı haber
          yoqtır ve: (Sizge sevinmek) yasaqtır, yasaq! deycekler. (Bu sözni müşriklerniñ
          öz-özlerine söylep, kederlenecekleri manası tüşünile bilinecegi kibi, zamirniñ
          meleklerge yollanıluvı ve bu sözniñ melekler tarafından söylenecegi şeklinde
          añlaşıluvı da mümkün).
        cid: 0
  - verse: 23
    segments:
      - text: >
          Olarnıñ yapqan er bir (yahşı) işlerini elge alırmız, onı sepilgen zerreler alına
          ketirirmiz (degersiz etermiz). (Kâfirlerniñ, musafirge ikram, aqrabağa ziyaret
          kibi güzel davranışlarınıñ, iman etmegenleri sebebinen, boşına ketecegi, işke
          yaramağanı añlaşılacağı beyan etilmekte).
        cid: 0
  - verse: 24
    segments:
      - text: >
          O künü cennetlilerniñ qalacaq yerleri çoq uzurlı ve raatlanacaq yerleri pek
          güzeldir.
        cid: 0
  - verse: 25
    segments:
      - text: >
          O künü kök yüzü beyaz bulutlarnen yarılacaq ve melekler top-top endirilecekler.
        cid: 0
  - verse: 26
    segments:
      - text: >
          İşte, o künü aqiqiy mülk (ükümranlıq) çoq merhametli olğan Allahnıñdır. Kâfirler
          içün de pek çetin bir kündir o.
        cid: 0
  - verse: 27
    segments:
      - text: >
          O künü zalım kimse (peşmanlıqtan) ellerini tişlep, böyle der: Keşke o
          peyğambernen birlikte bir yol tutsam edi!
        cid: 0
  - verse: 28
    segments:
      - text: >
          Yazıq maña! Keşke felânçanı (batıl yolcusını) dost tutmasam edi!
        cid: 0
  - verse: 29
    segments:
      - text: >
          Çünki, zikr (Qur'an) maña kelgen eken, o, aqiqaten meni ondan sapıttı. Şeytan
          insannı (uçurımğa süyreklep, soñra) yüzüqoyun bıraqıp, rezil-rusvay eter. (Bu
          ayetlerniñ Ukbe b. Ebiy Muayt aqqında nazil olğanı ifade etile. Rivayetke köre,
          Ukbe bergen bir ziyafetine Resul-ı Ekremni de davet etken edi. Az.Peyğamber, o
          şeadet ketirmegence, yemenginden aşamaycağını söylegeninen, Kelime-i Şeadetni
          ketirgen; faqat müşriklerniñ ileri kelgenlerinden Ubey b. Halefniñ göñlüni hoş
          etmek içün, soñunda sözünden qaytqan ve barıp Az.Peyğamberge aqaretlerde
          bulunğan edi).
        cid: 0
  - verse: 30
    segments:
      - text: >
          Peyğamber der ki: Ey, Rabbim! Qavmım bu Qur'annı bus-bütün terk etti. (Ayette
          Az.Peyğamberniñ Qur'anğa kerekli deger bermegen ve atta onıñnen alay etken
          qavmından şikâyeti añlatıla. Ayetteki «mehcuuran» kelimesi «yaman söz" manasında
          da añlaşıla. Bu manağa köre, müşriklerniñ Qur'annı sihir ve bunıñ kibi, başqa
          bir şey, degen davalarına işaret etile).
        cid: 0
  - verse: 31
    segments:
      - text: >
          (Resulım!) İşte, biz böylece, er bir peyğamber içün qabaatlılardan duşmanlar
          peyda ettik. Hidayet berici ve yardımci olaraq Rabbiñ yeterlidir.
        cid: 0
  - verse: 32
    segments:
      - text: >
          İnkâr etkenler: Qur'an oña bir kereden, toplu alda endirilmeli degil edimi?
          dediler. Biz onı seniñ qalbiñe yahşıca yerleştirmek içün böyle yaptıq
          (parça-parça endirdik) ve onı dane-dane (ayıraraq) oqudıq.
        cid: 0
  - verse: 33
    segments:
      - text: >
          Olarnıñ saña ketirgen iç bir misali yoqtır ki, (onıñ qarşılığında) saña
          doğrusını ve daa açığını ketirmeyik.
        cid: 0
  - verse: 34
    segments:
      - text: >
          Yüzüqoyun ceennemge (süyrelip) toplanacaqlar; işte olar, yerleri eñ fena,
          yolları eñ sapıq olğanlardır.
        cid: 0
  - verse: 35
    segments:
      - text: >
          Ant olsun, biz Musağa Kitapnı berdik, qardaşı Harunnı da, oña yardımcı yaptıq.
        cid: 0
  - verse: 36
    segments:
      - text: >
          «Ayetlerimizni yalan sayğan qavmğa barıñ», dedik, soñunda (yolğa
          kelmegenlerinden), olarnı yernen bir ete qoydıq.
        cid: 0
  - verse: 37
    segments:
      - text: >
          Nuh qavmına kelgende, peyğamberlerni yalancılıqnen qabaatlağanlarında, olarnı
          suvda boğdıq ve özlerini insanlar içün bir ibret yaptıq. zalımlar içün elem
          berici bir azap azırladıq.
        cid: 0
  - verse: 38
    segments:
      - text: >
          Aadnı, Semuudnı, Ress halqını ve bular arasında daa bir çoq nesillerni de
          (inkârcılıqlarından sebep, elâk ettik). («Aad» huud (a.s.)nıñ, «Semuud» Salih
          (a.s.)nıñ qavmıdır. «Ress» aqqında çeşit tefsirler bar; esasen Şuayb (a.s.)nıñ
          qavmı olaraq bilinmektedir. Bir tefsirge köre ise, Yemaame özeni boyundaki bir
          köyniñ adı olup, Semuud qavmından qalğanlar bu yerde otura ediler. Faqat bu
          malümatlar sahih haberlernen isbat etilmegen. Qur'an tarafından bizge
          bildirilgen husus «Ashab-ı Ress» denilgen bir insan toplulığı yaşağanı ve
          küfürleri sebebinden, elâk etilgenidir).
        cid: 0
  - verse: 39
    segments:
      - text: >
          Olarnıñ er birini (uymaları içün) misaller ketirdik; (amma ögüt almağanları
          içün) episini qırdıq keçirdik. (Olardan evelkelerniñ başlarına kelgenler ve accı
          aqiqatlar, ögüt alsınlar diye, er bir qavmğa, peyğamberler vastasınen,
          añlatılğanı alda, olar bu misal örnekleri üzerinde ibretnen tüşünmek yerine,
          bularnı uydurulğan birer masal qabul ettiler ve niayet, ilâhiy ğadabqa
          oğradılar).
        cid: 0
  - verse: 40
    segments:
      - text: >
          (Resulım!) Ant olsun, (bu mekkeli putperestler), belâ ve felâket yağmurına
          tutulğan o bölgege barğanlar. YA onı körmey edilermi? Yoq, olar ölgenden soñ,
          tirilmekni ümüt etmemekteler. (Tefsirlerde bu ayette mekkeli müşriklerniñ
          ticaret içün barğan Şam seferleri esnasında inkârcılıqları ve sapıq yolda
          inatlıq etüvleri sebebinden, taş yağmurınen elâk etilgen Luut qavmınıñ
          qalımtılarını körgenlerine ve kene de ibret almağanlarına işaret etilgeni
          añlatıla).
        cid: 0
  - verse: 41
    segments:
      - text: >
          Seni körgen vaqıtlarında: «Bumı Allahnıñ peyğamber olaraq yollağanı!» diyerek,
          ep seni alayğa almaqtalar.
        cid: 0
  - verse: 42
    segments:
      - text: >
          «Eger tañrılarımızğa inanuvda sebat köstermese edik, aqiqaten bizni ne yerde
          ise, tañrılıramızdan sapıtacaq edi», deyler. Azapnı körgen vaqıtlarında, aslı
          kimniñ yolu sapıq olğanını bilecekler!
        cid: 0
  - verse: 43
    segments:
      - text: >
          Yaman duyğularını özüne tañrı etken kimseni kördiñmi? Sen (Resulım!) oña
          qorçalayıcı ola bilirsiñmi?
        cid: 0
  - verse: 44
    segments:
      - text: >
          Yoqsa, sen olarnıñ çoqu, aqiqaten (söz) diñleycek yahut tüşünecek belleysiñmi,
          yoq olar ayvanlar kibidir, atta olar yolları itibarınen, daa da sapıqtırlar. (Bu
          kibi kimseler aqıllarına ve özlerine yetip kelgen ilâhiy tebliğge uymayıp, tek
          issiyatına köre areket etüvleri sebebinden, ayvanlarğa beñzetilgen; ayvanlarnıñ
          areketlerin olarğa berilgen küç ve qabiliyetlerniñ yaratılışına uyğun oluvına
          qarşılıq, böyle kimselerniñ davranışları bu hususiyetten yoq oluvından ötrü de,
          olardan ketişat olaraq, daa sapıq olğanları beyan etilgen).
        cid: 0
  - verse: 45
    segments:
      - text: >
          Rabbiñ kölgeni nasıl uzatqanını körmediñmi? Eger istese edi, onı elbette
          areketsiz eter edi. Soñra biz küneşni oña delil yaptıq.
        cid: 0
  - verse: 46
    segments:
      - text: >
          Soñra onı (uzağan kölgeni) yavaş-yavaş özümizge çektik (qısqarttıq).
        cid: 0
  - verse: 47
    segments:
      - text: >
          Siz içün geceni örtü, yuqunı istiraat yapqan, kündüzni de dağılıp, çaluşuv
          (zamanı) yapqan Odır.
        cid: 0
  - verse: 48
    segments:
      - text: >
          Rüzgârlarnı rahmetiniñ ögünde müjdeci olaraq yollağan Odır. Biz ölü topraqqa can
          bermek, yaratqan nice ayvanlarımızğa ve nice insanlarğa suv bermek içün, kökten
          ter-temiz suv endirdik.
        cid: 0
  - verse: 49
    segments:
      - text: >
          [48 ayetine baq.]
        cid: 0
  - verse: 50
    segments:
      - text: >
          Ant olsun, bunı insanlarnıñ ögüt aluvları içün, aralarında çeşit şekillerde
          añlatqandırmız; amma insanlarnıñ çoqu ille nankorlik etip tirelgendirler. (Bu
          ayette «ilâhiy qudretniñ eserleriniñ ve insanlarğa berilgen nimetlerniñ bir çoq
          peyğamberniñ tilinden defalarca ve çeşit-çeşit añlatılğanını» ifade etmek üzre,
          yuqaradaki şekilde mana bermek mümkün olğanı kibi, «suvnı evirip-çevirip, çeşit
          yerlerge türlü-türlü yağmur yağdırdıq» tarzında bir mana da berile bilir).
        cid: 0
  - verse: 51
    segments:
      - text: >
          (Resulım!) Eger istesek edi, elbette er ülkege bir tenbiyeci (peyğamber) yollar
          edik.
        cid: 0
  - verse: 52
    segments:
      - text: >
          (Beynelmilel terbiyecilik vazifesini faqat saña berdik). O alda, kâfirlerge
          boyun egme ve bunıñnen (Qur'annen) olarğa qarşı bar küçüñnen büyük bir küreş
          yap!
        cid: 0
  - verse: 53
    segments:
      - text: >
          Biriniñ suvı tatlı ve suvsızlıqnı qandıracağı, digeriniñki tuzlı ve accı eki
          deñizni birleştirici ve aralarına bir sed, keçilmez bir sıñır qoyğan Odır. (Bu
          ayet aqqında çeşit tefsirler bar: 1) Maqsat - deñizge qarışqan nehr (Dicile
          kibi) ve o qarışqan deñizdir. Deñizni yarıp, arasından kilometrlerce aqıp
          ketkeni alda, nehr suvınıñ dadı bozulmamaqta. 2) Nil kibi büyük irmaq ve
          deñizdir ki, aralarına bir qara parçası (til) kirmektedir. 3) Mü'minlernen
          kâfirlerdir. Tatlı suv - mü'minlerni, accı suv - kâfirlerni temsil ete. Dünyada
          yan-yanaşa, amma bir-birilerine qarışmadan yaşağanlarına işaret etile).
        cid: 0
  - verse: 54
    segments:
      - text: >
          Suvdan (nutfeden) bir insan yaratıp, onı nesep ve sihriyet (qan ve evlilik
          bağından doğğan) yaqınlıqqa dönüştirgen Odır. Rabbiñniñ er şeyge küçü yeter.
        cid: 0
  - verse: 55
    segments:
      - text: >
          (Böyle eken, inkârcılar) Allahnı bıraqıp, özlerine ne fayda, ne de zarar bere
          bilgen şeylerge qullıq etmekteler. İnkârcı da Rabbine qarşi oğraşıp turmaqta.
        cid: 0
  - verse: 56
    segments:
      - text: >
          (Resulım!) Biz seni ancaq müjdeleyici ve tenbiyeci olaraq yolladıq.
        cid: 0
  - verse: 57
    segments:
      - text: >
          De ki: Buña qarşılıq, sizden Rabbiñe doğru bir yol tutmaqnı tilegen kimseler
          (oluvıñızdan) ğayrı, iç bir aq istemeyim.
        cid: 0
  - verse: 58
    segments:
      - text: >
          Ölümsiz ve daima tiri Allahqa işanıp tayan. Onı hamd ile tesbih et. Qullarnıñ
          günahlarını onıñ bilüvi yeter.
        cid: 0
  - verse: 59
    segments:
      - text: >
          Köklerni, yerni ve ekisiniñ arasındakini altı künde yaratqan, soñ Arşqa üküm
          etken Rahmandır. Bunı bir bilgenden sora. (Arşqa ükümranlıq ve altı künde
          yaratuv aqqında A'raaf suresi, 54-nci ayetteki, Arş aqqında huud suresi, 7-nci
          ayetteki izaatlarğa baqıñ).
        cid: 0
  - verse: 60
    segments:
      - text: >
          Olarğa: Rahmanğa secde etiñ denilgen vaqıtta: «Rahman da ne eken! Bizge emir
          etken şeyiñe iç secde etermizmi!», derler ve bu emir olarnıñ nefretini arttırır.
        cid: 0
  - verse: 61
    segments:
      - text: >
          Kökte burclarnı bar etken, olarnıñ içinde bir çıraq (küneş) ve nurlı bir ay
          yerleştirgen Allah yüceler yücesidir.
        cid: 0
  - verse: 62
    segments:
      - text: >
          İbret almaq ya da şükür etmek istegen kimseler içün, gecenen kündüzni
          bir-biriniñ artından ketirgen de Odır.
        cid: 0
  - verse: 63
    segments:
      - text: >
          Rahmannıñ (temiz) qulları olardır ki, yer yüzünde tevazu ile yürerler ve özüni
          bilmegen kimseler olarğa laf atqanda (ıncıtmadan) «Selâm!», derler (keçerler);
        cid: 0
  - verse: 64
    segments:
      - text: >
          Gecelerini Rabblerine secde eterek ve qıyam turaraq keçirirler.
        cid: 0
  - verse: 65
    segments:
      - text: >
          Ve böyle derler: Rabbimiz! Ceennem azabını üzerimizden uzaqlaştır. Doğrusı, onıñ
          azabı kelip-keçici degil, devamlıdır.
        cid: 0
  - verse: 66
    segments:
      - text: >
          O yer, aqiqaten, ne fena bir yerleşüv ve yaşalacaq yerdir!
        cid: 0
  - verse: 67
    segments:
      - text: >
          (O qullar), arclağanlarında ne israf, ne de saranlıq eterler; ekisiniñ arasında
          orta bir yol tutarlar.
        cid: 0
  - verse: 68
    segments:
      - text: >
          Kene olar ki, Allahnen beraber, (tutqan) başqa bir tañrığa yalvarmazlar, Allah
          aram qılğan cannı aqsız yerde qıymazlar ve zina etmezler. Bularnı yapqan
          günahı(nıñ cezasını) bulır;
        cid: 0
  - verse: 69
    segments:
      - text: >
          Qıyamet künü azabı qat-qat arttırılır ve onda (azapta) aşşalanğan olaraq,
          devamlı qalır.
        cid: 0
  - verse: 70
    segments:
      - text: >
          Ancaq tövbe ve iman etip, yahşı davranışta bulunğanlar başqadır; Allah olarnıñ
          yamanlıqlarını eyiliklerge çevirir. Allah çoq bağışlayıcıdır, ziyade merhamet
          saibidır;
        cid: 0
  - verse: 71
    segments:
      - text: >
          Kim tövbe etip, yahşı davranış kösterse, şübesiz o, tövbesi qabul olunğan alda
          Allahqa döner.
        cid: 0
  - verse: 72
    segments:
      - text: >
          (O qullar), yalan yerde şaatlıq etmezler, boş sözlernen qarşılaşqanlarında
          eybetli alda (o yerden) keçip keterler.
        cid: 0
  - verse: 73
    segments:
      - text: >
          Özlerine Rabbleriniñ ayetleri hatırlatılğanda ise, olarğa nisbeten sağır ve kör
          davranmazlar;
        cid: 0
  - verse: 74
    segments:
      - text: >
          (Ve o qullar): Rabbimiz, bizge közümizni aydınlatacaq qadınlar ve zurriyetler
          bağışla ve bizni taqva saiplerine reber et! derler.
        cid: 0
  - verse: 75
    segments:
      - text: >
          İşte olarğa, sabır etüvlerine qarşılıq, cennetniñ eñ yüksek maqamı berilecek, o
          yerde ürmet ve selâmnen qarşılanacaqlar.
        cid: 0
  - verse: 76
    segments:
      - text: >
          O yerde ebediy qalacaqlar. O yer ne güzel bir yerleşüv ve yaşalacaq yerdir.
        cid: 0
  - verse: 77
    segments:
      - text: >
          (Resulım!) De ki: (Qullık ve) yalvaruvıñız olmasa, Rabbim sizge ne dep deger
          bersin? (Ey, inkârcılar! Sizge Resulnıñ bildergenlerini) kesen-kes yalan
          saydıñız; onıñ içün azap yaqañıznı bıraqmaycaq.
        cid: 0
