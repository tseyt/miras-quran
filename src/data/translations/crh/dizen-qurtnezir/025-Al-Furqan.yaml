  - verse: 44
    segments:
      - text: "Yoqsa, sen olarnıñ çoqu, aqiqaten (söz) diñleycek yahut tüşünecek belleysiñmi, yoq olar ayvanlar kibidir, atta olar yolları itibarınen, daa da sapıqtırlar. (Bu kibi kimseler aqıllarına ve ozlerine yetip kelgen ilâhiy tebliğge uymayıp, tek issiyatına kore areket etüvleri sebebinden, ayvanlarğa beñzetilgen; ayvanlarnıñ areketlerin olarğa berilgen kuç ve qabiliyetlerniñ yaratılışına uyğun oluvına qarşılıq, boyle kimselerniñ davranışları bu hususiyetten yoq oluvından otrü de, olardan ketişat olaraq, daa sapıq olğanları beyan etilgen)."
