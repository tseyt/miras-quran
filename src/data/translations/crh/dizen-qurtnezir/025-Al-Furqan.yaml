        cid: 0
  - verse: 40
    segments:
      - text: "(Resulım!) Ant olsun, (bu mekkeli putperestler), belâ ve felâket yağmurına tutulğan o bolgege barğanlar. Ya onı kormey edilermi? Yoq, olar olgenden soñ, tirilmekni umüt etmemekteler. (Tefsirlerde bu ayette mekkeli muşriklerniñ ticaret içün barğan Şam seferleri esnasında inkârcılıqları ve sapıq yolda inatlıq etüvleri sebebinden, taş yağmurınen elâk etilgen Luut qavmınıñ qalımtılarını korgenlerine ve kene de ibret almağanlarına işaret etilgeni añlatıla)."
        cid: 0
  - verse: 41
