        cid: 0
  - verse: 53
    segments:
      - text: "Biriniñ suvı tatlı ve suvsızlıqnı qandıracağı, digeriniñki tuzlı ve accı eki deñizni birleştirici ve aralarına bir sed, keçilmez bir sıñır qoyğan Odır. (Bu ayet aqqında çeşit tefsirler bar: 1) Maqsat - deñizge qarışqan nehr (Dicile kibi) ve o qarışqan deñizdir. Deñizni yarıp, arasından kilometrlerce aqıp ketkeni alda, nehr suvınıñ dadı bozulmamaqta. 2) Nil kibi buyuk irmaq ve deñizdir ki, aralarına bir qara parçası (til) kirmektedir. 3) Mu’minlernen kâfirlerdir. Tatlı suv - mu’minlerni, accı suv - kâfirlerni temsil ete. Dünyada yan-yanaşa, amma bir-birilerine qarışmadan yaşağanlarına işaret etile)."
        cid: 0
