surah_id: 99
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "Yer qurresi ozüne has sarsıntısınen sallanğan, topraq ağırlıqlarını tışqa çıqarğan ve insan: «Ne olmqta buña!», degen vaqıtta, işte, o kunü (er) Rabbiñniñ oña bildirüvinen, butün haberlerini añlatır."
        cid: 0
  - verse: 6
    segments:
      - text: "O kunü insanlar amellerini korüvleri (qarşılığını aluvları) içün darmadağınıq keri qaytıp kelirler."
        cid: 0
  - verse: 7
    segments:
      - text: "Kim zerre miqdarı hayır yapqan ise, onı korer."
        cid: 0
  - verse: 8
    segments:
      - text: "Kim de zerre miqdarı şerr işlegen ise, onı korer. (Er ağırlığını tışqa çıqaruvı bir-qaç türlü tefsir etilgen. 1. İçindeki hazinelerni tışqa çıqarır, faqat olarğa baqqan olmaz. 2. Qabirlerdeki olüler tirilir. 3. Yer altındaki madenler, gazlar, yanardağlar tışqa fırlanır)."
        cid: 0