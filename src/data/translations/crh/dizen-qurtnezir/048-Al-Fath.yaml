        cid: 3
      - text: >-
          (Keçmişte ve kelecekte günahtan uzaq olğan Peyğamberge tamamlanğan ilâhiy nimet -
          Mekke ve Taifniñ fethi, dünyada şerefiniñ yücelbtilvi, yardım ve zaferge nail oluvı,
          baş qaldırğalarnıñ boyun egüvi şeklinde yüz bergen. Aqiqaten, Az. Peyğamber Allahnıñ
          habibidir, evelki şeriatlarnı tamamlağan ve tüzeltken. Miracğa nail olğan, eñ yüce
          maqamlarğa qadar yükselgen, ins ve cinge Peyğamber olğan, ğanimet özüne ve ümmetine
          elâl etilgen, şefaatı maqbul olunğan, teşşehudde, ezanda ve Qur'annıñ bir çoq
          yerinde Allahnen birlikte añılğan, oña itaat - Allahqa itaat sayılğan. Kelime-i
          Tevhidniñ eki rukninden biri olğan, böylece, özü içün bütün nimetler tamanlanğan).
        cid: 0
