surah_id: 48
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >-
          Biz saña, doğrusı, ap-açıq bir fetiһ ihsan ettik.
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Boylece, Allaһ seniñ keçmiş ve kelecek gunahıñnı bağışlar. Saña olğan nimetini
          tamamlar ve seni doğru bir yolğa qavuştırır.
        cid: 0
  - verse: 3
    segments:
      - text: >-
          Ve saña şanlı bir zafernen yardım eter. (Keçmişte ve kelecekte gunahtan uzaq
          olğan Peyğamberge tamamlanğan ilâhiy nimet - Mekke ve Taifniñ fethi, dünyada
          şerefiniñ yucelbtilvi, yardım ve zaferge nail oluvı, baş qaldırğalarnıñ boyun
          egüvi şeklinde yuz bergen. Aqiqaten, Az. Peyğamber Allaһnıñ habibidir, evelki
          şeriatlarnı tamamlağan ve tüzeltken. Miracğa nail olğan, eñ yuce maqamlarğa
          qadar yukselgen, ins ve cinge Peyğamber olğan, ğanimet ozüne ve ummetine elâl
          etilgen, şefaatı maqbul olunğan, teşşehudde, ezanda ve Qur’annıñ bir çoq yerinde
          Allaһnen birlikte añılğan, oña itaat - Allaһqa itaat sayılğan. Kelime-i
          Tevhidniñ eki rukninden biri olğan, boylece, ozü içün butün nimetler
          tamanlanğan).
        cid: 0
  - verse: 4
    segments:
      - text: >-
          İmanlarını bir qat daa arttırsınlar diye, mu’minlerniñ qalplerine işanç
          endirgen Odır. Koklerniñ ve yerniñ orduları Allaһnıñdır. Allaһ bilicidir, er
          şeyni ikmetle yapıcıdır.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          (Butün bu lütfler) mu’min erkeklernen, mu’min qadınlarnı içinde ebediy qalacaq,
          zemininden irmaqlar aqqan cennetlerine qoyuvı, olarnıñ gunahlarını qapatmaq
          içündir. İşte, bu, Allaһ qatında buyuk bir qurtulıştır.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          (Bir de bular) Allaһ aqqında fena zanda bulunğan munafıq erkeklerge ve munafıq
          qadınlarğa, Allaһqa ortaq qoşqan erkeklerge ve ortaq qoşqan qadınlarğa azap
          etüvi içündir. Musulmanlar içün beklegen yamanlıqlarınıñ çemberi başlarına
          kelsin! Allaһ olarğa ğadap etken, lânetlegen ve ceennemni olarğa azırlağan. O
          yer ne fena bir yerdir!
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Koklerniñ ve yerniñ orduları Allaһnıñdır. Allaһ azizdir, hakimdir.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Şubesiz, biz seni şaat, mujdeleyici ve tenbiyeci olaraq yolladıq.
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Ta ki, (ey, mu’minler!) Allaһqa ve Resulına iman etersiñiz, Resulına yardım
          etersiñiz, Oña sayğı kosterirsiñiz ve saba-aqşam Allaһnı tesbih etersiñiz.
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Muaqqaq ki, saña biat etkenler, ancaq Allaһqa biat etmektedirler. Allaһnıñ eli
          olarnıñ elleriniñ uzerindedir. Kim ahtını bozar ise, ancaq oz aleyhine bozğan
          olur. Kim de Allaһ ile olğan ahtına vefa kosterir ise, Allaһ oña buyuk bir
          mukâfat berecek. (Ayet, Qureyşnen musulmanlar arasında yapılğan 10 yıllıq
          muddetli Hudaybiye antlaşuvına ve bu antlaşuv sırasındaki biatqa işaret etmekte.
          Boyle ki, icertniñ altıncı yılı Az. Peyğamber umre yapmaq içün 1400 musulmannen
          Mekkege doğru yolğa çıqqan edi. Faqat Qureyş musulmanlarnı Mekkege kirsetmek
          istemegenlerinden, oglerine ordu birligi çıqarğan, Az. Peyğamber de, vadiler
          aşıp, Hudeybiyege kelgen edi. Cenkleşmek niyetinde degil edi. Añlaşmaq içün Az.
          Osmannı Qureyşke elçi yollağan, Az. Osmannıñ qaytuvı keçikkeninen, Peyğamberimiz
          bir terekniñ astına oturaraq, ashabından, Osman oldürilgen ise, olgenge qadar
          cenkleşeceklerine dair söz alğan edi. Olar da Az. Peyğamberge biat etip, bu
          sözni bergenler, soñunda Az. Osman kelgen edi).
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Bedeviylerden artta qalğanlar, saña deycekler ki: «Mallarımız ve ailelerimiz
          bizni toqtattılar. Allaһtan bizim bağışlanuvımıznı iste». Olar qalplerinde
          olmağannı tillerinen söylerler. De ki: Allaһ sizge bir zarar kelüvini istese, ya
          da bir fayda elde etüviñizni istese, oña qarşı kimniñ bir şeyge kuçü yete bilir?
          Doğrusı, Allaһ yapqanlarıñızdan haberdardır. (Bu yerde Qureyşniñ ucüminden
          qorqqanları içün, seferge çıqmağan, Medine civarında oturğan Eslem, Cuheyne,
          Muzeyne ve Ğıfar qabilelerine işaret etilmekte. Bular Hudaybiyeden qaytqanda,
          Az. Peyğamberden afu sorağan ediler).
        cid: 0
  - verse: 12
    segments:
      - text: >-
          Aslında siz Peyğamber ve mu’minler ailelerine bir daa dönmeycekler bellegen
          ediñiz. Bu siziñ goñyulleriñizge guzel koründi de, yaman zanda bulundıñız ve
          elâketni haq etken bir toplulıq oldıñız.
        cid: 0
  - verse: 13
    segments:
      - text: >-
          Kim Allaһqa ve Resulına iman etmese, bilsin ki, biz kâfirler içün çılğın bir
          ateş azırlağandırmız.
        cid: 0
  - verse: 14
    segments:
      - text: >-
          Koklerniñ ve yerniñ mulki Allaһnıñdır. O, istegenini bağışlar, istegenine ceza
          berir. Allaһ çoq bağışlayıcı, çoq merhamet eticidir.
        cid: 0
  - verse: 15
    segments:
      - text: >-
          Siz ğanimetlerni almaq içün barğanıñızda, seferden artta qalğanlar: Bıraqıñ,
          biz de artıñızğa tüşeyik, deycek ediler. Olar, Allaһnıñ sözüni deñiştirmek
          isterler. De ki: «Siz asla bizim peşimizge tüşmeyceksiñiz! Allaһ daa evel siz
          içün boyle buyurğandır». Olar sizge: Yoq, bizni kunlemektesiñiz, deycekler.
          Albuki, olar pek az añlağan kimselerdir. (Az. Peyğamber icertniñ altıncı yılında
          Hudeybiyeden qaytqandan soñ, kelecek yılnıñ başlarında Hudeybiyege iştirak
          etkenlernen birlikte Hayber seferine çıqqan, o yerni fetih etken edi. Bu
          fetihten musulmanlarğa çoqça ğanimet tüşken, buña iştirak etmegenler, ğanimet
          hırsına qapılaraq, talapta bulunğan ediler. Ayette bu vaqiağa işaret etilgen,
          Az. Peyğamber Hudeybiyede olğanlarnen Hayberge barğan, ğanimetlerni olarğa
          taqsim etken, artta qalğanlarğa ğanimet berilmeycegine, ğanimette esasen
          Hudeybiyege qatılğanlarnıñ ortaq olacaqlarına dair ilâhiy ukümni tedbiq etken
          edi).
        cid: 0
  - verse: 16
    segments:
      - text: >-
          Bedeviylerden (seferden) artta qalğanlarğa de ki: Siz yaqında çoq quvetli bir
          qavmğa qarşı cenkleşüvge çağrılacaqsıñız. Olarnen, teslim olğanğa qadar,
          cenkleşeceksiñiz. Eger emirge itaat etseñiz, Allaһ sizge guzel bir mukâfat
          berir. Amma, evelden döngeniñiz kibi, kene dünecek olsañız, sizni elem berici
          bir azapqa oğratır. (Hudeybiye seferinden artta qalğanlarnıñ cenkke çağırılğan
          quvetli toplulıqnıñ farslılar ya da rimliler olğanı bildirilgen).
        cid: 0
  - verse: 17
    segments:
      - text: >-
          Korge vebal yoqtır, topalğa da vebal yoqtır, hastağa da vebal yoqtır. (Bular
          cenkke qatılmağa mecbur degiller). Kim Allaһqa ve Peyğamberine itaat etse, Allaһ
          onı astından irmaqlar aqqan cenntelerge qoyar. Kim de artta qalsa, onı elemli
          bir azapqa oğratır.
        cid: 0
  - verse: 18
    segments:
      - text: >-
          Ant olsun ki, o terekniñ astında saña biat etkenlerinde, Allaһ o mu’minlerden
          razı olğan. Qalplerinde olğanını bilgen, olarğa işanç duyğusı bergen ve olarnı
          pek yaqın bir fetihnen mukâfatlandırğandır. (Ayetniñ işaret etken biatı,
          Hudeybiyede Semre tereginiñ astında yapılğan «Rıdvan biatı»dır. 1400 sahabi,
          Qureyşke qarşı, olgenge qadar, cenkleşeceklerine yemin etken ediler. Haber
          berilgen yaqın fetih Hayberniñ fethi olaraq añlaşılğandır).
        cid: 0
  - verse: 19
    segments:
      - text: >-
          Kene olarnı elde etecek bir çoq ğanimetlernen de mukâfatlandırdı. Allaһ
          ustündir, ikmet saibidir. (Aqiqaten, kene bir muddet soñra, musulmanlar fetih
          etilgen Hayberde bir çoq ğanimet elde etkenler).
        cid: 0
  - verse: 20
    segments:
      - text: >-
          Allaһ sizge elde etecegiñiz bir çoq ğanimet vade etkendir. (Bu ğanmetlerden)
          işte şularnı aman bergen ve insanlarnıñ ellerini sizden çekken ki, bu,
          mu’minlerge bir işaret olsun ve sizni dos-doğru yolğa qavuştırsın. (Tefsirde,
          umumen, ayetniñ yorumını boyle yapqanlar: Allaһ, vade etken fetihlerinden
          birincisini, yani Hayberni ve ğanimetlerni aman bahş etken. Bu arada
          Hayberlerniñ muttefikleri Esed ve Ğatafan qabileleriniñ de, musulmanlarğa
          udüjmlerniñ ogüni alğan. Hudeybiye barışınen de, Mekkeliler ucüminiñ ogü
          alnğan).
        cid: 0
  - verse: 21
    segments:
      - text: >-
          Daa elde etip olalmağan başqa ğanimetleriñiz de bar ki, olar Allaһnıñ bilgisi
          ve qudretine ait. Allaһ er şeyge qadirdir.
        cid: 0
  - verse: 22
    segments:
      - text: >-
          Eger kâfirler siznen cenkleşse ediler, artlarına dönüp qaçar ediler. Soñ bir
          dost ve yardımcı da tapalmaz ediler. (Ayette ifade etilgenine kore, eger
          qureyşliler, Hudeybiyede barış teklifinde bulunmayıp, cennke kirişleser edi,
          mağlüp olacaq ediler. Cenab-ı Haqnıñ taqdiri boyle yuz berecek edi).
        cid: 0
  - verse: 23
    segments:
      - text: >-
          Allaһnıñ, evelden beri devam etip kelgen qanunı budır. Allaһnıñ qanunında asla
          bir deñişiklik tapalmazsıñ.
        cid: 0
  - verse: 24
    segments:
      - text: >-
          O sizni, olarğa nisbeten, muzaffer etkeninden soñ, Mekkeniñ içinde olarnıñ
          ellerini sizden, siziñ elleriñizni de, olardan çekkendir. Allaһ yapqanlarıñıznı
          korücidir. (Aqiqaten, Cenab-ı Haq Mekke sıñırları içinde, yani Hudeybiyede
          musulmanlarğa zafer bahş etken edi. Boyle ki, duşmandan silâhlı seksen adam,
          musulmanlarnıñ etrafını sarğanda, yaqalanaraq, Az. Peyğamberniñ uzurına
          ketirilgen ediler, Az. Peyğamber de, olarnı afu etken edi. İşte, qureyşlilerniñ
          barış istemelerine bu vaziyet sebep olğan edi).
        cid: 0
  - verse: 25
    segments:
      - text: >-
          Olar, inkâr etken ve siziñ Mescid-i Haramnı ziyaretiñizni ve bekletilgen
          qurbanlarnıñ yerlerine yetişüvlerine mani olğanlardır. Eger (Mekkede) ozlerini
          alâ tanımağan mu’min erkeklernen mu’min qadınlarnı bilmeyerek ezüviñiz
          sebebinen, qasevetke qapıluvıñıznıñ itimalı olmasa edi, (Allaһ cenkniñ ogüni
          almaz edi). İstegenlerine rahmet etmek içün Allaһ boyle yapqan. Eger olar
          birbirinden ayırılğan olsalar edi, elbette olardan inkâr etkenlerni elemli bir
          azapqa çarptırır edik. (Hudeybiyede qureyşliler musulmanlarnıñ Mekkege
          kirüvlerine mani olmaqnen, em Mescid-i Haramnı ziyaret etüvlerine, em de
          azırlanğan qurbanlarını Minada soyuvlarına mani olğan ediler. Ziyaretlerine mani
          oluvnen beraber, musulmanlarğa cenk ve fetih izniniñ berilmemek sebebi, Mekkede
          olğan ve alâ imanını aşkâr etmegen mu’minlerniñ barlığı edi. Mu’minler qureyşli
          kâfirlerden seçilip, ayırılıp olalmağanları içün, fetih keçiktirilgen edi).
        cid: 0
  - verse: 26
    segments:
      - text: >-
          O vaqıtta inkâr etkenler, qalplerine taassubnı (ğadapnı), cahiliye taassubını
          yerleştirgen ediler. Allaһ da, elçisine ve mu’minlerge süyuyunet ve işançını
          endirdi, olarnıñ taqva sözüni tutuvlarını temin etti. Zaten, olar buña lâyıq ve
          lâyıq kimseler edi. Allaһ er şeyni bilicidir. (Ayette keçken taqva sözü - şeadet
          kelimesidir. Taqva kelimesine bağlılıq o sırada ceryan etken vaziyetni
          yatıştırğan. Boyle ki, Hudeybiyede mekkelilernen musulmanlar arasında antlaşuv
          yazılacaq sırada, Az. Peyğamber Az. Alige «Yaz» dedi: «Bu - Allaһ elçisi Mekke
          halqınen yapqan antlaşmadır». Qureyş vekilleri dediler ki: «Biz seniñ Allaһ
          elçisi olğanınını bilsek, siziñ Kâbege kirmeñizge mani olmaymız. Boyle yazıñız:
          «Bu, Abdullah oğlu Muһammed ile Mekke halqı arasındaki antlaşuvdır». Az.
          Peyğamber de oyle yazdırdı. Qureyşlilerniñ bu areketi mu’minlerge çoq ağır
          batqan, amma ayette ifade etilgen taqva sözü olarnı yatıştırıp, sakinleştirgen).
        cid: 0
  - verse: 27
    segments:
      - text: >-
          Ant olsun ki, Allaһ elçisiniñ ruyasını doğru çıqardı. Allaһ istese, siz işanç
          içinde başlarıñıznı tıraş etken ve qısqartqan alda, qorqmadan Mescid-i Haramğa
          kireceksiñiz. Allaһ siziñ bilmegeniñzni bilir. İşte, bundan evel sizge yaqın bir
          fetih berdi. (Rivayetke kore, Az. Peyğamber, Hudeybiyege çıqmadan evel,
          ruyasında ozüniñ ve ashabınıñ işanç içinde başlarını tıraş eterek, Mekkege
          kirgenlerini korgen, bunı ashabına haber bergen. Olar da, çoq sevingenler.
          Niayet, seferge çıqıp Hudeybiyede toqtatılıp, keri qaytqan vaqıtlarında, bu
          vaziyet olarnı çoq kederlendirgen. Bazı munafıqlar da, şubege tüşerek, ustü
          qapalı qonuşmağa başlağanlar. Faqat bunda bir ikmetniñ barlığı bildirilgen,
          fetihniñ muyesser olacağı bildirilerek, bir yıl evelki yaqın fetih (Hayber
          fethi) hatırlatılğan).
        cid: 0
  - verse: 28
    segments:
      - text: >-
          Butün dinlerden ustün qılmaq uzre, Peyğamberini hidayet ve haq din ile yollağan
          Odır. Şaat olaraq Allaһ yeter.
        cid: 0
  - verse: 29
    segments:
      - text: >-
          Muһammed Allaһnıñ elçisidir. Yanındakiler de, kâfirlerge nisbeten çetin, oz
          aralarında merhametlidirler. Olarnı rukuğa barğanda, secde etkende korersiñ.
          Allaһtan lütf ve rizalıq isterler. Olarnıñ belgileri - yuzlerindeki secde
          izidir. Bu, olarnıñ Tevrattaki vasıflarıdır. İncildeki vasıfları da boyledir:
          Olar filisini yarıp çıqarğan, kettikçe onı quvvetlendirerek, qalınlaşqan,
          kevdesi uzerinde turğan bir osümlikke beñzerler ki, bu, ziraatçılarnıñ da oşuna
          keter. Allaһ boylece, olarnı çoqlaştırıp quvetlendirmeknen, kâfirlerni
          opkelendirir. Allaһ olardan inanıp, yahşı işler yapqanlarğa mağfiret ve buyuk
          mukâfat vade etkendir. (Az. Peyğamber ve arqadaşlarınıñ ilki ve soñki
          vaziyetleri bir beñzetüvnen añlatılmaqta. İlk kere yerge atılğan bir urluq kibi
          filislenmege başlağan musulmanlar, kettikçe quvetlenerek, qocaman bir ordu
          olğanlar, İslâm urluğını saçqanlar. Bu vaziyetke soñ derecede sevingenlerinde,
          olarnıñ bu quvetli vaziyetlerini korgen kâfirler de, opkeden çatlaycaq alğa
          kelgen ediler).
        cid: 0