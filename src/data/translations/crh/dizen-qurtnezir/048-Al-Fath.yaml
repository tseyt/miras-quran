surah_id: 48
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >
          Biz saña, doğrusı, ap-açıq bir fetih ihsan ettik.
        cid: 0
  - verse: 2
    segments:
      - text: >
          Böylece, Allah seniñ keçmiş ve kelecek günahıñnı bağışlar. Saña olğan nimetini
          tamamlar ve seni doğru bir yolğa qavuştırır.
        cid: 0
  - verse: 3
    segments:
      - text: >
          Ve saña şanlı bir zafernen yardım eter. (Keçmişte ve kelecekte günahtan uzaq
          olğan Peyğamberge tamamlanğan ilâhiy nimet - Mekke ve Taifniñ fethi, dünyada
          şerefiniñ yücelbtilvi, yardım ve zaferge nail oluvı, baş qaldırğalarnıñ boyun
          egüvi şeklinde yüz bergen. Aqiqaten, Az. Peyğamber Allahnıñ habibidir, evelki
          şeriatlarnı tamamlağan ve tüzeltken. Miracğa nail olğan, eñ yüce maqamlarğa
          qadar yükselgen, ins ve cinge Peyğamber olğan, ğanimet özüne ve ümmetine elâl
          etilgen, şefaatı maqbul olunğan, teşşehudde, ezanda ve Qur'annıñ bir çoq yerinde
          Allahnen birlikte añılğan, oña itaat - Allahqa itaat sayılğan. Kelime-i
          Tevhidniñ eki rukninden biri olğan, böylece, özü içün bütün nimetler
          tamanlanğan).
        cid: 0
  - verse: 4
    segments:
      - text: >
          İmanlarını bir qat daa arttırsınlar diye, mü'minlerniñ qalplerine işanç endirgen
          Odır. Köklerniñ ve yerniñ orduları Allahnıñdır. Allah bilicidir, er şeyni
          ikmetle yapıcıdır.
        cid: 0
  - verse: 5
    segments:
      - text: >
          (Bütün bu lütfler) mü'min erkeklernen, mü'min qadınlarnı içinde ebediy qalacaq,
          zemininden irmaqlar aqqan cennetlerine qoyuvı, olarnıñ günahlarını qapatmaq
          içündir. İşte, bu, Allah qatında büyük bir qurtulıştır.
        cid: 0
  - verse: 6
    segments:
      - text: >
          (Bir de bular) Allah aqqında fena zanda bulunğan munafıq erkeklerge ve munafıq
          qadınlarğa, Allahqa ortaq qoşqan erkeklerge ve ortaq qoşqan qadınlarğa azap
          etüvi içündir. Musulmanlar içün beklegen yamanlıqlarınıñ çemberi başlarına
          kelsin! Allah olarğa ğadap etken, lânetlegen ve ceennemni olarğa azırlağan. O
          yer ne fena bir yerdir!
        cid: 0
  - verse: 7
    segments:
      - text: >
          Köklerniñ ve yerniñ orduları Allahnıñdır. Allah azizdir, hakimdir.
        cid: 0
  - verse: 8
    segments:
      - text: >
          Şübesiz, biz seni şaat, müjdeleyici ve tenbiyeci olaraq yolladıq.
        cid: 0
  - verse: 9
    segments:
      - text: >
          Ta ki, (ey, mü'minler!) Allahqa ve Resulına iman etersiñiz, Resulına yardım
          etersiñiz, Oña sayğı kösterirsiñiz ve saba-aqşam Allahnı tesbih etersiñiz.
        cid: 0
  - verse: 10
    segments:
      - text: >
          Muaqqaq ki, saña biat etkenler, ancaq Allahqa biat etmektedirler. Allahnıñ eli
          olarnıñ elleriniñ üzerindedir. Kim ahtını bozar ise, ancaq öz aleyhine bozğan
          olur. Kim de Allah ile olğan ahtına vefa kösterir ise, Allah oña büyük bir
          mükâfat berecek. (Ayet, Qureyşnen musulmanlar arasında yapılğan 10 yıllıq
          müddetli Hudaybiye antlaşuvına ve bu antlaşuv sırasındaki biatqa işaret etmekte.
          Böyle ki, icertniñ altıncı yılı Az. Peyğamber umre yapmaq içün 1400 musulmannen
          Mekkege doğru yolğa çıqqan edi. Faqat Qureyş musulmanlarnı Mekkege kirsetmek
          istemegenlerinden, öglerine ordu birligi çıqarğan, Az. Peyğamber de, vadiler
          aşıp, Hudeybiyege kelgen edi. Cenkleşmek niyetinde degil edi. Añlaşmaq içün Az.
          Osmannı Qureyşke elçi yollağan, Az. Osmannıñ qaytuvı keçikkeninen, Peyğamberimiz
          bir terekniñ astına oturaraq, ashabından, Osman öldürilgen ise, ölgenge qadar
          cenkleşeceklerine dair söz alğan edi. Olar da Az. Peyğamberge biat etip, bu
          sözni bergenler, soñunda Az. Osman kelgen edi).
        cid: 0
  - verse: 11
    segments:
      - text: >
          Bedeviylerden artta qalğanlar, saña deycekler ki: «Mallarımız ve ailelerimiz
          bizni toqtattılar. Allahtan bizim bağışlanuvımıznı iste». Olar qalplerinde
          olmağannı tillerinen söylerler. De ki: Allah sizge bir zarar kelüvini istese, ya
          da bir fayda elde etüviñizni istese, oña qarşı kimniñ bir şeyge küçü yete bilir?
          Doğrusı, Allah yapqanlarıñızdan haberdardır. (Bu yerde Qureyşniñ ücüminden
          qorqqanları içün, seferge çıqmağan, Medine civarında oturğan Eslem, Cuheyne,
          Muzeyne ve Ğıfar qabilelerine işaret etilmekte. Bular Hudaybiyeden qaytqanda,
          Az. Peyğamberden afu sorağan ediler).
        cid: 0
  - verse: 12
    segments:
      - text: >
          Aslında siz Peyğamber ve mü'minler ailelerine bir daa dönmeycekler bellegen
          ediñiz. Bu siziñ goñülleriñizge güzel köründi de, yaman zanda bulundıñız ve
          elâketni haq etken bir toplulıq oldıñız.
        cid: 0
  - verse: 13
    segments:
      - text: >
          Kim Allahqa ve Resulına iman etmese, bilsin ki, biz kâfirler içün çılğın bir
          ateş azırlağandırmız.
        cid: 0
  - verse: 14
    segments:
      - text: >
          Köklerniñ ve yerniñ mülki Allahnıñdır. O, istegenini bağışlar, istegenine ceza
          berir. Allah çoq bağışlayıcı, çoq merhamet eticidir.
        cid: 0
  - verse: 15
    segments:
      - text: >
          Siz ğanimetlerni almaq içün barğanıñızda, seferden artta qalğanlar: Bıraqıñ, biz
          de artıñızğa tüşeyik, deycek ediler. Olar, Allahnıñ sözüni deñiştirmek isterler.
          De ki: «Siz asla bizim peşimizge tüşmeyceksiñiz! Allah daa evel siz içün böyle
          buyurğandır». Olar sizge: Yoq, bizni künlemektesiñiz, deycekler. Albuki, olar
          pek az añlağan kimselerdir. (Az. Peyğamber icertniñ altıncı yılında Hudeybiyeden
          qaytqandan soñ, kelecek yılnıñ başlarında Hudeybiyege iştirak etkenlernen
          birlikte Hayber seferine çıqqan, o yerni fetih etken edi. Bu fetihten
          musulmanlarğa çoqça ğanimet tüşken, buña iştirak etmegenler, ğanimet hırsına
          qapılaraq, talapta bulunğan ediler. Ayette bu vaqiağa işaret etilgen, Az.
          Peyğamber Hudeybiyede olğanlarnen Hayberge barğan, ğanimetlerni olarğa taqsim
          etken, artta qalğanlarğa ğanimet berilmeycegine, ğanimette esasen Hudeybiyege
          qatılğanlarnıñ ortaq olacaqlarına dair ilâhiy ükümni tedbiq etken edi).
        cid: 0
  - verse: 16
    segments:
      - text: >
          Bedeviylerden (seferden) artta qalğanlarğa de ki: Siz yaqında çoq quvetli bir
          qavmğa qarşı cenkleşüvge çağrılacaqsıñız. Olarnen, teslim olğanğa qadar,
          cenkleşeceksiñiz. Eger emirge itaat etseñiz, Allah sizge güzel bir mükâfat
          berir. Amma, evelden döngeniñiz kibi, kene dünecek olsañız, sizni elem berici
          bir azapqa oğratır. (Hudeybiye seferinden artta qalğanlarnıñ cenkke çağırılğan
          quvetli toplulıqnıñ farslılar ya da rimliler olğanı bildirilgen).
        cid: 0
  - verse: 17
    segments:
      - text: >
          Körge vebal yoqtır, topalğa da vebal yoqtır, hastağa da vebal yoqtır. (Bular
          cenkke qatılmağa mecbur degiller). Kim Allahqa ve Peyğamberine itaat etse, Allah
          onı astından irmaqlar aqqan cenntelerge qoyar. Kim de artta qalsa, onı elemli
          bir azapqa oğratır.
        cid: 0
  - verse: 18
    segments:
      - text: >
          Ant olsun ki, o terekniñ astında saña biat etkenlerinde, Allah o mü'minlerden
          razı olğan. Qalplerinde olğanını bilgen, olarğa işanç duyğusı bergen ve olarnı
          pek yaqın bir fetihnen mükâfatlandırğandır. (Ayetniñ işaret etken biatı,
          Hudeybiyede Semre tereginiñ astında yapılğan «Rıdvan biatı»dır. 1400 sahabi,
          Qureyşke qarşı, ölgenge qadar, cenkleşeceklerine yemin etken ediler. Haber
          berilgen yaqın fetih Hayberniñ fethi olaraq añlaşılğandır).
        cid: 0
  - verse: 19
    segments:
      - text: >
          Kene olarnı elde etecek bir çoq ğanimetlernen de mükâfatlandırdı. Allah
          üstündir, ikmet saibidir. (Aqiqaten, kene bir müddet soñra, musulmanlar fetih
          etilgen Hayberde bir çoq ğanimet elde etkenler).
        cid: 0
  - verse: 20
    segments:
      - text: >
          Allah sizge elde etecegiñiz bir çoq ğanimet vade etkendir. (Bu ğanmetlerden)
          işte şularnı aman bergen ve insanlarnıñ ellerini sizden çekken ki, bu,
          mü'minlerge bir işaret olsun ve sizni dos-doğru yolğa qavuştırsın. (Tefsirde,
          umumen, ayetniñ yorumını böyle yapqanlar: Allah, vade etken fetihlerinden
          birincisini, yani Hayberni ve ğanimetlerni aman bahş etken. Bu arada
          Hayberlerniñ muttefikleri Esed ve Ğatafan qabileleriniñ de, musulmanlarğa
          ucumlerniñ ögüni alğan. Hudeybiye barışınen de, Mekkeliler ücüminiñ ögü
          alınğan).
        cid: 0
  - verse: 21
    segments:
      - text: >
          Daa elde etip olalmağan başqa ğanimetleriñiz de bar ki, olar Allahnıñ bilgisi ve
          qudretine ait. Allah er şeyge qadirdir.
        cid: 0
  - verse: 22
    segments:
      - text: >
          Eger kâfirler siznen cenkleşse ediler, artlarına dönüp qaçar ediler. Soñ bir
          dost ve yardımcı da tapalmaz ediler. (Ayette ifade etilgenine köre, eger
          qureyşliler, Hudeybiyede barış teklifinde bulunmayıp, cennke kirişleser edi,
          mağlüp olacaq ediler. Cenab-ı Haqnıñ taqdiri böyle yüz berecek edi).
        cid: 0
  - verse: 23
    segments:
      - text: >
          Allahnıñ, evelden beri devam etip kelgen qanunı budır. Allahnıñ qanunında asla
          bir deñişiklik tapalmazsıñ.
        cid: 0
  - verse: 24
    segments:
      - text: >
          O sizni, olarğa nisbeten, muzaffer etkeninden soñ, Mekkeniñ içinde olarnıñ
          ellerini sizden, siziñ elleriñizni de, olardan çekkendir. Allah yapqanlarıñıznı
          körücidir. (Aqiqaten, Cenab-ı Haq Mekke sıñırları içinde, yani Hudeybiyede
          musulmanlarğa zafer bahş etken edi. Böyle ki, duşmandan silâhlı seksen adam,
          musulmanlarnıñ etrafını sarğanda, yaqalanaraq, Az. Peyğamberniñ uzurına
          ketirilgen ediler, Az. Peyğamber de, olarnı afu etken edi. İşte, qureyşlilerniñ
          barış istemelerine bu vaziyet sebep olğan edi).
        cid: 0
  - verse: 25
    segments:
      - text: >
          Olar, inkâr etken ve siziñ Mescid-i Haramnı ziyaretiñizni ve bekletilgen
          qurbanlarnıñ yerlerine yetişüvlerine mani olğanlardır. Eger (Mekkede) özlerini
          alâ tanımağan mü'min erkeklernen mü'min qadınlarnı bilmeyerek ezüviñiz
          sebebinen, qasevetke qapıluvıñıznıñ itimalı olmasa edi, (Allah cenkniñ ögüni
          almaz edi). İstegenlerine rahmet etmek içün Allah böyle yapqan. Eger olar
          bir-birinden ayırılğan olsalar edi, elbette olardan inkâr etkenlerni elemli bir
          azapqa çarptırır edik. (Hudeybiyede qureyşliler musulmanlarnıñ Mekkege
          kirüvlerine mani olmaqnen, em Mescid-i Haramnı ziyaret etüvlerine, em de
          azırlanğan qurbanlarını Minada soyuvlarına mani olğan ediler. Ziyaretlerine mani
          oluvnen beraber, musulmanlarğa cenk ve fetih izniniñ berilmemek sebebi, Mekkede
          olğan ve alâ imanını aşkâr etmegen mü'minlerniñ barlığı edi. Mü'minler qureyşli
          kâfirlerden seçilip, ayırılıp olalmağanları içün, fetih keçiktirilgen edi).
        cid: 0
  - verse: 26
    segments:
      - text: >
          O vaqıtta inkâr etkenler, qalplerine taassubnı (ğadapnı), cahiliye taassubını
          yerleştirgen ediler. Allah da, elçisine ve mü'minlerge sükünet ve işançını
          endirdi, olarnıñ taqva sözüni tutuvlarını temin etti. Zaten, olar buña lâyıq ve
          lâyıq kimseler edi. Allah er şeyni bilicidir. (Ayette keçken taqva sözü - şeadet
          kelimesidir. Taqva kelimesine bağlılıq o sırada ceryan etken vaziyetni
          yatıştırğan. Böyle ki, Hudeybiyede mekkelilernen musulmanlar arasında antlaşuv
          yazılacaq sırada, Az. Peyğamber Az. Alige «Yaz» dedi: «Bu - Allah elçisi Mekke
          halqınen yapqan antlaşmadır». Qureyş vekilleri dediler ki: «Biz seniñ Allah
          elçisi olğanıñnı bilsek, siziñ Kâbege kirmeñizge mani olmaymız. Böyle yazıñız:
          «Bu, Abdullah oğlu Muhammed ile Mekke halqı arasındaki antlaşuvdır». Az.
          Peyğamber de öyle yazdırdı. Qureyşlilerniñ bu areketi mü'minlerge çoq ağır
          batqan, amma ayette ifade etilgen taqva sözü olarnı yatıştırıp, sakinleştirgen).
        cid: 0
  - verse: 27
    segments:
      - text: >
          Ant olsun ki, Allah elçisiniñ ruyasını doğru çıqardı. Allah istese, siz işanç
          içinde başlarıñıznı tıraş etken ve qısqartqan alda, qorqmadan Mescid-i Haramğa
          kireceksiñiz. Allah siziñ bilmegeniñzni bilir. İşte, bundan evel sizge yaqın bir
          fetih berdi. (Rivayetke köre, Az. Peyğamber, Hudeybiyege çıqmadan evel,
          ruyasında özüniñ ve ashabınıñ işanç içinde başlarını tıraş eterek, Mekkege
          kirgenlerini körgen, bunı ashabına haber bergen. Olar da, çoq sevingenler.
          Niayet, seferge çıqıp Hudeybiyede toqtatılıp, keri qaytqan vaqıtlarında, bu
          vaziyet olarnı çoq kederlendirgen. Bazı munafıqlar da, şübege tüşerek, üstü
          qapalı qonuşmağa başlağanlar. Faqat bunda bir ikmetniñ barlığı bildirilgen,
          fetihniñ müyesser olacağı bildirilerek, bir yıl evelki yaqın fetih (Hayber
          fethi) hatırlatılğan).
        cid: 0
  - verse: 28
    segments:
      - text: >
          Bütün dinlerden üstün qılmaq üzre, Peyğamberini hidayet ve haq din ile yollağan
          Odır. Şaat olaraq Allah yeter.
        cid: 0
  - verse: 29
    segments:
      - text: >
          Muhammed Allahnıñ elçisidir. Yanındakiler de, kâfirlerge nisbeten çetin, öz
          aralarında merhametlidirler. Olarnı rukuğa barğanda, secde etkende körersiñ.
          Allahtan lütf ve rizalıq isterler. Olarnıñ belgileri - yüzlerindeki secde
          izidir. Bu, olarnıñ Tevrattaki vasıflarıdır. İncildeki vasıfları da böyledir:
          Olar filisini yarıp çıqarğan, kettikçe onı quvvetlendirerek, qalınlaşqan,
          kevdesi üzerinde turğan bir ösümlikke beñzerler ki, bu, ziraatçılarnıñ da oşuna
          keter. Allah böylece, olarnı çoqlaştırıp quvetlendirmeknen, kâfirlerni
          öpkelendirir. Allah olardan inanıp, yahşı işler yapqanlarğa mağfiret ve büyük
          mükâfat vade etkendir. (Az. Peyğamber ve arqadaşlarınıñ ilki ve soñki
          vaziyetleri bir beñzetüvnen añlatılmaqta. İlk kere yerge atılğan bir urluq kibi
          filislenmege başlağan musulmanlar, kettikçe quvetlenerek, qocaman bir ordu
          olğanlar, İslâm urluğını saçqanlar. Bu vaziyetke soñ derecede sevingenlerinde,
          olarnıñ bu quvetli vaziyetlerini körgen kâfirler de, öpkeden çatlaycaq alğa
          kelgen ediler).
        cid: 0
