      - text: >-
          (Ayet, Qureyşnen musulmanlar arasında yapılğan 10 yıllıq müddetli Hudaybiye
          antlaşuvına ve bu antlaşuv sırasındaki biatqa işaret etmekte. Böyle ki, icertniñ
          altıncı yılı Az. Peyğamber umre yapmaq içün 1400 musulmannen Mekkege doğru yolğa
          çıqqan edi. Faqat Qureyş musulmanlarnı Mekkege kirsetmek istemegenlerinden, öglerine
          ordu birligi çıqarğan, Az. Peyğamber de, vadiler aşıp, Hudeybiyege kelgen edi.
          Cenkleşmek niyetinde degil edi. Añlaşmaq içün Az. Osmannı Qureyşke elçi yollağan,
          Az. Osmannıñ qaytuvı keçikkeninen, Peyğamberimiz bir terekniñ astına oturaraq,
          ashabından, Osman öldürilgen ise, ölgenge qadar cenkleşeceklerine dair söz alğan
          edi. Olar da Az. Peyğamberge biat etip, bu sözni bergenler, soñunda Az. Osman kelgen
          edi).
        cid: 0
