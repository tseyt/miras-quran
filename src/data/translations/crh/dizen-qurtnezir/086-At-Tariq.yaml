surah_id: 86
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "Kok yuzüne ve taariqqa (saba yıldızına) yemin eterim. Taariqnıñ ne olğanını ne yerden bileceksiñ? (O, qaranlıqnı) delici yıldızdır. İç kimse yoqtır ki, uzerinde bir qorçalayıcı, bir kozetici olmasın."
        cid: 0
