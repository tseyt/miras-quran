    segments:
      - text: Dönüş saibi
        cid: 2
      - text: >-
          olğan (yağmur yağdırğan) kökke, (ösümliknen) yarılğan yerge yemin eterim ki, Qur'an
          (haq ile batılnı) ayırğan bir sözdir. O, asla bir şaqa degildir. Olar bir tuzaq
          qurarlar, men de bir tuzaq qurarım. Kâfirlerge muhlet ber, olarnı biraz öz allarına
          bıraq (pek yaqında saña yardımımız kelecek).
        cid: 0
