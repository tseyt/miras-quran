        cid: 0
  - verse: 9
    segments:
      - text: "Gizlengenlerniñ ortağa çıqqan kunde, insan içün ne bir kuç, ne de bir yardımcı bar."
        cid: 0
  - verse: 10
    segments:
      - text: "[9 ayetine baq.]"
        cid: 0
  - verse: 11
    segments:
      - text: "Dönüş saibi olğan (yağmur yağdırğan) kokke, (osümliknen) yarılğan yerge yemin eterim ki, Qur’an (haq ile batılnı) ayırğan bir sözdir. O, asla bir şaqa degildir. Olar bir tuzaq qurarlar, men de bir tuzaq qurarım. Kâfirlerge muhlet ber, olarnı biraz oz allarına bıraq (pek yaqında saña yardımımız kelecek)."
        cid: 0
