      - text: Kök yüzüne
        cid: 0
      - text: ve taariqqa
        cid: 2
      - text: (saba yıldızına)
        cid: 0
      - text: yemin eterim. Taariqnıñ ne olğanını ne yerden
        cid: 2
      - text: >-
          bileceksiñ? (O, qaranlıqnı) delici yıldızdır. İç kimse yoqtır ki, üzerinde bir
          qorçalayıcı, bir közetici olmasın.
