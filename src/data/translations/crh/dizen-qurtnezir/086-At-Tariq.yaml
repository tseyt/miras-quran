  - verse: 5
    segments:
      - text: "İnsan neden yaratılğanına bir baqsın! Atılğan bir suvdan yaratıldı. (O suv) sırtnen koküs qafesi arasından sıqar. İşte, Allaһ (başlanğıçta bu şekilde yarattığı) insannı tekrar yaratmağa da qadirdir."
        cid: 0
  - verse: 6
