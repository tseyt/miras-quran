        cid: 0
  - verse: 203
    segments:
      - text: >-
          (Resulım!) Sen afu yolunı tut, eyilikni emir et ve caillerden yuz çevir. (Bu
          ayette eyilik diye tercime etilgen “urf”- şeriatnıñ ve aqılnıñ begengen şeyidir.
          Yoqsa, cahiliye araplarınıñ rastkelgen urfi degil. İslâm olarnıñ yaman urflerini
          ortadan qaldırğan, yahşılarını da qısmen ya da tamamen toqunmağan).
        cid: 0
  - verse: 204
    segments:
