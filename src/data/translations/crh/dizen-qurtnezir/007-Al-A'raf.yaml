          ayetteki «cemel» kelimesini meşur olmağan qıraat şekillerine esaslanaraq,
          Qur’andaki edebiy tasvirge uyğun tüşmegenini, devenen ine deligi arasında bir
          alâqa olmağanını ileri sürgenler bar. Bunıñ içün kelimeniñ diger qıraattaki
