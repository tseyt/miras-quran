      - text: >
          Olarnı doğru yolğa çağırsañız, sizge uymazlar; olarnı çağırsañız da, süküt
          etseñiz de, siz içün ep birdir.
        cid: 0
  - verse: 194
    segments:
      - text: >
          (Ey, kâfirler!) Allahnı bıraqıp da, tabınğanlarıñız, sizler kibi qullardır.
          (Olarnıñ tañrılığı aqqında iddañızda) doğru iseñiz, olarnı çağırıñ da, sizge
          cevap bersinler!
        cid: 0
  - verse: 195
    segments:
      - text: >
          Olarnıñ yürecek ayaqları barmı, yoqsa, tutacaq elleri barmı, ya da körecek
          közleri barmı, yahut eşitecek qulaqları barmı (neleri bar)? De ki:
          «Ortaqlarıñıznı çağırıñ, soñ maña (istegen) tuzağıñıznı qurıñ ve maña köz bile
          açtırmañ!»
        cid: 0
  - verse: 196
    segments:
      - text: >
          Şübesiz ki, menim qorçalağan Kitabımnı endirgen Allahtır. Ve O, bütün salih
          qullarnı körip, közetir.
        cid: 0
  - verse: 197
    segments:
      - text: >
          Allahtan başqağa tabınğanlarıñıznıñ ne sizge yardımğa küçleri yeter, ne de
          özlerine yardım ete bilirler.
        cid: 0
  - verse: 198
    segments:
      - text: >
          Olarnı doğru yolğa çağırğan olsañız, eşitmezler. Ve olarnı saña baqqan kibi
          körersiñ, albuki, olar körmezler.
        cid: 0
  - verse: 199
    segments:
      - text: >
          (Resulım!) Sen afu yolunı tut, eyilikni emir et ve caillerden yüz çevir. (Bu
          ayette eyilik diye tercime etilgen "urf"- şeriatnıñ ve aqılnıñ begengen şeyidir.
          Yoqsa, cahiliye araplarınıñ rastkelgen urfi degil. İslâm olarnıñ yaman urflerini
          ortadan qaldırğan, yahşılarını da qısmen ya da tamamen toqunmağan).
        cid: 0
  - verse: 200
    segments:
      - text: >
          Eger şeytannıñ vesvesesi seni qozğasa, aman Allahqa sığın. Çünki, O, eşiticidir,
          bilicidir. (Yani şeytan emir olunğan şeyleriñe ters tüşken ğadap ve oña beñzegen
          allarğa seni yeteklese, aman Allahqa sığın. Bu hitap körünişte Resulullahqa
          olmaqnen beraber, bütün musulmanlarğa aittir. Bu şekilde şeytandan er angi bir
          vesvese kelgende, onıñ şerrinden Allahqa sığınmaq lâzim).
        cid: 0
  - verse: 201
    segments:
      - text: >
          Taqvağa irişkenler bar ya, olarğa şeytan tarafından bir vesvese toqunğanda,
          (Allahnıñ emir ve yasaqlarını) hatırlap, aman aqiqatnı körerler.
        cid: 0
  - verse: 202
    segments:
      - text: >
          (Şeytanlarnıñ) dostlarına kelgende, şeytanlar olarnı yoldan azdırmağa
          süyreklerler. Soñ da yaqalarını bıraqmazlar.
        cid: 0
  - verse: 203
    segments:
      - text: >
          Olarğa bir mucize ketirmegen vaqtıñda,(obirleri kibi) onı da toparlap ketirse
          ediñ ya! derler. De ki: Men ancaq Rabbimden maña vahiy olunğanğa uyarım. Bu
          (Qur'an) Rabbiñizden kelgen basıretlerdir (qalp közlerini açqan beyanlardır);
          inanğan bir qavm içün hidayet ve rahmettir.
        cid: 0
  - verse: 204
    segments:
      - text: >
          Qur'an oqulğan vaqıtta onı diñleñ ve susıñ ki, sizge merhamet etilsin. (İster
          namaz içinde, ister namaz tışında Qur'an oqulğanda, onıñ manalarını yahşıca
          añlamaq, ögütlerinden faydalanmaq ve davranışlarnı oña köre uydırmaq içün bütün
          diqqatnı oña bermek ve süküt etmek kerek).
        cid: 0
  - verse: 205
    segments:
      - text: >
          Öz başıña yalvararaq ve qorqaraq, yüksek olmağan bir sesnen, saba-aqşam Rabbiñni
          añ. Ğafillerden olma.
        cid: 0
  - verse: 206
    segments:
      - text: >
          Şübesiz, Rabbiñ yanındakiler Oña qullıq etüvden kibirlenmezler, Onı tesbih eter
          ve yalıñız Oña secde eterler.
        cid: 0
