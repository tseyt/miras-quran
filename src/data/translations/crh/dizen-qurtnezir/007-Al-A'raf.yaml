surah_id: 7
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >-
          Elif. Lâam. Miim. Saad. (Bu ariflerniñ izaatı içün baq. Baqara suresi, 2/1).
        cid: 0
  - verse: 2
    segments:
      - text: >-
          (Bu), kendisinen insanlarnı tenbiyeleviñ, inanğanlarğa ogüt berüviñ içün saña
          endirilgen bir kitaptır. Artıq bu hususta qalbiñde bir şube olmasın.
        cid: 0
  - verse: 3
    segments:
      - text: >-
          Rabbiñizden sizge endirilgenine (Qur’anğa) uyıñ. Onı bıraqıp da, başqa
          dostlarnıñ peşlerinden ketmeñ. Ne qadar da az ogüt almaqtasıñız!
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Nice memleketler bar ki, biz olarnı elâk ettik. Azabımız olarğa geceleyin yahut
          kundüz istiraat etkenlerinde keldi. (Allaһ Taalâ Luut Peyğamberniñ qavmını gece,
          Şuayb Peyğamberniñ qavmını da kundüz elâk etken).
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Azabımız olarğa kelgende bağıruvları: «Biz aqiqaten zalım kişiler eyenmiz»,
          deyuvlerinden başqa bir şey olmadı.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Elbette, ozlerine peyğamber yollanılğan kimselerni de, yollanılgan
          peyğamberlerni de, mıtlaqa sorğuğa çekecekmiz! (Ummetlerden peyğamberlerine
          inanaraq, yolundan yurmegenleri, peyğamberlerden de tebliğ vazifelerini
          yapıp-yapmağanları soralacaq).
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Ve olarğa (olup keçkenlerni) tam bir bilgi ile mıtlaqa añlatacaqmız. Biz
          olardan uzaq degilmiz.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          O kunü çeki aqtır. Kimniñ (savap) çekisi ağır kelse, işte olar qurtulışqa
          irişkenlerdir.
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Kimniñ de olçüleri yengil kelse, işte olar, ayetlerimizge nisbeten aqsızlıq
          etkenlerinden tolayı, ozlerini ziyanğa soqqanlardıң.
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Doğrusı, biz sizni yer yuzüne yerleştirdik ve o yerde sizge keçinüv vastaları
          berdik. Ne qadar da az şukür etmektesiñiz.
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Ant olsun, sizni yarattıq, soñra sizge şekil yerdik, soñ da meleklerge, Ademge
          secde etiñ! diye emir ettik. İblisten başqaları secde ettiler. O, secde
          etkenlerden olmadı. (Ayet-i kerime: «Sizni yarattıq, soñra sizge şekil berdik,
          soñra meleklerge, Ademge secde etiñ, dedik», ifadesinen Ademniñ bir kereden
          degil, bir muddet içinde yaratılğanını hatırlatmaqta. Çünki, başta insannıñ esas
          maddesi yaratılğan, soñ oña insan şekli berilgen, soñra duyğularını qazanıp,
          Adem alına kelgence, meleklerge oña boyun egüvleri emir etilgen. Az. Ademniñ,
          Allaһnıñ «Kun!» («Ol!») emrinen bir anda yaratıluvı da Allaһnıñ qudretindendir).
        cid: 0
  - verse: 12
    segments:
      - text: >-
          Allaһ buyurdı: Men saña emir etken ekenim, seni secde etüvden çetletken nedir?
          (İblis): Men ondan daa ustünim. Çünki, meni ateşten yarattıñ, onı çamurdan
          yarattıñ, dedi.
        cid: 0
  - verse: 13
    segments:
      - text: >-
          Allaһ: Oyle ise, «Tüş o yerden!» O yerde buyuklik taslamaq seniñ addiñ degil.
          Çıq! Çünki, sen aşşağılıqlardansıñ! buyurdı.
        cid: 0
  - verse: 14
    segments:
      - text: >-
          İblis: Maña, (insanlarnıñ) tekrar tirilecek kunlerine qadar muhlet ber, dedi.
        cid: 0
  - verse: 15
    segments:
      - text: >-
          Allaһ: Aydı, sen muhlet berilgenlerdensiñ, buyurdı.
        cid: 0
  - verse: 16
    segments:
      - text: >-
          İblis dedi ki: Oyle ise, meni yoldan azdıruvıña qarşılıq, ant eterim ki, men de
          olarnı saptırmaq içün seniñ doğru yoluñnıñ ustüne oturacağım.
        cid: 0
  - verse: 17
    segments:
      - text: >-
          «Soñra, elbette olarğa oglerinden, artlarından, sağlarından, sollarından
          soqulacam ve sen, olarnıñ çoqlarını şukür etkenlerinden bulmaycaqsıñ!“, dedi.
        cid: 0
  - verse: 18
    segments:
      - text: >-
          Allaһ buyurdı: Aydı, ayıplanğan ve quvulğan olaraq o yerden çıq. Ant olsun ki,
          olardan kim saña uysa, siziñ epiñizni ceennemge tolduracam! (İblis Allaһnıñ
          emrine qarşı kelip, Ademge secde etmegeninen, Allaһ Taalâ onı cennetten ya da
          melekler arasındaki yuksek maqamından quvdı. Bunıñ uzerine Allaһ Taalânen İblis
          arasında yuqarıdaki qonuşma meydanğa keldi. Neticede Allaһ oña qıyametke qadar
          yaşamaq ve insanlarnı doğru yoldan saptırmaq fırsatını berdi. Faqat kim İbliske
          uysa, onı da İblisnen beraber ceennemge atacağını haber berdi).
        cid: 0
  - verse: 19
    segments:
      - text: >-
          (Allaһ buyurdı ki): Ey, Adem! Sen ve qadınıñ cennette yerleşip, istegen
          yeriñizden aşañ. Ancaq, şu terekke yaqlaşmañ! Soñra zalımlarden olursıñız!
        cid: 0
  - verse: 20
    segments:
      - text: >-
          Derken, şeytan, bir-birlerine qapalı ayıp yerlerini ozlerine kostermek içün,
          olarğa vesvese berdi ve: Rabbiñiz sizge bu terekni melek olursıñız ya da ebediy
          qalğanlardan olursıñız diye yasaqladı, dedi.
        cid: 0
  - verse: 21
    segments:
      - text: >-
          Ve olarğa: Men aqiqaten sizge ogüt bericilerdenim, diye yemin etti.
        cid: 0
  - verse: 22
    segments:
      - text: >-
          Boylece, olarnı iylenen aldattı. Terekniñ meyvasını tatqanlarında, ayıp yerleri
          ozlerine koründi. Ve cennet yapraqlarından uzerlerini ortmege başladılar.
          Rabbleri olarğa: Men sizge terekni yasaqlamadımmı ve şeytan sizge ap-açıq bir
          duşmandır, demedimmi? diye nida etti.
        cid: 0
  - verse: 23
    segments:
      - text: >-
          (Ademnen qadını) dediler ki: Ey, Rabbimiz! Biz ozümizge zulum ettik. Eger bizni
          bağışlamaz ve bizni acımaz ekensiñ, mıtlaqa ziyan etkenlerden olurmız.
        cid: 0
  - verse: 24
    segments:
      - text: >-
          Allaһ: Bir-biriñizge duşman olaraq eniñ! Siz içün yer yuzünde bir muddetke
          qadar yerleşüv ve faydalanuv bardır, buyurdı. 25. «O yerde yaşaycaqsıñız, o
          yerde oleceksiñiz ve o yerde (tiriltilip) çıqarılacaqsıñız”, dedi.
        cid: 0
  - verse: 25
    segments:
      - text: >-
          Ey, Adem oğulları! Sizge ayıp yerleriñizni ortecek kiyim, süslenecek urba
          yarattıq. Taqva urbası… İşte, o daa hayırlıdır. Bular Allaһnıñ ayetlerindendir.
          Belki, tüşünip ogüt alırlar (diye olarnı endirdi). (Taqva urbası, bazı alimler
          tarafından aya, salih amel, yuzdeki hoş çere, tevazu işareti olğan sert ve yun
          urba, cenkte kiyilgen zırh ve demir başlıq, Allaһ qorqusı, emir etken ve
          yasaqlağan mevzularında Allaһtan saqınmaqnı şiar etüv şekillerinde yorumlanğan.
          Buña, taqvanı hatırlatqan ve taqvanıñ keregi olğan urbalar, yorumını da qoşa
          bilemiz).
        cid: 0
  - verse: 26
    segments:
      - text: >-
          Ey, Adem oğulları! Şeytan ana-babalırıñıznı ayıp yerlerini ozlerine kostermek
          içün urbalarını çıqararaq, cennetten çıqarğanı kibi, sizni de aldatmasın. Çünki,
          o ve yanındakiler, siz olarnı kormeycek yeriñizden sizni korerler. Şubesiz, biz
          şeytanlarnı inanmağanlarnıñ dostları yaptıq. (Şeytan da, cinlerden olğanı içün,
          insanlar koralmaycaq bir şekilde insanğa yaqlaşır ve oña vesvese berir.
          Şeytannıñ insanlarğa korüngenini ifade etici bazı rivayetler bar).
        cid: 0
  - verse: 27
    segments:
      - text: >-
          Olar bir fenalıq yapqan vaqıtlarında: «Babalarımıznı bu yolda buldıq. Allaһ da
          bizge bunı emir etti», derler. De ki: Allaһ yamanlıqnı emir etmez. Allaһqa qarşı
          bilmegen şeyleriñizni söyleysiñizmi?
        cid: 0
  - verse: 28
    segments:
      - text: >-
          De ki: Rabbim adeletni emir etti. Er secde etkeniñizde yuzleriñizni Oña çeviriñ
          ve dinni yalıñız Allaһqa has qılaraq, Oña yalvarıñ. İlkide sizni yaratqanı kibi,
          (kene Oña) döneceksiñiz.
        cid: 0
  - verse: 29
    segments:
      - text: >-
          O, bir topunı doğru yolğa iriştirdi, bir topu da sapıqlıqqa lâyıq oldı. Çünki,
          olar Allaһnı bıraqıp, şeytanlarnı ozlerine dost ettiler. Boyle eken, ozlerini
          doğru yolda sanmaqtalar. (Allaһ Taalâ bir top insannı hidayetke iriştirgen;
          bular Allaһnıñ kostergen doğru yolundan ayrılmazlar. Faqat bir top insan da bar
          ki, doğru yolnı istemegenleri içün, Allaһ da olarnı oz allarına bıraqqan. Bular
          sapıq yolda yurgenleri alda, ozlerini doğru yolda sanarlar. Asıl yañlışlıqları
          da bu yerden kelmekte).
        cid: 0
  - verse: 30
    segments:
      - text: >-
          Ey, Adem oğulları! Er secde etkeniñizde guzel urbalarıñıznı kiyiñ; aşañ, içiñ,
          faqat israf etmeñ; çünki, Allaһ israf etkenlerni sevmez. (İslâm dininde temizlik
          ve guzellikke emiyet berilgen. İnsanlarnıñ avret yerlerini ortecek derecede bir
          urba kiyuvleri şarttır. Faqat israf yapmamaq şartınen, er bir musulmannıñ ibadet
          esnasında eñ guzel ve temiz urbasını kiyuvi ise sunnettir).
        cid: 0
  - verse: 31
    segments:
      - text: >-
          De ki: Allaһnıñ qulları içün yaratqan süsni ve temiz rızıqlarnı kim aram qıldı?
          De ki: Olar dünya ayatında, ayrıca qıyamet kunünde mu’minlerniñdir. İşte, bilgen
          bir toplulıq içün ayetlernı boyle izaatlamaqtamız. (Ayette şukrni eda etmek
          yolunen, dünya nimetlerine esasen mu’minlerniñ lâyıq olğanı, ahirette ise, butün
          nimetlerniñ yalıñız mu’minlerge ait olacağı bildirilgen ki, bu vaziyet Allaһnıñ
          rahman ve rahim sıfatlarınıñ bir neticesidir. Baq. «Faatiһa», 1/2-3).
        cid: 0
  - verse: 32
    segments:
      - text: >-
          De ki: Rabbim ancaq aşkâr ve gizli fenalıqlarnı, gunahnı ve aqsız yerde sıñırnı
          aşuvnı, aqqında iç bir delil endirmegen bir şeyni, Allaһqa ortaq qoşuvıñıznı ve
          Allaһ aqqında bilmegen şeyleriñizni söyleviñizni aram etken.
        cid: 0
  - verse: 33
    segments:
      - text: >-
          Er ummetniñ bir eceli bar. Ecelleri kelgeninen, ne bir an keri qalırlar, ne de
          bir an ileri kete bilirler. (Er ummet, er millet ve er devletniñ Allaһ
          tarafından tayin etilgen bir omüri bar. O vaqıt kelgende, onı ne bir saat ileri,
          ne de bir saat keri ala bilirler. Milletler ve devletler, şahıslar kibidir,
          qurulır, inkişaf eter, durğunluqqa oğrar, artqa keter, niayet yıqılır ve yoq
          olurlar. Bularnıñ uzun ya da qısqa omürli oluvı, toplumnıñ maddiy ve maneviy
          qurulışınıñ sağlamlığına bağlıdır. Bu vaziyet tayin etilgen ecelge ters degil.
          Zira, Yuce Allaһ cemiyetniñ vaziyetine kore ecelini tayin eter).
        cid: 0
  - verse: 34
    segments:
      - text: >-
          Ey, Adem oğullları! Sizge oz arañızdan ayetlerimni añlatacaq peyğamberler kelir
          de, kim (olarğa qarşı kelmekten) saqınır ve ozüni islâh eter ise, olarğa qorqu
          yoqtır ve olar ğam çekmeycekler.
        cid: 0
  - verse: 35
    segments:
      - text: >-
          Ayetlerimizni yalanğa çıqarğanlar ve kibirlenip, olardan yuz çevirgenler bar
          ya, işte olar ateş ehlidir. Olar o yerde ebediy qalacaqlar.
        cid: 0
  - verse: 36
    segments:
      - text: >-
          Allaһqa iftira etken ya da Onıñ ayetlerini yalanğa çıqarğanlardan daa zalım
          kim! Olarnıñ kitaptaki nasipleri ozlerine irişecek. Sonuñda elçilerimiz
          (melekler) kelip, canlarını alğanda: «Allaһnı bıraqıp da, tabınmakta olğan
          tañrılarımız ne yerde?», derler. (Olar da): «Bizden çekilip kettiler», derler.
          Ve kâfir olğanlarına dair oz aleyhlerine şaatlıq eterler.
        cid: 0
  - verse: 37
    segments:
      - text: >-
          Allaһ buyuracaq ki: «Sizden evel keçken cin ve insan toplulıqları arasında siz
          de ateşke kiriñ!» Er ummet kirgeninen, arqadaşlarına lânet etecekler. Episi
          bir-biri artından o yerde (ceennemde) toplanğanınen, soñkiler evelkiler içün:
          «Ey, Rabbimiz! Bizni, işte bular saptırdılar! Onıñ içün olarğa ateşten bir qat
          daa ziyade azap ber!», deycekler. Allaһ da: Zaten er kes içün bir qat daa ziyade
          azap bar, faqat siz bilmeysiñiz, deycek. (Toplumnı yañlış yolda yurütken
          yolbaşçılarğa, em oz kâfirliklerinden, em de başqalarını doğru yoldan
          saptırğanları sebebinden; bularnıñ peşinden ketkenlerge de, em kâfir
          olğanlarından, em de sapıq yolbaşçılarğa taqlit etüvlerinden tolayı, eki qat
          azap etilecek).
        cid: 0
  - verse: 38
    segments:
      - text: >-
          Evelkiler de, soñkilerge derler ki: Siziñ bizden bir ustünligiñiz yoq. O alda
          siz de yapqanlarıñızğa qarşılıq azapnı tatıñ!
        cid: 0
  - verse: 39
    segments:
      - text: >-
          Bizim ayetlerimizni yalanğa çıqarıp da, olarğa qarşı kibirlenmek istegenler bar
