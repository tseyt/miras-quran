surah_id: 7
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >
          Elif. Lâam. Miim. Saad. (Bu ariflerniñ izaatı içün baq. Baqara suresi, 2/1).
        cid: 0
  - verse: 2
    segments:
      - text: >
          (Bu), kendisinen insanlarnı tenbiyeleviñ, inanğanlarğa ögüt berüviñ içün saña
          endirilgen bir kitaptır. Artıq bu hususta qalbiñde bir şübe olmasın.
        cid: 0
  - verse: 3
    segments:
      - text: >
          Rabbiñizden sizge endirilgenine (Qur'anğa) uyıñ. Onı bıraqıp da, başqa
          dostlarnıñ peşlerinden ketmeñ. Ne qadar da az ögüt almaqtasıñız!
        cid: 0
  - verse: 4
    segments:
      - text: >
          Nice memleketler bar ki, biz olarnı elâk ettik. Azabımız olarğa geceleyin yahut
          kündüz istiraat etkenlerinde keldi. (Allah Taalâ Luut Peyğamberniñ qavmını gece,
          Şuayb Peyğamberniñ qavmını da kündüz elâk etken).
        cid: 0
  - verse: 5
    segments:
      - text: >
          Azabımız olarğa kelgende bağıruvları: «Biz aqiqaten zalım kişiler eyenmiz»,
          deyüvlerinden başqa bir şey olmadı.
        cid: 0
  - verse: 6
    segments:
      - text: >
          Elbette, özlerine peyğamber yollanılğan kimselerni de, yollanılgan
          peyğamberlerni de, mıtlaqa sorğuğa çekecekmiz! (Ümmetlerden peyğamberlerine
          inanaraq, yolundan yürmegenleri, peyğamberlerden de tebliğ vazifelerini
          yapıp-yapmağanları soralacaq).
        cid: 0
  - verse: 7
    segments:
      - text: >
          Ve olarğa (olup keçkenlerni) tam bir bilgi ile mıtlaqa añlatacaqmız. Biz olardan
          uzaq degilmiz.
        cid: 0
  - verse: 8
    segments:
      - text: >
          O künü çeki aqtır. Kimniñ (savap) çekisi ağır kelse, işte olar qurtulışqa
          irişkenlerdir.
        cid: 0
  - verse: 9
    segments:
      - text: >
          Kimniñ de ölçüleri yengil kelse, işte olar, ayetlerimizge nisbeten aqsızlıq
          etkenlerinden tolayı, özlerini ziyanğa soqqanlardır.
        cid: 0
  - verse: 10
    segments:
      - text: >
          Doğrusı, biz sizni yer yüzüne yerleştirdik ve o yerde sizge keçinüv vastaları
          berdik. Ne qadar da az şükür etmektesiñiz.
        cid: 0
  - verse: 11
    segments:
      - text: >
          Ant olsun, sizni yarattıq, soñra sizge şekil yerdik, soñ da meleklerge, Ademge
          secde etiñ! diye emir ettik. İblisten başqaları secde ettiler. O, secde
          etkenlerden olmadı. (Ayet-i kerime: «Sizni yarattıq, soñra sizge şekil berdik,
          soñra meleklerge, Ademge secde etiñ, dedik», ifadesinen Ademniñ bir kereden
          degil, bir müddet içinde yaratılğanını hatırlatmaqta. Çünki, başta insannıñ esas
          maddesi yaratılğan, soñ oña insan şekli berilgen, soñra duyğularını qazanıp,
          Adem alına kelgence, meleklerge oña boyun egüvleri emir etilgen. Az. Ademniñ,
          Allahnıñ «Kün!» («Ol!») emrinen bir anda yaratıluvı da Allahnıñ qudretindendir).
        cid: 0
  - verse: 12
    segments:
      - text: >
          Allah buyurdı: Men saña emir etken ekenim, seni secde etüvden çetletken nedir?
          (İblis): Men ondan daa üstünim. Çünki, meni ateşten yarattıñ, onı çamurdan
          yarattıñ, dedi.
        cid: 0
  - verse: 13
    segments:
      - text: >
          Allah: Öyle ise, «Tüş o yerden!» O yerde büyüklik taslamaq seniñ addiñ degil.
          Çıq! Çünki, sen aşşağılıqlardansıñ! buyurdı.
        cid: 0
  - verse: 14
    segments:
      - text: >
          İblis: Maña, (insanlarnıñ) tekrar tirilecek künlerine qadar muhlet ber, dedi.
        cid: 0
  - verse: 15
    segments:
      - text: >
          Allah: Aydı, sen muhlet berilgenlerdensiñ, buyurdı.
        cid: 0
  - verse: 16
    segments:
      - text: >
          İblis dedi ki: Öyle ise, meni yoldan azdıruvıña qarşılıq, ant eterim ki, men de
          olarnı saptırmaq içün seniñ doğru yoluñnıñ üstüne oturacağım.
        cid: 0
  - verse: 17
    segments:
      - text: >
          «Soñra, elbette olarğa öglerinden, artlarından, sağlarından, sollarından
          soqulacam ve sen, olarnıñ çoqlarını şükür etkenlerinden bulmaycaqsıñ!", dedi.
        cid: 0
  - verse: 18
    segments:
      - text: >
          Allah buyurdı: Aydı, ayıplanğan ve quvulğan olaraq o yerden çıq. Ant olsun ki,
          olardan kim saña uysa, siziñ epiñizni ceennemge tolduracam! (İblis Allahnıñ
          emrine qarşı kelip, Ademge secde etmegeninen, Allah Taalâ onı cennetten ya da
          melekler arasındaki yüksek maqamından quvdı. Bunıñ üzerine Allah Taalânen İblis
          arasında yuqarıdaki qonuşma meydanğa keldi. Neticede Allah oña qıyametke qadar
          yaşamaq ve insanlarnı doğru yoldan saptırmaq fırsatını berdi. Faqat kim İbliske
          uysa, onı da İblisnen beraber ceennemge atacağını haber berdi).
        cid: 0
  - verse: 19
    segments:
      - text: >
          (Allah buyurdı ki): Ey, Adem! Sen ve qadınıñ cennette yerleşip, istegen
          yeriñizden aşañ. Ancaq, şu terekke yaqlaşmañ! Soñra zalımlarden olursıñız!
        cid: 0
  - verse: 20
    segments:
      - text: >
          Derken, şeytan, bir-birlerine qapalı ayıp yerlerini özlerine köstermek içün,
          olarğa vesvese berdi ve: Rabbiñiz sizge bu terekni melek olursıñız ya da ebediy
          qalğanlardan olursıñız diye yasaqladı, dedi.
        cid: 0
  - verse: 21
    segments:
      - text: >
          Ve olarğa: Men aqiqaten sizge ögüt bericilerdenim, diye yemin etti.
        cid: 0
  - verse: 22
    segments:
      - text: >
          Böylece, olarnı iylenen aldattı. Terekniñ meyvasını tatqanlarında, ayıp yerleri
          özlerine köründi. Ve cennet yapraqlarından üzerlerini örtmege başladılar.
          Rabbleri olarğa: Men sizge terekni yasaqlamadımmı ve şeytan sizge ap-açıq bir
          duşmandır, demedimmi? diye nida etti.
        cid: 0
  - verse: 23
    segments:
      - text: >
          (Ademnen qadını) dediler ki: Ey, Rabbimiz! Biz özümizge zulum ettik. Eger bizni
          bağışlamaz ve bizni acımaz ekensiñ, mıtlaqa ziyan etkenlerden olurmız.
        cid: 0
  - verse: 24
    segments:
      - text: >
          Allah: Bir-biriñizge duşman olaraq eniñ! Siz içün yer yüzünde bir müddetke qadar
          yerleşüv ve faydalanuv bardır, buyurdı.
        cid: 0
  - verse: 25
    segments:
      - text: >
          «O yerde yaşaycaqsıñız, o yerde öleceksiñiz ve o yerde (tiriltilip)
          çıqarılacaqsıñız", dedi.
        cid: 0
  - verse: 26
    segments:
      - text: >
          Ey, Adem oğulları! Sizge ayıp yerleriñizni örtecek kiyim, süslenecek urba
          yarattıq. Taqva urbası... İşte, o daa hayırlıdır. Bular Allahnıñ
          ayetlerindendir. Belki, tüşünip ögüt alırlar (diye olarnı endirdi). (Taqva
          urbası, bazı alimler tarafından aya, salih amel, yüzdeki hoş çere, tevazu
          işareti olğan sert ve yün urba, cenkte kiyilgen zırh ve demir başlıq, Allah
          qorqusı, emir etken ve yasaqlağan mevzularında Allahtan saqınmaqnı şiar etüv
          şekillerinde yorumlanğan. Buña, taqvanı hatırlatqan ve taqvanıñ keregi olğan
          urbalar, yorumını da qoşa bilemiz).
        cid: 0
  - verse: 27
    segments:
      - text: >
          Ey, Adem oğulları! Şeytan ana-babalırıñıznı ayıp yerlerini özlerine köstermek
          içün urbalarını çıqararaq, cennetten çıqarğanı kibi, sizni de aldatmasın. Çünki,
          o ve yanındakiler, siz olarnı körmeycek yeriñizden sizni körerler. Şübesiz, biz
          şeytanlarnı inanmağanlarnıñ dostları yaptıq. (Şeytan da, cinlerden olğanı içün,
          insanlar koralmaycaq bir şekilde insanğa yaqlaşır ve oña vesvese berir.
          Şeytannıñ insanlarğa körüngenini ifade etici bazı rivayetler bar).
        cid: 0
  - verse: 28
    segments:
      - text: >
          Olar bir fenalıq yapqan vaqıtlarında: «Babalarımıznı bu yolda buldıq. Allah da
          bizge bunı emir etti», derler. De ki: Allah yamanlıqnı emir etmez. Allahqa qarşı
          bilmegen şeyleriñizni söyleysiñizmi?
        cid: 0
  - verse: 29
    segments:
      - text: >
          De ki: Rabbim adeletni emir etti. Er secde etkeniñizde yüzleriñizni Oña çeviriñ
          ve dinni yalıñız Allahqa has qılaraq, Oña yalvarıñ. İlkide sizni yaratqanı kibi,
          (kene Oña) döneceksiñiz.
        cid: 0
  - verse: 30
    segments:
      - text: >
          O, bir topunı doğru yolğa iriştirdi, bir topu da sapıqlıqqa lâyıq oldı. Çünki,
          olar Allahnı bıraqıp, şeytanlarnı özlerine dost ettiler. Böyle eken, özlerini
          doğru yolda sanmaqtalar. (Allah Taalâ bir top insannı hidayetke iriştirgen;
          bular Allahnıñ köstergen doğru yolundan ayrılmazlar. Faqat bir top insan da bar
          ki, doğru yolnı istemegenleri içün, Allah da olarnı öz allarına bıraqqan. Bular
          sapıq yolda yürgenleri alda, özlerini doğru yolda sanarlar. Asıl yañlışlıqları
          da bu yerden kelmekte).
        cid: 0
  - verse: 31
    segments:
      - text: >
          Ey, Adem oğulları! Er secde etkeniñizde güzel urbalarıñıznı kiyiñ; aşañ, içiñ,
          faqat israf etmeñ; çünki, Allah israf etkenlerni sevmez. (İslâm dininde temizlik
          ve güzellikke emiyet berilgen. İnsanlarnıñ avret yerlerini örtecek derecede bir
          urba kiyüvleri şarttır. Faqat israf yapmamaq şartınen, er bir musulmannıñ ibadet
          esnasında eñ güzel ve temiz urbasını kiyüvi ise sünnettir).
        cid: 0
  - verse: 32
    segments:
      - text: >
          De ki: Allahnıñ qulları içün yaratqan süsni ve temiz rızıqlarnı kim aram qıldı?
          De ki: Olar dünya ayatında, ayrıca qıyamet kününde mü'minlerniñdir. İşte, bilgen
          bir toplulıq içün ayetlernı böyle izaatlamaqtamız. (Ayette şükrni eda etmek
          yolunen, dünya nimetlerine esasen mü'minlerniñ lâyıq olğanı, ahirette ise, bütün
          nimetlerniñ yalıñız mü'minlerge ait olacağı bildirilgen ki, bu vaziyet Allahnıñ
          rahman ve rahim sıfatlarınıñ bir neticesidir. Baq. «Faatiha», 1/2-3).
        cid: 0
  - verse: 33
    segments:
      - text: >
          De ki: Rabbim ancaq aşkâr ve gizli fenalıqlarnı, günahnı ve aqsız yerde sıñırnı
          aşuvnı, aqqında iç bir delil endirmegen bir şeyni, Allahqa ortaq qoşuvıñıznı ve
          Allah aqqında bilmegen şeyleriñizni söyleviñizni aram etken.
        cid: 0
  - verse: 34
    segments:
      - text: >
          Er ümmetniñ bir eceli bar. Ecelleri kelgeninen, ne bir an keri qalırlar, ne de
          bir an ileri kete bilirler. (Er ümmet, er millet ve er devletniñ Allah
          tarafından tayin etilgen bir ömüri bar. O vaqıt kelgende, onı ne bir saat ileri,
          ne de bir saat keri ala bilirler. Milletler ve devletler, şahıslar kibidir,
          qurulır, inkişaf eter, durğunluqqa oğrar, artqa keter, niayet yıqılır ve yoq
          olurlar. Bularnıñ uzun ya da qısqa ömürli oluvı, toplumnıñ maddiy ve maneviy
          qurulışınıñ sağlamlığına bağlıdır. Bu vaziyet tayin etilgen ecelge ters degil.
          Zira, Yüce Allah cemiyetniñ vaziyetine köre ecelini tayin eter).
        cid: 0
  - verse: 35
    segments:
      - text: >
          Ey, Adem oğullları! Sizge öz arañızdan ayetlerimni añlatacaq peyğamberler kelir
          de, kim (olarğa qarşı kelmekten) saqınır ve özüni islâh eter ise, olarğa qorqu
          yoqtır ve olar ğam çekmeycekler.
        cid: 0
  - verse: 36
    segments:
      - text: >
          Ayetlerimizni yalanğa çıqarğanlar ve kibirlenip, olardan yüz çevirgenler bar ya,
          işte olar ateş ehlidir. Olar o yerde ebediy qalacaqlar.
        cid: 0
  - verse: 37
    segments:
      - text: >
          Allahqa iftira etken ya da Onıñ ayetlerini yalanğa çıqarğanlardan daa zalım kim!
          Olarnıñ kitaptaki nasipleri özlerine irişecek. Sonuñda elçilerimiz (melekler)
          kelip, canlarını alğanda: «Allahnı bıraqıp da, tabınmaqta olğan tañrılarımız ne
          yerde?», derler. (Olar da): «Bizden çekilip kettiler», derler. Ve kâfir
          olğanlarına dair öz aleyhlerine şaatlıq eterler.
        cid: 0
  - verse: 38
    segments:
      - text: >
          Allah buyuracaq ki: «Sizden evel keçken cin ve insan toplulıqları arasında siz
          de ateşke kiriñ!» Er ümmet kirgeninen, arqadaşlarına lânet etecekler. Episi
          bir-biri artından o yerde (ceennemde) toplanğanınen, soñkiler evelkiler içün:
          «Ey, Rabbimiz! Bizni, işte bular saptırdılar! Onıñ içün olarğa ateşten bir qat
          daa ziyade azap ber!», deycekler. Allah da: Zaten er kes içün bir qat daa ziyade
          azap bar, faqat siz bilmeysiñiz, deycek. (Toplumnı yañlış yolda yürütken
          yolbaşçılarğa, em öz kâfirliklerinden, em de başqalarını doğru yoldan
          saptırğanları sebebinden; bularnıñ peşinden ketkenlerge de, em kâfir
          olğanlarından, em de sapıq yolbaşçılarğa taqlit etüvlerinden tolayı, eki qat
          azap etilecek).
        cid: 0
  - verse: 39
    segments:
      - text: >
          Evelkiler de, soñkilerge derler ki: Siziñ bizden bir üstünligiñiz yoq. O alda
          siz de yapqanlarıñızğa qarşılıq azapnı tatıñ!
        cid: 0
  - verse: 40
    segments:
      - text: >
          Bizim ayetlerimizni yalanğa çıqarıp da, olarğa qarşı kibirlenmek istegenler bar
          ya, işte, olarğa kök qapuları açılmaycaq ve olar deve ine teşigine kirgengece
          cennetke kiralmaycaqlar! Qabaatlılarnı, işte böyle cezanlandırırmız! (Bu
          ayetteki «cemel» kelimesini meşur olmağan qıraat şekillerine esaslanaraq,
          Qur'andaki edebiy tasvirge uyğun tüşmegenini, devenen ine deligi arasında bir
          alâqa olmağanını ileri sürgenler bar. Bunıñ içün kelimeniñ diger qıraattaki
          «qalın yip» yani arqan manasını bergenler. Ancaq, umumniñ qıraatı köz ögüne
          alınaraq, «deve» manası berilgen. Deveniñ ine teşiginden keçüvi-imkânsızlıqnı
          bildire. Buña köre, ayetniñ manası: «Olar asla cennetke kiralmazlar» ya da «Pek
          qıyın kirerler», demektir).
        cid: 0
  - verse: 41
    segments:
      - text: >
          Olar içün ceennem ateşinden töşekler, üstlerine de yorğanlar bar. İşte,
          zalımlarni böyle cezalandırırmız!
        cid: 0
  - verse: 42
    segments:
      - text: >
          İnanıp da, yahşı işler yapqanlarğa kelgende -ki iç kimsege küçü yetmegen bir
          vazife yüklemeymiz- işte, olar, cennet ehlidir. O yerde olar ebediy qalacaqlar.
          (Ayet-i kerimede Yüce Allahnıñ emir ve yasaqlarınıñ insan küçü yetmegen derecede
          ve yapıp olamaycaq bir şey olmağanı açıq ifade etilmekte ve salih amel
          işlegenlerge cennet vade etilmekte).
        cid: 0
  - verse: 43
    segments:
      - text: >
          (Cenette) olarnıñ astlarından irmaqlar aqqanda, qalplerinde kinden ne olsa,
          episini çıqarıp atarmız. Ve olar derler ki: «Hidayetinen bizni (bu nimetke)
          qavuştırğan Allahqa hamd olsun! Allah bizni doğru yolğa qoymasa edi,
          özlügimizden doğru yolnı tapalmaz edik. Aqiqaten, Rabbimizniñ elçileri aqiqatnı
          ketirgenler». Olarğa: İşte, sizge cenet; yapqan yahşı amellerge qarşılıq oña
          varis qılındıñız, diye seslenilir.
        cid: 0
  - verse: 44
    segments:
      - text: >
          Cennet ehli ceennem ehline: Biz Rabbimizniñ bizge bergen vadesini aqiqat buldıq,
          siz de Rabbiñizniñ sizge bergen vadesini aqiqat buldıñızmı? diye seslenir.
          «Ebet!», derler ve aralarından bir nidacı, Allahnıñ lâneti zalımlarniñ üzerine
          olsun! diye bağırır.
        cid: 0
  - verse: 45
    segments:
      - text: >
          Olar, Allah yolundan uzaqlaştırğan ve onı egip-bükmek istegen zalımlardır. Olar
          ahiretni de inkâr eticilerdir.
        cid: 0
  - verse: 46
    segments:
      - text: >
          Eki taraf (cenetliler ve ceennemliler) arasında bir perde ve A'raaf üzerinde de
          er kesni sımalarından tanığan adamlar bar ki, olar alâ cenetke kirmegenleri
          alda, (kirmekni) ümüt eterek, cennet ehline: «Selâm sizge!», diye seslenirler.
          (A'raaf - Cennetnen ceennem arasında yüksek bir meydandır ki, savaplarınen
          günahları bir olğanlar Allahnıñ tilegen bir vaqtınace bu yerde qalacaqlar; daa
          soñra Allahnıñ bağışlavına nail olaraq, olar da cennetke kirecekler).
        cid: 0
  - verse: 47
    segments:
      - text: >
          Közleri ceennem ehli tarafqa döndürilgeninen de: Ey, Rabbimiz! Bizni zalımlar
          toplulığınen beraber bulundırma! derler.
        cid: 0
  - verse: 48
    segments:
      - text: >
          (Kene) A'raaf ehli sımalarından tanığan bir taqım adamlarına seslenerek, derler
          ki: «Ne çoqluğıñız, ne de taslamaqta olğan büyükligiñiz sizge iç bir fayda
          bermedi.
        cid: 0
  - verse: 49
    segments:
      - text: >
          Allahnıñ, olarnı iç bir rahmetke iriştirmeycegine dair yemin etken kimseleriñiz
          bularmı?» (Ve cennet ehline çevirilip): «Kiriñ cennetke; artıq sizge qorqu
          yoqtır ve siz kederlenecek de degilsiñiz», (derler).
        cid: 0
  - verse: 50
    segments:
      - text: >
          Ceennem ehli, cennet ehline: Suvıñızdan ya da Allahnıñ sizge bergen rızıqtan
          biraz da bizge beriñ! diye seslenirler. Olar da: Allah bularnı kâfirlerge aram
          etken, derler.
        cid: 0
  - verse: 51
    segments:
      - text: >
          O kâfirler ki, dinlerini bir eglence ve oyun yaptılar da, dünya ayatı olarnı
          aldattı. Olar bu künlerinen qarşılaşacaqlarını unutqanları ve ayetlerimizni
          bile-bile inkâr etkenleri kibi, biz de bugün olarnı unutırmız.
        cid: 0
  - verse: 52
    segments:
      - text: >
          Aqiqaten, olarğa, inanğan bir toplum içün yol kösterici ve rahmet olaraq, ilim
          üzere añlatqan bir kitap ketirdik.
        cid: 0
  - verse: 53
    segments:
      - text: >
          (Faqat olar), Onıñ yorumlavundan başqa bir şey beklemeyler. Yorumlavı kelgen
