surah_id: 80
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "(Peyğamber) korniñ oña kelüvi sebebinden, yuzüni ekşitti ve keri döndi. (Resulım! Onıñ alını) saña kim bildirdi! Belki o temizlenecek, yahut ogüt alacaq da, o ogüt oña fayda berecek."
        cid: 0
  - verse: 2
    segments:
      - text: "[1 ayetine baq.]"
        cid: 0
  - verse: 3
    segments:
      - text: "[1 ayetine baq.]"
        cid: 0
  - verse: 4
    segments:
      - text: "[1 ayetine baq.]"
        cid: 0
  - verse: 5
    segments:
      - text: "Ozüni (saña) muhtac kormegenge kelgende, sen oña yonelmektesiñ. Albuki, onıñ temizlenip, arınuvından sen mesul degilsiñ."
        cid: 0
  - verse: 6
    segments:
      - text: "[5 ayetine baq.]"
        cid: 0
  - verse: 7
    segments:
      - text: "[5 ayetine baq.]"
        cid: 0
  - verse: 8
    segments:
      - text: "Faqat çapışaraq ve (Allaһtan) qorqaraq saña kelgennen de meraqlanmaysıñ."
        cid: 0
  - verse: 9
    segments:
      - text: "[8 ayetine baq.]"
        cid: 0
  - verse: 10
    segments:
      - text: "[8 ayetine baq.]"
        cid: 0
  - verse: 11
    segments:
      - text: "Yoq! Şubesiz, bular (ayetler) degerli ve işançlı kâtiplerniñ ellerinen (yazılıp) tertemiz qılıngan, yuce maqamlarğa çıqarılğan muqaddes saifelerinde (yazılı) bir ogüttir; istegen ondan (Qur’andan) ogüt alır."
        cid: 0
  - verse: 12
    segments:
      - text: "[11 ayetine baq.]"
        cid: 0
  - verse: 13
    segments:
      - text: "[11 ayetine baq.]"
        cid: 0
  - verse: 14
    segments:
      - text: "[11 ayetine baq.]"
        cid: 0
  - verse: 15
    segments:
      - text: "[11 ayetine baq.]"
        cid: 0
  - verse: 16
    segments:
      - text: "[11 ayetine baq.]"
        cid: 0
  - verse: 17
    segments:
      - text: "Qahr olsun o insan! Ne inkârcıdır!"
        cid: 0
  - verse: 18
    segments:
      - text: "Allaһ onı neden yarattı?"
        cid: 0
  - verse: 19
    segments:
      - text: "Bir nutfeden (spermadan) yarattı da, oña şekil berdi."
        cid: 0
  - verse: 20
    segments:
      - text: "Soñra oña yolunı qolaylaştırdı. (Ayet, «Ana qarnından çıqmaqnı qolaylaştırdı»» ya da «Hayır ve şerr yolunı seçüvini qolaylaştırdı»» şekillerinde de añlatılğan)."
        cid: 0
  - verse: 21
    segments:
      - text: "Soñ onıñ canını aldı ve qabirge soqtı."
        cid: 0
  - verse: 22
    segments:
      - text: "Soñ istegen bir vaqtında onı yañıdan tiriltir."
        cid: 0
  - verse: 23
    segments:
      - text: "Yoq! (İnsan) Allaһnıñ emir etkenini yapmadı."
        cid: 0
  - verse: 24
    segments:
      - text: "İnsan aşağanına bir baqsın."
        cid: 0
  - verse: 25
    segments:
      - text: "Oyle ki: Yağmurlar yağdırdıq. Soñ topraqnı koz-koz yardıq da, o yerden osümlikler, yuzüm bağları, sebzeler, zeytun ve hurma tereklerini, iri ve sıq terekli bağçalar, meyvalar ve çayırlar yarattıq. (Butün bular) sizni ve ayvanlarıñıznı faydalandırmaq içündir."
        cid: 0
  - verse: 26
    segments:
      - text: "[25 ayetine baq.]"
        cid: 0
