surah_id: 80
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "Kuneş qatlanıp tüyurilgende,"
        cid: 0
  - verse: 2
    segments:
      - text: "Yıldızlar (qararıp) tökülgende,"
        cid: 0
  - verse: 3
    segments:
      - text: "Dağlar (sallanıp) yurütilgende,"
        cid: 0
  - verse: 4
    segments:
      - text: "Balalaycaq develer başları boş qoyup yiberilgende,"
        cid: 0
  - verse: 5
    segments:
      - text: "Vahşiy ayvanlar toplanıp, bir yerge ketirilgende,"
        cid: 0
  - verse: 6
    segments:
      - text: "Deñizler qaynatılğanda,"
        cid: 0
  - verse: 7
    segments:
      - text: "Ruhlar (bedenlernen) birleştirilgende, 8-9. Tirileyin topraqqa komülgen qızğa, angi gunah sebebinen, oldürilgeni soralğanda,"
        cid: 0
  - verse: 10
    segments:
      - text: "(Ameller yazılı olğan) defterler açılğanda,"
        cid: 0
  - verse: 11
    segments:
      - text: "Kok yuzü sokülip alınğanda, 12-13. Ceennem tutaştırılğanda ve cennet yaqlaştırılğanda,"
        cid: 0
  - verse: 14
    segments:
      - text: "İnsan neler ketirgenini bilecek. 15-16. Yoq! Aqıp ketken, bir ğayıp olup, bir etrafnı aydınlatqan yıldızlarğa ant olsun,"
        cid: 0
  - verse: 17
    segments:
      - text: "Qararmağa yuz tutqanda, gecege ant olsun,"
        cid: 0
  - verse: 18
    segments:
      - text: "Ağarmağa başlağanda, sabağa ant olsun ki, 19-20. O (Qur’an), şubesiz degerli, kuçlü ve Arşnıñ saibi (Allaһnıñ) qatında itibarlı bir elçi (Cebrail) ketirgen sözdir."
        cid: 0
  - verse: 19
    segments:
      - text: "Bir nutfeden (spermadan) yarattı da, oña şekil berdi."
        cid: 0
  - verse: 20
    segments:
      - text: "Soñra oña yolunı qolaylaştırdı. (Ayet, «Ana qarnından çıqmaqnı qolaylaştırdı»» ya da «Hayır ve şerr yolunı seçüvini qolaylaştırdı»» şekillerinde de añlatılğan)."
        cid: 0
  - verse: 21
    segments:
      - text: "O, o yerde itibarlı, işanılğan (bir elçi)dir."
        cid: 0
  - verse: 22
    segments:
      - text: "Arqadaşıñız (Muһammed) de mecnun degildir."
        cid: 0
  - verse: 23
    segments:
      - text: "Ant olsun ki, onı (Cebrailni) ap-açıq ufuqta korgendir."
        cid: 0
  - verse: 24
    segments:
      - text: "O, ğaybnıñ bilgilerini (sizden) gizlemez."
        cid: 0
  - verse: 25
    segments:
      - text: "O lânetlengen şeytannıñ sözü de degildir."
        cid: 0
  - verse: 26
    segments:
      - text: "Al boyle eken, ne yerge barmaqtasıñız. 27-28. O, er kes içün, sizden doğru yolda yurmek istegenler içün, bir ogüttir."
        cid: 0
  - verse: 29
    segments:
      - text: "Alemlerniñ Rabbi Allaһ istemegence, siz istep olamazsıñız. (Ayetteki «ğayb» sözü - duyğu azalarınen idrak etilalmağan ve faqat inanılması kerek olğan iman esaslarını içine almaqta. Allaһ Resulı olar aqqında saranlıqnen davranmağanı, yani er angi bir şeyni gizlemegeni izaatlanğan)."
        cid: 0
  - verse: 33
    segments:
      - text: "Qulaqlarnı sağır etici o ses kelgende, 34-36. İşte, o kunü insan qardaşından, anasından, babasından, eşinden ve balasından qaçar."
        cid: 0
  - verse: 37
    segments:
      - text: "O kunü, er kesniñ ozünden yetip artacaq bir derdi bardır. 38-39. O kunü bir taqım yuzler parlaq, kuler ve sevinçlidir. 40-42. Kene o kunü bir taqım yuzlerni de keder sarğan, qasevetten qap-qara kesilgendir. İşte, bular kâfirlerdir, gunahkârlardır."
        cid: 0
  - verse: 81
    segments:
      - text: "et-TEKVİİR Mekkede engen, 29 ayettir. Sureniñ başında kuneşniñ tüyurilüvinden söz etilgen ve adını da bu yerden alğan. Sureniñ söz tertibinde, içine alğan mevzularğa ait añlamlarnı yanğıratqan ve kuçlendirgen mukemmel bir musiqiy, taqlit etilmez bir aenk bar. Bismilâaһirraһmaanirraһiim (Rahman ve rahim olğan Allaһnıñ adınen)."
        cid: 0