surah_id: 80
language: crh
author: dizen-qurtnezir
verses:
  - verse: 17
    segments:
      - text: "Qahr olsun o insan! Ne inkârcıdır!"
        cid: 0
  - verse: 18
    segments:
      - text: "Allaһ onı neden yarattı?"
        cid: 0
  - verse: 19
    segments:
      - text: "Bir nutfeden (spermadan) yarattı da, oña şekil berdi."
        cid: 0
  - verse: 20
    segments:
      - text: "Soñra oña yolunı qolaylaştırdı. (Ayet, «Ana qarnından çıqmaqnı qolaylaştırdı»» ya da «Hayır ve şerr yolunı seçüvini qolaylaştırdı»» şekillerinde de añlatılğan)."
        cid: 0
  - verse: 21
    segments:
      - text: "Soñ onıñ canını aldı ve qabirge soqtı."
        cid: 0
  - verse: 22
    segments:
      - text: "Soñ istegen bir vaqtında onı yañıdan tiriltir."
        cid: 0
  - verse: 23
    segments:
      - text: "Yoq! (İnsan) Allaһnıñ emir etkenini yapmadı."
        cid: 0
  - verse: 24
    segments:
      - text: "İnsan aşağanına bir baqsın."
        cid: 0
  - verse: 33
    segments:
      - text: "Qulaqlarnı sağır etici o ses kelgende,"
        cid: 0
  - verse: 37
    segments:
      - text: "O kunü, er kesniñ ozünden yetip artacaq bir derdi bardır."
        cid: 0