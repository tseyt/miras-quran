        cid: 0
  - verse: 33
    segments:
      - text: "Qulaqlarnı sağır etici o ses kelgende,"
        cid: 0
  - verse: 34
    segments:
      - text: "İşte, o kunü insan qardaşından, anasından, babasından, eşinden ve balasından qaçar."
        cid: 0
  - verse: 35
    segments:
      - text: "[34 ayetine baq.]"
        cid: 0
  - verse: 36
    segments:
      - text: "[34 ayetine baq.]"
        cid: 0
  - verse: 37
    segments:
      - text: "O kunü, er kesniñ ozünden yetip artacaq bir derdi bardır."
        cid: 0
  - verse: 38
    segments:
      - text: "O kunü bir taqım yuzler parlaq, kuler ve sevinçlidir."
        cid: 0
  - verse: 39
    segments:
      - text: "[38 ayetine baq.]"
        cid: 0
  - verse: 40
    segments:
      - text: "Kene o kunü bir taqım yuzlerni de keder sarğan, qasevetten qap-qara kesilgendir. İşte, bular kâfirlerdir, gunahkârlardır."
        cid: 0
