surah_id: 15
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >
          Elif. Lâam. Raa. Bular Kitapnıñ ve ap-açıq bir Qur'annıñ ayetleridir.
        cid: 0
  - verse: 2
    segments:
      - text: >
          İnkâr etkenler zaman-zaman, keşke biz de müslman olsa edik, diye arzu eterler.
          (İnkâr etkenlerniñ zaman-zaman bu arzunı taşığanlarına baqmadan, kene de iman
          etmegenleri sebepli, olarnıñ dünya menfaatlarına avesli oluvları, fenalıq ve
          inkârcılıqlarınen şartlanğanlarındandır. Ayetten kâfirlerniñ ahirette: «Keşke
          dünyada olğanda iman etken olsa edik!» diye kederlenecekleri de añlaşıla bilir).
        cid: 0
  - verse: 3
    segments:
      - text: >
          Olarnı bıraq; aşasınlar, eglensinler ve boş ümüt olarnı eglendire tursın. (Fena
          neticeni) yaqında bilecekler!
        cid: 0
  - verse: 4
    segments:
      - text: >
          Elâk etken iç bir ülkemiz yoq ki, aqqında (bizce) bilingen bir yazı olmasın.
          (İster toprağını yerge batırmaq ve ister halqını yoq etmek suretinen, ya da
          başqa afatlarnen elâk etilgen memleketlerniñ iç biri kör-korane, tesadüfiy
          olaraq elâk etilmediler. Allah tarafından tayin ve taqdir etilip, levh-i
          mahfuzda yazılğan deñişmez, unutılmaz ve ğaflet etilmez bir yazığa köre elâk
          olğandır. Demek ki, devlet ve milletlerniñ de, şahıslar kibi, taqdir etilgen
          belli ömürleri bar. Şahıslar doğğanı, yetişkeni, qartayğanı, ölgeni kibi,
          devletler de qurulır, inkişaf eter ve niayet Allahnıñ taqdir etken künü
          kelgeninen, yıqılıp, tarihke qarışırlar. Şahıslar kibi, bularnıñ da bazıları
          uzun ömürli, bazıları ise, qısqa ömürli olur).
        cid: 0
  - verse: 5
    segments:
      - text: >
          İç bir millet eceliniñ ögüne keçalmaz ve onı keçiktiralmaz.
        cid: 0
  - verse: 6
    segments:
      - text: >
          Dediler ki: «Ey, özüne Qur'an endirilgen (Muhammed!) Sen mıtlaqa bir mecnunsıñ!»
        cid: 0
  - verse: 7
    segments:
      - text: >
          «Eger doğru söylegenlerden olsañ edi, bizge meleklerni ketirmeli ediñ». (Evelki
          araplar şairniñ cinden ilham alğanına inana ediler. Resulullah nefaset noqtai
          nazarından, şiirden ve edebiy nesirden daa üstün bir Kitap ketirgeni içün, oña
          «Mecnun şair» dediler).
        cid: 0
  - verse: 8
    segments:
      - text: >
          Biz meleklerni ancaq haq ile endirirmiz. O zaman olarğa muhlet berilmez.
        cid: 0
  - verse: 9
    segments:
      - text: >
          Qur'annı kesen-kes biz endirdik; elbette onı biz qorçalaycaqmız. (Bu ayet açıq
          köstermekte ki, Qur'an-ı Kerim Allahnıñ qorçalavı altındadır ve ğayıp olmadan,
          eñ ufaq bir bozuluvğa oğramadan, qıyametke qadar aslını muafaza etecektir).
        cid: 0
  - verse: 10
    segments:
      - text: >
          Ant olsun, senden evelki milletlerge de elçiler yolladıq.
        cid: 0
  - verse: 11
    segments:
      - text: >
          Olarğa bir peyğamber kelgeninen, aman onıñnen alay ete ediler.
        cid: 0
  - verse: 12
    segments:
      - text: >
          İşte, böylece, biz onı, (inkârcılıqnı) suçlılarnıñ qalplerine soqarmız.
        cid: 0
  - verse: 13
    segments:
      - text: >
          Evelkilerniñ başına kelgenlerden ders aluvları kerekse de, olar alâ buña
          (Qur'anğa) inanmaylar.
        cid: 0
  - verse: 14
    segments:
      - text: >
          Olarğa kökten bir qapu açsaq da, o yerden yuqarı çıqsalar, kene de: «Közlermiz
          boyandı, daa doğrusı, bizge ırım yapılğandır», derler.
        cid: 0
  - verse: 15
    segments:
      - text: >
          [14 ayetine baq.]
        cid: 0
  - verse: 16
    segments:
      - text: >
          Ant olsun, biz kökte bir taqım burclar yarattıq ve seyir etkenler içün onı
          süsledik. (Burc - aslında yüksek köşk demektir. Kök yüzünde hususiy bir şekilde
          toplanğan bir taqım yıldızlar topuna da bu manada burc denilir. Bulardan
          meşurları on eki dane olmaqnen beraber, ayet-i kerimede «Buruuc» kelimesi
          bellisiz ve çoqluq olaraq zikr etilgenine köre, kök yüzünde daa keşf etilmegen
          bir çoq yıldız toplarınıñ barlığına işaret etile).
        cid: 0
  - verse: 17
    segments:
      - text: >
          Olarnı taşboran yapılğan (quvulğan) er şeytandan qorçaladıq.
        cid: 0
  - verse: 18
    segments:
      - text: >
          Ancaq, gizliden diñlegen istisna. Onıñ da peşine açıq bir alev stunı (uçar
          yıldız) tüşkendir.
        cid: 0
  - verse: 19
    segments:
      - text: >
          Yerni keñ yaydıq, o yerde qaviy dağlar yerleştirdik, kene o yerde miqdarı ve
          ölçüsi belli şeyler östürdik.
        cid: 0
  - verse: 20
    segments:
      - text: >
          O yerde em siz içün, em de rızıqları sizge ait olmağanlar içün (kerekli) keçinüv
          vastaları yarattıq.
        cid: 0
  - verse: 21
    segments:
      - text: >
          Er şeyniñ hazineleri yalıñız bizim yanımızdadır. Biz onı, ancaq belli bir
          ölçünen endirirmiz.
        cid: 0
  - verse: 22
    segments:
      - text: >
          Biz rüzgârlarnı aşlayıcı olaraq yolladıq ve kökten bir suv endirdik de, onıñnen
          suv itiyacıñıznı qarşıladıq. (Biz bularnı yapmasa edik) siz onı (yeterli) suvnı
          toplap olamaz ediñiz. (Ayette rüzgârnıñ bir aşlayıcı olaraq yollanılğanı ifade
          etilmekte ki, bugün ilim yağmurnıñ yağuvında rüzgârnıñ büyük röl oynağanını,
          aynı zamanda, ekinler üstünden eskende olarnıñ erkek urluqlarını ırğaçı
          urluqlarnıñ üzerine qondurmaqnen, olarnı aşlağanını isbat etmekte. Bu ayette
          ayrıca kökten engen suvlarnıñ yer qatlamlarında toplanğanı ve bu yerlerden
          insanlıqnıñ itiyacı qarşılanğanı ifade etilmekte).
        cid: 0
  - verse: 23
    segments:
      - text: >
          Şübesiz, biz tiriltir ve biz öldürirmiz! Ve er şeyge biz varis olurmız.
        cid: 0
  - verse: 24
    segments:
      - text: >
          Ant olsun, biz sizden evel kelip keçkenlerni de bilirmiz, keri qalğanlarnı da
          bilirmiz.
        cid: 0
  - verse: 25
    segments:
      - text: >
          Şübesiz, Rabbiñ olarnı (qıyamette) toplaycaq. Çünki, O, hakimdir, alimdir.
        cid: 0
  - verse: 26
    segments:
      - text: >
          Ant olsun, biz insannı (pişken) quru bir çamurdan, şekillengen qara balçıqtan
          yarattıq.
        cid: 0
  - verse: 27
    segments:
      - text: >
          Cinlerni de, daa evel, zeerli ateşten yaratqan edik.
        cid: 0
  - verse: 28
    segments:
      - text: >
          O vaqıtta, Rabbiñ meleklerge degen edi ki: «Qup-quru bir çamurdan, şekillengen
          qara balçıqtan bir insan yaratacağım».
        cid: 0
  - verse: 29
    segments:
      - text: >
          «Oña şekil bergen ve oña ruhumdan üflegen vaqtımda, siz aman onıñ içün secdege
          qapanıñ!»
        cid: 0
  - verse: 30
    segments:
      - text: >
          Meleklerniñ episi de aman secde ettiler.
        cid: 0
  - verse: 31
    segments:
      - text: >
          Faqat İblis istisna! O secde etkenlernen beraber olmaqtan qaçındı.
        cid: 0
  - verse: 32
    segments:
      - text: >
          (Allah:) Ey, İblis! Secde etkenlernen beraber olmayuvıñnıñ sebebi nedir? dedi.
        cid: 0
  - verse: 33
    segments:
      - text: >
          (İblis:) Men quru bir çamurdan, şekillengen qara balçıqtan yaratqan bir insanıña
          secde etecek degilim, dedi.
        cid: 0
  - verse: 34
    segments:
      - text: >
          Allah böyle buyurdı: Öyle ise, o yerden çıq. Artıq quvıldıñ!
        cid: 0
  - verse: 35
    segments:
      - text: >
          Muaqkaq ki, qıyamet kününe qadar lânet seniñ üzeriñe olacaq!
        cid: 0
  - verse: 36
    segments:
      - text: >
          (İblis:) Rabbim! Öyle ise, (barlıqlarnıñ) tekrar tirilecek kününe qadar maña
          muhlet ber, dedi.
        cid: 0
  - verse: 37
    segments:
      - text: >
          Allah: Sen belli bir vaqıtqa qadar özlerine muhlet berilgenlerdensiñ, buyurdı.
        cid: 0
  - verse: 38
    segments:
      - text: >
          [37 ayetine baq.]
        cid: 0
  - verse: 39
    segments:
      - text: >
          (İblis) dedi ki: Rabbim! Meni yoldan azdıruvıña qarşılıq, men de yer yüzünde
          olarğa (günahlarnı) süsleycem ve olarnıñ episini mıtlaqa yoldan azdıracam!
        cid: 0
  - verse: 40
    segments:
      - text: >
          Ancaq, olardan ihlâslı qullarıñ istisna.
        cid: 0
  - verse: 41
    segments:
      - text: >
          (Allah) böyle buyurdı: «İşte, maña barğan dos-doğru yol budır».
        cid: 0
  - verse: 42
    segments:
      - text: >
          «Şübesiz, qullarım üzerinde seniñ bir akimiyetiñ yoqtır. Ancaq, yoldan
          azğanlardan saña uyğanlar istisna».
        cid: 0
  - verse: 43
    segments:
      - text: >
          Muaqqaq ceennem olarnıñ episine vade olunğan yerdir.
        cid: 0
  - verse: 44
    segments:
      - text: >
          Ceennemniñ yedi qapusı bardır. Olardan er qapu içün birer toplulıq ayırılğandır.
          (Ceennemniñ yedi qapusı - bazı tefsirlerge köre, yedi tabaqadır. «Cüz'un
          maqsuum» da, o qapulardan kirerek, yerlerini alacaqlardır. Bazı rivayetlerge
          köre, bu tabaqalardan birincisi Haaviye - günahkâr mü'minler içün, ekincisi
          Saqar - yeudiyler içün, üçüncisi Sa'iir - hristianlar içün, dörtüncisi Cahiim -
          Saabie içün, beşincisi Lezaa - ateşperestler içün, altıncısı Hutame -
          putperestler içün ve pek çoq adlarnen añılğan yedincisi munafıqlar içündir).
        cid: 0
  - verse: 45
    segments:
      - text: >
          (Allahnıñ azabından qorqup, rahmetine sığınğan) taqva saipleri mıtlaqa
          cennetlerde ve çoqraq başlarında olacaqlar.
        cid: 0
  - verse: 46
    segments:
      - text: >
          «O yerge eminliknen ve selâmetnen kiriñ», (denilir olarğa).
        cid: 0
  - verse: 47
    segments:
      - text: >
          Biz olarnıñ goñüllerindeki kinni söküp attıq; olar artıq köşkler üzerinde
          qarşı-qarşığa oturğan qardaşlar olacaqlar. (Allah Taalâ dünyada bir-birinden
          ıncınğan ve bir-birine kin beslegen mü'minlerniñ qalplerinden o kinni çıqaracaq
          ve mü'minler, qardaş olaraq subet etecekler).
        cid: 0
  - verse: 48
    segments:
      - text: >
          Olarğa o yerde iç bir yorğunlıq kelmeycek ve olar o yerden çıqarılmaycaqlar.
        cid: 0
  - verse: 49
    segments:
      - text: >
          (Resulım!) Qullarıma menim çoq bağışlayıcı ve pek merhametli olğanımnı haber
          ber.
        cid: 0
  - verse: 50
    segments:
      - text: >
          Menim azabımnıñ elem berici bir azap olğanını da bildir.
        cid: 0
  - verse: 51
    segments:
      - text: >
          Olarğa İbrahimniñ musafirlerinden (meleklerden) de haber ber.
        cid: 0
  - verse: 52
    segments:
      - text: >
          Onıñ yanına kirgen vaqıtlarında «Selâm» dediler. (İbrahim:) Biz sizden
          çekinemiz, dedi.
        cid: 0
  - verse: 53
    segments:
      - text: >
          Dediler ki: Qorqma; biz saña bilgili bir oğul müjdelemektemiz.
        cid: 0
  - verse: 54
    segments:
      - text: >
          (İbrahim:) Maña ihtiyarlıq kelgenine rağmen, meni müjdelemektesizmi? Meni ne ile
          müjdeleysiñiz? dedi.
        cid: 0
  - verse: 55
    segments:
      - text: >
          Saña aqiqatnı müjdeledik, saqın ümütsizlikke tüşkenlerden olma! dediler.
        cid: 0
  - verse: 56
    segments:
      - text: >
          (İbrahim) dedi ki: Rabbiniñ rahmetinden sapıqlardan başqa kim ümüt keser?
        cid: 0
  - verse: 57
    segments:
      - text: >
          «Ey, elçiler! (Başqa) ne işiñiz bar?» dedi. (Az.İbrahim olarnıñ Allah tarafından
          yollanılğan melekler olğanlarını añlağanınen, böyle bir melek cemaatınıñ sadece
          bir müjde içün kelmegenini, daa başqa müim vazifeleri de ola bilecegini tahmin
          eterek, bu sualni berdi).
        cid: 0
  - verse: 58
    segments:
      - text: >
          Dediler ki: «Biz suçlı bir toplumğa (olarnı elâk etmege) yollanıldıq».
        cid: 0
  - verse: 59
    segments:
      - text: >
          «Ancaq, Luut ailesi istisna. Olarnıñ episini qurtaracaqmız».
        cid: 0
  - verse: 60
    segments:
      - text: >
          (Faqat Luutnıñ) qadını istisna; biz onıñ keri qalğanlardan oluvını taqdir
          ettik».
        cid: 0
  - verse: 61
    segments:
      - text: >
          Elçiler Luut ailesine kelgende, Luut olarğa: «Aqiqaten, siz tanılmağan
          kimselersiñiz», dedi.
        cid: 0
  - verse: 62
    segments:
      - text: >
          [61 ayetine baq.]
        cid: 0
  - verse: 63
    segments:
      - text: >
          Dediler ki: «Aksine, biz saña olarnıñ şübe etken şeylerini (azapnı ve elâketni)
          ketirdik.
        cid: 0
  - verse: 64
    segments:
      - text: >
          Saña aqiqatnı ketirdik; biz aqiqaten doğru söyleyicilermiz.
        cid: 0
  - verse: 65
    segments:
      - text: >
          Geceniñ bir qısmında aile azalarıñnı yolğa çıqar, sen de artlarından yür. Sizden
          iç kimse saqın çevirilip de, artına baqmasın, istenilgen yerge ketiñ.
        cid: 0
  - verse: 66
    segments:
      - text: >
          Oña (Luutqa) şu ükmimizni vahiy etik: «Sabağa çıqar ekenler, mıtlaqa olarnıñ
          ardı kesilgen olacaq».
        cid: 0
  - verse: 67
    segments:
      - text: >
          Şeer halqı, bir-birilerini hayırlap, (meleklerniñ yanına) keldiler. (Çünki,
          yigitler suretinde kelgen melekler olarnıñ gomoseksuallikten doğğan fena
          isteklerini uyandırğan edi).
        cid: 0
  - verse: 68
    segments:
      - text: >
          (Luut) olarğa: «Bular menim musafirimdir. Saqın meni utandırmañ; Allahtan
          qorquñ; meni rezil etmeñ!» dedi
        cid: 0
  - verse: 69
    segments:
      - text: >
          [68 ayetine baq.]
        cid: 0
  - verse: 70
    segments:
      - text: >
          «Biz seni el-alemniñ işine qarışuvdan men etmegen edikmi?» dediler.
        cid: 0
  - verse: 71
    segments:
      - text: >
          (Luut:) İşte, qızlarım! (Tüşüngenleriñizni) yapacaq iseñiz (olarnen evleniñ),
          dedi.
        cid: 0
  - verse: 72
    segments:
      - text: >
          (Resulım!) Ayatnıñ aqqı içün olar sarğoşlıqları içinde bocalay ediler.
        cid: 0
  - verse: 73
    segments:
      - text: >
          Küneş doğğanda olarnı o qorqunç ses yaqaladı.
        cid: 0
  - verse: 74
    segments:
      - text: >
          Böylece, ülkeleriniñ üstüni astına çevirdik. Üstlerine de balçıqtan pişirilgen
          taşlar yağdırdıq. (Luut qavmı gomoseksuallik kibi fena bir günahnı işlegenleri
          içün, Allah Taalâ olarğa evelâ qorqunç bir ses duyurğan, soñra memleketleriniñ
          astını üstüne çevirgen, daa soñunda üzerlerine taş yağdırğan ki, bir milletniñ
          yoq olup, tarih sanasından silinmensi içün bundan daa şiddetli felâket olamaz).
        cid: 0
  - verse: 75
    segments:
      - text: >
          İşte, bunda ibret alğanlar içün, işaretler bardır.
        cid: 0
  - verse: 76
    segments:
      - text: >
          Olar alâ közler ögünde turğan bir yol üzerindedirler.
        cid: 0
  - verse: 77
    segments:
      - text: >
          Aqiqaten, bunda iman etkenler içün bir ibret bardır.
        cid: 0
  - verse: 78
    segments:
      - text: >
          Eyke halqı da kerçekten zalım edi. (Ayette añılğan Eyke sıq ormanlıq demektir.
          Şuayb peyğamber ve qavmı oturğan ülke ormanlıq olğanı içün olarğa Eyke halqı
          denilgen).
        cid: 0
  - verse: 79
    segments:
      - text: >
          Biz olardan da intiqam aldıq. Ekisi de (Eyke ve Medyen) açıq bir yol
          üzerindedir.
        cid: 0
  - verse: 80
    segments:
      - text: >
          Ant olsun, Hicr halqı da peyğamberlerni yalanlağan ediler. (Hicr Salih
          peyğamberniñ qavmı yaşağan bölgeniñ adıdır. Bu yerde yaşağan halq Semuud qavmı
          diye añılğan).
        cid: 0
  - verse: 81
    segments:
      - text: >
          Biz olarğa mucizelerimizni bergen edik; faqat olardan yüz çevirgen ediler.
        cid: 0
  - verse: 82
    segments:
      - text: >
          Olar dağlarda (qayalardan) eminlik içinde qalacaq evler oya ediler.
        cid: 0
  - verse: 83
    segments:
      - text: >
          Olarnı da sabağa çıqqanlarında o qroqunç ses yaqaladı.
        cid: 0
  - verse: 84
    segments:
      - text: >
          Qazanayatqan şeyleri olardan iç bir zararnı uzaqlaştırmadı.
        cid: 0
  - verse: 85
    segments:
      - text: >
          Biz köklerni, yerni ve ekisiniñ arasındakilerni, ancaq haq ile yarattıq. O saat
          (qıyamet) mıtlaqa kelecek. Şimdilik olarğa güzel muamele et.
        cid: 0
  - verse: 86
    segments:
      - text: >
          Şübesiz, Rabbiñ haqqı ile yaratıcı, pek yahşı bilicidir.
        cid: 0
  - verse: 87
    segments:
      - text: >
          Ant olsun ki, biz saña tekrarlanğan yedi ayetni ve yüce Qur'annı berdik.
          (Resulullahtan rivayet etilgen bir hadiske köre, bu yedi ayet namazlarnıñ er
          rekâtında tekrar etilgen Faatiha suresidir).
        cid: 0
  - verse: 88
    segments:
      - text: >
          Saqın olardan bazı sınıflarğa bergen dünya malımızğa köz tikme, olardan tolayı
          ğam çekme ve mü'minlerge alçaqgonülli ol.
        cid: 0
  - verse: 89
    segments:
      - text: >
          De ki: Şübesiz, men ap-açıq bir tenbiyeciyim.
        cid: 0
  - verse: 90
    segments:
      - text: >
          Aqiqaten, biz (Qur'annı) qısımlarğa ayırğanlarğa azapnı endirgendirmiz.
        cid: 0
  - verse: 91
    segments:
      - text: >
          Olar Qur'annı bölüp ayırğanlardır. (Qur'annı bölüp ayırğanlar, onıñ bir qısmını
          qabul etip, bir qısmını red eticilerdir. YA da Qur'anğa şiir, fal ve masal
          degenlerdir).
        cid: 0
