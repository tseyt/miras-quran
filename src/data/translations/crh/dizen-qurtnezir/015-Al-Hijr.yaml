surah_id: 15
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "Elif. Lâam. Raa. Bular Kitapnıñ ve ap-açıq bir Qur’annıñ ayetleridir."
        cid: 0
  - verse: 2
    segments:
      - text: "İnkâr etkenler zaman-zaman, keşke biz de muslman olsa edik, diye arzu eterler. (İnkâr etkenlerniñ zaman-zaman bu arzunı taşığanlarına baqmadan, kene de iman etmegenleri sebepli, olarnıñ dünya menfaatlarına avesli oluvları, fenalıq ve inkârcılıqlarınen şartlanğanlarındandır. Ayetten kâfirlerniñ ahirette: «Keşke dünyada olğanda iman etken olsa edik!» diye kederlenecekleri de añlaşıla bilir)."
        cid: 0
  - verse: 3
    segments:
      - text: "Olarnı bıraq; aşasınlar, eglensinler ve boş umüt olarnı eglendire tursın. (Fena neticeni) yaqında bilecekler!"
        cid: 0
  - verse: 4
    segments:
      - text: "Elâk etken iç bir ulkemiz yoq ki, aqqında (bizce) bilingen bir yazı olmasın. (İster toprağını yerge batırmaq ve ister halqını yoq etmek suretinen, ya da başqa afatlarnen elâk etilgen memleketlerniñ iç biri kor-korane, tesadüfiy olaraq elâk etilmediler. Allaһ tarafından tayin ve taqdir etilip, levh-i mahfuzda yazılğan deñişmez, unutılmaz ve ğaflet etilmez bir yazığa kore elâk olğandır. Demek ki, devlet ve milletlerniñ de, şahıslar kibi, taqdir etilgen belli omürleri bar. Şahıslar doğğanı, yetişkeni, qartayğanı, olgeni kibi, devletler de qurulır, inkişaf eter ve niayet Allaһnıñ taqdir etken kunü kelgeninen, yıqılıp, tarihke qarışırlar. Şahıslar kibi, bularnıñ da bazıları uzun omürli, bazıları ise, qısqa omürli olur)."
        cid: 0
  - verse: 5
    segments:
      - text: "İç bir millet eceliniñ ogüne keçalmaz ve onı keçiktiralmaz."
        cid: 0
  - verse: 6
    segments:
      - text: "Dediler ki: «Ey, ozüne Qur’an endirilgen (Muһammed!) Sen mıtlaqa bir mecnunsıñ!» 7. «Eger doğru söylegenlerden olsañ edi, bizge meleklerni ketirmeli ediñ». (Evelki araplar şairniñ cinden ilham alğanına inana ediler. Resulullah nefaset noqtai nazarından, şiirden ve edebiy nesirden daa ustün bir Kitap ketirgeni içün, oña «Mecnun şair» dediler)."
        cid: 0
  - verse: 8
    segments:
      - text: "Biz meleklerni ancaq haq ile endirirmiz. O zaman olarğa muhlet berilmez."
        cid: 0
  - verse: 9
    segments:
      - text: "Qur’annı kesen-kes biz endirdik; elbette onı biz qorçalaycaqmız. (Bu ayet açıq kostermekte ki, Qur’an-ı Kerim Allaһnıñ qorçalavı altındadır ve ğayıp olmadan, eñ ufaq bir bozuluvğa oğramadan, qıyametke qadar aslını muafaza etecektir)."
        cid: 0
  - verse: 10
    segments:
      - text: "Ant olsun, senden evelki milletlerge de elçiler yolladıq."
        cid: 0
  - verse: 11
    segments:
      - text: "Olarğa bir peyğamber kelgeninen, aman onıñnen alay ete ediler."
        cid: 0
  - verse: 12
    segments:
      - text: "İşte, boylece, biz onı, (inkârcılıqnı) suçlılarnıñ qalplerine soqarmız."
        cid: 0
  - verse: 13
    segments:
      - text: "Evelkilerniñ başına kelgenlerden ders aluvları kerekse de, olar alâ buña (Qur’anğa) inanmaylar."
        cid: 0
  - verse: 16
    segments:
      - text: "Ant olsun, biz kokte bir taqım burclar yarattıq ve seyir etkenler içün onı süsledik. (Burc - aslında yuksek koşk demektir. Kok yuzünde hususiy bir şekilde toplanğan bir taqım yıldızlar topuna da bu manada burc denilir. Bulardan meşurları on eki dane olmaqnen beraber, ayet-i kerimede «Buruuc» kelimesi bellisiz ve çoqluq olaraq zikr etilgenine kore, kok yuzünde daa keşf etilmegen bir çoq yıldız toplarınıñ barlığına işaret etile)."
        cid: 0
  - verse: 17
    segments:
      - text: "Olarnı taşboran yapılğan (quvulğan) er şeytandan qorçaladıq."
        cid: 0
  - verse: 18
    segments:
      - text: "Ancaq, gizliden diñlegen istisna. Onıñ da peşine açıq bir alev stunı (uçar yıldız) tüşkendir."
        cid: 0
  - verse: 19
    segments:
      - text: "Yerni keñ yaydıq, o yerde qaviy dağlar yerleştirdik, kene o yerde miqdarı ve olçüsi belli şeyler ostürdik."
        cid: 0
  - verse: 20
    segments:
      - text: "O yerde em siz içün, em de rızıqları sizge ait olmağanlar içün (kerekli) keçinüv vastaları yarattıq."
        cid: 0
  - verse: 21
    segments:
      - text: "Er şeyniñ hazineleri yalıñız bizim yanımızdadır. Biz onı, ancaq belli bir olçünen endirirmiz."
        cid: 0
  - verse: 22
    segments:
      - text: "Biz ruzgârlarnı aşlayıcı olaraq yolladıq ve kokten bir suv endirdik de, onıñnen suv itiyacıñıznı qarşıladıq. (Biz bularnı yapmasa edik) siz onı (eterli) suvnı toplap olamaz ediñiz. (Ayette ruzgârnıñ bir aşlayıcı olaraq yollanılğanı ifade etilmekte ki, bugun ilim yağmurnıñ yağuvında ruzgârnıñ buyuk rol oynağanını, aynı zamanda, ekinler ustünden eskende olarnıñ erkek urluqlarını ırğaçı urluqlarnıñ uzerine qondurmaqnen, olarnı aşlağanını isbat etmekte. Bu ayette ayrıca kokten engen suvlarnıñ yer qatlamlarında toplanğanı ve bu yerlerden insanlıqnıñ itiyacı qarşılanğanı ifade etilmekte)."
        cid: 0
  - verse: 23
    segments:
      - text: "Şubesiz, biz tiriltir ve biz oldürirmiz! Ve er şeyge biz varis olurmız."
        cid: 0
  - verse: 24
    segments:
      - text: "Ant olsun, biz sizden evel kelip keçkenlerni de bilirmiz, keri qalğanlarnı da bilirmiz."
        cid: 0
  - verse: 25
    segments:
      - text: "Şubesiz, Rabbiñ olarnı (qıyamette) toplaycaq. Çünki, O, hakimdir, alimdir."
        cid: 0
  - verse: 26
    segments:
      - text: "Ant olsun, biz insannı (pişken) quru bir çamurdan, şekillengen qara balçıqtan yarattıq."
        cid: 0
  - verse: 27
    segments:
      - text: "Cinlerni de, daa evel, zeerli ateşten yaratqan edik."
        cid: 0
  - verse: 28
    segments:
      - text: "O vaqıtta, Rabbiñ meleklerge degen edi ki: «Qup-quru bir çamurdan, şekillengen qara balçıqtan bir insan yaratacağım». 29. «Oña şekil bergen ve oña ruhumdan uflegen vaqtımda, siz aman onıñ içün secdege qapanıñ!»"
        cid: 0
  - verse: 30
    segments:
      - text: "Meleklerniñ episi de aman secde ettiler."
        cid: 0
  - verse: 31
    segments:
      - text: "Faqat İblis istisna! O secde etkenlernen beraber olmaqtan qaçındı."
        cid: 0
  - verse: 32
    segments:
      - text: "(Allaһ:) Ey, İblis! Secde etkenlernen beraber olmayuvıñnıñ sebebi nedir? dedi."
        cid: 0
  - verse: 33
    segments:
      - text: "(İblis:) Men quru bir çamurdan, şekillengen qara balçıqtan yaratqan bir insanıña secde etecek degilim, dedi."
        cid: 0
  - verse: 34
    segments:
      - text: "Allaһ boyle buyurdı: Oyle ise, o yerden çıq. Artıq quvıldıñ!"
        cid: 0
  - verse: 35
    segments:
      - text: "Muaqkaq ki, qıyamet kunüne qadar lânet seniñ uzeriñye olacaq!"
        cid: 0
  - verse: 36
    segments:
      - text: "(İblis:) Rabbim! Oyle ise, (barlıqlarnıñ) tekrar tirilecek kunüne qadar maña muhlet ber, dedi."
        cid: 0
  - verse: 39
    segments:
      - text: "(İblis) dedi ki: Rabbim! Meni yoldan azdıruvıña qarşılıq, men de yer yuzünde olarğa (gunahlarnı) süsleycem ve olarnıñ episini mıtlaqa yoldan azdıracam!"
        cid: 0
  - verse: 40
    segments:
      - text: "Ancaq, olardan ihlâslı qullarıñ istisna."
        cid: 0
  - verse: 41
    segments:
      - text: "(Allaһ) boyle buyurdı: «İşte, maña barğan dos-doğru yol budır». 42. «Şubesiz, qullarım uzerinde seniñ bir akimiyetiñ yoqtır. Ancaq, yoldan azğanlardan saña uyğanlar istisna»."
        cid: 0
  - verse: 43
    segments:
      - text: "Muaqqaq ceennem olarnıñ episine vade olunğan yerdir."
        cid: 0
  - verse: 44
    segments:
      - text: "Ceennemniñ yedi qapusı bardır. Olardan er qapu içün birer toplulıq ayırılğandır. (Ceennemniñ yedi qapusı - bazı tefsirlerge kore, yedi tabaqadır. «Cüz’un maqsuum» da, o qapulardan kirerek, yerlerini alacaqlardır. Bazı rivayetlerge kore, bu tabaqalardan birincisi Haaviye - gunahkâr mu’minler içün, ekincisi Saqar yeudiyler içün, uçüncisi Sa’iir - hristianlar içün, dörtüncisi Cahiim Saabie içün, beşincisi Lezaa - ateşperestler içün, altıncısı Hutame putperestler içün ve pek çoq adlarnen añılğan yedincisi munafıqlar içündir)."
        cid: 0
  - verse: 45
    segments:
      - text: "(Allaһnıñ azabından qorqup, rahmetine sığınğan) taqva saipleri mıtlaqa cennetlerde ve çoqraq başlarında olacaqlar."
        cid: 0
  - verse: 46
    segments:
      - text: "«O yerge eminliknen ve selâmetnen kiriñ», (denilir olarğa)."
        cid: 0
  - verse: 47
    segments:
      - text: "Biz olarnıñ goñyullerindeki kinni söküp attıq; olar artıq koşkler uzerinde qarşı-qarşığa oturğan qardaşlar olacaqlar. (Allaһ Taalâ dünyada bir-birinden ıncınğan ve bir-birine kin beslegen mu’minlerniñ qalplerinden o kinni çıqaracaq ve mu’minler, qardaş olaraq subet etecekler)."
        cid: 0
  - verse: 48
    segments:
      - text: "Olarğa o yerde iç bir yorğunlıq kelmeycek ve olar o yerden çıqarılmaycaqlar."
        cid: 0
  - verse: 49
    segments:
      - text: "(Resulım!) Qullarıma menim çoq bağışlayıcı ve pek merhametli olğanımnı haber ber."
        cid: 0
  - verse: 50
    segments:
      - text: "Menim azabımnıñ elem berici bir azap olğanını da bildir."
        cid: 0
  - verse: 51
    segments:
      - text: "Olarğa İbrahimniñ musafirlerinden (meleklerden) de haber ber."
        cid: 0
  - verse: 52
    segments:
      - text: "Onıñ yanına kirgen vaqıtlarında «Selâm» dediler. (İbrahim:) Biz sizden çekinemiz, dedi."
        cid: 0
  - verse: 53
    segments:
      - text: "Dediler ki: Qorqma; biz saña bilgili bir oğul mujdelemektemiz."
        cid: 0
  - verse: 54
    segments:
      - text: "(İbrahim:) Maña ihtiyarlıq kelgenine rağmen, meni mujdelemektesizmi? Meni ne ile mujdeleysiñiz? dedi."
        cid: 0
  - verse: 55
    segments:
      - text: "Saña aqiqatnı mujdeledik, saqın umütsizlikke tüşkenlerden olma! dediler."
        cid: 0
  - verse: 56
    segments:
      - text: "(İbrahim) dedi ki: Rabbiniñ rahmetinden sapıqlardan başqa kim umüt keser?"
        cid: 0
  - verse: 57
    segments:
      - text: "«Ey, elçiler! (Başqa) ne işiñiz bar?» dedi. (Az.İbrahim olarnıñ Allaһ tarafından yollanılğan melekler olğanlarını añlağanınen, boyle bir melek cemaatınıñ sadeje bir mujde içün kelmegenini, daa başqa muim vazifeleri de ola bilecegini tahmin eterek, bu sualni berdi)."
        cid: 0
  - verse: 58
    segments:
      - text: "Dediler ki: «Biz suçlı bir toplumğa (olarnı elâk etmege) yollanıldıq»."
        cid: 0
  - verse: 59
    segments:
      - text: "«Ancaq, Luut ailesi istisna. Olarnıñ episini qurtaracaqmız»."
        cid: 0
  - verse: 60
    segments:
      - text: "(Faqat Luutnıñ) qadını istisna; biz onıñ keri qalğanlardan oluvını taqdir ettik»."
        cid: 0
  - verse: 61
    segments:
      - text: "Dediler ki: «Aksine, biz saña olarnıñ şube etken şeylerini (azapnı ve elâketni) ketirdik."
        cid: 0
  - verse: 62
    segments:
      - text: "Saña aqiqatnı ketirdik; biz aqiqaten doğru söyleyicilermiz."
        cid: 0
  - verse: 63
    segments:
      - text: "Geceniñ bir qısmında aile azalarıñnı yolğa çıqar, sen de artlarından yur. Sizden iç kimse saqın çevirilip de, artına baqmasın, istenilgen yerge ketiñ."
        cid: 0
  - verse: 64
    segments:
      - text: "Oña (Luutqa) şu ukmimizni vahiy etik: «Sabağa çıqar ekenler, mıtlaqa olarnıñ ardı kesilgen olacaq»."
        cid: 0
  - verse: 65
    segments:
      - text: "Şeer halqı, bir-birilerini hayırlap, (meleklerniñ yanına) keldiler. (Çünki, yigitler suretinde kelgen melekler olarnıñ gomoseksuallikten doğğan fena isteklerini uyandırğan edi)."
        cid: 0
  - verse: 71
    segments:
      - text: "(Luut:) İşte, qızlarım! (Tüşüngenleriñizni yapacaq iseñiz (olarnen evleniñ), dedi."
        cid: 0
  - verse: 72
    segments:
      - text: "(Resulım!) Ayatnıñ aqqı içün olar sarğoşlıqları içinde bocalay ediler."
        cid: 0
  - verse: 73
    segments:
      - text: "Kuneş doğğanda olarnı o qorqunç ses yaqaladı."
        cid: 0
  - verse: 74
    segments:
      - text: "Boylece, ulkeleriniñ ustüni astına çevirdik. Ustlerine de balçıqtan pişirilgen taşlar yağdırdıq. (Luut qavmı gomoseksuallik kibi fena bir gunahnı işlegenleri içün, Allaһ Taalâ olarğa evelâ qorqunç bir ses duyurğan, soñra memleketleriniñ astını ustüne çevirgen, daa soñunda uzerlerine taş yağdırğan ki, bir milletniñ yoq olup, tarih sanasından silinmensi içün bundan daa şiddetli felâket olamaz)."
        cid: 0
  - verse: 75
    segments:
      - text: "İşte, bunda ibret alğanlar içün, işaretler bardır."
        cid: 0
  - verse: 76
    segments:
      - text: "Olar alâ kozler ogünde turğan bir yol uzerindedirler."
        cid: 0
  - verse: 77
    segments:
      - text: "Aqiqaten, bunda iman etkenler içün bir ibret bardır."
        cid: 0
  - verse: 78
    segments:
      - text: "Eyke halqı da kerçekten zalım edi. (Ayette añılğan Eyke sıq ormanlq demektır. Şuayb peyğamber ve qavmı oturğan ulke ormanlq olğanı içün olarğa Eyke halqı denilgen)."
        cid: 0
  - verse: 79
    segments:
      - text: "Biz olardan da intiqam aldıq. Ekisi de (Eyke ve Medyen) açıq bir yol uzerindedir."
        cid: 0
  - verse: 80
    segments:
      - text: "Ant olsun, Hicr halqı da peyğamberlerni yalanlağan ediler. (Hicr Salih peyğamberniñ qavmı yaşağan bolgeniñ adıdır. Bu yerde yaşağan halq Semuud qavmıi diye añılğan)."
        cid: 0
  - verse: 81
    segments:
      - text: "Biz olarğa mucizelerimizni bergen edik; faqat olardan yuz çevirgen ediler."
        cid: 0
  - verse: 82
    segments:
      - text: "Olar dağlarda (qayalardan) eminlik içinde qalacaq evler oya ediler."
        cid: 0
  - verse: 83
    segments:
      - text: "Olarnı da sabağa çıqqanlarında o qroqunç ses yaqaladı."
        cid: 0
  - verse: 84
    segments:
      - text: "Qazanayatqan şeyleri olardan iç bir zararnı uzaqlaştırmadı."
        cid: 0
  - verse: 85
    segments:
      - text: "Biz koklerni, yerni ve ekisiniñ arasındakilerni, ancaq haq ile yarattıq. O saat (qıyamet) mıtlaqa kelecek. Şimdilik olarğa guzel muamele et."
        cid: 0
  - verse: 86
    segments:
      - text: "Şubesiz, Rabbiñ haqqı ile yaratıcı, pek yahşı bilicidir."
        cid: 0
  - verse: 87
    segments:
      - text: "Ant olsun ki, biz saña tekrarlanğan yedi ayetni ve yuce Qur’annı berdik. (Resulullahtan rivayet etilgen bir hadiske kore, bu yedi ayet namazlarnıñ er rekâtında tekrar etilgen Faatiһa suresidir)."
        cid: 0
  - verse: 88
    segments:
      - text: "Saqın olardan bazı sınıflarğa bergen dünya malımızğa koz tikme, olardan tolayı ğam çekme ve mu’minlerge alçaqgonülli ol."
        cid: 0
  - verse: 89
    segments:
      - text: "De ki: Şubesiz, men ap-açıq bir tenbiyeciyim."
        cid: 0
  - verse: 90
    segments:
      - text: "Aqiqaten, biz (Qur’annı) qısımlarğa ayırğanlarğa azapnı endirgendirmiz."
        cid: 0
  - verse: 91
    segments:
      - text: "Olar Qur’annı bolüp ayırğanlardır. (Qur’annı bolüp ayırğanlar, onıñ bir qısmını qabul etip, bir qısmını red eticilerdir. Ya da Qur’anğa şiir, fal ve masal degenlerdir)."
        cid: 0
  - verse: 94
    segments:
      - text: "Saña emir olunğannı açıqça söyle ve ortaq qoşqanlardan yuz çevir! (Bu ayetlerde de korülgeni kibi, Qur’an-ı Kerimniñ bir qısmına inanıp, bir qısmına inanmağanlardan Allaһ «muşrikler» diye, söz ete. Baqara suresiniñ 85nci ayetinde Qur’annıñ bir qısmına inanıp, bir qısmına inanmağanlarnıñ cezası dünyada rezillik, ahirette de eñ şiddetli azap bildirile. Nisaa suresiniñ 150 ve 151-nci ayetlerinde ise, Allaһnen peyğamberlerni bir-birinden ayırğan ve «Bir qısmına inanırmız, bir qısmına da inanmamız», degenlerniñ aqiqiy manada kâfir olğanlarına diqqat çekile )."
        cid: 0
  - verse: 95
    segments:
      - text: "(Sennen) alay etkenlerge qarşı biz saña yeterlimiz."
        cid: 0
  - verse: 96
    segments:
      - text: "Olar Allaһnen beraber başqa bir tañrığa tabınğanlardır. (Kimniñ doğru olğanını) yaqında bilecekler!"
        cid: 0
  - verse: 97
    segments:
      - text: "Olarnıñ söylegen şeyleri sebebinden, seniñ canıñ sıqılğanını, ant olsun, bilmektemiz."
        cid: 0
  - verse: 98
    segments:
      - text: "Sen şimdi Rabbiñni hamd ile tesbih et ve secde etkenlerden ol!"
        cid: 0
  - verse: 99
    segments:
      - text: "Ve saña yaqıiyn (olüm) kelgenge qadar, Rabbiñye ibadet et!"
        cid: 0