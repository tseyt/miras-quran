      - text: >-
          (İster toprağını yerge batırmaq ve ister halqını yoq etmek suretinen, ya da başqa
          afatlarnen elâk etilgen memleketlerniñ iç biri kör-korane, tesadüfiy olaraq elâk
          etilmediler. Allah tarafından tayin ve taqdir etilip, levh-i mahfuzda yazılğan
          deñişmez, unutılmaz ve ğaflet etilmez bir yazığa köre elâk olğandır. Demek ki,
          devlet ve milletlerniñ de, şahıslar kibi, taqdir etilgen belli ömürleri bar.
          Şahıslar doğğanı, yetişkeni, qartayğanı, ölgeni kibi, devletler de qurulır, inkişaf
          eter ve niayet Allahnıñ taqdir etken künü kelgeninen, yıqılıp, tarihke qarışırlar.
          Şahıslar kibi, bularnıñ da bazıları uzun ömürli, bazıları ise, qısqa ömürli olur).
        cid: 0
