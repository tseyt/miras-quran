surah_id: 34
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "Hamd, koklerde ve yerde bulunğanlarnıñ episiniñ saibi olğan Allaһqa mahsustır. Ahirette de hamd Oña mahsustır. O, ikmet saibidir, (er şeyden) haberi olucıdır."
        cid: 0
  - verse: 2
    segments:
      - text: "Yerniñ içine kirgenni ve ondan çıqqannı, kokten engenni, o yerge çıqqannı bilir. O, merhametlidir, bağışlayıcıdır."
        cid: 0
  - verse: 3
    segments:
      - text: "İnkârcılar: Qıyamet bizge kelmeycek, dediler. De ki: Yoq! Ğaybnı bilgen Rabbim aqqı içün o, mıtlaqa sizge kelecek. Koklerde ve yerde zerre qadar bir şey bile, Ondan gizli qalmaz. Bundan daa kuçük ve daa buyugi de, şubesiz ap-açıq kitaptadır (yazılıdır)."
        cid: 0
  - verse: 4
    segments:
      - text: "Allaһ, inanıp yahşı işler yapqanlarnı mukâfatlandırmaq içün (er şeyni açıq bir kitapta beyan etken). Olar içün buyuk bir mağfiret ve guzel bir rızıq bar."
        cid: 0
  - verse: 5
    segments:
      - text: "Ayetlerimizni ukümsiz bıraqmaq içün yarışır kibi oğraşqanlar içün de, eñ yamanından elem berici bir azap bar."
        cid: 0
  - verse: 6
    segments:
      - text: "Ozlerine bilgi berilgenler, Rabbiñden saña endirilgenniñ (Kur’annıñ) kerçek olğanını bilir; Onıñ, mıtlaqa ğalip ve maqtavğa lâyıq olğan (Allaһnıñ) yoluna iriştirgenini korerler. (Bilgi berilgenlerniñ sahabe-i kiram ve olarnıñ izinden yurgen mu’minler ya da Abdullah b. Selâm ve arqadaşları kibi, ehl-i kitapnıñ alimleri olğanı izaat etilgen)."
        cid: 0
  - verse: 7
    segments:
      - text: "Kâfir olğanlar (oz aralarında) boyle dediler: Çürüp, parça-parça olğan vaqtıñızda, yañıdan tirilecegiñizni söyleyerek, haber bergen adamnı kostereyikmi?"
        cid: 0
  - verse: 8
    segments:
      - text: "«Aceba o, yalan yerde Allaһqa iftira etkenmi? Yoqsa, onda delilik barmı?» (dediler). Yoq! Ahiretke inanmağanlar azaptadırlar ve teren bir sapıqlıq içindedirler."
        cid: 0
  - verse: 9
    segments:
      - text: "Olar, kokte ve yerde oglerine ve artlarına baqmaylarmı? İstesek, olarnı yerge batırırmız, ya da ustlerine kokten parçalar tüşürirmiz. Şubesiz, bunda (Rabbiñye) yonelgen er qul içün bir ibret bardır."
        cid: 0
  - verse: 10
    segments:
      - text: "Ant olsun, Davudğa tarafımızdan bir ustünlik berdik. «Ey dağlar ve quşlar! Onıñnen beraber tesbih etiñ», dedik. Oña demirni yımşattıq. (Az. Davudğa berilgen ustünlik, peyğamberlik, kitap, saltanat, guzel ses ve bularğa beñzegen bir çoq qabiliyetler berilgen)."
        cid: 0
  - verse: 11
    segments:
      - text: "Keniş zırhlar yasa, toqumasını olçüli yap. (Ey, Davud hanedanı!) Yahşı işler yapıñ. Şubesiz, men yapqanlarıñıznı kormektem, diye (vahiy ettik)."
        cid: 0
  - verse: 12
    segments:
      - text: "Saba ketüvi bir aylıq mesafe, aqşam qaytuvı kene bir aylıq mesafe olğan ruzgârnı da Suleymanğa (onıñ emrine) berdik ve onıñ içün irigen baqırnı çoqrağından sel kibi aqızdıq. Rabbiñniñ izninen, cinlerden bir qısmı onıñ ogünde çalışa edi. Olardan kim emrimizden sapsa, oña alevli azapnı tattıra edik."
        cid: 0
  - verse: 13
    segments:
      - text: "Olar Suleymanğa qalelerden, eykellerden havuzlar qadar (keniş) legenlerden, qaviy qazanlardan ne istese yapa ediler. Ey, Davud ailesi! Şukür etiñ. Qullarımdan şukür etkeni azdır!"
        cid: 0
  - verse: 14
    segments:
      - text: "Suleymannıñ olümine uküm etken vaqtımızda, onıñ olgenini, ancaq tayağını aşağan bir ağaç qurtı kosterdi. (Soñunda yerge) yıqılğanınen, añlaşıldı ki, cinler ğaybnı bilse ediler, o alçaltıcı azap içinde qalmaz ediler.) (Suleyman (a.s.) vefat etkeninen, cesediniñ bayağı vaqıt tayağına tayanaraq, ayaq ustünde qalğanı añlaşılmaqta. Cinler içün «alçaltıcı azap» tabiri - ağır işlerde çalşiqanları içün qullanılğan. Az. Suleymannıñ olümini añlamağanları içün, ayatında olğanı kibi, yorucı işlerge olüminden soñ da, bir muddet devam etkenler. Bu yerde cinlerniñ ğaybnı bilmegenleri añlaşılmaqta)."
        cid: 0
  - verse: 15
    segments:
      - text: "Ant olsun, Sebe’ qavmı içün oturğan yerlerinde buyuk bir ibret bar. Biri sağda, digeri solda, eki bağçaları bar edi. (Olarğa: (Rabbiñizniñ rızqından aşañ ve Oña şukür etiñ. İşte, guzel bir memleket ve çoq bağışlayıcı bir Rabb! (Sebe’- Yemende buyuk bir şeerniñ ve o yerde yaşağan qavmnıñ adıdır. Bu şeer Neml suresinde (27/23-44) aqqında söz yursetilgen melike Belqıs ukümdar olğan ulkeniñ paytahtı edi. Qurucısı Sebe’ olğanı içün, ulke ve halqı onıñ adınen añılğan)."
        cid: 0
  - verse: 16
    segments:
      - text: "Amma, olar yuz çevirdiler. Bu sebepten, ustlerine Arim selini yolladıq. Olarnıñ eki bağçasını, ekşi yemişli, accı meyvalı ve içinde biraz da sedir teregi olğan eki (harap) bağçağa çevirdik. (Arim seli - Sebe’ qavmını cezalandırmaq uzre meydanğa ketirilgen, şiddetli yağmurnıñ sebep olğanı ve buyuk koçüvlerge yol açqan bir sel felâketidir)."
        cid: 0
  - verse: 17
    segments:
      - text: "Nankorlik yapqanları içün, olarnı boyle cezalandırdıq. Biz nankorden başqasını cezalandırırmızmı?"
        cid: 0
  - verse: 18
    segments:
      - text: "Olarnıñ yurtunen içlerini bereketlendirgen memleketlerimiz arasında, sıra-sıra korüngen nice qasabalar yarattıq ve bular arasında yurmekni qonaqlarğa ayırdıq. O yerlerde geceleri, kundüzleri qorqmayıp keziñ, dolaşıñ, dedik. (Yemen - Suriye yolu uzerinde bir-birine yaqın, qolaylıqnen tapılğan ve qonaqlamaq itiyaclarına cevap berici qasabalarğa işaret etilgen)."
        cid: 0
  - verse: 19
    segments:
      - text: "Bunıñ ustüne: Ey, Rabbimiz! aralarında yolculıq yapqan şeerlerimizniñ arasını uzaqlaştır, dediler ve ozlerine yazıq ettiler. Biz de olarnı, ibret qıssaları alına ketirdik ve olarnı bus-butün parçaladıq. Şubesiz, bunda çoq sabır etken ve çoq şukür etken er kes içün ibret bar."
        cid: 0
  - verse: 20
    segments:
      - text: "Ant olsun, İblis, olar aqqındaki tahminini doğurğa çıqardı. İnanğan bir toplulıqtan ğayrı, episi oña uydılar."
        cid: 0
  - verse: 21
    segments:
      - text: "Albuki, şeytannıñ olar uzerinde iç bir nufuzı (tesiri) yoq edi. Ancaq, ahiretke inanğanı, şube içinde qalğandan ayırdı etip bileyik, diye (oña bu fırsatnı berdik). Rabbiñ, aqiqaten er şeyni qorçalayıcıdır."
        cid: 0
  - verse: 22
    segments:
      - text: "(Muşriklerge) de ki: Allaһtan başqa tañrı sayğan şeyleriñizni çağırıñ! Olar ne koklerde, ne de yerde zerre ağırlığı qadar bir şeyge degiller. Olarnıñ bu yerlerden iç bir ortaqlığı yoqtır, Allaһnıñ olardan bir yardımcısı da yoq edi."
        cid: 0
  - verse: 23
    segments:
      - text: "Allaһnıñ uzurında, onıñ izin bergen kimselerinden başqasınıñ şefaatı fayda bermez. Niayet, olarnıñ yureklerinden qorqu ketkizilgeninen: Rabbiñiz ne buyurdı? derler. Olar da: Haq olğannı buyurdı, derler. O, yucedir, buyuktir. (Ayette şefaat içün izin çıqqanınen, şefaat etkenlernen ozlerine şefaat etilecsklerniñ qarşılıqlı qonuşuvlarına işaret etilmekte)."
        cid: 0
  - verse: 24
    segments:
      - text: "(Resulım!) De ki: Koklerden ve yerden sizge rızıq bergen kim? De ki : Allaһ! O alda, biz ya da siz, ekimizden biri, ya doğru yol uzerinde, ya da açıq bir sapıqlıq içindedir."
        cid: 0
  - verse: 25
    segments:
      - text: "De ki: Bizim işlegen qaabatımızdan siz mesuliyetli degilsiñiz; biz de siziñ yapqanıñızdan sorulacaq degilmiz."
        cid: 0
  - verse: 26
    segments:
      - text: "De ki: Rabbimiz epimizni bir yerge toplaycaq, soñ aramızda haq ile uküm etecek. O, eñ adil uküm berici (er şeyni) haqqı ile bilicidir."
        cid: 0
  - verse: 27
    segments:
      - text: "De ki: Oña (Allaһqa) qoşqan ortaqlarıñıznı maña kosteriñ. Yoq! Faqat yekâne ğalip ve er şeyni ikmetnen idare etici ancaq Allaһtır."
        cid: 0
  - verse: 28
    segments:
      - text: "Biz seni butün insanlarğa ancaq mujdeleyici ve tenbiyeci olaraq yolladıq; faqat insanlarnıñ çoqu bunı bilmezler."
        cid: 0
  - verse: 29
    segments:
      - text: "Eger sözüñizde doğru iseñiz, bu vade etken (qıyametiñiz) ne zaman qopacaq? derler."
        cid: 0
  - verse: 30
    segments:
      - text: "De ki: Sizge oyle bir kun vade etilgendir ki, ondan ne bir saat artta qala bilirsiñiz, ne de ileri keçe bilirsiñiz."
        cid: 0
  - verse: 31
    segments:
      - text: "Kâfir olğanlar dediler ki: Biz iç bir vaqıt bu Qu’ranğa ve bundan evel kelgen kipaplarğa inanmaycaqmız. Sen o zalımlarnı, Rabbleriniñ uzurında tutuqlanğan, bir-birilerine söz atqan vaqıtlarında bir korseñ? Zayıf sayılğanlar buyuklik taslağanlarğa: Siz olmasa ediñiz, elbette biz inanğan insanlar olur edik, derler. (Mekke kâfirleri ehl-i kitapqa Resulullahnı sorağanlarında ehl-i kitap: Onıñ vasfını kitaplarda taparsıñız, degenler, bunıñ uzerine, kâfirler opkelenerek, inkârlarını boyle ifade etkenler)."
        cid: 0
  - verse: 32
    segments:
      - text: "Buyuklik taslağanlar, zayıf sayılğanlarğa (qıyamet kunünde): Sizge hidayet kelgenden soñ, sizni ondan biz çevirdikmi? Aksine, siz qabaat işley ediñiz, derler."
        cid: 0
  - verse: 33
    segments:
      - text: "Zayıf sayılğanlar da buyuklik taslağanlar da: Yoq! Gece-kundüz (işiñiz) tuzaq qurmaq edi. Çünki, siz daima Allaһnı inkâr etüvimizni, Oña ortaqlar qoşuvımıznı bizge emir ete ediñiz, derler. Artıq azapnı korgenlerinde, içiçten yanarlar; biz de o inkâr etkenlerniñ boyunlarına demir alqalar keçirirmiz. Olar ancaq yapayatqan gunahları sebebinden, cezalandırılırlar."
        cid: 0
  - verse: 34
    segments:
      - text: "Biz angi ulkege bir tenbiyeci yollağan olsaq, mıtlaqa o yerniñ varlıqlı ve qopayçoraları: Biz sizge yollanılğan şeyni inkâr etmektemiz, degendirler."
        cid: 0
  - verse: 35
    segments:
      - text: "Ve dediler ki: Biz mal ve evlât tarafından daa zenginmiz, biz azapqa oğratılacaq da degilmiz."
        cid: 0
  - verse: 36
    segments:
      - text: "De ki: Rabbim istegenine bol rızıq berir ve (istegeninden) qısar; faqat insanlarnıñ çoqu bilmezler."
        cid: 0
  - verse: 37
    segments:
      - text: "Sizni uzurımızğa yaqlaştıracaq olğanı, ne evlâtlarıñız, ne de mallarıñızdır. İman etip, yahşı amel yapqanlar istisna; olarğa yapqanlarınıñ qat-qat ziyadesinen mukâfat bar. Olar (cennet) odalarında işanç içindedirler."
        cid: 0
  - verse: 38
    segments:
      - text: "Ayetlerimizni boşuna çıqarmağa çalışqanlarğa kelgende, olar da azapnen yuzyuzge bıraqılacaqlar."
        cid: 0
  - verse: 39
    segments:
      - text: "De ki: Rabbim qullarından istegenine bol rızıq berir ve (istegeninden de) qısar. Siz hayırğa ne arclasañız, Allaһ onıñ yerine başqasını berir. O, rızıq bericileriniñ eñ hayırlısıdır."
        cid: 0
  - verse: 40
    segments:
      - text: "O kunü Allaһ olarnıñ episini toplaycaq; soñra meleklerge: sizge tabınğanlar bular edimi? deycek."
        cid: 0
  - verse: 41
    segments:
      - text: "(Melekler de:) Sen yucesiñ, bizim dostumız olar degil, Sensiñ. Belki, olar cinlerge tabına ediler. Çoqu olarğa inanğan edi, deycekler."
        cid: 0
  - verse: 42
    segments:
      - text: "Bugun bir-biriñizge ne fayda, ne de zarar bermege kuçüñiz yeter. Biz zalımlarğa, yalanlamaqta olğan ateşiñizniñ azabını tatıñ! deycekmiz."
        cid: 0
  - verse: 43
    segments:
      - text: "Olarğa ap-açıq ayetlerimiz oqulğan vaqıtta, degen ediler ki: Bu, sizni babalarıñıznıñ tabınğan (putlarından) çevirmek istegen bir adamdan başqası degil. Ve kene bu, (Qur’an) da uydurılğan bir yalandan başqa bir şey degil, dediler. Haq ozlerine kelgende, onı inkâr etkenler de: Bu, ap-açıq bir tılsımdan başqa bir şey degil, dediler."
        cid: 0
  - verse: 44
    segments:
      - text: "Albuki, biz olarğa oquycaq kitaplar bermegenimiz kibi, senden evel olarğa bir tenbiyeci (peyğamber) de, yollamağan edik."
        cid: 0
  - verse: 45
    segments:
      - text: "Olardan evelkiler de (peyğamberlerini) inkâr etken ediler. Bular evelkilerge bergenlerimizniñ ondan birine irişmegen ediler. (Boyle eken), peyğamberimni yalanladılar; amma menim bergen qarşılığım nasıl olğan edi!"
        cid: 0
  - verse: 46
    segments:
      - text: "(Resulım! Olarğa) de ki: Sizge tek bir ogüt berecem: Allaһ içün ekişer-ekişer ve birer-birer ayaqqa qalqıñ, soñ tüşüniñ! Arqadaşıñızda (peyğamberde) iç delilik yoqtır! O, ancaq şiddetli bir azap kelip çatmadan evel, sizni tenbiyelegen bir peyğamberdir. (Qur’an-ı Kerim içtimaiy ve psihologik tazıyıqlar altında peyğamberni inkâr etkenlerni çifter, yanğız başlarına tüşünerek ve ozara tartışaraq, peyğamber aqqında uküm bermege davet etmekte. Zira, çoqlarınıñ inkârı etrafnıñ maneviy basqısından ileri kele edi)."
        cid: 0
  - verse: 47
    segments:
      - text: "De ki: Men sizden bir aq istegen isem, o siziñ olsun. Aqqım yalıñız Allaһqa aittir. O, er şeyge şaattır."
        cid: 0
  - verse: 48
    segments:
      - text: "De ki: Şubesiz, Rabbim aqiqatnı ortağa qoyar, çünki, o ğaybnı çoq yahşı bilicidir."
        cid: 0
  - verse: 49
    segments:
      - text: "De ki: Haq keldi; artıq batıl ne bir şeyni ortağa çıqara bilir, ne de keri ketire bilir."
        cid: 0
  - verse: 50
    segments:
      - text: "De ki: Eger (haqtan) sapar isem, oz aleyhime sapqan olurım. Eger doğru yolnı tapsam, bu da, Rabbimniñ maña vahiy etken (Qur’anı) sayesindedir. Şubesiz, O, eşiticidir, yaqındır."
        cid: 0
  - verse: 51
    segments:
      - text: "(Resulım!) Telâşqa tüşken vaqıtlarında bir korseñ! Artıq qurtulış yoqtır, yaqın bir yerden yaqalanğanlar. (Kâfirlerniñ telâşqa tüşken vaqıtları, olüm anı, qabirden qalquv vaqtı, ya da Bedir cenki vaqtı olaraq añlaşılğan. Yaqın bir yerden yaqalanuvları da, topraqtan mezarğa, mahşerden ceennemge, Bedir sahrasından cenk meydanı olğan quyuğa alıp barıluvlarınen tefsir etilgen). 52-53. (İş-işten keçken soñ:) «Oña inandıq», degen ediler, amma uzaq yerden (dünya ayatı kelip keçken soñ) imanğa qavuşmaq olar içün nasıl mumkün olur? Albuki, daa evel onı (haqnı) inkâr etken ediler. Uzaq bir yerden ğayb aqqında atıp-tuta ediler."
        cid: 0
  - verse: 52
    segments:
      - text: "Artıq bundan evel olarğa beñzegenlerge yapılğanı kibi, ozlerine arzu etken şeyleri arasına perde çekilgendir. Şubesiz, olar ozlerini şubege tüşürgen bir qorqu içinde ediler. (İnkâr etkenlerniñ o kunü ahirette arzu etken şeyleri - o kunki imanlarınıñ faydasını kormek, boylece, ateşten qurtulmaq, cennetke qavuşmaq ya da tekrar dünyağa yollanılıp, yahşı davranışlarda bulunmaq kibi boş tileklerdir)."
        cid: 0