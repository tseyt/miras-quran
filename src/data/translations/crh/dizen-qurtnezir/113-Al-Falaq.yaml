surah_id: 113
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "De ki: Yarattığı şeylerniñ şerrinden, qaranlığı çökken zamanı geceniñ şerrinden, dügümlerge ufürip, tılsım yapqan ufleyicilerniñ şerrinden ve qızğanğan vaqtında qızğanç insannıñ şerrinden sabanıñ Rabbine sığınırım!"
