surah_id: 26
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >-
          Taa. Siin. Miim.
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Bular ap-açıq Kitapnıñ ayetleridir.
        cid: 0
  - verse: 3
    segments:
      - text: >-
          (Resulım!) Olar iman etmeyler, diye, aman-aman ozüñni elâk etecektirsiñ!
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Biz istesek, olarnıñ uzerine kokten bir mucize endirirmiz de, oña boyunları
          egilip qalır.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Olarğa, o çoq merhametli Allaһtan iç bir yañı ogüt kelmez ki, ondan yuz
          çevirmesinler.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Bunıñ ustüne (oña) «yalandır», derler; faqat alay etip turğan şeyleriniñ
          haberleri yaqında olarğa kelecek.
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Yer yuzüne bir baqmazlarmı! O yerde er guzel çiftten nice osümlikler
          yetiştirdik.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Şubesiz, bularda (Allaһnıñ qudretine) bir nişane bardır; amma çoqu iman
          etmezler.
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Şube yoq ki, Rabbiñ mutlaq ğalip ve bol merhamet saibidir.
        cid: 0
  - verse: 10
    segments:
      - text: >-
          O zaman Rabbiñ Musağa: O zalımlar toplulığına, Fıravunnıñ qavmına bar. Alâ
          (başlarına kelecekten) saqınmaycaqlarmı olar? diye seslengen edi.
        cid: 0
  - verse: 11
    segments:
      - text: >-
          [10 ayetine baq.]
        cid: 0
  - verse: 12
    segments:
      - text: >-
          Musa boyle dedi: Rabbim! Doğrusı, meni yalancılıqta qabaatlavlarından qorqam.
        cid: 0
  - verse: 13
    segments:
      - text: >-
          (Bu vaziyette) içim sıqılır, tilim aylanmaz; onıñ içün Harunğa da elçilik ber.
        cid: 0
  - verse: 14
    segments:
      - text: >-
          Olarnıñ maña iftira etken bir qabaatları da bar. Bundan otrü, meni
          oldirüvlerinden qorqam.
        cid: 0
  - verse: 15
    segments:
      - text: >-
          Allaһ buyurdı: Yoq, (seni asla oldüralmazlar)! Ekiñiz mucizelerimiznen barıñ.
          Şubesiz ki, biz siznen berabermiz, (er şeyni) eşitmektemiz.
        cid: 0
  - verse: 16
    segments:
      - text: >-
          Aydı, Fıravunğa barıp aytıñ ki: Aqiqaten, biz alemlerniñ Rabbiniñ elçisimiz;
        cid: 0
  - verse: 17
    segments:
      - text: >-
          İsrail oğullarını biznen beraber yolla.
        cid: 0
  - verse: 18
    segments:
      - text: >-
          (Ozüne Allaһnıñ emri tebliğ etilgeninen, Fıravun) dedi ki: Biz seni bala
          ekeniñde imayemizge alıp buyultmedikmi? Ayatıñnıñ bir çoq yıllarını aramızda
          keçirmediñmi?
        cid: 0
  - verse: 19
    segments:
      - text: >-
          Soñunda o yapqan (fena) işiñni de yaptıñ. Sen nankorniñ birisiñ! (Bu yerde
          Az.Musanıñ bir mısırlınıñ olümine sebep olğanına işaret etilmekte. Bilgi içün
          baq. Qasas, 28/15).
        cid: 0
  - verse: 20
    segments:
      - text: >-
          Musa: Men, dedi, o işni, o anda soñu ne olacağını bilmeyip yaptım. (Tefsirlerde
          Az.Musanıñ oldirüv qastı olmadan, o adamnı urğanı ve bu işniñ, qastnı keçken
          areketler neticesinde, adam olgeni izaatı daa ziyade kelmekte).
        cid: 0
  - verse: 21
    segments:
      - text: >-
          Sizden qorqqanımnen de, aman arañızdan qaçtım. Soñ Rabbim maña ikmet bahş etti
          ve meni peyğamberlerden qıldı.
        cid: 0
  - verse: 22
    segments:
      - text: >-
          O nimet diye, kozüme türtkeni ise, (aslında) İsrail oğullarını ozüne qul,
          hızmetkâr etüviñdir. (Fıravunnıñ nimet diye, Az.Musanıñ kozüne türtkeni ve onı
          nankor deyuvine yol açqan şey, onı sabiyliginde saipsiz tapqanınen, alıp
          beslegeni ve baquvı, hususen onı başqa oğlan balalar kibi oldürmegeni edi.
          Az.Musa bu sözlerni inkâriy bir usulnen, onıñ yapqanı esasen bir nimet
          olmağanını ve onıñ İsrail oğullarını qul, hızmetkâr etüvinden ibaret olğanını
          ifade etmekte. Zira, Fıravun Az.Musanı sarayına aluvına da, onıñ İsrail
          oğullarına nisbeten davranışı sebep olğan edi).
        cid: 0
  - verse: 23
    segments:
      - text: >-
          Fıravun boyle dedi: Alemlerniñ Rabbi degeniñ de nedir?
        cid: 0
  - verse: 24
    segments:
      - text: >-
          Musa cevap berdi: Eger işniñ aslını tüşünip añlağan adamlar olsañız, (itiraf
          etersiñiz ki) o, koklerniñ, yerniñ ve ekisi arasında olğan er şeyniñ Rabbidir.
        cid: 0
  - verse: 25
    segments:
      - text: >-
          (Fıravun) etrafında bulunğanlarğa eşiteseñizmi? dedi.
        cid: 0
  - verse: 26
    segments:
      - text: >-
          Musa dedi ki: O, siziñ de Rabbiñiz, daa evelki atalarıñıznıñ da Rabbidir.
        cid: 0
  - verse: 27
    segments:
      - text: >-
          Fıravun: Sizge yollanılğan bu elçiñiz mıtlaqa delidir, dedi.
        cid: 0
  - verse: 28
    segments:
      - text: >-
          Musa devamle şunı söyledi: Eger aqılıñıznı işletseñiz (añlarsız ki), O,
          doğunıñ, batınıñ ve ekisiniñ arasında olğanlarnıñ Rabbidir.
        cid: 0
  - verse: 29
    segments:
      - text: >-
          Fıravun: Menden başqasını tañrı edinseñ, ant olsun ki, seni zindanlılardan
          eterim! dedi.
        cid: 0
  - verse: 30
    segments:
      - text: >-
          Musa: Saña ap-açıq bir şey ketirmiş olsamdamı? dedi.
        cid: 0
  - verse: 31
    segments:
      - text: >-
          Fıravun: Doğru söylegenlerden iseñ, aydı, ketir onı! diye cevap berdi.
        cid: 0
  - verse: 32
    segments:
      - text: >-
          Bunıñ uzerine Musa tayağını attı; bir de ne korsinler, tayaq ap-açıq buyuk bir
          yılan (olğan-qalğan)!
        cid: 0
  - verse: 33
    segments:
      - text: >-
          Elini de qoynundan çıqardı; o da seyircilerge bem-beyaz korüngen (nur saçqan
          bir şey olup qalğan)!
        cid: 0
  - verse: 34
    segments:
      - text: >-
          Fıravun etrafındaki ileri kelgenlerge: Bu, dedi, doğrusı, çoq bilgili bir
          tılsımcıdır!
        cid: 0
  - verse: 35
    segments:
      - text: >-
          Sizni tılsımınen yurtuñızdan çıqarmaq istey. Şimdi ne buyurırsıñız? (Az.Musanıñ
          kostergen mucizeleri Fıravunnıñ kibr duyğularını alt-ust etken, Fıravun tañrılıq
          davasını bir tarafqa bıraqıp, etrafındaki ileri kelgenlerden fikir almağa mecbur
          olğan).
        cid: 0
  - verse: 36
    segments:
      - text: >-
          Dediler ki: Onı ve qardaşını toqtatıp tur ve şeerlerge toplayıcı adamlar yolla;
        cid: 0
  - verse: 37
    segments:
      - text: >-
          Ne qadar bilgisi teren tılsımcı bar ise, saña ketirsinler.
        cid: 0
  - verse: 38
    segments:
      - text: >-
          Boylece, sihirbazlar belli bir kunniñ tayin etilgen vaqtında bir yerge
          ketirildiler.
        cid: 0
  - verse: 39
    segments:
      - text: >-
          Halqqa: Siz de toplanasızmı (aydı, aman toplanıñ), denildi.
        cid: 0
  - verse: 40
    segments:
      - text: >-
          (Fıravunnıñ adamları:) Eger ustün kelseler, er alda, tılsımcilarğa uyarmız,
          dediler.
        cid: 0
  - verse: 41
    segments:
      - text: >-
          Sihirbazlar kelgenlerinde Fıravunğa: Eger biz ustün kelsek, muaqqaq bizge bir
          aq bar degilmi? dediler.
        cid: 0
  - verse: 42
    segments:
      - text: >-
          Fıravun cevap berdi: Ebet, o taqdirde iç şube etmeñ, kozdeki kimselerden de
          olacaqsıñız.
        cid: 0
  - verse: 43
    segments:
      - text: >-
          Musa olarğa: Ne atacaq olsañız, atıñ! dedi.
        cid: 0
  - verse: 44
    segments:
      - text: >-
          Bunıñ uzerine arqanlarını ve tayaqlarını attılar ve: Fıravunnıñ qudreti aqqı
          içün, elbette bizler ğalip kelecekmiz, dediler.
        cid: 0
  - verse: 45
    segments:
      - text: >-
          Soñra Musa tayağını attı: Bir de ne korsinler, olarnıñ uydurğanlarını yuta
          bere!
        cid: 0
  - verse: 46
    segments:
      - text: >-
          (Bunı korgeninen) sihirbazlar der’al secde ettiler. 47-48. «Alemlerniñ Rabbine,
          Musa ve Harunnıñ Rabbine iman ettik», dediler.
        cid: 0
  - verse: 47
    segments:
      - text: >-
          Fıravun, (qızğınlıqnen) dedi ki, men sizge izin bermeden, oña iman ettiñiz e!
          Demek ki, o sizge sihirni ogretken buyugiñiz eken! Amma, şimdi (sizge
          yapacağımnı korecek ve) bileceksiñiz: Ant olsun, elleriñizni ve ayaqlarıñıznı
          çaprazlama kestirecem, epiñizni astıracam!
        cid: 0
  - verse: 48
    segments:
      - text: >-
          «Zararı yoq, dediler, (nasıl olsa) biz, şubesiz, Rabbimizge dönecekmiz».
        cid: 0
  - verse: 49
    segments:
      - text: >-
          «Biz ilk iman etkenler olğanımız içün, Rabbimiz hatalarımıznı bağışlaycağına
          umüt etermiz».
        cid: 0
  - verse: 50
    segments:
      - text: >-
          Musağa: Qullarımnı geceleyin yolğa çıqar; çünki, taqip etileceksiñiz, diye
          vahiy ettik.
        cid: 0
  - verse: 51
    segments:
      - text: >-
          Fıravun da şeerlerge (asker) toplayıcılar yolladı:
        cid: 0
  - verse: 52
    segments:
      - text: >-
          «Esasen bular, sayıları az, tertipsiz-dağınıq bir cemaattır».
        cid: 0
  - verse: 53
    segments:
      - text: >-
          «(Boyle eken) kesen-kes bizni opkelendirgendirler».
        cid: 0
  - verse: 54
    segments:
      - text: >-
          «Biz ise, elbette uyanıq (ve birlik) bir cemaatmız», (dey ve dedirte edi).
        cid: 0
  - verse: 55
    segments:
      - text: >-
          Amma (soñunda) biz olarnı (Fıravun ve qavmını), bağçalardan, çoqraqlardan,
          hazinelerden ve degerli bir yerden çıqardıq.
        cid: 0
  - verse: 56
    segments:
      - text: >-
          [55 ayetine baq.]
        cid: 0
  - verse: 57
    segments:
      - text: >-
          Boylece, bularğa İsrail oğullarını mirasçı yaptıq.
        cid: 0
  - verse: 58
    segments:
      - text: >-
          Derken (Fıravun ve adamları) kun doğuvından olarnıñ peşine tüştiler.
        cid: 0
  - verse: 59
    segments:
      - text: >-
          Eki toplulıq bir-birini korgeninen, Musanıñ adamları: İşte, yaqalandıq!
          dediler.
        cid: 0
  - verse: 60
    segments:
      - text: >-
          Musa: Asla! dedi, Rabbimiz, şubesiz, mennendir, maña yol kosterecektir.
        cid: 0
  - verse: 61
    segments:
      - text: >-
          Bunıñ uzerine Musağa: Tayağıñnen deñizge ur! diye vahiy ettik. (Urğanınen,
          deñiz) der’al yarıldı (on eki yol açıldı), er bolük buyuk bir dağ kibi oldı.
        cid: 0
  - verse: 62
    segments:
      - text: >-
          O birlerini de, o yerge yaqlaştırdıq. (Musa ve adamlarınıñ artından duşmanlar
          da, bu deñizde açılğan yollarğa kirdiler).
        cid: 0
  - verse: 63
    segments:
      - text: >-
          Musa ve yanında olğanlarnıñ episini qurtardıq.
        cid: 0
  - verse: 64
    segments:
      - text: >-
          Soñra o birlerini suvda boğdıq.
        cid: 0
  - verse: 65
    segments:
      - text: >-
          Şubesiz, bunda bir ibret bardır; amma çoqları iman etken degiller. (İster
          Mısırda qalğan qıptiylerniñ yerlerinde qlğanları, ister qurtulğandan soñ,
          buzavğa tabınuvğa qalqqan ve: «Koz-kozge Allaһnı kormegence, iman etmemiz»,
          degen İsrail oğulları bu ap-açıq dersten ibret almadılar, imanğa kelmediler).
        cid: 0
  - verse: 66
    segments:
      - text: >-
          Şubesiz, Rabbiñ, işte, O, mutlaq ğalip ve bol merhamet saibidir.
        cid: 0
  - verse: 67
    segments:
      - text: >-
          (Resulım!) Olarğa İbrahimniñ haberini de naql et.
        cid: 0
  - verse: 68
    segments:
      - text: >-
          O zaman o, babasına ve qavmına: Nege tabınmaqtasıñız? degen edi.
        cid: 0
  - verse: 69
    segments:
      - text: >-
          «Putlarğa tabınmaqtamız ve olarğa tabınuvda devam etecekmiz», diye cevap
          berdiler. («Putlarğa tabınmaqtamız ve butün kun olarğa hızmet etip turmaqtamız»
          manası da berilmektedir. Zira, olarnıñ kun boyu ibadet etip, gece ibadet
          etmegenlerine dair bir rivayet bar).
        cid: 0
  - verse: 70
    segments:
      - text: >-
          İbrahim: Yahşı, dedi, yalvarğanıñızda olar sizni eşitelermi?
        cid: 0
  - verse: 71
    segments:
      - text: >-
          Yahut sizge fayda ya da zarar bere bilelermi?
        cid: 0
  - verse: 72
    segments:
      - text: >-
          boyle cevap berdiler: Yoq, amma biz babalarımıznı boyle yapqan alda buldıq.
        cid: 0
  - verse: 73
    segments:
      - text: >-
          İbrahim dedi ki: Yahşı, amma, ister siziñ, ister evelki atalarıñıznıñ; nege
          tabınğanıñıznı (biraz olsa da) tüşündiñizmi?
        cid: 0
  - verse: 74
    segments:
      - text: >-
          [73 ayetine baq.]
        cid: 0
  - verse: 75
    segments:
      - text: >-
          Yahşı biliñ ki, olar menim duşmanımdır; Ancaq alemlerniñ Rabbi (menim
          dostumdır).
        cid: 0
  - verse: 76
    segments:
      - text: >-
          Meni yaratqan ve maña doğru yolnı kostergen Odır.
        cid: 0
  - verse: 77
    segments:
      - text: >-
          Meni aşatqan, içirgen Odır.
        cid: 0
  - verse: 78
    segments:
      - text: >-
          Hastalanğan vaqtımda maña şifa bergen Odır.
        cid: 0
  - verse: 79
    segments:
      - text: >-
          Menim cannımnı alacaq, soñra meni tiriltecek Odır.
        cid: 0
  - verse: 80
    segments:
      - text: >-
          Ve esap kunü hatalarımnı bağışlaycağını umüt etkenim Odır.
        cid: 0
  - verse: 81
    segments:
      - text: >-
          Rabbim, maña ikmet ber ve meni eyiler arasına qoş.
        cid: 0
  - verse: 82
    segments:
      - text: >-
          Maña, soñundan kelecekler arasında, eyiliknen añılmaq nasip eyle! (Az.İbrahim,
          bu duasınen, qıyametke qadar yahşı nam ile añılmaqnı istegen. Duası maqbul
          olğan, bundan otrü, er ummet oña ayrı bir sevgi duyğan ve adını maqtav ile
          añğan. Musulmanlar da, beş vaqıt namazda salavt-ı şerife oquğanda, onı da
          añaraq, bu duağa qoşulmaqtalar).
        cid: 0
  - verse: 83
    segments:
      - text: >-
          Meni Naim cennetiniñ varislerinden eyle.
        cid: 0
  - verse: 84
    segments:
      - text: >-
          Babamnı da bağışla (oña tövbe ve iman nasip et). Çünki, o sapıqlardandır.
        cid: 0
  - verse: 85
    segments:
      - text: >-
          (İnsanlarnıñ) tirilecek kunleri meni utandırma.
        cid: 0
  - verse: 86
    segments:
      - text: >-
          O kunü ne mal fayda berir, ne de evlât.
        cid: 0
  - verse: 87
    segments:
      - text: >-
          Ancaq, Allaһqa qalbi selim (temiz bir qalp) ile kelgenler (o kunde fayda
          bulur). (Qalbi selim - şubelerden, şirkten temizlengen, ihlâsnen iman etken qalp
          demektir. Said b. Museyeb (r.a.) degen ki: Qalbi selim, maneviy sağlam qalptir
          ki, bu da, mu’minniñ qalbidir. Kâfir ve munafıqnıñ qalbi ise, maneviy hastadır).
        cid: 0
  - verse: 88
    segments:
      - text: >-
          (O kunü) cennet taqva saiplerine yaqlaştırılır.
        cid: 0
  - verse: 89
    segments:
      - text: >-
          Ceennem de adden aşqanlarğa ap-açıq kosterilir.
        cid: 0
  - verse: 90
    segments:
      - text: >-
          Olarğa: Allaһtan ğayrı tabınğalarıñız qana, nerede? Sizge yardım ete bilelermi
          ya da ozlerine (olsun) yardımları toqunamı? denilir.
        cid: 0
  - verse: 91
    segments:
      - text: >-
          [90 ayetine baq.]
        cid: 0
  - verse: 92
    segments:
      - text: >-
          Artıq olar, o adden aşqanlar ve İblis orduları, toptan o yerge fırlatılıp
          (ceennemge) atılırlar.
        cid: 0
  - verse: 93
    segments:
      - text: >-
          [92 ayetine baq.]
        cid: 0
  - verse: 94
    segments:
      - text: >-
          O yerde bir-birilerinen çekişerek, boyle derler:
        cid: 0
  - verse: 95
    segments:
      - text: >-
          Vallahi, biz, aqiqaten ap-açıq bir sapıqlıq içinde ekenmiz.
        cid: 0
  - verse: 96
    segments:
      - text: >-
          Çünki, biz sizni alemlerniñ Rabbinen bir tuta edik.
        cid: 0
  - verse: 97
    segments:
      - text: >-
          Bizni, ancaq o gunahkârlar saptırdı.
        cid: 0
  - verse: 98
    segments:
      - text: >-
          Şimdi artıq bizim ne şefaatçılarımız bar, ne de yaqın bir dostumız.
        cid: 0
  - verse: 99
    segments:
      - text: >-
          [98 ayetine baq.]
        cid: 0
  - verse: 100
    segments:
      - text: >-
          Ah, keşke biz içün (dünyağa) bir qaytuv daa olsa da, mu’minlerden olsaq!
        cid: 0
  - verse: 101
    segments:
      - text: >-
          Bunda elbet (alınacaq) buyuk bir ders bar; amma çoqları iman etmezler.
        cid: 0
  - verse: 102
    segments:
      - text: >-
          Şubesiz, Rabbiñ, işte O, mutlaq ğalip ve bol merhamet saibidir.
        cid: 0
  - verse: 103
    segments:
      - text: >-
          Nuһ qavmı da peyğamberlerni yalancılıqta suçladılar.
        cid: 0
  - verse: 104
    segments:
      - text: >-
          Qardaşları Nuһ olarğa boyle degen edi: (Allaһqa qarşı kelüvden)
          saqınmazsıñızmı?
        cid: 0
  - verse: 105
    segments:
      - text: >-
          Biliñ ki, men sizge yollanılğan işançlı bir elçiyim.
        cid: 0
  - verse: 106
    segments:
      - text: >-
          Artıq Allaһqa qarşı kelüvden saqınıñ ve maña itaat etiñ.
        cid: 0
  - verse: 107
    segments:
      - text: >-
