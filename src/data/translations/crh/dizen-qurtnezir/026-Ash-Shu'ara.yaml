  - verse: 219
    segments:
      - text: >
          Secde etkenler arasında dolaşuvıñnı da (körmekte). (İbn Abbas (r.a.)dan kelgen
          rivayetke köre, «ve tekallubeke fiis-saacidiin» sözüniñ ifade etmek istegen
          manası şudır: Allah seniñ, bir peyğamberniñ sülbinden diger peyğamberniñ sülbine
          keçe-keçe, niayet, nasıl bir nebiy olaraq çıqqanını körücidir).
        cid: 0
  - verse: 220
    segments:
      - text: >
          Çünki, er şeyni eşitici, er şeyni bilici Odır.
        cid: 0
  - verse: 221
    segments:
      - text: >
          Şeytanlarnıñ ise, kimge enecegini sizge haber bereyimmi?
        cid: 0
  - verse: 222
    segments:
      - text: >
          Olar, günahqa, iftirağa dalğan er kesniñ üstüne enerler.
        cid: 0
  - verse: 223
    segments:
      - text: >
          Bular, (şeytanlarğa) qulaq asarlar ve olarnıñ çoqu yalancılardır.
        cid: 0
  - verse: 224
    segments:
      - text: >
          Şairler(ge kelgende), olarğa da sapıqlar uyarlar.
        cid: 0
  - verse: 225
    segments:
      - text: >
          Olarnıñ er vadiyde başı boş dolaşqanlarını ve aqiqatta yapmağan şeylerini
          söylegenlerini körmediñmi?
        cid: 0
  - verse: 226
    segments:
      - text: >
          [225 ayetine baq.]
        cid: 0
  - verse: 227
    segments:
      - text: >
          Ancaq, iman etip, yahşı işler yapqanlar, Allahnı çoq-çoq añğanlar ve aqsızlıqqa
          oğratılğanlarında özlerini qorçalağanlar başqadır. Aqsızlıq etkenler, angi
          dönüşke,(angi aqibetke) döndürileceklerini yaqında bilecekler. (Sahih hadis
          kitaplarından yer alğan bir çoq hadisten de añlaşılğanı üzre, fenalıqnı ifade
          etmegen ve eyi maqsatnen qullanılğan şiir, yuqarıda yamanlanğan şiirden istisna
          etilgen. Bunıñ kibi, ashab-ı kiram arasında Resul-ı Ekremniñ taqdirlerini
          qazanğan bir çoq şairler bar edi. Meselâ, Az.Peyğamberniñ Hassan bin Sabitke:
          «Müşriklerni (şiirleriñnen) hacv et, bil ki, muaqqaq Cebrail de sennen
          beraberdir», buyurğanı rivayet olunğan).
        cid: 0
