          Sen, O mutlaq ğalip ve bol merhamet saibine işanıp tayan.
        cid: 0
  - verse: 216
    segments:
      - text: >-
          O ki, (gece namazğa) qalqqan zamanıñda, seni kormekte.
        cid: 0
  - verse: 217
    segments:
      - text: >-
          Secde etkenler arasında dolaşuvıñnı da (kormekte). (İbn Abbas (r.a.)dan kelgen
          rivayetke kore, «ve tekallubeke fiis-saacidiin» sözüniñ ifade etmek istegen
          manası şudır: Allaһ seniñ, bir peyğamberniñ sulbinden diger peyğamberniñ sulbine
          keçe-keçe, niayet, nasıl bir nebiy olaraq çıqqanını korücidir).
        cid: 0
  - verse: 218
    segments:
      - text: >-
          Çünki, er şeyni eşitici, er şeyni bilici Odır.
        cid: 0
  - verse: 219
    segments:
      - text: >-
          Şeytanlarnıñ ise, kimge enecegini sizge haber bereyimmi?
        cid: 0
  - verse: 220
    segments:
      - text: >-
          Olar, gunahqa, iftirağa dalğan er kesniñ ustüne enerler.
        cid: 0
  - verse: 221
    segments:
      - text: >-
          Bular, (şeytanlarğa) qulaq asarlar ve olarnıñ çoqu yalancılardır.
        cid: 0
  - verse: 222
    segments:
      - text: >-
          Şairler(ge kelgende), olarğa da sapıqlar uyarlar.
        cid: 0
  - verse: 223
    segments:
      - text: >-
          Olarnıñ er vadiyde başı boş dolaşqanlarını ve aqiqatta yapmağan şeylerini
          söylegenlerini kormediñmi?
        cid: 0
  - verse: 224
    segments:
      - text: >-
          [223 ayetine baq.]
        cid: 0
  - verse: 225
    segments:
      - text: >-
          Ancaq, iman etip, yahşı işler yapqanlar, Allaһnı çoq-çoq añğanlar ve aqsızlıqqa
          oğratılğanlarında ozlerini qorçalağanlar başqadır. Aqsızlıq etkenler, angi
          dönüşke,(angi aqibetke) döndürileceklerini yaqında bilecekler. (Sahih hadis
          kitaplarından yer alğan bir çoq hadisten de añlaşılğanı uzre, fenalıqnı ifade
          etmegen ve eyi maqsatnen qullanılğan şiir, yuqarıda yamanlanğan şiirden istisna
          etilgen. Bunıñ kibi, ashab-ı kiram arasında Resul Ekremniñ taqdirlerini qazanğan
          bir çoq şairler bar edi. Meselâ, Az.Peyğamberniñ Hassan bin Sabitke:
          «Muşriklerni (şiirleriñnen) hacv et, bil ki, muaqqaq Cebrail de sennen
          beraberdir», buyurğanı rivayet olunğan).
        cid: 0