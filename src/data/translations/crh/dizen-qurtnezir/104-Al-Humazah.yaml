surah_id: 104
language: crh
author: dizen-qurtnezir
verses:
  - verse: 3
    segments:
      - text: "(O), malı onı ebediy yapacaq belley."
        cid: 0
  - verse: 4
    segments:
      - text: "Yoq! Ant olsun ki, o Hutamege atılacaq."
        cid: 0
  - verse: 5
    segments:
      - text: "Hutameniñ ne olğanını bilesiñmi? 6-7. Allaһnıñ tutaştırılğan, (yandıqça) tırmanıp, yureklerniñ tam ustüne çıqqan ateşidir. 8-9. Olar (bu ateş içinde) uzatılğan direklerge bağlanğanlar ve o vaziyette o (ateş) ustlerine qapatılgandır."
        cid: 0