surah_id: 104
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "Arttan söz etmekni, yuzge qarşı til uzatmaqnı adet etken er kesniñ alına vay! O ki, mal toplağan ve onı sayıp turğandır."
        cid: 0
  - verse: 2
    segments:
      - text: "[1 ayetine baq.]"
        cid: 0
  - verse: 3
    segments:
      - text: "(O), malı onı ebediy yapacaq belley."
        cid: 0
  - verse: 4
    segments:
      - text: "Yoq! Ant olsun ki, o Hutamege atılacaq."
        cid: 0
  - verse: 5
    segments:
      - text: "Hutameniñ ne olğanını bilesiñmi?"
        cid: 0
  - verse: 6
    segments:
      - text: "Allaһnıñ tutaştırılğan, (yandıqça) tırmanıp, yureklerniñ tam ustüne çıqqan ateşidir."
        cid: 0
  - verse: 7
    segments:
      - text: "[6 ayetine baq.]"
        cid: 0
  - verse: 8
    segments:
      - text: "Olar (bu ateş içinde) uzatılğan direklerge bağlanğanlar ve o vaziyette o (ateş) ustlerine qapatılgandır."
        cid: 0
  - verse: 9
    segments:
      - text: "[8 ayetine baq.]"
        cid: 0