      - text: >-
          (Rivayetke köre, musulmanlar: Amellerniñ Allah yanında eñ sevgilisi angisi olğanını
          bilse edik, o oğurda mallarımıznı ve canlarımıznı feda eter edik, degen ediler.
          Bunıñ üzerine: «Şübesiz ki, Allah öz yolunda cenkleşkenlerni sever», manasındaki
          ayet nazil oldı. Faqat Uhud cenkinde bazılarnıñ keri dönüvi, ayetteki tenqitniñ
          sebebi olğan).
