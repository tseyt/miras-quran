surah_id: 61
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >
          Köklerde ve yerdekilerniñ episi Allahnı tesbih eter. O, üstündir, ikmet
          saibidir.
        cid: 0
  - verse: 2
    segments:
      - text: >
          Ey, iman etkenler! Yapmaycaq şeyleriñizni niçün söyleysiñiz? (Rivayetke köre,
          musulmanlar: Amellerniñ Allah yanında eñ sevgilisi angisi olğanını bilse edik, o
          oğurda mallarımıznı ve canlarımıznı feda eter edik, degen ediler. Bunıñ üzerine:
          «Şübesiz ki, Allah öz yolunda cenkleşkenlerni sever», manasındaki ayet nazil
          oldı. Faqat Uhud cenkinde bazılarnıñ keri dönüvi, ayetteki tenqitniñ sebebi
          olğan).
        cid: 0
  - verse: 3
    segments:
      - text: >
          Yapmaycaq şeyleriñizni söylemeñ, Allah qatında büyük bir nefretnen qarşılanır.
        cid: 0
  - verse: 4
    segments:
      - text: >
          Allah, öz yolunda pekişik bir bina kibi saf tutaraq cenkleşkenlerni sever.
        cid: 0
  - verse: 5
    segments:
      - text: >
          Bir zaman Musa qavmına: Ey, qavmım! Men Allahnıñ sizge yollağan elçisi olğanımnı
          bilgeniñiz alda, niçün meni ıncıtmaqtasıñız? degen edi. Olar yoldan
          sapqanlarınen, Allah da qalplerini saptırğan edi. Allah, fasıqlar toplulığını
          doğru yolğa qoymaz.
        cid: 0
  - verse: 6
    segments:
      - text: >
          Hatırla ki, Meryem oğlu İsa: Ey, İsrail oğulları! Men sizge Allahnıñ elçisiyim,
          menden evel kelgen Tevratnı doğrulayıcı ve menden soñ kelecek Ahmed adında bir
          Peyğamberni de, müjdeleyici olaraq keldim, degen edi. Faqat o, olarğa açıq
          deliller ketirgeninen: Bu ap-açıq bir tılsım, dediler.
        cid: 0
  - verse: 7
    segments:
      - text: >
          İslâmğa çağırılğanı alda, Allahqa nisbeten yalan uydurğandan daa zalım kim olar
          bilir! Allah zalımlar toplulığını doğru yolğa iriştirmez. (Allahqa nisbeten
          yalan uyduruv - Oña şirk qoşuv, evlât iftira etüv, ayetlerini sihir olaraq
          vasıflandıruvdır).
        cid: 0
  - verse: 8
    segments:
      - text: >
          Olar ağızlarınen Allahnıñ nurını söndürmek isteyler. Albuki, kâfirler
          istemeseler de, Allah nurını tamamlaycaq. (Kâfirler Allahnıñ dinine, kitabına ve
          delillerine sihir, şiir ve kehânet diyerek, iftiralar uydursalar da, Allahnıñ
          dini yücelecek).
        cid: 0
  - verse: 9
    segments:
      - text: >
          Müşrikler istemeseler de, dinini bütün dinlerge üstün yapmaq içün, Peyğamberini
          hidayet ve haq ile yollağan Odır.
        cid: 0
  - verse: 10
    segments:
      - text: >
          Ey, iman etkenler! Sizni accı bir azaptan qurtaracaq ticaretni sizge
          köstereyimmi?
        cid: 0
  - verse: 11
    segments:
      - text: >
          Allah ve Resulına inanır, mallarıñıznen ve canlarıñıznen Allah yolunda cihad
          eter iseñiz. Eger bilir iseñiz, bu siz içün daa hayırlıdır.
        cid: 0
  - verse: 12
    segments:
      - text: >
          İşte, bu taqdirde, O, siziñ günahlarıñıznı bağışlar, sizni zemininden irmaqlar
          aqqan cennetlerge, Adn cennetlerindeki güzel meskenlerge qoyar. İşte, eñ büyük
          qurtulış budır.
        cid: 0
  - verse: 13
    segments:
      - text: >
          Sevecek başqa bir şeyiñiz daa bar: Allahtan yardım ve yaqın bir fetih.
          Mü'minlerni (bularnen) müjdele. («Yaqın bir fetih» aqqında şu yorumlar yapılğan:
          Mekkeniñ musulmanlar tarafından fetih etilecegi; Qureyş üzerinden ğalebe elde
          etilecegi; İran ve şarqiy Rimniñ musulmanlarnıñ akimiyeti altına kirecegi).
        cid: 0
  - verse: 14
    segments:
      - text: >
          Ey, iman etkenler! Allahnıñ yardımcıları oluñ. Doğrusı, Meryem oğlu İsa
          havariylerge: Allahqa (barğan yolda) menim yardımcılarım kim? degen edi.
          Havariyler de: Allah (yolunıñ) yardımcıları bizmiz, degen ediler. İsrail
          oğullarından bir qısmı inanğan, bir qısmı da, inkâr etken edi. Niayet, biz
          inanğanlarnı, duşmanlarına qarşı destekledik. Böylece, üstün keldiler.
          («Havariyler» Az.İsağa er kesten evel inañğan ve yardımcı olğan 12 ihlâslı ve
          temiz insanğa berilgen isimdir. Az.İsağa inanğanlar, o Allahnıñ qulı ve
          Peyğamberi olğanını tasdiq eterek, kökke yükseltilgenine inanğanlardır. Az.İsanı
          inkâr etkenler ise, o Allahnıñ oğlu ve üçniñ üçüncisi olğanını söylegenlerdir).
        cid: 0
