surah_id: 61
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "Koklerde ve yerdekilerniñ episi Allaһnı tesbih eter. O, ustündir, ikmet saibidir."
        cid: 0
  - verse: 2
    segments:
      - text: "Ey, iman etkenler! Yapmaycaq şeyleriñizni niçün söyleysiñiz? (Rivayetke kore, musulmanlar: Amellerniñ Allaһ yanında eñ sevgilisi angisi olğanını bilse edik, o oğurda mallarımıznı ve canlarımıznı feda eter edik, degen ediler. Bunıñ uzerine: «Şubesiz ki, Allaһ oz yolunda cenkleşkenlerni sever», manasındaki ayet nazil oldı. Faqat Uhud cenkinde bazılarnıñ keri dönüvi, ayetteki tenqitniñ sebebi olğan)."
        cid: 0
  - verse: 3
    segments:
      - text: "Yapmaycaq şeyleriñizni söylemeñ, Allaһ qatında buyuk bir nefretnen qarşılanır."
        cid: 0
  - verse: 4
    segments:
      - text: "Allaһ, oz yolunda pekişik bir bina kibi saf tutaraq cenkleşkenlerni sever."
        cid: 0
  - verse: 5
    segments:
      - text: "Bir zaman Musa qavmına: Ey, qavmım! Men Allaһnıñ sizge yollağan elçisi olğanımnı bilgeniñiz alda, niçün meni ıncıtmaqtasıñız? degen edi. Olar yoldan sapqanlarınen, Allaһ da qalplerini saptırğan edi. Allaһ, fasıqlar toplulığını doğru yolğa qoymaz."
        cid: 0
  - verse: 6
    segments:
      - text: "Hatırla ki, Meryem oğlu İsa: Ey, İsrail oğulları! Men sizge Allaһnıñ elçisiyim, menden evel kelgen Tevratnı doğrulayıcı ve menden soñ kelecek Aһmed adında bir Peyğamberni de, mujdeleyici olaraq keldim, degen edi. Faqat o, olarğa açıq deliller ketirgeninen: Bu ap-açıq bir tılsım, dediler."
        cid: 0
  - verse: 7
    segments:
      - text: "İslâmğa çağırılğanı alda, Allaһqa nisbeten yalan uydurğandan daa zalım kim olar bilir! Allaһ zalımlar toplulığını doğru yolğa iriştirmez. (Allaһqa nisbeten yalan uyduruv - Oña şirk qoşuv, evlât iftira etüv, ayetlerini sihir olaraq vasıflandıruvdır)."
        cid: 0
  - verse: 8
    segments:
      - text: "Olar ağızlarınen Allaһnıñ nurını söndürmek isteyler. Albuki, kâfirler istemeseler de, Allaһ nurını tamamlaycaq. (Kâfirler Allaһnıñ dinine, kitabına ve delillerine sihir, şiir ve kehyanet diyerek, iftiralar uydursalar da, Allaһnıñ dini yucelecek)."
        cid: 0
  - verse: 9
    segments:
      - text: "Muşrikler istemeseler de, dinini butün dinlerge ustün yapmaq içün, Peyğamberini hidayet ve haq ile yollağan Odır."
        cid: 0
  - verse: 10
    segments:
      - text: "Ey, iman etkenler! Sizni accı bir azaptan qurtaracaq ticaretni sizge kostereyimmi?"
        cid: 0
  - verse: 11
    segments:
      - text: "Allaһ ve Resulına inanır, mallarıñıznen ve canlarıñıznen Allaһ yolunda cihad eter iseñiz. Eger bilir iseñiz, bu siz içün daa hayırlıdır."
        cid: 0
  - verse: 12
    segments:
      - text: "İşte, bu taqdirde, O, siziñ gunahlarıñıznı bağışlar, sizni zemininden irmaqlar aqqan cennetlerge, Adn cennetlerindeki guzel meskenlerge qoyar. İşte, eñ buyuk qurtulış budır."
        cid: 0
  - verse: 13
    segments:
      - text: "Sevecek başqa bir şeyiñiz daa bar: Allaһtan yardım ve yaqın bir fetih. Mu’minlerni (bularnen) mujdele. («Yaqın bir fetih» aqqında şu yorumlar yapılğan: Mekkeniñ musulmanlar tarafından fetih etilecegi; Qureyş uzerinden ğalebe elde etilecegi; İran ve şarqiy Rimniñ musulmanlarnıñ akimiyeti altına kirecegi)."
        cid: 0
  - verse: 14
    segments:
      - text: "Ey, iman etkenler! Allaһnıñ yardımcıları oluñ. Doğrusı, Meryem oğlu İsa havariylerge: Allaһqa (barğan yolda) menim yardımcılarım kim? degen edi. Havariyler de: Allaһ (ölunıñ) yardımcıları bizmiz, degen ediler. İsrail oğullarından bir qısmı inanğan, bir qısmı da, inkâr etken edi. Niayet, biz inanğanlarnı, duşmanlarına qarşı destekledik. Boylece, ustün keldiler. («Havariyler» Az.İsağa er kesten evel inañğan ve yardımcı olğan 12 ihlâsl ve temiz insanğa berilgen isimdir. Az.İsağa inanğanlar, o Allaһnıñ qulı ve Peyğamberi olğanını tasdiq eterek, kokke yukseltilgenine inanğanlardır. Az.İsanı inkâr etkenler ise, o Allaһnıñ oğlu ve uçniñ uçüncisi olğanını söylegenlerdir)."
        cid: 0