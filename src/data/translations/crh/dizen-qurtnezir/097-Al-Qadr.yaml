surah_id: 97
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "Biz onı (Qur’annı) Qadir gecesinde endirdik."
        cid: 0
  - verse: 2
    segments:
      - text: "Qadir gecesiniñ ne olğanını sen bilesiñmi?"
        cid: 0
  - verse: 3
    segments:
      - text: "Qadir gecesi biñ aydan hayırlıdır."
        cid: 0
  - verse: 4
    segments:
      - text: "O gecede, Rabbleriniñ izninen, melekler ve Ruh (Cebrail), er iş içün ener turarlar."
        cid: 0
  - verse: 5
    segments:
      - text: "O gece selâmetlik toludır. Ta fecrniñ doğuvına qadar."
        cid: 0