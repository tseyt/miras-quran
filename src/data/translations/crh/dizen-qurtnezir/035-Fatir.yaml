surah_id: 35
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "Koklerni ve yerni yaratqan, meleklerni ekişer, uçer, dörter qanatlı elçiler yapqan Allaһqa hamd olsun. O, yaratuvda istegen arttırmanı yapar. Şubesiz, Allaһ er şeyge kuçü yeticidir. (Melekler - peyğamberlerge ve salih qullarına vahiy, ilham ve kerçek tüş yolunen, ilâhiy emirlerini bildirgen elçilerdir)."
        cid: 0
  - verse: 2
    segments:
      - text: "Allaһnıñ insanlarğa açacaq er angi bir rahmetini tutıp, aps etici olalmaz. Onıñ tutqanını Ondan soñra bıraqacaq da yoqtır. O, ustündir, ikmet saibidir. (Allaһnıñ açacaq rahmeti: nimet, işanç, sağlıq, ilim, peyğamberlik, rızıq, yağmur ve bularğa beñzegen lütflerdir)."
        cid: 0
  - verse: 3
    segments:
      - text: "Ey, insanlar! Allaһnıñ sizge olğan nimetini hatırlañ; Allaһtan başqa sizge kokten ve yerden rızıq berecek bir yaratıcı barmı? Ondan başqa tañrı yoqtır. Nasıl ola da (tevhidden kufürge) çevirilmektesiñiz!"
        cid: 0
  - verse: 4
    segments:
      - text: "Eger seni yalanlay iseler, (kederlenme); senden evelki peyğamberler de yalanlanğanlar. Butün işler yalıñız Allaһqa döndürilecek."
        cid: 0
  - verse: 5
    segments:
      - text: "Ey, insanlar! Allaһnıñ vadesi kerçektir, saqın dünya ayatı sizni aldatmasın ve aldatıcı (şeytan) da, Allaһ aqqında sizni qandırmasın!"
        cid: 0
  - verse: 6
    segments:
      - text: "Çünki, şeytan siziñ duşmanıñızdır, siz de onı duşman sayıñ. O, oz tarafdarlarını, ancaq ateş ehlinden olmağa çağırır."
        cid: 0
  - verse: 7
    segments:
      - text: "İnkâr etkenler içün, şubesiz çetin bir azap bar, iman etip, yahşı işler yapqanlarğa da mağfiret ve buyuk bir mukâfat bar."
        cid: 0
  - verse: 8
    segments:
      - text: "Fena işi ozüne guzel kosterilip de, onı yahşı korıgen kimse (yamanlıqnı iç istemegen kimsege beñzer)mi? Allaһ istegenini sapıqlıqqa yoneltir, istegenini doğru yolğa qavuştırır. O alda, olar içün kederlenerek, ozüñni elâk etme. Allaһ olarnıñ ne yapqanlarını bile."
        cid: 0
  - verse: 9
    segments:
      - text: "Ruzgârlarnı yollap da, bulutnı areketke keçirgen Allaһtır. Biz onı olü bir bolgege yollarmız da, olüminden soñ, topraqqa onıñnen ayat berirmiz. Olülerniñ yañıdan tirilüvi de boyle olacaq."
        cid: 0
  - verse: 10
    segments:
      - text: "Kim izzet ve şeref istey edi ise, bilsin ki, izzet ve şerefniñ episi Allaһnıñdır. Oña ancaq guzel sözler yukselir (qavuşır). Olarnı da Allaһqa amel-i salih qavuştırır. Yamanlıqlarnen tuzaq qurğanlarğa kelgende, olar içün çetin bir azap bardır ve olarnıñ tuzağı bozulır."
        cid: 0
  - verse: 11
    segments:
      - text: "Allaһ sizni (evelâ) topraqtan, soñra nutfeden yarattı. Soñ sizni çiftler (erkekqadın) etti. Onıñ bilgisi olmadan, iç bir qadın ne yukke qalır, ne de doğurır. Bir canlığa omür berilüvi de, onıñ omürinden azaltıluvı da, mıtlaqa bir kitaptadır. Şubesiz, bular Allaһqa qolaydır. (Başta topraqtan yaratılğan insanlıqnıñ atası Az. Adem, soñ nutfeden yaratılğan da, diger isnanlardır. Er şey yazılı olğan kitap ise, Allaһnıñ bilgisi ve yapacaq işleri belgilengen levh-i mahfuzdır)."
        cid: 0
  - verse: 12
    segments:
      - text: "Eki deñiz bir-birine musaviy olmaz. Bu tatlıdır, suvsızlıqnı qandırır, içilüvi qolaydır. Şu da tuzlıdır, accıdır (boğaznı yaqar). Episinden de taze et (balıq) aşarsıñız ve kiyecek süs eşyañıznı çıqarırsıñız. Allaһnıñ lüftinden (nasibiñizni) arap da, şukür etüviñiz içün, gemilerniñ deñizni yarıp ketkenini korersiñ. (Suvı tatl ve accı eki deñiz bir-birine nasıl musaviy degil ise, inanğannen inanmağan da, bir degil)."
        cid: 0
  - verse: 13
    segments:
      - text: "Allaһ geceni kundüzniñ içine soqar, kundüzni de geceniñ içine soqar. Kuneş ve aynı emri altına alğandır. Er biri belli bir muddetke qadar aqıp keter. İşte, (butün bularnı yapqan) Rabbiñiz Allaһtır. Mulk Onıñdır. Onı bıraqıp da, kendilerine tabınğanlarıñız ise, bir çegirdek qabuğına bile saip degiller. (Geceniñ kundüzge, kundüzniñ gecege soquluvı, geceniñ kundüzniñ yerini, kundüzniñ de geceniñ yerini aluvıdır. Başqa bir tabir ile, biriniñ qısqarğanınen digeriniñ uzayuvıdır. Kuneş ve aynıñ belli bir muddetke qadar aqıp ketüvi, oz orbitaları etrafında dönüşlerini qıyametke qadar sürdirüvleri ya da kuneşniñ bir yılda, aynıñ da bir ayda dönüşini tamamlavudır)."
        cid: 0
  - verse: 14
    segments:
      - text: "Eger olarnı (putlarnı) çağırsañız, siziñ çağıruvıñıznı eşitmezler. Faraz eteyik, eşitseler bile, sizge cevap beralmazlar. Qıyamet kunü de, siziñ ortaq qoşqanıñıznı red eterler. (Bu aqiqatnı) saña, er şeyden haberi olğan (Allaһ) kibi iç kimse haber beralmaz."
        cid: 0
  - verse: 15
    segments:
      - text: "Ey, insanlar! Allaһqa muhtac olğan sizsiñiz. Zengin ve matqavğa lâyıq olğan ancaq Odır."
        cid: 0
  - verse: 16
    segments:
      - text: "Allaһ tilese, sizni yoq eter ve yeriñizge yañı bir halq ketirir."
        cid: 0
  - verse: 17
    segments:
      - text: "Bu da Allaһqa kuç bir şey degil."
        cid: 0
  - verse: 18
    segments:
      - text: "İç bir gunahkâr başqasınıñ gunahını arqalamaz. Yukü (gunahı) ağır kelgen kimse onı taşımaq içün (başqasını) çağırsa, bu çağırğanı, aqrabası da olsa, onıñ yukünden bir şey arqalamaz. Sen ancaq kormeden, Rabblerinden qorqqanlarnı ve namaznı qılğanlarnı tenbiyeley bilesiñ. Kim temizlense, o oz menfaatına temizlengen olur. Dönüş Allaһqadır. (Bu ayet-i kerimede er kesniñ oz gunahından mesuliyetli olacağı, iç kimseniñ bir başqasınıñ gunahından mesuliyet çekmeycegi ifade etilmekte. Ancaq, yamanlıqta yol açqanlar em oz gunahlarından mesuliyetli, em de o gunahnı işlegenlerniñ yamanlığından mesuliyetli olur. Peyğamberimiz de: «Kim bir yaman adet çıqarsa, oña em onıñ gunahı, em de onı işelegenlerniñ gunahı bardır», buyurğan)."
        cid: 0
  - verse: 19
    segments:
      - text: "Tirilernen olüler de bir olmaz. Şubesiz, Allaһ istegenine eşittirir. Sen qabirdekilerge eşittiralmazsıñ! (İman, bilgi, ikmet ve aqıl saibi, ahlâqlı, faziletli kimselernen bularnıñ taqip etken haq yolu ve nail olacaq uhreviy nimetlerinen imansız, bilgisiz, aqıl ve basiret, ahlâq ve faziletten eksik kimseler ve bularnıñ taqip etken batıl yolları ve oğraycaq uhreviy azapları kesen-kes bir korülmez)."
        cid: 0
  - verse: 20
    segments:
      - text: "Sen sadece bir tenbiyecisiñ."
        cid: 0
  - verse: 21
    segments:
      - text: "Biz seni mujdeleyici ve tenbiyeci olaraq haq ile yolladıq. Er millet içün mıtlaqa bir tenbiyeci (peyğamber) olğandır. (Bu ayet ve buña beñzegen bazı ayetlerde er milletke bir peyğamber yollanılğanı ifade etilmekte)."
        cid: 0
  - verse: 22
    segments:
      - text: "Eger seni yalanlay iseler (kederlenme), olardan evelkiler de yalanlanğan ediler. (Albuki) peyğamberleri olarğa açıq ayetler (mucizeler), saifeler ve aydınlatıcı kitap ketirgen ediler. (Saifeler manasındaki «zubur”nen Az. Adem, İdris, Şiit ve İbrahimge endirilgen suhuf; kitapnen de Tevrat, İncil ve Zebur kozde tutulmaqta)."
        cid: 0
  - verse: 23
    segments:
      - text: "Soñra men o inkâr eticilerni yaqaladım. (Baq ki) cezam nasıl oldı!"
        cid: 0
  - verse: 24
    segments:
      - text: "Kormediñmi, Allaһ kokten suv endirdi. Onıñnen renkleri çeşit-çeşit meyvalar çıqardıq. Dağlardan (keçken) beyaz, qırmızı, çeşit renklerde ve sim-siya yollar (yaptıq)."
        cid: 0
  - verse: 25
    segments:
      - text: "İnsanlardan, ayvanlardan ve mallardan da, kene boyle türlü renkte olğanları bar. Qullar içinde ancaq alimler Allaһtan (keregi qadar) qorqar. Şubesiz, Allaһ daima ustündir, çoq bağışlayıcıdır. (Alimler - Allaһnı bilgen ve Oña temennada bulunaraq, sayğı beslegenlerdir. Bir hadiste: «Rutbelerniñ eñ yuksegi ilim rutbesidir», denile. Ayette baas etilgen ilim imannen birleşken ilimdir, çünki, iman ahiret ayatını da garantiya altına alır; imansız ilim ise, insanlarğa olğanı keçici dünya faydalarını teminler)."
        cid: 0
  - verse: 26
    segments:
      - text: "Allaһnıñ kitabını oquğanlar, namaznı qılğanlar ve ozlerine bergen rızqımızdan (Allaһ içün) gizli ve aşkâr sarf etkenler, asla zararğa oğramaycaq bir qazanç umüt ete bilirler."
        cid: 0
  - verse: 27
    segments:
      - text: "Çünki, Allaһ olarnıñ mukâfatlarını tamamınen oder ve lütfinden olarğa ziyadesini de berir. Şubesiz, O, çoq bağışlıyıcı, şukür qarşılığını bolbol bericidir."
        cid: 0
  - verse: 28
    segments:
      - text: "Saña vahiy etken kitabımız, ozünden evelki (semaviy kitaplarnı) doğrulayıcı olaraq kelgen aqiqattır. Allaһ, qullarınıñ (er alından) haberdardır, korücidir."
        cid: 0
  - verse: 29
    segments:
      - text: "Soñra Kitapnı, qullarımız arasından seçkenlerimizge berdik. Olardan (insanlardan) kimi ozüne zulum eter, kimi ortadadır, kimi de Allaһnıñ izninen hayırlarda ogge keçmek içün yarışır. İşte, buyuk fazilet budır. (Ozüne zulum etmek - Qur’anğa kore amel etüv ceetinden qusur yapmaq; ortada olmaq, gunahl savabına musaviy olmaq; hayırda ogge keçmek, Kitapqa uyğun olğan davranışqa başqalarını da yoneltmek şeklinde tefsir etilgen. Ayette keçken “zalım” ve “müktesid” kelimeleri çeşit manalarda yorumlanğan olmaqnen, umumiy fikrge kore, er ekisi de, mu’minlerde olğan sıfatlardır. Kâfirlerniñ sıfatları soñki ayetlerde belli olacaq)."
        cid: 0
  - verse: 33
    segments:
      - text: "(Olarnıñ mukâfatı), içine kirecekleri Adn cennetleridir. O yerde altın bilezlikler ve incilernen süslenirler. O yerde kiyecek urbaları da ipektir."
        cid: 0
  - verse: 34
    segments:
      - text: "(Cennette boyle) derler: Bizden qasevetni ketkizgen Allaһqa hamd olsun. Doğrusı, Rabbimiz çoq bağışlayıcı, çoq nimet bericidir. (Qasevetniñ ketkizilüvi - ceennem, olüm qorqusınıñ ve dünya qasevetiniñ ortadan qaldırıluvıdır)."
        cid: 0
  - verse: 35
    segments:
      - text: "O (Rabb) ki, lütfinen bizni asıl oturılacaq yurtqa (cennetke) yerleştirdi. Artıq o yerde bizge ne bir yorğunlıq toqunacaq, ne de o yerde bizge bir usanmaq kelecek."
        cid: 0
  - verse: 36
    segments:
      - text: "İnkâr etkenlerge de ceennem ateşi bar. Oldürilmezler ki, olsinler, ceennem azabı da, olarğa biraz olsa bile, yengilleştirilmez. İşte, biz, kufürde ileri ketken er nankorni boyle cezalandırırmız."
        cid: 0
  - verse: 37
    segments:
      - text: "Olar o yerde: Rabbimiz! Bizni çıqar, (evelde) yapqanımıznıñ yerine yahşı işler yapayıq! diye feryad eterler. Sizge tüşünecek kimseniñ tüşüne bilecegi qadar bir omür bermedikmi? Sizge tenbiyeci de kelmedimi? (Niçün inanmadıñız?) Şimdi tatıñız (azapnı)! zalımlarnıñ yardımcısı yoqtır. («Kelgen tenbiyeci» - peyğamberler ve kitaplardır. Bazılar bu tenbiyecini aqıl, qartlıq ve yaqınlarınıñ olümi diye izaatlağanlar)."
        cid: 0
  - verse: 38
    segments:
      - text: "Allaһ koklerniñ ve yerniñ ğaybını bilir. O qalplerniñ içinde ne bar ise, onı da haqqı ile bilicidir. («Koklerniñ ve yerniñ ğaybı» - o yerde ceryan etken ve korünmegen qanunlar, nizamlar ve sistemelardır)."
        cid: 0
  - verse: 39
    segments:
      - text: "Sizni yer yuzünde halifeler yapqan Odır. Şunıñ içün, kim inkâr etse, inkârı oz zararınadır. Kâfirlerniñ kufüri Rabbleri qatında olar içün ancaq ğadapnı arttırır. Kâfirlerniñ kufüri kendilerine ziyandan başqa bir şey ketirmez."
        cid: 0
  - verse: 40
    segments:
      - text: "De ki: Allaһnı bıraqıp da, tabınğan ortaqlarıñıznı kordiñizmi? Kosteriñ maña? Olar yerdeki angi şeyni yarattılar! Yoqsa, olarnıñ koklerde bir ortaqları barmı! Yahut biz olarğa, (bu hususta) bir kitap berdik de, olar o kitaptaki bir delilge esaslanmaqtalarmı? Yoq! O zalımlar bir-birlerine aldatuvdan başqa bir şey vade etmeyler."
        cid: 0
  - verse: 41
    segments:
      - text: "Şubesiz, Allaһ koklerni ve yerni nizamları bozulmasın, diye tutmakta. Ant olsun ki, olarnıñ nizamı eger bir bozulsa, Ozünden başqa iç kimse olarnı tutalmaz. Şubesiz, O, halimdir, çoq bağışlayıcıdır."
        cid: 0
  - verse: 42
    segments:
      - text: "Ozlerine bir tenbiyeci (peyğamber) kelir ise, er angi bir milletten daa çoq doğru yolda olacaqlarına dair, butün kuçlerinen Allaһqa yemin etken ediler. Faqat olarğa tenbiyeci (Muһammed) kelgeninen, bu, olarnıñ haqtan uzaqlaşuvlarından başqa bir şeyni arttırmadı."
        cid: 0
  - verse: 43
    segments:
      - text: "Çünki, olar yer yuzünde buyuklik taslamakta ve yaman tuzaqlar qurmakta ediler. Albuki, insan qazğan çuqurına ozü tüşer. Olar evelkilerniñ qanunından (olarğa tedbiq etilgeninden) başqasını beklemektelermi? Allaһnıñ qanunında asla bir deñişme tapalmazsıñ, Allaһnıñ qanunında kesen-kes bir sapıqlıq da tapalmazsıñ."
        cid: 0
  - verse: 44
    segments:
      - text: "Bular yer yuzünde kezip de, ozlerinden evelkilerniñ soñu nasıl olğanını kormedilermi? Albuki, olar, bulardan daa kuçlü ediler. Ne koklerde, ne de yerde Allaһnı aciz bıraqacaq bir kuç bar. O, bilicidir, kuçlüdir."
        cid: 0
  - verse: 45
    segments:
      - text: "Eger Allaһ, yapqanları sebebinden, insanlarnı (aman) cezalandırsa edi, yer yuzünde iç bir canlı yaratılğan qaldırmaz edi. Faqat Allaһ olarnı belli bir muddetke qadar keçiktirmekte. Vaqıtları kelgeninen (keregini yapar). Şubesiz, Allaһ qullarını kormektedir."
        cid: 0