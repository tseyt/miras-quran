surah_id: 35
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >
          Köklerni ve yerni yaratqan, meleklerni ekişer, üçer, dörter qanatlı elçiler
          yapqan Allahqa hamd olsun. O, yaratuvda istegen arttırmanı yapar. Şübesiz, Allah
          er şeyge küçü yeticidir. (Melekler - peyğamberlerge ve salih qullarına vahiy,
          ilham ve kerçek tüş yolunen, ilâhiy emirlerini bildirgen elçilerdir).
        cid: 0
  - verse: 2
    segments:
      - text: >
          Allahnıñ insanlarğa açacaq er angi bir rahmetini tutıp, aps etici olalmaz. Onıñ
          tutqanını Ondan soñra bıraqacaq da yoqtır. O, üstündir, ikmet saibidir.
          (Allahnıñ açacaq rahmeti: nimet, işanç, sağlıq, ilim, peyğamberlik, rızıq,
          yağmur ve bularğa beñzegen lütflerdir).
        cid: 0
  - verse: 3
    segments:
      - text: >
          Ey, insanlar! Allahnıñ sizge olğan nimetini hatırlañ; Allahtan başqa sizge
          kökten ve yerden rızıq berecek bir yaratıcı barmı? Ondan başqa tañrı yoqtır.
          Nasıl ola da (tevhidden küfürge) çevirilmektesiñiz!
        cid: 0
  - verse: 4
    segments:
      - text: >
          Eger seni yalanlay iseler, (kederlenme); senden evelki peyğamberler de
          yalanlanğanlar. Bütün işler yalıñız Allahqa döndürilecek.
        cid: 0
  - verse: 5
    segments:
      - text: >
          Ey, insanlar! Allahnıñ vadesi kerçektir, saqın dünya ayatı sizni aldatmasın ve
          aldatıcı (şeytan) da, Allah aqqında sizni qandırmasın!
        cid: 0
  - verse: 6
    segments:
      - text: >
          Çünki, şeytan siziñ duşmanıñızdır, siz de onı duşman sayıñ. O, öz
          tarafdarlarını, ancaq ateş ehlinden olmağa çağırır.
        cid: 0
  - verse: 7
    segments:
      - text: >
          İnkâr etkenler içün, şübesiz çetin bir azap bar, iman etip, yahşı işler
          yapqanlarğa da mağfiret ve büyük bir mükâfat bar.
        cid: 0
  - verse: 8
    segments:
      - text: >
          Fena işi özüne güzel kösterilip de, onı yahşı körgen kimse (yamanlıqnı iç
          istemegen kimsege beñzer)mi? Allah istegenini sapıqlıqqa yöneltir, istegenini
          doğru yolğa qavuştırır. O alda, olar içün kederlenerek, özüñni elâk etme. Allah
          olarnıñ ne yapqanlarını bile.
        cid: 0
  - verse: 9
    segments:
      - text: >
          Rüzgârlarnı yollap da, bulutnı areketke keçirgen Allahtır. Biz onı ölü bir
          bölgege yollarmız da, ölüminden soñ, topraqqa onıñnen ayat berirmiz. Ölülerniñ
          yañıdan tirilüvi de böyle olacaq.
        cid: 0
  - verse: 10
    segments:
      - text: >
          Kim izzet ve şeref istey edi ise, bilsin ki, izzet ve şerefniñ episi
          Allahnıñdır. Oña ancaq güzel sözler yükselir (qavuşır). Olarnı da Allahqa amel-i
          salih qavuştırır. Yamanlıqlarnen tuzaq qurğanlarğa kelgende, olar içün çetin bir
          azap bardır ve olarnıñ tuzağı bozulır.
        cid: 0
  - verse: 11
    segments:
      - text: >
          Allah sizni (evelâ) topraqtan, soñra nutfeden yarattı. Soñ sizni çiftler
          (erkek-qadın) etti. Onıñ bilgisi olmadan, iç bir qadın ne yükke qalır, ne de
          doğurır. Bir canlığa ömür berilüvi de, onıñ ömürinden azaltıluvı da, mıtlaqa bir
          kitaptadır. Şübesiz, bular Allahqa qolaydır. (Başta topraqtan yaratılğan
          insanlıqnıñ atası Az. Adem, soñ nutfeden yaratılğan da, diger isnanlardır. Er
          şey yazılı olğan kitap ise, Allahnıñ bilgisi ve yapacaq işleri belgilengen
          levh-i mahfuzdır).
        cid: 0
  - verse: 12
    segments:
      - text: >
          Eki deñiz bir-birine musaviy olmaz. Bu tatlıdır, suvsızlıqnı qandırır, içilüvi
          qolaydır. Şu da tuzlıdır, accıdır (boğaznı yaqar). Episinden de taze et (balıq)
          aşarsıñız ve kiyecek süs eşyañıznı çıqarırsıñız. Allahnıñ lüftinden
          (nasibiñizni) arap da, şükür etüviñiz içün, gemilerniñ deñizni yarıp ketkenini
          körersiñ. (Suvı tatlı ve accı eki deñiz bir-birine nasıl musaviy degil ise,
          inanğannen inanmağan da, bir degil).
        cid: 0
  - verse: 13
    segments:
      - text: >
          Allah geceni kündüzniñ içine soqar, kündüzni de geceniñ içine soqar. Küneş ve
          aynı emri altına alğandır. Er biri belli bir müddetke qadar aqıp keter. İşte,
          (bütün bularnı yapqan) Rabbiñiz Allahtır. Mülk Onıñdır. Onı bıraqıp da,
          kendilerine tabınğanlarıñız ise, bir çegirdek qabuğına bile saip degiller.
          (Geceniñ kündüzge, kündüzniñ gecege soquluvı, geceniñ kündüzniñ yerini,
          kündüzniñ de geceniñ yerini aluvıdır. Başqa bir tabir ile, biriniñ qısqarğanınen
          digeriniñ uzayuvıdır. Küneş ve aynıñ belli bir müddetke qadar aqıp ketüvi, öz
          orbitaları etrafında dönüşlerini qıyametke qadar sürdirüvleri ya da küneşniñ bir
          yılda, aynıñ da bir ayda dönüşini tamamlavudır).
        cid: 0
  - verse: 14
    segments:
      - text: >
          Eger olarnı (putlarnı) çağırsañız, siziñ çağıruvıñıznı eşitmezler. Faraz eteyik,
          eşitseler bile, sizge cevap beralmazlar. Qıyamet künü de, siziñ ortaq
          qoşqanıñıznı red eterler. (Bu aqiqatnı) saña, er şeyden haberi olğan (Allah)
          kibi iç kimse haber beralmaz.
        cid: 0
  - verse: 15
    segments:
      - text: >
          Ey, insanlar! Allahqa muhtac olğan sizsiñiz. Zengin ve matqavğa lâyıq olğan
          ancaq Odır.
        cid: 0
  - verse: 16
    segments:
      - text: >
          Allah tilese, sizni yoq eter ve yeriñizge yañı bir halq ketirir.
        cid: 0
  - verse: 17
    segments:
      - text: >
          Bu da Allahqa küç bir şey degil.
        cid: 0
  - verse: 18
    segments:
      - text: >
          İç bir günahkâr başqasınıñ günahını arqalamaz. Yükü (günahı) ağır kelgen kimse
          onı taşımaq içün (başqasını) çağırsa, bu çağırğanı, aqrabası da olsa, onıñ
          yükünden bir şey arqalamaz. Sen ancaq körmeden, Rabblerinden qorqqanlarnı ve
          namaznı qılğanlarnı tenbiyeley bilesiñ. Kim temizlense, o öz menfaatına
          temizlengen olur. Dönüş Allahqadır. (Bu ayet-i kerimede er kesniñ öz günahından
          mesuliyetli olacağı, iç kimseniñ bir başqasınıñ günahından mesuliyet çekmeycegi
          ifade etilmekte. Ancaq, yamanlıqta yol açqanlar em öz günahlarından mesuliyetli,
          em de o günahnı işlegenlerniñ yamanlığından mesuliyetli olur. Peyğamberimiz de:
          «Kim bir yaman adet çıqarsa, oña em onıñ günahı, em de onı işelegenlerniñ günahı
          bardır», buyurğan).
        cid: 0
  - verse: 19
    segments:
      - text: >
          Körnen körgen, qaranlıqnen aydınlıq, kölgenen sıcaq bir olmaz.
        cid: 0
  - verse: 20
    segments:
      - text: >
          [19 ayetine baq.]
        cid: 0
  - verse: 21
    segments:
      - text: >
          [19 ayetine baq.]
        cid: 0
  - verse: 22
    segments:
      - text: >
          Tirilernen ölüler de bir olmaz. Şübesiz, Allah istegenine eşittirir. Sen
          qabirdekilerge eşittiralmazsıñ! (İman, bilgi, ikmet ve aqıl saibi, ahlâqlı,
          faziletli kimselernen bularnıñ taqip etken haq yolu ve nail olacaq uhreviy
          nimetlerinen imansız, bilgisiz, aqıl ve basiret, ahlâq ve faziletten eksik
          kimseler ve bularnıñ taqip etken batıl yolları ve oğraycaq uhreviy azapları
          kesen-kes bir körülmez).
        cid: 0
  - verse: 23
    segments:
      - text: >
          Sen sadece bir tenbiyecisiñ.
        cid: 0
  - verse: 24
    segments:
      - text: >
          Biz seni müjdeleyici ve tenbiyeci olaraq haq ile yolladıq. Er millet içün
          mıtlaqa bir tenbiyeci (peyğamber) olğandır. (Bu ayet ve buña beñzegen bazı
          ayetlerde er milletke bir peyğamber yollanılğanı ifade etilmekte).
        cid: 0
  - verse: 25
    segments:
      - text: >
          Eger seni yalanlay iseler (kederlenme), olardan evelkiler de yalanlanğan ediler.
          (Albuki) peyğamberleri olarğa açıq ayetler (mucizeler), saifeler ve aydınlatıcı
          kitap ketirgen ediler. (Saifeler manasındaki «zubur"nen Az. Adem, İdris, Şiit ve
          İbrahimge endirilgen suhuf; kitapnen de Tevrat, İncil ve Zebur közde
          tutulmaqta).
        cid: 0
  - verse: 26
    segments:
      - text: >
          Soñra men o inkâr eticilerni yaqaladım. (Baq ki) cezam nasıl oldı!
        cid: 0
  - verse: 27
    segments:
      - text: >
          Körmediñmi, Allah kökten suv endirdi. Onıñnen renkleri çeşit-çeşit meyvalar
          çıqardıq. Dağlardan (keçken) beyaz, qırmızı, çeşit renklerde ve sim-siya yollar
          (yaptıq).
        cid: 0
  - verse: 28
    segments:
      - text: >
          İnsanlardan, ayvanlardan ve mallardan da, kene böyle türlü renkte olğanları bar.
          Qullar içinde ancaq alimler Allahtan (keregi qadar) qorqar. Şübesiz, Allah daima
          üstündir, çoq bağışlayıcıdır. (Alimler - Allahnı bilgen ve Oña temennada
          bulunaraq, sayğı beslegenlerdir. Bir hadiste: «Rutbelerniñ eñ yüksegi ilim
          rutbesidir», denile. Ayette baas etilgen ilim imannen birleşken ilimdir, çünki,
          iman ahiret ayatını da garantiya altına alır; imansız ilim ise, insanlarğa
          olğanı keçici dünya faydalarını teminler).
        cid: 0
  - verse: 29
    segments:
      - text: >
          Allahnıñ kitabını oquğanlar, namaznı qılğanlar ve özlerine bergen rızqımızdan
          (Allah içün) gizli ve aşkâr sarf etkenler, asla zararğa oğramaycaq bir qazanç
          ümüt ete bilirler.
        cid: 0
  - verse: 30
    segments:
      - text: >
          Çünki, Allah olarnıñ mükâfatlarını tamamınen öder ve lütfinden olarğa ziyadesini
          de berir. Şübesiz, O, çoq bağışlayıcı, şükür qarşılığını bol-bol bericidir.
        cid: 0
  - verse: 31
    segments:
      - text: >
          Saña vahiy etken kitabımız, özünden evelki (semaviy kitaplarnı) doğrulayıcı
          olaraq kelgen aqiqattır. Allah, qullarınıñ (er alından) haberdardır, körücidir.
        cid: 0
  - verse: 32
    segments:
      - text: >
          Soñra Kitapnı, qullarımız arasından seçkenlerimizge berdik. Olardan
          (insanlardan) kimi özüne zulum eter, kimi ortadadır, kimi de Allahnıñ izninen
          hayırlarda ögge keçmek içün yarışır. İşte, büyük fazilet budır. (Özüne zulum
          etmek - Qur'anğa köre amel etüv ceetinden qusur yapmaq; ortada olmaq, günahı
          savabına musaviy olmaq; hayırda ögge keçmek, Kitapqa uyğun olğan davranışqa
          başqalarını da yöneltmek şeklinde tefsir etilgen. Ayette keçken "zalım" ve
          "müktesid" kelimeleri çeşit manalarda yorumlanğan olmaqnen, umumiy fikrge köre,
          er ekisi de, mü'minlerde olğan sıfatlardır. Kâfirlerniñ sıfatları soñki
          ayetlerde belli olacaq).
        cid: 0
  - verse: 33
    segments:
      - text: >
          (Olarnıñ mükâfatı), içine kirecekleri Adn cennetleridir. O yerde altın
          bilezlikler ve incilernen süslenirler. O yerde kiyecek urbaları da ipektir.
        cid: 0
  - verse: 34
    segments:
      - text: >
          (Cennette böyle) derler: Bizden qasevetni ketkizgen Allahqa hamd olsun. Doğrusı,
          Rabbimiz çoq bağışlayıcı, çoq nimet bericidir. (Qasevetniñ ketkizilüvi -
          ceennem, ölüm qorqusınıñ ve dünya qasevetiniñ ortadan qaldırıluvıdır).
        cid: 0
  - verse: 35
    segments:
      - text: >
          O (Rabb) ki, lütfinen bizni asıl oturılacaq yurtqa (cennetke) yerleştirdi. Artıq
          o yerde bizge ne bir yorğunlıq toqunacaq, ne de o yerde bizge bir usanmaq
          kelecek.
        cid: 0
  - verse: 36
    segments:
      - text: >
          İnkâr etkenlerge de ceennem ateşi bar. Öldürilmezler ki, ölsinler, ceennem azabı
          da, olarğa biraz olsa bile, yengilleştirilmez. İşte, biz, küfürde ileri ketken
          er nankorni böyle cezalandırırmız.
        cid: 0
  - verse: 37
    segments:
      - text: >
          Olar o yerde: Rabbimiz! Bizni çıqar, (evelde) yapqanımıznıñ yerine yahşı işler
          yapayıq! diye feryad eterler. Sizge tüşünecek kimseniñ tüşüne bilecegi qadar bir
          ömür bermedikmi? Sizge tenbiyeci de kelmedimi? (Niçün inanmadıñız?) Şimdi
          tatıñız (azapnı)! zalımlarnıñ yardımcısı yoqtır. («Kelgen tenbiyeci» -
          peyğamberler ve kitaplardır. Bazılar bu tenbiyecini aqıl, qartlıq ve
          yaqınlarınıñ ölümi diye izaatlağanlar).
        cid: 0
  - verse: 38
    segments:
      - text: >
          Allah köklerniñ ve yerniñ ğaybını bilir. O qalplerniñ içinde ne bar ise, onı da
          haqqı ile bilicidir. («Köklerniñ ve yerniñ ğaybı» - o yerde ceryan etken ve
          körünmegen qanunlar, nizamlar ve sistemelardır).
        cid: 0
  - verse: 39
    segments:
      - text: >
          Sizni yer yüzünde halifeler yapqan Odır. Şunıñ içün, kim inkâr etse, inkârı öz
          zararınadır. Kâfirlerniñ küfüri Rabbleri qatında olar içün ancaq ğadapnı
          arttırır. Kâfirlerniñ küfüri kendilerine ziyandan başqa bir şey ketirmez.
        cid: 0
  - verse: 40
    segments:
      - text: >
          De ki: Allahnı bıraqıp da, tabınğan ortaqlarıñıznı kördiñizmi? Kösteriñ maña?
          Olar yerdeki angi şeyni yarattılar! Yoqsa, olarnıñ köklerde bir ortaqları barmı!
          Yahut biz olarğa, (bu hususta) bir kitap berdik de, olar o kitaptaki bir delilge
          esaslanmaqtalarmı? Yoq! O zalımlar bir-birlerine aldatuvdan başqa bir şey vade
          etmeyler.
        cid: 0
  - verse: 41
    segments:
      - text: >
          Şübesiz, Allah köklerni ve yerni nizamları bozulmasın, diye tutmaqta. Ant olsun
          ki, olarnıñ nizamı eger bir bozulsa, Özünden başqa iç kimse olarnı tutalmaz.
          Şübesiz, O, halimdir, çoq bağışlayıcıdır.
        cid: 0
  - verse: 42
    segments:
      - text: >
          Özlerine bir tenbiyeci (peyğamber) kelir ise, er angi bir milletten daa çoq
          doğru yolda olacaqlarına dair, bütün küçlerinen Allahqa yemin etken ediler.
          Faqat olarğa tenbiyeci (Muhammed) kelgeninen, bu, olarnıñ haqtan
          uzaqlaşuvlarından başqa bir şeyni arttırmadı.
        cid: 0
  - verse: 43
    segments:
      - text: >
          Çünki, olar yer yüzünde büyüklik taslamaqta ve yaman tuzaqlar qurmaqta ediler.
          Albuki, insan qazğan çuqurına özü tüşer. Olar evelkilerniñ qanunından (olarğa
          tedbiq etilgeninden) başqasını beklemektelermi? Allahnıñ qanunında asla bir
          deñişme tapalmazsıñ, Allahnıñ qanunında kesen-kes bir sapıqlıq da tapalmazsıñ.
        cid: 0
  - verse: 44
    segments:
      - text: >
          Bular yer yüzünde kezip de, özlerinden evelkilerniñ soñu nasıl olğanını
          körmedilermi? Albuki, olar, bulardan daa küçlü ediler. Ne köklerde, ne de yerde
          Allahnı aciz bıraqacaq bir küç bar. O, bilicidir, küçlüdir.
        cid: 0
  - verse: 45
    segments:
      - text: >
          Eger Allah, yapqanları sebebinden, insanlarnı (aman) cezalandırsa edi, yer
          yüzünde iç bir canlı yaratılğan qaldırmaz edi. Faqat Allah olarnı belli bir
          müddetke qadar keçiktirmekte. Vaqıtları kelgeninen (keregini yapar). Şübesiz,
          Allah qullarını körmektedir.
        cid: 0
