surah_id: 78
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >
          Bir-birilerinden neni soraylar?
        cid: 0
  - verse: 2
    segments:
      - text: >
          (İnanıp-inanmamaqta) ihtilâfqa töşken büyük habernimi?
        cid: 0
  - verse: 3
    segments:
      - text: >
          [2 ayetine baq.]
        cid: 0
  - verse: 4
    segments:
      - text: >
          Yoq! Añlaycaqlar!
        cid: 0
  - verse: 5
    segments:
      - text: >
          Kene yoq! Olar añlaycaqlar!
        cid: 0
  - verse: 6
    segments:
      - text: >
          Biz yer yüzüni bir töşek, dağlarnı da birer qazıq yapmadıqmı?
        cid: 0
  - verse: 7
    segments:
      - text: >
          [6 ayetine baq.]
        cid: 0
  - verse: 8
    segments:
      - text: >
          Sizni çift-çift yarattıq.
        cid: 0
  - verse: 9
    segments:
      - text: >
          Yuquñıznı bir raatlanuv yaptıq.
        cid: 0
  - verse: 10
    segments:
      - text: >
          Geceni bir örtü yaptıq.
        cid: 0
  - verse: 11
    segments:
      - text: >
          Kündüzni de çalışıp qazanuv vaqtı ettik.
        cid: 0
  - verse: 12
    segments:
      - text: >
          Üstüñizde yedi qat sağlam kökler bina ettik.
        cid: 0
  - verse: 13
    segments:
      - text: >
          (O yerde) alev-alev yanğan bir qandil yarattıq.
        cid: 0
  - verse: 14
    segments:
      - text: >
          Sizge urluqlar, ösümlikler (tereklerni), bir-birilerine bitişik bağlar-bağçalar
          yetiştirmek içün, üst-üstüne toplanıp sıqışqan bulutlardan şırıl-şırıl aqqan
          suvlar endirdik.
        cid: 0
  - verse: 15
    segments:
      - text: >
          [14 ayetine baq.]
        cid: 0
  - verse: 16
    segments:
      - text: >
          [14 ayetine baq.]
        cid: 0
  - verse: 17
    segments:
      - text: >
          Şübesiz, üküm künü - vaqıt olaraq tayin etilgendir.
        cid: 0
  - verse: 18
    segments:
      - text: >
          Suurğa üflengen künü, top-top Allahqa kelirsiñiz.
        cid: 0
  - verse: 19
    segments:
      - text: >
          Kök yüzü açılır ve o yerde qapular peyda olur;
        cid: 0
  - verse: 20
    segments:
      - text: >
          Dağlar yürütilir, ılğım alına kelir.
        cid: 0
  - verse: 21
    segments:
      - text: >
          Şübesiz, yoldan azğanlarnıñ barınacaq (sığınacaq yeri) ceennem pusuda
          beklemektedir.
        cid: 0
  - verse: 22
    segments:
      - text: >
          [21 ayetine baq.]
        cid: 0
  - verse: 23
    segments:
      - text: >
          (Yoldan azğanlar) o yerde asırlar boyu qalırlar, o yerde bir serinlik ya da
          (suvsızlıq ketkizgen) bir içimlik tatmazlar, ancaq (dünyada yapqanlarına) uyğun
          qarşılıq olaraq, qaynaq suv ve irin tatarlar.
        cid: 0
  - verse: 24
    segments:
      - text: >
          [23 ayetine baq.]
        cid: 0
  - verse: 25
    segments:
      - text: >
          [23 ayetine baq.]
        cid: 0
  - verse: 26
    segments:
      - text: >
          [23 ayetine baq.]
        cid: 0
  - verse: 27
    segments:
      - text: >
          Çünki, olar ceza kününiñ (kelecegini) ümüt etmez ediler.
        cid: 0
  - verse: 28
    segments:
      - text: >
          Bizim ayetlerimizni yalanlağandan-yalanlağan ediler.
        cid: 0
  - verse: 29
    segments:
      - text: >
          Biz ise, er şeyni bir kitapta sayıp yazğandırmız.
        cid: 0
  - verse: 30
    segments:
      - text: >
          Tatıñ! Bundan soñ ancaq azabıñıznı arttıracaqmız.
        cid: 0
  - verse: 31
    segments:
      - text: >
          Şübesiz, taqva saipleri içün ümüt etilgenni tapqan yerleri - bağçalar, yüzüm
          bağları, köküsleri ğonce kibi qabarğan aqrandaş qızlar, içki tolu qadeler
          bardır.
        cid: 0
  - verse: 32
    segments:
      - text: >
          [31 ayetine baq.]
        cid: 0
  - verse: 33
    segments:
      - text: >
          [31 ayetine baq.]
        cid: 0
  - verse: 34
    segments:
      - text: >
          [31 ayetine baq.]
        cid: 0
  - verse: 35
    segments:
      - text: >
          Olar o yerde ne boş bir laqırdı, ne de yalan eşitirler.
        cid: 0
  - verse: 36
    segments:
      - text: >
          Bular Rabbiñniñ yeterli bir ihsanı, mükâfatıdır.
        cid: 0
  - verse: 37
    segments:
      - text: >
          O, köklerniñ, yerniñ ve ekisi arasında olğanlarnıñ Rabbidir. O, rahmandır. O
          künü insanlar Oña qarşı qonuşmağa izinli degildirler.
        cid: 0
  - verse: 38
    segments:
      - text: >
          Ruh (Cebrail) ve melekler saf-saf olup turğan künü, Rahman izin bergenlerinden
          başqaları laqırdı etalmazlar; laf etken de, doğrusını söyler.
        cid: 0
  - verse: 39
    segments:
      - text: >
          İşte, o kesen-kes kelecek kündir. O alda, istegen insan Rabbisine barğan bir yol
          tutsın.
        cid: 0
  - verse: 40
    segments:
      - text: >
          Biz, yaqın bir azaptan sizni tenbiyeledik. O künü insan evelden yapqanlarına
          baqcaq ve inkârcı kimse: «Keşke topraq olsam edi!» deycek.
        cid: 0
