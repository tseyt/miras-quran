  - verse: 7
    segments:
      - text: "Artıq bundan soñ ceza kunü mevzusında seni kim yalanlay bilir?"
        cid: 0
  - verse: 8
    segments:
      - text: "Allaһ - uküm bericilerniñ eñ ustüni degilmi?"
