        cid: 0
  - verse: 7
    segments:
      - text: >
          Artıq bundan soñ ceza künü mevzusında seni kim yalanlay bilir?
        cid: 0
  - verse: 8
    segments:
      - text: >
          Allah - üküm bericilerniñ eñ üstüni degilmi?
        cid: 0
