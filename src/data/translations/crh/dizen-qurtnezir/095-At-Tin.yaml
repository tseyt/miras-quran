surah_id: 95
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "İncirge, zeytunğa, Sina dağına ve şu emin bolgege yemin eterim ki, biz insannı eñ guzel biçimde yarattıq. Soñ onı aşşağılarnıñ aşşağısına endirdik. (Allaһ Taalâ insannı, ruh ve beden qabiliyetleri noqtai nazarından, canlılarnıñ eñ mukemmeli yapqan. Surede «eñ guzel biçimde yarattıq» ifadesi bu hususnı añlatmaqta. İnsan serbest iradesinen, ya bu qabiliyetlerni guzel qullanaraq, «kâmil insan» olacaq, ya da aks tarafnı tutaraq, şuurl barlıqlarnıñ ve canlılarnıñ eñ aşşağı mertebesinden yer alacaq)."
        cid: 0
  - verse: 6
    segments:
      - text: "Faqat iman etip, salih amel işegenler içün, eksilmegen, devamlı bir ecir bar."
        cid: 0
  - verse: 7
    segments:
      - text: "Artıq bundan soñ ceza kunü mevzusında seni kim yalanlay bilir?"
        cid: 0
  - verse: 8
    segments:
      - text: "Allaһ - uküm bericilerniñ eñ ustüni degilmi?"
        cid: 0