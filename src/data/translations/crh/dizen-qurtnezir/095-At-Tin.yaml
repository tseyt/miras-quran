surah_id: 95
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: İncirge,
        cid: 1
      - text: zeytunğa,
        cid: 2
      - text: >-
          Sina dağına ve şu emin bölgege yemin eterim ki, biz insannı eñ güzel biçimde
          yarattıq. Soñ onı aşşağılarnıñ aşşağısına endirdik. (Allah Taalâ insannı, ruh ve
          beden qabiliyetleri noqtai nazarından, canlılarnıñ eñ mükemmeli yapqan. Surede «eñ
          güzel biçimde yarattıq» ifadesi bu hususnı añlatmaqta. İnsan serbest iradesinen, ya
          bu qabiliyetlerni güzel qullanaraq, «kâmil insan» olacaq, ya da aks tarafnı tutaraq,
          şuurlı barlıqlarnıñ ve canlılarnıñ eñ aşşağı mertebesinden yer alacaq).
        cid: 0
