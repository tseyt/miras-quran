      - text: ayetlerinden bir qısmını
        cid: 4
      - text: kördi.
        cid: 2
      - text: >-
          (Sure yıldızğa yeminnen başlanğan. Bu «yıldız» - yıldız cınsı, Sureyya yıldızı,
          Qur'an ayetleri ve Az. Peyğamber şeklinde añlatılğan. Yıldıznıñ batuvı ve doğuvı
          qıyamet kününen tefsir etilgen. Qur'an özüne vahiy etilgen Az. Peyğamber, doğru
          yoldan sapmağan ve batılğa inanmağan. Oña engen Qur'an vahiyge esaslanmaqtadır.
          Vahiy ketirgen Cebrail (a.s.)dır. İşte, bu melek bir qaç kere aslıy suretinde Az.
          Peyğamberge körüngen. Aralarındaki mesafeniñ, ayette de bildirilgeni kibi, pek yaqın
          bir vaqıtta, Cebrail vahiy etilgenlerni Peyğamberimizge bildirgen. Az. Peyğamberniñ
          Cebrailnen körüşüvi Sidretu'l-Muntehaada olğan edi. Bazıları da, Peyğamberimizniñ bu
          yerde körgeni Cenab-ı Haq olğanını da ileri süreler. Sidretu'l-Muntehaa - soñki
          terek, yani yaratılğan alemniñ soñki noqtası demektir. Bundan başqası Allahnıñ ğayb
          alemidir. Cennetu'l- Me'vaa da - melekler, şeitler ve muttaqiylerniñ ruhları olğan
          yerdir. Sidredekilerni tarif ve tavsif etmek mümkün degil. Sidreni qaplağannıñ -
          melekler ya da Allahnıñ nurı olğanı rivayet etile).
        cid: 0
