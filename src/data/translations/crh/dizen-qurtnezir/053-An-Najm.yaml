surah_id: 53
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >-
          Batqan vaqtında yıldızğa ant olsun ki, arqadaşıñız (Muһammed) sapmadı ve
          batılğa inanmadı; o arzusına kore de laf etmez.
        cid: 0
  - verse: 2
    segments:
      - text: >-
          [1 ayetine baq.]
        cid: 0
  - verse: 3
    segments:
      - text: >-
          [1 ayetine baq.]
        cid: 0
  - verse: 4
    segments:
      - text: >-
          O (bildirgenleri) vahiy etilgenden başqa şey degil.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Çünki, onı kuçlü-quvetli ve ustün yaratılışlı biri (Cebrail) ogretti. Soñra eñ
          yuksek ufuqta olğanda, asıl şeklinen doğruldı.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          [5 ayetine baq.]
        cid: 0
  - verse: 7
    segments:
      - text: >-
          [5 ayetine baq.]
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Soñra (Muһammedge) yaqınlaştı, derken, daa da yaqınlaştı. O qadar ki
          (birleştirilgen) eki yay arası qadar, atta daa da yaqın oldı.
        cid: 0
  - verse: 9
    segments:
      - text: >-
          [8 ayetine baq.]
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Bunıñ uzerine, Allaһ qulına vahiyini bildirdi. (Kozlerinen) korgenini qalbi
          yalanlamadı.
        cid: 0
  - verse: 11
    segments:
      - text: >-
          [10 ayetine baq.]
        cid: 0
  - verse: 12
    segments:
      - text: >-
          Onıñ korgenleri aqqında şimdi onıñnen tartışacaqsıñızmı?
        cid: 0
  - verse: 13
    segments:
      - text: >-
          Ant olsun, onı Sidretu’l-Muntehaanıñ yanında evelde bir kere daa korgen edi.
        cid: 0
  - verse: 14
    segments:
      - text: >-
          [13 ayetine baq.]
        cid: 0
  - verse: 15
    segments:
      - text: >-
          Cennetu’l-Me’vaa da onıñ yanındadır.
        cid: 0
  - verse: 16
    segments:
      - text: >-
          Sidreni qaplağan qaplamış edi.
        cid: 0
  - verse: 17
    segments:
      - text: >-
          Kozü qıyığından baqmadı ve sıñırnı aşmadı.
        cid: 0
  - verse: 18
    segments:
      - text: >-
          Ant olsun, o Rabbiniñ eñ buyuk ayetlerinden bir qısmını kordi. (Sure yıldızğa
          yeminnen başlanğan. Bu «yıldız» - yıldız cıinsı, Sureyya yıldızı, Qur’an
          ayetleri ve Az. Peyğamber şeklinde añlatılğan. Yıldıznını batuvı ve doğuvı
          qıyamet kunünen tefsir etilgen. Qur’an ozüne vahiy etilgen Az. Peyğamber, doğru
          yoldan sapmağan ve batılğa inanmağan. Oña engen Qur’an vahiyge esaslanmaqtadır.
          Vahiy ketirgen Cebrail (a.s.)dır. İşte, bu melek bir qaç kere asly suretinde Az.
          Peyğamberge korüngen. Aralarındaki mesafeniñ, ayette de bildirilgeni kibi, pek
          yaqın bir vaqıtta, Cebrail vahiy etilgenlerni Peyğamberimizge bildirgen. Az.
          Peyğamberniñ Cebrailnen korüşüvi Sidretu’lMuntehaada olğan edi. Bazıları da,
          Peyğamberimizniñ bu yerde korgeni Cenab-ı Haq olğanını da ileri süreler.
          Sidretu’l-Muntehaa - soñki terek, yani yaratılğan alemniñ soñki noqtası
          demektir. Bundan başqası Allaһnıñ ğayb alemidir. Cennetu’l- Me’vaa da -
          melekler, şeitler ve muttaqiylerniñ ruhları olğan yerdir. Sidredekilerni tarif
          ve tavsif etmek mumkün degil. Sidreni qaplağannıñ - melekler ya da Allaһnıñ nurı
          olğanı rivayet etile).
        cid: 0
  - verse: 19
    segments:
      - text: >-
          Kordiñizmi o Laat ve Uzzaanı?
        cid: 0
  - verse: 20
    segments:
      - text: >-
          Ve uçüncileri olğan o birini, Menaatnı.
        cid: 0
  - verse: 21
    segments:
      - text: >-
          Demek, erkek sizge, ırğaçı Oña, oylemi?
        cid: 0
  - verse: 22
    segments:
      - text: >-
          O vaqıtta bu, insafsızca bir taqsimattır!
        cid: 0
  - verse: 23
    segments:
      - text: >-
          Bular (putlar), sizler ve atalarıñız taqqan isimlerden başqa bir şey degil.
          Allaһ olar aqqında iç bir delil endirmegen. Olar, ancaq zanğa ve nefisleriniñ
          arzusına uymaqtalar. Albuki, olarğa Rabbleri tarafından yol kosterici kelgendir.
        cid: 0
  - verse: 24
    segments:
      - text: >-
          Yoqsa, insan er arzu etken şeyine saip olacaqmı?
        cid: 0
  - verse: 25
    segments:
      - text: >-
          Ahiret de, dünya da, Allaһnıñdır.
        cid: 0
  - verse: 26
    segments:
      - text: >-
          Koklerde nice melek bar ki, olarnıñ şefaatları, tilegen ve hoşnut olğan kimse
          içün, Allaһnıñ izin berüvinden ğayrı, bir işke yaramaz.
        cid: 0
  - verse: 27
    segments:
      - text: >-
          Ahiretke inanmağanlar meleklerge ırğaçılarnıñ adlarını taqmaqtalar.
        cid: 0
  - verse: 28
    segments:
      - text: >-
          Albuki, olarnıñ bu hususta iç bilgileri yoqtır. Sadece zanğa uymaqtalar. Zan
          ise, iç şubesiz, aqiqat noqtai nazarından, iç bir şey ifade etmez.
        cid: 0
  - verse: 29
    segments:
      - text: >-
          Şunıñ içün, sen bizni añuvdan yuz çevirgen ve dünya ayatından başqa bir şey
          istemegen kimselerge yuz berme.
        cid: 0
  - verse: 30
    segments:
      - text: >-
          İşte, olarnıñ irişe bilecek bilgileri budır. Şubesiz ki, seniñ Rabbiñ, ebet O,
          yolundan sapqannı daa yahşı bilir; O, hidayette olğannı da çoq yahşı bilir.
        cid: 0
  - verse: 31
    segments:
      - text: >-
          Koklerde ve yerde olğanlar ep Allaһnıñdır. Bu, Allaһnıñ yamanlıq etkenlerni
          yapqanlarınen cezalandıruvı, guzel areket etkenlerni de daa guzelinen
          mukâfatlandıruvı içündir.
        cid: 0
  - verse: 32
    segments:
      - text: >-
          Ufaq-tüfek qusurları istisna, buyuk gunahlardan ve edepsizliklerden
          qaçınğanlarğa kelgende, bil ki, Rabbiñniñ avfı boldır. O, sizni daa topraqtan
          yaratqan vaqtında ve siz analarıñıznıñ qarınlarında bulunğan sırañızda (bile),
          sizni eñ yahşı bilicidir. Şunıñ içün ozüñizni temizge çıqarmañ. Çünki, O,
          yamanlıqtan saqınğannı daa yahşı bilir. (Az. Ademniñ topraqtan yaratılğanı,
          insannıñ ana qarnındaki vaziyeti, aslındaki zayıflığı ve acizligi
          hatırlatılaraq, ozüni begenip, ğururğa qapılmaması istenilgendir).
        cid: 0
  - verse: 33
    segments:
      - text: >-
          Kordiñmi artına qaytqannı?
        cid: 0
  - verse: 34
    segments:
      - text: >-
          Azaçıq berip, soñunda bermemekte tirelgenni?
        cid: 0
  - verse: 35
    segments:
      - text: >-
          Aceba, ğaybnıñ bilgisi oz yanında da, kormektemi? (33-35-nci ayetlerniñ
          musulman olğandan soñ, muşriklikke döngen Veliid b. Muğiire aqqında engeni
          rivayet etile).
        cid: 0
  - verse: 36
    segments:
      - text: >-
          Yoqsa, Musanıñ ve ahtına vefa kostergen İbrahimniñ saifelerinde yazılğanlar oña
          haber berilmedimi?
        cid: 0
  - verse: 37
    segments:
      - text: >-
          [36 ayetine baq.]
        cid: 0
  - verse: 38
    segments:
      - text: >-
          Aqiqaten, iç bir gunahkâr başqasınıñ gunah yuküni yuklenalmaz.
        cid: 0
  - verse: 39
    segments:
      - text: >-
          Bilsin ki, insan içün oz çalışmasından başqa bir şey yoqtır.
        cid: 0
  - verse: 40
    segments:
      - text: >-
          Ve çalışuvı da, ileride korülecek.
        cid: 0
  - verse: 41
    segments:
      - text: >-
          Soñunda oña qarşılığı tas-tamam berilecek.
        cid: 0
  - verse: 42
    segments:
      - text: >-
          Ve, şubesiz, eñ soñki baruv Rabbiñyedir. (Ayetlerde insannı esasen başqasınıñ
          yapqanından bir fayda kormeycegi, çünki er kesniñ ozü içün çalşiqanı, çalşuvnı
          neticeleri qıyamette korülecegi hatırlatıla).
        cid: 0
  - verse: 43
    segments:
      - text: >-
          Doğrusı, kuldirgen de, ağlatqan da, Odır.
        cid: 0
  - verse: 44
    segments:
      - text: >-
          Oldürgen de, tiriltken de Odır.
        cid: 0
  - verse: 45
    segments:
      - text: >-
          Şu yeri muaqqaq ki, (rahimge) qoyulğanda nutfeden, erkek ve ırğaçıdan ibaret
          olğan eki çiftni O yarattı.
        cid: 0
  - verse: 46
    segments:
      - text: >-
          [45 ayetine baq.]
        cid: 0
  - verse: 47
    segments:
      - text: >-
          Şubesiz, tekrar tiriltmek de Oña aittir.
        cid: 0
  - verse: 48
    segments:
      - text: >-
          Zengin etken de, yoqsul yapqan da, Odır. (Ayetniñ ekinci qısımına «itiyacdan
          qurtarğan» manası da berilgen).
        cid: 0
  - verse: 49
    segments:
      - text: >-
          Doğrusı, Şi’raa yıldızınıñ Rabbi de, Odır. (Şi’raa - Huzaa qabilesi tabınğan
          parlaq bir yıldızdır).
        cid: 0
  - verse: 50
    segments:
      - text: >-
          Ve, şubesiz ki, evelki Aad qavmını O elâk etti.
        cid: 0
  - verse: 51
    segments:
      - text: >-
          Semuudnı da (O elâk etti) ve artta iç bir şey qaldırmadı.
        cid: 0
  - verse: 52
    segments:
      - text: >-
          Daa evelde çoq zalım ve ziyade adden aşqan Nuһ qavmını (elâk etken edi).
        cid: 0
  - verse: 53
    segments:
      - text: >-
          Alt-ust olğan şeerlerni de, O boyle yaptı.
        cid: 0
  - verse: 54
    segments:
      - text: >-
          Olarnıñ başına ketirecegini ketirdi!
        cid: 0
  - verse: 55
    segments:
      - text: >-
          Şimdi Rabbiñniñ nimetleriniñ angisinde şubege tüşersiñ.
        cid: 0
  - verse: 56
    segments:
      - text: >-
          İşte, bu, ilk tenbiyecilerden bir tenbiyecidir. (Üqarıdaki ayetlerde zikr
          etilgen Aad, Semuud, Nuһ ve Luut qavmları inkârları ve isyanlarını cezasını elâk
          etilerek çekkenlerdir. Bular içinde Az. Nuһnı qavmı, Aad ve Semuuddan daa zalım
          ve yoldan azğan bir toplulıq edi. Çünki, Az. Nuһ aralarında uzun yıllar qalğanı
          alda, oña inanmağanlar ve olğanı qadar eziyet yapqan ediler. Az. Luut qavmını
          elâk etilüvi, bu qavmnı qasabaları kokke savurılğandan soñ, taşlanaraq, yernen
          bir etilüvnen kerçekleşken edi).
        cid: 0
  - verse: 57
    segments:
      - text: >-
          Yaqlaşqan yaqlaştı.
        cid: 0
  - verse: 58
    segments:
      - text: >-
          Onı (vaqıtnı) Allaһtan başqa aşkâr etecek yoq.
        cid: 0
  - verse: 59
    segments:
      - text: >-
          Şimdi siz bu sözge (Qur’anğa) şaşmaqtasıñızmı?
        cid: 0
  - verse: 60
    segments:
      - text: >-
          Kulmektesiñiz de, ağlamaysıñız!
        cid: 0
  - verse: 61
    segments:
      - text: >-
          Ve siz ğaflet içinde eglenmektesiñiz.
        cid: 0
  - verse: 62
    segments:
      - text: >-
          Aydı, Allaһqa secde etip, Oña qullıq etiñ!
        cid: 0