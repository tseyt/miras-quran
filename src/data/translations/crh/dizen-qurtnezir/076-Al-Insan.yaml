surah_id: 76
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "İnsannıñ uzerinden, alâ onıñ añılmağa degerli olmağan, uzun bir devir keçmedimi?"
        cid: 0
  - verse: 2
    segments:
      - text: "Aqiqat şu ki, biz insannı qarışıq bir nutfeden (erkek ve qadınnıñ tölünden) yarattıq; onı imtian eteyik diye, onı eşitici ve korüci yaptıq."
        cid: 0
  - verse: 3
    segments:
      - text: "Şubesiz, biz oña (doğru) yolnı kosterdik. İster şukür etici olsun, ister nankor."
        cid: 0
  - verse: 4
    segments:
      - text: "Doğrusı, biz kâfirler içün zıncırlar, demir alqalar ve alevli bir ateş azırladıq."
        cid: 0
  - verse: 5
    segments:
      - text: "Eyiler ise, kaafuur qoşulğan bir qadeden (cennet şarabı) içerler."
        cid: 0
  - verse: 6
    segments:
      - text: "(Bu,) Allaһnıñ seçilmiş qullarınıñ içkenleri ve aqqanda aqqan çoqraqtır."
        cid: 0
  - verse: 7
    segments:
      - text: "O qullar, şiddeti er yerge yayılğan bir kunden qorqaraq, bergen sözlerini yerine ketirirler."
        cid: 0
  - verse: 8
    segments:
      - text: "Olar oz canları çekkenine rağmen, yemekni yoqsulğa, yetimge ve esirge aşatırlar. (Ayetniñ «alâa һubbiһi» qısımına, «oz canları istegenine rağmen» yerine «Allaһ sevgisinen» manası da berile bilir)."
        cid: 0
  - verse: 9
    segments:
      - text: "«Biz sizni Allaһ rizası içün toyurmaqtamız; sizden ne bir qarşılıq, ne de bir teşekkür beklemektemiz»."
        cid: 0
  - verse: 10
    segments:
      - text: "«Biz çetin ve belâlı bir kunde Rabbimizden (Onıñ azabına oğramaktan) qorqarmız» (derler)."
        cid: 0
  - verse: 11
    segments:
      - text: "İşte, bu sebepten, Allaһ olarnı o kunniñ fenalığından qorçalar; (üzlerine) parlaqlıq, (goñyullerine) sevinç berir."
        cid: 0
  - verse: 12
    segments:
      - text: "Sabır etkenlerine qarşılıq olarğa cennetni ve (cenneteki) ipeklerni lütf eter."
        cid: 0
  - verse: 13
    segments:
      - text: "O arada kursilerge qurulğan olaraq bulunırlar; ne yaqıcı sıcaq korülir o yerde, ne de buzlatıcı suvuq."
        cid: 0
  - verse: 14
    segments:
      - text: "(Cennet terekleriniñ) kolgeleri uzerlerine sarqar; qolaylıqnen qoparıla bilgen meyvaları faydalanuvlarına taqdim etilir."
        cid: 0
  - verse: 15
    segments:
      - text: "Yanlarında, kumüş savutlar ve bullür qadelernen, kumüş beyazlığında (bullür kibi) şeffaf taslar dolaşılır ki, saqiyler bunı (cennet şarabını) belli olçüge kore tayin ve taqdir eterler. (Tefsirciler cennet savutları, taslarnıñ kumüş ve bullürnen tanıtıluvınıñ, sadece bilinmegenni bilingennen añlatmaq maqsadında yapılğan bir beñzetüv olğanını ifade eteler. Bunıñ kibi, Abdullah b. Abbas, «Cenneteki nimetlernen dünyadakiler arasında isimlerinden baiqa bir beñzerlik yoqtır», degen)."
        cid: 0
  - verse: 16
    segments:
      - text: "[15 ayetine baq.]"
        cid: 0
  - verse: 17
    segments:
      - text: "Olarğa o yerde bir tastan içirilir ki, (bu şarapnıñ) qarışmasında zencefil (inbir) bardır."
        cid: 0
  - verse: 18
    segments:
      - text: "(Bu şarap) o yerde bir çoqraqtandır ki, adı Selsebildir."
        cid: 0
  - verse: 19
    segments:
      - text: "O insanlarnıñ etrafında oyle olümsiz genç nedimler dolaşır ki, olarnı korgeniñde, etrafqa saçılıp-dağılğan inciler dersiñ."
        cid: 0
  - verse: 20
    segments:
      - text: "Angi tarafqa baqsañ baq, (yığınnen) nimet ve ulu bir saltanat korersiñ."
        cid: 0
  - verse: 21
    segments:
      - text: "Uzerlerinde yeşil ipekten ince ve qalın urbalar bardır; kumüş bilezlikler taqqandırlar. Rabbleri olarğa ter-temiz bir içki içirir."
        cid: 0
  - verse: 22
    segments:
      - text: "(Olarğa boyle denilir:) Bu, siz içün bir mukâfattır. Siziñ ğayretiñiz qarşılığını bulğandır."
        cid: 0
  - verse: 23
    segments:
      - text: "(Resulım!) Qur’annı saña biz, ebet biz endirdik."
        cid: 0
  - verse: 24
    segments:
      - text: "Artıq Rabbiñniñ ukmine (boyun egip) sabır et; olardan iç bir gunahkârğa yahut iç bir nankorge boyun egme."
        cid: 0
  - verse: 25
    segments:
      - text: "Saba-aqşam Rabbiñniñ adını hatırla."
        cid: 0
  - verse: 26
    segments:
      - text: "Geceniñ bir qısmında Oña secde et; geceniñ uzun bir bolüminde de, Onı tesbih et. (Bazı tefsirciler beyan etkenlerine kore, 25-nci ayette saba, uyle ve ekindi namazlarına, 26-nci ayetniñ ilk cumlesinde aqşam ve yatsı namazına, ekinci cumlesinde ise, Peyğamber Efendimizge farz olğan teheccut namazına işaret etilgen)."
        cid: 0
  - verse: 27
    segments:
      - text: "Bu insanlar, çar-çabuk keçken dünyanı sevmekteler de, oglerindeki çetin bir kunni (ahiretni) itibarğa almamaqtalar (bıraqmaqtalar)."
        cid: 0
  - verse: 28
    segments:
      - text: "Olarnı biz yarattıq; olarnıñ yaratılışını sap-sağlam yaptıq. İstegenimizde (olarnı yoq eter) yerlerine beñzegenlerini ketirirmiz. (Ayetniñ soñki qısmı boyle de añlaşılğandır: «Eger istesek, olarnı elâk etermiz, aynı beden sağlığında yañıdan yaratırmızz». Bu manasınen ayet oldürgenden soñ, tekrar tiriltüvniñ, Allaһnıñ qudreti dahilinde olğanını añlata)."
        cid: 0
  - verse: 29
    segments:
      - text: "Şubesiz ki, bu bir ogüttir. Artıq istegen Rabbisine bir yol tutar."
        cid: 0
  - verse: 30
    segments:
      - text: "Sizler, ancaq Rabbiñizniñ istemesi (izin bermesi) sayesinde (bir şeyni) isteye bilirsiñiz. Şubesiz, Allaһ er şeyni bilici, ikmet saibidir."
        cid: 0
  - verse: 31
    segments:
      - text: "O, istegenini rahmetine qavuştırır. zalımlarge kelgende, olar içün elem berici bir azap azırlağandır."
        cid: 0