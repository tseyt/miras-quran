          itibarınen fasılaları, surelerniñ evel ve ahırları ayırdı etilgendir. v) Manası
          itibarınen vadeleri, tehditleri, qıssaları, ükümleri, misalleri, ögütleri...
          ayrı-ayrı beyan etilerek, aşkârlıqqa qavuştırılğandır).
