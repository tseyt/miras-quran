        cid: 0
  - verse: 70
    segments:
      - text: "Siz ve zevceleriñiz, sevinç ve neşeli alda cennetke kiriñiz! 71-73. Olarğa altın tepsiler ve qadeler dolaştırılır. O yerde canları istegen, kozleri oşlanğan er şey bardır. Ve olarğa: Siz o yerde ebediy qalacqsıñız, işte yapqanlarıñızğa qarşılıq sizge miras berilgen cennet budır. O yerde siz içün bol-bol meyvalar bar, olardan aşarsıñız, denilir. 74-75. Şubesiz, qbaatlılar ceennem azabında devamlı qalacaqlar, azapları yengilleştirilmeycek. Olar azap içinde qurtulıştan umüt keskenlerdir. (Bu yerdeki qabaatl - Allaһnı inkâr etken ya da şirk qoşqanlardır)."
