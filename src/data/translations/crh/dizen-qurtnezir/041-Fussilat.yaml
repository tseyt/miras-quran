  - verse: 40
    segments:
      - text: "(Resulım!) Sağırlarğa sen eşitteredeksiñmi; yahut korlerni ve ap-açıq sapıqlıqta olğanlarnı doğru yolğa sen qavuştıracaqsıñmı?"
        cid: 0
  - verse: 41
    segments:
