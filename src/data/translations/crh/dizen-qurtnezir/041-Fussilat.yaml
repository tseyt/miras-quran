surah_id: 41
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >
          Haa. Miim.
        cid: 0
  - verse: 2
    segments:
      - text: >
          (Qur'an) rahman ve rahim olğan Allah qatından endirilgendir.
        cid: 0
  - verse: 3
    segments:
      - text: >
          (Bu,) bilgen bir qavm içün ayetleri arapça oqularaq, beyan etilgen bir kitaptır.
        cid: 0
  - verse: 4
    segments:
      - text: >
          Bu kitap müjdeleyici ve tenbiyecidir. Faqat olarnıñ çoqu yüz çevirdi. Artıq
          diñlemezler. (3-inci ayette keçken «fussılet» (izaatlanğan) kelimesi şu
          şekillerde izaat etilgen: a). Qur'annıñ ükümleri, qıssaları, vaazları açıq beyan
          buyurılğandır. b). Lâfzi itibarınen fasılaları, surelerniñ evel ve ahırları
          ayırdı etilgendir. v) Manası itibarınen vadeleri, tehditleri, qıssaları,
          ükümleri, misalleri, ögütleri... ayrı-ayrı beyan etilerek, aşkârlıqqa
          qavuştırılğandır).
        cid: 0
  - verse: 5
    segments:
      - text: >
          Ve dediler ki: Bizni çağırğan şeyiñe nisbeten qalplerimiz qapalıdır.
          Qulaqlarımızda da bir ağırlıq mevcut. Biznen seniñ aramızda bir perde
          bulunmaqta. Şunıñ içün sen (istegeniñni) yap, biz de yapmaqtamız! (Qureyş, bu
          sözlerinen Qur'annı diñlemekten qaçınaraq, Az. Peyğambernen aralarındaki din
          ihtilâfını aşkâr etmekte ve Allahnıñ Resulı Qur'an oqup, Allahqa çağırğan
          vaqıtta, onıñnen alay ete edi).
        cid: 0
  - verse: 6
    segments:
      - text: >
          De ki: Men de, ancaq siz kibi bir insanım. Maña ilâhıñıznıñ tek bir ilâh olğanı
          vahiy olunmaqta. Artıq Oña yöneliñ, Ondan mağfiret isteñ. Ortaq qoşqanlarnıñ
          alına vay! («Allahqa yönelmek» iman, itaat, tevhid, ibadet ve ihlâsnen
          mümkündir. Aynı zamanda, şeytannıñ telqinlerine uymamaq, Allahnı bıraqıp, başqa
          dost ve uydırma şefaatçılar edinmemek, Allahqa yönelüvniñ temel şartlarıdır).
        cid: 0
  - verse: 7
    segments:
      - text: >
          Olar zekâtnı bermezler; ahiretni inkâr eticiler de olardır.
        cid: 0
  - verse: 8
    segments:
      - text: >
          Şübesiz, iman etip, yahşı iş yapqanlar içün, tükenmegen bir mükâfat bar.
        cid: 0
  - verse: 9
    segments:
      - text: >
          De ki: Aqiqaten, siz yerni eki künde yaratqannı inkâr etip, Oña ortaq
          qoşmaqtasıñızmı? O, alemlerniñ Rabbidir.
        cid: 0
  - verse: 10
    segments:
      - text: >
          O, yer yüzüne sabit dağlar yerleştirdi. O, yerde bereketler yarattı ve o yerde
          tamam dört künde istegenler içün, farqsız olaraq, ğıdalar taqdir etti.
        cid: 0
  - verse: 11
    segments:
      - text: >
          Soñ duman alında olğan kökke yöneldi, oña ve yer qurresine: İsteyerek ya da
          istemeyerek keliñ! dedi. Ekisi de, «isteyerek keldik», dediler. (Cenab-ı Haqnıñ
          «Yer ve kökte istegeni», er ekisiniñ de özlerine yüklengen vazifelerniñ keregini
          yerine ketirüvleridir).
        cid: 0
  - verse: 12
    segments:
      - text: >
          Böylece, olarnı eki künde yedi kök olaraq yarattı ve er kökke vazifesini vahiy
          etti. Ve biz, yaqın semanı qandillernen donattıq, bozuluvdan da qorçaladıq.
          İşte, bu, aziz, alim Allahnıñ taqdiridir. (Er kökke vazifesiniñ vahiy etilüvi,
          meleklerniñ, yıldızlarnıñ ve diger kök cısımlarınıñ, yaratıluv suretinen, er
          birine işleriniñ bildirilüvidir).
        cid: 0
  - verse: 13
    segments:
      - text: >
          Eger olar yüz çevirir iseler, de ki: İşte, sizni Aad ve Semuudnıñ başına kelgen
          qasırğağa beñzegen bir qasırğağa qarşı tenbiyelemektem!
        cid: 0
  - verse: 14
    segments:
      - text: >
          Peyğamberler olarğa: Öglerinden ve artlarından kelerek, Allahtan başqasına
          qullıq etmeñ, degen vaqıtlarında: «Rabbimiz tilese edi, elbette melekler endirir
          edi. Şunıñ içün, biz siznen yollanılğan şeylerni inkâr etmektemiz», degen
          ediler. (Bu qavmlarğa er devirde peyğamberler yollanılğanı ve peyğamberlerniñ
          olarnen yaqından alâqada olğanları añlaşıla).
        cid: 0
  - verse: 15
    segments:
      - text: >
          Aad qavmına kelgende, yer yüzünde aqsız yerde büyüklik tasladılar ve: Bizden daa
          quvetli kim bar? dediler. Olar özlerini yaratqan Allahnıñ, olardan daa quvetli
          olğanını körmedilermi? Olar bizim ayetlerimizni (mucizelerimizni) inkâr etmekte
          ediler.
        cid: 0
  - verse: 16
    segments:
      - text: >
          Bundan tolayı, biz de olarğa dünya ayatında zillet azabını tattırmaq içün o
          oğursız künlerde suvuq bir rüzgâr yolladıq. Ahiret azabı, elbette daa çoq rezil
          eticidir. Olarğa yardım da etilmez. («Oğursız künler» yollanılğan şiddetli
          fırtınanıñ ardı-arası kesilmeden, devam etkeni ve bu sebepten, qavmnıñ elâk
          olğan künleridir. Yoqsa, künlerniñ özünde oğursızlıq degen bir şey yoq).
        cid: 0
  - verse: 17
    segments:
      - text: >
          Semuudğa kelgende, olarğa doğru yolnı kösterdik, amma olar körlikni doğru yoldan
          üstün tuttılar. Böylece, yapayatqan fenalıqları sebebinden, alçaltıcı azapnıñ
          yıldırımı olarnı çarptı.
        cid: 0
  - verse: 18
    segments:
      - text: >
          İnanğanlarnı qurtardıq. Olar (Allahtan) qorqmaqta ediler.
        cid: 0
  - verse: 19
    segments:
      - text: >
          Allahnıñ duşmanları, ateşke sürülmek üzre, toplanğan künleri episi bir yerge
          ketirilirler.
        cid: 0
  - verse: 20
    segments:
      - text: >
          Niayet, o yerge kelgen vaqıtları qulaqları, közleri ve terileri, işlegen
          şeylerine qarşı olarnıñ aleyhine şaatlıq etecek.
        cid: 0
  - verse: 21
    segments:
      - text: >
          Terilerine: Niçün aleyhimizge şaatlıq ettiñiz? derler. Olar da: Er şeyni
          qonuştırğan Allah, bizni de qonuştırdı. İlk defa sizni O yaratqan. Kene Oña
          döndürilmektesiñiz, derler.
        cid: 0
  - verse: 22
    segments:
      - text: >
          Siz ne qulaqlarıñıznıñ, ne közleriñizniñ, ne de terileriñizniñ aleyhiñizge
          şaatlıq etüvinden saqınmay ediñiz, yapqanlarıñızdan çoqunı Allah bilmeycek
          belley ediñiz.
        cid: 0
  - verse: 23
    segments:
      - text: >
          Rabbiñiz aqqında beslegen zanıñız bar ya, işte sizni o mahv etti ve ziyanğa
          oğrağanlardan oldıñız.
        cid: 0
  - verse: 24
    segments:
      - text: >
          Şimdi eger dayana bilir iseler, olarnıñ yeri ateştir. Ve eger (tekrar dünyağa
          qaytıp Allahnı) hoşnut etmek ister iseler, memnün etilecek degiller.
        cid: 0
  - verse: 25
    segments:
      - text: >
          Biz olarğa bir taqım arqadaşlar musallat ettik de, olar öglerinde ve artlarında
          ne bar ise, episini bularğa süslü kösterdiler. Özlerinden evel kelip keçken
          cinler ve insanlar içün, (tedbiq olunğan) azap olarğa da, kerekli olğan.
          Şübesiz, olar ziyanğa tüşkenler edi. (Fena arqadaşlarnıñ inanmağanlarğa süslü
          köstergen şeyleri - dünya işleridir. Çünki, dünyanıñ yalıñız maddiy menfaat ve
          nefsaniy isteklerge uyğun tarafını körerler ve sadece onı isterler. Ahiret
          işlerini de artqa bıraqırlar. Tirilüv ve esapnı inkâr etmeknen raatlıqqa
          qavuşacaqlarını telqin eterler).
        cid: 0
  - verse: 26
    segments:
      - text: >
          İnkâr etkenler: Bu Qur'annı diñlemeñ, oqulğanda gürülti yapıñ. Belki,
          bastırırsıñız, dediler.
        cid: 0
  - verse: 27
    segments:
      - text: >
          O inkâr etkenlerge şiddetli bir azapnı tattıracaqmız ve olarnı yapqanlarınıñ eñ
          fenasınen cezalandıracaqmız.
        cid: 0
  - verse: 28
    segments:
      - text: >
          İşte, bu Allah duşmanlarınıñ cezası - ateştir. Ayetlerimizni inkâr etkenlerinden
          tolayı, o yerde olarğa ceza olaraq ebediy qalacaq yurtları (ceennem) bardır.
        cid: 0
  - verse: 29
    segments:
      - text: >
          Kâfirler ceennemde: Rabbimiz! Cinlerden ve insanlardan bizni sapıtqanlarnı bizge
          köster de, aşşalanğanlardan olsunlar diye, olarnı ayaqlarımıznıñ astına alayıq!
          deycekler.
        cid: 0
  - verse: 30
    segments:
      - text: >
          Şübesiz, Rabbimiz Allahtır dep, soñ dos-doğru yolda yürgenlerniñ üzerine
          melekler ener. Olarğa: Qorqmañ, kederlenmeñ, sizge vade olunğan cennetnen
          seviniñ! derler. (Melekler, ayette vasıfları bildirilgen mü'minlerge zikr
          etilgen müjdelerni ölüm sırasında berecekler. Dos-doğru yolda yürmek, imanda
          sebattır. Bunı Az. Ebu Bekir söz ve davranışnen nizamlı olmaq; Az. Umer
          munafıqlıq etmemek; Az. Osman amelde ihlaslı olmaq; Az. Ali farzlarnı eda etmek
          şeklinde yorumlağanlar. Meleklerniñ «qorqmañ» müjdesi, ölümniñ soñu ve keçmiş
          amellernen bağlıdır. «Kederlenmeñ» degen müjdeleri ise, artta bıraqılğan evlât
          ve ailene ile bağlıdır).
        cid: 0
  - verse: 31
    segments:
      - text: >
          Biz dünya ayatında da, ahirette de siziñ dostlarıñızmız. Ğafur ve rahim olğan
          Allahnıñ ikramı olaraq, o yerde siz içün canlarıñız çekken er şey bar ve istegen
          er şeyiñiz o yerde siz içün azırdır.
        cid: 0
  - verse: 32
    segments:
      - text: >
          [31 ayetine baq.]
        cid: 0
  - verse: 33
    segments:
      - text: >
          (İnsanlarnı) Allahqa çağırğan, yahşı iş yapqan ve «Men musulmanlardanım»,
          degenden kimniñ sözü daa güzel? (Ayette vasıfları añlatılğan zat Resulullah
          (s.a.)tır. Bazılarına köre, ayet mazinler aqqında nazil olğan. Allahnıñ davetine
          uyğan ve insanlarnı da uymağa davet etken er kesniñ de bu vasıfnıñ saibi olacağı
          bildirilgen).
        cid: 0
  - verse: 34
    segments:
      - text: >
          Yahşılıqnen yamanlıq bir olmaz. Sen eñ güzel bir şekilde (yamanlıqnıñ) ögüni al.
          O vaqıtta sennen arasında duşmanlıq olğan kimse sanki candan bir dost olur.
          (Yamanlıqnıñ ögü, eñ güzel hislet ne ise, onıñnen alınır. Meselâ, ğadapqa sabır,
          bilgisizlikke yımşaq tabiyat, fenalıqqa afu ile qarşılıq berilir).
        cid: 0
  - verse: 35
    segments:
      - text: >
          Buña (bu güzel davranışqa) ancaq sabır etkenler qavuştırılır; buña ancaq
          (hayırdan) büyük nasibi olğan kimse qavuştırılır. (Şeytandan kelgen yaman
          tüşünce, şeytannıñ insannı güzel tabiyat ve davranışlardan uzaqlaştırmaq içün
          vesvesedir).
        cid: 0
  - verse: 36
    segments:
      - text: >
          Eger şeytandan kelgen yaman bir tüşünce seni türtecek ise, aman Allahqa sığın,
          çünki, O, eşitici ve bilicidir.
        cid: 0
  - verse: 37
    segments:
      - text: >
          Gece ve kündüz, küneş ve ay Onıñ ayetlerindendir. Eger Allahqa ibadet etmek
          istey iseñiz, küneşke de, ayğa da secde etmeñ. Olarnı yaratqan Allahqa secde
          etiñ!
        cid: 0
  - verse: 38
    segments:
      - text: >
          Eger insanlar büyüklik taslar iseler, (bilsinler ki) Rabbiñniñ yanında bulunğan
          (melekler) iç usanmadan, gece-kündüz onı tesbih eterler.
        cid: 0
  - verse: 39
    segments:
      - text: >
          Seniñ yer yüzüni qup-quru körüviñ de, Allahnıñ ayetlerindendir. Biz onıñ üzerine
          suvnı endirgen vaqtımızda, areketke kelip qabarır. Oña can bergen, elbette
          ölülerni de tiriltir. O, er şeyge qadirdir.
        cid: 0
  - verse: 40
    segments:
      - text: >
          Ayetlerimiz aqqında doğrulıqtan ayırılıp, egirlikke sapqanlar bizge gizli
          qalmaz. O alda, ateşniñ içine atılğan daa eyidirmi, yoqsa, qıyamet künü işançnen
          kelgenmi? İstegeniñizni yapıñ! Şübesiz, O, yapqanlarñıznı körmekte. (Ayetler
          aqqında, doğrulıqtan ayırılıp, egrilikke sapmaq hususı, doğrunı yamanlamaq,
          bozmağa ıntılmaq, batıl yorumlavlarğa areket etmek ve manasız tartışuvlarğa
          kirişmek şeklinde yorumlanğan).
        cid: 0
  - verse: 41
    segments:
      - text: >
          Özlerine Kitap kelgende, onı inkâr etkenler (şübesiz, bunıñ neticesine
          qatlanacaqlar). Albuki, o aqransız bir Kitaptır.
        cid: 0
  - verse: 42
    segments:
      - text: >
          Oña ögünden de, artından da batıl kelalmaz. O, ikmet saibi, çoq maqtavlı
          Allahtan endirilgendir.
        cid: 0
  - verse: 43
    segments:
      - text: >
          (Resulım!) Saña aytılğanlar, senden evelki peyğamberlerge aytılğanından başqa
          bir şey degil. Elbette ki, seniñ Rabbiñ, em mağfiret saibi, em de accı bir azap
          saibidir.
        cid: 0
  - verse: 44
    segments:
      - text: >
          Eger biz onı, yabancı tilde bir Qur'an qılsa edik, deycek ediler ki: Ayetleri
          tefsilâtlı şekilde añlatılmalı degil edimi? Arapqa yabancı tilde (kitap) olurmı?
          De ki: O, inanğanlar içün doğru yolnı köstergen bir qılavuzdır ve şifadır.
          İnanmağanlarğa kelgende, olarnıñ qulaqlarında bir ağırlıq bardır ve Qur'an
          olarğa qapalıdır. (Sanki) olarğa uzaq bir yerden bağırılmaqta (da, Qur'anda ne
          aytılğanını añlamaylar).
        cid: 0
  - verse: 45
    segments:
      - text: >
          Ant olsun, biz Musağa Kitapnı berdik, onda da ihtilâfqa tüşüldi. Eger Rabbiñden
          bir söz keçken olmasa edi, aralarında der'al üküm etilir edi (işleri bitirilir
          edi). Olar Qur'an aqqında teren bir şübe içindedirler. (Keçmiş söz demek,
          esapnıñ ve cezanıñ qıyamet kününece keçiktirilüvi demektir. Bu sözden tolayı,
          Kitapta ihtilâfqa tüşkenler, Kitapnı yalanlağanlar dünyada elâk olğan ve azapqa
          oğratılğanlardır).
        cid: 0
  - verse: 46
    segments:
      - text: >
          Kim bir yahşı iş yapar ise, bu öz lehinedir. Kim de fenalıq yapar ise,
          aleyhinedir. Rabbiñ qullarğa zulum etici degildir.
        cid: 0
  - verse: 47
    segments:
      - text: >
          Qıyamet kününiñ bilgisi, Oña avale etilir. Onıñ bilgisinden ğayrı iç bir meyva
          (çegirdegi) qabuğını yarıp çıqalmaz, iç bir ırğaçı yükke qalmaz ve doğurmaz.
          Allah olarğa: Ortaqlarım ne yerde! diye seslengen künü: Buña dair bizden iç bir
          şaat olmağanını saña arz etermiz, derler.
        cid: 0
  - verse: 48
    segments:
      - text: >
          Böylece, evelden yalvarıp turğanları olardan uzaqlaşqandır. Özleriniñ qaçacaq
          yerleri olmağanını añlağandırlar.
        cid: 0
  - verse: 49
    segments:
      - text: >
          İnsan hayır istemekten usanmaz. Faqat oña bir fenalıq toqunır ise, aman
          ümütsizlikke tüşer, kederlene berir. (İnsannıñ istegen hayırı: mal, sağlıq,
          ferah kibi dünyaviy arzulardır. Şerr ise: faqırlıq, azap ve sıqıntıdır).
        cid: 0
  - verse: 50
    segments:
      - text: >
          Ant olsun ki, özüne toqunğan bir zarardan soñ, biz oña bir rahmet tattırır isek:
          Bu, menim aqqımdır, qıyamet qopacaq sanmayım, Rabbime döndürilgen olsam bile,
          muaqqaq Onıñ qatında men içün daa güzel şeyler bardır, der. Biz, inkâr
          etkenlerge yapqanlarını mıtlaqa haber berecekmiz ve muaqqaq olarğa ağır azaptan
          tattıracaqmız.
        cid: 0
  - verse: 51
    segments:
      - text: >
          İnsanğa bir nimet bergen vaqtımızda, (bizden) yüz çevirir ve uzaqlaşır
          (kibrlenir). Faqat oña bir şerr toqunğan vaqıtta da yalvarıp turar.
        cid: 0
  - verse: 52
    segments:
      - text: >
          De ki: Ne dersiñiz, eger o (Qur'an) Allah tarafından ise, siz de onı inkâr etken
          iseñiz, o zaman (haqtan) uzaq bir ayrılıqqa tüşkenden daa sapıq kim bar?
        cid: 0
  - verse: 53
    segments:
      - text: >
          İnsanlarğa ufuqlarda ve öz nefislerinde ayetlerimizni kösterecekmiz ki, onıñ
          (Qur'annıñ) kerçek olğanı, olarğa yahşıca belli olsun. Rabbiñniñ er şeyge şaat
          oluvı yetmezmi? (Ayetteki «ufuqlar» kelimesinden insannı sarıp alğan tışqı
          alemni, «öz nefisleri» ifadesinden de, insannıñ öz biologik ve ruhiy şeklini
          añlamaq mümukün. Buña köre, ayetniñ manası «biz insanğa ister özüni sarıp alğan
          tışqı alemde, ister şahsen özüniñ maddiy ve ruhiy dünyasında olğan ve bizim
          barlığımıznı ve küçümizniñ mükemmelligini isbatlağan delillerni kösterecekmiz»
          demek olur ki, aqiqaten, «büyük alem» ve «küçük alem» denilgen eki alemnen bağlı
          olaraq, ilim belgilegen aqıllarğa durğunlıq berici bilgiler, Allahnıñ barlığına
          ve küçüniñ sıñırsızlığına dair müim deliller ortağa qoymaqta).
        cid: 0
  - verse: 54
    segments:
      - text: >
          Diqqat etiñ; olar, Rabblerine qavuşmaq hususında şübe içindedirler. Bilesiñiz
          ki, O, er şeyni (ilminen) quşatıcıdır.
        cid: 0
