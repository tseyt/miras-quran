surah_id: 41
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "Duman - qıtlıq ve qurğaqlıqtır. Çünki, Arabistanda buyuk bir qıtlıq olğan, onıñ ortadan qaldırıluvı içün Qureyş, Az. Peyğamberge baş urğan."
        cid: 0
  - verse: 2
    segments:
      - text: "Bu duman - qıyamet alâmetlerinden olup, kokni qaplaycaq dumandır. Peyğamberimizden rivayet etilgenine kore, qıyamet alâmetlerinden biri de, şarq ve ğarp arasını qaplaycaq duman vaqiasıdır)."
        cid: 0
  - verse: 3
    segments:
      - text: "Aziz ve hakim olğan Allaһ saña ve senden evelkilerine, işte boyle vahiy eter. (Cenab-ı Haq Qur’an-ı Kerimde añlatqan hususlarnıñ ozüni daa evelki kitaplarda da bildirgen. Hususen, Haa, Miim ve Ayn, Siin, Qaaf kibi arifler işaret ve sır olaraq, butün peyğamberlerge vahiy etilgen)."
        cid: 0
  - verse: 4
    segments:
      - text: "O qatımızda bulunğan Ana Kitapta (levh-i mahfuzda) mevcut, yuce ve ikmet ile tolu bir kitaptır. (Şanı yuce Qur’an, mucizeviy vasfınen, diger kitaplardan daa yucedir. Çünki, belâğatnı eñ ustün mertebege iriştirgen, ayrıca butün keçmiş kitaplarnıñ ukümlerini ortadan qaldırğandır)."
        cid: 0
  - verse: 5
    segments:
      - text: "Siz, adden aşqan kimseler olduñız diye, sizni Qur’annen tenbiyelevden vazgeçeyikmi?"
        cid: 0
  - verse: 6
    segments:
      - text: "Daa evelki milletlerge nice peyğamberler yollağan edik."
        cid: 0
  - verse: 7
    segments:
      - text: "Eger kesen-kes inana iseñiz (biliñ ki, Allaһ), koklerniñ, yerniñ ve ekisi arasında olğanlarnıñ Rabbidir."
        cid: 0
  - verse: 8
    segments:
      - text: "Ondan başqa ilâh yoqtır. (Er şeyni O) tiriltir ve oldürir. Siziñ de Rabbiñiz, evelki atalarıñıznıñ da Rabbidir."
        cid: 0
  - verse: 9
    segments:
      - text: "Faqat olar, şube içinde eglenip turalar. 10-11. Şimdi sen, kokniñ insanlarnı saracaq açıq bir duman çıqaracaq kunni kozle. Bu, elem berici bir azaptır."
        cid: 0
  - verse: 10
    segments:
      - text: "(İşte, o vaqıtta insanlar:) Rabbimiz! Bizden azapnı çetlet. Doğrusı, biz artıq inanmaqtamız (derler). (Bu duman aqqında esasl eki çeşit yorum yapalğan:"
        cid: 0
  - verse: 11
    segments:
      - text: "Qayda olarda ogüt almaq? Albuki, ozlerine kerçekni añlatkan bir elçi kelgen edi."
        cid: 0
  - verse: 12
    segments:
      - text: "Soñ ondan yuz çevirdiler ve: Bu, ogretilgen bir deli! dediler."
        cid: 0
  - verse: 13
    segments:
      - text: "Biz azapnı biraz ortadan qaldıracaqmız, amma, siz kene (eski alıñızğa) döneceksiñiz. (Az. Peyğamberniñ duasınen, qıtlıq ortadan qaldırılğanından soñ, inkârlarına qaytqan ediler. Başqa bir yorumğa kore de, qıyammet qopmadan evel, etrafnı qaplağan dumannı kâfirler korgeninen, Allaһqa sığınıp dua etecekler, Allaһ qısqa bir muddet dumannı ortadan qaldıracaq, faqat olar buña rağmen, tekrar kufürge dönecekler)."
        cid: 0
  - verse: 14
    segments:
      - text: "Faqat biz buyuk bir şiddetnen yaqalaycaq kunümiz, intiqamımıznı kesen-kes alırmız. 17-18. Ant olsun, olardan evel biz, Fıravunnıñ qavmını da imtian etken edik. Olarğa: Allaһnıñ qulları! Maña keliñ! Çünki, men sizge (öllanılğan) işançlı bir Resulım, diye (davette bulunğan) şerefli bir elçi kelgen edi."
        cid: 0
  - verse: 15
    segments:
      - text: "Allaһqa nisbeten buyuklik taslamañ. Çünki, men sizge ap-açıq bir delil ketirmektem. (Ap-açıq delil, Az. Musanıñ kostergen mucizeleridir)."
        cid: 0
  - verse: 16
    segments:
      - text: "Yoqsa, Allaһ yaratqanlarından qızlarnı ozüne aldı da, oğullarnı sizge ayırdımı?!"
        cid: 0
  - verse: 17
    segments:
      - text: "Olardan biri, Rahmanğa ait sayğan qız balasınen mujdelengeninen, iddetlenerek, yuzü sim-siya kesilir. (Ayette ifade etilgeni kibi, qızlarnı Allaһtan, oğullarını ozlerinden sayğanları içün, qız bala doğğanı aqqındaki haberden kederlene ve siñirlene ediler. Soñunda da qızlarnı tirileyin qumğa kome ediler)."
        cid: 0
  - verse: 18
    segments:
      - text: "Süs içinde yetiştirilip, cenk etalmaycaq olğannı istemeylermi? (Olarnı Allaһnıñ parçası saymaqtalarmı?) (Ayet, qadınlardaki süslenüv hususiyetlerinen, kureşteki zayıflıqlarına işaret etmekte)."
        cid: 0
  - verse: 19
    segments:
      - text: "Olar, Rahmannıñ qulları olğan meleklerni de ırğaçı saydılar. Aceba, meleklerniñ yaratılğanlarını korgenlermi? Olarnıñ bu şaatlıqları yazılacaq ve sorğuğa çekilecekler."
        cid: 0
  - verse: 20
    segments:
      - text: "Men, meni taşboranğa tutuvıñızdan, menim ve siziñ Rabbiñiz olğan Allaһqa sığındım. (Ayet, taşboran eterek, oldürecek tehdidlerini darqatqanlarğa qarşı Az. Musanıñ eskencege, aqaretke ve olümge diqqat etmeyip, Allaһqa sığınacsağını beyan etkenine diqqat çekmekte)."
        cid: 0
  - verse: 21
    segments:
      - text: "Eger maña inanmaz iseñiz, iç olmağanda, yanımdan uzaqlaşıñ."
        cid: 0
  - verse: 22
    segments:
      - text: "Bunıñ uzerine Musa: Bular qabaat işlegen bir toplumdır, diye Rabbine arz etti."
        cid: 0
  - verse: 23
    segments:
      - text: "Allaһ: O alda, qullarımnı geceleyin yolğa çıqar. Çünki, taqip etileceksiñiz, buyurdı. (Aqkiqaten, Fıravun ve ordusı şeerden çıqqanlarından haber alğanınen, Az. Musanı ve İsrail oğullarını taqip etken ediler)."
        cid: 0
  - verse: 24
    segments:
      - text: "Deñizni açıq alda bıraq. Çünki, olar boğulacaq bir ordudır. (Başqa ayetlerde yer alğanına kore, Az. Musa rastkelgen deñizge tayağını uraraq, suvnıñ açıluvını teminlegen, qavmı raat bir şekilde qarşı tarafqa keçken, taqip etken Fıravun ve ordusıi ise, aynı suv içinde boğularaq elâk olğan). 25-27. Olar artta nice bağçalar, çoqraqlar, ekinler, guzel qonaqlar, zevq ve sefasını sürgen nice nimetlerini bıraqqan ediler."
        cid: 0
  - verse: 25
    segments:
      - text: "İşte, boylece, biz de olarnı başqa bir toplumğa miras qaldırdıq."
        cid: 0
  - verse: 26
    segments:
      - text: "Kok ve yer olarnıñ artından ağlamadı; olarğa muhlet de berilmedi."
        cid: 0
  - verse: 27
    segments:
      - text: "Ant olsun, biz İsrail oğullarını o alçaltıcı azaptan qurtardıq."
        cid: 0
  - verse: 28
    segments:
      - text: "Yani Fıravundan. Çünki, o bir zorbacı edi, adden aşqanlardan edi. (Başqa ayetlerde bildirilgeni kibi, Fıravun İsrail oğullarını ozüne qul ve hızmetçi yapa, oğullarını oldüre edi. Bu, İsrail oğullarını aşşalayıcı bir vaziyet edi)."
        cid: 0
  - verse: 29
    segments:
      - text: "Ant olsun, biz İsrail oğullarına, bilerek, (oz zamanlarında) alemlerniñ ustünde bir imtiyaz berdik."
        cid: 0
  - verse: 30
    segments:
      - text: "Olarğa, içinde açıq bir imtian bulunğan, işaretler berdik. (Bu işaretler - deñziniñ yarıluvı, bulutnıñ kolgesi, qudret elvası ve bodena kebabı kibi lütfler şeklinde sayıla bilir). 34-36. Olar (muşrikler) deyler ki: İlk olümimizden soñ bir şey yoqtır. Biz tiriltilecek degilmiz. Doğru söyley iseñiz, atalarımıznı ketiriñ."
        cid: 0
  - verse: 31
    segments:
      - text: "Bular daa hayırlımı, yoqsa, Tubba’ qavmınen, olardan evelkilermi? Olarnı yoq ettik, çünki, olar qabaatlı ediler. (Tubba’ - Yemen ukümdarlarına berilgen isimdir. Peyğamberimizden rivayet etilgenine kore, bu ukümdar yahşı bir insan edi, faqat qavmı yoldan çıqqan edi. Ayette, Tubba’ ve başqa qavmlarğa kore, Qureyşniñ kuç, quvet ve sayı itibarınen, daa zayıf olğanı hatırlatılğan)."
        cid: 0
  - verse: 32
    segments:
      - text: "Biz koklerni, yerni ve bular arasında olğanlarnı, oyun ve eglence olsun, diye yaratmadıq."
        cid: 0
  - verse: 33
    segments:
      - text: "Olarnı sadece kerçek bir sebepnen yarattıq. Faqat olarnıñ çoqu bilmeyler."
        cid: 0
  - verse: 34
    segments:
      - text: "Şubesiz, (haqnı batıldan ayırğan) uküm kunü, episiniñ bir yerde buluşacaq kunüdir. (Qıyammet kunü haq batıldan, aqlı aqsızdan ayırdı etilecek. Ya da insanlar yaqınlarından ve dostlarından ayırılacaq. Bu vaziyet ayetteki «fasıl» kelimesi ile ifade etilgen.)"
        cid: 0
  - verse: 35
    segments:
      - text: "Ve olarnı ziynetlerge boğar edik. Butün bular, sadece dünya ayatınıñ keçici menfaatıdır. Ahiret ise, Rabbiñniñ qatında, Allaһnıñ azabından saqınıp, rahmetine sığınğanlarğa aittir."
        cid: 0
  - verse: 36
    segments:
      - text: "Kim Rahmannı zikr etüvden ğafil olur ise, yanından ayrılmağan bir şeytannı oña musallat etermiz."
        cid: 0
  - verse: 37
    segments:
      - text: "Şubesiz, bu şeytanlar olarnı doğru yoldan çıqarırlar da, olar ozlerini doğru yolda zan eterler."
        cid: 0
  - verse: 38
    segments:
      - text: "O şeytannıñ dostu eñ soñunda bizge kelgeninen, arqadaşına: Keşke, mennen seniñ aramızda şarqnen ğarp arası qadar uzaqlıq olsa edi, ne fena arqadaş ekensiñ! der. (Ayetten, qıyamet kunünde yoldan çıqqan ve şeytanğa arqadaş olğan kimseniñ, fena arqadaşınen ozü arasında uzaq mesafe olğanını tileyerek, korüşmek istemeycegi añlaşıla)."
        cid: 0
  - verse: 39
    segments:
