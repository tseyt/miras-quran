        cid: 0
  - verse: 42
    segments:
      - text: "Ancaq, Allaһnıñ merhamet etken kimseleri boyle degildir. Şubesiz, O, ustündir, merhametlidir. 43-44. Şubesiz, zaqqum teregi gunahkârlarnıñ yemegidir. 45-46. O, qarınlarda maden iritmesi kibi, suvnıñ qaynaması kibi qaynar. 47-50. (Allaһ zebaniylerge emir eter): Tutıñ onı! Ceennemniñ ortasına süyrekleñ! Soñ başına azap olaraq, qaynağan suv töküñ!) ve deñ ki: (Tat, baqayıq. Qana, sen ozüñce ustün ediñ, şerefli ediñ! İşte, bu, şubelenip turğan şeyiñizdir. 51-53. Muttaqiyler ise, aqiqaten işançlı bir maqamdadırlar. Bağçalarda ve çoqraq başlarındadırlar. İnce yipekten ve parlaq atlastan kiyerek, qarşı-qarşığa oturırlar."
        cid: 0
  - verse: 43
    segments:
