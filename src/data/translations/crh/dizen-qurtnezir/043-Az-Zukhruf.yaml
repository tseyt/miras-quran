        cid: 0
  - verse: 86
    segments:
      - text: >
          Allahnı bıraqıp da, tabınğan putları şefaat etalmazlar. Ancaq, bilerek haqqa
          şaatlıq etkenler bundan istisnadır. (Ayette ifade etilgeni kibi, putlar iç
          kimsege şefaat etalmazlar ve yardımda bulunalmazlar. Çünki, şefaatçılıqqa
