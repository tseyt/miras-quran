surah_id: 43
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >-
          Haa. Miim.
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Ap-açıq Kitapqa ant olsun ki, biz, añlap tüşünüviñiz içün, onı arapça bir
          Qur’an qıldıq.
        cid: 0
  - verse: 3
    segments:
      - text: >-
          [2 ayetine baq.]
        cid: 0
  - verse: 4
    segments:
      - text: >-
          O qatımızda bulunğan Ana Kitapta (levh-i mahfuzda) mevcut, yuce ve ikmet ile
          tolu bir kitaptır. (Şanı yuce Qur’an, mucizeviy vasfınen, diger kitaplardan daa
          yucedir. Çünki, belâğatnı eñ ustün mertebege iriştirgen, ayrıca butün keçmiş
          kitaplarnıñ ukümlerini ortadan qaldırğandır).
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Siz, adden aşqan kimseler olduñız diye, sizni Qur’annen tenbiyelevden
          vazgeçeyikmi?
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Daa evelki milletlerge nice peyğamberler yollağan edik.
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Olar, ozlerine kelgen er peyğamberni mıtlaqa alayğa ala ediler.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Biz bulardan daa zorbacı olğanlarnı da elâk ettik. Bunıñ kibi, evelkilerde
          misali keçkendir.
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Ant olsun ki, olarğa koklerni ve yerni kim yarattı? dep sorasañ; «Olarnı,
          şubesiz kuçlü olğan, er şeyni bilgen Allaһ yarattı», derler.
        cid: 0
  - verse: 10
    segments:
      - text: >-
          O, sizge yerni beşik yapqan ve doğru yurersiñiz diye, yer yuzünde sizge yollar
          yaratqan.
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Kokten, bir olçüge kore, suvnı endirgen Odır. Biz onıñnen (qup-qru) olü
          memleketke ayat berirmiz. İşte, siz de, boylece (mezarlarıñızdan)
          çıqarılacaqsıñız. (Ayette, itiyacğa ve belli olçüge kore, yağmurnıñ
          yağdırılğanı, onıñnen topraqqa ayat berilgeni bildirilgen bu vaziyetniñ
          tirilüvniñ açıq misali olğanı qayd etilgen).
        cid: 0
  - verse: 12
    segments:
      - text: >-
          Butün çiftlerni O yaratqandır. Ve sizge minecek gemileriñizni ve ayvanlar
          yaratqandır ki, boylece olarnıñ sırtına minip, ustlerine yerleşkeniñiznen,
          Rabbiñizniñ nimetini añaraq: Bunı bizim hızmetimizge bergenni tesbih etermiz,
          yoqsa, biz bularğa kuç yetiştiralmaz edik, deyuviñiz içündir. (Minilecekler,
          tüşünmege ve Allaһnı tesbih etmege yetekleyici varlıqlardır. Bu sebepten,
          sahabe-i kiram ayvanlarına mingenlerinde, ahiretni ve tabutnen başlanacaq
          yolculıqnı tüşüne ediler. Resulullaһ yolculıqqa çıqqanda, bu ayetlerni oqur
          edi).
        cid: 0
  - verse: 13
    segments:
      - text: >-
          [12 ayetine baq.]
        cid: 0
  - verse: 14
    segments:
      - text: >-
          Biz, şubesiz Rabbimizge dönecekmiz (demelisiñiz).
        cid: 0
  - verse: 15
    segments:
      - text: >-
          Amma, olar qullarından bir qısmını Onıñ bir cuzi (bolügi) qıldılar. Aqiqaten,
          insan ap-açıq bir nankordir. (Bu yerde yeudiylerden bir topunıñ Uzeyrni,
          hristianlardan da İsanı Allaһnıñ oğlu sayğanlarına, muşriklerniñ ise, meleklerni
          Allaһnıñ qızları olaraq qabul etkenlerine işaret etilmekte).
        cid: 0
  - verse: 16
    segments:
      - text: >-
          Yoqsa, Allaһ yaratqanlarından qızlarnı ozüne aldı da, oğullarnı sizge
          ayırdımı?!
        cid: 0
  - verse: 17
    segments:
      - text: >-
          Olardan biri, Rahmanğa ait sayğan qız balasınen mujdelengeninen, iddetlenerek,
          yuzü sim-siya kesilir. (Ayette ifade etilgeni kibi, qızlarnı Allaһtan,
          oğullarını ozlerinden sayğanları içün, qız bala doğğanı aqqındaki haberden
          kederlene ve siñirlene ediler. Soñunda da qızlarnı tirileyin qumğa kome ediler).
        cid: 0
  - verse: 18
    segments:
      - text: >-
          Süs içinde yetiştirilip, cenk etalmaycaq olğannı istemeylermi? (Olarnı Allaһnıñ
          parçası saymaqtalarmı?) (Ayet, qadınlardaki süslenüv hususiyetlerinen, kureşteki
          zayıflıqlarına işaret etmekte).
        cid: 0
  - verse: 19
    segments:
      - text: >-
          Olar, Rahmannıñ qulları olğan meleklerni de ırğaçı saydılar. Aceba, meleklerniñ
          yaratılğanlarını korgenlermi? Olarnıñ bu şaatlıqları yazılacaq ve sorğuğa
          çekilecekler.
        cid: 0
  - verse: 20
    segments:
      - text: >-
          Ve dediler ki: Rahman istese edi, biz olarğa tabınmaz edik. Olarnıñ bu hususta
          bir bilgileri yoq. Olar sadece yalan söyleyler.
        cid: 0
  - verse: 21
    segments:
      - text: >-
          Yoqsa, bundan evel olarğa bir kitap berdik de, oña bağlanmaqtalarmı?
        cid: 0
  - verse: 22
    segments:
      - text: >-
          Yoq! «Sadece, biz babalarımıznı bir din uzerinde buldıq, biz de olarnıñ izinden
          ketmektemiz», derler. (Boylece, meleklerge tabınuvnıñ, bilgi ve kitap olaraq,
          bir tayanğıçı olmağanı, sadece kor-korane taqlitten ibaret olğanı ortağa
          çıqmaqta).
        cid: 0
  - verse: 23
    segments:
      - text: >-
          Senden evel de, angi memleketke tenbiyeci yollağan isek, mıtlaqa o yerniñ ileri
          kelgenleri: Babalarımıznı bir din uzerinde buldıq, biz de olarnıñ izlerine
          uyarmız, der ediler.
        cid: 0
  - verse: 24
    segments:
      - text: >-
          Men sizge babalarıñıznı uzerinde bulğanıñız (din)den daa doğrusını ketirgen
          isem (kene maña uymazsıñızmı)? degeninen, dediler ki: Doğrusı, biz siznen
          yollanılğan şeyni inkâr etmektemiz.
        cid: 0
  - verse: 25
    segments:
      - text: >-
          Biz de olardan inktiqam aldıq. Baq, yalanlağanlarnıñ soñu nasıl oldı?
        cid: 0
  - verse: 26
    segments:
      - text: >-
          Bir zaman İbrahim, babasına ve qavmına degen edi ki: Men siziñ
          tabınğanlarıñızdan uzaqım.
        cid: 0
  - verse: 27
    segments:
      - text: >-
          Men, yalıñız meni yaratqanğa tabınırım. Çünki, O, meni doğru yolğa
          qavuştıracaq.
        cid: 0
  - verse: 28
    segments:
      - text: >-
          Bu sözni, artından keleceklerge devamlı qalacaq bir miras olaraq bıraqtı ki,
          insanlar (onıñ dinine) dönsinler. (Az. İbrahim haqnı qabul etmegen babasınıñ
          yolunı terk etmeknen, er zaman atalarınıñ taqlit etilalmaycağını kostergen ve
          tevhid kelimesini, artındakilerge miras olaraq qaldırğan, bu sebepten de,
          neslinde Bir Allaһqa inanğanlar eksik olmağan. Mekkeliler arasında da «hanifler»
          adınen tanılğan ve Az. İbrahimniñ inançına sadaqat kostergen insanlar bar edi).
        cid: 0
  - verse: 29
    segments:
      - text: >-
          Doğrusı, bularnı da, atalarını da, olarğa haq ve onı beyan etken bir peyğamber
          kelgenge qadar keçindirdim.
        cid: 0
  - verse: 30
    segments:
      - text: >-
          Fakat ozlerine haq kelgeninen: Bu bir tılsımdır, biz onı tanımaymız, dediler.
        cid: 0
  - verse: 31
    segments:
      - text: >-
          Ve dediler ki: Bu Qur’an eki şeerden bir buyuk adamğa endirilse olmaz edimi?
          (Az. Peyğamberge inanmaganlarğa kore, Qur’an Mekkeniñ zenginlerinden Velid b.
          Muğiirege ya da Taaifniñ zenginlerinden Urye es-Saqafiyge endirilmeli edi. Velid
          b. Muğiire boyle degen edi: Qureyşniñ buyugi ve efendisi olğan men, yahut
          Sakifniñ buyugi Ebu Amr b. Umeir es-Saqafiy turğanda, Qur’an Muһammedge
          enecekmi? Albuki, Allaһ nazarında yukseklik, zenginlik ya da nesebi belliliknen
          degil, taqvanendir. Bunıñnen beraber, Az. Muһammed, neseb itibarınen de, olarnıñ
          eñ şereflisi edi. Yalıñız anadan ve babadan yetim qalğan edi, zengin de degil
          edi).
        cid: 0
  - verse: 32
    segments:
      - text: >-
          Rabbiñniñ rahmetini olar paylaştırmaqtalarmı? Dünya ayatında olarnıñ
          maişetlerini (rızıqlarını) aralarında biz paylaştırdıq. Bir-birine iş
          yaptıruvları içün kimini o birisine derecelernen ustün yaptıq. Rabbiñniñ rahmeti
          olarnıñ toplağan şeylerinden daa hayırlıdır.
        cid: 0
  - verse: 33
    segments:
      - text: >-
          Eger insanlarnıñ kufürde birleşken tek bir ummet oluvı (telükesi) olmasa edi,
          Rahmannı inkâr etkenlerniñ evleriniñ tavanlarını ve çıqacaq merdivenlerini
          kumüşten yapar edik.
        cid: 0
  - verse: 34
    segments:
      - text: >-
          Evleriniñ qapularını ve ustlerine yaslanacaq kursülerni de (ep kumüşten yapar
          edik).
        cid: 0
  - verse: 35
    segments:
      - text: >-
          Ve olarnı ziynetlerge boğar edik. Butün bular, sadece dünya ayatınıñ keçici
          menfaatıdır. Ahiret ise, Rabbiñniñ qatında, Allaһnıñ azabından saqınıp,
          rahmetine sığınğanlarğa aittir.
        cid: 0
  - verse: 36
    segments:
      - text: >-
          Kim Rahmannı zikr etüvden ğafil olur ise, yanından ayrılmağan bir şeytannı oña
          musallat etermiz.
        cid: 0
  - verse: 37
    segments:
      - text: >-
          Şubesiz, bu şeytanlar olarnı doğru yoldan çıqarırlar da, olar ozlerini doğru
          yolda zan eterler.
        cid: 0
  - verse: 38
    segments:
      - text: >-
          O şeytannıñ dostu eñ soñunda bizge kelgeninen, arqadaşına: Keşke, mennen seniñ
          aramızda şarqnen ğarp arası qadar uzaqlıq olsa edi, ne fena arqadaş ekensiñ!
          der. (Ayetten, qıyamet kunünde yoldan çıqqan ve şeytanğa arqadaş olğan kimseniñ,
          fena arqadaşınen ozü arasında uzaq mesafe olğanını tileyerek, korüşmek
          istemeycegi añlaşıla).
        cid: 0
  - verse: 39
    segments:
      - text: >-
          Zulum etkeniñiz içün bugun (peşmanlıq) sizge iç bir fayda bermeycek. Çünki, siz
          azapta ortaqsıñız.
        cid: 0
  - verse: 40
    segments:
      - text: >-
          (Resulım!) Sağırlarğa sen eşitteredeksiñmi; yahut korlerni ve ap-açıq
          sapıqlıqta olğanlarnı doğru yolğa sen qavuştıracaqsıñmı?
        cid: 0
  - verse: 41
    segments:
      - text: >-
          Biz seni olardan uzaqlaştırsaq da, kene olardan intiqam alırmız. (Sen korseñ
          de, kormeseñ de, olarğa haq etken cezalarını berecekmiz).
        cid: 0
  - verse: 42
    segments:
      - text: >-
          Yahut olarğa vade etken azabımıznı saña kosterirmiz. Çünki, bizim olarğa
          kuçümiz yeter.
        cid: 0
  - verse: 43
    segments:
      - text: >-
          Sen, saña vahiy etilgenge sım-sıqı sarıl. Şubesiz, sen dos-doğru yoldasıñ.
        cid: 0
  - verse: 44
    segments:
      - text: >-
          Doğrusı, Qur’an, saña ve qavmıña bir ogüttir. İleride ondan mesuliyetli
          tutulacaqsıñız.
        cid: 0
  - verse: 45
    segments:
      - text: >-
          Senden evel yollağan elçilerimizniñ (ummetlerinden) sora! Rahmandan başqa
          tabınılacaq tañrılar (ediniñiz diye) emir etkenmizmi? (O bir peyğamberlerniñ
          ketirgen dinleri talil etilgen vaqıtta, añlaşılır ki, iç bir peyğamberniñ
          dininde putqa tabınuv yoq. Butün peyğamberler tevhid inançında birdirler).
        cid: 0
  - verse: 46
    segments:
      - text: >-
          Ant olsun, biz Musanı ayetlerimiznen Fıravunğa ve onıñ ileri kelgen adamlarına
          yollağan edik de, Musa: Men alemler Rabbiniñ elçisiyim, degen edi.
        cid: 0
  - verse: 47
    segments:
      - text: >-
          Olarğa ayetlerimizni ketirgeninen, olarğa kule qoyğan ediler.
        cid: 0
  - verse: 48
    segments:
      - text: >-
          Olarğa kostergen er bir ayetimiz (mucizemiz) digerinden daa buyuk edi. Doğru
          yolğa dönsünler diye, olarnı azapqa oğrattıq.
        cid: 0
  - verse: 49
    segments:
      - text: >-
          Bunıñ ustüne, dediler ki: Ey, tılsımcı! Saña bergen vadege kore, biz içün
          Rabbiñye dua et; çünki, biz artıq doğru yolğa kirecekmiz. (Ayet, Az. Musa
          qavmınıñ azapnı korgeninen, qurtulmaq içün inanacaqlarını bildirgenlerine,
          boylece, azapnıñ ortadan qaldırılacağına dair berilgen sözni de
          hatırlatqanlarına işaret etmekte).
        cid: 0
  - verse: 50
    segments:
      - text: >-
          Faqat biz olardan azapnı qaldırğanımıznen, sözlerinden qayta qoydılar.
        cid: 0
  - verse: 51
    segments:
      - text: >-
          Fıravun qavmına seslendi ve boyle dedi: «Ey, qavmım! Mısır mulki ve altımdan
          aqqan şu irmaqlar menim degilmi? Alâ kormeysiñizmi?». (Fıravun bu sözünen
          saraylarını ve altından aqqan Nil nehrini kozde tutaraq, qudret, servet ve
          buyukligini ortağa qoymaqta ve buña nisbeten Az. Musanıñ zayıflığını ve
          faqırlığını hatırlatmaqta).
        cid: 0
  - verse: 52
    segments:
      - text: >-
          «Öqsa, men, ozü zayıf ve ne yerde ise, söz añlatalmaycaq vaziyetteki şu adamdan
          daa hayırlı degilimmi?». (Bu sözünen Fıravun, Az. Musanıñ tilindeki tutuqlığına
          işaret etmek istey edi).
        cid: 0
  - verse: 53
    segments:
      - text: >-
          «Oña altın bilezlikler berilmeli ya da yanında oña yardımcı melekler kelmeli
          degil edimi?».
        cid: 0
  - verse: 54
    segments:
      - text: >-
          Fıravun qavmını aldattı; olar da oña boyun egdiler. Olar yoldan çıqqan bir
          qavmdır.
        cid: 0
  - verse: 55
    segments:
      - text: >-
          Boylece, bizni opkelendirgeninen, olardan itiqam aldıq, episini suvda boğdıq.
        cid: 0
  - verse: 56
    segments:
      - text: >-
          Olarnı, soñundan kelgenlerniñ keçmişi ve bir ibret ornegi yaptıq.
        cid: 0
  - verse: 57
    segments:
      - text: >-
          Meryem oğlu İsa, bir misal olaraq, añlatılğanınen, seniñ qavmıñ aman
          bağırışmağa başladı. (Rivayet etilgenine kore, Az. İsa ve anası Meryemnen bağlı
          bir mesele muzakere etilgen toplaşuvda muşriklerden biri: «Eger tabınılğan İsa,
          Meryem, Uzeyr ve melekler ceennemde ise, olarnen beraber olmağa razımız», degen,
          bu sözge muşrikler kulgen ediler. Ayet olarnıñ bu qopayçora tavurları aqqında
          engen).
        cid: 0
  - verse: 58
    segments:
      - text: >-
          Bizim tañrılarımız hayırlımı, yoqsa omı? dediler. Bunı saña, ancaq tartışmaq
          içün söylediler. Doğrusı, olar qavğacı bir toplumdır. (Bu sözlerinen muşrikler
          tañrılarını Az. İsanen teñyeştirmege areket etkenleri añlaşıla).
        cid: 0
  - verse: 59
    segments:
      - text: >-
          O, sadece ozüne nimet bergen ve İsrail oğullarına ornek yapqan bir qulımızdır.
          (Ayet, Az. İsanıñ peyğamberlik nimetine iriiken ve babasız doğuvınen de, İsrail
          oğullarına ilâhiy qudretniñ ornegi olaraq ketirilgen buyuk bir zat olğanını
          takidley).
        cid: 0
  - verse: 60
    segments:
      - text: >-
          Eger tilese edik, arañızdan yer yuzünde yeriñizge keçecek melekler yaratır
          edik.
        cid: 0
  - verse: 61
    segments:
      - text: >-
          Şubesiz ki, o (İsa), qıyametniñ (ne zaman qopacağnıñ) bilgisidir. Ondan iç şube
          etmeñ ve maña uyıñ; çünki, bu, dos-doğru yoldır. (Bu ayette Az. İsanıñ qıyamet
          içün bir bilgi olğanı beyan etilerek, ahır zamanda onıñ tekrar dünyağa
          qaytacağına işaret etile. Bunıñ kibi, ayetteki «ilim» kelimesi - işaret mansına
          kelgen «alem» şeklinde de oqulğan. Bunıñnen beraber, ayetni: «Qur’anda ahiret
          içün yeterli bilgiler bar», şeklinde añlağanlar da olğan).
        cid: 0
  - verse: 62
    segments:
      - text: >-
          Saqın şeytan sizni yoldan çıqarmasın. Çünki, o siz içün açıqtan-açıq duşmandır.
        cid: 0
  - verse: 63
    segments:
      - text: >-
          İsa, açıq delillernen kelgen vaqıtta, degen edi ki: Men sizge ikmet ketirdim ve
          ihtilâfqa tüşken şeyleriñizden bir qısmını sizge añlatmaq içün keldim. Oyle ise,
          Allaһtan qorquñ ve maña itaat etiñ.
        cid: 0
  - verse: 64
    segments:
      - text: >-
          Çünki, Allaһ, menim de Rabbim, siziñ de Rabbiñizdir. Oña ibadet etiñ. İşte, bu,
          doğru yoldır.
        cid: 0
  - verse: 65
    segments:
      - text: >-
          Amma, aralarından çıqqan toplulıqlar bir ihtilafqa tüştiler. Elemli bir kunniñ
          azabı qarşısında vay o zulum etkenlerniñ alına! (Hristian ve yeudiylerden
          bazıları Az. İsa içün Allaһ, bazıları Allaһnıñ oğlu, bir qısmı da uçniñ uçüncisi
          dediler ve boyle inandılar. Ayet olarnıñ bu yersiz tüşünce ve inançlarınıñ
          qıyamet kunünde acınacaq bir azapqa oğraycaqlarına sebep olacağını haber bere).
        cid: 0
  - verse: 66
    segments:
      - text: >-
          Olar farqında olmağanlarında, qıyamet kunüniñ olarğa apansızdan kelüvinden
          başqa bir şey beklemektelermi?
        cid: 0
  - verse: 67
    segments:
      - text: >-
          O kunü, Allaһqa qarşı kelüvden saqınğanlardan ğayrı, dost olğanlar (bile)
          bir-birilerine duşman kesilirler. (Allaһ ozüne qarşı kelüvden saqınğanlarğa
          boyle nida eter:)
        cid: 0
  - verse: 68
    segments:
      - text: >-
          Ey, ayetlerimizge inanğan ve musulman olğan qullarım! Bugun sizge korku yoqtır.
          Sizler kederlenmeyceksiñiz de.
        cid: 0
  - verse: 69
    segments:
      - text: >-
          [68 ayetine baq.]
        cid: 0
  - verse: 70
    segments:
      - text: >-
          Siz ve zevceleriñiz, sevinç ve neşeli alda cennetke kiriñiz!
        cid: 0
  - verse: 71
    segments:
      - text: >-
          Olarğa altın tepsiler ve qadeler dolaştırılır. O yerde canları istegen, kozleri
          oşlanğan er şey bardır. Ve olarğa: Siz o yerde ebediy qalacqsıñız, işte
          yapqanlarıñızğa qarşılıq sizge miras berilgen cennet budır. O yerde siz içün
