  - verse: 76
    segments:
      - text: >
          Biz olarğa zulum etmedik, faqat olar özleri zalım kimselerdir.
        cid: 0
  - verse: 77
    segments:
      - text: >
          Ey, Malik! Rabbiñ bizim işimizni bitirsin! diye seslenirler. Malik de: Siz böyle
          qalacaqsıñız! der. (Kâfirler ceennemniñ bekçisi Malikke ayette bildirilgen
          şekilde seslenerek, ölümlerini isterler. Çünki, ölümleri - azap içinde
          yaşağanlarından daa yahşıdır. Amma, Malik olarğa iç bir surette bu yerden
          qurtulış olmağınını bildirir).
        cid: 0
  - verse: 78
    segments:
      - text: >
          Ant olsun, biz sizge haqnı ketirdik, faqat çoquñız haqtan oşlanmaysıñız. (Bu
          yerde Qureyşniñ Daaru'n-Nedvede Az. Peyğamberge qarşı qurğan tuzaqlarına işaret
          etilerek, olarnıñ tuzaqlarına qarşılıq, elâketleriniñ taqdir etilgeni
          bildirilgen. Çünki, kâfirler Az. Muhammedni ve Qur'annı sevmegenlerini
          söylemeknen qalmayıp, qarşı qoyuv hususında da, qararlar ala ediler).
        cid: 0
  - verse: 79
    segments:
      - text: >
          Yoqsa, (müşrikler) bir işke kesen-kes qarar berdilermi? Doğrusı, biz de
          qararlımız!
        cid: 0
  - verse: 80
    segments:
      - text: >
          Yoqsa, biz olarnıñ sırlarını ve gizli laqırdılarını eşitmedik belleylermi? Yoq,
          öyle degil; yanlarındaki elçilerimiz (hafaza melekleri de) yazmaqtadırlar.
        cid: 0
  - verse: 81
    segments:
      - text: >
          De ki: Eger Rahmannıñ bir balası olsa edi, elbette men (oña) qullıq etkenlerniñ
          ilkisi olur edim!.
        cid: 0
  - verse: 82
    segments:
      - text: >
          Köklerniñ ve yerniñ Rabbi, Arşnıñ da Rabbi olğan Allah olarnıñ
          vasıflandıruvlarından yücedir, uzaqtır.
        cid: 0
  - verse: 83
