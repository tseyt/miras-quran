      - text: >
          Şübesiz, qbaatlılar ceennem azabında devamlı qalacaqlar, azapları
          yengilleştirilmeycek. Olar azap içinde qurtulıştan ümüt keskenlerdir. (Bu
          yerdeki qabaatlı - Allahnı inkâr etken ya da şirk qoşqanlardır).
        cid: 0
