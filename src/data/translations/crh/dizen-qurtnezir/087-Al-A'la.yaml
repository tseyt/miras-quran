        cid: 0
  - verse: 6
    segments:
      - text: >
          Saña (Qur'annı) oqutacaqmız; artıq Allahnıñ istegeni istisna, sen iç
          unutmaycaqsıñ. Şübesiz, Allah aşkârnı ve gizlini bilir.
        cid: 0
  - verse: 7
    segments:
      - text: >
          [6 ayetine baq.]
        cid: 0
  - verse: 8
    segments:
      - text: >
          Seni eñ qolayğa muvaffaq etecekmiz. O alda, eger ögüt fayda berse, ögüt ber.
        cid: 0
  - verse: 9
    segments:
      - text: >
          [8 ayetine baq.]
        cid: 0
  - verse: 10
    segments:
      - text: >
          (Allahtan) qorqqan - ögütten faydalanacaq. Eñ büyük ateşke kirecek fena kimse
          ise, ögütten qaçınır. Soñ o, ateşte ne ölür, ne de yaşar.
        cid: 0
  - verse: 11
    segments:
      - text: >
          [10 ayetine baq.]
        cid: 0
  - verse: 12
    segments:
