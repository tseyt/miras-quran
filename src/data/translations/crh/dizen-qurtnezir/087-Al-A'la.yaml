surah_id: 87
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >-
          Yaratıp, tertipke qoyğan, taqdir etip, yol kostergen, (topraqtan) yeşil otnı
          çıqarıp, soñ onı qap-qara bir sel çöpligine çevirgen yuce Rabbiñniñ adını tesbih
          (ve taqdis) et.
        cid: 0
