surah_id: 87
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >
          Yaratıp, tertipke qoyğan, taqdir etip, yol köstergen, (topraqtan) yeşil otnı
          çıqarıp, soñ onı qap-qara bir sel çöpligine çevirgen yüce Rabbiñniñ adını tesbih
          (ve taqdis) et.
        cid: 0
  - verse: 2
    segments:
      - text: >
          [1 ayetine baq.]
        cid: 0
