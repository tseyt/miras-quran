  - verse: 13
    segments:
      - text: >
          [10 ayetine baq.]
        cid: 0
  - verse: 14
    segments:
      - text: >
          Temizlengen, Rabbiñniñ adını añıp, Oña qullıq etken kimse, şübesiz qurtulışqa
          irişkendir.
        cid: 0
  - verse: 15
    segments:
      - text: >
          [14 ayetine baq.]
        cid: 0
  - verse: 16
    segments:
      - text: >
          Faqat siz (ey, insanlar!) ahiret daa hayırlı ve daa devamlı olğanı alda, dünya
          ayatını üstün körmektesiñiz.
        cid: 0
  - verse: 17
    segments:
      - text: >
          [16 ayetine baq.]
        cid: 0
  - verse: 18
    segments:
      - text: >
          Şübesiz, bu (añlatılğanlar), evelki kitaplarda, İbrahim ve Musanıñ kitaplarında
          da bardır.
        cid: 0
  - verse: 19
    segments:
