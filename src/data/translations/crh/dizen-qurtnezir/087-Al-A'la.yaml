  - verse: 6
    segments:
      - text: >-
          Saña (Qur’annı) oqutacaqmız; artıq Allaһnıñ istegeni istisna, sen iç
          unutmaycaqsıñ. Şubesiz, Allaһ aşkârnı ve gizlini bilir.
        cid: 0
  - verse: 7
    segments:
      - text: >-
          [6 ayetine baq.]
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Seni eñ qolayğa muvaffaq etecekmiz. O alda, eger ogüt fayda berse, ogüt ber.
        cid: 0
  - verse: 9
    segments:
      - text: >-
          [8 ayetine baq.]
        cid: 0
  - verse: 10
    segments:
      - text: >-
          (Allaһtan) qorqqan - ogütten faydalanacaq. Eñ buyuk ateşke kirecek fena kimse
          ise, ogütten qaçınır. Soñ o, ateşte ne olür, ne de yaşar.
        cid: 0
  - verse: 11
    segments:
