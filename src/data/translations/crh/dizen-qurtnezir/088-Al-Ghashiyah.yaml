  - verse: 8
    segments:
      - text: >
          O künü bir taqım yüzler de bardır ki, bahtlıdırlar; (dünyadaki) ğayretlerinden
          hoşnut olğandırlar, yüce bir cennettedirler. O yerde boş bir söz eşitmezler.
        cid: 0
