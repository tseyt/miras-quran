  - verse: 21
    segments:
      - text: >
          O alda (Resulım), ögüt ber. Çünki, sen ancaq ögüt bericisiñ. Olarnıñ üstünde bir
          zorbacı degilsiñ. Ancaq yüz çevirip, inkâr etkenge kelgende, işte, öylesini
          Allah eñ büyük azap ile cezalandırır. Şübesiz, olarnıñ dönüşi sadece bizgedir.
          Soñ olarnıñ sorğuğa çekilüvi de, sadece bizge aittir.
        cid: 0
