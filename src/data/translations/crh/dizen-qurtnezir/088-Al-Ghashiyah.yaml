surah_id: 88
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "(Resulım!) Deşeti er şeyni qaplağan qıyametniñ haberi saña keldimi?"
        cid: 0
  - verse: 2
    segments:
      - text: "O kunü bir taqım yuzler zelildir, toqtamadan çalışır, (faqat boşuna) yorulır, qızğın ateşke kirer. Olarğa qaynap turğan suv çoqrağından içirilir, olar içün quruğan tikenden başqa yemek yoqtır, o ise, ne besler, ne de açlıqnı ketkizir."
        cid: 0
  - verse: 3
    segments:
      - text: "[2 ayetine baq.]"
        cid: 0
  - verse: 4
    segments:
      - text: "[2 ayetine baq.]"
        cid: 0
  - verse: 5
    segments:
