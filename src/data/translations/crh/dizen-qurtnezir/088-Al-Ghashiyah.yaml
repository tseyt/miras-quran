        cid: 0
  - verse: 21
    segments:
      - text: "O alda (Resulım), ogüt ber. Çünki, sen ancaq ogüt bericisiñ. Olarnıñ ustünde bir zorbacı degilsiñ. Ancaq yuz çevirip, inkâr etkenge kelgende, işte, oylesini Allaһ eñ buyuk azap ile cezalandırır. Şubesiz, olarnıñ dönüşi sadece bizgedir. Soñ olarnıñ sorğuğa çekilüvi de, sadece bizge aittir."
        cid: 0
