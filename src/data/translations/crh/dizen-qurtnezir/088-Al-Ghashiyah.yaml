surah_id: 88
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "(Resulım!) Deşeti er şeyni qaplağan qıyametniñ haberi saña keldimi? 2-7. O kunü bir taqım yuzler zelildir, toqtamadan çalışır, (faqat boşuna) yorulır, qızğın ateşke kirer. Olarğa qaynap turğan suv çoqrağından içirilir, olar içün quruğan tikenden başqa yemek yoqtır, o ise, ne besler, ne de açlıqnı ketkizir. 8-11. O kunü bir taqım yuzler de bardır ki, bahtlıdırlar; (dünyadaki) ğayretlerinden hoşnut olğandırlar, yuce bir cennettedirler. O yerde boş bir söz eşitmezler. 12-16. O yerde (cennette) devamlı aqqan bir çoqraq, o yerde yukseltilgen tahtlar, qoyulğan qadeler, sıra-sıra tizili yastıqlar, töşelgen kilimler bar. 17-20. (İnsanlar) deveniñ nasıl yaratılğanına, kokniñ nasıl yukseltilgenine, dağlarnıñ nasıl tiklengenine, yer yuzüniñ nasıl yayılğanına bir baqmazlarmı? 21-26. O alda (Resulım), ogüt ber. Çünki, sen ancaq ogüt bericisiñ. Olarnıñ ustünde bir zorbacı degilsiñ. Ancaq yuz çevirip, inkâr etkenge kelgende, işte, oylesini Allaһ eñ buyuk azap ile cezalandırır. Şubesiz, olarnıñ dönüşi sadece bizgedir. Soñ olarnıñ sorğuğa çekilüvi de, sadece bizge aittir."
        cid: 0