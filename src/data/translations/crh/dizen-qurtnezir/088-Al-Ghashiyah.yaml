        cid: 0
  - verse: 7
    segments:
      - text: "[2 ayetine baq.]"
        cid: 0
  - verse: 8
    segments:
      - text: "O kunü bir taqım yuzler de bardır ki, bahtlıdırlar; (dünyadaki) ğayretlerinden hoşnut olğandırlar, yuce bir cennettedirler. O yerde boş bir söz eşitmezler."
        cid: 0
  - verse: 9
    segments:
      - text: "[8 ayetine baq.]"
        cid: 0
  - verse: 10
    segments:
      - text: "[8 ayetine baq.]"
        cid: 0
  - verse: 11
    segments:
      - text: "[8 ayetine baq.]"
        cid: 0
  - verse: 12
    segments:
      - text: "O yerde (cennette) devamlı aqqan bir çoqraq, o yerde yukseltilgen tahtlar, qoyulğan qadeler, sıra-sıra tizili yastıqlar, töşelgen kilimler bar."
        cid: 0
  - verse: 13
    segments:
      - text: "[12 ayetine baq.]"
        cid: 0
  - verse: 14
    segments:
