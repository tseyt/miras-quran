        cid: 0
  - verse: 17
    segments:
      - text: "(İnsanlar) deveniñ nasıl yaratılğanına, kokniñ nasıl yukseltilgenine, dağlarnıñ nasıl tiklengenine, yer yuzüniñ nasıl yayılğanına bir baqmazlarmı?"
        cid: 0
  - verse: 18
    segments:
