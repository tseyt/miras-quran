surah_id: 90
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "Bu bolgege -ki sen bu bolgedesiñ-, babağa ve ondan meydanğa kelgen balağa yemin eterim ki, biz insannı (koz-kozge kelecek nice) zorluqlar içinde yarattıq."
        cid: 0
  - verse: 2
    segments:
      - text: "[1 ayetine baq.]"
        cid: 0
  - verse: 3
    segments:
      - text: "[1 ayetine baq.]"
        cid: 0
  - verse: 4
    segments:
      - text: "[1 ayetine baq.]"
        cid: 0
  - verse: 5
    segments:
      - text: "İnsan, iç kimse oña kuç yetiştiralmaycaq belleymi? 6. «Pek çoq mal arcladım» dey. (Bazı tefsirlerge kore, ayette, muşriklerniñ Az. Peyğamberge duşmanlıq oğrunda yapqan arcalamalarından söz etüvlerine işaret olunmaqta)."
        cid: 0
  - verse: 6
    segments:
      - text: "Kimse onı kormedi belleymi?"
        cid: 0
  - verse: 7
    segments:
      - text: "Biz oña eki koz, bir til ve eki dudaq bermedikmi? Oña eki yol (doğru ve egrini) kostermedikmi?"
        cid: 0
  - verse: 8
    segments:
      - text: "[7 ayetine baq.]"
        cid: 0
  - verse: 9
    segments:
      - text: "[7 ayetine baq.]"
        cid: 0
  - verse: 10
    segments:
      - text: "Faqat o, sarp yoquşnı aşalmadı. O sarp yoquş ne olğanını bilesiñmi? Hızmetkâr azat etmek ya da açlıq kunünde yaqını olğan bir yetimni, yahut ap-açıq bir yoqsulnı toyurmaqtır."
        cid: 0
  - verse: 11
    segments:
      - text: "[10 ayetine baq.]"
        cid: 0
  - verse: 12
    segments:
      - text: "[10 ayetine baq.]"
        cid: 0
  - verse: 13
    segments:
      - text: "[10 ayetine baq.]"
        cid: 0
  - verse: 14
    segments:
      - text: "[10 ayetine baq.]"
        cid: 0
  - verse: 15
    segments:
      - text: "[10 ayetine baq.]"
        cid: 0
  - verse: 16
    segments:
      - text: "Soñ iman etkenlerden, bir-birilerine sabır tevsiye etkenlerden ve bir-birilerini acımaqnı ogütlegenlerden olmaqtır. İşte, bular sağdakilerdir. (Qur’anda keçken «sağdakiler» ve «soldakiler» tabirleriniñ manası içün Vaqıa suresi, 8, 9, 16-nci ayetleriniñ izaatlarına baq.)."
        cid: 0
  - verse: 17
    segments:
      - text: "[16 ayetine baq.]"
        cid: 0
  - verse: 18
    segments:
      - text: "Ayetlerimizni inkâr etkenler ise, işte olar soldakilerdir. Cezaları, qapuları ustlerine sım-sıq qapatılğan bir ateştir."
        cid: 0
  - verse: 19
    segments:
      - text: "[18 ayetine baq.]"
        cid: 0