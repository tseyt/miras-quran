        cid: 0
  - verse: 16
    segments:
      - text: >
          [11 ayetine baq.]
        cid: 0
  - verse: 17
    segments:
      - text: >
          Soñ iman etkenlerden, bir-birilerine sabır tevsiye etkenlerden ve bir-birilerini
          acımaqnı ögütlegenlerden olmaqtır. İşte, bular sağdakilerdir. (Qur'anda keçken
          «sağdakiler» ve «soldakiler» tabirleriniñ manası içün Vaqıa suresi, 8, 9, 16-nci
          ayetleriniñ izaatlarına baq.).
        cid: 0
  - verse: 18
    segments:
      - text: >
          [17 ayetine baq.]
        cid: 0
  - verse: 19
    segments:
      - text: >
          Ayetlerimizni inkâr etkenler ise, işte olar soldakilerdir. Cezaları, qapuları
          üstlerine sım-sıq qapatılğan bir ateştir.
        cid: 0
  - verse: 20
    segments:
