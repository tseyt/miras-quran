surah_id: 90
language: crh
author: dizen-qurtnezir
verses:
  - verse: 5
    segments:
      - text: "İnsan, iç kimse oña kuç yetiştiralmaycaq belleymi? 6. «Pek çoq mal arcladım» dey. (Bazı tefsirlerge kore, ayette, muşriklerniñ Az. Peyğamberge duşmanlıq oğrunda yapqan arcalamalarından söz etüvlerine işaret olunmaqta)."
        cid: 0
  - verse: 7
    segments:
      - text: "Kimse onı kormedi belleymi? 8-10. Biz oña eki koz, bir til ve eki dudaq bermedikmi? Oña eki yol (doğru ve egrini) kostermedikmi? 11-16. Faqat o, sarp yoquşnı aşalmadı. O sarp yoquş ne olğanını bilesiñmi? Hızmetkâr azat etmek ya da açlıq kunünde yaqını olğan bir yetimni, yahut ap-açıq bir yoqsulnı toyurmaqtır. 17-18. Soñ iman etkenlerden, bir-birilerine sabır tevsiye etkenlerden ve bir-birilerini acımaqnı ogütlegenlerden olmaqtır. İşte, bular sağdakilerdir. (Qur’anda keçken «sağdakiler» ve «soldakiler» tabirleriniñ manası içün Vaqıa suresi, 8, 9, 16-nci ayetleriniñ izaatlarına baq.). 19-20. Ayetlerimizni inkâr etkenler ise, işte olar soldakilerdir. Cezaları, qapuları ustlerine sım-sıq qapatılğan bir ateştir."
        cid: 0
  - verse: 91
    segments:
      - text: "eş-ŞEMS Qadir suresinden soñ, Mekkede engen, 15 ayettir. Adını sureniñ ilk kelimesi olğan ve «kuneş» manasındaki «şems»ten alğan. Bu surede insannıñ yaratılışında mevcut eki hususiyet añlatıla: yahşılıq ve yamanlıq. İnsannıñ yaratılışında yahşı olmaq da, yaman olmaq da qabiliyet olaraq bardır. Bismilâaһirraһmaanirraһiim (Rahman ve rahim olğan Allaһnıñ adınen). 1-10. Kuneşke ve quşluq vaqtındaki aydınlığına, kuneşni taqip etkeninde ayğa, onı aşkâr etken kundüzge, onı ortkeninde gecege, kok yuzüne ve onı bina etkende, yerge ve onı yapıp töşegenge, nefiske ve oña bir taqım qabiliyetler berip de, yahşılıq ve yamanlıqlarnı ilham etkenge yemin eterim ki, nefsini fenalıqlardan arındırğan, qurtulışqa irişken, onı fenalıqlarğa komgen de, ziyan etkendir. 11-15. Semuud qavmı adden aşqanı sebebinden (Allaһnıñ elçisini) yalanladı. Olarnıñ eñ bedbahtı (deveni soymaq içün) atılğanda, Allaһnıñ Resulı olarğa: «Allaһnıñ devesine ve onıñ suv aqqına toqunmañ!», dedi. Amma, olar onı yalanladılar ve deveni soydılar. Bunıñ ustüne, Rabbleri, gunahları sebebinden, olarğa buyuk bir felâket yolladı da, episini elâk etti. (Allaһ bu şekilde azap etüvniñ) aqibetinden qorqacaq degil ya! (Allaһ Semuud qavmına Salih Peyğamberni yollağan edi. Ondan mucize istediler. Allaһ oña pek guzel bir ırğaçı deve yolladı. Bu deveniñ otlaqlarda serbest dolaşuvı, belli bir kunde suv içüvi, devege kimseniñ fenalıq yapmaması emir etildi. Qudar b. Salif adlı birisi Az. Salihni yalanladı. Soñ deveni soydılar. Allaһ olarnıñ memleketlerini başlarına yıqtı ve olarnı elâk etti. Olardan qalğan harabeler alâ mevcuttır)."
        cid: 0