surah_id: 90
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >
          Bu bölgege -ki sen bu bölgedesiñ-, babağa ve ondan meydanğa kelgen balağa yemin
          eterim ki, biz insannı (köz-közge kelecek nice) zorluqlar içinde yarattıq.
        cid: 0
  - verse: 2
    segments:
      - text: >
          [1 ayetine baq.]
        cid: 0
  - verse: 3
    segments:
      - text: >
          [1 ayetine baq.]
        cid: 0
  - verse: 4
    segments:
      - text: >
          [1 ayetine baq.]
        cid: 0
  - verse: 5
    segments:
      - text: >
          İnsan, iç kimse oña küç yetiştiralmaycaq belleymi?
        cid: 0
  - verse: 6
    segments:
      - text: >
          «Pek çoq mal arcladım» dey. (Bazı tefsirlerge köre, ayette, müşriklerniñ Az.
          Peyğamberge duşmanlıq oğrunda yapqan arcalamalarından söz etüvlerine işaret
          olunmaqta).
        cid: 0
  - verse: 7
    segments:
      - text: >
          Kimse onı körmedi belleymi?
        cid: 0
  - verse: 8
    segments:
      - text: >
          Biz oña eki köz, bir til ve eki dudaq bermedikmi? Oña eki yol (doğru ve egrini)
          köstermedikmi?
        cid: 0
  - verse: 9
    segments:
      - text: >
          [8 ayetine baq.]
        cid: 0
  - verse: 10
    segments:
      - text: >
          [8 ayetine baq.]
        cid: 0
  - verse: 11
    segments:
      - text: >
          Faqat o, sarp yoquşnı aşalmadı. O sarp yoquş ne olğanını bilesiñmi? Hızmetkâr
          azat etmek ya da açlıq kününde yaqını olğan bir yetimni, yahut ap-açıq bir
          yoqsulnı toyurmaqtır.
        cid: 0
  - verse: 12
    segments:
      - text: >
          [11 ayetine baq.]
        cid: 0
  - verse: 13
    segments:
