surah_id: 111
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "Ebu Leһebniñ eki eli qurusın! Qurudı da. Malı ve qazanğanları oña fayda bermedi. O alevli bir ateşte yanacaq. Odun taşıyıcı olaraq ve boynunda hurma lifinden bukülgen bir yip olğanı alda, qadını da (ateşke kirecek)."
        cid: 0