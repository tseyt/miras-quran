surah_id: 111
language: crh
author: dizen-qurtnezir
verses:
  - verse: 112
    segments:
      - text: "el-İHLYaAS İhlâas - samimiy olmaq, dinge yurekten bağlanmaq, esaslarını tek Allaһ rizası içün tedbiq etmek manasındadır. Mekkede engen, 4 ayettir. İslâmnıñ tevhid qaidesiniñ eñ esaslı ve añlayışlı ifadesidir. Bismilâaһirraһmaanirraһiim (Rahman ve rahim olğan Allaһnıñ adınen). 1-4. De ki: O, Allaһ birdir. Allaһ sameddir. O, doğurmağan ve doğmağandır. Onıñ iç bir teñyeşi (beñzegeni) yoqtır. (Samed - iç bir şeyge muhtac olmağan, aksine er şey oña muhtacdır, demektir)."
        cid: 0
  - verse: 113
    segments:
      - text: "el-FELYaQ Felâq - saba mansında olğanı kibi, yarmaq manasını da bere. Bundan soñ kelgen Naas suresinen birlikte, ekisini «eki qorçalayıcı» manasında «muavvizeteyn» denilir. Bu surelerniñ şifa maqsadınen oqulğanına dair hadisler bar. Medinede engen, 5 ayettir. Bismilâaһirraһmaanirraһiim (Rahman ve rahim olğan Allaһnıñ adınen). 1-5. De ki: Yarattığı şeylerniñ şerrinden, qaranlığı çökken zamanı geceniñ şerrinden, dügümlerge ufürip, tılsım yapqan ufleyicilerniñ şerrinden ve qızğanğan vaqtında qızğanç insannıñ şerrinden sabanıñ Rabbine sığınırım!"
        cid: 0
  - verse: 114
    segments:
      - text: "en-NAAS Naas - insanlar demektir. Medinede engen, 6 ayettir. Bismilâaһirraһmaanirraһiim (Rahman ve rahim olğan Allaһnıñ adınen). 1-6. De ki: İnsanlarnıñ qalplerine vesvese soqqan, (insan Allaһnı añğanında) pusuğa çekilgen cin ve insan şeytanınıñ şerrinden insanlarnıñ Rabbine, insanlarnıñ melikine (mutlaq saip ve akimine) insanlarnıñ İlâhine sığınırım! İlâveler Mevzular boyunca munderice -------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- AHLYaQ ------------------------------------- ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ Adalet                  [2:282], [3:18], [3:21], [5:8], [5:42], [4:3], [4:58], [4:105], [4:135], [4:152], [7:29 ], [7:159], [7:181], [16:76], [16:90], [21:47], [33:5], [42:15], [57:25], [60:8], [49: 10] Adam oldürmekniñ cezası                                                                                          [4:92], [4:93] Aile ahlâqı                                                                                    [4:3], [4:4], [4:129], [24:22], [33:55] Aile - sevgi ve uzur yuvası                                                                                            [30 : 21] Ailede barış                                                                                                   [4 : 128] Ayvanlarğa beñzegenler                                                                                          [7:179], [47:12] Alçaqgoñyullilik                                                                                                [25 : 63] Ana-babağa itaat                                                                              [17:23-25], [29:8], [31:14], [31:15], [46:15] Ana-babağa ne zaman itaat etilmez          