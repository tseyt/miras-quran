ye). eyi                                              yahşı. ekim                                         (vraç, doktor). ekseriyeti                                          çoqusı. elâk olmaq                                   yoq olmaq, olmek. emel                                          arzu, istek. ---------------------------------------------------------------------------------------------------- emin          işanç. ------------- ---------------------------------------------- emniyetli      işançlı (bezopasno). endirilgen   tüşürilgen. emce-zade    emce oğlu. ensar         Medinedeki yerli musulmanlar. erzaq        rızıq, aşayt. esap kunü     qıyamet kunü. esaret        esirlik. ehl-i kitap   yeudiyler ve hristianlar. eş            qadın, qoca. Yu yuce          buyuk, ulu. Ya yaqalamaq    quvıp tutmaq (shvatit, poymat). yaqlaştı      yaqınlaştı. yaqıiyn       (dostovernost, nesomnennost, uverennost). yaqışmaz      uymaz, kelişmez, yaraşmaz. Bir hatim duası Allaaһumme Rabbenaa yaa Rabbenaa taqabbel minnaa inneke Entes-semiul-aliim. Ve tub aleynaa yaa mevlâanaa inneke Entet-tevvaabur-Raһiim. Veһdinii veћdinaa ve veffiqnaa ilel-һaqqi ve ilâa tariiqin mustaqiim. Bi bereketi hatmil-qur’aanil-azıim. Ve bi һurmeti һabiibike ve resuulikel-keriim. Vafu annaa yaa keriim, vafu annaa yaa raһiim. Vağfir lenaa zunuubenaa bi fadlike ve keramike yaa ekremel-ekremiin. Ve yaa erһamer raһimiin. Allaaһumme zeyyinnaa bi ziineti hatmil-qur’aan. Ve ekrimnaa bi keraameti hatmil-qur’aan. Ve şerrifnaa bi şeraafeti hatmil-qur’aan. Ve elbisnaa bi hil-ati hatmil-qur’aan. Ve edhilnel-cennete bi şefaa-atil-qur’aan. Ve aafinaa min kulli belâaiddünya ve azaabil-aahirati bi һurmeti hatmil-qur’aan. Verһam cemii’a ummeti Muһammedin bi һurmeti hatmil-qur’aan. Allaһummeca’lil qur’aane lenaa fid-dünyaa qarinnaa, ve fil-qabri muunisa, ve fil qıyameti şefiia, ve ales-sıraati nuuraa, ve ilel-cenneti rafiiqaa, ve minennaari sitran ve һicaabaa, ve ilel hayraati kulleһaa deliilen ve imaama, bi fadlike vecuudike ve keramike yaa ekremel-ekremiin. Allaaһummerzuqnaa bi kulli һarfin minel-qur’aani һalaaveһ. Ve bi kulli kelimetin keraameһ. Ve bi kulli aayetin saadeһ. Ve bi kulli süuratin selâmeһ. Ve bi kulli cuz’in cezaa’e. Ve sallallaaһü alâa seyyidinaa Muһammedin ve aalihii ecmain et-tayyibine et taһiriin. Allaaһummensur men nesaraddiin. Vektubis-selâamete vel aafiyete aleynaa ve alelhuccaaci vel-ğuzaati vel-musaafiriine vel-muqiimiin. Fii berrike ve barrike min ummeti Muһammedin aleyһim ecmaıin. Allaһumme belliğ sevaabe maa qara’naaһü ve nuura maa televnaaһü ilâa ruuһi nebiyyinaa Muһammedin sallallaaһu taalâa aleyһi ve sellem, ve li ervaaһi evlâadiһii ve ezvaaciһii ve esһaabiһii ridvaanullaaһi taalâa aleyһim ecmaıin, ve li ervaaһi aabaainaa, ve ummaһaatinaa, ve ebnaainaa, ve benaatinaa, ve ihvaaninaa, ve ehavaatinaa, ve esdiqaainaa, ve ustaazinaa, ve aqribaainaa, ve meşaayihinaa, ve li men leһüu һaqqun aleynaa ve li ervaaһi ceminıl-mu’miniine vel-mu’minaat, vel-muslimiine velmuslimaat, el-aһyaai minһum vel emvaati biraһmetike yaa erһamer-raaһimiin. Cezallaaһu annaa Muһammeden sallallaaһu aleyһi veselleme maa һuve eһlüһ. Subһaane rabbike rabbil izzeti ammaa yasifuun, veselâamun alâl-murseliin, vel-һamdu lillâaһi rabbil-aalemiin. Ana tilimizde boyle de dua etile bilir: Allaһım! Yuce kitabıñ Qur’an-ı Kerimde: «Maña dua etiñiz, duañıznı qabul eteyim», diye buyurasıñ. İşte, saña dua etmek içün toplandıq, ellerimizni Seniñ soñsız olğan qudretiñye, quvetiñye açtıq. Dualarımıznı qabul eyle, ya Rabbi! Ya Rabbi! Bizler gunahkâr qullarmız. Seniñ ise rahmetiñ, bereketiñ, avfıñ bol. Qur’an-ı Kerimden oquğan sure ve ayetlerimizni, dua ve salavatlarnı qabul eyle. Ya Rabbi! Bizler aciz qullarmız. Nefislerimizge zulum etemiz, tövbe etkenimiz alda, kene gunah deryasına dalamız. Allaһım, bizge oyle bir aşq ber ki, Senden başqasını kormeyik, bizge oyle bir ibadet zevqı ber ki, Saña ibadet etmekten kursünmeyik. Bizge oyle insan sevgisi, Qur’an sevgisi ber ki, malımıznı, mulkümizni azreti Ebu Bekirler kibi, azreti Osmanlar kibi, azreti Umerler kibi arclayıq. Seniñ diniñ oğrunda Aliler kibi can feda eteyik. Allaһım! Vatanımızda Seniñ adıñ añılğan ezanlar iç bir zaman susmasın. Halqımıznıñ oz yurtunda onıñ saibi olup yaşamalarına, icrtte qalğanlarımıznıñ Vatanğa tezden qavuşmalarına yardımcı ol. Vatan içün, İslâm dini içün canlarını feda etken şeitlerimizni rahmet eyle. Vatanımıznı, cemi musulmanlarnı duşman ucuminden, kâfirler elinde oyuncaq oluvdan qurtar! Ya Rabbi! Oquğan bu sure ve dualarımızdan (Qur’andan, Yaasiin şeriften, Mevlid şeriften) asıl olğan savapnı yuce Peyğamberimiz Muһammed Mustafa (sallallahu aleyhi vesellem) ruhuna ediye eyledik, oña iriştir. Ya Rabbi! Qur’annıñ urmetine, Peyğamberlerniñ aşqına dualarımıznı qabul eyle! Rabbenaa aatinaa fid-dünyaa һaseneten ve fil-aahirati һaseneten ve qinaa azaaben-naar, Rabbenağfirlii ve li vaalideyye ve lil mu’miniine yevme yequumul һisaab. Amin! Bi һurmeti seyyidil-murseliin, vel-һamdu lillâaһi rabbil-alemii. El-Faatiһa. Faydalanılğan menbalar 1). Qur’an-ı Kerim ve açıqlamalı meali. Azırlağanlar Prof., d-r Ali OZEK ve digerleri. Anqara, 1993. 2). Qur’an-ı Kerim ve yuce meali. Abdullah AYDINnıñ tercimesi. İstanbul, 1992. 3). Qur’an-ı Kerim ve kelime meali. Terciman Medine BALCI. İstanbul, 1995. 4). Prof., d-r Muһammed HAMİDULLAH. Qur’an-ı Kerim tarihı. İstanbul, 1993. 5). Prof., d-r İsmail CERRAHOĞLU. Tefsir usulı. Anqara, 1993. 6). Qur’an-ı Kerim luğatı. Mahmud Çanganıñ tercimesi. İstanbul, 1991. 7). Muһammed Al-ARABİY. Qur’an-ı Kerimniñ mevzularına kore mundericesi. İstanbul, 1979. 8). Prof., d-r İsmail CERRAH oğlu. Tefsir usulı. 9-ncı neşri. Anqara, 1993. 9). Koran. İ.Ü.Kraçkovskiyniñ tercimesi. Moskva, 1990. 10). Koran. Perevodı smıslov. Valeriya Porohova-ar-Roşdniñ tercimesi. Moskva, 1991. 11). Lütsian İppolitoviç KLİMOVİÇ. Kniga o Korane. Moskva, 1986."
