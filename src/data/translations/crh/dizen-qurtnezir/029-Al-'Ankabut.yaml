      - text: >-
          (12-nci ayette kâfirler başqalarnıñ günahını arqalamaycağı bildirilir eken, bu
          ayette doğru yoldan saptırğan kişileriniñ veballarını da taşıycaqları ifade etile.
          Aslında, bu yerde uymağan bir vaziyet yoq. Zira, evelki ayette kâfirlerniñ saptırmaq
          istegen kimselerni qandırmaq içün olarğa: «Siziñ günahıñıznı biz arqalaycaqmız», dep
          olarnıñ günahlarını ortadan qaldırmaqnı vade etkenleri añlatıla. Er eki ayet
          birlikte talil etilgende, iç kimse başqasınıñ günahını -şahsen özü çekivüni köz
          ögüne alsa bile- ortadan qaldırtmağa küçü yetmeycegi, bunıñnen beraber, başqalarını
          doğru yoldan saptırğanlarnıñ qat-qat vebal yüklenecekleri, faqat böylece, yoldan
          sapqanlarnıñ da, öz günahlarından qurtulalmaycaqları añlaşılmaqta).
