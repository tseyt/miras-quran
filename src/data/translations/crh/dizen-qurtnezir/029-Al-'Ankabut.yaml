surah_id: 29
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >
          Elif. Lâam. Miim.
        cid: 0
  - verse: 2
    segments:
      - text: >
          İnsanlar, imtiandan keçirilmeden, sadece «İman ettik», deyüvlerinen, bıraqıla
          berilecek belledilermi? (Bu ayetniñ imanları sebebinden, çeşit eskencelerge
          oğrağan bazı sahabiler aqqında nazil olğanı rivayet etilgen).
        cid: 0
  - verse: 3
    segments:
      - text: >
          Ant olsun ki, biz olardan evelkilerni de imtiandan keçirgen edik. Elbette, Allah
          doğrularnı ortağa çıqaracaq, yalancılarnı da mıtlaqa ortağa qoyacaq.
        cid: 0
  - verse: 4
    segments:
      - text: >
          Yoqsa, yamanlıqlarnı yapqanlar bizden qaça bilecekler zan ettilermi, ne qadar
          fena (ne yañlış) üküm bermekteler!
        cid: 0
  - verse: 5
    segments:
      - text: >
          Kim Allahqa qavuşmaqnı ümüt etse, bilsin ki, Allahnıñ tayin etken o vaqıtı
          elbette kelecek. O er şeyni eşitici ve bilicidir.
        cid: 0
  - verse: 6
    segments:
      - text: >
          Cihad etken, ancaq özü içün cihad etken olur. Şübesiz, Allah alemlerge muhtac
          degil.
        cid: 0
  - verse: 7
    segments:
      - text: >
          İman etip, yahşı işler yapqanlarnıñ (keçmiş) fenalıqlarını elbette qapatırmız ve
          olarğa yapqanlarınıñ daa güzelinen qarşılıq berirmiz.
        cid: 0
  - verse: 8
    segments:
      - text: >
          Biz, insanğa, ana-babasına eyi davranuvını tevsiye etkendirmiz. Eger olar, seni,
          aqqında bilgiñ olmağan bir şeyni (kör-korane) maña ortaq qoşuvıñ içün zorlar
          iseler, olarğa itaat etme. Dönüşiñiz ancaq mañadır. O zaman sizge
          yapqanlarıñıznı haber berecegim.
        cid: 0
  - verse: 9
    segments:
      - text: >
          İman etip, yahşı işler yapqanlarnı, muaqqaq salihler toplulığına qoşarmız.
        cid: 0
  - verse: 10
    segments:
      - text: >
          İnsanlardan kimisi bar ki: «Allahqa inandıq», der; faqat Allah oğurında eziyetke
          oğratılğan vaqtında, insanlarnıñ eskencesini Allahnıñ azabı kibi qabul eter.
          Albuki, Rabbiñden bir zafer (yardım) kelecek olsa, mıtlaqa: «Doğrusı, biz de
          siznen beraber edik», derler. Yahşı da, Allah, er kesniñ qalbindekilerni eñ
          yahşı bilici degilmi? (Bu manağa köre, samimiy iman saibi olmağan bu kibi
          kimselerniñ, Allah yolunda eziyetke oğrağanlarında, rastkelgen dünyaviy
          eskencelerni, Allahnıñ ahiretteki azabına musaviy tutuvları añlatıla. Bir de
          «İnsanlardan körgen azapnı Allahnıñ azabı kibi sayar» manası berilmekte).
        cid: 0
  - verse: 11
    segments:
      - text: >
          Allah, elbette (Oña goñülden) iman etkenlerni de bilir, eki yüzlülerni de bilir
          (ortağa çıqaracaq).
        cid: 0
  - verse: 12
    segments:
      - text: >
          Kâfirler iman etkenlerge: Bizim yolumızğa uyıñ, siziñ günahlarıñıznı biz
          arqalayıq, derler. Albuki, olarnıñ iç bir günahını arqalaycaq degiller. Çünki,
          aqiqaten olar kesen-kes yalan söylemekteler.
        cid: 0
  - verse: 13
    segments:
      - text: >
          (Faqat aqiqat şu ki) elbette öz yüklerini (veballarını), öz yüklerinen birlikte
          nice yüklerni taşıycaqlar ve uydırıp turğan şeylerinden qıyamet künü mıtlaqa
          sorğuğa çekilecekler. (12-nci ayette kâfirler başqalarnıñ günahını arqalamaycağı
          bildirilir eken, bu ayette doğru yoldan saptırğan kişileriniñ veballarını da
          taşıycaqları ifade etile. Aslında, bu yerde uymağan bir vaziyet yoq. Zira,
          evelki ayette kâfirlerniñ saptırmaq istegen kimselerni qandırmaq içün olarğa:
          «Siziñ günahıñıznı biz arqalaycaqmız», dep olarnıñ günahlarını ortadan
          qaldırmaqnı vade etkenleri añlatıla. Er eki ayet birlikte talil etilgende, iç
          kimse başqasınıñ günahını -şahsen özü çekivüni köz ögüne alsa bile- ortadan
          qaldırtmağa küçü yetmeycegi, bunıñnen beraber, başqalarını doğru yoldan
          saptırğanlarnıñ qat-qat vebal yüklenecekleri, faqat böylece, yoldan sapqanlarnıñ
          da, öz günahlarından qurtulalmaycaqları añlaşılmaqta).
        cid: 0
  - verse: 14
    segments:
      - text: >
          Ant olsun ki, biz Nuhnı öz qavmına yolladıq da, o biñ yıldan elli yıl eksik bir
          devir olarnıñ arasında qaldı. Soñunda olar zulumlarını devam ettirir ekenler,
          tufan olarnı yaqalay qoydı.
        cid: 0
  - verse: 15
    segments:
      - text: >
          Faqat biz onı ve gemidekilerni qurtardıq ve bunı alemlerge bir ibret yaptıq.
        cid: 0
  - verse: 16
    segments:
      - text: >
          İbrahimni de yolladıq. O qavmına böyle degen edi: Allahqa qullıq etiñ. Oña qarşı
          kelüvden saqınıñ. Eger bilseñiz, bu siz içün daa hayırlıdır.
        cid: 0
  - verse: 17
    segments:
      - text: >
          Siz Allahnı bıraqıp, bir taqım putlarğa tabınmaqta, asılsız sözler
          uydurmaqtasıñız. Bilmelisiñiz ki, Allahnı bıraqıp da, tabınğanlarıñız sizge
          rızıq beralmazlar. O alda, rızıqnı Allah qatında arañ. Oña qullıq etiñ ve Oña
          şükür etiñ, ancaq Oña dündürileceksiñiz.
        cid: 0
  - verse: 18
    segments:
      - text: >
          Eger (sizge tebliğ etilgenni) yalan sayar iseñiz, biliñ ki, sizden evelki bir
          çoq milletler de (özlerine tebliğ etilgenni) yalan sayğan ediler. Peyğamberge
          tüşkeni, yalıñız açıq bir tebliğdir.
        cid: 0
  - verse: 19
    segments:
      - text: >
          Allah yaratılğannı ilk baştan nasıl yaratqanını, (ölümden) soñ bunı (nasıl)
          tekrarlağanını körmedilermi? Şübesiz, bu, Allahqa köre qolaydır. (Bir taraftan,
          ölümden soñ tirilmege, diger taraftan da, tabiattaki devamlı yañılanuvğa işaret
          olunmaqta).
        cid: 0
  - verse: 20
    segments:
      - text: >
          De ki: Yer yüzünde kezip dolaşıñ da, Allah ilk baştan nasıl yaratqan, bir baqıñ.
          İşte, Alllah bundan soñ (aynı şekilde) ahiret ayatını da yaratacaq. Aqiqaten,
          Allah er şeyge qadirdir.
        cid: 0
  - verse: 21
    segments:
      - text: >
          O, istegenine azap berir, istegenine merhamet eter. Ancaq, Oña
          döndürileceksiñiz.
        cid: 0
  - verse: 22
    segments:
      - text: >
          Siz ne yer yüzünde, ne de kökte (Allahnı) aciz bıraqalmazsıñız. Allahtan başqa
          bir dost ve yardımcı da tapalmazsıñız. (İlâhiy ükümden qurtulmaq içün ne yer
          yüzüniñ eñ gizli yerine saqlanuvnıñ, ne de kök yüzüne çıquvnıñ fayda bermeycegi
          añaltılmaqta, insanlarnıñ kökke çıqacaqlarına da, esaslı olaraq işaret
          etilmekte).
        cid: 0
  - verse: 23
    segments:
      - text: >
          Allahnıñ ayetlerini ve Oña qavuşmaqnı inkâr etkenler -işte olar- menim
          rahmetimden ümütlerini keskenlerdir ve olar içün accı bir azap bardır.
        cid: 0
  - verse: 24
    segments:
      - text: >
          Qavmınıñ (İbrahimge) cevabı ise: «Onı öldüriñ yahut yaqıñ!», deyüvlerinden
          ibaret oldı. Amma, Allah onı ateşten qurtardı. Doğrusı, bunda, iman etken bir
          qavm içün ibertler bar.
        cid: 0
  - verse: 25
    segments:
      - text: >
          (İbrahim olarğa) dedi ki: Siz, yalıñız arañızdaki dünya ayatına has mabetlik
          oğruna Allahnı bıraqıp, bir taqım putlar edindiñiz. Soñ qıyamet künü (kelip
          çatqanda ise) bir-biriñzni tanımadan kelecek ve bir-biriñizge lânet
          oquycaqsıñız. Baracaq yeriñiz ceennemdir ve iç yardımcıñız da yoqtır.
        cid: 0
  - verse: 26
    segments:
      - text: >
          Bunıñ üstüne, Luut oña iman etti ve (İbrahim): Doğrusı, men Rabbime (emir etken
          yerge), icret etmektem, Şübesiz, O, mutlaq küç ve ikmet saibidir, dedi. (Luut
          Peyğamber, Az. İbrahimniñ qardaş balasıdır. Peyğamber olğanı diqqatqa alınsa,
          onıñ daa evel küfürde olup da, iman ketirgenini tüşünmek olmaz. Ayette Az.
          İbrahimni ilk tasdiq etken Luut aleyhisselâm olğanına işaret etilmekte. Az.
          İbrahimniñ qadını Sare ve Az. Luutnen birlikte, özü doğğan yeri olganı söylengen
          Kusaa koyunden Harraanğa, o yerden Şamğa barğanı ve niayet Felestinge, Luut
          Peyğamberniñ Sodom denilgen yerge tüşkeni rivayet olunmaqta. Ayet daa ziyade bu
          rivayetke köre manalandırılmaqta. Bunıñnen birlikte: «Doğrusı, men Rabbime
          sığınam», şeklinde bir mana da berilmekte).
        cid: 0
  - verse: 27
    segments:
      - text: >
          Oña İshaq ve Yaqubnı bağışladıq. Peyğamberlikni ve kitaplarnı, onıñ soyundan
          olğanlarğa berdik. Oña dünyada mükâfatını berdik. Şübesiz, O, ahirette de
          salihlerdendir.
        cid: 0
  - verse: 28
    segments:
      - text: >
          Luutnı da (yolladıq). O, qavmına degen edi ki: Aqiqaten, siz daa evel iç bir
          milletniñ yapmağan bir ayasızlığını yapsıñız!
        cid: 0
  - verse: 29
    segments:
      - text: >
          (Bu ilâhiy tenbiyeden soñ, alâ) siz ille de erkeklerge yaqlaşacaq, yol kesecek
          ve toplaşuvlarıñızda edepsizlikler yapacaqsıñızmı! Qavmınıñ cevabı ise, böyle
          deyüvlerinden ibaret oldı: (Yapqanlarmıznıñ fenalığı ve azapqa oğraycağımız
          meselesinde) doğru söylegenlerden iseñ, Allahnıñ azabını ketir bizge!
        cid: 0
  - verse: 30
    segments:
      - text: >
          (Luut:) Şu fesatçılar topuna qarşı maña yardım eyle, Rabbim! dedi. (Luut
          (a.s.)nıñ duası üzerine, Allah yaş deliqanlılar şeklinde melekler yolladı.
          Sapıqlar olarğa da tecavuz etmege ıntıldılar ve soñunda elâk oldılar).
        cid: 0
  - verse: 31
    segments:
      - text: >
          Elçilerimiz İbrahimge (eki oğul ihsan etecegimizge dair) müjdeni
          ketirgenlerinde, böyle dediler: Biz bu memleket halqını elâk etecekmiz. Çünki,
          olarnıñ halqı zalım kimselerdir.
        cid: 0
  - verse: 32
    segments:
      - text: >
          (İbrahim) dedi ki: Amma, o yerde Luut bar! Böyle cevap berdiler: Biz o yerde
          kimler olğanını pek yahşı bilemiz. Onı ve ailesini, elbette qurtaracaqmız.
          Yalıñız qadını istisna; o, (azapta) qalacaqlar arasındadır.
        cid: 0
  - verse: 33
    segments:
      - text: >
          Elçilerimiz Luutqa kelgende, Luut olar aqqında qasevetlendi ve (olarnı
          qorçalamaq içün) ne yapacağını bilalmadı. Oña: Qorqma, tasalanma! Çünki, biz
          seni de, aileñni de qurtaracaqmız. Yalıñız, (azapta) qalacaqlar arasında olğan
          qadınıñ istisna, dediler. (Melekler, insan qılığında kelgenlerinden, ilk evelâ
          Az. Luut olarnıñ melek olğanını añlap olamadı. Deliqanlı şekline kirgenleri
          içün, qavmnıñ olarğa da sarqıntılıq etüvinden qorqtı. Bunıñ üzerine melekler
          vaziyetni aşkâr ettiler).
        cid: 0
  - verse: 34
    segments:
      - text: >
          «Biz, şübesiz, bu memeleket halqınıñ üzerine, yoldan çıquvlarına qarşılıq,
          kökten (facia) bir azap endirecekmiz».
        cid: 0
  - verse: 35
    segments:
      - text: >
          Ant olsun ki, biz, aqlını qullanacaq bir qavm içün, o yerden ap-açıq bir ibret
          nişanesi bıraqqan edik. (Bu nişane, elâk etilgen qavmnıñ başına kelgenlernen
          bağlı ikâyeler, harap olğan yurtlarınıñ qalımtıları, kökten yağdırılğan taşlar,
          qap-qara aqqan nehirler şeklindeki izaatlarnen tefsir etilgen).
        cid: 0
  - verse: 36
    segments:
      - text: >
          Medyenge de, qardaşları Şuaybnı yolladıq ve Şuayb: Ey, qavmım! Allahqa qullıq
          etiñ, ahiret kününe ümüt bağlañ, yer yüzünde bozğuncılıq yaparaq, qarışıqlıq
          çıqarmañ! dedi. (Ayetniñ «ahiret kününe ümüt bağlañ», diye mana berilgen qısmı,
          «ahirette savap berilecegini ümüt etken işler yapıñ», «ahiret kününden qorquñ»,
          şeklinde izaatlanğan).
        cid: 0
  - verse: 37
    segments:
      - text: >
          Faqat onı yalancılıqnen qabaatladılar. Derken, özlerini bir sarsıntı yaqalay
          qoydı ve yurtlarında tiz üstüne çöke qaldılar. («Sarsıntı» şeklinde mana
          berilgen «racfe» kelimesi bu adisede teprenüv ve Cebrail aleyhisselâmnıñ
          qalplerge ürküntü bergen bağıruvı (sayha) şekillerinde tefsir etilgen. Bu ekinci
          tefsirge köre, «olarnı bir titrev aldı» tarzında da mana berilüvi mümkün).
        cid: 0
  - verse: 38
    segments:
      - text: >
          Aad ve Semuudnı da (elâk ettik). Siz içün, (olarnıñ başına neler kelgenini)
          oturğan yerlerinden ap-açıq añlaşılmaqta. Şeytan olarğa yapqan işlerini güzel
          kösterip, olarnı doğru yoldan çıqardı. Albuki, baqıp, köre bilecek vaziyette
          ediler.
        cid: 0
  - verse: 39
    segments:
      - text: >
          Qarunnı, Fıravunnı ve Haamaannı da (elâk ettik). Ant olsun ki, Musa olarğa
          ap-açıq deliller ketirgen edi de, olar yer yüzünde büyüklik taslağan ediler.
          Albuki, (azabımıznı aşıp) keçe bilecek degil ediler.
        cid: 0
  - verse: 40
    segments:
      - text: >
          Bunıñ kibi, olardan er birini günahı sebebinen, cezalandırdıq. Kiminiñ üstüne
          taşlar savurğan rüzgârlar yolladıq, kimini qorqunç bir ses yaqaladı, kimini
          yerniñ tübüne batırdıq, kimini de suvda boğdıq. Allah olarğa zulum etmey, aslı
          olar özlerine zulum ete ediler.
        cid: 0
  - verse: 41
    segments:
      - text: >
          Allahtan başqa dostlar tutunğanlarnıñ vaziyeti örümçekniñ vaziyeti kibidir.
          Örümçek bir yuva yapar; albuki, yuvalarnıñ eñ çürügi, şübesiz, örümçek
          yuvasıdır. Keşke bilseler edi! (Allahtan başqasını dost tutaraq, özlerine destek
          qıdırğanlarnıñ vaziyeti, ayette örümçekke beñzetilgen. Ayette esaslı olaraq
          ifade etilgenine köre, örümçek tekmil evsiz degil, özüne bir yuva yapar; faqat
          örümçek yuvasınıñ çürükligi meşurdir. İşte, örümçekniñ yuvası ne qadar zayıf
          ise, Allahtan başqasınıñ destek ve imayesine işanğanlarnıñ destegi de öyle
          çürüktir).
        cid: 0
  - verse: 42
    segments:
      - text: >
          Allah, olarnıñ Onı bıraqıp da, angi şeyge yalvarğanlarını, şübesiz bilir. O,
          mutlaq küç ve ikmet saibidir.
        cid: 0
  - verse: 43
    segments:
      - text: >
          İşte, biz bu misallerni insanlar içün ketirmektemiz; faqat olarnı ancaq
          bilgenler tüşünip añlay bilir. (Qureyşniñ cailleri ve fikirsiz taqımı:
          «Muhammedniñ Rabbi, çibinden, örümçekten, misaller ketire», diye külüp, alay ete
          ediler. Bu misallerniñ «insanlar» içün berilgeni bildirilerek, ayvandan farqı
          olmağan bu cail ve tüşüncesiz kimselerniñ bunı añlap olamaycaqlarına işaret
          etilmekte).
        cid: 0
  - verse: 44
    segments:
      - text: >
          Allah, köklerni ve yerni haq olaraq (yerli yerince) yarattı. Şübesiz, bunda,
          iman etkenler içün (Allahnıñ barlığına ve qudretine) bir nişane bulunmaqta.
        cid: 0
  - verse: 45
    segments:
      - text: >
          (Resulım!) Saña vahiy etilgen Kitapnı oqu ve namaznı qıl. Muaqqaq ki, namaz,
          ayasızlıqtan ve yamanlıqtan qorçalar. Allahnı añmaq, elbette (ibadetlerniñ) eñ
          büyügidir. Allah yapqanlarıñıznı bilir. (Ayet, günahqa yeteklegen arzularnıñ
          tazıyıqından qurtuluvnıñ ve ruh yüceligine irişüvniñ eñ sağlam yolunı
          köstermekte. Şübesiz, bu, eñ keniş manada «Allahnı añmaq»tır. Qur'an tilâveti ve
          namaz bunıñ eñ başında kelgen şekilleridir. Aqiqaten, Qur'annıñ manalarını,
          tüşüngenler içün, Qur'an tilâveti, daa evel farqına barılamağan bir çoq
          manalarnıñ aşkâr oluvını teminler; insannı ülviy bir alemge alıp barır. Qur'an
          tilâvetiniñ faziletinen bağlı pek çoq hadis bar. Aqqı berilerek, qılınğan
          namaznıñ da ruhnı ülviyleştirecegi ve mıtlaqa fenalıqtan qurtaracağı, bu ayette
          ve bir çoq hadiste israrnen bildirilmekte. Eyilikke yeteklemegen, fenalıqlardan
          uzaqlaştırmağan bir namaz ise, İslâm büyükleri tarafından sırtta taşınğan bir
          vebal olaraq añlatılğan).
        cid: 0
  - verse: 46
    segments:
      - text: >
          Aralarından zulum etkenler istisna, ehl-i kitapnen ancaq eñ güzel yolnen küreşiñ
          ve deñ ki: Bizge endirilgenge de, sizge endirilgenge de, iman ettik. Bizim
          Tañrımız da, siziñ Tañırıñız da - birdir ve biz Oña teslim olğandırmız.
        cid: 0
  - verse: 47
    segments:
      - text: >
          (Resulım!) İşte, böylece, saña (evelki kitaplarnı tasdiq etici) bu Kitapnı
          endirdik. Onıñ içün, özlerine kitap bergenlerimiz oña iman etmekteler. Şulardan
          (araplardan) da oña iman etken nice kimseler bar. Ayetlerimizni, ancaq kâfirler
          (inatlıqları sebebinden) bile-bile inkâr eter. (Tefsirlerde bu ayet ile Abdullah
          b. Selâm ve Ubey b. Ka'b kibi Qur'anğa iman etken ehl-i kitapqa işaret etilgeni
          bildirilmekte).
        cid: 0
  - verse: 48
    segments:
      - text: >
          Sen bundan evel ne bir yazı oqur, ne de eliñnen onı yazar ediñ. Öyle olsa edi,
          batılğa uyğanlar şübe duyar ediler. (Az. Peyğamberniñ «ümmiiy» yani
          oqumaq-yazmaq bilmegen bir insan oluvınıñ esas ikmeti bu ayette beyan etilmekte:
          Eger Resul-ı Ekrem oqumaq-yazmaqnı bilgen bir insan olsa edi, ümmiiy olğan
          peyğamber içün bile «Bu Qur'annı o uydırğan», deyüvge qalqqan ve eñ açıq
          mucizelerni inkâr etken müşrikler, iftiralarına bir ölçüde destek tapqan olacaq
          ve daa çoq kimselerni qandıra bilecek ediler).
        cid: 0
  - verse: 49
    segments:
      - text: >
          Yoq, o (Qur'an) özlerine ilim berilgenlerniñ yüreklerinde (yerleşken) ap-açıq
          ayetlerdir. Ayetlerimizni ancaq zalımlar bile-bile inkâr eter.
        cid: 0
  - verse: 50
    segments:
      - text: >
          «Oña Rabbiñden (başqaca) mucizeler endirilmeli degil edimi?», derler. De ki:
          Mucizeler ancaq Allah qatındadır. Men ise, sadece ap-açıq bir tenbiyeciyim.
        cid: 0
  - verse: 51
    segments:
      - text: >
          Özlerine oquyatqan Kitapnı saña endürüvimiz olarğa yetmegenmi? Elbette, iman
          etken bir qavm içün onda rahmet ve ibret bar.
        cid: 0
  - verse: 52
    segments:
      - text: >
          De ki: Mennen siziñ arañızda şaat olaraq Allah yeterli. O, köklerde ve yerde ne
          bar ise bilir. Batılğa inanıp, Allahnı inkâr etkenler (bar ya), işte, ziyanğa
          oğraycaqlar olardır.
        cid: 0
  - verse: 53
    segments:
      - text: >
          Senden, azapnı çar-çabuk (ketirüviñni) istemekteler. Eger evelden tayin etilgen
          bir vade olmasa edi, azap elbette olarğa kelip çatqan edi. Faqat olar farqında
          olmağanda, o apansızdan olarğa kele qoyacaq.
        cid: 0
  - verse: 54
    segments:
      - text: >
          (Ebet) senden azapnı çar-çabuk (ketirüviñni) istemekteler. İç şübeleri olmasın,
          ceennem kâfirlerniñ çevre-etrafını saracaq.
        cid: 0
  - verse: 55
    segments:
      - text: >
          O künde azap, olarnı em üstlerinden, em ayaqlarınıñ astından saracaq ve Allah
          (olarğa): «Yapqanlarıñıznıñ (cezasını) tatıñ!», deycek.
        cid: 0
  - verse: 56
    segments:
      - text: >
          Ey, iman etken qullarım! Şübesiz, menim yerim keniştir. O alda (ne yerde işanç
          içinde olacaq iseñiz, o yerde) yalıñız maña qullıq etiñ. (Bu ayetniñ eskencege
          oğrağan Mekke musulmanlarınıñ zayıfları aqqında nazil olğanı rivayet etilgen).
        cid: 0
  - verse: 57
    segments:
      - text: >
          Er can ölümni tatacaq. Soñunda bizge döndürileceksiñiz.
        cid: 0
  - verse: 58
    segments:
      - text: >
          İman etip, güzel işler yapqanlarnı, (ebet) muaqqaq ki, olarnı, içinde ebediy
          qalmaq üzre, astlarından irmaqlar aqqan cennet köşklerine yerleştirecekmiz.
          (Böyle yahşı) işler yapqanlarnıñ mükâfatı ne güzeldir!
        cid: 0
  - verse: 59
    segments:
      - text: >
          Olar, sabır etken kimselerdir ve yalıñız Rabblerine işanıp tayanmaqtadırlar.
        cid: 0
  - verse: 60
    segments:
      - text: >
          Nice canlı bar ki, rızqını (yanında) taşımay. Olarğa da, sizge de, rızıq bergen
          Allahtır. O, er şeyni eşitir ve bilir. (Rivayetke köre, Az. Peyğamber Mekkede
          müşriklerden eziyet çekken musulmanlarğa Medinege köçüvlerini söylegeninen,
          olar: «O yerge nasıl barırmız? O yerde ne yerimiz-yurtumız, ne malımız-mülükimiz
          bar. Bizni kim aşatır-içirir?», degen ediler. Bunıñ üzerine nazil olğan bu
          ayetnen, yer yüzünde nice canlınıñ rızqını yanında taşımaqtan aciz olğanı ve
          niceleriniñ yarınki kün içün rızıq toplamadan yaşağanı, qısqası, rızıqnı bergen
          Allah olğanı hatırlatılğan).
        cid: 0
  - verse: 61
    segments:
      - text: >
          Ant olsun ki, olarğa: "Köklerni ve yerni yaratqan, küneşni ve aynı emiri altında
          tutqan kimdir?», diye sorasañ, mıtlaqa «Allah» derler. O alda, nasıl (haqtan)
          çevirilip döndürilmekteler?
        cid: 0
  - verse: 62
    segments:
      - text: >
          Allah rızıqnı qullarından tilegenine bol-bol berir, tilegenine de qısar.
          Şübesiz, Allah er şeyni haqqı ile bilicidir.
        cid: 0
  - verse: 63
    segments:
      - text: >
          Ant olsun ki, olarğa: «Kökten suv endirip, onıñnen ölüminiñ artından yer yüzüni
          canlandırğan kim?», diye sorasañ, mıtlaqa, «Allah» derler. De ki: (Öyle ise)
          hamd da Allahqa mahsustır, faqat olarnıñ çoqu (söylegenleri üzerinde)
          tüşünmezler.
        cid: 0
  - verse: 64
    segments:
      - text: >
          Bu dünya ayatı, sadece bir eglenceden, bir oyundan ibaret. Ahiret yurtuna (o
          yerdeki ayatqa) kelgende, işte asıl yaşav odır. Keşke bilseler edi!
        cid: 0
  - verse: 65
    segments:
      - text: >
          Gemige mingen zamanlarında, dinni yalıñız Oña has qılaraq (ihlâsnen) Allahqa
          yalvarırlar. Faqat olarnı sağ-selâmet qarağa çıqarğanınen, bir baqarsıñ ki,
          (Allahqa) ortaq qoşalar.
        cid: 0
  - verse: 66
    segments:
      - text: >
          Olarğa bergenlerimizge nisbeten nankorlik etsinler ve sefa sürsinler, baqayıq!
          Amma, yaqında bilecekler!
        cid: 0
  - verse: 67
    segments:
      - text: >
          Etraflarında inasanlar qapqaçlap alıp barılır eken, bizim (Mekkeni) işanç içinde
          muqaddes bir yer yapqanımıznı körmedilermi? Alâ batılğa inanıp, Allahnıñ
          nimetine nankorlik etelermi? (Ayette keçken «qapqaçlap alıp barıluv», öldirilüv,
          esir alınuv ve soyulıp yağmalanuv kibi manalarnen izaatlanğandır).
        cid: 0
  - verse: 68
    segments:
      - text: >
          Allahqa nisbeten yalan uydırğan yahut özüne haq kelgen eken, onı yalan sayğandan
          daa zalımı kimdir? Ceennemde kâfirlerge yer yoqmı!
        cid: 0
  - verse: 69
    segments:
      - text: >
          Amma, bizim oğrumızda cihad etkenlerni, elbette kendi yollarımızğa
          iriştirecekmiz. İç şübe yoq ki, Allah yahşı davranğanlarnen beraberdir.
        cid: 0
