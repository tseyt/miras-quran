surah_id: 29
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >-
          Elif. Lâam. Miim.
        cid: 0
  - verse: 2
    segments:
      - text: >-
          İnsanlar, imtiandan keçirilmeden, sadece «İman ettik», deyuvlerinen, bıraqıla
          berilecek belledilermi? (Bu ayetniñ imanları sebebinden, çeşit eskencelerge
          oğrağan bazı sahabiler aqqında nazil olğanı rivayet etilgen).
        cid: 0
  - verse: 3
    segments:
      - text: >-
          Ant olsun ki, biz olardan evelkilerni de imtiandan keçirgen edik. Elbette,
          Allaһ doğrularnı ortağa çıqaracaq, yalancılarnı da mıtlaqa ortağa qoyacaq.
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Yoqsa, yamanlıqlarnı yapqanlar bizden qaça bilecekler zan ettilermi, ne qadar
          fena (ne yañlış) uküm bermekteler!
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Kim Allaһqa qavuşmaqnı umüt etse, bilsin ki, Allaһnıñ tayin etken o vaqıtı
          elbette kelecek. O er şeyni eşitici ve bilicidir.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Cihad etken, ancaq ozü içün cihad etken olur. Şubesiz, Allaһ alemlerge muhtac
          degil.
        cid: 0
  - verse: 7
    segments:
      - text: >-
          İman etip, yahşı işler yapqanlarnıñ (keçmiş) fenalıqlarını elbette qapatırmız
          ve olarğa yapqanlarınıñ daa guzelinen qarşılıq berirmiz.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Biz, insanğa, ana-babasına eyi davranuvını tevsiye etkendirmiz. Eger olar,
          seni, aqqında bilgiñ olmağan bir şeyni (kor-korane) maña ortaq qoşuvıñ içün
          zorlar iseler, olarğa itaat etme. Dönüşiñiz ancaq mañadır. O zaman sizge
          yapqanlarıñıznı haber berecegim.
        cid: 0
  - verse: 9
    segments:
      - text: >-
          İman etip, yahşı işler yapqanlarnı, muaqqaq salihler toplulığına qoşarmız.
        cid: 0
  - verse: 10
    segments:
      - text: >-
          İnsanlardan kimisi bar ki: «Allaһqa inandıq», der; faqat Allaһ oğurında
          eziyetke oğratılğan vaqtında, insanlarnıñ eskencesini Allaһnıñ azabı kibi qabul
          eter. Albuki, Rabbiñden bir zafer (yardım) kelecek olsa, mıtlaqa: «Doğrusı, biz
          de siznen beraber edik», derler. Yahşı da, Allaһ, er kesniñ qalbindekilerni eñ
          yahşı bilici degilmi? (Bu manağa kore, samimiy iman saibi olmağan bu kibi
          kimselerniñ, Allaһ yolunda eziyetke oğrağanlarında, rastkelgen dünyaviy
          eskencelerni, Allaһnıñ ahiretteki azabına musaviy tutuvları añlatıla. Bir de
          «İnsanlardan korgen azapnı Allaһnıñ azabı kibi sayar» manası berilmekte).
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Allaһ, elbette (Oña goñyulden) iman etkenlerni de bilir, eki yuzlülerni de
          bilir (ortağa çıqaracaq).
        cid: 0
  - verse: 12
    segments:
      - text: >-
          Kâfirler iman etkenlerge: Bizim yolumızğa uyıñ, siziñ gunahlarıñıznı biz
          arqalayıq, derler. Albuki, olarnnı iç bir gunahını arqalaycaq degiller. Çünki,
          aqiqaten olar kesen-kes yalan söylemekteler.
        cid: 0
  - verse: 13
    segments:
      - text: >-
          (Faqat aqiqat şu ki) elbette oz yuklerini (veballarını), oz yuklerinen birlikte
          nice yuklerni taşıycaqlar ve uydırıp turğan şeylerinden qıyamet kunü mıtlaqa
          sorğuğa çekilecekler. (12-nci ayette kâfirler başqalarnıñ gunahını arqalamaycağı
          bildirilir eken, bu ayette doğru yoldan saptırğan kişileriniñ veballarını da
          taşıycaqları ifade etile. Aslında, bu yerde uymağan bir vaziyet yoq. Zira,
          evelki ayette kâfirlerniñ saptırmaq istegen kimselerni qandırmaq içün olarğa:
          «Siziñ gunahıñıznı biz arqalaycaqmız», dep olarnıñ gunahlarını ortadan
          qaldırmaqnı vade etkenleri añlatıla. Er eki ayet birlikte talil etilgende, iç
          kimse başqasınıñ gunahını -şahsen ozü çekivüni koz ogüne alsa bile- ortadan
          qaldırtmağa kuçü yetmeycegi, bunıñnen beraber, başqalarını doğru yoldan
          saptırğanlarnıñ qat-qat vebal yuklenecekleri, faqat boylece, yoldan sapqanlarnıñ
          da, oz gunahlarından qurtulalmaycaqları añlaşılmaqta).
        cid: 0
  - verse: 14
    segments:
      - text: >-
          Ant olsun ki, biz Nuһnı oz qavmına yolladıq da, o biñ yıldan elli yıl eksik bir
          devir olarnıñ arasında qaldı. Soñunda olar zulumlarını devam ettirir ekenler,
          tufan olarnı yaqalay qoydı.
        cid: 0
  - verse: 15
    segments:
      - text: >-
          Faqat biz onı ve gemidekilerni qurtardıq ve bunı alemlerge bir ibret yaptıq.
        cid: 0
  - verse: 16
    segments:
      - text: >-
          İbrahimni de yolladıq. O qavmına boyle degen edi: Allaһqa qullıq etiñ. Oña
          qarşı kelüvden saqınıñ. Eger bilseñiz, bu siz içün daa hayırlıdır.
        cid: 0
  - verse: 17
    segments:
      - text: >-
          Siz Allaһnı bıraqıp, bir taqım putlarğa tabınmaqta, asılsız sözler
          uydurmaqtasıñız. Bilmelisiñiz ki, Allaһnı bıraqıp da, tabınğanlarıñız sizge
          rızıq beralmazlar. O alda, rızıqnı Allaһ qatında arañ. Oña qullıq etiñ ve Oña
          şukür etiñ, ancaq Oña dündürileceksiñiz.
        cid: 0
  - verse: 18
    segments:
      - text: >-
          Eger (sizge tebliğ etilgenni) yalan sayar iseñiz, biliñ ki, sizden evelki bir
          çoq milletler de (ozlerine tebliğ etilgenni) yalan sayğan ediler. Peyğamberge
          tüşkeni, yalıñız açıq bir tebliğdir.
        cid: 0
  - verse: 19
    segments:
      - text: >-
          Allaһ yaratılğannı ilk baştan nasıl yaratqanını, (olümden) soñ bunı (nasıl)
          tekrarlağanını kormedilermi? Şubesiz, bu, Allaһqa kore qolaydır. (Bir taraftan,
          olümden soñ tirilmege, diger taraftan da, tabiattaki devaml yañılanuvğa işaret
          olunmaqta).
        cid: 0
  - verse: 20
    segments:
      - text: >-
          De ki: Yer yuzünde kezip dolaşıñ da, Allaһ ilk baştan nasıl yaratqan, bir
          baqıñ. İşte, Alllaһ bundan soñ (aynı şekilde) ahiret ayatını da yaratacaq.
          Aqiqaten, Allaһ er şeyge qadirdir.
        cid: 0
  - verse: 21
    segments:
      - text: >-
          O, istegenine azap berir, istegenine merhamet eter. Ancaq, Oña
          döndürileceksiñiz.
        cid: 0
  - verse: 22
    segments:
      - text: >-
          Siz ne yer yuzünde, ne de kokte (Allaһnı) aciz bıraqalmazsıñız. Allaһtan başqa
          bir dost ve yardımcı da tapalmazsıñız. (İlâhiy uyuyumden qurtulmaq içün ne yer
          yuzüniñ eñ gizli yerine saqlanuvnıñ, ne de kok yuzüne çıquvnıı fayda bermeycegi
          añaltılmaqta, insanlarnıı kokke çıqacaqlarına da, esasl olaraq işaret
          etilmekte).
        cid: 0
  - verse: 23
    segments:
      - text: >-
          Allaһnıñ ayetlerini ve Oña qavuşmaqnı inkâr etkenler -işte olar- menim
          rahmetimden umütlerini keskenlerdir ve olar içün accı bir azap bardır.
        cid: 0
  - verse: 24
    segments:
      - text: >-
          Qavmınıñ (İbrahimge) cevabı ise: «Onı oldüriñ yahut yaqıñ!», deyuvlerinden
          ibaret oldı. Amma, Allaһ onı ateşten qurtardı. Doğrusı, bunda, iman etken bir
          qavm içün ibertler bar.
        cid: 0
  - verse: 25
    segments:
      - text: >-
          (İbrahim olarğa) dedi ki: Siz, yalıñız arañızdaki dünya ayatına has mabetlik
          oğruna Allaһnı bıraqıp, bir taqım putlar edindiñiz. Soñ qıyamet kunü (kelip
          çatqanda ise) bir-biriñzni tanımadan kelecek ve bir-biriñizge lânet
          oquycaqsıñız. Baracaq yeriñiz ceennemdir ve iç yardımcıñız da yoqtır.
        cid: 0
  - verse: 26
    segments:
      - text: >-
          Bunıñ ustüne, Luut oña iman etti ve (İbrahim): Doğrusı, men Rabbime (emir etken
          yerge), icret etmektem, Şubesiz, O, mutlaq kuç ve ikmet saibidir, dedi. (Luut
          Peyğamber, Az. İbrahimniñ qardaş balasıdır. Peyğamber olğanı diqqatqa alınsa,
          onıñ daa evel kufürde olup da, iman ketirgenini tüşünmek olmaz. Ayette Az.
          İbrahimni ilk tasdiq etken Luut aleyhisselâm olğanına işaret etilmekte. Az.
          İbrahimniñ qadını Sare ve Az. Luutnen birlikte, ozü doğğan yeri olganı söylengen
          Kusaa koyunden Harraanğa, o yerden Şamğa barğanı ve niayet Felestinge, Luut
          Peyğamberniñ Sodom denilgen yerge tüşkeni rivayet olunmaqta. Ayet daa ziyade bu
          rivayetke kore manalandırılmaqta. Bunıñnen birlikte: «Doğrusı, men Rabbime
          sığınam», şeklinde bir mana da berilmekte).
        cid: 0
  - verse: 27
    segments:
      - text: >-
          Oña İshaq ve Yaqubnı bağışladıq. Peyğamberlikni ve kitaplarnı, onıñ soyundan
          olğanlarğa berdik. Oña dünyada mukâfatını berdik. Şubesiz, O, ahirette de
          salihlerdendir.
        cid: 0
  - verse: 28
    segments:
      - text: >-
          Luutnı da (ölladıq). O, qavmına degen edi ki: Aqiqaten, siz daa evel iç bir
          milletniñ yapmağan bir ayasızlığını yapsıñız!
        cid: 0
  - verse: 29
    segments:
      - text: >-
          (Bu ilâhiy tenbiyeden soñ, alâ) siz ille de erkeklerge yaqlaşacaq, yol kesecek
          ve toplaşuvlarıñızda edepsizlikler yapacaqsıñızmı! Qavmınıñ cevabı ise, boyle
          deyuvlerinden ibaret oldı: (Yapqanlarmıznıñ fenalığı ve azapqa oğraycağımız
          meselesinde) doğru söylegenlerden iseñ, Allaһnıñ azabını ketir bizge!
        cid: 0
  - verse: 30
    segments:
      - text: >-
          (Luut:) Şu fesatçılar topuna qarşı maña yardım eyle, Rabbim! dedi. (Luut
          (a.s.)nıñ duası uzerine, Allaһ yaş deliqanlılar şeklinde melekler yolladı.
          Sapıqlar olarğa da tecavuz etmege ıntıldılar ve soñunda elâk oldılar).
        cid: 0
  - verse: 31
    segments:
      - text: >-
          Elçilerimiz İbrahimge (eki oğul ihsan etecegimizge dair) mujdeni
          ketirgenlerinde, boyle dediler: Biz bu memleket halqını elâk etecekmiz. Çünki,
          olarnıñ halqı zalım kimselerdir.
        cid: 0
  - verse: 32
    segments:
      - text: >-
          (İbrahim) dedi ki: Amma, o yerde Luut bar! Boyle cevap berdiler: Biz o yerde
          kimler olğanını pek yahşı bilemiz. Onı ve ailesini, elbette qurtaracaqmız.
          Yalıñız qadını istisna; o, (azapta) qalacaqlar arasındadır.
        cid: 0
  - verse: 33
    segments:
      - text: >-
          Elçilerimiz Luutqa kelgende, Luut olar aqqında qasevetlendi ve (olarnı
          qorçalamaq içün) ne yapacağını bilalmadı. Oña: Qorqma, tasalanma! Çünki, biz
          seni de, aileñni de qurtaracaqmız. Yalıñız, (azapta) qalacaqlar arasında olğan
          qadınıñ istisna, dediler. (Melekler, insan qılığında kelgenlerinden, ilk evelâ
          Az. Luut olarnıñ melek olğanını añlap olamadı. Deliqanlı şekline kirgenleri
          içün, qavmnıñ olarğa da sarqıntılıq etüvinden qorqtı. Bunıñ uzerine melekler
          vaziyetni aşkâr ettiler). 34. «Biz, şubesiz, bu memeleket halqınıñ uzerine,
          yoldan çıquvlarına qarşılıq, kokten (facia) bir azap endirecekmiz».
        cid: 0
  - verse: 34
    segments:
      - text: >-
          Ant olsun ki, biz, aqlını qullanacaq bir qavm içün, o yerden ap-açıq bir ibret
          nişanesi bıraqqan edik. (Bu nişane, elâk etilgen qavmnıñ başına kelgenlernen
          bağlı ikâyeler, harap olğan yurtlarınıñ qalmtıları, kokten yağdırılğan taşlar,
          qap-qara aqqan nehirler şeklindeki izaatlarnen tefsir etilgen).
        cid: 0
  - verse: 35
    segments:
      - text: >-
          Medyenge de, qardaşları Şuaybnı yolladıq ve Şuayb: Ey, qavmım! Allaһqa qullıq
          etiñ, ahiret kunüne umüt bağlañ, yer yuzünde bozğuncılıq yaparaq, qarışıqlıq
          çıqarmañ! dedi. (Ayetniñ «ahiret kunüne umüt bağlañ», diye mana berilgen qısmı,
          «ahirette savap berilecegini umüt etken işler yapıñ», «ahiret kunünden qorquñ»,
          şeklinde izaatlanğan).
        cid: 0
  - verse: 36
    segments:
      - text: >-
          Faqat onı yalancılıqnen qabaatladılar. Derken, ozlerini bir sarsıntı yaqalay
          qoydı ve yurtlarında tiz ustüne çöke qaldılar. («Sarsıntı»» şeklinde mana
          berilgen «racfe» kelimesi bu adisede teprenüv ve Cebrail aleyhisselâmnıñ
          qalplerge urküntü bergen bağıruvı (sayha) şekillerinde tefsir etilgen. Bu ekinci
          tefsirge kore, «olarnı bir titrev aldı» tarzında da mana berilüvi mumkün).
        cid: 0
  - verse: 37
    segments:
      - text: >-
          Aad ve Semuudnı da (elâk ettik). Siz içün, (olarnıñ başına neler kelgenini)
          oturğan yerlerinden ap-açıq añlaşılmaqta. Şeytan olarğa yapqan işlerini guzel
          kosterip, olarnı doğru yoldan çıqardı. Albuki, baqıp, kore bilecek vaziyette
          ediler.
        cid: 0
  - verse: 38
    segments:
      - text: >-
          Qarunnı, Fıravunnı ve Haamaannı da (elâk ettik). Ant olsun ki, Musa olarğa
          apaçıq deliller ketirgen edi de, olar yer yuzünde buyuklik taslağan ediler.
          Albuki, (azabımıznı aşıp) keçe bilecek degil ediler.
        cid: 0
  - verse: 39
    segments:
      - text: >-
          Bunıñ kibi, olardan er birini gunahı sebebinen, cezalandırdıq. Kiminiñ ustüne
          taşlar savurğan ruzgârlar yolladıq, kimini qorqunç bir ses yaqaladı, kimini
          yerniñ tübüne batırdıq, kimini de suvda boğdıq. Allaһ olarğa zulum etmey, aslı
          olar ozlerine zulum ete ediler.
        cid: 0
  - verse: 40
    segments:
      - text: >-
          Allaһtan başqa dostlar tugunğanlarnıñ vaziyeti orümçekniñ vaziyeti kibidir.
          Orümçek bir yuva yapar; albuki, yuvalarnıñ eñ çürügi, şubesiz, orümçek
          yuvasıdır. Keşke bilseler edi! (Allaһtan başqasını dost tutaraq, ozlerine destek
          qıdırğanlarnışç vaziyeti, ayette orümçekke beñzetilgen. Ayette esaslı olaraq
          ifade etilgenine kore, orümçek tekmil evsiz degil, ozüne bir yuva yapar; faqat
          orümçek yuvasınıñ çürükligi meşurdir. İşte, orümçekniñ yuvası ne qadar zayıf
          ise, Allaһtan başqasınıñ destek ve imayesine işanğanlarnıñ destegi de oyle
          çürüktir).
        cid: 0
  - verse: 41
    segments:
      - text: >-
          Allaһ, olarnıñ Onı bıraqıp da, angi şeyge yalvarğanlarını, şubesiz bilir. O,
          mutlaq kuç ve ikmet saibidir.
        cid: 0
  - verse: 42
    segments:
      - text: >-
          İşte, biz bu misallerni insanlar içün ketirmektemiz; faqat olarnı ancaq
          bilgenler tüşünip añlay bilir. (Qureyşniñ cailleri ve fikirsiz taqımı:
          «Muһammedniñ Rabbi, çibinden, orümçekten, misaller ketire», diye kulüp, alay ete
          ediler. Bu misallerniñ «insanlar» içün berilgeni bildirilerek, ayvandan farqı
          olmağan bu cail ve tüşüncesiz kimselerniñ bunı añlap olamaycaqlarına işaret
          etilmekte).
        cid: 0
  - verse: 43
    segments:
      - text: >-
          Allaһ, koklerni ve yerni haq olaraq (erli yerince) yarattı. Şubesiz, bunda,
          iman etkenler içün (Allaһnıñ barlığına ve qudretine) bir nişane bulunmaqta.
        cid: 0
  - verse: 44
    segments:
      - text: >-
          (Resulım!) Saña vahiy etilgen Kitapnı oqu ve namaznı qıl. Muaqqaq ki, namaz,
          ayasızlıqtan ve yamanlıqtan qorçalar. Allaһnı añmaq, elbette (ibadetlerniñ) eñ
          buyugidir. Allaһ yapqanlarıñıznı bilir. (Ayet, gunahqa yeteklegen arzularnıñ
          tazıyıqından qurtuluvnıñ ve ruh yuceligine irişüvniñ eñ sağlam yolunı
          kostermekte. Şubesiz, bu, eñ keniş manada «Allaһnı añmaq»tır. Qur’an tilâveti ve
          namaz bunıñ eñ başında kelgen şekilleridir. Aqiqaten, Qur’annıñ manalarını,
          tüşüngenler içün, Qur’an tilâveti, daa evel farqına barılamağan bir çoq
          manalarnıñ aşkâr oluvını teminler; insannı ulviy bir alemge alıp barır. Qur’an
          tilâvetiniñ faziletinen bağlı pek çoq hadis bar. Aqqı berilerek, qılınğan
          namaznıñ da ruhnı ulviyleştirecegi ve mıtlaqa fenalıqtan qurtaracağı, bu ayette
          ve bir çoq hadiste israrnen bildirilmekte. Eyilikke yeteklemegen, fenalıqlardan
          uzaqlaştırmağan bir namaz ise, İslâm buyukleri tarafından sırtta taşınğan bir
          vebal olaraq añlatılğan).
        cid: 0
  - verse: 45
    segments:
      - text: >-
          Aralarından zulum etkenler istisna, ehl-i kitapnen ancaq eñ guzel yolnen
          kureşiñ ve deñ ki: Bizge endirilgenge de, sizge endirilgenge de, iman ettik.
          Bizim Tañrımız da, siziñ Tañırıñız da - birdir ve biz Oña teslim olğandırmız.
        cid: 0
  - verse: 46
    segments:
      - text: >-
          (Resulım!) İşte, boylece, saña (evelki kitaplarnı tasdiq etici) bu Kitapnı
          endirdik. Onıñ içün, ozlerine kitap bergenlerimiz oña iman etmekteler. Şulardan
          (araplardan) da oña iman etken nice kimseler bar. Ayetlerimizni, ancaq kâfirler
          (inatlıqları sebebinden) bile-bile inkâr eter. (Tefsirlerde bu ayet ile Abdullah
          b. Selâm ve Ubey b. Ka’b kibi Qur’anğa iman etken ehl-i kitapqa işaret etilgeni
          bildirilmekte).
        cid: 0
  - verse: 47
    segments:
      - text: >-
          Sen bundan evel ne bir yazı oqur, ne de eliñnen onı yazar ediñ. Oyle olsa edi,
          batılğa uyğanlar şube duyar ediler. (Az. Peyğamberniñ «ummiiy» yani
          oqumaq-yazmaq bilmegen bir insan oluvınıñ esas ikmeti bu ayette beyan etilmekte:
          Eger Resul-ı Ekrem oqumaq-yazmaqnı bilgen bir insan olsa edi, ummiiy olğan
          peyğamber içün bile «Bu Qur’annı o uydırğan», deyuvge qalqqan ve eñ açıq
          mucizelerni inkâr etken muşrikler, iftiralarına bir olçüde destek tapqan olacaq
          ve daa çoq kimselerni qandıra bilecek ediler).
        cid: 0
  - verse: 48
    segments:
      - text: >-
          Yoq, o (Qur’an) ozlerine ilim berilgenlerniñ yureklerinde (erleşken) ap-açıq
          ayetlerdir. Ayetlerimizni ancaq zalımlar bile-bile inkâr eter. 50. «Oña Rabiñden
          (başqaca) mucizeler endirilmeli degil edimi?», derler. De ki: Mucizeler ancaq
          Allaһ qatındadır. Men ise, sadece ap-açıq bir tenbiyeciyim.
        cid: 0
  - verse: 49
    segments:
      - text: >-
          Ozlerine oquyatqan Kitapnı saña endürüvimiz olarğa yetmegenmi? Elbette, iman
