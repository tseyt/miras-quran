verses:
  - verse: 1
    segments:
      - text: Tuurğa
        cid: 1
      - text: >-
          yayılğan ince teri üstüne satır-satır yazılğan Kitapqa, Beyt-i Ma'muurğa,
          yükseltilgen tavanğa, tolu deñizge ant olsun ki, Rabbiñniñ azabı mıtlaqa yüz
          berecek. Oña mani olacaq iç bir şey yoq. (Yemin etilgen Tuur - Medyende Az. Musa
          ilâhiy hitapqa nail olğan dağdır. Kitap - Tevrat, Qur'an ya da Levh-i mahfuzdır.
          Beyt-i Ma'muur ise, Kâbe ya da semada melekler tavaf etken maqamdır).
        cid: 0
