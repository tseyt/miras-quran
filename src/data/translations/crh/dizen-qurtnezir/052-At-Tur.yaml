        cid: 9
      - text: >-
          (Tefsirciler 24-nci ayette keçken «ğılman» kelimesinen ifade etilgen ve hızmet içün
          dolaşqan gençlerniñ, olardan evel ölgen balaları olğanı fikrini qabul etkenler.
          Ayetlerden añlaşılğanına köre, cennet ehli bir-birilerinden vaziyetlerini ve
          yapqanlarını sorarlar. Vaziyetlerini añlatqanda, dünyada aqibetlerinden qorqu
          duyğanlarını ve bu duyğu içinde yaşağanlarını aytırlar. Vucutnıñ içini yaqıcı sıcaq
          yel manasına kelgen «Semuum»dan yani ceennem azabından qurtulğanlarını ifade
          eterler. Çünki, bular Allahnı birleyerek, ibadetlerine devam etken mü'minlerdir).
