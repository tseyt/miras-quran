surah_id: 52
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "Tuurğa yayılğan ince teri ustüne satır-satır yazılğan Kitapqa, Beyt-i Ma’muurğa, yukseltilgen tavanğa, tolu deñizge ant olsun ki, Rabbiñniñ azabı mıtlaqa yuz berecek. Oña mani olacaq iç bir şey yoq. (Emin etilgen Tuur - Medyende Az. Musa ilâhiy hitapqa nail olğan dağdır. Kitap - Tevrat, Qur’an ya da Levh-i mahfuzdır. Beyt-i Ma’muur ise, Kâbe ya da semada melekler tavaf etken maqamdır)."
        cid: 0
  - verse: 9
    segments:
      - text: "O kunü kok sallanıp çalqalanır."
        cid: 0
  - verse: 10
    segments:
      - text: "Dağlar yurgenden yurer."
        cid: 0
  - verse: 11
    segments:
      - text: "Yalanlağanlarnıñ vay alına o kunü!"
        cid: 0
  - verse: 12
    segments:
      - text: "Ki, olar dalğan batılları içinde oynap turğanlardır."
        cid: 0
  - verse: 13
    segments:
      - text: "O kunü ceennem ateşine iteklenip atılırlar da, «İşte, yalanlap turğan ateşiñiz budır!» denilir."
        cid: 0
  - verse: 15
    segments:
      - text: "Bir tılsımdırmı bu, yoqsa kormeysiñizmi?"
        cid: 0
  - verse: 16
    segments:
      - text: "Kiriñ o yerge, sabır etseñiz de, sabır etmeseñiz de, artıq siz içün birdir. Siz ancaq yapqanlarıñıznıñ qarşılığına çarptırılacaqsıñız."
        cid: 0
  - verse: 17
    segments:
      - text: "Şubesiz, (fenalıqlardan) qorçalanğanlar Rabbleriniñ ozlerine bergenlerinen sevinerek, cennetlerde ve nimet içindedirler. (Zira) Rabbleri olarnı ceeyennem azabından qorçalağandır."
        cid: 0
  - verse: 19
    segments:
      - text: "Olarğa: Yapqanlarıñızğa qarşılıq sıra-sıra tizilgen kursilerge yaslanaraq, afiyetnen aşañ, içiñ (denilir). Ayrıca, biz olarnı, ceyran kozlü uriylernen evlendirgendirmiz."
        cid: 0
  - verse: 21
    segments:
      - text: "İman etken ve soylarından olğanlarda, imanda olarğa tabiy olğanlar (bar ya)! İşte, biz, olarnıñ nesillerini de ozlerine qoştıq. Olarnıñ amellerinden de bir şey eksiltmedik. Er kes qazanğanları qarşılığına bir rehindir. (Boylece, imanl baba ve onıñ imanl zurriyeti cennetke birlikte kirer. Bu Allaһnıñ oña balalarınen birlikte cennette yaşaması içün bergen bir lütfidir. Ahirette er kes hayır ve şerr - ne yapqan olsa, qarşılığını alacaq. İnsan yapqanına rehin etilgenine kore, yahşı amellerge kelgen rehinni çezer. Aksini yapsa, cezağa oğratılır)."
        cid: 0
  - verse: 22
    segments:
      - text: "Olarğa canları istegen meyvadan ve etten bol-bol berdik."
        cid: 0
  - verse: 23
    segments:
      - text: "O yerde qarşılıqlı qade toquştırırlar, amma bu yerde (içki sebebinden) ne saçmalav bardır, ne de gunahqa kirüv. (Dünyada, ilk baqışta cazibeli korüngen içki alemleriniñ soñunda saçmalıqlar, gunahlar ve suçlar bardır. Cennet şarabı ise, sarğoşlıq degil, sevinç ve bahtlılıq bergen ilâhiy bir ikramdır."
        cid: 0
  - verse: 24
    segments:
      - text: "Hızmetlerine berilgen (qabuğında) saqlı inci kibi gençler etraflarında kezip dolaşırlar."
        cid: 0
  - verse: 25
    segments:
      - text: "Cennetliler bir-birilerine dönip sorarlar."
        cid: 0
  - verse: 26
    segments:
      - text: "Derler ki: «Daa evel biz, ailelerimiz arasında bile (ilâhiy azaptan) qorqar edik»."
        cid: 0
  - verse: 27
    segments:
      - text: "«Allaһ bizge lütf etti de, bizni vucutnıñ içini bile yaqıcı ruzgâr azabından qorçaladı»."
        cid: 0
  - verse: 28
    segments:
      - text: "«Aqiqaten, biz bundan evel Oña yalvara edik. Çünki, eyilik etici, merhamet etici ancaq Odır». (Tefsirciler 24-nci ayette keçken «ğılman» kelimesinen ifade etilgen ve hızmet içün dolaşqan gençlerniñ, olardan evel olgen balaları olğanı fikrini qabul etkenler. Ayetlerden añlaşılğanına kore, cennet ehli bir-birilerinden vaziyetlerini ve yapqanlarını sorarlar. Vaziyetlerini añlatqanda, dünyada aqibetlerinden qorqu duyğanlarını ve bu duyğu içinde yaşağanlarını aytırlar. Vucutnıñ içini yaqıcı sıcaq yel manasına kelgen «Semuum»dan yani ceennem azabından qurtulğanlarını ifade eterler. Çünki, bular Allaһnı birleyerek, ibadetlerine devam etken mu’minlerdir)."
        cid: 0
  - verse: 29
    segments:
      - text: "(Resulım!) Sen ogüt ber. Rabbiñniñ lütfi ile sen ne bir kâhinsiñ, ne de bir deli. 30 . Yoqsa, olar: (O,) bir şairdir; onıñ zaman felâketlerine oğravını beklemektemiz deylermi?"
        cid: 0
  - verse: 31
    segments:
      - text: "De ki: Bekleñ. Men de siznen beraber beklegenlerdenim."
        cid: 0
  - verse: 32
    segments:
      - text: "Olarğa aqılları bunı emir etermi, yoqsa, olar yoldan azğan bir toplulıqmı?"
        cid: 0
  - verse: 33
    segments:
      - text: "Yahut «Onı ozü uydırdı!», deylermi? Yoq, olar iman etmezler."
        cid: 0
  - verse: 34
    segments:
      - text: "Eger doğru iseler, oña beñzegen bir söz ketirsinler."
        cid: 0
  - verse: 35
    segments:
      - text: "Aceba, olar iç bir yaratıcı olmadan yaratıldılarmı? Yoqsa, ozleri yaratıcılarmı?"
        cid: 0
  - verse: 36
    segments:
      - text: "Yoqsa, koklerni ve yerni olar yarattılarmı? Yoq! Olar bir türlü añlap inanmazlar."
        cid: 0
  - verse: 37
    segments:
      - text: "Yahut Rabbiñniñ hazineleri olarnıñ yanındamı? Ya da er şeyge akim olğan olarmı?"
        cid: 0
  - verse: 38
    segments:
      - text: "Yoqsa, olar ustlerine çıqıp, gizli sırlarnı diñlegen bir merdivenleri barmı? Oyle ise, diñlegenleri açıq bir delil ketirsinler. (İnkârcılarğa, meleklerniñ sözlerini ve olarğa vahiy etilgenni diñlemek içün bir merdivenge saip oldularmı, diye soralaraq, bunıñ cevabını berüvleri istenilmekte)."
        cid: 0
  - verse: 39
    segments:
      - text: "Yoqsa, qızlar Onıñ, oğullar da siziñmi?"
        cid: 0
  - verse: 40
    segments:
      - text: "Yoqsa, sen olardan bir aq isteysiñ de, bu sebepten olar ağır bir borc astında ezilmektelermi?"
        cid: 0
  - verse: 41
    segments:
      - text: "Yoqsa, ğaybğa ait bilgiler oz yanlarında da, olar yazmaktalarmı?"
        cid: 0
  - verse: 42
    segments:
      - text: "Yahut bir tuzaq qurmaq isteylermi? Asıl tuzaqqa tüşecekler, inkârcılardır."
        cid: 0
  - verse: 43
    segments:
      - text: "Ya da olarnıñ Allaһtan başqa bir tañrısı barmı? Allaһ olarnıñ ortaq qoşqan şeylerinden uzaqtır."
        cid: 0
  - verse: 44
    segments:
      - text: "Kokten tüşken bir kutle korseler, «Bir-biri ustüne toplanğan bulutlardır», derler."
        cid: 0
  - verse: 45
    segments:
      - text: "Artıq çarpılacaq kunlerine qavuşqanğa qadar, olarnı oz allarına taşla. (Çarpılacaq kunleri - olüm ya da Suurğa birinci uflenilüvidir)."
        cid: 0
  - verse: 46
    segments:
      - text: "O kunü tedbirleri olarğa iç bir fayda bermez ve yardım da kormezler."
        cid: 0
  - verse: 47
    segments:
      - text: "Şubesiz, zulum etkenlerge, ondan başqa da azap bar. Faqat çoqları bilmezler. (Bu, olümlerinden evel ya da qabirde korecek azaplarıdır. Bunıñ kibi, dünyada qıtlıqnen, cenklerde mağlübiyetnen ve buña beñzegen şeylernen azapnı tatqandırlar)."
        cid: 0
  - verse: 48
    segments:
      - text: "Rabbiñniñ ukmine sabır et. Çünki, sen kozlerimiz ogündesiñ. Qalqqan vaqtıñda da, Rabbiñni hamd ile tesbih et."
        cid: 0
  - verse: 49
    segments:
      - text: "Geceniñ bir qısmında ve yıldızlarnıñ batışından soñ da, onı tesbih et. (Ayette keçken ifadeler, aqşam, yatsı ve saba namazları manasında yorumlanğan. Bu vaqıtlarda namaz qılınuvı ya da «Subһaanallaaһi ve biһamdiһi”, diyerek tesbihte bulunıluvı emir etilgen)."
        cid: 0