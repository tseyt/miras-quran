surah_id: 102
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: Çoqluq quruntısı
        cid: 2
      - text: sizni o derece meşğul etti ki, niayet
        cid: 1
      - text: qabirlerni ziyaret ettiñiz.
        cid: 0
  - verse: 2
    segments:
      - text: >-
          [1 ayetine baq.]
        cid: 0
  - verse: 3
    segments:
      - text: Yoq!
        cid: 1
      - text: Yaqında
        cid: 2
      - text: bileceksiñiz!
        cid: 3
      - text: Elbette, yaqında bileceksiñiz!
        cid: 0
  - verse: 4
    segments:
      - text: >-
          [3 ayetine baq.]
        cid: 0
  - verse: 5
    segments:
      - text: Aqiqat öyle degil!
        cid: 0
      - text: Kesen-kes
        cid: 5
      - text: bilgi ile bilgen olsa ediñiz,
        cid: 4
      - text: (o yerde)
        cid: 0
      - text: mıtlaqa
        cid: 4
      - text: >-
          ceennem ateşini körer ediñiz. Soñra ahirette onı açıq köznen köreceksiñiz. Niayet, o
          künü (dünyada faydalanğan) nimetleriñizden, elbette ve elbette esapqa
          çekileceksiñiz.
        cid: 0
  - verse: 6
    segments:
