surah_id: 102
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >-
          Çoqluq quruntısı sizni o derece meşğul etti ki, niayet qabirlerni ziyaret
          ettiñiz.
        cid: 0
  - verse: 2
    segments:
      - text: >-
          [1 ayetine baq.]
        cid: 0
  - verse: 3
    segments:
      - text: >-
          Yoq! Yaqında bileceksiñiz! Elbette, yaqında bileceksiñiz!
        cid: 0
  - verse: 4
    segments:
      - text: >-
          [3 ayetine baq.]
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Aqiqat oyle degil! Kesen-kes bilgi ile bilgen olsa ediñiz, (o yerde) mıtlaqa
          ceennem ateşini korer ediñiz. Soñra ahirette onı açıq koznen koreceksiñiz.
          Niayet, o kunü (dünyada faydalanğan) nimetleriñizden, elbette ve elbette esapqa
          çekileceksiñiz.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          [5 ayetine baq.]
        cid: 0
  - verse: 7
    segments:
      - text: >-
          [5 ayetine baq.]
        cid: 0
  - verse: 8
    segments:
