surah_id: 77
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "Bir-birilerinden neni soraylar? 2-3. (İnanıp-inanmamaqta) ihtilâfqa töşken buyuk habernimi?"
        cid: 0
  - verse: 2
    segments:
      - text: "Şiddetle eserek, (zararlılarnı) savurıp atqanlarğa;"
        cid: 0
  - verse: 3
    segments:
      - text: "(Aqiqat ve hayırlarnı) yaydıqça-yağanlarğa;"
        cid: 0
  - verse: 4
    segments:
      - text: "Yoq! Añlaycaqlar!"
        cid: 0
  - verse: 5
    segments:
      - text: "Kene yoq! Olar añlaycaqlar! 6-7. Biz yer yuzüni bir töşek, dağlarnı da birer qazıq yapmadıqmı?"
        cid: 0
  - verse: 7
    segments:
      - text: "Biliñ ki, sizge vade olunğan şey kerçekleşecek! 8-11. Yıldızlarnıñ ışığı söndürilgen, kok qubbesi yarılğan, dağlar ufalıp savurılğan ve peyğamberlerniñ (ummetleri aqqında şaatlıq) vaqıtı tayin etilgen zaman (artıq qıyamet qopqandır)."
        cid: 0
  - verse: 8
    segments:
      - text: "Sizni çift-çift yarattıq."
        cid: 0
  - verse: 9
    segments:
      - text: "Yuquñıznı bir raatlanuv yaptıq."
        cid: 0
  - verse: 10
    segments:
      - text: "Geceni bir ortü yaptıq."
        cid: 0
  - verse: 11
    segments:
      - text: "Kundüzni de çalışıp qazanuv vaqtı ettik."
        cid: 0
  - verse: 12
    segments:
      - text: "Ustüñizde yedi qat sağlam kokler bina ettik."
        cid: 0
  - verse: 13
    segments:
      - text: "(O yerde) alev-alev yanğan bir qandil yarattıq. 14-16. Sizge urluqlar, osümlikler (tereklerni), bir-birilerine bitişik bağlar-bağçalar yetiştirmek içün, ust-ustüne toplanıp sıqışqan bulutlardan şırıl-şırıl aqqan suvlar endirdik."
        cid: 0
  - verse: 14
    segments:
      - text: "(Resulım!) Ayırma kunüniñ ne olğanını sen ne yerden bileceksiñ!"
        cid: 0
  - verse: 15
    segments:
      - text: "O kunü (Peyğamberni ve ahiretni) yalan sayğanlarnıñ vay alına!"
        cid: 0
  - verse: 16
    segments:
      - text: "Biz (bular kibi inkârcı olğan) evelkilerni elâk etmekdikmi?"
        cid: 0
  - verse: 17
    segments:
      - text: "Şubesiz, uküm kunü - vaqıt olaraq tayin etilgendir."
        cid: 0
  - verse: 18
    segments:
      - text: "Suurğa uflengen kunü, top-top Allaһqa kelirsiñiz."
        cid: 0
  - verse: 19
    segments:
      - text: "Kok yuzü açılır ve o yerde qapular peyda olur;"
        cid: 0
  - verse: 20
    segments:
      - text: "Dağlar yurütilir, ılğım alına kelir. 21-22. Şubesiz, yoldan azğanlarnıñ barınacaq (sığınacaq yeri) ceennem pusuda beklemektedir. 23-26. (Öldan azğanlar) o yerde asırlar boyu qalırlar, o yerde bir serinlik ya da (suvsızlıq ketkizgen) bir içimlik tatmazlar, ancaq (dünyada yapqanlarına) uyğun qarşılıq olaraq, qaynaq suv ve irin tatarlar."
        cid: 0
  - verse: 23
    segments:
      - text: "Biz buña kuç yetkizgendirmiz. Ve bizim kuçümiz ne buyuktir! (Ayetke «Onı biz taqdir ettik ve biz ne guzel taqdir eticimiz» şeklinde de mana berilgen)."
        cid: 0
  - verse: 24
    segments:
      - text: "O kunü (aqiqatlarnı) yalan sayğanlarnıñ alına vay! 25-26. Biz yer yuzüni tirilerge ve olülerge toplanuv yeri yapmadıqmı?"
        cid: 0
  - verse: 27
    segments:
      - text: "Çünki, olar ceza kunüniñ (kelecegini) umüt etmez ediler."
        cid: 0
  - verse: 28
    segments:
      - text: "Bizim ayetlerimizni yalanlağandan-yalanlağan ediler."
        cid: 0
  - verse: 29
    segments:
      - text: "Biz ise, er şeyni bir kitapta sayıp yazğandırmız."
        cid: 0
  - verse: 30
    segments:
      - text: "Tatıñ! Bundan soñ ancaq azabıñıznı arttıracaqmız. 31-34. Şubesiz, taqva saipleri içün umüt etilgenni tapqan yerleri - bağçalar, yuzüm bağları, koküsleri ğonce kibi qabarğan aqrandaş qızlar, içki tolu qadeler bardır."
        cid: 0
  - verse: 32
    segments:
      - text: "O, saray kibi qocaman qığılçım septirir."
        cid: 0
  - verse: 33
    segments:
      - text: "Er bir qığılçım sanki birer sarı deve kibidir."
        cid: 0
  - verse: 34
    segments:
      - text: "O kunü, (aqiqatlarnı) yalan sayğanlarnıñ alına vay!"
        cid: 0
  - verse: 35
    segments:
      - text: "Olar o yerde ne boş bir laqırdı, ne de yalan eşitirler."
        cid: 0
  - verse: 36
    segments:
      - text: "Bular Rabbiñniñ yeterli bir ihsanı, mukâfatıdır."
        cid: 0
  - verse: 37
    segments:
      - text: "O, koklerniñ, yerniñ ve ekisi arasında olğanlarnıñ Rabbidir. O, rahmandır. O kunü insanlar Oña qarşı qonuşmağa izinli degildirler."
        cid: 0
  - verse: 38
    segments:
      - text: "Ruh (Cebrail) ve melekler saf-saf olup turğan kunü, Rahman izin bergenlerinden başqaları laqırdı etalmazlar; laf etken de, doğrusını söyler."
        cid: 0
  - verse: 39
    segments:
      - text: "İşte, o kesen-kes kelecek kundir. O alda, istegen insan Rabbisine barğan bir yol tutsın."
        cid: 0
  - verse: 40
    segments:
      - text: "Biz, yaqın bir azaptan sizni tenbiyeledik. O kunü insan evelden yapqanlarına baqcaq ve inkârcı kimse: «Keşke topraq olsam edi!» deycek."
        cid: 0
  - verse: 43
    segments:
      - text: "(Olarğa:) «Yapqanlarıñıznıñ qarşılığı olaraq şimdi afiyetnen aşañ, içiñ», (denilir)."
        cid: 0
  - verse: 44
    segments:
      - text: "İşte, biz yahşıdıq yapqanlarnı boyle mukâfatlandırırmız."
        cid: 0
  - verse: 45
    segments:
      - text: "O kunü, (aqiqatlarnı) yalan sayğanlarnıñ alına vay!"
        cid: 0
  - verse: 46
    segments:
      - text: "(Ey, inkârcılar!) Aşañız, (dünyadan) faydalanıñız biraz! Aqiqat şu ki, sizler suçlusıñız!"
        cid: 0
  - verse: 47
    segments:
      - text: "O kunü, (aqiqatlarnı) yalan sayğanlarnıñ alına vay!"
        cid: 0
  - verse: 48
    segments:
      - text: "Olar ozlerine: «Allaһnıñ uzurında ruku etiñ!» denilgen vaqıtta egilmezler?"
        cid: 0
  - verse: 49
    segments:
      - text: "O kunü, (aqiqatlarnı) yalan sayğanlarnıñ alına vay!"
        cid: 0
  - verse: 50
    segments:
      - text: "Olar artıq bundan (Qur’andan) soñ angi sözge inanacaqlar."
        cid: 0
  - verse: 78
    segments:
      - text: "en-NEBE’ Meaaricden soñ engen, ilk mekkiy surelerden olup, 40 ayettir. «Nebe’» - haber demektir. Qıyamet haberlerini añlatqanı içün, bu ad berilgen. Bismilâaһirraһmaanirraһiim (Rahman ve rahim olğan Allaһnıñ adınen)."
        cid: 0