surah_id: 77
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >
          Yemin olsun, (eyiliklernen) bir-birileri peşinden yollanılğanlarğa;
        cid: 0
  - verse: 2
    segments:
      - text: >
          Şiddetle eserek, (zararlılarnı) savurıp atqanlarğa;
        cid: 0
  - verse: 3
    segments:
      - text: >
          (Aqiqat ve hayırlarnı) yaydıqça-yağanlarğa;
        cid: 0
  - verse: 4
    segments:
      - text: >
          (Haqnen batılnı) bir-birilerinden güzelce ayırğanlarğa;
        cid: 0
  - verse: 5
    segments:
      - text: >
          (Allahqa yönelgenlerni) arındırmaq, (yamanlarnı) saqındırmaq içün, ögüt telqin
          etkenlerge;
        cid: 0
  - verse: 6
    segments:
      - text: >
          [5 ayetine baq.]
        cid: 0
  - verse: 7
    segments:
      - text: >
          Biliñ ki, sizge vade olunğan şey kerçekleşecek!
        cid: 0
  - verse: 8
    segments:
      - text: >
          Yıldızlarnıñ ışığı söndürilgen, kök qubbesi yarılğan, dağlar ufalıp savurılğan
          ve peyğamberlerniñ (ümmetleri aqqında şaatlıq) vaqıtı tayin etilgen zaman (artıq
          qıyamet qopqandır).
        cid: 0
  - verse: 9
    segments:
      - text: >
          [8 ayetine baq.]
        cid: 0
  - verse: 10
    segments:
      - text: >
          [8 ayetine baq.]
        cid: 0
  - verse: 11
    segments:
      - text: >
          [8 ayetine baq.]
        cid: 0
  - verse: 12
    segments:
      - text: >
          (Bu alâmetler) nasıl vaqıtqa keçiktirilgendir?
        cid: 0
  - verse: 13
    segments:
      - text: >
          Ayırma kününe.
        cid: 0
  - verse: 14
    segments:
      - text: >
          (Resulım!) Ayırma kününiñ ne olğanını sen ne yerden bileceksiñ!
        cid: 0
  - verse: 15
    segments:
      - text: >
          O künü (Peyğamberni ve ahiretni) yalan sayğanlarnıñ vay alına!
        cid: 0
  - verse: 16
    segments:
      - text: >
          Biz (bular kibi inkârcı olğan) evelkilerni elâk etmekdikmi?
        cid: 0
  - verse: 17
    segments:
      - text: >
          Soñ arqadakilerni de olarnıñ peşine taqacaqmız.
        cid: 0
  - verse: 18
    segments:
      - text: >
          İşte, biz suçlularğa böyle yaparmız!
        cid: 0
  - verse: 19
    segments:
      - text: >
          O künü (aqiqatlarnı) yalan sayğanlarnıñ vay alına!
        cid: 0
  - verse: 20
    segments:
      - text: >
          (Ey, insanlar!) Biz sizni zayıf bir suvdan yaratmadıqmı?
        cid: 0
  - verse: 21
    segments:
      - text: >
          İşte, o suvnı, belli bir müddetke qadar sağlam bir yerge yerleştirdik.
        cid: 0
  - verse: 22
    segments:
      - text: >
          [21 ayetine baq.]
        cid: 0
  - verse: 23
    segments:
      - text: >
          Biz buña küç yetkizgendirmiz. Ve bizim küçümiz ne büyüktir! (Ayetke «Onı biz
          taqdir ettik ve biz ne güzel taqdir eticimiz» şeklinde de mana berilgen).
        cid: 0
  - verse: 24
    segments:
      - text: >
          O künü (aqiqatlarnı) yalan sayğanlarnıñ alına vay!
        cid: 0
  - verse: 25
    segments:
      - text: >
          Biz yer yüzüni tirilerge ve ölülerge toplanuv yeri yapmadıqmı?
        cid: 0
  - verse: 26
    segments:
      - text: >
          [25 ayetine baq.]
        cid: 0
  - verse: 27
    segments:
      - text: >
          Yer yüzünde yüksek dağlar yarattıq, sizlerge tatlı suvlar içirdik.
        cid: 0
  - verse: 28
    segments:
      - text: >
          O künü, (aqiqatlarnı) yalan sayğanlarnıñ alına vay!
        cid: 0
  - verse: 29
    segments:
      - text: >
          (İnkârcılarğa o künü böyle denilir:) Yalan sayıp keldigiñiz azapqa barıñ!
        cid: 0
  - verse: 30
    segments:
      - text: >
          Üç pıtaqqa ayırılğan, (amma) ne kölge bergen, ne de alevden qorçalaycaq bir
          kölgege barıñ.
        cid: 0
  - verse: 31
    segments:
      - text: >
          [30 ayetine baq.]
        cid: 0
  - verse: 32
    segments:
      - text: >
          O, saray kibi qocaman qığılçım septirir.
        cid: 0
  - verse: 33
    segments:
      - text: >
          Er bir qığılçım sanki birer sarı deve kibidir.
        cid: 0
  - verse: 34
    segments:
      - text: >
          O künü, (aqiqatlarnı) yalan sayğanlarnıñ alına vay!
        cid: 0
  - verse: 35
    segments:
      - text: >
          Bu, (kâfirler) laf etalmaycaq bir kündir.
        cid: 0
  - verse: 36
    segments:
      - text: >
          Olarğa izin de berilmez ki, (sözde) üzülerini beyan etsinler.
        cid: 0
  - verse: 37
    segments:
      - text: >
          O künü, (aqiqatlarnı) yalan sayğanlarnıñ alına vay!
        cid: 0
  - verse: 38
    segments:
      - text: >
          (O zaman böyle denilir:) Bu, ayırdı etüv künüdir. Sizni ve sizden evelkilerni
          bir yerge ketirdik.
        cid: 0
  - verse: 39
    segments:
      - text: >
          (Azaptan qurtuluvıñız içün) bir iyleñiz bar ise, kösteriñ maña iyleñizni!
        cid: 0
  - verse: 40
    segments:
      - text: >
          O künü, (aqiqatlarnı) yalan sayğanlarnıñ alına vay!
        cid: 0
  - verse: 41
    segments:
      - text: >
          Şübesiz, (o künü) taqva saipleri, kölgeliklerde ve çoqraq başlarında, canları
          çekkeninden çeşit-çeşit meyvalar arasında olacaqlar.
        cid: 0
  - verse: 42
    segments:
      - text: >
          [41 ayetine baq.]
        cid: 0
  - verse: 43
    segments:
      - text: >
          (Olarğa:) «Yapqanlarıñıznıñ qarşılığı olaraq şimdi afiyetnen aşañ, içiñ»,
          (denilir).
        cid: 0
  - verse: 44
    segments:
      - text: >
          İşte, biz yahşıdıq yapqanlarnı böyle mükâfatlandırırmız.
        cid: 0
  - verse: 45
    segments:
      - text: >
          O künü, (aqiqatlarnı) yalan sayğanlarnıñ alına vay!
        cid: 0
  - verse: 46
    segments:
      - text: >
          (Ey, inkârcılar!) Aşañız, (dünyadan) faydalanıñız biraz! Aqiqat şu ki, sizler
          suçlusıñız!
        cid: 0
  - verse: 47
    segments:
      - text: >
          O künü, (aqiqatlarnı) yalan sayğanlarnıñ alına vay!
        cid: 0
  - verse: 48
    segments:
      - text: >
          Olar özlerine: «Allahnıñ uzurında ruku etiñ!» denilgen vaqıtta egilmezler?
        cid: 0
  - verse: 49
    segments:
      - text: >
          O künü, (aqiqatlarnı) yalan sayğanlarnıñ alına vay!
        cid: 0
  - verse: 50
    segments:
      - text: >
          Olar artıq bundan (Qur'andan) soñ angi sözge inanacaqlar.
        cid: 0
