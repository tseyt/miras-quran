surah_id: 17
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >
          Bir gece oña ayetlerimizden bir qısmını köstereyik diye, (Muhammed) qulını
          Mescid-i Haramdan etrafını mubarek qıldığımız Mescid-i Aqsağa alıp barğan Allah
          noqsan sıfatlardan uzaqtır; O, aqiqaten eşiticidir, körücidir.
        cid: 0
  - verse: 2
    segments:
      - text: >
          Biz Musağa Kitapnı berdik ve İsrail oğullarına: «Menden başqasına tayanılıp,
          işanılğan bir rabb edinmeñ», diyerek, bu Kitapnı bir hidayet reberi yaptıq.
        cid: 0
  - verse: 3
    segments:
      - text: >
          (Ey,) Nuh ile birlekte (gemide) taşığan kimselerimizniñ nesli! Şunı biliñ ki,
          Nuh çoq şükür etici bir qul edi. (Bazı tefsirlerde ekinci ve üçünci ayetler
          arasında böyle bir mana bağı qurulğan: Ey, Nuh ile birlikte gemide taşığan
          kimselerimizniñ nesli! Menden başqasını, tayanılıp, işanılğan bir rabb edinmeñ.
          Aqiqaten, Nuh çoq şükür etici bir qul edi).
        cid: 0
  - verse: 4
    segments:
      - text: >
          Biz Kitapta İsrail oğullarına: Sizler yer yüzünde eki defa fesat çıqaracaqsıñız
          ve adden aşuv derecesinde bir kibrge qapılacaqsıñız, diye bildirdik.
        cid: 0
  - verse: 5
    segments:
      - text: >
          Bulardan birincisiniñ vaqtı kelgeninen, üstüñizge küçlü-quvetli qullarımıznı
          yolladıq. Bular evlerniñ arasında dolaşaraq, (sizni) qıdırdılar. Bu - yerine
          ketirilgen bir vade edi. (Tefsirlerde bu küçlü-quvetli qullarnıñ ninevalı
          Sencarip, babilli Buhtunnasr ya da Caalutnıñ orduları olğanı, olarnıñ Tevratnı
          ve Mescid-i Aqsanı yaqqanları, İsrail oğullarınıñ alimlerini öldürgenleri ve
          70.000 qadar esir alğanları rivayet etile, bütün bu musibetlerge sebep olğan
          İsrail oğullarınıñ ilk fesatınıñ ise, Zekeriyyanı öldirüvleri ve Ermiyanı aps
          etüvleri olğanı beyan etile).
        cid: 0
  - verse: 6
    segments:
      - text: >
          Soñra olarğa nisbeten sizge tekrar (ğalebe ve zafer) berdik; servet ve
          oğullarnen küçüñizni arttırdıq; sayıñıznı daa da çoqlaştırdıq.
        cid: 0
  - verse: 7
    segments:
      - text: >
          Eger yahşılıq yapsañız, özüñizge yapqan, yamanlıq yapsañız, kene özüñizge yapqan
          olursıñız. Artıq diger cezalandıruv vaqtı kelgeninen, yüzüñizni qara etsinler,
          daa evel kirgenleri kibi, kene Mescidke (Süleyman Mabedine) kirsinler ve
          ellerine keçirgen er şeyni büs-bütün yoq etsinler (diye başıñızğa kene
          duşmanlarıñıznı musallat yaptıq). (Tefsirlerde İsrail oğularınıñ ekinci
          musibetke oğravlarınıñ sebebi olğan diger fesat areketleriniñ Az.Yahânı
          öldirüvleri ve Az.İsanı öldürmege areketleri olğanı bildirile).
        cid: 0
  - verse: 8
    segments:
      - text: >
          Belki, Rabbiñiz sizge merhamet eter; faqat siz, eger kene (fesatçılıqqa)
          dönseñiz, biz de sizni kene cezalandırırmız. Biz ceennemni kâfirler içün bir
          apshane yaptıq.
        cid: 0
  - verse: 9
    segments:
      - text: >
          Şübesiz ki, bu Qur'an eñ doğru yolğa iriştirir, yahşı davranışlarda bulunğan
          mü'minlerge, özleri içün büyük bir mükâfat olğanını müjdeler.
        cid: 0
  - verse: 10
    segments:
      - text: >
          Ahiretke inanmağanlarğa kelgende, olar içün de elemli bir azap azırlağandırmız.
        cid: 0
  - verse: 11
    segments:
      - text: >
          İnsan, hayırnı istegeni qadar, şerrni de ister. İnsan pek aşıqçandır! (Bu ayet
          insannıñ müim bir psihilogik tarafına işaret etmekte: Aqiqaten, biz, insanlar
          öpkelengen, sıqılğan ya da bir küçlülikke oğrağanımızda, öpkelengenlerimiz içün
          beddua eter; küçlüliklerden sabır ve metanetnen qurtulmaq içün areket etecek
          yerimizde, aşıqçanlıq kösterip, tezden qurtulmaq istermiz. Bu olmağance ümütsiz
          ve ruhsız al içinde: «Allahım, canımnı al da, meni bu qıyınlıqtan qurtar!» kibi
          sözlernen özümiz içün beddua etermiz ki, bular doğru degildir).
        cid: 0
  - verse: 12
    segments:
      - text: >
          Biz geceni ve kündüzni birer ayet (delil) olaraq yarattıq. Albuki, Rabbiñizniñ
          nimetlerini qıdırmañ, ayrıca, yıllarnıñ sayı ve esabını bilüviñiz içün, geceniñ
          qaranlığını silip (yerine, eşyanı) aydınlatqan kündüzniñ aydınlığını ketirdik.
          İşte, biz er şeyni ap-açıq añlattıq.
        cid: 0
  - verse: 13
    segments:
      - text: >
          Er insannıñ amelini (ya da taqdirini) boynuna bağladıq. İnsan içün qıyamet
          kününde açılğan alda ögüne qoyulacaq bir kitap çıqarırmız.
        cid: 0
  - verse: 14
    segments:
      - text: >
          Kitabıñnı oqu! Bugüñ senden esap soraycaq olaraq özüñniñ nefsiñ yeterli. (Bu
          dünyada, ister etrafnıñ menfiy şartları, ister insannıñ bir çoq fena istek ve
          ihtirasları, onıñ qalp ve basiretini bağlay bilmekte, yahşılıq ve yamanlıqnı
          körüviniñ ögüni bağlamaqta. Buña qarşılıq, yuqarıdaki ayetke köre, ahirette
          insan söz mevzusı olamaycaq amillerden qurtulacağı içün, öz esabını şahsen özü
          yapacaq, dünyadaki amelleriniñ qıymeti aqqında üküm berecek ve özüni añlaycaq ya
          da mahküm etecek bir ruh kemalatına qavuşacaq).
        cid: 0
  - verse: 15
    segments:
      - text: >
          Kim hidayet yolunı seçse, buña yalıñız öz eyiligi içün seçken olur; kim de
          doğrulıqtan sapsa, öz zararına sapqan olur. İç bir günahkâr başqasınıñ günahını
          arqalamaz. Biz bir peyğamber yollamağance (kimsege) azap etecek degilmiz.
        cid: 0
  - verse: 16
    segments:
      - text: >
          Bir ülkeni elâk etmek isteginimizde, o ülkeniñ zenginlik sebebinen, qopayçora
          yolbaşçılarına (eyiliklerni) emir etermiz; buña rağmen, olar o yerde yamanlıq
          yaparlar. Böylece, o ülke elâketke lâyıq olur; biz de o yerni darma-dağın
          etermiz. (Ayetniñ baş qısmı tefsirciler tarafından böyle de añlaşılğan: Bir
          ülkeni elâk etmek istegenimizde, o ülkeniñ varlıqlı ve qopayçora adamlarını
          çoqlaştırırmız. Bunıñen olar fenalıq yapar; böylece o ülke elâketke lâyıq olur).
        cid: 0
  - verse: 17
    segments:
      - text: >
          Nuhtan soñki nesilerden nicelerini elâk ettik. Qullarınıñ günahlarını bilici ve
          körüci olaraq Rabbiñ kâfidir.
        cid: 0
  - verse: 18
    segments:
      - text: >
          Er kim bu çar-çabuk keçken dünyanı tilese, oña, yani istegen kimsemizge,
          istegenimiz qadarını dünyada aman berir, soñra da onı, azarlanğan ve quvulğan
          olaraq kirecegi ceennemge soqarmız.
        cid: 0
  - verse: 19
    segments:
      - text: >
          Kim de ahiretni tiler ve mü'min olaraq oña yaraşqan bir ğayretnen çalışsa, işte,
          bularnıñ çalışuvları maqbuldır.
        cid: 0
  - verse: 20
    segments:
      - text: >
          Episine - olarğa da, bularğa da, (dünyanı istegenlerge de, ahiretni istegenlerge
          de) Rabbiñniñ ihsanından (istegenlerini) berirmiz. Rabbiñniñ ihsanı qısılğan
          degildir.
        cid: 0
  - verse: 21
    segments:
      - text: >
          Baqsana, biz insanlarnıñ kimisini kimisinden nasıl üstün yapqandırmız! Elbette
          ki, ahiret, derece ve üstünlik farqları noqtai nazarından, daa büyüktir. (20-nci
          ayet, ister dünya, ister ahiret nimetleri noqtai nazarından, Allahnıñ lütfi
          sıñırsızlığını ifade etmekte; servet, mevqi, sağlıq ve yaşayış güzelligi noqtai
          nazarından, insanlar arasındaki farqlarnıñ, ilâiy taqdirniñ bir keregi olğanını,
          buña köre, bu dünyada mutlaq musaviylikniñ imkânsızlığını ortağa çıqarmaqta.
          Bunıñnen beraber, 21-nci ayetten añlaşıla ki, ahirette de insanlar bir vaziyette
          olmaycaqlar, aksine, insanlarnıñ dünyada yapqan işlerine köre, ahirette derece
          farqları daa da büyük olacaq. Ancaq, 18-nci ayetten de añlaşılğanına köre, para
          ve mevqi kibi dünyaviy imkânlar, Allah nezdinde mutlaq bir deger ifade etmegeni
          içün, dünya ayatını tek bularnıñ peşinden çaparaq keçirgenler, ahirette üstün
          derecelerge qavuşmaq aqqını ğayıp etecekler).
        cid: 0
  - verse: 22
    segments:
      - text: >
          Allahnen beraber bir ilâh daa tanıma! Soñra azarlanğan ve öz başına terk etilgen
          olaraq qalırsıñ.
        cid: 0
  - verse: 23
    segments:
      - text: >
          Rabbiñ, sadece özüne qullıq etüviñizni, ana-babañızğa da eyi davranuvıñıznı
          kesen-kes bir şekilde emir etti. Olardan biri ya da er ekisi seniñ yanıñda
          qartaysalar, olarğa «Uf!» bile deme; olarnı azarlama; ekisine de güzel söz
          söyle.
        cid: 0
  - verse: 24
    segments:
      - text: >
          Olarğa merhamet eterek, alçaqgoñülliliknen üzerlerine qanat ker ve «Rabbim!
          Küçükligimde olar meni nasıl yetiştirgen olsalar, şimdi sen olarğa (öyle) rahmet
          eyle!» diyerek dua et.
        cid: 0
  - verse: 25
    segments:
      - text: >
          Rabbiñiz siziñ qalpleriñizdekini çoq yahşı bilir. Eger siz yahşı olsañız, şunı
          biliñ ki, Allah yamanlıqtan yüz çevirerek, tövbege yönelgenlerni ziyadesinen
          bağışlayıcıdır.
        cid: 0
  - verse: 26
    segments:
      - text: >
          Bir de aqrabağa, yoqsulğa, yolcuğa aqqını ber. Kereksiz yerge de saçıp-savurma.
        cid: 0
  - verse: 27
    segments:
      - text: >
          Zira, böyle saçıp-savurğanlar şeytanlarnıñ dostlarıdır. Şeytan ise, Rabbiñe
          qarşı çoq nankordir.
        cid: 0
  - verse: 28
    segments:
      - text: >
          Eger Rabbiñden ümüt etken (beklemek vaziyetinde olğan) bir rahmet içün, olarnıñ
          yüzlerine baqalmayatqan olsañ, iç olmağanda, olarğa goñül alıcı bir söz söyle.
          (Rivayetke köre, Bilâl, Suheyb, Salim, Mehca' ve Habbab kibi yoqsul sahabiler,
          Az.Peyğamberniñ yardımınen keçine ediler. Resulullah (s.a.) olarğa berilecek bir
          şeyleri olmağan vaqıtta, utanğanı sebebinden, söyleycek bir söz tapalmaz, yüzüni
          başqa tarafqa çevirir, faqat olarnıñ itiyaclarını qandırmaq içün Cenab-ı Haqnıñ
          oña imkân berüvini tiler edi. İşte, bu ayette Resulullah bu kibi insanlarğa bir
          şeyler berip olamaycaq olsa bile, iç olmağanda «Allah bizge de, sizge de bol
          rızıq bersin», «Allah sizlerni mesut ve ferahlı etsin», kibi sözlernen olarnıñ
          goñüllerini aluvı kerekligi hatırlatıla).
        cid: 0
  - verse: 29
    segments:
      - text: >
          Avuçı sıqıq olma; büs-bütün eli açıq da olma. Soñra azarlanır, (ğayıp
          etkenleriñniñ) asretini çeker oturırsıñ.
        cid: 0
  - verse: 30
    segments:
      - text: >
          Rabbiñ rızıqnı istegenine bol berir, istegenine tarlaştırır. Şübesiz ki, O,
          qullarından haberdardır, (olarnı) çoq yahşı körer.
        cid: 0
  - verse: 31
    segments:
      - text: >
          Keçinüv sıqıntısınen balalarıñıznıñ canını qıymañ. Biz olarnıñ da, siziñ de
          rızqıñıznı berirmiz. Olarnı öldirüv, aqiqaten, büyük bir qabaattır.
        cid: 0
  - verse: 32
    segments:
      - text: >
          Zinağa yaqlaşmañ. Zira, o bir ayasızlıqtır ve çoq fena bir yoldır. (Yuqaradaki
          ayette «Zina etmeñ» denilmeyip de, «Zinağa yaqlaşmañ» buyurıluvı daqatnı çeke.
          Buña köre, yalıñız zina degil, kişini zina etüvge alıp barıcı yollar da
          yasaqlanğan. Esasen, bir kere bu yollarğa kirilgenden, yani insannı zina etmege
          zorlağan ve cinsiy isteklerni qabartqan bir vaziyetke kirgen soñ, artıq bu
          isteklerniñ ağır tazıyıqı qarşısında iradeniñ küçü olduqça zayıflar ve zinadan
          qorçalanmaq soñ derece ağırlaşır. İnsannıñ bu psihologik zayıflığını diqqatqa
          alğan Qur'an-ı Kerim, printsip olaraq, insannı yamanlıqlarğa süyrekleyici
          sebeplerni ortadan qaldıruvnı ögge süre).
        cid: 0
  - verse: 33
    segments:
      - text: >
          Aqlı bir sebep olmağance, Allah muhterem yapqan bir cannı qıymañ. Bir kimse
          zulumen öldürilse, onıñ velisine (aqqını aluvı içün) uquq berdik. Ancaq, bu veli
          de, qasasta adden aşmasın. Zaten, (özüne bu uquq berilüvnen) o alacağını
          alğandır.
        cid: 0
  - verse: 34
    segments:
      - text: >
          Yetimniñ malına, pişkinlik çağına irişkenge qadar, ancaq eñ güzel bir niyetnen
          yaqlaşıñ. Bergen sözüñizni de yerine ketiriñ. Çünki, berilgen söz,
          mesuliyetlikni talap eter.
        cid: 0
  - verse: 35
    segments:
      - text: >
          Ölçegen vaqtıñızda tas-tamam ölçeñ ve doğru terazenen tartıñ. Bu, em daa
          yahşıdır, em de neticesi noqtai nazarından, daa güzeldir.
        cid: 0
  - verse: 36
    segments:
      - text: >
          Aqqında bilgiñ olmağan bir şeyniñ peşine tüşme. Çünki, qulaq, köz ve goñül -
          bularnıñ episi ondan mesuldir.
        cid: 0
  - verse: 37
    segments:
      - text: >
          Yer yüzünde kibrlenerek yürme. Çünki, sen (ağırlıq ve azametiñnen) ne yerni yara
          bilir ne de dağlarnen büyüklik yarışına kire bilirsiñ.
        cid: 0
  - verse: 38
    segments:
      - text: >
          Bütün bu sayılğanlarnıñ fena olğanları, Rabbiñniñ nezdinde sevimsizdir.
        cid: 0
  - verse: 39
    segments:
      - text: >
          İşte, bular Rabbiñniñ saña vahiy etken ikmetleridir. Allahnen birlikte başqa
          ilâh edinme; soñra azarlanğan ve (Allahnıñ rahmetinden) uzaqlaştırılğan olaraq,
          ceennemge atılırsıñ.
        cid: 0
  - verse: 40
    segments:
      - text: >
          (Ey, müşrikler!) Rabbiñiz oğlan balalarnı sizge ayırdı da, özüne meleklerni qız
          balaları ettimi! Aqiqaten, siz (vebalı) çoq büyük bir söz söylemektesiñiz.
          (Müşrikler, melekler Allahnıñ qızları olğanına inana, oğlan balalarnıñ ise,
          özlerine berilgenine idda ete, bundan tolayı, ğururlana ediler. İşte, ayet-i
          kerime olarnıñ bu tüşüncesini red etmekte, balalar arasında cinsiyetlerine köre,
          ayırma yapıluvını qabul etmemekte).
        cid: 0
  - verse: 41
    segments:
      - text: >
          Biz olarnıñ aqıllarını başlarına toplavları içün, bu Qur'anda (çeşit tenbiye ve
          ihtarlarnı) türlü şekillerde tekrar ettik. Faqat bu olarğa daa da qaçıp,
          uzaqlaşuvdan başqa bir şey teminlememekte.
        cid: 0
  - verse: 42
    segments:
      - text: >
          De ki: Eger söylegenleri kibi, Allahnen beraber başqa ilâhlar da olsa edi, o
          taqdirde, bu ilâhlar Arşnıñ saibi olğan Allahqa qavuşmaq içün çareler qıdıracaq
          ediler. (Ayetniñ soñki qısmı tefsirciler tarafından eki şekilde manalandırılğan:
          a) «... o taqdirde, olar Arşnıñ saibi olğan Allahtan üstün kelmek içün, çareler
          qıdıracaq ediler». b) «… o taqdirde, olar büyükligini ve qudretinı bilgen Arş
          saibi Allahqa yaqınlaşmaq ve Oña itaat etmek içün çareler qıdıracaq ediler»).
        cid: 0
  - verse: 43
    segments:
      - text: >
          Allah olarnıñ söylegen şeylerinden uzaqtır; soñ derece yücedir ve büyüktir.
        cid: 0
  - verse: 44
    segments:
      - text: >
          Yedi kök, yer ve bularda olğan er kes onı tesbih eter. Onı maqtav ile tesbih
          etmegen iç bir şey yoqtır. Amma, siz olarnıñ tesbihini añlamazsıñız. O,
          halimdir, bağışlayıcıdır. (Tabiat ilimlerindeki inkişaf bu ayetniñ izaatına
          yardımcıdır. Evelki cansız ve areketsiz olğanı zan etilgen varlıqlar da dahil
          olmaq üzre, bütün eşya atomlardan meydanğa kelgendir. İşte, atomlarnıñ
          etrafındaki ellektronlar devamlı ve muntazam bir şekilde yadronıñ etrafında
          aylanmaqtadır ki, belki de, olarnıñ bu dönüşleri ve böylece ilâhiy qanunğa eñ
          ufaq bir sapıqlıq köstermeden, boyun egüvleri, Qur'an-ı Kerim tarafından Allahnı
          tesbih etüvi olaraq ifade etilgendir).
        cid: 0
  - verse: 45
    segments:
      - text: >
          Biz, Qur'an oquğan vaqtıñda, sennen ahiretke inanmağanlar arasına gizleyici bir
          örtü çekermiz.
        cid: 0
  - verse: 46
    segments:
      - text: >
          Ayrıca, onı añlamamaları içün qalplerine bir qapalılıq ve qulaqlarına bir
          ağırlıq berirmiz. Sen Qur'anda Rabbiñniñ birligini añğanıñda, olar canları
          sıqılğan bir vaziyette çevirilip keterler.
        cid: 0
  - verse: 47
    segments:
      - text: >
          Biz olarnıñ seni diñlegende ne maqsatnen dinlegenlerini, öz aralarında
          fısıldaşqanlarında da o zalımlarnıñ: «Siz ırımlanğan bir adamdan başqasına
          uymaysıñız!» degenlerini çoq yahşı bilirmiz.
        cid: 0
  - verse: 48
    segments:
      - text: >
          Baqsana, sen içün ne türlü beñzetüvler yaptılar! Bu sebepten, (öyle bir)
          saptılar ki, artıq (doğru) yolnı tapamaycaqlar.
        cid: 0
  - verse: 49
    segments:
      - text: >
          Bir de olar dediler ki: Aqiqaten, biz bir kemik obası ve qoquğan bir topraq
          olğan da, yap-yañı bir hilqatta tiriltilecekmiz, öylemi!
        cid: 0
  - verse: 50
    segments:
      - text: >
          De ki: İster taş oluñ, ister demir, istese aqılıñızğa (yañıdan tirilüvi)
          imkânsız kibi körüngen er angi bir yaratılğan! (Bular Allahnıñ sizni yañıdan
          tiriltüvini ağırlaştırmaz). Deycekler ki: «Bizni tekrar (ayatqa) kim
          qaytaracaq?» De ki: Sizni birinci kere yaratqan. Bunıñ üzerine olar saña alaylı
          bir tarzda başlarını sallaycaq ve: «Ne zaman eken o?» deycekler. De ki: Yaqın
          olsa kerek!
        cid: 0
  - verse: 51
    segments:
      - text: >
          [50 ayetine baq.]
        cid: 0
  - verse: 52
    segments:
      - text: >
