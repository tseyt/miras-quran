          (s.a.)tan Safa tepesini altın ve kümüş yapmasını istegen ediler. Ayet-i kerimeden
          añlaşılğanına köre, daa evelki qavmlar da böyle mucizeler istegen ediler ki, olarnıñ
          asıl maqsadı, inanmaq degil edi. Allah Taalâ olarnıñ peyğamberlerinden istegen bu
          mucizelerni meydanğa ketirgen, faqat iman etmegenleri içün de, olarnı elâk etken
          edi. Bu, Allahnıñ bir qanunıdır. Eger Az.Peyğamber de müşriklerniñ istegen bu kibi
          mucizelerini köstergen olsa edi, -ki, olar kene de inanmaycaq ediler- o taqdirde,
          keçmiş qavmlar kibi, olar da, elâk olacaq ediler. Buña köre, yuqarıdaki ayette Salih
