      - text: "Ve der ediler ki: Rabbimizni tesbih etermiz. Rabbimizniñ vadesı mıtlaqa yerine ketirilir."
        cid: 0
  - verse: 109
    segments:
      - text: "Ağlayaraq, yuz ustü yerge qapanırlar. (Qur’an oqumaq) olarnıñ sayğısını arttırır."
        cid: 0
  - verse: 110
    segments:
      - text: "De ki: «İster Allaһ deñ, ister Rahman deñ. Angisini deseñiz olur. Çünki, eñ guzel isimler oña hastır». Namazıñda yuksek sesnen oquma; onda sesiñni ziyade de qısma; ekisiniñ arasında bir yol tut."
        cid: 0
  - verse: 111
    segments:
      - text: "«Bala edinmegen, akimiyette ortağı olmağan, acizlikten otrü, bir dostqa da itiyacı olmağan Allaһqa hamd eterim», de ve tekbir ketirerek, Onıñ şanını yukselt!"
        cid: 0