surah_id: 17
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "Bir gece oña ayetlerimizden bir qısmını kostereyik diye, (Muһammed) qulını Mescid-i Haramdan etrafını mubarek qıldığımız Mescid-i Aqsağa alıp barğan Allaһ noqsan sıfatlardan uzaqtır; O, aqiqaten eşiticidir, korücidir."
        cid: 0
  - verse: 2
    segments:
      - text: "Biz Musağa Kitapnı berdik ve İsrail oğullarına: «Menden başqasına tayanılıp, işanılğan bir rabb edinmeñ», diyerek, bu Kitapnı bir hidayet reberi yaptıq."
        cid: 0
  - verse: 3
    segments:
      - text: "(Ey,) Nuһ ile birlekte (gemide) taşığan kimselerimizniñ nesli! Şunı biliñ ki, Nuһ çoq şukür etici bir qul edi. (Bazı tefsirlerde ekinci ve uçünci ayetler arasında boyle bir mana bağı qurulğan: Ey, Nuһ ile birlikte gemide taşığan kimselerimizniñ nesli! Menden başqasını, tayanılıp, işanılğan bir rabb edinmeñ. Aqiqaten, Nuһ çoq şukür etici bir qul edi)."
        cid: 0
  - verse: 4
    segments:
      - text: "Biz Kitapta İsrail oğullarına: Sizler yer yuzünde eki defa fesat çıqaracaqsıñız ve adden aşuv derecesinde bir kibrge qapılacaqsıñız, diye bildirdik."
        cid: 0
  - verse: 5
    segments:
      - text: "Bulardan birincisiniñ vaqtı kelgeninen, ustüñizge kuçlü-quvetli qullarımıznı yolladıq. Bular evlerniñ arasında dolaşaraq, (sizni) qıdırdılar. Bu - yerine ketirilgen bir vade edi. (Tefsirlerde bu kuçlü-quvetli qullarnıñ nineval Sencarip, babilli Buhtunnasr ya da Caalutnıñ orduları olğanı, olarnıñ Tevratnı ve Mescid-i Aqsanı yaqqanları, İsrail oğullarınıñ alimlerini oldürgenleri ve 70.000 qadar esir alğanları rivayet etile, butün bu musibetlerge sebep olğan İsrail oğullarınıñ ilk fesatınıñ ise, Zekeriyyanı oldirüvleri ve Ermiyanı aps etüvleri olğanı beyan etile)."
        cid: 0
  - verse: 6
    segments:
      - text: "Soñra olarğa nisbeten sizge tekrar (ğalebe ve zafer) berdik; servet ve oğullarnen kuçüñizni arttırdıq; sayıñıznı daa da çoqlaştırdıq."
        cid: 0
  - verse: 7
    segments:
      - text: "Eger yahşılıq yapsañız, ozüñizge yapqan, yamanlıq yapsañız, kene ozüñizge yapqan olursıñız. Artıq diger cezalandıruv vaqtı kelgeninen, yuzüñizni qara etsinler, daa evel kirgenleri kibi, kene Mescidke (Suleyman Mabedine) kirsinler ve ellerine keçirgen er şeyni bus-butün yoq etsinler (diye başıñızğa kene duşmanlarıñıznı musallat yaptıq). (Tefsirlerde İsrail oğularınıñ ekinci musibetke oğravlarınıñ sebebi olğan diger fesat areketleriniñ Az.Yahyanı oldirüvleri ve Az.İsanı oldürmege areketleri olğanı bildirile)."
        cid: 0
  - verse: 8
    segments:
      - text: "Belki, Rabbiñiz sizge merhamet eter; faqat siz, eger kene (fesatçılıqqa) dönseñiz, biz de sizni kene cezalandırırmız. Biz ceennemni kâfirler içün bir apshane yaptıq."
        cid: 0
  - verse: 9
    segments:
      - text: "Şubesiz ki, bu Qur’an eñ doğru yolğa iriştirir, yahşı davranışlarda bulunğan mu’minlerge, ozleri içün buyuk bir mukâfat olğanını mujdeler."
        cid: 0
  - verse: 10
    segments:
      - text: "Ahiretke inanmağanlarğa kelgende, olar içün de elemli bir azap azırlağandırmız."
        cid: 0
  - verse: 11
    segments:
      - text: "İnsan, hayırnı istegeni qadar, şerrni de ister. İnsan pek aşıqçandır! (Bu ayet insannıñ muim bir psihilogik tarafına işaret etmekte: Aqiqaten, biz, insanlar opkelengen, sıqılğan ya da bir kuçlülikke oğrağanımızda, opkelengenlerimiz içün beddua eter; kuçlüliklerden sabır ve metanetnen qurtulmaq içün areket etecek yerimizde, aşıqçanlıq kosterip, tezden qurtulmaq istermiz. Bu olmağance umütsiz ve ruhsız al içinde: «Allaһım, canımnı al da, meni bu qıyınlıqtan qurtar!» kibi sözlernen ozümiz içün beddua etermiz ki, bular doğru degildir)."
        cid: 0
  - verse: 12
    segments:
      - text: "Biz geceni ve kundüzni birer ayet (delil) olaraq yarattıq. Albuki, Rabbiñizniñ nimetlerini qıdırmañ, ayrıca, yıllarnıñ sayı ve esabını bilüviñiz içün, geceniñ qaranlığını silip (erine, eşyanı) aydınlatqan kundüzniñ aydınlığını ketirdik. İşte, biz er şeyni ap-açıq añlattıq."
        cid: 0
  - verse: 13
    segments:
      - text: "Er insannıñ amelini (ya da taqdirini) boynuna bağladıq. İnsan içün qıyamet kunünde açılğan alda ogüne qoyulacaq bir kitap çıqarırmız."
        cid: 0
  - verse: 14
    segments:
      - text: "Kitabıñnı oqu! Buguñ senden esap soraycaq olaraq ozüñniñ nefsiñ yeterli. (Bu dünyada, ister etrafnıñ menfiy şartları, ister insannı bir çoq fena istek ve ihtirasları, onıñ qalp ve basiretini bağlay bilmekte, yahşılıq ve yamanlıqnı korüviniñ ogüni bağlamaqta. Buña qarşılıq, yuqarıdaki ayetke kore, ahirette insan söz mevzusı olamaycaq amillerden qurtulacağı içün, oz esabını şahsen ozü yapacaq, dünyadaki amelleriniñ qıymeti aqqında uküm berecek ve ozüni añlaycaq ya da mahküm etecek bir ruh kemalatına qavuşacaq)."
        cid: 0
  - verse: 15
    segments:
      - text: "Kim hidayet yolunı seçse, buña yalıñız oz eyiligi içün seçken olur; kim de doğrulıqtan sapsa, oz zararına sapqan olur. İç bir gunahkâr başqasınıñ gunahını arqalamaz. Biz bir peyğamber yollamağance (kimsege) azap etecek degilmiz."
        cid: 0
  - verse: 16
    segments:
      - text: "Bir ulkeni elâk etmek isteginimizde, o ulkeniñ zenginlik sebebinen, qopayçora yolbaşçılarına (eyiliklerni) emir etermiz; buña rağmen, olar o yerde yamanlıq yaparlar. Boylece, o ulke elâketke lâyıq olur; biz de o yerni darma-dağın etermiz. (Ayetniñ baş qısmı tefsirciler tarafından boyle de añlaşılğan: Bir ulkeni elâk etmek istegenimizde, o ulkeniñ varlıqlı ve qopayçora adamlarını çoqlaştırırmız. Bunıñyen olar fenalıq yapar; boylece o ulke elâketke lâyıq olur)."
        cid: 0
  - verse: 17
    segments:
      - text: "Nuһtan soñki nesilerden nicelerini elâk ettik. Qullarınıñ gunahlarını bilici ve korüci olaraq Rabbiñ kâfidir."
        cid: 0
  - verse: 18
    segments:
      - text: "Er kim bu çar-çabuk keçken dünyanı tilese, oña, yani istegen kimsemizge, istegenimiz qadarını dünyada aman berir, soñra da onı, azarlanğan ve quvulğan olaraq kirecegi ceennemge soqarmız."
        cid: 0
  - verse: 19
    segments:
      - text: "Kim de ahiretni tiler ve mu’min olaraq oña yaraşqan bir ğayretnen çalışsa, işte, bularnıñ çalışuvları maqbuldır."
        cid: 0
  - verse: 20
    segments:
      - text: "Episine - olarğa da, bularğa da, (dünyanı istegenlerge de, ahiretni istegenlerge de) Rabbiñniñ ihsanından (istegenlerini) berirmiz. Rabbiñniñ ihsanı qısılğan degildir."
        cid: 0
  - verse: 21
    segments:
      - text: "Baqsana, biz insanlarnıñ kimisini kimisinden nasıl ustün yapqandırmız! Elbette ki, ahiret, derece ve ustünlik farqları noqtai nazarından, daa buyuktir. (20-nci ayet, ister dünya, ister ahiret nimetleri noqtai nazarından, Allaһnıñ lütfi sıñırsızlığını ifade etmekte; servet, mevqi, sağlıq ve yaşayış guzelligi noqtai nazarından, insanlar arasındaki farqlarnıñ, ilâiy taqdirniñ bir keregi olğanını, buña kore, bu dünyada mutlaq musaviylikniñ imkânsızlığını ortağa çıqarmaqta. Bunıñnen beraber, 21-nci ayetten añlaşıla ki, ahirette de insanlar bir vaziyette olmaycaqlar, aksine, insanlarnıñ dünyada yapqan işlerine kore, ahirette derece farqları daa da buyuk olacaq. Ancaq, 18-nci ayetten de añlaşılğanına kore, para ve mevqi kibi dünyaviy imkânlar, Allaһ nezdinde mutlaq bir deger ifade etmegeni içün, dünya ayatını tek bularnıñ peşinden çaparaq keçirgenler, ahirette ustün derecelerge qavuşmaq aqqını ğayıp etecekler)."
