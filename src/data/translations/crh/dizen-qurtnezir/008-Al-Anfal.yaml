surah_id: 8
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >
          Senden cenk ğanimetlerini soramqtalar. De ki: Ğanimetler Allah ve Peyğamberge
          aittir. O alda siz (aqıqiy) mü'minler iseñiz, Allahtan qorquñ, arañıznı
          tüzeltiñ, Allah ve Resulına itaat etiñ. (Ğanimetlerniñ Allahqa ait oluvı demek,
          cenkte alınğan mal ve mülkniñ İslâm devletine ait oluvı demektir).
        cid: 0
  - verse: 2
    segments:
      - text: >
          Mü'minler ancaq, Allah añılğan vaqıtta yürekleri titregen, özlerine Allahnıñ
          ayetleri oqulğanda, imanlarını arttırğan ve yalıñız Rabblerine tayanıp işanğan
          kimselerdir.
        cid: 0
  - verse: 3
    segments:
      - text: >
          Olar namazlarını dos-doğru qılğan ve özlerine rızıq olaraq bergenimizden (Allah
          yolunda) arclağan kimselerdir.
        cid: 0
  - verse: 4
    segments:
      - text: >
          İşte, olar aqiqiy mü'minlerdir. Olar içün Rabbleri qatında nice dereceler,
          bağışlanma ve tükenmez bir rızıq bardır. (Bedir cenkine çıqqanda, musulmanlarnıñ
          bir qısmı raatsız ediler. Bazıları da ğanimetlerniñ paylaştırıluvında
          hoşnutsızlıq kösterdiler. Allah Taalâ olarnıñ bu vaziyetini evelkelerniñ
          hoşnutsızlıq vaziyetlerine beñzeterek, böyle buyurdı:)
        cid: 0
  - verse: 5
    segments:
      - text: >
          (Olarnıñ bu alı), mü'minlerden bir topu kesen-kes istemegeni alda, Rabbiñ seni
          eviñden haq oğruna çıqarğan (vaqıttaki) alları kibidir.
        cid: 0
  - verse: 6
    segments:
      - text: >
          Haq ortağa çıqqandan soñ, sanki közleri köre-köre ölümge süyrekleneler kibi,
          (cihad hususında) sennen tartışa ediler. (İciretniñ ekinci yılında Mekke
          müşrikleri Ebu Süfyannıñ başçılığında bir ticaret kervanını Şamğa yolladı.
          Resulullah (s.a.) kervannıñ qaytuvını haber alğanınen, daa evel özlerini
          yurtlarından çıqarğan Qureyşniñ bu kervanını urmaq istedi ve üç yüzden ziyade
          arqadaşınen yolğa çıqtı. Faqat vaziyetten haberdar olğan Ebu Süfyan, bir
          taraftan kervannı qurtaruvları içün Qureyşke haber yollağan, diger taraftan da,
          yolunı deñiştirerek, kervannı qurtarğan. Müşrikler biñ adamlıq bir ordunen yolğa
          çıqtlar. Musulmanlar artıq kervannen degil, Qureyş cenkâverlerinen qarşılaşacaq
          ediler. Ashaptan bir qısmı: «Biz kervannı yaqalamaq içün çıqtıq, böyle bir
          cenkke azırlıqlı degilmiz», diyerik, çekinüv köstere ediler. Neticede cenkleşüv
          hususında bir sözge keldiler ve aqiqaten de musulmanlar zafer qazandılar).
        cid: 0
  - verse: 7
    segments:
      - text: >
          Hatırlañ ki, Allah sizge, eki taifeden (kervan ya da Qureyş ordusından) biriniñ
          siziñki olğanını vade ete edi; siz de quvetsiz olğan (kervannıñ) siziñki oluvını
          istey ediñiz. Albuki, Allah sözlerinen haqnı kerçekleştirmek ve (Qureyş ordusını
          yoq eterek) kâfirlerniñ ardını kesmek istey edi.
        cid: 0
  - verse: 8
    segments:
      - text: >
          (Bular), günahkârlar istemese de, haqnı kerçekleştirmek ve batılnı ortadan
          qaldırmaq içün edi.
        cid: 0
  - verse: 9
    segments:
      - text: >
          Hatırlañız ki, siz Rabbiñizden yardım istey ediñiz. O da, men peşi-peşine kelgen
          biñ meleknen sizge yardım etecegim, diyerek duañıznı qabul buyurdı. (Resulullah
          (s.a.) öz arqadaşlarınıñ azlığını, müşriklerniñ de çoqluğını körgeninen, qıblağa
          yönelerek, eki elini uzattı ve böyle dua etti: «Allahım! Maña bergen sözüñni
          yerine ketir. Allahım! Bu cemaatnı elâk etseñ, artıq yer yüzünde saña ibadet
          etecek kimse qalmaycaq!» Resulullah (s.a.) bu duanı devamlı oqudı. Allah Taalâ
          da, onıñ duasını qabul eterek, biñ meleknen yardım etti. İşte, yuqarıdaki ayette
          buña işaret etile).
        cid: 0
  - verse: 10
    segments:
      - text: >
          Allah bunı (meleklernen yardımnı) sadece müjde olsun ve onıñnen qalbiñiz
          yatışsın, diye yapqan edi. Zaten, yardım yalıñız Allah tarafındandır. Çünki,
          Allah mutlaq ğaliptir, yekâne üküm ve ikmet saibidir.
        cid: 0
  - verse: 11
    segments:
      - text: >
          O zaman qatında bir işanç olmaq üzre, sizni hafif bir yuquğa daldıra edi; sizni
          temizlemek, şeytannıñ pisligini (bergen vesvesesini) sizden ketkizmek,
          qalpleriñizni bir-birine bağlamaq ve cenkte sebat ettirmek içün, üstüñizge
          kökten bir suv (yağmur) endire edi. (Qureyş ordusı daa evel kelip, Bedir quyusı
          etrafında yerleşken edi. İslâm mucahidleri ise, suvsız edi. Aynı vaqıtta tutqan
          mevqileri de çoq qumlıq olğanından, serbest areketke imkân bermey edi. Yağğan
          yağmur em olarnıñ qalbindeki bazı vesveselerni arındırdı, ruhlarını köterdi, em
          de suv itiyaclarını qandırdı. Alelhusus, qumlıq bir yer olğan cenk meydanını
          pekiştirerek, areketke elverişli bir alğa ketirdi).
        cid: 0
  - verse: 12
    segments:
      - text: >
          O vaqıtta Rabbiñ meleklerge: «Muaqqaq men siznen beraberim; aydı, iman
          etkenlerge destek oluñ; Men kâfirlerniñ yüregine qorqu qoyacam; urıñ
          boyunlarına! Urıñ olarnıñ bütün parmaqlarına! diye vahiy ete edi.
        cid: 0
  - verse: 13
    segments:
      - text: >
          Bu aytılğanlar, olarnıñ Allahqa ve Resulına qarşı kelüvlerinden ötrüdir. Kim
          Allah ve Rusulına qarşı kelse, bilsin ki, Allahnıñ azabı şiddetlidir.
        cid: 0
  - verse: 14
    segments:
      - text: >
          İşte, bu mağlubiyet sizge Allahnıñ azabı! Şimdilik onı tatıñ! Kâfirlerge bir de
          ceennem ateşiniñ azabı bardır.
        cid: 0
  - verse: 15
    segments:
      - text: >
          Ey, mü'minler! Toplu alda kâfirlernen qarşılaşqan vaqtıñızda, olarğa arqañıznı
          çevirmeñ. (Qorqup qaçmañ).
        cid: 0
  - verse: 16
    segments:
      - text: >
          Tekrar cenkleşmek içün bir tarafqa çekilüv ya da diger bölükke qoşulıp, mekân
          tutmaq vaziyetinden ğayrı, kim öyle bir künde olarğa arqa çevirse, muaqaq ki, o
          Allahnıñ ğadabını aq etken olaraq döner. Onıñ yeri de ceennemdir. O yer
          barılacaq ne fena yerdir.
        cid: 0
  - verse: 17
    segments:
      - text: >
          (Cenkte) olarnı siz öldürmediñiz, faqat Allah öldürdi olarnı; atqan vaqtıñda da
          sen atmadıñ, faqat Allah attı (onı). Ve bunı, mü'minlerni güzel bir imtian ile
          sınamaq içün (yaptı). Şübesiz, Allah eşiticidir, bilicidir. (Qureyş ordusı
          musulmanlarnen cenkleşmek içün ilerilegeninen, Resulullah (s.a.) ellerini
          köterip: «Allahım! Qureyş seniñ Resulıñnı yalanlağan kibirli yolbaşçılarınen
          keldi. Allahım! Maña bergen sözüñni yerine ketirüviñni tileyim!» diye dua etti.
          Ve eki toplulıq qarşılaşqanınen, yerden bir avuç topraq alıp, duşmannıñ
          yüzlerine doğru septi. Qureyş ordusınıñ közleri körmez oldı ve soñunda
          darma-dağın oldular. İşte, bu ayette bu atuvğa işaret etilmekte, onı atqannıñ
          aqiqaten Allah olğanı bildirilmekte. Çünki, bu bir mucize edi ve Peyğamber onı
          atqanda öz adından degil, Allah adından atqan edi).
        cid: 0
  - verse: 18
    segments:
      - text: >
          Bu - böyledir. Şübesiz, Allah kâfirlerniñ tuzağını bozar.
        cid: 0
  - verse: 19
    segments:
      - text: >
          (Ey, kâfirler!) Eger siz feth isteseñiz, işte, sizge feth keldi! (Yeñeyik
          degende, yeñildiñiz). Ve eger (inkârdan) vazgeçseñiz, bu siz içün daa yahşıdır.
          Kene (peyğamberge duşmanlıqqa) qaytsañız, biz de (oña) yardımğa qaytırmız.
          Toplulığıñız çoq bile olsa, bu sizge asla fayda beralmaz. Çünki, Allah
          mü'minlernen beraberdir.
        cid: 0
  - verse: 20
    segments:
      - text: >
          Ey, iman etkenler! Allahqa ve Resulına itaat etiñ, eşitkeniñiz alda, Ondan yüz
          çevirmeñ.
        cid: 0
  - verse: 21
    segments:
      - text: >
          Eşitmegenleri alda, eşittik degenler kibi olmañ.
        cid: 0
  - verse: 22
    segments:
      - text: >
          Şübesiz, Allah qatında ayvanlarnıñ eñ fenası - tüşünmegen sağırlar ve
          tilsizlerdir.
        cid: 0
  - verse: 23
    segments:
      - text: >
          Allah olarda bir hayır körse edi, elbette olarğa eşittirir edi. Faqat eşittirse
          bile, kene olar yüz çevirerek döner ediler. (Bu ayetler Allah Resulınıñ
          sözlerini eşitip de, emiyet bermegen kimselerge hatırlatmadır. Bular körünişte
          eşitkenlerini aqiqiy manada eşitmegenleri içün söz añlamağan sağır ve tilsiz
          ayvanlarğa beñzetilgen. Bularda hayır istidadı yoqtır. Eger hayırğa
          qabiliyetleri olsa edi, Allah olarğa sözleriniñ aqiqiy manasını eşittirir edi).
        cid: 0
  - verse: 24
    segments:
      - text: >
          Ey, inanğanlar! Ayat berecek şeylerge sizni çağırğan vaqıtta, Allah ve Resulına
          uyıñ. Ve biliñ ki, Allah kişi ile onıñ qalbi arasına kirer ve siz mıtlaqa onıñ
          uzurında toplanacaqsıñız. (İnsanlarğa ayat berecek şey Allah ve Resulınıñ emir
          ve yasaqlarıdır. Şübesiz ki, onıñ er emrinde bir ikmet ve ayat bar. Onıñ içün
          Ondan kelgen er bir emirni qabul etmek ve yerine ketirmek kerek. Ayette «Allah
          kişi ile qalbi arasına kirer» buyurılmaqta. Bu alnı tasvir etüvden acizmiz.
          Ancaq, başqa bir ayette «Biz insanğa şah damarından daa yaqınmız», buyurılğan.
          Allah insannıñ qabiliyetine köre, qalbini istegen tarafqa çevirir. Peyğamberimiz
          böyle dua eter edi: «Ey, qalplerni çevirgen Allah! Menim qalbimni seniñ diniñ
          üzerine sabit et!").
        cid: 0
  - verse: 25
    segments:
      - text: >
          Bir de öyle bir fitneden saqınıñ ki, o, arañızdan sadece zulum etkenlerge
          irişüvnen qalmaz (umumğa tiyer ve episini perişan eter). Biliñ ki, Allahnıñ
          azabı şiddetlidir.
        cid: 0
  - verse: 26
    segments:
      - text: >
          Hatırlañ ki, bir zaman siz yer yüzünde aciz tanılğan az (bir toplum) ediñiz;
          insanlarnıñ sizni qapıp alıp ketüvinden qorqa ediñiz de, şükür etersiñiz diye,
          Allah sizge yer-yurt berdi; yardımınen sizni destekledi ve sizge temizinden
          rızıqlar berdi.
        cid: 0
  - verse: 27
    segments:
      - text: >
          Ey, iman etkenler! Allahqa ve Peyğamberge hainlik etmeñ; (Soñra) bile-bile öz
          emanetleriñizge hainlik etken olursıñız. (Medenide bir yeudiy qabilesi olğan
          Qurayza oğulları bir cenkte Peyğambernen daa evel yapqan antlaşuvını bozaraq,
          ittifaqlı müşrik ordularına yardım ettiler. Müşrik arap orduları çekilip
          ketkenden soñ, Resulullah olarnıñ qalelerini sarıp aldı. Barış isteklerini de
          red etti. Yalıñız seçecek bir hakemleriniñ berecek ükmine razı olacağını
          bildirdi. Yeudiyler de hakem olaraq Sa'dnı seçtiler. Soñ Sa'dnıñ berecek ükmi
          aqqında bir fikrleşmek içün, Ebu Lübaabenen qonuşmaq istediler. Ebu Lübaabe
          bardı. Sa'dnıñ ükmi ne olacağını ondan soradılar. O da yeudiylerniñ
          soyulacaqlarına işaret olaraq, boğazını kösterdi. İşte, yuqardaki ayet Ebu
          Lübaabeniñ bu areketlerine işaret eterek, onı tenqit etmekte. Bunıñ üzerine, Ebu
          Lübaabe özüni mescitniñ diregine bağlap, ölgenge ya da Allah tarafından afu
          etelgenge qadar aşap-içmeycegine yemin etti. Yedi künden soñ, bayılıp qaldı.
          Bunıñ üzerine afu etilgenine dair bir ayet endi).
        cid: 0
  - verse: 28
    segments:
      - text: >
          Biliñ ki, mallarıñız ve balalarıñız birer imtian sebebidir ve büyük mükâfat
          Allahnıñ qatındadır.
        cid: 0
  - verse: 29
    segments:
      - text: >
          Ey, iman etkenler! Eger Allahtan qorqa iseñiz, O, sizge yahşınen yamannı ayırdı
          etecek bir añlayış berir, suçlarıñıznı qapatır ve sizni bağışlar. Çünki, Allah
          büyük lütf saibidir.
        cid: 0
  - verse: 30
    segments:
      - text: >
          Hatırla ki, kâfirler seni tutıp bağlavları ya da öldirüvleri, yahut seni
          (yurtuñdan) çıqaruvları içün saña tuzaq qura ediler. Olar (saña) tuzaq
          qurğanlarında, Allah da (olarğa) tuzaq qura edi. Çünki, Allah tuzaq qurğanlarnıñ
          eñ eyisidir.
        cid: 0
  - verse: 31
    segments:
      - text: >
          Olarğa ayetlerimiz oqulğan vaqıtta dediler ki: «(Ebet) eşittik, istesek biz de
          buña beñzegenini, elbette söyley bilirmiz. Bu evelkilerniñ masalarından başqa
          bir şey degil».
        cid: 0
  - verse: 32
    segments:
      - text: >
          (O kâfirler) bir vaqıtta da: Ey, Allahım! Eger bu Kitap seniñ qatıñdan kelgen
          bir aqiqat ise, üstümizge kökten taş yağdır, yahut bizge elem berici bir azap
          ketir! degen ediler.
        cid: 0
  - verse: 33
    segments:
      - text: >
          Albuki, sen olarnıñ arasında olğanda, Allah olarğa azap etmez. Ve olar mağfiret
          tilegende de, Allah olarğa azap etici degil.
        cid: 0
  - verse: 34
    segments:
      - text: >
          Olar Mescid-i Haramnıñ mütevellileri olmağanları alda, (mü'minlerni) o yerden
          artqa çevirir ekenler, Allah olarğa ne içün azap bermeycek? O yerniñ
          mütevellileri taqva saiplerinden başqaları degil. Faqat olarnıñ çoqu bunı
          bilmez.
        cid: 0
  - verse: 35
    segments:
      - text: >
          Olarnıñ Beytullah yanındaki duaları da sızğırmaq ve el çırpmaqtan başqa şey
          degil. (Ey, kâfirler!) İnkâr eteyatqan şeyleriñizden ötrü, şimdi azapnı tatıñ!
          (Rivayetke köre, müşriklerniñ bazı erkek ve qadınları Beytullahnı çıplaq olaraq
          tavaf ete ediler. Tavaf esnasında parmaqlarını bir-birine keçirip ağızlarına
          alıp barıp, sızğıralar, bir taraftan da, ellerini çırpa ediler. Bu da,
          iddalarına köre, olarnıñ duası edi. İşte, yuqaradaki ayet müşriklerniñ bu
          vaziyetlerine işaret etmekte).
        cid: 0
  - verse: 36
    segments:
      - text: >
          Şübesiz ki, inkâr etkenler mallarını (insanlarnı) Allah yolundan çıqarmaq içün
          arclamaqtalar. Daa da arclaycaqlar. Amma, soñunda bu, olarğa yürek accısı olacaq
          ve eñ soñunda mağlüp olacaqlar. Kâfirlikte israr etkenler ise, ceennemge
          toplanacaqlar. (Bedir ve daa soñki cenklerde müşrikler bütün servetlerini ortağa
          qoyaraq, İslâmnı mağlüp etmege ıntılğanlar, faqat soñunda episi perişan
          olğanlar).
        cid: 0
  - verse: 37
    segments:
      - text: >
          (Bu toplav) Allahnıñ pisni temizden ayıruvı (mü'minni kâfirden ayıruvı) ve bütün
          pislerniñ bir qısmını diger bir qısmınıñ üstüne qoyıp, episini toplarayaq,
          ceennemge atuvı içündir. İşte, olar ziyanğa oğrağanlarnıñ özleridir.
        cid: 0
  - verse: 38
    segments:
      - text: >
          İnkâr etkenlerge (saña duşmanlıqtan) vazgeçseler, keçmiş günahlarınıñ
          bağışlanacağını söyle. Yoq, keri döner iseler, özlerinden evelkilerniñ alı
          közleriniñ ögündedir!
        cid: 0
  - verse: 39
    segments:
      - text: >
          Fitne ortadan qalqqanğa ve din tamamen Allahnıñki olğanğa qadar, olarnen
          cenkleşiñ! (İnkârnı) toqtatsalar, şübesiz ki, Allah olarnıñ yapqanlarını çoq
          yahşı körer.
        cid: 0
  - verse: 40
    segments:
      - text: >
          Eger (imandan) yüz çevirseler, biliñ ki, Allah siziñ saibiñizdir. O ne güzel
          saip ve ne güzel yardımcıdır!
        cid: 0
  - verse: 41
    segments:
      - text: >
          Eger Allahqa ve haq ile batılnıñ ayırılğan künü, eki ordunıñ bir-birinen
          qarşılaşqan künü (Bedir cenkinde) qulımızğa endirgenimizge inanğan iseñiz, biliñ
          ki, ğanimet olaraq alğan er angi bir şeyiñizniñ, beşte biri Allahqa, Resulına,
          onıñ aqrabalarına, yetimlerge, yoqsullarğa ve yolcuğa aittir. Allah er şeyge
          haqqı ile qadirdir. (Ayette zikr etilgen Peyğamberniñ aqrabaları aqqında alimler
          ihtilâf etkenler. Şafiyge köre, Haşim ve Muttalib oğullarıdır; bir noqtai
          nazarğa köre de, sadece Haşim oğullarıdır; diger bir fikrge binaen, zekât
          aluvları elâl olmağan aqrabalardır, bir başqa noqtai nazarğa köre ise, bütün
          Qureyş qabilesidir. Cenkte alınğan ğanimetler beşke bölünir. Beşte biri ayette
          sayılğanlarğa ayırılır. Qalğanı da cenkke qatılğan ğaziylerge taqsim etilir).
        cid: 0
  - verse: 42
    segments:
      - text: >
          Hatırlañ ki, (Bedir cenkinde) siz vadiyniñ yaqın kenarında (Medine tarafında)
          ediñiz, olar da uzaq kenarında (Mekke tarafında) ediler. Kervan da sizden daa
          aşağıda (deñiz sailinde) edi. Eger (cenk içün) söyleşken olsa ediñiz, söyleşken
          vaqtıñız hususında ihtilâfqa tüşer ediñiz. Faqat Allah kerekli olğan emirni
          yerine ketrüvi, elâk olğannıñ açıq bir delilnen (közünen körgenden soñ) elâk
          oluvı, yaşağannıñ da, açıq bir delilnen yaşavı içün (böyle yaptı). Çünki, Allah
          haqqı ile eşticidir, bilicidir.
        cid: 0
  - verse: 43
    segments:
      - text: >
          Hatırla ki, Allah yuqlağanıñda saña olarnı az kösterdi. Eger olarnı saña çoq
          kösterse edi, elbette çekinecek ve bu iş aqqında munaqşağa kirişecek ediñiz.
          Faqat Allah (sizni bundan) qurtardı. Şübesiz, O, kalplerniñ özüni bilir.
        cid: 0
  - verse: 44
    segments:
      - text: >
          Allah, olacaq bir işni yerine ketirmek içün, (cenk meydanında) qarşılaşqan
          vaqtıñızda olarnı siziñ közleriñizde az köstermekte, sizni de olarnıñ közlerinde
          azaltmaqta. Bütün işler Allahqa döner.
        cid: 0
  - verse: 45
    segments:
      - text: >
