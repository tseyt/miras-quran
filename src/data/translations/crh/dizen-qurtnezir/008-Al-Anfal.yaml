          esirler arasında bulunğan Abbas aqqında engen. Az. Peyğamber Abbasqa em özü, em de
          eki qardaşınıñ balaları Aqil ve Nevfel içün fidye teklif etken; Abbas ise, faqır
          olğanını aytqan ve «ömürim boyu Qureyşke el açıp tileneyimmi?», degen edi. Azreti
          Peyğamber: «Bedir cenkine qatılır eken, Ummu Fazılğa emanet etken altınlarğa ne
          demeli?», degeninen, Abbas Az. Peyğamberniñ bunı bilgenine ayret etken ve
          Resulullahnıñ Peyğamberligini tasdiq etken edi).
