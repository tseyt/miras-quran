          qurğanlarında, Allaһ da (olarğa) tuzaq qura edi. Çünki, Allaһ tuzaq qurğanlarnıñ
          eñ eyisidir.
        cid: 0
  - verse: 31
    segments:
      - text: >-
          Olarğa ayetlerimiz oqulğan vaqıtta dediler ki: «(Ebet) eşittik, istesek biz de
          buña beñzegenini, elbette söyley bilirmiz. Bu evelkilerniñ masalarından başqa
