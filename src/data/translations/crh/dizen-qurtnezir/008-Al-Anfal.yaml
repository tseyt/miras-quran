        cid: 0
  - verse: 32
    segments:
      - text: >-
          (O kâfirler) bir vaqıtta da: Ey, Allaһım! Eger bu Kitap seniñ qatıñdan kelgen
          bir aqiqat ise, ustümizge kokten taş yağdır, yahut bizge elem berici bir azap
