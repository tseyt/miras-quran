surah_id: 8
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >-
          Senden cenk ğanimetlerini soramqtalar. De ki: Ğanimetler Allaһ ve Peyğamberge
          aittir. O alda siz (aqıqiy) mu’minler iseñiz, Allaһtan qorquñ, arañıznı
          tüzeltiñ, Allaһ ve Resulına itaat etiñ. (Ğanimetlerniñ Allaһqa ait oluvı demek,
          cenkte alınğan mal ve mulkniñ İslâm devletine ait oluvı demektir).
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Mu’minler ancaq, Allaһ añılğan vaqıtta yurekleri titregen, ozlerine Allaһnıñ
          ayetleri oqulğanda, imanlarını arttırğan ve yalıñız Rabblerine tayanıp işanğan
          kimselerdir.
        cid: 0
  - verse: 3
    segments:
      - text: >-
          Olar namazlarını dos-doğru qılğan ve ozlerine rızıq olaraq bergenimizden (Allaһ
          yolunda) arclağan kimselerdir.
        cid: 0
  - verse: 4
    segments:
      - text: >-
          İşte, olar aqiqiy mu’minlerdir. Olar içün Rabbleri qatında nice dereceler,
          bağışlanma ve tükenmez bir rızıq bardır. (Bedir cenkine çıqqanda, musulmanlarnıñ
          bir qısmı raatsız ediler. Bazıları da ğanimetlerniñ paylaştırıluvında
          hoşnutsızlıq kosterdiler. Allaһ Taalâ olarnıñ bu vaziyetini evelkelerniñ
          hoşnutsızlıq vaziyetlerine beñzeterek, boyle buyurdı:)
        cid: 0
  - verse: 5
    segments:
      - text: >-
          (Olarnıñ bu alı), mu’minlerden bir topu kesen-kes istemegeni alda, Rabbiñ seni
          eviñden haq oğruna çıqarğan (vaqıttaki) alları kibidir.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Haq ortağa çıqqandan soñ, sanki kozleri kore-kore olümge süyrekleneler kibi,
          (cihad hususında) sennen tartışa ediler. (İciretniñ ekinci yılında Mekke
          muşrikleri Ebu Sufyannıñ başçılığında bir ticaret kervanını Şamğa yolladı.
          Resulullah (s.a.) kervannıñ qaytuvını haber alğanınen, daa evel ozlerini
          yurtlarından çıqarğan Qureyşniñ bu kervanını urmaq istedi ve uç yuzden ziyade
          arqadaşınen yolğa çıqtı. Faqat vaziyetten haberdar olğan Ebu Sufyan, bir
          taraftan kervannı qurtaruvları içün Qureyşke haber yollağan, diger taraftan da,
          yolunı deñiştirerek, kervannı qurtarğan. Muşrikler biñ adamlıq bir ordunen yolğa
          çıqtlar. Musulmanlar artıq kervannen degil, Qureyş cenkâverlerinen qarşılaşacaq
          ediler. Ashaptan bir qısmı: «Biz kervannı yaqalamaq içün çıqtıq, boyle bir
          cenkke azırlıqlı degilmiz», diyerik, çekinüv kostere ediler. Neticede cenkleşüv
          hususında bir sözge keldiler ve aqiqaten de musulmanlar zafer qazandılar).
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Hatırlañ ki, Allaһ sizge, eki taifeden (kervan ya da Qureyş ordusından) biriniñ
          siziñki olğanını vade ete edi; siz de quvetsiz olğan (kervannıñ) siziñki oluvını
          istey ediñiz. Albuki, Allaһ sözlerinen haqnı kerçekleştirmek ve (Qureyş ordusını
          yoq eterek) kâfirlerniñ ardını kesmek istey edi.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          (Bular), gunahkârlar istemese de, haqnı kerçekleştirmek ve batılnı ortadan
          qaldırmaq içün edi.
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Hatırlañız ki, siz Rabbiñizden yardım istey ediñiz. O da, men peşi-peşine
          kelgen bin meleknen sizge yardım etecegim, diyerek duañıznı qabul buyurdı.
          (Resulullah (s.a.) oz arqadaşlarınıñ azlğını, muşriklerniñ de çoqluğını
          korgeninen, qıblağa yonelerek, eki elini uzattı ve boyle dua etti: «Allaһım!
          Maña bergen sözüñni yerine ketir. Allaһım! Bu cemaatnı elâk etseñ, artıq yer
          yuzünde saña ibadet etecek kimse qalmaycaq!» Resulullah (s.a.) bu duanı devamlı
          oqudı. Allaһ Taalâ da, onıñ duasını qabul eterek, biñ meleknen yardım etti.
          İşte, yuqarıdaki ayette buña işaret etile).
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Allaһ bunı (meleklernen yardımnı) sadece mujde olsun ve onıñyen qalbiñiz
          yatışsın, diye yapqan edi. Zaten, yardım yalıñız Allaһ tarafındandır. Çünki,
          Allaһ mutlaq ğaliptir, yekâne uküm ve ikmet saibidir.
        cid: 0
  - verse: 11
    segments:
      - text: >-
          O zaman qatında bir işanç olmaq uzre, sizni hafif bir yuquğa daldıra edi; sizni
          temizlemek, şeytannıñ pisligini (bergen vesvesesini) sizden ketkizmek,
          qalpleriñizni bir-birine bağlamaq ve cenkte sebat ettirmek içün, ustüñizge
          kokten bir suv (yağmur) endire edi. (Qureyş ordusı daa evel kelip, Bedir quyusı
          etrafında yerleşken edi. İslâm mucahidleri ise, suvsız edi. Aynı vaqıtta tutqan
          mevqileri de çoq qumlıq olğanından, serbest areketke imkân bermey edi. Yağğan
          yağmur em olarnıız qalbindeki bazı vesveselerni arındırdı, ruhlarını koterdi, em
          de suv itiyaclarını qandırdı. Alelhusus, qumlıq bir yer olğan cenk meydanını
          pekiştirerek, areketke elverişli bir alğa ketirdi).
        cid: 0
  - verse: 12
    segments:
      - text: >-
          O vaqıtta Rabbiñ meleklerge: «Muaqqaq men siznen beraberim; aydı, iman
          etkenlerge destek oluñ; Men kâfirlerniñ yuregine qorqu qoyacam; urıñ
          boyunlarına! Urıñ olarnıñ butün parmaqlarına! diye vahiy ete edi.
        cid: 0
  - verse: 13
    segments:
      - text: >-
          Bu aytılğanlar, olarnıñ Allaһqa ve Resulına qarşı kelüvlerinden otrüdir. Kim
          Allaһ ve Rusulına qarşı kelse, bilsin ki, Allaһnıñ azabı şiddetlidir.
        cid: 0
  - verse: 14
    segments:
      - text: >-
          İşte, bu mağlubiyet sizge Allaһnıñ azabı! Şimdilik onı tatıñ! Kâfirlerge bir de
          ceennem ateşiniñ azabı bardır.
        cid: 0
  - verse: 15
    segments:
      - text: >-
          Ey, mu’minler! Toplu alda kâfirlernen qarşılaşqan vaqtıñızda, olarğa arqañıznı
          çevirmeñ. (Qorqup qaçmañ).
        cid: 0
  - verse: 16
    segments:
      - text: >-
          Tekrar cenkleşmek içün bir tarafqa çekilüv ya da diger bolükke qoşulıp, mekân
          tutmaq vaziyetinden ğayrı, kim oyle bir kunde olarğa arqa çevirse, muaqaq ki, o
          Allaһnıñ ğadabını aq etken olaraq döner. Onıñ yeri de ceennemdir. O yer
          barılacaq ne fena yerdir.
        cid: 0
  - verse: 17
    segments:
      - text: >-
          (Cenkte) olarnı siz oldürmediñiz, faqat Allaһ oldürdi olarnı; atqan vaqtıñda da
          sen atmadıñ, faqat Allaһ attı (onı). Ve bunı, mu’minlerni guzel bir imtian ile
          sınamaq içün (yaptı). Şubesiz, Allaһ eşiticidir, bilicidir. (Qureyş ordusı
          musulmanlarnen cenkleşmek içün ilerilegeninen, Resulullah (s.a.) ellerini
          koterip: «Allaһım! Qureyş seniñ Resulıñnı yalanlağan kibirli yolbaşçılarınen
          keldi. Allaһım! Maña bergen sözüñni yerine ketirüviñni tileyim!» diye dua etti.
          Ve eki toplulıq qarşılaşqanınen, yerden bir avuç topraq alp, duşmannıñ yuzlerine
          doğru septi. Qureyş ordusınıñ kozleri kormez oldı ve soñunda darma-dağın
          oldular. İşte, bu ayette bu atuvğa işaret etilmekte, onı atqannıı aqiqaten Allaһ
          olğanı bildirilmekte. Çünki, bu bir mucize edi ve Peyğamber onı atqanda oz
          adından degil, Allaһ adından atqan edi).
        cid: 0
  - verse: 18
    segments:
      - text: >-
          Bu - boyledir. Şubesiz, Allaһ kâfirlerniñ tuzağını bozar.
        cid: 0
  - verse: 19
    segments:
      - text: >-
          (Ey, kâfirler!) Eger siz feth isteseñiz, işte, sizge feth keldi! (Eñyeyik
          degende, yeñildiñiz). Ve eger (inkârdan) vazgeçseñiz, bu siz içün daa yahşıdır.
          Kene (peyğamberge duşmanlıqqa) qaytsañız, biz de (oña) yardımğa qaytırmız.
          Toplulığıñız çoq bile olsa, bu sizge asla fayda beralmaz. Çünki, Allaһ
          mu’minlernen beraberdir.
        cid: 0
  - verse: 20
    segments:
      - text: >-
          Ey, iman etkenler! Allaһqa ve Resulına itaat etiñ, eşitkeniñiz alda, Ondan yuz
          çevirmeñ.
        cid: 0
  - verse: 21
    segments:
      - text: >-
          Eşitmegenleri alda, eşittik degenler kibi olmañ.
        cid: 0
  - verse: 22
    segments:
      - text: >-
          Şubesiz, Allaһ qatında ayvanlarnıñ eñ fenası - tüşünmegen sağırlar ve
          tilsizlerdir.
        cid: 0
  - verse: 23
    segments:
      - text: >-
          Allaһ olarda bir hayır korse edi, elbette olarğa eşittirir edi. Faqat eşittirse
          bile, kene olar yuz çevirerek döner ediler. (Bu ayetler Allaһ Resulnnıñ
          sözlerini eşitip de, emiyet bermegen kimselerge hatırlatmadır. Bular korünişte
          eşitkenlerini aqiqiy manada eşitmegenleri içün söz añlamağan sağır ve tilsiz
          ayvanlarğa beñzetilgen. Bularda hayır istidadı yoqtır. Eger hayırğa
          qabiliyetleri olsa edi, Allaһ olarğa sözleriniñ aqiqiy manasını eşittirir edi).
        cid: 0
  - verse: 24
    segments:
      - text: >-
          Ey, inanğanlar! Ayat berecek şeylerge sizni çağırğan vaqıtta, Allaһ ve Resulına
          uyıñ. Ve biliñ ki, Allaһ kişi ile onıñ qalbi arasına kirer ve siz mıtlaqa onıñ
          uzurında toplanacaqsıñız. (İnsanlarğa ayat berecek şey Allaһ ve Resulnnıñ emir
          ve yasaqlarıdır. Şubesiz ki, onıñ er emrinde bir ikmet ve ayat bar. Onıñ içün
          Ondan kelgen er bir emirni qabul etmek ve yerine ketirmek kerek. Ayette «Allaһ
          kişi ile qalbi arasına kirer» buyurılmaqta. Bu alnı tasvir etüvden acizmiz.
          Ancaq, başqa bir ayette «Biz insanğa şah damarından daa yaqınmız», buyurılğan.
          Allaһ insannıñ qabiliyetine kore, qalbini istegen tarafqa çevirir. Peyğamberimiz
          boyle dua eter edi: «Ey, qalplerni çevirgen Allaһ! Menim qalbimni seniñ diniñ
          uzerine sabit et!“).
        cid: 0
  - verse: 25
    segments:
      - text: >-
          Bir de oyle bir fitneden saqınıñ ki, o, arañızdan sadece zulum etkenlerge
          irişüvnen qalmaz (umumğa tiyer ve episini perişan eter). Biliñ ki, Allaһnıñ
          azabı şiddetlidir.
        cid: 0
  - verse: 26
    segments:
      - text: >-
          Hatırlañ ki, bir zaman siz yer yuzünde aciz tanılğan az (bir toplum) ediñiz;
          insanlarnıñ sizni qapıp alıp ketüvinden qorqa ediñiz de, şukür etersiñiz diye,
          Allaһ sizge yer-yurt berdi; yardımınen sizni destekledi ve sizge temizinden
          rızıqlar berdi.
        cid: 0
  - verse: 27
    segments:
      - text: >-
          Ey, iman etkenler! Allaһqa ve Peyğamberge hainlik etmeñ; (Soñra) bile-bile oz
          emanetleriñizge hainlik etken olursıñız. (Medenide bir yeudiy qabilesi olğan
          Qurayza oğulları bir cenkte Peyğambernen daa evel yapqan antlaşuvını bozaraq,
          ittifaqlı muşrik ordularına yardım ettiler. Muşrik arap orduları çekilip
          ketkenden soñ, Resulullah olarnıız qalelerini sarıp aldı. Barış isteklerini de
          red etti. Yalıñız seçecek bir hakemleriniñ berecek ukmine razı olacağını
          bildirdi. Yeudiyler de hakem olaraq Sa’dnı seçtiler. Soñ Sa’dnıñ berecek ukmi
          aqqında bir fikrleşmek içün, Ebu Lübaabenen qonuşmaq istediler. Ebu Lübaabe
          bardı. Sa’dnıñ ukmi ne olacağını ondan soradılar. O da yeudiylerniñ
          soyulacaqlarına işaret olaraq, boğazını kosterdi. İşte, yuqardaki ayet Ebu
          Lübaabeniñ bu areketlerine işaret eterek, onı tenqit etmekte. Bunıñ uzerine, Ebu
          Lübaabe ozüni mescitniñ diregine bağlap, olgenge ya da Allaһ tarafından afu
          etelgenge qadar aşapiçmeycegine yemin etti. Yedi kunden soñ, bayılıp qaldı.
          Bunıñ uzerine afu etilgenine dair bir ayet endi).
        cid: 0
  - verse: 28
    segments:
      - text: >-
          Biliñ ki, mallarıñız ve balalarıñız birer imtian sebebidir ve buyuk mukâfat
          Allaһnıñ qatındadır.
        cid: 0
  - verse: 29
