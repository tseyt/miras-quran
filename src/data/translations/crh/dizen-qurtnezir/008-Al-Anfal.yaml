          işaret olaraq, boğazını kösterdi. İşte, yuqardaki ayet Ebu Lübaabeniñ bu
          areketlerine işaret eterek, onı tenqit etmekte. Bunıñ üzerine, Ebu Lübaabe özüni
          mescitniñ diregine bağlap, ölgenge ya da Allah tarafından afu etelgenge qadar
