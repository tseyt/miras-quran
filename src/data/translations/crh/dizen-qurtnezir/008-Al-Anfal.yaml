      - text: >-
          (İciretniñ ekinci yılında Mekke müşrikleri Ebu Süfyannıñ başçılığında bir ticaret
          kervanını Şamğa yolladı. Resulullah (s.a.) kervannıñ qaytuvını haber alğanınen, daa
          evel özlerini yurtlarından çıqarğan Qureyşniñ bu kervanını urmaq istedi ve üç yüzden
          ziyade arqadaşınen yolğa çıqtı. Faqat vaziyetten haberdar olğan Ebu Süfyan, bir
          taraftan kervannı qurtaruvları içün Qureyşke haber yollağan, diger taraftan da,
          yolunı deñiştirerek, kervannı qurtarğan. Müşrikler biñ adamlıq bir ordunen yolğa
          çıqtlar. Musulmanlar artıq kervannen degil, Qureyş cenkâverlerinen qarşılaşacaq
          ediler. Ashaptan bir qısmı: «Biz kervannı yaqalamaq içün çıqtıq, böyle bir cenkke
          azırlıqlı degilmiz», diyerik, çekinüv köstere ediler. Neticede cenkleşüv hususında
          bir sözge keldiler ve aqiqaten de musulmanlar zafer qazandılar).
