      - text: >-
          (Namaz - ibadet duyğusınen Allah uzuruna çıqmaq, belli şekillernen Oña tabınmaq ve
          Onıñnen qonuşmaqtır. Namaz Allahnıñ qulunı uzuruna qabul etüvidir. İşte, bu qabul ve
          bu qullıq bir azırlıqnı talap etmektedir. Huzur-i ilâhiyde turğan qulnıñ uyanıq,
          şuurlı, içi ve tışı ter-temiz olması kerek; abdest ve ğusul bularnı teminlemek içün
          eñ güzel vastadır. Suv olmağanı ya da olğanı alda, qullanmağa bir mani yahut üzür
          bulunğanı alda teyemmum etilir. Teyemmum er ne qadar maddiy temizlikni teminlemese
          de, temizlik şuurı bermekte ve ibadetke azırlamaqtadır).
        cid: 0
