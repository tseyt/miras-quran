surah_id: 5
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "Ey, iman etkenler! Ahtlar(nıñ keregini) yerine ketiriñ. İhramlı olğanda avlanmaqnı elâl saymamaq uzre, (aşağıda) sizge oqulacaqlardan başqa ayvanlar siz içün elâl etildi. Allaһ istegenine uküm eter. (Ahtlarğa riayet, uquqiy devletniñ eñ muim hususiyetini teşkil eter. Zemaneviy devletlerde eki muim vasıf bar: «İçtimaiylik, uquqiylik». Bulardan birincisi devletniñ, yalıñız şahslarnıñ uquqını degil, toplumnıñ da aq ve menfaatlarını kozetüvi, kerekkende toplum menfaatını şahıs menfaatından ogge sürüvidir. Qur’an-ı Kerim ve Sunnet menbaı devletniñ içtimaiy vasfı uzerinde diqqatnen turğan, bağlayıcı priniipler qoyğan. Ekincisi ise, keyfine kore davranuv, zorbalıq, fırsatçılıq yerine, aq, uquq ve qanunlarnıñ yuqarı oluvı demektir. Qur’an-ı Kerim 14 asırdan berli bu eki vasıfnı insanlıq dünyasına tebliğ etmekte; em de ahtlarğa riayetni imannıñ keregi sayaraq!)"
        cid: 0
  - verse: 2
    segments:
      - text: "Ey, iman etkenler! Allaһnıñ (qoyğan diniy) işaretlerine, aram ayğa, (Allaһqa ediye etilgen) qurbanğa, (ondaki) gerdanlıqlarğa, Rabbleriniñ lütf ve rizasını arayaraq, Beyt-i Haramğa yonelgen kimselerge (tecavuz ve) sayğısızlıq etmeñ. İhramdan çıqqannen, avlana bilirsiñiz. Mescit-i Haramğa kirivüñizniñ ogüni alğanlar içün bir toplumğa nisbeten beslegen kiniñiz sizni tecavuzğa ruhlandırmasın! Eyilik ve (Allaһnıñ yasaqlarından) saqınuv uzerinde yardımlaşıñ, gunah ve duşmanlıq uzerine yardımlaşmañ. Allaһtan qorquñ; çünki, Allaһnıñ cezası çetindir."
        cid: 0
  - verse: 3
    segments:
      - text: "Leş, qan, domuz eti, Allaһtan başqasınıñ adına boğazlanğan, boğulğan (taş, ağaç ve başqalarnen) urulıp oldürilgen, yuqarıdan yuvarlanıp olgen, boynuzlaşıp (ayvanlarnen türtüşip) olgen canavarlarnıñ aşağan ayvanları olmeden yetişip soyğanlarıñız istisna- tik taşlar (putlar) uzerine boğazlanğan ayvanlar ve oqlarnen qısmet qıdıruvıñız sizge aram etildi. Bular yoldan çıquvdır. Bugun kâfirler, siziñ diniñizden (onı yoq etüvden) umüt keskendirler. Artıq olardan qorqmañ, menden qorqıñ. Bugun sizge diniñizni tamamladım, uzeriñizge nimetimni tamaladım ve siz içün din olaraq İslâmnı begendim. Kim goñyulden gunahqa yonelmemek uzre, aç alında tarlıqqa tüşse (aram etlerden aşay bilir). Çünki, Allaһ çoq bağışlayıcı ve merhametlidir. (Er dinde ve sistemada aramlar, yasaqlar bar. Muimi, şahıs ve toplumnıñ menfaatına, ebediy bahtlılığına, yonelgen oluvı, bir ikmet ve mana taşuvıdır. İslâmda yasaqlanğan aşalacaq ve içilicekler esas olaraq, sağlıqqa zararl olğanı, bazı şekillerde ayvanlarğa eziyet olğanı, İslâm ketirgenniñ imanğa ve ahlâq nizamına ters olğanı içün yasaqlanğan. Bulardan bir qısmınını zararl olğanı evelden berli bellidir. Digerleriniñ zararı ise, insanlıqnıñ ilmiy seviyesi yukselgen sayın añlaşılmaqta ve añlaşılacaq)."
        cid: 0
  - verse: 4
    segments:
      - text: "Ozleri içün nelerniñ elâl qılınğanını senden soramaqtalar; de ki: Butün eyi ve temiz şeyler sizge elâl qılınğan. Allaһnıñ sizge ogretkeninden ogretip, avcı alına ketirgen ayvanlarıñız siz içün yaqalağanlarından da aşañ ve uzerine Allaһnıñ adını añıñ (Bismillâ çekiñ). Allaһtan qorquñ. Allaһnıñ esabı pek çabiktir."
        cid: 0
  - verse: 5
    segments:
      - text: "Bugun sizge temiz ve eyi şeyler elâl qılınğandır. Ozlerine kitap berilgenlerniñ (eudiy, hristian ve başqalarnıñ) aşaycağı sizge elâldır, siziñ aşaycağıñız da olarğa elâldır. Mu’min qadınlardan iffetli olğanlarnen daa evel ozlerine kitap berilgenlerden iffetli qadınlar da, mehirlerini berüviñiz şartınen, namuslı olmaq, zina etmemek ve gizli dost tutmamaq uzre, sizge elâldır. Kim (İslâmiy ukümlerge) inanmaqnı qabul etmez ise, onıñ imeli boşuna ketkendir. O ahirette de ziyanğa oğrağanlardandır. (Temiz ve eyi şeyler, ayet ve hadislerniñ yasaqlamağan, umumiyetle insanlarnıñ cirençli qabul etmegen aşaycaqları ve içecekleridir. Yañlış olsa da, asl semaviy bir dinleri olğanı içün, ehl-i kitapnıñ oz diniy inanuvlarına kore, aşaluvı elâl olacaq şekilde oldürgen ayvanlarından ve diger aşaycaqlarından -domuz kibi İslâmnıñ yasaqlağanlarından başqa olmaq uzre- musulmanlarnıñ da aşamaları caizdir. Bunıñ kibi, dinini deñiştirmegen olsa da, ehl-i kitap qadınlarnen musulman erkeklerniñ evlenüvleri caizdir)."
        cid: 0
  - verse: 6
    segments:
      - text: "Ey, iman etkenler! Namaz qılmağa qalqqan vaqtıñızda yuzleriñizni, tirsekleriñizge qadar elleriñizni, başlarıñıznı mesh etip, tobuqlarğa qadar ayaqlarıñıznı yiqañız. Eger cünüp olğan iseñiz, boy abdesti alıñ. Hasta yahut yolculıq alında olsañız, yahut biriñiz ayaq yoldan kelse, yahut da qadınlarğa toqunğan olsañız (cinsiy birleşüv yapqan olsañız) ve bu allarda suv tapalmağan olsañız, temiz topraqnen teyemmum etiñ de, yuzüñizni ve (tirseklerge qadar) elleriñizni onıñnen mesh etiñ. Allaһ sizge er angi bir kuçlük çıqarmaq istemez; faqat sizni ter-temiz qılmaq ve sizge (ihsan etken) nimetini tamamlamaq ister; umüt etilir ki, şukür etersiñiz. (Namaz - ibadet duyğusınen Allaһ uzuruna çıqmaq, belli şekillernen Oña tabınmaq ve Onıñnen qonuşmaqtır. Namaz Allaһnıñ qulunı uzuruna qabul etüvidir. İşte, bu qabul ve bu qullıq bir azırlıqnı talap etmektedir. Huzur-i ilâhiyde turğan qulnıñ uyanıq, şuurl, içi ve tışı ter-temiz olması kerek; abdest ve ğusul bularnı teminlemek içün eñ guzel vastadır. Suv olmağanı ya da olğanı alda, qullanmağa bir mani yahut uzür bulunğanı alda teyemmum etilir. Teyemmum er ne qadar maddiy temizlikni teminlemese de, temizlik şuurı bermekte ve ibadetke azırlamaqtadır)."
        cid: 0
  - verse: 7
    segments:
      - text: "Allaһnıñ sizge olğan nimetini «Eşittik ve qabul ettik», degen vaqtıñızda, sizni bunıñnen bağlağan (Oña bergen) sözni hatırlañ ve Allaһtan qorquñ. Şubesiz, Allaһ qalplerniñ içindekini bilmektedir. (Bu yerdeki söz - insanlarnıñ yaratıluvından evel «elest meclisi» denilgen muqaddes mecliste butün ruhlarnıñ Allaһqa bergen sözleri ola bilecegi kibi, Aqabe ve Hudaybiyede mu’minlerniñ Allaһ ve Resulına bergen sözleri de ola bilir. Bunıñ içün ayrıca baq. A’raaf, 7/172)."
        cid: 0
  - verse: 8
    segments:
      - text: "Ey, iman etkenler! Allaһ içün haqnı muafaza etici, adaletnen şaatlıq etici kimseler oluñ. Bir toplulıqqa beslegen kin, sizni adil davranmamağa iteklemesin. Adaletli oluñ; bu Allaһ qorqusına daa çoq yaqışqan (bir davranış)tır. Allaһqa isyan etüvden saqınıñ. Allaһ yapqanlarıñıznı haqqı ile bilmektedir. (Abdest ve namaz dinniñ diregi, şahısnıñ diniy ayatınıñ temelidir. Adalet ise, içtimaiy ayatnıñ eñ muim musaviylik unsurı ve teminatıdır. Qur’an nizamı insannı daima bir butün olaraq elge alğan, doğrulıq ışığını şahsiy taraf qadar içtimaiy tarafqa da tutqan)."
        cid: 0
  - verse: 9
    segments:
      - text: "Allaһ iman etken ve eyi şeyler yapqanlarğa söz bergendir. Olarğa bağışlav ve buyuk mukâfat bardır."
        cid: 0
  - verse: 10
    segments:
      - text: "İnkâr etken ve ayetlerimizni yalanğa çıqarğanlarğa kelgende, olar ceennemlidirler."
        cid: 0
  - verse: 11
    segments:
      - text: "Ey, itman etkenler! Allaһnıñ sizge olğan nimetini unutmañ; hatırıñızdamı, bir toplulıq sizge el uzatmağa ıntılğan edi de, Allaһ olarnıñ ellerini sizden çekken edi. Allaһtan qorquñ ve mu’minler yalıñız Allaһqa işansınlar. (Bu ayetniñ nazil oluv sebebi muşriklerniñ ve munafıqlarnıñ teşviqatınen Peyğamberimizni oldürmege teşebbüs etken bir silâlı adamnıñ Allaһnıñ inayeti ve qorçalavı ile bu emeline nail olamağanı zikr etilgen. Suiqast teşebbüsi Resulullahqa yonelgeni alda, «sizge el uzatmağa ıntılğan edi», denilüvi, Allaһ Resulınıñ canı ve ayatı mu’minlerniñki kibi oluvındandır)."
        cid: 0
  - verse: 12
    segments:
      - text: "Ant olsun ki, Allaһ İsrail oğullarından söz alğan edi. (Kefil olaraq) aralarından 12 de reber yollağan edik. Allaһ olarğa boyle degen edi: Men siznen beraberim. Eger namaznı dos-doğru qılar, zekâtnı berir, peyğamberlerime inanır, olarnı destekler iseñiz ve Allaһqa guzel borc berir iseñiz (itiyacı olğanlarğa Allaһ rizası içün fayızsız borc berir iseñiz) ant olsun ki, siziñ gunahlarıñıznı orterim ve sizni zemininden irmaqlar aqqan cennetlerge qoyarım. Bundan soñ sizden kim inkâr yolunı tutsa, doğru yoldan sapqan olur. (Allaһ Taalâ İsrail oğullarını Fıravundan qurtarğanınen, Az. Musa vastası ile olarnı Qudusqa yoneltken, o yerni ozlerine vatan qılğanını bildirgen, o yerde uküm sürgen Kenaniylerge qarşı kureşüvlerini emir etken, ozlerinden söz alğan ve er qabileden bir adam olmaq uzre, 12 adamnı da bu söyleşmege kefil qılğan edi. Toplulıq Qudusqa yaqınlaşqanınen, Az. Musa bu 12 kişini araştırmaq içün yollağan, korgenlerini halqqa añlatmamalırını da tenbiyelegen edi. Araştırıcılar qaytqan vaqıtlarında, ekisi istisna, digerleri Qudustakilerniñ kuçlü ve azırlıqlı olğanlarından baas etti, halqnı qorquzdı ve bergen sözlerini bozdılar)."
        cid: 0
  - verse: 13
    segments:
      - text: "Sözlerini bozuvları sebebinen, olarnı lânetledik ve yureklerini qattılaştırdıq. Olar kelimelerniñ yerlerini deñiştirirler (kitaplarını bozarlar). Ozlerine ogretilgen ahqyamnıñ (Tevratnıñ) muim bir bolümini de unuttılar. Aralarından pek azından ğayrı, olardan daima bir hainlik korersiñ. Kene de sen olarnı afu et ve qulaq asma. Şubesiz, Allaһ eyilik etkenlerni sever. (Tevrat yalıñız bir nusha edi. Kimse de onı tamamınen ezberden bilmey edi. İsrail oğulları Babillilerge esir tüşkenlerinen, Tevrat nushası ğayıp oldı. Yıllardan soñ, İsrail oğulları esaretten qurtulğanınen, hatırda qalğan bazı bolümler yañıdan yazıldı. Bugun elde olğan Tevratta da bu eksik bolümlernen, qıssmen Az. Musannı ayatı yazılıdır). 14. «Biz hristianlarmız», degenlerden de kesen-kes sözlerini alğan edik, amma olar da ozlerine zikr etilgen (berilgen ogütlerniñ ya da Kitapnıñ) muim bir bolümini unuttılar. Bu sebeple qıyametke qadar aralarına duşmanlıq ve kin qoydıq. Yaqında Allaһ olarğa yapqanlarını haber berecek. (İlki hristianlar da yeudiylerniñ amansız taqipleri ve eskenceleri qarşısında darma-dağın yaşağanlar, Allaһ tarafından Az. İsağa vahiy etilgen İncilni muafaza etalmayıp, ğayıp etken ediler. Milâdiy uçünci asırnıñ başlarında Rim imperatorı Konstantinniñ hristianlıqqa meyl etüvinden soñ, tınçlanğan hristianlar muqaddes kitaplarını yazmağa teşebbüs etkenler, bunıñ neticesinde, ortağa bir-birini tutmağan yuzlernen İncil çıqqan edi. Az. İsanıñ yolundan çıqqan, Allaһqa bergen sözlerinde turmağan hristianlar, boylece ihtilâfqa tüşken, ayrı dinler eken kibi mesheplerge bolüngen, asırlarnen bir-birlerinen çekkeleşeler)."
        cid: 0
  - verse: 15
    segments:
      - text: "Ey, ehl-i kitap! Resulımız sizge Kitaptan gizlegen bir çoq şeyiñizni añlatmaq içün keldi. Bir çoq (qusuruñıznı) da afu etmekte. Aqiqaten sizge Allaһtan bir nur, açıqtan-açıq bir kitap keldi."
        cid: 0
  - verse: 16
    segments:
      - text: "Razılığını arağannı Allaһ onıñnen qurtulış yollarına alıp barır ve olarnı iradesi ile qaranlıqlardan aydınlıqqa çıqarır, dos-doğru bir yolğa qavuştırır. 17. «Şubesiz, Allaһ - Meryem oğlu Mesihtir», degenler, ant olsun ki, kâfir olğandırlar. De ki: Oyle ise, Allaһ, Meryem oğlu Mesihni, anasını ve yer yuzündekilerniñ episini yoq etmek istese, Allaһqa kim bir şey yapa bilecek (Oña kim bir şeynen mani ola bilecek)! Koklerde, yerde ve ekisiniñ arasında ne bar ise, episiniñ mulkiyeti Allaһqa aittir. O tilegenini yaratır ve Allaһ er şeyge, tam manasınen, qadirdir."
        cid: 0
  - verse: 18
    segments:
      - text: "Yeudiyler ve hristianlar: «Biz Allaһnıñ oğulları ve sevgililerimiz», dediler. De ki: Oyle ise, gunahlarıñızdan tolayı, sizge niçün azap ete? Doğrusı, siz de O yaratqan insanlardansıñız. O tilegenini bağışlar ve tilegenine azap berir. Koklerde, yerde ve ekisiniñ arasında ne bar ise, mulkiyeti Allaһqa aittir. Soñunda dönüş de ancaq Oñadır."
        cid: 0
