      - text: "Ey, iman ektkenler! Siz ozüñizge baqıñ. Siz doğru yolda olğanda sapqan kimse sizge zarar beralmaz. Epiñiz Allaһqa döneceksiñiz. Artıq O sizge yapqanlarıñıznı bildirecek. (Bu ayette «Maña ne?»cilik yoqtır, ayetni boyle añlamaq hatalıdır. Ait ayet ve hadislerniñ butünini, bir yerde degerlendirgen vaqtımızda çıqqan mana şudır: Er kes ozüne, ailesine ve çevresine nisbeten vazifelerini yapmaqnen mukelleftir; eyilikni emir etüv ve yayuv, fenalıqnı yasaqlav ve ogüni aluv da, bu vazifege kire. İnsan butün bularnı yapqandan soñ, başkalarınıñ yoldan sapuvı, ondan soralmaz ve oña zarar da bermez. Az. Ebu Bekirniñ añlatuvları da bunı tasdiqlay: Qays Onıñ bir hutbesinde olarğa şunı söylegenini naql etken: «Siz bu ayetni oquysıñız ve yañlış yorumlaysıñız. Men Allaһ Resulınıñ boyle degenini eşittim: İnsanlar zalımnı korüp de, elinden tutaraq, mani olmaz iseler, Allaһnıñ olarğa kendi qatından umumiy bir azap yollaması yaqındır»)."
        cid: 0
