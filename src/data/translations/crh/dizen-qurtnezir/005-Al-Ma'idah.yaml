surah_id: 5
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >
          Ey, iman etkenler! Ahtlar(nıñ keregini) yerine ketiriñ. İhramlı olğanda
          avlanmaqnı elâl saymamaq üzre, (aşağıda) sizge oqulacaqlardan başqa ayvanlar siz
          içün elâl etildi. Allah istegenine üküm eter. (Ahtlarğa riayet, uquqiy devletniñ
          eñ müim hususiyetini teşkil eter. Zemaneviy devletlerde eki müim vasıf bar:
          «İçtimaiylik, uquqiylik». Bulardan birincisi devletniñ, yalıñız şahslarnıñ
          uquqını degil, toplumnıñ da aq ve menfaatlarını közetüvi, kerekkende toplum
          menfaatını şahıs menfaatından ögge sürüvidir. Qur'an-ı Kerim ve Sünnet menbaı
          devletniñ içtimaiy vasfı üzerinde diqqatnen turğan, bağlayıcı printsipler
          qoyğan. Ekincisi ise, keyfine köre davranuv, zorbalıq, fırsatçılıq yerine, aq,
          uquq ve qanunlarnıñ yuqarı oluvı demektir. Qur'an-ı Kerim 14 asırdan berli bu
          eki vasıfnı insanlıq dünyasına tebliğ etmekte; em de ahtlarğa riayetni imannıñ
          keregi sayaraq!)
        cid: 0
  - verse: 2
    segments:
      - text: >
          Ey, iman etkenler! Allahnıñ (qoyğan diniy) işaretlerine, aram ayğa, (Allahqa
          ediye etilgen) qurbanğa, (ondaki) gerdanlıqlarğa, Rabbleriniñ lütf ve rizasını
          arayaraq, Beyt-i Haramğa yönelgen kimselerge (tecavuz ve) sayğısızlıq etmeñ.
          İhramdan çıqqannen, avlana bilirsiñiz. Mescit-i Haramğa kirivüñizniñ ögüni
          alğanlar içün bir toplumğa nisbeten beslegen kiniñiz sizni tecavuzğa
          ruhlandırmasın! Eyilik ve (Allahnıñ yasaqlarından) saqınuv üzerinde yardımlaşıñ,
          günah ve duşmanlıq üzerine yardımlaşmañ. Allahtan qorquñ; çünki, Allahnıñ cezası
          çetindir.
        cid: 0
  - verse: 3
    segments:
      - text: >
          Leş, qan, domuz eti, Allahtan başqasınıñ adına boğazlanğan, boğulğan (taş, ağaç
          ve başqalarnen) urulıp öldürilgen, yuqarıdan yuvarlanıp ölgen, boynuzlaşıp
          (ayvanlarnen türtüşip) ölgen canavarlarnıñ aşağan ayvanları - ölmeden yetişip
          soyğanlarıñız istisna- tik taşlar (putlar) üzerine boğazlanğan ayvanlar ve
          oqlarnen qısmet qıdıruvıñız sizge aram etildi. Bular yoldan çıquvdır. Bugün
          kâfirler, siziñ diniñizden (onı yoq etüvden) ümüt keskendirler. Artıq olardan
          qorqmañ, menden qorqıñ. Bugün sizge diniñizni tamamladım, üzeriñizge nimetimni
          tamaladım ve siz içün din olaraq İslâmnı begendim. Kim goñülden günahqa
          yönelmemek üzre, aç alında tarlıqqa tüşse (aram etlerden aşay bilir). Çünki,
          Allah çoq bağışlayıcı ve merhametlidir. (Er dinde ve sistemada aramlar, yasaqlar
          bar. Müimi, şahıs ve toplumnıñ menfaatına, ebediy bahtlılığına, yönelgen oluvı,
          bir ikmet ve mana taşuvıdır. İslâmda yasaqlanğan aşalacaq ve içilicekler esas
          olaraq, sağlıqqa zararlı olğanı, bazı şekillerde ayvanlarğa eziyet olğanı, İslâm
          ketirgenniñ imanğa ve ahlâq nizamına ters olğanı içün yasaqlanğan. Bulardan bir
          qısmınıñ zararlı olğanı evelden berli bellidir. Digerleriniñ zararı ise,
          insanlıqnıñ ilmiy seviyesi yükselgen sayın añlaşılmaqta ve añlaşılacaq).
        cid: 0
  - verse: 4
    segments:
      - text: >
          Özleri içün nelerniñ elâl qılınğanını senden soramaqtalar; de ki: Bütün eyi ve
          temiz şeyler sizge elâl qılınğan. Allahnıñ sizge ögretkeninden ögretip, avcı
          alına ketirgen ayvanlarıñız siz içün yaqalağanlarından da aşañ ve üzerine
          Allahnıñ adını añıñ (Bismillâ çekiñ). Allahtan qorquñ. Allahnıñ esabı pek
          çabiktir.
        cid: 0
  - verse: 5
    segments:
      - text: >
          Bugün sizge temiz ve eyi şeyler elâl qılınğandır. Özlerine kitap berilgenlerniñ
          (yeudiy, hristian ve başqalarnıñ) aşaycağı sizge elâldır, siziñ aşaycağıñız da
          olarğa elâldır. Mü'min qadınlardan iffetli olğanlarnen daa evel özlerine kitap
          berilgenlerden iffetli qadınlar da, mehirlerini berüviñiz şartınen, namuslı
          olmaq, zina etmemek ve gizli dost tutmamaq üzre, sizge elâldır. Kim (İslâmiy
          ükümlerge) inanmaqnı qabul etmez ise, onıñ ameli boşuna ketkendir. O ahirette de
          ziyanğa oğrağanlardandır. (Temiz ve eyi şeyler, ayet ve hadislerniñ
          yasaqlamağan, umumiyetle insanlarnıñ cirençli qabul etmegen aşaycaqları ve
          içecekleridir. Yañlış olsa da, aslı semaviy bir dinleri olğanı içün, ehl-i
          kitapnıñ öz diniy inanuvlarına köre, aşaluvı elâl olacaq şekilde öldürgen
          ayvanlarından ve diger aşaycaqlarından -domuz kibi İslâmnıñ yasaqlağanlarından
          başqa olmaq üzre- musulmanlarnıñ da aşamaları caizdir. Bunıñ kibi, dinini
          deñiştirmegen olsa da, ehl-i kitap qadınlarnen musulman erkeklerniñ evlenüvleri
          caizdir).
        cid: 0
  - verse: 6
    segments:
      - text: >
          Ey, iman etkenler! Namaz qılmağa qalqqan vaqtıñızda yüzleriñizni,
          tirsekleriñizge qadar elleriñizni, başlarıñıznı mesh etip, tobuqlarğa qadar
          ayaqlarıñıznı yiqañız. Eger cünüp olğan iseñiz, boy abdesti alıñ. Hasta yahut
          yolculıq alında olsañız, yahut biriñiz ayaq yoldan kelse, yahut da qadınlarğa
          toqunğan olsañız (cinsiy birleşüv yapqan olsañız) ve bu allarda suv tapalmağan
          olsañız, temiz topraqnen teyemmum etiñ de, yüzüñizni ve (tirseklerge qadar)
          elleriñizni onıñnen mesh etiñ. Allah sizge er angi bir küçlük çıqarmaq istemez;
          faqat sizni ter-temiz qılmaq ve sizge (ihsan etken) nimetini tamamlamaq ister;
          ümüt etilir ki, şükür etersiñiz. (Namaz - ibadet duyğusınen Allah uzuruna
          çıqmaq, belli şekillernen Oña tabınmaq ve Onıñnen qonuşmaqtır. Namaz Allahnıñ
          qulunı uzuruna qabul etüvidir. İşte, bu qabul ve bu qullıq bir azırlıqnı talap
          etmektedir. Huzur-i ilâhiyde turğan qulnıñ uyanıq, şuurlı, içi ve tışı ter-temiz
          olması kerek; abdest ve ğusul bularnı teminlemek içün eñ güzel vastadır. Suv
          olmağanı ya da olğanı alda, qullanmağa bir mani yahut üzür bulunğanı alda
          teyemmum etilir. Teyemmum er ne qadar maddiy temizlikni teminlemese de, temizlik
          şuurı bermekte ve ibadetke azırlamaqtadır).
        cid: 0
  - verse: 7
    segments:
      - text: >
          Allahnıñ sizge olğan nimetini «Eşittik ve qabul ettik», degen vaqtıñızda, sizni
          bunıñnen bağlağan (Oña bergen) sözni hatırlañ ve Allahtan qorquñ. Şübesiz, Allah
          qalplerniñ içindekini bilmektedir. (Bu yerdeki söz - insanlarnıñ yaratıluvından
          evel «elest meclisi» denilgen muqaddes mecliste bütün ruhlarnıñ Allahqa bergen
          sözleri ola bilecegi kibi, Aqabe ve Hudaybiyede mü'minlerniñ Allah ve Resulına
          bergen sözleri de ola bilir. Bunıñ içün ayrıca baq. A'raaf, 7/172).
        cid: 0
  - verse: 8
    segments:
      - text: >
          Ey, iman etkenler! Allah içün haqnı muafaza etici, adaletnen şaatlıq etici
          kimseler oluñ. Bir toplulıqqa beslegen kin, sizni adil davranmamağa iteklemesin.
          Adaletli oluñ; bu Allah qorqusına daa çoq yaqışqan (bir davranış)tır. Allahqa
          isyan etüvden saqınıñ. Allah yapqanlarıñıznı haqqı ile bilmektedir. (Abdest ve
          namaz dinniñ diregi, şahısnıñ diniy ayatınıñ temelidir. Adalet ise, içtimaiy
          ayatnıñ eñ müim musaviylik unsurı ve teminatıdır. Qur'an nizamı insannı daima
          bir bütün olaraq elge alğan, doğrulıq ışığını şahsiy taraf qadar içtimaiy
          tarafqa da tutqan).
        cid: 0
  - verse: 9
    segments:
      - text: >
          Allah iman etken ve eyi şeyler yapqanlarğa söz bergendir. Olarğa bağışlav ve
          büyük mükâfat bardır.
        cid: 0
  - verse: 10
    segments:
      - text: >
          İnkâr etken ve ayetlerimizni yalanğa çıqarğanlarğa kelgende, olar
          ceennemlidirler.
        cid: 0
  - verse: 11
    segments:
      - text: >
          Ey, itman etkenler! Allahnıñ sizge olğan nimetini unutmañ; hatırıñızdamı, bir
          toplulıq sizge el uzatmağa ıntılğan edi de, Allah olarnıñ ellerini sizden çekken
          edi. Allahtan qorquñ ve mü'minler yalıñız Allahqa işansınlar. (Bu ayetniñ nazil
          oluv sebebi müşriklerniñ ve munafıqlarnıñ teşviqatınen Peyğamberimizni öldürmege
          teşebbüs etken bir silâlı adamnıñ Allahnıñ inayeti ve qorçalavı ile bu emeline
          nail olamağanı zikr etilgen. Suiqast teşebbüsi Resulullahqa yönelgeni alda,
          «sizge el uzatmağa ıntılğan edi», denilüvi, Allah Resulınıñ canı ve ayatı
          mü'minlerniñki kibi oluvındandır).
        cid: 0
  - verse: 12
    segments:
      - text: >
          Ant olsun ki, Allah İsrail oğullarından söz alğan edi. (Kefil olaraq)
          aralarından 12 de reber yollağan edik. Allah olarğa böyle degen edi: Men siznen
          beraberim. Eger namaznı dos-doğru qılar, zekâtnı berir, peyğamberlerime inanır,
          olarnı destekler iseñiz ve Allahqa güzel borc berir iseñiz (itiyacı olğanlarğa
          Allah rizası içün fayızsız borc berir iseñiz) ant olsun ki, siziñ günahlarıñıznı
          örterim ve sizni zemininden irmaqlar aqqan cennetlerge qoyarım. Bundan soñ
          sizden kim inkâr yolunı tutsa, doğru yoldan sapqan olur. (Allah Taalâ İsrail
          oğullarını Fıravundan qurtarğanınen, Az. Musa vastası ile olarnı Qudusqa
          yöneltken, o yerni özlerine vatan qılğanını bildirgen, o yerde üküm sürgen
          Kenaniylerge qarşı küreşüvlerini emir etken, özlerinden söz alğan ve er
          qabileden bir adam olmaq üzre, 12 adamnı da bu söyleşmege kefil qılğan edi.
          Toplulıq Qudusqa yaqınlaşqanınen, Az. Musa bu 12 kişini araştırmaq içün
          yollağan, körgenlerini halqqa añlatmamalırını da tenbiyelegen edi. Araştırıcılar
          qaytqan vaqıtlarında, ekisi istisna, digerleri Qudustakilerniñ küçlü ve
          azırlıqlı olğanlarından baas etti, halqnı qorquzdı ve bergen sözlerini
          bozdılar).
        cid: 0
  - verse: 13
    segments:
      - text: >
          Sözlerini bozuvları sebebinen, olarnı lânetledik ve yüreklerini qattılaştırdıq.
          Olar kelimelerniñ yerlerini deñiştirirler (kitaplarını bozarlar). Özlerine
          ögretilgen ahkâmnıñ (Tevratnıñ) müim bir bölümini de unuttılar. Aralarından pek
          azından ğayrı, olardan daima bir hainlik körersiñ. Kene de sen olarnı afu et ve
          qulaq asma. Şübesiz, Allah eyilik etkenlerni sever. (Tevrat yalıñız bir nusha
          edi. Kimse de onı tamamınen ezberden bilmey edi. İsrail oğulları Babillilerge
          esir tüşkenlerinen, Tevrat nushası ğayıp oldı. Yıllardan soñ, İsrail oğulları
          esaretten qurtulğanınen, hatırda qalğan bazı bölümler yañıdan yazıldı. Bugün
          elde olğan Tevratta da bu eksik bölümlernen, qısmen Az. Musanıñ ayatı
          yazılıdır).
        cid: 0
  - verse: 14
    segments:
      - text: >
          «Biz hristianlarmız», degenlerden de kesen-kes sözlerini alğan edik, amma olar
          da özlerine zikr etilgen (berilgen ögütlerniñ ya da Kitapnıñ) müim bir bölümini
          unuttılar. Bu sebeple qıyametke qadar aralarına duşmanlıq ve kin qoydıq. Yaqında
          Allah olarğa yapqanlarını haber berecek. (İlki hristianlar da yeudiylerniñ
          amansız taqipleri ve eskenceleri qarşısında darma-dağın yaşağanlar, Allah
          tarafından Az. İsağa vahiy etilgen İncilni muafaza etalmayıp, ğayıp etken
          ediler. Milâdiy üçünci asırnıñ başlarında Rim imperatorı Konstantinniñ
          hristianlıqqa meyl etüvinden soñ, tınçlanğan hristianlar muqaddes kitaplarını
          yazmağa teşebbüs etkenler, bunıñ neticesinde, ortağa bir-birini tutmağan
          yüzlernen İncil çıqqan edi. Az. İsanıñ yolundan çıqqan, Allahqa bergen
          sözlerinde turmağan hristianlar, böylece ihtilâfqa tüşken, ayrı dinler eken kibi
          mesheplerge bölüngen, asırlarnen bir-birlerinen çekkeleşeler).
        cid: 0
  - verse: 15
    segments:
      - text: >
          Ey, ehl-i kitap! Resulımız sizge Kitaptan gizlegen bir çoq şeyiñizni añlatmaq
          içün keldi. Bir çoq (qusuruñıznı) da afu etmekte. Aqiqaten sizge Allahtan bir
          nur, açıqtan-açıq bir kitap keldi.
        cid: 0
  - verse: 16
    segments:
      - text: >
