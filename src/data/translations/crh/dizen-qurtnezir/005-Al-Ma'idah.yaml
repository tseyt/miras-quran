      - text: >-
          (Er dinde ve sistemada aramlar, yasaqlar bar. Müimi, şahıs ve toplumnıñ menfaatına,
          ebediy bahtlılığına, yönelgen oluvı, bir ikmet ve mana taşuvıdır. İslâmda
          yasaqlanğan aşalacaq ve içilicekler esas olaraq, sağlıqqa zararlı olğanı, bazı
          şekillerde ayvanlarğa eziyet olğanı, İslâm ketirgenniñ imanğa ve ahlâq nizamına ters
          olğanı içün yasaqlanğan. Bulardan bir qısmınıñ zararlı olğanı evelden berli
          bellidir. Digerleriniñ zararı ise, insanlıqnıñ ilmiy seviyesi yükselgen sayın
          añlaşılmaqta ve añlaşılacaq).
        cid: 0
