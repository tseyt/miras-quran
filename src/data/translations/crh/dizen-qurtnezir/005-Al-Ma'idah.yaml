          faydasından çoq olğanını bildirgen, soñra içken alda namaz qılmaqnı yasaqlağan ve eñ
          soñunda bu ayetnen kesen-kes sarğoşlıq bergen içkilerni içmekni aram etken. Kene
          cahiliye devrinde araplar on dane oq sapınen bir çeşit qumar ve şans oyunı oynar
          ediler. Bularnıñ yedisinde bazı paylar yazılı edi. Üçü de boş edi. İşançlı bir kimse
          bir torbanıñ içinden bularnı qatılğanlarnıñ adına birer-birer çeker edi. Tolu
          çıqqanlar maldan isselerini alır, faqırlarğa berir ediler. Boş çıqqanlar ise, bu
          malnıñ parasını öder ediler. Qumarlarnıñ, belki de eñ temizi olğanına baqmadan,
          İslâm bunı da yasaqlağan, ortağa mal ve para qoyaraq oynalacaq iç bir şans oyunına
          izin bermegen, fuqarege yardım etilecek olsa, bunı er kesniñ elâl qazançından
          ayıraraq yapuvını istegen. Ayet içki ve qumar yasağınıñ eñ müim içtimaiy, ahlâqiy ve
          diniy ikmetlerini añlata. Ait hadisler ile ilim bularğa iqtisadiy ve tibbiy
          sebeplerni de qatqan).
