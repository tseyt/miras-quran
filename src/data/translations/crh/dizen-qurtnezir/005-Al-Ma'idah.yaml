          yüzündekilerniñ episini yoq etmek istese, Allahqa kim bir şey yapa bilecek (Oña
          kim bir şeynen mani ola bilecek)! Köklerde, yerde ve ekisiniñ arasında ne bar
          ise, episiniñ mülkiyeti Allahqa aittir. O tilegenini yaratır ve Allah er şeyge,
          tam manasınen, qadirdir.
        cid: 0
  - verse: 18
    segments:
      - text: >
