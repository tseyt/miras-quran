        cid: 0
  - verse: 23
    segments:
      - text: "Qorqqanlarnıñ arasından Allaһ olarğa lütfte bulunğan eki adam boyle dedi: Olarnıñ uzerine qapudan kiriñ; o yerge bir kirdiñizmi, artıq siz zaferni qazanğandırsıñ. Eger mu’minler iseñiz, ancaq Allaһqa işanıñ. (Bu ayetler Az. Musa zamanındaki İsrail oğullarınen bağlı olğanına kore, ister olarnıñ «alemlerde iç bir kimsege berilmegen nimetlerge nail oluvları»» ve ister «arz-ı muqaddesniñ olarğa vatan olaraq yazılğan oluvı» da o zamanğa aittir. Yuzlerce ayet ve hadis Hatemu’l enbiya (s.a.) Efendimiznin kelgen-keçken ve kelecek butün insanlıq içün Allaһnıñ aqransız bir nimeti ve lütfi olğanına delâlet etmekte. Arznıñ belli bir topraq parçasınıñ bir toplumğa vatan olaraq yazıluvı da şartlıdır; o toplumnıñ salâhına, Allaһ yolunda doğru yurüvlerine bağlıdır. Yuqarıdaki 13-nci ayet ve oña beñzegen ayetlerniñ manaları işaretinden añlaşıla ki, İsrail oğulları bu vasıflarını ğayıp etkenler. Muqaddes topraqlarğa kimniñ varis olacağını ise, Enbiyaa suresiniñ 105nci ayeti tayin etmekte: Ant olsun ki, Tevrattan soñ Zeburda da: «Arzğa eyi, salih, (lâyıq) qullarım elbette varis olacaqtır», diye yazdıq)."
