      - text: "Der eken, Allaһ, qardaşınıñ cesedini nasıl komecegini oña kostermek içün yerni qazğalağan bir qarğa yolladı. (Qatil qardaş:) «Yazıqlar olsun maña! Şu qarğa qadar da olamadımmı ki, qardaşımnıñ cesedini komeyim», dedi ve yapqanına yanğanlardan oldı. (İnsan nefsaniy duyğularına ve, bu cumleden olaraq, kuncülik duyğusına boyun egse, qardaşını bile oldüre bilir; ancaq bunıñ soñu dünyada insannı iç-içten yaqqan vicdan azabı ve peşmanlıq, ahirette ise, ruh ve vucdını yaqqan ateştir. Kuncülerniñ ozlerini korgen kozleri kordir, nail olğan nimetlerni ve guzelliklerni kormez; ep başqasındakini korer ve kinlenirler. Bu hastalıqnını çaresi İslâmnı butüni ile yaşayaraq, nefisni terbiye etmek, er yamanlıqnı emir etken nefisni (nefs-i emmareni), sukün ve uzurğa qavuştırmaq (mutmainne qılmaq) ve Allaһnıñ bergenine razı (raziye) alğa ketirmektir)."
