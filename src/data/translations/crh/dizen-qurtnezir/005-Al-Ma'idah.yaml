          qısırlaştırmağa azm etken ediler. Resul-ı Ekrem vaziyetni bilgeninen, aman yanlarına
          keldi ve böyle buyurdı: «Men böyle bir qullıq şeklinen emir olunmadım. Vucut ve
          nefisleriñizniñ sizde aqqı bar; oraza tutıp, namaz qılıñ, faqat aynı vaqıtta,
          orazañıznı açıp, aşañız ve yuqlañız. Men namaz qılarım ve yuqlarım, oraza tutar ve
          iftar eterim, et aşarım ve qadınlarıma yaqlaşırım; menim yolumdan çıqqan - menden
          degil». İşte, bu adise üzerine yuqarıda manaları oqulğan ayetler kelgen).
