          Köklerde, yerde ve ekisiniñ arasında ne bar ise, mülkiyeti Allahqa aittir.
          Soñunda dönüş de ancaq Oñadır.
        cid: 0
  - verse: 19
    segments:
      - text: >
          Ey, ehl-i kitap! Peyğamberlerniñ kelüvi toqtağan bir arada sizge elçimiz keldi.
