      - text: >-
          (Ahtlarğa riayet, uquqiy devletniñ eñ müim hususiyetini teşkil eter. Zemaneviy
          devletlerde eki müim vasıf bar: «İçtimaiylik, uquqiylik». Bulardan birincisi
          devletniñ, yalıñız şahslarnıñ uquqını degil, toplumnıñ da aq ve menfaatlarını
          közetüvi, kerekkende toplum menfaatını şahıs menfaatından ögge sürüvidir. Qur'an-ı
          Kerim ve Sünnet menbaı devletniñ içtimaiy vasfı üzerinde diqqatnen turğan, bağlayıcı
          printsipler qoyğan. Ekincisi ise, keyfine köre davranuv, zorbalıq, fırsatçılıq
          yerine, aq, uquq ve qanunlarnıñ yuqarı oluvı demektir. Qur'an-ı Kerim 14 asırdan
          berli bu eki vasıfnı insanlıq dünyasına tebliğ etmekte; em de ahtlarğa riayetni
          imannıñ keregi sayaraq!)
        cid: 0
