      - text: >-
          (Temiz ve eyi şeyler, ayet ve hadislerniñ yasaqlamağan, umumiyetle insanlarnıñ
          cirençli qabul etmegen aşaycaqları ve içecekleridir. Yañlış olsa da, aslı semaviy
          bir dinleri olğanı içün, ehl-i kitapnıñ öz diniy inanuvlarına köre, aşaluvı elâl
          olacaq şekilde öldürgen ayvanlarından ve diger aşaycaqlarından -domuz kibi İslâmnıñ
          yasaqlağanlarından başqa olmaq üzre- musulmanlarnıñ da aşamaları caizdir. Bunıñ
          kibi, dinini deñiştirmegen olsa da, ehl-i kitap qadınlarnen musulman erkeklerniñ
          evlenüvleri caizdir).
