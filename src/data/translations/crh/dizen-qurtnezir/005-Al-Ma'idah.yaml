        cid: 0
  - verse: 110
    segments:
      - text: "Allaһ o zaman boyle deycek: «Ey, Meryem oğlu İsa! Saña ve anaña (bergen) nimetimni hatırla! Hatırlaysıñmı, seni muqades ruh (Cebrail) ile desteklegen edim; (bu sayede) sen beşikte olğanda da, yetişken çağıñda da, insanlarnen qonuşa ediñ. Saña kitapnı (oqup, yazmaqnı), ikmetni, Tevrat ve İncilni ogretken edim. Menim iznimnen, çamurdan quş şeklinde bir şey yapa ediñ de, oña ufley ediñ, aman menim iznimnen, o bir quş ola edi. Kene menim iznimnen anadan doğma korni ve alacalı hastanı eyileştire ediñ. Olülerni menim iznimnen (ayatqa) qaytara ediñ. Hatırañdamı, İsrail oğullarını (seni oldirüvlerinden) mani olğan edim; olarğa açıq deliller (mucizeler) ketirgen zamanıñda aralarından inkâr etkenler: «Bu -açıqtan-açıq bir sihirden başqa bir şey degil», degen ediler. (Bu ayette ve bundan soñki ayetlerde zikr etilgen fevqulade adiseler - mucizedir. Mucizeler, insanlarnıñ kuçü yetmegen, olarnıñ yapuvları -tabiat qanunlarına kore- mumkün olmağan şeylerdir. Ancaq, tabiat qanunlarınıñ da yaratıcısı ve tüzgünleyicisi olğan Allaһ qullarınıñ qolayca iman etüvlerini, hidayetke qavuşuvlarını teminlemek maqsadınen, peyğamberine mucizeler lütf eylegen; bular yalıñız Allaһnıñ izni ve qudretinen, bilgen sebeplerimiz zıncırından tışta, sadir olmaqtadır)."
        cid: 0
