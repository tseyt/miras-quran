surah_id: 59
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >
          Köklerde ve yerde olğanlarnıñ episi Allahnı tesbih etmekte. O, üstündir, ikmet
          saibidir.
        cid: 0
  - verse: 2
    segments:
      - text: >
          Ehl-i kitaptan inkâr etkenlerni ilk sürgünde yurtlarından çıqarğan Odır. Siz
          olarnı çıqacaqlar bellemegen ediñiz. Olar da, qaleleri olarnı Allahtan
          qorçalaycaq bellegen ediler. Amma, Allah (Onıñ azabı), olarğa beklemegen
          yerlerinden kele qoydı. O, yüreklerine qorqu tüşürdi; öyle ki, evlerini em öz
          ellerinen, em de mü'minlerniñ ellerinen harap etmekte ediler. Ey, aqıl saipleri!
          İbret alıñ. (Allahnıñ Resulı Medinege kelgen vaqtında yeudiylerden Nadir
          oğullarınen bitaraf qaluvları ükmini taşığan bir antlaşuv yapqan edi. Bedir
          cenkinde musulmanlar ğalip kelgeninen, yeudiyler: Bu, Tevratta özüne zafer vade
          etilgen peyğamberdir, dediler. Faqat Uhud cenkinden soñ, bütünley deñiştiler ve
          antlaşuvnı bozdılar. Bularnıñ reberi Kâ'b b.Eşref, 40 suvariynen Mekkege barıp,
          musulmanlarnıñ aleyhine Ebu Süfyannen birlik yaptı. Bunıñ üzerine, Az.Peyğamber
          Ka'bniñ süt qardaşı Muhammed b. Meslemege emir bererek, bir gece onı evinde
          öldürtti. Bundan soñ, Allahnıñ Resulı bir top askernen Nadir oğullarınıñ
          köylerini sarıp aldı. Yurtlarını bıraqıp ketmelerini emir etti. Az.Peyğambernen
          añlaşuv yapmaq istegenleri içün, sarım ortadan qaldırıldı. Çoqları Şamğa,
          Erihağa, Ezreatqa, Hirağa, bir qaç ev de Hayberge kettiler. İşte, sureniñ
          başından altıncı ayetniñ soñuna qadar olğan qısmınıñ nazil oluv sebebi budır).
        cid: 0
  - verse: 3
    segments:
      - text: >
          Eger Allah olarğa sürgünni yazmağan olsa edi, elbette olarnı dünyada (başqa
          şekilde) cezalandıracaq edi. Ahirette de olar içün ceennem azabı bar.
        cid: 0
  - verse: 4
    segments:
      - text: >
          Bu, olarnıñ Allahqa ve peyğamberine qarşı kelüvlerinden tolayıdır. Kim Allahqa
          qarşı kelse, bilsin ki, Allahnıñ cezalandıruvı çetindir.
        cid: 0
  - verse: 5
    segments:
      - text: >
          Hurma tereklerinden, er angi birini kesüviñiz ya da olğanı kibi bıraquvıñız, ep
          Allahnıñ izninendir ve onıñ yoldan çıqqanlarnı rezil etüvi içündir. (Ayet
          musulmanlar yeudiylerniñ hurma tereklerinden bir qısmını keskenleri sebebinden,
          ortağa çıqqan sıqıntılı vaziyetlerini ketkizmek içün nazil olğan. Böyle ki,
          Allah Resulı yeudiylerniñ hurmaları kesilip yaqıluvını emir etkeninen, olar: YA
          Muhammed! Sen yer yüzünde fesat çıqarmamaqnen emir olunğan ediñ! dediler. Bu
          meselede bazı mü'minler bile şübege tüştiler. Bunıñ üzerine, bu ayet-i kerime
          endi. Bu vaqiağa esaslanaraq, alimler özlerinen cenkleşken kâfirlerniñ qale ve
          binalarınıñ yıqıluvında, terekleriniñ kesilüvinde bir saqınca olmağanı qanaatine
          barğanlar).
        cid: 0
  - verse: 6
    segments:
      - text: >
          Allahnıñ, olardan (mallarından) peyğamberini bergen ğanimetleri içün, siz at ve
          deve qoşturğan degilsiñiz, faqat Allah peyğamberlerini istegen kimselerge
          nisbeten üstün yapar, Allah er şeyge qadirdir. (Medinege eki mil uzaqlıqta olğan
          Nadir oğullarına qarşı yayan olaraq seferge çıqılğan ve zorluqnen qarşılaşmadan,
          topraq elge keçirilgen, bu topraqnı Az.Peyğamberge ait diye qabul etilgen, o da
          bunıñ özü, ailesiniñ keçinüvi ve bazı askeriy arclamalar içün elde tutqan, bir
          qısmını da, ashabdan bazılarına dağıtqan).
        cid: 0
  - verse: 7
    segments:
      - text: >
          Allahnıñ, (fetih etilgen) ülkeler halqından peyğamberine bergen ğanimetleri,
          Allah, Peyğamber, yaqınları, yetimler, yoqsullar ve yolda qlğanlar içündir.
          Böylece, o mallar arañızdan yalıñız zenginler ortasında dolaşqan bir devlet
          olmaz. Peyğamber sizge ne berdi ise, onı alıñ, sizge ne yasaqladı ise, ondan da
          saqınıñ. Allahqtan qorquñ. Çünki, Allahnıñ azabı çetindir. (Yuqardaki ayetler
          İslâm devletiniñ kelir menbalarından feyni ükümge bağlamaqta. Fey - duşmandan
          silâ qullamandan elde etilgen kelirlerdir. Bu kelirler kütleniñ faydası. Nazarda
          tutulmaq şartınen ve er angi bir sıñırlavğa tabiy olmadan, asker, memur
          maaşları, qorçalanuv masrafları ve saireler kibi, devletniñ yapması kerek olğan
          bütün hızmetlerge sarf etilir).
        cid: 0
  - verse: 8
    segments:
      - text: >
          (Allah bergen bu ğanimet mallarnı) yurtlarından ve mallarından uzaqlaştırılğan,
          Allahtan bir lütf ve rizalıq tilegen, Allahnıñ dinine ve Peyğamberine yardım
          etken faqır muhacirlerniñdir. İşte, doğru olğanları bulardır.
        cid: 0
  - verse: 9
    segments:
      - text: >
          Daa evelden Medineni yurt etken ve goñülerine imannı yerleştirgen kimseler,
          özlerine köçüp kelgenlerni severler ve olarğa berilgenlerden tolayı, aralarında
          bir raatsızlıq is etmezler. Özleri zaruret içinde olsalar bile, olarnı
          özlerinden üstün tutarlar. Kim nefsiniñ saranlığından qorçalanır ise, işte, olar
          qurtulışqa irişkenlerdir. (Ensarnıñ muhacirlerge nisbeten areket ve davranuvı,
          ayette beyan etilgen çerçive içinde ceryan etken, özleri muhtac olaraq,
          başqalarınıñ itiyacını qandırmaq hisleti olğan «isaar» ensarda eñ yüksek
          noqtasına yetken).
        cid: 0
  - verse: 10
    segments:
      - text: >
          Bulardan soñ kelgenler böyle derler: Rabbimiz! Bizni ve bizden evel kelip-keçken
          imanlı qardaşlarımıznı bağışla; kalplerimizde iman etkenlerge nisbeten iç bir
          kin bıraqma! Rabbimiz! Şübesiz ki, sen çoq şefqatlı, çoq merhametlisiñ! (Muhacir
          ve ensardan soñ kelgenler - qıyamıtke qadar kelgen ve kelecek mü'minlerdir.
          Ashab-ı Kiramnı añmaq, olarğa til uzatmamaq ve kin beslememek kerekligi ayet
          işaret etken hususlardır).
        cid: 0
  - verse: 11
    segments:
      - text: >
          Munafıqlarnıñ, kitap ehlinden inkâr etken dostlarına: Eger siz yurtuñızdan
          çıqarılsañız, mıtlaqa biz de siznen beraber çıqarmız; siziñ aleyhiñizde kimsege
          asla uymamız. Eger cenkke tutuşsañız, mıtlaqa yardım etermiz, degenlerini
          körmediñmi? Allah olarnıñ yalancı olğanlarına şaatlıq eter. (Bu ayet,
          munafıqlarnıñ reberi Abdulah b. Ubeyniñ, Nadir oğullarınen mektüpleşüvini ve
          olarğa yardım hususında bergen işançnı haber bergen, bu tarafınen de, Qur'annıñ
          mucize olğanına delâlet etken parlaq bir delildir).
        cid: 0
  - verse: 12
    segments:
      - text: >
          Ant olsun, eger olar çıqarılsalar, olarnen beraber çıqmazlar; cenkke tutuşqan
          olsalar, olarğa yardım etmezler; yardım etseler bile, artlarına çevirlip
          qaçarlar, soñra özlerine de yardım etilmez.
        cid: 0
  - verse: 13
    segments:
      - text: >
          Olarnıñ aralarında sizge nisbeten duyğan qorquları, Allahqa olğan qorqularından
          daa şiddetlidir. Böyledir, çünki, olar añlamağan bir toplulıqtır. (Munafıqlarnıñ
          Allahtan ziyade mü'minlerden qorqqanları, Allahnıñ olarğa nisbeten azabını
          keçiktirüvinden ileri kelmektedir).
        cid: 0
  - verse: 14
    segments:
      - text: >
          Olar muhkem şeerlerde ya da divarlar artında bulunmadan, siznen toplı alda
          cenkleşalmazlar. Öz aralarındaki cenkleri ise çetindir. Sen olarnı
          toplu-birlikli sanarsıñ, albuki qalpleri darma-dağındır. Böyledir, çünki olar
          aqlını işletmegen bir toplulıqtır. (Yeudiy ve munafıqlar, Allah ve Resulınen
          cenkke tutuşqan vaqıtlarında, qalplerine qorqu kire edi. Zaten, inançları zayıf,
          ğayeleri bir-birine ters olğanı içün, toplu alda areket etalmaz ediler).
        cid: 0
  - verse: 15
    segments:
      - text: >
          (Olarnıñ vaziyeti) özlerinden biraz evel keçken ve yapqanlarınıñ cezasını
          tatqanlarnıñ vaziyeti kibidir. Olarğa elem berici bir azap bardır. (Yani
          yeudiylerniñ vaziyeti, pek qısqa bir zaman evel, Bedirde mağlüp ve perişan olğan
          müşriklerniñ vaziyetine beñzegendir).
        cid: 0
  - verse: 16
    segments:
      - text: >
          Munafıqlarnıñ vaziyeti tıpqı şeytannıñ vaziyeti kibidir. Çünki, şeytan insanğa:
          «İnkâr et», der. İnsan inkâr etkeninen de: Men senden uzaqım, çünki men
          alemlerniñ Rabbi Allahtan qorqarım, der.
        cid: 0
  - verse: 17
    segments:
      - text: >
          Niayet, ekisiniñ de soñu, içinde ebediy qalacaqları ateş olacaq. İşte, bu
          zalımlarnıñ cezazıdır. (Bu yerde yoldan azğannen azdırğan ya da kâfirnen
          şeytannıñ aqibeti beyan etilgen).
        cid: 0
  - verse: 18
    segments:
      - text: >
          Ey, iman etkenler! Allahtan qorquñ ve er kes yarınğa ne azırlağanına baqsın.
          Allahtan qorquñ, çünki Allah, yapqanlarıñızdan haberdardır. («Yarın» - qıyamet
          künü demektir).
        cid: 0
  - verse: 19
    segments:
      - text: >
          Allahnı unutqan ve bu sebepten, Allahnıñ da olarğa özlerini unutturğan kimseleri
          kibi olmañ. Olar yoldan çıqqan kimselerdir.
        cid: 0
  - verse: 20
    segments:
      - text: >
          Ceennem ehlinen cennet ehli bir olmaz. Cennet ehli isteklerine irişkenlerdir.
        cid: 0
  - verse: 21
    segments:
      - text: >
          Eger biz bu Qur'annı bir dağğa endirse edik, muaqqaq ki, onı, Allah qorqusından
          baş egerek, parça-parça olmuş körer ediñ. Bu misallerni insanlarğa tüşünsinler,
          diye bermektemiz.
        cid: 0
  - verse: 22
    segments:
      - text: >
          O, öyle Allahtır ki, Ondan başqa tañrı yoqtır. Körülmegenni ve körülgenni
          bilicidir. O, merhametlidir, bağışlayıcıdır. (Allah dünyanı, ahiretni, barnı ve
          yoqnı bilicidir. Rahman ve Rahim isimleri rahmet kelimesinden türlengendir.
          Rahman - Cenab-ı Haqnıñ rahmetiniñ bütün yaratılğanlarnı öz içine alğanını,
          Rahim ise - qıyamet kününde yalıñız mü'minlerge yönelgenini ifade ete).
        cid: 0
  - verse: 23
    segments:
      - text: >
          O, öyle Allahtır ki, özünden başqa iç bir tañrı yoqtır. O, mülkniñ saibidir,
          eksiklikten uzaqtır, selâmetlik berici, eminlik berici, közetip qorçalayıcıdır,
          üstündir, istegenini mecburen yaptırğan, büyüklikte aqranı yoqtır. Allah,
          müşriklerniñ ortaq qoşqan şeylerinden uzaqtır.
        cid: 0
  - verse: 24
    segments:
      - text: >
          O, yaratıcı, bar etici, şekil berici Allahtır. Eñ güzel isimler onıñdır.
          Köklerde ve yerde olğanlar Onıñ şanını yüceltmektedirler. O, ğaliptir, ikmet
          saibidir. (Haşr suresiniñ bu soñki üç ayetiniñ fazileti aqqında Peyğamberimiz
          (a.s.) böyle buyurğan: Er kim sabaleyin üç kere «Euuzu
          billâahi's-semiii'l-aliimi mine'ş-şey taani'r-raciim» degenden soñ, Haşr
          suresiniñ soñundaki üç ayetni oqusa, Allah oña aqşamğa qadar bağışlanuvını
          tileycek yetmiş biñ melek vazifelendirir. O kimse o künü ölse - şeit olaraq
          ölür. Aqşamleyin oquğanğa da böyledir).
        cid: 0
