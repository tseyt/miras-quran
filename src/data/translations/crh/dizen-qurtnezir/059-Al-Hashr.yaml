      - text: >-
          (Ayet musulmanlar yeudiylerniñ hurma tereklerinden bir qısmını keskenleri
          sebebinden, ortağa çıqqan sıqıntılı vaziyetlerini ketkizmek içün nazil olğan. Böyle
          ki, Allah Resulı yeudiylerniñ hurmaları kesilip yaqıluvını emir etkeninen, olar: YA
          Muhammed! Sen yer yüzünde fesat çıqarmamaqnen emir olunğan ediñ! dediler. Bu
          meselede bazı mü'minler bile şübege tüştiler. Bunıñ üzerine, bu ayet-i kerime endi.
          Bu vaqiağa esaslanaraq, alimler özlerinen cenkleşken kâfirlerniñ qale ve binalarınıñ
          yıqıluvında, terekleriniñ kesilüvinde bir saqınca olmağanı qanaatine barğanlar).
