surah_id: 59
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "Koklerde ve yerde olğanlarnıñ episi Allaһnı tesbih etmekte. O, ustündir, ikmet saibidir."
        cid: 0
  - verse: 2
    segments:
      - text: "Ehl-i kitaptan inkâr etkenlerni ilk sürgünde yurtlarından çıqarğan Odır. Siz olarnı çıqacaqlar bellemegen ediñiz. Olar da, qaleleri olarnı Allaһtan qorçalaycaq bellegen ediler. Amma, Allaһ (Onıñ azabı), olarğa beklemegen yerlerinden kele qoydı. O, yureklerine qorqu tüşürdi; oyle ki, evlerini em oz ellerinen, em de mu’minlerniñ ellerinen harap etmekte ediler. Ey, aqıl saipleri! İbret alıñ. (Allaһnıñ Resul Medinege kelgen vaqtnnda yeudiylerden Nadir oğullarınen bitaraf qaluvları ukmini taşığan bir antlaşuv yapqan edi. Bedir cenkinde musulmanlar ğalip kelgeninen, yeudiyler: Bu, Tevratta ozüne zafer vade etilgen peyğamberdir, dediler. Faqat Uhud cenkinden soñ, butünley deñiştiler ve antlaşuvnı bozdılar. Bularnıñ reberi Kâ’b b.Eşref, 40 suvariynnen Mekkege barıp, musulmanlarnıñ aleyhine Ebu Sufyannen birlik yaptı. Bunıñ uzerine, Az.Peyğamber Ka’bniñ süt qardaşı Muhammed b. Meslemege emir bererek, bir gece onı evinde oldürtti. Bundan soñ, Allaһnıñ Resulı bir top askernen Nadir oğullarınıñ koylerini sarıp aldı. Yurtlarını bıraqıp ketmelerini emir etti. Az.Peyğambernen añlaşuv yapmaq istegenleri içün, sarım ortadan qaldırıldı. Çoqları Şamğa, Erihağa, Ezreatqa, Hirağa, bir qaç ev de Hayberge kettiler. İşte, sureniñ başından altıncı ayetniñ soñuna qadar olğan qısmınıñ nazil oluv sebebi budır)."
        cid: 0
  - verse: 3
    segments:
      - text: "Eger Allaһ olarğa sürgünni yazmağan olsa edi, elbette olarnı dünyada (başqa şekilde) cezalandıracaq edi. Ahirette de olar içün ceennem azabı bar."
        cid: 0
  - verse: 4
    segments:
      - text: "Bu, olarnıñ Allaһqa ve peyğamberine qarşı kelüvlerinden tolayıdır. Kim Allaһqa qarşı kelse, bilsin ki, Allaһnıñ cezalandıruvı çetindir."
        cid: 0
  - verse: 5
    segments:
      - text: "Hurma tereklerinden, er angi birini kesüviñiz ya da olğanı kibi bıraquvıñız, ep Allaһnıñ izninendir ve onıñ yoldan çıqqanlarnı rezil etüvi içündir. (Ayet musulmanlar yeudiylerniñ hurma tereklerinden bir qısmını keskenleri sebebinden, ortağa çıqqan sıqıntılı vaziyetlerini ketkizmek içün nazil olğan. Boyle ki, Allaһ Resulı yeudiylerniñ hurmaları kesilip yaqıluvını emir etkeninen, olar: Ya Muһammed! Sen yer yuzünde fesat çıqarmamaqnen emir olunğan ediñ! dediler. Bu meselede bazı mu’minler bile şubege tüştiler. Bunıñ uzerine, bu ayet-i kerime endi. Bu vaqiağa esaslanaraq, alimler ozlerinen cenkleşken kâfirlerniñ qale ve binalarınıñ yıqıluvında, terekleriniñ kesilüvinde bir saqınca olmağanı qanaatine barğanlar)."
        cid: 0
  - verse: 6
    segments:
      - text: "Allaһnıñ, olardan (mallarından) peyğamberini bergen ğanimetleri içün, siz at ve deve qoşturğan degilsiñiz, faqat Allaһ peyğamberlerini istegen kimselerge nisbeten ustün yapar, Allaһ er şeyge qadirdir. (Medinege eki mil uzaqlıqta olğan Nadir oğullarına qarşı yayan olaraq seferge çıqılğan ve zorluqnen qarşılaşmadan, topraq elge keçirilgen, bu topraqnı Az.Peyğamberge ait diye qabul etilgen, o da bunıñ ozü, ailesiniñ keçinüvi ve bazı askeriy arclamalar içün elde tutqan, bir qısmını da, ashabdan bazılarına dağıtqan)."
        cid: 0
  - verse: 7
    segments:
      - text: "Allaһnıñ, (fetih etilgen) ulkeler halqından peyğamberine bergen ğanimetleri, Allaһ, Peyğamber, yaqınları, yetimler, yoqsullar ve yolda qlğanlar içündir. Boylece, o mallar arañızdan yalıñız zenginler ortasında dolaşqan bir devlet olmaz. Peyğamber sizge ne berdi ise, onı alıñ, sizge ne yasaqladı ise, ondan da saqınıñ. Allaһqtan qorquñ. Çünki, Allaһnıñ azabı çetindir. (Üqardaki ayetler İslâm devletiniñ kelir menbalarından feyni uyuomge bağlamaqta. Fey - duşmandan silâ qullamandan elde etilgen kelirlerdir. Bu kelirler kutleniñ faydası. Nazarda tutulmaq şartınen ve er angi bir sıñırlavğa tabiy olmadan, asker, memur maaşları, qorçalanuv masrafları ve saireler kibi, devletniñ yapması kerek olğan butün hızmetlerge sarf etilir)."
        cid: 0
  - verse: 8
    segments:
      - text: "(Allaһ bergen bu ğanimet mallarnı) yurtlarından ve mallarından uzaqlaştırılğan, Allaһtan bir lütf ve rizalıq tilegen, Allaһnıñ dinine ve Peyğamberine yardım etken faqır muhacirlerniñdir. İşte, doğru olğanları bulardır."
        cid: 0
  - verse: 9
    segments:
      - text: "Daa evelden Medineni yurt etken ve goñyulerine imannı yerleştirgen kimseler, ozlerine koçüp kelgenlerni severler ve olarğa berilgenlerden tolayı, aralarında bir raatsızlıq is etmezler. Ozleri zaruret içinde olsalar bile, olarnı ozlerinden ustün tutarlar. Kim nefsiniñ saranlığından qorçalanır ise, işte, olar qurtulışqa irişkenlerdir. (Ensarnıñ muhacirlerge nisbeten areket ve davranuvı, ayette beyan etilgen çerçive içinde ceryan etken, ozleri muhtac olaraq, başqalarınıñ itiyacını qandırmaq hisleti olğan «isaar» ensarda eñ yuksek noqtasına yetken)."
        cid: 0
  - verse: 10
    segments:
      - text: "Bulardan soñ kelgenler boyle derler: Rabbimiz! Bizni ve bizden evel kelip-keçken imanlı qardaşlarımıznı bağışla; kalplerimizde iman etkenlerge nisbeten iç bir kin bıraqma! Rabbimiz! Şubesiz ki, sen çoq şefqatlı, çoq merhametlisiñ! (Muhacir ve ensardan soñ kelgenler - qıyamıtke qadar kelgen ve kelecek mu’minlerdir. Ashab-ı Kiramnı añmaq, olarğa til uzatmamaq ve kin beslememek kerekligi ayet işaret etken hususlardır)."
        cid: 0
  - verse: 11
    segments:
      - text: "Munafıqlarnıñ, kitap ehlinden inkâr etken dostlarına: Eger siz yurtuñızdan çıqarılsañız, mıtlaqa biz de siznen beraber çıqarmız; siziñ aleyhiñizde kimsege asla uymamız. Eger cenkke tutuşsañız, mıtlaqa yardım etermiz, degenlerini kormediñmi? Allaһ olarnıñ yalancı olğanlarına şaatlıq eter. (Bu ayet, munafıqlarnıñ reberi Abdulah b. Ubeyniñ, Nadir oğullarınen mektüpleşüvini ve olarğa yardım hususında bergen işançnı haber bergen, bu tarafınen de, Qur’annıñ mucize olğanına delâlet etken parlaq bir delildir)."
        cid: 0
  - verse: 12
    segments:
      - text: "Ant olsun, eger olar çıqarılsalar, olarnen beraber çıqmazlar; cenkke tutuşqan olsalar, olarğa yardım etmezler; yardım etseler bile, artlarına çevirlip qaçarlar, soñra ozlerine de yardım etilmez."
        cid: 0
  - verse: 13
    segments:
      - text: "Olarnıñ aralarında sizge nisbeten duyğan qorquları, Allaһqa olğan qorqularından daa şiddetlidir. Boyledir, çünki, olar añlamağan bir toplulıqtır. (Munafıqlarnıñ Allaһtan ziyade mu’minlerden qorqqanları, Allaһnıñ olarğa nisbeten azabını keçiktirüvinden ileri kelmektedir)."
        cid: 0
  - verse: 14
    segments:
      - text: "Olar muhkem şeerlerde ya da divarlar artında bulunmadan, siznen toplı alda cenkleşalmazlar. Oz aralarındaki cenkleri ise çetindir. Sen olarnı toplubirlikli sanarsıñ, albuki qalpleri darma-dağındır. Boyledir, çünki olar aqlını işletmegen bir toplulıqtır. (Eudiy ve munafıqlar, Allaһ ve Resulnen cenkke tutuşqan vaqıtlarında, qalplerine qorqu kire edi. Zaten, inançları zayıf, ğayeleri bir-birine ters olğanı içün, toplu alda areket etalmaz ediler)."
        cid: 0
  - verse: 15
    segments:
      - text: "(Olarnıñ vaziyeti) ozlerinden biraz evel keçken ve yapqanlarınıñ cezasını tatqanlarnıñ vaziyeti kibidir. Olarğa elem berici bir azap bardır. (Yani yeudiylerniñ vaziyeti, pek qısqa bir zaman evel, Bedirde mağlüp ve perişan olğan muşriklerniñ vaziyetine beñzegendir)."
        cid: 0
  - verse: 16
    segments:
      - text: "Munafıqlarnıñ vaziyeti tıpqı şeytannıñ vaziyeti kibidir. Çünki, şeytan insanğa: «İnkâr et», der. İnsan inkâr etkeninen de: Men senden uzaqım, çünki men alemlerniñ Rabbi Allaһtan qorqarım, der."
        cid: 0
  - verse: 17
    segments:
      - text: "Niayet, ekisiniñ de soñu, içinde ebediy qalacaqları ateş olacaq. İşte, bu zalımlarnıñ cezazıdır. (Bu yerde yoldan azğannen azdırğan ya da kâfirnen şeytannıñ aqibeti beyan etilgen)."
        cid: 0
  - verse: 18
    segments:
      - text: "Ey, iman etkenler! Allaһtan qorquñ ve er kes yarınğa ne azırlağanına baqsın. Allaһtan qorquñ, çünki Allaһ, yapqanlarıñızdan haberdardır. («Yarın» - qıyayamet kunü demektir)."
        cid: 0
  - verse: 19
    segments:
      - text: "Allaһnı unutqan ve bu sebepten, Allaһnıñ da olarğa ozlerini unutturğan kimseleri kibi olmañ. Olar yoldan çıqqan kimselerdir."
        cid: 0
  - verse: 20
    segments:
      - text: "Ceennem ehlinen cennet ehli bir olmaz. Cennet ehli isteklerine irişkenlerdir."
        cid: 0
  - verse: 21
    segments:
      - text: "Eger biz bu Qur’annı bir dağğa endirse edik, muaqqaq ki, onı, Allaһ qorqusından baş egerek, parça-parça olmuş korer ediñ. Bu misallerni insanlarğa tüşünsinler, diye bermektemiz."
        cid: 0
  - verse: 22
    segments:
      - text: "O, oyle Allaһtır ki, Ondan başqa tañrı yoqtır. Korülmegenni ve korülgenni bilicidir. O, merhametlidir, bağışlayıcıdır. (Allaһ dünyanı, ahiretni, barnı ve yoqnı bilicidir. Rahman ve Rahim isimleri rahmet kelimesinden türlengendir. Rahman - Cenab-ı Haqnıñ rahmetiniñ butün yaratılğanlarnı oz içine alğanını, Rahim ise - qıyamet kunünde yalıñız mu’minlerge yonelgenini ifade ete)."
        cid: 0
  - verse: 23
    segments:
      - text: "O, oyle Allaһtır ki, ozünden başqa iç bir tañrı yoqtır. O, mulkniñ saibidir, eksiklikten uzaqtır, selâmetlik berici, eminlik berici, kozetip qorçalayıcıdır, ustündir, istegenini mecburen yaptırğan, buyuklikte aqranı yoqtır. Allaһ, muşriklerniñ ortaq qoşqan şeylerinden uzaqtır."
        cid: 0
  - verse: 24
    segments:
      - text: "O, yaratıcı, bar etici, şekil berici Allaһtır. Eñ guzel isimler onıñdır. Koklerde ve yerde olğanlar Onıñ şanını yuceltmektedirler. O, ğaliptir, ikmet saibidir. (Haşr suresiniñ bu soñki uç ayetiniñ fazileti aqqında Peyğamberimiz (a.s.) boyle buyurğan: Er kim sabaleyin uç kere «Euuzu billâaһi’s-semiii’l-aliimi mine’şşey taani’r-raciim» degenden soñ, Haşr suresiniñ soñundaki uç ayetni oqusa, Allaһ oña aqşamğa qadar bağışlanuvını tileycek yetmiş biñ melek vazifelendirir. O kimse o kunü olse - şeit olaraq olür. Aqşamleyin oquğanğa da boyledir)."
        cid: 0