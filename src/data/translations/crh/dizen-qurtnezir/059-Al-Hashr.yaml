      - text: >-
          (Allahnıñ Resulı Medinege kelgen vaqtında yeudiylerden Nadir oğullarınen bitaraf
          qaluvları ükmini taşığan bir antlaşuv yapqan edi. Bedir cenkinde musulmanlar ğalip
          kelgeninen, yeudiyler: Bu, Tevratta özüne zafer vade etilgen peyğamberdir, dediler.
          Faqat Uhud cenkinden soñ, bütünley deñiştiler ve antlaşuvnı bozdılar. Bularnıñ
          reberi Kâ'b b.Eşref, 40 suvariynen Mekkege barıp, musulmanlarnıñ aleyhine Ebu
          Süfyannen birlik yaptı. Bunıñ üzerine, Az.Peyğamber Ka'bniñ süt qardaşı Muhammed b.
          Meslemege emir bererek, bir gece onı evinde öldürtti. Bundan soñ, Allahnıñ Resulı
          bir top askernen Nadir oğullarınıñ köylerini sarıp aldı. Yurtlarını bıraqıp
          ketmelerini emir etti. Az.Peyğambernen añlaşuv yapmaq istegenleri içün, sarım
          ortadan qaldırıldı. Çoqları Şamğa, Erihağa, Ezreatqa, Hirağa, bir qaç ev de Hayberge
          kettiler. İşte, sureniñ başından altıncı ayetniñ soñuna qadar olğan qısmınıñ nazil
          oluv sebebi budır).
        cid: 0
