surah_id: 37
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >
          Saf-saf tizilgenlerge, toplap sürgenlerge, zikr oquğanlarğa yemin eterim ki,
          ilâhıñız birdir. (Bu yerde «saf-saf tizilgenler, toplap sürgenler ve zikr
          oquğanlar»nıñ melekler olğanı aytılğan. Ayrıca, bularnıñ kök cisimleri, ruhlar,
          muqaddes ceverler, Qur'an ayetleri, alimler ve ğaziyler olğanını seylegenler de
          bar).
        cid: 0
  - verse: 2
    segments:
      - text: >
          [1 ayetine baq.]
        cid: 0
  - verse: 3
    segments:
      - text: >
          [1 ayetine baq.]
        cid: 0
  - verse: 4
    segments:
      - text: >
          [1 ayetine baq.]
        cid: 0
  - verse: 5
    segments:
      - text: >
          O, em köklerniñ, yerniñ ve ekisi arasındakilerniñ Rabbi, em de şarqlarnıñ
          Rabbidir. (Yıl boyunca küneş farqlı yerlerden doğğanı içün «şarqlar» denilgen).
        cid: 0
  - verse: 6
    segments:
      - text: >
          Biz yaqın kökni, bir süsnen, yıldızlarnen süsledik.
        cid: 0
  - verse: 7
    segments:
      - text: >
          Ve (kök yüzüni) itaattan çıqqan er şeytandan qorçaladıq.
        cid: 0
  - verse: 8
    segments:
      - text: >
          Olar, artıq mele-i a'lâağa (yüce toplulıqqa) qulaq asalmazlar. Er taraftan taş
          boranına tutulırlar.
        cid: 0
  - verse: 9
    segments:
      - text: >
          Quvulıp atılırlar. Ve olar içün devamlı bir azap bardır.
        cid: 0
  - verse: 10
    segments:
      - text: >
          Ancaq (meleklerniñ qonuşuvlarından) bir söz alğan olsa, onı da delip keçken bir
          parlaq ışıq taqip eter.
        cid: 0
  - verse: 11
    segments:
      - text: >
          Şimdi sora olardan! Yaratuv noqtai nazarından, olar daa zormı, yoqsa bizim
          yaratqan (insanlar)ımızmı? Şübesiz, biz özlerini yapışqaq bir çamurdan yarattıq.
        cid: 0
  - verse: 12
    segments:
      - text: >
          Yoq, sen şaşmaqtasıñ. Albuki, olar alay etmekteler.
        cid: 0
  - verse: 13
    segments:
      - text: >
          Özlerine ögüt berilgen vaqıtta ögüt almazlar.
        cid: 0
  - verse: 14
    segments:
      - text: >
          Bir mucize körseler, alay eterler.
        cid: 0
  - verse: 15
    segments:
      - text: >
          Bu, ancaq açıq bir tılsımdır, derler (Bu sözni aynıñ ekige bölünüvi mucizesi
          olğan vaqıtta söylegen ediler).
        cid: 0
  - verse: 16
    segments:
      - text: >
          «Aqiqaten biz ölgen, topraq ve kemik olğan vaqtımızda tiriltilecekmizmi?».
        cid: 0
  - verse: 17
    segments:
      - text: >
          İlk atalarımız da (tiriltilecek)mi?».
        cid: 0
  - verse: 18
    segments:
      - text: >
          De ki: Ebet, em de hor ve haqir olaraq (tiriltileceksiñiz).
        cid: 0
  - verse: 19
    segments:
      - text: >
          O (tiriltüv) qorqunç bir sesten ibaret olacaq, o anda olarnıñ közleri açılıp,
          etrafqa baqacaqlar. (Bu yerdeki qorqunç ses Suurğa ekinci kere üfüriliştir).
        cid: 0
  - verse: 20
    segments:
      - text: >
          (Vaziyetni körgen kâfirler:) Ey-vah bizge! Bu ceza künüdir, derler.
        cid: 0
  - verse: 21
    segments:
      - text: >
          İşte, bu, yalanlalamış oldığıñız üküm künüdir.
        cid: 0
  - verse: 22
    segments:
      - text: >
          (Allah meleklerine emir eter:) zalımlarnı, olarnıñ aynı yoldaki arqadaşlarını ve
          Allahtan başqa tabınğan putlarını toplañ. Olarğa ceennemniñ yolunı kösteriñ.
          Olarnı tutuqlañ, çünki olar sorğuğa çekilecekler.
        cid: 0
  - verse: 23
    segments:
      - text: >
          [22 ayetine baq.]
        cid: 0
  - verse: 24
    segments:
      - text: >
          [22 ayetine baq.]
        cid: 0
  - verse: 25
    segments:
      - text: >
          Sizge ne oldı ki, bir-biriñizge yardım etmeysiñiz?
        cid: 0
  - verse: 26
    segments:
      - text: >
          Ebet, olar o künü zilletnen boyun egecekler.
        cid: 0
  - verse: 27
    segments:
      - text: >
          (İşte, bu vaziyetke tüşken vaqıtlarında) olardan bir qısmı digerlerine yönelir,
          bir birilerini mesuliyetli tutmağa areket eterler.
        cid: 0
  - verse: 28
    segments:
      - text: >
          (Uyğanlar, uyğan adamlarına:) Siz bizge sağdan kelir ediñiz (doğrulardan körüne
          ediñiz) derler.
        cid: 0
  - verse: 29
    segments:
      - text: >
          (O birleri de:) «Aksine, derler, siz inanğan kimseler degil ediñiz. Bizim sizge
          zorlaycaq bir küçümiz yoq. Faqat siz özüñiz yoldan azğan bir toplum ediñiz».
        cid: 0
  - verse: 30
    segments:
      - text: >
          [29 ayetine baq.]
        cid: 0
  - verse: 31
    segments:
      - text: >
          «Şunıñ içün Rabbimizniñ ükmi bizge haq oldı. Biz (haq etken cezamıznı) mıtlaqa
          tatacaqmız».
        cid: 0
  - verse: 32
    segments:
      - text: >
          «Biz sizni yoldan azdırdıq. Çünki, özümiz de yoldan azğan edik».
        cid: 0
  - verse: 33
    segments:
      - text: >
          Şübesiz, o künü olar azapta beraberdirler.
        cid: 0
  - verse: 34
    segments:
      - text: >
          İşte, biz suçlularğa böyle yaparmız.
        cid: 0
  - verse: 35
    segments:
      - text: >
          Çünki olarğa: Allahtan başqa tañrı yoqtır, denilgen vaqıtta, kibrnen tirele
          ediler.
        cid: 0
  - verse: 36
    segments:
      - text: >
          «Mecnun bir şair içün biz tañrılarımıznı bıraqacaqmızmı?», der ediler.
          (Kâfirlerniñ «mecnun, şair» degen zatları Az.Muhammed edi. Oña uyıp, putlarnı
          bıraqmaq özlerine ağır kelgeni içün, böyle dey ediler).
        cid: 0
  - verse: 37
    segments:
      - text: >
          Yoq! O, aqiqatnı ketirdi ve peyğamberlerni de doğruladı.
        cid: 0
  - verse: 38
    segments:
      - text: >
          Şübesiz, siz accı azapnı tatacaqsıñız.
        cid: 0
  - verse: 39
    segments:
      - text: >
          Çekecek cezañız yapayatqanıñızdan başqa bir şeyniñ cezası degil.
        cid: 0
  - verse: 40
    segments:
      - text: >
          (Bu azaptan) ancaq Allahnıñ halis qulları istisna etilecek.
        cid: 0
  - verse: 41
    segments:
      - text: >
          Bular içün bilingen bir rızıq, çeşit meyvalar bar. Naim cennetlerinde qarşılıqlı
          kürsiler üzerine qurulğan alda olarğa ikram etilir.
        cid: 0
  - verse: 42
    segments:
      - text: >
          [41 ayetine baq.]
        cid: 0
  - verse: 43
    segments:
      - text: >
          [41 ayetine baq.]
        cid: 0
  - verse: 44
    segments:
      - text: >
          [41 ayetine baq.]
        cid: 0
  - verse: 45
    segments:
      - text: >
          Olarğa çoqraqtan (toldurılğan) qadeler dolaştırılır.
        cid: 0
  - verse: 46
    segments:
      - text: >
          Şeffaftır, içkenlerge lezet berir.
        cid: 0
  - verse: 47
    segments:
      - text: >
          O içkide ne sersemletüv bardır, ne de onıñnen sarğoş olurlar.
        cid: 0
  - verse: 48
    segments:
      - text: >
          Yanlarında, güzel baqışlarını yalıñız olarğa bağışlağan, iri közlü zevceler
          bardır.
        cid: 0
  - verse: 49
    segments:
      - text: >
          Olar, kün yüzü körmegen yımırta kibi bem-beyazdır.
        cid: 0
  - verse: 50
    segments:
      - text: >
          İşte, o vaqıtta bir-birilerine dönerek, (dünyadaki allarını) soraycaqlar.
        cid: 0
  - verse: 51
    segments:
      - text: >
          Aralarından biri: «Menim bir arqadaşım bar edi», der. (Rivayetke köre, bu zatnıñ
          arqadaşı, ölgenden soñ tirilmekni inkâr etken birisi edi. Bazı tefsircilerge
          köre, bu arqadaş şeytandır. Bazılarına köre de, Kehf suresiniñ 32-nci ayetinde
          keçken eki adamdır.)
        cid: 0
  - verse: 52
    segments:
      - text: >
          Der edi ki: Sen de (tirilmege) inanğandansıñmı? Biz ölüp, kemik, soñra da,
          topraq alına kelgen vaqtımızda (tiriltilip) cezalanacaqmızmi?
        cid: 0
  - verse: 53
    segments:
      - text: >
          [52 ayetine baq.]
        cid: 0
  - verse: 54
    segments:
      - text: >
          (O zat, dünyada keçken adiseni bu şekilde añlatqandan soñ, Allah Taalâ o yerde
          olğanlarğa): «Siz işniñ aqiqatına vaqıfsıñızmı?» dedi. İşte, o vaqıtta söylegen
          baqtı, arqadaşını ceennemniñ ortasında kördi.
        cid: 0
  - verse: 55
    segments:
      - text: >
          [54 ayetine baq.]
        cid: 0
  - verse: 56
    segments:
      - text: >
          «Yemin eterim ki, sen az daa meni de elâk etecek ediñ. Rabbimniñ nimeti olmasa
          edi, şimdi men de (ceennemge) ketirilgenlerden olur edim», dedi.
        cid: 0
  - verse: 57
    segments:
      - text: >
          [56 ayetine baq.]
        cid: 0
  - verse: 58
    segments:
      - text: >
          Birinci ölümimiz istisna, bir daa biz ölmeycek ve bir daa azap körmeycek
          degilmizmi? Şübesiz bu, büyük qurtulıştır. Çalışqanlar, böyle bir qurtulış içün
          çalışsın.
        cid: 0
  - verse: 59
    segments:
      - text: >
          [58 ayetine baq.]
        cid: 0
  - verse: 60
    segments:
      - text: >
          [58 ayetine baq.]
        cid: 0
  - verse: 61
    segments:
      - text: >
          [58 ayetine baq.]
        cid: 0
  - verse: 62
    segments:
      - text: >
          Şimdi, ziyafet olaraq, cennet ehli içün añılğan bu nimetler daa hayırlımı,
          yoqsa, zaqqum teregimi! Biz onı (zaqqumnı) zalımlar içün bir fitne (imtian)
          yapıq. (Dünyada kâfirler bunı inkâr ettiler. Ateşniñ içinde terek olurmı ,
          dediler. Ceennemde ösken terek sözü keçkeninen: Ateş, terekni yaqar eken,
          ceennemde nasıl terek olur? diye alay etken ediler. Bu noqtai nazardan, bu söz
          olar içün bir imtian oldı. Bu sözden közde tutulğan mananı añlamağanlarından,
          yahşıca küfürge tüştiler. Allah istese, ceennem yaqalmaycaq bir ağaçnı yarata
          bilecegini tüşünalmadılar).
        cid: 0
  - verse: 63
    segments:
      - text: >
          [62 ayetine baq.]
        cid: 0
  - verse: 64
    segments:
      - text: >
          Zira, o, ceennemniñ tübinde ösüp yetişken bir terektir.
        cid: 0
  - verse: 65
    segments:
      - text: >
          Ğonceleri sanki şeytanlarnıñ başları kibidir.
        cid: 0
  - verse: 66
    segments:
      - text: >
          (Ceennemdekiler) Ondan aşarlar ve qarınlarını ondan toldurırlar.
        cid: 0
  - verse: 67
    segments:
      - text: >
          Soñra zaqqum yemeginiñ üzerine olar içün, qaynağan suv qarıştırılğan bir içki
          bardır.
        cid: 0
  - verse: 68
    segments:
      - text: >
          Soñ kesen-kes olarnıñ dönüşi çılğın ateşke olacaq.
        cid: 0
  - verse: 69
    segments:
      - text: >
          Şübesiz, olar atalarını dalâlette buldılar da, peşlerinden çapışıp kettiler.
        cid: 0
  - verse: 70
    segments:
      - text: >
          [69 ayetine baq.]
        cid: 0
  - verse: 71
    segments:
      - text: >
          Ant olsun ki, olardan evel eski milletlerniñ çoqu dalâletke tüşti.
        cid: 0
  - verse: 72
    segments:
      - text: >
          Şübesiz, biz olarğa tenbiyeciler yollağan edik.
        cid: 0
  - verse: 73
    segments:
      - text: >
          Tenbiyelengenlerniñ aqibeti ne olğanına bir baq!
        cid: 0
  - verse: 74
    segments:
      - text: >
          Allahnıñ ihlâslı qulları istisna. (Bundan soñki ayetlerde Az.Nuhnen qavmınıñ
          qıssası añlatıla).
        cid: 0
  - verse: 75
    segments:
      - text: >
          Ant olsun, Nuh bizge yalvarıp-yaqardı. Biz de duanı ne güzel qabul etermiz!
          (Az.Nuh: Rabbim! Men mağlüp vaziyettem, maña yardım et! diye dua etken, Allah da
          duasını qabul buyuraraq, qavmını suvda boğmaq suretinen elâk etken edi).
        cid: 0
  - verse: 76
    segments:
      - text: >
          Özüni ve ailesini büyük felâketten qurtardıq.
        cid: 0
  - verse: 77
    segments:
      - text: >
          Biz yalıñız Nuhnıñ soyunı baqiy qalğanlardan ettik. (Az.Nuhnıñ soyundan
          başqalarınıñ episi elâk etilgen ve Nuh tufanından soñ, yer yüzündeki insanlarnıñ
          nesli Azreti Nuhtan kelgendir).
        cid: 0
  - verse: 78
    segments:
      - text: >
          Soñundan kelgenler arasında oña eyi bir nam bıraqtıq.
        cid: 0
  - verse: 79
    segments:
      - text: >
          Bütün alemlerden Nuhqa selâm olsun!
        cid: 0
  - verse: 80
    segments:
      - text: >
          İşte, biz eyilerni böyle mükâfatlandırırmiz.
        cid: 0
  - verse: 81
    segments:
      - text: >
          Zira, o bizim inanğan qullarımızdan edi.
        cid: 0
  - verse: 82
    segments:
      - text: >
          Niayet, o birlerini (inanmağanlarnı) suvda boğdıq. (Bundan soñ, Az.İbrahimniñ
          qıssasından bir qısım añlatılğan, semaviy dinlernen yollanılğan peyğamberlerniñ
          episiniñ bir-birini uyğun körgeni ve tasdiq etkeni beyan etilgen).
        cid: 0
  - verse: 83
    segments:
      - text: >
          Şübesiz, İbrahim de onıñ (Nuhnıñ) milletinden edi. (Aralarında uzun asırlar
          keçkenine rağmen, dinniñ esaslarında Azreti İbrahim Nuhqa bağlı edi).
        cid: 0
  - verse: 84
    segments:
      - text: >
          Çünki, Rabbine halis bir qalpnen keldi.
        cid: 0
  - verse: 85
    segments:
      - text: >
          Hatırdamı, o, babasına ve qavmına: Siz kimge qullıq etmektesiñiz? degen edi.
        cid: 0
  - verse: 86
    segments:
      - text: >
          «Allahtan başqa bir taqım uydırma ilâhlar istemektesiñizmi?».
        cid: 0
  - verse: 87
    segments:
      - text: >
          «O alda, alemlerniñ Rabbi aqqında fikriñiz nedir?». (Az.İbrahimniñ qavmı
          yıldızlarğa baqar, olarnen kâhinlik yapar ediler. Bir bayram künü İbrahimge
          olarnen beraber bayram yerine kelmesini ayttılar).
        cid: 0
  - verse: 88
    segments:
      - text: >
          Bunıñ üzerine, İbrahim yıldızlarğa böyle bir baqtı.
        cid: 0
  - verse: 89
    segments:
      - text: >
          Men hastayım, dedi.
        cid: 0
  - verse: 90
    segments:
      - text: >
          Oña artlarını çevirip kettiler.
        cid: 0
  - verse: 91
    segments:
      - text: >
          Yavaştan putlarınıñ yanına bardı. (O yerge qoyulğan yemeklerni körgeninen:)
          Aşamaysıñızmı? Niçün qonuşmaysıñız? dedi.
        cid: 0
  - verse: 92
    segments:
      - text: >
          [91 ayetine baq.]
        cid: 0
  - verse: 93
    segments:
      - text: >
          Bunıñ üzerine, yanlarına barıp, sağ elinen urdı (qırıp çıqtı).
        cid: 0
  - verse: 94
    segments:
      - text: >
          (Putperestler) çapışaraq, İbrahimge keldiler. (Niçün putlarnı qırğanını
          soradılar).
        cid: 0
  - verse: 95
    segments:
      - text: >
          İbrahim: Yonğan şeyleriñizge ibadet etersiñizmi! Albuki, sizni ve
          yapayatqanlarıñıznı Allah yarattı, dedi.
        cid: 0
  - verse: 96
    segments:
      - text: >
          [95 ayetine baq.]
        cid: 0
  - verse: 97
    segments:
      - text: >
          Onıñ içün bir bina yapıñ ve der'al onı ateşke atıñ! dediler.
        cid: 0
  - verse: 98
    segments:
      - text: >
          Böylece, oña bir tuzaq qurmaq istediler. Faqat biz olarnı alçaqlardan ettik.
        cid: 0
  - verse: 99
    segments:
      - text: >
          (O yerden qurtılğan İbrahim:) Men Rabbime ketem. O maña doğru yolnı kösterecek.
          Rabbim! Maña salihlerden olacaq bir evlât ber, dedi. (Böylece Az.İbrahim küfür
          diyarından icret eterek, Şamğa ketti).
        cid: 0
  - verse: 100
    segments:
      - text: >
          [99 ayetine baq.]
        cid: 0
  - verse: 101
    segments:
      - text: >
          İşte, o vaqıtta biz onı aqıllı (terbiyeli) bir oğulnen müjdeledik.
        cid: 0
  - verse: 102
    segments:
      - text: >
          Babasınen beraber yürüp kezecek çağına irişkeninen: Yavrucığım! Ruyada seni
          boğazlağanımnı körem; Bir tüşün, ne dersiñ? dedi. O da cevaben: Babacığım! Emir
          olunğan şeyiñni yap. İnşaallaah, meni sabır etkenlerden bulursıñ, dedi. (Bu
          ayetlerde Az. İsmailniñ qurban etilüvi añlatıla. Bu qıssa bir imtiandır. Bu
          imtian peyğamber olğan babanen oğlu arasında olıp keçken. Az. İbrahimniñ eki
          oğlu bar edi: İsmail ve İshaq. Qur'an-ı Kerimde qurban etilecek balanıñ isminden
          söz etilmey. Amma, tefsircilerniñ qanaatine köre, bu - İsmaildir. Zira, vaqia
          köçüvden soñ, aman olğan ki, o zaman İsmail bar edi. Ayrıca, vaqia Mekkede sadir
          olğan. Mekkege kelgen de İsmaildir. İbrahim (a.s.) gece tüşünde birisiniñ oña:
          «Allah saña oğluñnı boğazlamañnı emir etmekte», degenini eşitken, saba
          olğanınen, bunıñ şeytandanmı, Rahmandanmı ekeni hususında şeklengen, üç gece
          ruyanı tekrar-tekrar körgeninen, bunıñ Allahtan ekenini añlağan).
        cid: 0
  - verse: 103
    segments:
      - text: >
          Er ekisi de teslim olup, onı yanı üzerine yatqızğanınen: Ey, İbrahim! Ruyañnı
          kerçekleştirdiñ. Biz yahşılarnı böyle mükâfatlandırırmız. Bu, aqiqaten, çoq açıq
          bir imtian, diye seslendik.
        cid: 0
  - verse: 104
    segments:
      - text: >
          [103 ayetine baq.]
        cid: 0
  - verse: 105
    segments:
      - text: >
          [103 ayetine baq.]
        cid: 0
  - verse: 106
    segments:
      - text: >
          [103 ayetine baq.]
        cid: 0
  - verse: 107
    segments:
      - text: >
          Biz, oğluna bedel olaraq, oña büyük bir qurban berdik. Arttan kelecekler
          arasında oña (yahşı bir nam) qaldırdıq: İbrahimge selâm! dedik. Biz yahşılarnı
          böyle mükâfatlandırırmız. Çünki, o, bizim mü'min qullarımızdandır. (Soñki
