  - verse: 102
    segments:
      - text: "Babasınen beraber yurüp kezecek çağına irişkeninen: Yavrucığım! Ruyada seni boğazlağanımnı korem; Bir tüşün, ne dersiñ? dedi. O da cevaben: Babacığım! Emir olunğan şeyiñni yap. İnşaallaaһ, meni sabır etkenlerden bulursıñ, dedi. (Bu ayetlerde Az. İsmailniñ qurban etilüvi añlatıla. Bu qıssa bir imtiandır. Bu imtian peyğamber olğan babanen oğlu arasında olıp keçken. Az. İbrahimniñ eki oğlu bar edi: İsmail ve İshaq. Kur’an-ı Kerimde qurban etilecek balanıñ isminden söz etilmey. Amma, tefsircilerniñ qanaatine kore, bu - İsmaildir. Zira, vaqia koçüvden soñ, aman olğan ki, o zaman İsmail bar edi. Ayrıca, vaqia Mekkede sadir olğan. Mekkege kelgen de İsmaildir. İbrahim (a.s.) gece tüşünde birisiniñ oña: «Allaһ saña oğluñnı boğazlamañnı emir etmekte», degenini eşitken, saba olğanınen, bunıñ şeytandanmı, Rahmandanmı ekeni hususında şeklengen, uç gece ruyanı tekrar-tekrar korgeninen, bunıñ Allaһtan ekenini añlağan). 103-106. Er ekisi de teslim olup, onı yanı uzerine yatqızğanınen: Ey, İbrahim! Ruyañnı kerçekleştirdiñ. Biz yahşılarnı boyle mukâfatlandırırmız. Bu, aqiqaten, çoq açıq bir imtian, diye seslendik. 107-111. Biz, oğluna bedel olaraq, oña buyuk bir qurban berdik. Arttan kelecekler arasında oña (yahşı bir nam) qaldırdıq: İbrahimge selâm! dedik. Biz yahşılarnı boyle mukâfatlandırırmız. Çünki, o, bizim mu’min qullarımızdandır. (Soñki Peyğamberniñ ummeti oña salâtu selâm oqur eken, Az. İbrahimni de añar, onı hayırnen hatırlarlar). 112-113. Salihlerden bir peyğamber olaraq, oña (İbrahimge) İshaqnı mujdeledik. Ozüni ve İshaqnı mubarek (qutlı ve bereketli) eyledik. Lâkin, er ekisiniñ neslinden eyi kimseler olacağı kibi, ozüne açıqtan-açıq fenalıq etkenler de olacaq. (Bu cumleden olmaq uzre, İbrahimge çoq evlât berilgen, İshaqnıñ neslinden, Az. Yaqubdan başlap, bir çoq peyğamberler kelgen. Ekisiniñ neslinden yahşılarnen beraber, yamanlarnıñ da çıquvı, soy ve ırqnıñ hidayet ve dalâlette rolü olmağanını kosterir)."
