  - verse: 51
    segments:
      - text: "Aralarından biri: «Menim bir arqadaşım bar edi», der. (Rivayetke kore, bu zatnıñ arqadaşı, olgenden soñ tirilmekni inkâr etken birisi edi. Bazı tefsircilerge kore, bu arqadaş şeytandır. Bazılarına kore de, Keһf suresiniñ 32-nci ayetinde keçken eki adamdır.) 52-53. Der edi ki: Sen de (tirilmege) inanğandansıñmı? Biz olüp, kemik, soñra da, topraq alına kelgen vaqtımızda (tiriltilip) cezalanacaqmızmi? 54-55. (O zat, dünyada keçken adiseni bu şekilde añlatqandan soñ, Allaһ Taalâ o yerde olğanlarğa: «Siz işniñ aqiqatına vaqıfsıñızmı?» dedi. İşte, o vaqıtta söylegen baqtı, arqadaşını ceennemniñ ortasında kordi. 56-57. «Emin eterim ki, sen az daa meni de elâk etecek ediñ. Rabbimniñ nimeti olmasa edi, şimdi men de (ceennemge) ketirilgenlerden olur edim», dedi. 58-61. Birinci olümimiz istisna, bir daa biz olmeycek ve bir daa azap kormeycek degilmizmi? Şubesiz bu, buyuk qurtulıştır. Çalışqanlar, boyle bir qurtulış içün çalışsın. 62-63. Şimdi, ziyafet olaraq, cennet ehli içün añılğan bu nimetler daa hayırlımı, yoqsa, zaqqum teregimi! Biz onı (zaqqumnı) zalımlar içün bir fitne (imtian) yapıq. (Dünyada kâfirler bunı inkâr ettiler. Ateşniñ içinde terek olurmı , dediler. Ceennemde osken terek sözü keçkeninen: Ateş, terekni yaqar eken, ceennemde nasıl terek olur? diye alay etken ediler. Bu noqtai nazardan, bu söz olar içün bir imtian oldı. Bu sözden kozde tutulğan mananı añlamağanlarından, yahşıca kufürge tüştiler. Allaһ istese, ceennem yaqalmaycaq bir ağaçnı yarata bilecegini tüşünalmadılar)."
