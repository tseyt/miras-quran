    segments:
      - text: "Sen bir zamanğa qadar olardan yuz çevir."
        cid: 0
  - verse: 179
    segments:
      - text: "Olarnıñ alını kor, olar da korecekler."
        cid: 0
  - verse: 180
    segments:
      - text: "Seniñ izzet saibi Rabbiñ, olar iftira etmekte olğan vasıflarından yucedir, uzaqtır."
        cid: 0
  - verse: 181
