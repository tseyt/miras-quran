surah_id: 37
language: crh
author: dizen-qurtnezir
verses:
  - verse: 5
    segments:
      - text: "O, em koklerniñ, yerniñ ve ekisi arasındakilerniñ Rabbi, em de şarqlarnıñ Rabbidir. (Yıl boyunca kuneş farqlı yerlerden doğğanı içün «şarqlar» denilgen)."
        cid: 0
  - verse: 6
    segments:
      - text: "Biz yaqın kokni, bir süsnen, yıldızlarnen süsledik."
        cid: 0
  - verse: 7
    segments:
      - text: "Ve (kok yuzüni) itaattan çıqqan er şeytandan qorçaladıq."
        cid: 0
  - verse: 8
    segments:
      - text: "Olar, artıq mele-i a’lâağa (üce toplulıqqa) qulaq asalmazlar. Er taraftan taş boranına tutulırlar."
        cid: 0
  - verse: 9
    segments:
      - text: "Quvulıp atılırlar. Ve olar içün devamlı bir azap bardır."
        cid: 0
  - verse: 10
    segments:
      - text: "Ancaq (meleklerniñ qonuşuvlarından) bir söz alğan olsa, onı da delip keçken bir parlaq ışıq taqip eter."
        cid: 0
  - verse: 11
    segments:
      - text: "Şimdi sora olardan! Yaratuv noqtai nazarından, olar daa zormı, yoqsa bizim yaratqan (insanlar)ımızmı? Şubesiz, biz ozlerini yapışqaq bir çamurdan yarattıq."
        cid: 0
  - verse: 12
    segments:
      - text: "Yoq, sen şaşmaqtasıñ. Albuki, olar alay etmekteler."
        cid: 0
  - verse: 13
    segments:
      - text: "Ozlerine ogüt berilgen vaqıtta ogüt almazlar."
        cid: 0
  - verse: 14
    segments:
      - text: "Bir mucize korseler, alay eterler."
        cid: 0
  - verse: 15
    segments:
      - text: "Bu, ancaq açıq bir tılsımdır, derler (Bu sözni aynıñ ekige bolünüvi mucizesi olğan vaqıtta söylegen ediler)."
        cid: 0
  - verse: 16
    segments:
      - text: "«Aqiqaten biz olgen, topraq ve kemik olğan vaqtımızda tiriltilecekmizmi?»."
        cid: 0
  - verse: 17
    segments:
      - text: "İlk atalarımız da (tiriltilecek)mi?»."
        cid: 0
  - verse: 18
    segments:
      - text: "De ki: Ebet, em de hor ve haqir olaraq (tiriltileceksiñiz)."
        cid: 0
  - verse: 19
    segments:
      - text: "O (tiriltüv) qorqunç bir sesten ibaret olacaq, o anda olarnıñ kozleri açılıp, etrafqa baqacaqlar. (Bu yerdeki qorqunç ses Suurğa ekinci kere ufüriliştir)."
        cid: 0
  - verse: 20
    segments:
      - text: "(Vaziyetni korgen kâfirler:) Ey-vah bizge! Bu ceza kunüdir, derler."
        cid: 0
  - verse: 21
    segments:
      - text: "İşte, bu, yalanlalamış oldığıñız uküm kunüdir."
        cid: 0
  - verse: 25
    segments:
      - text: "Sizge ne oldı ki, bir-biriñizge yardım etmeysiñiz?"
        cid: 0
  - verse: 26
    segments:
      - text: "Ebet, olar o kunü zilletnen boyun egecekler."
        cid: 0
  - verse: 27
    segments:
      - text: "(İşte, bu vaziyetke tüşken vaqıtlarında) olardan bir qısmı digerlerine yonelir, bir birilerini mesuliyetli tutmağa areket eterler."
        cid: 0
  - verse: 28
    segments:
      - text: "(Uyğanlar, uyğan adamlarına:) Siz bizge sağdan kelir ediñiz (doğrulardan korüne ediñiz) derler."
        cid: 0
  - verse: 33
    segments:
      - text: "Şubesiz, o kunü olar azapta beraberdirler."
        cid: 0
  - verse: 34
    segments:
      - text: "İşte, biz suçlularğa boyle yaparmız."
        cid: 0
  - verse: 35
    segments:
      - text: "Çünki olarğa: Allaһtan başqa tañrı yoqtır, denilgen vaqıtta, kibrnen tirele ediler."
        cid: 0
  - verse: 36
    segments:
      - text: "«Mecnun bir şair içün biz tañrılarımıznı bıraqacaqmızmı?», der ediler. (Kâfirlerniñ «mecnun, şair» degen zatları Az. Muһammed edi. Oña uyıp, putlarnı bıraqmaq ozlerine ağır kelgeni içün, boyle dey ediler)."
        cid: 0
  - verse: 37
    segments:
      - text: "Yoq! O, aqiqatnı ketirdi ve peyğamberlerni de doğruladı."
        cid: 0
  - verse: 38
    segments:
      - text: "Şubesiz, siz accı azapnı tatacaqsıñız."
        cid: 0
  - verse: 39
    segments:
      - text: "Çekecek cezañız yapayatqanıñızdan başqa bir şeyniñ cezası degil."
        cid: 0
  - verse: 40
    segments:
      - text: "(Bu azaptan) ancaq Allaһnıñ halis qulları istisna etilecek."
        cid: 0
  - verse: 45
    segments:
      - text: "Olarğa çoqraqtan (toldurılğan) qadeler dolaştırılır."
        cid: 0
  - verse: 46
    segments:
      - text: "Şeffaftır, içkenlerge lezet berir."
        cid: 0
  - verse: 47
    segments:
      - text: "O içkide ne sersemletüv bardır, ne de onıñnen sarğoş olurlar."
        cid: 0
  - verse: 48
    segments:
      - text: "Yanlarında, guzel baqışlarını yalıñız olarğa bağışlağan, iri kozlü zevceler bardır."
        cid: 0
  - verse: 49
    segments:
      - text: "Olar, kun yuzü kormegen yımırta kibi bem-beyazdır."
        cid: 0
  - verse: 50
    segments:
      - text: "İşte, o vaqıtta bir-birilerine dönerek, (dünyadaki allarını) soraycaqlar."
        cid: 0
  - verse: 51
    segments:
      - text: "Aralarından biri: «Menim bir arqadaşım bar edi», der. (Rivayetke kore, bu zatnıñ arqadaşı, olgenden soñ tirilmekni inkâr etken birisi edi. Bazı tefsircilerge kore, bu arqadaş şeytandır. Bazılarına kore de, Keһf suresiniñ 32-nci ayetinde keçken eki adamdır.)"
        cid: 0
  - verse: 64
    segments:
      - text: "Zira, o, ceennemniñ tübinde osüp yetişken bir terektir."
        cid: 0
  - verse: 65
    segments:
      - text: "Ğonceleri sanki şeytanlarnıñ başları kibidir."
        cid: 0
  - verse: 66
    segments:
      - text: "(Ceennemdekiler) Ondan aşarlar ve qarınlarını ondan toldurırlar."
        cid: 0
  - verse: 67
    segments:
      - text: "Soñra zaqqum yemeginiñ uzerine olar içün, qaynağan suv qarıştırılğan bir içki bardır."
        cid: 0
  - verse: 68
    segments:
      - text: "Soñ kesen-kes olarnıñ dönüşi çılğın ateşke olacaq."
        cid: 0
  - verse: 71
    segments:
      - text: "Ant olsun ki, olardan evel eski milletlerniñ çoqu dalâletke tüşti."
        cid: 0
  - verse: 72
    segments:
      - text: "Şubesiz, biz olarğa tenbiyeciler yollağan edik."
        cid: 0
  - verse: 73
    segments:
      - text: "Tenbiyelengenlerniñ aqibeti ne olğanına bir baq!"
        cid: 0
  - verse: 74
    segments:
      - text: "Allaһnıñ ihlâslı qulları istisna. (Bundan soñki ayetlerde Az.Nuһnen qavmınıñ qıssası añlatıla)."
        cid: 0
  - verse: 75
    segments:
      - text: "Ant olsun, Nuһ bizge yalvarıp-yaqardı. Biz de duanı ne guzel qabul etermiz! (Az.Nuһ: Rabbim! Men mağlüp vaziyettem, maña yardım et! diye dua etken, Allaһ da duasını qabul buyuraraq, qavmını suvda boğmaq suretinen elâk etken edi)."
        cid: 0
  - verse: 76
    segments:
      - text: "Ozüni ve ailesini buyuk felâketten qurtardıq."
        cid: 0
  - verse: 77
    segments:
      - text: "Biz yalıñız Nuһnıñ soyunı baqiy qalğanlardan ettik. (Az.Nuһnıñ soyundan başqalarınıñ episi elâk etilgen ve Nuһ tufanından soñ, yer yuzündeki insanlarnıñ nesli Azreti Nuһtan kelgendir)."
        cid: 0
  - verse: 78
    segments:
      - text: "Soñundan kelgenler arasında oña eyi bir nam bıraqtıq."
        cid: 0
  - verse: 79
    segments:
      - text: "Butün alemlerden Nuһqa selâm olsun!"
        cid: 0
  - verse: 80
    segments:
      - text: "İşte, biz eyilerni boyle mukâfatlandırırmiz."
        cid: 0
  - verse: 81
    segments:
      - text: "Zira, o bizim inanğan qullarımızdan edi."
        cid: 0
  - verse: 82
    segments:
      - text: "Niayet, o birlerini (inanmağanlarnı) suvda boğdıq. (Bundan soñ, Az.İbrahimniñ qıssasından bir qısım añlatılğan, semaviy dinlernen yollanılğan peyğamberlerniñ episiniñ bir-birini uyğun korgeni ve tasdiq etkeni beyan etilgen)."
        cid: 0
  - verse: 83
    segments:
      - text: "Şubesiz, İbrahim de onıñ (Nuһnıñ) milletinden edi. (Aralarında uzun asırlar keçkenine rağmen, dinniñ esaslarında Azreti İbrahim Nuһqa bağlı edi)."
        cid: 0
  - verse: 84
    segments:
      - text: "Çünki, Rabbine halis bir qalpnen keldi."
        cid: 0
  - verse: 85
    segments:
      - text: "Hatırdamı, o, babasına ve qavmına: Siz kimge qullıq etmektesiñiz? degen edi. 86. «Allaһtan başqa bir taqım uydırma ilâhlar istemektesiñizmi?». 87. «O alda, alemlerniñ Rabbi aqqında fikriñiz nedir?». (Az.İbrahimniñ qavmı yıldızlarğa baqar, olarnen kâhinlik yapar ediler. Bir bayram kunü İbrahimge olarnen beraber bayram yerine kelmesini ayttılar)."
        cid: 0
  - verse: 88
    segments:
      - text: "Bunıñ uzerine, İbrahim yıldızlarğa boyle bir baqtı."
        cid: 0
  - verse: 89
    segments:
      - text: "Men hastayım, dedi."
        cid: 0
  - verse: 90
    segments:
      - text: "Oña artlarını çevirip kettiler."
        cid: 0
  - verse: 93
    segments:
      - text: "Bunıñ uzerine, yanlarına barıp, sağ elinen urdı (qırıp çıqtı)."
        cid: 0
  - verse: 94
    segments:
      - text: "(Putperestler) çapışaraq, İbrahimge keldiler. (Niçün putlarnı qırğanını soradılar)."
        cid: 0
  - verse: 97
    segments:
      - text: "Onıñ içün bir bina yapıñ ve der’al onı ateşke atıñ! dediler."
        cid: 0
  - verse: 98
    segments:
      - text: "Boylece, oña bir tuzaq qurmaq istediler. Faqat biz olarnı alçaqlardan ettik."
        cid: 0
  - verse: 101
    segments:
      - text: "İşte, o vaqıtta biz onı aqıllı (terbiyeli) bir oğulnen mujdeledik."
        cid: 0
  - verse: 102
    segments:
      - text: "Babasınen beraber yurüp kezecek çağına irişkeninen: Yavrucığım! Ruyada seni boğazlağanımnı korem; Bir tüşün, ne dersiñ? dedi. O da cevaben: Babacığım! Emir olunğan şeyiñni yap. İnşaallaaһ, meni sabır etkenlerden bulursıñ, dedi. (Bu ayetlerde Az. İsmailniñ qurban etilüvi añlatıla. Bu qıssa bir imtiandır. Bu imtian peyğamber olğan babanen oğlu arasında olıp keçken. Az. İbrahimniñ eki oğlu bar edi: İsmail ve İshaq. Kur’an-ı Kerimde qurban etilecek balanıñ isminden söz etilmey. Amma, tefsircilerniñ qanaatine kore, bu - İsmaildir. Zira, vaqia koçüvden soñ, aman olğan ki, o zaman İsmail bar edi. Ayrıca, vaqia Mekkede sadir olğan. Mekkege kelgen de İsmaildir. İbrahim (a.s.) gece tüşünde birisiniñ oña: «Allaһ saña oğluñnı boğazlamañnı emir etmekte», degenini eşitken, saba olğanınen, bunıñ şeytandanmı, Rahmandanmı ekeni hususında şeklengen, uç gece ruyanı tekrar-tekrar korgeninen, bunıñ Allaһtan ekenini añlağan)."
        cid: 0
  - verse: 114
    segments:
      - text: "Ant olsun, biz Musağa da, Harunğa da nimetler berdik."
        cid: 0
  - verse: 115
    segments:
      - text: "Olarnı ve qavmlarını o buyuk sıqıntıdan qurtardıq."
        cid: 0
  - verse: 116
    segments:
      - text: "Olarğa yardım ettik de, ğalip kelgen olar oldı."
        cid: 0
  - verse: 117
    segments:
      - text: "Er ekisine de ap-açıq añlaşılğan bir kitapnı (Tevratnı) berdik."
        cid: 0
  - verse: 118
    segments:
      - text: "Er ekisini de doğru yolğa qavuştırdıq."
        cid: 0
  - verse: 121
    segments:
      - text: "Doğrusı, biz yahşılarnı boyle mukâfatlandırırmız."
        cid: 0
  - verse: 122
    segments:
      - text: "Şubesiz, ekisi de mu’min qullarımızdan edi."
        cid: 0
  - verse: 123
    segments:
      - text: "İlâs da, şube yoq ki, peyğamberlerden edi."
        cid: 0
  - verse: 131
    segments:
      - text: "Şubesiz, biz yahşılarnı, işte boyle mukâfatlandırırmız."
        cid: 0
  - verse: 132
    segments:
      - text: "Çünki, o, bizim mu’min qullarımızdan edi. (Bu yerde Az. Luutnıñ qıssasından bir bolüm añlatılır:)"
        cid: 0
  - verse: 133
    segments:
      - text: "Lutt da, elbette peyğamberlerden edi."
        cid: 0
  - verse: 139
    segments:
      - text: "Doğrusı, Yunus da yollanılğan peyğamberlerden edi. (Bundan soñki ayetlerde de Az. Yunusnıñ qıssası añlatılır:)"
        cid: 0
  - verse: 140
    segments:
      - text: "Hatırıñdamı, o, tolu bir gemige minip qaçqan edi."
        cid: 0
  - verse: 141
    segments:
      - text: "Gemide olarnen qarşılıqlı qur’a çektiler de, zarar etkenlerden oldı. (Ünus qıssası içün baq. Enbiyaa, 21/87-niñ izaatı)."
        cid: 0
  - verse: 142
    segments:
      - text: "Yunus ozüni tenqit etip turar eken, onı bir balıq yuttı."
        cid: 0
  - verse: 145
    segments:
      - text: "Alsız bir vaziyette onı tışqa çıqardıq."
        cid: 0
  - verse: 146
    segments:
