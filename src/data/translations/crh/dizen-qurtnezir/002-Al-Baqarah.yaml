      - text: >-
          (Cenab-ı Allah bu sureniñ başında evelâ Yüce Kitabı Qur'andan, onıñ muttaqiyler içün
          bir yol köstereci ve hidayet çoqrağı olğanından, bunıñ kibi de, ğaybğa imandan ve
          İslâmnıñ temelini teşkil etken baş vazifelerden söz yürsete ve bu arada insanlarnı,
          inanç noqtai nazarından, üç gruppağa ayıra: Birincisi - mü'minler; olarnıñ vasıfları
          ilki beş ayette qısqadan añlatılğan. Ekincisi - kâfirler; olarnıñ vaziyeti de
          altıncı ve yedinci ayetlerde qısqadan añlatılğan. Üçüncisi - munafıqlar; bularnıñ
          vaziyetleri de keniş bir şekilde sekizinci ayetten yigirmi birinci ayetke qadar
          olğan ayetlerde añlatılğan. Qur'an insanlıqqa doğru yolnı köstermek içün yollanılğan
          bir kitaptır. Buña köre, ilk evelâ özüne muhatap olğan insanlıqnıñ doğru ve yañlış
          inanç vaziyetini, bularnıñ ketirgen mesuliyetlerini, doğruğa ve egrige inanğan
          insannıñ dünyada ve ahirette qarşılaşacaq neticeleri izaat etilgen).
