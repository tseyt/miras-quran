surah_id: 2
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >
          Elif. Lâam. Miim.
        cid: 0
  - verse: 2
    segments:
      - text: >
          O kitap (Qur'an), onda asla şübe yoqtır. O, muttaqiyler (saqınğanlar ve arınmaq
          istegenler) içün bir yol köstericidir.
        cid: 0
  - verse: 3
    segments:
      - text: >
          Olar ğaybğa inanırlar, namaz qılarlar, özlerine bergen mallarımızdan Allah
          yollarında arclarlar.
        cid: 0
  - verse: 4
    segments:
      - text: >
          Kene olar saña endirilgenge ve senden evel endirilgenlerge iman eterler; ahiret
          kününe de kesen-kes inanırlar.
        cid: 0
  - verse: 5
    segments:
      - text: >
          İşte, olar Rabblerinden kelgen bir hidayet üzerindedirler ve qurtulışqa
          irişkenler de yalıñız olardır. (Qur'an sureleriniñ bazılarınıñ başında
          "el-huruf'ul-muqattaa" denilgen bir taqım arifler bar ve olar olğan sureleriniñ
          bir ayetidir. Manası açıq olmağan böyle ayetlerge "müteşaabih" ayetler denilir.
          Müteşaabih olğan ayetniñ aqiqiy manasını tek Allah bilir. Bazı alimler ise,
          olarnı "yorumlarlar". Buña köre, Elif, Lâam, Miim ariflerine şu manalar
          berilgen: a). İşte, eliñizdeki Qur'annıñ kelimeleri bu ariflerden teşkil
          olğandır. Buyurıñ, siz de beñzegenini yapıñ! b). Diqqatlarnı celp etmek içün bir
          edebiy sanattır. Zira, sözge üstü qapalı başlamaq ve soñra onı açmaq daa ziyade
          diqqat çeker. v). Ögrenmekniñ ariflernen başlanuvına işarettir. Muttaqiy - taqva
          saibi demektir. Allahnıñ azabından aqqı ile qorqacaq, Onıñ emirlerine qarşı
          çıqmağa saqınğan, rahmetine ışanıp, keregi kibi qullıq etecek kimselerge
          Qur'anda "muttaqiyler" denile. Ğaybğa iman - İslâmnıñ "Aamentu"siniñ
          qısqartılğan ifadesidir. Manası: Allahqa, meleklerge, kitaplarğa,
          peyğamberlerge, ahiret kününe, qaza ve taqdirge, hayır ve şerrniñ Allahtan
          olğanına inanmaqtır. Qur'annıñ pek çoq yerinde "Ğaybğa iman eter" ya da
          "eterler" cumlesi kelecek. Bularnıñ episi iman esaslarınıñ qısqa şeklidir.
          Baqara suresinde sözge evelâ diqqatnı çekken ariflernen başlanıp, aman artından
          Qur'andan söz etile. Demek ki, şu eliñizdeki kitap (Qur'an) özünde şek ve şübe
          olmağan Allahnıñ kelâmı ve eyiler içün doğru yol reberidir. Qur'an - bir reber,
          yol köstericidir. Ancaq kimge yol kösterir, kimge reberlik eter? İşte, ayetlerde
          bu sualge cevap berilgen, eñ evelâ muttaqiy olıp, ğaybğa inanğanlarğa yol
          köstergeni añlatıla. Qur'an aqiqaten bütün insanlıqqa endirilgen. Ancaq, sadece
          oña yönelgen ve onıñnen doğru yolnı tapmaq istegenlerge reberdir. Bu yerde
          ğaybğa imandan soñ, "Kelime-i Şeadet, namaz, zekât, oraza ve hac"dan ibaret
          olğan İslâmnıñ beş esasından sadece "namaznen zekât" zikr etilgen. Bu eki
          esasnıñ zikri misal yolunen digerlerine de işerettir. Buña köre, Qur'anda
          "namaznen zekât" bu ayette olğanı kibi, beraber añılğan vaqıtta beş esasqa
          işaret etilmekte).
        cid: 0
  - verse: 6
    segments:
      - text: >
          Şu aqiqat ki, kâfir olğanlarnı (azap ile) qorqutsañ da, qorqutmasañ da, olar
          içün epbirdir, iman etmezler.
        cid: 0
  - verse: 7
    segments:
      - text: >
          Allah olarnıñ qalplerini ve qulaqlarını müurlegen. Olarnıñ közlerine de bir
          çeşit perde çekken ve olar içün (dünyada ve ahirette) büyük bir azap bar.
        cid: 0
  - verse: 8
    segments:
      - text: >
          İnsanlardan bazıları da bar ki, inanmağanları alda: "Allahqa ve ahiret kününe
          inandıq", derler.
        cid: 0
  - verse: 9
    segments:
      - text: >
          Olar (öz aqıllarına köre) guya Allahnı ve mü'minlerni aldatalar. Albuki, olar
          yalıñız özlerini aldatalar ve bunuñ farqına barmazlar.
        cid: 0
  - verse: 10
    segments:
      - text: >
          Olarnıñ qalplerinde bir hastalıq bar. Allah da olarnıñ hastalığını
          ziyadeleştirgendir. Söylegen yalanları sebebinden, olar içün şiddetli bir azap
          bar.
        cid: 0
  - verse: 11
    segments:
      - text: >
          Olarğa: «Yer yüzünde fesat çıqarmañ», denilgen vaqıtta: "Biz yalıñız islâh
          eticilermiz", derler.
        cid: 0
  - verse: 12
    segments:
      - text: >
          Şunı biliñ ki, olar bozğuncılarnıñ tam özleridir, lâkin añlamazlar.
        cid: 0
  - verse: 13
    segments:
      - text: >
          Olarğa: «İnsanlarnıñ iman etkenleri kibi, siz de iman etiñ», denilgende: "Biz iç
          sefihlerniñ (aqılsız ve ahmaq kişilerniñ) iman etkenleri kibi iman etermizmi!"
          derler. Biliñiz ki, sefihler ancaq özleridir, faqat bunı bilmezler (ya da
          bilmegen kibi olurlar).
        cid: 0
  - verse: 14
    segments:
      - text: >
          (Bu munafıqlar) mü'minlerge rastkelgen vaqıtta: "(Biz de) iman ettik", derler.
          (Özlerini sapıtqan) şeytanlarınen köz-közge qalğanlarında ise: «Biz siznen
          berabermiz, biz olarnen (mü'minlernen) sadece alay etemiz (üstlerinden
          külemiz)», derler.
        cid: 0
  - verse: 15
    segments:
      - text: >
          Aqiqaten, Allah olarnen alay eter de, adlerinden aşqanda, olarğa fırsat berir.
          Bu sebepten olar bir müddet öz başlarına yürerler.
        cid: 0
  - verse: 16
    segments:
      - text: >
          İşte, olar hidayetke nisbeten sapıqlıqnı satın alğanlardır. Ancaq olarnıñ bu
          ticareti qazançlı degil ve özleri de doğru yolğa kirmegenlerdir. (Cenab-ı Allah
          bu sureniñ başında evelâ Yüce Kitabı Qur'andan, onıñ muttaqiyler içün bir yol
          köstereci ve hidayet çoqrağı olğanından, bunıñ kibi de, ğaybğa imandan ve
          İslâmnıñ temelini teşkil etken baş vazifelerden söz yürsete ve bu arada
          insanlarnı, inanç noqtai nazarından, üç gruppağa ayıra: Birincisi - mü'minler;
          olarnıñ vasıfları ilki beş ayette qısqadan añlatılğan. Ekincisi - kâfirler;
          olarnıñ vaziyeti de altıncı ve yedinci ayetlerde qısqadan añlatılğan. Üçüncisi -
          munafıqlar; bularnıñ vaziyetleri de keniş bir şekilde sekizinci ayetten yigirmi
          birinci ayetke qadar olğan ayetlerde añlatılğan. Qur'an insanlıqqa doğru yolnı
          köstermek içün yollanılğan bir kitaptır. Buña köre, ilk evelâ özüne muhatap
          olğan insanlıqnıñ doğru ve yañlış inanç vaziyetini, bularnıñ ketirgen
          mesuliyetlerini, doğruğa ve egrige inanğan insannıñ dünyada ve ahirette
          qarşılaşacaq neticeleri izaat etilgen).
        cid: 0
  - verse: 17
    segments:
      - text: >
          Olarnıñ (munafıqlarnıñ) vaziyeti (qaranlıq gecede) bir ateş yaqqan kimse
          kibidir. O ateş yanıp da, etrafını aydınlaqtan anda Allah aman olarnıñ
          aydınlıqlarını ketkizir ve olarnı qaranlıqlar içinde qaldırır; (artıq iç bir
          şeyni) körmezler. (Ayet munafıqlarnıñ ilk anda İslâmnıñ nurından aydınlanıp,
          musulman oluvlarını, qaranlıq gecede yanğan meş'alege ve ondan faydalanğanlarğa;
          soñra aman küfürge dönüvlerini de, o meş'aleniñ sönmesine ve o yerdekilerniñ
          qaranlıqta qalğanlarına beñzete).
        cid: 0
  - verse: 18
    segments:
      - text: >
          Olar sağır, tilsiz ve kördirler. Bu sebepten, olar keri dönip olamazlar.
        cid: 0
  - verse: 19
    segments:
      - text: >
          Yahut (olarnıñ vaziyeti) kökten sağanaq alında yağğan, içinde zift qaranlıqlar,
          gürülti ve yıldırımlar bulunğan yağmur(ğa tutulğan kimselerniñ vaziyeti)
          kibidir. O munafıqlar yıldırımlardan kelecek ölüm qorqusınen parmaqlarını
          qulaqlarına tıqarlar. Albuki, Allah kâfirlerniñ etrafını quşatqandır.
        cid: 0
  - verse: 20
    segments:
      - text: >
          (O esnada) şemşek sanki közlerini çıqaracaq kibi çaqar, olar içün etrafnı
          aydınlatqanınen, o yerde biraz yürerler, üzerlerine qaranlıq çökkeninen de,
          olğan yerlerinde qalırlar. Allah istese edi, elbette olarnıñ qulaqlarını sağır,
          közlerini kör eter edi. Allah, şübesiz, er şeyge qadirdir. (Bu ayetlerde keçken
          misallerden kâfirlerniñ ve munafıqlarnıñ İslâm qarşısında qafalarında fırtınalar
          qopqanı, qorqu ve eyecanlarğa qapılğanları, bazan haqnı körecek kibi olğanları,
          bazan da, qaranlıqqa kömülgenleri añlaşıla).
        cid: 0
  - verse: 21
    segments:
      - text: >
          Ey, insanlar! Sizni ve sizden evelkilerni yaratqan Rabbinizge qullıq etiñiz.
          Belki, böylece qorçalanırsıñız (Allahnıñ azabından özüñizni qurtarırsıñız).
        cid: 0
  - verse: 22
    segments:
      - text: >
          O, Rabb ki, yerni siz içün bir töşek, kökni de (qubbe kibi) bir tavan yaptı.
          Kökten suv endirerek, onıñnen sizge ğıda olsun diye, (yerden) çeşit mahsullar
          çıqardı. Artıq bunı bile-bile Allahqa şirk qoşmañ.
        cid: 0
  - verse: 23
    segments:
      - text: >
          Eger qulumızğa endirgenlerimizden er angi bir şübege tüşseñiz, aydı oña beñzegen
          bir sure ketiriñ, eger iddañızda doğru olsañız, Allahtan ğayrı şaatlarıñıznı
          (yardımcılarıñıznı) da çağırıñ.
        cid: 0
  - verse: 24
    segments:
      - text: >
          Bunı yapıp olamazsıñız -ki, elbette yapalmaycaqsıñız- yaqarlığı insan ve taştan
          ibaret ceennem ateşinden saqınıñ. Çünki, o ateş kâfirler içün azırlanılğandır.
        cid: 0
  - verse: 25
    segments:
      - text: >
          İman etip, eyi arekette bulunğanlarğa içinden irmaqlar aqqan cennetler olğanını
          müjdele! O cennetlerdeki bir meyvadan özlerine rızıq olaraq aşatılğanınen: «Bu -
          bundan evel dünyada bizge berilgenlerinden», derler. Bu rızıqlar olarğa (bazı
          taraftan dünyadakine) beñzegeni berilgendir. Olar içün cennette ter-temiz
          zevceler de bar. Ve olar o yerde ebediy qalıcılardır. (Bu ayette dünyada
          musulman olup, güzel işler yapqan ve aqiqaten mü'min olaraq ahiretke köçken
          kimselerniñ alacaq mükâfatları añlatılğan, o yerde cennetlilerge berilgen
          nimetlerniñ dünyadakilerine beñzegenine işaret etilgen. Ancaq, ahiret
          nimetleriniñ dünyadakilerinen bir olğanı tüşünilmemelidir. Çünki, Buhariyniñ
          "Bedu'l-halq" baasında rivayet etken bir hadiste: "Cennet ehline közler
          körmegen, qulaqlar eşitmegen, qalplerden bile keçmegen nimetler berilir",
          denilgen).
        cid: 0
  - verse: 26
    segments:
      - text: >
          Şübesiz, Allah (aqnı añlatmaq) içün sivrisinek ve ondan da ğayrı, başqa bir
          varlıqnı misal ketirmekten çekinmez. İman etkenlerge kelgende, olar böyle
          misallerniñ Rabblerinden kelgen haq ve kerçek olğanını bilirler. Kâfirler ise:
          «Allah böyle misal bermekle ne murat eter?» derler. Allah onıñnen bir çoq
          kimseni sapıtır, bir çoqlarını da, doğru yolğa yöneltir. Bergen misallerinen
          Allah ancaq fasıqlarnı sapıtır (çünki bular birer imtiandır). (Bu ayette
          sivrisinek ve ondan daa zayıf mahlüqlarnıñ misalge ketirilüvini munasip
          körmegenlerniñ asılında özleriniñ küçük ve degersiz olğanıları, o sebepten
          Allahqa iman etmegenleri añlatıla, bularğa deger berip, iman etkenlerniñ ise,
          aqıllı ve degerli kimseler olğanları bildirile. Bular birer imtiandır.
          İnsanlardan bir qısmı iman eter, imtiannı qazanır, bir qısmı da, zarar eter).
        cid: 0
  - verse: 27
    segments:
      - text: >
          Olar öyle (fasıqlar) ki, kesen-kes söz bergenden soñ, sözlerinden qaytırlar.
          Allah, ziyaret etilip, al ve hatiri soraluvını istegen kimselerni ziyaret
          etmezler. Ve yer yüzünde fitne ve fesat çıqarırlar. İşte, olar aqiqaten zararğa
          oğrağanlardır. (Fasıq - haq yoldan sapqan kimsedir. Kesen-kes olaraq berilgen
          söz de, ehl-i kitapnıñ Tevrat ve İncilde kelecegi bildirilgen ahır zaman
          Peyğamberine iman eteceklerini söylevleridir ki, kelgeninen iman etmediler ve
          sözlerinde turmadılar. İslâmnıñ çoq deger bergen aqraba, qomşu ve yaqınlarnen
          alâqada bulunaraq, bularğa yardım etüvni terk ettiler, fitne ve fesatçı oldılar,
          böylece, em dünyada, em de ahirette zarar kördiler).
        cid: 0
  - verse: 28
    segments:
      - text: >
          Ey, kâfirler! Siz ölü ekende, sizni tiriltken (dünyağa ketirip, ayat bergen)
          Allahnı nasıl inkâr etesiñiz? Soñra sizni öldürecek, tekrar sizni tiriltecek ve
          soñunda Oña döndürileceksiñiz. (Bu ayette insannıñ ilk yaratılışından evelki
          alına "ölü" denilüvi, bazılarınıñ idda etkenleri kibi, tenaasuhnen bağlı degil.
          Ayette insan ayatınıñ üç saifesi añlatıla: yoqtan yaratıluvı, ölüm ve ahirette
          tekrar tirilüvi. Esasen tenaasuh tüşüncesi, er bir insannıñ öz amelinden
          cevapkârlığı ve tolayısınen adalet printsipine terstir).
        cid: 0
  - verse: 29
    segments:
      - text: >
          O, yerde ne bar ise, episini siziñ içün yarattı. Soñra (özüne has bir şekilde)
          semağa yöneldi, onı yedi qat olaraq yaratıp, nizamğa qoydı (tanzim etti). O, er
          şeyni haqqı ile bilicidir.
        cid: 0
  - verse: 30
    segments:
      - text: >
          Hatırla ki, Rabbiñ meleklerge: «Men yer yüzinde bir halife yaratacağım», dedi.
          Olar: «Bizler hamdiñ ile seni tesbih ve seni taqdis etip turğanda, yer yüzinde
          fesat çıqaracaq, o yerde qan tökecek insannı halife yapasıñmı?» dediler. Allah
          da olarğa: «Siziñ bilip olamaycağıñıznı, er alda, men bilem», dedi. (Halife -
          vekil ve temsilci demektir. Allah yer yüzinde iradesini temsil etmek içün
          insannı yarattı. O yerde ilâhiy ükümranlıqnı ömürge keçirmek vazifesini de oña
          berdi).
        cid: 0
  - verse: 31
    segments:
      - text: >
          Allah Ademge bütün isimlerni ögretti. Soñra olarnı evelâ meleklerge taqdim etip:
          «Eger siz söziñizde sadıq olsañız, şularnıñ isimlerini maña bildiriñ», dedi.
        cid: 0
  - verse: 32
    segments:
      - text: >
          Melekler: «YA Rabb! Seni noqsan sıfatlardan tenzih etermiz, seniñ bizge
          ögretkenleriñden başqa bizim bilgimiz yoq. Şübesiz, alim ve hakim ancaq Sensiñ»,
          dediler.
        cid: 0
  - verse: 33
    segments:
      - text: >
          (Bunıñ üstüne:) «Ey, Adem! Eşyalarnıñ isimlerini meleklerge añlat», dedi. Adem
          olarnıñ isimlerini olarğa añlatqanınen: «Men, muaqqaq semalarda ve yerde sizge
          körünmegenlerni (o yerlerdeki sırlarnı) bilem. Bundan da ğayrı, gizli ve aşkâr
          olaraq yapayatqanlarıñıznı da bilem, demegen edimmi?» dedi.
        cid: 0
  - verse: 34
    segments:
      - text: >
          Hatırlaysızmı, biz meleklerge (ve cinlerge): «Ademge secde etiñ», degen edik.
          İblisten ğayrı episi secde ettiler. O yüz çevirdi ve büyüklik tasladı, böylece,
          kâfirlerden oldı. (Bundan soñ Az. Adem ve nesili aslı cinlerden olup, soñra
          şeytanlarnıñ başı olğan İblis ve onıñ nesiline uyıp-uymamaqta sınalacaqlar).
        cid: 0
  - verse: 35
    segments:
      - text: >
          Biz: «Ey, Adem! Sen ve zevceñ (Avva)nen beraber cennetke yerleşiñ; o yerde
          qolaylıqnen istegen vaqtıñızda er yerden cennet nimetlerinden aşañ; yalıñız şu
          terekke yaqınlaşmañ. Eger bu terekten aşasañız, er ekiñiz de özüñizge fenalıq
          etken zalımlardan olursıñız», dedik.
        cid: 0
  - verse: 36
    segments:
      - text: >
          Şeytan olarnıñ ayaqlarını taydırıp, sıñırnı bozdırdı ve içinde bulunğan
          (cennetten) olarnı çıqardı. Bunıñ üstüne: «Bir qısmıñız digeriñizge duşman
          olaraq eniñiz, siz içün yer yüzinde keçinmek ve belli bir vaqıtqa qadar yaşamaq
          bardır», dedik.
        cid: 0
  - verse: 37
    segments:
      - text: >
          Bu vaziyet devam etkende, Adem Rabbinden bir taqım ilhamlar aldı ve deral tövbe
          etti. Çünki, Allah tövbelerni qabul etici ve merhameti boldır. (Az. Ademniñ
          Rabbinden alğan ilhamlar aqqında çeşit yorumlar yapılğan. Bu ilhamlar oña
          emirler ve yasaqlar maiyetindeki tevsiyelerdir. İbn Mes'udğa köre, namazlarğa
          başlağanda oquğan "Subhaaneke"lerimiz, Az. Adem tarafından o vaqıtta söylengen
          bir tesbih ve duadır).
        cid: 0
  - verse: 38
    segments:
      - text: >
          Dedik ki: Epiñiz cenneten tüşiñ! Eger men sizge bir hidayet kelir de, er kim
          hidayetime tabi olsa, olar içün iç bir qorqu yoqtır ve olar ğam çekmezler.
        cid: 0
  - verse: 39
    segments:
      - text: >
          İnkâr etip, ayetlerimizni yalan sayğanlarğa kelgende, olar ceennemlidirler, olar
          o yerde ebediy qalırlar.
        cid: 0
  - verse: 40
    segments:
      - text: >
          Ey, İsrail oğulları! Sizge bergen nimetlerimni hatırlañ, maña bergen söziñizni
          yerine ketiriñ ki, men de sizge vade etkenlerimni bereyim. Yalıñız menden
          qorquñız.
        cid: 0
  - verse: 41
    segments:
      - text: >
          Eliñizdekini (Tevratnıñ aslını) tasdiq etici olaraq endirgenime (Qur'anğa) iman
          etiñ. Saqın onı inkâr eticilerniñ ilkisi olmañ! Ayetlerimizni az bir qarşılıqqa
          satmañ, yalıñız menden (menim azabımdan) qorquñ.
        cid: 0
  - verse: 42
    segments:
      - text: >
          Bilerek, aqnı yañlışnen qarıştırmañ, aqnı gizlemeñ.
        cid: 0
  - verse: 43
    segments:
      - text: >
          Namaznı tam qılıñ, zekâtnı aqqı ile beriñ, ruku etkenlernen beraber ruku etiñ.
        cid: 0
  - verse: 44
    segments:
      - text: >
          (Ey, bilmirler!) Sizler Kitapnı (Tevratnı) oquğan (aqiqatnı bilgen) alda,
          insanlarğa eyilikni emir etip, özüñizni unutasıñızmı? Aqılıñıznı
          qullanmaysıñızmı?
        cid: 0
  - verse: 45
    segments:
      - text: >
