      - text: >-
          (258-nci ayette Az. İbrahimnen davalaşqan kimsenen 259-nci ayette yıqılğan qasabağa
          oğrağan kimselerniñ er ekisiniñ de, kâfir olğanını söylegen tefsirciler bar. Ancaq,
          daa keniş darqağan rivayetke köre, yıqıq qasabağa oğrağan Uzeir (a.s.)dir. Uzeir
          aşaytını alğan, eşegine minip keterken, evleri yıqılğan, harabe alğa kelgen, o yerde
          oturğanlardan kimse qalmağan bir qasaba ya da köy yıqıntılarınıñ yanına kele, o
          yerde qonaqlay. Etrafına baqa, bu şekilde ölgenlerniñ nasıl tirilecegini tüşüne. O
          anda yuqusı kele, yata. Allah onı öldüre, yüz yıldan soñ tirilte. Aşaycaqları iç
          bozulmağan, ancaq eşegi çürügen, yalıñız kemikleri qalğan, yıqıq qasaba da qurulğan.
          Uyanğan ilk anında bir kün qadar ya da daa az bir zaman yuqlağan kibi zan etken.
          Aşaycaqlarına baqıp, aqiqaten böyle olğan belley. Eşegine baqıp, vaziyetini añlay.
          Allah Uzeirniñ közü ögünde eşegini tirilte. Böylece, Allahnıñ qudreti ve azametini
          muşaade ete. Az. İbrahimnen munaqaşa etkenniñ ise, Nemrut olğanı aytıla. Bazı
          tefsirciler bu kıssanıñ Az. İbrahim Mısırğa ketken vaqıtta yüz bergenini, «ayat
          berici ve öldürici - menim», degenniñ Fıravun olğanını söylegenler. Bu yerde müimi,
          Az. İbrahimge berilgen mucizedir ki, Qur'anda oña söznen duşmannı mağlüp etmek
          manasını añlatqan «huccet» denilgen. Az. İbrahim bu huccetnen duşmanlarını yeñgen).
