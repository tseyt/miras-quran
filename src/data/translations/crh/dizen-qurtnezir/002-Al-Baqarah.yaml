      - text: >-
          (Cenk insanlarnıñ severek, zevq alaraq yapqan bir şeyleri degil. Şahsiyeti ve ruh
          sağlığı bozulmağan kimseler öldürmek, yaqıp-yıqmaq, accılar bermekten zevq almaz,
          bulardan oşlanmaz. Ancaq vucutnı qurtarmaq içün, gangrena olğan elniñ kesilüvi,
          içeride qalğan balanı qurtarmaq içün qapunıñ qırıluvı nasıl zaruriy ise, cenk de,
          toplumlarnıñ ayatında böyle zaruret alına kele bilir. Din ve vican ürriyetini
          teminlevniñ, zulumnıñ ve fitneniñ ögüni aluvnıñ, tecavuzlarğa soñ berüvniñ yolu cenk
          ola bilir. İşte, bu vaziyetlerde cenkleşmek şübesiz, insanlıq içün daa hayırlı ve
          daa şerefli bir davranıştır. Cihad ise, iç bir vaqıt bir ücüm degildir. Çünki, evelâ
          İslâmğa davet yapılır, qabul etken musulmandır. İslâmnı qabul etmegenden tabiy oluvı
          istenilir. Bunı da qabul etmese, o zaman cenkleşilir. Cenkteki sırnı biz bilalmamız,
          amma onı Allah bilir. Bazı milletler cezağa lâyıq olğanınen, Allah olarnı çeşit
          belâlarnen cezalandırır. İşte, olardan biri de cenktir. Resulullah Efendimiz
          Abdullah b. Cahş qomandalığında bir gruppanı, qureyş kervanından haber ketirüvleri
          içün, Mekkege yolay. Qureyş kervanını körgenlerinen, dayanamayıp ücüm eteler.
          Kervandan bir kişini öldüreler, eki kişini de esir alalar. Kervannı aydap,
          Peyğamberimizge ketireler. O kün recep ayınıñ ilk künü edi. Müşrikler: «Muhammed
          aram aylarda cenkleşe», diye yayğara qoparalar. Bunıñ üzerine bu ayet ene).
