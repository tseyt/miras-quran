      - text: >-
          (Qur'an-ı Kerim bu eñ uzun ayeti ile notarial müessiseniñ esaslarını qoyğan,
          musulmanlar da bu tevsiyege umumen uyğanlar. İslâmnıñ diqqatnen üzerinde turğan
          printsiplerinden biri de, aqnıñ qorçalanuvıdır. Alınacaqnıñ ve borcnıñ qorçalanuvı,
          ödenüvi kerek olğan aqlardandır. Aqnıñ icrası ve ödenüvi, onıñ bilinüvine, kerek
          olğanda, isbat etile bilüvine bağlıdır. İster yazmaq ve yazdırmaq, ister şaat
          tutmaq, isbat içün alâ qullanılğan eñ keçerli vastalardandır. İslâm qadınnı tabiatı
          ve şahsiyetine uyğun bir terbiye körgeni, ayası ve duyğuları daa küçlü, daa tesirli
          olğanı içün şaatlıq kibi resmiy ve kütlege belli mevzularda, em cınsınen
          qavileştirilüvi uyğun körülgen. «İşiñ yoq ise - şaat, parañ çoq ise - kefil ol»,
          şeklindeki meşur söz İslâm ketirgen qardaşlıq ve beraderlik ruhınıñ söngeni,
          ahlâqnıñ zayıflağan devirlerine aittir. Qur'an mü'minlerni, işleri olsa da, şaatlıq
          etmege çağırğan, böylece aqlarnıñ qorçalanuvı vazifesine qatıluvlarını istey. «Haq»
