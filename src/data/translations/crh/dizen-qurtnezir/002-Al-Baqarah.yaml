          oluvı içün, bu ayetni endirdi. «Beyaz yiplik ve qara yiplik» ifadeleri «Mine'l-fecr:
          tañ yeriniñ ağaruvından» degen mananı añlata. Buña köre, orazanıñ başlanuvı kerek
          olğan vaqıt «temçit» küneşniñ doğuvına degil, fecrniñ doğuvına, yani tañ yeriniñ
          ağarmağa başlamasına bağlıdır. Yiplik tabiri de, tañ yeri ağaruvınıñ başlanğıçını
