          «içiñizdekilerni aşkâr etseñiz de, gizleseñiz de, Allah sizni esapqa çekecek»,
          haberinen qorquğa qapılğan mü'minlerge bu ayetlernen qolaylıq bahş etilgen,
          mükellefiyetler yengilletilgen. Böylece, Allahqa tam itaat ve iltica meyvalarını
          berirken, yersiz şübeler de yoq etilgen. Mirac gecesinde Peyğamberimizge vastasız
          vahiy olğan bu ayetler, Resulullahnıñ hadislerinde maqtalğan, er zaman ve alelhusus
          yatmadan evel oquluvı tevsiye etilgen. Bir hadiste de: «Bu ayetlerniñ geceleyin
          yatmadan evel oquluvı kişige yeterli», denilgen).
