          yuqlağanğa qadar aşar, içer edi. Bundan soñra (yuqlağandan soñ) aşamaq, içmek ve
          qadınlarğa yaqınlaşmaq aram edi. Bazı musulmanlar dayanalmayıp, qıdnlarına yaqlaştı.
