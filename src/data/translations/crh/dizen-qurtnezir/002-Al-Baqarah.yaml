          kâinatnı idare eticiler yıldızlar olğanını, hayır ve şerrniñ olardan kelgenini,
          semaviy küçlerniñ yerdeki küçlernen birleşüvi neticesinde mucizeler meydanğa
          kelgenini söyley ediler. Bularnı doğru yolğa qoymaq içün Allah Az. İbrahimni
          yolladı. Bular da, öz aralarında üç fırqa ediler: 1. Keldaaniylerniñ sihiri: Bular
          yıldızlarğa tabınırlar, kâinatnı idare eticiler yıldızlar olğanını, hayır ve şerrniñ
          olardan kelgenini, semaviy küçlerniñ yerdeki küçlernen birleşüvi neticesinde
          mucizeler meydanğa kelgenini söyley ediler. Bularnı doğru yolğa qoymaq içün Allah
          Az. İbrahimni yolladı. Bular da, öz aralarında üç fırqa ediler: a). Felek ve
          yıldızlarnıñ ebediy olğanını söyleyiciler ki, olarğa "Saabie" denilir. b). Felekniñ
          ilâhiyligine inanğanlar. Bular er felek içün yerde bir put yapqan ve oña hızmet
          etken putperestlerdir. v). Felekni ve yıldızlarnı yaratqan birisi olğanını ve bunıñ
          olarğa yer yüzini idare etmege aq bergenini söyleyicilerdir. Bular yıldızlarnı aracı
          qabul ete ediler. 2. Ruh küçüne tayanaraq, ortağa çıqqan sihir: Buña köre, insan
          ruhı yoq etüvnen icat etüv, öldürüv, tiriltüv, vucut ve şekilde deñişiklik yapmaq
          küçüne qavuşır. 3. Ruhiy varlıqlardan faydalanılaraq yapılğan sihir: Bu da musqa
          (adamlarnıñ üstlerine taqqan dua) yapmaq ve cinlerden yardım almaq kibi şekillernen
          yapılır. 4. Közboyamaq şekilinde yapılğan sihir: Közbaylayıcılıq, el çabukligi ve
          buña beñzegen areketler kibi. İslâm alimleri, sihirniñ birinci ve ekinci şekline
          inanğanğanlarnıñ kâfir olğanlarını tasdiq etkenler. Ancaq ayette bildirilgeni
          şekilde yaratıcınıñ Allah Taala olğanına inanaraq ve fenalıqta qullanmamaq şartınen,
          sihir ilmini ögrenüvde zarar yoqtır. Yeudiyler arasında tılsım keniş darqağan edi.
          Bu sebepten, Az. Süleymannıñ büyük bir tılsımcı olğanını, ükümdarlıqnı tılsımnen
