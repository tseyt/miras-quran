      - text: >-
          (Qur'an sureleriniñ bazılarınıñ başında "el-huruf'ul-muqattaa" denilgen bir taqım
          arifler bar ve olar olğan sureleriniñ bir ayetidir. Manası açıq olmağan böyle
          ayetlerge "müteşaabih" ayetler denilir. Müteşaabih olğan ayetniñ aqiqiy manasını tek
          Allah bilir. Bazı alimler ise, olarnı "yorumlarlar". Buña köre, Elif, Lâam, Miim
          ariflerine şu manalar berilgen: a). İşte, eliñizdeki Qur'annıñ kelimeleri bu
          ariflerden teşkil olğandır. Buyurıñ, siz de beñzegenini yapıñ! b). Diqqatlarnı celp
          etmek içün bir edebiy sanattır. Zira, sözge üstü qapalı başlamaq ve soñra onı açmaq
          daa ziyade diqqat çeker. v). Ögrenmekniñ ariflernen başlanuvına işarettir. Muttaqiy
          - taqva saibi demektir. Allahnıñ azabından aqqı ile qorqacaq, Onıñ emirlerine qarşı
          çıqmağa saqınğan, rahmetine ışanıp, keregi kibi qullıq etecek kimselerge Qur'anda
          "muttaqiyler" denile. Ğaybğa iman - İslâmnıñ "Aamentu"siniñ qısqartılğan ifadesidir.
          Manası: Allahqa, meleklerge, kitaplarğa, peyğamberlerge, ahiret kününe, qaza ve
          taqdirge, hayır ve şerrniñ Allahtan olğanına inanmaqtır. Qur'annıñ pek çoq yerinde
          "Ğaybğa iman eter" ya da "eterler" cumlesi kelecek. Bularnıñ episi iman esaslarınıñ
          qısqa şeklidir. Baqara suresinde sözge evelâ diqqatnı çekken ariflernen başlanıp,
          aman artından Qur'andan söz etile. Demek ki, şu eliñizdeki kitap (Qur'an) özünde şek
          ve şübe olmağan Allahnıñ kelâmı ve eyiler içün doğru yol reberidir. Qur'an - bir
          reber, yol köstericidir. Ancaq kimge yol kösterir, kimge reberlik eter? İşte,
          ayetlerde bu sualge cevap berilgen, eñ evelâ muttaqiy olıp, ğaybğa inanğanlarğa yol
          köstergeni añlatıla. Qur'an aqiqaten bütün insanlıqqa endirilgen. Ancaq, sadece oña
          yönelgen ve onıñnen doğru yolnı tapmaq istegenlerge reberdir. Bu yerde ğaybğa
          imandan soñ, "Kelime-i Şeadet, namaz, zekât, oraza ve hac"dan ibaret olğan İslâmnıñ
          beş esasından sadece "namaznen zekât" zikr etilgen. Bu eki esasnıñ zikri misal
          yolunen digerlerine de işerettir. Buña köre, Qur'anda "namaznen zekât" bu ayette
          olğanı kibi, beraber añılğan vaqıtta beş esasqa işaret etilmekte).
        cid: 0
