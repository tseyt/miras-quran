surah_id: 2
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "Elif. Lâam. Miim."
        cid: 0
  - verse: 2
    segments:
      - text: "O kitap (Qur’an), onda asla şube yoktır. O, muttaqiyler (saqınğanlar ve arınmaq istegenler) içün bir yol kostericidir."
        cid: 0
  - verse: 3
    segments:
      - text: "Olar ğaybğa inanırlar, namaz qılarlar, ozlerine bergen mallarımızdan Allaһ yollarında arclarlar."
        cid: 0
  - verse: 4
    segments:
      - text: "Kene olar saña endirilgenge ve senden evel endirilgenlerge iman eterler; ahiret kunüne de kesen-kes inanırlar."
        cid: 0
  - verse: 5
    segments:
      - text: "İşte, olar Rabblerinden kelgen bir hidayet uzerindedirler ve qurtulışqa irişkenler de yalıñız olardır. (Qur’an sureleriniñ bazılarınıñ başında “el-huruf’ul-muqattaa” denilgen bir taqım arifler bar ve olar olğan sureleriniñ bir ayetidir. Manası açıq olmağan boyle ayetlerge “muteşaabiһ” ayetler denilir. Muteşaabiһ olğan ayetniñ aqiqiy manasını tek Allaһ bilir. Bazı alimler ise, olarnı “örumlarlar”. Buña kore, Elif, Lâam, Miim ariflerine şu manalar berilgen: a). İşte, eliñizdeki Qur’annıñ kelimeleri bu ariflerden teşkil olğandır. Buyurıñ, siz de beñzegenini yapıñ! b). Diqqatlarnı celp etmek içün bir edebiy sanattır. Zira, sözge ustü qapal başlamaq ve soñra onı açmaq daa ziyade diqqat çeker. v). Ogrenmekniñ ariflernen başlanuvına işarettir. Muttaqiy - taqva saibi demektir. Allaһnıñ azabından aqqı ile qorqacaq, Onıñ emirlerine qarşı çıqmağa saqınğan, rahmetine ışanıp, keregi kibi qullıq etecek kimselerge Qur’anda “muttaqiyler” denile. Ğaybğa iman - İslâmnıñ “Aamentu”siniñ qısqartılğan ifadesidir. Manası: Allaһqa, meleklerge, kitaplarğa, peyğamberlerge, ahiret kunüne, qaza ve taqdirge, hayır ve şerrniñ Allaһtan olğanına inanmaqtır. Qur’annıñ pek çoq yerinde “Ğaybğa iman eter” ya da “eterler” cumlesi kelecek. Bularnıñ episi iman esaslarınıñ qısqa şeklidir. Baqara suresinde sözge evelâ diqqatnıi çekken ariflernen başlanıp, aman artından Qur’andan söz etile. Demek ki, şu eliñizdeki kitap (Qur’an) ozonde şek ve şube olmağan Allaһnıñ kelâmı ve eyiler içün doğru yol reberidir. Qur’ant - bir reber, yol kostericidir. Ancaq kimge yol kosterir, kimge reberlik eter? İşte, ayetlerde bu sualge cevap berilgen, eñ evelâ muttaqiy olıp, ğaybğa inanğanlarğa yol kostergeni añlatıla. Qur’an aqiqaten butün insanlıqqa endirilgen. Ancaq, sadece oña yonelgen ve onıñnen doğru yolnı tapmaq istegenlerge reberdir. Bu yerde ğaybğa imandan soñ, “Kelime-i Şeadet, namaz, zekât, oraza ve hac”dan ibaret olğan İslâmnıñ beş esasından sadece “namaznen zekât” zikr etilgen. Bu eki esasnıñ zikri misal yolunen digerlerine de işerettir. Buña kore, Qur’anda “namaznen zekât” bu ayette olğanı kibi, beraber añılğan vaqıtta beş esasqa işaret etilmekte)."
        cid: 0
  - verse: 6
    segments:
      - text: "Şu aqiqat ki, kâfir olğanlarnı (azap ile) qorqutsañ da, qorqutmasañ da, olar içün epbirdir, iman etmezler."
        cid: 0
  - verse: 7
    segments:
      - text: "Allaһ olarnıñ qalplerini ve qulaqlarını muurlegen. Olarnıñ kozlerine de bir çeşit perde çekken ve olar içün (dünyada ve ahirette) buyuk bir azap bar."
        cid: 0
  - verse: 8
    segments:
      - text: "İnsanlardan bazıları da bar ki, inanmağanları alda: “Allaһqa ve ahiret kunüne inandıq”, derler."
        cid: 0
  - verse: 9
    segments:
      - text: "Olar (oz aqıllarına kore) guya Allaһnı ve mu’minlerni aldatalar. Albuki, olar yalıñız ozlerini aldatalar ve bunuñ farqına barmazlar."
        cid: 0
  - verse: 10
    segments:
      - text: "Olarnıñ qalplerinde bir hastalıq bar. Allaһ da olarnıñ hastalığını ziyadeleştirgendir. Söylegen yalanları sebebinden, olar içün şiddetli bir azap bar."
        cid: 0
  - verse: 11
    segments:
      - text: "Olarğa: «Er yuzünde fesat çıqarmañ», denilgen vaqıtta: “Biz yalıñız islâh eticilermiz”, derler."
        cid: 0
  - verse: 12
    segments:
      - text: "Şunı biliñ ki, olar bozğuncılarnıñ tam ozleridir, lâkin añlamazlar."
        cid: 0
  - verse: 13
    segments:
      - text: "Olarğa: «İnsanlarnıñ iman etkenleri kibi, siz de iman etiñ», denilgende: “Biz iç sefihlerniñ (aqılsız ve ahmaq kişilerniñ) iman etkenleri kibi iman etermizmi!” derler. Biliñiz ki, sefihler ancaq ozleridir, faqat bunı bilmezler (ya da bilmegen kibi olurlar)."
        cid: 0
  - verse: 14
    segments:
      - text: "(Bu munafıqlar) mu’minlerge rastkelgen vaqıtta: “(Biz de) iman ettik”, derler. (Ozlerini sapıtqan) şeytanlarınen koz-kozge qalğanlarında ise: «Biz siznen berabermiz, biz olarnen (mu’minlernen) sadece alay etemiz (ustlerinden kulemiz)», derler."
        cid: 0
  - verse: 15
    segments:
      - text: "Aqiqaten, Allaһ olarnen alay eter de, adlerinden aşqanda, olarğa fırsat berir. Bu sebepten olar bir muddet oz başlarına yurerler."
        cid: 0
  - verse: 16
    segments:
      - text: "İşte, olar hidayetke nisbeten sapıqlıqnı satın alğanlardır. Ancaq olarnıñ bu ticareti qazançlı degil ve ozleri de doğru yolğa kirmegenlerdir. (Cenab-ı Allaһ bu sureniñ başında evelâ Yuce Kitabı Qur’andan, onıñ muttaqiyler içün bir yol kostereci ve hidayet çoqrağı olğanından, bunıñ kibi de, ğaybğa imandan ve İslâmnıñ temelini teşkil etken baş vazifelerden söz yursete ve bu arada insanlarnı, inanç noqtai nazarından, uç gruppağa ayıra: Birincisi - mu’minler; olarnıñ vasıfları ilki beş ayette qısqadan añlatılğan. Ekincisi - kâfirler; olarnıñ vaziyeti de altıncı ve yedinci ayetlerde qısqadan añlatılğan. Uçüncisi - munafıqlar; bularnıñ vaziyetleri de keniş bir şekilde sekizinci ayetten yigirmi birinci ayetke qadar olğan ayetlerde añlatılğan. Qu’an insanlıqqa doğru yolnı kostermek içün yollanılğan bir kitaptır. Buña kore, ilk evelâ ozüne muhatap olğan insanlıqnıñ doğru ve yañlış inanç vaziyetini, bularnıñ ketirgen mesuliyetlerini, doğruğa ve egrige inanğan insannıñ dünyada ve ahirette qarşılaşacaq neticeleri izaat etilgen)."
        cid: 0
  - verse: 17
    segments:
      - text: "Olarnıñ (munafıqlarnıñ) vaziyeti (qaranlıq gecede) bir ateş yaqqan kimse kibidir. O ateş yanıp da, etrafını aydınlaqtan anda Allaһ aman olarnıñ aydınlıqlarını ketkizir ve olarnı qaranlıklar içinde qaldırır; (artıq iç bir şeyni) kormezler. (Ayet munafıklarnıñ ilk anda İslâmnıñ nurından aydınlanıp, musulman oluvlarını, qaranlıq gecede yanğan meş’alege ve ondan faydalanğanlarğa; soñra aman kufürge dönüvlerini de, o meş’aleniñ sönmesine ve o yerdekilerniñ qaranlıqta qalğanlarına beñzete)."
        cid: 0
  - verse: 18
    segments:
      - text: "Olar sağır, tilsiz ve kordirler. Bu sebepten, olar keri dönip olamazlar."
        cid: 0
  - verse: 19
    segments:
      - text: "Yahut (olarnıñ vaziyeti) kokten sağanaq alında yağğan, içinde zift qaranlıqlar, gurülti ve yıldırımlar bulunğan yağmur(ğa tutulğan kimselerniñ vaziyeti) kibidir. O munafıqlar yıldırımlardan kelecek olüm qorqusınen parmaqlarını qulaqlarına tıqarlar. Albuki, Allaһ kâfirlerniñ etrafını quşatqandır."
        cid: 0
  - verse: 20
    segments:
      - text: "(O esnada) şemşek sanki kozlerini çıqaracaq kibi çaqar, olar içün etrafnı aydınlatqanınen, o yerde biraz yurerler, uzerlerine qaranlıq çökkeninen de, olğan yerlerinde qalırlar. Allaһ istese edi, elbette olarnıñ qulaqlarını sağır, kozlerini kor eter edi. Allaһ, şubesiz, er şeyge qadirdir. (Bu ayetlerde keçken misallerden kâfirlerniñ ve munafıklarnıñ İslâm qarşısında qafalarında fırtınalar qopqanı, qorqu ve eyecanlarğa qapılğanları, bazan haqnı korecek kibi olğanları, bazan da, qaranlıqqa komülgenleri añlaşıla)."
        cid: 0
  - verse: 21
    segments:
      - text: "Ey, insanlar! Sizni ve sizden evelkilerni yaratqan Rabbinizge qullıq etiñiz. Belki, boylece qorçalanırsıñsız (Allaһnıñ azabından ozüñizni qurtarırsıñız)."
        cid: 0
  - verse: 22
    segments:
      - text: "O, Rabb ki, yerni siz içün bir töşek, kokni de (qubbe kibi) bir tavan yaptı. Kokten suv endirerek, onıñnen sizge ğıda olsun diye, (erden) çeşit mahsullar çıqardı. Artıq bunı bile-bile Allaһqa şirk qoşmañ."
        cid: 0
  - verse: 23
    segments:
      - text: "Eger qulumızğa endirgenlerimizden er angi bir şubege tüşseñiz, aydı oña beñzegen bir sure ketiriñ, eger iddañızda doğru olsañız, Allaһtan ğayrı şaatlarıñznı (yardımcılarıñıznı) da çağırıñ."
        cid: 0
  - verse: 24
    segments:
      - text: "Bunı yapıp olamazsıñız -ki, elbette yapalmaycaqsıñız- yaqarlığı insan ve taştan ibaret jeennem ateşinden saqınıñ. Çünki, o ateş kâfirler içün azırlanılğandır."
        cid: 0
  - verse: 25
    segments:
      - text: "İman etip, eyi arekette bulunğanlarğa içinden irmaqlar aqqan cennetler olğanını mujdele! O cennetlerdeki bir meyvadan ozlerine rızıq olaraq aşatılğanınen: «Bu - bundan evel dünyada bizge berilgenlerinden», derler. Bu rızıqlar olarğa (bazı taraftan dünyadakine) beñzegeni berilgendir. Olar içün cennette ter-temiz zevceler de bar. Ve olar o yerde ebediy qalıcılardır. (Bu ayette dünyada musulman olup, guzel işler yapqan ve aqiqaten mu’min olaraq ahiretke koçken kimselerniñ alacaq mukâfatları añlatılğan, o yerde cennetlilerge berilgen nimetlerniñ dünyadakilerine beñzegenine işaret etilgen. Ancaq, ahiret nimetleriniñ dünyadakilerinen bir olğanı tüşünilmemelidir. Çünki, Buhariyniñ “Bedu’l-halq” baasında rivayet etken bir hadiste: “Cennet ehline kozler kormegen, qulaqlar eşitmegen, qalplerden bile keçmegen nimetler berilir”, denilgen)."
        cid: 0
  - verse: 26
    segments:
      - text: "Şubesiz, Allaһ (aqnı añlatmaq) içün sivrisinek ve ondan da ğayrı, başqa bir varlıqnı misal ketirmekten çekinmez. İman etkenlerge kelgende, olar boyle misallerniñ Rabblerinden kelgen haq ve kerçek olğanını bilirler. Kâfirler ise: «Allaһ boyle misal bermekle ne murat eter?» derler. Allaһ onıñnen bir çoq kimseni sapıtır, bir çoqlarını da, doğru yolğa yoneltir. Bergen misallerinen Allaһ ancaq fasıqlarnı sapıtır (çünki bular birer imtiandır). (Bu ayette sivrisinek ve ondan daa zayıf mahlüqlarnıñ misalge ketirilüvini munasip kormegenlerniñ asılında ozleriniñ kuçük ve degersiz olğanıları, o sebepten Allaһqa iman etmegenleri añlatıla, bularğa deger berip, iman etkenlerniñ ise, aqıll ve degerli kimseler olğanları bildirile. Bular birer imtiandır. İnsanlardan bir qısmıi iman eter, imtiannı qazanır, bir qısmı da, zarar eter)."
        cid: 0
  - verse: 27
    segments:
      - text: "Olar oyle (fasıqlar) ki, kesen-kes söz bergenden soñ, sözlerinden qaytırlar. Allaһ, ziyaret etilip, al ve hatiri soraluvını istegen kimselerni ziyaret etmezler. Ve yer yuzünde fitne ve fesat çıqarırlar. İşte, olar aqiqaten zararğa oğrağanlardır. (Fasıq - haq yoldan sapqan kimsedir. Kesen-kes olaraq berilgen söz de, ehl-i kitapnıñ Tevrat ve İncilde kelecegi bildirilgen ahır zaman Peyğamberine iman eteceklerini söylevleridir ki, kelgeninen iman etmediler ve sözlerinde turmadılar. İslâmnıñ çoq deger bergen aqraba, qomşu ve yaqınlarnen alâqada bulunaraq, bularğa yardım etüvni terk ettiler, fitne ve fesatçı oldılar, boylece, em dünyada, em de ahirette zarar kordiler)."
        cid: 0
  - verse: 28
    segments:
      - text: "Ey, kâfirler! Siz olü ekende, sizni tiriltken (dünyağa ketirip, ayat bergen) Allaһnı nasıl inkâr etesiñiz? Soñra sizni oldürecek, tekrar sizni tiriltecek ve soñunda Oña döndürileceksiñiz. (Bu ayette insannıñ ilk yaratılışıından evelki alına “olü” denilüvi, bazılarınıñ idda etkenleri kibi, tenaasuhnen bağlı degil. Ayette insan ayatınıñ uç saifesi añlatıla: yoqtan yaratıluvı, olüm ve ahirette tekrar tirilüvi. Esasen tenaasuh tüşüncesi, er bir insannıñ oz amelinden cevapkârlığı ve tolayısınen adalet priniipine terstir)."
        cid: 0
  - verse: 29
    segments:
      - text: "O, yerde ne bar ise, episini siziñ içün yarattı. Soñra (ozüne has bir şekilde) semağa yoneldi, onı yedi qat olaraq yaratıp, nizamğa qoydı (tanzim etti). O, er şeyni haqqı ile bilicidir."
        cid: 0
  - verse: 30
    segments:
      - text: "Hatırla ki, Rabbiñ meleklerge: «Men yer yuzinde bir halife yaratacağım», dedi. Olar: «Bizler hamdiñ ile seni tesbih ve seni taqdis etip turğanda, yer yuzinde fesat çıqaracaq, o yerde qan tökecek insannı halife yapasıñmı?» dediler. Allaһ da olarğa: «Siziñ bilip olamaycağıñıznı, er alda, men bilem», dedi. (Halife - vekil ve temsilci demektir. Allaһ yer yuzinde iradesini temsil etmek içün insannı yarattı. O yerde ilâhiy uyuyumranlıqnı omürge keçirmek vazifesini de oña berdi)."
        cid: 0
  - verse: 31
    segments:
      - text: "Allaһ Ademge butün isimlerni ogretti. Soñra olarnı evelâ meleklerge taqdim etip: «Eger siz söziñizde sadıq olsañız, şularnıñ isimlerini maña bildiriñ», dedi."
        cid: 0
  - verse: 32
    segments:
      - text: "Melekler: «Ya Rabb! Seni noqsan sıfatlardan tenzih etermiz, seniñ bizge ogretkenleriñden başka bizim bilgimiz yoq. Şubesiz, alim ve hakim ancaq Sensiñ», dediler."
        cid: 0
  - verse: 33
    segments:
      - text: "(Bunıñ ustüne:) «Ey, Adem! Eşyalarnıñ isimlerini meleklerge añlat», dedi. Adem olarnıñ isimlerini olarğa añlatqanınen: «Men, muaqqaq semalarda ve yerde sizge korünmegenlerni (o yerlerdeki sırlarnı) bilem. Bundan da ğayrı, gizli ve aşkâr olaraq yapayatqanlarıñıznı da bilem, demegen edimmi?» dedi."
        cid: 0
  - verse: 34
    segments:
      - text: "Hatırlaysızmı, biz meleklerge (ve cinlerge): «Ademge secde etiñ», degen edik. İblisten ğayrı episi secde ettiler. O yuz çevirdi ve buyuklik tasladı, boylece, kâfirlerden oldı. (Bundan soñ Az. Adem ve nesili asl cinlerden olup, soñra şeytanlarnıñ başı olğan İblis ve onıñ nesiline uyıp-uymamaqta sınalacaqlar)."
        cid: 0
  - verse: 35
    segments:
      - text: "Biz: «Ey, Adem! Sen ve zevceñ (Avva)nen beraber cennetke yerleşiñ; o yerde qolaylıqnen istegen vaqtıñızda er yerden cennet nimetlerinden aşañ; yalıñız şu terekke yaqınlaşmañ. Eger bu terekten aşasañız, er ekiñiz de ozüñizge fenalıq etken zalımlardan olursıñız», dedik."
        cid: 0
  - verse: 36
    segments:
      - text: "Şeytan olarnıñ ayaqlarını taydırıp, sıñırnı bozdırdı ve içinde bulunğan (cennetten) olarnı çıqardı. Bunıñ ustüne: «Bir qısmıñız digeriñizge duşman olaraq eniñiz, siz içün yer yuzinde keçinmek ve belli bir vaqıtqa qadar yaşamaq bardır», dedik."
        cid: 0
  - verse: 37
    segments:
      - text: "Bu vaziyet devam etkende, Adem Rabbinden bir taqım ilhamlar aldı ve deral tövbe etti. Çünki, Allaһ tövbelerni qabul etici ve merhameti boldır. (Az. Ademniñ Rabbinden alğan ilhamlar aqqında çeşit yorumlar yapılğan. Bu ilhamlar oña emirler ve yasaqlar maiyetindeki tevsiyelerdir. İbn Mes’udğa kore, namazlarğa başlağanda oquğan “Subһaaneke”lerimiz, Az. Adem tarafından o vaqıtta söylengen bir tesbih ve duadır)."
        cid: 0
  - verse: 38
    segments:
      - text: "Dedik ki: Epiñiz cenneten tüşiñ! Eger men sizge bir hidayet kelir de, er kim hidayetime tabi olsa, olar içün iç bir qorqu yoqtır ve olar ğam çekmezler."
        cid: 0
  - verse: 39
    segments:
      - text: "İnkâr etip, ayetlerimizni yalan sayğanlarğa kelgende, olar ceennemlidirler, olar o yerde ebediy qalırlar."
        cid: 0
  - verse: 40
    segments:
      - text: "Ey, İsrail oğulları! Sizge bergen nimetlerimni hatırlañ, maña bergen söziñizni yerine ketiriñ ki, men de sizge vade etkenlerimni bereyim. Yalıñız menden qorquñız."
        cid: 0
  - verse: 41
    segments:
      - text: "Eliñizdekini (Tevratnıñ aslını) tasdiq etici olaraq endirgenime (Qur’anğa) iman etiñ. Saqın onı inkâr eticilerniñ ilkisi olmañ! Ayetlerimizni az bir qarşılıqqa satmañ, yalıñız menden (menim azabımdan) qorquñ."
        cid: 0
  - verse: 42
    segments:
      - text: "Bilerek, aqnı yañlışnen qarıştırmañ, aqnı gizlemeñ."
        cid: 0
  - verse: 43
    segments:
      - text: "Namaznı tam qılıñ, zekâtnı aqqı ile beriñ, ruku etkenlernen beraber ruku etiñ."
        cid: 0
  - verse: 44
    segments:
      - text: "(Ey, bilmirler!) Sizler Kitapnı (Tevratnı) oquğan (aqiqatnı bilgen) alda, insanlarğa eyilikni emir etip, ozüñizni unutasıñızmı? Aqılıñıznı qullanmaysıñızmı?"
        cid: 0
  - verse: 45
    segments:
      - text: "Sabır ve namaznen Allaһtan yardım isteñ. Şubesiz, o (sabır ve namaz) Allaһqa sayğıdan yuregi titregenden ğayrı, er keske zor ve ağır kelgen bir vazifedir. (Ayette keçken sabırnıñ oraza olğanı söylene. Oraza ve namaz imannı quvetlendirir, nefisniñ kibirini qırar, tenbellikni ve issizlikni ketkizir, qıyın işler qarşısında insannı kuçlü yapar. Taberaniyniñ rivayetine kore, Resulullah (s. a.) zor bir işnen qarşılaşqanda, aman namaz qıla edi. “Allaһqa sayğıdan yuregi titregenler” diye tercime etilgen “haaşiiin” toplulığına namaz qılmaq, oraza tutmaq, sabırlı olmaq, er yerde ve er zaman aqiqatnı söylemekten çekinmemek zor kelmez, zira olar qalpleri Allaһ sevgisi ile tolğan kimselerdir)."
        cid: 0
  - verse: 46
    segments:
      - text: "Olar kesen-kes Rabblerine qavuşacaqalırını ve Oña döneceklerini tüşüngen ve bunı qabul etken kimselerdir."
        cid: 0
