      - text: >-
          (İçinde «kürsi» kelimesi keçkeni içün bu ayetke «Aayetu'l-kürsi» denilgen. Bu yerde
          kürsi biz bilgen taht manasında olmayıp, Allahnıñ şanına lâyıq, maiyetini yalıñız
          Özü bilgen bir varlıqtır. Onıñ yüce sıfatlarını, aqransız qudretini añlatqan bu
          ayetniñ azameti, onı oqumaqnıñ büyük savabı ve tesirleri aqqında hadisler bar.
          Efendimiz bir hadisinde şöyle buyurğan: «Qur'anda eñ büyük ayet Aayetu'l-kürsidir.
          Onı oquğanğa Allah bir melek yollar, onıñ hasenatını yazar. İçinde oqulğan evni
          şeytan otuz kün terk eter. O evge qırq kün sihir ve sihirbaz kiralmaz. YA Ali! Bunı
          evlâdıña, aileñe ve qomşularıña ögret». Başqa bir hadiste de: «Künlerniñ müimi cuma,
          sözlerniñ üstüni Qur'an, Qur'annıñ eñ faydalı suresi el-Baqara, Baqaranıñ eñ büyük
          ayeti de Aayetu'l-kürsidir», denilgen. Hayy - luğatta tiri, canlı manasındadır.
          Allahnıñ sıfatlarından biri olup, daima bar olğan, üzülişke oğramağan, barlığı
          ezeliy ve ebediy demektir. Qayyum ise - bütün mahlüqatnıñ idaresini şahsen yürütken,
          episini esapqa çekken demektir).
