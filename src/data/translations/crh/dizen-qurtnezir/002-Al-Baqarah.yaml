          Suheyb mekkelilerge: «Men qart bir adamım. Malım da bar. Sizden ya da
          duşmanlarıñızdan oluvımnıñ sizge bir zararı olmaz, men bir söz söyledim, ondan
          caymaqnı eyi körmem, malımnı ve eşyamnı sizge berir, dinimni sizden satın alırım»,
