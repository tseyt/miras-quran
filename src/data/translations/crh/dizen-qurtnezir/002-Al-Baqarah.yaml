  - verse: 286
    segments:
      - text: "Allaһ er şahsnı ancaq kuçü yetecek olçüde mukellef yapar. Er kesniñ qazanğan (hayırı) ozüne, yapacaq (şerri) de ozüne. Rabbimiz! Unutsaq ya da hata yapsaq, bizni mesuliyetli etme. Ey, Rabbimiz! Bizden evelkilerine yuklegeniñ kibi, bizge de ağır bir yuk yukleme. Ey, Rabbimiz! Bizge kuçümiz yetmegen işlerni de yukleme! Bizni afu et! Bizni bağışla! Bizni acı! Sen bizim mevlâmızsıñ. Kâfirler toplulığına qarşı bizge yardım et! («Baqara» suresiniñ soñki eki ayetini teşkil etken ve “Aamenerresuulu” diye añılğan bu mubarek ayetler, ilâhiy emirler qarşısında yalıñız itaatqa yonelgen mu’minlerniñ inançlarındaki sadaqatlarını ifade etmekte. Ayrıca, evelki bir ayette keçken «içiñizdekilerni aşkâr etseñiz de, gizleseñiz de, Allaһ sizni esapqa çekecek», haberinen qorquğa qapılğan mu’minlerge bu ayetlernen qolaylıq bahş etilgen, mukellefiyetler yengilletilgen. Boylece, Allaһqa tam itaat ve iltica meyvalarını berirken, yersiz şubeler de yoq etilgen. Mirac gecesinde Peyğamberimizge vastasız vahiy olğan bu ayetler, Resulullahnıñ hadislerinde maqtalğan, er zaman ve alelhusus yatmadan evel oquluvı tevsiye etilgen. Bir hadiste de: «Bu ayetlerniñ geceleyin yatmadan evel oquluvı kişige yeterli», denilgen)."
