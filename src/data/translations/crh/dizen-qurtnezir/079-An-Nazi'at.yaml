surah_id: 79
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "Söküp çıqrğanlarğa, yavaşça çekkenlerge, yaldağanlardan-yaldağanlarğa, yarışqandan-yarışqanlarğa, iş trtiplegenlerge ant olsun;"
        cid: 0
  - verse: 6
    segments:
      - text: "Birinci uflev (kâinatnı) sarsqan, onı ekinci uflevni taqip etken kunü, işte, o kunü yurekler qayğıdan titrer, kozler yorğun olur. 10-11. «Olgenden soñ biz, (dünyadaki) ilki alımızğa qaytarılacaqmızmı, (em de) çürügen kemikler olğandan soñmı?» derler. 12. «O zaman bu, ziyanlı bir qaytuv olur», dediler."
        cid: 0
  - verse: 10
    segments:
      - text: "Bu dönüş, sadece bir seslenüvge baqar."
        cid: 0
  - verse: 11
    segments:
      - text: "Birden ozlerini mahşerde bula qoyarlar."
        cid: 0
  - verse: 12
    segments:
      - text: "(Habibim!) Saña Musanıñ haberi keldimi?"
        cid: 0
  - verse: 13
    segments:
      - text: "Muqaddes vadiy Tuvaada Rabbi oña boyle seslengen:"
        cid: 0
  - verse: 14
    segments:
      - text: "Fıravunğa bar! Çünki, o çoq adden aştı."
        cid: 0
  - verse: 15
    segments:
      - text: "De ki: Arınuvnı ve seni Rabbimniñ yoluna qavuştıruvımnı istersiñmi? Boylece, ondan qorqarsıñ."
        cid: 0
  - verse: 17
    segments:
      - text: "Ve oña eñ buyuk mucizeni kosterdi."
        cid: 0
  - verse: 18
    segments:
      - text: "(O ise) aman yalanladı ve isyan etti."
        cid: 0
  - verse: 19
    segments:
      - text: "Soñra (inkâr içün) bar ğayretini kostererek, sırtını çevirdi."
        cid: 0
  - verse: 20
    segments:
      - text: "Der’al (adamlarını) topladı ve (olarğa) bağırdı:"
        cid: 0
  - verse: 21
    segments:
      - text: "Men, siziñ eñ yuce Rabbiñizim! dedi."
        cid: 0
  - verse: 22
    segments:
      - text: "Allaһ onı, (er keske ibret olaraq) dünya ve ahiret azabınen cezalandırdı."
        cid: 0
  - verse: 23
    segments:
      - text: "Elbette, bunda, korqqan kimseler içün, buyuk bir ibret bar."
        cid: 0
  - verse: 24
    segments:
      - text: "Sizni yaratmaq daa kuçmi, yoqsa, kok yuzüni yaratmaqmı ki, onı Allaһ bina etti, onı yukseltip, nizamğa qoydı. Gecesini qararttı, kundüzini ağarttı."
        cid: 0
  - verse: 27
    segments:
      - text: "Ondan soñ da, yer qurresini töşedi. Ozüñiz ve ayvanlarıñız içün bir faydalanuv olmaq uzre, yerden suvnı ve otlağını çıqardı ve dağlarnı qavi bir şekilde yerleştirdi."
        cid: 0
  - verse: 31
    segments:
      - text: "Er şeyni alt-ust etken o buyuk felâket kelgen vaqıtta, insan yapıp-etkenlerini hatırlaycaq kunü ve korgenge ceennem açıq bir şekilde kosterilgen vaqıtta;"
        cid: 0
  - verse: 34
    segments:
      - text: "Adden aşqanğa ve dünya ayatını ahiretten ustün korgenge, şubesiz, ceennem tek barınılacaq (sığınılacaq) yerdir."
        cid: 0
  - verse: 37
    segments:
      - text: "Rabbiniñ maqamından qorqqan ve nefsini fena isteklerden uzaqlaştırğanlar içün ise, şubesiz cennet yekâne sığınılacaq yerdir."
        cid: 0
  - verse: 39
    segments:
      - text: "Senden qıyametni sorarlar: Kelip çatuvı ne vaqıt? (derler)."
        cid: 0
  - verse: 40
    segments:
      - text: "Sen onı ne yerden bilip, bildirejdeksiñ?"
        cid: 0
  - verse: 41
    segments:
      - text: "Onıñ soñ ilmi yalıñız Rabbiñye aittir."
        cid: 0
  - verse: 42
    segments:
      - text: "Sen ancaq ondan qorqqanlarnı tenbiyelersiñ."
        cid: 0
  - verse: 43
    segments:
      - text: "Kıyamet kunüni korgenlerinde, (dünyada) sadece bir aqşam vaqtı ya da quşluq vaqtı qadar yaşağan kibi sanarlar."
        cid: 0