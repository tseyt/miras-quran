surah_id: 79
language: crh
author: dizen-qurtnezir
verses:
  - verse: 13
    segments:
      - text: "Bu dönüş, sadece bir seslenüvge baqar."
        cid: 0
  - verse: 14
    segments:
      - text: "Birden ozlerini mahşerde bula qoyarlar."
        cid: 0
  - verse: 15
    segments:
      - text: "(Habibim!) Saña Musanıñ haberi keldimi?"
        cid: 0
  - verse: 16
    segments:
      - text: "Muqaddes vadiy Tuvaada Rabbi oña boyle seslengen:"
        cid: 0
  - verse: 17
    segments:
      - text: "Fıravunğa bar! Çünki, o çoq adden aştı. 18-19. De ki: Arınuvnı ve seni Rabbimniñ yoluna qavuştıruvımnı istersiñmi? Boylece, ondan qorqarsıñ."
        cid: 0
  - verse: 20
    segments:
      - text: "Ve oña eñ buyuk mucizeni kosterdi."
        cid: 0
  - verse: 21
    segments:
      - text: "(O ise) aman yalanladı ve isyan etti."
        cid: 0
  - verse: 22
    segments:
      - text: "Soñra (inkâr içün) bar ğayretini kostererek, sırtını çevirdi."
        cid: 0
  - verse: 23
    segments:
      - text: "Der’al (adamlarını) topladı ve (olarğa) bağırdı:"
        cid: 0
  - verse: 24
    segments:
      - text: "Men, siziñ eñ yuce Rabbiñizim! dedi."
        cid: 0
  - verse: 25
    segments:
      - text: "Allaһ onı, (er keske ibret olaraq) dünya ve ahiret azabınen cezalandırdı."
        cid: 0
  - verse: 26
    segments:
      - text: "Elbette, bunda, korqqan kimseler içün, buyuk bir ibret bar. 27-29. Sizni yaratmaq daa kuçmi, yoqsa, kok yuzüni yaratmaqmı ki, onı Allaһ bina etti, onı yukseltip, nizamğa qoydı. Gecesini qararttı, kundüzini ağarttı. 30-33. Ondan soñ da, yer qurresini töşedi. Ozüñiz ve ayvanlarıñız içün bir faydalanuv olmaq uzre, yerden suvnı ve otlağını çıqardı ve dağlarnı qavi bir şekilde yerleştirdi. 34-36. Er şeyni alt-ust etken o buyuk felâket kelgen vaqıtta, insan yapıp-etkenlerini hatırlaycaq kunü ve korgenge ceennem açıq bir şekilde kosterilgen vaqıtta; 37-39. Adden aşqanğa ve dünya ayatını ahiretten ustün korgenge, şubesiz, ceennem tek barınılacaq (sığınılacaq) yerdir. 40-41. Rabbiniñ maqamından qorqqan ve nefsini fena isteklerden uzaqlaştırğanlar içün ise, şubesiz cennet yekâne sığınılacaq yerdir."
        cid: 0
  - verse: 27
    segments:
      - text: "Senden qıyametni sorarlar: Kelip çatuvı ne vaqıt? (derler)."
        cid: 0
  - verse: 28
    segments:
      - text: "Sen onı ne yerden bilip, bildirejdeksiñ?"
        cid: 0
  - verse: 29
    segments:
      - text: "Onıñ soñ ilmi yalıñız Rabbiñye aittir."
        cid: 0
  - verse: 30
    segments:
      - text: "Sen ancaq ondan qorqqanlarnı tenbiyelersiñ."
        cid: 0
  - verse: 31
    segments:
      - text: "Kıyamet kunüni korgenlerinde, (dünyada) sadece bir aqşam vaqtı ya da quşluq vaqtı qadar yaşağan kibi sanarlar."
        cid: 0