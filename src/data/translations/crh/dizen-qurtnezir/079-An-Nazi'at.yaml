surah_id: 79
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >
          Söküp çıqrğanlarğa, yavaşça çekkenlerge, yaldağanlardan-yaldağanlarğa,
          yarışqandan-yarışqanlarğa, iş trtiplegenlerge ant olsun;
        cid: 0
  - verse: 2
    segments:
      - text: >
          [1 ayetine baq.]
        cid: 0
  - verse: 3
    segments:
      - text: >
          [1 ayetine baq.]
        cid: 0
  - verse: 4
    segments:
      - text: >
          [1 ayetine baq.]
        cid: 0
  - verse: 5
    segments:
      - text: >
          [1 ayetine baq.]
        cid: 0
  - verse: 6
    segments:
      - text: >
          Birinci üflev (kâinatnı) sarsqan, onı ekinci üflevni taqip etken künü, işte, o
          künü yürekler qayğıdan titrer, közler yorğun olur.
        cid: 0
  - verse: 7
    segments:
      - text: >
          [6 ayetine baq.]
        cid: 0
  - verse: 8
    segments:
      - text: >
          [6 ayetine baq.]
        cid: 0
  - verse: 9
    segments:
      - text: >
          [6 ayetine baq.]
        cid: 0
  - verse: 10
    segments:
      - text: >
          «Ölgenden soñ biz, (dünyadaki) ilki alımızğa qaytarılacaqmızmı, (em de) çürügen
          kemikler olğandan soñmı?» derler.
        cid: 0
  - verse: 11
    segments:
      - text: >
          [10 ayetine baq.]
        cid: 0
  - verse: 12
    segments:
      - text: >
          «O zaman bu, ziyanlı bir qaytuv olur», dediler.
        cid: 0
  - verse: 13
    segments:
      - text: >
          Bu dönüş, sadece bir seslenüvge baqar.
        cid: 0
  - verse: 14
    segments:
      - text: >
          Birden özlerini mahşerde bula qoyarlar.
        cid: 0
  - verse: 15
    segments:
      - text: >
          (Habibim!) Saña Musanıñ haberi keldimi?
        cid: 0
  - verse: 16
    segments:
      - text: >
          Muqaddes vadiy Tuvaada Rabbi oña böyle seslengen:
        cid: 0
  - verse: 17
    segments:
      - text: >
          Fıravunğa bar! Çünki, o çoq adden aştı.
        cid: 0
  - verse: 18
    segments:
      - text: >
          De ki: Arınuvnı ve seni Rabbimniñ yoluna qavuştıruvımnı istersiñmi? Böylece,
          ondan qorqarsıñ.
        cid: 0
  - verse: 19
    segments:
      - text: >
          [18 ayetine baq.]
        cid: 0
  - verse: 20
    segments:
      - text: >
          Ve oña eñ büyük mucizeni kösterdi.
        cid: 0
  - verse: 21
    segments:
      - text: >
          (O ise) aman yalanladı ve isyan etti.
        cid: 0
  - verse: 22
    segments:
      - text: >
          Soñra (inkâr içün) bar ğayretini köstererek, sırtını çevirdi.
        cid: 0
  - verse: 23
    segments:
      - text: >
          Der'al (adamlarını) topladı ve (olarğa) bağırdı:
        cid: 0
  - verse: 24
    segments:
      - text: >
          Men, siziñ eñ yüce Rabbiñizim! dedi.
        cid: 0
  - verse: 25
    segments:
      - text: >
          Allah onı, (er keske ibret olaraq) dünya ve ahiret azabınen cezalandırdı.
        cid: 0
  - verse: 26
    segments:
      - text: >
          Elbette, bunda, qorqqan kimseler içün, büyük bir ibret bar.
        cid: 0
  - verse: 27
    segments:
      - text: >
          Sizni yaratmaq daa küçmi, yoqsa, kök yüzüni yaratmaqmı ki, onı Allah bina etti,
          onı yükseltip, nizamğa qoydı. Gecesini qararttı, kündüzini ağarttı.
        cid: 0
  - verse: 28
    segments:
      - text: >
          [27 ayetine baq.]
        cid: 0
  - verse: 29
    segments:
      - text: >
          [27 ayetine baq.]
        cid: 0
  - verse: 30
    segments:
      - text: >
          Ondan soñ da, yer qurresini töşedi. Özüñiz ve ayvanlarıñız içün bir faydalanuv
          olmaq üzre, yerden suvnı ve otlağını çıqardı ve dağlarnı qavi bir şekilde
          yerleştirdi.
        cid: 0
  - verse: 31
    segments:
      - text: >
          [30 ayetine baq.]
        cid: 0
  - verse: 32
    segments:
      - text: >
          [30 ayetine baq.]
        cid: 0
  - verse: 33
    segments:
      - text: >
          [30 ayetine baq.]
        cid: 0
  - verse: 34
    segments:
      - text: >
          Er şeyni alt-üst etken o büyük felâket kelgen vaqıtta, insan yapıp-etkenlerini
          hatırlaycaq künü ve körgenge ceennem açıq bir şekilde kösterilgen vaqıtta;
        cid: 0
  - verse: 35
    segments:
      - text: >
          [34 ayetine baq.]
        cid: 0
  - verse: 36
    segments:
      - text: >
          [34 ayetine baq.]
        cid: 0
  - verse: 37
    segments:
      - text: >
          Adden aşqanğa ve dünya ayatını ahiretten üstün körgenge, şübesiz, ceennem tek
          barınılacaq (sığınılacaq) yerdir.
        cid: 0
  - verse: 38
    segments:
      - text: >
          [37 ayetine baq.]
        cid: 0
  - verse: 39
    segments:
      - text: >
          [37 ayetine baq.]
        cid: 0
  - verse: 40
    segments:
      - text: >
          Rabbiniñ maqamından qorqqan ve nefsini fena isteklerden uzaqlaştırğanlar içün
          ise, şübesiz cennet yekâne sığınılacaq yerdir.
        cid: 0
  - verse: 41
    segments:
      - text: >
          [40 ayetine baq.]
        cid: 0
  - verse: 42
    segments:
      - text: >
          Senden qıyametni sorarlar: Kelip çatuvı ne vaqıt? (derler).
        cid: 0
  - verse: 43
    segments:
      - text: >
          Sen onı ne yerden bilip, bildireceksiñ?
        cid: 0
  - verse: 44
    segments:
      - text: >
          Onıñ soñ ilmi yalıñız Rabbiñe aittir.
        cid: 0
  - verse: 45
    segments:
      - text: >
          Sen ancaq ondan qorqqanlarnı tenbiyelersiñ.
        cid: 0
  - verse: 46
    segments:
      - text: >
          Kıyamet kününi körgenlerinde, (dünyada) sadece bir aqşam vaqtı ya da quşluq
          vaqtı qadar yaşağan kibi sanarlar.
        cid: 0
