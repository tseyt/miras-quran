  - verse: 106
    segments:
      - text: "Bahtlı olğanlarga kelgende, olar da cennettedirler. Rabbiniñ istegeninden başqa, kokler ve yer turğance, olar da o yerde ebediy qalacaqlar. Bu (nimetler) bitmez, tükenmez bir lütftir. (Bu ayetlerde belli mudetniñ soñuna irişüvi ile kelecek qıyamet kunünden ve bunı taqip etecek ahiret allarından baas etilgeni içün, bu yerdeki kokler ve yerden dünyanıñ degil ahiretniñ kokleri ve yeridir. Çünki, İbrahim suresinıñ 48nci ayetinde: «O kunü yer başqa bir yernen, kokler de (başqa koklernen) deñiştrilir», buyurılğan)."
        cid: 0
  - verse: 107
    segments:
      - text: "O alda, olarnıñ tabınğan şeylerinden (bu şeylerniñ olarnı azapqa alıp barğanından) şubeñ olmasın. Çünki, olar ancaq daa evel babalarınıñ tabınğanı kibi tabınmaqtalar. Biz olarnıñ (azaptan) nasiplerini mıtlaqa eksikzis olaraq berecekmiz."
        cid: 0
  - verse: 108
    segments:
      - text: "Ant olsun, biz Musağa Kitapnı berdik; faqat onda ihtilâf etildi. Eger Rabbiñden bir söz keçmegen olsa edi, elbette olarnıñ arasında uküm berilgen edi (ve işleri de bitirilgen edi). Şubesiz ki, olar (mekkeliler) de Qur’an aqqında teren bir şube içindeler."
        cid: 0
  - verse: 109
    segments:
      - text: "Şubesiz, Rabbiñ olarnıñ er biriniñ amelleri qarşılığını olarğa tamamınen berecek. Çünki, Rabbiñ yapayatqanlarından haberdardır."
        cid: 0
  - verse: 110
    segments:
      - text: "O alda, sennen beraber tövbe etkenlernen birlikte, emir olunğanı kibi, dos-doğru ol! Adden de aşmañ. Çünki, O, siziñ yapqanlarıñıznı çoq yahşı korücidir. (Ashab-ı kiramdan rivayet etilgenine kore, Qur’anda Resulullah (s.a.) içün bu ayetten daa şiddetli bir ayet enmegen. Resulullah buyurğan ki: «Meni һuud suresi qartayttı!!» Çünki, bu surede oña: «Emir olunğanıñ kibi dos-doğru ol!» denilgen. Ve bu qolay bir iş degil edi. Allaһ Taalâ yalıñız oña degil, onıñnen beraber, mu’minlerge de istiqametni emir etmekte)."
        cid: 0
  - verse: 111
    segments:
      - text: "Zulum etkenlerge meyl etmeñ; soñra sizge ateş toqunır (ceennemde yanarsıñız). Siziñ Allaһtan başqa dostlarıñız yoqtır. Soñra (Ondan da) yardım koralmazsıñız!"
        cid: 0
  - verse: 112
    segments:
      - text: "Kundüzniñ eki ucunda, geceniñ de ilk saatlarında namaz qıl. Çünki, yahşılıqlar fenalıqlarnı (gunahlarnı) siler. Bu, ogüt almaq istegenlerge bir hatırlatuvdır. (Tefsircilerge kore, kundüzniñ eki tarafındaki namazlar - saba, uyle ve ekindi; geceniñ yaqın saatlarındakiler de, aqşam ve yatsı namazlarıdır. Ayette bildirilgen yahşılıqlardan biri - beş vaqıt namazdır. Resulullah (s.a.) buyurğan ki: Ne dersiñiz, sizden birisiniñ qapusı ogünde bir irmaq bulunsa da, er kun beş kere onda yiqansa, ozünde kir adında bir şey qalırmı? Ashab «Öq» dedi. Bunıñ uzerine Resulullah buyurdı ki: İşte, beş vaqıt namaz da bunıñ kibidir ki, Allaһ o sayede butün hatalarnı arındırır)."
        cid: 0
