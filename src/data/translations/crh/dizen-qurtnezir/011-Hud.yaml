  - verse: 119
    segments:
      - text: "Ancaq, Rabbiniñ merhamet etkenleri istisnadır. Zaten, Rabbiñ olarnı bunıñ içün yarattı. Rabbiniñ: «Ant olsun ki, ceennemni butünley insanlar ve cinlernen tolduracam», sözü yerini taptı. (Tefsirciler ayette keçken «Li-zaalike - bunıñ içün” sözüne eki türlü mana bergenler: - «Zaten Rabbiñ olarnı bunıñ içün, yani ihtilâfqa tüşkenleri içün yarattı»», ya da: - «Zaten Rabbiñ olarnı bunıñ içün, yani rahmetine nail oluvları içün yarattı»»)."
