        cid: 0
  - verse: 41
    segments:
      - text: "Bizim yer yuzüne kelip, onı uclarından eksiltkenimizni kormedilermi? Allaһ (istegeni kibi) uküm eter, Onıñ ukmini bozacaq kimse yoqtır. Ve O, esapnı çabuk korücidir. (Ayette zikr etilgen yerniñ uclarınıñ eksiltilüvi vaqiasını evelki tefsirciler micaziy mananı nazar-itibarğa alaraq, kâfirler memleketleriniñ fethi ile olarnıñ topraqlarınıñ azaluvı, musulmanlarnıñkiniñ ise, çoqlaşuvı şeklinde yorumlağanlar. Ancaq, ayetniñ aqiqiy manasınıi koz ogüne alsaq, yerniñ uclarından eksiltilüvi erroziya dedigimiz topraqnıñ yağmur, sel ve ruzgâr kibi, tabiiy kuçlerniñ tesirinen yerinden tayuvı, dağlarnıñ ve töpelerniñ erroziyası şeklinde yorumlana bilecegi kibi, yer qurresinde meydanğa kelgen vaqialar neticesinde qurre aciminiñ eksilüvi şekilde de yorumlana bilir)."
