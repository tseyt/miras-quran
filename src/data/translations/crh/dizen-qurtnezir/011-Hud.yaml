surah_id: 11
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >
          Elif. Lâam. Raa. (Bu saña endirlgen), ikmet saibi (ve) er şeyden haberdar olğan
          (Allah) tarafından ayetleri quvetlendirilgen, soñra da añlatılğan bir kitaptır.
        cid: 0
  - verse: 2
    segments:
      - text: >
          (De ki: Bu Kitap) «Allahtan başqasına ibadet etmemeñiz içün (endirildi). Şübesiz
          ki, men onıñ tarafından sizge (yollanılğan) bir tenbiyeci ve müjdeleyiciyim.
        cid: 0
  - verse: 3
    segments:
      - text: >
          Ve Rabbiñizden mağfiret tileviñiz, soñra da, oña tövbe etüviñiz içün (endirildi.
          Eger bu emir olunğanlarnı yapsañız), Allah sizni, tayin etilgen bir müddetkece,
          güzel bir şekilde yaşatır, ziyadesini yapqan er keske de, eyiliginiñ qarşılığını
          berir. Eger yüz çevirseñiz, men siziñ başınızğa kelecek büyük bir künniñ
          azabından qorqam».
        cid: 0
  - verse: 4
    segments:
      - text: >
          Dönüşiñiz yalıñız Allahqadır. O, er şeyge qadirdir.
        cid: 0
  - verse: 5
    segments:
      - text: >
          Bilesiñiz ki, olar Peyğamberden, (duşmanıqlarını) gizlevleri içün köküslerini
          çevirirler (goñülerinden keçkenni gizlerler). Yahşı biliñ ki, olar urbalarına
          bürüngen vaqıtlarında bile, Allah olarnıñ gizlegenlerini de, aşkâr etkenlerini
          de bilir. Çünki, O, qalplerniñ özüni bilicidir.
        cid: 0
  - verse: 6
    segments:
      - text: >
          Yer yüzünde yürgen er canlınıñ rızqı yalıñız Allahnıñ üzerinedir. Allah o
          canlınıñ turğan yerini ve soñunda bıraqılacaq mekânını bilir. (Bularnıñ) episi
          açıq bir kitapta (levh-i mahfuzda)dır.
        cid: 0
  - verse: 7
    segments:
      - text: >
          O, angiñizniñ ameli daa güzel olacağı hususında sizni imtian etmek içün, Arşnı,
          suv üzerinde olğanda, köklerni ve yerni altı künde yaratqan. Yemin eterim ki,
          (Resulım!): «Ölümden soñ mıtlaqa tiriltileceksiñiz», deseñ, kâfir olğanlar
          der'al: «Bu açıq bir ırımdan başqa bir şey degil», derler. (Köklerniñ ve yerniñ
          altı künde yaratıluvı meselesi içün A'raaf suresiniñ 54- nci ayetiniñ izaatına
          baqıñ. Arş - Kâinattaki bütün cısımlarnı sarıp alğan ve maiyetini biz bilalmağan
          bir şeydir. Tefsircilerniñ bu ayetnen bağlı añlatuvına köre, Allah Taalâ evelâ
          Arşnı, soñra suvnı, daa soñra da, köklerni ve yerni yaratqan. Arşnıñ suv üstünde
          oluvıt - onıñnen bitişik oluvı manasında degil. Bunıñ kibi köklerniñ de yerniñ
          üzerinde olğanı söylenir, faqat bunıñnen köknen yerniñ bitişik olğanı
          añlanılmaz).
        cid: 0
  - verse: 8
    segments:
      - text: >
          Ant olsun, eger biz olardan azapnı belli bir müddetke qadar keçiktirsek,
          mıtlaqa: «Onıñ kelüvine mani olğan nedir?», derler. Bilesiñiz ki, özlerine azap
          kelgen künü, bir daa olardan uzaqlaştırılacaq degil. Ve alay eteyatqan şeyi
          olarnıñ çevresini sarıp alacaq.
        cid: 0
  - verse: 9
    segments:
      - text: >
          Eger insanğa tarafımızdan bir rahmet (nimet) tattırır da, soñ bunı ondan çekip
          alır isek, bütünley ümütsiz ve nankor olur.
        cid: 0
  - verse: 10
    segments:
      - text: >
          Eger özüne toqunğan bir zarardan soñ, oña bir nimet tattırsaq, elbette:
          «Yamanlıqlar menden ketti», der. Çünki, o (bunı der eken) qopayçoradır,
          kibirlidir.
        cid: 0
  - verse: 11
    segments:
      - text: >
          Ancaq (musibetlerge) sabır etip, güzel iş yapqanlar böyle degil. İşte, olar içün
          bir bahşış ve büyük mükâfat bar.
        cid: 0
  - verse: 12
    segments:
      - text: >
          Belki de, sen (müşriklerniñ:) «Oña (kökten) bir hazine endirilse edi ya da
          onıñnen beraber bir melek kelse edi!», deyüvlerinden ötrü, saña vahiy olunğan
          ayetlerniñ bir qısmını (tebliğatını) terk eteceksiñ ve bu sebebten, ruhıñ
          sıqılacaq. (Yahşı bil ki), sen ancaq bir tenbiyecisiñ. Allah ise, er şeyge
          vekildir. (Müşrikler vaqtı-vaqtınen Az.Peyğamberden kökten hazineler endirüvi,
          özlerine bir melek yollanıluvı kibi, adden aşır şeyler istey ve olarnıñ bu
          inatlıq ve inkârcılıq davranuvları Rusulullahnı soñ derece kederlendire edi.
          Çünki, olarğa mucize köstergende, bunıñ bir tılsım olğanını söyleyerek, kene
          inkârcılıqta devam ete ediler. İşte, yuqaradaki ayet olarnıñ bu olmaycaq
          tavurları qarşısında Allahnıñ ayetlerini tebliğden vazgeçmemesi hususında
          Az.Peyğamberni tenbiyelemekte, onıñ vazifesi bu olğanını, digeriniñ Allahqa ait
          olğanını bildirmekte).
        cid: 0
  - verse: 13
    segments:
      - text: >
          Yoqsa: «Onı (Qur'annı) özü uydırdı», deylermi? De ki: Eger doğru iseñiz ,
          Allahtan başqa çağıra bilgenleriñizni (yardımğa) çağırıñ da, siz de onıñ kibi
          uydurılğan on sure ketiriñ. (Bu küreşke davetniñ arapçanı eñ güzel bir şekilde
          qullanğanlarğa yönetilüvi diqatqa lâyıqtır. Daa soñunda engen ayet-i
          kerimelerniñ bu mıqdar üç ayetke qadar azaltılğanına rağmen, olar buña da
          cesaret etalmağanlar ve qılıçnen qarşılıq bermek zorunda qalğanlar. Bu netice
          Qur'annıñ Allah kelâmı olğanına büyük bir delildir).
        cid: 0
  - verse: 14
    segments:
      - text: >
          Eger (olar) sizge cevap berip olalmay ekenler, biliñ ki, o ancaq Allahnıñ
          ilminen endirilgendir ve Ondan başqa tañrı yoqtır. Artıq siz musulman
          olmaqtasıñızmı?
        cid: 0
  - verse: 15
    segments:
      - text: >
          Kim, (yalıñız) dünya ayatını ve ziynetini istemekte ise, işleriniñ qarşılığını o
          yerde olarğa tamamınen berirmiz ve o yerde olar iç bir zararğa oğratılmazlar.
        cid: 0
  - verse: 16
    segments:
      - text: >
          İşte, olar ahirette özleri içün ateşten başqa iç bir şeyleri olmağan
          kimselerdir; (dünyada) yapqanları da boşuna ketkendir; yapayatqan şeyleri
          (zaten) batıldır.
        cid: 0
  - verse: 17
    segments:
      - text: >
          Rabbiñ tarafından (kelgen) açıq bir delilge tayanğan ve özüni Rabbiñden bir
          şaatnıñ taqip etken, ayrıca özünden evel, bir reber ve bir rahmet olaraq,
          Musanıñ Kitabı (elinde) olğan kimse (inkârcılar kibi)mi? Çünki, bular oña
          (Qur'anğa) inanırlar. Toplumlardan angisi onı inkâr etse, işte, ceennem ateşi
          onıñ baracaq yeridir, bundan şübeñ olmasın; zira bu, seniñ Rabbiñ tarafından
          bildirilgen aqiqattır; faqat insanlarnıñ çoqu inanmazlar. (Bu ayet-i kerimede
          bir qıyaslama yapılmaqta. Böyle ki: Qur'an-ı Kerim kibi pek parlaq bir delilge,
          bu delilni tasdiq etken bir şaatqa yani mucizege ve inançlarnıñ sağlamlığını
          köstergen semaviy kitaplardan biri olğan Tevratnıñ şaatlığına saip olğan
          peyğambernen bularnı inkâr etken ve sadece dünya ayatından başqa bir şey
          istemegen bir kâfirniñ deñk (musaviy) olamaycağı bildirilmekte. Çünki, bularnıñ
          biri Allahnıñ seçken qulı ve Allahqa inanğan, tolayısınen, dünya ve ahiret
          saadetini qazanğan kimsedir; digeri ise, inkâr etken, tolayısınen, ebediy azapnı
          qazanğan kimsedir).
        cid: 0
  - verse: 18
    segments:
      - text: >
          Kim Allahqa nisbeten yalan uydurğandan daa zalım ola bilir? Olar (qıyamet
          kününde) Rabblerine arz etilecekler, şaatlar da: İşte, bular Rabblerine qarşı
          yalan söylegenlerdir, deycekler. Biliñ ki, Allahnıñ lâneti zalımlarnıñ
          üzerinedir!
        cid: 0
  - verse: 19
    segments:
      - text: >
          Olar, (insanlarnı) Allahnıñ yolundan çıqarğan ve onı qıyış köstermek
          istegenlerdir. Ahiretni inkâr eticiler de olardır.
        cid: 0
  - verse: 20
    segments:
      - text: >
          Olar yer yüzünde (Allahnı) aciz bıraqacaq degiller; olarnıñ Allahtan başqa
          (yardım isteycek) dostları da yoqtır. Olarnıñ azabı qat-qat olacaq. Çünki, olar
          (aqiqatlarnı) ne köre bile, ne de qulaq asa ediler.
        cid: 0
  - verse: 21
    segments:
      - text: >
          İşte, olar özlerini ziyanğa oğrattılar. Uydurayatqan şeyleri de özlüginden ğayıp
          olup ketti.
        cid: 0
  - verse: 22
    segments:
      - text: >
          Şübesiz, olar ahirette eñ çoq ziyanğa oğraycaqlar.
        cid: 0
  - verse: 23
    segments:
      - text: >
          İnanıp da, güzel işler yapqan ve Rabblerine goñülden boyun eggenlerge kelgende,
          işte, olar cennet ehlidir. Olar o yerde ebediy qalırlar.
        cid: 0
  - verse: 24
    segments:
      - text: >
          Bu eki toplulıqnıñ (mü'minlernen kâfirlerniñ) vaziyeti, kör ve sağırnen körgen
          ve eşitken kimseler kibidir. Bularnıñ alı iç bir çeşit olurmı? Alâ ibret
          almaysızmı? (Sureniñ bu yerge qadar olğan bölüminde itiqadnen bağlı esaslar,
          Qur'annıñ mucize olğanı, inanmağanlarnıñ ahiretteki vaziyetleri, cezaları; buña
          qarşılıq, inanğanlarnıñ mükâfatları añlatıldı ve olarnıñ cennet ehli olğanları
          bildirildi. Niayet, bu eki toplulıq bediiy bir teşbih ile insanlıqnıñ
          tefekkürine avale olundı ve olar tüşünmege davet etildiler. Bundan soñki
          bölümlerde, ibret olaraq, bazı peyğamberlerniñ ayatları, tevhid inançını yaymaq
          içün küreşleri, qavmlarınıñ bularğa nisbeten areketleri ve meydanğa kelgen
          vaziyetlerniñ neticileri añlatılmaqta).
        cid: 0
  - verse: 25
    segments:
      - text: >
          Ant olsun, biz Nuhnı qavmına elçi yolladıq. Olarğa: «Men (dedi), siz içün
          ap-açıq bir tenbiyeciyim.
        cid: 0
  - verse: 26
    segments:
      - text: >
          Allahtan başqasına tabınmañ! Men sizge (kelecek) elem berici bir künniñ
          azabından qorqmaqtam».
        cid: 0
  - verse: 27
    segments:
      - text: >
          Qavmından ileri kelgen kâfirler dediler ki: «Biz seni, sadece bizim kibi bir
          insan olaraq körmektemiz. Bizden addiy körüşnen areket etken alt tabaqamızdan
          başqasınıñ saña uyğanını körmeymiz. Ve siziñ bizge nisbeten bir üstünligiñizni
          de körmeymiz. Aksine, siziñ yalancılar olğanıñıznı tüşünmektemiz». («Mele'»
          kelimesi - ileri kelgenler, eşraf, elita tabaqa manasındadır. Qur'an-ı Kerim
          diqqatnen talil etilgende, bütün peyğamberlerniñ qarşılarında Fıravun kibi bir
          tağutnıñ ve oña aqıl ocalığı yapqan bir toplulıqnıñ barlığı körülir.
          Zamanlarınıñ er türlü maddiy imkânlarını ellerinde bulundırğan bu yüksek tabaqa,
          menfaatlarını ğayıp etmemek içün, inanğanlarnı faqırlıq ve zelillikte suçlamaq
          yolunı tutqan ediler. Soñki peyğamber zamanında aynı vaziyet ceryan etken, oña
          faqır ve addiy kimselerniñ inanğanlarını manaçıq eterek, qarşı çıqqan ediler).
        cid: 0
  - verse: 28
    segments:
      - text: >
          (Nuh) dedi ki: Ey, qavmım! Eger men Rabbim tarafından (bildirilgen) açıq bir
          delil üzerinde olsam ve O maña öz qatından bir rahmet bergen de, bu sizge gizli
          tutılğan ise, buña ne dersiñiz? Siz onı istemegeniñiz alda, biz sizni oña
          zorlaycaqmızmı?
        cid: 0
  - verse: 29
    segments:
      - text: >
          Ey, qavmım! Allahnıñ emirlerini bildirmege qarşılıq sizden bir türlü mal
          istemeyim. Menim mükâfatım ancaq Allahqa aittir. Men iman etkenlerni quvacaq
          degilim; çünki, olar Rabblerine qavuşacaqlar. Faqat men sizni bilgisizliknen
          davranğan bir toplulıq olaraq körmektem. (Az.Nuhnıñ qavmı inanğan faqır
          kimselerge muracaat etmey ve olarnen beraber olmaq istemey edi. Bunıñ içün Nuh
          (a.s.)nıñ olarnı yanından quvmasını teklif ettiler. O büyük peyğamber, elbette
          caillerniñ sözlerine baqıp, Allahqa iman etken, Allah qatında degerli kimselerni
          yanından quvacaq degil edi).
        cid: 0
  - verse: 30
    segments:
      - text: >
          Ey, qavmım! Men olarnı quvsam, meni Allahtan (onıñ azabından) kim qorçalar?
          Tüşünmeysiñizmi?
        cid: 0
  - verse: 31
    segments:
      - text: >
          Men sizge: «Allahnıñ hazineleri menim yanımda», demeyim, ğaybnı da bilmem. «Men
          bir melekim», de demeyim. Siziñ közleriñiz hor körgen kimseler içün: «Allah
          olarğa asla bir hayır bermeycek», dep olamam. Olarnıñ qalplerinde olğannı Allah
          daa yahşı bilir. Olarnı quvğan taqdirimde, men aqiqaten zalımlardan olurım».
        cid: 0
  - verse: 32
    segments:
      - text: >
          Dediler ki: Ey, Nuh! Biznen küreştiñ ve bizge qarşı küreşte çoq ileri kettiñ.
          Eger doğrulardan iseñ, onıñnen bizni tehdit etken (azapnı) bizge ketir!
        cid: 0
  - verse: 33
    segments:
      - text: >
          (Nuh) dedi ki: «Onı sizge, ancaq istese, Allah ketirir ve siz (Allahnı) aciz
          bıraqacaq degilsiñiz.
        cid: 0
  - verse: 34
    segments:
      - text: >
          Eger Allah sizni yoldan azdırmaq istey ise, men sizge ögüt bermek istesem de,
          ögütim sizge fayda bermez. (Çünki) o siziñ Rabbiñizdir. Ve (niayet) Oña
          döndürileceksiñiz».
        cid: 0
  - verse: 35
    segments:
      - text: >
          (Resulım!) Yoqsa: «Bunı uydurdı», deylermi? De ki: «Eger onı uydurğan isem,
          günahım maña aittir. Faqat men siz işlegen günahıñızdan uzaqım».
        cid: 0
  - verse: 36
    segments:
      - text: >
          Nuhqa vahiy olundı ki: Qavmıñdan iman etkenlerden başqası, artıq (saña) asla
          inanmaycaq. Öyle ise, olarnıñ işleyatqanlarından (günahlarından) tolayı
          kederlenme.
        cid: 0
  - verse: 37
    segments:
      - text: >
          Közlerimizniñ ögünde ve vahiyimiz (emrimiz) esasında gemini yap ve zulum
          etkenler aqqında maña (bir şey) söyleme! Olar mıtlaqa boğulacaqlar.
        cid: 0
  - verse: 38
    segments:
      - text: >
          Nuh gemini yapa, qavmından ileri kelgenler ise, yanına er oğrağanlarında,
          onıñnen alay ete ediler. De ki: «Eger biznen alay ete iseñiz, yahşı biliñ ki,
          siz nasıl alay etseñiz, biz de siznen alay etecekmiz!
        cid: 0
  - verse: 39
    segments:
      - text: >
          Özüni rezil etecek azapnıñ kimge kelecegini ve devamlı bir azapnıñ kimniñ başına
          tüşecegini yaqında bileceksiñiz".
        cid: 0
  - verse: 40
    segments:
      - text: >
          Niayet, emrimiz kelip de, suvlar coşup, yükselmege başlağanınen, Nuhqa dedik ki:
          «(Canlı çeşitleriniñ) er birinden eki çiftnen -(boğulacağına dair) aleyhinde söz
          etilgenlerden ğayrı- aileñni ve iman etkenlerni gemige yükle!» Zaten, onıñnen
          beraber pek azı iman etken edi. (Bu yerdeki «suvlar coşup, yükselmege
          başlağanınen» qısmını «tandır (tennuur) qaynağanınen» şeklinde tercime etkenler
          de olğan. Tefsirciler tandırnıñ qaynavunı çeşit şekillerde tefsir etkenler.
          Soñki asırnıñ tefsircelirinden M.Hamdi Yazır Az.Nuhnıñ gemisi addiy yelkenli bir
          gemi olmayıp, buharlı bir gemi olğanına işaret ete ki, buña köre, «tandır
          qaynadı» demek, geminiñ ocağı yandı ve areketke azır vaziyetke ketirildi, demek
          olur).
        cid: 0
  - verse: 41
    segments:
      - text: >
          (Nuh) dedi ki: «Gemige miniñ! Onıñ yaldap ketüvi de, toqtaması da, Allahnıñ
          adınendir. Şübesiz ki, Rabbim çoq bağışlayıcı, pek merhamet eticidir».
        cid: 0
  - verse: 42
    segments:
      - text: >
          Gemi, dağlar kibi dalğalar arasında olarnı alıp kete edi. Nuh gemiden uzaqta
          bulunğan oğluna: Yavruçığım! (Sen de) biznen beraber min, kâfirlernen beraber
          olma! diye seslendi. (Az.Nuhnıñ oğlu babasına iman etmegen edi. Babası
          inanğanlarnı gemige mindirgende, o ayrılıp, bir kenarğa çekilgen edi. Diger
          oğulları Haam, Saam ve Yaafes babalarına inanğan ve onıñnen beraber gemige
          mingen ediler. Türkiy halqlarnıñ Yaafesniñ Türk adındaki oğlundan darqağanı
          rivayet etile).
        cid: 0
  - verse: 43
    segments:
      - text: >
          Oğlu: Meni suvdan qorçalaycaq bir dağğa sığınacağım, dedi. (Nuh): «Bugün
          Allahnıñ emrinden (azabından), merhamet saibi Allahtan başqa qorçalaycaq kimse
          yoqtır», dedi. Aralarına dalğa kirdi, böylece o da boğuldı. (Bu ayetke böyle de
          mana berilgen: «Bugün Allah, merhamet etkenlerinden başqasını Onıñ berecek
          emrinden qorçalaycaq kimse yoqtır»).
        cid: 0
  - verse: 44
    segments:
      - text: >
          (Niayet): «Ey yer, suvıñnı yut! Ve, ey, kök (suvnı) tut!», denildi. Suv çekildi;
          iş bitirildi; (gemi de) Cudiy (dağınıñ) üstüne yerleşti. Ve: «O zalımlar
          toplulığınıñ canı ceennemge!» denildi.
        cid: 0
  - verse: 45
    segments:
      - text: >
          Nuh Rabbine dua etip, dedi ki: «Ey, Rabbim! Şübesiz, oğlum da ailemdendir. Seniñ
          vadeñ ise, elbette haqtır. Sen hakimler hakimisiñ». (Az.Nuh bunı aytqanda, Allah
          onıñ ailesini boğuluvdan qurtaracağına ait vadesine işaret ete edi).
        cid: 0
  - verse: 46
    segments:
      - text: >
          Allah buyurdı ki: Ey, Nuh! O asla seniñ aileñden degil. Çünki, onıñ yapqanı fena
          bir iştir. O alda, aqqında bilgiñ olmağan bir şeyni menden isteme! Men saña
          caillerden olmamañnı tevsiye etem. (Bu ayetten añlaşıla ki, insanlar arasındaki
          yaqınlıqnıñ asıl sebebi, din birligidir. Allahnıñ dinine inanğan ve
          peyğamberlerini tasdiq etken kimseler bir-birileriniñ maneviy aqrabası, yaqını
