surah_id: 11
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "Elif. Lâam. Raa. (Bu saña endirlgen), ikmet saibi (ve) er şeyden haberdar olğan (Allaһ) tarafından ayetleri quvetlendirilgen, soñra da añlatılğan bir kitaptır."
        cid: 0
  - verse: 2
    segments:
      - text: "(De ki: Bu Kitap) «Allaһtan başqasına ibadet etmemeñiz içün (endirildi). Şubesiz ki, men onıñ tarafından sizge (öllanılğan) bir tenbiyeci ve mujdeleyiciyim."
        cid: 0
  - verse: 3
    segments:
      - text: "Ve Rabbiñizden mağfiret tileviñiz, soñra da, oña tövbe etüviñiz içün (endirildi. Eger bu emir olunğanlarnı yapsañız), Allaһ sizni, tayin etilgen bir muddetkece, guzel bir şekilde yaşatır, ziyadesini yapqan er keske de, eyiliginiñ qarşılığını berir. Eger yuz çevirseñiz, men siziñ başınızğa kelecek buyuk bir kunniñ azabından qorqam»."
        cid: 0
  - verse: 4
    segments:
      - text: "Dönüşiñiz yalıñız Allaһqadır. O, er şeyge qadirdir."
        cid: 0
  - verse: 5
    segments:
      - text: "Bilesiñiz ki, olar Peyğamberden, (duşmanıqlarını) gizlevleri içün koküslerini çevirirler (goñyulerinden keçkenni gizlerler). Yahşı biliñ ki, olar urbalarına burüngen vaqıtlarında bile, Allaһ olarnıñ gizlegenlerini de, aşkâr etkenlerini de bilir. Çünki, O, qalplerniñ ozüni bilicidir."
        cid: 0
  - verse: 6
    segments:
      - text: "Yer yuzünde yurgen er canlınıñ rızqı yalıñız Allaһnıñ uzerinedir. Allaһ o canlınıñ turğan yerini ve soñunda bıraqılacaq mekânını bilir. (Bularnıñ) episi açıq bir kitapta (levh-i mahfuzda)dır."
        cid: 0
  - verse: 7
    segments:
      - text: "O, angiñizniñ imeli daa guzel olacağı hususında sizni imtian etmek içün, Arşnı, suv uzerinde olğanda, koklerni ve yerni altı kunde yaratqan. Yemin eterim ki, (Resulım!): «Olümden soñ mıtlaqa tiriltileceksiñiz», deseñ, kâfir olğanlar der’al: «Bu açıq bir ırımdan başqa bir şey degil», derler. (Koklerniñ ve yerniñ altı kunde yaratıluvı meselesi içün A’raaf suresiniñ 54nci ayetiniñ izaatına baqıñ. Arş - Kâinattaki butün cısımlarnı sarıp alğan ve maiyetini biz bilalmağan bir şeydir. Tefsircilerniñ bu ayetnen bağlı añlatuvına kore, Allaһ Taalâ evelâ Arşnı, soñra suvnı, daa soñra da, koklerni ve yerni yaratqan. Arşnıñ suv ustünde oluvıt - onıñnen bitişik oluvı manasında degil. Bunıñ kibi koklerniñ de yerniñ uzerinde olğanı söylenir, faqat bunıñnen koknen yerniñ bitişik olğanı añlanılmaz)."
        cid: 0
  - verse: 8
    segments:
      - text: "Ant olsun, eger biz olardan azapnı belli bir muddetke qadar keçiktirsek, mıtlaqa: «Onıñ kelüvine mani olğan nedir?», derler. Bilesiñiz ki, ozlerine azap kelgen kunü, bir daa olardan uzaqlaştırılacaq degil. Ve alay eteyatqan şeyi olarnıñ çevresini sarıp alacaq."
        cid: 0
  - verse: 9
    segments:
      - text: "Eger insanğa tarafımızdan bir rahmet (nimet) tattırır da, soñ bunı ondan çekip alır isek, butünley umütsiz ve nankor olur."
        cid: 0
  - verse: 10
    segments:
      - text: "Eger ozüne toqunğan bir zarardan soñ, oña bir nimet tattırsaq, elbette: «Yamanlıqlar menden ketti», der. Çünki, o (bunı der eken) qopayçoradır, kibirlidir."
        cid: 0
  - verse: 11
    segments:
      - text: "Ancaq (musibetlerge) sabır etip, guzel iş yapqanlar boyle degil. İşte, olar içün bir bahşış ve buyuk mukâfat bar."
        cid: 0
  - verse: 12
    segments:
      - text: "Belki de, sen (muşriklerniñ:) «Oña (kokten) bir hazine endirilse edi ya da onıñnen beraber bir melek kelse edi!», deyuvlerinden otrü, saña vahiy olunğan ayetlerniñ bir qısmını (tebliğatını) terk eteceksiñ ve bu sebebten, ruhıñ sıqılacaq. (Yahşı bil ki), sen ancaq bir tenbiyecisiñ. Allaһ ise, er şeyge vekildir. (Muşrikler vaqt-vaqtınen Az.Peyğamberden kokten hazineler endirüvi, ozlerine bir melek yollanıluvı kibi, adden aşır şeyler istey ve olarnıñ bu inatlıq ve inkârcılıq davranuvları Rusulullahnı soñ derece kederlendire edi. Çünki, olarğa mucize kostergende, bunıñ bir tılsım olğanını söyleyerek, kene inkârcılıqta devam ete ediler. İşte, yuqaradaki ayet olarnıñ bu olmaycaq tavurları qarşısında Allaһnıñ ayetlerini tebliğden vazgeçmemesi hususında Az.Peyğamberni tenbiyelemekte, onıñ vazifesi bu olğanını, digeriniñ Allaһqa ait olğanını bildirmekte)."
        cid: 0
  - verse: 13
    segments:
      - text: "Yoqsa: «Onı (Qur’annı) ozü uydırdı», deylermi? De ki: Eger doğru iseñiz , Allaһtan başqa çağıra bilgenleriñizni (yardımğa) çağırıñ da, siz de onıñ kibi uydurılğan on sure ketiriñ. (Bu kureşke davetniñ arapçanı eñ guzel bir şekilde qullanğanlarğa yonetilüvi diqatqa lâyıqtır. Daa soñunda engen ayet-i kerimelerniñ bu mıqdar uçv ayetke qadar azaltılğanına rağmen, olar buña da cesaret etalmağanlar ve qılıçnen qarşılıq bermek zorunda qalğanlar. Bu netice Qur’annıñ Allaһ kelâmı olğanına buyuk bir delildir)."
        cid: 0
  - verse: 14
    segments:
      - text: "Eger (olar sizge cevap berip olalmay ekenler, biliñ ki, o ancaq Allaһnıñ ilminen endirilgendir ve Ondan başqa tañrı yoqtır. Artıq siz musulman olmaqtasıñızmı?"
        cid: 0
  - verse: 15
    segments:
      - text: "Kim, (yalıñız) dünya ayatını ve ziynetini istemekte ise, işleriniñ qarşılığını o yerde olarğa tamamınen berirmiz ve o yerde olar iç bir zararğa oğratılmazlar."
        cid: 0
  - verse: 16
    segments:
      - text: "İşte, olar ahirette ozleri içün ateşten başqa iç bir şeyleri olmağan kimselerdir; (dünyada) yapqanları da boşuna ketkendir; yapayatqan şeyleri (zaten) batıldır."
        cid: 0
  - verse: 17
    segments:
      - text: "Rabbiñ tarafından (kelgen) açıq bir delilge tayanğan ve ozüni Rabbiñden bir şaatnıñ taqip etken, ayrıca ozünden evel, bir reber ve bir rahmet olaraq, Musanıñ Kitabı (elinde) olğan kimse (inkârcılar kibi)mi? Çünki, bular oña (Qur’anğa) inanırlar. Toplumlardan angisi onı inkâr etse, işte, ceennem ateşi onıñ baracaq yeridir, bundan şubeñ olmasın; zira bu, seniñ Rabbiñ tarafından bildirilgen aqiqattır; faqat insanlarnıñ çoqu inanmazlar. (Bu ayet-i kerimede bir qıyaslama yapılmaqta. Boyle ki: Qur’an-ı Kerim kibi pek parlaq bir delilge, bu delilni tasdiq etken bir şaatqa yani mucizege ve inançlarnıñ sağlamlığını kostergen semaviy kitaplardan biri olğan Tevratnıñ şaatlığına saip olğan peyğambernen bularnı inkâr etken ve sadece dünya ayatından başqa bir şey istemegen bir kâfirniñ deñk (musaviy) olamaycağı bildirilmekte. Çünki, bularnıñ biri Allaһnıñ seçken qulı ve Allaһqa inanğan, tolayısınen, dünya ve ahiret saadetini qazanğan kimsedir; digeri ise, inkâr etken, tolayısınen, ebediy azapnı qazanğan kimsedir)."
        cid: 0
  - verse: 18
    segments:
      - text: "Kim Allaһqa nisbeten yalan uydurğandan daa zalım ola bilir? Olar (qıyamet kunünde) Rabblerine arz etilecekler, şaatlar da: İşte, bular Rabblerine qarşı yalan söylegenlerdir, deycekler. Biliñ ki, Allaһnıñ lâneti zalımlarnıñ uzerinedir!"
        cid: 0
  - verse: 19
    segments:
      - text: "Olar, (insanlarnı) Allaһnıñ yolundan çıqarğan ve onı qıyış kostermek istegenlerdir. Ahiretni inkâr eticiler de olardır."
        cid: 0
  - verse: 20
    segments:
