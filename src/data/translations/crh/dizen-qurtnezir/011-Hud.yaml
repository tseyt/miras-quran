        cid: 0
  - verse: 46
    segments:
      - text: "Allaһ buyurdı ki: Ey, Nuһ! O asla seniñ aileñden degil. Çünki, onıñ yapqanı fena bir iştir. O alda, aqqında bilgiñ olmağan bir şeyni menden isteme! Men saña caillerden olmamañnı tevsiye etem. (Bu ayetten añlaşıla ki, insanlar arasındaki yaqınlıqnıñ asıl sebebi, din birligidir. Allaһnıñ dinine inanğan ve peyğamberlerini tasdiq etken kimseler bir-birileriniñ maneviy aqrabası, yaqını ve dostlarıdır. Bularnıı aralarında maneviy birlik bardır. Mu’minlernen kâfirler, ırq noqtai nazarından, birbirileriniñ aqrabası olsa bile, bu aqrabalıqnıñ Allaһ qatında iç bir degeri yoqtırr. Az.Nuһnıı oğlu babasına inanmağanı içün, Allaһ Taalâ onı Nuһ peyğamberniñ ailesinden saymağan. Albuki, Az.Peyğamber aralarında iç bir neseb bağı olmağan Selmanı oz ailesinden sayğan. Buña nisbeten, hususen Bedir cenkinde bir çoq sahabiy eñ yaqınları olğan babalarına, ya da oğullarına qarşı cenkleşkenler)."
        cid: 0
