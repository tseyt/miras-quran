        cid: 0
  - verse: 106
    segments:
      - text: >
          Bedbahtlar ateştedirler, o yerde olarnıñ (öyle facialı) nefes alıp-berüvleri
          bardır ki.
        cid: 0
  - verse: 107
    segments:
      - text: >
          Rabbiniñ istegeninden başqa, (olar) kökler ve yer turğance, o ateşte ebediy
          qalacaqlar. Çünki, Rabbiñ istegenini haqqı ile yapıcıdır.
        cid: 0
  - verse: 108
    segments:
      - text: >
          Bahtlı olğanlarga kelgende, olar da cennettedirler. Rabbiniñ istegeninden başqa,
          kökler ve yer turğance, olar da o yerde ebediy qalacaqlar. Bu (nimetler) bitmez,
          tükenmez bir lütftir. (Bu ayetlerde belli müddetniñ soñuna irişüvi ile kelecek
          qıyamet kününden ve bunı taqip etecek ahiret allarından baas etilgeni içün, bu
          yerdeki kökler ve yerden dünyanıñ degil ahiretniñ kökleri ve yeridir. Çünki,
          İbrahim suresinıñ 48- nci ayetinde: «O künü yer başqa bir yernen, kökler de
          (başqa köklernen) deñiştrilir», buyurılğan).
        cid: 0
  - verse: 109
    segments:
      - text: >
          O alda, olarnıñ tabınğan şeylerinden (bu şeylerniñ olarnı azapqa alıp
          barğanından) şübeñ olmasın. Çünki, olar ancaq daa evel babalarınıñ tabınğanı
          kibi tabınmaqtalar. Biz olarnıñ (azaptan) nasiplerini mıtlaqa eksikzis olaraq
          berecekmiz.
        cid: 0
  - verse: 110
    segments:
      - text: >
          Ant olsun, biz Musağa Kitapnı berdik; faqat onda ihtilâf etildi. Eger Rabbiñden
          bir söz keçmegen olsa edi, elbette olarnıñ arasında üküm berilgen edi (ve işleri
          de bitirilgen edi). Şübesiz ki, olar (mekkeliler) de Qur'an aqqında teren bir
          şübe içindeler.
        cid: 0
  - verse: 111
    segments:
      - text: >
          Şübesiz, Rabbiñ olarnıñ er biriniñ amelleri qarşılığını olarğa tamamınen
          berecek. Çünki, Rabbiñ yapayatqanlarından haberdardır.
        cid: 0
  - verse: 112
    segments:
      - text: >
          O alda, sennen beraber tövbe etkenlernen birlikte, emir olunğanı kibi, dos-doğru
          ol! Adden de aşmañ. Çünki, O, siziñ yapqanlarıñıznı çoq yahşı körücidir.
          (Ashab-ı kiramdan rivayet etilgenine köre, Qur'anda Resulullah (s.a.) içün bu
          ayetten daa şiddetli bir ayet enmegen. Resulullah buyurğan ki: «Meni huud suresi
          qartayttı!» Çünki, bu surede oña: «Emir olunğanıñ kibi dos-doğru ol!» denilgen.
          Ve bu qolay bir iş degil edi. Allah Taalâ yalıñız oña degil, onıñnen beraber,
          mü'minlerge de istiqametni emir etmekte).
        cid: 0
  - verse: 113
    segments:
      - text: >
          Zulum etkenlerge meyl etmeñ; soñra sizge ateş toqunır (ceennemde yanarsıñız).
          Siziñ Allahtan başqa dostlarıñız yoqtır. Soñra (Ondan da) yardım koralmazsıñız!
        cid: 0
  - verse: 114
    segments:
      - text: >
          Kündüzniñ eki ucunda, geceniñ de ilk saatlarında namaz qıl. Çünki, yahşılıqlar
          fenalıqlarnı (günahlarnı) siler. Bu, ögüt almaq istegenlerge bir hatırlatuvdır.
          (Tefsircilerge köre, kündüzniñ eki tarafındaki namazlar - saba, üyle ve ekindi;
          geceniñ yaqın saatlarındakiler de, aqşam ve yatsı namazlarıdır. Ayette
          bildirilgen yahşılıqlardan biri - beş vaqıt namazdır. Resulullah (s.a.) buyurğan
          ki: Ne dersiñiz, sizden birisiniñ qapusı ögünde bir irmaq bulunsa da, er kün beş
          kere onda yiqansa, özünde kir adında bir şey qalırmı? Ashab «Yoq» dedi. Bunıñ
          üzerine Resulullah buyurdı ki: İşte, beş vaqıt namaz da bunıñ kibidir ki, Allah
          o sayede bütün hatalarnı arındırır).
        cid: 0
  - verse: 115
    segments:
      - text: >
          (Ey, Muhammed!) Sabırlı ol, çünki, Allah güzel iş yapqanlarnıñ mükâfatını zaya
          etmez.
        cid: 0
  - verse: 116
    segments:
      - text: >
          Sizden evelki asırlarda yer yüzünde (insanlarnı) bozğuncılıqtan çetleştirecek
          faziletli kimseler bulunsa edi ya! Faqat olardan qurtulışqa iriştirdigimiz az
