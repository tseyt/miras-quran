          onıñ ileri kelgenlerine yolladıq. Faqat olar Fıravunnıñ emrine uydılar. Albuki,
          Fıravunnıñ emri doğru degil edi.
        cid: 0
  - verse: 97
    segments:
      - text: >
          [96 ayetine baq.]
        cid: 0
  - verse: 98
    segments:
      - text: >
          Fıravun qıyamet kününde qavmınıñ ögüne tüşecek ve olarnı (çekip) ateşke alıp
          baracaq. Baracaq yerleri ne fena yerdir! (Yani Fıravun nasıl ki, bu dünyada
          qavmından inkârcı olğanlarnıñ ögüne tüşken; olarnen Allahnıñ Resulı Az.Musa ve
          onıñ tebliğ etken haq dinine qarşı küreşken ise, kene nasıl ki, Allahnıñ
          peyğamberini taqib etip, yaqalamaq içün qavmını arqasından iyertken ve niayet,
          özü deñizde boğulğanı kibi, olarnıñ boğuluvına da sebep olğan ise, aynı şekilde,
          ahirette de qavmınıñ ögünde olaraq, episi birden ceennemge sürülecek).
        cid: 0
  - verse: 99
    segments:
      - text: >
          Olar bu yerde de, qıyamet kününde de, lânetke oğratıldılar. (Olarğa) berilgen bu
          bahşış ne fena bahşıştır!
        cid: 0
  - verse: 100
    segments:
      - text: >
          (Ey, Muhammed!) İşte bu, (halqı elâk olğan) memleketlerniñ haberlerindendir. Biz
          onı saña añlatmaqtamız; olardan (bugünge qadar izleri) qalğan da bar, çalınğan
          ekin (kibi yoq olğanı) da bar.
        cid: 0
  - verse: 101
    segments:
      - text: >
          Olarğa biz zulum etmedik; faqat, olar özlerine zulum ettiler. Rabbiniñ (azap)
          emri kelgende, Allahnı bıraqıp da, tabınğan tañrıları olarğa iç bir şey
          teminlemedi, ziyanlarını arttıruvından başqa bir şeyge yaramadı.
        cid: 0
  - verse: 102
    segments:
      - text: >
          Rabbiñ aqsızlıq etken memleketlerni (olarnıñ halqını) yaqalağanda, onıñ
          yaqalavu, işte, böyle (şiddetlidir). Şübesiz, onıñ yaqalavu pek elem bericidir,
          pek çetindir!
        cid: 0
  - verse: 103
    segments:
      - text: >
          İşte, bunda ahiret azabından qorqqanlar içün, elbette bir ibret bar. O kün -
          bütün insanlarnıñ bir yerge toplanacaq bir künidir ve o kün (bütün mahlüqatnıñ)
          azır bulunğan bir künüdir.
        cid: 0
  - verse: 104
    segments:
      - text: >
          Biz onı (qıyamet kününi) sadece belli bir müddetke qadar bekletirmiz.
        cid: 0
  - verse: 105
    segments:
      - text: >
          O kelgen künü, Allahnıñ izni olmadan, iç kimse qonuşamaz. Olardan kimi
