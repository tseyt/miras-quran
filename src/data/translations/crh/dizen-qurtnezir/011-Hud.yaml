          peyğamberge yollanılğan bir delilge yani vahiyge bazanırlar. Ekincisi, peyğamberler
          ümmetlerine tebliğ etken şeylerini, er şeyden evel, öz nefislerinde yaşarlar;
          sözlerinen özleri, qalplerinen amelleri bir-birine uyar; ümmetlerine tebliğ
          etkenlerine ters areket etmezler. Üçüncisi, peyğamberler birer islâhatçıdır; olarnıñ
          vazifesi - yapmaq, tüzeltmektir; yahşılıqnıñ akim oluvı, insanlarnıñ doğruğa ve
          eyilikke yönelüvi içün elinden kelgeni qadar ğayret kösterüvidir. Dörtüncisi,
          peyğamberler, sadece Allahqa işanır ve tayanırlar; muvafaqiyetniñ yalıñız Allahtan
          kelgeni hususında iç bir şübeleri olmaz; bu sebepnen de, Allahtan başqa iç bir
