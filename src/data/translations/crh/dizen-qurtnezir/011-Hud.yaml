        cid: 0
  - verse: 24
    segments:
      - text: "Bu eki toplulıqnıñ (mu’minlernen kâfirlerniñ) vaziyeti, kor ve sağırnen korgen ve eşitken kimseler kibidir. Bularnıñ alı iç bir çeşit olurmı? Alâ ibret almaysızmı? (Sureniñ bu yerge qadar olğan bolüminde itiqadnen bağlı esaslar, Qur’annıñ mucize olğanı, inanmağanlarnıñ ahiretteki vaziyetleri, cezaları; buña qarşılıq, inanğanlarnıñ mukâfatları añlatıldı ve olarnıñ cennet ehli olğanları bildirildi. Niayet, bu eki toplulıq bediiy bir teşbih ile insanlıqnıñ tefekkürine avale olundı ve olar tüşünmege davet etildiler. Bundan soñki bolümlerde, ibret olaraq, bazı peyğamberlerniñ ayatları, tevhid inançını yaymaq içün kureşleri, qavmlarınıñ bularğa nisbeten areketleri ve meydanğa kelgen vaziyetlerniñ neticileri añlatılmaqta)."
