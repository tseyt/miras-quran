  - verse: 105
    segments:
      - text: "Koklerde ve yerde nice deliller bar ki, olar bu delillerden yuzlerini çevirip keçerler. («Ayet» kelimesi luğatta alâmet, şaşılacaq şey ve cemaat manalarındadır. Termin olaraq, Qur’an-ı Kerimniñ qısqa ya da uzun bir parçası demektir. Bu yerde «Ayet» kelimesi alâmet, delil ve ibret bergen şey manalarında qullanılğan. Yani Allaһnıñ barlığına, birligine, ilmine, qudretine ve ikmetiniñ kemalatına delâlet etici, ister insannıñ ozünde, ister tış dünyada, koklerde ve yerde nice delil bar ki, bular insanlarnıñ nazar-ı diqqatlarına avale olunğandır. İnsan oğlunıñ ilmiy, fikriy, felsefiy ve tehnik ayatı bu vaziyetlernen er vaqıt qarşılaşmaqtadır. Buña baqmadan, bu varlıqlarnı yaratqannı tüşünmeden, ibret almadan, yuz çevrir keçer. Albuki, insan oğlu bu tabiat vaqiaları ustünde tüşünse, bulardaki inceliklerni ve bularğa hakim olğan ilâhiy qanunlarnı tapıp keşf etecek, bunıñnen beraber, em dünyada teraqqiy etecek, em de ahirette bahtlı olacaq)."
