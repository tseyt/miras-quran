          (Bu ayetten añlaşıla ki, insanlar arasındaki yaqınlıqnıñ asıl sebebi, din
          birligidir. Allahnıñ dinine inanğan ve peyğamberlerini tasdiq etken kimseler
          bir-birileriniñ maneviy aqrabası, yaqını ve dostlarıdır. Bularnıñ aralarında maneviy
          birlik bardır. Mü'minlernen kâfirler, ırq noqtai nazarından, bir-birileriniñ
          aqrabası olsa bile, bu aqrabalıqnıñ Allah qatında iç bir degeri yoqtır. Az.Nuhnıñ
          oğlu babasına inanmağanı içün, Allah Taalâ onı Nuh peyğamberniñ ailesinden saymağan.
          Albuki, Az.Peyğamber aralarında iç bir neseb bağı olmağan Selmanı öz ailesinden
          sayğan. Buña nisbeten, hususen Bedir cenkinde bir çoq sahabiy eñ yaqınları olğan
          babalarına, ya da oğullarına qarşı cenkleşkenler).
        cid: 0
