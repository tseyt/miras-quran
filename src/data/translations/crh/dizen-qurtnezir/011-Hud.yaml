        cid: 0
  - verse: 120
    segments:
      - text: >
          Peyğamberlerniñ haberlerinden seniñ qalbiñni qanaatlenirecek er haberimizni saña
          añlatmaqtamız. Bunda saña aqiqatnıñ bilgisi, mü'minlerge de bir ögüt ve bir
          tenbiye kelgendir.
        cid: 0
  - verse: 121
    segments:
      - text: >
          İman etmegenlerge de ki: Eliñizden kelgenini yapıñ! Biz de (kerekkenni)
          yapmaqtamız!
        cid: 0
  - verse: 122
    segments:
      - text: >
          Bekleñ! Şübesiz, biz de beklemektemiz!
        cid: 0
  - verse: 123
    segments:
      - text: >
          Köklerniñ ve yerniñ ğaybı (sırı) yalıñız Allahqa aittir. Er iş oña döndürilir.
