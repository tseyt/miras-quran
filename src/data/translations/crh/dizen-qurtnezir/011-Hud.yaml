          berilgen ferahnıñ peşine tüştiler. Zaten günahkâr ediler.
        cid: 0
  - verse: 117
    segments:
      - text: >
          Halqı yahşı olğanı alda, Rabbiñ, aqsızlıqnen memleketlerni elâk etmez.
        cid: 0
  - verse: 118
    segments:
      - text: >
          Rabbiñ istese edi, bütün insanlarnı tek bir mellet yapar edi. (Faqat) olar
          ihtilâfqa tüşmege devam etecekler.
        cid: 0
  - verse: 119
    segments:
      - text: >
          Ancaq, Rabbiniñ merhamet etkenleri istisnadır. Zaten, Rabbiñ olarnı bunıñ içün
          yarattı. Rabbiniñ: «Ant olsun ki, ceennemni bütünley insanlar ve cinlernen
          tolduracam», sözü yerini taptı. (Tefsirciler ayette keçken «Li-zaalike - bunıñ
          içün" sözüne eki türlü mana bergenler: - «Zaten Rabbiñ olarnı bunıñ içün, yani
