  - verse: 123
    segments:
      - text: "Koklerniñ ve yerniñ ğaybı (sırı) yalıñız Allaһqa aittir. Er iş oña döndürilir. Oyle ise, Oña qullıq et ve Oña tayan! Rabbiñ yapqanlarıñızdan ğafil degil. (Ayette ibadet emriniñ artından, aman tevekkül emri kelmekte. Çünki, qullıq ancaq tevekkül ile yani sadece Allaһqa işanıp tayanmaqnen kemalatqa qavuşır. Butün işlerde muvafaqiyetlerge iriimek içün sebeplerge sarılmaq hususında elden kelgenini yapmaqnen beraber, muvafaqiyetni Allaһtan beklemek ve sadece Ondan yardım tilep, Oña sığınmaq, aynı zamanda, imannıñ kemalatına da alâmettir)."
