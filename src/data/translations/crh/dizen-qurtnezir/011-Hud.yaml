surah_id: 11
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "Elif. Lâam. Miim. Raa. Bular Kitapnıñ ayetleridir. Saña Rabbiñden endirilgen haqtır, faqat insanlarnıñ çoqusı inanmazlar."
        cid: 0
  - verse: 2
    segments:
      - text: "Kormekte olğanıñız koklerni direksiz olaraq yukseltken, soñra Arşqa hakim olğan, kuneşni ve aynı emrine boyun egdirgen Allaһtır. (Bullarnıñ) er biri muayen bir vaqıtqa qadar aqıp ketmektedir.O, Rabbiñizge qavuşacağıñızğa kesenkes olaraq inanuvıñız içün, er işni tertiplep, ayetlerni añlatmaqta. (Ariqa hakimlik aqqında bilmek içün A’raaf suresiniñ 54-nci ayetine baqıñ)."
        cid: 0
  - verse: 3
    segments:
      - text: "Yerni toşegen, onda oturaqlı dağlar ve irmaqlar yaratqan ve o yerde butün meyvalardan çift-çift yaratqan Odır. Geceni de kundüzniñ uzerine O ortmekte. Şubesiz, butün bularda, tüşüngen bir toplum içün, ibretler bar. (Zemane ilmniñ bir keşfiyatı olğan ekinlerdeki çeçeklerniñ tozlaşuv yolunen aşlanğanı vaqiasını haber bergen bu ayet Qur’annıñ mucize olğanına açıq delillerden biridir)."
        cid: 0
  - verse: 4
    segments:
      - text: "Yer yuzünde bir-birine qomuşu qıtalar, yuzüm bağları, ekinler, bir tamırdan ve çeşit tamırlardan dallanğan hurma terekleri bar. Bularnıñ episi bir suvnen suvarılır.(Boyle eken) yemişlerinde olarnıñ bir qısmını bir qısmından ustün yaparmız. İşte, bularda aqıllarını qullanğan bir toplum içün ibretler bar. (Bir topraqtan ve bir suvnen suvarılğan ekinlerden er biriniñ dadı bir-birinden çoq farqlı meyvalar berüvi, Allaһnıñ barlığı ve qudretiniñ eñ açıq delillerindendir)."
        cid: 0
  - verse: 5
    segments:
      - text: "(Resulım! Kâfirlerniñ seni yalanlavlarına) şaşa iseñ, asıl şaşılacaq şey olarnıñ: «Biz topraq olğan vaqtımızda ğayrıdan yaratılacaqmızmı?» deyuvleridir. İşte, olar Rabblerini inkâr etkenlerdir; işte, olar (qıyamet kunünde) boyunlarında tasmalar olğanlardıң. Ve olar ateş ehlidir. Olar o yerde ebediy qalacaqlar!"
        cid: 0
  - verse: 6
    segments:
      - text: "(Muşrikler) senden eyilekten evel fenalıqnı çabukçe istemekteler. Albuki, olardan evel ibret alınacaq nice azap ornekleri kelip-keçkendir. Doğrusı, insanlar fenalıq etkenleri alda, Rabbiñ olar içün mağfiret saibidir. (Bunıñnen beraber) Rabbiñniñ azabı da çoq şiddetlidir. (Mekke muşrikleri dediler ki: «Ey, Allaһ! Eger bu Qur’an senden kelgen bir haq ise, aman ustümizge kokten bir taş yağdır, ya da bizge başqa accı bir azap ketir!» İşte, ayette buña işaret etilerek: «Senden eyilikten evel, fenalıqnı çabukçe istemekteler», denilmekte. Esasen olar aqiqatta azap istemey; aksine, bu sözlerinen ilâhiy azapqa inanmağanlarını kostermekte, peyğamberniñ tehditlerinen alay ete ediler)."
        cid: 0
  - verse: 7
    segments:
      - text: "Kâfirler deyler ki: Oña Rabbiñden bir mucize endirilse edi ya! (Albuki) sen ancaq bir tenbiyecisiñ ve er toplumnıñ bir reberi bardır. (Muşrikler bilmey ediler ki, Allaһ izin bermegence, iç bir peyğamber mucize kosterip olalmaz edi. Ayette de ifade etilgeni kibi, peyğamberlerniñ vazifesi esasen insanlarnı tenbiyelemek, yañlışlardan, sapıqlıqtan ve aqsızlıqtan saqındırmaq edi)."
        cid: 0
  - verse: 8
    segments:
      - text: "Er bir ırğaçınıñ nege yuklü olacağını, rahimlerniñ neni eksik, neni ziyade etecegini Allaһ bilir. Onıñ qatında er şey olçünendir."
        cid: 0
  - verse: 9
    segments:
      - text: "O korüngenni de, korünmengenni de bilir; çoq buyuktir, yucedir."
        cid: 0
  - verse: 10
    segments:
      - text: "Sizden sözni gizlegennen onı aşkâr etken, geceleyin gizlengennen kundüzi yurgen (onıñ ilminde) musaviydir."
        cid: 0
  - verse: 11
    segments:
      - text: "Onıñ ogünde ve artında Allaһnıñ emrinen onı qorçalağan taqipçiler (melekler) bardır. Bir toplum ozlerindeki hususiyetlerni deñiştirgenge qadar, Allaһ olarda olğannı deñiştirmez. Allaһ bir toplumğa fenalıq istedimi, artıq onıñ içün artqa qaytmaq degen bir şey yoq. Olarnıñ Allaһtan başqa yardımcıları da yoq. (Er bir insannıı ogünde ve artında qorçalayıcı ve yazıcı melekler bar. Bular insannı qorçalağanları kibi, amellerni de yazarlar. Ayette işaret etilgen bir başqa husus da şu: Allaһ bir milletke başqalarına nisbeten bazı ustünlikler ve bazı nimetler bergende, o millet qopayır ve ahlâqını bozar da, o nimetke lâyıqatını ğayıp etse, Allaһ nimetni olarnıñ elinden alır. Millet ozüniñ ustün degerlerini bozmağan mudetkece Allaһ bergen nimetni olarnıñ elinden almaz)."
        cid: 0
  - verse: 12
    segments:
      - text: "O, sizge qorqu ve umüt içinde şemşekni kosterici ve (yağmur tolu) ağır bulutlarnı meydanğa ketiricidir."
        cid: 0
  - verse: 13
    segments:
      - text: "Kok gürültisi Allaһnı hamd ile tesbih eter. Melekler de Onıñ aybetinden tolayı, tesbih eterler. Olar Allaһ aqqında cenkleşip turğanda, O yıldırımlar yollar, olarnen tilegenini çarpar. Ve Onıñ azabı pek şeddetlidir."
        cid: 0
  - verse: 14
    segments:
      - text: "El açıp, yalvarmağa lâyıq olğan yalıñız Odır. Ondan başqa el açıp dua etkenleri, olarnıñ isteklerini iç bir şeynen qarşılamazlar. Olar ancaq ağızına kelsin dep, suvğa doğru eki avuçını açqan kimse kibidir. Albuki, (suvnı ağızına ketirmegence) suv onıñ ağızına kirecek degil. Kâfirlerniñ duası, şubesiz sapıqlıqtan başqa şey degil."
        cid: 0
  - verse: 15
    segments:
      - text: "Koklerde ve yerde olğanlar da, olarnıñ kolgeleri de, saba-aqşam, ister-istemez, yalıñız Allaһqa secde eterler."
        cid: 0
  - verse: 16
    segments:
      - text: "(Resulım!) De ki: «Koklerniñ ve yerniñ Rabbi kimdir?» De ki: «Allaһtır!». O alda de ki: «Onı bıraqıp da, ozlerine fayda ya da zarar bermek kuçüne saip olmağan dostlar taptıñızmı?» De ki: «Kornen korgen iç bir olurmı? Ya da qaranlıqnen aydınlıq bir olurmı?» Yoqsa, onıñ yarattığı kibi yaratqan ortaqlar taptılar da, bu yaratuv olarğa kore, bir-birine beñzegen koründimi? De ki: Allaһ er şeyni yaratıcıdır. Ve O, birdir, qarşı turılmaycaq kuç saibidir."
        cid: 0
  - verse: 17
    segments:
      - text: "O kokten suv endirdi de, vadiler ozleriniñ acimlerince sel olup aqtı. Bu sel ustke çıqqan bir kopükni yuklenip alıp ketti. Süs ya da (diger eşya yapmaq isteyerek, ateşte iritilgen şeylerden de buña beñzegen kopük olur). İşte, Allaһ haqnen batılğa boyle misal bere. Kopük atılıp keter. İnsanlarğa fayda bergen şeyge kelgende, o yer yuzünde qalır. İşte, Allaһ boyle misaller ketire. (Allaһ Taalâ evelki ayette inanğanlarnı korgen kimsege, haqnı-aydınlıqqa; inanmağanlarnı kor kimsege, batılnı da, qaranlıqlara beñzetti. Bu ayette ise, bir başqa teşbih yaptı. Boyle ki, haq ve haq ehli - kokten engen yağmurğa; batıll ve batıll ehli de, suv yuzündeki kopükke beñzetilgen. Yağmur yağğanda derelerden suvlar aqar, insanlar ondan çeşit şekilde faydalanırlar, quruğan topraqlarğa ayat kelir ve topraq qatlamlarında birleşip, çoqraqlar alında fışqırır, ondan da insanlar faydalansalar, işte, haq ve haq ehli de, bunıñ kibi faydalıdır. Haq kelgende, olgen qalpler tirilir, borsayğan vijdanlar merhametli olmaq hususiyetini qazanır. İman neticesinde esapsız faydalar meydanğa kelir. Batıll ise, selniñ yuzündeki kopükke beñzetilgen. O kopük tezde ğayıp olur-keter, iç bir şeyge de fayda bermez. Ayrıca, inanğanlar süs ya da başqa eşyalar yapmaq içün ateşte iritilgen altın, kumüş, baqır kibi madenlerge beñzetilgen ki, bular, aqiqaten faydalı şeylerdir. Bu madenler iritilgen vaqıtta meydanğa kelgen artqaçlar bar ki, olar bir degerge saip degil. İşte, batıll ve batıl ehli de bularğa beñzetilgen)."
        cid: 0
  - verse: 18
    segments:
      - text: "İşte, Rabbleriniñ emrine uyğanlar içün eñ guzel (mukâfat) bardır. Oña uymanğanlarğa kelgende, eger yer yuzünde olğanlarnıñ episinen ve onıñ yanında bir qat daa ozleriniñki olsa, (qurtulmaq içün) onı mıtlaqa feda eterler. İşte, olar bar ya, esapnıñ eñ fenası olarğadır. Baracaq yerleri de ceennemdir. O ne fena yataqtır!"
        cid: 0
  - verse: 19
    segments:
      - text: "Rabbiñden saña endirilgenniñ haq olğanını bilgen kimse, (inkâr etken) kor kimse kibi olurmı? (Faqat bunı) yalıñız aqıl saipleri añlar."
        cid: 0
  - verse: 20
    segments:
      - text: "Olar Allaһnıñ ahtını yerine ketirgenler ve bergen sözlerini bozmağanlardır."
        cid: 0
  - verse: 21
    segments:
