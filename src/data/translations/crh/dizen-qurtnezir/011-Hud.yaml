        cid: 0
  - verse: 27
    segments:
      - text: "Qavmından ileri kelgen kâfirler dediler ki: «Biz seni, sadece bizim kibi bir insan olaraq kormektemiz. Bizden addiy korüşnen areket etken alt tabaqamızdan başqasınıñ saña uyğanını kormeymiz. Ve siziñ bizge nisbeten bir ustünligiñizni de kormeymiz. Aksine, siziñ yalancılar olğanıñıznı tüşünmektemiz». («Mele’») kelimesi - ileri kelgenler, eşraf, elita tabaqa manasındadır. Qur’an-ı Kerim diqqatnen talil etilgende, butün peyğamberlerniñ qarşılarında Fıravun kibi bir tağutnıñ ve oña aqıl ocalığı yapqan bir toplulıqnıñ barlığı korülir. Zamanlarınıñ er türlü maddiy imkânlarını ellerinde bulundırğan bu yuksek tabaqa, menfaatlarını ğayıp etmemek içün, inanğanlarnı faqırlıq ve zelillikte suçlamaq yolunı tutqan ediler. Soñki peyğamber zamanında aynı vaziyet ceryan etken, oña faqır ve addiy kimselerniñ inanğanlarını manaçıq eterek, qarşı çıqkan ediler)."
        cid: 0
  - verse: 28
    segments:
      - text: "(Nuһ) dedi ki: Ey, qavmım! Eger men Rabbim tarafından (bildirilgen) açıq bir delil uzerinde olsam ve O maña oz qatından bir rahmet bergen de, bu sizge gizli tutılğan ise, buña ne dersiñiz? Siz onı istemegeniñiz alda, biz sizni oña zorlaycaqmızmı?"
        cid: 0
  - verse: 29
    segments:
      - text: "Ey, qavmım! Allaһnıñ emirlerini bildirmege qarşılıq sizden bir türlü mal istemeyim. Menim mukâfatım ancaq Allaһqa aittir. Men iman etkenlerni quvacaq degilim; çünki, olar Rabblerine qavuşacaqlar. Faqat men sizni bilgisizliknen davranğan bir toplulıq olaraq kormektem. (Az.Nuһnıñ qavmı inanğan faqır kimselerge muracaat etmey ve olarnen beraber olmaq istemey edi. Bunıñ içün Nuһ (a.s.)nıñ olarnı yanından quvmasını teklif ettiler. O buyuk peyğamber, elbette caillerniñ sözlerine baqıp, Allaһqa iman etken, Allaһ qatında degerli kimselerni yanından quvacaq degil edi)."
