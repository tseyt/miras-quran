  - verse: 30
    segments:
      - text: "(Ey, Muһammed! Boylece, seni ozlerinden evel nice ummetlerniñ kelip keçtigi bir ummetke yolladıq ki, saña vahiy etkenimizni olarğa oquysıñ. Olar Rahmannı inkâr etmekteler. De ki: O, menim Rabbimdir. Ondan başqa tañrı yoqtır. Sadece, Oña tevekkül ettim ve dönüş, sadece Oñadır)."
        cid: 0
  - verse: 31
    segments:
      - text: "Eger oqunğan bir Kitapnen dağlar yurütilse edi, ya da onıñnen yer parçalansa edi, yahut onıñnen olüler qonuştırılsa edi, (o Kitap kene bu Qur’an olacaq edi). Faqat butün işler Allaһqa aittir. İman etkenler alâ bilmedilermi ki, Allaһ istese edi, butün insanlarnı hidayetke iriştirir edi? Allaһnıñ vadesi kelgenge qadar, inkâr etkenlerge, yapqanlarından tolayı, ya apansızdan buyuk bir belâ kelmege devam etecek, ya da o belâ evleriniñ yaqınına enecek. Allaһ vadesinden asla dönmez. (Rivayet olunğanına kore, Resulullah (a.s.) Mekke kâfirlerine İslâmnı añlatqan bir kunü muşriklerden Abdullah b. Umeyye el-Mahzumiy dedi ki: «Mekkeniñ şu eki dağı bizni çoq sıqa, bularnı bu yerden al da, yerimiz kenişlesin. O dağlarnıñ arasından irmaqlar aqız, ziraatqa elverişli yerler aç, atalarımızdan olgen felân ve felân şahıslarnı tirilt de, söylesinler, baqayıq, seniñ söylegenleriñ doğrumı, yalanmı?» İşte, bunıñ uzerine yuqardaki ayet endi. Ve olarğa bildirildi ki, peyğamber yollamaq ve Qur’an endirmekten maqsat, bu - siziñ degenleriñiz degil. Bunıñnen beraber, er angi bir Kitap vastasınen oyle şeyler yapılacaq olsa edi, kene bu Qur’an ile yapılır edi. Amma, Qur’annıñ endirilüvindeki ikmet ve ğaye, er şeyden evel, insanlarnı hidayetke iriştirmek, qalplerni Allaһnıñ zikrinen toydurmaq ve nurlandırmaqtır)."
        cid: 0
  - verse: 32
    segments:
