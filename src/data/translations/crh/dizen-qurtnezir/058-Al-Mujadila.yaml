      - text: >-
          (Araplar arasında «zıhaar» denilgen bir adet bar edi. Böyle ki, bir adam qadınına:
          «Sen maña anamnıñ sırtı kibisiñ», degeninen, qadın o erkekke aram sayıla ve ebediyen
          qocası tarafından terk etile edi. Ashaptan Evs bin Sabit de qadınına qızışıp, bu
          sözni söylegen edi. Qadını Havle Az.Peyğamberge barıp, yaş vaqtında qocasına
          hızmetler etkenini, balaları olğanını, şimdi bu qartlıq vaqtında qocasınıñ o sözni
          aytaraq, onı perişan alğa tüşürgenini añlattı ve Az.Peyğamberden tekrar qocasına
          qaytuvı içün üküm istedi. Az.Peyğamber de: «Sen oña aramsıñ», dedi. Qadın yaş
          balalarını qasevet etkenini ayta, oña bir üküm berüvini Allah elçisinden
          tekrar-tekrar istey edi. Niayet, Allah Resulına vahiy kelecegi beyan oldı ve bu
          ayetler endi. Böylece, Allah o eski adetniñ yañlış bir zan olğanını, böyle sözlernen
          qadınnıñ, qocasına ana olalmaycağını bildirdi. Ancaq, böyle bir söz aytqanğa da, bir
          ceza qoydı. Olar aqqında aşağıdaki ayetlerde beyan etilgen).
        cid: 0
