surah_id: 58
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >
          Qocası aqqında sennen tartışqan ve Allahqa şikayette bulunğan qadınnıñ sözüni
          Allah eşitkendir. Allah siziñ laqırdıñıznı eşitir. Çünki, Allah eşiticidir,
          bilicidir. (Araplar arasında «zıhaar» denilgen bir adet bar edi. Böyle ki, bir
          adam qadınına: «Sen maña anamnıñ sırtı kibisiñ», degeninen, qadın o erkekke aram
          sayıla ve ebediyen qocası tarafından terk etile edi. Ashaptan Evs bin Sabit de
          qadınına qızışıp, bu sözni söylegen edi. Qadını Havle Az.Peyğamberge barıp, yaş
          vaqtında qocasına hızmetler etkenini, balaları olğanını, şimdi bu qartlıq
          vaqtında qocasınıñ o sözni aytaraq, onı perişan alğa tüşürgenini añlattı ve
          Az.Peyğamberden tekrar qocasına qaytuvı içün üküm istedi. Az.Peyğamber de: «Sen
          oña aramsıñ», dedi. Qadın yaş balalarını qasevet etkenini ayta, oña bir üküm
          berüvini Allah elçisinden tekrar-tekrar istey edi. Niayet, Allah Resulına vahiy
          kelecegi beyan oldı ve bu ayetler endi. Böylece, Allah o eski adetniñ yañlış bir
          zan olğanını, böyle sözlernen qadınnıñ, qocasına ana olalmaycağını bildirdi.
          Ancaq, böyle bir söz aytqanğa da, bir ceza qoydı. Olar aqqında aşağıdaki
          ayetlerde beyan etilgen).
        cid: 0
  - verse: 2
    segments:
      - text: >
          Arañızdan zıhaar yapqanlarnıñ qadınları - olarnıñ anaları degil. Olarnıñ anaları
          özlerini doğurğan qadınlardır. Şübesiz, olar çirkin bir laf ve yalan
          söylemekteler. Şübesiz, Allah afu eticidir, bağışlayıcıdır.
        cid: 0
  - verse: 3
    segments:
      - text: >
          Qadınlardan zıhaar ile ayırılmaq istep de, soñra aytqanlarından qaytqanlarnıñ
          qadınlarınen alâqa yapmadan evel, bir hızmetkârnı ürriyetke qavuştırmaları
          kerek. Sizge ögütlengeni budır. Allah yapqanlarıñızdan haberdardır.
        cid: 0
  - verse: 4
    segments:
      - text: >
          (Buña imkân) tapalmağan kimse, qadınınen alâqa yapmadan evel, bir-biri artından
          eki ay oraza tutar. Buña da küçü yetmegen altmış faqırnı toyurır. Bu
          (yengillik), Allahqa ve Resulına inanuvıñızdan tolayıdır. Bular Allahnıñ
          ükümleridir, kâfirler içün elem berici bir azap bardır.
        cid: 0
  - verse: 5
    segments:
      - text: >
          Allahqa ve Resulına qarşı kelgenler, özlerinden evelkilerniñ alçaltılğanı kibi,
          alçaltılacaqlar. Biz ap-açıq ayetler endirgendirmiz. Kâfirler içün aşşalayıcı
          bir azap bardır.
        cid: 0
  - verse: 6
    segments:
      - text: >
          O künü Allah olarnıñ episini tiriltecek ve yapqanlarını özlerine haber berecek.
          Allah olarnı bir-bir sayğandır. Olar ise, unutqandırlar. Allah er şeyge şaattır.
        cid: 0
  - verse: 7
    segments:
      - text: >
          Köklerde ve yerde olğanlarnı Allah bilgenini körmeysiñmi? Üç adamnıñ gizli
          qonuşqan yerinde dörtüncisi mıtlaqa Odır. Beş adamnıñ gizli qonuşqan yerinde
          altıncısı mıtlaqa Odır. Bulardan az ya da çoq olsunlar ve ne yerde
          olsalar-olsunlar, mıtlaqa, O, olarnen beraberdir. Soñra qıyamet künü olarğa
          yapqanlarını haber berecek. Doğrusı, Allah er şeyni bilicidir.
        cid: 0
  - verse: 8
    segments:
      - text: >
          Gizli qonuşuvdan men etilgenden soñ, kene o yasaqlanğannı yapmağa qalqışaraq,
          günah, duşmanlıq ve Peyğamberge qarşı kelmek hususında gizliden qonuşqanlarnı
          körmediñmi? Olar saña kelgen vaqıtlarında, seni Allah selâmlamağan şekilde
          selâmlamaqtalar. Öz içlerinden de: Bu söylegenlerimiz sebebinden, Allahnıñ bizge
          azap etüvi kerekmez edimi? derler. Ceennem olarğa yeter, o yerge kirecekler. Ne
          fena dönüş yeridir o yer! (Bular yeudiyler ve munafıqlar ediler. Musulmanlarnıñ
          yanında işaretlernen gizli-gizli qonuşa, mü'minlerniñ yüreklerine şübe soqmağa
          çalışa, cenkte mucahidlerniñ mağlüp olğanları, artta qalğanlarnıñ da
          öldürilgenleri issini uyandırmağa çalışa ediler. Az.Peyğamber olarnı bu
          ahlâqsızlardan men etken edi. Yeudiylerniñ bir başqa ahlâqsızlığı da,
          Az.Peyğambernen rastkelişkenlerinde: «Saña ölüm olsun», manasındaki «Es-saamu
          aleyh» şeklinde selâm berüvleri edi. Az.Peyğamber olarnıñ bu sayğısız qaba
          ifadelerine «sizge olsun» manasında «Aleykum» şeklinde qarşılıq berir, nazik ve
          mulâyim tavurını deñiştermez edi).
        cid: 0
  - verse: 9
    segments:
      - text: >
          Ey, iman etkenler! Arañızda gizli laf etecek vaqtıñızda günahnı, duşmanlıqnı ve
          peyğamberge qarşı kelmekni fısıldamañ. Yahşılıq ve taqvanı qonuşıñ. Uzuruna
          toplanacaq Allahtan qorquñ. (Hitap etilgenler mü'minlermi, yoqsa, körünişte
          inanğan kibi körüngen munafıqlarmı, bular aqqında çeşit fikrler bar, er eki
          toplulıqqa dair ola bilecek mana da berilgen).
        cid: 0
  - verse: 10
    segments:
      - text: >
          Gizli qonuşuvlar şeytandandır. Bu, iman etkenlerni kederlendirmek içündir.
          Albuki, şeytan, Allahnıñ izni olmağance, mü'minlerge iç bir zarar beralmaz.
          Mü'minler Allahqa tayanıp işansınlar. (Bu ayet ile fısıltınıñ ve toplulıqta
          gizli qonuşuvnıñ şeytannıñ işlerinden olğanı hatırlatılaraq, bu işniñ
          bıraqılması istenelmekte).
        cid: 0
  - verse: 11
    segments:
      - text: >
          Ey, iman etkenler! Sizge: «Meclislerde yer açıñ», denilgeninen, yer açıñ ki,
          Allah da sizge kenişlik bersin. Sizge «qalqıñ», denilgeninen de, qalqıñ ki,
          Allah sizden inanğanlarnı ve özlerine ilim berilgenlerni derecelernen
          yükseltsin. Allah yapqanlarıñızdan haberdardır. (Edeb-i muaşeret qaidelerinden
          birini ögretken bu ayetke köre, mecliste yer açmaq, kelgenlerge yer bererek
          qalqmaq - çeşit maddiy ve maneviy faydalar teminlemekte. Zira, iman ve ilimnen
          tamamlanğan ahlâq qaidelerini yaşağanlar dünya ve ahirette yüksek derecelerge
          irişirler).
        cid: 0
  - verse: 12
    segments:
      - text: >
          Ey, iman etkenler! Peyğambernen gizli bir şey qonuşacaq vaqtıñızda, bu
          qonuşmañızdan evel, bir sadaqa beriñiz. Bu siz içün daa hayırlı ve daa temizdir.
          Eger bir şey tapalmasañız, biliñ ki, Allah bağışlayıcıdır, merhametlidir. (Bu
          emir Az.Peyğamberge sayğı kösterilüvi, faqırlarğa yardım etilüvi, sual soravda
          da ileri ketilmemesi, ihlâslı insanlarnen munafıqlarnıñ, ahiretni sevgenlernen
          dünyağa meyl bergenlerniñ meydanğa çıqaruvı kibi ikmetlerni ifade etmekte.
          Ayrıca, bu ayet Az.Peyğambernen kerekli-kereksiz körüşip, qonuşmaq istegen ve
          onı raatsız etkenlerniñ ziyaretini de bir tertipke qoyğan).
        cid: 0
  - verse: 13
    segments:
      - text: >
          Gizli bir şey qonuşuvıñızdan evel, sadaqalar berüvden çekindiñizmi? Bunı
          yapmağanıñızğa ve Allah da sizni afu etkenine köre, artıq namaznı qılıñ, zekâtnı
          beriñ, Allahqa ve Resulına itaat etiñ. Allah yapqanlarıñızdan haberdardır. (Bu
          ayet evelki ayetniñ ükmini nesh eterek, sadaqa mecburiyetini yengilyetken,
          berilmegen vaqıtta esapqa çekilmeyceklerini bildirgen).
        cid: 0
  - verse: 14
    segments:
      - text: >
          Allah özlerine ğadap etken bir toplulıqnı dost tutqanlarnı körmediñmi? Olar ne
          sizdendirler, ne de olardan. Bilerek yalan yerge yemin etmekteler. (Körülip
          bilinüvi istenilgen toplulıq munafıqlardır, bular Allahnıñ ğadabına oğrağan
          yeudiylerni özlerine dost tutmağa çalışqan ediler, munafıqlar mü'min olğanlarını
          söylegen ve yemin etken yalancılardır).
        cid: 0
  - verse: 15
    segments:
      - text: >
          Allah olarğa çetin bir azap azırlağandır. Aqiqaten, olarnıñ yapqan şeyleri çoq
          fenadır!
        cid: 0
  - verse: 16
    segments:
      - text: >
          Olar yeminlerini qalqan etip, Allah yolundan çevirdiler. Bu sebepten, olarğa
          aşşalayıcı bir azap bardır.
        cid: 0
  - verse: 17
    segments:
      - text: >
          Olarnıñ malları da, oğulları da, Allahqa nisbeten özlerine bir fayda bermez.
          Olar ceennem ehlidirler, o yerde ebediy qalacaqlar.
        cid: 0
  - verse: 18
    segments:
      - text: >
          O künü Allah olarnıñ episini ğayrıdan tiriltecek, olar da, dünyada sizge yemin
          etkenleri kibi, Oña yemin etecekler. Özlerini bir şey (aqiqat) üzerinde olğan
          sanarlar. Yahşı biliñ ki, olar aqiqaten yalancılardır. (Munafıqlar Allahnıñ
          uzurunda musulman olğanlarına yemin etüvleri de özlerine bir fayda bermez).
        cid: 0
  - verse: 19
    segments:
      - text: >
          Şeytan olarnı tesiri altına aldı da, olarğa Allahnı añmaqnı unuttırdı. İşte,
          olar şeytannıñ tarafdarlarıdır. Yahşı biliñ ki, şeytannıñ tarafdarları ep
          zarardadırlar.
        cid: 0
  - verse: 20
    segments:
      - text: >
          Allahqa ve Peyğamberine duşman olğanlar, işte olar eñ aşşalarnıñ arasındadırlar.
        cid: 0
  - verse: 21
    segments:
      - text: >
          Allah: Elbette, men ve elçilerim ğalip kelecekmiz, diye yazğandır. Şübesiz,
          Allah küçlüdir, ğaliptir.
        cid: 0
  - verse: 22
    segments:
      - text: >
          Allahqa ve ahiret kününe inanğan bir toplumnıñ -babaları, oğulları, qardaşları,
          ya da aqrabaları da olsa- Allahqa ve Resulına duşman olğanlarnen dostlıq
          etkenini koralmazsıñ. İşte, olarnıñ qalbine Allah iman yazğan ve qatından bir
          ruh ile olarnı desteklegen. Olarnı içlerinden irmaqlar aqqan cennetlerge
          qoyacaq, o yerde ebediy qalacaqlar. Allah olardan razı olğan, olar da Allahtan
          hoşnut olğanlar. İşte, olar, Allah tarafında olğanlardır. Yahşı biliñ ki,
          qurtulışqa irişecekler de, sadece Allah tarafında olğanlardır.
        cid: 0
