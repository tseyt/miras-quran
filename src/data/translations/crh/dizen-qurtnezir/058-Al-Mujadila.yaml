      - text: >-
          (Bular yeudiyler ve munafıqlar ediler. Musulmanlarnıñ yanında işaretlernen
          gizli-gizli qonuşa, mü'minlerniñ yüreklerine şübe soqmağa çalışa, cenkte
          mucahidlerniñ mağlüp olğanları, artta qalğanlarnıñ da öldürilgenleri issini
          uyandırmağa çalışa ediler. Az.Peyğamber olarnı bu ahlâqsızlardan men etken edi.
          Yeudiylerniñ bir başqa ahlâqsızlığı da, Az.Peyğambernen rastkelişkenlerinde: «Saña
          ölüm olsun», manasındaki «Es-saamu aleyh» şeklinde selâm berüvleri edi. Az.Peyğamber
          olarnıñ bu sayğısız qaba ifadelerine «sizge olsun» manasında «Aleykum» şeklinde
          qarşılıq berir, nazik ve mulâyim tavurını deñiştermez edi).
