surah_id: 58
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >-
          Qocası aqqında sennen tartışqan ve Allaһqa şikayette bulunğan qadınnıñ sözüni
          Allaһ eşitkendir. Allaһ siziñ laqırdıñıznı eşitir. Çünki, Allaһ eşiticidir,
          bilicidir. (Araplar arasında «zıhaar» denilgen bir adet bar edi. Boyle ki, bir
          adam qadınına: «Sen maña anamnıñ sırtı kibisiñ», degeninen, qadın o erkekke aram
          sayıla ve ebediyen qocası tarafından terk etile edi. Ashaptan Evs bin Sabit de
          qadınına qızışıp, bu sözni söylegen edi. Qadını Havle Az.Peyğamberge barıp, yaş
          vaqtında qocasına hızmetler etkenini, balaları olğanını, şimdi bu qartlıq
          vaqtında qocasınıñ o sözni aytaraq, onı perişan alğa tüşürgenini añlattı ve
          Az.Peyğamberden tekrar qocasına qaytuvı içün uküm istedi. Az.Peyğamber de: «Sen
          oña aramsıñ», dedi. Qadın yaş balalarını qasevet etkenini ayta, oña bir uküm
          berüvini Allaһ elçisinden tekrar-tekrar istey edi. Niayet, Allaһ Resulına vahiy
          kelecegi beyan oldı ve bu ayetler endi. Boylece, Allaһ o eski adetniñ yañlış bir
          zan olğanını, boyle sözlernen qadınnnıñ, qocasına ana olalmaycağını bildirdi.
          Ancaq, boyle bir söz aytqanğa da, bir ceza qoydı. Olar aqqında aşağıdaki
          ayetlerde beyan etilgen).
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Arañızdan zıhaar yapqanlarnıñ qadınları - olarnıñ anaları degil. Olarnıñ
          anaları ozlerini doğurğan qadınlardır. Şubesiz, olar çirkin bir laf ve yalan
          söylemekteler. Şubesiz, Allaһ afu eticidir, bağışlayıcıdır.
        cid: 0
  - verse: 3
    segments:
      - text: >-
          Qadınlardan zıhaar ile ayırılmaq istep de, soñra aytqanlarından qaytqanlarnıñ
          qadınlarınen alâqa yapmadan evel, bir hızmetkârnı urriyetke qavuştırmaları
          kerek. Sizge ogütlengeni budır. Allaһ yapqanlarıñızdan haberdardır.
        cid: 0
  - verse: 4
    segments:
      - text: >-
          (Buña imkân) tapalmağan kimse, qadınınen alâqa yapmadan evel, bir-biri artından
          eki ay oraza tutar. Buña da kuçü yetmegen altmış faqırnı toyurır. Bu (engillik),
          Allaһqa ve Resulına inanuvıñızdan tolayıdır. Bular Allaһnıñ ukümleridir,
          kâfirler içün elem berici bir azap bardır.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Allaһqa ve Resulına qarşı kelgenler, ozlerinden evelkilerniñ alçaltılğanı kibi,
          alçaltılacaqlar. Biz ap-açıq ayetler endirgendirmiz. Kâfirler içün aşşalayıcı
          bir azap bardır.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          O kunü Allaһ olarnıñ episini tiriltecek ve yapqanlarını ozlerine haber berecek.
          Allaһ olarnı bir-bir sayğandır. Olar ise, unutqandırlar. Allaһ er şeyge şaattır.
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Koklerde ve yerde olğanlarnı Allaһ bilgenini kormeysiñmi? Uç adamnıñ gizli
          qonuşqan yerinde dörtüncisi mıtlaqa Odır. Beş adamnıñ gizli qonuşqan yerinde
          altıncısı mıtlaqa Odır. Bulardan az ya da çoq olsunlar ve ne yerde
          olsalarolsunlar, mıtlaqa, O, olarnen beraberdir. Soñra qıyamet kunü olarğa
          yapqanlarını haber berecek. Doğrusı, Allaһ er şeyni bilicidir.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Gizli qonuşuvdan men etilgenden soñ, kene o yasaqlanğannı yapmağa qalqışaraq,
          gunah, duşmanlıq ve Peyğamberge qarşı kelmek hususında gizliden qonuşqanlarnı
          kormediñmi? Olar saña kelgen vaqıtlarında, seni Allaһ selâmlamağan şekilde
          selâmlamaqtalar. Oz içlerinden de: Bu söylegenlerimiz sebebinden, Allaһnıñ bizge
          azap etüvi kerekmez edimi? derler. Ceennem olarğa yeter, o yerge kirecekler. Ne
          fena dönüş yeridir o yer! (Bular yeudiyler ve munafıqlar ediler. Musulmanlarnı
          yanında işaretlernen gizligizli qonuşa, mu’minlerniñ yureklerine şube soqmağa
          çalşa, cenkte mucahidlerniñ mağlüp olğanları, artta qalğanlarnı da
          oldürilgenleri issini uyandırmağa çalşa ediler. Az.Peyğamber olarnı bu
          ahlâqsızlardan men etken edi. Yeudiylerniñ bir başqa ahlâqsızlığı da,
          Az.Peyğambernen rastkelişkenlerinde: «Saña olüm olsun», manasındaki «Es-saamu
          aleyh» şeklinde selâm berüvleri edi. Az.Peyğamber olarnı bu sayğısız qaba
          ifadelerine «sizge olsun» manasında «Aleykum» şeklinde qarşılıq berir, nazik ve
          mulâyim tavurını deñiştermez edi).
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Ey, iman etkenler! Arañızda gizli laf etecek vaqtıñızda gunahnı, duşmanlıqnı ve
          peyğamberge qarşı kelmekni fısıldamañ. Yahşılıq ve taqvanı qonuşıñ. Uzuruna
          toplanacaq Allaһtan qorquñ. (Hitap etilgenler mu’minlermi, yoqsa, korünişte
          inanğan kibi korüngen munafıqlarmı, bular aqqında çeşit fikrler bar, er eki
          toplulıqqa dair ola bilecek mana da berilgen).
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Gizli qonuşuvlar şeytandandır. Bu, iman etkenlerni kederlendirmek içündir.
          Albuki, şeytan, Allaһnıñ izni olmağance, mu’minlerge iç bir zarar beralmaz.
          Mu’minler Allaһqa tayanıp işansınlar. (Bu ayet ile fısıltınıñ ve toplulıqta
          gizli qonuşuvnıñ şeytannıñ işlerinden olğanı hatırlatılaraq, bu işniñ
          bıraqılması istenelmekte).
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Ey, iman etkenler! Sizge: «Meclislerde yer açıñ», denilgeninen, yer açıñ ki,
          Allaһ da sizge kenişlik bersin. Sizge «qalqıñ», denilgeninen de, qalqıñ ki,
          Allaһ sizden inanğanlarnı ve ozlerine ilim berilgenlerni derecelernen
          yukseltsin. Allaһ yapqanlarıñızdan haberdardır. (Edeb-i muaşeret qaidelerinden
          birini ogretken bu ayetke kore, mejliste yer açmaq, kelgenlerge yer bererek
          qalqmaq - çeşit maddiy ve maneviy faydalar teminlemekte. Zira, iman ve ilimnen
          tamamlanğan ahlâq qaidelerini yaşağanlar dünya ve ahirette yuksek derecelerge
          irişirler).
        cid: 0
  - verse: 12
    segments:
      - text: >-
          Ey, iman etkenler! Peyğambernen gizli bir şey qonuşacaq vaqtıñızda, bu
          qonuşmañızdan evel, bir sadaqa beriñiz. Bu siz içün daa hayırlı ve daa temizdir.
          Eger bir şey tapalmasañız, biliñ ki, Allaһ bağışlayıcıdır, merhametlidir. (Bu
          emir Az.Peyğamberge sayğı kosterilüvi, faqırlarğa yardım etilüvi, sual soravda
          da ileri ketilmemesi, ihlâslı insanlarnen munafıqlarnıñ, ahiretni sevgenlernen
          dünyağa meyl bergenlerniñ meydanğa çıqaruvı kibi ikmetlerni ifade etmekte.
          Ayrıca, bu ayet Az.Peyğambernen kerekli-kereksiz korüşip, qonuşmaq istegen ve
          onı raatsız etkenlerniñ ziyaretini de bir tertipke qoyğan).
        cid: 0
  - verse: 13
    segments:
      - text: >-
          Gizli bir şey qonuşuvıñızdan evel, sadaqalar berüvden çekindiñizmi? Bunı
          yapmağanıñızğa ve Allaһ da sizni afu etkenine kore, artıq namaznı qılıñ, zekâtnı
          beriñ, Allaһqa ve Resulına itaat etiñ. Allaһ yapqanlarıñızdan haberdardır. (Bu
          ayet evelki ayetniñ ukmini nesh eterek, sadaqa mejburiyetini yengilyetken,
          berilmegen vaqıtta esapqa çekilmeyceklerini bildirgen).
        cid: 0
  - verse: 14
    segments:
      - text: >-
          Allaһ ozlerine ğadap etken bir toplulıqnı dost tutqanlarnı kormediñmi? Olar ne
          sizdendirler, ne de olardan. Bilerek yalan yerge yemin etmekteler. (Korülip
          bilinüvi istenilgen toplulıq munafıqlardır, bular Allaһnıñ ğadabına oğrağan
          yeudiylerni ozlerine dost tutmağa çalışqan ediler, munafıqlar mu’min olğanlarını
          söylegen ve yemin etken yalancılardır).
        cid: 0
  - verse: 15
    segments:
      - text: >-
          Allaһ olarğa çetin bir azap azırlağandır. Aqiqaten, olarnıñ yapqan şeyleri çoq
          fenadır!
        cid: 0
  - verse: 16
    segments:
      - text: >-
          Olar yeminlerini qalqan etip, Allaһ yolundan çevirdiler. Bu sebepten, olarğa
          aşşalayıcı bir azap bardır.
        cid: 0
  - verse: 17
    segments:
      - text: >-
          Olarnıñ malları da, oğulları da, Allaһqa nisbeten ozlerine bir fayda bermez.
          Olar ceennem ehlidirler, o yerde ebediy qalacaqlar.
        cid: 0
  - verse: 18
    segments:
      - text: >-
          O kunü Allaһ olarnıñ episini ğayrıdan tiriltecek, olar da, dünyada sizge yemin
          etkenleri kibi, Oña yemin etecekler. Ozlerini bir şey (aqiqat) uzerinde olğan
          sanarlar. Yahşı biliñ ki, olar aqiqaten yalancılardır. (Munafıqlar Allaһnıñ
          uzurunda musulman olğanlarına yemin etüvleri de ozlerine bir fayda bermez).
        cid: 0
  - verse: 19
    segments:
      - text: >-
          Şeytan olarnı tesiri altına aldı da, olarğa Allaһnı añmaqnı unuttırdı. İşte,
          olar şeytannıñ tarafdarlarıdır. Yahşı biliñ ki, şeytannıñ tarafdarları ep
          zarardadırlar.
        cid: 0
  - verse: 20
    segments:
      - text: >-
          Allaһqa ve Peyğamberine duşman olğanlar, işte olar eñ aşşalarnıñ
          arasındadırlar.
        cid: 0
  - verse: 21
    segments:
      - text: >-
          Allaһ: Elbette, men ve elçilerim ğalip kelecekmiz, diye yazğandır. Şubesiz,
          Allaһ kuçlüdir, ğaliptir.
        cid: 0
  - verse: 22
    segments:
      - text: >-
          Allaһqa ve ahiret kunüne inanğan bir toplumnıñ -babaları, oğulları, qardaşları,
          ya da aqrabaları da olsa- Allaһqa ve Resulına duşman olğanlarnen dostlıq
          etkenini koralmazsıñ. İşte, olarnıñ qalbine Allaһ iman yazğan ve qatından bir
          ruh ile olarnı desteklegen. Olarnı içlerinden irmaqlar aqqan cennetlerge
          qoyacaq, o yerde ebediy qalacaqlar. Allaһ olardan razı olğan, olar da Allaһtan
          hoşnut olğanlar. İşte, olar, Allaһ tarafında olğanlardır. Yahşı biliñ ki,
          qurtulışqa irişecekler de, sadece Allaһ tarafında olğanlardıң.
        cid: 0