surah_id: 36
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >-
          Yaasiin.
        cid: 0
  - verse: 2
    segments:
      - text: >-
          İkmet tolu Qur’an aqqı içün,
        cid: 0
  - verse: 3
    segments:
      - text: >-
          Sen, şubesiz, peyğamberlerdensiñ.
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Doğru yol uzerindesiñ.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          (Bu Qur’an) ustün ve çoq merhametli Allaһ tarafından endirilgendir.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Ataları tenbiyelenmegen, bu sebebten, ozleri de ğaflet içinde qalğan bir
          toplumnı tenbiyeleviñ içün endirilgendir.
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Ant olsun ki, olarnıñ çoqu ğafletleriniñ cezasını bulğandırlar. Çünki, olar
          iman etmeyler.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Biz olarnıñ boyunlarına alqalar keçirdik. O alqalar çengelerine qadar
          tayanmaqtadır. Bunıñ içün başları yuqarı qalqıqtır. (Ayet iman etmegenleri içün,
          ceza korecek kâfirler vaziyetiniñ temsiliy bir ifadesidir).
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Oglerinden bir sed ve artlarından bir sed çektik de, olarnı qapattıq, artıq
          koralmazlar. (İman yolları olarğa qapalı olğanı içün haqnı koralmazlar).
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Olarnı tenbiyeleseñ de, tembiyelemeseñ de, olar içün birdir, inanmazlar.
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Sen ancaq zikrge (Qur’anğa) uyğan ve kormegeni alda, Rahmandan qorqqan kimseni
          tenbiyeley bilirsiñ. İşte, boylesini bir mağfiret ve guzel bir mukâfat ile
          mujdele.
        cid: 0
  - verse: 12
    segments:
      - text: >-
          Şubesiz, olülerni ancaq biz tiriltirmiz. Olarnıñ yapqan er işlerini, bıraqqan
          er izlerini yazarmız. Biz er şeyni ap-açıq bir kitapta (levh-i mahfuzda) sayıp
          yazğandırmız. (Olülerni tiriltmek tabiri - caillerni hidayetke iriştirmek,
          muşriklerni şirkten imanğa döndürmek şeklinde de tefsir etilgen).
        cid: 0
  - verse: 13
    segments:
      - text: >-
          Olarğa şu şeer halqını misal ketir: O vaqıtta olarğa, elçiler kelgen edi. (Bu
          şeerniñ Antaqiya olğanı aytıla).
        cid: 0
  - verse: 14
    segments:
      - text: >-
          Olarğa o zaman biz eki elçi yollağan edik; Olarnı yalanladılar. Bunıñ uzerine
          uçünci bir elçi yolladıq. Olar: Biz sizge yollanılğan Allaһ elçilerimiz,
          dediler.
        cid: 0
  - verse: 15
    segments:
      - text: >-
          Elçilerge dediler ki: Siz de, ancaq bizim kibi, birer insansıñız. Rahman, iç
          bir şey endirmedi. Siz, ancaq yalan söylemektesiñiz.
        cid: 0
  - verse: 16
    segments:
      - text: >-
          (Elçiler) dediler ki: Rabbimiz bile; biz, aqiqaten sizge yollanılğan
          elçilermiz. 17. «Bizim vazifemiz açıq bir şekilde Allaһnıñ emirlerini sizge
          tebliğ etüvden başqa bir şey degil» dediler.
        cid: 0
  - verse: 17
    segments:
      - text: >-
          (Bunıñ uzerine olar:) Doğrusı, siz bizge oğursız keldiñiz. Eger bu işten
          vazgeçmeseñiz, ant olsun, sizni taşboranğa tutacaqmız ve bizden sizge mıtlaqa
          fena bir yamanlıq toqunır, dediler.
        cid: 0
  - verse: 18
    segments:
      - text: >-
          Elçiler boyle cevap berdiler: Siziñ oğursızlığıñız siznen beraberdir. Sizge
          nasiat etile ise, bu oğursızlıqmı? Doğrusı, siz çoqqa çapqan bir milletsiñiz.
        cid: 0
  - verse: 19
    segments:
      - text: >-
          Derken, şeerniñ o bir ucundan bir adam çapıp keldi. «Ey, qavmım! dedi, bu
          elçilerge uyıñız!». 21. «Sizden bir ucret istemegenlerge uyıñ, çünki, olar
          hidayetke irişken kimselerdir». (Bu tevsiyesinden otrü, adamğa dönerek, «Vay,
          sen de olarnıñ dinindensiñmi», dediler. Bunıñ uzerine adam boyle dedi:) 22.
          «Maña ne olğan ki, meni yaratqanğa ibadet etmeycek ekenim! Albuki, epiñiz Oña
          döndürileceksiñiz». 23. «Ondan başqa tañrılar edineyimmi? O bol merhametli
          Allaһ, eger maña bir zarar tilese, olarnıñ (putlarnıñ) şefaatı maña iç bir fayda
          bermez, meni qurtaralmazlar». 24. «İşte, o zaman men açıqtan-açıq bir sapıqlıq
          içine komülgen olurım». 25. «Şubesiz, men Rabbiñizge inandım, meni diñleñ”.
          (Öldan azğanlar bu sözlerni diñlemeyip, o zatnı taş boranına tuttılar. Tam
          olecek esnasında oña:)
        cid: 0
  - verse: 20
    segments:
      - text: >-
          Cennetke kir! denildi. «Keşke, dedi, Rabbimniñ meni bağışlağanını ve meni
          ikramğa nail olğanlardan etkenini qavmım bilse edi!».
        cid: 0
  - verse: 21
    segments:
      - text: >-
          [20 ayetine baq.]
        cid: 0
  - verse: 22
    segments:
      - text: >-
          Biz ondan soñ, onıñ milletini elâk etmek içün, uzerlerine kokten iç bir ordu
          endirmedik ve endirecek de degil edik.
        cid: 0
  - verse: 23
    segments:
      - text: >-
          (Olarnı elâk etken) qorqunç sesten başqa bir şey degil edi. Aman sönüp
          kettiler.
        cid: 0
  - verse: 24
    segments:
      - text: >-
          Ne yazıq şu qullarğa! Olarğa bir peyğamber kelmey korsin, ille de onıñnen alay
          etmege qalqışırlar.
        cid: 0
  - verse: 25
    segments:
      - text: >-
          Muşrikler kormeylermi ki, olardan evel nice qavmlarnı elâk ettik. Olar, tekrar
          dönüp de, bularğa kelmezler.
        cid: 0
  - verse: 26
    segments:
      - text: >-
          Elbette, olarnıñ episi (qıyamet kunü) qarşımızda azır turacaqlar.
        cid: 0
  - verse: 27
    segments:
      - text: >-
          (Bu hususta) olü topraq olar içün muim bir delildir. Biz oña yağmurnen ayat
          berdik ve ondan dane çıqardıq. İşte, olar bundan aşarlar.
        cid: 0
  - verse: 28
    segments:
      - text: >-
          Biz yer yuzünde nice-nice hurma bağçaları, yuzüm bağları yarattıq ve o yerlerde
          bir çoq çoqraqlar fışqırttıq.
        cid: 0
  - verse: 29
    segments:
      - text: >-
          Ta ki, olarnıñ meyvalarından ve ellerinen yetiştirgenlerinden aşasınlar. Alâ
          şukür etmeyceklermi?
        cid: 0
  - verse: 30
    segments:
      - text: >-
          Yerniñ yetiştirgenlerinden, insanlarnıñ ozlerinden ve daa maiyetini bilmegen
          şeylerinden butün çiftlerni yaratqan Allaһ çoq yucedir.
        cid: 0
  - verse: 31
    segments:
      - text: >-
          Gece de, olar içün bir ibret alâmetidir. Biz ondan kundüzni sıyırıp çekermiz
          de, olar qaranlıqlarğa komülirler.
        cid: 0
  - verse: 32
    segments:
      - text: >-
          Kuneş, ozü içün belgilengen yerde aqar (döner). İşte, bu, aziz ve alim olğan
          Allaһnıñ taqdiridir.
        cid: 0
  - verse: 33
    segments:
      - text: >-
          Ay içün de bir taqım (ölaqlar) tayin ettik. Niayet, o, egri hurma dalı kibi
          (hilâl) olur da, keri döner.
        cid: 0
  - verse: 34
    segments:
      - text: >-
          Ne kuneş ayğa yetişe bilir, ne de gece kundüzni keçe bilir. Er biri bir yolaqta
          yaldarlar.
        cid: 0
  - verse: 35
    segments:
      - text: >-
          Olarnıñ zurriyetlerini top-tolu bir gemide taşığanımız da buyuk bir ibrettir.
        cid: 0
  - verse: 36
    segments:
      - text: >-
          Olar içün bunıñ kibi minilecek başqa şeyler de yarattıq.
        cid: 0
  - verse: 37
    segments:
      - text: >-
          İstesek, olarnı suvda boğarmız. O zaman ne olarnıñ imdadına çapqan olur, ne de
          olar qurtarılırlar.
        cid: 0
  - verse: 38
    segments:
      - text: >-
          Ancaq, bizim tarafımızdan bir rahmet ve belli bir zamanğa qadar dünyadan
          faydalandıruvımız istisnadır. (Üce Allaһ 32-nci ayette qıyamet kunünde butün
          insanlarnıñ oz uzurunda toplanacaqlarını bildirgen ve daa soñki ayetlerde de,
          buña qadir olğanına dair bir çoq delil ketirgen. Bu cumleden, olgen topraqnıñ
          tiriltilüvi ve bundan çeşit osümlikler ve meyvalarnıñ elde etilüvi, çift-çift
          varlıqlarnıñ yaratıluvı, gece ve kundüzniñ bir-birini taqip etüvi, kuneşnen
          aynıñ oz yolaqlarında dönüvleri, gemilerniñ deñizde yaldavları ve diger
          minilecek vastalarnıñ yaratıluvı kibi deliller zikr etken. İstegeni taqdirde,
          insanlarnı deñizde boğa bilecegini, rahmet ve taqdiriniñ keregi olaraq, belli
          bir muddet insanlarnı yaşatacağını da bildirgen).
        cid: 0
  - verse: 39
    segments:
      - text: >-
          Olarğa yapayatqan ve yapıp artta qaldırğan işleriñizde Allaһtan qorqıñ; umüt
          etilir ki, sizge merhamet olunır, denilgende (emiyet bermezler).
        cid: 0
  - verse: 40
    segments:
      - text: >-
          Olarğa Rabbleriniñ ayetlerinden bir ayet kelmey tursın, ille de ondan yuz
          çevirgendirler.
        cid: 0
  - verse: 41
    segments:
      - text: >-
          Allaһnıñ sizge rızq olaraq bergenlerinden hayırğa sarf etiñ, denilgeninde
          kâfirler mu’minlerge dediler ki: Allaһ istegen taqdirde toyuracaq kimselerini
          biz toyuracaqmızmı? Siz aqiqaten, açıqtan-açıq bir sapıqlıq içindesiñiz.
        cid: 0
  - verse: 42
    segments:
      - text: >-
          Olar: Eger aqiqaten, doğru sözley iseñiz, bu tehdit ne zaman kerçekleşecek?
          derler.
        cid: 0
  - verse: 43
    segments:
      - text: >-
          Olar bir-birilerinen çekişip turğanlarında, olarnı apansızdan yaqalaycaq
          qorqunç bir sesni beklemekteler.
        cid: 0
  - verse: 44
    segments:
      - text: >-
          İşte, o vaqıtta olar ne bir vasiyette buluna bilirler, ne de qorantalarına döne
          bilirler.
        cid: 0
  - verse: 45
    segments:
      - text: >-
          Niayet, Suurğa uflenecek. Bir de baqarsıñ ki, olar qabirlerinden qalqıp,
          çapışaraq, Rabblerine barırlar.
        cid: 0
  - verse: 46
    segments:
      - text: >-
          (İşte, o vaqıtta:) Ey-vah, ey-vah! Bizni qabrimizden kim turğızdı? Bu,
          Rahmannıñ vadesidir. Peyğamberler aqiqaten doğru söylegenler! derler.
        cid: 0
  - verse: 47
    segments:
      - text: >-
          Olğanı muthiş bir sesten ibarettir. Bunıñ uzerine olarnıñ episi aman uzurımızda
          azır bulunırlar.
        cid: 0
  - verse: 48
    segments:
      - text: >-
          O kunü iç bir kimse eñ ufaq bir aqsızlıqqa oğramaz. Siz o yerde ancaq
          yapqanlarıñıznıñ qarşılığını alırsıñız.
        cid: 0
  - verse: 49
    segments:
      - text: >-
          O kunü cennetliler, aqiqaten nimetler içinde sefa sürerler.
        cid: 0
  - verse: 50
    segments:
      - text: >-
          Olar ve zevceleri kolgeler altında tahtlarğa qurulırlar.
        cid: 0
  - verse: 51
    segments:
      - text: >-
          O yerde olar içün er çeşit meyva bardır. Butün arzuları yerine ketirilir.
        cid: 0
  - verse: 52
    segments:
      - text: >-
          Olarğa merhametli Rabbiñ söyledigi selâm bardır.
        cid: 0
  - verse: 53
    segments:
      - text: >-
          «Ayırılıñ bir tarafqa bugun, ey, gunahkârlar!»
        cid: 0
  - verse: 54
    segments:
      - text: >-
          «Ey, Adem oğulları! Sizge şeytanğa tabınmañız, çünki, o siziñ ap-açıq bir
          duşmanıñızdır» demedimmi?
        cid: 0
  - verse: 55
    segments:
      - text: >-
          «Ve maña qullıq etiñ, bu doğru yoldır» demedimmi?“.
        cid: 0
  - verse: 56
    segments:
      - text: >-
          Şeytan sizden pek çoq milletni qandırıp, saptırdı. Alâ aqıl
          yetiştioalmaysıñızmı?
        cid: 0
  - verse: 57
    segments:
      - text: >-
          İşte, bu sizge vade etilgen ceennemdir.
        cid: 0
  - verse: 58
    segments:
      - text: >-
          İnkârıñız sebebinen, bugun o yerge kiriñ!
        cid: 0
  - verse: 59
    segments:
      - text: >-
          O kunü olarnıñ ağızlarını muurlermiz; yapqanlarını bizge elleri añlatır,
          ayaqları da şaatlıq eter.
        cid: 0
  - verse: 60
    segments:
      - text: >-
          İstesek, olarnıñ kozlerini bus-butün kor eter edik. O vaqıtta doğru yolnı
          tapmağa çapışırlar, amma nasıl korecek ediler?
        cid: 0
  - verse: 61
    segments:
      - text: >-
          Eger istesek, olğan yerlerinde olarnıñ şekillerini deñiştirir edik de, ne ogge
          yurmege kuçleri yeter edi, ne de artqa qaytmağa!
        cid: 0
  - verse: 62
    segments:
      - text: >-
          Kimge uzun omür bersek, biz onıñ yaratılışını (qartlıqnen şeklini) tersine
          çevirirmiz. İç tüşünmeylermi?
        cid: 0
  - verse: 63
    segments:
      - text: >-
          Biz oña (Peyğamberge) şiir ogretmedik. Zaten, oña yaraşmaz edi de. Onıñ
          söylegenleri, ancaq Allaһtan kelgen bir ogüt ve açıqtan-açıq Qur’andır.
        cid: 0
  - verse: 64
    segments:
      - text: >-
          Tiri olğanlarnı tenbiyelesin ve kâfirler cezanı haq etsinler diye.
        cid: 0
  - verse: 65
    segments:
      - text: >-
          Kormeylermi ki, biz qudretimizniñ eseri olmaq uzre, olar içün bir çoq ayvan
          yarattıq. Bu sayede olar bularğa saip olğandırlar.
        cid: 0
  - verse: 66
    segments:
      - text: >-
          Bu ayvanlarnı olarnıñ emirlerine berdik. Olarnıñ bazılarını minmek içün
          qullanırlar, bazısını beslenmek içün aşarlar.
        cid: 0
  - verse: 67
    segments:
      - text: >-
          Bu ayvanlarda olar içün nice faydalar ve içilecek sutler bar. Alâ şukür
          etmezlermi?
        cid: 0
  - verse: 68
    segments:
      - text: >-
          Olar, yardım koreceklerini umüt eterek, Allaһtan başqa ilâhlar edindiler.
        cid: 0
  - verse: 69
    segments:
      - text: >-
          Albuki, ilâhlarnıñ olarğa yardım etmege kuçleri yetmez. Aksine, ozleri bular
          içün yardımğa azır askerlerdir.
        cid: 0
  - verse: 70
    segments:
      - text: >-
          (Resulım!) O alda, olarnıñ sözleri saqın seni kederlendirmesin. Şubesiz, biz
          olarnıñ gizlegenlerini de, aşkâr etkenlerini de bilmektemiz. (Olgenden soñ
          tirilmekni inkâr etken Ubey b.Halef çürügen bir kemik alpp, elinde ufqalağandan
          soñ, Resulullahqa dönerek: «Allaһ bu çürügen kemiklerni tekrar tiriltecegine
          inanasıñmı?», dedi. Resulullah (s.a.): «Ebet, seni tiriltecek ve ceennemge
          soqacaq», diye cevap berdi. Bunıñ uzerine 77 ve 78-nci ayetler nazil oldı).
        cid: 0
  - verse: 71
    segments:
      - text: >-
          İnsan kormezmi ki, biz onı nutfeden yarattıq. Bir de baqasıñ ki, ap-açıq duşman
          kesilgen.
        cid: 0
  - verse: 72
    segments:
      - text: >-
          Ozüniñ yaratılışını unutıp, bizge qarşı misal ketirmege qalqışa ve: «Şu çürügen
          kemiklerni kim tiriltecek?» dey.
        cid: 0
  - verse: 73
    segments:
      - text: >-
          De ki: Olarnı ilk kere yaratqan tiriltecek. Çünki, O, er türlü yaratuvnı ğayet
          yahşı bilir.
        cid: 0
  - verse: 74
    segments:
      - text: >-
          Yaş ağaçtan sizge ateş çıqarıcı Odır. İşte, ateşni siz ondan yaqmaktasıñız.
          (Bedeviyler ağaçlarnı bir-birine ışqalayaraq ve yaqaraq, ateş elde ete ediler.
          Yem-yeşil ağaçtan ateş çıqarmağa qadir olğan Allaһ çürügen kemiklerni tiriltmege
          de qadirdir. Ayette buña işaret etilmekte).
        cid: 0
  - verse: 75
    segments:
      - text: >-
          Koklerni ve yerni yaratqan, olarğa beñzegenlerni yaratmağa qadir degilmi? Ebet!
          Elbette, qadirdir. O, er şeyni haqqı ile bilici, yaratıcıdır.
        cid: 0
  - verse: 76
    segments:
      - text: >-
          Bir şey yaratmaq istegen vaqtında, Onıñ yapqanı «Ol» deyuvden ibarettir. Aman
          olur.
        cid: 0
  - verse: 77
    segments:
      - text: >-
          Er şeyniñ mulki oz elinde olğan Allaһnıñ şanı ne qadar yucedir! Siz de Oña
          döneceksiñiz.
        cid: 0