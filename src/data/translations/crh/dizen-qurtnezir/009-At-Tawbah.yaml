surah_id: 9
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >
          Allah ve Resulından olarnen antlaşuv yaptığıñız müşriklerge bir ihtar!
        cid: 0
  - verse: 2
    segments:
      - text: >
          (Ey, müşrikler!) Yer yüzünde dört ay daa dolaşıñ. Yahşı biliñ ki, siz Allahnı
          aciz bıraqacaq degilsiñiz; Allah ise, kâfirlerni rezil (ve perişan) etecek.
        cid: 0
  - verse: 3
    segments:
      - text: >
          Hac-ı ekber (eñ büyük hac) kününde Allah ve Resulından insanlarğa bir
          bildirüvdir: Allah ve Resulı müşriklerden uzaqtır. Eger tövbe etseñiz, bu siz
          içün daa hayırlıdır. Ve eger yüz çevirseñiz, biliñ ki, siz Allahnı aciz bıracaq
          degilsiñiz. (Ey, Muhammed)! O kâfirlerge elem berici bir azapnı müjdele.
        cid: 0
  - verse: 4
    segments:
      - text: >
          Ancaq, özlerinen antlaşuv yaptığıñız müşriklerden (antlaşuv şartlarına uyğan) iç
          bir şeyni sizge eksik bıraqmağan ve siziñ aleyhiñizge er angi bir kimsege arqa
          olmağanlar (bu ükümniñ) tışındadır. Olarnıñ antlaşuvlarını, müddetleri bitkenge
          qadar, tamamlañız. Allah (aqsızlıqtan) saqınğanlarnı sever.
        cid: 0
  - verse: 5
    segments:
      - text: >
          Aram aylar çıqqanınen, müşriklerni tapqan yeriñizde öldüriñ; olarnı yaqalañ,
          olarnı aps etiñ ve olarnı er nezaret yerinde oturıp bekleñ. Eger tövbe etseler,
          namaznı dost-doğru qılsalar, zekâtnı da berseler, artıq yollarını serbest
          bıraqıñ. Allah bağışlayıcı, merhametlidir.
        cid: 0
  - verse: 6
    segments:
      - text: >
          Ve eger müşriklerden biri senden amanlıq istese, Allahnıñ kelâmını eşitip
          diñlegenge qadar, oña amanlıq ber, (musulman olmasa) onı işanç içinde bulunacaq
          bir yerge yetiştir. İşte, bu (yahşılıq), olarnıñ bilmegen bir qavm oluvlarından
          tolayıdır.
        cid: 0
  - verse: 7
    segments:
      - text: >
          Mescid-i Haramnıñ yanında olarnen antlaşuv yapqanlarıñızdan ğayrı, müşriklerniñ
          Allah ve Resulı yanında nasıl (muteber) bir ahtı ola bilir? Olar sizge nisbeten
          dürüst davranğan müddetlerince siz de olarğa dürüst davranıñ. Çünki, Allah
          (ahtnı bozuvdan) saqınğanlarnı sever. (Tefsircilerge köre, ayette istisna
          etilgenler, Hudaybiye antlaşuvına çetten olaraq iştirak etken Huzeyme ve Mudlic
          oğullarıdır. Qureyş ve olarğa bağlı diger müşrikler antlaşuvnı bazğanları içün,
          musulmanlar areketke keçti ve Mekkeni feth ettiler. Antlaşuvnı bozmağan
          qabilelerge ise toqunmadılar).
        cid: 0
  - verse: 8
    segments:
      - text: >
          Nasıl ola bilir ki! Olar sizge ğalip kelseler edi, siziñ aqqıñızda ne aht, ne de
          antlaşuv közeter ediler. Olar ağızlarınen sizni razı ete ediler, albuki qalpleri
          (buña) qarşı çıqmaqta. Çünki, olarnıñ çoqu yoldan çıqqanlardır.
        cid: 0
  - verse: 9
    segments:
      - text: >
          Allahnıñ ayetlerine qarşılıq az bir degerni (dünya malını ve nefsaniy
          isteklerni) satın aldılar da, (insanlarnı) Onıñ yolundan çıqardılar. Aqiqaten
          olarnıñ yapayatqan şeyleri ne fenadır!
        cid: 0
  - verse: 10
    segments:
      - text: >
          Bir mü'min aqqında ne aht tanırlar, ne de antlaşuv. Çünki, olar basqıncılarnıñ
          özleridir.
        cid: 0
  - verse: 11
    segments:
      - text: >
          Faqat tövbe etse, namaz qılsa ve zekât berse, artıq olar dinde qardaşlarıñızdır.
          Biz bilgen bir qavmğa ayetlerimizni böyle beyan etmektemiz.
        cid: 0
  - verse: 12
    segments:
      - text: >
          Eger antlaşuvlarından soñ, yeminlerini bozsalar ve diniñizge ücüm etseler,
          küfürniñ reberlerine qarşı cenkleşiñ. Çünki, olar yeminleri olmağan adamlardır.
          (Olarğa qarşı cenkleşseñiz) ümüt etilir ki, küfürni toqtatırlar.
        cid: 0
  - verse: 13
    segments:
      - text: >
          (Ey, mü'minler!) Bergen sözlerini bozğan, Peyğamberni (yurtundan) çıqarmağa
          areket etken ve ilk evelâ sizge qarşı cenk başlağan bir qavmğa qarşı
          cenkleşmeyceksiñizmi; yoqsa, olardan qorqasıñızmı? Eger (aqiqiy) mü'minler
          iseñiz, biliñ ki, Allah özünden qorquvıñızğa daa lâyıqtır.
        cid: 0
  - verse: 14
    segments:
      - text: >
          Olarnen cenkleşiñ ki, Allah siziñ elleriñiznen olarnı cezalandırsın; olarnı
          rezil etsin; sizni olarğa ğalip yapsın ve mü'min toplumınıñ qalplerini
          ferahlandarsın.
        cid: 0
  - verse: 15
    segments:
      - text: >
          Ve olarnıñ (mü'minlerniñ) qalplerinden öpkeni silsin. Allah istegeniniñ
          tövbesini qabul eter. Allah bilicidir, ikmet saibidir. (Etraftaki memleketlerden
          Medinege kelip, musulman olğandan soñ, ülkelerine qaytqan mü'minler o ülke halqı
          tarafından eskencege alına, bu sebepten, olarğa nisbeten teren bir öpke besley
          ediler. İşte, bu ayette o mü'minlerniñ vaziyetine işaret etile. Buña köre, o
          eskenceciler tövbe etip, musulman olsalar, Allah Taalâ olarnıñ tövbesini de
          qabul etecegini bildirmekte. Çünki, Allah er şeyniñ ikmetini pek yahşı bilir).
        cid: 0
  - verse: 16
    segments:
      - text: >
          Yoqsa, Allah, sizden cihad etip, Allah, Peyğamber ve mü'minlerden başqasını
          özlerine sırdaş edinmegenlerini ortağa çıqarmadan bıraqılacaqsıñız sandıñızmı?
          Allah yapqalarıñızdan haberdardır. (Peyğamberimizniñ emcesi Abbas b.
          Abdulmuttalib Bedir cenkinde esir olğan vaqıtta musulmanlar, müşrik olğanı ve
          aqrabasınen bağını keskeni sebebinden, onı ayıplağan ediler. Az. Ali ise, daa
          ağır sözler söylegen edi. Abbas dedi ki: «Bizim fena taraflarımıznı söyley, eyi
          taraflarımıznı gizleysiñiz. Biz Mescid-i Haramnı abadanlaştırmaqtamız, Kâbeniñ
          bekçiligini yapmaqtamız, hacılarğa suv dağıtamız ve esirlerni serbest
          bıraqmaqtamız». Bunıñ üzerine aşağıdaki ayet endi).
        cid: 0
  - verse: 17
    segments:
      - text: >
          Allahqa ortaq qoşqanlar, özleriniñ kâfirligine şahsen özleri şaatlıq eter
          ekenler, Allahnıñ Mescitlerini abadanlaştırmaq selâhiyetleri yoqtır. Olarnıñ
          bütün işleri zayadır. Ve olar ateşte ebediy qalacaqlar.
        cid: 0
  - verse: 18
    segments:
      - text: >
          Allahnıñ mescitlerini ancaq Allahqa ve ahiret kününe iman etken, namaznı
          dos-doğru qılğan, zekâtnı bergen ve Allahtan başqasından qorqmağan kimseler
          abanlaştırır. İşte, doğru yolğa irişkenlerden oluvlarına ümüt etilgenler
          bulardır.
        cid: 0
  - verse: 19
    segments:
      - text: >
          (Ey, müşrikler!) Siz hacılarğa suv bermekni ve Mescid-i Haramnı oñarmaqnı,
          Allahqa ve ahiret kününe iman etip de, Allah yolunda cihad etkenlerniñ imanınen
          bir tutasıñızmı? Albuki, olar Allah qatında bir degiller. Allah zalımlar
          toplulığını hidayetke iriştirmez. (Bu ayetke köre, dindarlıq bir taqım şekliy
          merasimlerden evel, bir iman, tasdiq ve Allah rizası içün ğayret demektir. Bu
          şartlar kerçekleşkenden soñradır ki, hacılarğa suv bermek, Mescid-i Haramnı
          oñarmaq ve baqımını teminlemek kibi hızmetler Allah nezdinde bir qıymet ifade
          eter).
        cid: 0
  - verse: 20
    segments:
      - text: >
          İman etip de, icret etkenler ve Allah yolunda mallarınen, canlarınen cihad
          etkenler, rutbe noqtai nazarından, Allah qatında daa üstündirler. Qurtulışqa
          irişkenler de, işte olardır.
        cid: 0
  - verse: 21
    segments:
      - text: >
          Rabbleri olarğa, tarafından bir rahmet ve hoşnutlıqnen,özleri içün içinde
          tükenmez nimetler bulunğan cennetler müjdeler.
        cid: 0
  - verse: 22
    segments:
      - text: >
          Olar o yerde ebediy qalacaqlar. Şübesiz ki, Allah qatında büyük mükâfat bardır.
        cid: 0
  - verse: 23
    segments:
      - text: >
          Ey, iman etkenler! Eger küfürni imandan üstün körseler, babalarıñız ve
          qardaşlarıñıznı (bile) veli tutmañız. Sizden kim olarnı dost tutsa, işte olar
          zalımlarnıñ özleridir.
        cid: 0
  - verse: 24
    segments:
      - text: >
          De ki: Eger babalarıñız, oğullarıñız, qardaşlarıñız, çiftleriñiz,
          hısım-aqrabañız qazanğan mallarıñız, kesatqa oğravundan qarqqan ticaretiñiz,
          hoşlanğan meskenleriñiz sizge Allahtan, Resulından ve Allah yolunda cihad
          etüvden daa sevimli ise, artıq Allah emrini ketirgenge qadar bekleñ. Allah
          fasıqlar taplulığını hidayetke iriştirmez. (Resulullah (s.a.) Mekkeni feth
          etkenden soñ, on eki biñ adamlıq bir ordunen Taifteki Hevazin ve Sakif
          qabileleriniñ üstüne yürdi. İslâm ordusınıñ çoqluğını körgen bazı musulmanlar:
          «Bu ordu artıq yeñilmez», şeklinde qonuşaraq, özlerini büyük sandılar. Faqat
          Huneyn vadisinde özlerinden çoq daa bir müşrik ordusınen qarşılaşqanda,
          dağıldılar. Çünki, olar çoq olğanlarına işanğan ediler. İşte, aşağıdaki ayette
          olarnıñ bu vaziyetine işaret etile).
        cid: 0
  - verse: 25
    segments:
      - text: >
          Ant olsun ki, Allah bir çoq yerde (cenk meydanlarında) ve Huneyn cenkinde sizge
          yardım etken edi. Hatırıñızdamı, çoqluğıñız sizge özüñizni begendirgen, faqat
          sizni dağıluvdan qurtaramağan edi. Yer yüzü, bütün kenişligine rağmen, sizge tar
          kelgen edi, soñunda (dağılaraq) keri qaytqan ediñiz.
        cid: 0
  - verse: 26
    segments:
      - text: >
          Soñra, Allah Resulınen mü'minler üzerine sekinetini (sükünet ve uzur duyğusı)
          endirdi, siz körmegen ordular (melekler) endirdi de, kâfirlerge azap etti. İşte
          bu, o kâfirlerniñ cezasıdır.
        cid: 0
  - verse: 27
    segments:
      - text: >
          Soñra, Allah bunıñ artından kene istegeniniñ tövbesini qabul eter. Zira, Allah
          bağışlayıcı, merhametlidir.
        cid: 0
  - verse: 28
    segments:
      - text: >
          Ey, iman etkenler! Müşrikler ancaq bir pisliktir. Onıñ içün bu yıllardan soñ,
          Mescd-i Haramğa yaqlaşmasınlar. Eger yoqsuzlıqtan qorqsañız, (biliñ ki) Allah
          istese, sizni öz lütfinden zengin etecektir. Şübesiz, Allah eyi bilicidir, ikmet
          saibidir.
        cid: 0
  - verse: 29
    segments:
      - text: >
          Özlerine Kitap berilgenlerden Allahqa ve ahiret kününe inanmağan, Allah ve
          Resulınıñ aram etkenlerini aram saymağan ve haq dinni özüne din edinmegen
          kimselernen, alçalaraq ellerinen vergi bergenge qadar cenkleşiñ.
        cid: 0
  - verse: 30
    segments:
      - text: >
          Yeudiyler, Uzeyr Allahnıñ oğludır, dediler. Hristianlar da, Mesih (İsa) Allahnıñ
          oğlu, dediler. Bu olarnıñ ağızlarında kevşegen sözleridir. (Sözlerini) daa evel
          kâfir olğan kimselerniñ sözlerine beñzetmekteler. Allah olarnı qahr etsin! Nasıl
          da (haqdan batılğa) döndürilmekteler!
        cid: 0
  - verse: 31
    segments:
      - text: >
          (Yeudiyler) Allahnı bıraqıp, bilmirlerini (hahamlarını); (hristianlar) da
          rahiplerini ve Meryem oğlu Mesihni (İsanı) raber edindiler. Albuki, olarğa ancaq
          tek ilâhqa qullıq etüvleri emir olundı. Ondan başqa tañrı yoqtır. O bularnıñ
          ortaq qaşqan şeylerinden uzaqtır. (Yeudiylerniñ Muqaddes Kitaplarını taşığan
          sandıq bir qaç kere duşmanlarınıñ eline keçken, Muqaddes Kitap basqıncılıqqa
          oğrağan ve şahsen Az.Musağa berilgen levhalar coyulğan. Yeudiy din adamları
          afızalarında qalğan bazı ayetlerni parça-parça yazğan ediler. Babil esaretinde
          yahşı bir yazıcı olğan kâhin Ezra söznen ve qısmen yazılı rivayetlerni bir yerge
          toplap, yeudiy muqaddes kitabını meydanğa çıqarğan edi. Bu hızmetlrerinden
          tolayı, Ezra İsrail oğullarınıñ sayğısını qazanğan, bu sayğı, vaqtı ile, o qadar
          adden ziyade bir noqtağa çıqqan ki, yeudiyler, Ezranı Allahnañ oğlu sayğan
          ediler. İşte, yuqarıdaki ayette buña işaret etile).
        cid: 0
  - verse: 32
    segments:
      - text: >
          Allahnıñ nurını ağızlarınen (üflep), söndürmek isteyler. Albuki, kâfirler
          hoşlanmasalar da, Allah nurını tamamlavdan asla vazgeçmez. (Tefsircilerniñ
          çoquna köre, ayette keçken «Allahnıñ nurı» Kuran-ı Kerim ya da İslâm dinidir).
        cid: 0
  - verse: 33
    segments:
      - text: >
          O (Allah), müşrikler hoşlanmasalar da, (öz) dinini bütün dinlerge üstün yapmaq
          içün, resulını hidayet ve Haq Din ile yollayıcıdır.
        cid: 0
  - verse: 34
    segments:
      - text: >
          Ey, iman etkenler! (Biliñ ki), hahamlardan ve rahiplerden bir çoqu insanlarnıñ
          mallarını aqsız yollarnen aşarlar ve (insanlarnı) Allah yolundan çevirirler.
          Altın ve kümüşni toplap da, olarnı Allah yolunda arclamağanlar yoqmı, işte,
          olarğa elem berici bir azapnı müjdele! (Yeudiy hahamlarınen hristian rahipleri
          Muqaddes Kitaplarındaki ayetlerni dünya menfaatı (alğan qabarları) qarşılığında
          ya deñiştire, ya da ükmini menfaatları yönelişinde yorumlay ediler. Hususen,
          Az.Muhammedniñ Peyğamberliginen bağlı ayetlerni bozup deñiştirdiler. İşte,
          yuqarıdaki ayette olarnıñ bu çirkin işlerine işaret etilmekte. Ayrıca, altın ve
          kümüşni ya da mevcut paranı, ya da malnı bıraqtırıp da, zekâtını bermegen,
          hayırlı ve faydalı işlerde qullanmağanlarnıñ ahirette şiddetli azapnen
          cezalanacaqlarını da haber bermekte).
        cid: 0
  - verse: 35
    segments:
      - text: >
          (Bu paralar) ceennem ateşinde qızdırılıp, bularnen olarnıñ mañlayları,
          yanbaşları ve sırtları yaqılacaq künü (olarga denilir ki): «İşte bu, özüñiz içün
          toplağan servetiñizdir. Artıq toplayatqan şeyleriñizniñ (azabını) tatıñ!»
        cid: 0
  - verse: 36
    segments:
      - text: >
          Köklerni ve yerni yaratqan kününde Allahnıñ yazısına köre, Allah qatında
          aylarnıñ sayısı on eki olup, bulardan dördü aram aylardır. İşte bu, doğru
          esaptır. O aylar içinde (Allahnıñ qoyğan yasağını ezerek) özüñizge zulum etmeñ
          ve müşrikler siznen nasıl birlik olup cenkleşseler, siz de olarğa qarşı birlik
          olup cenkleşiñ ve biliñ ki, Allah (fenalıqtan) saqınğanlarnen beraberdir. (Allah
          Taalâ köklerni ve yerni yaratqan vaqıtta, Aynıñ arektini öyle tertipledi ki, ay
          sistemasına köre, bir yılda on eki ay meydanğa keldi ve bir yıl 355 kün oldı. Bu
          aylarnıñ adları böyledir: Muharrem, Sefer, Rebiul-evel, Rebiul-ahir,
          Cemadiul-evel, Cemadiul-ahir, Recep, Şaban, Ramazan, Şavvel, Zilqade, Zilhicce.
          Ayette işaret etilgen «aram aylar» - Zilqade, Zilhicce, Muharrem ve Recep
          aylarıdır ki, bu sureniñ 5-nci ayetinden de añlaşılğanı kibi, bu aylarda cenk
          yasaqlanğan). (Cahiliye devrinde bir-birinen çarpışmağa ve talancılıqqa alışqan
          araplarğa ara bermeden, dört ay işançlı ve barışıq içinde yaşamaq çoq ağır kele
          edi. Onıñ içün Az.İbrahim ve İsmailden berli devam etip kelgen bu tertipni
          canları istegeni kibi bozmağa, meselâ, Muharrem ayındaki ürmetni Sefer ayına
          keçirmege, diger aram aylarnı da ögge-artqa avuştırmağa başladılar. Bu al
          icretniñ 10-ncı yılına qadar devam etti. Veda hacında Resulullah (s.a.) aylarnıñ
          o sene tam yerini tapqanını añlattı. Aşağıdaki ayet bu vaziyetnen bağlı olaraq
          nazil olğan).
        cid: 0
  - verse: 37
    segments:
      - text: >
          (Aram aylarnı) keçiktirmek, sadece kâfirlikte ileri ketmektir. Çünki, onıñnen,
          kâfir olğanlar saptırırlar. Allahnıñ aram yapqanınıñ sıyısını bozmaq ve Onıñ
          aram qılğanını elâl qılmaq içün (aram aynı), bir yıl elâl sayarlar, bir yıl da
          aram sayarlar. (Böylece) olarnıñ fena işleri özlerine güzel kösterilgendir Allah
          kâfirler toplulığını hidayetke iriştirmez. (Resulullah (s.a.) iceretniñ 9-ncı
          yılında Vizantiya imperatorlığınıñ musulmanlarnı yoq etmek içün 40.000 kişilik
          bir ordu azırlap, cenkleşmek içün seferge çıqarğanından haberdar oldı ve
          Vizantiya imperatorlığına qarşı cenk ilân etti. Faqat munafıqlar Rusulullahnıñ
          aleyhinde teşviqat yaptılar, Vizantiyağa qarşı cenk ilân etüvniñ bir facia
          olacağını halq arasında yaydılar. Yañı musulman olğan bazı kimseler bu
          teşviqatqa inandı ve cenkke qatılmaq istemediler. Faqat Resulullah ve ashabnıñ
          ğayretinen 30.000 kişilik musulman ordusı azırlanıldı ve Tebukke qadar barıldı.
          Duşman ordusı musulmanlarnıñ kelgenini eşitkeninen, qaçıp ketti. İşte, bundan
          soñki ayetler bu seferdeki musulmanlarnıñ ve munafıqlarnıñ areket ve
          davranışları aqqında nazil olğandır).
        cid: 0
  - verse: 38
    segments:
      - text: >
          Ey, iman etkenler! Sizge ne oldı ki: «Allah yolunda cenkke çıqıñ!», denilgen
          vaqıtta, yerge qaqılıp qalmaqtasıñız? Dünya ayatını ahiretten üstün etesiñizmi?
          Faqat dünya ayatınıñ faydası ahiretniñ yanında pek az.
        cid: 0
  - verse: 39
    segments:
      - text: >
          Eger (kerekkende cenkke) çıqmasañız, (Allah) sizni pek elem berici bir azap ile
          cezalandırır ve yeriñizge sizden başqa qavm ketirir; siz (cenkke çıqmamaqnen)
          Oña iç bir zarar beralmazsıñız. Allah er şeyge qadirdir.
        cid: 0
  - verse: 40
    segments:
      - text: >
          Eger siz oña (Resulullahqa) yardım etmeseñiz (bu müim degil); oña Allah yardım
          etkendir. Aslında, kâfirler onı eki adamdan biri olaraq, (Ebu Bekirnen birlikte
          Mekkeden) çıqarğan ediler; Aslında, olar mağarada ediler; o arqadaşına:
          Kederlenme, çünki, Allah biznen beraberdir, dey edi. Bunıñ üzerine Allah oña
