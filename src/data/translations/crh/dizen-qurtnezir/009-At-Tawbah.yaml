          Añlamağan bir qavm olğanları içün, Allah olarnıñ qalplerini (imandan)
          çevirgendir.
        cid: 0
  - verse: 128
    segments:
      - text: >
          Ant olsun, sizge özüñizden öyle bir Peyğamber kelgendir ki, siziñ sıqıntığa
