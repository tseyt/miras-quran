        cid: 0
  - verse: 31
    segments:
      - text: "(Eudiyler) Allaһnı bıraqıp, bilmirlerini (hahamlarını); (hristianlar) da rahiplerini ve Meryem oğlu Mesihni (İsanı) raber edindiler. Albuki, olarğa ancaq tek ilâhqa qullıq etüvleri emir olundı. Ondan başqa tañrı yoqtır. O bularnıñ ortaq qaşqan şeylerinden uzaqtır. (Eudiylerniñ Muqaddes Kitaplarını taşığan sandıq bir qaç kere duşmanlarınıñ eline keçken, Muqaddes Kitap basqıncılıqqa oğrağan ve şahsen Az.Musağa berilgen levhalar coyulğan. Yeudiy din adamları afızalarında qalğan bazı ayetlerni parça-parça yazğan ediler. Babil esaretinde yahşı bir yazıcı olğan kâhin Ezra söznen ve qısmen yazılı rivayetlerni bir yerge toplap, yeudiy muqaddes kitabını meydanğa çıqarğan edi. Bu hızmetlrerinden tolayı, Ezra İsrail oğullarını sayğısını qazanğan, bu sayğı, vaqtı ile, o qadar adden ziyade bir noqtağa çıqqan ki, yeudiyler, Ezranı Allaһnañ oğlu sayğan ediler. İşte, yuqarıdaki ayette buña işaret etile)."
        cid: 0
  - verse: 32
    segments:
