      - text: "Er angi bir sure endirilgen vaqıtta olardan bir qısmı der ki: «Bu siziñ angiñizniñ imanıñıznı arttırdı?» İman etkenlerge kelgende, (bu sure) olarnıñ imanlarını arttırır ve olar sevinirler."
        cid: 0
  - verse: 125
    segments:
      - text: "Qalplerinde hastalıq (kâfirlik ve munafıqlıq) olğanlarğa kelgende, olarnıñ da inkârlarını bus-butün arttırır ve olar artıq kâfir olaraq olürler."
        cid: 0
  - verse: 126
    segments:
      - text: "Olar er yıl bir ya da eki kere (çeşit belâlarnen) imtian etilgenlerini kormeylermi? Soñunda da ne tövbe eteler, ne de ibret alalar."
        cid: 0
  - verse: 127
    segments:
      - text: "Bir sure endirilgen vaqıtta, (koz qıpıp alay eterek) bir-birlerine baqar (ve): (çetten) sizni birisi koremi? diye sorarlar, soñra da (sıyırılıp) keterler. Añlamağan bir qavm olğanları içün, Allaһ olarnıñ qalplerini (imandan) çevirgendir."
        cid: 0
  - verse: 128
    segments:
      - text: "Ant olsun, sizge ozüñizden oyle bir Peyğamber kelgendir ki, siziñ sıqıntığa oğravuñız oña çoq ağır kelir. O, sizge çoq fedakâr, mu’minlerge nisbeten çoq şefqatlıdır, merhametlidir. (Allaһ Taalâ bu ayette oz isimlerinden olğan «rauuf - çoq şefqatl ve rahiim - pek merhametli» sıfatlarını Peyğamberimizge de bergen ki, evelki Peyğamberlerden iç biri bu sıfatlarnıñ ekisine birden nail olmağan)."
        cid: 0
  - verse: 129
    segments:
      - text: "(Ey, Muһammed!) Yuz çevirseler, de ki: Allaһ maña kâfidir. Ondan başqa ilâh yoqtır. Men sadece Oña işanıp tayanırım. O, yuce Arşnıñ sanbidir."
        cid: 0