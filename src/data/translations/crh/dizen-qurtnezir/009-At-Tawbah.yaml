          etti: Nuh Peyğamber öz qavmına yollanıldı. Qavmı onı inkâr etkeninen, meşur Nuh
          tufanında boğulıp elâk oldılar. Aad qavmına huud Peyğamber yollanıldı. Olar şiddetli
          rüzgâr ile elâk oldı; Semuud qavmına Saalih Peyğamber yollanıldı. Olar da zelzele
          ile elâk oldılar. Az.İbrahimniñ qavmı ise, sineknen elâk oldı; Medyen halqına Şuayb
          Peyğamber yollanılğan edi, olar ateşnen elâk oldılar. Şeerleri alt-üst olaraq, elâk
          olğan qavm ise, Luut Peyğamberniñ qavmıdır).
