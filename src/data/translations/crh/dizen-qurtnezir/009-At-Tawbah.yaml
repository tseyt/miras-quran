          Medine halqına ve olarnıñ etrafında bulunğan bedeviy araplarğa Allahnıñ
          Resulından artta qaluvları ve onıñ canından evel öz canlarını tüşünüvleri
          yaraşmaz. İşte, olarnıñ Allah yolunda bir suvsızlıqqa, bir yorğunlıqqa ve bir
          açlıqqa oğravları, kâfirlerni öpkelendirecek bir yerge (ayaq) basuvları ve
          duşmanğa qarşı bir muvafaqiyet qazanuvları, ancaq bularnıñ qarşılığında özlerine
          salih bir amel yazıluvı içündir. Çünki, Allah yahşılıq yapqanlarnıñ mükâfatını
          zaya etmez.
        cid: 0
  - verse: 121
    segments:
      - text: >
          Allah olarnı yapayatqanlarınıñ eñ güzelinen mükâfatlandırmaq içün küçük-büyük
          yapqan er masrafları, keçken er vadeleri mıtlaqa olarnıñ faydasına yazılır.
          (Tebuk seferine qatılmağanlar aqqında şiddetli ayetler engeninen, bundan soñki
          seferlerge musulmanlar episi bir olup qatılmağa başladılar. Sefer esnasında
          Resulullah Medinede yalıñız qala edi. Bunıñ üzerine aşağıdaki ayet nazil oldı).
        cid: 0
  - verse: 122
    segments:
      - text: >
          Mü'minlerniñ episiniñ toptan seferge çıquvları doğru degil. Olarnıñ er qısmında
          bir topu dinde (diniy ilimlerde) keniş bilgi elde etmek ve qavmları (cenkten)
          qaytqanlarında, olarnı tenbiyelemek içün artta qalmalıdır. Ümüt etilir ki,
          saqınırlar. (Bu ayetten añlaşılğanına köre, bir milletniñ toptan cenkke çıquvı
          doğru degil. Cenk vaziyetinde toplumnıñ silâ qullana bilgen bir qısmı silâ
          altına alınğanda, bir qısmı da ilmiy faaliyetlerni devam ettirmelidir.
          Alelhusus, diniy ilimlerde toplumnıñ itiyacını qarşılaycaq seviyede ilim
          adamları yetiştirilmelidir ki, toplumnı aydınlatıp, Allahnıñ emir ve yasaqlarını
          toplum azalarına ögretsinler. Ancaq, ayette keçken din ve diniy ilimler tar
          manada añlaşılmamalıdır. Çünki, İslâm aynı zamanda siyasiy, içtimaiy ve
          iqtisadiy ayatnı tüzgünlegenine köre, bu manadaki ilimler de, diniy ilimler
          sayılır. Cenk uzun müddet devam ete bilir. Toplumnıñ ayaqta tura bilüvi içün,
          din ve ilim adamlarınıñ iman, bilgi ve tehnika noqtai nazarından, cenkleşken
          gruppanı beslevleri ve desteklevleri zarurdır. Bir millet ilim ve tehnika
          meydanında artta qalğan ise, askeriy meydanda quvetli olsa bile, çabuk çöker.
          Amma, ilim ve tehnikada ileri ketken milletler askeriy meydanda zayıf olsalar
          bile, noqsanlarını çabuk tüzelte bilirler. Bu sebepten, cebedeki cihadnı bilim
          ve tehnologiyanen desteklegen ve tamamlağan bilim adamlarınıñ cihadı daa müim
          körülgen).
        cid: 0
  - verse: 123
    segments:
      - text: >
          Ey, iman etkenler! Kâfirlerden yaqınıñızda olğanlarğa qarşı cenkleşiñ ve olar
          (cenk vaqtında) sizde bir sertlik tapsınlar. Biliñ ki, Allah saqınğanlarnen
          beraberdir. (İslâm dini printsip olaraq, sulh tarafdarıdır. Nisaa suresiniñ
          128-nci ayetinde "Sulh daa hayırlıdır", buyurılğan. Faqat yuqarıdaki ayet dinniñ
          ve devletniñ muafazasını garantiya altına almaq içün ğayrımuslim qomşulardan
          kelgen zararlarnı bertaraf etmekni ve olarnıñ qarşısında tecavuzğa cesaret
          etalmaycaqları şekilde küçlü ve metin olmaqnı emir etmekte).
        cid: 0
  - verse: 124
    segments:
      - text: >
