        cid: 22
      - text: >-
          (Bu ayetten añlaşılğanına köre, bir milletniñ toptan cenkke çıquvı doğru degil. Cenk
          vaziyetinde toplumnıñ silâ qullana bilgen bir qısmı silâ altına alınğanda, bir qısmı
          da ilmiy faaliyetlerni devam ettirmelidir. Alelhusus, diniy ilimlerde toplumnıñ
          itiyacını qarşılaycaq seviyede ilim adamları yetiştirilmelidir ki, toplumnı
          aydınlatıp, Allahnıñ emir ve yasaqlarını toplum azalarına ögretsinler. Ancaq, ayette
          keçken din ve diniy ilimler tar manada añlaşılmamalıdır. Çünki, İslâm aynı zamanda
          siyasiy, içtimaiy ve iqtisadiy ayatnı tüzgünlegenine köre, bu manadaki ilimler de,
          diniy ilimler sayılır. Cenk uzun müddet devam ete bilir. Toplumnıñ ayaqta tura
          bilüvi içün, din ve ilim adamlarınıñ iman, bilgi ve tehnika noqtai nazarından,
          cenkleşken gruppanı beslevleri ve desteklevleri zarurdır. Bir millet ilim ve tehnika
          meydanında artta qalğan ise, askeriy meydanda quvetli olsa bile, çabuk çöker. Amma,
          ilim ve tehnikada ileri ketken milletler askeriy meydanda zayıf olsalar bile,
          noqsanlarını çabuk tüzelte bilirler. Bu sebepten, cebedeki cihadnı bilim ve
          tehnologiyanen desteklegen ve tamamlağan bilim adamlarınıñ cihadı daa müim
          körülgen).
        cid: 0
