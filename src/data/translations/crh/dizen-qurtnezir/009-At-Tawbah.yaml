        cid: 0
  - verse: 33
    segments:
      - text: "O (Allaһ), muşrikler hoşlanmasalar da, (oz) dinini butün dinlerge ustün yapmaq içün, resulını hidayet ve Haq Din ile yollayıcıdır."
        cid: 0
  - verse: 34
    segments:
      - text: "Ey, iman etkenler! (Biliñ ki), hahamlardan ve rahiplerden bir çoqu insanlarnıñ mallarını aqsız yollarnen aşarlar ve (insanlarnı) Allaһ yolundan çevirirler. Altın ve kumüşni toplap da, olarnı Allaһ yolunda arclamağanlar yoqmı, işte, olarğa elem berici bir azapnı mujdele! (Eudiy hahamlarınen hristian rahipleri Muqaddes Kitaplarındaki ayetlerni dünya menfaatı (alğan qabarları) qarşılığında ya deñiştire, ya da ukmini menfaatları yonelişinde yorumlay ediler. Hususen, Az.Muһammedniñ Peyğamberliginen bağlı ayetlerni bozup deñiştirdiler. İşte, yuqarıdaki ayette olarnı bu çirkin işlerine işaret etilmekte. Ayrıca, altın ve kumüşni ya da mevcut paranı, ya da malnı bıraqtırıp da, zekâtını bermegen, hayırlı ve faydalı işlerde qullanmağanlarnı ahirette şiddetli azapnen cezalanacaqlarını da haber bermekte)."
        cid: 0
  - verse: 35
    segments:
      - text: "(Bu paralar) ceennem ateşinde qızdırılıp, bularnen olarnıñ mañlayları, yanbaşları ve sırtları yaqılacaq kunü (olarga denilir ki): «İşte bu, ozüñiz içün toplağan servetiñizdir. Artıq toplayatqan şeyleriñizniñ (azabını) tatıñ!»"
        cid: 0
  - verse: 36
    segments:
      - text: "Koklerni ve yerni yaratqan kunünde Allaһnıñ yazısına kore, Allaһ qatında aylarnıñ sayısı on eki olup, bulardan dördü aram aylardır. İşte bu, doğru esaptır. O aylar içinde (Allaһnıñ qoyğan yasağını ezerek) ozüñizge zulum etmeñ ve muşrikler siznen nasıl birlik olup cenkleşseler, siz de olarğa qarşı birlik olup cenkleşiñ ve biliñ ki, Allaһ (fenalıqtan) saqınğanlarnen beraberdir. (Allaһ Taalâ koklerni ve yerni yaratqan vaqıtta, Aynıñ arektini oyle tertipledi ki, ay sistemasına kore, bir yılda on eki ay meydanğa keldi ve bir yıl 355 kun oldı. Bu aylarnıñ adları boyledir: Muharrem, Sefer, Rebiul-evel, Rebiul-ahir, Cemadiulevel, Cemadiul-ahir, Recep, Şaban, Ramazan, Şavvel, Zilqade, Zilhicce. Ayette işaret etilgen «aram aylar» - Zilqade, Zilhicce, Muharrem ve Recep aylarıdır ki, bu sureniñ 5-nci ayetinden de añlaşılğanı kibi, bu aylarda cenk yasaqlanğan). (Cahiliye devrinde bir-birinen çarpışmağa ve talancılıqqa alışqan araplarğa ara bermeden, dört ay işançl ve barışıq içinde yaşamaq çoq ağır kele edi. Onıñ içün Az.İbrahim ve İsmailden berli devam etip kelgen bu tertipni canları istegeni kibi bozmağa, meselâ, Muharrem ayındaki urmetni Sefer ayına keçirmege, diger aram aylarnı da ogge-artqa avuştırmağa başladılar. Bu al icretniñ 10-ncı yılına qadar devam etti. Veda hacında Resulullah (s.a.) aylarnıñ o sene tam yerini tapqanını añlattı. Aşağıdaki ayet bu vaziyetnen bağlı olaraq nazil olğan)."
        cid: 0
  - verse: 37
    segments:
      - text: "(Aram aylarnı) keçiktirmek, sadece kâfirlikte ileri ketmektir. Çünki, onıñnen, kâfir olğanlar saptırırlar. Allaһnıñ aram yapqanınıñ sıyısını bozmaq ve Onıñ aram qılğanını elâl qılmaq içün (aram aynı), bir yıl elâl sayarlar, bir yıl da aram sayarlar. (Boylece) olarnıñ fena işleri ozlerine guzel kosterilgendir Allaһ kâfirler toplulığını hidayetke iriştirmez. (Resulullah (s.a.) iceretniñ 9-ncı yılında Vizantiya imperatorlığınıñ musulmanlarnı yoq etmek içün 40.000 kişilik bir ordu azırlap, cenkleşmek içün seferge çıqarğanından haberdar oldı ve Vizantiya imperatorlığına qarşı cenk ilân etti. Faqat munafıqlar Rusulullahnıñ aleyhinde teşviqat yaptılar, Vizantiyağa qarşı cenk ilân etüvniñ bir facia olacağını halq arasında yaydılar. Yañı musulman olğan bazı kimseler bu teşviqatqa inandı ve cenkke qatılmaq istemediler. Faqat Resulullah ve ashabnıñ ğayretinen 30.000 kişilik musulman ordusı azırlanıldı ve Tebukke qadar barıldı. Duşman ordusı musulmanlarnıñ kelgenini eşitkeninen, qaçıp ketti. İşte, bundan soñki ayetler bu seferdeki musulmanlarnıñ ve munafıqlarnıñ areket ve davranışları aqqında nazil olğandır)."
        cid: 0
  - verse: 38
    segments:
      - text: "Ey, iman etkenler! Sizge ne oldı ki: «Allaһ yolunda cenkke çıqıñ!», denilgen vaqıtta, yerge qaqılıp qalmaqtasıñız? Dünya ayatını ahiretten ustün etesiñizmi? Faqat dünya ayatınıñ faydası ahiretniñ yanında pek az."
        cid: 0
  - verse: 39
    segments:
      - text: "Eger (kerekkende cenkke) çıqmasañız, (Allaһ) sizni pek elem berici bir azap ile cezalandırır ve yeriñizge sizden başqa qavm ketirir; siz (cenkke çıqmamaqnen) Oña iç bir zarar beralmazsıñız. Allaһ er şeyge qadirdir."
        cid: 0
  - verse: 40
    segments:
      - text: "Eger siz oña (Resulullahqa) yardım etmeseñiz (bu muim degil); oña Allaһ yardım etkendir. Aslında, kâfirler onı eki adamdan biri olaraq, (Ebu Bekirnen birlikte Mekkeden) çıqarğan ediler; Aslında, olar mağarada ediler; o arqadaşına: Kederlenme, çünki, Allaһ biznen beraberdir, dey edi. Bunıñ uzerine Allaһ oña (sukünet teminlegen) işançını endirdi, onı siz kormegen bir ordunen destekledi ve kâfir olğanlarnıñ sözüni alçalttı. Allaһnıñ sözü ise, zaten yucedir. Çünki, Allaһ ustündir, ikmet saibidir. (İcret esnasında muşrikler tarafından israrnen taqip etilgen Az.Peyğamber (s.a.) ve Az.Ebu Bekir (r.a.) bir vaqıt Sevr mağarasına sığınğan ediler. Muşriklerniñ ayaq seslerini duya ediler. Az.Ebu Bekir (r.a.) qorqqan edi. Rivayetke kore, muşrikler mağaranıñ kirişindeki orümçek ağını ve gogercsin yuvasını korgeninen, içeride kimse yoqtır, diye bıraqıp kettiler)."
        cid: 0
