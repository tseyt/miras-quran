          (Resulullah (s.a.) Tebukte duşmannı beklegende, oña vahiyler kele ve o cenkten artta
          qalğanlarnı devamlı ayıplay edi. Celâs b. Suveyd adlı bir munafıq dedi ki: «Eger
          Muhammedniñ qardaşlarımız içün söylegenleri doğru ise, eşeklerden alçaq olayıq!» Bu
          sözni eşitken Amir b. Qays der'al cevap berdi: «Muhammed muaqqaq doğru söyley. Siz
          ise, eşeklerden alçaqsıñız!». Resulullah Medinege qaytqanınen, Amir vaziyetni
          Peyğamberge añlattı... Celâs: «Maña iftira ete», diyerek, söylegenlerini inkâr etti.
          Resulullah er ekisiniñ de minberniñ ögünde yemin etüvlerini emir etti. Er ekisi de
          özleriniñ doğru olğanlarına yemin ettiler. Ancaq, Amir yeminden soñ, ellerini
          kötererek: «YA Rabb, doğru söylegenni tasdiq etken, yalancını tasdiq etmegen bir
          ayetni Peyğamberiñe yolla», diye dua etti; Resulullahnen diger mü'minler de: «Amin»,
          dediler. Aman aşağıdaki ayet nazil oldı. Celâs qabaatını itiraf etti ve tövbege
          keldi).
        cid: 0
