          aylarnıñ adları böyledir: Muharrem, Sefer, Rebiul-evel, Rebiul-ahir, Cemadiul-evel,
          Cemadiul-ahir, Recep, Şaban, Ramazan, Şavvel, Zilqade, Zilhicce. Ayette işaret
          etilgen «aram aylar» - Zilqade, Zilhicce, Muharrem ve Recep aylarıdır ki, bu sureniñ
          5-nci ayetinden de añlaşılğanı kibi, bu aylarda cenk yasaqlanğan). (Cahiliye
          devrinde bir-birinen çarpışmağa ve talancılıqqa alışqan araplarğa ara bermeden, dört
          ay işançlı ve barışıq içinde yaşamaq çoq ağır kele edi. Onıñ içün Az.İbrahim ve
          İsmailden berli devam etip kelgen bu tertipni canları istegeni kibi bozmağa, meselâ,
          Muharrem ayındaki ürmetni Sefer ayına keçirmege, diger aram aylarnı da ögge-artqa
          avuştırmağa başladılar. Bu al icretniñ 10-ncı yılına qadar devam etti. Veda hacında
          Resulullah (s.a.) aylarnıñ o sene tam yerini tapqanını añlattı. Aşağıdaki ayet bu
