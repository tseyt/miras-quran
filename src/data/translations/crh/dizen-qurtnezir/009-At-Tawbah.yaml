surah_id: 9
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "Bu yıldan soñ Kâbege iç bir muşrik yaqlaşmaycaq."
        cid: 0
  - verse: 2
    segments:
      - text: "İç kimse çıplaq alda Kâbeni ziyaret etmeycek."
        cid: 0
  - verse: 3
    segments:
      - text: "Mu’minden başqası cennetke kirmeycek."
        cid: 0
  - verse: 4
    segments:
      - text: "Muşrik qabileler tarafından bozulmağan antlaşuvlar, antlaşuv muddetiniñ soñuna qadar arekette qalacaq». 1. Allaһ ve Resulından olarnen antlaşuv yaptığıñız muşriklerge bir ihtar! 2. (Ey, muşrikler!) Yer yuzünde dört ay daa dolaşıñ. Yahşı biliñ ki, siz Allaһnı aciz bıraqacaq degilsiñiz; Allaһ ise, kâfirlerni rezil (ve perişan) etecek. 3. Hac-ı ekber (eñ buyuk hac) kunünde Allaһ ve Resulından insanlarğa bir bildirüvdir: Allaһ ve Resulı muşriklerden uzaqtır. Eger tövbe etseñiz, bu siz içün daa hayırlıdır. Ve eger yuz çevirseñiz, biliñ ki, siz Allaһnı aciz bıracaq degilsiñiz. (Ey, Muһammed)! O kâfirlerge elem berici bir azapnı mujdele. 4. Ancaq, ozlerinen antlaşuv yaptığıñız muşriklerden (antlaşuv şartlarına uyğan) iç bir şeyni sizge eksik bıraqmağan ve siziñ aleyhiñizge er angi bir kimsege arqa olmağanlar (bu ukümniñ) tışındadır. Olarnıñ antlaşuvlarını, muddetleri bitkenge qadar, tamamlañız. Allaһ (aqsızlıqtan) saqınğanlarnı sever."
        cid: 0
  - verse: 5
    segments:
      - text: "Aram aylar çıqqanınen, muşreklerni tapqan yeriñizde oldüriñ; olarnı yaqalañ, olarnı aps etiñ ve olarnı er nezaret yerinde oturıp bekleñ. Eger tövbe etseler, namaznı dost-doğru qılsalar, zekâtnı da berseler, artıq yollarını serbest bıraqıñ. Allaһ bağışlayıcı, merhametlidir."
        cid: 0
  - verse: 6
    segments:
      - text: "Ve eger muşriklerden biri senden amanlıq istese, Allaһnıñ kelâmını eşitip diñlegenge qadar, oña amanlıq ber, (musulman olmasa) onı işanç içinde bulunacaq bir yerge yetiştir. İşte, bu (yahşılıq), olarnıñ bilmegen bir qavm oluvlarından tolayıdır."
        cid: 0
  - verse: 7
    segments:
      - text: "Mescid-i Haramnıñ yanında olarnen antlaşuv yapqanlarıñızdan ğayrı, muşriklerniñ Allaһ ve Resulı yanında nasıl (muteber) bir ahtı ola bilir? Olar sizge nisbeten dürüst davranğan muddetlerince siz de olarğa dürüst davranıñ. Çünki, Allaһ (ahtnı bozuvdan) saqınğanlarnı sever. (Tefsircilerge kore, ayette istisna etilgenler, Hudaybiye antlaşuvına çetten olaraq iştirak etken Huzeyme ve Mudlic oğullarıdır. Qureyş ve olarğa bağl diger muşrikler antlaşuvnı bazğanları içün, musulmanlar areketke keçti ve Mekkeni feth ettiler. Antlaşuvnı bozmağan qabilelerge ise toqunmadılar)."
        cid: 0
  - verse: 8
    segments:
      - text: "Nasıl ola bilir ki! Olar sizge ğalip kelseler edi, siziñ aqqıñızda ne aht, ne de antlaşuv kozeter ediler. Olar ağızlarınen sizni razı ete ediler, albuki qalpleri (buña) qarşı çıqmaqta. Çünki, olarnıñ çoqu yoldan çıqqanlardır."
        cid: 0
  - verse: 9
    segments:
      - text: "Allaһnıñ ayetlerine qarşılıq az bir degerni (dünya malını ve nefsaniy isteklerni) satın aldılar da, (insanlarnı) Onıñ yolundan çıqardılar. Aqiqaten olarnıñ yapayatqan şeyleri ne fenadır!"
        cid: 0
  - verse: 10
    segments:
      - text: "Bir mu’min aqqında ne aht tanırlar, ne de antlaşuv. Çünki, olar basqıncılarnıñ ozleridir."
        cid: 0
  - verse: 11
    segments:
      - text: "Faqat tövbe etse, namaz qılsa ve zekât berse, artıq olar dinde qardaşlarıñızdır. Biz bilgen bir qavmğa ayetlerimizni boyle beyan etmektemiz."
        cid: 0
  - verse: 12
    segments:
      - text: "Eger antlaşuvlarından soñ, yeminlerini bozsalar ve diniñizge ucüm etseler, kufürniñ reberlerine qarşı cenkleşiñ. Çünki, olar yeminleri olmağan adamlardır. (Olarğa qarşı cenkleşseñiz) umüt etilir ki, kufürni toqtatırlar."
        cid: 0
  - verse: 13
    segments:
      - text: "(Ey, mu’minler!) Bergen sözlerini bozğan, Peyğamberni (ürtundan) çıqarmağa areket etken ve ilk evelâ sizge qarşı cenk başlağan bir qavmğa qarşı cenkleşmeyceksiñizmi; yoqsa, olardan qorqasıñızmı? Eger (aqiqiy) mu’minler iseñiz, biliñ ki, Allaһ ozünden qorquvıñızğa daa lâyıqtır."
        cid: 0
  - verse: 14
    segments:
      - text: "Olarnen cenkleşiñ ki, Allaһ siziñ elleriñiznen olarnı cezalandırsın; olarnı rezil etsin; sizni olarğa ğalip yapsın ve mu’min toplumınıñ qalplerini ferahlandarsın."
        cid: 0
  - verse: 15
    segments:
      - text: "Ve olarnıñ (mu’minlerniñ) qalplerinden opkeni silsin. Allaһ istegeniniñ tövbesini qabul eter. Allaһ bilicidir, ikmet sanbidir. (Etraftaki memleketlerden Medinege kelip, musulman olğandan soñ, ulkelerine qaytqan mu’minler o ulke halqı tarafından eskencege alına, bu sebepten, olarğa nisbeten teren bir opke besley ediler. İşte, bu ayette o mu’minlerniñ vaziyetine işaret etile. Buña kore, o eskenceciler tövbe etip, musulman olsalar, Allaһ Taalâ olarnıñ tövbesini de qabul etecegini bildirmekte. Çünki, Allaһ er şeyniñ ikmetini pek yahşı bilir)."
        cid: 0
  - verse: 16
    segments:
      - text: "Yoqsa, Allaһ, sizden cihad etip, Allaһ, Peyğamber ve mu’minlerden başqasını ozlerine sırdaş edinmegenlerini ortağa çıqarmadan bıraqılacaqsıñız sandıñızmı? Allaһ yapqalarıñızdan haberdardır. (Peyğmberimizniñ emcesi Abbas b. Abdulmuttalib Bedir cenkinde esir olğan vaqıtta musulmanlar, muşrik olğanı ve aqrabasınen bağını keskeni sebebinden, onı ayıplağan ediler. Az. Ali ise, daa ağır sözler söylegen edi. Abbas dedi ki: «Bizim fena taraflarımıznı söyley, eyi taraflarımıznı gizleysiñiz. Biz Mescid-i Haramnı abadanlaştırmaqtamız, Kâbeniñ bekçiligini yapmaqtamız, hacılarğa suv dağıtamız ve esirlerni serbest bıraqmaqtamız». Bunıñ uzerine aşağıdaki ayet endi)."
        cid: 0
  - verse: 17
    segments:
      - text: "Allaһqa ortaq qoşqanlar, ozleriniñ kâfirligine şahsen ozleri şaatlıq eter ekenler, Allaһnıñ Mescitlerini abadanlaştırmaq selâhiyetleri yoqtır. Olarnıñ butün işleri zayadır. Ve olar ateşte ebediy qalacaqlar."
        cid: 0
  - verse: 18
    segments:
      - text: "Allaһnıñ mescitlerini ancaq Allaһqa ve ahiret kunüne iman etken, namaznı dosdoğru qılğan, zekâtnı bergen ve Allaһtan başqasından qorqmağan kimseler abanlaştırır. İşte, doğru yolğa irişkenlerden oluvlarına umüt etilgenler bulardıң."
        cid: 0
  - verse: 19
    segments:
      - text: "(Ey, muşrikler!) Siz hacılarğa suv bermekni ve Mescid-i Haramnı oñarmaqnı, Allaһqa ve ahiret kunüne iman etip de, Allaһ yolunda cihad etkenlerniñ imanınen bir tutasıñızmı? Albuki, olar Allaһ qatında bir degiller. Allaһ zalımlar toplulığını hidayetke iriştirmez. (Bu ayetke kore, dindarlq bir taqım şekliy merasimlerden evel, bir iman, tasdiq ve Allaһ rizası içün ğayret demektir. Bu şartlar kerçekleşkenden soñradır ki, hacılarğa suv bermek, Mescid-i Haramnı oñarmaq ve baqımını teminlemek kibi hızmetler Allaһ nezdinde bir qıymet ifade eter)."
        cid: 0
  - verse: 20
    segments:
      - text: "İman etip de, icret etkenler ve Allaһ yolunda mallarınen, canlarınen cihad etkenler, rutbe noqtai nazarından, Allaһ qatında daa ustündirler. Qurtulışqa irişkenler de, işte olardıң."
        cid: 0
  - verse: 21
    segments:
      - text: "Rabbleri olarğa, tarafından bir rahmet ve hoşnutlıqnen,ozleri içün içinde tükenmez nimetler bulunğan cennetler mujdeler."
        cid: 0
  - verse: 22
    segments:
      - text: "Olar o yerde ebediy qalacaqlar. Şubesiz ki, Allaһ qatında buyuk mukâfat bardır."
        cid: 0
  - verse: 23
    segments:
      - text: "Ey, iman etkenler! Eger kufürni imandan ustün korseler, babalarıñız ve qardaşlarıñıznı (bile) veli tutmañız. Sizden kim olarnı dost tutsa, işte olar zalımlarnıñ ozleridir."
        cid: 0
  - verse: 24
    segments:
      - text: "De ki: Eger babalarıñız, oğullarıñız, qardaşlarıñız, çiftleriñiz, hısımaqrabañız qazanğan mallarıñız, kesatqa oğravundan qarqqan ticaretiñiz, hoşlanğan meskenleriñiz sizge Allaһtan, Resulından ve Allaһ yolunda cihad etüvden daa sevimli ise, artıq Allaһ emrini ketirgenge qadar bekleñ. Allaһ fasıqlar taplulığını hidayetke iriştirmez. (Resulullah (s.a.) Mekkeni feth etkenden soñ, on eki biñ adamlıq bir ordunen Taifteki Hevazin ve Sakif qabileleriniñ ustüne yurdi. İslâm ordusınıñ çoqluğını korgen bazı musulmanlar: «Bu ordu artıq yeñilmez», şeklinde qonuşaraq, ozlerini buyuk sandılar. Faqat Huneyn vadisinde ozlerinden çoq daa bir muşrik ordusınen qarşılaşqanda, dağıldılar. Çünki, olar çoq olğanlarına işanğan ediler. İşte, aşağıdaki ayette olarnıñ bu vaziyetine işaret etile)."
        cid: 0
  - verse: 25
    segments:
      - text: "Ant olsun ki, Allaһ bir çoq yerde (cenk meydanlarında) ve Huneyn cenkinde sizge yardım etken edi. Hatırıñızdamı, çoqluğıñız sizge ozüñizni begendirgen, faqat sizni dağıluvdan qurtaramağan edi. Yer yuzü, butün kenişligine rağmen, sizge tar kelgen edi, soñunda (dağılaraq) keri qaytqan ediñiz."
        cid: 0
  - verse: 26
    segments:
      - text: "Soñra, Allaһ Resulınen mu’minler uzerine sekinetini (sukünet ve uzur duyğusı) endirdi, siz kormegen ordular (melekler) endirdi de, kâfirlerge azap etti. İşte bu, o kâfirlerniñ cezasıdır."
        cid: 0
  - verse: 27
    segments:
