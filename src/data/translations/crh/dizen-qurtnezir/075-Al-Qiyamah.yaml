surah_id: 75
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "Qıyamet kunüne yemin eterim."
        cid: 0
  - verse: 2
    segments:
      - text: "Ozüni tenqit etken (peşmanlıq duyğan) nefiske yemin eterim (tiriltilip, esapqa çekileceksiñiz)."
        cid: 0
  - verse: 3
    segments:
      - text: "İnsan, onıñ kemiklerini bir yerge toplayalmaycaqmız belleymi?"
        cid: 0
  - verse: 4
    segments:
      - text: "Ebet, bizim, onıñ parmaq uclarını bile aynı eski alına ketirmege kuçümiz yeter."
        cid: 0
  - verse: 5
    segments:
      - text: "Faqat insan ogündekini (qıyametni) yalanlamaq ister. (Ayetke «Faqat insan ilerige doğru devaml yamanlıq yapmaq ister» manası da berile bilir)."
        cid: 0
  - verse: 6
    segments:
      - text: "«Qıyamet kunü ne zaman eken?», diye sorar."
        cid: 0
  - verse: 10
    segments:
      - text: "O kunü insan «Qaçılacaq yer neresi!» deycek."
        cid: 0
  - verse: 11
    segments:
      - text: "Yoq, yoq! (Qaçıp) sığınacaq yer yoqtır!"
        cid: 0
  - verse: 12
    segments:
      - text: "O kunü barıp toqtalacaq yer, sadece Rabbiñniñ uzurıdır."
        cid: 0
  - verse: 13
    segments:
      - text: "O kunü insanğa, evelde yapqanı ve soñunda yapqanı, ne bar ise, bildirilir."
        cid: 0
  - verse: 14
    segments:
      - text: "Artıq insan oz-ozüniñ şaatıdır."
        cid: 0
  - verse: 15
    segments:
      - text: "İstese, uzürlerini sayıp töksin."
        cid: 0
  - verse: 16
    segments:
      - text: "(Resulım!) Onı (vahiyni) çar-çabuk almaq içün tiliñni qıbırdatma. (Resul-ı Ekrem kelgen vahiyni unutmamaq içün, daa ozüne oqulıp bitirilmeden, onı acele tekrarlamağa aşıqa edi. Ayette buña işaret etilmekte)."
        cid: 0
  - verse: 17
    segments:
      - text: "Şubesiz, onı, toplamaq (seniñ qalbiñye yerleştirmek) ve oqutmaq bizge aittir."
        cid: 0
  - verse: 18
    segments:
      - text: "O alda, biz onı oquğan vaqtımızda, sen onıñ oqulışını taqip et."
        cid: 0
  - verse: 19
    segments:
      - text: "Soñra, şubeñ olmasın ki, onı izaatlamaq da bizge aittir."
        cid: 0
  - verse: 22
    segments:
      - text: "Yuzler bar ki, o kunü balq-balq parıldaycaq."
        cid: 0
  - verse: 23
    segments:
      - text: "Rabblerine baqacaqlar (Onı korecekler)."
        cid: 0
  - verse: 24
    segments:
      - text: "Yuzler de bar ki, o kunü burüşecek;"
        cid: 0
  - verse: 25
    segments:
      - text: "Olarnıñ bel kemiklerini qırğan bir felâketke oğratılacağını sezecekler."
        cid: 0
  - verse: 26
    segments:
      - text: "Artıq kozüñizni açıñ! Ne vaqıt ki, can ğırtlaq kemigine kelip dayanır,"
        cid: 0
  - verse: 27
    segments:
      - text: "«Tedaviy ete bilecek kim?», denilir."
        cid: 0
  - verse: 30
    segments:
      - text: "İşte, o kunü yollanılacaq yer, sadece Rabbiñniñ uzurıdır. (27-nci ayette hastanıñ etrafındakilerniñ yahut meleklerniñ, soñki bir çareniñ bulunıp-bulunmağanını qıdırğanlarına işaret etilmekte. 29-nci ayette can çekişken kimseniñ qıbırdamaycaq bir alğa kelüvi, ya da dünyadan ayırıluv derdinen ahiretke yoneliş accısınıñ bir-birinen kureşüvi añlatılmaqta)."
        cid: 0
  - verse: 31
    segments:
      - text: "İşte, o (Peyğamberniñ ketirgenini) doğru qabul etmegen, namaz da qılmagan edi."
        cid: 0
  - verse: 32
    segments:
      - text: "Aksine, yalan sayğan ve yuz çevirgen edi."
        cid: 0
  - verse: 33
    segments:
      - text: "Soñra da, forsa sata-sata yurip, oz ehline (tarafdarlarına) ketken edi."
        cid: 0
  - verse: 34
    segments:
      - text: "Lâyıqtır (o azap) saña, lâyıq!"
        cid: 0
  - verse: 35
    segments:
      - text: "Ebet, lâyıqtır saña (o azap) lâyıq!"
        cid: 0
  - verse: 36
    segments:
      - text: "İnsan, ozüniñ başı boş bıraqılacaq belleymi!"
        cid: 0
  - verse: 37
    segments:
      - text: "O, (töl yatağına) aqızılğan nutfeniñ içinde bir (sperma) degil edimi?"
        cid: 0
  - verse: 38
    segments:
      - text: "Soñra bu, alaqa (aşlanğan yımırta) olğan, Allaһ onı (insan biçiminde) yaratıp, şekillendirgen edi."
        cid: 0
  - verse: 39
    segments:
      - text: "Ondan da eki çiftni - erkek ve ırğaçını yaratqan edi."
        cid: 0
  - verse: 40
    segments:
      - text: "Yahşı, (bularnı yapqan) Allaһnıñ olülerni tekrar tiriltmege kuçü yetmezmi?"
        cid: 0