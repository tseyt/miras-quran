surah_id: 62
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >
          Köklerde ve yerde olğanlarnıñ episi mülkniñ saibi, eksiklikten uzaq, aziz ve
          hakim olğan Allahnı tesbih eter.
        cid: 0
  - verse: 2
    segments:
      - text: >
          Çünki, ümmiylerge aralarından, özlerine ayetlerini oquğan, olarnı temizlegen,
          olarğa Kitapnı ve ikmetni ögretken bir Peyğamber yollağan Odır. Şübesiz, olar
          evelden ap-açıq bir sapıqlıq içinde ediler.
        cid: 0
  - verse: 3
    segments:
      - text: >
          (Peyğamberni) mü'minlerden alâ olarğa qoşulmağan diger insanlarğa da
          yollağandır. O, azizdir, hakimdir. (Az.Peyğamber araplardan başqa milletlerge de
          Peyğamber olaraq yollanılğandır. Çünki, Peyğamberimizniñ peyğamberligi ve
          risaleti umumiy ve devamiydir. O qıyametke qadar kelecek bütün insanlarğa
          Peyğamber olaraq yollanılğan).
        cid: 0
  - verse: 4
    segments:
      - text: >
          Bu, Allahnıñ lütfidir. Onı istegenine berir. Allah büyük lütf saibidir.
        cid: 0
  - verse: 5
    segments:
      - text: >
          Tevratnen mesuliyetli tutılıp da, onen amel etmegenlerniñ vaziyeti, cıltlarnen
          kitap yüklengen eşekniñ vaziyeti kibidir. Allahnıñ ayetlerini yalanlağan qavmnıñ
          vaziyeti ne fenadır! Allah zalımlar toplulığını doğru yolğa qavuştırmaz. (Bu
          teşbihten añlaşılğanı kibi, kitap insanlarğa amel etilüvi içün yollanılğan; aks
          alda, yük oluvdan başqa bir fayda teminlemez).
        cid: 0
  - verse: 6
    segments:
      - text: >
          De ki: Ey, yeudiyler! Bütün insanlar degil de, yalıñız özüñiz Allahnıñ dostları
          olğanıñıznı idda etmekte iseñiz, bunda da samimiy iseñiz, aydı, ölümni isteñ
          (baqayıq)! («Biz Allahnıñ oğulları ve dostlarımız», degen yeudiylerden aman
          ölümni arzu etüvleri istengen. Çünki, Allahnıñ dostları ahiretni üstün
          körgenler. Ölüm ise, ahiretniñ başlanğıçıdır).
        cid: 0
  - verse: 7
    segments:
      - text: >
          Amma olar, evelden yapqanları sebebinden, ölümni asla istemezler. Allah
          zalımlarnı pek yahşı bilir. (Çünki, zalımlarnıñ işleri, inkâr ve isyan olğan.
          Bularnı yapqanlar ölümni istep olamazlar).
        cid: 0
  - verse: 8
    segments:
      - text: >
          De ki: Siziñ ondan qaçtığıñız ölüm mıtlaqa sizni tapacaq. Soñra da, körülgenni
          ve körülmegenni bilici Allahqa döndürileceksiñiz de, O sizge bütün
          yapqanlarıñıznı haber berecek.
        cid: 0
  - verse: 9
    segments:
      - text: >
          Ey, iman etkenler! Cuma künü namazğa çağırılğan (ezan oqulğan) vaqıtta, aman
          Allahnı añmağa çapışıñ ve alış-verişni braqıñ. Eger bilmiş olsañız, elbette bu
          siz içün daa hayırlıdır.
        cid: 0
  - verse: 10
    segments:
      - text: >
          Namaz qılınğanınen, artıq yer yüzüne dağılıñ ve Allahnıñ lütfinden isteñ.
          Allahnı çoq zikr etiñ; ümüt etilir ki, qurtulışqa irişirsiñiz.
        cid: 0
  - verse: 11
    segments:
      - text: >
          Olar bir ticaret ve eglence körgen vaqıtlarında, aman dağılıp, oña barırlar ve
          seni ayaqta bıraqırlar. De ki: Allahnıñ yanında bulunğanı, eglenceden ve
          ticaretten daa faydalıdır. Allah rızıq bergenlerniñ eñ hayırlısıdır. (Rivayetke
          köre, Medinede qıtlıq yaşanğan bir devirde Az.Peyğamber, cuma hutbesi oquğanda,
          o yerden aşayt yüklü bir kervan keçe edi. Kervannıñ kelgenini bildirgen def
          sesini eşitkeninen, er kes kervanğa çaptı, yalıñız on eki adam qaldı. Ayet bunıñ
          üzerine nazil oldı, eski zamanlarda bir kervan kelgen vaqıtta oña nisbeten
          quvanç kösterişi olmaq üzre, def çalınır edi).
        cid: 0
