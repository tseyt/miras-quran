surah_id: 71
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >-
          Olarğa yaqıcı bir azap kelmeden evel, qavmıñnı tenbiyele, diye Nuһnı oz qavmına
          yolladıq.
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Nuһ boyle dedi: Ey, qavmım! Şubeñiz olmasın ki, men sizni «Allaһqa qullıq etiñ;
          oña qarşı kelüvden saqınıñ ve maña itaat etiñ ki, Allaһ bir qısım gunahlarıñıznı
          bağışlasıñ ve sizni belli bir vadege qadar keçiktirsin (esapqa çekmeden
          yaşatsın)» diyerek, ap-açıq tenbiyelegen bir kimseyim. Bilinmeli ki, Allaһnıñ
          tayin etken vadesi kelgeninen, artıq o keçiktirilmez. Keşke bilse ediñiz! («Bir
          qısım gunahlarıñıznı»» denilir eken, imanğa kelmeden, evelki gunahlarnını ya da
          qul aqqından ğayrı gunahlarnıñ kozde tutulğanı tefsirlerde beyan etilgen).
        cid: 0
  - verse: 3
    segments:
      - text: >-
          [2 ayetine baq.]
        cid: 0
  - verse: 4
    segments:
      - text: >-
          [2 ayetine baq.]
        cid: 0
  - verse: 5
    segments:
      - text: >-
          (Soñ Nuһ:) Rabbim! dedi, doğrusı, men qavmımnı gece-kundüz (imanğa) davet
          ettim.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Faqat menim davetim, ancaq qaçuvlarını arttırdı.
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Aqiqaten de, (imanğa kelüvleri ve boylece) gunahlarını bağışlavıñ içün, olarnı
          ne zaman davet etti isem, parmaqlarını qulaqalırına tıqadılar, (meni kormemek
          içün) urbalarına buründiler, ayaq tirediler, kibirlendikçe kibirlendiler.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Soñ men olarğa ayqıraraq davette bulundım.
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Soñ olarnen em açıq-açıqqa, em de gizli-gizli laf ettim.
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Dedim ki: Rabbiñizden mağfiret tileñ; çünki O, çoq bağışlayıcıdır.
        cid: 0
  - verse: 11
    segments:
      - text: >-
          (Mağfiret tileñ ki) uzeriñizge kokten bol-bol yağmur yağdırsın.
        cid: 0
  - verse: 12
    segments:
      - text: >-
          Mallarıñıznı ve oğullarıñıznı çoqlaştırsın, sizge bağçalar ihsan etsin, siz
          içün irmaqlar aqızsın.
        cid: 0
  - verse: 13
    segments:
      - text: >-
          Sizge ne olmaqta ki, Allaһqa buyuklikni yaqıştıralmaysıñız?
        cid: 0
  - verse: 14
    segments:
      - text: >-
          Albuki, sizni türlü yaratılış devrelerinden keçirerek, O yaratqandır.
        cid: 0
  - verse: 15
    segments:
      - text: >-
          Kormediñizmi, Allaһ yedi kokni tabaqa-tabaqa olaraq nasıl yaratqan!
        cid: 0
  - verse: 16
    segments:
      - text: >-
          Olarnıñ içinde aynı bir nur etken, kuneşni de bir çıraq yapqan.
        cid: 0
  - verse: 17
    segments:
      - text: >-
          Allaһ sizni de yerden ot (çıqarğan) kibi çıqarğan.
        cid: 0
  - verse: 18
    segments:
      - text: >-
          Soñ sizni kene o yerge döndürecek ve sizni yañıdan çıqaracaq.
        cid: 0
  - verse: 19
    segments:
      - text: >-
          Allaһ, onda keniş yollar tutıp, dolaşa bilesiñiz diye, yer yuzüni siz içün bir
          sergi yapqan.
        cid: 0
  - verse: 20
    segments:
      - text: >-
          [19 ayetine baq.]
        cid: 0
  - verse: 21
    segments:
      - text: >-
          (Ogütleriniñ fayda bermegeni uzerine) Nuһ: Rabbim! dedi, doğrusı, bular maña
          qarşı çıqtılar da, malı ve balası oz ziyanını arttıruvdan başqa işke yaramağan
          kimsege uydılar. (Az. Nuһ qavmınıñ malı, şanı ve evlâdı ile ğururlanğan
          adamlarnıñ aşşalıq yollarına uyuvlarından şikâyet ete edi).
        cid: 0
  - verse: 22
    segments:
      - text: >-
          Bular da, buyuk iyleler, buyuk tuzaqlar qurdılar!
        cid: 0
  - verse: 23
    segments:
      - text: >-
          Ve dediler ki: Saqın ilâhlarıñıznı bıraqmañ; Vedden, Suaadan, Yeguustan,
          Yeuuqtan ve Nesirden asla vazgeçmeñ! (Bular o qavm tabınğan eñ muim putlarnıñ
          adları edi).
        cid: 0
  - verse: 24
    segments:
      - text: >-
          (Boylece) olar, aqiqaten bir çoqlarını saptırdılar. (Rabbim!) Sen de, bu
          zalımlarnıñ ancaq şaşqınlıqlarını arttır! (Az. Nuһ iman etkenlerden başqasınıñ
          artıq kesen-kes yolğa kelmeycekleri oña vahiy etilgenden soñ, boyle bir tilek
          ifadesini qullanğan).
        cid: 0
  - verse: 25
    segments:
      - text: >-
          Bular gunahlarınıñ sebebinden, suvda boğuldılar, artından da, ateşke atıldılar
          ve o vaqıtta Allaһqa qarşı yardımcılar da tapalmadılar.
        cid: 0
  - verse: 26
    segments:
      - text: >-
          Nuһ: «Rabbim! dedi, yer yuzünde kâfirlerden iç kimseni bıraqma!». 27. «Çünki
          sen olarnı bıraqsañ, qullarıñnı saptırırlar; yalıñız ahlâqsız, nankor (insanlar)
          doğurırlar (etiştirirler)». 28. «Rabbim! Meni, ana-babamnı, iman etmiş olaraq
          evime kirgenlerni, iman etken erkeklerni ve iman etken qadınlarnı bağışla,
          zalımlarnıñ da, ancaq elâketini arttır». (Tefsirlerde Az. Nuһnıñ evi - mescidi
          ya da gemisi ola bilecegi beyan etilgen).
        cid: 0