surah_id: 71
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >
          Olarğa yaqıcı bir azap kelmeden evel, qavmıñnı tenbiyele, diye Nuhnı öz qavmına
          yolladıq.
        cid: 0
  - verse: 2
    segments:
      - text: >
          Nuh böyle dedi: Ey, qavmım! Şübeñiz olmasın ki, men sizni «Allahqa qullıq etiñ;
          oña qarşı kelüvden saqınıñ ve maña itaat etiñ ki, Allah bir qısım günahlarıñıznı
          bağışlasıñ ve sizni belli bir vadege qadar keçiktirsin (esapqa çekmeden
          yaşatsın)» diyerek, ap-açıq tenbiyelegen bir kimseyim. Bilinmeli ki, Allahnıñ
          tayin etken vadesi kelgeninen, artıq o keçiktirilmez. Keşke bilse ediñiz! («Bir
          qısım günahlarıñıznı» denilir eken, imanğa kelmeden, evelki günahlarnıñ ya da
          qul aqqından ğayrı günahlarnıñ közde tutulğanı tefsirlerde beyan etilgen).
        cid: 0
  - verse: 3
    segments:
      - text: >
          [2 ayetine baq.]
        cid: 0
  - verse: 4
    segments:
      - text: >
          [2 ayetine baq.]
        cid: 0
  - verse: 5
    segments:
      - text: >
          (Soñ Nuh:) Rabbim! dedi, doğrusı, men qavmımnı gece-kündüz (imanğa) davet ettim.
        cid: 0
  - verse: 6
    segments:
      - text: >
          Faqat menim davetim, ancaq qaçuvlarını arttırdı.
        cid: 0
  - verse: 7
    segments:
      - text: >
          Aqiqaten de, (imanğa kelüvleri ve böylece) günahlarını bağışlavıñ içün, olarnı
          ne zaman davet etti isem, parmaqlarını qulaqalırına tıqadılar, (meni körmemek
          içün) urbalarına büründiler, ayaq tirediler, kibirlendikçe kibirlendiler.
        cid: 0
  - verse: 8
    segments:
      - text: >
          Soñ men olarğa ayqıraraq davette bulundım.
        cid: 0
  - verse: 9
    segments:
      - text: >
          Soñ olarnen em açıq-açıqqa, em de gizli-gizli laf ettim.
        cid: 0
  - verse: 10
    segments:
      - text: >
          Dedim ki: Rabbiñizden mağfiret tileñ; çünki O, çoq bağışlayıcıdır.
        cid: 0
  - verse: 11
    segments:
      - text: >
          (Mağfiret tileñ ki) üzeriñizge kökten bol-bol yağmur yağdırsın.
        cid: 0
  - verse: 12
    segments:
      - text: >
          Mallarıñıznı ve oğullarıñıznı çoqlaştırsın, sizge bağçalar ihsan etsin, siz içün
          irmaqlar aqızsın.
        cid: 0
  - verse: 13
    segments:
      - text: >
          Sizge ne olmaqta ki, Allahqa büyüklikni yaqıştıralmaysıñız?
        cid: 0
  - verse: 14
    segments:
      - text: >
          Albuki, sizni türlü yaratılış devrelerinden keçirerek, O yaratqandır.
        cid: 0
  - verse: 15
    segments:
      - text: >
          Körmediñizmi, Allah yedi kökni tabaqa-tabaqa olaraq nasıl yaratqan!
        cid: 0
  - verse: 16
    segments:
      - text: >
          Olarnıñ içinde aynı bir nur etken, küneşni de bir çıraq yapqan.
        cid: 0
  - verse: 17
    segments:
      - text: >
          Allah sizni de yerden ot (çıqarğan) kibi çıqarğan.
        cid: 0
  - verse: 18
    segments:
      - text: >
          Soñ sizni kene o yerge döndürecek ve sizni yañıdan çıqaracaq.
        cid: 0
  - verse: 19
    segments:
      - text: >
          Allah, onda keniş yollar tutıp, dolaşa bilesiñiz diye, yer yüzüni siz içün bir
          sergi yapqan.
        cid: 0
  - verse: 20
    segments:
      - text: >
          [19 ayetine baq.]
        cid: 0
  - verse: 21
    segments:
      - text: >
          (Ögütleriniñ fayda bermegeni üzerine) Nuh: Rabbim! dedi, doğrusı, bular maña
          qarşı çıqtılar da, malı ve balası öz ziyanını arttıruvdan başqa işke yaramağan
          kimsege uydılar. (Az. Nuh qavmınıñ malı, şanı ve evlâdı ile ğururlanğan
          adamlarnıñ aşşalıq yollarına uyuvlarından şikâyet ete edi).
        cid: 0
  - verse: 22
    segments:
      - text: >
          Bular da, büyük iyleler, büyük tuzaqlar qurdılar!
        cid: 0
  - verse: 23
    segments:
      - text: >
          Ve dediler ki: Saqın ilâhlarıñıznı bıraqmañ; Vedden, Suaadan, Yeguustan,
          Yeuuqtan ve Nesirden asla vazgeçmeñ! (Bular o qavm tabınğan eñ müim putlarnıñ
          adları edi).
        cid: 0
  - verse: 24
    segments:
      - text: >
          (Böylece) olar, aqiqaten bir çoqlarını saptırdılar. (Rabbim!) Sen de, bu
          zalımlarnıñ ancaq şaşqınlıqlarını arttır! (Az. Nuh iman etkenlerden başqasınıñ
          artıq kesen-kes yolğa kelmeycekleri oña vahiy etilgenden soñ, böyle bir tilek
          ifadesini qullanğan).
        cid: 0
  - verse: 25
    segments:
      - text: >
          Bular günahlarınıñ sebebinden, suvda boğuldılar, artından da, ateşke atıldılar
          ve o vaqıtta Allahqa qarşı yardımcılar da tapalmadılar.
        cid: 0
  - verse: 26
    segments:
      - text: >
          Nuh: «Rabbim! dedi, yer yüzünde kâfirlerden iç kimseni bıraqma!».
        cid: 0
  - verse: 27
    segments:
      - text: >
          «Çünki sen olarnı bıraqsañ, qullarıñnı saptırırlar; yalıñız ahlâqsız, nankor
          (insanlar) doğurırlar (yetiştirirler)».
        cid: 0
  - verse: 28
    segments:
      - text: >
          «Rabbim! Meni, ana-babamnı, iman etmiş olaraq evime kirgenlerni, iman etken
          erkeklerni ve iman etken qadınlarnı bağışla, zalımlarnıñ da, ancaq elâketini
          arttır». (Tefsirlerde Az. Nuhnıñ evi - mescidi ya da gemisi ola bilecegi beyan
          etilgen).
        cid: 0
