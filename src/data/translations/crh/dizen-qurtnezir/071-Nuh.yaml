        cid: 4
      - text: >-
          «Allahqa qullıq etiñ; oña qarşı kelüvden saqınıñ ve maña itaat etiñ ki, Allah bir
          qısım günahlarıñıznı bağışlasıñ ve sizni belli bir vadege qadar keçiktirsin (esapqa
          çekmeden yaşatsın)» diyerek,
        cid: 0
      - text: ap-açıq
        cid: 6
      - text: tenbiyelegen bir kimseyim.
        cid: 5
      - text: >-
          Bilinmeli ki, Allahnıñ tayin etken vadesi kelgeninen, artıq o keçiktirilmez. Keşke
          bilse ediñiz! («Bir qısım günahlarıñıznı» denilir eken, imanğa kelmeden, evelki
          günahlarnıñ ya da qul aqqından ğayrı günahlarnıñ közde tutulğanı tefsirlerde beyan
          etilgen).
        cid: 0
