  - verse: 20
    segments:
      - text: "[17 ayetine baq.] (Cahiliye devrinde araplar mirastan qadınlarğa, balalarğa ve yetimlerge pay bermey ediler)."
        cid: 0
  - verse: 21
    segments:
      - text: "Amma, yer yuzü parça-parça olğan, Rabbiñ(niñ emri) kelgen ve melekler saf-saf tizilgen vaqıtta (er şey ortağa çıqacaq)."
        cid: 0
  - verse: 22
    segments:
      - text: "[21 ayetine baq.]"
        cid: 0
  - verse: 23
    segments:
      - text: "O kunü ceennem ketirilir, insan yapqanlarını birer-birer hatırlar. Faqat bu hatırlavnıñ ne faydası bar!"
        cid: 0
  - verse: 24
    segments:
      - text: "(İşte, o vaqıtta insan:) «Keşke bu ayatım içün bir şeyler yapıp yollasa edim!», der."
        cid: 0
  - verse: 25
    segments:
      - text: "Artıq o kunü Allaһnıñ etecek azabını kimse etalmaz."
        cid: 0
  - verse: 26
    segments:
      - text: "Onıñ uracaq buğavını kimse uralmaz."
        cid: 0
  - verse: 27
    segments:
      - text: "Ey, raatlıqqa qavuşqan insan! Sen Ondan hoşnut, O da senden hoşnut olaraq, Rabbiñye dön. (Seçken) qullarım arasına qoşul ve cennetime kir!"
        cid: 0
