  - verse: 6
    segments:
      - text: "Kormediñmi, Rabbiñ ne yaptı Aad qavmına; direkleri (üksek binaları) olğan, ulkelerde oña beñzegeni yaratılmağan İrem şeerine, o vadiyde qayalarnı yonğan Semuud qavmına, qazıqlar (çadırlar, ordular) saibi Fıravunğa! Ki olarnıñ episi ulkelerinde adden aştılar. O yerlerde yamanlıqnı arttırdılar. Bu sebepten, Rabbiñ olarnıñ ustüne azap qamçısı yağdırdı. Çünki, Rabbiñ (er an) kozetmektedir. (Bazı tefsircilerge kore, Fıravun yerge dört qazıq qaqtıra, eskence etecek kimselerni ellerinden ve ayaqlarından bu qazıqlarğa bağlata, o şekilde eskence ete eken. Şunıñ içün oña «zu’l-evtaad - qazıqlar saibi» denilgen)."
        cid: 0
