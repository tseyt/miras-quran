surah_id: 89
language: crh
author: dizen-qurtnezir
verses:
  - verse: 15
    segments:
      - text: "İnsan bar ya, Rabbi onı imtian etip de, ikramda bulunğanında ve bol nimet bergeninde: «Rabim maña ikram etti», der."
        cid: 0
  - verse: 16
    segments:
      - text: "Onı imtian etip, rızqını tarlaştırğanında ise: «Rabbim maña emiyet bermedi», der. 17-20. Yoq! Doğrusı, siz yetimge ikram etmemektesiñiz, yoqsulnı toydurmağa birbiriñizni teşviq etmemektesiñiz. Aram-elâl demeden, mirasnı aşamaqtasıñız. Malnı adden aşırı sevmektesiñiz. (Cahiliye devrinde araplar mirastan qadınlarğa, balalarğa ve yetimlerge pay bermey ediler). 21-22. Amma, yer yuzü parça-parça olğan, Rabbiñ(niñ emri) kelgen ve melekler saf-saf tizilgen vaqıtta (er şey ortağa çıqacaq)."
        cid: 0
  - verse: 23
    segments:
      - text: "O kunü ceennem ketirilir, insan yapqanlarını birer-birer hatırlar. Faqat bu hatırlavnıñ ne faydası bar!"
        cid: 0
  - verse: 24
    segments:
      - text: "(İşte, o vaqıtta insan:) «Keşke bu ayatım içün bir şeyler yapıp yollasa edim!», der."
        cid: 0
  - verse: 25
    segments:
      - text: "Artıq o kunü Allaһnıñ etecek azabını kimse etalmaz."
        cid: 0
  - verse: 26
    segments:
      - text: "Onıñ uracaq buğavını kimse uralmaz. 27-30. Ey, raatlıqqa qavuşqan insan! Sen Ondan hoşnut, O da senden hoşnut olaraq, Rabbiñye dön. (Seçken) qullarım arasına qoşul ve cennetime kir!"
        cid: 0