  - verse: 6
    segments:
      - text: Körmediñmi,
        cid: 1
      - text: Rabbiñ
        cid: 5
      - text: ne
        cid: 3
      - text: yaptı Aad qavmına;
        cid: 4
      - text: >-
          direkleri (yüksek binaları) olğan, ülkelerde oña beñzegeni yaratılmağan İrem
          şeerine, o vadiyde qayalarnı yonğan Semuud qavmına, qazıqlar (çadırlar, ordular)
          saibi Fıravunğa! Ki olarnıñ episi ülkelerinde
        cid: 0
      - text: adden aştılar.
        cid: 6
      - text: >-
          O yerlerde yamanlıqnı arttırdılar. Bu sebepten, Rabbiñ olarnıñ üstüne azap qamçısı
          yağdırdı. Çünki, Rabbiñ (er an) közetmektedir. (Bazı tefsircilerge köre, Fıravun
          yerge dört qazıq qaqtıra, eskence etecek kimselerni ellerinden ve ayaqlarından bu
          qazıqlarğa bağlata, o şekilde eskence ete eken. Şunıñ içün oña «zü'l-evtaad -
          qazıqlar saibi» denilgen).
        cid: 0
