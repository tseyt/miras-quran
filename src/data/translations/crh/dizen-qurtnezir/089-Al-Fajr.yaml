surah_id: 89
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "Fecrge, on gecege (hacnıñ on gecesine) çiftke, tekke, (er şeyni qaranlığınen) ortken anda gecege yemin eterim ki, bularda aqıl saibi içün elbette, birer yemin (degeri) bar. (Er kunniñ fecri, Zilhicceniñ on gecesi, musbet ve menfiy qutup diye bilingen çiftlerden teşkil olğan barlq alemi, bularnı yaratqan ve tek olğan Allaһ, er şeyni ortüp, yoq kibi etken gece qaranlığı yeminge mevzu etilgen, soñra da bularnıñ yeminge degerli şeyler olğanı qayd etilgen)."
        cid: 0
