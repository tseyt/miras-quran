surah_id: 89
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >
          Fecrge, on gecege (hacnıñ on gecesine) çiftke, tekke, (er şeyni qaranlığınen)
          örtken anda gecege yemin eterim ki, bularda aqıl saibi içün elbette, birer yemin
          (degeri) bar. (Er künniñ fecri, Zilhicceniñ on gecesi, müsbet ve menfiy qutup
          diye bilingen çiftlerden teşkil olğan barlıq alemi, bularnı yaratqan ve tek
          olğan Allah, er şeyni örtüp, yoq kibi etken gece qaranlığı yeminge mevzu
          etilgen, soñra da bularnıñ yeminge degerli şeyler olğanı qayd etilgen).
        cid: 0
