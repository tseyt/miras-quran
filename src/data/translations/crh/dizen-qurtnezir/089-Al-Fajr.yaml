  - verse: 23
    segments:
      - text: >
          O künü ceennem ketirilir, insan yapqanlarını birer-birer hatırlar. Faqat bu
          hatırlavnıñ ne faydası bar!
        cid: 0
  - verse: 24
    segments:
      - text: >
          (İşte, o vaqıtta insan:) «Keşke bu ayatım içün bir şeyler yapıp yollasa edim!»,
          der.
        cid: 0
  - verse: 25
    segments:
      - text: >
          Artıq o künü Allahnıñ etecek azabını kimse etalmaz.
        cid: 0
  - verse: 26
    segments:
      - text: >
          Onıñ uracaq buğavını kimse uralmaz.
        cid: 0
  - verse: 27
    segments:
      - text: >
          Ey, raatlıqqa qavuşqan insan! Sen Ondan hoşnut, O da senden hoşnut olaraq,
          Rabbiñe dön. (Seçken) qullarım arasına qoşul ve cennetime kir!
        cid: 0
