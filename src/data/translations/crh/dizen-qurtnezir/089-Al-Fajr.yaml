  - verse: 15
    segments:
      - text: "İnsan bar ya, Rabbi onı imtian etip de, ikramda bulunğanında ve bol nimet bergeninde: «Rabim maña ikram etti», der."
        cid: 0
  - verse: 16
    segments:
      - text: "Onı imtian etip, rızqını tarlaştırğanında ise: «Rabbim maña emiyet bermedi», der."
        cid: 0
  - verse: 17
    segments:
      - text: "Yoq! Doğrusı, siz yetimge ikram etmemektesiñiz, yoqsulnı toydurmağa birbiriñizni teşviq etmemektesiñiz. Aram-elâl demeden, mirasnı aşamaqtasıñız. Malnı adden aşırı sevmektesiñiz."
        cid: 0
