  - verse: 21
    segments:
      - text: >
          Amma, yer yüzü parça-parça olğan, Rabbiñ(niñ emri) kelgen ve melekler saf-saf
          tizilgen vaqıtta (er şey ortağa çıqacaq).
        cid: 0
