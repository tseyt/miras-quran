      - text: >-
          yerine ketiricidir. Allah er şey içün bir ölçü qoyğandır. (Ayet beklev müddetiniñ
          soñuna yaqlaşqan qadınnen bağlı olaraq, qocası yapacaq işlerini sıralay. Bular, ya
          tekrar almaq, ya da cezalandırıp, zararğa soqmadan ayırmaqtır. Er eki vaziyette de,
          eki şaat olması şart. Yuqaradaki ayetlerde keçken talaaqnen bağlı emirler böyle
          beyan etile bilir: Ayıruvnı sünnetke uyğun şekilde yapmaq, iddetni saymaq, qadınnı
          evinden çıqarmamaq, ayıruv sırasında şaat tutmaq, şaatlıqnı haq ölçüleri içinde
          yapmaq).
        cid: 0
