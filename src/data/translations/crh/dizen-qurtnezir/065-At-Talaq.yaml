surah_id: 65
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "Ey, Peyğamber! Qadınlarnı ayıracağıñızda, olarnı iddetlerini kozeterek ayırıñ ve iddetni de sayıñ. Rabbiñiz Allaһtan qorquñ. Ap-açıq bir ayasızlıq yapuvları alı bir taraftan, olarnı evlerinden çıqarmañ, ozleri de çıqmasınlar. Bular Allaһnıñ sıñırlarıdır. Kim Allaһnıñ sıñırlarını keçse, şubesiz, ozüne zulum etken olur. Bilalmazsıñ, belki, Allaһ bundan soñ bir alnı ortağa çıqara qoyar. (Ayette, Az.Peyğamberge hitap etilse de, uküm umumiydir, butün ummetke aittir. Ayetke kore, ayırılması istengen qadınlar, iddetleri diqqatqa alınaraq, adetten temizlengenlerinden soñ ayırılır. Ayırılğan qadınnıñ da, iddetine riayet etilir, yani uç hayz ya da temizlenüv muddeti tamamlanmadan, -ric’ıy talaqta- qoca qadınına qayta bilir. Bu muddet tolğandan soñ, ayırılmaq kesen-kesleşir. Ayırılğan qadınlarğa zarar bermemek ayette beyan etilgen uzür ortağa çıqmağance, iddetleri bitkenge qadar, evde qaluvları teminlenir. Ayette bu muddet içün de yañı bir vaziyet ortağa çıqa bilecegi hatırlatılmaqta ki, bu nefretniñ sevgige dönüvi, peşmanlıqnıñ yuz berüvi ve çiftler arasında uzlaşuvnıñ meydanğa kelüvidir. Aslında bir hadiste bildirilgenine kore, ayırmaq, elâl olmaqnen beraber, Allaһ begenmegen bir elâldır)."
        cid: 0
  - verse: 2
    segments:
      - text: "İddet muddetlerini toldırğanlarında, olarnı ya diniy olçüler içerisinde (nikâhıñız altında) tugıñ, ya da olardan diniy olçülerge kore ayırılıñ. Arañızdan adalet saibi eki adamnı da şaat tutıñ. Şaatlıqnı Allaһ içün yapıñ. İşte, bu Allaһqa ve ahiret kunüne inanğanlarğa berilgen ogüttir. Kim Allaһtan qorqsa, Allaһ oña bir çıqış yolu ihsan eter ve oña beklemegen yerinden rızıq berir. Kim Allaһqa işansa, O, oña yeter. Şubesiz, Allaһ emrini yerine ketiricidir. Allaһ er şey içün bir olçü qoyğandır. (Ayet beklev muddetiniñ soñuna yaqlaşqan qadınnen bağlı olaraq, qocası yapacaq işlerini sıralay. Bular, ya tekrar almaq, ya da cezalandırıp, zararğa soqmadan ayırmaqtır. Er eki vaziyette de, eki şaat olması şart. Yuqaradaki ayetlerde keçken talaaqnen bağlı emirler boyle beyan etile bilir: Ayıruvnı sunnetke uyğun şekilde yapmaq, iddetni saymaq, qadınnı evinden çıqarmamaq, ayıruv sırasında şaat tutmaq, şaatlıqnı haq olçüleri içinde yapmaq)."
        cid: 0
  - verse: 4
    segments:
      - text: "Qadınlarıñız arasından adetten kesilmiş olğanlarnen, adet kormegenler hususında şube etseñiz, olarnıñ beklemek muddetleri uç aydır. Yuklü olğanlarnıñ beklemek muddeti ise, yuklerini bıraquvları (doğuruvları)dır. Kim Allaһtan qorqsa, Allaһ oña işinde bir qolaylıq berir."
        cid: 0
  - verse: 5
    segments:
      - text: "İşte, bu Allaһnıñ sizge endirgen emridir. Kim Allaһtan qorqsa, Allaһ onıñ yamanlıqlarını qapatır ve onıñ mukâfatını arttırır."
        cid: 0
  - verse: 6
    segments:
      - text: "Olarnı kuçüñiz olçüsinde oturğan yeriñizniñ bir bolüminde oturtıñ, olarnı sıqıştırıp (ketüvlerini teminlemek içün), olarğa zarar bermege qalqışmañ. Eger yuklü iseler, doğurğanlarına qadar nefaqalarını beriñ. Siz içün balanı emizseler, olarğa aqlarını beriñ, arañızda uyğun bir şekilde añlaşıñ. Eger añlaşalmasañız, balanı başqa bir qadın emizecek."
        cid: 0
  - verse: 7
    segments:
      - text: "İmkânı keniş olğan, nefaqanı imkânlarına kore bersin; rızqı tarlaşqan da, Allaһnıñ oña bergeni qadarından nefaqa odesin. Allaһ iç kimseni bergen imkânından ziyadesinen mesuliyetli tutmaz. Allaһ bir kuçlükten soñ, bir qolayliq yaratacaqtır."
        cid: 0
  - verse: 8
    segments:
      - text: "Rabbiniñ ve Onıñ elçileriniñ emirinden uzaqlaşıp, yoldan azğan nice memleketler bar ki, biz olarnı (ealisini) çetin bir esapqa çekken ve olarnı korülmegen azapqa oğratqandırmız."
        cid: 0
  - verse: 9
    segments:
      - text: "Boylece, olar da yapqanlarınıñ qarşılığını tatqanlar ve işleriniñ soñu tam bir ziyan olğandır."
        cid: 0
  - verse: 10
    segments:
      - text: "Allaһ olarğa şiddetli bir azap azırlağan. Ey, inanğan aqıl saipleri! Allaһtan qorquñ. Allaһ sizge, aqiqaten bir tenbiyeci (kitap) endirgen."
        cid: 0
  - verse: 11
    segments:
      - text: "İman etip, salih amel işlegenlerni, qaranlıqlardan aydınlıqqa çıqarmaq içün, sizge Allaһnıñ ap-açıq ayetlerini oquğan bir Peyğamber yollağan. Kim Allaһqa inansa ve faydalı iş yapsa, Allaһ onı altlarından irmaqlar aqqan, içinde ebediy qalacaq cennetlerge qoyar. Allaһ o kimse içün, aqiqaten guzel bir rızıq bergen."
        cid: 0
  - verse: 12
    segments:
      - text: "Allaһ yedi qat kokni ve yerden de o qadarını yaratqandır. Ferman bular arasından enip turmaqtadır ki, boylece, Allaһnıñ er şeyge qadir olğanını ve er şeyni ilminen quşatqanını bilesiñiz."
        cid: 0