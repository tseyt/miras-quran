      - text: >-
          (Ayette, Az.Peyğamberge hitap etilse de, üküm umumiydir, bütün ümmetke aittir.
          Ayetke köre, ayırılması istengen qadınlar, iddetleri diqqatqa alınaraq, adetten
          temizlengenlerinden soñ ayırılır. Ayırılğan qadınnıñ da, iddetine riayet etilir,
          yani üç hayz ya da temizlenüv müddeti tamamlanmadan, -ric'ıy talaqta- qoca qadınına
          qayta bilir. Bu müddet tolğandan soñ, ayırılmaq kesen-kesleşir. Ayırılğan qadınlarğa
          zarar bermemek ayette beyan etilgen üzür ortağa çıqmağance, iddetleri bitkenge
          qadar, evde qaluvları teminlenir. Ayette bu müddet içün de yañı bir vaziyet ortağa
          çıqa bilecegi hatırlatılmaqta ki, bu nefretniñ sevgige dönüvi, peşmanlıqnıñ yüz
          berüvi ve çiftler arasında uzlaşuvnıñ meydanğa kelüvidir. Aslında bir hadiste
          bildirilgenine köre, ayırmaq, elâl olmaqnen beraber, Allah begenmegen bir elâldır).
        cid: 0
