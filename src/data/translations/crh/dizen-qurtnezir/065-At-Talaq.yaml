surah_id: 65
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >
          Ey, Peyğamber! Qadınlarnı ayıracağıñızda, olarnı iddetlerini közeterek ayırıñ ve
          iddetni de sayıñ. Rabbiñiz Allahtan qorquñ. Ap-açıq bir ayasızlıq yapuvları alı
          bir taraftan, olarnı evlerinden çıqarmañ, özleri de çıqmasınlar. Bular Allahnıñ
          sıñırlarıdır. Kim Allahnıñ sıñırlarını keçse, şübesiz, özüne zulum etken olur.
          Bilalmazsıñ, belki, Allah bundan soñ bir alnı ortağa çıqara qoyar. (Ayette,
          Az.Peyğamberge hitap etilse de, üküm umumiydir, bütün ümmetke aittir. Ayetke
          köre, ayırılması istengen qadınlar, iddetleri diqqatqa alınaraq, adetten
          temizlengenlerinden soñ ayırılır. Ayırılğan qadınnıñ da, iddetine riayet etilir,
          yani üç hayz ya da temizlenüv müddeti tamamlanmadan, -ric'ıy talaqta- qoca
          qadınına qayta bilir. Bu müddet tolğandan soñ, ayırılmaq kesen-kesleşir.
          Ayırılğan qadınlarğa zarar bermemek ayette beyan etilgen üzür ortağa çıqmağance,
          iddetleri bitkenge qadar, evde qaluvları teminlenir. Ayette bu müddet içün de
          yañı bir vaziyet ortağa çıqa bilecegi hatırlatılmaqta ki, bu nefretniñ sevgige
          dönüvi, peşmanlıqnıñ yüz berüvi ve çiftler arasında uzlaşuvnıñ meydanğa
          kelüvidir. Aslında bir hadiste bildirilgenine köre, ayırmaq, elâl olmaqnen
          beraber, Allah begenmegen bir elâldır).
        cid: 0
  - verse: 2
    segments:
      - text: >
          İddet müddetlerini toldırğanlarında, olarnı ya diniy ölçüler içerisinde
          (nikâhıñız altında) tutıñ, ya da olardan diniy ölçülerge köre ayırılıñ.
          Arañızdan adalet saibi eki adamnı da şaat tutıñ. Şaatlıqnı Allah içün yapıñ.
          İşte, bu Allahqa ve ahiret kününe inanğanlarğa berilgen ögüttir. Kim Allahtan
          qorqsa, Allah oña bir çıqış yolu ihsan eter ve oña beklemegen yerinden rızıq
          berir. Kim Allahqa işansa, O, oña yeter. Şübesiz, Allah emrini yerine
          ketiricidir. Allah er şey içün bir ölçü qoyğandır. (Ayet beklev müddetiniñ
          soñuna yaqlaşqan qadınnen bağlı olaraq, qocası yapacaq işlerini sıralay. Bular,
          ya tekrar almaq, ya da cezalandırıp, zararğa soqmadan ayırmaqtır. Er eki
          vaziyette de, eki şaat olması şart. Yuqaradaki ayetlerde keçken talaaqnen bağlı
          emirler böyle beyan etile bilir: Ayıruvnı sünnetke uyğun şekilde yapmaq, iddetni
          saymaq, qadınnı evinden çıqarmamaq, ayıruv sırasında şaat tutmaq, şaatlıqnı haq
          ölçüleri içinde yapmaq).
        cid: 0
  - verse: 3
    segments:
      - text: >
          [2 ayetine baq.]
        cid: 0
  - verse: 4
    segments:
      - text: >
          Qadınlarıñız arasından adetten kesilmiş olğanlarnen, adet körmegenler hususında
          şübe etseñiz, olarnıñ beklemek müddetleri üç aydır. Yüklü olğanlarnıñ beklemek
          müddeti ise, yüklerini bıraquvları (doğuruvları)dır. Kim Allahtan qorqsa, Allah
          oña işinde bir qolaylıq berir.
        cid: 0
  - verse: 5
    segments:
      - text: >
          İşte, bu Allahnıñ sizge endirgen emridir. Kim Allahtan qorqsa, Allah onıñ
          yamanlıqlarını qapatır ve onıñ mükâfatını arttırır.
        cid: 0
  - verse: 6
    segments:
      - text: >
          Olarnı küçüñiz ölçüsinde oturğan yeriñizniñ bir bölüminde oturtıñ, olarnı
          sıqıştırıp (ketüvlerini teminlemek içün), olarğa zarar bermege qalqışmañ. Eger
          yüklü iseler, doğurğanlarına qadar nefaqalarını beriñ. Siz içün balanı
          emizseler, olarğa aqlarını beriñ, arañızda uyğun bir şekilde añlaşıñ. Eger
          añlaşalmasañız, balanı başqa bir qadın emizecek.
        cid: 0
  - verse: 7
    segments:
      - text: >
          İmkânı keniş olğan, nefaqanı imkânlarına köre bersin; rızqı tarlaşqan da,
          Allahnıñ oña bergeni qadarından nefaqa ödesin. Allah iç kimseni bergen
          imkânından ziyadesinen mesuliyetli tutmaz. Allah bir küçlükten soñ, bir qolayliq
          yaratacaqtır.
        cid: 0
  - verse: 8
    segments:
      - text: >
          Rabbiniñ ve Onıñ elçileriniñ emirinden uzaqlaşıp, yoldan azğan nice memleketler
          bar ki, biz olarnı (ealisini) çetin bir esapqa çekken ve olarnı körülmegen
          azapqa oğratqandırmız.
        cid: 0
  - verse: 9
    segments:
      - text: >
          Böylece, olar da yapqanlarınıñ qarşılığını tatqanlar ve işleriniñ soñu tam bir
          ziyan olğandır.
        cid: 0
  - verse: 10
    segments:
      - text: >
          Allah olarğa şiddetli bir azap azırlağan. Ey, inanğan aqıl saipleri! Allahtan
          qorquñ. Allah sizge, aqiqaten bir tenbiyeci (kitap) endirgen.
        cid: 0
  - verse: 11
    segments:
      - text: >
          İman etip, salih amel işlegenlerni, qaranlıqlardan aydınlıqqa çıqarmaq içün,
          sizge Allahnıñ ap-açıq ayetlerini oquğan bir Peyğamber yollağan. Kim Allahqa
          inansa ve faydalı iş yapsa, Allah onı altlarından irmaqlar aqqan, içinde ebediy
          qalacaq cennetlerge qoyar. Allah o kimse içün, aqiqaten güzel bir rızıq bergen.
        cid: 0
  - verse: 12
    segments:
      - text: >
          Allah yedi qat kökni ve yerden de o qadarını yaratqandır. Ferman bular arasından
          enip turmaqtadır ki, böylece, Allahnıñ er şeyge qadir olğanını ve er şeyni
          ilminen quşatqanını bilesiñiz.
        cid: 0
