      - text: "Yerni siz içün yerleşüv meydanı, kokni de, bir bina etken, sizge şekil berip de, şekliñizni guzel yapqan ve sizni temiz erzaqlarnen rızıqlandırğan Allaһtır. İşte, Allaһ, siziñ Rabbiñizdir. Alemlerniñ Rabbi Allaһ yucelerden yucedir."
        cid: 0
  - verse: 55
    segments:
      - text: "O, daima tiridir; Ondan başqa iç bir tañrı yoqtır. O alda, dinde ihlâslı ve samimiy kişiler olaraq, Oña dua etiñ. Er türlü maqtav alemlerniñ Rabbi Allaһqa mahsustır."
        cid: 0
  - verse: 56
    segments:
      - text: "(Resulım!) De ki: Maña Rabbimden ap-açıq deliller kelgeninen, siziñ, Allaһnı bıraqıp, o tabınğanlarıñızğa qullıq etüvim, maña yasaqlandı ve maña alemlerniñ Rabbine teslim oluvım emir etildi."
        cid: 0
  - verse: 57
    segments:
      - text: "Sizni topraqtan, soñra nutfeden, soñ alaqadan (aşlanğan yımırtadan) yaratqan, soñra sabiy olaraq çıqarğan, soñra sizni kuçlü-quvetli bir çağğa irişüviñiz, soñra da qartayuvıñız -ki arañızdan daa evel vefat etkenler de bar- ve belli bir vaqıtqa yetişüviñiz içün sizni yaşatqan Odır. Umüt etilir ki, tüşünirsiñiz. (Ayette ilk insan Adem (a.s.)nıñ topraqtan yaratılğanına işaret etilgenden soñ, insannı ana rahiminden qartayğanına qadar, çeşit devirleri tasvir etilmekte)."
        cid: 0
  - verse: 58
    segments:
      - text: "O, em tiriltici, em de oldüricidir. O, er angi bir işniñ oluvını istegen vaqıtta yalıñız «Ol!», der, o da ola qoyar."
        cid: 0
  - verse: 59
    segments:
      - text: "Allaһnıñ ayetleri aqqında tartışqanlarğa baqmadıñmı, nasıl döndürilmekteler (onı tasdiq etüvge yanaşmaylar)!"
        cid: 0
  - verse: 60
    segments:
      - text: "Olar kitapnı ve peyğamberlerimizge yollağanlarımıznı yalanlağanlardır. Olar yaqında (aqiqatnı) añlaycaqlar! 71-72. Boyunlarında demir alqalar ve zıncırlar olğan alda, sıcaq suvğa süyreklenecekler, soñra da, ateşte yaqılacaklar. 73-74. Soñ olarğa: Allaһnı bıraqıp da, qoşqan ortaqlarıñız ne yerde? denilecek. Olar da: Bizden uzaqlaştılar, zaten biz evelleri iç bir şeyge tabınmay edik, deycekler. İşte, Allaһ kâfirlerni boyle şaşmalatır. (Muşriklerden soralğanda, tabınğan putlarını inkâr etkenleri añlaşılmaqta. Ancaq, Cenab-ı Haq tabınğanlarını qarşılarına ketirgeninen, şaşıp qalacqlar)."
        cid: 0
  - verse: 61
    segments:
      - text: "Bu, siziñ yer yuzünde aqsız olaraq qopayuvıñızdan ve adden aşır sevinip kibrlenüviñiz sebebindendir."
        cid: 0
  - verse: 62
    segments:
      - text: "İçinde ebediy qalmaq uzre ceennemniñ qapularından kiriñ! Kibrlengenlerniñ qaytıp baracaq yerleri ne çirkindir."
        cid: 0
  - verse: 63
    segments:
      - text: "Şunıñ içün (Resulım), sen sabır et! Şubesiz, Allaһnıñ vadesi kerçektir. Olarğa söz bergen azabımıznıñ bir qısmını ya saña kosterirmiz, yahut seni daa evel vefat ettirirmiz. Nasıl olsa da, olar bizge dönecekler."
        cid: 0
  - verse: 64
    segments:
      - text: "Ant olsun, senden evel de peyğamberler yolladıq. Olardan saña qıssalarını añlatqan kimselerimiz de bar, vaziyetlerini saña bildirmegen kimselerimiz de bar. İç bir peyğamber Allaһnnı izni olmayıp, er angi bir ayetni ozlüginden ketiralmaz. Allaһnıñ emiri kelgeninen de, haq tedbiq etilir ve o zaman batılnı seçkenler ziyanğa oğraycaqlar. (Öllanılğan peyğamberlerniñ sayısını Allaһtan başqasınıñ bilalmaycağı muaqqaq olmaqnen beraber, tefsirlerde yuce Allaһnıñ 124000 peyğamber yollağanı rivayet etile. Qur’an-ı Kerimde bulardan sadece 25-iniñ isimleri zikr olunav, ayatları ve Allaһnıñ emirlerini tebliğ hususında alıp barğan kureşlerinden baas etile. Ayet-i Kerimede ayrıca, peyğamberlerniñ oz-ozlerinden ortağa çıqmağanları, ketirgen mucizeleri de Allaһnıñ emiri ve izninen olğanı ifade etilmekte)."
        cid: 0
  - verse: 79
    segments:
      - text: "Allaһ, kimisine minersiñiz, kimisini de aşarsıñız diye, siz içün ayvanlarnı yaratıcıdır."
        cid: 0
