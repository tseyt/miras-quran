surah_id: 40
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "Haa. Miim. (Bu ariflerniñ tefsiri içün Baqara suresiniñ 1-nci ayetine baqıñ). 2-3. Bu kitap mutlaq ğalip, haqqı ile bilici, gunahnı bağışlayıcı, tövbeni qabul etici, azabı çetin, lütf saibi Allaһ tarafından endirilgendir. Ondan başqa iç bir ilâh yoqtır. Dönüş ancaq Oñadır."
        cid: 0
  - verse: 2
    segments:
      - text: "İnkâr etkenler istisna, iç kimse Allaһnıñ ayetleri aqqında tartışmaz. Olarnıñ şeerlerde (raatlıqnen) kezip dolaşuvı seni aldatmasın. (İnkârcılarnıñ dolaşuvları, ticaret ve kârlı qazançlar içün qorqusız ve telükesiz seyaat etüvleri, dünyada qazanğan ustünlik ve buña nisbeten Cenabı Haqnıñ olarğa muhlet berüvi şeklinde tefsir etilgen)."
        cid: 0
  - verse: 5
    segments:
      - text: "Olardan evel Nuһ qavmı ve bulardan soñki toplulıqlar da (peyğamberlerine) mani olmağa, er ummet oz peyğamberini yaqalamağa azm etken edi. Batılnı haqnıñ yerine qoymaq içün kureşken ediler. Bunıñ uzerine men olarnı qapqaçlap yaqaladım. İşte, cezalandıruvımnıñ nasıl olğanını kor! (Ayette, Mekke kâfirlerinden evel kelgen Aad, Semuud ve Luut qavmları kibi, bir taqım milletlerniñ inkârlarına, peyğamberlerini yaqalap oldirüv areketlerine, buña cevaben de, Cenab-ı Haqnıñ inkârcılarnı elâk etüviniñ, belli orneklerine işaret etilmekte. Çünki, inkârcılarnıñ harap yurtları ve facialı aqibetleri bunı kostermekte)."
        cid: 0
  - verse: 6
    segments:
      - text: "İnkâr etkenlerniñ ceennem ehli olğanlarına dair Rabbiñniñ sözü boylece kerçekleşti."
        cid: 0
  - verse: 7
    segments:
      - text: "Arşnı arqalağan ve bir de onıñ etrafında bulunğanlar (melekler), Rabblerini hamd ile tesbih eterler, Oña iman eterler. Mu’minlerniñ de bağışlanuvını isterler: Ey, Rabbimiz! Seniñ rahmet ve ilmiñ er şeyni quşatqan. O alda, tövbe etken ve seniñ yoluñda yurgenlerni bağışla, olarnı ceennem azabından qorçala! (derler). (Arşnı taşığanlar, «Hamele-i arş» denilgen meleklerdir. Rivayetke kore, dört danedirler. Ancaq Haqqaa suresinde (69/17) qıyamette bularnıñ sayısi sekiz olacağı bildirilgen. Arşnı qorçalav ve tedbirine memur olğanları içün, bu isim olarğa micaziy berilgen. Arşnıñ etrafındaki melekler, arşnı tavaf etken meleklerdir. Devaml boyle derler:)"
        cid: 0
  - verse: 8
    segments:
      - text: "Rabbimiz! Olarnı da, olarnıñ atalarından, zevcelerinden, nesillerinden eyi olğanlarnı da, olarğa vade etken Adn cennetleriñye qoy. Şubesiz, aziz ve hakim sensiñ!"
        cid: 0
  - verse: 9
    segments:
      - text: "Bir de olarnı, er türlü fenalıqlardan qorçala. O kunü sen kimni fenalıqlardan qorçalasañ, muaqqaq ki, onı rahmetiñye nail etken olursıñ. Bu eñ buyuk qurtulıştır."
        cid: 0
  - verse: 10
    segments:
      - text: "İnkâr etkenlerge boyle seslenilir: Allaһnıñ ğadabı, siziñ kendiñizge olğan fenalığıñızdan, elbette daa buyuktir. Zira, siz imanğa davet etilmektesiñiz, faqat inkâr etmektesiñiz."
        cid: 0
  - verse: 11
    segments:
      - text: "Olar: Rabbimiz, bizni eki defa oldürdiñ, eki defa tirilttiñ. Biz de gunahlarımıznı itiraf ettik. Bir daa (bu ateşten) çıqmağa yol barmı? derler. (Birinci olüm, dünya ayatınıñ soñunda, ekinci olüm ise, qabirde, ilk sorğulama yapılğandan soñ yuz berecek. Buña kore, birinci tirilüv qabirde sorğulav içün, ekinci tirilüv ise, qıyametten soñki ebediy ayat içündir. İnkârcılarnıñ ateşten çıqmaq içün sorağan yolları ise, erte ya da keç ceennemden çıqış, Allaһqa itaat etiş ya da tekrar dünyağa qaytış çarelerini qıdıruvları şeklinde yorumlanğan)."
        cid: 0
  - verse: 12
    segments:
