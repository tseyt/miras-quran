surah_id: 40
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >
          Haa. Miim. (Bu ariflerniñ tefsiri içün Baqara suresiniñ 1-nci ayetine baqıñ).
        cid: 0
  - verse: 2
    segments:
      - text: >
          Bu kitap mutlaq ğalip, haqqı ile bilici, günahnı bağışlayıcı, tövbeni qabul
          etici, azabı çetin, lütf saibi Allah tarafından endirilgendir. Ondan başqa iç
          bir ilâh yoqtır. Dönüş ancaq Oñadır.
        cid: 0
  - verse: 3
    segments:
      - text: >
          [2 ayetine baq.]
        cid: 0
  - verse: 4
    segments:
      - text: >
          İnkâr etkenler istisna, iç kimse Allahnıñ ayetleri aqqında tartışmaz. Olarnıñ
          şeerlerde (raatlıqnen) kezip dolaşuvı seni aldatmasın. (İnkârcılarnıñ
          dolaşuvları, ticaret ve kârlı qazançlar içün qorqusız ve telükesiz seyaat
          etüvleri, dünyada qazanğan üstünlik ve buña nisbeten Cenab-ı Haqnıñ olarğa
          muhlet berüvi şeklinde tefsir etilgen).
        cid: 0
  - verse: 5
    segments:
      - text: >
          Olardan evel Nuh qavmı ve bulardan soñki toplulıqlar da (peyğamberlerine) mani
          olmağa, er ümmet öz peyğamberini yaqalamağa azm etken edi. Batılnı haqnıñ yerine
          qoymaq içün küreşken ediler. Bunıñ üzerine men olarnı qapqaçlap yaqaladım. İşte,
          cezalandıruvımnıñ nasıl olğanını kör! (Ayette, Mekke kâfirlerinden evel kelgen
          Aad, Semuud ve Luut qavmları kibi, bir taqım milletlerniñ inkârlarına,
          peyğamberlerini yaqalap öldirüv areketlerine, buña cevaben de, Cenab-ı Haqnıñ
          inkârcılarnı elâk etüviniñ, belli örneklerine işaret etilmekte. Çünki,
          inkârcılarnıñ harap yurtları ve facialı aqibetleri bunı köstermekte).
        cid: 0
  - verse: 6
    segments:
      - text: >
          İnkâr etkenlerniñ ceennem ehli olğanlarına dair Rabbiñniñ sözü böylece
          kerçekleşti.
        cid: 0
  - verse: 7
    segments:
      - text: >
          Arşnı arqalağan ve bir de onıñ etrafında bulunğanlar (melekler), Rabblerini hamd
          ile tesbih eterler, Oña iman eterler. Mü'minlerniñ de bağışlanuvını isterler:
          Ey, Rabbimiz! Seniñ rahmet ve ilmiñ er şeyni quşatqan. O alda, tövbe etken ve
          seniñ yoluñda yürgenlerni bağışla, olarnı ceennem azabından qorçala! (derler).
          (Arşnı taşığanlar, «Hamele-i arş» denilgen meleklerdir. Rivayetke köre, dört
          danedirler. Ancaq Haqqaa suresinde (69/17) qıyamette bularnıñ sayısi sekiz
          olacağı bildirilgen. Arşnı qorçalav ve tedbirine memur olğanları içün, bu isim
          olarğa micaziy berilgen. Arşnıñ etrafındaki melekler, arşnı tavaf etken
          meleklerdir. Devamlı böyle derler:)
        cid: 0
  - verse: 8
    segments:
      - text: >
          Rabbimiz! Olarnı da, olarnıñ atalarından, zevcelerinden, nesillerinden eyi
          olğanlarnı da, olarğa vade etken Adn cennetleriñe qoy. Şübesiz, aziz ve hakim
          sensiñ!
        cid: 0
  - verse: 9
    segments:
      - text: >
          Bir de olarnı, er türlü fenalıqlardan qorçala. O künü sen kimni fenalıqlardan
          qorçalasañ, muaqqaq ki, onı rahmetiñe nail etken olursıñ. Bu eñ büyük
          qurtulıştır.
        cid: 0
  - verse: 10
    segments:
      - text: >
          İnkâr etkenlerge böyle seslenilir: Allahnıñ ğadabı, siziñ kendiñizge olğan
          fenalığıñızdan, elbette daa büyüktir. Zira, siz imanğa davet etilmektesiñiz,
          faqat inkâr etmektesiñiz.
        cid: 0
  - verse: 11
    segments:
      - text: >
          Olar: Rabbimiz, bizni eki defa öldürdiñ, eki defa tirilttiñ. Biz de
          günahlarımıznı itiraf ettik. Bir daa (bu ateşten) çıqmağa yol barmı? derler.
          (Birinci ölüm, dünya ayatınıñ soñunda, ekinci ölüm ise, qabirde, ilk sorğulama
          yapılğandan soñ yüz berecek. Buña köre, birinci tirilüv qabirde sorğulav içün,
          ekinci tirilüv ise, qıyametten soñki ebediy ayat içündir. İnkârcılarnıñ ateşten
          çıqmaq içün sorağan yolları ise, erte ya da keç ceennemden çıqış, Allahqa itaat
          etiş ya da tekrar dünyağa qaytış çarelerini qıdıruvları şeklinde yorumlanğan).
        cid: 0
  - verse: 12
    segments:
      - text: >
          (Olarğa denilir ki:) İşte, bunıñ sebebi şudır: Tek Allahqa ibadetke çağırılğan
          vaqıtta inkâr etersiñiz. Oña ortaq qoşulğanınen (bunı), tasdiq etersiñiz. Atıq
          üküm yücelerniñ yücesi Allahnıñdır.
        cid: 0
  - verse: 13
    segments:
      - text: >
          Sizge ayetlerni köstergen, siz içün kökten rızıq endirgen Odır. Allahqa
          yönelgenden başqası ibret almaz. (Kösterilgen «ayetler» ilâhiy qudretke delâlet
          etici nefis eserler ve kemalat yollarını köstergen şeylernen; endirilgen «rızıq»
          da, rızıqnıñ sebebi olğan yağmur, küneş ve ava ile izaat etilgen).
        cid: 0
  - verse: 14
    segments:
      - text: >
          Aydı, kâfirlerniñ oşuna ketmesi de, Allahqa, Allah içün dindar ve ihlâslı
          olaraq, dua etiñ!
        cid: 0
  - verse: 15
    segments:
      - text: >
          Derecelerni yükseltken, Arşnıñ saibi Allah, qavuşmaq kününen qorquzmaq içün,
          qullarından istegenine iradesinen alâqadar vahiy endirir. («Derecelerni
          yüksteltken» tabiri - köklerni bir-biri üstüne qurıp yükseltken, dünyada
          qullarına yüce mertebeler bergen, cennetteki yerlerini yüceltken, meleklerniñ
          Arşqa ya da köklerge yükselüvlerini temin etken, mü'minlerniñ savap derecelerini
          yükseltken şeklinde izaatlanğandır. Ayette keçken «ruh»nıñ manası Allahnıñ,
          qullarından istegenine ihsan etken ilâhiy vahiydir. «Qavuşmaq künü» - qıyamet
          künüdir, çünki, o künde köklerde ve yerdekiler, evelkiler ve soñkiler, abidnen
          mabud, zalımnen mazlum, ep o yerde körüşecekler).
        cid: 0
  - verse: 16
    segments:
      - text: >
          O künü olar (qabirlerinden) meydanğa çıqarlar. Olarnıñ iç bir şeyi Allahqa gizli
          qalmaz. Bugün ükümranlıq kimniñdir? Qahhar olğan tek Allahnıñdır. (Sorağan da,
          cevabını bergen de, Allahtır).
        cid: 0
  - verse: 17
    segments:
      - text: >
          Bugün er keske qazanğanınıñ qarşılığı berilir. Bugün aqsızlıq yoqtır. Şübesiz,
          Allah esapnı çar-çabuk körücidir.
        cid: 0
  - verse: 18
    segments:
      - text: >
          Yaqınlaşqan kün hususında olarnı tenbiyele! Çünki, o, onda deşet içinde
          yutqunğanda, yürekleri ağızlarına kelgendir. Zalımlarnıñ ne dostu, ne de sözü
          diñlenecek şefaatçısı bardır.
        cid: 0
  - verse: 19
    segments:
      - text: >
          Allah, közlerniñ hain baqışını ve qalplerniñ gizlegenini bilir.
        cid: 0
  - verse: 20
    segments:
      - text: >
          Allah, adaletnen üküm eter. Onı bıraqıp, tabınğanları ise, iç bir şeyge üküm
          etalmazlar. Şübesiz, Allah haqqı ile eşitici ve körücidir.
        cid: 0
  - verse: 21
    segments:
      - text: >
          Olar, yer yüzünde kezip dolaşmadılarmı ki, özlerinden evelkilerniñ aqibetleri
          nasıl olğanını körsinler! Olar, quvet ve yer yüzündeki eserleri noqtai
          nazarından, bulardan daa da üstün ediler. Böyle eken, Allah olarnı günahları
          sebebinden yaqaladı. Olarnı Allahnıñ ğadabından qorçalağan da olmadı.
        cid: 0
  - verse: 22
    segments:
      - text: >
          Bunıñ sebebi, peyğamberleri olarğa ap-açıq mucizeler ketirgenleri alda, inkâr
          etvüleri edi. Allah da, olarnı tutıp, yaqalay qoydı. Doğrusı, O, quvetlidir;
          azabı da pek çetindir.
        cid: 0
  - verse: 23
    segments:
      - text: >
          Ant olsun ki, biz Musanı mucizelerimiz ve ap-açıq vesiqanen, Fıravun, Haamaan ve
          Qarunğa yolladıq. Olar: Bu, çoq yalancı bir sihirbazdır! dediler.
        cid: 0
  - verse: 24
    segments:
      - text: >
          [23 ayetine baq.]
        cid: 0
  - verse: 25
    segments:
      - text: >
          İşte o (Musa), tarafımızdan olarğa haqnı ketirgeninen: Onıñnen beraber iman
          etkenlerniñ oğullarını öldüriñ, qadınlarnı sağ qaldırıñ! dediler. Amma,
          kâfirlerniñ tuzağı, elbette boşuna keter. (Bu üç adamdan Fıravun ve Haamaan,
          Qıptiylerniñ ileri kelgenlerinden Qarun da İsrail oğullarındandır. Daa soñki
          ayetlerden de, añlışılacağı kibi, onıñnen beraber iman etkenlerniñ oğullarını
          öldüriñ, qadınlarını sağ qaldırıñ, degen Fıravundır. Oña bu fikirni bergenniñ de
          Haamaan olğanı rivayet etile).
        cid: 0
  - verse: 26
    segments:
      - text: >
          Fıravun: Bıraqıñ meni, dedi. Musanı öldüreyim; (qurtara bilir ise) Rabbine
          yalvarsın! Çünki, men onıñ diniñizni deñiştireceginden, yahut yer yüzünde fesat
          çıqaracağından qorqam. (Fıravunnıñ, bıraqıñ meni, Musanı öldüreyim, diye
          qonuşıvı, onı öldürip olamaycağını köstermekte. Çünki, Fıravunğa Musa içün bu
          seniñ qorqacaq bir kimseñ degil. Eger onı öldürir iseñ, halqnıñ qalbine bir şübe
          soqqan olursıñ. Er kes seniñ açıq delilnen tartışmaqtan aciz olğanıña üküm eter,
          degen ediler. Bunıñnen beraber, Fıravunnıñ zikr etilgen ifadesi, onıñ Musa
          (a.s.)dan ne qadar qorqqanını da köstermekte).
        cid: 0
  - verse: 27
    segments:
      - text: >
          Musa da: Men, esap kününe inanmağan er kibrliden, menim de Rabbim, siziñ de
          Rabbiñizge sığındım, dedi.
        cid: 0
  - verse: 28
    segments:
      - text: >
          Fıravun ailesinden olup, imanını gizlegen bir mü'min adam böyle dedi: Siz bir
          adamnı «Rabbim Allahtır», demekte diye, öldüreceksiñizmi? Albuki, o, sizge
          Rabbiñizden ap-açıq mucizeler ketirgen. Eger o yalancı ise, yalanı özünedir.
          Eger doğru söyley ise, sizni tehdit etken (azapnıñ), bir qısmı olsun, kelip
          sizge çatar. Şübesiz, Allah, adden aşqan, yalancı kimseni doğru yolğa
          iriştirmez. (Fıravunnıñ ailesinden imanını gizlegen bu adamnıñ, Fıravunnıñ
          emcezadesi olğanı söylengen, adı aqqında da çeşit fikrler bar. Fıravun
          ailesinden inanğan bu adam sözlerine böyle devam etti:)
        cid: 0
  - verse: 29
    segments:
      - text: >
          Ey, qavmım! Bugün yer yüzüne akim kimseler olaraq, ükümranlıq siziñdir. Amma,
          Allahnıñ azabı bizge kelip çatar ise, kim bizge yardım eter? Fıravun: Men sizge
          öz fikrimni söylemktem ve kene sizge ancaq doğru yolnı köstermektem, dedi.
        cid: 0
  - verse: 30
    segments:
      - text: >
          İman etken dedi ki: «Ey, qavmım! Doğrusı, men siz içün, Nuh qavmınıñ, Aad,
          Semuud ve olardan soñ kelgenlerniñ vaziyeti kibi, (peyğamberlerni yalanlağan)
          toplulıqlarnıñ başlarına kelgen bir aqibetten qorqmaqtam. Allah qullarına bir
          zulum tileycek degildir».
        cid: 0
  - verse: 31
    segments:
      - text: >
          [30 ayetine baq.]
        cid: 0
  - verse: 32
    segments:
      - text: >
          «Ey, qavmım! Aqiqaten siz içün o bağırışuv-çağırışuv kününden, artıñızğa dön»p
          qaçacaq künüñizden qorqmaqtam. Sizni Allahtan (Onıñ azabından) qurtaracaq kimse
          yoqtır. Allah kimni saptırsa, artıq onı doğru yolğa qavuştıracaq da yoqtır».
        cid: 0
  - verse: 33
    segments:
      - text: >
          [32 ayetine baq.]
        cid: 0
  - verse: 34
    segments:
      - text: >
          Ant olsun ki, (Musadan) evel Yusuf da sizge açıq deliller ketirgen ve onıñ sizge
          ketirgen şeyleri aqqında şübe etip turğan ediñiz. Niayet, o vefat etkeninen:
          «Allah ondan soñ peyğamber yollamaz», dediñiz. İşte, Allah o adden aşqan
          şübecilerni böyle saptırır. (Bazı tefsirciler «Bu yerdeki Yusuf - Az. Yusufnıñ
          torunı Yusuf b. Efraimdir», degen olsalar da, Yusuf b. Yaqubdır degen rivayet
          daa quvvetli körünmekte).
        cid: 0
  - verse: 35
    segments:
      - text: >
          Özlerine kelgen iç bir delil olmağanı alda, Allahnıñ ayetleri aqqında
          tartışqanlar, ister Allah yanında, ister iman etkenler yanında, büyük bir nefret
          ile qarşılanır. Allah büyüklik taslağan er zorbacınıñ qalbini, işte böyle
          müurler.
        cid: 0
  - verse: 36
    segments:
      - text: >
          Fıravun: Ey, Haamaan, maña yüksek bir qulle yap; belki yollarğa, köklerniñ
          yollarına irişirim de, Musanıñ Tañrısını körerim! Doğrusı, men onı yalancı
          sanmaqtam, dedi. Böylece, Fıravunğa yapqan fena işi güzel kösterildi ve yoldan
          saptırıldı. Fıravunnıñ tuzağı tamamen boşuna çıqtı.
        cid: 0
  - verse: 37
    segments:
      - text: >
          [36 ayetine baq.]
        cid: 0
  - verse: 38
    segments:
      - text: >
          O iman etken kimse: Ey, qavmım! dedi, siz maña uyıñız, sizni doğru yolğa alıp
          baracağım.
        cid: 0
  - verse: 39
    segments:
      - text: >
          Ey, qavmım! Şübesiz, bu dünya ayatı, keçici bir eglencedir. Amma, ahiret,
          aqiqaten qalınacaq yurttır.
        cid: 0
  - verse: 40
    segments:
      - text: >
          Kim bir fenalıq yapar ise, onıñ qadar ceza körer. Kim de, qadın ya da erkek,
          mü'min olaraq, faydalı bir iş yapar ise, işte olar cennetke kirecekler, o yerde
          olarğa esapsız rızıq berilecek.
        cid: 0
  - verse: 41
    segments:
      - text: >
          Ey, qavmım! Nedir bu al? Men sizni qurtulışqa çağırmaqtam, siz meni ateşke
          çağırmaqtasıñız.
        cid: 0
  - verse: 42
    segments:
      - text: >
          Siz meni Allahnı inkâr etüvge ve iç tanımağan nesnelerimni Oña ortaq qoşuvğa
          çağırmaqtasıñız. Men ise, sizni aziz ve çoq bağışlayıcı Allahqa davet etmektem.
        cid: 0
  - verse: 43
    segments:
      - text: >
          Aqiqat şu ki, siz meni davet etken şeyiñizniñ dünyada da, ahirette de, davetke
          deger bir tarafı yoqtır. Dönüşimiz Allahqadır, adden aşqanlar da ateş ehliniñ
          özüdirler.
        cid: 0
  - verse: 44
    segments:
      - text: >
          Sizge söylegenlerimni yaqında hatırlaycaqsıñız. Men işimni Allahqa avale etem.
          Şübesiz, Allah qullarını çoq yahşı körücidir.
        cid: 0
  - verse: 45
    segments:
      - text: >
          Niayet, Allah olar qurğan tuzaqlarınıñ fenalıqlarından bu zatnı qorçaladı,
          Fıravunnıñ qavmını ise, yaman azap sara qoydı.
        cid: 0
  - verse: 46
    segments:
      - text: >
          Olar saba-aqşam o ateşke soqulırlar. Qıyametniñ qopacaq künü de: Fıravun
          ailesini azapnıñ eñ çetinine soquñ (denilecek)! (Qabir azabınıñ kerçek olğanına
          bu ayetnen de işaret etilgen).
        cid: 0
  - verse: 47
    segments:
      - text: >
          (Kâfirler) ateşniñ içinde bir-birilerinen çekişkenlerinde, zayıflar o büyüklik
          taslağanlarğa: Biz sizge uyğan edik. Şimdi ateşniñ birazını bizden ala
          bilirsiñizmi? derler.
        cid: 0
  - verse: 48
    segments:
      - text: >
          O büyüklik taslağanlar ise: Doğrusı, epimiz bunıñ içindemiz. Şübe yoq ki, Allah
          qulları arasında berecek ükmini berdi, derler. (Allahnıñ berecek ükmi,
          mü'minlerni cennetke, kâfirlerni de ceennemge soquvınen bağlı ükümdir).
        cid: 0
  - verse: 49
    segments:
      - text: >
          Ateşte olğanlar ceennem bekçilerine: Rabbiñizge dua etiñ, bizden bir kün olsa
          da, azapnı yengilletsin ! deycekler.
        cid: 0
  - verse: 50
    segments:
      - text: >
          (Bekçiler:) Sizge peyğamberleriñiz açıq-açıq deliller ketirmedilermi? derler.
          Olar da: Ketirdiler, cevabını berirler. (Bekçiler ise:) O alda özüñiz yalvarıñ,
          derler. Albuki, kâfirlerniñ yalvaruvları boşunadır. (Bekçiler, «özüñiz yalvarıñ»
          der eken, kâfirlerge şefaat etmeyceklerini ifade etmekteler).
        cid: 0
  - verse: 51
    segments:
      - text: >
          Şübesiz, peyğamberlerimizge ve iman etkenlerge, em dünya ayatında, em şaatlarnıñ
          şaatlıq etecek künlerinde yardım etermiz. (Şaatlar - meleklerdir. Çünki,
          melekler, peyğamberlerniñ ahkâmnı tebliğ etkenlerine, kâfirlerniñ ise, bularnı
          yalanlağanlarına şaatlıq etecekler. Ayrıca, insanlarğa şaatlıq etecek melekler,
          peyğamberler ve mü'minler, şaatlardan sayılğanlar).
        cid: 0
  - verse: 52
    segments:
      - text: >
          O künü zalımlarğa, üzür tilevleri iç bir fayda bermez. Artıq lânet de
          olarnıñdır, yaman yurt da olarnıñdır!
        cid: 0
  - verse: 53
    segments:
      - text: >
          Ant olsun ki, biz Musağa hidayetni berdik ve İsrail oğullarına aqıl saipleri
          içün bir ögüt ve doğrulıq reberi olğan kitapnı miras qaldırdıq.
        cid: 0
  - verse: 54
    segments:
      - text: >
          [53 ayetine baq.]
        cid: 0
  - verse: 55
    segments:
      - text: >
          (Resulım!) Şimdi sen sabır et. Çünki, Allahnıñ vadesi kerçektir. Günahıñnıñ
          bağışlanuvını iste. Aqşam-saba Rabbiñni hamd ile tesbih et. (Allahnıñ vadesi
          dostlarını muzaffer etmesi kibi yorumlanğan. Fıravunnıñ qarşısında Musanıñ
          vaziyeti bunıñ delilidir. Az. Peyğamberniñ saba-aqşam hamd ve tesbihi, aynı
          vaqıtta, ümmetke bıraqılgan bir sünnettir. Rivayet etilgenine köre, bir taqım
          yeudiyler Resulullah (s.a.)qa kelip, «ahır zamanda» Deccal bizim aramızdan
          kelecek ve olacaqlar, işte o vaqıt olacaq!» dediler. Bunıñ üzerine aşağıdaki
          ayet nazil oldı).
        cid: 0
  - verse: 56
    segments:
      - text: >
          Özlerine kelgen kesen-kes bir delil olmayıp, Allahnıñ ayetleri aqqında munaqaşa
          etkenler bar ya, iç şübe yoq ki, olarnıñ qalplerinde, asla yetişalmaycaq bir
          büyüklik avesliklerinden başqa bir şey yoqtır. Sen Allahqa sığın. Şübesiz, O,
          eşitici ve körücidir.
        cid: 0
  - verse: 57
    segments:
      - text: >
          Elbette, köklerniñ ve yerniñ yaratıluvı, insanlarnıñ yaratıluvından daa büyük
          bir şeydir. Faqat insanlarnıñ çoqu bilmezler.
        cid: 0
  - verse: 58
    segments:
      - text: >
          Körnen körgen, inanıp yahşı amellerde bulunğannen fenalıq yapqan bir olmaz. Ne
          qadar az tüşünmektesiñiz.
        cid: 0
  - verse: 59
    segments:
      - text: >
          Qıyamet künü mıtlaqa kelecek, bunda iç şübe yoq. Faqat insanlarnıñ çoqu buña
          inanmazlar. (Dünya insanlar içün bir imtian yeri olğanına, insanlar da bir taqım
          vazifelernen mesuliyetli qılınğanına köre, bunıñ muakemesi ve esabı içün ekinci
          bir ayat kerekligi körülmekte. Bunıñ üstüne şu kâinatnıñ bir başlanğıçı olğanı
          kibi, elbette bir de soñu bardır. Ölüm kerçegi qarşısında dünyanıñ insanlarğa
          ait asıl qarargâh olmağanı da belli. Yaratılış ve ölüm er an tekrarlanaraq,
          kerçekleşkeni kibi, qıyamet ve ahiret de, mıtlaqa, kerçekleşecek. Qıyamet bu
          ayatnıñ soñuna yetüvi, ahiret de, ekinci ayatnıñ ismidir).
        cid: 0
  - verse: 60
    segments:
      - text: >
          Rabbiñiz böyle buyurdı: Maña dua etiñ, qabul eteyim. Çünki, maña ibadetni
          bıraqıp, büyüklik taslağanlar aşşalanaraq, ceeyennemge kirecekler.
        cid: 0
  - verse: 61
    segments:
      - text: >
          İçinde raatlanırsıñız diye, geceni, körüviñiz içün de, kündüzni yaratqan
          Allahtır. Şübesiz, Allah insanlarğa lütfkârdır. Faqat insanlarnıñ çoqu şükür
          etmezler.
        cid: 0
  - verse: 62
    segments:
      - text: >
          İşte, O, er şeyniñ yaratıcısı olğan Rabbiñiz Allahtır. Ondan başqa tañrı yoqtır.
          O alda, nasıl ola da, döndürilmektesiñiz!
        cid: 0
  - verse: 63
    segments:
      - text: >
          Allahnıñ ayetlerini inatlıqnen inkâr etkenler, işte (haqtan) böyle döndürilir.
        cid: 0
  - verse: 64
    segments:
      - text: >
          Yerni siz içün yerleşüv meydanı, kökni de, bir bina etken, sizge şekil berip de,
          şekliñizni güzel yapqan ve sizni temiz erzaqlarnen rızıqlandırğan Allahtır.
          İşte, Allah, siziñ Rabbiñizdir. Alemlerniñ Rabbi Allah yücelerden yücedir.
        cid: 0
  - verse: 65
    segments:
      - text: >
          O, daima tiridir; Ondan başqa iç bir tañrı yoqtır. O alda, dinde ihlâslı ve
          samimiy kişiler olaraq, Oña dua etiñ. Er türlü maqtav alemlerniñ Rabbi Allahqa
          mahsustır.
        cid: 0
  - verse: 66
    segments:
      - text: >
          (Resulım!) De ki: Maña Rabbimden ap-açıq deliller kelgeninen, siziñ, Allahnı
          bıraqıp, o tabınğanlarıñızğa qullıq etüvim, maña yasaqlandı ve maña alemlerniñ
          Rabbine teslim oluvım emir etildi.
        cid: 0
  - verse: 67
    segments:
      - text: >
          Sizni topraqtan, soñra nutfeden, soñ alaqadan (aşlanğan yımırtadan) yaratqan,
          soñra sabiy olaraq çıqarğan, soñra sizni küçlü-quvetli bir çağğa irişüviñiz,
          soñra da qartayuvıñız -ki arañızdan daa evel vefat etkenler de bar- ve belli bir
          vaqıtqa yetişüviñiz içün sizni yaşatqan Odır. Ümüt etilir ki, tüşünirsiñiz.
          (Ayette ilk insan Adem (a.s.)nıñ topraqtan yaratılğanına işaret etilgenden soñ,
          insannı ana rahiminden qartayğanına qadar, çeşit devirleri tasvir etilmekte).
        cid: 0
  - verse: 68
    segments:
      - text: >
          O, em tiriltici, em de öldüricidir. O, er angi bir işniñ oluvını istegen vaqıtta
          yalıñız «Ol!», der, o da ola qoyar.
        cid: 0
  - verse: 69
    segments:
      - text: >
          Allahnıñ ayetleri aqqında tartışqanlarğa baqmadıñmı, nasıl döndürilmekteler (onı
          tasdiq etüvge yanaşmaylar)!
        cid: 0
  - verse: 70
    segments:
      - text: >
          Olar kitapnı ve peyğamberlerimizge yollağanlarımıznı yalanlağanlardır. Olar
