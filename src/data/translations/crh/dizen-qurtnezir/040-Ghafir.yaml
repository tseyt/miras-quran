  - verse: 15
    segments:
      - text: "Derecelerni yukseltken, Arşnıñ saibi Allaһ, qavuşmaq kunünen qorquzmaq içün, qullarından istegenine iradesinen alâqadar vahiy endirir. («Derecelerni yuksteltken» tabiri - koklerni bir-biri ustüne qurıp yukseltken, dünyada qullarına yuce mertebeler bergen, cennetteki yerlerini yuceltken, meleklerniñ Arşqa ya da koklerge yukselüvlerini temin etken, mu’minlerniñ savap derecelerini yukseltken şeklinde izaatlanğandır. Ayette keçken «ruh»nıñ manası Allaһnıñ, qullarından istegenine ihsan etken ilâhiy vahiydir. «Qavuşmaq kunü» - qıyamet kunüdir, çünki, o kunde koklerde ve yerdekiler, evelkiler ve soñkiler, abidnen mabud, zalımnen mazlum, ep o yerde korüşecekler)."
        cid: 0
  - verse: 16
    segments:
      - text: "O kunü olar (qabirlerinden) meydanğa çıqarlar. Olarnıñ iç bir şeyi Allaһqa gizli qalmaz. Bugun ukümranlıq kimniñdir? Qahhar olğan tek Allaһnıñdır. (Sorağan da, cevabını bergen de, Allaһtır)."
