        cid: 0
  - verse: 71
    segments:
      - text: >
          Boyunlarında demir alqalar ve zıncırlar olğan alda, sıcaq suvğa
          süyreklenecekler, soñra da, ateşte yaqılacaqlar.
        cid: 0
  - verse: 72
    segments:
      - text: >
          [71 ayetine baq.]
        cid: 0
  - verse: 73
    segments:
      - text: >
          Soñ olarğa: Allahnı bıraqıp da, qoşqan ortaqlarıñız ne yerde? denilecek. Olar
          da: Bizden uzaqlaştılar, zaten biz evelleri iç bir şeyge tabınmay edik,
          deycekler. İşte, Allah kâfirlerni böyle şaşmalatır. (Müşriklerden soralğanda,
          tabınğan putlarını inkâr etkenleri añlaşılmaqta. Ancaq, Cenab-ı Haq
          tabınğanlarını qarşılarına ketirgeninen, şaşıp qalacqlar).
        cid: 0
  - verse: 74
    segments:
      - text: >
          [73 ayetine baq.]
        cid: 0
  - verse: 75
    segments:
      - text: >
          Bu, siziñ yer yüzünde aqsız olaraq qopayuvıñızdan ve adden aşır sevinip
          kibrlenüviñiz sebebindendir.
        cid: 0
  - verse: 76
    segments:
      - text: >
          İçinde ebediy qalmaq üzre ceennemniñ qapularından kiriñ! Kibrlengenlerniñ qaytıp
          baracaq yerleri ne çirkindir.
        cid: 0
  - verse: 77
    segments:
      - text: >
          Şunıñ içün (Resulım), sen sabır et! Şübesiz, Allahnıñ vadesi kerçektir. Olarğa
          söz bergen azabımıznıñ bir qısmını ya saña kösterirmiz, yahut seni daa evel
          vefat ettirirmiz. Nasıl olsa da, olar bizge dönecekler.
        cid: 0
  - verse: 78
    segments:
      - text: >
          Ant olsun, senden evel de peyğamberler yolladıq. Olardan saña qıssalarını
          añlatqan kimselerimiz de bar, vaziyetlerini saña bildirmegen kimselerimiz de
          bar. İç bir peyğamber Allahnıñ izni olmayıp, er angi bir ayetni özlüginden
          ketiralmaz. Allahnıñ emiri kelgeninen de, haq tedbiq etilir ve o zaman batılnı
          seçkenler ziyanğa oğraycaqlar. (Yollanılğan peyğamberlerniñ sayısını Allahtan
          başqasınıñ bilalmaycağı muaqqaq olmaqnen beraber, tefsirlerde yüce Allahnıñ
          124000 peyğamber yollağanı rivayet etile. Qur'an-ı Kerimde bulardan sadece
          25-iniñ isimleri zikr oluna, ayatları ve Allahnıñ emirlerini tebliğ hususında
          alıp barğan küreşlerinden baas etile. Ayet-i Kerimede ayrıca, peyğamberlerniñ
          öz-özlerinden ortağa çıqmağanları, ketirgen mucizeleri de Allahnıñ emiri ve
          izninen olğanı ifade etilmekte).
        cid: 0
  - verse: 79
    segments:
      - text: >
          Allah, kimisine minersiñiz, kimisini de aşarsıñız diye, siz içün ayvanlarnı
          yaratıcıdır.
        cid: 0
  - verse: 80
    segments:
      - text: >
          Olarda siz içün daa nice faydalar bar. Goñülleriñizdeki bir arzuğa, olarğa
          minerek irişirsiñiz. Olarnıñ ve gemilerniñ üstünde kezinirsiñiz.
        cid: 0
  - verse: 81
    segments:
      - text: >
          Allah sizge ayetlerini köstermekte. Şimdi, Allahnıñ ayetlerinden angisini inkâr
          etersiñiz?
        cid: 0
  - verse: 82
    segments:
      - text: >
          Olar yer yüzünde kezip dolaşmadılarmı ki, özlerinden evelkilerniñ soñu nasıl
          olğan, körsinler! Evelkiler bulardan da çoq edi, quvet tarafından ve yer
          yüzündeki eserleri noqtai nazarından da, daa sağlam ediler. Faqat qazanğan
          şeyleri olarğa asla fayda bermegendir.
        cid: 0
  - verse: 83
    segments:
      - text: >
          Peyğamberleri olarğa ap-açıq bilgiler ketirgeninen, olar özlerinde olğan
          (beşeriy) bilgige işandılar (onı alayğa aldılar). Alayğa alğan şeyleri özlerini
          boğa qoydı.
        cid: 0
  - verse: 84
    segments:
      - text: >
          Artıq o çetin azabımıznı körgen vaqıtlarında: Allahqa inandıq ve oña ortaq
          qoşqan şeylerimizni inkâr ettik, derler.
        cid: 0
  - verse: 85
    segments:
      - text: >
          Faqat azabımıznı körgen vaqıtlarında, imanları özlerine bir fayda bermeycek.
          Allahnıñ qulları aqqında devam etip kelgen sünneti (qanunı) budır. İşte, o zaman
          kâfirlr ziyanğa oğraycaqlar.
        cid: 0
