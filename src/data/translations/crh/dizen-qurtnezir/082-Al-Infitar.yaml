  - verse: 17
    segments:
      - text: >-
          Ceza kunü nedir bilirsiñizmi? Nedir, aceba o ceza kunü? O kunü iç bir kimse
          başqası içün bir şey yapalmaz. O kunü iş Allaһqa qalğandır. (Soñki cumleni «O
          kunü emir Allaһnıñdır. Yalıñız Allaһ emir eter», şeklinde de tercime etmek
          mumkün).
        cid: 0
