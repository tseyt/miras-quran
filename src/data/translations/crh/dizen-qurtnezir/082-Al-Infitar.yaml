      - text: Kök yüzü
        cid: 2
      - text: yarılğan,
        cid: 3
      - text: >-
          yıldızdar tökülgen, deñizler bir-birine qarışqan, qabirlerniñ içindekiler tışqa
          çıqarılğan vaqıtta, insan oğlu (yapıp) yollağanlarını ve (yapamayıp) artta
          qaldırğanlarını birer-birer añlar.
