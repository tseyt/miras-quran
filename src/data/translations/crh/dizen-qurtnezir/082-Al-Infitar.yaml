  - verse: 9
    segments:
      - text: >-
          Yoq! Butün bularğa baqmadan, siz kene de dinni yalanlaysıñız. Şunı yahşı biliñ
          ki, uzeriñizde bekçiler, degerli yazıcılar bardır; olar yapmaqta olğanlarıñıznı
          bilir.
        cid: 0
