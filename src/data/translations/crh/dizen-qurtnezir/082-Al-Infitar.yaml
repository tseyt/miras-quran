surah_id: 82
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >-
          Kok yuzü yarılğan, yıldızdar tökülgen, deñizler bir-birine qarışqan,
          qabirlerniñ içindekiler tışqa çıqarılğan vaqıtta, insan oğlu (yapıp)
          yollağanlarını ve (yapamayıp) artta qaldırğanlarını birer-birer añlar.
        cid: 0
