  - verse: 13
    segments:
      - text: >-
          Yahşılar muaqqaq cennette, yamanlar da ceennemdedirler. Ceza kunünde o yerge
          kirerler. Olar (kâfirler) o yerden bir daa da ayrılmazlar.
        cid: 0
