surah_id: 82
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "Kok yuzü yarılğan, yıldızdar tökülgen, deñizler bir-birine qarışqan, qabirlerniñ içindekiler tışqa çıqarılğan vaqıtta, insan oğlu (yapıp) yollağanlarını ve (yapamayıp) artta qaldırğanlarını birer-birer añlar."
        cid: 0
  - verse: 6
    segments:
      - text: "Ey, insan! Seni yaratıp, seni tertipli ve olçüli yapqan, seni istegen bir şeklinde birleştirgen, ihsanı bol Rabbiñye nisbeten seni aldatqan nedir?"
        cid: 0
  - verse: 9
    segments:
      - text: "Yoq! Butün bularğa baqmadan, siz kene de dinni yalanlaysıñız. Şunı yahşı biliñ ki, uzeriñizde bekçiler, degerli yazıcılar bardır; olar yapmaqta olğanlarıñıznı bilir."
        cid: 0
  - verse: 13
    segments:
      - text: "Yahşılar muaqqaq cennette, yamanlar da ceennemdedirler. Ceza kunünde o yerge kirerler. Olar (kâfirler) o yerden bir daa da ayrılmazlar."
        cid: 0
  - verse: 17
    segments:
      - text: "Ceza kunü nedir bilirsiñizmi? Nedir, aceba o ceza kunü? O kunü iç bir kimse başqası içün bir şey yapalmaz. O kunü iş Allaһqa qalğandır. (Soñki cumleni «O kunü emir Allaһnıñdır. Yalıñız Allaһ emir eter», şeklinde de tercime etmek mumkün)."
        cid: 0