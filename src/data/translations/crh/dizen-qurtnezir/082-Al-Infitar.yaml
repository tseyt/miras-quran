  - verse: 6
    segments:
      - text: >-
          Ey, insan! Seni yaratıp, seni tertipli ve olçüli yapqan, seni istegen bir
          şeklinde birleştirgen, ihsanı bol Rabbiñye nisbeten seni aldatqan nedir?
        cid: 0
