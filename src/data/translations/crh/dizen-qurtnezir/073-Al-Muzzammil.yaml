surah_id: 73
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >
          Ey, örtünip bürüngen (Resulım)! (İlk vahiy kelgenden soñ, Az. Peyğamber ilk kere
          Cebrailni aslıy şeklinen körgen, vucudını bir ürküv ve titrev qaplağan. Doğru
          evine barıp, qadını Az. Haticege: «Meni örtüñ» degen. İşte, bu vaqianıñ artından
          Cebrail aleyhisselâm kene oña vahiynen kelgen ve Resul-ı Ekeremge şu şekilde
          hitap etken).
        cid: 0
  - verse: 2
    segments:
      - text: >
          Bir azı istisna, geceleri qalq, namaz qıl (geceniñ) yarısını (qıl). Yahut bunı
          biraz azalt, ya da çoqlaştır ve Qur'annı dane-dane oqu.
        cid: 0
  - verse: 3
    segments:
      - text: >
          [2 ayetine baq.]
        cid: 0
  - verse: 4
    segments:
      - text: >
          [2 ayetine baq.]
        cid: 0
  - verse: 5
    segments:
      - text: >
          Doğrusı, biz saña (taşıması) ağır bir söz vahiy etecekmiz.
        cid: 0
  - verse: 6
    segments:
      - text: >
          Şübesiz, gece qalqışı - (yürek ve azalar arasında) tam bir uyuvğa ve sağlam bir
          qıraatqa daa elverişlidir.
        cid: 0
  - verse: 7
    segments:
      - text: >
          Zira, kündüz vaqıtı saña uzun bir meşğuliyet bar.
        cid: 0
  - verse: 8
    segments:
      - text: >
          Rabbiñniñ adını añ. Bütün barlığıñnen Oña yönel.
        cid: 0
  - verse: 9
    segments:
      - text: >
          O, şarqnıñ da, ğarbnıñ da Rabbidir. Ondan başqa ilâh yoqtır. Öyle ise, yalıñız
          onıñ imayesine sığın.
        cid: 0
  - verse: 10
    segments:
      - text: >
          Olarnıñ (müşriklerniñ) söylegenlerine qatlan ve olardan güzelliknen ayırıl.
        cid: 0
  - verse: 11
    segments:
      - text: >
          Nimet içinde yaldağan o yalancılarnı maña bıraq ve olarğa biraz muhlet ber.
        cid: 0
  - verse: 12
    segments:
      - text: >
          İç şübesiz, bizim nezdimizde (olar içün azırlanğan) moysalar, yaqıcı bir ateş,
          boğazdan keçmez bir aşalacaq ve elem berici bir azap bar.
        cid: 0
  - verse: 13
    segments:
      - text: >
          [12 ayetine baq.]
        cid: 0
  - verse: 14
    segments:
      - text: >
          O künü (qıyamet künü) yer yüzü ve dağlar sarsılır; dağlar çöküntinen aqıp ketken
          qum obasına döner.
        cid: 0
  - verse: 15
    segments:
      - text: >
          Nasıl Fıravunğa bir elçi yollağan olsaq, doğrusı, sizge de, aqqıñızda şaatlıq
          etecek bir peyğamber yolladıq.
        cid: 0
  - verse: 16
    segments:
      - text: >
          Amma, Fıravun o peyğamberge qarşı kelgen, biz de onı ağır ve çetin bir şekilde
          esapqa çekken edik.
        cid: 0
  - verse: 17
    segments:
      - text: >
          Yahşı, inkâr etseñiz, balalarnı aq saçlı, ihtiyarlarğa çevirecek o künden
          özüñizni nasıl qorçalay bileceksiñiz?
        cid: 0
  - verse: 18
    segments:
      - text: >
          Kök yüzü bile onıñnen (o künniñ deşetinen) yarılacq. Allahnıñ vadesi, mıtlaqa
          yerine kelir.
        cid: 0
  - verse: 19
    segments:
      - text: >
          İşte, bu (añlatılğanlar), şübesiz bir ögüttir. Artıq kim istese, Rabbine
          (barğan) bir yol tutar.
        cid: 0
  - verse: 20
    segments:
      - text: >
          (Resulım!) Seniñ geceniñ üçte ekisine yaqın qısmını, (bazan) yarısını, bazan da
          (üçte birini) yatmadan (ibadetnen) keçirgeniñni ve yanıñda olğanlardan bir
          toplulıqnıñ da, (böyle yapqanını) Rabbiñ, elbette bilmekte. Gece ve kündüzi
          (içinde olup keçenlerni yahşıdan-yahşı) ölçep-biçken ancaq Allahtır. O, siziñ,
          bunı sayalmaycağıñıznı bilgeni içün, sizni bağışladı. Artıq, Qur'andan
          qolayıñızğa kelgenini oquñ. Allah bilmektedir ki, arañızda hastalar olacaq, bir
          qısmıñız Allahnıñ lütfinden (rızıq) qıdırmaq üzre, yer yüzünde yol yürecek,
          diger bir qısmıñız da, Allah yolunda cenkleşecek. O alda, Qur'andan qolayıñızğa
          kelgenini oquñ. Namaznı qılıñ, zekâtnı beriñ, Allahqa goñül hoşluğınen ödünç
          beriñ, özüñiz içün evelden (dünyada olğanda) ne yahşılıq azırlasıñız, Allah
          qatında onı taparsıñız; em de daa üstün ve mükâfatça daa büyük olmaq üzre.
          Allahtan mağfiret tileñ, şübesiz Allah çoq bağışlayıcı, çoq merhametlidir.
          (Sahabe-i kiramnıñ bir qısmı Resul-ı Ekremge uyaraq, geceniñ müim bir qısmını
          ibadetnen keçire edi. Sabağa ne qadar qalğanını kestiralmağanı içün, muqaytlıq
          noqtai nazarından, bütün gece ibadet etken ve ayaqları şişkenler bar edi.
          Ümmet-i Muhammedniñ buña küç yetiştiralmaycağını bilgeni içün, Cenab-ı Haq bu
          tarzda gece ibadetini olarğa farz qılmadı. Namazda Qur'an oqulğanından, bu yerde
          gece namazınıñ micazen Qur'an oqumaq ile ifade etilgeni ve «qolayıñızğa kelgeni
          qadar gece namazı qılıñ» manası közde tutulğanı bildirile. Ayetniñ soñki
          qısmında, sağ olğanda yapılğan hayırlarnıñ ölüm soñuna bıraqılğan vasiyetke
          baqqanda, daa savaplı olğanına işaret bulunğanı tefsirlerde ifade etilmekte).
        cid: 0
