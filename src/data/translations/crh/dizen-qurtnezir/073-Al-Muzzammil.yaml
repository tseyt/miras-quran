surah_id: 73
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >-
          Ey, ortünip burüngen (Resulım)! (İlk vahiy kelgenden soñ, Az. Peyğamber ilk
          kere Cebrailni aslıy şeklinen korgen, vucudını bir urkov ve titrev qaplağan.
          Doğru evine barıp, qadını Az. Haticege: «Meni ortüñ» degen. İşte, bu vaqianıñ
          artından Cebrail aleyhisselâm kene oña vahiynen kelgen ve Resul-ı Ekeremge şu
          şekilde hitap etken).
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Bir azı istisna, geceleri qalq, namaz qıl (geceniñ) yarısını (qıl). Yahut bunı
          biraz azalt, ya da çoqlaştır ve Qur’annı dane-dane oqu.
        cid: 0
  - verse: 3
    segments:
      - text: >-
          [2 ayetine baq.]
        cid: 0
  - verse: 4
    segments:
      - text: >-
          [2 ayetine baq.]
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Doğrusı, biz saña (taşıması) ağır bir söz vahiy etecekmiz.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Şubesiz, gece qalqışı - (ürek ve azalar arasında) tam bir uyuvğa ve sağlam bir
          qıraatqa daa elverişlidir.
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Zira, kundüz vaqıtı saña uzun bir meşğuliyet bar.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Rabbiñniñ adını añ. Butün barlığıñnen Oña yonel.
        cid: 0
  - verse: 9
    segments:
      - text: >-
          O, şarqnıñ da, ğarbnıñ da Rabbidir. Ondan başqa ilâh yoqtır. Oyle ise, yalıñız
          onıñ imayesine sığın.
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Olarnıñ (muşriklerniñ) söylegenlerine qatlan ve olardan guzelliknen ayırıl.
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Nimet içinde yaldağan o yalancılarnı maña bıraq ve olarğa biraz muhlet ber.
        cid: 0
  - verse: 12
    segments:
      - text: >-
          İç şubesiz, bizim nezdimizde (olar içün azırlanğan) moysalar, yaqıcı bir ateş,
          boğazdan keçmez bir aşalacaq ve elem berici bir azap bar.
        cid: 0
  - verse: 13
    segments:
      - text: >-
          [12 ayetine baq.]
        cid: 0
  - verse: 14
    segments:
      - text: >-
          O kunü (qıyamet kunü) yer yuzü ve dağlar sarsılır; dağlar çöküntinen aqıp
          ketken qum obasına döner.
        cid: 0
  - verse: 15
    segments:
      - text: >-
          Nasıl Fıravunğa bir elçi yollağan olsaq, doğrusı, sizge de, aqqıñızda şaatlıq
          etecek bir peyğamber yolladıq.
        cid: 0
  - verse: 16
    segments:
      - text: >-
          Amma, Fıravun o peyğamberge qarşı kelgen, biz de onı ağır ve çetin bir şekilde
          esapqa çekken edik.
        cid: 0
  - verse: 17
    segments:
      - text: >-
          Yahşı, inkâr etseñiz, balalarnı aq saçlı, ihtiyarlarğa çevirecek o kunden
          ozüñizni nasıl qorçalay bileceksiñiz?
        cid: 0
  - verse: 18
    segments:
      - text: >-
          Kok yuzü bile onıñnen (o kunniñ deşetinen) yarılacq. Allaһnıñ vadesi, mıtlaqa
          yerine kelir.
        cid: 0
  - verse: 19
    segments:
      - text: >-
          İşte, bu (añlatılğanlar), şubesiz bir ogüttir. Artıq kim istese, Rabbine
          (barğan) bir yol tutar.
        cid: 0
  - verse: 20
    segments:
      - text: >-
          (Resulım!) Seniñ geceniñ uçte ekisine yaqın qısmını, (bazan) yarısını, bazan da
          (uçte birini) yatmadan (ibadetnen) keçirgeniñni ve yanıñda olğanlardan bir
          toplulıqnıñ da, (boyle yapqanını) Rabbiñ, elbette bilmekte. Gece ve kundüzi
          (içinde olup keçenlerni yahşıdan-yahşı) olçep-biçken ancaq Allaһtır. O, siziñ,
          bunı sayalmaycağıñıznı bilgeni içün, sizni bağışladı. Artıq, Qur’andan
          qolayıñızğa kelgenini oquñ. Allaһ bilmektedir ki, arañızda hastalar olacaq, bir
          qısmıñız Allaһnnıñ lütfinden (rızıq) qıdırmaq uzre, yer yuzünde yol yurecek,
          diger bir qısmıñız da, Allaһ yolunda cenkleşecek. O alda, Qur’andan qolayıñızğa
          kelgenini oquñ. Namaznı qılıñ, zekâtnı beriñ, Allaһqa goñyul hoşluğınen odünç
          beriñ, ozüñiz içün evelden (dünyada olğanda) ne yahşılıq azırlasıñız, Allaһ
          qatında onı taparsıñız; em de daa ustün ve mukâfatça daa buyuk olmaq uzre.
          Allaһtan mağfiret tileñ, şubesiz Allaһ çoq bağışlayıcı, çoq merhametlidir.
          (Sahabe-i kiramnıñ bir qısmı Resul-ı Ekremge uyaraq, geceniñ muim bir qısmını
          ibadetnen keçire edi. Sabağa ne qadar qalğanını kestiralmağanı içün, muqaytlıq
          noqtai nazarından, butün gece ibadet etken ve ayaqları şişkenler bar edi.
          Ummet-i Muһammedniñ buña kuç yetiştiralmaycağını bilgeni içün, Cenab-ı Haq bu
          tarzda gece ibadetini olarğa farz qılmadı. Namazda Qur’an oqulğanından, bu yerde
          gece namazınıñ micazen Qur’an oqumaq ile ifade etilgeni ve «qolayıñızğa kelgeni
          qadar gece namazı qılıñ» manası kozde tutulğanı bildirile. Ayetniñ soñki
          qısmında, sağ olğanda yapılğan hayırlarnıñ olüm soñuna bıraqılğan vasiyetke
          baqqanda, daa savapl olğanına işaret bulunğanı tefsirlerde ifade etilmekte).
        cid: 0