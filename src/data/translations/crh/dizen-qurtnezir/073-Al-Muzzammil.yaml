      - text: >-
          (Sahabe-i kiramnıñ bir qısmı Resul-ı Ekremge uyaraq, geceniñ müim bir qısmını
          ibadetnen keçire edi. Sabağa ne qadar qalğanını kestiralmağanı içün, muqaytlıq
          noqtai nazarından, bütün gece ibadet etken ve ayaqları şişkenler bar edi. Ümmet-i
          Muhammedniñ buña küç yetiştiralmaycağını bilgeni içün, Cenab-ı Haq bu tarzda gece
          ibadetini olarğa farz qılmadı. Namazda Qur'an oqulğanından, bu yerde gece namazınıñ
          micazen Qur'an oqumaq ile ifade etilgeni ve «qolayıñızğa kelgeni qadar gece namazı
          qılıñ» manası közde tutulğanı bildirile. Ayetniñ soñki qısmında, sağ olğanda
          yapılğan hayırlarnıñ ölüm soñuna bıraqılğan vasiyetke baqqanda, daa savaplı olğanına
          işaret bulunğanı tefsirlerde ifade etilmekte).
        cid: 0
