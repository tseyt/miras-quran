      - text: Ey,
        cid: 1
      - text: örtünip bürüngen
        cid: 2
      - text: >-
          (Resulım)! (İlk vahiy kelgenden soñ, Az. Peyğamber ilk kere Cebrailni aslıy şeklinen
          körgen, vucudını bir ürküv ve titrev qaplağan. Doğru evine barıp, qadını Az.
          Haticege: «Meni örtüñ» degen. İşte, bu vaqianıñ artından Cebrail aleyhisselâm kene
          oña vahiynen kelgen ve Resul-ı Ekeremge şu şekilde hitap etken).
        cid: 0
