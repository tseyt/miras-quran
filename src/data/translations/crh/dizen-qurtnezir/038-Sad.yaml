surah_id: 38
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "Saad. Ogüt bergen Qur’anğa yemin eterim ki, kufür etkenler, (idda etkenleriniñ) aksine, bir ğurur ve bolünüv içindedirler."
        cid: 0
  - verse: 3
    segments:
      - text: "Olardan evel nice nesillerni elâk ettik. O zaman feryad ettiler. Albuki, artıq qurtulmaq zamanı degil edi. (Aşağıdaki ayetlerde kâfirlerniñ bazı iddalarına yer berilerek, vaziyetleri boyle añlatılğandır:)"
        cid: 0
  - verse: 4
    segments:
      - text: "Aralarından olarğa bir terbiyeciniñ kelüvine şaştılar ve kâfirler: Bu pek yalancı bir sihirbazdır! Tañrılarnı, bir tañrı yaptımı? Doğrusı, bu şaşılacaq bir şey! dediler. (Qureyşliler bu sözlerinen Az. Muһammedni tanımayıp, inkâr ete ediler. Az. Peyğamber Kelime-i Tevhidni tevsiye etken vaqtında muşrikler: «Bir tañrı butün yarattıqlarnı nasıl idare ete bilir?», degen ve Allaһnıñ birligini qabul etmege yanaşmağan ediler)."
        cid: 0
  - verse: 6
    segments:
      - text: "Olardan ileri kelgenleri: Yuriñ, tañrılarıñızğa bağlılıkta tireliñ, sizden istenilgeni, şubesiz budır. Soñki dinde de bunı eşitmedik. Bu, ancaq bir uydırmadır. Qur’an aramızdan Muһammedge endirildimi? diyerek turıp kettiler. Belki, bular Qur’anım aqqında şubege tüştiler. Yoq! Azabımnı daa tatmadılar. (Üqarıdaki ayetlerde, Az. Peyğamber de davet etilgen Ebu Talibniñ evindeki toplaşuv ve onıñ neticesi haber berilmekte. Qur’an-ı Kerimni inkâr etkenler, babalarınıñ dinlerinde boyle bir şey eşitmegenlerini idda etmekte ediler)."
        cid: 0
  - verse: 9
    segments:
      - text: "Yoqsa, aziz ve lütfkâr Rabbiñniñ rahmet hazineleri olarnıñ yanındamı!"
        cid: 0
  - verse: 10
    segments:
      - text: "Yahut koklerniñ, yerniñ ve ekisiniñ arasında olğanlarnıñ ukümranlığı olarnıñ elindemidir? Oyle ise, (koklerniñ) yollarında yukselsinler (baqayım)!"
        cid: 0
  - verse: 11
    segments:
      - text: "Olar, çeşit toplulıqlardan olğan bir ordudır; işte, şu yerde dağıluvğa oğratılacaqlar. (Dağıluvğa oğratılacaqlarnıñ yeri Bedir, Hendek ve Mekke olğanı aytıla)."
        cid: 0
  - verse: 12
    segments:
      - text: "Olardan evel Nuһ qavmı, Aad qavmı, qazıqlar saibi Fıravun, Semuud, Luut qavmı ve eyke halqı da, peyğamberlerini yalanladılar. İşte, bular da (peyğamberlerge qarşı) birleşken toplulıqlardır. (Ayette, Fıravun içün «qazıqlar saibi» denilüvi, onıñ saray ve saltanat saibi oluvını ifade etüvinen beraber, azap bergen kimseleriniñ ellerini, ayaqlarını dört qazıqqa bağlayaraq eskence etkenini añlatmaqta)."
        cid: 0
  - verse: 14
    segments:
      - text: "Olarnıñ er biri yollanılğan peyğamberlerni yalanladılar da, bu sebepten (ozlerine) azabım haq oldı."
        cid: 0
  - verse: 15
    segments:
      - text: "Bular da ancaq, bir an keçikmeycek qorqunç bir ses beklemekteler."
        cid: 0
  - verse: 16
    segments:
      - text: "Rabbimiz! Bizim payımıznı esap kunünden evel ber, dediler. (Mekke kâfirleri, «Amel defterleri sağ taraftan berilgenlerge kelgende…» ayeti nazil olğan vaqıtta, ayette beyan etilgen alaylı ifadeni söylegenler). (Aşağıdaki ayetlerde, Az. Davud ve onıñ keçirgen imtianı añlatılmaqta)."
        cid: 0
  - verse: 17
    segments:
      - text: "(Resulım!) Olarnıñ aytqanlarına sabır et, qulımız Davudnı, o quvet saibi zatnı hatırla. O, ep Allaһqa yonelir edi. (Rivayetke kore, Az. Davudnıñ kuçlüligi, ibadetke olğan dayanıqlılığı edi. Bir kun oraza tutar, bir kun aşar edi. Geceniñ ancaq uçte birinde yuqlar, qalğan saatlerini ep idabetnen keçirir edi)."
        cid: 0
  - verse: 18
    segments:
      - text: "Doğrusı, biz aqşam-saba onıñnen beraber tesbih etken dağlarnı, toplu alında, quşlarnı onıñ emiri altına bergen edik. Episi Oña yonelgendir. (İbn Abbas quşluq namazınıñ bu ayetke kore qılınğanını añlatqan. Rivayetke kore, Cenab-ı Haq, Davud (a.s.)ğa guzel ve gur bir ses ihsan etken. O Zeburnı oquğanda butün vahşiy ayvanlar etrafında toplana ve onı diñley ekenler)."
        cid: 0
  - verse: 20
    segments:
      - text: "Onıñ ukümranlığını quvetlendirgen, oña ikmet ve guzel qonuşma bergen edik. (Az. Davud, eybetli olmaq, Allaһ tarafından yardımğa oğramaq ve ozüne bir çoq qoruyıcı berilmek, buyuk ordularğa qomandanlıq etmek kibi derecelernen kuvetlendirilgen, ayrıca peyğamberlik, kitap, şeriat, yuksek ilim, amel, guzel qonuşma ve ikmetke saip olğan edi)."
        cid: 0
  - verse: 21
    segments:
      - text: "(Ey, Muһammed!), Saña davacılarnıñ haberi keldimi? Maabedniñ divarına tırmaşıp, Davudnıñ yanına kirgen ediler de, Davud olardan qorqqan edi. «Qorqma! Biz bir-birine duşman eki davacımız, aramızda adaletnen uküm et, aqsızlıq yapma; bizge doğru yolnı koster», dediler. (Daud (a.s.) mescitte ibadet etkeni içün, qoruyıcılar kelgenlerniñ kirmesine izin bermegen ediler. Söz etilgen eki davacı, Az. Davudğa suiqastta bulunmaq istegen eki duşman edi. Çevrelerinde Az. Davudnıñ qoruyıcılarını korüp, maqsatlarına irişalmaycaqlarını añlağanlarınen, bu yalan davanı uydurğan ediler)."
        cid: 0
  - verse: 23
    segments:
      - text: "(Olardan biri boyle dedi:) Bu, qardaşım. Onıñ doqsan doquz qoyunı bar. Mende ise, tek bir qoyun bar. Boyle eken: «Onı da maña ber», dedi ve tartışmada meni yeñdi."
        cid: 0
  - verse: 24
    segments:
      - text: "Davud: Ant olsun ki, seniñ qoyunıñnı oz qoyunlarına qoşmaq istemekle, saña aqsızlıq yapqan. Doğrusı, ortaqçılarnıñ çoqusı bir-birileriniñ aqlarına tecavuz eterler. Yalıñız iman etip de, yahşı işler yapqanlar istisna. Olar da ne qadar az! dedi. Davud ozüni sınağanımıznı zan etti ve Rabbinden mağfiret tileyerek, egilip secdege qapandı, tövbe etip, Allaһqa yoneldi."
        cid: 0
  - verse: 25
    segments:
      - text: "Soñ bu areketinden tolayı, onı bağışladıq. Şubesiz, yanımızda onıñ yuksek bir maqamı ve guzel bir kelecegi bardır."
        cid: 0
  - verse: 26
    segments:
      - text: "Ey, Davud! Biz seni yer yuzünde halife yaptıq. O alda, insanlar arasında adaletnen uküm et. Arzu ve aveske uyma, soñ bu seni Allaһnıñ yolundan saptırır. Doğrusı, Allaһnıñ yolundan sapqanlarğa, esap kunüni unutqanlarına qarşılıq, çetin bir azap bardır."
        cid: 0
  - verse: 27
    segments:
      - text: "Kokni, yerni ve ekisi arasındakilerni biz boş yerge yaratmadıq. Bu zan, inkâr etkenlerniñ zanıdır. Vay o inkâr etkenlerniñ ateşteki alına!"
        cid: 0
  - verse: 28
    segments:
      - text: "Yoqsa, biz iman etip de, yahşı işler yapqanlarnı yer yuzünde bozğuncılıq yapqanlar kibi tutacaqmızmı? Ya da (Allaһtan) qorqqanlarnı yollarından çıqqanlar kibi sayacaqmızmı?"
        cid: 0
  - verse: 29
    segments:
      - text: "(Resulım!) Saña bu mubarek Kitapnı, ayetlerini tüşünsinler ve aqılı olğanlar ogüt alsınlar, diye endirdik. (Bundan soñ Az. Suleymannıñ qıssasına yer berile:)"
        cid: 0
  - verse: 30
    segments:
      - text: "Biz Davudğa Suleymannı berdik. Suleyman ne guzel bir qul edi! Doğrusı, o daima Allaһqa yonelir edi."
        cid: 0
  - verse: 31
    segments:
      - text: "Aqşam ustü oña çalımlı, cınslı qoşu atları taqdim etilgen edi."
        cid: 0
  - verse: 32
    segments:
      - text: "Suleyman: Aqiqaten, men mal sevgisini, Rabbimni añmaq içün istedim, dedi. Niayet, kuneş battı. (O zaman:) Olarnı (atlarnı) tekrar maña ketiriñ, dedi. Ayaqlarını ve boyunlarını sıypamağa başladı. (Ayet muarebe içün at beslevniñ evelden berli devam etip kelgen guzel bir adet olğanını ortağa qoymaqta. Az. Suleyman, cenk itiyacı belli olğanınen, atlarnıñ azırlanuvını ve ogretmek içün qoştırılmasını emir eterek, «Men bularnı dünyada nefsimniñ istegi içün degil, Allaһnıñ emri ve onıñ dinini quvetlendirmek istegenim içün sevem», degen edi)."
        cid: 0
  - verse: 34
    segments:
      - text: "Ant olsun, biz Suleymannı imtian ettik. Tahtınıñ ustüne bir ceset bıraqa qoydıq, soñ o, kene eski alına qayttı. (Suleyman (a.s.) ağır bir hastalıqqa oğrağan devirde imtian etilgen, hastalığı vaqtında «cansız ceset» denilecek qadar zayıflaşqan, soñ tekrar sağlığına qavuiqan)."
        cid: 0
  - verse: 35
    segments:
      - text: "Suleyman: Rabbim! Meni bağışla; maña, menden soñ kimse irişalmaycaq bir ukümranlıq ber. Şubesiz, sen, daima bağışlavda bulunıcısıñ, dedi."
        cid: 0
  - verse: 36
    segments:
      - text: "Bunıñ uzerine, biz de, istegen yerine onıñ emrinen qolay esken ruzgârnı, bina qurğan ve dalğıçlıq yapqan şeytanlarnı, demir alqalarnen bağlı diger yaratılğanlarnı onıñ emrine berdik. 39. «İşte, bu bizim bağışladığımızdır. İster ber, ister (eliñde) tut; esapsızdır», dedik."
        cid: 0
  - verse: 39
    segments:
      - text: "Doğrusı, onıñ bizim yanımızda buyuk bir degeri ve guzel bir yeri bar."
        cid: 0
  - verse: 40
    segments:
      - text: "(Resulım!) Qulımız Eyyubnı da añ. O, Rabbine: Doğrusı, şeytan maña bir yorğunlıq ve eziyet berdi, diye seslengen edi."
        cid: 0
  - verse: 41
    segments:
      - text: "Ayağıñnen yerni tep! İşte, yiqanacaq ve içilecek suvuq bir suv (dedik). (Raatsızlanğan Eyyub (a.s.), bu suvnen yiqanğan, mucize olaraq, iç ve tış hastalıqlarınıñ episinden bunıñnen qurtulğan)."
        cid: 0
  - verse: 42
    segments:
      - text: "Bizden bir rahmet ve kâmil aqıl saipleri içün de, bir ibret olmaq uzre, oña em ailesini, em de olarnen beraber o qadarını daa bağışladıq. (Az. Eyyub ve ailesi darma-dağın alda olğanda, bir yerge toplanğan, sayıları evelkinden bir qat daa artqan, ğayıpları ziyadesinen yerine ketirilgen)."
        cid: 0
  - verse: 43
    segments:
      - text: "Eliñye bir demet sap al da, onıñnen ur, yeminiñni boyle yerine ketir. Aqiqaten, biz Eyyubni sabırlı (bir qul) bulğan edik. O, ne yahşı qul edi! Daima Allaһqa yonelir edi. (Rivayetke kore, Eyyub (a.s.) qadınınıñ bir hatasından otrü, sağlığı kelgen soñ, oña yuz sopa urmağa yemin etken. Albuki, qadınınıñ, oña hızmetleri, fedakârlıqları buyuk edi. Şunıñ içün Cenab-ı Haq, yuz dane ekin sapından teşkil olğan bir demetnen bir kere uruluvını kâfi korgen. Aşağıdaki ayetlerde peyğamberlerniñ qıssalarından parçalar hatırlatılır:)"
        cid: 0
  - verse: 44
    segments:
      - text: "(Ey, Muһammed!) Quvetli ve basiretli qullarımız İbrahim, İshaq ve Yaqubnı da añ."
        cid: 0
  - verse: 45
    segments:
      - text: "Biz olarnı, hususen ahiret yurtunı tüşüngen ihlâslı kimseler qıldıq."
        cid: 0
  - verse: 46
    segments:
      - text: "Doğrusı, olar bizim qatımızda seçilgen eyi kimselerdendir."
        cid: 0
  - verse: 47
    segments:
      - text: "İsmailni, Elyesanı, Zulkiflni de añ. Episi de eyilerdendir. (Bu ayetler, peyğamberlerniñ gunahtan saqınğanlarına delâlet etmekte, çünki Cenab-ı Haq mutlaq olaraq episiniñ «eyiler»den olğanına uküm etken. Buña muqabil mu’minnen munkirniñ aqibeti de boyle añlatılğan:)"
        cid: 0
  - verse: 48
    segments:
      - text: "İşte, bu bir hatırlatuvdır. Doğrusı, Allaһqa qarşı kelüvden saqınğanlarğa guzel bir kelecek bar."
        cid: 0
  - verse: 49
    segments:
      - text: "Qapuları yalıñız olarğa açılğan Adn cennetleri bar."
        cid: 0
  - verse: 50
    segments:
      - text: "Olar kursilerge yaslanıp qurularaq, o yerde bir çoq meyvalar ve içimlikler isterler."
        cid: 0
  - verse: 51
    segments:
      - text: "Yanlarında, zevcelerinden başqasına baqmağan, ozlerine yaşdaş dülberler bardır."
        cid: 0
  - verse: 52
    segments:
      - text: "İşte, esap kunü içün sizge vade olunğan şeyler bulardıң."
        cid: 0
  - verse: 53
    segments:
      - text: "Şubesiz, bu, bizim bergen rızqımızdır. Oña bitmek ve tükenmek yoqtır."
        cid: 0
  - verse: 54
    segments:
      - text: "Bu, boyle; amma yoldan azğanlarğa fena bir kelecek bar."
        cid: 0
  - verse: 55
    segments:
      - text: "Olar ceennemge kirecekler. O yer ne fena bir qaluv yeridir."
        cid: 0
  - verse: 56
    segments:
      - text: "İşte, bu; qaynağan suv ve irindir. Onı tatsınlar."
        cid: 0
  - verse: 57
    segments:
      - text: "Buña beñzegen daa türlü-türlü başqaları da bar."
        cid: 0
  - verse: 58
    segments:
      - text: "(İnkârcılarnıñ buyuklerine:) İşte, bu, siznen beraber ceennemge kirecek toplulıqtır (denilgende, buyukleri:) Olar raatlıq yuzü kormesin, derler). Olar mıtlaqa ateşke kirecekler."
        cid: 0
  - verse: 59
    segments:
      - text: "(Buyuklerge uyğanlar ise:) Yoq, asla siz raatlıq yuzü kormeñ! Onı bizim ogümizge siz ketirdiñiz! Ne fena bir yerdir! derler."
        cid: 0
  - verse: 60
    segments:
      - text: "Kene olar: Rabbimiz! Bunı bizim ogümizge kim ketirgen ise, onıñ ateşteki azabını eki qat arttır! derler."
        cid: 0
  - verse: 61
    segments:
      - text: "(İnkârcılar) derler ki: Ozlerini dünyada olğanda yamanlardan sayğan kimselerimizni bu yerde niçün kormeymiz?"
        cid: 0
  - verse: 62
    segments:
      - text: "Alayğa alğanlarımız olar degil edimi? Yoqsa, (bu yerdeler de) olarnı kozden qaçırdıqmı?"
        cid: 0
  - verse: 63
    segments:
      - text: "İşte, bu, ceennem ehliniñ davası, şubesiz bir aqiqattır. (Mekke kâfirleriniñ alay etken insanları - Ammar, Bilâl ve Suheyb (r.a.) kibi faqır mu’minler edi)."
        cid: 0
  - verse: 64
    segments:
      - text: "(Resulım!) De ki: Men sadece bir tenbiyeciyim. Tek ve qahhar olğan Allaһtan başqa bir tañrı yoqtır."
        cid: 0
  - verse: 65
    segments:
      - text: "Koklerniñ, yerniñ ve ekisiniñ arasında olğanlarnıñ Rabbi (olğan Allaһ) ustündir, çoq bağışlayıcıdır."
        cid: 0
  - verse: 66
    segments:
      - text: "De ki: Bu buyuk bir haberdir. Amma, siz ondan yuz çevirmektesiñiz."
        cid: 0
  - verse: 68
    segments:
      - text: "Olar o yerde davalaşqanda, menim mele-i a’lâa aqqında iç bir bilgim yoq edi. (Tefsirlerge kore, mele-i a’lâanıñ manası - Allaһnıñ qonuşmaq içün meleklerni toplağan yuce meclisidir)."
        cid: 0
  - verse: 69
    segments:
      - text: "Men ancaq ap-açıq bir tenbiyeci olğanım içün, maña vahiy olunmaqta."
        cid: 0
  - verse: 70
    segments:
      - text: "Rabbiñ meleklerge degen edi ki: Men muaqqaq çamurdan bir insan yaratacam."
        cid: 0
  - verse: 71
    segments:
      - text: "Onı tamamlap, içine de ruhumdan uflegen zamanımda, der’al oña secedege qapanıñ!"
        cid: 0
  - verse: 72
    segments:
      - text: "Butün melekler toptan secde ettiler."
        cid: 0
  - verse: 73
    segments:
      - text: "Yalıñız İblis secde etmedi. O buyuklik tasladı ve kâfirlerden oldı."
        cid: 0
  - verse: 74
    segments:
      - text: "Allaһ: Ey, İblis! Eki elimnen yaratqanıma secde etüvden seni men etken nedir? Kibrlendiñmi, yoqsa, yucelerdensiñmi? dedi."
        cid: 0
  - verse: 75
    segments:
      - text: "İblis: Men ondan hayırlıyım! Meni ateşten yarattıñ, onı çamurdan yarattıñ, dedi."
        cid: 0
  - verse: 76
    segments:
      - text: "Allaһ: Çıq o yerden (cennetten)! Sen artıq quvulğan birisisiñ, ceza kunüne qadar lânetim seniñ uzeriñdedir! buyurdı."
        cid: 0
  - verse: 78
    segments:
      - text: "İblis: Ey, Rabbim! O alda, tekrar tiriltilecek kunlerine qadar maña muhlet ber, dedi."
        cid: 0
  - verse: 79
    segments:
      - text: "Allaһ: Aydı, sen belli kungece muhlet berilgenlerdensiñ, buyurdı."
        cid: 0
  - verse: 81
    segments:
      - text: "İblis: Seniñ mutlaq qudretiñye ant olsun ki, olardan ihlâsqa iriştirilgen qullarıñ bir tarafta, episini mıtlaqa yoldan azdıracam, dedi."
        cid: 0
  - verse: 83
    segments:
      - text: "Doğrusı -ki men ep doğrunı söylerim- mıtlaqa sen ve saña uyğanlarnıñ episinen ceennemni tolduracam! buyurdı."
        cid: 0
  - verse: 85
    segments:
      - text: "(Resulım!) De ki: Buña qarşılıq men sizden bir aq istemeyim. Ve men olğanından başqa türlü korüngenlerden de degilim."
        cid: 0
  - verse: 86
    segments:
      - text: "Bu Qur’an, ancaq alemler içün bir ogüttir."
        cid: 0
  - verse: 87
    segments:
      - text: "O bergen haberniñ doğrulığını biraz vaqıt soñca çoq yahşı bileceksiñiz."
        cid: 0