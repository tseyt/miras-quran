surah_id: 38
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >
          Saad. Ögüt bergen Qur'anğa yemin eterim ki, küfür etkenler, (idda etkenleriniñ)
          aksine, bir ğurur ve bölünüv içindedirler.
        cid: 0
  - verse: 2
    segments:
      - text: >
          [1 ayetine baq.]
        cid: 0
  - verse: 3
    segments:
      - text: >
          Olardan evel nice nesillerni elâk ettik. O zaman feryad ettiler. Albuki, artıq
          qurtulmaq zamanı degil edi. (Aşağıdaki ayetlerde kâfirlerniñ bazı iddalarına yer
          berilerek, vaziyetleri böyle añlatılğandır:)
        cid: 0
  - verse: 4
    segments:
      - text: >
          Aralarından olarğa bir terbiyeciniñ kelüvine şaştılar ve kâfirler: Bu pek
          yalancı bir sihirbazdır! Tañrılarnı, bir tañrı yaptımı? Doğrusı, bu şaşılacaq
          bir şey! dediler. (Qureyşliler bu sözlerinen Az. Muhammedni tanımayıp, inkâr ete
          ediler. Az. Peyğamber Kelime-i Tevhidni tevsiye etken vaqtında müşrikler: «Bir
          tañrı bütün yarattıqlarnı nasıl idare ete bilir?», degen ve Allahnıñ birligini
          qabul etmege yanaşmağan ediler).
        cid: 0
  - verse: 5
    segments:
      - text: >
          [4 ayetine baq.]
        cid: 0
  - verse: 6
    segments:
      - text: >
          Olardan ileri kelgenleri: Yüriñ, tañrılarıñızğa bağlılıqta tireliñ, sizden
          istenilgeni, şübesiz budır. Soñki dinde de bunı eşitmedik. Bu, ancaq bir
          uydırmadır. Qur'an aramızdan Muhammedge endirildimi? diyerek turıp kettiler.
          Belki, bular Qur'anım aqqında şübege tüştiler. Yoq! Azabımnı daa tatmadılar.
          (Yuqarıdaki ayetlerde, Az. Peyğamber de davet etilgen Ebu Talibniñ evindeki
          toplaşuv ve onıñ neticesi haber berilmekte. Qur'an-ı Kerimni inkâr etkenler,
          babalarınıñ dinlerinde böyle bir şey eşitmegenlerini idda etmekte ediler).
        cid: 0
  - verse: 7
    segments:
      - text: >
          [6 ayetine baq.]
        cid: 0
  - verse: 8
    segments:
      - text: >
          [6 ayetine baq.]
        cid: 0
  - verse: 9
    segments:
      - text: >
          Yoqsa, aziz ve lütfkâr Rabbiñniñ rahmet hazineleri olarnıñ yanındamı!
        cid: 0
  - verse: 10
    segments:
      - text: >
          Yahut köklerniñ, yerniñ ve ekisiniñ arasında olğanlarnıñ ükümranlığı olarnıñ
          elindemidir? Öyle ise, (köklerniñ) yollarında yükselsinler (baqayım)!
        cid: 0
  - verse: 11
    segments:
      - text: >
          Olar, çeşit toplulıqlardan olğan bir ordudır; işte, şu yerde dağıluvğa
          oğratılacaqlar. (Dağıluvğa oğratılacaqlarnıñ yeri Bedir, Hendek ve Mekke olğanı
          aytıla).
        cid: 0
  - verse: 12
    segments:
      - text: >
          Olardan evel Nuh qavmı, Aad qavmı, qazıqlar saibi Fıravun, Semuud, Luut qavmı ve
          eyke halqı da, peyğamberlerini yalanladılar. İşte, bular da (peyğamberlerge
          qarşı) birleşken toplulıqlardır. (Ayette, Fıravun içün «qazıqlar saibi»
          denilüvi, onıñ saray ve saltanat saibi oluvını ifade etüvinen beraber, azap
          bergen kimseleriniñ ellerini, ayaqlarını dört qazıqqa bağlayaraq eskence
          etkenini añlatmaqta).
        cid: 0
  - verse: 13
    segments:
      - text: >
          [12 ayetine baq.]
        cid: 0
  - verse: 14
    segments:
      - text: >
          Olarnıñ er biri yollanılğan peyğamberlerni yalanladılar da, bu sebepten
          (özlerine) azabım haq oldı.
        cid: 0
  - verse: 15
    segments:
      - text: >
          Bular da ancaq, bir an keçikmeycek qorqunç bir ses beklemekteler.
        cid: 0
  - verse: 16
    segments:
      - text: >
          Rabbimiz! Bizim payımıznı esap kününden evel ber, dediler. (Mekke kâfirleri,
          «Amel defterleri sağ taraftan berilgenlerge kelgende...» ayeti nazil olğan
          vaqıtta, ayette beyan etilgen alaylı ifadeni söylegenler). (Aşağıdaki ayetlerde,
          Az. Davud ve onıñ keçirgen imtianı añlatılmaqta).
        cid: 0
  - verse: 17
    segments:
      - text: >
          (Resulım!) Olarnıñ aytqanlarına sabır et, qulımız Davudnı, o quvet saibi zatnı
          hatırla. O, ep Allahqa yönelir edi. (Rivayetke köre, Az. Davudnıñ küçlüligi,
          ibadetke olğan dayanıqlılığı edi. Bir kün oraza tutar, bir kün aşar edi. Geceniñ
          ancaq üçte birinde yuqlar, qalğan saatlerini ep idabetnen keçirir edi).
        cid: 0
  - verse: 18
    segments:
      - text: >
          Doğrusı, biz aqşam-saba onıñnen beraber tesbih etken dağlarnı, toplu alında,
          quşlarnı onıñ emiri altına bergen edik. Episi Oña yönelgendir. (İbn Abbas quşluq
          namazınıñ bu ayetke köre qılınğanını añlatqan. Rivayetke köre, Cenab-ı Haq,
          Davud (a.s.)ğa güzel ve gür bir ses ihsan etken. O Zeburnı oquğanda bütün vahşiy
          ayvanlar etrafında toplana ve onı diñley ekenler).
        cid: 0
  - verse: 19
    segments:
      - text: >
          [18 ayetine baq.]
        cid: 0
  - verse: 20
    segments:
      - text: >
          Onıñ ükümranlığını quvetlendirgen, oña ikmet ve güzel qonuşma bergen edik. (Az.
          Davud, eybetli olmaq, Allah tarafından yardımğa oğramaq ve özüne bir çoq
          qoruyıcı berilmek, büyük ordularğa qomandanlıq etmek kibi derecelernen
          quvetlendirilgen, ayrıca peyğamberlik, kitap, şeriat, yüksek ilim, amel, güzel
          qonuşma ve ikmetke saip olğan edi).
        cid: 0
  - verse: 21
    segments:
      - text: >
          (Ey, Muhammed!), Saña davacılarnıñ haberi keldimi? Maabedniñ divarına tırmaşıp,
          Davudnıñ yanına kirgen ediler de, Davud olardan qorqqan edi. «Qorqma! Biz
          bir-birine duşman eki davacımız, aramızda adaletnen üküm et, aqsızlıq yapma;
          bizge doğru yolnı köster», dediler. (Daud (a.s.) mescitte ibadet etkeni içün,
          qoruyıcılar kelgenlerniñ kirmesine izin bermegen ediler. Söz etilgen eki davacı,
          Az. Davudğa suiqastta bulunmaq istegen eki duşman edi. Çevrelerinde Az. Davudnıñ
          qoruyıcılarını körüp, maqsatlarına irişalmaycaqlarını añlağanlarınen, bu yalan
          davanı uydurğan ediler).
        cid: 0
  - verse: 22
    segments:
      - text: >
          [21 ayetine baq.]
        cid: 0
  - verse: 23
    segments:
      - text: >
          (Olardan biri böyle dedi:) Bu, qardaşım. Onıñ doqsan doquz qoyunı bar. Mende
          ise, tek bir qoyun bar. Böyle eken: «Onı da maña ber», dedi ve tartışmada meni
          yeñdi.
        cid: 0
  - verse: 24
    segments:
      - text: >
          Davud: Ant olsun ki, seniñ qoyunıñnı öz qoyunlarına qoşmaq istemekle, saña
          aqsızlıq yapqan. Doğrusı, ortaqçılarnıñ çoqusı bir-birileriniñ aqlarına tecavuz
          eterler. Yalıñız iman etip de, yahşı işler yapqanlar istisna. Olar da ne qadar
          az! dedi. Davud özüni sınağanımıznı zan etti ve Rabbinden mağfiret tileyerek,
          egilip secdege qapandı, tövbe etip, Allahqa yöneldi.
        cid: 0
  - verse: 25
    segments:
      - text: >
          Soñ bu areketinden tolayı, onı bağışladıq. Şübesiz, yanımızda onıñ yüksek bir
          maqamı ve güzel bir kelecegi bardır.
        cid: 0
  - verse: 26
    segments:
      - text: >
          Ey, Davud! Biz seni yer yüzünde halife yaptıq. O alda, insanlar arasında
          adaletnen üküm et. Arzu ve aveske uyma, soñ bu seni Allahnıñ yolundan saptırır.
          Doğrusı, Allahnıñ yolundan sapqanlarğa, esap kününi unutqanlarına qarşılıq,
          çetin bir azap bardır.
        cid: 0
  - verse: 27
    segments:
      - text: >
          Kökni, yerni ve ekisi arasındakilerni biz boş yerge yaratmadıq. Bu zan, inkâr
          etkenlerniñ zanıdır. Vay o inkâr etkenlerniñ ateşteki alına!
        cid: 0
  - verse: 28
    segments:
      - text: >
          Yoqsa, biz iman etip de, yahşı işler yapqanlarnı yer yüzünde bozğuncılıq
          yapqanlar kibi tutacaqmızmı? YA da (Allahtan) qorqqanlarnı yollarından çıqqanlar
          kibi sayacaqmızmı?
        cid: 0
  - verse: 29
    segments:
      - text: >
          (Resulım!) Saña bu mubarek Kitapnı, ayetlerini tüşünsinler ve aqılı olğanlar
          ögüt alsınlar, diye endirdik. (Bundan soñ Az. Süleymannıñ qıssasına yer berile:)
        cid: 0
  - verse: 30
    segments:
      - text: >
          Biz Davudğa Süleymannı berdik. Süleyman ne güzel bir qul edi! Doğrusı, o daima
          Allahqa yönelir edi.
        cid: 0
  - verse: 31
    segments:
      - text: >
          Aqşam üstü oña çalımlı, cınslı qoşu atları taqdim etilgen edi.
        cid: 0
  - verse: 32
    segments:
      - text: >
          Süleyman: Aqiqaten, men mal sevgisini, Rabbimni añmaq içün istedim, dedi.
          Niayet, küneş battı. (O zaman:) Olarnı (atlarnı) tekrar maña ketiriñ, dedi.
          Ayaqlarını ve boyunlarını sıypamağa başladı. (Ayet muarebe içün at beslevniñ
          evelden berli devam etip kelgen güzel bir adet olğanını ortağa qoymaqta. Az.
          Süleyman, cenk itiyacı belli olğanınen, atlarnıñ azırlanuvını ve ögretmek içün
          qoştırılmasını emir eterek, «Men bularnı dünyada nefsimniñ istegi içün degil,
          Allahnıñ emri ve onıñ dinini quvetlendirmek istegenim içün sevem», degen edi).
        cid: 0
  - verse: 33
    segments:
      - text: >
          [32 ayetine baq.]
        cid: 0
  - verse: 34
    segments:
      - text: >
          Ant olsun, biz Süleymannı imtian ettik. Tahtınıñ üstüne bir ceset bıraqa qoydıq,
          soñ o, kene eski alına qayttı. (Süleyman (a.s.) ağır bir hastalıqqa oğrağan
          devirde imtian etilgen, hastalığı vaqtında «cansız ceset» denilecek qadar
          zayıflaşqan, soñ tekrar sağlığına qavuşqan).
        cid: 0
  - verse: 35
    segments:
      - text: >
          Süleyman: Rabbim! Meni bağışla; maña, menden soñ kimse irişalmaycaq bir
          ükümranlıq ber. Şübesiz, sen, daima bağışlavda bulunıcısıñ, dedi.
        cid: 0
  - verse: 36
    segments:
      - text: >
          Bunıñ üzerine, biz de, istegen yerine onıñ emrinen qolay esken rüzgârnı, bina
          qurğan ve dalğıçlıq yapqan şeytanlarnı, demir alqalarnen bağlı diger
          yaratılğanlarnı onıñ emrine berdik.
        cid: 0
  - verse: 37
    segments:
      - text: >
          [36 ayetine baq.]
        cid: 0
  - verse: 38
    segments:
      - text: >
          [36 ayetine baq.]
        cid: 0
  - verse: 39
    segments:
      - text: >
          «İşte, bu bizim bağışladığımızdır. İster ber, ister (eliñde) tut; esapsızdır»,
          dedik.
        cid: 0
  - verse: 40
    segments:
      - text: >
          Doğrusı, onıñ bizim yanımızda büyük bir degeri ve güzel bir yeri bar.
        cid: 0
  - verse: 41
    segments:
      - text: >
          (Resulım!) Qulımız Eyyubnı da añ. O, Rabbine: Doğrusı, şeytan maña bir yorğunlıq
          ve eziyet berdi, diye seslengen edi.
        cid: 0
  - verse: 42
    segments:
      - text: >
          Ayağıñnen yerni tep! İşte, yiqanacaq ve içilecek suvuq bir suv (dedik).
          (Raatsızlanğan Eyyub (a.s.), bu suvnen yiqanğan, mucize olaraq, iç ve tış
          hastalıqlarınıñ episinden bunıñnen qurtulğan).
        cid: 0
  - verse: 43
    segments:
      - text: >
          Bizden bir rahmet ve kâmil aqıl saipleri içün de, bir ibret olmaq üzre, oña em
          ailesini, em de olarnen beraber o qadarını daa bağışladıq. (Az. Eyyub ve ailesi
          darma-dağın alda olğanda, bir yerge toplanğan, sayıları evelkinden bir qat daa
          artqan, ğayıpları ziyadesinen yerine ketirilgen).
        cid: 0
  - verse: 44
    segments:
      - text: >
          Eliñe bir demet sap al da, onıñnen ur, yeminiñni böyle yerine ketir. Aqiqaten,
          biz Eyyubni sabırlı (bir qul) bulğan edik. O, ne yahşı qul edi! Daima Allahqa
          yönelir edi. (Rivayetke köre, Eyyub (a.s.) qadınınıñ bir hatasından ötrü,
          sağlığı kelgen soñ, oña yüz sopa urmağa yemin etken. Albuki, qadınınıñ, oña
          hızmetleri, fedakârlıqları büyük edi. Şunıñ içün Cenab-ı Haq, yüz dane ekin
          sapından teşkil olğan bir demetnen bir kere uruluvını kâfi körgen. Aşağıdaki
          ayetlerde peyğamberlerniñ qıssalarından parçalar hatırlatılır:)
        cid: 0
  - verse: 45
    segments:
      - text: >
          (Ey, Muhammed!) Quvetli ve basiretli qullarımız İbrahim, İshaq ve Yaqubnı da añ.
        cid: 0
  - verse: 46
    segments:
      - text: >
          Biz olarnı, hususen ahiret yurtunı tüşüngen ihlâslı kimseler qıldıq.
        cid: 0
  - verse: 47
    segments:
      - text: >
          Doğrusı, olar bizim qatımızda seçilgen eyi kimselerdendir.
        cid: 0
  - verse: 48
    segments:
      - text: >
          İsmailni, Elyesanı, Zülkiflni de añ. Episi de eyilerdendir. (Bu ayetler,
          peyğamberlerniñ günahtan saqınğanlarına delâlet etmekte, çünki Cenab-ı Haq
          mutlaq olaraq episiniñ «eyiler»den olğanına üküm etken. Buña muqabil mü'minnen
          münkirniñ aqibeti de böyle añlatılğan:)
        cid: 0
  - verse: 49
    segments:
      - text: >
          İşte, bu bir hatırlatuvdır. Doğrusı, Allahqa qarşı kelüvden saqınğanlarğa güzel
          bir kelecek bar.
        cid: 0
  - verse: 50
    segments:
      - text: >
          Qapuları yalıñız olarğa açılğan Adn cennetleri bar.
        cid: 0
  - verse: 51
    segments:
      - text: >
          Olar kürsilerge yaslanıp qurularaq, o yerde bir çoq meyvalar ve içimlikler
          isterler.
        cid: 0
  - verse: 52
    segments:
      - text: >
          Yanlarında, zevcelerinden başqasına baqmağan, özlerine yaşdaş dülberler bardır.
        cid: 0
  - verse: 53
    segments:
      - text: >
          İşte, esap künü içün sizge vade olunğan şeyler bulardır.
        cid: 0
  - verse: 54
    segments:
      - text: >
          Şübesiz, bu, bizim bergen rızqımızdır. Oña bitmek ve tükenmek yoqtır.
        cid: 0
  - verse: 55
    segments:
      - text: >
          Bu, böyle; amma yoldan azğanlarğa fena bir kelecek bar.
        cid: 0
  - verse: 56
    segments:
      - text: >
          Olar ceennemge kirecekler. O yer ne fena bir qaluv yeridir.
        cid: 0
  - verse: 57
    segments:
      - text: >
          İşte, bu; qaynağan suv ve irindir. Onı tatsınlar.
        cid: 0
  - verse: 58
    segments:
      - text: >
          Buña beñzegen daa türlü-türlü başqaları da bar.
        cid: 0
  - verse: 59
    segments:
      - text: >
          (İnkârcılarnıñ büyüklerine:) İşte, bu, siznen beraber ceennemge kirecek
          toplulıqtır (denilgende, büyükleri:) Olar raatlıq yüzü körmesin», derler. Olar
          mıtlaqa ateşke kirecekler.
        cid: 0
  - verse: 60
    segments:
      - text: >
          (Büyüklerge uyğanlar ise:) Yoq, asla siz raatlıq yüzü körmeñ! Onı bizim ögümizge
          siz ketirdiñiz! Ne fena bir yerdir! derler.
        cid: 0
  - verse: 61
    segments:
      - text: >
          Kene olar: Rabbimiz! Bunı bizim ögümizge kim ketirgen ise, onıñ ateşteki azabını
          eki qat arttır! derler.
        cid: 0
  - verse: 62
    segments:
      - text: >
          (İnkârcılar) derler ki: Özlerini dünyada olğanda yamanlardan sayğan
          kimselerimizni bu yerde niçün körmeymiz?
        cid: 0
  - verse: 63
    segments:
      - text: >
          Alayğa alğanlarımız olar degil edimi? Yoqsa, (bu yerdeler de) olarnı közden
          qaçırdıqmı?
        cid: 0
  - verse: 64
    segments:
      - text: >
          İşte, bu, ceennem ehliniñ davası, şübesiz bir aqiqattır. (Mekke kâfirleriniñ
          alay etken insanları - Ammar, Bilâl ve Suheyb (r.a.) kibi faqır mü'minler edi).
        cid: 0
  - verse: 65
    segments:
      - text: >
          (Resulım!) De ki: Men sadece bir tenbiyeciyim. Tek ve qahhar olğan Allahtan
          başqa bir tañrı yoqtır.
        cid: 0
  - verse: 66
    segments:
      - text: >
          Köklerniñ, yerniñ ve ekisiniñ arasında olğanlarnıñ Rabbi (olğan Allah) üstündir,
          çoq bağışlayıcıdır.
        cid: 0
  - verse: 67
    segments:
      - text: >
          De ki: Bu büyük bir haberdir. Amma, siz ondan yüz çevirmektesiñiz.
        cid: 0
  - verse: 68
    segments:
      - text: >
          [67 ayetine baq.]
        cid: 0
  - verse: 69
    segments:
      - text: >
          Olar o yerde davalaşqanda, menim mele-i a'lâa aqqında iç bir bilgim yoq edi.
          (Tefsirlerge köre, mele-i a'lâanıñ manası - Allahnıñ qonuşmaq içün meleklerni
          toplağan yüce meclisidir).
        cid: 0
  - verse: 70
    segments:
      - text: >
          Men ancaq ap-açıq bir tenbiyeci olğanım içün, maña vahiy olunmaqta.
        cid: 0
  - verse: 71
    segments:
      - text: >
          Rabbiñ meleklerge degen edi ki: Men muaqqaq çamurdan bir insan yaratacam.
        cid: 0
  - verse: 72
    segments:
      - text: >
          Onı tamamlap, içine de ruhumdan üflegen zamanımda, der'al oña secedege qapanıñ!
        cid: 0
  - verse: 73
    segments:
      - text: >
          Bütün melekler toptan secde ettiler.
        cid: 0
  - verse: 74
    segments:
      - text: >
          Yalıñız İblis secde etmedi. O büyüklik tasladı ve kâfirlerden oldı.
        cid: 0
  - verse: 75
    segments:
      - text: >
          Allah: Ey, İblis! Eki elimnen yaratqanıma secde etüvden seni men etken nedir?
          Kibrlendiñmi, yoqsa, yücelerdensiñmi? dedi.
        cid: 0
  - verse: 76
    segments:
      - text: >
          İblis: Men ondan hayırlıyım! Meni ateşten yarattıñ, onı çamurdan yarattıñ, dedi.
        cid: 0
  - verse: 77
    segments:
      - text: >
          Allah: Çıq o yerden (cennetten)! Sen artıq quvulğan birisisiñ, ceza kününe qadar
          lânetim seniñ üzeriñdedir! buyurdı.
        cid: 0
  - verse: 78
    segments:
      - text: >
          [77 ayetine baq.]
        cid: 0
  - verse: 79
    segments:
      - text: >
          İblis: Ey, Rabbim! O alda, tekrar tiriltilecek künlerine qadar maña muhlet ber,
          dedi.
        cid: 0
  - verse: 80
    segments:
      - text: >
