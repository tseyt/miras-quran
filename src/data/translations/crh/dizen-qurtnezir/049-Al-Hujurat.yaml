      - text: >-
          (Rivayetke köre, Az. Peyğamber, Velid b. Uqbeni Beni Mustaliq qabilesine zekât
          memurı olaraq yollağan edi: Velid, olarnen aralarında evelden olğan bir husumetten
          tolayı, qorquğa qapılğan, yoldan qaytqan, bunıñ üstüne Az. Peyğamberge kelip,
          olarnıñ dinden çıqıp, zekât bermegenlerini bildirgen. Bunıñ üzerine, Az. Peyğamber
          olarğa öpkelengen, cenkleşüvni bile qararlaştırğan, aynı vaqıtta Halid b. Velidni
          de, vaziyetni teşkermege yollağan edi. Halid, teşkerüvleri soñunda, Beni Mustaliqniñ
          ezan oqup, namaz qılğanlarını ve zekâtlarını da teslim etkenlerini Az. Peyğamberge
          bildirgen edi. Ayetniñ nazil oluv sebebi, bu vaqia olğanı çeşit rivayetlerde
          aytıla).
        cid: 0
