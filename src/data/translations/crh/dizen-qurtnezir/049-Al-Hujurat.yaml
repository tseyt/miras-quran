      - text: >-
          (Resullahnıñ uzurında yüksek sesnen laf etmek yasaqlanğan. Bundan maqsat - Az.
          Peyğamberniñ uzurında munasebetsiz bağırıp-çağırmaqnıñ ve sesni yükseltmekniñ ögüni
          almaqtır. Sahabeden Saabit b. Qaysnıñ vaziyeti ayetniñ manasına açıqlıq bermekte.
          Böyle ki: Bu zat, ayet engeninen, yüksek sesli olğanından, Az. Peyğamberniñ uzurında
          qonuşsa, ameliniñ boşuna ketecegi qorqusınen, huzur-ı risaletke ketmemege başlağan.
          Az. Peyğamber onı çağırtıp, teselli bergen, oña hayır haberi ve cennet müjdelegen).
        cid: 0
