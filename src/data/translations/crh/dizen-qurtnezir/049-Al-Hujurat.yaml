surah_id: 49
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >-
          Ey, iman etkenler! Allaһnıñ ve Resulınıñ ogüne keçmeñ. Allaһtan qorquñ.
          Şubesiz, Allaһ eşiticidir, bilicidir. (Ayette bildirilgen, ogüne keçmemek
          hususı, söylegen söz, yapılğan iş ve çıqarılğan ukümlerde, Az. Peyğamberge ters
          areket etmemek, edebini qorçalamaq ve oña uymaq şeklinde yorumalanğan).
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Ey, iman etkenler! Sesleriñizni Peyğamberniñ sesinden yukseltmeñ. Birbiriñizge
          bagırğanıñız kibi, Peyğamberge yuksek sesnen bağırmañ. Yoqsa, siz farqına
          barmadan, amelleriñiz boşuna kete berir. (Resullahnıñ uzurında yuksek sesnen laf
          etmek yasaqlanğan. Bundan maqsat - Az. Peyğamberniñ uzurında munasebetsiz
          bağırıp-çağırmaqnıñ ve sesni yukseltmekniñ ogüni almaqtır. Sahabeden Saabit b.
          Qaysnıñ vaziyeti ayetniñ manasına açıqlıq bermekte. Boyle ki: Bu zat, ayet
          engeninen, yuksek sesli olğanından, Az. Peyğamberniñ uzurında qonuşsa, ameliniñ
          boşuna ketecegi qorqusınen, huzur-ı risaletke ketmemege başlağan. Az. Peyğamber
          onı çağırtıp, teselli bergen, oña hayır haberi ve cennet mujdelegen).
        cid: 0
  - verse: 3
    segments:
      - text: >-
          Allaһ elçisiniñ uzurında seslerini qısqanlar, şubesiz Allaһ qalplerini taqva
          ile imtian etken kimselerdir. Olarğa mağfiret ve buyuk bir mukâfat bar.
        cid: 0
  - verse: 4
    segments:
      - text: >-
          (Resulım!) Saña odalarnıñ art tarafından bağırğanlarnıñ çoqu aqılı yetmegen
          kimselerdendir. (Rivayetke kore, Uyeyne b. Hısm ile Aqra’ b. Habis, Temim
          oğullarından yetmiş adamlıq bir eyetnen, uyle vaqtı Allaһnıñ elçisine kelgenler.
          Resulullaһ odasında yuqlay eken. «Ya Muһammed! Tışqa çıq, yanımızğa kel!», diye
          bağırğanlar. Ayet bu türlü areketniñ uyğunsızlığına diqqat çekmete).
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Eger olar, sen yanlarına çıqqanğa qadar sabır etseler edi, elbette ozleri içün
          daa yahşı olur edi. Allaһ çoq bağışlayıcı, çoq merhametlidir.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Ey, iman etkenler! Eger fasıq sizge bir haber ketirse, onıñ doğrulıgını
          araştırıñ. Yoqsa, bilmeden, bir toplulıqqa yamanlıq etersiniz de, soñunda
          yapqanıñızğa peşman olursıñız. (Rivayetke kore, Az. Peyğamber, Velid b. Uqbeni
          Beni Mustaliq qabilesine zekât memurı olaraq yollağan edi: Velid, olarnen
          aralarında evelden olğan bir husumetten tolayı, qorquğa qapılğan, yoldan
          qaytqan, bunıñ ustüne Az. Peyğamberge kelip, olarnıñ dinden çıqıp, zekât
          bermegenlerini bildirgen. Bunıñ uzerine, Az. Peyğamber olarğa opkelengen,
          cenkleşüvni bile qararlaştırğan, aynı vaqıtta Halid b. Velidni de, vaziyetni
          teşkermege yollağan edi. Halid, teşkerüvleri soñunda, Beni Mustaliqniñ ezan
          oqup, namaz qılğanlarını ve zekâtlarını da teslim etkenlerini Az. Peyğamberge
          bildirgen edi. Ayetniñ nazil oluv sebebi, bu vaqia olğanı çeşit rivayetlerde
          aytıla).
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Em biliñ ki, aranızda Allaһnıñ elçisi bar. Eger o bir çoq işlerde sizge uysa
          edi, sıqıntığa tüşer ediñiz. Faqat Allaһ sizge imannı sevdirgen ve onı
          goñyulleriñizge siñdirgen. Kufürni, fasıqlıqnı ve isyannı da sizge çirkin
          kosterir. İşte, doğru yolda olğanlar bulardır.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Bu, Allaһtan bir lütf ve nimettir. Allaһ alimdir, hakimdir.
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Eger mu’minlerden eki top bir-birilerinen qavğa etseler, aralarını tüzeltiñ.
          Eger biri o birine bastırsa, Allaһnıñ emrine döngenge kaadar, bastırğan tarafnen
          cenkleşiñ. Eger dönse, artıq aralarını adaletnen tüzeltiñ ve (er işte) adaletli
          areket etiñ. Şubesiz ki, Allaһ adil davranğanlarnı sever.
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Mu’minler ancaq qardaştırlar. Oyle ise, qardaşlarıñıznıñ arasını tüzeltiñ ve
          Allaһtan qorquñ ki, belki merhametke nail olursıñız.
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Ey, mu’minler! Bir toplulıq başqa bir toplulıqnı alayğa almasın. Belki de olar,
          bulardan daa yahşıdırlar. Qadınlar da qadınlarnı alayğa almasınlar. Belki, olar
          bulardan daa yahşıdırlar. Oz-ozüñizni ayıplamañ, bir-biriñizni yaman lağaplarnen
          çağırmañ. İmandan soñ, fasıqlıq ne yaman bir isimdir! Kim de tövbe etmese, işte
          olar zalımlardır. (Erkeklerniñ ve qadınlarnıñ bir-birilerinen alay etmemeleri,
          bir-birilerini ayıplamamaları ve yaman lağap taqmamaları istenilmekte, bularnı
          yapmaqnıñ yoldan çıqmaq manasında olğan fasıqlıq ekeni hatırlatıla).
        cid: 0
  - verse: 12
    segments:
      - text: >-
          Ey, iman etkenler! Zan etüvniñ ziyadesinden qaçınıñ. Çünki, zannıñ bir qısmı
          gunahtır. Bir-biriñizniñ qusurını qıdırmañ. Biriñiz digeriñizniñ artından
          emiş-demiş yapmasın. Bir kimse, olgen qardaşınıñ etini aşamaqtan oşlanırmı?
          İşte, bundan cirendiñiz. O alda, Allaһtan qorquñ. Şubesiz, Allaһ tövbeni çoq
          qabul eticidir, çoq merhametlidir. (Zan etüvden qaçınuvımız, qusur araştırıp,
          ayıplarnı qıdırmamamız ve ğıybet etmememiz istenilgen. Oşeklengengen kimsede,
          añılğan qusur olsa bile, bunıñ añlatıluvı caiz olmağanı Az. Peyğamber tarafından
          bildirilgen).
        cid: 0
  - verse: 13
    segments:
      - text: >-
          Ey, insanlar! Doğrusı, biz sizni bir erkeknen bir qadından yarattıq. Ve
          birbiriñiznen tanışuvıñız içün, sizni qavmlarğa ve qabilelerge ayırdıq. Muaqqaq
          ki, Allaһ yanında eñ degerliñiz, Ondan eñ çoq qorqqanıñızdır. Şubesiz, Allaһ
          bilicidir, er şeyden haberdardır. (Az. Adem ve Avadan çoqlaşqan insanlar, yer
          yuzünde çeşit renk ve tilde buyuk-kuçük toplulıqlar teşkil etkenler. Kuçükten
          buyukke, qabileden milletlerge barğanğa qadar farqlılıq kostergen bu esas
          sebepniñ kutleler bir-birini tanıp, añlaşmaq ve yaqınlaşmaq olğanı beyan etile.
          Yani soy-sopnen maqtanmaq yerine, birleşip-butünleşmek doğru sayılğan).
        cid: 0
  - verse: 14
    segments:
      - text: >-
          Bedeviyler «İnandıq» dediler. De ki: Siz iman etmediñiz, amma «Boyun egdik»,
          deñ. İman daa qalpleriñizge yerleşmedi. Eger Allaһqa ve elçisine itaat etseñiz,
          Allaһ işleriñizden iç bir şeyni eksiltmez. Çünki, Allaһ çoq bağışlayıcı, çoq
          merhametlidir. (Esed oğullarından bir toplulıq bir qıtlıq senesinde Medinege
          kelerek, iman etkenlerini söylegenler. Ve Az. Peyğamberge: «Saña yuklerimiz ve
          ailelerimiznen keldik. Sennen felân qabile kibi cenkleşmedik», degenler, sadaqa
          istegenler. Ayet olarnıñ bu vaziyetini talil eterek, olarnıñ qalpten tasdiq
          etmegenlerini, sadece tilden teslimiyetlerini ifade etmekte).
        cid: 0
  - verse: 15
    segments:
      - text: >-
          Mu’minler ancaq Allaһqa ve Resulına iman etken, ondan soñ asla şubege tüşmegen,
          Allaһ yolunda mallarınen ve canlarınen cenkleşkenlerdir. İşte, doğrular ancaq
          olardır.
        cid: 0
  - verse: 16
    segments:
      - text: >-
          De ki: Siz diniñizni Allaһqa ogretmektesiñizmi? Albuki, Allaһ koklerde
          olğanlarnı da bilir, yerde olğanlarnı da. Allaһ er şeyni haqqı ile bilicidir.
        cid: 0
  - verse: 17
    segments:
      - text: >-
          Olar İslâmğa kirgenleri içün, seni minnet altına soqmatalar. De ki:
          Musulmanlığıñıznı menim kozüme türtmeñ. Eger doğru kimseler iseñiz, bilesiñiz
          ki, sizni imanğa iriştirgeni içün, aslı Allaһ sizge lütfte bulunğandır.
        cid: 0
  - verse: 18
    segments:
      - text: >-
          Şubesiz, Allaһ koklerniñ ve yerniñ gizliliklerini bilir. Allaһ yapqanlarıñıznı
          korücidir.
        cid: 0