surah_id: 56
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "Qıyamet qopqan vaqıt,"
        cid: 0
  - verse: 2
    segments:
      - text: "Ki, onıñ oluvını yalanlaycaq iç bir kimse yoktır;"
        cid: 0
  - verse: 3
    segments:
      - text: "O, alçaltıcı, yukselticidir."
        cid: 0
  - verse: 4
    segments:
      - text: "Yer şiddetli sarsılğan,"
        cid: 0
  - verse: 5
    segments:
      - text: "Dağlar parçalanğan,"
        cid: 0
  - verse: 6
    segments:
      - text: "Dağılıp, toz-duman alına kelgen,"
        cid: 0
  - verse: 7
    segments:
      - text: "Ve sizler de uç sınıf olğan vaqıtta,"
        cid: 0
  - verse: 8
    segments:
      - text: "Sağdakiler, ne bahtlı o sağdakiler!"
        cid: 0
  - verse: 9
    segments:
      - text: "Soldakiler, ne bahtsızdırlar olar!"
        cid: 0
  - verse: 10
    segments:
      - text: "(Hayırda) ogde olğanlar, (ecirde de) ogdedirler."
        cid: 0
  - verse: 11
    segments:
      - text: "İşte bular, naim cennetlerinde (Allaһqa) eñ yaqın olğanlardır."
        cid: 0
  - verse: 12
    segments:
      - text: "[11 ayetine baq.]"
        cid: 0
  - verse: 13
    segments:
      - text: "(Olarnıñ) çoqu evelki ummetlerden,"
        cid: 0
  - verse: 14
    segments:
      - text: "Bir azı da, soñrakilerdendir."
        cid: 0
  - verse: 15
    segments:
      - text: "Cevherlernen işlengen tahtlar uzerindedir, qarşı-qarşığa oturıp yaslanırlar. (Üqarıda keçken ayetlerde qıyamet ve ahiret ayatınıñ bir bolümi añlatılmaqta. Buña kore, ahirette insanlar uçv sınıfqa ayırılacaqlar. Bularnıñ ekisi cennetke, biri ceennemge kirecek. Cennetke kirecek «sağdakiler» - amel defterleri sağından berilecek bahtiyar mu’minler demektir. «Soldakiler» de - kitapları sollarından berilgen ve ceennemge kirecek olğan inkârcı ve gunahkâr kimselerdir. Cennetke kirecek o bir gruppanıñ adı da «ogciler»dir. Bular inanç ve amellerinen hayır yarışında ogde olğanlardır. Allaһqa eñ yaqın, ruhiy kemalatta eñ ileri seviyege irişken kimselerdir. Bularnıñ eñ maqbul toplumnı teşkil etkenleri Qur’an-ı Kerimde añlatılğan. Ayrıca, İslâmğa birinci kirgenler içün de, aynı termin qullanılır)."
        cid: 0
  - verse: 16
    segments:
      - text: "[15 ayetine baq.]"
        cid: 0
  - verse: 17
    segments:
      - text: "Çevrelerinde, (hızmet içün) olümsiz gençler dolaşır;"
        cid: 0
  - verse: 18
    segments:
      - text: "Maiin çeşmesinden toldurılğan testiler, ıbrıqlar ve qadelernen."
        cid: 0
  - verse: 19
    segments:
      - text: "Bu şaraptan ne başları ağrıtılır, ne de aqılları coydırılır."
        cid: 0
  - verse: 20
    segments:
      - text: "(Olarğa) begengen meyvalarından,"
        cid: 0
  - verse: 21
    segments:
      - text: "Canları istegen quş etlerinden,"
        cid: 0
  - verse: 22
    segments:
      - text: "Saqlı incileri kibi, iri kozlü uriylerden,"
        cid: 0
  - verse: 23
    segments:
      - text: "[22 ayetine baq.]"
        cid: 0
  - verse: 24
    segments:
      - text: "Yapqanlarına qarşılıq olaraq (berilir)."
        cid: 0
  - verse: 25
    segments:
      - text: "O yerde boş bir söz ve gunahqa soqqan bir laf eşitmezler."
        cid: 0
  - verse: 26
    segments:
      - text: "Söylenilecek yalıñız «selâm, selâm»dır. (Hayır yarışında ileri ketken reberlerniñ (saabiquunnıñ) qavuşacaq nimetlerine, yuqarıdaki ayetlerde de işaret etilgen. Bu nimetlerden biri de, asla eksilip bitmegen bir çoqraqtan aqqan ve ondan savutlar toldurılğan Maiin adlı cennet şarabıdır)."
        cid: 0
  - verse: 27
    segments:
      - text: "Sağdakiler, ne bahtlı o sağdakiler!"
        cid: 0
  - verse: 28
    segments:
      - text: "Tüzgün kiraz teregi,"
        cid: 0
  - verse: 29
    segments:
      - text: "Mevayları salqım-salqım tizilgen muz terekleri."
        cid: 0
  - verse: 30
    segments:
      - text: "Uzağan kolgeler,"
        cid: 0
  - verse: 31
    segments:
      - text: "Şırıldayaraq aqqan suvlar,"
        cid: 0
  - verse: 32
    segments:
      - text: "Tükenmegen ve yasaqlanmağan, sayısız meyvalar içindedirler."
        cid: 0
  - verse: 33
    segments:
      - text: "[32 ayetine baq.]"
        cid: 0
  - verse: 34
    segments:
      - text: "Ve qabartılğan töşekler ustündedirler."
        cid: 0
  - verse: 35
    segments:
      - text: "Aqiqaten, biz uriylerni bam-başqa biçimde yañçıq yarattıq."
        cid: 0
  - verse: 36
    segments:
      - text: "Olarnı eşlerine fedakâr ve yaşdaş bakireler qıldıq."
        cid: 0
  - verse: 37
    segments:
      - text: "[36 ayetine baq.]"
        cid: 0
  - verse: 38
    segments:
      - text: "Butün bular sağdakiler içündir."
        cid: 0
  - verse: 39
    segments:
      - text: "Bularnıñ bir çoqu evelki ummetlerdendir."
        cid: 0
  - verse: 40
    segments:
      - text: "Bir çoqu da soñrakilerdendir. (Üqarıdaki ayetlerde sağdakilerniñ cennetteki ayatları añlatılmaqta. Ayetlerniñ tefsirinde cennet ehliniñ otuz ya da otuz uçv yaşında gençler olaraq cennetke kirecekleri, uriylerniñ, doğuv adisesi olmadan, yaratılacaqları ya da dünyadaki ihtiyar qadınlarnıñ, bakire qızlar alına ketirilecekleri rivayetleri mevcuttır)."
        cid: 0
  - verse: 41
    segments:
      - text: "Soldakiler; ne yazıq o soldakilerge!"
        cid: 0
  - verse: 42
    segments:
      - text: "İçlerini yaqqan bir ateş ve qaynağan suv içinde,"
        cid: 0
  - verse: 43
    segments:
      - text: "Serin ve hoş olmağan qap-qara dumandan bir kolge altındadırlar;"
        cid: 0
  - verse: 44
    segments:
      - text: "[43 ayetine baq.]"
        cid: 0
  - verse: 45
    segments:
      - text: "Çünki, olar bundan evel varlıq içinde sefağa dalğan ediler."
        cid: 0
  - verse: 46
    segments:
      - text: "Buyuk gunahnı işlemekte tirelip tura ediler."
        cid: 0
  - verse: 47
    segments:
      - text: "Ve dey ediler ki: Biz olgenden, topraq ve kemik obası alına kelgenden soñ, biz bir daa tirilecekmizmi?"
        cid: 0
  - verse: 48
    segments:
      - text: "Evelki atalarımız da mı?"
        cid: 0
  - verse: 49
    segments:
      - text: "De ki: Em evelkiler, em de soñrakiler."
        cid: 0
  - verse: 50
    segments:
      - text: "Belli bir kunniñ belli vaqtında, mıtlaqa toplanacaqlar."
        cid: 0
  - verse: 51
    segments:
      - text: "Soñ siz, ey, sapıqlar, yalancılar!"
        cid: 0
  - verse: 52
    segments:
      - text: "Elbette, bir terekten, zaqqum tereginden aşaycaqsıñız."
        cid: 0
  - verse: 53
    segments:
      - text: "Qarınlarıñıznı ondan tolduracaqsıñız."
        cid: 0
  - verse: 54
    segments:
      - text: "Ustüne de, qaynap turğan suvdan içeceksiñiz."
        cid: 0
  - verse: 55
    segments:
      - text: "Suvsağan develerniñ suvğa urulğanları kibi içeceksiñiz."
        cid: 0
  - verse: 56
    segments:
      - text: "İşte, ceza kunünde olarğa teklif etilecek ziyafet budır!"
        cid: 0
  - verse: 57
    segments:
      - text: "Sizni biz yarattıq. Tasdiq etüviñiz kerekmezmi?"
        cid: 0
  - verse: 58
    segments:
      - text: "Söyleñiz oyle ise, (rahimlerge) tökken nutfeleriñiz nedir?"
        cid: 0
  - verse: 59
    segments:
      - text: "Onı siz yaratmaqatsıñızmı? Yoqsa, yaratqan bizmi?"
        cid: 0
  - verse: 60
    segments:
      - text: "Arañızda olümni taqdir etken bizmiz. Ve biz ogüne keçile bileceklerden degilmiz."
        cid: 0
  - verse: 61
    segments:
      - text: "Boylece, siziñ yeriñizge, sizge beñzegenlerni, ketireyik ve sizni bilmegen bir alemiñizde tekrar bar eteyik, diye (olümni taqdir ettik)."
        cid: 0
  - verse: 62
    segments:
      - text: "Ant olsun, ilk yaratılışnı bildiñiz. Tüşünip, ibret aluvıñız kerekmezmi?"
        cid: 0
  - verse: 63
    segments:
      - text: "Şimdi maña saçqanıñıznı haber beriñiz."
        cid: 0
  - verse: 64
    segments:
      - text: "Onı siz çıqarmaktasıñızmı, yoqsa, çıqarğan bizmi?"
        cid: 0
  - verse: 65
    segments:
      - text: "İstese edik, onı quru bir çöp yapar edik de, şaşar qalır ediñiz."
        cid: 0
  - verse: 66
    segments:
      - text: "«Doğrusı, borc astına kirdik."
        cid: 0
  - verse: 67
    segments:
      - text: "Daa doğrusı, biz yoqsul qaldıq» (der ediñiz)."
        cid: 0
  - verse: 68
    segments:
      - text: "Ya içken suvuñızğa ne dersiñiz?"
        cid: 0
  - verse: 69
    segments:
      - text: "Buluttan onı siz endirdiñizmi, yoqsa, endirgen bizmi?"
        cid: 0
  - verse: 70
    segments:
      - text: "İstese edik, onı tuzlı yapar edik. Şukür etüviñiz kerekmezmi?"
        cid: 0
  - verse: 71
    segments:
      - text: "Söyleñiz şimdi maña, tutaştırmaqta olğan ateşiñizni,"
        cid: 0
  - verse: 72
    segments:
      - text: "Onıñ ağaçını siz yarattıñızmı, yoqsa, yaratqan bizmi?"
        cid: 0
  - verse: 73
    segments:
      - text: "Biz onı bir ibret ve çölden kelip-keçkenlerniñ faydalanuvı içün yarattıq."
        cid: 0
  - verse: 74
    segments:
      - text: "Oyle ise, ulu Rabbiñniñ adını tesbih et. (Üqarıdaki ayetlerde soldakilerniñ ceennemdeki ayatı añlatılır eken, inkârcılıqtaki saçmalıq, delillernen çürütilgendir. Meselâ, yaratqannıñ tiriltmege de kuçü yetecegi, mıtlaqa qabul etilüvi kerek olğan eñ tabiiy aldır. Nutfeden yaratıluv, olümniñ taqdiri, saçılğanlarnıñ çıqarıluvı, yağmurnıñ yağdırıluvı ilâhiy qudretniñ belli delilleridir. Ayrıca, eki yeşil terekniñ bir-birine ışqalanuvınen asıl olğan ateş de, ibret misallerinden biri sayılğan)."
        cid: 0
  - verse: 75
    segments:
      - text: "Yoq! Yıldızlarnıñ yerlerine yemin eterim ki, (Bugunki kunde bilim araştıruvları neticesinde bu ayette semadaki «qara delikler»ge işaret etilgeni yorumlanmaqta)."
        cid: 0
  - verse: 76
    segments:
      - text: "Bilir iseñiz, aqiqaten bu, buyuk bir yemindir."
        cid: 0
  - verse: 77
    segments:
      - text: "Şubesiz, bu, muafaza etilgen bir kitapta bulunğan degerli bir Qur’andır."
        cid: 0
  - verse: 78
    segments:
      - text: "[77 ayetine baq.]"
        cid: 0
  - verse: 79
    segments:
      - text: "Oña, ancaq temizlengenler toquna bilir. (Ayette keçken kitapnıñ elimizdeki mushaf ya da levh-i mahfezdaki aslı olğanı söylengen. Mushaf olğanı yolundaki yorumğa kore, Kur’annıñ abdestsiz elge alınmaycağına uküm etilgen. Qur’an abdestsiz tutulmaz, faqat ezberden oqula bilir. Cünüp kimse ise, Qur’anğa el tiydirmegeni kibi, ezberden de oquyalmaz)."
        cid: 0
  - verse: 80
    segments:
      - text: "O, alemlerniñ Rabbinden endirilgendir."
        cid: 0
  - verse: 81
    segments:
      - text: "Şimdi siz bu sözge emiyet bermemektesiñizmi?"
        cid: 0
  - verse: 82
    segments:
      - text: "Allaһnıñ bergen rızqına nisbeten şukürni, onı yalanlamaqnen yerine ketirmektesiñizmi? (Rivayetlerge kore, muşrikler yağmurnıñ yağıvunı, şu ya da bu yıldıznıız doğuvına ve batuvına bağlağanları içün, ayet rızıqqa şukürde bulunmaq yerine, boyle bir añlayışqa sapuvnı yamanlamaqta)."
        cid: 0
  - verse: 83
    segments:
      - text: "Can boğazğa tıqılğan vaqıtta,"
        cid: 0
  - verse: 84
    segments:
      - text: "O vaqıt siz baqar turarsıñız."
        cid: 0
  - verse: 85
    segments:
      - text: "(O anda) biz oña sizden daa yaqınmız, amma kormezsiñiz. (Can çekişken kimseniñ etrafındakiler baqıp kozeterken, Cenab-ı Haq oña ilim, qudret ve tasarrufınen daa yaqındır. Amma, insanlar bunıñ farqına barıp koralmazlar)."
        cid: 0
  - verse: 86
    segments:
      - text: "Madem ki, ceza kormeycek ekensiñiz,"
        cid: 0
  - verse: 87
    segments:
      - text: "Onı (cannı) keri qaytarıñız ya, eger iddañızda haq iseñiz!"
        cid: 0
  - verse: 88
    segments:
      - text: "Faqat (olgen adam Allaһqa) yaqın olğanlardan ise,"
        cid: 0
  - verse: 89
    segments:
      - text: "Oña raatlıq, guzel rızıq ve Naim cenneti bardır."
        cid: 0
  - verse: 90
    segments:
      - text: "Eger o sağdakilerden ise, 91. «Ey, sağdaki! Saña selâm olsun!»."
        cid: 0
  - verse: 91
    segments:
      - text: "Amma, yalanlayıcı sapıqlardan ise,"
        cid: 0
  - verse: 92
    segments:
      - text: "İşte, oña da qaynap turğan suvdan bir ziyafet bardır!"
        cid: 0
  - verse: 93
    segments:
      - text: "Ve (onıñ soñu) ceennemge atıluvdır."
        cid: 0
  - verse: 94
    segments:
      - text: "Şubesiz ki, bu kesen-kes aqiqattır."
        cid: 0
  - verse: 95
    segments:
      - text: "Oyle ise, ulu Rabbiñniñ adını tesbih ile añ."
        cid: 0