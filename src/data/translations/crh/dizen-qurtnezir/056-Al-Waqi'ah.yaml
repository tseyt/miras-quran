      - text: >-
          üzerindedir, qarşı-qarşığa oturıp yaslanırlar. (Yuqarıda keçken ayetlerde qıyamet ve
          ahiret ayatınıñ bir bölümi añlatılmaqta. Buña köre, ahirette insanlar üç sınıfqa
          ayırılacaqlar. Bularnıñ ekisi cennetke, biri ceennemge kirecek. Cennetke kirecek
          «sağdakiler» - amel defterleri sağından berilecek bahtiyar mü'minler demektir.
          «Soldakiler» de - kitapları sollarından berilgen ve ceennemge kirecek olğan inkârcı
          ve günahkâr kimselerdir. Cennetke kirecek o bir gruppanıñ adı da «ögciler»dir. Bular
          inanç ve amellerinen hayır yarışında ögde olğanlardır. Allahqa eñ yaqın, ruhiy
          kemalatta eñ ileri seviyege irişken kimselerdir. Bularnıñ eñ maqbul toplumnı teşkil
          etkenleri Qur'an-ı Kerimde añlatılğan. Ayrıca, İslâmğa birinci kirgenler içün de,
          aynı termin qullanılır).
