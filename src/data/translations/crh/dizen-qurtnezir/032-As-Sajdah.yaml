surah_id: 32
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >-
          Elif. Lâam. Miim.
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Bu Kitapnıñ, alemlerniñ Rabbi tarafından endirilgeninde asla şube yoqtır.
        cid: 0
  - verse: 3
    segments:
      - text: >-
          «Onı Peyğamber ozü uydırdı», demekteler, oylemi? Yoq! O senden evel ozlerine iç
          bir tenbiyeci (Peyğamber) kelmegen bir qavmnı tenbiyeleviñ içün -doğru yolnı
          taparlar diye- Rabbiñden yollanılğan haq (Kitap)tır.
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Koklerni, yerni ve bularnıñ arasındakilerni altı kunde (devirde) yaratqan, soñ
          Arşqa istiva etken Allaһtır. Ondan başqa ne bir dost, ne de bir şefaatçıñız
          bardır. Artıq tüşünip, ogüt almazsıñızmı? («Alt kun», «ari» ve «istiva» aqqında
          A’raaf suresiniñ 54-nci ayetindeki ve һuud suresiniñ 7-nci ayetindeki izaatlarğa
          baqıñ).
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Allaһ kokten yerge qadar er işni tertiplep idare eter. Soñra (butün bu işler)
          siziñ sayıp kelgenleriñizge kore, biñ yıl tutqan bir kunde, Onıñ qatına
          yukselir. (Bazı tefsircilerge kore, Allaһ qatında bir kun insanlarnı sayıi
          kelgenlerinen ne qadar bir muddetke musaviy olğanı sabit bir husus degil; buña
          kore, Meaaric suresinde (70/4) bu muddetniñ elli biñ yıl olğanı bildirilgen.
          Bazı tefsircilerge kore ise, «biñ yıl», «elli biñ yıl» kibi ifadeler devirniñ
          uzunlığını añlatmaq içündir).
        cid: 0
  - verse: 6
    segments:
      - text: >-
          İşte, korülmegenni de, korülgenni de bilici, mutlaq ğalip ve merhamet saibi
          Odır.
        cid: 0
  - verse: 7
    segments:
      - text: >-
          O (Allaһ) ki, yaratqan er şeyni guzel yapqan ve ilk başta insannı çamurdan
          yaratqan.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Soñ, onıñ zurriyetini, zayıf bir suvnıñ ozünden çoqlaştırğan.
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Soñ, onı tamamlap şekillendirgen, oña oz ruhundan uflegen. Ve siz içün
          qulaqlar, kozler, yurekler yaratqan. Ne qadar az şukür etmektesiñiz!
        cid: 0
  - verse: 10
    segments:
      - text: >-
          «Topraq içinde ğayıp olğan vaqtımızda, aqiqaten (o zaman) biz yañıdan
          yaratılacaqmızmı?», derler. Doğrusı, olar Rabblerine qavuşmaqnı inkâr
          etmekteler.
        cid: 0
  - verse: 11
    segments:
      - text: >-
          De ki: Sizge vekil etilgen (bu meselede vazifedar olğan) olüm melegi canıñıznı
          alacaq, soñ Rabbiñizge döndürileceksiñiz.
        cid: 0
  - verse: 12
    segments:
      - text: >-
          O gunahkârlarnıñ, Rabbleri uzurında başlarını ogge egecekleri, «Rabbimiz!
          Kordik, eşittik, şimdi bizni (dünyağa) keri yolla da, yahşı işler yapayıq, artıq
          kesen-kes olaraq inandıq”, deycek zamanlarını bir korseñ!
        cid: 0
  - verse: 13
    segments:
      - text: >-
          Biz istesek, elbette er keske hidayetini berir edik. Faqat «Ceennemni em
          cinlerden, em insanlardan bir qısmınen tolduracam», diye menden kesen-kes söz
          çıqqandır. (Allaһ Taalâ insanlarnı ve cinlerni cebirnen cennetke ya da ceennemge
          yeteklese edi, qulnı urriyeti ve iradesiniñ, bularğa bağl imtianını manası olmaz
          edi. Mukellefler, oz iradelerinen hidayet ve cennet, yahut dalâlet ve ceennem
          yolunı seçecekler).
        cid: 0
  - verse: 14
    segments:
      - text: >-
          (O kunü olarğa boyle deycekmiz:) Bu kunge qavuşmaqnı unutuvıñznıñ cezasını
          şimdi tatıñ baqayıq! Doğrusı, biz de sizni unuttıq; yapqanlarıñızdan otrü,
          ebediy azapnı tatıñ!
        cid: 0
  - verse: 15
    segments:
      - text: >-
          Bizim ayetlerimizge ancaq o kimseler inanırlar ki, bularnen ozlerine ogüt
          berilgende, buyuklik taslamadan, secedege qapanırlar ve Rabblerini hamd ile
          tesbih eterler. (Bu ayet secde ayetidir. Bu mevzuda Ebu Hureyre (r.a.) rivayet
          etken bir hadis-i şerifniñ manası boyle: İnsan oğlu secde (ayetini) oqup, secde
          etken vaqtında, şeytan ağlayaraq çekilir ve «Ey-vahlar olsun! Adem oğlu secde
          ile emir olundı, secde etti ve cennetni qazandı; men ise, secde emir etilgeninen
          tireldim ve soñum ateş oldıl», der).
        cid: 0
  - verse: 16
    segments:
      - text: >-
          Qorkunen ve umütnen Rabblerine yalvarmaq uzre (ibadet etkenleri içün),
          vucutları töşeklerden uzaq qalır ve ozlerine bergen rızqımızdan Allaһ yolunda
          arclarlar.
        cid: 0
  - verse: 17
    segments:
      - text: >-
          Yapqanlarına qarşılıq olaraq, olar içün ne bahtlılıqlar saqlanğanını iç kimse
          bilalmaz. (Allaһnıñ sevgili qullarına azırlağan cennet nimetleriniñ dünya
          olçülerinen tarif etilalmazlığı, bu ayette çoq esasl bir şekilde bildirilgen. Bu
          nimetlerni dünya ayatınıñ nimetleri kibi ifade etken sözler, esasen bizim
          añlayışımızğa hitap ete bilmek içündir. Bunıñ kibi, Az. Peyğamber (s.a.),
          Cenab-ı Allaһ tarafından, sevgili qulları içün iç bir koz kormegen, iç bir qulaq
          eşitmegen ve iç bir insannıñ aqlına kelmegen nimetler azırlanğanını ifade
          etken).
        cid: 0
  - verse: 18
    segments:
      - text: >-
          Oyle ya, mu’min olğan, yoldan çıqqan kimse kibimi? Bular - elbette bir
          olamazlar.
        cid: 0
  - verse: 19
    segments:
      - text: >-
          İman etip de, yahşı işler yapqanlarğa kelgende, olar içün yapqanlarına qarşılıq
          olaraq, barıp qalacaq cennet qonaqları bar.
        cid: 0
  - verse: 20
    segments:
      - text: >-
          Yoldan çıqqanlar ise, olarnıñ baracaq yerleri ateştir. O yerden er çıqmaq
          istegenlerinde, keri qaytarılırlar ve olarğa: Yalandır dep turğanıñız ceennem
          azabını tatıñ! denilir.
        cid: 0
  - verse: 21
    segments:
      - text: >-
          Eñ buyuk azaptan evel, olarğa mıtlaqa eñ yaqın azaptan tattıracaqmız; belki
          (imanğa) dönerler. (Eñ buyuk azap «ahiret azabı» şeklinde, yaqın azap ise,
          dünyadaki qıtlıq, esaret ve oña beñzegen sıqıntılar şeklinde tefsir etilmekte).
        cid: 0
  - verse: 22
    segments:
      - text: >-
          Ozüne Rabbiniñ ayetleri hatırlatılğandan soñ, olardan yuz çevirgenden daa kim
          zalım ola bilir! Muaqqaq ki, biz gunahkârlarğa lâyıq cazalarını berirmiz.
        cid: 0
  - verse: 23
    segments:
      - text: >-
          Ant olsun, biz Musağa Kitap berdik -(«Resulım!) Sen oña qavuşacağıñdan şube
          etme- ve onı İsrail oğullarına hidayet reberi yaptıq). (Bu manağa kore, Az.
          Peyğamberniñ Mirac gecesinde Az. Musanen korüşecegine işaret bar. Ayrıca, «Saqın
          Musanıñ Kitapqa qavuşuvı, Kitapnı aluvı aqqında şubege tüşme» ve «saqın sen oña,
          yani Kitapqa qavuşacağıñdan şubege tüşme!» manaları da berilerek; ozünden evel,
          iç şubesiz Az. Musağa da Kitap berilgeni ya da Az. Musağa berilgeni kibi, oña da
          Kitap berileceginde şube etmemesi mevzusından Resulullaһqa hitap etilgeni
          yorumlanğan).
        cid: 0
  - verse: 24
    segments:
      - text: >-
          Sabır etken ve ayetlerimizge kesen-kes inanğan vaqıtlarında, olarnıñ arasından
          emirlerimiznen doğru yolğa qavuştırğan reberler tayin etken edik.
        cid: 0
  - verse: 25
    segments:
      - text: >-
          Muaqqaq ki, Rabbiñ ihtilaf etmekte olğan şeyleri aqqında qıyamet kunü olarnıñ
          aralarında uküm etecek.
        cid: 0
  - verse: 26
    segments:
      - text: >-
          Alâ yurtlarında kezip dolaşqanları ozlerinden evelki nice nesillerni elâk
          etüvimiz olarnı doğru yolğa yeteklemedimi? Bularda, elbette ibretler bar. Alâ
          qulaq asmaylarmı?
        cid: 0
  - verse: 27
    segments:
      - text: >-
          Qup-quru yerlerge suvnı yetiştirgenimizni, onıñnen ister ayvanlarınıñ, ister
          ozleriniñ aşap kelgen ekinlerini çıqarmaqta olğanımıznı da kormedilermi? Alâ daa
          koralmaycaqlarmı?
        cid: 0
  - verse: 28
    segments:
      - text: >-
          Eger doğru söyley iseñiz, bu fetih (ve uküm) kunü qana, ne zaman? derler.
        cid: 0
  - verse: 29
    segments:
      - text: >-
          De ki: Fetih (ve uküm) kunünde inkârcılarğa (o kunü etken) imanları fayda
          bermeycek ve ozlerine muhlet de tanılmaycaq!
        cid: 0
  - verse: 30
    segments:
      - text: >-
          Artıq sen olarnı bıraq ve bekle. Zaten, olar da beklemekteler. (Tefsirlerde
          ayette kâfirlerniñ de Az. Peyğamberniñ olüvini ya da oldürilüvini beklegenlerine
          işaret etilgeni bildirilmekte).
        cid: 0