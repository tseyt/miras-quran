surah_id: 32
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >
          Elif. Lâam. Miim.
        cid: 0
  - verse: 2
    segments:
      - text: >
          Bu Kitapnıñ, alemlerniñ Rabbi tarafından endirilgeninde asla şübe yoqtır.
        cid: 0
  - verse: 3
    segments:
      - text: >
          «Onı Peyğamber özü uydırdı», demekteler, öylemi? Yoq! O senden evel özlerine iç
          bir tenbiyeci (Peyğamber) kelmegen bir qavmnı tenbiyeleviñ içün -doğru yolnı
          taparlar diye- Rabbiñden yollanılğan haq (Kitap)tır.
        cid: 0
  - verse: 4
    segments:
      - text: >
          Köklerni, yerni ve bularnıñ arasındakilerni altı künde (devirde) yaratqan, soñ
          Arşqa istiva etken Allahtır. Ondan başqa ne bir dost, ne de bir şefaatçıñız
          bardır. Artıq tüşünip, ögüt almazsıñızmı? («Altı kün», «arş» ve «istiva» aqqında
          A'raaf suresiniñ 54-nci ayetindeki ve huud suresiniñ 7-nci ayetindeki izaatlarğa
          baqıñ).
        cid: 0
  - verse: 5
    segments:
      - text: >
          Allah kökten yerge qadar er işni tertiplep idare eter. Soñra (bütün bu işler)
          siziñ sayıp kelgenleriñizge köre, biñ yıl tutqan bir künde, Onıñ qatına
          yükselir. (Bazı tefsircilerge köre, Allah qatında bir kün insanlarnıñ sayıp
          kelgenlerinen ne qadar bir müddetke musaviy olğanı sabit bir husus degil; buña
          köre, Meaaric suresinde (70/4) bu müddetniñ elli biñ yıl olğanı bildirilgen.
          Bazı tefsircilerge köre ise, «biñ yıl», «elli biñ yıl» kibi ifadeler devirniñ
          uzunlığını añlatmaq içündir).
        cid: 0
  - verse: 6
    segments:
      - text: >
          İşte, körülmegenni de, körülgenni de bilici, mutlaq ğalip ve merhamet saibi
          Odır.
        cid: 0
  - verse: 7
    segments:
      - text: >
          O (Allah) ki, yaratqan er şeyni güzel yapqan ve ilk başta insannı çamurdan
          yaratqan.
        cid: 0
  - verse: 8
    segments:
      - text: >
          Soñ, onıñ zurriyetini, zayıf bir suvnıñ özünden çoqlaştırğan.
        cid: 0
  - verse: 9
    segments:
      - text: >
          Soñ, onı tamamlap şekillendirgen, oña öz ruhundan üflegen. Ve siz içün qulaqlar,
          közler, yürekler yaratqan. Ne qadar az şükür etmektesiñiz!
        cid: 0
  - verse: 10
    segments:
      - text: >
          «Topraq içinde ğayıp olğan vaqtımızda, aqiqaten (o zaman) biz yañıdan
          yaratılacaqmızmı?», derler. Doğrusı, olar Rabblerine qavuşmaqnı inkâr
          etmekteler.
        cid: 0
  - verse: 11
    segments:
      - text: >
          De ki: Sizge vekil etilgen (bu meselede vazifedar olğan) ölüm melegi canıñıznı
          alacaq, soñ Rabbiñizge döndürileceksiñiz.
        cid: 0
  - verse: 12
    segments:
      - text: >
          O günahkârlarnıñ, Rabbleri uzurında başlarını ögge egecekleri, «Rabbimiz!
          Kördik, eşittik, şimdi bizni (dünyağa) keri yolla da, yahşı işler yapayıq, artıq
          kesen-kes olaraq inandıq", deycek zamanlarını bir körseñ!
        cid: 0
  - verse: 13
    segments:
      - text: >
          Biz istesek, elbette er keske hidayetini berir edik. Faqat «Ceennemni em
          cinlerden, em insanlardan bir qısmınen tolduracam», diye menden kesen-kes söz
          çıqqandır. (Allah Taalâ insanlarnı ve cinlerni cebirnen cennetke ya da ceennemge
          yeteklese edi, qulnıñ ürriyeti ve iradesiniñ, bularğa bağlı imtianınıñ manası
          olmaz edi. Mükellefler, öz iradelerinen hidayet ve cennet, yahut dalâlet ve
          ceennem yolunı seçecekler).
        cid: 0
  - verse: 14
    segments:
      - text: >
          (O künü olarğa böyle deycekmiz:) Bu künge qavuşmaqnı unutuvıñznıñ cezasını şimdi
          tatıñ baqayıq! Doğrusı, biz de sizni unuttıq; yapqanlarıñızdan ötrü, ebediy
          azapnı tatıñ!
        cid: 0
  - verse: 15
    segments:
      - text: >
          Bizim ayetlerimizge ancaq o kimseler inanırlar ki, bularnen özlerine ögüt
          berilgende, büyüklik taslamadan, secedege qapanırlar ve Rabblerini hamd ile
          tesbih eterler. (Bu ayet secde ayetidir. Bu mevzuda Ebu Hureyre (r.a.) rivayet
          etken bir hadis-i şerifniñ manası böyle: İnsan oğlu secde (ayetini) oqup, secde
          etken vaqtında, şeytan ağlayaraq çekilir ve «Ey-vahlar olsun! Adem oğlu secde
          ile emir olundı, secde etti ve cennetni qazandı; men ise, secde emir etilgeninen
          tireldim ve soñum ateş oldı», der).
        cid: 0
  - verse: 16
    segments:
      - text: >
          Qorqunen ve ümütnen Rabblerine yalvarmaq üzre (ibadet etkenleri içün), vucutları
          töşeklerden uzaq qalır ve özlerine bergen rızqımızdan Allah yolunda arclarlar.
        cid: 0
  - verse: 17
    segments:
      - text: >
          Yapqanlarına qarşılıq olaraq, olar içün ne bahtlılıqlar saqlanğanını iç kimse
          bilalmaz. (Allahnıñ sevgili qullarına azırlağan cennet nimetleriniñ dünya
          ölçülerinen tarif etilalmazlığı, bu ayette çoq esaslı bir şekilde bildirilgen.
          Bu nimetlerni dünya ayatınıñ nimetleri kibi ifade etken sözler, esasen bizim
          añlayışımızğa hitap ete bilmek içündir. Bunıñ kibi, Az. Peyğamber (s.a.),
          Cenab-ı Allah tarafından, sevgili qulları içün iç bir köz körmegen, iç bir qulaq
          eşitmegen ve iç bir insannıñ aqlına kelmegen nimetler azırlanğanını ifade
          etken).
        cid: 0
  - verse: 18
    segments:
      - text: >
          Öyle ya, mü'min olğan, yoldan çıqqan kimse kibimi? Bular - elbette bir
          olamazlar.
        cid: 0
  - verse: 19
    segments:
      - text: >
          İman etip de, yahşı işler yapqanlarğa kelgende, olar içün yapqanlarına qarşılıq
          olaraq, barıp qalacaq cennet qonaqları bar.
        cid: 0
  - verse: 20
    segments:
      - text: >
          Yoldan çıqqanlar ise, olarnıñ baracaq yerleri ateştir. O yerden er çıqmaq
          istegenlerinde, keri qaytarılırlar ve olarğa: Yalandır dep turğanıñız ceennem
          azabını tatıñ! denilir.
        cid: 0
  - verse: 21
    segments:
      - text: >
          Eñ büyük azaptan evel, olarğa mıtlaqa eñ yaqın azaptan tattıracaqmız; belki
          (imanğa) dönerler. (Eñ büyük azap «ahiret azabı» şeklinde, yaqın azap ise,
          dünyadaki qıtlıq, esaret ve oña beñzegen sıqıntılar şeklinde tefsir etilmekte).
        cid: 0
  - verse: 22
    segments:
      - text: >
          Özüne Rabbiniñ ayetleri hatırlatılğandan soñ, olardan yüz çevirgenden daa kim
          zalım ola bilir! Muaqqaq ki, biz günahkârlarğa lâyıq cazalarını berirmiz.
        cid: 0
  - verse: 23
    segments:
      - text: >
          Ant olsun, biz Musağa Kitap berdik -(«Resulım!) Sen oña qavuşacağıñdan şübe
          etme- ve onı İsrail oğullarına hidayet reberi yaptıq. (Bu manağa köre, Az.
          Peyğamberniñ Mirac gecesinde Az. Musanen körüşecegine işaret bar. Ayrıca, «Saqın
          Musanıñ Kitapqa qavuşuvı, Kitapnı aluvı aqqında şübege tüşme» ve «saqın sen oña,
          yani Kitapqa qavuşacağıñdan şübege tüşme!» manaları da berilerek; özünden evel,
          iç şübesiz Az. Musağa da Kitap berilgeni ya da Az. Musağa berilgeni kibi, oña da
          Kitap berileceginde şübe etmemesi mevzusından Resulullahqa hitap etilgeni
          yorumlanğan).
        cid: 0
  - verse: 24
    segments:
      - text: >
          Sabır etken ve ayetlerimizge kesen-kes inanğan vaqıtlarında, olarnıñ arasından
          emirlerimiznen doğru yolğa qavuştırğan reberler tayin etken edik.
        cid: 0
  - verse: 25
    segments:
      - text: >
          Muaqqaq ki, Rabbiñ ihtilaf etmekte olğan şeyleri aqqında qıyamet künü olarnıñ
          aralarında üküm etecek.
        cid: 0
  - verse: 26
    segments:
      - text: >
          Alâ yurtlarında kezip dolaşqanları özlerinden evelki nice nesillerni elâk
          etüvimiz olarnı doğru yolğa yeteklemedimi? Bularda, elbette ibretler bar. Alâ
          qulaq asmaylarmı?
        cid: 0
  - verse: 27
    segments:
      - text: >
          Qup-quru yerlerge suvnı yetiştirgenimizni, onıñnen ister ayvanlarınıñ, ister
          özleriniñ aşap kelgen ekinlerini çıqarmaqta olğanımıznı da körmedilermi? Alâ daa
          koralmaycaqlarmı?
        cid: 0
  - verse: 28
    segments:
      - text: >
          Eger doğru söyley iseñiz, bu fetih (ve üküm) künü qana, ne zaman? derler.
        cid: 0
  - verse: 29
    segments:
      - text: >
          De ki: Fetih (ve üküm) kününde inkârcılarğa (o künü etken) imanları fayda
          bermeycek ve özlerine muhlet de tanılmaycaq!
        cid: 0
  - verse: 30
    segments:
      - text: >
          Artıq sen olarnı bıraq ve bekle. Zaten, olar da beklemekteler. (Tefsirlerde
          ayette kâfirlerniñ de Az. Peyğamberniñ ölüvini ya da öldürilüvini beklegenlerine
          işaret etilgeni bildirilmekte).
        cid: 0
