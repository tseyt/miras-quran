surah_id: 112
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "De ki: O, Allaһ birdir. Allaһ sameddir. O, doğurmağan ve doğmağandır. Onıñ iç bir teñyeşi (beñzegeni) yoqtır. (Samed - iç bir şeyge muhtac olmağan, aksine er şey oña muhtacdır, demektir)."
