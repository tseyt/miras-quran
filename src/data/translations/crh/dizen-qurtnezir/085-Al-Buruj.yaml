surah_id: 85
language: crh
author: dizen-qurtnezir
verses:
  - verse: 10
    segments:
      - text: "Şubesiz, inanğan erkeklernen, inanğan qadınlarğa eskence etip, soñ tövbe de etmegenlerge ceennem azabı ve (o yerde) yanmaq cezası bardır."
        cid: 0
  - verse: 11
    segments:
      - text: "İman etip, salih ameller işlegenlerge ise, zemininden irmaqlar aqqan cennetler bardır. İşte, buyuk qurtulış budır."
        cid: 0
  - verse: 12
    segments:
      - text: "Şubesiz, Rabbiñniñ yaqalavı çoq şiddetlidir."
        cid: 0
  - verse: 13
    segments:
      - text: "Biliñ ki O, (kâinat yoq ekende) ilk olaraq yaratqan (olümden soñ tekrar ayatnı) keri ketirgendir."
        cid: 0
  - verse: 14
    segments:
      - text: "O çoq bağışlayıcı ve çoq sevicidir."
        cid: 0
  - verse: 15
    segments:
      - text: "Şerefli Arşnıñ saibidir."
        cid: 0
  - verse: 16
    segments:
      - text: "İstegen şeylerini mıtlaqa yapıcıdır."
        cid: 0
  - verse: 19
    segments:
      - text: "Doğrusı, inkârcılar (aqiqatnı) yalanlap turarlar."
        cid: 0
  - verse: 20
    segments:
      - text: "Allaһ olarnı artlarından sarıp alğandır."
        cid: 0