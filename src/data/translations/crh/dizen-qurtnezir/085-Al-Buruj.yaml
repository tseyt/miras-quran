      - text: (yalanlağanları, aslı)
        cid: 0
      - text: lehv-i mahfuzda bulunğan
        cid: 2
      - text: şerefli Qur'andır.
        cid: 4
      - text: >-
          («Ordularnıñ haberi» - evelki milletlerge kelgen peyğamberlerge qarşı küreşkenlerniñ
          facialı bir şekilde yeñilüvleridir. Bu haberlerni araplar bilmekte ediler. Buña
          rağmen, aralarından yollanılğan bir peyğamberge qarşı küreştiler. Olarnıñ soñu ne
          ise, bularnıñ da soñu odır).
        cid: 0
