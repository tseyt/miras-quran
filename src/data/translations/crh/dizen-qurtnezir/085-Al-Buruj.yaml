  - verse: 1
    segments:
      - text: Burclarğa
        cid: 3
      - text: saip kök yüzüne, kelecegi bildirilgen
        cid: 2
      - text: >-
          künge, (o künde) şaatlıq etkenge ve etilgenge ant olsun ki, ateşnen tolu endekke
          atılğanlar (yaqılıp) öldürildi. Olar (yaqqanlar) da başlarına oturğanlar,
          mü'minlerge yapayatqan eskenceni seyir ete ediler.
