surah_id: 85
language: crh
author: dizen-qurtnezir
verses:
  - verse: 10
    segments:
      - text: "Şubesiz, inanğan erkeklernen, inanğan qadınlarğa eskence etip, soñ tövbe de etmegenlerge ceennem azabı ve (o yerde) yanmaq cezası bardır."
        cid: 0
  - verse: 11
    segments:
      - text: "İman etip, salih ameller işlegenlerge ise, zemininden irmaqlar aqqan cennetler bardır. İşte, buyuk qurtulış budır."
        cid: 0
  - verse: 12
    segments:
      - text: "Şubesiz, Rabbiñniñ yaqalavı çoq şiddetlidir."
        cid: 0
  - verse: 13
    segments:
      - text: "Biliñ ki O, (kâinat yoq ekende) ilk olaraq yaratqan (olümden soñ tekrar ayatnı) keri ketirgendir."
        cid: 0
  - verse: 14
    segments:
      - text: "O çoq bağışlayıcı ve çoq sevicidir."
        cid: 0
  - verse: 15
    segments:
      - text: "Şerefli Arşnıñ saibidir."
        cid: 0
  - verse: 16
    segments:
      - text: "İstegen şeylerini mıtlaqa yapıcıdır. 17-18. Ordularnıñ, Fıravun ve Semuudnıñ (oğrağan felâketleriniñ) haberi saña keldimi?"
        cid: 0
  - verse: 19
    segments:
      - text: "Doğrusı, inkârcılar (aqiqatnı) yalanlap turarlar."
        cid: 0
  - verse: 20
    segments:
      - text: "Allaһ olarnı artlarından sarıp alğandır. 21-22. Aqiqatta o (yalanlağanları, aslı) lehv-i mahfuzda bulunğan şerefli Qur’andır. («Ordularnıñ haberi» - evelki milletlerge kelgen peyğamberlerge qarşı kureşkenlerniñ facsial bir şekilde yeñilüvleridir. Bu haberlerni araplar bilmekte ediler. Buña rağmen, aralarından yollanılğan bir peyğamberge qarşı kureştiler. Olarnıñ soñu ne ise, bularnıñ da soñu odır)."
        cid: 0
  - verse: 86
    segments:
      - text: "et-TAARİQ Beled suresinden soñ, Mekkede engen, 17 ayettir. Adını 1-nci ayette keçken «taariq» kelimesinden alğan. Taariq - geceleyin kelgen, şiddetliknen urğan, qapunı qaqqan demektir. Surede keçken taariq ise, gece ziyade nur saçqan saba yıldızıdır. Micaziy olaraq, namlı adamğa da aytılır. Bir bediiy ifade olaraq da, cahiliye devrinde kelgen Az. Peyğamber de, geceni aydınlatqan ve sabanı mujdelegen saba yıldızına beñzetilgen ola bilir. Bismilâaһirraһmaanirraһiim (Rahman ve rahim olğan Allaһnıñ adınen). 1-4. Kok yuzüne ve taariqqa (saba yıldızına) yemin eterim. Taariqnıñ ne olğanını ne yerden bileceksiñ? (O, qaranlıqnı) delici yıldızdır. İç kimse yoqtır ki, uzerinde bir qorçalayıcı, bir kozetici olmasın. 5-8. İnsan neden yaratılğanına bir baqsın! Atılğan bir suvdan yaratıldı. (O suv) sırtnen koküs qafesi arasından sıqar. İşte, Allaһ (başlanğıçta bu şekilde yarattığı) insannı tekrar yaratmağa da qadirdir. 9-10. Gizlengenlerniñ ortağa çıqqan kunde, insan içün ne bir kuç, ne de bir yardımcı bar. 11-17. Dönüş saibi olğan (yağmur yağdırğan) kokke, (osümliknen) yarılğan yerge yemin eterim ki, Qur’an (haq ile batılnı) ayırğan bir sözdir. O, asla bir şaqa degildir. Olar bir tuzaq qurarlar, men de bir tuzaq qurarım. Kâfirlerge muhlet ber, olarnı biraz oz allarına bıraq (pek yaqında saña yardımımız kelecek)."
        cid: 0
  - verse: 87
    segments:
      - text: "el-A’LYaA Allaһnıñ «üce» manadaki adınen başlanğanı içün, «el-A’lâa» denilgen bu sure 19 ayet olup, Mekkede engen ilki surelerdendir. Cenab-ı Allaһ bu surede kâinatnıñ sırlarını, yaratılışını, çalışuvını esaslı bir şekilde ifade etken. Bismilâaһirraһmaanirraһiim (Rahman ve rahim olğan Allaһnıñ adınen). 1-5. Yaratıp, tertipke qoyğan, taqdir etip, yol kostergen, (topraqtan) yeşil otnı çıqarıp, soñ onı qap-qara bir sel çöpligine çevirgen yuce Rabbiñniñ adını tesbih (ve taqdis) et. 6-7. Saña (Qur’annı) oqutacaqmız; artıq Allaһnıñ istegeni istisna, sen iç unutmaycaqsıñ. Şubesiz, Allaһ aşkârnı ve gizlini bilir. 8-9. Seni eñ qolayğa muvaffaq etecekmiz. O alda, eger ogüt fayda berse, ogüt ber. 10-13. (Allaһtan) qorqqan - ogütten faydalanacaq. Eñ buyuk ateşke kirecek fena kimse ise, ogütten qaçınır. Soñ o, ateşte ne olür, ne de yaşar. 14-15. Temizlengen, Rabbiñniñ adını añıp, Oña qullıq etken kimse, şubesiz qurtulışqa irişkendir. 16-17. Faqat siz (ey, insanlar!) ahiret daa hayırlı ve daa devamlı olğanı alda, dünya ayatını ustün kormektesiñiz. 18-19. Şubesiz, bu (añlatılğanlar), evelki kitaplarda, İbrahim ve Musanıñ kitaplarında da bardır."
        cid: 0