surah_id: 85
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >
          Burclarğa saip kök yüzüne, kelecegi bildirilgen künge, (o künde) şaatlıq etkenge
          ve etilgenge ant olsun ki, ateşnen tolu endekke atılğanlar (yaqılıp) öldürildi.
          Olar (yaqqanlar) da başlarına oturğanlar, mü'minlerge yapayatqan eskenceni seyir
          ete ediler.
        cid: 0
  - verse: 2
    segments:
      - text: >
          [1 ayetine baq.]
        cid: 0
