surah_id: 85
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >-
          Burclarğa saip kok yuzüne, kelecegi bildirilgen kunge, (o kunde) şaatlıq
          etkenge ve etilgenge ant olsun ki, ateşnen tolu endekke atılğanlar (yaqılıp)
          oldürildi. Olar (yaqqanlar) da başlarına oturğanlar, mu’minlerge yapayatqan
          eskenceni seyir ete ediler.
        cid: 0
