  - verse: 8
    segments:
      - text: >-
          Olardan yalıñız koklerniñ ve yerniñ mulkü ozüne ait olğan, aziz ve hamid
          Allaһqa iman etkenleri içün intiqam aldılar. Albuki, Allaһ er şeyni korer.
        cid: 0
  - verse: 9
    segments:
      - text: >-
          [8 ayetine baq.]
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Şubesiz, inanğan erkeklernen, inanğan qadınlarğa eskence etip, soñ tövbe de
          etmegenlerge ceennem azabı ve (o yerde) yanmaq cezası bardır.
        cid: 0
  - verse: 11
    segments:
      - text: >-
          İman etip, salih ameller işlegenlerge ise, zemininden irmaqlar aqqan cennetler
          bardır. İşte, buyuk qurtulış budır.
        cid: 0
  - verse: 12
    segments:
      - text: >-
          Şubesiz, Rabbiñniñ yaqalavı çoq şiddetlidir.
        cid: 0
  - verse: 13
    segments:
      - text: >-
          Biliñ ki O, (kâinat yoq ekende) ilk olaraq yaratqan (olümden soñ tekrar ayatnı)
          keri ketirgendir.
        cid: 0
  - verse: 14
    segments:
      - text: >-
          O çoq bağışlayıcı ve çoq sevicidir.
        cid: 0
  - verse: 15
    segments:
      - text: >-
          Şerefli Arşnıñ saibidir.
        cid: 0
  - verse: 16
    segments:
      - text: >-
          İstegen şeylerini mıtlaqa yapıcıdır.
        cid: 0
  - verse: 17
    segments:
      - text: >-
          Ordularnıñ, Fıravun ve Semuudnıñ (oğrağan felâketleriniñ) haberi saña keldimi?
        cid: 0
  - verse: 18
    segments:
      - text: >-
          [17 ayetine baq.]
        cid: 0
  - verse: 19
    segments:
      - text: >-
          Doğrusı, inkârcılar (aqiqatnı) yalanlap turarlar.
        cid: 0
  - verse: 20
    segments:
      - text: >-
          Allaһ olarnı artlarından sarıp alğandır.
        cid: 0
  - verse: 21
    segments:
      - text: >-
          Aqiqatta o (yalanlağanları, aslı) lehv-i mahfuzda bulunğan şerefli Qur’andır.
          («Ordularnıñ haberi» - evelki milletlerge kelgen peyğamberlerge qarşı
          kureşkenlerniñ facsial bir şekilde yeñilüvleridir. Bu haberlerni araplar
          bilmekte ediler. Buña rağmen, aralarından yollanılğan bir peyğamberge qarşı
          kureştiler. Olarnıñ soñu ne ise, bularnıñ da soñu odır).
        cid: 0
  - verse: 22
    segments:
      - text: >-
          [21 ayetine baq.]
        cid: 0