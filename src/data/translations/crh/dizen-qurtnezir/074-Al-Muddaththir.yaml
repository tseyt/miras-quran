surah_id: 74
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >
          Ey, örtünip bürüngen (Resulım)!
        cid: 0
  - verse: 2
    segments:
      - text: >
          Tur ve (insanlarnı) tenbiyele.
        cid: 0
  - verse: 3
    segments:
      - text: >
          Sadece Rabbiñni büyük tanı.
        cid: 0
  - verse: 4
    segments:
      - text: >
          Urbañnı ter-temiz tut.
        cid: 0
  - verse: 5
    segments:
      - text: >
          Yaman şeylerni terk et.
        cid: 0
  - verse: 6
    segments:
      - text: >
          Yapqan eyiligiñni çoq körerek, közge türtme.
        cid: 0
  - verse: 7
    segments:
      - text: >
          Rabbiñniñ rizasına irişmek içün sabır et.
        cid: 0
  - verse: 8
    segments:
      - text: >
          O Suurğa üflengen vaqıt bar ya,
        cid: 0
  - verse: 9
    segments:
      - text: >
          İşte, o kün zorlu bir kündir.
        cid: 0
  - verse: 10
    segments:
      - text: >
          Kâfirler içün (iç de) qolay degildir.
        cid: 0
  - verse: 11
    segments:
      - text: >
          Tek olaraq yaratıp, oña bol servet ve közü ögünde turğan oğullar berdigim, özü
          içün (nimetlerni ögüne) serdikçe serdigim o kimseni maña bıraq!
        cid: 0
  - verse: 12
    segments:
      - text: >
          [11 ayetine baq.]
        cid: 0
  - verse: 13
    segments:
      - text: >
          [11 ayetine baq.]
        cid: 0
  - verse: 14
    segments:
      - text: >
          [11 ayetine baq.]
        cid: 0
  - verse: 15
    segments:
      - text: >
          Bunıñ üstüne o (nimetlerimni) daa da arttıruvımnı ümüt etmekte.
        cid: 0
  - verse: 16
    segments:
      - text: >
          Asla (ümüt etmesin)! Çünki, o, bizim ayetlerimizge nisbeten tekmil inatçıdır.
        cid: 0
  - verse: 17
    segments:
      - text: >
          Men onı sarp bir yoquşqa tırmaştıracağım!
        cid: 0
  - verse: 18
    segments:
      - text: >
          Zira, o, tüşündi-taşındı, ölçedi, biçti.
        cid: 0
  - verse: 19
    segments:
      - text: >
          Canı çıqsın, ne şekilde ölçedi-biçti!
        cid: 0
  - verse: 20
    segments:
      - text: >
          Soñ canı çıqsın, tekrar (ölçedi-biçti); nasıl ölçedi-biçti ise!
        cid: 0
  - verse: 21
    segments:
      - text: >
          Soñ baqtı. Soñ qaşlarını çattı, yüzüni ekşitti. Eñ soñunda kibrini yeñalmayıp,
          arqa çevirdi de: «Bu (Qur'an) dedi, olsa-olsa (sihirbazlardan ögrenilip) naql
          etilgen bir tılsımdır. Bu, insan sözünden başqa bir şey degil». (Rivayetke köre,
          Velid b. Muğiireniñ Az. Peyğamber oquğan Qur'annı diñlegeninen, çoq
          tesirlengenini añlağan Qureyş müşrikleri «Ey, vaah! dediler, Velid dininden
          döngen. Artıq oña baqıp, bütün Qureyş dininden dönecek!». Bunıñ üzerine,
          qardaşınıñ oğlu Ebu Cehil Velidge barıp, ğururına sığmaycaq sözlernen onı
          qandırdı. Soñ birlikte müşriklerniñ yanına keldiler. Velid olarğa Az. Muhammed
          (s.a.)ge «mecnun», «kâhin», «şair» ve «yalancı» lağaplarınen hitap etüvniñ yerli
          olmaycağını añlattı; niayet, uzundan uzadiya tüşünip-taşınğan soñ:
          «Olğan-olacağı o bir sihirbazdır. Körmeysiñizmi, insannı ailesinden, evlâdından,
          hızmetkârından ayırmaqta», dedi. Müşrikler bu sözlerni çoq begendiler ve Az.
          Peyğamberge «sihirbaz» diye hitap etmege başladılar. Bu, Resul-ı Ekremge ziyade
          toqundı).
        cid: 0
  - verse: 22
    segments:
      - text: >
          [21 ayetine baq.]
        cid: 0
  - verse: 23
    segments:
      - text: >
          [21 ayetine baq.]
        cid: 0
  - verse: 24
    segments:
      - text: >
          [21 ayetine baq.]
        cid: 0
  - verse: 25
    segments:
      - text: >
          [21 ayetine baq.]
        cid: 0
  - verse: 26
    segments:
      - text: >
          Men onı seqarğa (ceennem tübine) soqacam.
        cid: 0
  - verse: 27
    segments:
      - text: >
          Sen seqar nedir bilesiñmi?
        cid: 0
  - verse: 28
    segments:
      - text: >
          Em (bütün bedenni elâk eter, iç bir şey) qaldırmaz, em (eski alğa ketirip,
          tekrar azap etüvden) vazgeçmez o.
        cid: 0
  - verse: 29
    segments:
      - text: >
          İnsannıñ terisini qavurır.
        cid: 0
  - verse: 30
    segments:
      - text: >
          Üzerinde on doquz (muhafız melek) bar.
        cid: 0
  - verse: 31
    segments:
      - text: >
          Biz ceennemniñ işlerine baqmaq ile, ancaq meleklerni vazifelendirgendirmiz.
          Olarnıñ sayısını da inkârcılar içün sadece bir imtian (vesilesi) yaptıq ki,
          böyleliknen, özlerine kitap berilgenler yahşıca ögrensin, iman etkenlerniñ
          imanını arttırsın; em özlerine kitap berilgenler, em mü'minler şübelenmesinler,
          qalplerinde hastalıq (maraz) olğanlar ve kâfirler de: «Allah bu misalnen ne
          demek istegen?», desinler. İşte, Allah böylece istegenini sapıqlıqta bıraqır,
          istegenini doğru yolğa iriştirir. Rabbiñniñ ordularını özünden başqası bilmez.
          Bu ise, insanlıq içün ancaq bir ögüttir.
        cid: 0
  - verse: 32
    segments:
      - text: >
          Yoq, yoq (ögüt almazlar). Ayğa ant olsun ki,
        cid: 0
  - verse: 33
    segments:
      - text: >
          Dönüp ketmekte olğan gecege,
        cid: 0
  - verse: 34
    segments:
      - text: >
          Ağarmaqta olğan sabağa ant olsun ki,
        cid: 0
  - verse: 35
    segments:
      - text: >
          O (ceennem), insanlıq içün, sizden ileri ketmek ya da keri qalmaq istegen
          kimseler içün, büyük tenbiyeleyici musibetlerden biridir.
        cid: 0
  - verse: 36
    segments:
      - text: >
          [35 ayetine baq.]
        cid: 0
  - verse: 37
    segments:
      - text: >
          [35 ayetine baq.]
        cid: 0
  - verse: 38
    segments:
      - text: >
          Er nefis (insan) qazanğanına nisbeten bir rehindir;
        cid: 0
  - verse: 39
    segments:
      - text: >
          Ancaq sağdakiler istisna. («Sağdakiler» aqqında baq. 56/16-nıñ manası).
        cid: 0
  - verse: 40
    segments:
      - text: >
          Olar cennetler içindedir. Günahkârlarğa: Sizni şu yaqıcı ateşke soqqan nedir?
          diye uzaqtan-uzaqqa sorarlar.
        cid: 0
  - verse: 41
    segments:
      - text: >
          [40 ayetine baq.]
        cid: 0
  - verse: 42
    segments:
      - text: >
          [40 ayetine baq.]
        cid: 0
  - verse: 43
    segments:
      - text: >
          Olar böyle cevap berirler: Biz namaz qılğanlardan degil edik,
        cid: 0
  - verse: 44
    segments:
      - text: >
          Yoqsulnı toyurmay edik,
        cid: 0
  - verse: 45
    segments:
      - text: >
          (Batılğa) dalğanlarnen birlikte dala edik,
        cid: 0
  - verse: 46
    segments:
      - text: >
          Ceza kününi de yalan saya edik,
        cid: 0
  - verse: 47
    segments:
      - text: >
          Soñunda bizge ölüm keldi çattı.
        cid: 0
  - verse: 48
    segments:
      - text: >
          Artıq şefaatçılarnıñ şefaatı olarğa fayda bermez.
        cid: 0
  - verse: 49
    segments:
      - text: >
          Böyle eken, olarğa ne ola ki, sanki arslandan ürkip, qaçqan kiyik eşekler kibi
          (alâ) ögütten yüz çevireler?
        cid: 0
  - verse: 50
    segments:
      - text: >
          [49 ayetine baq.]
        cid: 0
  - verse: 51
    segments:
      - text: >
          [49 ayetine baq.]
        cid: 0
  - verse: 52
    segments:
      - text: >
          Daa doğrusı, olardan er biri, özüne, (ögünde) açılğan saifeler (ilâhiy vahiy)
          berilgenni istey.
        cid: 0
  - verse: 53
    segments:
      - text: >
          Yoq! Aslında olar ahiretten qorqmaylar.
        cid: 0
  - verse: 54
    segments:
      - text: >
          Asla (tüşüngenleri kibi degil)! Bilsinler ki, bu, aqiqaten bir tenbiyedir!
        cid: 0
  - verse: 55
    segments:
      - text: >
          İstegen ondan (tüşünip) ögüt alır.
        cid: 0
  - verse: 56
    segments:
      - text: >
          Bunıñnen beraber, Allah tilemeden, olar ögüt alalmazlar. Saqınılmağa lâyıq olğan
          da Odır, mağfiret saibi de Odır.
        cid: 0
