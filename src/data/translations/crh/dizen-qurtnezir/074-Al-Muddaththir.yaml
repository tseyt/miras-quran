surah_id: 74
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >-
          Ey, ortünip burüngen (Resulım)!
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Tur ve (insanlarnı) tenbiyele.
        cid: 0
  - verse: 3
    segments:
      - text: >-
          Sadece Rabiñni buyuk tanı.
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Urbañnı ter-temiz tut.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Yaman şeylerni terk et.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Yapqan eyiligiñni çoq korerek, kozge türtme.
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Rabbiñniñ rizasına irişmek içün sabır et.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          O Suurğa uflengen vaqıt bar ya,
        cid: 0
  - verse: 9
    segments:
      - text: >-
          İşte, o kun zorlu bir kundir.
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Kâfirler içün (iç de) qolay degildir.
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Tek olaraq yaratıp, oña bol servet ve kozü ogünde turğan oğullar berdigim, ozü
          içün (nimetlerni ogüne) serdikçe serdigim o kimseni maña bıraq!
        cid: 0
  - verse: 12
    segments:
      - text: >-
          [11 ayetine baq.]
        cid: 0
  - verse: 13
    segments:
      - text: >-
          [11 ayetine baq.]
        cid: 0
  - verse: 14
    segments:
      - text: >-
          [11 ayetine baq.]
        cid: 0
  - verse: 15
    segments:
      - text: >-
          Bunıñ ustüne o (nimetlerimni) daa da arttıruvımnı umüt etmekte.
        cid: 0
  - verse: 16
    segments:
      - text: >-
          Asla (umüt etmesin)! Çünki, o, bizim ayetlerimizge nisbeten tekmil inatçıdır.
        cid: 0
  - verse: 17
    segments:
      - text: >-
          Men onı sarp bir yoquşqa tırmaştıracağım!
        cid: 0
  - verse: 18
    segments:
      - text: >-
          Zira, o, tüşündi-taşındı, olçedi, biçti.
        cid: 0
  - verse: 19
    segments:
      - text: >-
          Canı çıqsın, ne şekilde olçedi-biçti!
        cid: 0
  - verse: 20
    segments:
      - text: >-
          Soñ canı çıqsın, tekrar (olçedi-biçti); nasıl olçedi-biçti ise!
        cid: 0
  - verse: 21
    segments:
      - text: >-
          Soñ baqtı. Soñ qaşlarını çattı, yuzüni ekşitti. Eñ soñunda kibrini yeñalmayıp,
          arqa çevirdi de: «Bu (Qur’an) dedi, olsa-olsa (sihirbazlardan ogrenilip) naql
          etilgen bir tılsımdır. Bu, insan sözünden başqa bir şey degil». (Rivayetke kore,
          Velid b. Muğiireniñ Az. Peyğamber oquğan Qur’annı diñlegeninen, çoq
          tesirlengenini añlağan Qureyş muşrikleri «Ey, vaah! dediler, Velid dininden
          döngen. Artıq oña baqıp, butün Qureyş dininden dönecek!». Bunıñ uzerine,
          qardaşınıñ oğlu Ebu Cehil Velidge barıp, ğururına sığmaycaq sözlernen onı
          qandırdı. Soñ birlikte muşriklerniñ yanına keldiler. Velid olarğa Az. Muһammed
          (s.a.)ge «mecnun», «kâhin», «şair» ve «yalancı»» lağaplarınen hitap etüvniñ
          yerli olmaycağını añlattı; niayet, uzundan uzatsiya tüşünip-taşınğan soñ:
          «Olğan-olacağı o bir sihirbazdır. Kormeysiñizmi, insannı ailesinden, evlâdından,
          hızmetkârından ayırmaqta», dedi. Muşrikler bu sözlerni çoq begendiler ve Az.
          Peyğamberge «sihirbaz» diye hitap etmege başladılar. Bu, Resul-ı Ekremge ziyade
          toqundı).
        cid: 0
