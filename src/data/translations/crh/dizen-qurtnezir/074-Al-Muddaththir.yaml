  - verse: 21
    segments:
      - text: Soñ
        cid: 1
      - text: baqtı.
        cid: 2
      - text: >-
          Soñ qaşlarını çattı, yüzüni ekşitti. Eñ soñunda kibrini yeñalmayıp, arqa çevirdi de:
          «Bu (Qur'an) dedi, olsa-olsa (sihirbazlardan ögrenilip) naql etilgen bir tılsımdır.
          Bu, insan sözünden başqa bir şey degil». (Rivayetke köre, Velid b. Muğiireniñ Az.
          Peyğamber oquğan Qur'annı diñlegeninen, çoq tesirlengenini añlağan Qureyş müşrikleri
          «Ey, vaah! dediler, Velid dininden döngen. Artıq oña baqıp, bütün Qureyş dininden
          dönecek!». Bunıñ üzerine, qardaşınıñ oğlu Ebu Cehil Velidge barıp, ğururına
          sığmaycaq sözlernen onı qandırdı. Soñ birlikte müşriklerniñ yanına keldiler. Velid
          olarğa Az. Muhammed (s.a.)ge «mecnun», «kâhin», «şair» ve «yalancı» lağaplarınen
          hitap etüvniñ yerli olmaycağını añlattı; niayet, uzundan uzadiya tüşünip-taşınğan
          soñ: «Olğan-olacağı o bir sihirbazdır. Körmeysiñizmi, insannı ailesinden,
          evlâdından, hızmetkârından ayırmaqta», dedi. Müşrikler bu sözlerni çoq begendiler ve
          Az. Peyğamberge «sihirbaz» diye hitap etmege başladılar. Bu, Resul-ı Ekremge ziyade
          toqundı).
        cid: 0
