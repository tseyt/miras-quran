  - verse: 26
    segments:
      - text: >-
          Men onı seqarğa (ceennem tübine) soqacam.
        cid: 0
  - verse: 27
    segments:
      - text: >-
          Sen seqar nedir bilesiñmi?
        cid: 0
  - verse: 28
    segments:
      - text: >-
          Em (butün bedenni elâk eter, iç bir şey) qaldırmaz, em (eski alğa ketirip,
          tekrar azap etüvden) vazgeçmez o.
        cid: 0
  - verse: 29
    segments:
      - text: >-
          İnsannıñ terisini qavurır.
        cid: 0
  - verse: 30
    segments:
      - text: >-
          Uzerinde on doquz (muhafız melek) bar.
        cid: 0
  - verse: 31
    segments:
      - text: >-
          Biz ceennemniñ işlerine baqmaq ile, ancaq meleklerni vazifelendirgendirmiz.
          Olarnıñ sayısını da inkârcılar içün sadece bir imtian (vesilesi) yaptıq ki,
          boyleliknen, ozlerine kitap berilgenler yahşıca ogrensin, iman etkenlerniñ
          imanını arttırsın; em ozlerine kitap berilgenler, em mu’minler şubelenmesinler,
          qalplerinde hastalıq (maraz) olğanlar ve kâfirler de: «Allaһ bu misalnen ne
          demek istegen?», desinler. İşte, Allaһ boylece istegenini sapıqlıqta bıraqır,
          istegenini doğru yolğa iriştirir. Rabbiñniñ ordularını ozünden başqası bilmez.
          Bu ise, insanlıq içün ancaq bir ogüttir.
        cid: 0
  - verse: 32
    segments:
      - text: >-
          Yoq, yoq (ogüt almazlar). Ayğa ant olsun ki,
        cid: 0
  - verse: 33
    segments:
      - text: >-
          Dönüp ketmekte olğan gecege,
        cid: 0
  - verse: 34
    segments:
      - text: >-
          Ağarmaqta olğan sabağa ant olsun ki,
        cid: 0
  - verse: 35
    segments:
      - text: >-
          O (ceennem), insanlıq içün, sizden ileri ketmek ya da keri qalmaq istegen
          kimseler içün, buyuk tenbiyeleyici musibetlerden biridir.
        cid: 0
