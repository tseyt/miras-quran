      - text: >-
          (Sureniñ başından bu yerge qadar sıralanğan ayetlerniñ çoqusı insannı etrafnı sarğan
          tabiiy barlıq ve vaqialar üzerinde tüşünmege, tedqiq etmege ve sırlarını bilmege
          çağıra, böylece, bir taraftan, bu alemde hızmetine taqdim etilgen bu barlıq ve
          vaqialar aqqında daa çoq bilgilerge saip olup, bular berecek imkân ve nimetlerden eñ
          güzel şekilde faydalanmağa teşviq ete. Bu, insannıñ dünyaviy inkişafı içün
          kereklidir; diger taraftan, kâinattaki inceliklerni, alelhusus varlıqlarnı mümkün
          olğanı qadar muşaade etmek yolunen, bu nizamnıñ yaratıcısı olğan Ulu Allahnıñ
          barlığını ve qudretiniñ sıñırsızlığını sezmege, böylece, küçlü bir imanğa saip
          olmağa ruhlandıra. Bu da insannıñ ahiret ferahı içün kerek).
