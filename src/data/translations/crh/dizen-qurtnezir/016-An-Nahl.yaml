surah_id: 16
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "Allaһnıñ emri kelgendir. Artıq onı istemekte acele etmeñ. Allaһ olarnıñ qoşqan ortaqlarından uzaq ve yucedir."
        cid: 0
  - verse: 2
    segments:
      - text: "Allaһ kendi emrinen meleklerni, qullarından istegen kimsesine vahiy ile: «Menden başqa tañrı olmağanına dair (qularımnı) tenbiyeleñ ve menden qroquñ», diye yollar."
        cid: 0
  - verse: 3
    segments:
      - text: "(Allaһ) koklerni ve yerni haq ile yarattı. O, qoşqan ortaqlarından uzaqtır."
        cid: 0
  - verse: 4
    segments:
      - text: "O, insannı bir tamçı suvdan yarattı. Faqat baqarsıñ ki, (insan) Rabbine ap-açıq bir duşman ola qalğan."
        cid: 0
  - verse: 5
    segments:
      - text: "Ayvanlarnı da O yarattı. Olarda siz içün ısıtıcı (şeyler) ve bir çoq faydalar bardır. Olardan bir qısmını da aşarsıñız."
        cid: 0
  - verse: 6
    segments:
      - text: "Siz içün olardan ayrıca aqşamleyin ketirgende, sabaleyin aydağanda bir guzellik (bir zevq) bar."
        cid: 0
  - verse: 7
    segments:
      - text: "Bu ayvanlar siziñ ağırlıqlarıñıznı, ancaq kuçliklerge qatlanaraq, barabilecek bir memleketiñizge taşırlar. Şubesiz, Rabbiñiz çoq şefqatlı, pek merhametlidir."
        cid: 0
  - verse: 8
    segments:
      - text: "Atlarnı, qatırlarnı ve eşeklerni minüviñiz ve (kozlerge) ziynet olsun, diye (yarattı). Allaһ şu anda siz bilip olalmaycaq daa nice (naqliyet vastalarını) yaratır. (Boylece, bu ayetlerden de añlaşılğanına kore, eskiden insanlar taşımaq vastası olaraq, yalıñız ayvan kuçünden faydalanğanları alda, vaqtıi ile ve hususen soñki asırda naqliyat vastaları sur’atı ve çeşitligi ceetinden, aqıllarnı şaşıracaq derecede inkişaf etti. İşte, yuqarıdaki ayetniñ manasındaki ifade ile bu ilerilevlerge işaret etile. Bu ise, Allaһnıñ insanlarğa eñ buyuk bahşışlarından biridir)."
        cid: 0
  - verse: 9
    segments:
      - text: "Yolnıñ doğrusı Allaһnıñdır. Yolnıñ qıyışı da bar. Allaһ istese edi, epiñizni doğru yolğa qavuştırır edi."
        cid: 0
  - verse: 10
    segments:
      - text: "Kokten suvnı endirgen Odır. Ondan em sizge içecegiñiz bar, em de ayvanlarıñıznı otlatacaq ekinler."
        cid: 0
  - verse: 11
    segments:
      - text: "(Allaһ) suv sayesinde siz içün ekinler, zeytunlar, hurmalar, yuzümler ve diger meyvalarnıñ episinden yetiştirir. İşte, bularda tüşüngen bir toplum içün buyuk bir ibret bardır."
        cid: 0
  - verse: 12
    segments:
      - text: "O, geceni, kundüzni, kuneşni ve aynı siziñ hizmetiñizge berdi. Yıldızlar da Allaһnıñ emrinen areket eteler. Şubesiz ki, bularda aqlını işletkenler içün pek çoq deliller bardır."
        cid: 0
  - verse: 13
    segments:
      - text: "Yer yuzünde siz içün çeşit renkli yarattıqlarında, ogüt alğan bir toplum içün, aqiqiy bir ibret bardır."
        cid: 0
  - verse: 14
    segments:
      - text: "İçinden taze et (balıq) aşamañız ve taqacaq bir süs (eşyası) çıqaruvıñız içün deñizni emriñizge bergen Odır. Gemilerniñ deñizde (suvlarnı) yara-yara yurgenlerini kormektesiñ. (Butün bular) Onıñ lütfini qıdıruvıñız ve nimetine şukür etüviñiz içündir."
        cid: 0
  - verse: 15
    segments:
      - text: "Sizni sarsmaması içün yer yuzünde qaviy dağlarnı, yoluñıznı tapuvıñız içün de irmaqlarnı ve yollarnı yarattı."
        cid: 0
  - verse: 16
    segments:
      - text: "Daa nice alâmetler (yarattı). Olar yıldızlarnen de yollarını doğrultırlar."
        cid: 0
  - verse: 17
    segments:
      - text: "O alda, yaratqan (Allaһ) yaratmağan (putlar) kibi olurmı? Alâ tüşünmeysiñizmi?"
        cid: 0
  - verse: 18
    segments:
      - text: "Allaһnıñ nimetini saymağa qalqsañız, onı sayalmazsıñız. Aqiqaten, Allaһ çoq bagışlayıcı, pek merhametlidir. (Sureniñ başından bu yerge qadar sıralanğan ayetlerniñ çoqusı insannı etrafnı sarğan tabiiy barlıq ve vaqialar uzerinde tüşünmege, tedqiq etmege ve sırlarını bilmege çağıra, boylece, bir taraftan, bu alemde hızmetine taqdim etilgen bu barlıq ve vaqialar aqqında daa çoq bilgilerge saip olup, bular berecek imkân ve nimetlerden eñ guzel şekilde faydalanmağa teşviq ete. Bu, insannıñ dünyaviy inkişafı içün kereklidir; diger taraftan, kâinattaki inceliklerni, alelhusus varlıqlarnı mumkün olğanı qadar muşaade etmek yolunen, bu nizamnıñ yaratıcısı olğan Ulu Allaһnıñ barlığını ve qudretiniñ sıñırsızlığını sezmege, boylece, kuçlü bir imanğa saip olmağa ruhlandıra. Bu da insannıñ ahiret ferahı içün kerek)."
        cid: 0
  - verse: 19
    segments:
      - text: "Allaһ gizlegeniñizni de, aşkâr etkeniñizni de bilir."
        cid: 0
  - verse: 20
    segments:
      - text: "Allaһnı bıraqıp da, tabınğanları (putlar) iç bir şey yaratalmazlar. Çünki, olar ozleri yaratılğanlardır."
        cid: 0
  - verse: 21
    segments:
      - text: "Olar tiriler degil, olülerdir. Ne zaman tiriltileceklerini de bilmezler."
        cid: 0
  - verse: 22
    segments:
      - text: "İlâhıñız tek bir Tañrıdır. Faqat ahiretke inanmanğanlar bar ya, olarnıñ qalpleri inkârcı, ozleri de kibrlengen kimselerdir."
        cid: 0
  - verse: 23
    segments:
      - text: "İç şubesiz, Allaһ olarnıñ gizleyceklerini de, aşkâr eteceklerini de bilir. O, buyuklik taslağanlarnı asla sevmez."
        cid: 0
  - verse: 24
    segments:
      - text: "Olarğa: Rabbiñiz ne endirdi? denilgen vaqıtta: «Evelkilerniñ masallarını», derler."
        cid: 0
  - verse: 25
    segments:
      - text: "Qıyamet kunünde oz gunahlarını tam olaraq taşımaları ve bilgisizliknen saptırmaqta olğan kimselernıñ gunahlarından da bir qısmını yuklenüvleri içün (oyle derler). Baq ki, yuklenecek şeyleri ne fenadır? (Zira, sapqan ile saptırtğan ortaqtır; biri o birini saptırğan, o biri de onıñ saptıruvına boyun eggen. Oyle ise, gunahnı ekisi beraber yuklenecekler. «Sapıtmaqnıñ bilgisizliknen oluvı» sapıtılğanğa ait bir keyfiyettir. Yani uyğan yollarınıñ sapıqlıq olğanını bilmeyip sapqandırlar, demektir. Bu da yanğız başına eyi niyetniñ yeterli olmağanını, ihlâsnen beraber, doğrunıñ isbatı içün ğayret sarf etüvniñ kerek olğanını kostere)."
        cid: 0
  - verse: 26
    segments:
      - text: "Olardan evelkiler de (peyğamberlerge) iyle yapqan ediler. Soñunda Allaһ da olarnıñ binalarını temellerinden sökti, ustlerindeki tavan da tepelerine çökti. Bu azap olarğa farq etip olamağan bir yerden kelgen edi."
        cid: 0
  - verse: 27
    segments:
      - text: "Soñra qıyamet kunünde (Allaһ), olarnı rezil eter ve der ki: «Olar aqqında (mu’minlerge) duşman kesilgen ortaqlarım ne yerde?» Ozlerine ilim berilgenler derler ki: «Şubesiz, bugun rezillik ve fenalıq kâfirlergedir»."
        cid: 0
  - verse: 28
    segments:
      - text: "Ozlerine aqsızlıq eter ekenler, melekler canlarını alğan kimseler: Biz iç bir fenalıq yapmay edik, diyerek teslim olurlar. (Melekler olarğa boyle derler:) «Öq, Allaһ siziñ yapqanlarñıznı, elbette çoq yahşı bilicidir»."
        cid: 0
  - verse: 29
    segments:
      - text: "«O alda, içinde ebediy qalacağıñız ceennemniñ qapularından kiriñ! Kibirlengenlerniñ yerleri ne fenadır!» (Allaһ Taalâ sureniñ başından bu yerge qadar ozüniñ barlığına ve birligine, ibadetke lâyıq olğanına dair bir çoq delil sıralağandan soñ, inanmağanlarnıñ vaziyetlerini ve neticede baracaq yerleri ve bu yerlerniñ fenalığını bildire. Buña qarşılıq bundan soñki ayetlerde de iman etkenlerniñ vaziyetleri ve baracaq yerleriniñ eyiligi ve guzelligi añlatılacaq)."
        cid: 0
  - verse: 30
    segments:
      - text: "(Fenalıqlardan) saqınğanlarğa: Rabbiñiz ne endirdi? denilgende: «Hayır (endirdi)», derler. Bu dünyada guzel davranğanlarga guzel mukâfat bar. Ahiret yurtu ise, daa hayırlıdır. Taqva saipleriniñ yurtu kerçekten guzeldir! (Bazı tefsirlerge kore, hac mevsumınde arap bayları Mekkege eyetler yollayaraq, Az.Muһammed aqqında malümat toplay ediler. Bir eyet mesuli kelgen vaqıtta muşrikler oña mani olmaq istegen ve artına qaytuvını emir etkenler. Ayrıca: «Onıñnen korüşmemeñ sen içün daa hayırlı olur», degenler. O da: «Eger men Muһammed aqqında bilgi almadan, qavmıma qaytsam, çoq fena bir temsilci olurım», degen, Allaһ Resulınıñ arqadaşlarından onıñ alını sorağan edi. Olar da: «O bizge hayır ketirgen», diye cevap bergen ediler. Ayet bu vaqiağa aittir)."
        cid: 0
  - verse: 31
    segments:
      - text: "Kirecekleri (o yurt) zemininden irmaqlar aqqan Adn cennetleridir. Olar içün o yerde ozlerine istegen er şey bardır. İşte, Allaһ taqva saiplerini boyle mukâfatlandırır."
        cid: 0
  - verse: 32
    segments:
      - text: "(Olar) meleklerniñ: «Sizge selâm olsun. Yapqan (yahşı) işleriñizge qarşılıq cennetke kiriñ», diyerek, ter-temiz olaraq canlarını alğan kimseleridir."
        cid: 0
  - verse: 33
    segments:
      - text: "(Kâfirler) ozlerine meleklerniñ kelüvinden ya da Rabbleri emriniñ kelüvinden başqa bir şey bekleylermi? Olardan evelkelir de boyle yapqan ediler. Allaһ olarğa zulum etmedi. Faqat olar ozlerine zulum ete ediler."
        cid: 0
  - verse: 34
    segments:
      - text: "Soñunda yapqanlarınıñ cezası olarğa keldi ve alay eteyatqan şeyleri olarnıñ çevresini sarıp aldı."
        cid: 0
  - verse: 35
    segments:
      - text: "Ortaq qoşqanlar dediler ki: «Allaһ istese edi, ne biz, ne de babalarımız ondan başqasına tabınır edik. Onıñ emri olmadan, iç bir şeyni de aram yapmaz edik». Olardan evelkiler de boyle yapqan ediler. Peyğamberlerniñ uzerine ap-açıq tebliğden başqa bir vazife tüşermi!"
        cid: 0
  - verse: 36
    segments:
      - text: "Ant oslun ki, biz: «Allaһqa qullıq etiñ ve Taağuttan saqınıñ», diye (emir etüvleri içün) er ummetke bir peyğamber yolladıq. Allaһ olardan bir qısmını doğru yolğa qavuştırdı. Olardan bir qısmı da sapıqlıqnı haq etti. Yer yuzünde keziñ de, korüñ, inkâr etkenlerniñ soñu nasıl olğan! (Taağut içün Nisaa suresi, 60-nci ayetke baq)."
        cid: 0
  - verse: 37
    segments:
      - text: "(Resulım!) Sen olarnıñ hidayetke irişüvlerine çoq ğayret kosterseñ de, bil ki, Allaһ saptırğan kimseni (istemese) hidayetke iriştirmez. Olarnıñ yardımcıları yoqtır."
        cid: 0
  - verse: 38
    segments:
      - text: "Olar: «Allaһ, olgen bir kimseni tiriltmez», diye bar kuçlerinen Allaһqa ant içtiler. Aksine, bu Onıñ şahsen ozüne kerçek bir vadesidir. Faqat insanlarnıñ çoqu bilmez."
        cid: 0
  - verse: 39
    segments:
      - text: "Aqqında ihtilâf etken şeyni olarğa añlatuvı ve kâfir olğanlarnıñ da ozleriniñ yalancılar olğanlarını bilüvleri içün (Allaһ olarnı tiriltecek)."
        cid: 0
  - verse: 40
    segments:
      - text: "Biz bir şeyniñ oluvını istegen vaqtımızda oña (söyleycek) sözümiz sadece «Ol» deyuvimizdir. Aman ola qoyar."
        cid: 0
  - verse: 41
    segments:
      - text: "Zulumğa oğrağan soñ, Allaһ yolunda icret etkenlerge kelgende, olarnı dünyada guzel bir şekilde yerleştirecekmiz. Eger bilseler, ahiretniñ mukâfatı, elbette daa buyuktir."
        cid: 0
  - verse: 42
    segments:
      - text: "(Olar) sadece Rabblerine tevekkül eterek, sabır etkenlerdir. (Bu eki ayette bildirilgenler, başında Resulullah (a.s.) olmaq uzre, Qureyşniñ zulmı sebebinden icert etken musulmanlardır. Aqiqaten, bu muhacir musulmanlar yurtlarını terk etüvniñ bergen keçici qıyınlıqlarından qurtulğan soñ, yuce Peyğamberniñ reberliginde, din ve dünya ayatı noqtai nazarından, tertipli, uzurl ve qısqa zamanda kufür tarafını yeñyecek qadar kuçlü bir toplum meydanğa ketirgenler)."
        cid: 0
  - verse: 43
    segments:
      - text: "Senden evel de, ozlerine vahiy ettigimiz kişilerden başqasını peyğamber olaraq yollamadıq. Eger bilmey iseñiz, bilgenlerden sorañ."
        cid: 0
  - verse: 44
    segments:
      - text: "Ap-açıq mucizeler ve kitaplarnen (öllanıldılar). İnsanlarğa ozlerine endirilgenni añlatuvıñ içün ve tüşünip añlasınlar diye, saña da bu Qur’annı endirdik."
        cid: 0
  - verse: 45
    segments:
      - text: "Yamanlıq tuzaqlarını qurğanlar Allaһ ozlerini yerge batırmaycağından ya da ozlerine bilmeycek bir yerden azapnıñ kelmeyceginden, ya da olar kezip dolaşqanda Allaһ olarnı yaqalap olamaycağından emin oldularmı? Olar (Allaһnı) aciz bıraqacaq degiller."
        cid: 0
  - verse: 47
    segments:
      - text: "Yoqsa, Allaһ olarnı yavaş-yavaş tüketerek cezanlandırmaycağından (emin oldularmı)? Şubesiz, Rabbiñ çoq şefqatlı, pek merhametlidir."
        cid: 0
  - verse: 48
    segments:
      - text: "Allaһnıñ yaratqan er angi bir şeyini kormedilermi? Onıñ kolgeleri kuçülerek ve Allaһqa secde eterek, sağğa-solğa sallanır. (Yani kolgesi bulunğan eşyanıñ kolgeleri bile, saipleriniñ ukminde degil, Allaһnıñ emiri altındadır. Saibi ne qadar oğraşsa-oğraşsın, kolge Allaһ Taalânıñ emri ve taqdiri yonelişinde ışıqnıñ kelgen noqtasına ters istiqametke tüşer ve onıñ deñişüvini taqip eter. Aynı zamanda, kolge ışıqnıñ bir eseri degildir, yalıñız Allaһnıñ bir qanunınıñ keregidir. Tolaysınen, eşyanıñ kolgelerinde bile, uküm ve tasarruf Allaһnıñdır)."
        cid: 0
  - verse: 49
    segments:
      - text: "Koklerde bulunğanlar, yerdeki canlılar ve butün melekler, buyuklik taslamadan, Allaһqa secde eterler."
        cid: 0
  - verse: 50
    segments:
      - text: "Olar ustlerindeki Rabblerinden qorqar ve ozlerine ne emir olunsa, onı yaparlar."
        cid: 0
  - verse: 51
    segments:
      - text: "Allaһ buyurdı ki: Eki tañrı edinmeñ! O yalıñız bir tañrıdır. O alda yalıñız menden qorquñ!"
        cid: 0
  - verse: 52
    segments:
      - text: "Koklerde ve yerde ne bar ise, Onıñdır. Din de yalıñız Onıñdır. O alda, Allaһtan başqasından qorqasıñızmı?"
        cid: 0
  - verse: 53
    segments:
      - text: "Nimet olaraq sizge berilgen ne bar ise, Allaһtandır. Soñ, sizge bir zarar toqunğan vaqıtta da, yalıñız Oña yalvarırsıñız."
        cid: 0
  - verse: 54
    segments:
      - text: "Sonra da, sizden o zararnı ketkizgeninde, arañızdan bir topu aman Rabblerine ortaq qoşarlar."
        cid: 0
  - verse: 55
    segments:
      - text: "Ozlerine bergenlermizge qarşılıq nankorlik etüvleri içün (oyle yaparlar). O alda, bir muddet daa faydalanıñ; faqat yaqında aqiqatnı bileceksiñiz."
        cid: 0
  - verse: 56
    segments:
      - text: "Bir de ozlerine rızıq olaraq bergenlerimizden, maiyetini bilmegen şeylerine (putlarğa) pay ayırmaqtalar. Allaһqa ant olsun ki, iftira eteyatqan şeyleriñizden mıtlaqa sorğuğa çekileceksiñiz! (İslâmdan evel bazı araplar ekinlerinden ve ayvanlarından bir qısmını Allaһnen putları arasında bolüştire ve: «Bu Allaһnıñ payı, bu da tañrılarımıznıız payı», dey ediler. Allaһ içün ayırğanlarını musafirlerge ve faqırlarğa arclay, tañrıları içün ayırğanlarını da olarnı uzurunda yapılacaq merasim ve başqa şeylerge arclay ediler. Yuqarıdaki ayette buña işaret etile)."
        cid: 0
  - verse: 57
    segments:
      - text: "Olar qızlarnıñ Allaһqa ait olğanını idda eteler. Allaһ bundan uzaqtır. Begengenleri de (oğlan balalar) ozleriniñ ola. (Huzaa’a ve Kinaane qabileleri: «Melekler Allaһnıñ qızları», dey ediler. Albuki, ozleri qız balalarını tirileyin topraqqa kome ediler. Aşağıdaki ayetler olarnıñ qız balalarına nisbeten yapqanlarını tasvir ete)."
        cid: 0
  - verse: 58
    segments:
      - text: "Olardan birine qız mujdelengen vaqıtta, opkelenerek, yuzü qap-qara kesilir."
        cid: 0
  - verse: 59
    segments:
      - text: "Ozüne berilgen mujdeniñ fenalığından tolayı, qavmından gizlenir. Onı aşşalıq duygusı içinde yanında tutsınmı, yoqsa, topraqqa komsinmi! Baqıñ ki, bergen ukümleri ne qadar fena!"
        cid: 0
  - verse: 60
    segments:
      - text: "Fena sıfat ahiretke inanmağanlar içündir. Eñ yuce sıfatlar ise, Allaһqa aittir. Çünki, O, er şeyden ustün ve ikmet saibidir."
        cid: 0
  - verse: 61
    segments:
      - text: "Eger Allaһ insanlarnı, zulumlarınıñ sebebinden, cezalaycaq olsa edi, yer yuzünde iç bir canlı qaldırmaz edi. Faqat olarnı belgilengen bir muddetke qadar keçiktire. Ecelleri kelgen vaqıtta, olar ne bir saat keri qala bilir, ne de ogge keçe bilirler."
        cid: 0
  - verse: 62
    segments:
      - text: "Ozleriniñ oşlarına ketmegen şeylerni Allaһqa ait eteler. Eñ guzel neticeniñ ozleriniñki olğanını añlatqan tilleri de yalannıñ ornegini bere. İç şubesiz, olar içün sadece ateş bardır ve olar (ateşke) atılacaqlar."
        cid: 0
  - verse: 63
    segments:
      - text: "Allaһqa ant olsun, senden evelki ummetlerge de (peyğamberler) yollağanmız. Faqat şeytan olarğa işlerini süslü kosterdi de (iman etmediler). İşte, o bugun olarnıñ velisidir. Ve olar içün elem berici bir azap bardır."
        cid: 0
  - verse: 64
    segments:
      - text: "Biz bu kitapnı saña, umumen, aqqında ihtilâfqa tüşken şeylerini insanlarğa añlatırsıñ ve iman etken bir toplumğa da hidayet ve rahmet olsun, diye endirdik."
        cid: 0
  - verse: 65
    segments:
      - text: "Allaһ kokten bir suv endirdi ve onıñnen yer yuzüni olüminden soñ tiriltti. Şubesiz ki, bunda diñlegen toplum içün bir ibret bardır."
        cid: 0
  - verse: 66
    segments:
      - text: "Şubesiz, siz içün ayvanlarda da buyuk bir ibret bardır. Zira, sizge olarnıñ qarınlarındaki pisliknen qan arasından (kelgen), içkenlerniñ boğazından qolaylıqnen keçken halis bir süt içirmektemiz."
        cid: 0
  - verse: 67
    segments:
