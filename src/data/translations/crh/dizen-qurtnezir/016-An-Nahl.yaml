          olaraq yerine ketirmek, er kesniñ aqqını bermek ve ölçüli davranmaq demektir. İhsan:
          Eyilik etmek, hayır yapmaq, bağışlavda bulunmaq ve emir etilgen şeyni keregi kibi
          yerine ketirmek demektir. İbadette ihsan: Allahnı körgen kibi ibadet etmektir.
          Aqrabağa yardım: Uzaq ve yaqın aqrabağa eyilik etmek, itiyaclarını qarşılamaq ve
          olarğa nisbeten eyi davranmaq demektir. Fahşaa: Yalan, iftira ve zina kibi söz ya da
          fiilnen işlengen günah ve çirkinliklerdir. Münker: Şeriat ve aqlı selimniñ
          begenmeyip, fena qabul etken işi ve davranışı demektir. Bağy: İnsanlarğa nisbeten
          üstünlik idda etip, olarnı zulum ve basqı altında yaşatmaq demektir. İşte, Allah
          Taalâ bu üç fena şeyni yasaqlağan).
