surah_id: 16
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >
          Allahnıñ emri kelgendir. Artıq onı istemekte acele etmeñ. Allah olarnıñ qoşqan
          ortaqlarından uzaq ve yücedir.
        cid: 0
  - verse: 2
    segments:
      - text: >
          Allah kendi emrinen meleklerni, qullarından istegen kimsesine vahiy ile: «Menden
          başqa tañrı olmağanına dair (qularımnı) tenbiyeleñ ve menden qroquñ», diye
          yollar.
        cid: 0
  - verse: 3
    segments:
      - text: >
          (Allah) köklerni ve yerni haq ile yarattı. O, qoşqan ortaqlarından uzaqtır.
        cid: 0
  - verse: 4
    segments:
      - text: >
          O, insannı bir tamçı suvdan yarattı. Faqat baqarsıñ ki, (insan) Rabbine ap-açıq
          bir duşman ola qalğan.
        cid: 0
  - verse: 5
    segments:
      - text: >
          Ayvanlarnı da O yarattı. Olarda siz içün ısıtıcı (şeyler) ve bir çoq faydalar
          bardır. Olardan bir qısmını da aşarsıñız.
        cid: 0
  - verse: 6
    segments:
      - text: >
          Siz içün olardan ayrıca aqşamleyin ketirgende, sabaleyin aydağanda bir güzellik
          (bir zevq) bar.
        cid: 0
  - verse: 7
    segments:
      - text: >
          Bu ayvanlar siziñ ağırlıqlarıñıznı, ancaq küçliklerge qatlanaraq, barabilecek
          bir memleketiñizge taşırlar. Şübesiz, Rabbiñiz çoq şefqatlı, pek merhametlidir.
        cid: 0
  - verse: 8
    segments:
      - text: >
          Atlarnı, qatırlarnı ve eşeklerni minüviñiz ve (közlerge) ziynet olsun, diye
          (yarattı). Allah şu anda siz bilip olalmaycaq daa nice (naqliyet vastalarını)
          yaratır. (Böylece, bu ayetlerden de añlaşılğanına köre, eskiden insanlar taşımaq
          vastası olaraq, yalıñız ayvan küçünden faydalanğanları alda, vaqtı ile ve
          hususen soñki asırda naqliyat vastaları sur'atı ve çeşitligi ceetinden,
          aqıllarnı şaşıracaq derecede inkişaf etti. İşte, yuqarıdaki ayetniñ manasındaki
          ifade ile bu ilerilevlerge işaret etile. Bu ise, Allahnıñ insanlarğa eñ büyük
          bahşışlarından biridir).
        cid: 0
  - verse: 9
    segments:
      - text: >
          Yolnıñ doğrusı Allahnıñdır. Yolnıñ qıyışı da bar. Allah istese edi, epiñizni
          doğru yolğa qavuştırır edi.
        cid: 0
  - verse: 10
    segments:
      - text: >
          Kökten suvnı endirgen Odır. Ondan em sizge içecegiñiz bar, em de ayvanlarıñıznı
          otlatacaq ekinler.
        cid: 0
  - verse: 11
    segments:
      - text: >
          (Allah) suv sayesinde siz içün ekinler, zeytunlar, hurmalar, yüzümler ve diger
          meyvalarnıñ episinden yetiştirir. İşte, bularda tüşüngen bir toplum içün büyük
          bir ibret bardır.
        cid: 0
  - verse: 12
    segments:
      - text: >
          O, geceni, kündüzni, küneşni ve aynı siziñ hizmetiñizge berdi. Yıldızlar da
          Allahnıñ emrinen areket eteler. Şübesiz ki, bularda aqlını işletkenler içün pek
          çoq deliller bardır.
        cid: 0
  - verse: 13
    segments:
      - text: >
          Yer yüzünde siz içün çeşit renkli yarattıqlarında, ögüt alğan bir toplum içün,
          aqiqiy bir ibret bardır.
        cid: 0
  - verse: 14
    segments:
      - text: >
          İçinden taze et (balıq) aşamañız ve taqacaq bir süs (eşyası) çıqaruvıñız içün
          deñizni emriñizge bergen Odır. Gemilerniñ deñizde (suvlarnı) yara-yara
          yürgenlerini körmektesiñ. (Bütün bular) Onıñ lütfini qıdıruvıñız ve nimetine
          şükür etüviñiz içündir.
        cid: 0
  - verse: 15
    segments:
      - text: >
          Sizni sarsmaması içün yer yüzünde qaviy dağlarnı, yoluñıznı tapuvıñız içün de
          irmaqlarnı ve yollarnı yarattı.
        cid: 0
  - verse: 16
    segments:
      - text: >
          Daa nice alâmetler (yarattı). Olar yıldızlarnen de yollarını doğrultırlar.
        cid: 0
  - verse: 17
    segments:
      - text: >
          O alda, yaratqan (Allah) yaratmağan (putlar) kibi olurmı? Alâ tüşünmeysiñizmi?
        cid: 0
  - verse: 18
    segments:
      - text: >
          Allahnıñ nimetini saymağa qalqsañız, onı sayalmazsıñız. Aqiqaten, Allah çoq
          bağışlayıcı, pek merhametlidir. (Sureniñ başından bu yerge qadar sıralanğan
          ayetlerniñ çoqusı insannı etrafnı sarğan tabiiy barlıq ve vaqialar üzerinde
          tüşünmege, tedqiq etmege ve sırlarını bilmege çağıra, böylece, bir taraftan, bu
          alemde hızmetine taqdim etilgen bu barlıq ve vaqialar aqqında daa çoq bilgilerge
          saip olup, bular berecek imkân ve nimetlerden eñ güzel şekilde faydalanmağa
          teşviq ete. Bu, insannıñ dünyaviy inkişafı içün kereklidir; diger taraftan,
          kâinattaki inceliklerni, alelhusus varlıqlarnı mümkün olğanı qadar muşaade etmek
          yolunen, bu nizamnıñ yaratıcısı olğan Ulu Allahnıñ barlığını ve qudretiniñ
          sıñırsızlığını sezmege, böylece, küçlü bir imanğa saip olmağa ruhlandıra. Bu da
          insannıñ ahiret ferahı içün kerek).
        cid: 0
  - verse: 19
    segments:
      - text: >
          Allah gizlegeniñizni de, aşkâr etkeniñizni de bilir.
        cid: 0
  - verse: 20
    segments:
      - text: >
          Allahnı bıraqıp da, tabınğanları (putlar) iç bir şey yaratalmazlar. Çünki, olar
          özleri yaratılğanlardır.
        cid: 0
  - verse: 21
    segments:
      - text: >
          Olar tiriler degil, ölülerdir. Ne zaman tiriltileceklerini de bilmezler.
        cid: 0
  - verse: 22
    segments:
      - text: >
          İlâhıñız tek bir Tañrıdır. Faqat ahiretke inanmanğanlar bar ya, olarnıñ qalpleri
          inkârcı, özleri de kibrlengen kimselerdir.
        cid: 0
  - verse: 23
    segments:
      - text: >
          İç şübesiz, Allah olarnıñ gizleyceklerini de, aşkâr eteceklerini de bilir. O,
          büyüklik taslağanlarnı asla sevmez.
        cid: 0
  - verse: 24
    segments:
      - text: >
          Olarğa: Rabbiñiz ne endirdi? denilgen vaqıtta: «Evelkilerniñ masallarını»,
          derler.
        cid: 0
  - verse: 25
    segments:
      - text: >
          Qıyamet kününde öz günahlarını tam olaraq taşımaları ve bilgisizliknen
          saptırmaqta olğan kimselernıñ günahlarından da bir qısmını yüklenüvleri içün
          (öyle derler). Baq ki, yüklenecek şeyleri ne fenadır? (Zira, sapqan ile
          saptırtğan ortaqtır; biri o birini saptırğan, o biri de onıñ saptıruvına boyun
          eggen. Öyle ise, günahnı ekisi beraber yüklenecekler. «Sapıtmaqnıñ
          bilgisizliknen oluvı» sapıtılğanğa ait bir keyfiyettir. Yani uyğan yollarınıñ
          sapıqlıq olğanını bilmeyip sapqandırlar, demektir. Bu da yanğız başına eyi
          niyetniñ yeterli olmağanını, ihlâsnen beraber, doğrunıñ isbatı içün ğayret sarf
          etüvniñ kerek olğanını köstere).
        cid: 0
  - verse: 26
    segments:
      - text: >
          Olardan evelkiler de (peyğamberlerge) iyle yapqan ediler. Soñunda Allah da
          olarnıñ binalarını temellerinden sökti, üstlerindeki tavan da tepelerine çökti.
          Bu azap olarğa farq etip olamağan bir yerden kelgen edi.
        cid: 0
  - verse: 27
    segments:
      - text: >
          Soñra qıyamet kününde (Allah), olarnı rezil eter ve der ki: «Olar aqqında
          (mü'minlerge) duşman kesilgen ortaqlarım ne yerde?» Özlerine ilim berilgenler
          derler ki: «Şübesiz, bugün rezillik ve fenalıq kâfirlergedir».
        cid: 0
  - verse: 28
    segments:
      - text: >
          Özlerine aqsızlıq eter ekenler, melekler canlarını alğan kimseler: Biz iç bir
          fenalıq yapmay edik, diyerek teslim olurlar. (Melekler olarğa böyle derler:)
          «Yoq, Allah siziñ yapqanlarñıznı, elbette çoq yahşı bilicidir».
        cid: 0
  - verse: 29
    segments:
      - text: >
          «O alda, içinde ebediy qalacağıñız ceennemniñ qapularından kiriñ!
          Kibirlengenlerniñ yerleri ne fenadır!» (Allah Taalâ sureniñ başından bu yerge
          qadar özüniñ barlığına ve birligine, ibadetke lâyıq olğanına dair bir çoq delil
          sıralağandan soñ, inanmağanlarnıñ vaziyetlerini ve neticede baracaq yerleri ve
          bu yerlerniñ fenalığını bildire. Buña qarşılıq bundan soñki ayetlerde de iman
          etkenlerniñ vaziyetleri ve baracaq yerleriniñ eyiligi ve güzelligi añlatılacaq).
        cid: 0
  - verse: 30
    segments:
      - text: >
          (Fenalıqlardan) saqınğanlarğa: Rabbiñiz ne endirdi? denilgende: «Hayır
          (endirdi)», derler. Bu dünyada güzel davranğanlarga güzel mükâfat bar. Ahiret
          yurtu ise, daa hayırlıdır. Taqva saipleriniñ yurtu kerçekten güzeldir! (Bazı
          tefsirlerge köre, hac mevsumınde arap bayları Mekkege eyetler yollayaraq,
          Az.Muhammed aqqında malümat toplay ediler. Bir eyet mesuli kelgen vaqıtta
          müşrikler oña mani olmaq istegen ve artına qaytuvını emir etkenler. Ayrıca:
          «Onıñnen körüşmemeñ sen içün daa hayırlı olur», degenler. O da: «Eger men
          Muhammed aqqında bilgi almadan, qavmıma qaytsam, çoq fena bir temsilci olurım»,
          degen, Allah Resulınıñ arqadaşlarından onıñ alını sorağan edi. Olar da: «O bizge
          hayır ketirgen», diye cevap bergen ediler. Ayet bu vaqiağa aittir).
        cid: 0
  - verse: 31
    segments:
      - text: >
          Kirecekleri (o yurt) zemininden irmaqlar aqqan Adn cennetleridir. Olar içün o
          yerde özlerine istegen er şey bardır. İşte, Allah taqva saiplerini böyle
          mükâfatlandırır.
        cid: 0
  - verse: 32
    segments:
      - text: >
          (Olar) meleklerniñ: «Sizge selâm olsun. Yapqan (yahşı) işleriñizge qarşılıq
          cennetke kiriñ», diyerek, ter-temiz olaraq canlarını alğan kimseleridir.
        cid: 0
  - verse: 33
    segments:
      - text: >
          (Kâfirler) özlerine meleklerniñ kelüvinden ya da Rabbleri emriniñ kelüvinden
          başqa bir şey bekleylermi? Olardan evelkelir de böyle yapqan ediler. Allah
          olarğa zulum etmedi. Faqat olar özlerine zulum ete ediler.
        cid: 0
  - verse: 34
    segments:
      - text: >
          Soñunda yapqanlarınıñ cezası olarğa keldi ve alay eteyatqan şeyleri olarnıñ
          çevresini sarıp aldı.
        cid: 0
  - verse: 35
    segments:
      - text: >
          Ortaq qoşqanlar dediler ki: «Allah istese edi, ne biz, ne de babalarımız ondan
          başqasına tabınır edik. Onıñ emri olmadan, iç bir şeyni de aram yapmaz edik».
          Olardan evelkiler de böyle yapqan ediler. Peyğamberlerniñ üzerine ap-açıq
          tebliğden başqa bir vazife tüşermi!
        cid: 0
  - verse: 36
    segments:
      - text: >
          Ant oslun ki, biz: «Allahqa qullıq etiñ ve Taağuttan saqınıñ», diye (emir
          etüvleri içün) er ümmetke bir peyğamber yolladıq. Allah olardan bir qısmını
          doğru yolğa qavuştırdı. Olardan bir qısmı da sapıqlıqnı haq etti. Yer yüzünde
          keziñ de, körüñ, inkâr etkenlerniñ soñu nasıl olğan! (Taağut içün Nisaa suresi,
          60-nci ayetke baq).
        cid: 0
  - verse: 37
    segments:
      - text: >
          (Resulım!) Sen olarnıñ hidayetke irişüvlerine çoq ğayret kösterseñ de, bil ki,
          Allah saptırğan kimseni (istemese) hidayetke iriştirmez. Olarnıñ yardımcıları
          yoqtır.
        cid: 0
  - verse: 38
    segments:
      - text: >
          Olar: «Allah, ölgen bir kimseni tiriltmez», diye bar küçlerinen Allahqa ant
          içtiler. Aksine, bu Onıñ şahsen özüne kerçek bir vadesidir. Faqat insanlarnıñ
          çoqu bilmez.
        cid: 0
  - verse: 39
    segments:
      - text: >
          Aqqında ihtilâf etken şeyni olarğa añlatuvı ve kâfir olğanlarnıñ da özleriniñ
          yalancılar olğanlarını bilüvleri içün (Allah olarnı tiriltecek).
        cid: 0
  - verse: 40
    segments:
      - text: >
          Biz bir şeyniñ oluvını istegen vaqtımızda oña (söyleycek) sözümiz sadece «Ol»
          deyüvimizdir. Aman ola qoyar.
        cid: 0
  - verse: 41
    segments:
      - text: >
          Zulumğa oğrağan soñ, Allah yolunda icret etkenlerge kelgende, olarnı dünyada
          güzel bir şekilde yerleştirecekmiz. Eger bilseler, ahiretniñ mükâfatı, elbette
          daa büyüktir.
        cid: 0
  - verse: 42
    segments:
      - text: >
          (Olar) sadece Rabblerine tevekkül eterek, sabır etkenlerdir. (Bu eki ayette
          bildirilgenler, başında Resulullah (a.s.) olmaq üzre, Qureyşniñ zulmı sebebinden
          icert etken musulmanlardır. Aqiqaten, bu muhacir musulmanlar yurtlarını terk
          etüvniñ bergen keçici qıyınlıqlarından qurtulğan soñ, yüce Peyğamberniñ
          reberliginde, din ve dünya ayatı noqtai nazarından, tertipli, uzurlı ve qısqa
          zamanda küfür tarafını yeñecek qadar küçlü bir toplum meydanğa ketirgenler).
        cid: 0
  - verse: 43
    segments:
      - text: >
          Senden evel de, özlerine vahiy ettigimiz kişilerden başqasını peyğamber olaraq
          yollamadıq. Eger bilmey iseñiz, bilgenlerden sorañ.
        cid: 0
  - verse: 44
    segments:
      - text: >
          Ap-açıq mucizeler ve kitaplarnen (yollanıldılar). İnsanlarğa özlerine
          endirilgenni añlatuvıñ içün ve tüşünip añlasınlar diye, saña da bu Qur'annı
          endirdik.
        cid: 0
  - verse: 45
    segments:
      - text: >
          Yamanlıq tuzaqlarını qurğanlar Allah özlerini yerge batırmaycağından ya da
          özlerine bilmeycek bir yerden azapnıñ kelmeyceginden, ya da olar kezip
          dolaşqanda Allah olarnı yaqalap olamaycağından emin oldularmı? Olar (Allahnı)
          aciz bıraqacaq degiller.
        cid: 0
  - verse: 46
    segments:
      - text: >
          [45 ayetine baq.]
        cid: 0
  - verse: 47
    segments:
      - text: >
          Yoqsa, Allah olarnı yavaş-yavaş tüketerek cezanlandırmaycağından (emin
          oldularmı)? Şübesiz, Rabbiñ çoq şefqatlı, pek merhametlidir.
        cid: 0
  - verse: 48
    segments:
      - text: >
          Allahnıñ yaratqan er angi bir şeyini körmedilermi? Onıñ kölgeleri küçülerek ve
          Allahqa secde eterek, sağğa-solğa sallanır. (Yani kölgesi bulunğan eşyanıñ
          kölgeleri bile, saipleriniñ ükminde degil, Allahnıñ emiri altındadır. Saibi ne
          qadar oğraşsa-oğraşsın, kölge Allah Taalânıñ emri ve taqdiri yönelişinde ışıqnıñ
          kelgen noqtasına ters istiqametke tüşer ve onıñ deñişüvini taqip eter. Aynı
          zamanda, kölge ışıqnıñ bir eseri degildir, yalıñız Allahnıñ bir qanunınıñ
          keregidir. Tolaysınen, eşyanıñ kölgelerinde bile, üküm ve tasarruf Allahnıñdır).
        cid: 0
  - verse: 49
    segments:
      - text: >
          Köklerde bulunğanlar, yerdeki canlılar ve bütün melekler, büyüklik taslamadan,
          Allahqa secde eterler.
        cid: 0
  - verse: 50
    segments:
      - text: >
          Olar üstlerindeki Rabblerinden qorqar ve özlerine ne emir olunsa, onı yaparlar.
        cid: 0
  - verse: 51
    segments:
      - text: >
          Allah buyurdı ki: Eki tañrı edinmeñ! O yalıñız bir tañrıdır. O alda yalıñız
          menden qorquñ!
        cid: 0
  - verse: 52
    segments:
      - text: >
          Köklerde ve yerde ne bar ise, Onıñdır. Din de yalıñız Onıñdır. O alda, Allahtan
          başqasından qorqasıñızmı?
        cid: 0
  - verse: 53
    segments:
      - text: >
          Nimet olaraq sizge berilgen ne bar ise, Allahtandır. Soñ, sizge bir zarar
          toqunğan vaqıtta da, yalıñız Oña yalvarırsıñız.
        cid: 0
  - verse: 54
    segments:
      - text: >
          Sonra da, sizden o zararnı ketkizgeninde, arañızdan bir topu aman Rabblerine
          ortaq qoşarlar.
        cid: 0
  - verse: 55
    segments:
      - text: >
          Özlerine bergenlermizge qarşılıq nankorlik etüvleri içün (öyle yaparlar). O
          alda, bir müddet daa faydalanıñ; faqat yaqında aqiqatnı bileceksiñiz.
        cid: 0
  - verse: 56
    segments:
      - text: >
          Bir de özlerine rızıq olaraq bergenlerimizden, maiyetini bilmegen şeylerine
          (putlarğa) pay ayırmaqtalar. Allahqa ant olsun ki, iftira eteyatqan
          şeyleriñizden mıtlaqa sorğuğa çekileceksiñiz! (İslâmdan evel bazı araplar
          ekinlerinden ve ayvanlarından bir qısmını Allahnen putları arasında bölüştire
          ve: «Bu Allahnıñ payı, bu da tañrılarımıznıñ payı», dey ediler. Allah içün
          ayırğanlarını musafirlerge ve faqırlarğa arclay, tañrıları içün ayırğanlarını da
          olarnıñ uzurunda yapılacaq merasim ve başqa şeylerge arclay ediler. Yuqarıdaki
          ayette buña işaret etile).
        cid: 0
  - verse: 57
    segments:
      - text: >
          Olar qızlarnıñ Allahqa ait olğanını idda eteler. Allah bundan uzaqtır.
          Begengenleri de (oğlan balalar) özleriniñ ola. (Huzaa'a ve Kinaane qabileleri:
          «Melekler Allahnıñ qızları», dey ediler. Albuki, özleri qız balalarını tirileyin
          topraqqa köme ediler. Aşağıdaki ayetler olarnıñ qız balalarına nisbeten
          yapqanlarını tasvir ete).
        cid: 0
  - verse: 58
    segments:
      - text: >
          Olardan birine qız müjdelengen vaqıtta, öpkelenerek, yüzü qap-qara kesilir.
        cid: 0
  - verse: 59
    segments:
      - text: >
          Özüne berilgen müjdeniñ fenalığından tolayı, qavmından gizlenir. Onı aşşalıq
          duygusı içinde yanında tutsınmı, yoqsa, topraqqa kömsinmi! Baqıñ ki, bergen
          ükümleri ne qadar fena!
        cid: 0
  - verse: 60
    segments:
      - text: >
          Fena sıfat ahiretke inanmağanlar içündir. Eñ yüce sıfatlar ise, Allahqa aittir.
          Çünki, O, er şeyden üstün ve ikmet saibidir.
        cid: 0
  - verse: 61
    segments:
      - text: >
          Eger Allah insanlarnı, zulumlarınıñ sebebinden, cezalaycaq olsa edi, yer yüzünde
          iç bir canlı qaldırmaz edi. Faqat olarnı belgilengen bir müddetke qadar
          keçiktire. Ecelleri kelgen vaqıtta, olar ne bir saat keri qala bilir, ne de ögge
          keçe bilirler.
        cid: 0
  - verse: 62
    segments:
      - text: >
          Özleriniñ oşlarına ketmegen şeylerni Allahqa ait eteler. Eñ güzel neticeniñ
