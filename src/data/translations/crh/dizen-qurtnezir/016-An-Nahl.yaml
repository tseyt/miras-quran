  - verse: 125
    segments:
      - text: "(Resulım!) Sen Rabbiñniñ yoluna ikmet ve guzel ogütnen çağır ve olarnen eñ guzel şekilde kureş! Rabbiñ, ozüniñ yolundan sapqanlarnı eñ yahşı bilicidir ve O, hidayetke irişkenlerni de çoq yahşı bilir. (Haqqa davet noqtai nazarından, insanlar uç sınıfqa ayırıla bilir. Bu ayet-i kerime bu uç sınıfqa yapılacaq davet şekliniñ bir hulâsası sayılmalıdır: 1. Aqılı selim saibi ve eşyanıñ aqiqatını ogrengen tedqiqatçı alimler. Davette «ikmet» ile davranuv bular içündir. Zira, ikmet - kesen-kes delillerdir. 2. Halqnıñ çoqluğını teşkil etken ve alâ sağlam tabiatını qorçalağan orta sınıff. Guzel ogüt bular içündir. 3. Kureşici, inat ve duşman kimseler. Kureş yolunıñ eñ guzelinen davet etilüvi istenilgenler de bulardır. Zira, unutmamaq kerek ki, Allaһ Az.Musanıñ Fıravunğa bile, yımşaq söznen davette bulunuvını emir etken)."
        cid: 0
  - verse: 126
    segments:
      - text: "Eger ceza berecek iseñiz, sizge yapılğan eskenceniñ aynısınen ceza beriñ. Amma sabır eter iseñiz, elbette o sabır etkenler içün daa hayırlıdır. (Resulullah (s.a.), Uhud cenkinde emcesi Az.Amzanı kâfirler tarafından burnı ve qulaqları kesilgen, cigeri çıqarılğan bir şekilde korgeninen: Allaһqa ant olsun ki, eger Allaһ maña zafer berse, seniñ yeriñye yetmiş adamnı boyle yapacam», diye yemin etti. Bunıñ uzerine yuqarıdaki ayet endi. Resulullah (s.a.) yeminine keffaret berdi ve onı tadbiq etmedi)."
        cid: 0
