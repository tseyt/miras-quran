surah_id: 13
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >
          Elif. Lâam. Miim. Raa. Bular Kitapnıñ ayetleridir. Saña Rabbiñden endirilgen
          haqtır, faqat insanlarnıñ çoqusı inanmazlar.
        cid: 0
  - verse: 2
    segments:
      - text: >
          Körmekte olğanıñız köklerni direksiz olaraq yükseltken, soñra Arşqa hakim olğan,
          küneşni ve aynı emrine boyun egdirgen Allahtır. (Bullarnıñ) er biri muayen bir
          vaqıtqa qadar aqıp ketmektedir.O, Rabbiñizge qavuşacağıñızğa kesen-kes olaraq
          inanuvıñız içün, er işni tertiplep, ayetlerni añlatmaqta. (Arşqa hakimlik
          aqqında bilmek içün A'raaf suresiniñ 54-nci ayetine baqıñ).
        cid: 0
  - verse: 3
    segments:
      - text: >
          Yerni töşegen, onda oturaqlı dağlar ve irmaqlar yaratqan ve o yerde bütün
          meyvalardan çift-çift yaratqan Odır. Geceni de kündüzniñ üzerine O örtmekte.
          Şübesiz, bütün bularda, tüşüngen bir toplum içün, ibretler bar. (Zemane ilmniñ
          bir keşfiyatı olğan ekinlerdeki çeçeklerniñ tozlaşuv yolunen aşlanğanı vaqiasını
          haber bergen bu ayet Qur'annıñ mucize olğanına açıq delillerden biridir).
        cid: 0
  - verse: 4
    segments:
      - text: >
          Yer yüzünde bir-birine qomuşu qıtalar, yüzüm bağları, ekinler, bir tamırdan ve
          çeşit tamırlardan dallanğan hurma terekleri bar. Bularnıñ episi bir suvnen
          suvarılır.(Böyle eken) yemişlerinde olarnıñ bir qısmını bir qısmından üstün
          yaparmız. İşte, bularda aqıllarını qullanğan bir toplum içün ibretler bar. (Bir
          topraqtan ve bir suvnen suvarılğan ekinlerden er biriniñ dadı bir-birinden çoq
          farqlı meyvalar berüvi, Allahnıñ barlığı ve qudretiniñ eñ açıq
          delillerindendir).
        cid: 0
  - verse: 5
    segments:
      - text: >
          (Resulım! Kâfirlerniñ seni yalanlavlarına) şaşa iseñ, asıl şaşılacaq şey
          olarnıñ: «Biz topraq olğan vaqtımızda ğayrıdan yaratılacaqmızmı?» deyüvleridir.
          İşte, olar Rabblerini inkâr etkenlerdir; işte, olar (qıyamet kününde)
          boyunlarında tasmalar olğanlardır. Ve olar ateş ehlidir. Olar o yerde ebediy
          qalacaqlar!
        cid: 0
  - verse: 6
    segments:
      - text: >
          (Müşrikler) senden eyilekten evel fenalıqnı çabukçe istemekteler. Albuki,
          olardan evel ibret alınacaq nice azap örnekleri kelip-keçkendir. Doğrusı,
          insanlar fenalıq etkenleri alda, Rabbiñ olar içün mağfiret saibidir. (Bunıñnen
          beraber) Rabbiñniñ azabı da çoq şiddetlidir. (Mekke müşrikleri dediler ki: «Ey,
          Allah! Eger bu Qur'an senden kelgen bir haq ise, aman üstümizge kökten bir taş
          yağdır, ya da bizge başqa accı bir azap ketir!» İşte, ayette buña işaret
          etilerek: «Senden eyilikten evel, fenalıqnı çabukçe istemekteler», denilmekte.
          Esasen olar aqiqatta azap istemey; aksine, bu sözlerinen ilâhiy azapqa
          inanmağanlarını köstermekte, peyğamberniñ tehditlerinen alay ete ediler).
        cid: 0
  - verse: 7
    segments:
      - text: >
          Kâfirler deyler ki: Oña Rabbiñden bir mucize endirilse edi ya! (Albuki) sen
          ancaq bir tenbiyecisiñ ve er toplumnıñ bir reberi bardır. (Müşrikler bilmey
          ediler ki, Allah izin bermegence, iç bir peyğamber mucize kösterip olalmaz edi.
          Ayette de ifade etilgeni kibi, peyğamberlerniñ vazifesi esasen insanlarnı
          tenbiyelemek, yañlışlardan, sapıqlıqtan ve aqsızlıqtan saqındırmaq edi).
        cid: 0
  - verse: 8
    segments:
      - text: >
          Er bir ırğaçınıñ nege yüklü olacağını, rahimlerniñ neni eksik, neni ziyade
          etecegini Allah bilir. Onıñ qatında er şey ölçünendir.
        cid: 0
  - verse: 9
    segments:
      - text: >
          O körüngenni de, körünmengenni de bilir; çoq büyüktir, yücedir.
        cid: 0
  - verse: 10
    segments:
      - text: >
          Sizden sözni gizlegennen onı aşkâr etken, geceleyin gizlengennen kündüzi yürgen
          (onıñ ilminde) musaviydir.
        cid: 0
  - verse: 11
    segments:
      - text: >
          Onıñ ögünde ve artında Allahnıñ emrinen onı qorçalağan taqipçiler (melekler)
          bardır. Bir toplum özlerindeki hususiyetlerni deñiştirgenge qadar, Allah olarda
          olğannı deñiştirmez. Allah bir toplumğa fenalıq istedimi, artıq onıñ içün artqa
          qaytmaq degen bir şey yoq. Olarnıñ Allahtan başqa yardımcıları da yoq. (Er bir
          insannıñ ögünde ve artında qorçalayıcı ve yazıcı melekler bar. Bular insannı
          qorçalağanları kibi, amellerni de yazarlar. Ayette işaret etilgen bir başqa
          husus da şu: Allah bir milletke başqalarına nisbeten bazı üstünlikler ve bazı
          nimetler bergende, o millet qopayır ve ahlâqını bozar da, o nimetke lâyıqatını
          ğayıp etse, Allah nimetni olarnıñ elinden alır. Millet özüniñ üstün degerlerini
          bozmağan müddetkece Allah bergen nimetni olarnıñ elinden almaz).
        cid: 0
  - verse: 12
    segments:
      - text: >
          O, sizge qorqu ve ümüt içinde şemşekni kösterici ve (yağmur tolu) ağır
          bulutlarnı meydanğa ketiricidir.
        cid: 0
  - verse: 13
    segments:
      - text: >
          Kök gürültisi Allahnı hamd ile tesbih eter. Melekler de Onıñ aybetinden tolayı,
          tesbih eterler. Olar Allah aqqında cenkleşip turğanda, O yıldırımlar yollar,
          olarnen tilegenini çarpar. Ve Onıñ azabı pek şeddetlidir.
        cid: 0
  - verse: 14
    segments:
      - text: >
          El açıp, yalvarmağa lâyıq olğan yalıñız Odır. Ondan başqa el açıp dua etkenleri,
          olarnıñ isteklerini iç bir şeynen qarşılamazlar. Olar ancaq ağızına kelsin dep,
          suvğa doğru eki avuçını açqan kimse kibidir. Albuki, (suvnı ağızına
          ketirmegence) suv onıñ ağızına kirecek degil. Kâfirlerniñ duası, şübesiz
          sapıqlıqtan başqa şey degil.
        cid: 0
  - verse: 15
    segments:
      - text: >
          Köklerde ve yerde olğanlar da, olarnıñ kölgeleri de, saba-aqşam, ister-istemez,
          yalıñız Allahqa secde eterler.
        cid: 0
  - verse: 16
    segments:
      - text: >
          (Resulım!) De ki: «Köklerniñ ve yerniñ Rabbi kimdir?» De ki: «Allahtır!». O alda
          de ki: «Onı bıraqıp da, özlerine fayda ya da zarar bermek küçüne saip olmağan
          dostlar taptıñızmı?» De ki: «Körnen körgen iç bir olurmı? YA da qaranlıqnen
          aydınlıq bir olurmı?» Yoqsa, onıñ yarattığı kibi yaratqan ortaqlar taptılar da,
          bu yaratuv olarğa köre, bir-birine beñzegen köründimi? De ki: Allah er şeyni
          yaratıcıdır. Ve O, birdir, qarşı turılmaycaq küç saibidir.
        cid: 0
  - verse: 17
    segments:
      - text: >
          O kökten suv endirdi de, vadiler özleriniñ acimlerince sel olup aqtı. Bu sel
          üstke çıqqan bir köpükni yüklenip alıp ketti. Süs ya da (diger eşya yapmaq
          isteyerek, ateşte iritilgen şeylerden de buña beñzegen köpük olur). İşte, Allah
          haqnen batılğa böyle misal bere. Köpük atılıp keter. İnsanlarğa fayda bergen
          şeyge kelgende, o yer yüzünde qalır. İşte, Allah böyle misaller ketire. (Allah
          Taalâ evelki ayette inanğanlarnı körgen kimsege, haqnı-aydınlıqqa;
          inanmağanlarnı kör kimsege, batılnı da, qaranlıqlara beñzetti. Bu ayette ise,
          bir başqa teşbih yaptı. Böyle ki, haq ve haq ehli - kökten engen yağmurğa; batıl
          ve batıl ehli de, suv yüzündeki köpükke beñzetilgen. Yağmur yağğanda derelerden
          suvlar aqar, insanlar ondan çeşit şekilde faydalanırlar, quruğan topraqlarğa
          ayat kelir ve topraq qatlamlarında birleşip, çoqraqlar alında fışqırır, ondan da
          insanlar faydalansalar, işte, haq ve haq ehli de, bunıñ kibi faydalıdır. Haq
          kelgende, ölgen qalpler tirilir, borsayğan vicdanlar merhametli olmaq
          hususiyetini qazanır. İman neticesinde esapsız faydalar meydanğa kelir. Batıl
          ise, selniñ yüzündeki köpükke beñzetilgen. O köpük tezde ğayıp olur-keter, iç
          bir şeyge de fayda bermez. Ayrıca, inanğanlar süs ya da başqa eşyalar yapmaq
          içün ateşte iritilgen altın, kümüş, baqır kibi madenlerge beñzetilgen ki, bular,
          aqiqaten faydalı şeylerdir. Bu madenler iritilgen vaqıtta meydanğa kelgen
          artqaçlar bar ki, olar bir degerge saip degil. İşte, batıl ve batıl ehli de
          bularğa beñzetilgen).
        cid: 0
  - verse: 18
    segments:
      - text: >
          İşte, Rabbleriniñ emrine uyğanlar içün eñ güzel (mükâfat) bardır. Oña
          uymanğanlarğa kelgende, eger yer yüzünde olğanlarnıñ episinen ve onıñ yanında
          bir qat daa özleriniñki olsa, (qurtulmaq içün) onı mıtlaqa feda eterler. İşte,
          olar bar ya, esapnıñ eñ fenası olarğadır. Baracaq yerleri de ceennemdir. O ne
          fena yataqtır!
        cid: 0
  - verse: 19
    segments:
      - text: >
          Rabbiñden saña endirilgenniñ haq olğanını bilgen kimse, (inkâr etken) kör kimse
          kibi olurmı? (Faqat bunı) yalıñız aqıl saipleri añlar.
        cid: 0
  - verse: 20
    segments:
      - text: >
          Olar Allahnıñ ahtını yerine ketirgenler ve bergen sözlerini bozmağanlardır.
        cid: 0
  - verse: 21
    segments:
      - text: >
          Olar, Allah közetilüvini emir etken şeylerni közetken, Rabblerinden saqınğan ve
          fena esaptan qorqqan kimselerdir. (Ayetteki «Allah közetilüvini emir etken
          şeyler» demek, tefsircilerge köre, aqrabalıq bağlarını devam ettirmek,
          mü'minlernen dostluq ve birlik vaziyetinde yaşamaq kibi aileviy ve içtimaiy
          vazifelerdir).
        cid: 0
  - verse: 22
    segments:
      - text: >
          Kene olar Rabbleriniñ rizasını isteyerek, sabır etken, namaznı dos-doğru qılğan,
          özlerine bergen rızıqlarımızdan gizli ve aşkâr olaraq (Allah yolunda) arclağan
          ve fenalıqnı eyiliknen uzaqlaştırğan kimselerdir. İşte, olar bar ya, dünya
          yurtunıñ (güzel) soñu sadece olarnıñdır.
        cid: 0
  - verse: 23
    segments:
      - text: >
          (O yurt) Adn cennetleridir; o yerge babalarından, çiftlerinden ve balalarından
          salih olğanlarnen beraber kirecekler, melekler de er qapudan olarnıñ yanına
          baracaqlar.
        cid: 0
  - verse: 24
    segments:
      - text: >
          (Melekler:) Sabır etkeniñizge qarşılıq, sizge selâm olsun! Dünya yurtunıñ soñu
          (cennet) ne güzel! (derler).
        cid: 0
  - verse: 25
    segments:
      - text: >
          Allahqa bergen sözlerini quvetnen pekiştirgenden soñ bozğanlar Allah riayet
          etilüvini emir etken şeylerini (aqrabalıq bağlarını) terk etkenler ve yer
          yüzünde fesat çıqarğanlar; işte, lânet olar içündir. Ve fena yurt (ceennem)
          olarnıñdır.
        cid: 0
  - verse: 26
    segments:
      - text: >
          Allah istegenine rızıqnı bollaştırır da, tarlaştırır da. Olar dünyadaki ayatınen
          maqtandılar. Albuki, ahiretniñ yanında dünya ayatı keçici bir faydadan başqa bir
          şey degil.
        cid: 0
  - verse: 27
    segments:
      - text: >
          Kâfir olğanllar deyler ki: Oña Rabbinden bir mucize endirilmeli degil edimi? De
          ki: Şübesiz, Allah istegenini sapıtır, özüne yönelgenni de hidayetke iriştirir.
        cid: 0
  - verse: 28
    segments:
      - text: >
          Bular, iman etkenler ve goñülleri Allahnıñ zikrinen sükünetke irişkenlerdir.
          Bilesiñiz ki, qalpler yalıñız Allahnı añmaqnen uzur tapar.
        cid: 0
  - verse: 29
    segments:
      - text: >
          İman etip, yahşı işler yapqanlar ne de bahtlılar! Barılacaq güzel yurt da olar
          içündir.
        cid: 0
  - verse: 30
    segments:
      - text: >
          (Ey, Muhammed! Böylece, seni özlerinden evel nice ümmetlerniñ kelip keçtigi bir
          ümmetke yolladıq ki, saña vahiy etkenimizni olarğa oquysıñ. Olar Rahmannı inkâr
          etmekteler. De ki: O, menim Rabbimdir. Ondan başqa tañrı yoqtır. Sadece, Oña
          tevekkül ettim ve dönüş, sadece Oñadır).
        cid: 0
  - verse: 31
    segments:
      - text: >
          Eger oqunğan bir Kitapnen dağlar yürütilse edi, ya da onıñnen yer parçalansa
          edi, yahut onıñnen ölüler qonuştırılsa edi, (o Kitap kene bu Qur'an olacaq edi).
          Faqat bütün işler Allahqa aittir. İman etkenler alâ bilmedilermi ki, Allah
          istese edi, bütün insanlarnı hidayetke iriştirir edi? Allahnıñ vadesi kelgenge
          qadar, inkâr etkenlerge, yapqanlarından tolayı, ya apansızdan büyük bir belâ
          kelmege devam etecek, ya da o belâ evleriniñ yaqınına enecek. Allah vadesinden
          asla dönmez. (Rivayet olunğanına köre, Resulullah (a.s.) Mekke kâfirlerine
          İslâmnı añlatqan bir künü müşriklerden Abdullah b. Umeyye el-Mahzumiy dedi ki:
          «Mekkeniñ şu eki dağı bizni çoq sıqa, bularnı bu yerden al da, yerimiz
          kenişlesin. O dağlarnıñ arasından irmaqlar aqız, ziraatqa elverişli yerler aç,
          atalarımızdan ölgen felân ve felân şahıslarnı tirilt de, söylesinler, baqayıq,
          seniñ söylegenleriñ doğrumı, yalanmı?» İşte, bunıñ üzerine yuqardaki ayet endi.
          Ve olarğa bildirildi ki, peyğamber yollamaq ve Qur'an endirmekten maqsat, bu -
          siziñ degenleriñiz degil. Bunıñnen beraber, er angi bir Kitap vastasınen öyle
          şeyler yapılacaq olsa edi, kene bu Qur'an ile yapılır edi. Amma, Qur'annıñ
          endirilüvindeki ikmet ve ğaye, er şeyden evel, insanlarnı hidayetke iriştirmek,
          qalplerni Allahnıñ zikrinen toydurmaq ve nurlandırmaqtır).
        cid: 0
  - verse: 32
    segments:
      - text: >
          Ant olsun, senden evelki peyğamberlernen de alay etildi de, men inkâr etkenlerge
          muhlet berdim, soñra da olarnı yaqaladım. (Körse ediñ ki) azabım nasıl eken.
        cid: 0
  - verse: 33
    segments:
      - text: >
          Er kesniñ qazanğanını közetip, muafaza etici, (iç böyle yapalmağan kibi
          olurmı?). Olar Allahqa ortaqlar qoştılar. De ki: «Olarğa ad beriñ (olar nedir?).
          Yoqsa, siz Allahqa yer yüzünde bilip olalmaycaq bir şeyni haber beresizmi? Yahut
          boş laf etesizmi? Doğrusı, inkâr etkenlerge iyleleri süslü kösterildi ve olar
          doğru yoldan çetletildiler. Allah kimni saptırsa, artıq onı doğru yolğa
          qavuştıracaq yoqtır.
        cid: 0
  - verse: 34
    segments:
      - text: >
          Dünya ayatında olarğa, sadece bir azap bardır. Ahiret azabı ise, daa
          şiddetlidir. Olarnı Allahtan (Onıñ azabından) qorçalaycaq kimse de yoqtır.
        cid: 0
  - verse: 35
    segments:
      - text: >
          Taqva saiplerine vade olunğan cennetniñ hususiyeti (şu): Onıñ zemininden
          irmaqlar aqar. Yemişleri ve kölgesi devamlıdır. İşte, bu, (fenalıqlardan)
          saqınganlarnıñ (bahtlı) soñudır. Kâfirlerniñ soñu ise, ateştir.
        cid: 0
  - verse: 36
    segments:
      - text: >
          Özlerine Kitap bergen kimselerimiz saña endirilgenge (Qur'anğa) sevinirler.
          Faqat (seniñ aleyhiñde birleşken) toplulıqlardan onıñ bir qısmını inkâr etken de
          bardır. De ki: «Maña, sadece Allahqa qullıq etüv ve Oña ortaq qoşmamam emir
          olundı. Men yalıñız Oña çağıram ve dönüş de, yalıñız Oñadır.
        cid: 0
  - verse: 37
    segments:
      - text: >
          Ve, böylece, biz Onı arapça bir üküm (ikmetli bir söz) olaraq endirdik. Eger
          saña kelgen bu ilimden soñ, olarnıñ isteklerine uysañ, (işte, o vaqıtta) Allah
          tarafından seniñ ne bir dostuñ, ne de qorçalayıcıñ bardır.
        cid: 0
  - verse: 38
    segments:
      - text: >
          Ant olsun, senden evel de peyğamberler yolladıq ve olarğa da zevceler ve
          evlâtlar berdik. Allahnıñ izni olmadan, iç bir peyğamber içün mucize ketirmek
          imkânı yoqtır. Er devirniñ (yazılğan) bir Kitabı bardır. (Er vaqıtnıñ ve
          devirniñ Allah qatında ayrı-ayrı bir yazısı, ikmet degeri berilgen ayrıca bir
          üküm bardır. Bu müddet içinde qurtulışqa irişmek ya da azapqa lâyıq olmaq içün,
          insanlarğa muhlet ve musaade berilgen).
        cid: 0
  - verse: 39
    segments:
      - text: >
          Allah istegenini siler, (istegenini de bıraqır). Bütün Kitaplarnıñ aslı Onıñ
          yanındadır. (Allah Taalâ ortadan qaldırmaq istegen diniy bir ükümni ortadan
          qaldırır, istegen başqa bir ükmini onıñ yerine qoyar, ya da endirgen ükümlerni
          olğanı kibi qaldırır. Kâinatta bir taqım şeylerni yoq eter eken, bazılarını da
          olğanı kibi qaldırır. Netice itibarınen, er şey Onıñ elindedir. O, daima
          istegenini yapmaq küçüne saiptir).
        cid: 0
  - verse: 40
    segments:
      - text: >
          Biz olarğa bergen vademizniñ (azabımıznıñ) bir qısmını saña köstersek de, ya da
          (ondan evel) seni öldürsek de, saña, ancaq (Allahnıñ emirlerini) tebliğ etmek
          tüşer. Esap yalıñız bizge aittir.
        cid: 0
  - verse: 41
    segments:
      - text: >
          Bizim yer yüzüne kelip, onı uclarından eksiltkenimizni körmedilermi? Allah
          (istegeni kibi) üküm eter, Onıñ ükmini bozacaq kimse yoqtır. Ve O, esapnı çabuk
          körücidir. (Ayette zikr etilgen yerniñ uclarınıñ eksiltilüvi vaqiasını evelki
          tefsirciler micaziy mananı nazar-itibarğa alaraq, kâfirler memleketleriniñ fethi
          ile olarnıñ topraqlarınıñ azaluvı, musulmanlarnıñkiniñ ise, çoqlaşuvı şeklinde
          yorumlağanlar. Ancaq, ayetniñ aqiqiy manasını köz ögüne alsaq, yerniñ uclarından
          eksiltilüvi erroziya dedigimiz topraqnıñ yağmur, sel ve rüzgâr kibi, tabiiy
          küçlerniñ tesirinen yerinden tayuvı, dağlarnıñ ve töpelerniñ erroziyası şeklinde
          yorumlana bilecegi kibi, yer qurresinde meydanğa kelgen vaqialar neticesinde
          qurre aciminiñ eksilüvi şekilde de yorumlana bilir).
        cid: 0
  - verse: 42
    segments:
      - text: >
          Olardan evelkiler de (peyğamberilerine) tuzaq qurğan ediler; albuki, bütün
          tuzaqlar Allahqa aittir. Çünki, O, er kesniñ ne qazanacağını bilir. Bu yurtnıñ
          (dünyanıñ) soñu kimniñki olğanını yaqında kâfirler bilecekler!
