      - text: >-
          (Allah Taalâ evelki ayette inanğanlarnı körgen kimsege, haqnı-aydınlıqqa;
          inanmağanlarnı kör kimsege, batılnı da, qaranlıqlara beñzetti. Bu ayette ise, bir
          başqa teşbih yaptı. Böyle ki, haq ve haq ehli - kökten engen yağmurğa; batıl ve
          batıl ehli de, suv yüzündeki köpükke beñzetilgen. Yağmur yağğanda derelerden suvlar
          aqar, insanlar ondan çeşit şekilde faydalanırlar, quruğan topraqlarğa ayat kelir ve
          topraq qatlamlarında birleşip, çoqraqlar alında fışqırır, ondan da insanlar
          faydalansalar, işte, haq ve haq ehli de, bunıñ kibi faydalıdır. Haq kelgende, ölgen
          qalpler tirilir, borsayğan vicdanlar merhametli olmaq hususiyetini qazanır. İman
          neticesinde esapsız faydalar meydanğa kelir. Batıl ise, selniñ yüzündeki köpükke
          beñzetilgen. O köpük tezde ğayıp olur-keter, iç bir şeyge de fayda bermez. Ayrıca,
          inanğanlar süs ya da başqa eşyalar yapmaq içün ateşte iritilgen altın, kümüş, baqır
          kibi madenlerge beñzetilgen ki, bular, aqiqaten faydalı şeylerdir. Bu madenler
          iritilgen vaqıtta meydanğa kelgen artqaçlar bar ki, olar bir degerge saip degil.
          İşte, batıl ve batıl ehli de bularğa beñzetilgen).
