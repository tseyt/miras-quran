        cid: 0
  - verse: 38
    segments:
      - text: "Ant olsun, senden evel de peyğamberler yolladıq ve olarğa da zevceler ve evlâtlar berdik. Allaһnıñ izni olmadan, iç bir peyğamber içün mucize ketirmek imkânı yoqtır. Er devirniñ (yazılğan) bir Kitabı bardır. (Er vaqıtnıñ ve devirniñ Allaһ qatında ayrı-ayrı bir yazısı, ikmet degeri berilgen ayrıca bir uküm bardır. Bu muddet içinde qurtulşiqa irişmek ya da azapqa lâyıq olmaq içün, insanlarğa muhlet ve musaade berilgen)."
        cid: 0
  - verse: 39
    segments:
      - text: "Allaһ istegenini siler, (istegenini de bıraqır). Butün Kitaplarnıñ aslı Onıñ yanındadır. (Allaһ Taalâ ortadan qaldırmaq istegen diniy bir ukümni ortadan qaldırır, istegen başqa bir ukmini onıñ yerine qoyar, ya da endirgen ukümlerni olğanı kibi qaldırır. Kâinatta bir taqım şeylerni yoq eter eken, bazılarını da olğanı kibi qaldırır. Netice itibarınen, er şey Onıñ elindedir. O, daima istegenini yapmaq kuçüne saiptir)."
