surah_id: 105
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "Rabbiñ fil saiplerine neler etti, kormediñmi?"
        cid: 0
  - verse: 2
    segments:
      - text: "Olarnıñ yaman qararlarını boşuna çıqrmadımı?"
        cid: 0
  - verse: 3
    segments:
      - text: "Olarnıñ ustüne ebabil quşlarını yolladı."
        cid: 0
  - verse: 4
    segments:
      - text: "O quşlar olarnıñ ustlerine pişken toladan yapılğan taşlar ata edi."
        cid: 0
  - verse: 5
    segments:
      - text: "Boylece, Allaһ olarnı aşalıp, taptalğan ekinge çevirdi."
        cid: 0