surah_id: 45
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >
          Haa. Miim.
        cid: 0
  - verse: 2
    segments:
      - text: >
          Kitap, aziz ve hakim olğan Allah tarafından endirilgendir.
        cid: 0
  - verse: 3
    segments:
      - text: >
          Şübesiz, köklerde ve yerde inanğanlar içün bir çoq ayetler bardır. (Bu ayetler
          Allahnıñ barlığını, birligini ve qudretini köstergen deliller ve işaretlerdir).
        cid: 0
  - verse: 4
    segments:
      - text: >
          Siziñ yaratılışıñızda ve (Allahnıñ) yer yüzünde yayğan canlılarında, kesen-kes
          olaraq, inanğan bir toplum içün, ibret berici işaretler bar. (Bu ibret berici
          işartelerniñ eñ belli misali insannıñ ana rahimine tüşüvinden, insan şekline
          kelüvine qadar yaratılışnıñ er devrinde körülgen meraq doğurıcı ösüşlerdir. Buña
          beñzegen misaller er canlıda mevcuttir).
        cid: 0
  - verse: 5
    segments:
      - text: >
          Geceniñ ve kündüzniñ deñişüvinde, Allahnıñ kökten endirgen rızqında (yağmurda)
          ve ölüminden soñ, yerni onıñnen tiriltüvinde, rüzgârlarnı çeşit taraflardan
          estirüvinde, aqlını qullanğan toplum içün, dersler bardır.
        cid: 0
  - verse: 6
    segments:
      - text: >
          İşte, saña, kerçek olaraq oqudığımız bular, Allahnıñ ayetleridir. Artıq,
          Allahtan ve Onıñ ayetlerinden soñ, angi sözge inanacaqlar?
        cid: 0
  - verse: 7
    segments:
      - text: >
          Vay alına, er yalancı ve günahkâr kişiniñ!
        cid: 0
  - verse: 8
    segments:
      - text: >
          O, Allahnıñ oña oqulğan ayetlerini eşitir de, soñ büyüklik taslayaraq, sanki iç
          olarnı eşitmegen kibi (küfürinde) tirelir. İşte, onı accı bir azap ile müjdele!
        cid: 0
  - verse: 9
    segments:
      - text: >
          (O) ayetlerimizden bir şey ögrengen vaqtında, olarnen alay eter. Olar içün
          alçaltıcı bir azap bar!
        cid: 0
  - verse: 10
    segments:
      - text: >
          Artlarında da ceennem bar. Qazanğan şeyleri de, Allahnı bıraqıp, tutunğan
          dostaları da, olarğa iç bir fayda bermez. Büyük azap olarğadır. (Ayetten
          añlaşılğanına köre, dünyadaki malları, evlâtları ve işlerinen tabınğan putları
          olarğa bir fayda ketiralmaycaq, azaplarından qorçalap olamaycaq).
        cid: 0
  - verse: 11
    segments:
      - text: >
          İşte, bu Qur'an bir hidayettir. Rabbleriniñ ayetlerini inkâr etkenlerge
          kelgende, olarğa eñ yamanından, elem berici bir azap bardır.
        cid: 0
  - verse: 12
    segments:
      - text: >
          Allah o (yüce) varlıqtır ki, emrinen, içinde gemilerniñ yaldavı ve lütf etip
          bergen rızıqnı qıdıruvıñız içün ve şükür etersiñiz diye, deñizni sizge azır alğa
          ketirgen.
        cid: 0
  - verse: 13
    segments:
      - text: >
          O, köklerde ve yerde ne bar ise, episini öz qatından (bir lütfi olmaq üzre)
          sizge boyun egdirgen. Elbette, bunda tüşüngen bir toplum içün ibretler bar.
        cid: 0
  - verse: 14
    segments:
      - text: >
          İman etkenlerge söyle: Allahnıñ (ceza) künleri kelecegini ümüt etmegenler
          bağışlasınlar. Çünki, Allah er toplumnı yapqanına köre cazalandıracaq. (Bu
          ayetni, cihad üküminden evel nazil oluvınen izaatlağan tefsircilernen beraber,
          bu yerde esas maqsatnıñ mü'minlerniñ şahsiy çekişüvlerden uzaq turuvlarını
          telqin etmek olğanı da bildirilgen).
        cid: 0
  - verse: 15
    segments:
      - text: >
          Kim yahşı iş yapar ise, faydası özünedir. Kim de yaman iş yapar ise, zararı kene
          özünedir. Soñ Rabbiñizge döndürileceksiñiz.
        cid: 0
  - verse: 16
    segments:
      - text: >
          Ant olsun ki, biz İsrail oğullarına kitap, üküm ve peyğamberlik berdik. Olarnı
          güzel rızıqlarnen besledik ve olarnı dünyalarğa üstün yaptıq. (Aqiqaten, İsrail
          oğullarına Tevrat endirilgen, üküm ve akimiyetleri teminlengen, Musa ve Harun
          (a.s.) kibi peyğamberler yollanılğan, böylece, zamanlarınıñ belli toplumı olğan
          ediler).
        cid: 0
  - verse: 17
    segments:
      - text: >
          Din mevzusında da olarğa açıq deliller berdik. Amma, olar özlerine ilim
          kelgenden soñ, aralarındaki asedçilikleri sebebinden, ihtilâfqa tüştiler.
          Şübesiz, Rabbiñ ihtilâfqa tüşken şeyleri aqqında qıyamet künü aralarında üküm
          berecek.
        cid: 0
  - verse: 18
    segments:
      - text: >
          Soñunda da seni din mevzusında bir şeriat saibi yaptıq. Sen oña uy;
          bilmegenlerniñ isteklerine uyma. (Qureyşniñ ileri kelgenleri Az. Peyğamberni
          devamlı olaraq, atalarınıñ dinine dönmege çağıra ve bunda israr ete ediler.
          Ayet-i kerime uyılacaq dinniñ İslâm olğanını ve başqa isteklerge qapılmamaq
          kerekligini hatırlatmaqta).
        cid: 0
  - verse: 19
    segments:
      - text: >
          Çünki, olar Allahqa nisbeten, saña iç bir fayda bermezler, doğrusı, zalımlar
          bir-birileriniñ dostlarıdır: Allah da taqva saipleriniñ dostudır.
        cid: 0
  - verse: 20
    segments:
      - text: >
          Bu (Qur'an), insanlar içün basiret nurları, kesen-kes olaraq inanğan bir toplum
          içün hidayet ve rahmettir.
        cid: 0
  - verse: 21
    segments:
      - text: >
          Yoqsa, yamanlıq yapqanlar ölümlerinde ve sağlıqlarında olarnı, inanıp yahşı
          ameller işlegen kimselernen bir tutacaqmız zan ettilermi? Ne fena üküm
          bermekteler! (Buña köre, kâfirler dünyadaki ferahlarına rağmen, ahirette azapqa
          oğraycaqlar, mü'minler de yahşı davranışlarınıñ qarşılığında saadetke
          irişecekler).
        cid: 0
  - verse: 22
    segments:
      - text: >
          Allah, köklerni ve yerni yerli-yerince yaratqan. Böylece, er kes qazançına köre
          qarşılığını körer, olarğa aqsızlıq etilmez.
        cid: 0
  - verse: 23
    segments:
      - text: >
          Arzu ve avesini tañrı etken ve Allahnıñ (öz qatındaki) bir bilgige köre,
          sapıtqan, qulağını ve qalbini müurlegen, közüniñ üstüne de perde çekken kimseni
          kördiñmi? Şimdi onı Allahtan başqa kim doğru yolğa iriştire bilir? Alâ ibret
          almaydaqsıñızmı?
        cid: 0
  - verse: 24
    segments:
      - text: >
          Dediler ki: Ayat, ancaq bu dünyada yaşağanımızdır. Ölürmiz ve yaşarmız. Bizni,
          ancaq vaqıt elâk eter. Bu hususta olarnıñ iç bir bilgisi de yoqtır. Olar, sadece
          zanğa köre üküm bermekteler. (Tirilmekni ve ahiret ayatını inkâr etken dehriyler
          (materialistler), ölümni «dehr» denilgen uzun zamanğa ya da tabiatqa bağlayaraq,
          ondan ğayrı ve üstündeki aqiqiy tesir eticisi Allahnı tanımağanlarını ifade
          eterler. Bularğa köre, ölümni gece ve kündüz, yani vaqıt azırlar. Ruhlarnı alğan
          bir ölüm melegi yoqtır, bütün vaqialar vaqıtqa esaslandırılır. Amma, olar bu
          inançnı beslerken, vaqıttan başqa iç bir delilge saip degiller).
        cid: 0
  - verse: 25
    segments:
      - text: >
          Olarğa açıq ayetlerimiz oqulğan vaqıtta: Doğru sözlü iseñiz, atalarımıznı
          ketiriñ, deyüvlerinden başqa delilleri yoqtır.
        cid: 0
  - verse: 26
    segments:
      - text: >
          De ki: Allah sizni tiriltir, soñ öldürir. Soñra sizni şübe doğurmağan qıyamet
          kününde bir yerge toplar, faqat insanlarnıñ çoqu bilmezler.
        cid: 0
  - verse: 27
    segments:
      - text: >
          Köklerniñ ve yerniñ mülki Allahnıñdır. Qıyamet qopacaq künü bar ya, işte, o künü
          batılğa sapqanlar ziyanğa oğraycaqlar.
        cid: 0
  - verse: 28
    segments:
      - text: >
          O künü er ümmetni, tiz çökken körersiñ. Er ümmet öz kitabına çağırılır. (Olarğa
          böyle denilir:) «Bu kün, yapqanlarıñıznen cezalandırılacaqsıñız!». (Ayette
          bildirilgeni kibi, er dinniñ bağlıları, Allahnıñ uzurına toplanacaq ve
          davranışları yazılğan «amel defterleri» berilmek üzre, çağırılacaq, ayrıca
          yapqanlarınıñ qarşılığı da özlerine berilecek).
        cid: 0
  - verse: 29
    segments:
      - text: >
          «Bu, yüzüñizge qarşı aqiqatnı söylegen kitabımızdır. Çünki, biz yapqanlarıñıznı
          qayd ete edik». (Amel defterni yazğan melekler insan davranışlarını başından
          soñuna qadar qayd eterler. Ayette yazılğan bu amellerniñ insannıñ aleyhine
          şaatlıq etecekleri haber berilmekte).
        cid: 0
  - verse: 30
    segments:
      - text: >
          İnanıp, yahşı işler yapqanlarğa kelgende, Rabbleri olarnı rahmetine qabul eter.
          İşte, ap-açıq qurtulış budır.
        cid: 0
  - verse: 31
    segments:
      - text: >
          Amma, inkâr etkenlerge kelgende, olarğa: Ayetlerim sizge oqulğan, siz de
          büyüklenip qabaatlı bir toplum olğan ediñiz degilmi? denilir.
        cid: 0
  - verse: 32
    segments:
      - text: >
          «Allahnıñ vadesi kerçektir, qıyamet kününe şübe yoqtır», denilgen vaqıtta:
          Qıyametniñ ne olğanını bilmeymiz, onıñ bir tahminden ibaret olğanını zan
          etmektemiz; (onıñ aqqında) kesen-kes bir bilgi elde etken degilmiz, degen
          ediñiz. (Ayette keçken vade tabiri, ölümden soñ tirilüv aqiqatı ile bağlı
          olaraq, Allahnıñ bergen sözü şeklinde yorumlanğan).
        cid: 0
  - verse: 33
    segments:
      - text: >
          Yapqan yamanlıqları olarğa körüngen, alay etip turğan şeyleri olarnı sarıp
          alğan. (Ayet, kâfirlerniñ işlegenleri ahirette aşkâr olacağı ve alayğa alğan
          azaplarınıñ aqiqatı olarnı sarıp, mahv eteceginden haber bermekte).
        cid: 0
  - verse: 34
    segments:
      - text: >
          Denilir ki: Bu künge qavuşacağıñıznı unutqanıñız kibi, biz de bugün sizni
          unutırmız. Yeriñiz ateştir, yardımcılarıñız da yoqtır!
        cid: 0
  - verse: 35
    segments:
      - text: >
          Bunıñ böyle oluv sebebi şudır: Siz Allahnıñ ayetlerini alayğa aldıñız, dünya
          ayatı sizni aldattı. Artıq bugün ateşten çıqarılmaycaqlar ve olarnıñ (Allahnı)
          hoşnut etüvleri de istenilmeycek. (Ayetten añlaşılğanına köre, azapnı
          qazanğanlar, Qur'an-ı Kerimni alayğa alğanlar ve ahiret ayatını qabul
          etmegenlerdir. Artıq bu vaziyette bularnıñ o künde tövbe ve itaatlarınıñ faydası
          toqunmaycaq).
        cid: 0
  - verse: 36
    segments:
      - text: >
          Hamd köklerniñ Rabbi, yerniñ Rabbi, bütün alemlerniñ Rabbi olğan Allahqa
          mahsustır.
        cid: 0
  - verse: 37
    segments:
      - text: >
          Köklerde ve yerde azamet yalıñız Onıñdır. O, azizdir, hakimdir.
        cid: 0
