surah_id: 45
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >-
          Haa. Miim.
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Kitap, aziz ve hakim olğan Allaһ tarafından endirilgendir.
        cid: 0
  - verse: 3
    segments:
      - text: >-
          Şubesiz, koklerde ve yerde inanğanlar içün bir çoq ayetler bardır. (Bu ayetler
          Allaһnıñ barlığını, birligini ve qudretini kostergen deliller ve işaretlerdir).
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Siziñ yaratılışıñızda ve (Allaһnıñ) yer yuzünde yayğan canlılarında, kesen-kes
          olaraq, inanğan bir toplum içün, ibret berici işaretler bar. (Bu ibret berici
          işartelerniñ eñ belli misali insannıñ ana rahimine tüşüvinden, insan şekline
          kelüvine qadar yaratılışnıñ er devrinde korülgen meraq doğurıcı osüşlerdir. Buña
          beñzegen misaller er canlıda mevcuttir).
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Geceniñ ve kundüzniñ deñişüvinde, Allaһnıñ kokten endirgen rızqında (yağmurda)
          ve olüminden soñ, yerni onıñnen tiriltüvinde, ruzgârlarnı çeşit taraflardan
          estirüvinde, aqlını qullanğan toplum içün, dersler bardır.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          İşte, saña, kerçek olaraq oqudığımız bular, Allaһnıñ ayetleridir. Artıq,
          Allaһtan ve Onıñ ayetlerinden soñ, angi sözge inanacaqlar?
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Vay alına, er yalancı ve gunahkâr kişiniñ!
        cid: 0
  - verse: 8
    segments:
      - text: >-
          O, Allaһnıñ oña oqulğan ayetlerini eşitir de, soñ buyuklik taslayaraq, sanki iç
          olarnı eşitmegen kibi (kufürinde) tirelir. İşte, onı accı bir azap ile mujdele!
        cid: 0
  - verse: 9
    segments:
      - text: >-
          (O) ayetlerimizden bir şey ogrengen vaqtında, olarnen alay eter. Olar içün
          alçaltıcı bir azap bar!
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Artlarında da ceennem bar. Qazanğan şeyleri de, Allaһnı bıraqıp, tutunğan
          dostaları da, olarğa iç bir fayda bermez. Buyuk azap olarğadır. (Ayetten
          añlaşılğanına kore, dünyadaki malları, evlâtları ve işlerinen tabınğan putları
          olarğa bir fayda ketiralmaycaq, azaplarından qorçalap olamaycaq).
        cid: 0
  - verse: 11
    segments:
      - text: >-
          İşte, bu Qur’an bir hidayettir. Rabbleriniñ ayetlerini inkâr etkenlerge
          kelgende, olarğa eñ yamanından, elem berici bir azap bardır.
        cid: 0
  - verse: 12
    segments:
      - text: >-
          Allaһ o (üce) varlıqtır ki, emrinen, içinde gemilerniñ yaldavı ve lütf etip
          bergen rızıqnı qıdıruvıñız içün ve şukür etersiñiz diye, deñizni sizge azır alğa
          ketirgen.
        cid: 0
  - verse: 13
    segments:
      - text: >-
          O, koklerde ve yerde ne bar ise, episini oz qatından (bir lütfi olmaq uzre)
          sizge boyun egdirgen. Elbette, bunda tüşüngen bir toplum içün ibretler bar.
        cid: 0
  - verse: 14
    segments:
      - text: >-
          İman etkenlerge söyle: Allaһnıñ (ceza) kunleri kelecegini umüt etmegenler
          bağışlasınlar. Çünki, Allaһ er toplumnı yapqanına kore cazalandıracaq. (Bu
          ayetni, cihad uyuyuminden evel nazil oluvınen izaatlağan tefsircilernen beraber,
          bu yerde esas maqsatnıñ mu’minlerniñ şahsiy çekişüvlerden uzaq turuvlarını
          telqin etmek olğanı da bildirilgen).
        cid: 0
  - verse: 15
    segments:
      - text: >-
          Kim yahşı iş yapar ise, faydası ozünedir. Kim de yaman iş yapar ise, zararı
          kene ozünedir. Soñ Rabbiñizge döndürileceksiñiz.
        cid: 0
  - verse: 16
    segments:
      - text: >-
          Ant olsun ki, biz İsrail oğullarına kitap, uküm ve peyğamberlik berdik. Olarnı
          guzel rızıqlarnen besledik ve olarnı dünyalarğa ustün yaptıq. (Aqiqaten, İsrail
          oğullarına Tevrat endirilgen, uküm ve akimiyetleri teminlengen, Musa ve Harun
          (a.s.) kibi peyğamberler yollanılğan, boylece, zamanlarınıñ belli toplumı olğan
          ediler).
        cid: 0
  - verse: 17
    segments:
      - text: >-
          Din mevzusında da olarğa açıq deliller berdik. Amma, olar ozlerine ilim
          kelgenden soñ, aralarındaki asedçilikleri sebebinden, ihtilâfqa tüştiler.
          Şubesiz, Rabbiñ ihtilâfqa tüşken şeyleri aqqında qıyamet kunü aralarında uküm
          berecek.
        cid: 0
  - verse: 18
    segments:
      - text: >-
          Soñunda da seni din mevzusında bir şeriat saibi yaptıq. Sen oña uy;
          bilmegenlerniñ isteklerine uyma. (Qureyşniñ ileri kelgenleri Az. Peyğamberni
          devaml olaraq, atalarınıñ dinine dönmege çağıra ve bunda israr ete ediler.
          Ayet-i kerime uyılacaq dinniñ İslâm olğanını ve başqa isteklerge qapılmamaq
          kerekligini hatırlatmaqta).
        cid: 0
  - verse: 19
    segments:
      - text: >-
          Çünki, olar Allaһqa nisbeten, saña iç bir fayda bermezler, doğrusı, zalımlar
          birbirileriniñ dostlarıdır: Allaһ da taqva saipleriniñ dostudır.
        cid: 0
  - verse: 20
    segments:
      - text: >-
          Bu (Qur’an), insanlar içün basiret nurları, kesen-kes olaraq inanğan bir toplum
          içün hidayet ve rahmettir.
        cid: 0
  - verse: 21
    segments:
      - text: >-
          Yoqsa, yamanlıq yapqanlar olümlerinde ve sağlıqlarında olarnı, inanıp yahşı
          ameller işlegen kimselernen bir tutacaqmız zan ettilermi? Ne fena uküm
          bermekteler! (Buña kore, kâfirler dünyadaki ferahlarına rağmen, ahirette azapqa
          oğraycaqlar, mu’minler de yahşı davranışlarınıñ qarşılığında saadetke
          irişecekler).
        cid: 0
  - verse: 22
    segments:
      - text: >-
          Allaһ, koklerni ve yerni yerli-yerince yaratqan. Boylece, er kes qazançına kore
          qarşılığını korer, olarğa aqsızlıq etilmez.
        cid: 0
  - verse: 23
    segments:
      - text: >-
          Arzu ve avesini tañrı etken ve Allaһnıñ (oz qatındaki) bir bilgige kore,
          sapıtqan, qulağını ve qalbini muurlegen, kozüniñ ustüne de perde çekken kimseni
          kordiñmi? Şimdi onı Allaһtan başqa kim doğru yolğa iriştire bilir? Alâ ibret
          almaydaqsıñızmı?
        cid: 0
  - verse: 24
    segments:
      - text: >-
          Dediler ki: Ayat, ancaq bu dünyada yaşağanımızdır. Olürmiz ve yaşarmız. Bizni,
          ancaq vaqıt elâk eter. Bu hususta olarnıñ iç bir bilgisi de yoqtır. Olar, sadece
          zanğa kore uküm bermekteler. (Tirilmekni ve ahiret ayatını inkâr etken dehriyler
          (materialistler), olümni «dehr» denilgen uzun zamanğa ya da tabiatqa bağlayaraq,
          ondan ğayrı ve ustündeki aqiqiy tesir eticisi Allaһnı tanımağanlarını ifade
          eterler. Bularğa kore, olümni gece ve kundüz, yani vaqıt azırlar. Ruhlarnı alğan
          bir olüm melegi yoqtır, butün vaqialar vaqıtqa esaslandırılır. Amma, olar bu
          inançnı beslerken, vaqıttan başqa iç bir delilge saip degiller).
        cid: 0
  - verse: 25
    segments:
      - text: >-
          Olarğa açıq ayetlerimiz oqulğan vaqıtta: Doğru sözlü iseñiz, atalarımıznı
          ketiriñ, deyuvlerinden başqa delilleri yoqtır.
        cid: 0
  - verse: 26
    segments:
      - text: >-
          De ki: Allaһ sizni tiriltir, soñ oldürir. Soñra sizni şube doğurmağan qıyamet
          kunünde bir yerge toplar, faqat insanlarnıñ çoqu bilmezler.
        cid: 0
  - verse: 27
    segments:
      - text: >-
          Koklerniñ ve yerniñ mulki Allaһnıñdır. Qıyamet qopacaq kunü bar ya, işte, o
          kunü batılğa sapqanlar ziyanğa oğraycaqlar.
        cid: 0
  - verse: 28
    segments:
      - text: >-
          O kunü er ummetni, tiz çökken korersiñ. Er ummet oz kitabına çağırılır. (Olarğa
          boyle denilir:) «Bu kun, yapqanlarıñıznen cezalandırılacaqsıñız!». (Ayette
          bildirilgeni kibi, er dinniñ bağlıları, Allaһnıñ uzurına toplanacaq ve
          davranışları yazılğan «amel defterleri» berilmek uzre, çağırılacaq, ayrıca
          yapqanlarınıñ qarşılığı da ozlerine berilecek).
        cid: 0
  - verse: 29
    segments:
      - text: >-
          «Bu, yuzüñizge qarşı aqiqatnı söylegen kitabımızdır. Çünki, biz yapqanlarıñıznı
          qayd ete edik». (Amel defterni yazğan melekler insan davranışlarını başından
          soñuna qadar qayd eterler. Ayette yazılğan bu amellerniñ insannıñ aleyhine
          şaatlıq etecekleri haber berilmekte).
        cid: 0
  - verse: 30
    segments:
      - text: >-
          İnanıp, yahşı işler yapqanlarğa kelgende, Rabbleri olarnı rahmetine qabul eter.
          İşte, ap-açıq kurtulış budır.
        cid: 0
  - verse: 31
    segments:
      - text: >-
          Amma, inkâr etkenlerge kelgende, olarğa: Ayetlerim sizge oqulğan, siz de
          buyuklenip qabaatlı bir toplum olğan ediñiz degilmi? denilir.
        cid: 0
  - verse: 32
    segments:
      - text: >-
          «Allaһnıñ vadesi kerçektir, qıyamet kunüne şube yoqtır», denilgen vaqıtta:
          Qıyametniñ ne olğanını bilmeymiz, onıñ bir tahminden ibaret olğanını zan
          etmektemiz; (onıñ aqqında) kesen-kes bir bilgi elde etken degilmiz, degen
          ediñiz. (Ayette keçken vade tabiri, olümden soñ tirilüv aqiqatı ile bağlı
          olaraq, Allaһnıñ bergen sözü şeklinde yorumlanğan).
        cid: 0
  - verse: 33
    segments:
      - text: >-
          Yapqan yamanlıqları olarğa korüngen, alay etip turğan şeyleri olarnı sarıp
          alğan. (Ayet, kâfirlerniñ işlegenleri ahirette aşkâr olacağı ve alayğa alğan
          azaplarınıñ aqiqatı olarnı sarıp, mahv etaceginden haber bermekte).
        cid: 0
  - verse: 34
    segments:
      - text: >-
          Denilir ki: Bu kunge qavuşacağıñıznı unutqanıñız kibi, biz de bugun sizni
          unutırmız. Yeriñiz ateştir, yardımcılarıñız da yoqtır!
        cid: 0
  - verse: 35
    segments:
      - text: >-
          Bunıñ boyle oluv sebebi şudır: Siz Allaһnıñ ayetlerini alayğa aldıñız, dünya
          ayatı sizni aldattı. Artıq bugun ateşten çıqarılmaycaqlar ve olarnıñ (Allaһnı)
          hoşnut etüvleri de istenilmeycek. (Ayetten añlaşılğanına kore, azapnı
          qazanğanlar, Qur’an-ı Kerimni alayğa alğanlar ve ahiret ayatını qabul
          etmegenlerdir. Artıq bu vaziyette bularnıñ o kunde tövbe ve itaatlarınıñ faydası
          toqunmaycaq).
        cid: 0
  - verse: 36
    segments:
      - text: >-
          Hamd koklerniñ Rabbi, yerniñ Rabbi, butün alemlerniñ Rabbi olğan Allaһqa
          mahsustır.
        cid: 0
  - verse: 37
    segments:
      - text: >-
          Koklerde ve yerde azamet yalıñız Onıñdır. O, azizdir, hakimdir.
        cid: 0