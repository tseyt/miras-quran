surah_id: 103
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >-
          Asrğa yemin eterim ki, insan, aqiqaten zarar içindedir. Bundan, ancaq iman
          etip, yahşı ameller işlegenler, bir-birilerine haqnı tevsiye etkenler ve sabırnı
          tevsiye etkenler istisnadır.
        cid: 0
