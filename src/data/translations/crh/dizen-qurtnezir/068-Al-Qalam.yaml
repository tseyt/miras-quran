surah_id: 68
language: crh
author: dizen-qurtnezir
verses:
  - verse: 3
    segments:
      - text: "İç şubesiz, sen içün bitmegen-tükenmegen bir mukâfat bar."
        cid: 0
  - verse: 4
    segments:
      - text: "Ve sen, elbette yuce bir ahlâq uzerindesiñ. 5-6. Angiñizde delilik olğanını yaqında sen de koreceksiñ, olar da."
        cid: 0
  - verse: 7
    segments:
      - text: "Doğrusı, Rabbiñ oz yolundan sapqan insannı eñ yahşı bilicidir, hidayetke irişkenlerni de eñ yahşı bilici Odır."
        cid: 0
  - verse: 8
    segments:
      - text: "O alda, (aqiqatnı) yalan sayğanlarğa boyun egme!"
        cid: 0
  - verse: 9
    segments:
      - text: "Olar isterler ki, sen yımşaq davransañ da, olar da saña yımşaq davransınlar. (Muşriklerniñ Resulullahtan tevhid kureşinde yımşaq davranuvı meselesindeki isteklerine işaret etilmekte). 10-14. (Resulım!) Çoq yemin etken, menfur, daima qusur qıdırıp, tenqit etken, toqtamadan laf taşığan, yahşılıqqa ep mani olğan, tecavuzkâr, gunahqa tatınğan, qaba ve sert, butün bulardan soñ, bir de soyzızlıqnen tamğalanğan kimselerden iç birine, malı ve oğulları bardır diye, saqın boyun egme."
        cid: 0
  - verse: 15
    segments:
      - text: "Oña ayetlerimiz oqulğan vaqıtta o: «Evelkelerniñ masalları!», der."
        cid: 0
  - verse: 16
    segments:
      - text: "Biz yaqında onıñ burnuna tamğa uracaqmız (Kibrini qırıp, rezil etecekmiz). 17-18. Biz vaqtı ile «bağça saipleri»ne belâ bergenimiz kibi, olarğa da belâ berdik. O vaqıtta olar (bağça saipleri), saba olğanda (kimse kormeden) onı (mahsullarnı) toplaycaqlarına yemin etken ediler. Olar istisna da etmey ediler. («İnşaallaaһ» demey ediler ya da yoqsullarnıñ payını ayırmay ediler). 19-20. Faqat olar daa yuquda olğanda, Rabbiñniñ qatından (öllanğan) quşatıcı bir afat (ateş) bağçanı sara qoydı da, bağça qap-qara kesildi. 21-22. (Bu tarafta ise) olar, saba olğanınen: Madem toplaycaqsıñız, aydı, erte-yarıq mahsulıñıznıñ başına barıñ! diye bir-birilerine seslendiler. 23-24. Derken: Aman, bugun o yerde iç bir yoqsul yanıñızğa soqulmasın! diye fısıldaşafısıldaşa yolğa qoyuldılar."
        cid: 0
  - verse: 25
    segments:
      - text: "(Ebet, yoqsullarğa yardımğa) kuçleri yetkeni alda, olarnı yardımdan mahrum etmek niyeti ve azmi ile erte yolğa tüştiler."
        cid: 0
  - verse: 26
    segments:
      - text: "Faqat bağçanı korgenlerinde: mıtlaqa yolumıznı şaşırğan olmalımız! dediler. (Yañlış yerge kelmegenlerini añlağanlarınen de, boyle dediler:)"
        cid: 0
  - verse: 27
    segments:
      - text: "Yoq, yoq, doğrusı, biz mahrum bıraqılğanmız!"
        cid: 0
  - verse: 28
    segments:
      - text: "Aralarından ortancıları boyle dedi: Men sizge «Rabbiñizni tesbih etseñiz ya», demegen edimmi?"
        cid: 0
  - verse: 29
    segments:
      - text: "Rabbimizni tesbih etermiz; doğrusı, biz (oz-ozümizge) yazıq etkenmiz, dediler."
        cid: 0
  - verse: 30
    segments:
      - text: "Artından qabaatnı bir-birilerine yuklemege başladılar."
        cid: 0
  - verse: 31
    segments:
      - text: "(Niayet) boyle dediler: Yazıqlar olsun bizge. Aqiqaten, biz yoldan azğan kişiler ekenmiz."
        cid: 0
  - verse: 32
    segments:
      - text: "Belki, Rabbimiz bizge bunıñ yerine daa yahşısını berir. Çünki, biz (artıq) Rabbimizni (Onıñ hoşnutlığını) arzulamaqtamız."
        cid: 0
  - verse: 33
    segments:
      - text: "İşte, azap boyledir. Ahiret azabı ise, elbette daa buyuk. Keşke bilseler edi!"
        cid: 0
  - verse: 34
    segments:
      - text: "Şu da muaqqaq ki, taqva saipleri içün Rabbleri qatında nimetleri bol cennetler bar."
        cid: 0
  - verse: 35
    segments:
      - text: "Oyle ya, (Allaһqa) teslimiyet kostergenlerni, (o) gunahkârlar kibi tutarmızmı iç?"
        cid: 0
  - verse: 36
    segments:
      - text: "Sizge ne ola? Ne şekilde uküm bermektesiñiz?"
        cid: 0
  - verse: 37
    segments:
      - text: "Yoqsa, sizge ait bir kitap bar da, (bu batıl inanuvlarnı) onda oqumaqtasıñızmı?"
        cid: 0
  - verse: 38
    segments:
      - text: "Onda, begengen er şeyiñiz siz içün mıtlaqa bardır (diye yazılımı)?"
        cid: 0
  - verse: 39
    segments:
      - text: "Yoqsa, «Ne uküm etseñiz, mıtlaqa siziñdir», diye siziñ lehiñizge, tarafımızdan berilgen, qıyamet kunüne qadar keçe bilecek kesen-kes sözler barmı?"
        cid: 0
  - verse: 40
    segments:
      - text: "Soñra olardan: Bu iddanı olarnıñ angisi mudafaa etecek?"
        cid: 0
  - verse: 41
    segments:
      - text: "Yoqsa, olarnıñ ortaqları barmı? Sözlerinde doğru iseler, aydı, ketirsinler ortaqlarını!"
        cid: 0
  - verse: 42
    segments:
      - text: "O kunü incikten açılır ve secdege davet etilirler; faqat kuçleri yetmez. (Arapçada «incikten açılmaq» demeknen, işlerniñ qıyınlaşuvı ya da butün aqiqatlarnıñ aşkâr ortağa çıquvı manasındadır)."
        cid: 0
  - verse: 43
    segments:
      - text: "Kozleri horluktan aşağı engen bir alda, olarnı zillet qaplar. Albuki, olar sapsağlam olğanda da, secdege davet etile ediler (faqat kene secde etmey ediler)."
        cid: 0
  - verse: 44
    segments:
      - text: "(Resulım!) Sen bu sözni (Qur’annı) yalan sayğannı maña bıraq (ozüñni kederlendirme). Biz olarnı bilmegen bir taraflarından yavaş-yavaş azapqa yaqlaştırmaqtamız."
        cid: 0
  - verse: 45
    segments:
      - text: "Olarğa muhlet bermektem. Doğrusı, menim fentim (tuzağım) çoq qavidir!"
        cid: 0
  - verse: 46
    segments:
      - text: "Yoqsa, sen olardan bir aq istemektesiñ de, bu sebepten, olar ağır bir borc astında qalmaqtalarmı?"
        cid: 0
  - verse: 47
    segments:
      - text: "Yahut ğaybnıñ bilgisi olarnıñ nezdinde de, olar (istegenleri kibi) yazmaqtalarmı?"
        cid: 0
  - verse: 48
    segments:
      - text: "Sen Rabbiñniñ ukmini sabırnen bekle. balıq saibi (Ünus) kibi olma, o vaqıtta o, dertli-dertli Rabbine niyaz etken edi."
        cid: 0
  - verse: 49
    segments:
      - text: "Eger Rabbinden oña bir nimet kelip yetişmegen olsa edi, o mıtlaqa azarlanacaq bir alda, kimsesiz bir ulkege atılacaq edi."
        cid: 0
  - verse: 50
    segments:
      - text: "Faqat soñunda, Rabbi onı seçti (vahiy berdi) ve onı salihlerden etti."
        cid: 0
  - verse: 51
    segments:
      - text: "O inkâr etkenler, Zikrni (Qur’annı) eşitken vaqıtlarında, az qaldı, seni kozlerinen devirecek ediler. Alâ daa (kin ve asedlerinden:) «İç şube yoq, o bir delidir», dediler."
        cid: 0
  - verse: 52
    segments:
      - text: "Albuki, o (Qur’an), alemler içün ancaq bir ogüttir."
        cid: 0