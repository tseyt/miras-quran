  - verse: 1
    segments:
      - text: Nuun.
        cid: 1
      - text: Qalemge
        cid: 2
      - text: ve (qalem tutqanlarnıñ)
        cid: 0
      - text: yazğanlarına ant olsun ki,
        cid: 4
      - text: >-
          (Resulım), sen - Rabbiñniñ nimeti sayesinde- mecnun degilsiñ. («Nuun», bir fikrge
          köre, eca ariflerindendir, manasını yalıñız Allah bilir. Bunıñ manasını bermek
          ceetine barğanlar ise, daa ziyade «Hoqqa» kelimesinen manalandırğanlar. Böylece, bu
          yerdeki yemin hoqqanen qalemge ve qalemnen yazılğanlarğa etilmektedir. Bu sureden
          evel nazil olğan Alâq suresinde de, oqumağa diqqat çekilgeni bu mananı
          tasdiqlamaqta. Müşriklerniñ evelleri Az.Peyğamberni deli-divane degenlerine cevap
          olğan 2- nci ayette ise, Resul-ı Ekremniñ Allahnıñ nimeti ile Peyğamberlik
          mertebesine irişkeni beyan etilmekte ve zaten er çeşit kemalat alâmetleri özünde
          mevcut olğan Az.Peyğamberge nisbeten bu iftirada bulunğan müşriklerniñ
          yalancılıqları yüzlerine urulmaqta).
        cid: 0
