surah_id: 50
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "Qaf. Şerefli Qur’anga ant olsun."
        cid: 0
  - verse: 2
    segments:
      - text: "Aralarından bir tenbiyeciniñ kelgenine şaştılar da, kâfirler boyle dediler: «Bu şaşılacaq bir şey». (Ayetniñ bildirgen ve inkâr etkenlerniñ şaşılacaq şey sayğan hususları tirilüv ve ceennem azabından haber berilüvidir)."
        cid: 0
  - verse: 3
    segments:
      - text: "«Biz olgen ve topraq olğan vaqtımızda (tirilecekmiz)mi? Bu, aqılğa uzaq bir dönüştir»."
        cid: 0
  - verse: 4
    segments:
      - text: "Biz, topraqnıñ olardan nelerni eksiltkenini kesen-kes bilmektemiz. Yanımızda o bilgilerni qorçalağan bir kitap bar. (Aqiqaten, ayette bildirilgeni kibi, topraqnıñ cesetlerni eksiltip bitirüvi, tirilmek olmaycağı manasına kelmey. Bunıñ ustüne, topraq dünya ayatınıñ menbası ve mayasıdır)."
        cid: 0
  - verse: 5
    segments:
      - text: "Doğrusı, olar haq ozlerine kelgeninen, yalalanladılar. Şimdi olar şaşqın bir aldadırlar. (Qur’an ya da Peyğamber kelgeninen, muşrikler bular aqqında ters fikrler bildirerek, «tılsım, tılsımcı, şiir, şair, kehanet, kâhin» kibi ifadeler qullanğan ediler. Ayet yalanlağanlarnıñ bu areketlerine işaret ete)."
        cid: 0
  - verse: 6
    segments:
      - text: "Ustlerindeki kokke baqmaylarmı ki, onı nasıl bina etken ve nasıl donatqanmız! Onda iç bir çatlaq da yoq."
        cid: 0
  - verse: 7
    segments:
      - text: "Yer yuzüni de töşedik ve oña qaviy dağlar qoydıq. O yerde goñyul açqan er çeşit (osümlikler) yetiştirdik."
        cid: 0
  - verse: 8
    segments:
      - text: "Allaһqa yonelgen er qulğa goñyul kozüni açmaq ve ibret bermek içün (butün bularnı yaptıq)."
        cid: 0
  - verse: 9
    segments:
      - text: "Kokten bereketli bir suv endirdik, onıñnen bağçalar ve orulacaq (çalınacaq) daneler ostürdik."
        cid: 0
  - verse: 10
    segments:
      - text: "Qullarğa rızıq oluvı içün, bir-birine kirişken, top-top ğonceleri olğan uzun boylu hurma terekleri yetiştirdik. Ve o suvnen olü topraqqa can berdik. İşte, ayatqa yañıdan çıqış da boyledir. (Suvnen olgen topraq canlana; tereklerge taze bir ayat kele, urluqlar yerden çıqa. İşte, insanlar da, qabirlerinden oyle çıqcaqlar)."
        cid: 0
  - verse: 12
    segments:
      - text: "Olardan evel Nuһnıñ qavmı, Rez halqı ve Semuud da yalanlağan edi."
        cid: 0
  - verse: 13
    segments:
      - text: "Aad ve Fıravunnen Luutnıñ qardaşları da (yalanladılar)."
        cid: 0
  - verse: 14
    segments:
      - text: "Eyke halqı ve Tubba’ qavmı da. Butün bular peyğamberlerini yalanladılar da, tehdidim kerçekleşti! (Ayetlerde keçken Semuud Az. Salihniñ, Aad Az. һuudnıñ, Eyke Az. Şuaybnıñ qavmları ediler. Bu yerde evelki inkârcı milletlerge kelgen azap hatırlatılaraq, Qureyşniñ vaziyetinden kederlengen Az. Peyğamber teselli etile)."
        cid: 0
  - verse: 15
    segments:
      - text: "İlki yaratuvda acizlik kosterdikmi? Yoq, olar yañı bir yaratuv hususında şube içindeler. (Allaһ ilki yaratışta acizlik kostermegenine kore, yañıdan yaratmaqtan da asla aciz degildir)."
        cid: 0
  - verse: 16
    segments:
      - text: "Ant olsun, insannı biz yarattıq ve nefsiniñ oña fısıldağanlarını bilirmiz ve biz oña şah damarından daa yaqındırmız."
        cid: 0
  - verse: 17
    segments:
      - text: "Eki melek (insannıñ) sağında ve solunda oturaraq, yapqanlarını yazmaqtadırlar."
        cid: 0
  - verse: 18
    segments:
      - text: "İnsan iç bir söz söylemez ki, yanında kozetici yazmağa azır bir melek olmasın."
        cid: 0
  - verse: 19
    segments:
      - text: "Olüm sarğoşlığı aqiqaten kelir de: İşte, (ey, insan) bu, seniñ evelden berli qaçqan şeyiñdir, denilir."
        cid: 0
  - verse: 20
    segments:
      - text: "Suurğa uflenilir; işte, bu kelmesi vade etilgen kundir."
        cid: 0
  - verse: 21
    segments:
      - text: "Er kes, yanında bir sürüci ve bir de şaatnen beraber kelir. (Ayette keçken «sürüci» ve «şaatlar»nıñ eki melek olğanı, biriniñ mahşerge yeteklev, digeriniñ de, amellerge şaatlıq etüv vazifelerini yerine ketirgenleri söylengen; ayrıca «şaat» muafazacı meleklerinden sayılğan. Bir yorumğa kore de, «sürüci» fenalıqnı yazğan melek, «şaat» da yahşılıqnı yazğan melektir)."
        cid: 0
  - verse: 22
    segments:
      - text: "Ant olsun, sen bundan ğaflette ediñ, der’al biz seniñ perdeñni aldıq. Bugun artıq kozüñ keskindir, (denilir)."
        cid: 0
  - verse: 23
    segments:
      - text: "Yanındaki arqadaşı: «İşte, yanımdaki azır, der. (Eki melekke şu emir berilir:) Aydı, ekiñiz er inatçı kâfirni, hayırğa butün kuçünen mani olğannı, yoldan azğan şubecini ceennemge atıñ; Allaһnen beraber başqa ilâh edingenni, şiddetli azapqa birlikte atıñ!"
        cid: 0
  - verse: 27
    segments:
      - text: "Muşrikniñ arqadaşı (şeytan) der ki: Rabbimiz! Men onı yoldan azdırmadım. Faqat ozü teren bir sapıqlıq içinde edi."
        cid: 0
  - verse: 28
    segments:
      - text: "O esnada (Allaһ) buyurır: Uzurımda çekkeleşmeñ. Men sizge daa evel tenbiye yollağan edim!"
        cid: 0
  - verse: 29
    segments:
      - text: "Menim uzurımda söz deñiştirilmez ve men qullarğa asla zulum etici degilim."
        cid: 0
  - verse: 30
    segments:
      - text: "O kunü ceennemge «Toldıñmı?», dermiz. O da, «Daa barmı?», der."
        cid: 0
  - verse: 31
    segments:
      - text: "Cennet de taqva saiplerine yaqlaştırılır; (olardan) uzaqta olmaycaq."
        cid: 0
  - verse: 32
    segments:
      - text: "İşte, sizge vade etilgen cennet! Ki o, Allaһqa yonelgen, emirlerine riayet etken, kormegeni alda, Rahmandan qorqqan ve Allaһqa yonelgen bir qalp ile kelgen kimselerge mahsustır."
        cid: 0
  - verse: 34
    segments:
      - text: "O yerge selâmetliknen kiriñ. İşte, bu, ebediy yaşamaqnıñ başlağan kunüdir."
        cid: 0
  - verse: 35
    segments:
      - text: "O yerde olar içün istegen er şeyleri bardır. Qatımızda ziyadesi de bar. (Soñki cumlede işaret etilgen nimetten maqsatnıñ «Allaһnı kormek» olğanı alimlerniñ çoqluğı tarafından ifade etilgen. Ayrıca, bu ziyadelik, kozler kormegen, qulaqlar eşitmegen, iç bir insannıñ hatırına kelmeycek, soñsız nimetler şeklinde de yorumlanğan)."
        cid: 0
  - verse: 36
    segments:
      - text: "Biz olardan evel olardan daa kuçlü olğan, diyar-diyar dolaşqan nice nesillerni elâk etkendirmiz. Qurtulış barmı! (“Diyar-diyar dolaşkan nice nesiller», diye tercime etilgen toplulıqlarnıñ dolaşuvlarınıñ sebebi, olümden qurtulmaq çarelerini qıdıruvlarıdır)."
        cid: 0
  - verse: 37
    segments:
      - text: "Şubesiz ki, bunda aqılı olğan, ya da azır olup, qulaq asqan kimseler içün bir ogüt bar."
        cid: 0
  - verse: 38
    segments:
      - text: "Ant olsun, biz koklerni, yerni ve ekisi arasında olğanlarnı altı kunde yarattıq. Bizni iç bir yorğunlıq basmadı. (Bu ayetnen yeudiylerniñ «Allaһ cuma ertesi kunü raatlıqqa çekildi. Arşnıñ ustüne bağdaş qurıp oturdı»», şeklindeki sözleri red etilgen. Bazı tefsircilerge kore, «Altı kun»niñ manası altı devirdir)."
        cid: 0
  - verse: 39
    segments:
      - text: "(Resulım!) Olarnıñ degenlerine sabır et. Kuneşniñ doğuvından evel de, batışından evel de, Rabbiñni hamd ile tesbih et. (Ayetnen saba, uyle ve ekindi namazlarınıñ qılınması kozde tutılğan)."
        cid: 0
  - verse: 40
    segments:
      - text: "Geceniñ bir maalinde ve secdelerniñ artından da, Onı tesbih et. (Bu ayetnen de, aqşam, yatsı ve teheccut namazlarınen farz namazlarınıñ artından qılınğan sunnet ve nafl namazlar ya da vitir namazı kozde tutulmaqta)."
        cid: 0
  - verse: 41
    segments:
      - text: "Seslengenniñ yaqın bir yerden seslenecek kunüne qulaq as. (Semadan suurğa ufleycek İsrafil (a.s.)nıñ çağıruvına işaret olunmaqta)."
        cid: 0
  - verse: 42
    segments:
      - text: "O kunü insanlar bu sesni aqiqaten eşitecekler. İşte bu, çıqış kunüdir. (Buña kore, insanlar İsrafilniñ Suurğa ekinci ufürgenini eşitecekler; işte bu ses ve eşitüvnen qabirlerinden tirilip çıqacsqlar)."
        cid: 0
  - verse: 43
    segments:
      - text: "Şubesiz, biz tiriltir ve oldürirmiz. Dönüş de ancaq bizgedir."
        cid: 0
  - verse: 44
    segments:
      - text: "O kunü yer yarılır ve olar sur’atnen çıqarlar. Bu bizge kore qolay olğan bir haşrdır."
        cid: 0
  - verse: 45
    segments:
      - text: "Biz olarnıñ degenlerini pek yahşı bilirmiz. Sen olarnıñ uzerinde bir zorlayıcı degilsiñ. Tehdidimden qorqqanlarğa Qur’annen ogüt ber."
        cid: 0