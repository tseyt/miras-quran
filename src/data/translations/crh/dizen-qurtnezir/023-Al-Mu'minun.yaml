surah_id: 23
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >
          Aqiqaten, mü'minler qurtulışqa irişkendir;
        cid: 0
  - verse: 2
    segments:
      - text: >
          Olar ki, namazlarında qorqu ve tevazu içindedirler;
        cid: 0
  - verse: 3
    segments:
      - text: >
          Olar ki, boş ve faydasız şeylerden yüz çevirirler;
        cid: 0
  - verse: 4
    segments:
      - text: >
          Olar ki, zekâtnı berirler;
        cid: 0
  - verse: 5
    segments:
      - text: >
          Ve olar ki, iffetlerini qorçalarlar;
        cid: 0
  - verse: 6
    segments:
      - text: >
          Ancaq, zevceleri ve elleri altında olğan (cariyeleri) istisna. (Bularnen
          alâqalardan tolayı) azarlanğan degillerdir.
        cid: 0
  - verse: 7
    segments:
      - text: >
          O alda, kim bundan başqasına barmaq ister ise, işte bular, adden aşqan
          kimselerdir.
        cid: 0
  - verse: 8
    segments:
      - text: >
          Kene olar (o mü'minler) ki, emanetlerine ve ahtlarına riayet eterler;
        cid: 0
  - verse: 9
    segments:
      - text: >
          Ve olar ki, namazlarına devam eterler.
        cid: 0
  - verse: 10
    segments:
      - text: >
          İşte, asıl bular varis olacaqlar;
        cid: 0
  - verse: 11
    segments:
      - text: >
          (Ebet) Firdevske varis olğan bu kimseler o yerde ebediy qalıcılardır.
        cid: 0
  - verse: 12
    segments:
      - text: >
          Ant olsun, biz insannı süzülgen bir çamurdan yarattıq.
        cid: 0
  - verse: 13
    segments:
      - text: >
          Soñ onı sağlam bir yerde nutfe alına ketirdik.
        cid: 0
  - verse: 14
    segments:
      - text: >
          Soñ nutfeni alaqa (aşlanğan yımırta) yaptıq. Artından alaqanı bir parçaçıq et
          alına ketirdik; bu bir parçaçıq etni kemiklerge (skeletke) çevirdik; bu
          kemiklerni etnen qapladıq. Soñra onı, başqa bir yaratışnen, insan alına
          ketirdik. Yapıp-yaratqanlarnıñ eñ güzeli Allah pek yücedir.
        cid: 0
  - verse: 15
    segments:
      - text: >
          Soñ, muaqqaq ki siz, bunıñ artından, elbette öleceksiñiz.
        cid: 0
  - verse: 16
    segments:
      - text: >
          Soñra da, şübesiz, sizler qıyamet kününde tekrar tiriltileceksiñiz.
        cid: 0
  - verse: 17
    segments:
      - text: >
          Ant olsun, biz siziñ üstüñizde yedi yol yarattıq. Biz yaratuvdan habersiz
          degilmiz. (Tefsircilerniñ çoqu ayetteki «yedi yol»nı yedi kök olaraq
          yorumlağanlar. Hamdi Yazır ise, bu yedi yoldan insannıñ yedi idrak yolunı
          añlağanını, bularnıñ da: körüv, eşitüv, tatuv, qoqlav ve toqunuvdan ibaret beş
          duyğunen aqıl ve vahiy yolları olğanını ileri süre).
        cid: 0
  - verse: 18
    segments:
      - text: >
          Kökten uyğun bir ölçüde yağmur endirip, onı yerde toqtattıq. Bizim onı
          ketkizmege de, elbette küçümiz yeter. (Yağmurnıñ yerde toqtavı canlılar içün
          büyük bir nimettir. Şayet yer yağmur suvını tutmayıp, olğanı kibi tüpke endirse
          ya da bu suvlar sel alında bus-bütün aqıp ketse, canlılar yağmurnıñ ayatiy
          faydalarından mahrum qalğanı kibi, eroziyadan körülgeni üzre, yağmur bazan
          zararlı da ola bilir. «Yağmur suvınıñ yerde turuvı»ndan - suvnıñ yer astında
          toplanuvı da añlaşıla bilir ki, bu da canlılar içün Allahnıñ bir lütfidir.
          Çünki, yeraltı suvları, ister tabiy olaraq qaynamaq, ister insan emeginen yüzege
          çıqarılmaq suretinen, faydalı alğa kelir. Ayette de, ifade etilgeni kibi, Allah
          Taalâ canlılar içün bu qadar faydalı olğan yağmurnı ketkizmege, yani
          yağdırmamağa ya da yağıdırsa bile, faydasız yapmağa qadirdir. Bu ise, ister
          insan, ister diger canlılar içün eñ büyük zarardır. Bunıñ kibi, sema şimdige
          qadar bilingenler arasında yağmur adisesiniñ ceryan etken yalıñız planeta -
          dünyamızdır. Bir an dünyamızda bir yağmur nimetiniñ ortadan qaldırılğanını
          tüşünecek olsaq, ayette de bildirilgeni kibi, Yüce Allah buña qadirdir, o
          vaqtıtta dünyanıñ bütün degerini ve manasını coyğanını añlarmız. Çünki, dünyağa
          deger ve mana qazandırğan şey - ayattır. Suv ise, aşağıdaki ayetlerden de
          añlaşılacağı üzre, ayatnıñ menbasıdır).
        cid: 0
  - verse: 19
    segments:
      - text: >
          Böylece, onıñ (yağmurnıñ) sayesinde siziñ faydañızğa hurma bağçaları ve yüzüm
          bağları meydanğa ketirdik. Bularda siz içün bir çoq meyvalar bar ve siz olardan
          aşarsıñız.
        cid: 0
  - verse: 20
    segments:
      - text: >
          Tuur-i Sinaada yetişken bir terek daa meydanğa ketirdik ki, bu terek em yağ, em
          de aşağanlarınıñ ötmegine qoşacaq (zeytun) berir.
        cid: 0
  - verse: 21
    segments:
      - text: >
          Ayvanlarda siz içün, elbette ibretler bardır. Olarnıñ qarınlarındakinden
          (sütlerinden) sizge içirirmiz. Olarda siz içün bir çoq faydalar daa bar;
          etlerinden de aşarsıñız.
        cid: 0
  - verse: 22
    segments:
      - text: >
          Olarnıñ üstünde ve gemilerde kezersiñiz.
        cid: 0
  - verse: 23
    segments:
      - text: >
          Ant olsun ki, Nuhnı qavmına yolladıq ve O: Ey, qavmım! Allahqa qullıq etiñ. Siz
          içün Ondan başqa bir tañrı yoq. Alâ saqınmazsıñızmı? dedi.
        cid: 0
  - verse: 24
    segments:
      - text: >
          Bunıñ üzerine, qavmınıñ inkârcı ileri kelgenleri böyle dediler: «Bu, tıpqı siziñ
          kibi, bir beşer olmaqtan başqa bir şey degil. Sizge üstün ve hakim olmaq istey.
          Eger Allah (Peyğamber yollamaq) istese edi, muaqqaq ki, melekler yollar edi. Biz
          keçmişteki atalarımızdan böyle bir şey eşitmedik».
        cid: 0
  - verse: 25
    segments:
      - text: >
          «Bu, yalıñız özünde delilik olğan bir kimsedir. Öyle ise, bir müddetke qadar oña
          qatlanıp bekleñiz, baqayıq».
        cid: 0
  - verse: 26
    segments:
      - text: >
          (Nuh:) Rabbim! dedi. Meni yalanlağanlarına qarşı maña yardım et!
        cid: 0
  - verse: 27
    segments:
      - text: >
          Bunıñ üzerine oña böyle vahiy ettik: Közlerimizniñ ögünde (muafazamız altında)
          ve bildirdigimiz şekilde gemini yasa. Bizim emrimiz kelip de, suvlar coşup,
          yükselmege başlağanınen, er cınıstan çiftler alında eki dane ve bir de
          aralarından daa evel öz aleyhinde üküm berilgenlerden ğayrı, aileñni gemige al.
          Zulum etkenler aqqında maña iç yalvarma! Zira, olar kesen-kes boğulacaqlar.
        cid: 0
  - verse: 28
    segments:
      - text: >
          Sen, yanıñdakilernen birlikte, gemige yerleşkeniñde: «Bizni zalımlar
          toplulığından qurtarğan Allahqa hamd olsun», de.
        cid: 0
  - verse: 29
    segments:
      - text: >
          Ve de ki: Rabbim! Meni bereketli bir yerge endir. Sen yerleştiricilerniñ eñ
          hayırlısısıñ.
        cid: 0
  - verse: 30
    segments:
      - text: >
          Şübesiz, bunda (Nuh ve qavmınıñ başından keçkenlerde) bir taqım ibretler bar.
          Aqiqaten, biz (qullarımıznı böyle) sınarmız.
        cid: 0
  - verse: 31
    segments:
      - text: >
          Soñ, olarnıñ artından bir başqa nesil meydanğa ketirdik.
        cid: 0
  - verse: 32
    segments:
      - text: >
          Olar arasından özlerine: «Allahqa qullıq etiñ. Siziñ Ondan başqa bir tañırınız
          yoqtır. Alâ Allahtan qorqmazsıñızmı?» (davetini yetiştirgen) bir peyğamber
          yolladıq. (Bu ayette özüniñ ve qavmınıñ adı berilmegen bu peyğamber, bazı
          tefsircilerge köre, huud (a.s.) ya da Salih (a.s.)tir).
        cid: 0
  - verse: 33
    segments:
      - text: >
          Onıñ qavmından, kâfir olup, ahiretke qavuşmaqnı inkâr etken ve dünya ayatında
          özlerine ferah berdigimiz varlıqlı adamlar: «Bu, dediler, sadece siziñ kibi bir
          insandır; siziñ aşağanıñızdan aşar, siziñ içkeniñizden içer».
        cid: 0
  - verse: 34
    segments:
      - text: >
          «Aqiqaten, siziñ kibi bir beşerge itaat etseñiz, er alda ziyan körersiñiz».
        cid: 0
  - verse: 35
    segments:
      - text: >
          «Sizge, ölgen, topraq ve kemik alına kelgeniñizde, mıtlaqa siziñ (qabirden)
          çıqarılacağıñıznı vade etilmektemi?».
        cid: 0
  - verse: 36
    segments:
      - text: >
          «Bu sizge vade olunğan (ölgenden soñ ğayrıdan tirilmek, aqiqatlıqtan) çoq uzaq!»
        cid: 0
  - verse: 37
    segments:
      - text: >
          «Ayat, şu dünya ayatımzdan ibarettir. (Kimimiz) ölürmiz, (kimimiz) yaşarmız; bir
          daa tiriltilecek de degilmiz».
        cid: 0
  - verse: 38
    segments:
      - text: >
          «Bu adam, sadece Allah aqqında yalan uydırğan bir kimsedir; biz oña inanmaymız».
        cid: 0
  - verse: 39
    segments:
      - text: >
          O peyğamber: Rabbim! dedi, meni yalanlağanlarına qarşılıq, maña yardımcı ol!
        cid: 0
  - verse: 40
    segments:
      - text: >
          Allah böyle buyurdı: Pek yaqında olar mıtlaqa peşman olacaqlar!
        cid: 0
  - verse: 41
    segments:
      - text: >
          Bunıñ kibi, yüz berüvi qaçınılmaz qorqunç bir ses yaqalay qoydı olarnı! Özlerini
          aman sel çöplügine çevirdik. Zalımlar toplulığınıñ canı ceennemge!
        cid: 0
  - verse: 42
    segments:
      - text: >
          Soñ, olarnıñ artından, başqa nesiller ketirdik.
        cid: 0
  - verse: 43
    segments:
      - text: >
          İç bir ümmet, ecelini ne ögge ala bilir, ne de artqa çeke bilir.
        cid: 0
  - verse: 44
    segments:
      - text: >
          Soñra biz ardı-ardından peyğamberlerimizni yolladıq. Er angi bir ümmetke
          peyğamberleriniñ kelgen er defasında, olar bu peyğamberni yalanladılar; biz de
          olarnı bir-biri artından yoq ettik ve olarnı ibret ikâyelerine çevirdik. Artıq
          iman etmegen qavmnıñ canı ceennemge!
        cid: 0
  - verse: 45
    segments:
      - text: >
          Soñra ayetlerimiznen ve ap-açıq bir ferman ile Musa ve qardaşı Harunnı Fıravunğa
          ve ileri kelgenlerine yolladıq. Olar ise, kibrge qapıldılar. Ve büyüklik
          taslağan bir qavm oldılar.
        cid: 0
  - verse: 46
    segments:
      - text: >
          [45 ayetine baq.]
        cid: 0
  - verse: 47
    segments:
      - text: >
          Bu sebepten, dediler ki: Qavmları bizge hızmetkârlıq eterken, biz kibi bu eki
          adamğa inanırmızmı?
        cid: 0
  - verse: 48
    segments:
      - text: >
          Böylece, olarnı yalanladılar ve bu sebepnen, elâk etilgenlerden oldılar. (47-nci
          ayet, inkârcılarnıñ umumiyetle içine tüşken bir hatanı ortağa qoymaqta:
          Aqiqaten, olar insanğa, yalıñız bu dünyadaki mevqiine, toplum içindeki
          pozitsiyağa köre deger berirler. Olarnıñ insan aqqında müim deger ölçüleri maqam
          ve mevqidir. Böylece, olar şahsen insanğa, onıñ tüşüncesiniñ ve inançınıñ
          keyfiyetine, saip olğan ahlâqiy ve insaniy faziletlerine qıymet kesmezler.
          48-nci ayet bizge köstermekte ki, inkârcılarnıñ bu yañlış deger ölçülerine
          esaslanaraq, peyğamber aqqında bergen ükümleri, qaçınılmaz olaraq, olarnı
          felâketke alıp barır).
        cid: 0
  - verse: 49
    segments:
      - text: >
          Ant olsun, biz Musağa, belki olar yolğa kelirler diye, Kitapnı berdik. (Tefsirci
          Zemahşeriyge köre, ayette «olar» zamiri ile bildirilecek mana, Fıravun ve eşraf
          taqımı olmayıp, Az. Musa ile Felestinden Mısırğa köçken İsrail oğullarıdır.
          Zira, Kitap, yani Tevrat, Fıravun ve adamlarınıñ boğuluvlarından soñ vahiy
          etilgen).
        cid: 0
  - verse: 50
    segments:
      - text: >
          Meryem oğlunı ve anasını da (qudretimizge) bir alâmet yaptıq; olarnı, yerleşüvge
          elverişli, suvı olğan bir tepege yerleştirdik.
        cid: 0
  - verse: 51
    segments:
      - text: >
          «Ey, Peyğamber! Temiz şeylerden aşañ, güzel işler yapıñ. Men siziñ
          yapqanlarıñıznı haqqı ile bilmektem». (Peyğamberlerge ve olarnıñ soñkisi olğan
          Az. Muhammedge yöneltilgen bu hitaptan, inkârcılar qanaatleriniñ aksine,
          peyğamberler de, birer insan olğanı ve olar içün, Allahnıñ lütfi olğan güzel ve
          elâl rızıqlardan faydalanuvları bir qusur olmağanını, eñ müimi ve olarğa
          yaraşqanı yahşı davranışlarda olmaq, Allahqa eñ güzel şekilde qullıq etmek
          olğanı añlaşılmaqta).
        cid: 0
  - verse: 52
    segments:
      - text: >
          «Şübesiz, bu (insanlar) tek bir ümmet olaraq, siziñ ümmetiñizdir; men de siziñ
          Rabbiñizim. Öyle ise, menden saqınıñ» (denildi).
        cid: 0
  - verse: 53
    segments:
      - text: >
          Lâkin, insanlar öz aralarındaki işlerini parça-parça böldiler. Er top özlerinde
          olğan (fikr ve areket) ile sevinip, ğururlanmaqta.
        cid: 0
  - verse: 54
    segments:
      - text: >
          Şimdi sen olarnı bir zamanğa qadar ğaflet ve sapıqlıqlarınen yüz-yüzge qaldır!
        cid: 0
  - verse: 55
    segments:
      - text: >
          Belleylermi ki, olarğa berdigimiz servet ve oğullarnen olarğa faydalar yapmaq
          içün ğayret etmektemiz? Yoq, olar işniñ farqına baralmaylar.
        cid: 0
  - verse: 56
    segments:
      - text: >
          [55 ayetine baq.]
        cid: 0
  - verse: 57
    segments:
      - text: >
          Rabblerine olğan sayğıdan tolayı, fenalıqtan saqınğanlar;
        cid: 0
  - verse: 58
    segments:
      - text: >
          Rabbleriniñ ayetlerine inanğanlar;
        cid: 0
  - verse: 59
    segments:
      - text: >
          Rabblerine ortaq qoşmağanlar;
        cid: 0
  - verse: 60
    segments:
      - text: >
          Ve Rabblerine dönecekleri içün, yapayatqan işlerini qalpleri titreyerek
          yapqanlar;
        cid: 0
  - verse: 61
    segments:
      - text: >
          İşte, olar yahşılıqlarğa çapışır ve yahşılıq içün yarışırlar.
        cid: 0
  - verse: 62
    segments:
      - text: >
          Biz iç kimseni küçüniñ yetkeninden başqasınen vazifedar yapmamız. Nezdimizde
          haqnı söylegen bir kitap bardır ve olar aqsızlıqqa oğratılmazlar.
        cid: 0
  - verse: 63
    segments:
      - text: >
          Yoq, olarnıñ (o inkârcılarnıñ) qalpleri bu hususta cealet içindedir. Ayrıca,
          olarnıñ bundan (bu şirk ve inkârcılıqlarından) başqa, bir taqım (fena) işleri
          bardır ki, olar bu işlerni yapa berirler.
        cid: 0
  - verse: 64
    segments:
      - text: >
          Eñ soñunda, ferah ve bolluq içinde olğanlarını sıqıntığa (ya da azapqa)
          oğratqanımızda, baqarsıñ ki, olar feryad qoparırlar.
        cid: 0
  - verse: 65
    segments:
      - text: >
          Boşuna sızlanmañ bugün! Zira, bizden yardım koralmaycaqsıñız!
        cid: 0
  - verse: 66
    segments:
      - text: >
          Çünki, ayetlerim sizge oqulır edi de, siz, buña qarşı kibirlenerek, arqañıznı
          çevirir, geceleyin (Kâbeniñ etrafında toplanaraq) sandıraqlay ediñiz.
        cid: 0
  - verse: 67
    segments:
      - text: >
          [66 ayetine baq.]
        cid: 0
  - verse: 68
    segments:
      - text: >
          Olar bu sözni (Qur'annı) iç tüşünmedilermi? Yoqsa, olarğa daa evel keçmişteki
          atalarına kelmegen bir şey keldimi?
        cid: 0
  - verse: 69
    segments:
      - text: >
          Yoqsa, Peyğamberlerini alâ tanımadılar da, bu sebepten, onı inkâr etelermi?
        cid: 0
  - verse: 70
    segments:
      - text: >
          Yoqsa, onda bir delilik olğanını söylemektelermi? Yoq; o, özlerine aqiqatnı
          ketirgendir, olarnıñ çoqu ise haqtan hoşlanmamaqtalar. (Bu ayetler köstermekte
          ki, inkârcılarnıñ Qur'anğa sırt çevirüvleri ve Az. Muhammedniñ peyğamberligini
          qabul etmeyüvini iç bir aqlı sebepke tayanmamaqta. Zira, olar Qur'an üzerinde
          yeterli tüşüngen ediler; ya da eñ azdan, yeterli tüşünmek fırsatını tapqan
          ediler. Ayrıca, Az. Muhammed (s.a.)niñ tebliği, meselâ ataları Az. İsmailniñ
          tebliğiniñ bir devamı edi; yani olar, Haq Dinni bus-bütün tanımağan degil
          ediler. Resulullahnıñ dürüst ve işanılacaq bir insan olğanını pek alâ bile
          ediler; aqıllı ve zeki olğanından da, şübeleri yoq edi. Bunıñnen beraber, kene
          de inanmay ediler, çünki haqtan, yani doğrulıqtan, aqiqattan ve dürüstlikten
          hoşlanmay ediler. Özleri haqqa uyacaq yerde, haqnı öz arzu-isteklerine uydurmağa
          qalqışa ediler).
        cid: 0
  - verse: 71
    segments:
      - text: >
          Eger haq, olarnıñ fena arzu ve isteklerine uysa edi, mıtlaqa kökler ve yernen
          bularda olğanlar, bozulıp keter edi. Yoq, biz olarğa şan ve şereflerini
          ketirdik; faqat olar öz şereflerine arqa çevirdiler. (Tefsircilerniñ çoquna
          köre, ayetteki şan ve şerefniñ manası buña vesile olğan Qur'andır. Bunıñ kibi,
          İslâmdan evel araplarnıñ akimiyetleri yarımadanıñ sıñırlarını aşmağan vaqıtta,
          Qur'an-ı Kerim ve bu Yüce kitap özüne engen Az. Muhammed, bu milletniñ adını
          ebediyleştirmeknen qalmağan, ayrıca Qur'an yoluna qoyulğan pek çoq milletlerni
          de, ciannıñ eñ büyük ümmetlerinden biri olmaq şerefine qavuştırğan).
        cid: 0
  - verse: 72
    segments:
      - text: >
          (Resulım!) Yoqsa, sen olardan bir aq istemektesiñmi? Rabbiñniñ berecegi daa
          hayırlıdır. O, rızıq bericilerniñ eñ hayırlısıdır.
        cid: 0
  - verse: 73
    segments:
      - text: >
          Aqiqat şu ki, sen olarnı doğru bir yolğa çağırmaqtasıñ.
        cid: 0
  - verse: 74
    segments:
      - text: >
          Ahiretke inanmağanlar ise, israrnen yoldan çıqmaqtalar.
        cid: 0
  - verse: 75
    segments:
      - text: >
          Eger olarnı acıp da, içlerinde olğan sıqıntılarını ketkizse edik, yahşıca
          soqurlaşaraq, adden aşuvda tirelir ediler.
        cid: 0
  - verse: 76
    segments:
      - text: >
          Ant olsun, biz olarnı sıqıntığa qoydıq da, kene Rabblerine boyun egmediler,
          yalvaruv ve yaqaruvda da bulunmaylar.
        cid: 0
  - verse: 77
    segments:
      - text: >
          Eñ soñunda, üzerlerine azabı çoq şiddetli bir qapu açqan vaqtımızda, bir de
          baqarsıñ ki, olar o yerde şaşmalap ve ümütsiz qalğanlardır!
        cid: 0
  - verse: 78
    segments:
      - text: >
          O, siz içün qulaqlarnı, közlerni ve goñüllerni yaratqandır. Ne de az şükür
          etesiñiz!
        cid: 0
  - verse: 79
    segments:
      - text: >
          Ve O, sizni yer yüzünde yaratıp çoqlaştırğandır. Tek Onıñ uzurında
          toplanacaqsıñız.
        cid: 0
  - verse: 80
    segments:
      - text: >
          Ve O, yaşatıcı ve öldüricidir; geceniñ ve kündüzniñ deñişüvi Onıñ eseridir. Alâ
          aqlıñıznı işletmezsiñizmi!
        cid: 0
  - verse: 81
    segments:
      - text: >
          Buña rağmen, olar evelkiler degeni kibi dediler.
        cid: 0
  - verse: 82
    segments:
      - text: >
          Dediler ki: Aqiqaten, biz ölüp de, bir topraq ve kemik obası alına kelgende,
          mıtlaqa yañıdan tiriltilecekmiz, öylemi?
        cid: 0
  - verse: 83
    segments:
      - text: >
          Aqiqaten, ister bizge, ister daa evelki atalarımızğa, böyle bir vadede
          bulunıldı; (faqat) bu keçmiştekilerniñ masallarından başqa bir şey degil!
        cid: 0
  - verse: 84
    segments:
      - text: >
          (Resulım!) De ki: Eger bile iseñiz (söyleñ baqayıq), bu dünya ve onda
          bulunğanlar kimge aittir?
        cid: 0
  - verse: 85
    segments:
      - text: >
          «Allahqa aittir», deycekler. Öyle ise, siz iç tüşünip-taşınmazsıñızmı! de.
        cid: 0
  - verse: 86
    segments:
      - text: >
          Yedi qat köklerniñ Rabbi, azametli Arşnıñ Rabbi kim? diye sora.
        cid: 0
  - verse: 87
    segments:
      - text: >
          «(Bular da) Allahnıñdır», deycekler. O alda, siz Allahtan qorqmazsıñızmı! de.
        cid: 0
  - verse: 88
    segments:
      - text: >
          Eger bile iseñiz (söyleñ), er şeyniñ melekuutu (mülkiyeti ve idaresi) öz elinde
          olğan, özü er şeyni qorçalap-qollağan, faqat közü qorçalanmağan (buña muhtac
          olmağan) kim? diye sora.
        cid: 0
  - verse: 89
    segments:
      - text: >
          «(Bularnıñ episi) Allahnıñdır», deycekler. Öyle ise, nasıl olup da, tılsımğa
          qapılasıñız? de. (Bu ayetlerden açıq añlaşılğanına köre, cahiliye devriniñ
          araplarınen, olarnıñ qalımtıları olğan inat müşrikler, esasen Allahnıñ barlığına
          ve Onıñ kâinat üzerindeki akimiyeti ve tasarrufına inana ediler. Bunıñnen
          beraber, 83-nci ayetten añlaşılğanına köre, Az. Muhammedniñ risaletine, onıñ
          tebliğ etken İslâm dinine ve Qur'an-ı Kerimge inanmay ediler. Ayrıca, 82-nci
          ayette beyan etilgeni kibi, hususen, ölgenden soñ, tekrar tirilmekni yani ahiret
          kününi qabul etmey ediler).
        cid: 0
  - verse: 90
    segments:
      - text: >
          Doğrusı, biz olarğa aqiqatnı ketirdik; olar ise, aqiqaten yalancı ediler.
        cid: 0
  - verse: 91
    segments:
      - text: >
          Allah evlât edinmegendir; Onıñnen beraber iç bir tañrı da yoqtır. Ask taqdirde,
          er tañrı özüniñ yaratqanını yöneltir ve idare eter ve mıtlaqa olardan biri
          digerinden üstün kelir edi. Allah, olarnıñ (müşriklerniñ) yaqıştırğan
          şeylerinden uzaqtır. (Körülgeni kibi, bu ayetnen birden ziyade tañrı inançı,
          kâinatnıñ yaratılışı ve çalışuvındaki tertipke ters olğanı ortağa çıqa. Buña
          köre, kâinatnıñ barlıq ve tertibindeki mükemmellik, Allahnıñ barlığı ve
          birliginiñ bir ifadesi ve delilidir).
        cid: 0
  - verse: 92
    segments:
      - text: >
          Allah ğaybnı da, şeadetni de bilicidir. O, müşriklerniñ ortaq qoşqan şeylerinden
          çoq yüce ve uzaqtır. (Ğayb ve şeadet, eki ayrı bilgi meydanını ifade eter. Ğayb
          meydanına kirgen malümat, aqıl ve duyğu azalarınıñ idrak küçüni aşqan, ancaq bir
          qısım qabiliyetlerniñ bir ölçüde seze bilgenleri, bunıñnen beraber, eñ doğru bir
          şekilde vahiy yolunen bizge kelip yetken bilgilerdir. Esasen ğayb meydanı,
          bilgiden ziyade, bir iman meydanıdır. Bunıñ kibi, Baqara suresiniñ başında da
          işaret etilgeni kibi, «Aamentuu» de ifadesini tapqan iman esasları aqqındaki
          bilgilerimiz - bu çeşit bilgilerdir. Şeadet ise, ğaybnıñ aksine, tecribe ve
          muşaade saasına kirgen duyğular - alem ile bu alemge ait eşya ve vaqialarnı
          ifade eter).
        cid: 0
  - verse: 93
    segments:
      - text: >
          (Resulım!) De ki: «Rabbim! Eger olarğa yöneltilgen tehditni (dünyaviy sıqıntını
          ve uhreviy azapnı) mıtlaqa maña kösterecek iseñ, bu vaziyette meni zalımlar
          toplulığı içinde bulundırma, Rabbim!»
        cid: 0
  - verse: 94
    segments:
      - text: >
          [93 ayetine baq.]
        cid: 0
  - verse: 95
    segments:
      - text: >
          Biz, olarğa yöneltken tehdidimizni saña köstermege, elbette ki qadirmiz.
        cid: 0
  - verse: 96
    segments:
      - text: >
          Sen fenalıqnı eñ güzel bir şekilde uzaqlaştır. Biz olarnıñ yaqıştırğan şeyini
          çoq yahşı bilmektemiz.
        cid: 0
  - verse: 97
    segments:
      - text: >
          Ve de ki: Rabbim! Şeytanlarnıñ vesveselerinden saña sığınırım!
        cid: 0
  - verse: 98
    segments:
      - text: >
          Olarnıñ yanımda bulunuvlarından da, saña sığınırım, Rabbim!
        cid: 0
  - verse: 99
    segments:
      - text: >
          Niayet, olardan (müşriklerden) birine ölüm kelip çatqanda: «Rabbim! der, meni
          keri qaytar»;
        cid: 0
  - verse: 100
    segments:
      - text: >
          «Ta ki, boşuna keçirdigim dünyada yahşı iş (ve areketler) yapayım». Yoq! Onıñ
          söylegen bu söz (boş) laftan ibarettir. Olarnıñ artında ise, ğayrıdan tirilecek
          künlerine qadar (sürgen) bir berzah bardır. (Luğatta «mani» manasına kelgen
          «berzah», ölüm ile başlap, ğayrıdan tirilmege qadar keçken vaqıtnı ifade etici
          diniy bir termindir).
        cid: 0
  - verse: 101
    segments:
      - text: >
          Suurğa üfürilgen vaqıtta, artıq aralarında aqrabalıq bağları qalmağandır;
          bir-birilerini de qıdırıp soramazlar.
        cid: 0
  - verse: 102
    segments:
      - text: >
          Artıq kimlerniñ (savap) ölçüleri ağır bassa, işte asıl bular qurtulışqa
          irişkenlerdir.
        cid: 0
  - verse: 103
    segments:
      - text: >
          Kimlerniñ de ölçüleri yengil kelse, artıq bular da, özlerine yazıq etkendirler;
          (çünki, olar) ebediy ceennemdedirler.
        cid: 0
  - verse: 104
    segments:
      - text: >
          Ateş yüzlerini yaqar; o yerde suratları çirkin ve külünçli bir alda bulunırlar.
          (Allah Taalâ büyük bir nimet olğan dünya ayatını şirknen, inkârcılıqnen ve
          fenalıqlar işleyerek keçirgenden soñ, ölümniñ deşeti qarşısında, iş-işten
          keçkeninen, uyanğan, ancaq ceennem azabına oğravdan qurtulalmağan bedbahtlarğa o
          zaman yöneltecek hitabını ve olarnıñ acizliklerini ve itiraflarını böyle ifade
          buyurır:)
        cid: 0
  - verse: 105
    segments:
      - text: >
          Sizge ayetlerim oquna edi de, siz olarnı yalanlay ediñiz degilmi?
        cid: 0
  - verse: 106
    segments:
      - text: >
          Derler ki: Rabbimiz! Yoldan azğanlığımız bizni yeñdi; biz bir sapıqlar toplulığı
          edik.
        cid: 0
  - verse: 107
    segments:
      - text: >
          Rabbimiz! Bizni bu yerden çıqar. Eger bir daa (yapqanlarımızğa) dönsek, artıq
          belli ki, biz zalım insanlarmız.
        cid: 0
  - verse: 108
    segments:
      - text: >
          Buyurır ki: Alçaldıqça alçalıñız o yerde! Maña qarşı qonuşmañız artıq!
        cid: 0
  - verse: 109
    segments:
      - text: >
          Zira, qullarımdan bir topu: Rabbimiz! Biz iman ettik; öyle ise, bizni afu et;
          bizni acı; sen, merhametlilerniñ eñ eyisisiñ, degen ediler.
        cid: 0
  - verse: 110
    segments:
      - text: >
          İşte, siz olarnı alayğa aldıñız; soñunda olar (ile alay etüviñiz), sizge meni
          yad etmekni unuttırdı, siz olarğa küle ediñiz.
        cid: 0
  - verse: 111
    segments:
      - text: >
          Bugün men olarğa sabır etkenleriniñ aqqını berdim; olar aqiqaten muratlarına
          irişkenlerdir.
        cid: 0
  - verse: 112
    segments:
      - text: >
          (Allah inkârcılarğa:) «Yer yüzünde qaç yıl qaldıñız?», diye sorar.
        cid: 0
  - verse: 113
    segments:
      - text: >
          «Bir kün ya da künniñ bir qısmı qadar qaldıq. İşte, sayğanlardan sora», dediler.
        cid: 0
  - verse: 114
    segments:
      - text: >
          Buyurır: Sadece az bir müddet qaldıñız; keşke siz (bunı) bilgen olsa ediñiz!
        cid: 0
  - verse: 115
    segments:
      - text: >
          Sizni sadece boşuna yarattıq ve siz aqiqaten uzurımızğa keri ketirilmeyceksiñiz
          sandıñızmı? (Ayetten de añlaşılğanına köre, dünyadaki, bütün canlılar arasında
          vazife ve mesuliyet taşığan yekâne varlıq insandır. Esasen insan ayatını manalı
          yapqan, oña deger qatqan temel hususiyet, insannıñ bir vazife ve mesuliyet
          varlığı olğanıdır. Bu sebeple, vazifelerini becermegen ve mesuliyetsiz bir ayat
          keçirgen insanlar, aqiqiy manada, insanlıq degerini coyarlar. Bu dünyada bir
          qısım insanlar insanlıqqa kerek vazifelerni coyğan ve bularnıñ mesuliyetinden
          qurtulğan ola bilirler. Ancaq, yuqarıdaki ayet açıq köstere ki, ilâhiy
          mesuliyetlikten qurtulmaq ve Allah uzurında esap berüvden qaçmaq iç kimse içün
          mümkün degil. Bunıñ aksini tüşünmek, ahlâq nizamını ve bu nizamnıñ temeli olğan
          mutlaq adaletni inkâr etüvge alıp barır).
        cid: 0
  - verse: 116
    segments:
      - text: >
          Mutlaq hakim ve haq olğan Allah çoq yücedir. Ondan başqa tañrı yoqtır. O, yüce
          Arşnıñ saibidir.
        cid: 0
  - verse: 117
    segments:
      - text: >
          Er kim Allah ile birlikte diger bir tañrığa tabınsa, -ki, bu hususnen bağlı iç
          bir delili yoqtır- o kimseniñ esabı ancaq Rabbiniñ nezdindedir. Şu yeri muaqqaq
          ki, kâfirler qurtulışqa irişmezler.
        cid: 0
  - verse: 118
    segments:
      - text: >
          (Resulım!) De ki: Bağışla ve merhamet et, Rabbim! Sen merhametlilerniñ eñ
          eyisisiñ.
        cid: 0
