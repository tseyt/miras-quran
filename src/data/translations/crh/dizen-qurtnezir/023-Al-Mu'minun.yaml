        cid: 0
  - verse: 95
    segments:
      - text: "«(Bularnıñ episi) Allaһnıñdır», deycekler. Oyle ise, nasıl olup da, tılsımğa qapılasıñız? de. (Bu ayetlerden açıq añlaşılğanına kore, cahiliye devriniñ araplarınen, olarnıñ qalmmtıları olğan inat muşrikler, esasen Allaһnıñ barlığına ve Onıñ kâinat uzerindeki akimiyeti ve tasarrufına inana ediler. Bunıñnen beraber, 83-nci ayetten añlaşılğanına kore, Az. Muһammedniñ risaletine, onıñ tebliğ etken İslâm dinine ve Qur’an-ı Kerimge inanmay ediler. Ayrıca, 82-nci ayette beyan etilgeni kibi, hususen, olgenden soñ, tekrar tirilmekni yani ahiret kunüni qabul etmey ediler)."
        cid: 0
  - verse: 96
    segments:
      - text: "Doğrusı, biz olarğa aqiqatnı ketirdik; olar ise, aqiqaten yalancı ediler."
        cid: 0
  - verse: 97
    segments:
      - text: "Allaһ evlât edinmegendir; Onıñnen beraber iç bir tañrı da yoqtır. Ask taqdirde, er tañrı ozüniñ yaratqanını yoneltir ve idare eter ve mıtlaqa olardan biri digerinden ustün kelir edi. Allaһ, olarnıñ (muşriklerniñ) yaqıştırğan şeylerinden uzaqtır. (Korülgeni kibi, bu ayetnen birden ziyade tañrı inançı, kâinatnıñ yaratılışı ve çalşuvındaki tertipke ters olğanı ortağa çıqa. Buña kore, kâinatnıñ barlıq ve tertibindeki mukemellik, Allaһnıñ barlığı ve birliginiñ bir ifadesi ve delilidir)."
        cid: 0
  - verse: 98
    segments:
      - text: "Allaһ ğaybnı da, şeadetni de bilicidir. O, muşriklerniñ ortaq qoşqan şeylerinden çoq yuce ve uzaqtır. (Ğayb ve şeadet, eki ayrı bilgi meydanını ifade eter. Ğayb meydanına kirgen malümat, aqıl ve duyğu azalarınıñ idrak kuçüni aşqan, ancaq bir qısım qabiliyetlerniñ bir olçüde seze bilgenleri, bunıñnen beraber, eñ doğru bir şekilde vahiy yolunen bizge kelip yetken bilgilerdir. Esasen ğayb meydanı, bilgiden ziyade, bir iman meydanıdır. Bunıñ kibi, Baqara suresiniñ başında da işaret etilgeni kibi, «Aamentuu» de ifadesini tapqan iman esasları aqqındaki bilgilerimiz - bu çeşit bilgilerdir. Şeadet ise, ğaybnıñ aksine, tecribe ve muşaade saasına kirgen duyğular - alem ile bu alemge ait eşya ve vaqialarnı ifade eter)."
