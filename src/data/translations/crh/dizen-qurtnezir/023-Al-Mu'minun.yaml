          olğanını ileri süre).
        cid: 0
  - verse: 18
    segments:
      - text: Kökten uyğun
        cid: 3
      - text: bir ölçüde yağmur
        cid: 5
      - text: endirip,
        cid: 1
      - text: onı
        cid: 6
      - text: yerde toqtattıq.
        cid: 8
      - text: Bizim onı ketkizmege de,
        cid: 12
      - text: elbette küçümiz yeter.
        cid: 9
      - text: >-
          (Yağmurnıñ yerde toqtavı canlılar içün büyük bir nimettir. Şayet yer yağmur suvını
          tutmayıp, olğanı kibi tüpke endirse ya da bu suvlar sel alında bus-bütün aqıp ketse,
          canlılar yağmurnıñ ayatiy faydalarından mahrum qalğanı kibi, eroziyadan körülgeni
          üzre, yağmur bazan zararlı da ola bilir. «Yağmur suvınıñ yerde turuvı»ndan - suvnıñ
          yer astında toplanuvı da añlaşıla bilir ki, bu da canlılar içün Allahnıñ bir
          lütfidir. Çünki, yeraltı suvları, ister tabiy olaraq qaynamaq, ister insan emeginen
          yüzege çıqarılmaq suretinen, faydalı alğa kelir. Ayette de, ifade etilgeni kibi,
          Allah Taalâ canlılar içün bu qadar faydalı olğan yağmurnı ketkizmege, yani
          yağdırmamağa ya da yağıdırsa bile, faydasız yapmağa qadirdir. Bu ise, ister insan,
          ister diger canlılar içün eñ büyük zarardır. Bunıñ kibi, sema şimdige qadar
          bilingenler arasında yağmur adisesiniñ ceryan etken yalıñız planeta - dünyamızdır.
          Bir an dünyamızda bir yağmur nimetiniñ ortadan qaldırılğanını tüşünecek olsaq,
          ayette de bildirilgeni kibi, Yüce Allah buña qadirdir, o vaqtıtta dünyanıñ bütün
          degerini ve manasını coyğanını añlarmız. Çünki, dünyağa deger ve mana qazandırğan
          şey - ayattır. Suv ise, aşağıdaki ayetlerden de añlaşılacağı üzre, ayatnıñ
          menbasıdır).
        cid: 0
