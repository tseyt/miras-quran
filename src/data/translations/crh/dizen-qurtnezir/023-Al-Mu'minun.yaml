surah_id: 23
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "Aqiqaten, mu’minler qurtulışqa irişkendir;"
        cid: 0
  - verse: 2
    segments:
      - text: "Olar ki, namazlarında qorqu ve tevazu içindedirler;"
        cid: 0
  - verse: 3
    segments:
      - text: "Olar ki, boş ve faydasız şeylerden yuz çevirirler;"
        cid: 0
  - verse: 4
    segments:
      - text: "Olar ki, zekâtnı berirler;"
        cid: 0
  - verse: 5
    segments:
      - text: "Ve olar ki, iffetlerini qorçalarlar;"
        cid: 0
  - verse: 6
    segments:
      - text: "Ancaq, zevceleri ve elleri altında olğan (cariyeleri) istisna. (Bularnen alâqalardan tolayı) azarlanğan degillerdir."
        cid: 0
  - verse: 7
    segments:
      - text: "O alda, kim bundan başqasına barmaq ister ise, işte bular, adden aşqan kimselerdir."
        cid: 0
  - verse: 8
    segments:
      - text: "Kene olar (o mu’minler) ki, emanetlerine ve ahtlarına riayet eterler;"
        cid: 0
  - verse: 9
    segments:
      - text: "Ve olar ki, namazlarına devam eterler."
        cid: 0
  - verse: 10
    segments:
      - text: "İşte, asıl bular varis olacaqlar;"
        cid: 0
  - verse: 11
    segments:
      - text: "(Ebet) Firdevske varis olğan bu kimseler o yerde ebediy qalıcılardır."
        cid: 0
  - verse: 12
    segments:
      - text: "Ant olsun, biz insannı süzülgen bir çamurdan yarattıq."
        cid: 0
  - verse: 13
    segments:
      - text: "Soñ onı sağlam bir yerde nutfe alına ketirdik."
        cid: 0
  - verse: 14
    segments:
      - text: "Soñ nutfeni alaqa (aşlanğan yımırta) yaptıq. Artından alaqanı bir parçaçıq et alına ketirdik; bu bir parçaçıq etni kemiklerge (skeletke) çevirdik; bu kemiklerni etnen qapladıq. Soñra onı, başqa bir yaratışnen, insan alına ketirdik. Yapıp-yaratqanlarnıñ eñ guzeli Allaһ pek yucedir."
        cid: 0
  - verse: 15
    segments:
      - text: "Soñ, muaqqaq ki siz, bunıñ artından, elbette oleceksiñiz."
        cid: 0
  - verse: 16
    segments:
      - text: "Soñra da, şubesiz, sizler qıyamet kunünde tekrar tiriltileceksiñiz."
        cid: 0
  - verse: 17
    segments:
      - text: "Ant olsun, biz siziñ ustüñizde yedi yol yarattıq. Biz yaratuvdan habersiz degilmiz. (Tefsircilerniñ çoqu ayetteki «edi yol»nı yedi kok olaraq yorumlağanlar. Hamdi Yazır ise, bu yedi yoldan insannıız yedi idrak yolunı añlağanını, bularnıız da: korüv, eşitüv, tatuv, qoqlav ve toqunuvdan ibaret beş duyğunen aqıl ve vahiy yolları olğanını ileri süre)."
        cid: 0
  - verse: 18
    segments:
      - text: "Kokten uyğun bir olçüde yağmur endirip, onı yerde toqtattıq. Bizim onı ketkizmege de, elbette kuçümiz yeter. (Yağmurnıñ yerde toqtavı canlılar içün buyuk bir nimettir. Şayet yer yağmur suvını tutmayıp, olğanı kibi tüpke endirse ya da bu suvlar sel alında bus-butün aqıp ketse, canlılar yağmurnıñ ayatiy faydalarından mahrum qalğanı kibi, eroziyadan korülgeni uzre, yağmur bazan zararl da ola bilir. «Yağmur suvınıız yerde turuvı»ndan - suvnıız yer astında toplanuvı da añlaşıla bilir ki, bu da canlılar içün Allaһnıı bir lütfidir. Çünki, yeraltı suvları, ister tabiy olaraq qaynamaq, ister insan emeginen yuzege çıqarılmaq suretinen, faydal alğa kelir. Ayette de, ifade etilgeni kibi, Allaһ Taalâ canlılar içün bu qadar faydall olğan yağmurnı ketkizmege, yani yağdırmamağa ya da yağıdırsa bile, faydasız yapmağa qadirdir. Bu ise, ister insan, ister diger canlılar içün eñ buyuk zarardır. Bunıñ kibi, sema şimdige qadar bilingenler arasında yağmur adisesiniñ ceryan etken yalıñız planeta - dünyamızdır. Bir an dünyamızda bir yağmur nimetiniñ ortadan qaldırılğanını tüşünecek olsaq, ayette de bildirilgeni kibi, Yuce Allaһ buña qadirdir, o vaqtıtta dünyanıız butün degerini ve manasını coyğanını añlarmız. Çünki, dünyağa deger ve mana qazandırğan şey - ayattır. Suv ise, aşağıdaki ayetlerden de añlaşılacağı uzre, ayatnıñ menbasıdır)."
        cid: 0
  - verse: 19
    segments:
      - text: "Boylece, onıñ (yağmurnıñ) sayesinde siziñ faydañızğa hurma bağçaları ve yuzüm bağları meydanğa ketirdik. Bularda siz içün bir çoq meyvalar bar ve siz olardan aşarsıñız."
        cid: 0
  - verse: 20
    segments:
      - text: "Tuur-i Sinaada yetişken bir terek daa meydanğa ketirdik ki, bu terek em yağ, em de aşağanlarınıñ otmegine qoşacaq (zeytun) berir."
        cid: 0
  - verse: 21
    segments:
      - text: "Ayvanlarda siz içün, elbette ibretler bardır. Olarnıñ qarınlarındakinden (sütlerinden) sizge içirirmiz. Olarda siz içün bir çoq faydalar daa bar; etlerinden de aşarsıñız."
        cid: 0
  - verse: 22
    segments:
      - text: "Olarnıñ ustünde ve gemilerde kezersiñiz."
        cid: 0
  - verse: 23
    segments:
      - text: "Ant olsun ki, Nuhnı qavmına yolladıq ve O: Ey, qavmım! Allaһqa qullıq etiñ. Siz içün Ondan başqa bir tañrı yoq. Alâ saqınmazsıñızmı? dedi."
        cid: 0
  - verse: 24
    segments:
      - text: "Bunıñ uzerine, qavmınıñ inkârcı ileri kelgenleri boyle dediler: «Bu, tıpqı siziñ kibi, bir beşer olmaqtan başqa bir şey degil. Sizge ustün ve hakim olmaq istey. Eger Allaһ (Peyğamber yollamaq) istese edi, muaqqaq ki, melekler yollar edi. Biz keçmnşteki atalarımızdan boyle bir şey eşitmedik»."
        cid: 0
  - verse: 25
    segments:
      - text: "«Bu, yalıñız ozünde delilik olğan bir kimsedir. Oyle ise, bir muddetke qadar oña qatlanıp bekleñiz, baqayıq»."
        cid: 0
  - verse: 26
    segments:
      - text: "(Nuh:) Rabbim! dedi. Meni yalanlağanlarına qarşı maña yardım et!"
        cid: 0
  - verse: 27
    segments:
      - text: "Bunıñ uzerine oña boyle vahiy ettik: Kozlerimizniñ ogünde (muafazamız altında) ve bildirdigimiz şekilde gemini yasa. Bizim emrimiz kelip de, suvlar coşup, yukselmege başlağanınen, er cınıstan çiftler alında eki dane ve bir de aralarından daa evel oz aleyhinde uküm berilgenlerden ğayrı, aileñni gemige al. Zulum etkenler aqqında maña iç yalvarma! Zira, olar kesen-kes boğulacaqlar."
        cid: 0
  - verse: 28
    segments:
      - text: "Sen, yanıñdakilernen birlikte, gemige yerleşkeniñde: «Bizni zalımlar toplulığından qurtarğan Allaһqa hamd olsun», de."
        cid: 0
  - verse: 29
    segments:
      - text: "Ve de ki: Rabbim! Meni bereketli bir yerge endir. Sen yerleştiricilerniñ eñ hayırlısısıñ."
        cid: 0
  - verse: 30
    segments:
      - text: "Şubesiz, bunda (Nuһ ve qavmınıñ başından keçkenlerde) bir taqım ibretler bar. Aqiqaten, biz (qullarımıznı boyle) sınarmız."
        cid: 0
  - verse: 31
    segments:
      - text: "Soñ, olarnıñ artından bir başqa nesil meydanğa ketirdik."
        cid: 0
  - verse: 32
    segments:
      - text: "Olar arasından ozlerine: «Allaһqa qullıq etiñ. Siziñ Ondan başqa bir tañırınız yoqtır. Alâ Allaһtan qorqmazsıñızmı?» (davetini yetiştirgen) bir peyğamber yolladıq. (Bu ayette ozüniñ ve qavmınını adı berilmegen bu peyğamber, bazı tefsircilerge kore, һuud (a.s.) ya da Salih (a.s.)tir)."
        cid: 0
  - verse: 33
    segments:
      - text: "Onıñ qavmından, kâfir olup, ahiretke qavuşmaqnı inkâr etken ve dünya ayatında ozlerine ferah berdigimiz varlıqlı adamlar: «Bu, dediler, sadece siziñ kibi bir insandır; siziñ aşağanıñızdan aşar, siziñ içkeniñizden içer»."
        cid: 0
  - verse: 34
    segments:
      - text: "«Aqiqaten, siziñ kibi bir beşerge itaat etseñiz, er alda ziyan korersiñiz»."
        cid: 0
  - verse: 35
    segments:
      - text: "«Sizge, olgen, topraq ve kemik alına kelgeniñizde, mıtlaqa siziñ (qabirden) çıqarılacağıñıznı vade etilmektemi?»."
        cid: 0
  - verse: 36
    segments:
      - text: "«Bu sizge vade olunğan (olgenden soñ ğayrıdan tirilmek, aqiqatlıqtan) çoq uzaq!»"
        cid: 0
  - verse: 37
    segments:
      - text: "«Ayat, şu dünya ayatımzdan ibarettir. (Kimimiz) olürmiz, (kimimiz) yaşarmız; bir daa tiriltilecek de degilmiz»."
        cid: 0
  - verse: 38
    segments:
      - text: "«Bu adam, sadece Allaһ aqqında yalan uydırğan bir kimsedir; biz oña inanmaymız»."
        cid: 0
  - verse: 39
    segments:
      - text: "O peyğamber: Rabbim! dedi, meni yalanlağanlarına qarşılıq, maña yardımcı ol!"
        cid: 0
  - verse: 40
    segments:
      - text: "Allaһ boyle buyurdı: Pek yaqında olar mıtlaqa peşman olacaqlar!"
        cid: 0
  - verse: 41
    segments:
      - text: "Bunıñ kibi, yuz berüvi qaçınılmaz qorqunç bir ses yaqalay qoydı olarnı! Ozlerini aman sel çöplügine çevirdik. Zalımlar toplulığınıñ canı ceennemge!"
        cid: 0
  - verse: 42
    segments:
      - text: "Soñ, olarnıñ artından, başqa nesiller ketirdik."
        cid: 0
  - verse: 43
    segments:
      - text: "İç bir ummet, ecelini ne ogge ala bilir, ne de artqa çeke bilir."
        cid: 0
  - verse: 44
    segments:
      - text: "Soñra biz ardı-ardından peyğamberlerimizni yolladıq. Er angi bir ummetke peyğamberleriniñ kelgen er defasında, olar bu peyğamberni yalanladılar; biz de olarnı bir-biri artından yoq ettik ve olarnı ibret ikâyelerine çevirdik. Artıq iman etmegen qavmnıñ canı ceennemge!"
        cid: 0
  - verse: 45
    segments:
      - text: "Soñra ayetlerimiznen ve ap-açıq bir ferman ile Musa ve qardaşı Harunnı Fıravunğa ve ileri kelgenlerine yolladıq. Olar ise, kibrge qapıldılar. Ve buyuklik taslağan bir qavm oldılar."
        cid: 0
  - verse: 46
    segments:
      - text: "[45 ayetine baq.]"
        cid: 0
  - verse: 47
    segments:
      - text: "Bu sebepten, dediler ki: Qavmları bizge hızmetkârlıq eterken, biz kibi bu eki adamğa inanırmızmı?"
        cid: 0
  - verse: 48
    segments:
      - text: "Boylece, olarnı yalanladılar ve bu sebepnen, elâk etilgenlerden oldılar. (47-nci ayet, inkârcılarnıñ umumiyetle içine tüşken bir hatanı ortağa qoymaqta: Aqiqaten, olar insanğa, yalıñız bu dünyadaki mevqiine, toplum içindeki pozitsiyağa kore deger berirler. Olarnıñ insan aqqında muim deger olçüleri maqam ve mevqidir. Boylece, olar şahsen insanğa, onıñ tüşüncesiniñ ve inançınıñ keyfiyetine, saip olğan ahlâqiy ve insaniy faziletlerine qıymet kesmezler. 48-nci ayet bizge kostermekte ki, inkârcılarnıñ bu yañlış deger olçülerine esaslanaraq, peyğamber aqqında bergen ukümleri, qaçınılmaz olaraq, olarnı felâketke alıp barır)."
        cid: 0
  - verse: 49
    segments:
      - text: "Ant olsun, biz Musağa, belki olar yolğa kelirler diye, Kitapnı berdik. (Tefsirci Zemahşeriyge kore, ayette «olar» zamiri ile bildirilecek mana, Fıravun ve eşraf taqımı olmayıp, Az. Musa ile Felestinden Mısırğa koçken İsrail oğullarıdır. Zira, Kitap, yani Tevrat, Fıravun ve adamlarınıñ boğuluvlarından soñ vahiy etilgen)."
        cid: 0
  - verse: 50
    segments:
      - text: "Meryem oğlunı ve anasını da (qudretimizge) bir alâmet yaptıq; olarnı, yerleşüvge elverişli, suvı olğan bir tepege yerleştirdik."
        cid: 0
  - verse: 51
    segments:
      - text: "«Ey, Peyğamber! Temiz şeylerden aşañ, guzel işler yapıñ. Men siziñ yapqanlarıñıznı haqqı ile bilmektem». (Peyğamberlerge ve olarnıñ soñkisi olğan Az. Muһammedge yoneltilgen bu hitaptan, inkârcılar qanaatleriniñ aksine, peyğamberler de, birer insan olğanı ve olar içün, Allaһnıñ lütfi olğan guzel ve elâl rızıqlardan faydalanuvları bir qusur olmağanını, eñ muimi ve olarğa yaraşqanı yahşı davranışlarda olmaq, Allaһqa eñ guzel şekilde qullıq etmek olğanı añlaşılmaqta)."
        cid: 0
  - verse: 52
    segments:
      - text: "«Şubesiz, bu (insanlar) tek bir ummet olaraq, siziñ ummetiñizdir; men de siziñ Rabbiñizim. Oyle ise, menden saqınıñ» (denildi)."
        cid: 0
  - verse: 53
    segments:
      - text: "Lâkin, insanlar oz aralarındaki işlerini parça-parça boldiler. Er top ozlerinde olğan (fikr ve areket) ile sevinip, ğururlanmaqta."
        cid: 0
  - verse: 54
    segments:
      - text: "Şimdi sen olarnı bir zamanğa qadar ğaflet ve sapıqlıqlarınen yuz-yuzge qaldır!"
        cid: 0
  - verse: 57
    segments:
      - text: "Belleylermi ki, olarğa berdigimiz servet ve oğullarnen olarğa faydalar yapmaq içün ğayret etmektemiz? Yoq, olar işniñ farqına baralmaylar."
        cid: 0
  - verse: 58
    segments:
      - text: "[57 ayetine baq.]"
        cid: 0
  - verse: 59
    segments:
      - text: "Rabblerine olğan sayğıdan tolayı, fenalıqtan saqınğanlar;"
        cid: 0
  - verse: 60
    segments:
      - text: "Rabbleriniñ ayetlerine inanğanlar;"
        cid: 0
  - verse: 61
    segments:
      - text: "Rabblerine ortaq qoşmağanlar;"
        cid: 0
  - verse: 62
    segments:
      - text: "Ve Rabblerine dönecekleri içün, yapayatqan işlerini qalpleri titreyerek yapqanlar;"
        cid: 0
  - verse: 63
    segments:
      - text: "İşte, olar yahşılıqlarğa çapışır ve yahşılıq içün yarışırlar."
        cid: 0
  - verse: 64
    segments:
      - text: "Biz iç kimseni kuçüniñ yetkeninden başqasınen vazifedar yapmamız. Nezdimizde haqnı söylegen bir kitap bardır ve olar aqsızlıqqa oğratılmazlar."
        cid: 0
  - verse: 65
    segments:
      - text: "Yoq, olarnıñ (o inkârcılarnıñ) qalpleri bu hususta cealet içindedir. Ayrıca, olarnıñ bundan (bu şirk ve inkârcılıqlarından) başqa, bir taqım (fena) işleri bardır ki, olar bu işlerni yapa berirler."
        cid: 0
  - verse: 66
    segments:
      - text: "Eñ soñunda, ferah ve bolluq içinde olğanlarını sıqıntığa (ya da azapqa) oğratqanımızda, baqarsıñ ki, olar feryad qoparırlar."
        cid: 0
  - verse: 67
    segments:
      - text: "Boşuna sızlanmañ bugun! Zira, bizden yardım koralmaycaqsıñız!"
        cid: 0
  - verse: 72
    segments:
      - text: "Çünki, ayetlerim sizge oqulır edi de, siz, buña qarşı kibirlenerek, arqañıznı çevirir, geceleyin (Kâbeniñ etrafında toplanaraq) sandıraqlay ediñiz."
        cid: 0
  - verse: 73
    segments:
      - text: "[72 ayetine baq.]"
        cid: 0
  - verse: 74
    segments:
      - text: "Olar bu sözni (Qur’annı) iç tüşünmedilermi? Yoqsa, olarğa daa evel keçmişteki atalarına kelmegen bir şey keldimi?"
        cid: 0
  - verse: 75
    segments:
      - text: "Yoqsa, Peyğamberlerini alâ tanımadılar da, bu sebepten, onı inkâr etelermi?"
        cid: 0
  - verse: 76
    segments:
      - text: "Yoqsa, onda bir delilik olğanını söylemektelermi? Yoq; o, ozlerine aqiqatnı ketirgendir, olarnıñ çoqu ise haqtan hoşlanmamaqtalar. (Bu ayetler kostermekte ki, inkârcılarnıñ Qur’anğa sırt çevirüvleri ve Az. Muһammedniñ peyğamberligini qabul etmeyuvini iç bir aqlı sebepke tayanmamaqta. Zira, olar Qur’an uzerinde yeterli tüşüngen ediler; ya da eñ azdan, yeterli tüşünmek fırsatını tapqan ediler. Ayrıca, Az. Muһammed (s.a.)niñ tebliği, meselâ ataları Az. İsmailniñ tebliğiniñ bir devamı edi; yani olar, Haq Dinni bus-butün tanımağan degil ediler. Resulullahnıñ dürüst ve işanılacaq bir insan olğanını pek alâ bile ediler; aqıllı ve zeki olğanından da, şubeleri yoq edi. Bunıñnen beraber, kene de inanmay ediler, çünki haqtan, yani doğrulıqtan, aqiqattan ve dürüstlikten hoşlanmay ediler. Ozleri haqqa uyacaq yerde, haqnı oz arzu-isteklerine uydurmağa qalqışa ediler)."
        cid: 0
  - verse: 77
    segments:
      - text: "Eger haq, olarnıñ fena arzu ve isteklerine uysa edi, mıtlaqa kokler ve yernen bularda olğanlar, bozulıp keter edi. Yoq, biz olarğa şan ve şereflerini ketirdik; faqat olar oz şereflerine arqa çevirdiler. (Tefsircilerniñ çoquna kore, ayetteki şan ve şerefniñ manası buña vesile olğan Qur’andır. Bunıñ kibi, İslâmdan evel araplarnıñ akimiyetleri yarımadanıñ sıñırlarını aşmağan vaqıtta, Qur’an-ı Kerim ve bu Yuce kitap ozüne engen Az. Muһammed, bu milletniñ adını ebediyleştirmeknen qalmagan, ayrıca Qur’an yoluna qoyulğan pek çoq milletlerni de, ciannıñ eñ buyuk ummetlerinden biri olmaq şerefine qavuştırğan)."
        cid: 0
  - verse: 78
    segments:
      - text: "(Resulım!) Yoqsa, sen olardan bir aq istemektesiñmi? Rabbiñniñ berecegi daa hayırlıdır. O, rızıq bericilerniñ eñ hayırlısıdır."
        cid: 0
  - verse: 79
    segments:
      - text: "Aqiqat şu ki, sen olarnı doğru bir yolğa çağırmaqtasıñ."
        cid: 0
  - verse: 80
    segments:
      - text: "Ahiretke inanmağanlar ise, israrnen yoldan çıqmaqtalar."
        cid: 0
  - verse: 81
    segments:
      - text: "Eger olarnı acıp da, içlerinde olğan sıqıntılarını ketkizse edik, yahşıca soqurlaşaraq, adden aşuvda tirelir ediler."
        cid: 0
  - verse: 82
    segments:
      - text: "Ant olsun, biz olarnı sıqıntığa qoydıq da, kene Rabblerine boyun egmediler, yalvaruv ve yaqaruvda da bulunmaylar."
        cid: 0
  - verse: 83
    segments:
      - text: "Eñ soñunda, uzerlerine azabı çoq şiddetli bir qapu açqan vaqtımızda, bir de baqarsıñ ki, olar o yerde şaşmalap ve umütsiz qalğanlardır!"
        cid: 0
  - verse: 84
    segments:
      - text: "O, siz içün qulaqlarnı, kozlerni ve goñyullerni yaratqandır. Ne de az şukür etesiñiz!"
        cid: 0
  - verse: 85
    segments:
      - text: "Ve O, sizni yer yuzünde yaratıp çoqlaştırğandır. Tek Onıñ uzurında toplanacaqsıñız."
        cid: 0
  - verse: 86
    segments:
      - text: "Ve O, yaşatıcı ve oldüricidir; geceniñ ve kundüzniñ deñişüvi Onıñ eseridir. Alâ aqlıñıznı işletmezsiñizmi!"
        cid: 0
  - verse: 87
    segments:
      - text: "Buña rağmen, olar evelkiler degeni kibi dediler."
        cid: 0
  - verse: 88
    segments:
      - text: "Dediler ki: Aqiqaten, biz olüp de, bir topraq ve kemik obası alına kelgende, mıtlaqa yañıdan tiriltilecekmiz, oylemi?"
        cid: 0
  - verse: 89
    segments:
      - text: "Aqiqaten, ister bizge, ister daa evelki atalarımızğa, boyle bir vadede bulunıldı; (faqat) bu keçmiştekilerniñ masallarından başqa bir şey degil!"
