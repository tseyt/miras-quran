  - verse: 11
    segments:
      - text: Semuud
        cid: 2
      - text: qavmı adden aşqanı sebebinden
        cid: 1
      - text: (Allahnıñ elçisini)
        cid: 0
      - text: yalanladı.
        cid: 1
      - text: >-
          Olarnıñ eñ bedbahtı (deveni soymaq içün) atılğanda, Allahnıñ Resulı olarğa:
          «Allahnıñ devesine ve onıñ suv aqqına toqunmañ!», dedi. Amma, olar onı yalanladılar
          ve deveni soydılar. Bunıñ üstüne, Rabbleri, günahları sebebinden, olarğa büyük bir
          felâket yolladı da, episini elâk etti. (Allah bu şekilde azap etüvniñ) aqibetinden
          qorqacaq degil ya! (Allah Semuud qavmına Salih Peyğamberni yollağan edi. Ondan
          mucize istediler. Allah oña pek güzel bir ırğaçı deve yolladı. Bu deveniñ otlaqlarda
          serbest dolaşuvı, belli bir künde suv içüvi, devege kimseniñ fenalıq yapmaması emir
          etildi. Qudar b. Salif adlı birisi Az. Salihni yalanladı. Soñ deveni soydılar. Allah
          olarnıñ memleketlerini başlarına yıqtı ve olarnı elâk etti. Olardan qalğan harabeler
          alâ mevcuttır).
        cid: 0
