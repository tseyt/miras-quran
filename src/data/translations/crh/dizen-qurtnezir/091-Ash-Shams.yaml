surah_id: 91
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >-
          Kuneşke ve quşluq vaqtındaki aydınlığına, kuneşni taqip etkeninde ayğa, onı
          aşkâr etken kundüzge, onı ortkeninde gecege, kok yuzüne ve onı bina etkende,
          yerge ve onı yapıp töşegenge, nefiske ve oña bir taqım qabiliyetler berip de,
          yahşılıq ve yamanlıqlarnı ilham etkenge yemin eterim ki, nefsini fenalıqlardan
          arındırğan, qurtulışqa irişken, onı fenalıqlarğa komgen de, ziyan etkendir.
        cid: 0
