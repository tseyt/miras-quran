surah_id: 91
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: Küneşke
        cid: 1
      - text: ve quşluq
        cid: 0
      - text: vaqtındaki aydınlığına,
        cid: 2
      - text: küneşni taqip etkeninde ayğa,
        cid: 1
      - text: >-
          onı aşkâr etken kündüzge, onı örtkeninde gecege, kök yüzüne ve onı bina etkende,
          yerge ve onı yapıp töşegenge, nefiske ve oña bir taqım qabiliyetler berip de,
          yahşılıq ve yamanlıqlarnı ilham etkenge yemin eterim ki, nefsini fenalıqlardan
          arındırğan, qurtulışqa irişken, onı fenalıqlarğa kömgen de, ziyan etkendir.
        cid: 0
