  - verse: 11
    segments:
      - text: >-
          Semuud qavmı adden aşqanı sebebinden (Allaһnıñ elçisini) yalanladı. Olarnıñ eñ
          bedbahtı (deveni soymaq içün) atılğanda, Allaһnıñ Resulı olarğa: «Allaһnıñ
          devesine ve onıñ suv aqqına toqunmañ!», dedi. Amma, olar onı yalanladılar ve
          deveni soydılar. Bunıñ ustüne, Rabbleri, gunahları sebebinden, olarğa buyuk bir
          felâket yolladı da, episini elâk etti. (Allaһ bu şekilde azap etüvniñ)
          aqibetinden qorqacaq degil ya! (Allaһ Semuud qavmına Salih Peyğamberni yollağan
          edi. Ondan mucize istediler. Allaһ oña pek guzel bir ırğaçı deve yolladı. Bu
          deveniñ otlaqlarda serbest dolaşuvı, belli bir kunde suv içüvi, devege kimseniñ
          fenalıq yapmaması emir etildi. Qudar b. Salif adlı birisi Az. Salihni yalanladı.
          Soñ deveni soydılar. Allaһ olarnıñ memleketlerini başlarına yıqtı ve olarnı elâk
          etti. Olardan qalğan harabeler alâ mevcuttır).
        cid: 0
