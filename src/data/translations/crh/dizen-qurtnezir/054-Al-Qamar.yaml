        cid: 0
      - text: ay
        cid: 4
      - text: yarıldı.
        cid: 3
      - text: >-
          (Bir çoq sahabiyden kelgen rivayetlerge köre, mekkeliler Az. Peyğamberden mucize
          istegenler, o da parmağınen ayğa işaret etken ve ay ekige ayırılğan. Soñra
          birleşken. Musulmanlar eskencege oğrağan nazik bir devirde aynıñ bu körünüşi
          mekkelilerni ayretke tüşürgen. Müşrikler bu vaqiağa iç itiraz bildirmegenler, sadece
          «tılsım» degenler).
        cid: 0
