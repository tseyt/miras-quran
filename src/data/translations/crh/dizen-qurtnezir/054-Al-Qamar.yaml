surah_id: 54
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >
          Qıyamet yaqlaştı ve ay yarıldı. (Bir çoq sahabiyden kelgen rivayetlerge köre,
          mekkeliler Az. Peyğamberden mucize istegenler, o da parmağınen ayğa işaret etken
          ve ay ekige ayırılğan. Soñra birleşken. Musulmanlar eskencege oğrağan nazik bir
          devirde aynıñ bu körünüşi mekkelilerni ayretke tüşürgen. Müşrikler bu vaqiağa iç
          itiraz bildirmegenler, sadece «tılsım» degenler).
        cid: 0
  - verse: 2
    segments:
      - text: >
          Olar bir mucize körseler, aman yüz çevirir ve: Eskiden berli devam etip kelgen
          bir tılsımdır, derler.
        cid: 0
  - verse: 3
    segments:
      - text: >
          Yalanladılar ve öz aveslerine uydılar. Albuki, er işniñ barıp yetecek yeri bar.
        cid: 0
  - verse: 4
    segments:
      - text: >
          Ant olsun olarğa, fenalıqtan ögüni alacaq nice müim haberler kelgendir.
        cid: 0
  - verse: 5
    segments:
      - text: >
          Bu büyük bir ikmettir. Faqat (yüz çevirgenge) tenbiyeler ne fayda berir!
        cid: 0
  - verse: 6
    segments:
      - text: >
          Çağırğannıñ körülmegen bir şeyge çağırğan künü, sen de olardan yüz çevir.
        cid: 0
  - verse: 7
    segments:
      - text: >
          Sanki etrafqa yayılğan çegertki sürüsi kibi, baqışları perişan (utanğandan yerge
          baqar) bir alda ve davetçige çapışıp, qabirlerden çıqarlar. O esnada kâfirler:
          Bu, pek çetin bir kündir! derler.
        cid: 0
  - verse: 8
    segments:
      - text: >
          [7 ayetine baq.]
        cid: 0
  - verse: 9
    segments:
      - text: >
          Olardan evel Nuhnıñ qavmı da yalanladı, em de qulumıznıñ yalancı olğanında israr
          eterek: O, delirdi, dediler. Ve (Nuh davetten vazgeçmege) mecbur etildi.
        cid: 0
  - verse: 10
    segments:
      - text: >
          Bunıñ üzerine, Rabbiñe: Men yeñildim, maña yardım et! diyerek yalvardı.
        cid: 0
  - verse: 11
    segments:
      - text: >
          Biz de der'al nehir kibi devamlı aqqan bir suvnen kökniñ qapularını açtıq.
        cid: 0
  - verse: 12
    segments:
      - text: >
          Yer yüzünde çoqraqalar fışqırttıq. (Er eki) suv taqdir etilgen bir işniñ oluvı
          içün birleşken edi. (Kökten yağğan yağmur ve yerden fışqırğan suv birleşerek,
          Nuhnıñ inkârcı qavmınıñ elâketini azırladı).
        cid: 0
  - verse: 13
    segments:
      - text: >
          Nuhnı da tahtalardan yapılğan, mıqlarnen mıqlanğan gemige mindirdik.
        cid: 0
  - verse: 14
    segments:
      - text: >
          İnkâr etilgenge (Nuhqa) bir mükâfat olmaq üzre, gemi közlerimizniñ ögünde aqıp
          ketmekte edi. (İnkâr etilip, nankorliknen qarşılaşuvğa oğrağan Az. Nuh ve oña
          inanğanlar Cenab-ı Haqnıñ nezareti ve imayesinde gemide yolculıqlarına devam
          etken ediler).
        cid: 0
  - verse: 15
    segments:
      - text: >
          Ant olsun ki, onı bir ibret olaraq bıraqtıq, ibret alğan yoqmı? (Gemi ve tufan
          birer ibret mevzularıdır. Rivayetlerge köre, Nuhnıñ gemisi Cudiy dağı üstünde
          uzun vaqıt qalğan ve insanlar onı körgenler).
        cid: 0
  - verse: 16
    segments:
      - text: >
          Menim azabım ve tenbiyelerim nasıl eken!
        cid: 0
  - verse: 17
    segments:
      - text: >
          Ant olsun, biz Qur'annı ögüt alınsın diye qolaylaştırdıq. (Ondan) ögüt alğan
          yoqmı?
        cid: 0
  - verse: 18
    segments:
      - text: >
          Aad qavmı (peyğamberleri huudnı) yalanladı da, azabım ve tehdidim nasıl eken
          (kördiler).
        cid: 0
  - verse: 19
    segments:
      - text: >
          Biz olarnıñ üstüne oğursızlığı devamlı bir künde buzlatıcı bir yel yolladıq.
          (Fussılet, 41/16-nıñ manasına baq.).
        cid: 0
  - verse: 20
    segments:
      - text: >
          O yel insanlarnı sökülgen hurma kütükleri kibi yerge sermekte edi.
        cid: 0
  - verse: 21
    segments:
      - text: >
          Nasıl eken menim azabım ve tenbiyelerim!
        cid: 0
  - verse: 22
    segments:
      - text: >
          Ant olsun, biz Qur'annı tüşünip, ögüt alınsın, diye qolaylaştırdıq. Ögüt alğan
          yoqmı?
        cid: 0
  - verse: 23
    segments:
      - text: >
          Semuud qavmı da tenbiyecilerni yalanladı.
        cid: 0
  - verse: 24
    segments:
      - text: >
          «Aramızdan bir insanğa uyacaqmızmı, o taqdirde biz ap-açıq bir sapıqlıq ve
          çılğınlıq etken olurmız», dediler. (Ayet Semuud qavmınıñ öz cınıslarından olğan
          ve tarafdarı da tapılmağan Az. Salihke uyuvdan qaçınğanlarını haber bermekte).
        cid: 0
  - verse: 25
    segments:
      - text: >
          «Vahiy aramızda oña berildimi? Yoq, o, yalancı ve maqtançaqnıñ biridir»
          (dediler).
        cid: 0
  - verse: 26
    segments:
      - text: >
          Yarın olar yalancı ve maqtançaq kim olğanını bilecekler.
        cid: 0
  - verse: 27
    segments:
      - text: >
          Aqiqaten, olarnı imtian etmek içün, ırğaçı deveni yollağan bizmiz. Sen olarnı
          közet ve sabır et.
        cid: 0
  - verse: 28
    segments:
      - text: >
          Olarğa suvnıñ aralarında paylaştırılğanını haber ber. Er biri özüniñ içüv
          sırasında kelsin. (İlâhiy taqsimatqa köre, suv bir kün deveniñ içüvi, bir kün
          de, öz itiyacları içün qullanılacaq edi).
        cid: 0
  - verse: 29
    segments:
      - text: >
          Arqadaşlarını çağırdılar, o da (bundan cur'at alaraq) qılıçını çıqardı ve deveni
          soydı. (Deveni soyğan adam Qudar b. Saalif adında bir zorbacı olğanı rivayet
          etilgen).
        cid: 0
  - verse: 30
    segments:
      - text: >
          (Bu adden aşqanlarğa) azabım ve tenbiyelerim nasıl oldı!
        cid: 0
  - verse: 31
    segments:
      - text: >
          Biz olarnıñ üzerlerine qorqunç bir ses yolladıq. Aman ayvan ağılına qoyulğan
          quru ot kibi ola qoydılar.
        cid: 0
  - verse: 32
    segments:
      - text: >
          Ant olsun, biz Qur'annı añlaşılıp, ögüt alınuvı içün qolaylaştırdıq. O alda,
          tüşünip, ögüt alğan yoqmı?
        cid: 0
  - verse: 33
    segments:
      - text: >
          Luutnıñ qavmı da, tenbiyeci peyğamberlerni yalanladı.
        cid: 0
  - verse: 34
    segments:
      - text: >
          Biz de üstlerine taş (yağıdrğan bir fırtına) yolladıq. Ancaq, Luut ailesi
          istisna, qatımızdan bir nimet olaraq, olarnı saar vaqtında qurtardıq. Biz şükür
          etkenni, işte böyle mükâfatlandırırmız.
        cid: 0
  - verse: 35
    segments:
      - text: >
          [34 ayetine baq.]
        cid: 0
  - verse: 36
    segments:
      - text: >
          Ant olsun ki, Luut olarnı bizim şiddetli azabımıznen tenbiyeledi. Faqat bular bu
          tehdidlerni şübenen qarşıladılar.
        cid: 0
  - verse: 37
    segments:
      - text: >
          Olar Luutnıñ musafirlerine nisbeten yamanlıq yapmaqnı qararlaştırğan ediler.
          Aman biz olarnıñ közlerini silme kör ettik. «Aydı, azabımnı ve tenbiyelerimni
          tatıñ!» (dedik). (Luutnıñ qavmı; yaş yigitler şeklinde Az. Luutqa kelgen
          meleklerge tecavuz yapmaq istegen ediler).
        cid: 0
  - verse: 38
    segments:
      - text: >
          Bir saba olarğa, yaqalarını bir daa bıraqmaycaq, bir azap kelip çattı.
        cid: 0
  - verse: 39
    segments:
      - text: >
          İşte, azabımnı ve tenbiyelerimni tatıñ! (denildi).
        cid: 0
  - verse: 40
    segments:
      - text: >
          Ant olsun, biz Qur'annı ögüt almaq içün qolaylaştırdıq. O olda, tüşünip, ibret
          alğan yoqmı?
        cid: 0
  - verse: 41
    segments:
      - text: >
          Şübesiz, Fıravunnıñ qavmına da tenbiyeciler kelgen edi.
        cid: 0
  - verse: 42
    segments:
      - text: >
          Lâkin, olar bütün ayetlerimizni yalanladılar. Biz de olarnı küç ve qudretimizge
          lâyıq bir şekilde yaqaladıq.
        cid: 0
  - verse: 43
    segments:
      - text: >
          Şimdi siziñ kâfirleriñiz olardan daa yahşıdırlarmı? Yoqsa, kitaplarda siz içün
          bir qurtulış barmı. (Ayette Mekke kâfirlerine, Nuh qavmından Fıravunğa qadar
          keçken milletlerden daa küçlü olğanlarını tüşünelermi ve özleriniñ azaptan
          qurtulacaqlarına dair bir garantiyağa saip olğanlarmı, soralmaqta).
        cid: 0
  - verse: 44
    segments:
      - text: >
          Yoqsa «Biz, intiqam almağa küçü yetken bir toplulıqmız», demektelermi?
        cid: 0
  - verse: 45
    segments:
      - text: >
          O toplulıq yaqında bozulacaq ve olar artlarına çevirilip qaçacaqlar.
        cid: 0
  - verse: 46
    segments:
      - text: >
          Doğrusı, qıyamet olarğa vade etilgen asıl saattır. Ve o saat daa belâlı ve daa
          accıdır.
        cid: 0
  - verse: 47
    segments:
      - text: >
          Şübesiz, suçlılar sapıqlıq ve çılğınlıq içindedirler.
        cid: 0
  - verse: 48
    segments:
      - text: >
          O künü yüzüqoyun ateşke süyreklengenlerinde: «Ceennemniñ elemini tatıñ!»,
          denilir.
        cid: 0
  - verse: 49
    segments:
      - text: >
          Biz er şeyni bir ölçüge köre yarattıq.
        cid: 0
  - verse: 50
    segments:
      - text: >
          Bizim emrimiz, bir anlıq baqış kibi, tek bir sözden başqa bir şey degil.
        cid: 0
  - verse: 51
    segments:
      - text: >
          Ant olsun, biz, sizge beñzegenlerni ep elâk ettik. Tüşünip, ibret alğan yoqmı?
        cid: 0
  - verse: 52
    segments:
      - text: >
          Yapqan er şeyleri kitaplarda (amel defterlerinde) mevcuttır.
        cid: 0
  - verse: 53
    segments:
      - text: >
          Küçük-büyük er şey satır-satır yazılğandır. (Buña köre, melekler yapılğanlarnı
          amel defterlerine qayd etmektedirler. Areket ve davranışnıñ, günah ve savapnıñ
          episi levh-i mahfuzda qayd etilgendir).
        cid: 0
  - verse: 54
    segments:
      - text: >
          Taqva saipleri cennetlerde ve irmaqlarnıñ kenarlarında, küçlü ve Yüce Allahnıñ
          uzurında haq meclisindedirler.
        cid: 0
  - verse: 55
    segments:
      - text: >
          [54 ayetine baq.]
        cid: 0
