surah_id: 54
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "Qıyamet yaqlaştı ve ay yarıldı. (Bir çoq sahabiyden kelgen rivayetlerge kore, mekkeliler Az. Peyğamberden mucize istegenler, o da parmağınen ayğa işaret etken ve ay ekige ayırılğan. Soñra birleşken. Musulmanlar eskencege oğrağan nazik bir devirde aynıñ bu korünüşi mekkelilerni ayretke tüşürgen. Muşrikler bu vaqiağa iç itiraz bildirmegenler, sadece «tılsım» degenler)."
        cid: 0
  - verse: 2
    segments:
      - text: "Olar bir mucize korseler, aman yuz çevirir ve: Eskiden berli devam etip kelgen bir tılsımdır, derler."
        cid: 0
  - verse: 3
    segments:
      - text: "Yalanladılar ve oz aveslerine uydılar. Albuki, er işniñ barıp yetecek yeri bar."
        cid: 0
  - verse: 4
    segments:
      - text: "Ant olsun olarğa, fenalıqtan ogüni alacaq nice muim haberler kelgendir."
        cid: 0
  - verse: 5
    segments:
      - text: "Bu buyuk bir ikmettir. Faqat (üz çevirgenge) tenbiyeler ne fayda berir!"
        cid: 0
  - verse: 6
    segments:
      - text: "Çağırğannıñ korülmegen bir şeyge çağırğan kunü, sen de olardan yuz çevir."
        cid: 0
  - verse: 9
    segments:
      - text: "Olardan evel Nuһnıñ qavmı da yalanladı, em de qulumıznıñ yalancı olğanında israr eterek: O, delirdi, dediler. Ve (Nuһ davetten vazgeçmege) mecbur etildi."
        cid: 0
  - verse: 10
    segments:
      - text: "Bunıñ uzerine, Rabbiñye: Men yeñildim, maña yardım et! diyerek yalvardı."
        cid: 0
  - verse: 11
    segments:
      - text: "Biz de der’al nehir kibi devamlı aqqan bir suvnen kokniñ qapularını açtıq."
        cid: 0
  - verse: 12
    segments:
      - text: "Yer yuzünde çoqraqalar fışqırttıq. (Er eki) suv taqdir etilgen bir işniñ oluvı içün birleşken edi. (Kokten yağğan yağmur ve yerden fışqırğan suv birleşerek, Nuһnıñ inkârcı qavmınını elâketini azırladı)."
        cid: 0
  - verse: 13
    segments:
      - text: "Nuһnı da tahtalardan yapılğan, mıqlarnen mıqlanğan gemige mindirdik."
        cid: 0
  - verse: 14
    segments:
      - text: "İnkâr etilgenge (Nuһqa) bir mukâfat olmaq uzre, gemi kozlerimizniñ ogünde aqıp ketmekte edi. (İnkâr etilip, nankorliknen qarşılaşuvğa oğrağan Az. Nuһ ve oña inanğanlar Cenab-ı Haqnıñ nezareti ve imayesinde gemide yolculıqlarına devam etken ediler)."
        cid: 0
  - verse: 15
    segments:
      - text: "Ant olsun ki, onı bir ibret olaraq bıraqtıq, ibret alğan yoqmı? (Gemi ve tufan birer ibret mevzularıdır. Rivayetlerge kore, Nuһnıñ gemisi Cudiy dağı ustünde uzun vaqıt qalğan ve insanlar onı korgenler)."
        cid: 0
  - verse: 16
    segments:
      - text: "Menim azabım ve tenbiyelerim nasıl eken!"
        cid: 0
  - verse: 17
    segments:
      - text: "Ant olsun, biz Qur’annı ogüt alınsın diye qolaylaştırdıq. (Ondan) ogüt alğan yoqmı?"
        cid: 0
  - verse: 18
    segments:
      - text: "Aad qavmı (peyğamberleri һuudnı) yalanladı da, azabım ve tehdidim nasıl eken (kordiler)."
        cid: 0
  - verse: 19
    segments:
      - text: "Biz olarnıñ ustüne oğursızlığı devamlı bir kunde buzlatıcı bir yel yolladıq. (Fussılet, 41/16-nıñ manasına baq.)."
        cid: 0
  - verse: 20
    segments:
      - text: "O yel insanlarnı sokülgen hurma kutükleri kibi yerge sermekte edi."
        cid: 0
  - verse: 21
    segments:
      - text: "Nasıl eken menim azabım ve tenbiyelerim!"
        cid: 0
  - verse: 22
    segments:
      - text: "Ant olsun, biz Qur’annı tüşünip, ogüt alınsın, diye qolaylaştırdıq. Ogüt alğan yoqmı?"
        cid: 0
  - verse: 23
    segments:
      - text: "Semuud qavmı da tenbiyecilerni yalanladı."
        cid: 0
  - verse: 24
    segments:
      - text: "«Aramızdan bir insanğa uyacaqmızmı, o taqdirde biz ap-açıq bir sapıqlıq ve çılğınlıq etken olurmız», dediler. (Ayet Semuud qavmınıñ oz cınıslarından olğan ve tarafdarı da tapılmağan Az. Salihke uyuvdan qaçınğanlarını haber bermekte)."
        cid: 0
  - verse: 25
    segments:
      - text: "«Vahiy aramızda oña berildimi? Yoq, o, yalancı ve maqtançaqnıñ biridir» (dediler)."
        cid: 0
  - verse: 26
    segments:
      - text: "Yarın olar yalancı ve maqtançaq kim olğanını bilecekler."
        cid: 0
  - verse: 27
    segments:
      - text: "Aqiqaten, olarnı imtian etmek içün, ırğaçı deveni yollağan bizmiz. Sen olarnı kozet ve sabır et."
        cid: 0
  - verse: 28
    segments:
      - text: "Olarğa suvnıñ aralarında paylaştırılğanını haber ber. Er biri ozüniñ içüv sırasında kelsin. (İlâhiy taqsimatqa kore, suv bir kun deveniñ içüvi, bir kun de, oz itiyacları içün qullanılacaq edi)."
        cid: 0
  - verse: 29
    segments:
      - text: "Arqadaşlarını çağırdılar, o da (bundan cur’at alaraq) qılıçını çıqardı ve deveni soydı. (Deveni soyğan adam Qudar b. Saalif adında bir zorbacı olğanı rivayet etilgen)."
        cid: 0
  - verse: 30
    segments:
      - text: "(Bu adden aşqanlarğa) azabım ve tenbiyelerim nasıl oldı!"
        cid: 0
  - verse: 31
    segments:
      - text: "Biz olarnıñ uzerlerine qorqunç bir ses yolladıq. Aman ayvan ağılına qoyulğan quru ot kibi ola qoydılar."
        cid: 0
  - verse: 32
    segments:
      - text: "Ant olsun, biz Qur’annı añlaşılıp, ogüt alınuvı içün qolaylaştırdıq. O alda, tüşünip, ogüt alğan yoqmı?"
        cid: 0
  - verse: 33
    segments:
      - text: "Luutnıñ qavmı da, tenbiyeci peyğamberlerni yalanladı."
        cid: 0
  - verse: 36
    segments:
      - text: "Ant olsun ki, Luut olarnı bizim şiddetli azabımıznen tenbiyeledi. Faqat bular bu tehdidlerni şubenen qarşıladılar."
        cid: 0
  - verse: 37
    segments:
      - text: "Olar Luutnıñ musafirlerine nisbeten yamanlıq yapmaqnı qararlaştırğan ediler. Aman biz olarnıñ kozlerini silme kor ettik. «Aydı, azabımnı ve tenbiyelerimni tatıñ!» (dedik). (Luutnıñ qavmı; yaş yigitler şeklinde Az. Luutqa kelgen meleklerge tecavuz yapmaq istegen ediler)."
        cid: 0
  - verse: 38
    segments:
      - text: "Bir saba olarğa, yaqalarını bir daa bıraqmaycaq, bir azap kelip çattı."
        cid: 0
  - verse: 39
    segments:
      - text: "İşte, azabımnı ve tenbiyelerimni tatıñ! (denildi)."
        cid: 0
  - verse: 40
    segments:
      - text: "Ant olsun, biz Qur’annı ogüt almaq içün qolaylaştırdıq. O olda, tüşünip, ibret alğan yoqmı?"
        cid: 0
  - verse: 41
    segments:
      - text: "Şubesiz, Fıravunnıñ qavmına da tenbiyeciler kelgen edi."
        cid: 0
  - verse: 42
    segments:
      - text: "Lâkin, olar butün ayetlerimizni yalanladılar. Biz de olarnı kuç ve qudretimizge lâyıq bir şekilde yaqaladıq."
        cid: 0
  - verse: 43
    segments:
      - text: "Şimdi siziñ kâfirleriñiz olardan daa yahşıdırlarmı? Yoqsa, kitaplarda siz içün bir qurtulış barmı. (Ayette Mekke kâfirlerine, Nuһ qavmından Fıravunğa qadar keçken milletlerden daa kuçlü olğanlarını tüşünelermi ve ozleriniñ azaptan qurtulacaqlarına dair bir garantiyağa saip olğanlarmı, soralmaqta)."
        cid: 0
  - verse: 44
    segments:
      - text: "Yoqsa «Biz, intiqam almağa kuçü yetken bir toplulıqmız», demektelermi?"
        cid: 0
  - verse: 45
    segments:
      - text: "O toplulıq yaqında bozulacaq ve olar artlarına çevirilip qaçacaqlar."
        cid: 0
  - verse: 46
    segments:
      - text: "Doğrusı, qıyamet olarğa vade etilgen asıl saattır. Ve o saat daa belâlı ve daa accıdır."
        cid: 0
  - verse: 47
    segments:
      - text: "Şubesiz, suçlılar sapıqlıq ve çılğınlıq içindedirler."
        cid: 0
  - verse: 48
    segments:
      - text: "O kunü yuzüqoyun ateşke süyreklengenlerinde: «Ceennemniñ elemini tatıñ!», denilir."
        cid: 0
  - verse: 49
    segments:
      - text: "Biz er şeyni bir olçüge kore yarattıq."
        cid: 0
  - verse: 50
    segments:
      - text: "Bizim emrimiz, bir anlıq baqış kibi, tek bir sözden başqa bir şey degil."
        cid: 0
  - verse: 51
    segments:
      - text: "Ant olsun, biz, sizge beñzegenlerni ep elâk ettik. Tüşünip, ibret alğan yoqmı?"
        cid: 0
  - verse: 52
    segments:
      - text: "Yapqan er şeyleri kitaplarda (amel defterlerinde) mevcuttır."
        cid: 0
  - verse: 53
    segments:
      - text: "Kuçük-buyuk er şey satır-satır yazılğandır. (Buña kore, melekler yapılğanlarnı amel defterlerine qayd etmektedirler. Areket ve davranışnıñ, gunah ve savapnıñ episi levh-i mahfezda qayd etilgendir)."
        cid: 0