          Mısırlılar onı ziyade sevgeni içün, onıñ öz memleketlerinde qalğanını
          istegenler. Daa soñra, Az.Musa onıñ cesedini tapıp, babası Yaqubnıñ yanına alıp
          barıp defn etti).
