surah_id: 12
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "Allaһtan olğan tenbiye ve işaretler,"
        cid: 0
  - verse: 2
    segments:
      - text: "Nefisten kelip çıqqan tüş,"
        cid: 0
  - verse: 3
    segments:
      - text: "Şeytannıñ qorqızuvı ve saptıruvları)."
        cid: 0
  - verse: 4
    segments:
      - text: "(Zindandaki) eki adamdan qurtulğan soyu, uzun bir zamandan soñ, (Üsufnı) hatırlayaraq, dedi ki: Men sizge onıñ yorumını haber beririm, meni aman (zindanğa) yollañ."
        cid: 0
  - verse: 5
    segments:
      - text: "(Üsufnıñ yanına kelerek, dedi ki:) Ey, Yusuf, ey, doğru sözlü adam! (Ruyada korülgen yedi arıq sığırnıñ aşağan yedi semiz sığırnen, yedi yeşil başaq ve digirleri de quru olğan başaqlar) aqqında bizge yorum yap. Umüt eterim ki, insanlarğa (doğru yorumıñnen) qaytırım da, belki, olar da doğrunı ogrenirler."
        cid: 0
  - verse: 6
    segments:
      - text: "Yusuf dedi ki: Yedi sene, adetiñiz uzre, ekin ekersiñiz. Soñra da aşaycaqlarıñızdan az bir miqdarından ğayrı, çalğanlarıñıznı başağınen (sarpan etip) bıraqıñız."
        cid: 0
  - verse: 7
    segments:
      - text: "Soñra, bunıñ artından saqlaycaqlarıñızdan az bir miqdar (urlıq)dan ğayrı, o yıllar içün toplağanlarıñıznı aşap bitirecek yedi qıtlıq yılı kelecek."
        cid: 0
  - verse: 8
    segments:
      - text: "Soñra, bunıñ artından da, bir yıl kelecek ki, o yılda insanlarğa (Allaһ tarafından) yardım olunacaq ve o yılda (meyva suvı ve yağ) sıqacaqlar. (Yani bol-bol meyva ve sebzelerge qavuşacaqlar, yuzüm, hurma, zeytün ve susam (kuncut, kasatik) kibi şeylerni sıqaraq, suvlarından faydalanacaqlar. Bu bolluq senesine dair ruyada bir işaret yoq. Al.Üsuf bunı, sadece bir vahiy ve ilham ile olarğa mujdelegen)."
        cid: 0
  - verse: 9
    segments:
      - text: "(Adam bu yorumnı ketirgeninen) qıral dedi ki: «Onı maña ketiriñ!» Elçi, Yusufqa kelgen vaqıtta (Üsuf) dedi ki: «Efendiñye dön de, oña: Ellerini kesken o qadınlarnıñ zoru ne edi? dep sora. Şubesiz, menim Rabbim olarnıñ iylesini çoq yahşı bilir»."
        cid: 0
  - verse: 10
    segments:
      - text: "(Qıral qadınlarğa) dedi ki: Yusufnıñ nefsinden faydalanmaq istegen vaqtıñızda vaziyetiñiz nasıl edi? Qadınlar: Allaһ içün, biz ondan iç bir fenalıq kormedik, dediler. Azizniñ qadını da dedi ki: «Şimdi aqiqat ortağa çıqtı. Men onıñ nefsinden faydalanmaq istegen edim. Şubesiz ki, o doğru söylegenlerdendir»."
        cid: 0
  - verse: 11
    segments:
      - text: "(Üsuf dedi ki): Bu, Azizniñ yoqluğında oña hainlik etmegenimni ve Allaһ hainlerniñ iylesini muvafaqiyet qazandırmaycığını (er kesniñ) bilüvi içündir."
        cid: 0
  - verse: 12
    segments:
      - text: "(Bunıñnen beraber) nefsimni temizge çıqarmayım. Çünki, nefis adden aşırı şekilde fenalıqnı emir eter; Rabbim acıp qorçalağanı başqa. Şubesiz, Rabbim çoq bağışlayıcı, pek merhametlidir."
        cid: 0
  - verse: 13
    segments:
      - text: "Qıral dedi ki: Onı maña ketiriñ, onı ozüme şahsiy meslâatçı yapayım. Onıñnen qonuşqanınen: Bugun sen yanımızda yuksek maqam sanbi ve işançlı birisiñ, dedi. (Qıral korgen ruyasınıñ yorumını bir de Az.Üsuftan şahsen dinlemek istedi. O da ruyanı ve yorumını añlattı. Qıral nasıl tedbir almaq kerekligini sorağanınen, Az.Üsuf: «Bolluq yılarında çoq ekin ekip, bereketni sarpan etmek kerek. Boylece, qıtlıq yılarında em ozüñizniñ keçinüviñizni teminlersiz, em de başqalarına sataraq, hazinege bol para qazandırırsız», dedi. Qıral: «Yahşı, bu işni kim yapacaq?», dep sorğanınen, Az.Üsuf:)"
        cid: 0
  - verse: 14
    segments:
      - text: "«Meni ulkeniñ hazinelerine tayin et! Çünki, men (olarnı) pek yahşı qorçalarım ve bu işni bilem», dedi."
        cid: 0
  - verse: 15
    segments:
      - text: "Ve, boylece, Yusufqa o yerde istegeni kibi areket etmek uzre, ulke içinde aq-uquq berdik. Biz istegen kimsemizge rahmetimizni iriştirirmiz. Ve guzel davranğanlarnıñ mukâfatını zaya etmemiz."
        cid: 0
  - verse: 16
    segments:
      - text: "İman etip de, (fenalıqlardan) saqınğanlar içün ahiret mukâfatı daa hayırlıdır. (Butün Mısır Az.Üsufnıñ idaresine ve tasarrufına berildi. Qıral oz selâhiyetlerini dahi qullanuvına musaade etti. Az.Üsuf ekin-tikinge emiyet birdi. Bereketni arttırdı, itiyacdan ziyade bereketni sarpan yaptı. Niayet, qıtlıq yılları keldi. Bu sefer sarpanlanğan bereketlerni aşamağa ve satmağa başladılar. Er taraftan insanlar kelerek, Mısırdan erzaq satın aldılar. Yaqub (a.s.) da, Yusufnıñ oz qardaşı Bunyaminden ğayrı, diger oğullarını erzaq almaq içün, Mısırğa yolladı)."
        cid: 0
  - verse: 17
    segments:
      - text: "Yusufnıñ qardaşları kelip, onıñ uzuruna kirdiler, (Üsuf) olarnı tanıdı, olar onı tanımay ediler."
        cid: 0
  - verse: 18
    segments:
      - text: "(Üsuf) olarnıñ yuklerini azırlağanınen, dedi ki: «Siziñ baba bir qardaşıñıznı da maña ketiriñ. Kormeysiñizmi, men olçekni tam tolduram ve men musafirperverlerniñ eñ yahşısıyım."
        cid: 0
  - verse: 19
    segments:
      - text: "Eger onı maña ketirmeseñiz, artıq menim yanımda sizge berilecek bir olçek (erzaq) yoq, maña iç yaqlaşmañ!»"
        cid: 0
  - verse: 20
    segments:
      - text: "Dediler ki: Onı babasından istemege areket etecekmiz, şubesiz, bunı yapacaqmız."
        cid: 0
  - verse: 21
    segments:
      - text: "(Üsuf) emirindeki gençlerge dedi ki: Sermayelerini yukleriniñ içine qoyıñ. Olur ki, ailelerine qaytqanlarında bunıñ farqına barırlar da, belki, keri kelirler."
        cid: 0
  - verse: 22
    segments:
      - text: "Babalarına qaytqanlarında dediler ki: Ey, babamız! Erzaq bizge yasaqlandı. Qardaşımıznı (Bunyaminni) biznen beraber yolla da, (onıñ sayesinde) olçep alayıq. Biz onı mıtlaqa qorçalaycaqmız."
        cid: 0
  - verse: 23
    segments:
      - text: "Yaqub dedi ki: Daa evel qardaşı (Üsuf) aqqında sizge ne qadar işanğan isem, bunıñ aqqında da, sizge ancaq o qadar işanırım! (Men onı, sadece Allaһqa emanet etem); Allaһ eñ hayırlı qorçalayıcıdır. O, acığanlarnıñ eñ merhametlisidir."
        cid: 0
  - verse: 24
    segments:
      - text: "Eşyalarını açqanlarında, sermayeleriniñ ozlerine keri berilgenini kordiler. Dediler ki: Ey, babamız! Daa ne isteymiz. İşte, sermayemiz de bizge keri berilgen. (Onıñnen kene) ailemizge aşalacaq ketirirmiz, qardaşımıznı qorçalarmız ve bir deve yukni de ziyade alırmız. Çünki, bu (seferki alğanımız) az bir miqdardır."
        cid: 0
  - verse: 25
    segments:
      - text: "Ekisi de qapuğa doğru çaptılar. Qadın onıñ kolmegini arttan yırttı. Qapunıñ yanında onıñ qocasına rastkeldiler. Qadın dedi ki: Seniñ aileñye fenalıq yapmaq istegenniñ cezası - zindanğa atıluvından ya da elem berici bir eskenceden başqa ne ola bilir!"
        cid: 0
  - verse: 26
    segments:
      - text: "Yusuf: «Aslı ozü menim nefsimden faydalanmaq istedi», dedi. Qadınnıñ aqrabasından biri boyle şaatlıq etti: «Eger kolmegi ogden yırtılğan ise, qadın doğru söylegen, bu ise, yalancılardandır». 27. «Eger kolmegi arttan yırtılğan ise, qadın yalan söylegen. Bu ise, doğru söylegenlerdendir»."
        cid: 0
  - verse: 28
    segments:
      - text: "(Qocası Yusufnıñ kolmeginiñ) arttan yırtılğanını korgeninen, (qadınğa) : «Şubesiz, dedi; bu, siziñ tuzağıñızdır. Siziñ tuzağıñız aqiqaten buyuktir». 29. «Ey, Yusuf! Sen bundan (olğanlarnı söylemekten) vazgeç! (Ey, qadın!) Sen de gunahıñnıñ afusını tile! Çünki, sen gunahkârlardan oldıñ»."
        cid: 0
  - verse: 30
    segments:
      - text: "Şeerdeki bazı qadınlar dedi ki: Azizniñ qadını deliqanlısınıñ nefsinden faydalanmaq istey emiş; Yusufnıñ sevdası onıñ yuregine kirgen! Biz onı, aqiqaten açıq bir sapıqlıq içinde kormektemiz."
        cid: 0
  - verse: 31
    segments:
      - text: "Qadın, olarnıñ emiş-demişlerini eşitkeninen, olarğa davetçi yolladı; olar içün dayanmağa yastıqlar azırladı. Er birine birer pıçaq berdi. (Qadınlar meyvalarnı keskende, (Üsufqa): «Çıq qarşılarına!», dedi. Qadınlar onı korgenlerinen, onıñ buyukligini añladılar. (Şaşqanlarından) ellerini kestiler ve dediler ki: Ya Rabbimiz! Bu bir beşer degil … Bu, ancaq ustün bir melek! («Dayanmağa yastıqlar» diye tercime etilgen «Muttekeen» kelimesi «Emek meclisi» şeklinde de añlaşıla bilir. Çünki, olar ferahl insanlarnı adeti olğanı uzre, aşağanda, içkende ve subet etkende arqalarına tayana ediler. Bunıñ içün, tayanaraq aş aşamaq yasaqlanğan. Bu mevzudaki Caabir hadisi boyledir: «Allaһ Resul sol elimiznen ve arqamızğa tayanaraq aşamamıznı yasaqladı»»)."
        cid: 0
  - verse: 32
    segments:
      - text: "Qadın dedi ki: İşte, aqqında meni tenqit ettigiñiz şahıs budır. Men onıñ nefsinden faydalanmaq istedim. Faqat o, (bundan) şiddetnen saqındı. Ant olsun, eger o ozüne emir etecegimni yapmasa, mıtlaqa zindanğa atılacaq ve elbette sürüngenlerden olacaq!"
        cid: 0
  - verse: 33
    segments:
      - text: "(Üsuf:) Rabbim! Maña zindan, bularnıñ menden istegenlerinden daa yahşıdır! Eger olarnıñ iylelerini menden çevirmeseñ, olarğa meyl eter ve caillerden olurım! dedi."
        cid: 0
  - verse: 34
    segments:
      - text: "Rabbi onıñ duasını qabul etti ve olarnıñ iylesini uzaqlaştırdı. Çünki, O, çoq yahşı eştici, pek yahşı bilicidir."
        cid: 0
  - verse: 35
    segments:
      - text: "Soñunda (Aziz ve arqadaşları) kesen-kes delillerni korgenlerine rağmen, (halqnıñ emiş-demişini kesmek içün, kene de) onı bir muddetke qadar mıtlaqa zindanğa atuvları ozlerine uyğun koründi."
        cid: 0
  - verse: 36
    segments:
      - text: "Onıñnen birlikte zindanğa eki deliqanlı daa kirdi. Olardan biri dedi ki: Men (tüşte) şarap sıqqanımnı kordim. Digeri de: Men de başımnıñ ustünde quşlar aşağan bir yemek taşığanımnı kordim. Bunıñ yorumını bizge haber ber. Çünki, biz seni guzel davranğanlardan kormektemiz, dedi."
        cid: 0
  - verse: 37
    segments:
      - text: "(Üsuf) dedi ki: Sizge aşatılacaq aş kelmeden evel, onıñ yorumını mıtlaqa sizge haber berecem. Bu, Rabbimniñ maña ogretkenlerindendir. Şubesiz, men Allaһqa inanmağan bir qavmnıñ dininden uzaqlaştım. Olar ahiretni inkâr etkenlerniñ ozleridir. (Az. Yusuf gençlerniñ bu vaziyetinden faydalanaraq, olarğa tevhid dinini añlatmaq istedi. Tolayısınen, olarnıñ ruyalarını yorumlamadan evel, ozüniñ haq din uzerinde olğanını, bilgileriniñ Allaһ tarafından ogretilgenini ve mısırlılarnıñ yañlış yolda olğanlarını bildirerek, olarnı azırladı ve haq dinni olarğa tebliğ etti. İşte, bu ve bundan soñki uç ayet bunıñnen bağlıdır)."
        cid: 0
  - verse: 38
    segments:
      - text: "Atalarım İbrahim, İshaq ve Yaqubnıñ dinine uydım. Allaһqa er angi bir şeyni ortaq qoşuvımız bizge yaraşmaz. Bu, Allaһnıñ bizge ve insanlarğa olğan lütfindendir. Faqat insanlarnıñ çoqu şukür etmezler."
        cid: 0
  - verse: 39
    segments:
      - text: "Ey, zindan arqadaşlarım! Çeşit tañrılar daa yahşımı, yoqsa, kuçüne qarşı turılmaycaq tek bir Allaһmı?"
        cid: 0
  - verse: 40
    segments:
      - text: "Allaһnı bıraqıp da, tabınğanlarıñız, siziñ ve atalarıñıznıñ taqqan bir taqım isimlerden başqa bir şey degil. Allaһ olar aqqında er angi bir delil endirmegen. Uküm, sadece, Allaһqa aittir. O, sizge ozünden başqasına ibadet etmemeñizni emir etkendir. İşte, dos-doğru din budır. Faqat insanlarnıñ çoqu bilmezler."
        cid: 0
  - verse: 41
    segments:
      - text: "Ey, zindan arqadaşlarım! (Ruyalarıñızğa kelgende), biriñiz (daa evel olğanı kibi ) efendisine şarap içirecek; digeri ise, asılacaq ve quşlar onıñ başından (miyini) aşaycaqlar. Yorumını sorağan işiñiz (bu şekilde) kesen-kesleşkendir."
        cid: 0
  - verse: 42
    segments:
      - text: "Olardan qurtulacağını bilgen kimsege dedi ki: Meni efendiniñ yanında añ (belki, meni çıqarır). Faqat şeytan oña, efendesine añmaqnı unuttırdı. Tolayısınen, (Üsuf), bir qaç sene daa zindanda qaldı. (Bazı tefsircilerge kore, Az.Üsuf, Allaһtan başqasından yardım istegeni içün, beş yıllq apslikten soñ, yedi yıl daa apste qaluvğa mahküm oldı. Boylece, aps muddeti on eki yıl sürdi. Bu yerde aqılğa boyle bir sual kele bilir: Çeşit ayet ve hadislernen başqasından yardım istemek qanuniy qabul etilgenine, atta yerine kore, kâfirden de yardım istenile bilecegine kore, Az.Üsufnıñ Allaһtan başqasından da medet umüt etüvi niçün hoş qarşılanmağan? Bunıñ cevabı şudır: Allaһ, peyğamberlerini, yaratqanlarınıñ uzerine ustün yapqanı kibi, işlerniñ eñ yahşısını, eñ guzelini ve eñ ustünini de, olarğa yaqıitırğan. Peyğamber içün eñ ustün qıyınlıqqa qalğanda, Rabbinden başqasına tayanmaması ve el açmamasıdır)."
        cid: 0
  - verse: 43
    segments:
      - text: "Qıral dedi ki: Men (ruyada yedi arıq sığırnıñ, yedi semiz sığırnı aşağanını kordim. Ayrıca, yedi yeşil başaq ve başqalarını da quru kordim. Ey, ileri kelgenler! Eger ruya yorumlay iseñiz, menim ruyamnı da, maña yorumlañ."
        cid: 0
  - verse: 44
    segments:
      - text: "(Örumcılar) dediler ki: Bular qarma-qarışıq tüşlerdir. Biz boyle tüşlerniñ yorumını bilgenlerden degilmiz. (İslâm alimleri ruya vaqiasını uç sınıfqa ayırğanlar:"
        cid: 0
  - verse: 66
    segments:
      - text: "(Yaqub) dedi ki: Sarıp alınuvıñız (ve çaresiz qaluv vaziyetiñizden) ğayrı, onı maña mıtlaqa ketirecegiñizge dair Allaһ adına maña qavi bir söz bermegen taqdiriñizde, onı siznen beraber yollamam!» Oña (istegen şekilinde) teminatlarını bergenlerinde, dedi ki: Söylegenlerimizge Allaһ şaattır."
        cid: 0
  - verse: 67
    segments:
      - text: "Soñra boyle dedi: Oğullarım! (Şeerge) epiñiz bir qapudan kirmeñ, ayrı-ayrı qapulardan kiriñ, amma Allaһtan (kelecek) iç bir şeyni sizden uzaqlaştıralmam. Uküm Allaһtan başkasınıñ degildir. (Onıñ içün) men yalıñız Oña tayandım. Tevekkül etkenler yalıñız Oña tayansınlar. (Az.Yaqubnıñ oğullarına Mısırğa çeşit qapulardan kirüvlerini emir etüviniñ sebebi boyle izaat etilir: Oğulları korümli ediler, urbaları guzel edi. İlki kelişlerinde Melikten kimseniñ kormegen izzet ve ikramnı korgen ediler. Bu sebepten, er kesniñ ayret tolu kozleri olarğa tikilgen edi. Beraber kirüvleri olarnıñ başlarına bir al ketire bile edi)."
        cid: 0
  - verse: 68
    segments:
      - text: "Babalarınıñ olarğa emir etken yerden (çeşit qapulardan) kirgenlerinde (onıñ emrini yerine ketirdiler. Faqat bu tedbir) Allaһtan kelecek iç bir şeyni olardan uzaqlaştıralmaz edi; ancaq Yaqub içindeki bir tilegini aşkâr etti. Şubesiz, o ilim saibi edi, çünki oña biz ogretken edik. Faqat insanlarnıñ çoqu bilmezler."
        cid: 0
  - verse: 69
    segments:
      - text: "Yusufnıñ yanına kirgenlerinde, oz qardaşını yanına aldı ve: «Bilesiñ ki, men seniñ ağañım, olarnıñ yapqanlarına kederlenme», dedi. (Rivayetke kore, Az.Üsuf qardaşlarına ziyafet berdi. Olarnı sofrağa ekişer-ekişer oturttı. Bunyamin yanğız qalğanınen, ağladı ve dedi ki: Ağam Yusuf sağ olsa edi, o da mennen beraber oturır edi. Yusuf (a.s.) onı oz sofrasına aldı. Aştan soñ qardaşlarını ekişer-ekişer evlerge musafir berdi. Bunyamin kene yanğız qalğan edi. Az.Üsuf dedi ki: Bunıñ ekincisi yoq, o alda, bu da menim yanımda olsun. Boylece, Bunyamin onıñ yanında geceledi. Az.Üsuf dedi ki: Olgen ağañ yerine meni ağa olaraq qabul etersiñmi? Bunyamin: «Seniñ kibi bir ağanı kim tapa bilir? Faqat seni babam Yaqubnen anam Rahiyle doğrumadılar. Az.Üsuf bunı eşitkeninen, ağladı, turıp Bunyaminniñ boynuna sarıldı ve: «Men seniñ ağañım…» dedi)."
        cid: 0
  - verse: 70
    segments:
      - text: "(Üsuf) olarnıñ yuküni azırlağan vaqıtta, meşrebeni qardaşınıñ yukü içine qoydı! (Kervan areket etkenden) soñ, bir dellâl; Ey, kervan! Siz hırsızsıñız! diye seslendi."
        cid: 0
  - verse: 71
    segments:
      - text: "(Üsufnıñ qardaşları) olarğa çevirilerek: Ne qıdrasıñız? dediler."
        cid: 0
  - verse: 72
    segments:
      - text: "Qıralnıñ suv savutını qıdramız; onı ketirgenge bir deve yuk (bahşış) bar, dediler. (Aralarından biri:) Men buña kefilim, dedi."
        cid: 0
  - verse: 73
    segments:
      - text: "Allaһqa ant olsun ki, bizim yer yuzünde fesat çıqarmaq içün kelmegenmizni siz de bilmektesiñiz. Biz hırsız da degilmiz, dediler."
        cid: 0
  - verse: 74
    segments:
      - text: "(Üsufnıñ adamları) dediler ki: Yahşı, siz yalancı olsañız, bunıñ cesazı nedir? 75. «Onıñ cesazı ğayıp olğan eşya kimniñ yukünde olsa, işte, o (şahısqa saip olmaq) onıñ cesazıdır. Biz zalımlarnı boyle cezalandırırmız», dediler. (Yaqub (a.s.)nıñ şeriatına kore, hırsız yaqalanaraq, çalğan malınıñ qarşılığında mal saibine bir sene hızmetkâr olaraq çalıştırıla edi. Mısır qanunlarında ise, hırsızğa sopa urula ve çalğan malınıñ eki qatı odettirile edi. Az.Üsuf olarğa babalırınıñ şeriatına kore, ceza bermek istedi)."
        cid: 0
  - verse: 76
    segments:
