surah_id: 12
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >
          Elif. Lâam. Raa. Bular, ap-açıq Kitapnıñ ayetleridir.
        cid: 0
  - verse: 2
    segments:
      - text: >
          Añlaysıñız diye, biz onı arapça bir Qur'an olaraq endirdik.
        cid: 0
  - verse: 3
    segments:
      - text: >
          (Ey, Muhammed!) Biz saña bu Qur'annı vahiy etmeknen, keçmiş milletlerniñ
          haberlerini saña eñ güzel bir şekilde beyan etmektemiz. Aqiqat şu ki, sen bundan
          evel (bu haberlerni) elbette bilmegenlerden ediñ.
        cid: 0
  - verse: 4
    segments:
      - text: >
          Bir zamanlar Yusuf babasına (Yaqupqa) degen edi ki: Babacığım! Men (tüşümde) on
          bir yıldıznen küneşni ve aynı kördim. Olarnıñ maña secde etkenlerini kördim.
        cid: 0
  - verse: 5
    segments:
      - text: >
          (Babası:) Yavrucığım! dedi, ruyañnı saqın qardaşlarıña añlatma; soñ saña bir
          tuzaq qurarlar. Çünki, şeytan insanğa ap-açıq bir duşmandır.
        cid: 0
  - verse: 6
    segments:
      - text: >
          İşte, böylece Rabbiñ seni seçecek, saña (ruyada körülgen) vaqialarnıñ yorumını
          ögretecek ve daa evel eki atañ - İbrahim ve İshaqqa nimetini tamamlağanı kibi,
          saña ve Yaqub soyuna da, nimetini tamamlaycaq. Çünki, Rabbiñ çoq eyi bilicidir,
          ikmet saibidir.
        cid: 0
  - verse: 7
    segments:
      - text: >
          Ant olsun ki, Yusuf ve qardaşlarında, (almaq) istegenler içün ibretler bardır.
          (Rivayetke köre, yeudiy alimleri Mekke müşrikleriniñ ileri kelgenlerine: «İsrail
          oğullarınıñ niçün Mısırğa ketkenlerini Muhammedden sorañ, baqayıq, ne cevap
          berecek», diye telqin etkenler, olar da sorağan, bunıñ üzerine bu sure engen.
          İşte, ayette olarnıñ bu suallerine işaret etile).
        cid: 0
  - verse: 8
    segments:
      - text: >
          (Qardaşları) dediler ki: Yusufnen qardaşı (Bünyamin) babamızğa bizden daa
          sevimlidir. Albuki, biz çoq bir cemaatmız, şübesiz ki, babamız ap-açıq bir
          yañlışlıq içindedir. (Yusufnen Bünyamin bir anadan, diger oğulları ise, başqa
          bir anadan ediler).
        cid: 0
  - verse: 9
    segments:
      - text: >
          (Öz araları dediler ki:) Yusufnı öldüriñ ya da onı (uzaq) bir yerge atıñ ki,
          babañıznıñ sevgisi yalıñız sizge qalsın! Ondan soñ da (tövbe eterek) salih
          kimseler olursıñız! (Ayetniñ sönki qısmını «...bundan soñra işiñizni yoluna
          qoyğan, vaziyetiñizni tüzeltken olursıñız», şeklinde añlamaq da mümkün).
        cid: 0
  - verse: 10
    segments:
      - text: >
          Olardan biri: Yusufnı öldürmeñ, eger mıtlaqa yapacaq iseñiz, onı quyunıñ tübine
          atıñ da, keçken kervanlardan biri onı alsın (ketsin), dedi. (Bu teklifni yapqan
          Yehuda isimli birisi edi. Qardaşlarına bunı qabul ettirdi ve babalarına
          keldiler).
        cid: 0
  - verse: 11
    segments:
      - text: >
          Dediler ki: «Ey, babamız! Saña ne ola da, Yusufnı niçün bizge işanmaysıñ!
          Albuki, biz onıñ yahşılığını isteymiz.
        cid: 0
  - verse: 12
    segments:
      - text: >
          Yarın onı biznen beraber (qırğa) yolla da, bol-bol aşasın (içsin), oynasın. Biz
          onı mıtlaqa qorçalarmız».
        cid: 0
  - verse: 13
    segments:
      - text: >
          (Babaları) dedi ki: Onı alıp ketüviñiz, meni mıtlaqa kederlendirir. Siz ondan
          habersiz olğanda, onı bir qaşqırnıñ aşaycağından qorqam. (Az.Peyğamberden naql
          etilgen bir hadiste bildirilgeni kibi, Yaqub (a.s.): «Onı qaşqırnıñ aşaycağından
          qorqam», şeklindeki bu sözünen, farqında olmadan, olarğa tizgen planlarını
          becerüvleri içün bir yip ucunı bergen. Aqiqaten 17- nci ayette de körülecegi
          kibi, olar bundan faydalanğanlar).
        cid: 0
  - verse: 14
    segments:
      - text: >
          Dediler ki: Aqiqaten, biz (quvetli) bir toplulıq olğanımız alda, eger onı qaşqır
          aşasa, o vaqıtta biz, aqiqaten aciz kimseler sayılırmız.
        cid: 0
  - verse: 15
    segments:
      - text: >
          Onı alıp barıp, quyunıñ astına atmağa beraber qarar bergen vaqıtlarında, biz
          Yusufqa: Ant olsun ki, sen olarnıñ bu işlerini, olar (işniñ) farqına barmadan,
          özlerine haber bereceksiñ, diye vahiy ettik. (Tefsircilerniñ bir çoqu, ayetteki
          «Biz Yusufqa ... vahiy ettik» ifadesine bazanaraq, Az.Yusufqa peyğamberlikniñ
          daa o vaqıtta berilgenine qaniydir. Cenab-ı Haqnıñ Az.Yusufqa quyuğa atılğan
          vaqıttaki bu vadesi daa soñra kerçekleşken ve nevbetteki ayetlerde körülecegi
          üzre, Az.Yusuf bu tuzaqtan qurtulğan, qardaşlarına da bütün yapqanlarını
          bilgenini söylegen).
        cid: 0
  - verse: 16
    segments:
      - text: >
          Aqşamleyin ağlayaraq babalarına keldiler.
        cid: 0
  - verse: 17
    segments:
      - text: >
          Ey, babamız! dediler, biz yarışmaq içün uzaqlaştıq; Yusufnı eşyamıznıñ yanında
          qaldırdıq. (Ne yazıq ki) onı qaşqır aşağan! Faqat biz doğru söylegenler olsaq
          da, sen bizge inanmazsıñ.
        cid: 0
  - verse: 18
    segments:
      - text: >
          Kölmeginiñ üstünde sahte bir qan ile keldiler. (Yaqub) dedi ki: Aksine
          nefisleriñiz sizge (fena) bir işni güzel kösterdi. Artıq (maña tüşkeni) haqqı
          ile sabır etmektir. Añlatqanıñız qarşısında (maña) yardım etecek ancaq Allahtır.
          (Rivayetke köre, qardaşları Yusufnıñ kölmegini qanğa bulap, babalarına
          ketirgenlerinde, accı haberni alğan Yaqub (a.s.) feryad etip başladı, onıñ
          kölmegini istedi. Onı yüzüne sürüp ağladı ve dedi ki: «Bugünge qadar böyle
          yımşaq tabiatlı bir qaşqır körmedim! Oğlumnı aşağan da, sırtındaki kölmegini
          yırtmağan!» Buña köre, Az.Yaqub olarnıñ iylesini duyğan. Faqat yapılacaq bir şey
          yoq edi).
        cid: 0
  - verse: 19
    segments:
      - text: >
          Bir kervan keldi ve suvcılarını (quyuğa) yolladılar, o da (barıp) qopqasını
          yiberdi, (Yusufnı körgeninen) «Müjde! İşte, bir oğlan!» dedi. Onı bir ticaret
          malı olaraq saqladılar. Allah olarnıñ yapqanlarını çoq yahşı bilir.
        cid: 0
  - verse: 20
    segments:
      - text: >
          (Kervan Mısırğa barğanda) onı degersiz bir fiyatnen, belli bir qaç dirhemge
          sattılar. Olar, zaten oña deger bermegen ediler. (Ayetniñ soñki qısmını
          «...zaten, onı aman elden çıqarmaq istey ediler», şeklinde çevirmek de mümkün).
        cid: 0
  - verse: 21
    segments:
      - text: >
          Mısırda onı satın alğan adam, qadınına dedi ki: «Oña deger ber ve güzel baq!
          Belki, bizge faydası olur. YA da onı evlât etermiz». İşte, böylece (Mısırda
          adaletnen üküm etüvi) ve özüne (ruyadaki) vaqialarnıñ yorumını ögretüvimiz içün,
          Yusufnı o yerge yerleştirdik. Allah emirini yerine ketirmege qadirdir. Faqat
          insanlarnıñ çoqu (bunı) bilmezler. (Tefsirlerdeki rivayetke köre, Az.Yusufnı
          imayesine alğan bu zat Mısırnıñ maliye naziri edi. O Az.Yusufnıñ zekâsı ve
          qabiliyetini sezgen, bunıñ içün ileride ondan devlet işlerinde faydalana
          bilecegini tüşüngen edi. Ayrıca, soñ derece sevimli bir bala olğan Az.Yusufnı
          evlât ete bileceklerini söylegen ediler. Çünki, balaları yoq edi).
        cid: 0
  - verse: 22
    segments:
      - text: >
          Yusuf aqıl-baliğ çağına kelgeninen, oña (doğrulıqnen) üküm etüv (meareti) ve
          ilim berdik. İşte, güzel davranğanlarnı biz böyle mükâfatlandırırmız.
        cid: 0
  - verse: 23
    segments:
      - text: >
          (Yusuf) bulunğan evniñ qadını onıñ nefsinden faydalanmaq istedi, qapularnı yahşı
          qapattı ve «Aydı, kel!» dedi. O da: «(Yoq!), Allahqa sığınırım! Zira, qocañız
          menim velinimetimdir, maña güzel davrandı. Aqiqat şu ki, zalımlar qurtulışqa
          irişalmaz!» dedi. (Az.Yusuf büyügen, yetişken ve körümli bir genç olğan edi.
          Onıñ bu alı yaşağan evniñ hanımında özüne nisbeten çeşit duyğularnıñ peyda
          oluvına sebep olğan ve qadın Az.Yusufqa ğayrıqanuniy munasebet teklif etken
          edi).
        cid: 0
  - verse: 24
    segments:
      - text: >
          Ant olsun ki, qadın oña meyl berdi. Eger Rabbiniñ işareti ve tenbiyesini körmese
          edi, o da qadınğa meyl etken edi. İşte, böylece, biz fenalıq ve fuhuşnı ondan
          uzaqlaştırmaq içün (delilimizni kösterdik). Şübesiz, o ihlâslı qularımızdan edi.
          (Tefsircilerniñ çoquna köre, Az. Yusufnıñ qadınğa bu meyli cinsel bir meyl edi.
          Faqat bazı tefsirciler peyğamberlerniñ böyle bir meylge qapıluvından qorçalanğan
          ve uzaq olğanlarını bildirerek, ayetteki ait sözni: «O da qadınnı dögmege niyet
          etken edi. Faqat Allahnıñ tenbiyesinen bundan vazgeçti», şeklinde yorumlağanlar.
          Er alda, Az. Yusuf bu niyet ve meylden vazgeçken edi).
        cid: 0
  - verse: 25
    segments:
      - text: >
          Ekisi de qapuğa doğru çaptılar. Qadın onıñ kölmegini arttan yırttı. Qapunıñ
          yanında onıñ qocasına rastkeldiler. Qadın dedi ki: Seniñ aileñe fenalıq yapmaq
          istegenniñ cezası - zindanğa atıluvından ya da elem berici bir eskenceden başqa
          ne ola bilir!
        cid: 0
  - verse: 26
    segments:
      - text: >
          Yusuf: «Aslı özü menim nefsimden faydalanmaq istedi», dedi. Qadınnıñ
          aqrabasından biri böyle şaatlıq etti: «Eger kölmegi ögden yırtılğan ise, qadın
          doğru söylegen, bu ise, yalancılardandır».
        cid: 0
  - verse: 27
    segments:
      - text: >
          «Eger kölmegi arttan yırtılğan ise, qadın yalan söylegen. Bu ise, doğru
          söylegenlerdendir».
        cid: 0
  - verse: 28
    segments:
      - text: >
          (Qocası Yusufnıñ kölmeginiñ) arttan yırtılğanını körgeninen, (qadınğa) :
          «Şübesiz, dedi; bu, siziñ tuzağıñızdır. Siziñ tuzağıñız aqiqaten büyüktir».
        cid: 0
  - verse: 29
    segments:
      - text: >
          «Ey, Yusuf! Sen bundan (olğanlarnı söylemekten) vazgeç! (Ey, qadın!) Sen de
          günahıñnıñ afusını tile! Çünki, sen günahkârlardan oldıñ».
        cid: 0
  - verse: 30
    segments:
      - text: >
          Şeerdeki bazı qadınlar dedi ki: Azizniñ qadını deliqanlısınıñ nefsinden
          faydalanmaq istey emiş; Yusufnıñ sevdası onıñ yüregine kirgen! Biz onı, aqiqaten
          açıq bir sapıqlıq içinde körmektemiz.
        cid: 0
  - verse: 31
    segments:
      - text: >
          Qadın, olarnıñ emiş-demişlerini eşitkeninen, olarğa davetçi yolladı; olar içün
          dayanmağa yastıqlar azırladı. Er birine birer pıçaq berdi. (Qadınlar meyvalarnı
          keskende), (Yusufqa): «Çıq qarşılarına!», dedi. Qadınlar onı körgenlerinen, onıñ
          büyükligini añladılar. (Şaşqanlarından) ellerini kestiler ve dediler ki: YA
          Rabbimiz! Bu bir beşer degil ... Bu, ancaq üstün bir melek! («Dayanmağa
          yastıqlar» diye tercime etilgen «Muttekeen» kelimesi «Yemek meclisi» şeklinde de
          añlaşıla bilir. Çünki, olar ferahlı insanlarnıñ adeti olğanı üzre, aşağanda,
          içkende ve subet etkende arqalarına tayana ediler. Bunıñ içün, tayanaraq aş
          aşamaq yasaqlanğan. Bu mevzudaki Caabir hadisi böyledir: «Allah Resulı sol
          elimiznen ve arqamızğa tayanaraq aşamamıznı yasaqladı»).
        cid: 0
  - verse: 32
    segments:
      - text: >
          Qadın dedi ki: İşte, aqqında meni tenqit ettigiñiz şahıs budır. Men onıñ
          nefsinden faydalanmaq istedim. Faqat o, (bundan) şiddetnen saqındı. Ant olsun,
          eger o özüne emir etecegimni yapmasa, mıtlaqa zindanğa atılacaq ve elbette
          sürüngenlerden olacaq!
        cid: 0
  - verse: 33
    segments:
      - text: >
          (Yusuf:) Rabbim! Maña zindan, bularnıñ menden istegenlerinden daa yahşıdır! Eger
          olarnıñ iylelerini menden çevirmeseñ, olarğa meyl eter ve caillerden olurım!
          dedi.
        cid: 0
  - verse: 34
    segments:
      - text: >
          Rabbi onıñ duasını qabul etti ve olarnıñ iylesini uzaqlaştırdı. Çünki, O, çoq
          yahşı eştici, pek yahşı bilicidir.
        cid: 0
  - verse: 35
    segments:
      - text: >
          Soñunda (Aziz ve arqadaşları) kesen-kes delillerni körgenlerine rağmen, (halqnıñ
          emiş-demişini kesmek içün, kene de) onı bir müddetke qadar mıtlaqa zindanğa
          atuvları özlerine uyğun köründi.
        cid: 0
  - verse: 36
    segments:
      - text: >
          Onıñnen birlikte zindanğa eki deliqanlı daa kirdi. Olardan biri dedi ki: Men
          (tüşte) şarap sıqqanımnı kördim. Digeri de: Men de başımnıñ üstünde quşlar
          aşağan bir yemek taşığanımnı kördim. Bunıñ yorumını bizge haber ber. Çünki, biz
          seni güzel davranğanlardan körmektemiz, dedi.
        cid: 0
  - verse: 37
    segments:
      - text: >
          (Yusuf) dedi ki: Sizge aşatılacaq aş kelmeden evel, onıñ yorumını mıtlaqa sizge
          haber berecem. Bu, Rabbimniñ maña ögretkenlerindendir. Şübesiz, men Allahqa
          inanmağan bir qavmnıñ dininden uzaqlaştım. Olar ahiretni inkâr etkenlerniñ
          özleridir. (Az. Yusuf gençlerniñ bu vaziyetinden faydalanaraq, olarğa tevhid
          dinini añlatmaq istedi. Tolayısınen, olarnıñ ruyalarını yorumlamadan evel,
          özüniñ haq din üzerinde olğanını, bilgileriniñ Allah tarafından ögretilgenini ve
          mısırlılarnıñ yañlış yolda olğanlarını bildirerek, olarnı azırladı ve haq dinni
          olarğa tebliğ etti. İşte, bu ve bundan soñki üç ayet bunıñnen bağlıdır).
        cid: 0
  - verse: 38
    segments:
      - text: >
          Atalarım İbrahim, İshaq ve Yaqubnıñ dinine uydım. Allahqa er angi bir şeyni
          ortaq qoşuvımız bizge yaraşmaz. Bu, Allahnıñ bizge ve insanlarğa olğan
          lütfindendir. Faqat insanlarnıñ çoqu şükür etmezler.
        cid: 0
  - verse: 39
    segments:
      - text: >
          Ey, zindan arqadaşlarım! Çeşit tañrılar daa yahşımı, yoqsa, küçüne qarşı
          turılmaycaq tek bir Allahmı?
        cid: 0
  - verse: 40
    segments:
      - text: >
          Allahnı bıraqıp da, tabınğanlarıñız, siziñ ve atalarıñıznıñ taqqan bir taqım
          isimlerden başqa bir şey degil. Allah olar aqqında er angi bir delil endirmegen.
          Üküm, sadece, Allahqa aittir. O, sizge özünden başqasına ibadet etmemeñizni emir
          etkendir. İşte, dos-doğru din budır. Faqat insanlarnıñ çoqu bilmezler.
        cid: 0
  - verse: 41
    segments:
      - text: >
          Ey, zindan arqadaşlarım! (Ruyalarıñızğa kelgende), biriñiz (daa evel olğanı kibi
          ) efendisine şarap içirecek; digeri ise, asılacaq ve quşlar onıñ başından
          (miyini) aşaycaqlar. Yorumını sorağan işiñiz (bu şekilde) kesen-kesleşkendir.
        cid: 0
  - verse: 42
    segments:
      - text: >
          Olardan qurtulacağını bilgen kimsege dedi ki: Meni efendiniñ yanında añ (belki,
          meni çıqarır). Faqat şeytan oña, efendesine añmaqnı unuttırdı. Tolayısınen,
          (Yusuf), bir qaç sene daa zindanda qaldı. (Bazı tefsircilerge köre, Az.Yusuf,
          Allahtan başqasından yardım istegeni içün, beş yıllıq apslikten soñ, yedi yıl
          daa apste qaluvğa mahküm oldı. Böylece, aps müddeti on eki yıl sürdi. Bu yerde
          aqılğa böyle bir sual kele bilir: Çeşit ayet ve hadislernen başqasından yardım
          istemek qanuniy qabul etilgenine, atta yerine köre, kâfirden de yardım istenile
          bilecegine köre, Az.Yusufnıñ Allahtan başqasından da medet ümüt etüvi niçün hoş
          qarşılanmağan? Bunıñ cevabı şudır: Allah, peyğamberlerini, yaratqanlarınıñ
          üzerine üstün yapqanı kibi, işlerniñ eñ yahşısını, eñ güzelini ve eñ üstünini
          de, olarğa yaqıştırğan. Peyğamber içün eñ üstün qıyınlıqqa qalğanda, Rabbinden
          başqasına tayanmaması ve el açmamasıdır).
        cid: 0
  - verse: 43
    segments:
      - text: >
          Qıral dedi ki: Men (ruyada) yedi arıq sığırnıñ, yedi semiz sığırnı aşağanını
          kördim. Ayrıca, yedi yeşil başaq ve başqalarını da quru kördim. Ey, ileri
          kelgenler! Eger ruya yorumlay iseñiz, menim ruyamnı da, maña yorumlañ.
        cid: 0
  - verse: 44
    segments:
      - text: >
          (Yorumcılar) dediler ki: Bular qarma-qarışıq tüşlerdir. Biz böyle tüşlerniñ
          yorumını bilgenlerden degilmiz. (İslâm alimleri ruya vaqiasını üç sınıfqa
          ayırğanlar: 1. Allahtan olğan tenbiye ve işaretler, 2. Nefisten kelip çıqqan
          tüş, 3. Şeytannıñ qorqızuvı ve saptıruvları).
        cid: 0
  - verse: 45
    segments:
      - text: >
          (Zindandaki) eki adamdan qurtulğan soyu, uzun bir zamandan soñ, (Yusufnı)
          hatırlayaraq, dedi ki: Men sizge onıñ yorumını haber beririm, meni aman
          (zindanğa) yollañ.
        cid: 0
  - verse: 46
    segments:
      - text: >
          (Yusufnıñ yanına kelerek, dedi ki:) Ey, Yusuf, ey, doğru sözlü adam! (Ruyada
          körülgen yedi arıq sığırnıñ aşağan yedi semiz sığırnen, yedi yeşil başaq ve
          digirleri de quru olğan başaqlar) aqqında bizge yorum yap. Ümüt eterim ki,
          insanlarğa (doğru yorumıñnen) qaytırım da, belki, olar da doğrunı ögrenirler.
        cid: 0
  - verse: 47
    segments:
      - text: >
          Yusuf dedi ki: Yedi sene, adetiñiz üzre, ekin ekersiñiz. Soñra da
          aşaycaqlarıñızdan az bir miqdarından ğayrı, çalğanlarıñıznı başağınen (sarpan
          etip) bıraqıñız.
        cid: 0
  - verse: 48
    segments:
      - text: >
