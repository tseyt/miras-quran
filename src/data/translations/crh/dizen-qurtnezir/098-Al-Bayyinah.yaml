surah_id: 98
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >
          Ap-açıq delil olarğa kelgenge qadar, ehl-i kitaptan ve müşriklerden inkârcılar
          (küfürden) ayrılacaq degil ediler.
        cid: 0
  - verse: 2
    segments:
      - text: >
          (İşte, o ap-açıq delil) Allah tarafından yollanılğan ve eñ doğru ükümlerni içine
          alğan, ter-temiz saifelerni oquğan bir elçidir.
        cid: 0
  - verse: 3
    segments:
      - text: >
          [2 ayetine baq.]
        cid: 0
  - verse: 4
    segments:
      - text: >
          Özlerine kitap berilgenler ancaq o açıq delil (Peyğamber) olarğa kelgenden soñ
          bölündiler.
        cid: 0
  - verse: 5
    segments:
      - text: >
          Albuki, olar ancaq dinni yalıñız Oña has qılaraq ve hanifler olaraq, Allahqa
          qullıq etüvleri, namaz qıluvları ve zekât berüvleri emir olunğan edi. Dos-doğru
          din de - budır. («Hanif» ne olğanı aqqında Ruum suresiniñ 30-nci ayeti izaatına
          baq.).
        cid: 0
  - verse: 6
    segments:
      - text: >
          Ehl-i kitap ve müşriklerden olğan inkârcılar içinde ebediy olaraq qalacaq
          ceennemleri ateşindedirler. İşte, halqnıñ eñ şerrlileri olardır.
        cid: 0
  - verse: 7
    segments:
      - text: >
          İman etip, salih ameller işlegenlerge kelgende, halqnıñ eñ hayırlısı da olardır.
        cid: 0
  - verse: 8
    segments:
      - text: >
          Olarnıñ Rabbleri qatındaki mükâfatları - zemininden irmaqlar aqqan, içinde
          daimiy olaraq qalacaq Adn cennetleridir. Allah olardan hoşnut olğan, olar da
          Allahtan hoşnut olğanlar. Bu aytılğanlar ep Rabbiñden qorqqan (Oña sayğı
          köstergenler) içündir.
        cid: 0
