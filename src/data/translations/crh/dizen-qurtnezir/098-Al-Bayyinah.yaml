surah_id: 98
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >-
          Ap-açıq delil olarğa kelgenge qadar, ehl-i kitaptan ve muşriklerden inkârcılar
          (kufürden) ayrılacaq degil ediler.
        cid: 0
  - verse: 2
    segments:
      - text: >-
          (İşte, o ap-açıq delil) Allaһ tarafından yollanılğan ve eñ doğru ukümlerni
          içine alğan, ter-temiz saifelerni oquğan bir elçidir.
        cid: 0
  - verse: 3
    segments:
      - text: >-
          [2 ayetine baq.]
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Ozlerine kitap berilgenler ancaq o açıq delil (Peyğamber) olarğa kelgenden soñ
          bolündiler.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Albuki, olar ancaq dinni yalıñız Oña has qılaraq ve hanifler olaraq, Allaһqa
          qullıq etüvleri, namaz qıluvları ve zekât berüvleri emir olunğan edi. Dos-doğru
          din de - budır. («Hanif» ne olğanı aqqında Ruum suresiniñ 30-nci ayeti izaatına
          baq.).
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Ehl-i kitap ve muşriklerden olğan inkârcılar içinde ebediy olaraq qalacaq
          ceennemleri ateşindedirler. İşte, halqnıñ eñ şerrlileri olardır.
        cid: 0
  - verse: 7
    segments:
      - text: >-
          İman etip, salih ameller işlegenlerge kelgende, halqnıñ eñ hayırlısı da
          olardır.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Olarnıñ Rabbleri qatındaki mukâfatları - zemininden irmaqlar aqqan, içinde
          daimiy olaraq qalacaq Adn cennetleridir. Allaһ olardan hoşnut olğan, olar da
          Allaһtan hoşnut olğanlar. Bu aytılğanlar ep Rabbiñden qorqqan (Oña sayğı
          kostergenler) içündir.
        cid: 0