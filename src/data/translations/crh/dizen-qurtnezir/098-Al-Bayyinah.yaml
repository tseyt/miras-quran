surah_id: 98
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "İçindeki hazinelerni tışqa çıqarır, faqat olarğa baqqan olmaz."
        cid: 0
  - verse: 2
    segments:
      - text: "Qabirlerdeki olüler tirilir."
        cid: 0
  - verse: 3
    segments:
      - text: "Yer altındaki madenler, gazlar, yanardağlar tışqa fırlanır)."
        cid: 0
  - verse: 4
    segments:
      - text: "Ehl-i kitap ve muşriklerden olğan inkârcılar içinde ebediy olaraq qalacaq ceennemleri ateşindedirler. İşte, halqnıñ eñ şerrlileri olardır."
        cid: 0
  - verse: 5
    segments:
      - text: "İman etip, salih ameller işlegenlerge kelgende, halqnıñ eñ hayırlısı da olardır."
        cid: 0
  - verse: 6
    segments:
      - text: "O kunü insanlar amellerini korüvleri (qarşılığını aluvları) içün darmadağınıq keri qaytıp kelirler."
        cid: 0
  - verse: 7
    segments:
      - text: "Kim zerre miqdarı hayır yapqan ise, onı korer."
        cid: 0
  - verse: 8
    segments:
      - text: "Kim de zerre miqdarı şerr işlegen ise, onı korer. (Er ağırlığını tışqa çıqaruvı bir-qaç türlü tefsir etilgen."
        cid: 0
  - verse: 99
    segments:
      - text: "ez-ZİLZAAL Teprenüv demek olğan «zilzaal» kelimesi sureniñ ilki ayetinde keçe. Nisaa suresinden soñ, Medinede engen, 8 ayettir. Qıyametniñ qopuvından, insanlarnıñ ğayrıdan tirilip, esap berüvlerinden, er kesniñ -yahşı ya da yaman- yapqanını bulacağından baas etile. Bismilâaһirraһmaanirraһiim (Rahman ve rahim olğan Allaһnıñ adınen). 1-5. Yer qurresi ozüne has sarsıntısınen sallanğan, topraq ağırlıqlarını tışqa çıqarğan ve insan: «Ne olmqta buña!», degen vaqıtta, işte, o kunü (er) Rabbiñniñ oña bildirüvinen, butün haberlerini añlatır."
        cid: 0