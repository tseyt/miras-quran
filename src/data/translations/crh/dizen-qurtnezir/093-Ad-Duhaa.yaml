surah_id: 93
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "Quşluq vaqtına ve sukünetke irişkeniñde gecege yemin eterim ki, Rabbiñ seni bıraqmadı ve saña darılmadı. (Biraz vaqıt vahiyniñ kelüvi keçikti. Muşrikler: «Rabbi onı terk etti, oña darıldı!», dediler. Bu laqırdılar ve sataşuvlar Efendimizge ağır kele edi. İşte, bu, husus ayetlernen izaat etildi)."
        cid: 0
  - verse: 2
    segments:
      - text: "[1 ayetine baq.]"
        cid: 0
  - verse: 3
    segments:
      - text: "[1 ayetine baq.]"
        cid: 0
  - verse: 4
    segments:
      - text: "Aqiqaten, sen içün ahiret dünyadan daa hayırlıdır."
        cid: 0
  - verse: 5
    segments:
      - text: "Pek yaqında Rabbiñ saña berecek de, hoşnut olacaqsıñ."
        cid: 0
  - verse: 6
    segments:
      - text: "O, seni yetim bulıp, barındırmadımı?"
        cid: 0
  - verse: 7
    segments:
      - text: "Şaşmalağan bulıp da, yol kostermedimi?"
        cid: 0
  - verse: 8
    segments:
      - text: "Seni faqır bulıp, zengin etmedimi?"
        cid: 0
  - verse: 9
    segments:
      - text: "Oyle ise, yetimni saqın ezme!"
        cid: 0
  - verse: 10
    segments:
      - text: "El açıp, istegenni de, saqın azarlama."
        cid: 0
  - verse: 11
    segments:
      - text: "Ve Rabbiñniñ nimetini minnetdarlıq ve şukran ile añ."
        cid: 0