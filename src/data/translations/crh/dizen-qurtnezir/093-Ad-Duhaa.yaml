surah_id: 93
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: Quşluq vaqtına
        cid: 1
      - text: >-
          ve sükünetke irişkeniñde gecege yemin eterim ki, Rabbiñ seni bıraqmadı ve saña
          darılmadı. (Biraz vaqıt vahiyniñ kelüvi keçikti. Müşrikler: «Rabbi onı terk etti,
          oña darıldı!», dediler. Bu laqırdılar ve sataşuvlar Efendimizge ağır kele edi. İşte,
          bu, husus ayetlernen izaat etildi).
        cid: 0
  - verse: 2
    segments:
      - text: >-
          [1 ayetine baq.]
        cid: 0
  - verse: 3
    segments:
      - text: >-
          [1 ayetine baq.]
        cid: 0
