      - text: degil!
        cid: 5
      - text: >
          ("Aalemiin" - aalem kelimesiniñ çoqluğıdır. İnsan, melek ve cin kibi aqıl saibi
          yaratılğanlarnıñ episini içine alğan kâinatnıñ adıdır. Bazıları da Allahnıñ
          barlığına delâlet etici er şeyge aalem denilgenini söylegenler. Rahmaan - eyi
          olsun, fena olsun, mü'min olsun, kâfir olsun, ayırdı yapmayıp, dünyada nimetini
          er keske berici Allah demektir. Rahiim - ahirette nimetlerini yalıñız
          mü'minlerge berici manasındadır. Cenab-ı Allah dünyada er keske nimet bergeni
          alda, özüne inanğanlarğa ahirette ayrıca muamele yapacaq. Qur'anda keçken
          "Rahmaan" ve "Rahiim" kelimeleri ep bu manada qullanılğan. Ceza künü - ahirette
          er kesniñ esabı çekilip, eyiniñ eyi, fenanıñ fena qarşılıq alacaq mahkeme
          künüdir. Tefsircilerniñ añlatqanlarına köre, özlerine lütf ve ihsanda bulunılğan
          kimseler, peyğamberler ve olarnıñ yolunda yürgenlerdir. Ğadapqa oğrağanlar -
          yeudiyler, sapıqlar ise - hristianlar olğanı rivayet etile. Bunıñnen beraber,
          doğru yoldan sapmaq ve Allahnıñ ğadabına oğramaq yalıñız hristianlar ve
          yeudiylerge ait degil. 6-ncı ayette Allah Taalâdan bizni "doğru yol"ğa qoyuvı
          istenile, 7-nci ayette ise, doğru yolnıñ ne olganı añlatıla. Bu da, başında
          Peyğamber olmaq üzre, eyilerniñ yolunı eyi, fenalarnıñ yolunı da fena olaraq
          köstermektir, işte Qur'annıñ büyük bir qısmı bu eki ayetniñ tefsiri
          şeklindedir).
        cid: 0
