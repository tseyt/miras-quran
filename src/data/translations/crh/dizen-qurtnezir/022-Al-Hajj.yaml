      - text: >-
          (Bu ayet dinge qalbiy bir inançnen degil de, özüne dünyaviy bir fayda ketirecigini
          ümüt etkenlerni tenqit ete. Bunıñ kibi, tevsirlerde aytılğanına köre, bu ayet
          «earib» denilgen bir qabile aqqında nazil olğan. Olar Medinege icret etken ediler.
          Aralarından biri bedeni sağlam olğanı, atları güzel qulunlar bergeni, qadını
          tendürüst balalar doğurğanı, malı-mülkü artqan vaqıtta, «Ne yahşı ettim de, şu dinge
          kirdim! Bu sayede çoq şeyler qazandım!», diyerek sevine edi. Vaziyet tersine dönüp,
          bir ziyanğa oğrağanda ise, «Başıma bir taqım yamanlıqlar keldi!..» kibi sözlernen
          dinden çıqa edi).
        cid: 0
