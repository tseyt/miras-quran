        cid: 0
  - verse: 19
    segments:
      - text: "İnanğanlar arasında çirkin şeylerniñ yapıluvını istegen kimseler içün, dünyada da, ahirette de çetin bir ceza bardır. Allaһ bilir, siz bilmezsiñiz."
        cid: 0
  - verse: 20
    segments:
      - text: "Ya siziñ ustüñizge Allaһnıñ lütf ve merhameti olmasa edi, Allaһ çoq şefqatlı ve merhametli olmasa edi (alıñız nice olur edi)!"
        cid: 0
  - verse: 21
    segments:
      - text: "Ey, iman etkenler! Şeytannıñ adımlarını taqip etmeñ. Kim şeytannıñ adımlarını taqip etse, muaqqaq ki o, edepsizlikni (üz qızartıcı qabaatlarnı) ve fenalıqnı emir eter. Eger ustüñizde Allaһnıñ lütf ve merhameti olmasa edi, arañızdan iç bir kimse asla temizge çıqalmaz edi. Faqat Allaһ istegenini arındırır. Allaһ eşitir ve bilir."
        cid: 0
  - verse: 22
    segments:
      - text: "Arañızdan faziletli ve servet saibi kimseler aqarabağa, yoqsullarğa, Allaһ yolunda koç etkenlerge (mallarından) bermeyceklerine yemin etmesinler; bağışlasınlar; ferağat kostersinler. Allaһnıñ sizni bağışlavunı arzulamazsıñızmı? Allaһ çoq bağışlayıcıdır, çoq merhametlidir. (Az. Ayşege iftira etkenlerden biri de, Az. Ebu Bekirniñ, imayesini ve baqımını uzerine alğan Mıstah adlı bir adam edi. Bu adise uzerine, Az. Ebu Bekir bir daa bu adamğa maddiy yardımda bulunmaycağına dair yemin etti. İşte, tefsircilerge kore, yuqarıdaki ayette em Az. Ebu Bekir (r.a.)niñ faziletine işaret etile, em de oña ve başqa mu’minlerge Allaһ rizası içün yapıp kelgen yardımlarını kesmemeleri ogütlene). 23-24. Namuslı, fenalıqlardan habersiz mu’min qadınlarğa zina iftirası yapqanlar, dünya ve ahirette lânetlengenlerdir. Yapqanlarına, tilleri, elleri ve ayaqlarınıñ aleyhlerinde şaatlıq etecek kunü, olar içün çoq buyuk bir azap bardır."
        cid: 0
  - verse: 23
    segments:
