  - verse: 35
    segments:
      - text: "Allaһ - koklerniñ ve yerniñ nurıdır. Onıñ nurınıñ temsili, içinde lampa bulunğan bir qandillik kibidir. O lampa kristal bir fanus içindedir; o fanus da sanki incige beñzegen bir yıldız kibidir ki, şarqqa da, ğarpqa da nisbet etilmegen mubarek bir terekten, yani zeytundan (çıqqan yağdan) tutaştırılır. Onıñ yağı, nerede ise, oña ateş tiymese bile, ışıq berir. (Bu,) nur ustüne nurdır. Allaһ istegen kimsesini nurına qavuştırır. Allaһ insanlarğa (işte boyle) temsiller ketirir. Allaһ er şeyni bilir. (Allaһnıñ nur oluvınıñ manası - butün alemniñ ve alemdeki butün issiy nurlarnıñ ve idrak etici kuçlerniñ yaratıcısı ve icat eticisi oluvıdır. Bu alda nurdan asıl umüt etilgen aydınlatuv, aşkâr etüv, ortağa çıquv ve inkişaf manalarınıñ temeli, nurdan ve nurnı alğandan çoq, nurnı yapıp yaratqanğa ait olacağı içün «Nuur» ismi Allaһqa daa lâyıqtır. Ancaq, bundan tolayı, nurnı yaratqnğa «Nuur» denilüvi, til noqtai nazarından, aqiqat degil, micazdır)."
