surah_id: 22
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "Ey, insanlar! Rabbiñizden qorquñ! Çünki, qıyamet vaqtınıñ tepremi mudhiş bir şeydir!"
        cid: 0
  - verse: 2
    segments:
      - text: "Onı korgen kunüñiz, er emizikli qadın emizgen balasını unutır, er yuklü qadınnıñ balası tüşer. İnsanlarnı da sarğoş bir alda korersiñ. Albuki, olar sarğoş degillerdir; faqat Allaһnıñ azabı çoq deşetlidir!"
        cid: 0
  - verse: 3
    segments:
      - text: "İnsanlardan, bilgisi olmayıp, Allaһ aqqında tartışmağa kirişken ve er inatçı şeytanğa uyğan bir taqım kismeler bar. (Bazı tefsircilerge kore, bu ayetteki «şeytan»nıñ manası inkârcılarnıñ ileri kelgenleri, şeytan qadar yoldan azğanları da ola bilir)."
        cid: 0
  - verse: 4
    segments:
      - text: "Onıñ (şeytan) aqqında boyle yazılğan: Kim onı yoldaş etse, bilsin ki, (şeytan) onı saptıracaq ve alevli ateş azabına süyrekleycek."
        cid: 0
  - verse: 5
    segments:
      - text: "Ey, insanlar! Eger yañıdan tirilüvden şubelenseñiz, şunı biliñ ki, biz sizni topraqtan, soñ nutfeden, soñra alaqadan (aşlanğan yımırtadan), soñra azaları (evelâ) bellisiz, (soñra belli olğan canlı et parçasından) azaları vaqtı ile yetilgen hamileden) yarattıq ki, sizge (qudretimizni) kostereyik. Ve istegenimizni belgilengen bir muddetke qadar rahimlerde bekletirmiz; soñ sizni bir sabiy olaraq tışarı çıqarırmız. Soñ kuçlü çağıñızğa irişmeñiz içün (sizni buyultirmiz). Arañızdan kimisi vefat eter; kene arañızdan kimisi de omürniñ eñ çıqımsız çağına qadar ketirilir; ta ki bilgen bir kimse olğan soñ, bir şeyni bilmez alğa kelsin. Sen yer yuzüni de qup-quru ve olü bir alda korersiñ; faqat biz, uzerine yağmur yağdırğanımızda, o qıbırdanır, qabarır ve er çeşitten (ya da çiftten) goñyul hoşlayıcı ekinler berir. (Allaһ Taalâ bu ayette olgenden soñ, tekrar tirilmekni inkâr etkenlerge qarşı, evelâ insan yaratılışınıñ ketişatını bediiy bir şekilde ifade ete. Bu yerde insannıı nutfe, yani sperma alından başlap, dünyağa kelgenine qadar ki, bu yetilüvni beyan etilgen. «Alaqa» kelimesi arapçada «ilişik, ilişki, kilit, sulük, tutunmaq, yaqalanmaq, qatqan qan» kibi manalarda qullanılmaqtadır. İnsannıı yetilüvinde qullanılğan «alaqa» qadınnıı sperma tarafından aşlanğan ve rahimge yerleşken yımırtasıdır)."
        cid: 0
  - verse: 6
    segments:
      - text: "Çünki, Allaһ haqnıñ tam ozüdir; O, olülerni tiriltir; kene O, er şeyge haqqı ile qadirdir."
        cid: 0
  - verse: 7
    segments:
      - text: "Qıyamet vaqtı da kelecek; buña şube yoq. Ve Allaһ qabirlerdeki kimselerni tiriltip tursatacaq."
        cid: 0
  - verse: 8
    segments:
      - text: "İnsanlardan bazısı, bir bilgisi, bir reberi ve (vahiyge tayanğan) aydınlatıcı bir kitabı olmağanı alda, yalıñız Allaһ yolundan saptırmaq içün, yanını egip-bukerek (kibir ve azamet içinde), Allaһ aqqında tartışmağa qalqar. Onıñ içün dünyada bir rezillik bardır; qıyamet kunünde ise, oña yaqıcı azapnı tattıracaqmız."
        cid: 0
  - verse: 10
    segments:
      - text: "İşte bu, evelden yapqan-etkenleriñniñ sebebindendir (denilir). Elbette, Allaһ qullarına aqsızlıq etici degildir."
        cid: 0
  - verse: 11
    segments:
      - text: "İnsanlardan kimisi Allaһqa yalıñız bir taraftan qullıq eter. Yani: Ozüne bir yahşılıq toqunsa, buña pek memnun olur, bir de musibetke oğrasa, çeresi deñişir (dinden yuz çevirir). O, dünyasını da, ahiretini de ğayıp etkendir. İşte bu, apaçıq ziyannıñ tam ozüdir. (Bu ayet dinge qalbiy bir inançnen degil de, ozüne dünyaviy bir fayda ketirecigini umüt etkenlerni tenqit ete. Bunıñ kibi, tevsirlerde aytılğanına kore, bu ayet «earib» denilgen bir qabile aqqında nazil olğan. Olar Medinege icret etken ediler. Aralarından biri bedeni sağlam olğanı, atları guzel qulunlar bergeni, qadını tendürüst balalar doğurğanı, malımulkü artqan vaqıtta, «Ne yahşı ettim de, şu dinge kirdim! Bu sayede çoq şeyler qazandım!», diyerek sevine edi. Vaziyet tersine dönüp, bir ziyanğa oğrağanda ise, «Başıma bir taqım yamanlıqlar keldi!..» kibi sözlernen dinden çıqa edi)."
        cid: 0
  - verse: 12
    segments:
      - text: "O, Allaһnı bıraqıp, ozüne ne faydası, ne de zararı toqunacaq şeylerge yalvarır. Bu, (haqtan) bus-butün uzaq olğan sapıqlıqnıñ tam ozüdir."
        cid: 0
  - verse: 13
    segments:
      - text: "O, zararı faydasından daa (aqılğa) yaqın olğan bir varlıqqa yalvarır. O (yalvarğanı), ne fena bir yardımcı, ne fena bir dosttır!"
        cid: 0
  - verse: 14
    segments:
      - text: "Muaqqaq ki, Allaһ iman etip, yahşı davranışlarda bulunğan kimselerni zemininde irmaqlar aqqan cennetlerge qabul eter. Şubesiz, Allaһ istegen şeyini yapar."
        cid: 0
  - verse: 15
    segments:
      - text: "Er kim, Allaһ dünya ve ahirette oña (Resulına) asla yardım etmeycegini zan etmekte ise, (Allaһ oña yardım etkenine kore) artıq o kimse tavanğa bir yip atsın; (boğazına keçirsin); soñra da (ayağını yerden) kessin! Şimdi bu kimse baqsın! Aceba, iylesi (bu yapqanı), opke duyğan şeyine (Allaһnıñ Peyğamberge yardımına) aqiqaten mani olacaqmı? (Bu ayet şu manada da añlaşılır: «Er kim Allaһnıñ Resulına dünya ve ahirette yardım etmeycegini zan etse, bir merdivennen kokke çıqsın da, Peyğamberge kelgen vahiyni kessin! Bunı yapalmaycağına kore, şimdi baqsın, baqayıq iylesi, opke duyğan şeyge, yani Allaһnıñ Peyğamberge yapqan yardımna mani ola bilirmi?»)."
        cid: 0
  - verse: 16
    segments:
      - text: "İşte, boylece biz o Qur’annı açıq-seçik ayetler alında endirdik. Aqiqat şu ki, Allaһ istegen kimsesini hidayetke iriştirir."
        cid: 0
  - verse: 17
    segments:
      - text: "Mu’min olğanlar, yeudiy olğanlar, saabiyler, hristianlar, mecusiyler ve muşrik olğanlarğa kelgende, muaqqaq ki, Allaһ bular arasında qıyamet kunünde (ayrıayrı) ukmini berir. Çünki, Allaһ er şeyni aqqı ile bilicidir."
        cid: 0
  - verse: 18
    segments:
      - text: "Kormezsiñmi ki, koklerde olğanlar ve yerde olğanlar - kuneş, ay, yıldızlar, dağlar, terekler, ayvanlar ve insanlarnıñ bir çoqu Allaһqa secde etmekte; bir çoqunıñ uzerine de azap haq olğandır. Allaһ kimni hor ve haqir etse, artıq onı degerli qılacaq bir kimse yoqtır. Şubesiz, Allaһ istegenini yapar. (Allaһnıñ yaratqanları şuurl ve şuursız olmaq uzre, ekige ayırıla bilir. Aqıll ve şuurdan marum olğan yaratıqlar ilâhiy qanunlarğa tabiy olaraq, Oña boyun egmekte ve oz tillerinen (lisan-ı hal ile) Onı tenzih eterek, tesbihte bulunmaqtadırlar. Aqılll yaratıqlar olğan insanlarda seçüv urriyeti bardır. Allaһqa degil de, başqa şeylerge qullq etüvni ustün korgenler, insanlıq degerlerini ğayıp etken olurlar ve bunı olarğa kimse qazandıralmaz. Ayette sayılğan varlıqlarnıñ Allaһqa secde etüvleriniñ manası içün ayrıca baq. İsraa, 17/44)."
        cid: 0
  - verse: 19
    segments:
      - text: "Şu eki top, Rabbleri aqqında çekişken eki duşmandır: Şimdi, inkâr etkenler içün, ateşten bir urba biçilgendir. Olarnıñ başları ustünden qaynağan suv tökülecek!"
        cid: 0
  - verse: 20
    segments:
      - text: "Bunıñnen qarınlarınıñ içindeki (azalar) ve terileri iritilecek!"
        cid: 0
  - verse: 21
    segments:
      - text: "Bir de, olar içün demir qamçılar bardır."
        cid: 0
  - verse: 22
    segments:
      - text: "İstiraptan tolayı, o yerden er çıqmağa istegenlerinde, o yerge keri qaytırılırlar ve: «Tatıñız bu yaqıcı azapnı!» (denilir)."
        cid: 0
  - verse: 23
    segments:
      - text: "Muaqqaq ki, Allaһ, iman etip, yahşı davranışlarda olğanlarnı, zemininden irmaqlar aqqan cennetlerge qabul eter. Bular o yerde altın bilezliklernen ve incilernen bezenirler. O yerde kiyecekleri ise, yipektir."
        cid: 0
  - verse: 24
    segments:
      - text: "Ve olar sözniñ eñ guzeline yoneltilgen, maqtavğa lâyıq Allaһnıñ yoluna iriştirilgenlerdir. (Tefsircilerniñ çoquna kore, ayetteki «sözniñ eñ guzeli» ifadesiniñ manası Kelime-i Tevhid ya da Kelime-i Şeadettir)."
        cid: 0
  - verse: 25
    segments:
      - text: "İnkâr etkenler, Allaһnıñ yolundan ve -yerli, tıştan kelgen- butün insanlar içün bir (qıble ya da mabed) qıldığımız Mescid-i Haramdan (insanlarnı) çetleştirmege qalqqanlar (şunı bilmeliler ki) kim o yerde (boyle) zulum ile haqtan sapmaq istese, oña accı azaptan tattırırmız."
        cid: 0
  - verse: 26
    segments:
      - text: "Bir zamanlar İbrahimge Beytullahnıñ yerini azırlağan ve (oña boyle degen edik): Maña iç bir şeyni ortaq tutma; tavaf etkenler, ayaqta ibadet etkenler, ruku ve secdege barğanlar içün evimizni temiz tut."
        cid: 0
  - verse: 27
    segments:
      - text: "İnsanlar arasında hacnı ilân et ki, ister yayan olaraq, ister nice uzaq yoldan kelgen yorğun-arğın develer ustünde, ozlerine ait bir taqım faydalarnı yaqından korüvleri, Allaһnıñ ozlerine rızıq olaraq bergen qurbanlıq ayvanları uzerine belli kunlerde Allaһnıñ ismini añuvları (qurban çaluvları içün) saña (Kâbege) kelsinler. Artıq ondan em ozüñiz aşañ, em de yoksulğa, faqırğa aşatıñ. (Tefsircilerge kore, ayetniñ birinci cumlesinde işaret etilgen faydalar, em dünyaviy, em de uhreviydir. Dünyaviyleri, hacnıñ insan uzerinde meydanğa ketirgen ahlâqiy tesirlerinen ticariy ve içtimaiy faydalardır. Uhreviyleri ise, Allaһnıñ hoşnutlığı ve Onıñ mu’minlerge olğan afu ve mağfiretidir. Musulmanlarğa, Allaһnıñ ismini añaraq, qurban çaluvları emir etilgen «belli kunler»ge «eyyam-ı nahr - qurban çaluv kunleri» denilir ki, bular - Zilhicce ayınıñ 10, 11 ve 12-nci kunleridir)."
        cid: 0
  - verse: 29
    segments:
      - text: "Soñra kir-paslardan temizlensinler; adaqalarını yerine ketirsinler ve o Eski Evni (Kâbeni) tavaf etsinler. (Hacılarnıñ kir-paslarını temizlevleri demekniñ manası - esasen tıraş oluvları, tırnaqlarını kesüvleri, qoltuq astlarını ve qasıqlarını temizlevleri ve umumen, butün bedeniy kirlerden arınuvlarıdır. «Eski Evni Tavaf etsinler» demek - «Kâbeniñ etrafını dolaşsınlar» demektir ki, bir kere dolaşmağa bir «şavt» denilir. Tavaf yedi şavttan ibarettir. Bulardan dörtü farz, uçü vaciptir. Bu, hacnıñ ruknlerinden olğan tavaftır ve oña «tavaf-ı ziyaret» denilir. Ayrıca, bir de «tavaf-ı quduum» ve «tavaf-ı sader» bardır ki, birincisi, Kâbege ilki barılğanda yapılğan qavuşuv tavafı, digeri de ayırılğanda yapılğan veda tavafıdır)."
        cid: 0
  - verse: 30
    segments:
      - text: "Vaziyet boyle. Er kim Allaһnıñ emir ve yasaqlarına sayğı kosterse, bu, Rabbiñniñ qatında onıñ içün daa hayırlıdır. (Aram olğanı) sizge oqulğanlardan başqa, qalğan ayvanlar sizge elâl qılındı. O alda, pislikten, putlardan saqınıñ; yalan sözden saqınıñ."
        cid: 0
  - verse: 31
    segments:
      - text: "Kendisine ortaq qoşmadan, Allaһnıñ hanifleri (Onıñ birligini tanığan mu’minler oluñ). Kim Allaһqa ortaq qoşsa, sanki o, kokten tüşip parçalanğan da, ozüni quşlar qapqan, yahut ruzgâr onı uzaq bir yerge süyreklegen (bir şey) kibidir. (O alda, bu ayetke kore, Allaһqa ortaq qoşmaq maneviy bir aşşalıqtır. Muşrik olmaq oyle telükelidir ki, insannıñ maneviy varlığını parça-parça eter; bir qasırğa kibi, onı uçurımlarğa süyrekler)."
        cid: 0
  - verse: 32
    segments:
      - text: "Vaziyet oyledir. Er kim Allaһnıñ ukümlerine sayğı kosterir ise, şubesiz, bu, qalplerniñ taqvasındandır."
        cid: 0
  - verse: 33
    segments:
      - text: "Olarda (qurbanlıq ayvanlarda ya da hac fiillerinde), siz içün belli bir muddetke qadar, bir taqım faydalar bar. Soñra bularnıñ baracaq (bitecek) yerleri, Eski Evge (Kâbege) qadardır."
        cid: 0
  - verse: 34
    segments:
      - text: "Biz er ummetke -(qurban çalmağa uyğun) ayvan cınsından ozlerine rızıq olaraq bergenlerimiz uzerine, Allaһnıñ adını añsınlar diye- qurban çalmaqnı kerekli yaptıq. Şimdi, İlâhıñız tek bir İlâhtır. Oyle ise, oña teslim oluñ. (Ey, Muһammed!) O ihlâslı ve mutevazi insanlarnı mujdele!"
        cid: 0
  - verse: 35
    segments:
      - text: "Olar oyle kimseler ki, Allaһ añılğan vaqıtta qalpleri titrer; başlarına kelgenge sabır eter, namaz qılar ve ozlerine rızıq olaraq bergen şeylerimizden (Allaһ içün) arclarlar."
        cid: 0
  - verse: 36
    segments:
      - text: "Biz, iri baş ayvanlarnı da siz içün Allaһnıñ (dininiñ) işaretlerinden (qurban) yaptıq. Olarda siz içün hayır bar. Şu alda olar, ayaqları ustünde turğanda, uzerlerine Allaһnıñ ismini añıñ (ve qurban etiñ). Yan ustü yerge tüşkenlerinde ise, artıq (canı çıqqanda) olardan em ozüñiz aşañ, em de itiyacını gizlegen-gizlemegen faqırlarğa aşatıñ. İşte, bu ayvanlarnı biz, şukür etersiñiz diye, siziñ faydalanuvıñızğa berdik."
        cid: 0
  - verse: 37
    segments:
      - text: "Olarnıñ ne etleri, ne de qanları Allaһqa yetişir; faqat Oña sadece siziñ taqvañız yetişir. Sizni hidayetke iriştirgeninden tolayı, Allaһnı buyuk tanırsıñız diye, O, bu ayvanlarnı boylece siziñ faydalanmañızğa berdi. (Ey, Muһammed!) Guzel davranğanlarnı mujdele! (Bu ayet, umumen, butün ibadetlerde yahşı niyet ve ihlâsnıñ kerekligini ortağa koymaqta. Añlaşıla ki, ibadetlerimizde bizni Allaһ rizasına iriştirecek temel şey, qalplerimizniç taqvası, yani bu ibadetlerni, kosterişten uzaq olaraq, yalıñız Allaһ rizası içün yapmaq ğayretidir. Bunıñ kibi, Az. Peyğamber bir hadislerinde: «Amellerniñ qıymeti ancaq niyetlerge koredir. Er kesniñ niyeti ne ise, eline keçecegi de odır», buyurğanlar)."
        cid: 0
  - verse: 38
    segments:
      - text: "Allaһ iman etkenlerni qorçalar. Şu da muaqqaq ki, Allaһ, hain ve nankor olğan er kesni sevgisinden marum eter."
        cid: 0
  - verse: 39
    segments:
      - text: "Olarnen cenk açılğanlarğa (mu’minlerge), zulumğa oğrağanları sebebinen, (cenk mezvusında) izin berildi. Şube yoq ki, Allaһ olarğa yardımğa mıtlaqa qadirdir. (Mekkeli muşrikler Az. Peyğamberge ve arqadaşlarına, hususen, faqır ve kimsesiz musulmanlarğa çeşit eskence ve basqıncılıqlar yapa ve bu mazlum insanlar, Az. Peyğamberge kelerek, vaziyetten şikâyet ete ediler. Resulullah (s.a.) ise, daa cenk izni çıqmağanını ayta, şimdilik sabırlı ve qaviy oluvlarını ogütley edi. Abdullah b. Abbasnıñ rivayetine kore, yuqarıdaki ayetnen ilk kere cenkke izin berilgen)."
        cid: 0
  - verse: 40
    segments:
      - text: "Olar, başqa degil, tek «Rabbimiz Allaһtır» degenleri içün, aqsız yerde yurtlarından çıqarılğan kimselerdir. Eger Allaһ, bir qısım insanlarnı (fenalıqlarını) diger bir qısmınen def etip, ogüni almasa edi, mıtlaqa, aralarında Allaһnıñ ismi çoq añılğan manastırler, kilseler, havralar ve mescitler yıqılıp keter edi. Allaһ ozüne (oz dinine) yardım etkenlerge muaqqaq surette yardım eter. İç şubesiz, Allaһ kuçlüdir, ğaliptir."
        cid: 0
  - verse: 41
    segments:
      - text: "Olar (o mu’minler) ki, eger ozlerine yer yuzünde iqtidar berir isek, namaznı qılar, zekâtnı berirler, yahşılıqnı emir eter ve yamanlıqtan uzaqlaştırırlar. İşleriniñ soñu Allaһqa barır. (Bu ayet, hususen, iqtidarnı elde etken musulmanlarnışç ayatında nizam ve qararlılıq kerekligini ifade etmekte. Ayrıca namaz ve zekât vazifeleriniñ aman artından «yahşılıqnı emir etmek ve fenalıqtan uzaqlaştırmaq» vazifesine yer berilüvi, içtimaiy ahlâq ve nizamnı qorçalap, keliştirgen yolbaşçılarnışç ustün degerini ifade etmekte)."
        cid: 0
  - verse: 42
    segments:
      - text: "(Resulım!) Eger olar (inkârcılar) seni yalancığa çıqara iseler, (şunı bilki) olardan evel Nuһnıñ qavmı, Aad, Semuud, İbrahimniñ qavmı, Luutnıñ qavmı ve Medyen halqı da (peyğamberlerini) yalanladılar. Musa da yalanlanğan edi. İşte, men o kâfirlerge muddet berdim, soñ olarnı yaqaladım. Nasıl oldı menim olarnı red etüvim (cezalandırıvum)! (Bu yerde «menim red etüvim» şeklinde tercime etilgen «Nekiiri»ge tefsirciler tarafından şu mana berilgen: «Nimetni qulfetke, ayatnı elâketke ve ma’murlikni yoqsullıqqa çevirüvim»)."
        cid: 0
  - verse: 45
    segments:
      - text: "Bunıñ kibi, bir çoq memleket bar edi ki, o memleket (halqı) zulum etmekte eken, biz olarnı elâk ettik. Şimdi o ulkelerde divarlar, (çokken) tavanlarnıñ ustüne yıqılğandır. Nice qullanılmaz alğa kelyen quyular ve (boş qalğan) buyuk saraylar bardır."
        cid: 0
  - verse: 46
    segments:
      - text: "(Saña qarşı çıqqanlar) iç yer yuzünde dolaşmadılarmı? Zira, dolaşsa ediler, elbette tüşünecek qalpleri ve eşitecek qulaqları olur edi. Amma, aqiqat şu ki, kozler kor olmaz; lâkin kokrekler içindeki qalpler kor olur. (Bu ayet musulmanlarğa kezip dolaşuvını, keçmiş milletlerden qalğan harabelerni tedqiq etip, fenalıqları sebebinden yoq olup ketken milletlerniñ alından ibret almaqnı tevsiye etmekte. Ancaq, ibret almaq bir basiret ve feraset işidir. Ayette de bildirilgeni kibi, asıl korler - qalp kozlerini ğayıp etkenlerdir; yani tarihnı basiretnen tedqiq etip, tarihiy vaqialar uzerinde tüşünip olalmağan, bu sebepten de, keçmişleriniñ yapqan hatalarını tekrarlağanlardır)."
        cid: 0
  - verse: 47
    segments:
