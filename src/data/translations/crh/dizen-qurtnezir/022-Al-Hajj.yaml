          musulmanlarğa kezip dolaşuvını, keçmiş milletlerden qalğan harabelerni tedqiq
          etip, fenalıqları sebebinden yoq olup ketken milletlerniñ alından ibret almaqnı
          tevsiye etmekte. Ancaq, ibret almaq bir basiret ve feraset işidir. Ayette de
          bildirilgeni kibi, asıl körler - qalp közlerini ğayıp etkenlerdir; yani tarihnı
          basiretnen tedqiq etip, tarihiy vaqialar üzerinde tüşünip olalmağan, bu sebepten
          de, keçmişleriniñ yapqan hatalarını tekrarlağanlardır).
        cid: 0
  - verse: 47
    segments:
      - text: >
          (Resulım!) Olar senden azapnıñ çabuk kelgenini istemekteler. Allah vadesinden
          asla qaytmaz. Muaqaq ki, Rabbiñniñ nezdinde bir kün, siz saymaqta
          olğanlarıñızdan biñ yıl kibidir. (Bu alda, vaqıt izafiydir. Hususen, insanlar
          vaqıtnıñ çabuk keçüvini istegenlerinde, bir türlü keçmek bilmeyüvi bunı
          kösterir. Bu alda bizim esaplarımızğa köre, biñ yıllıq vaqıt parçası Allah
          qatında bir kün qadar qısqadır. Esasen ayetteki «bir kün» de Allah içün başı ve
          soñu belgilengen bir vaqıt parçası degil, soñsuzlıq söz mevzusıdır).
        cid: 0
  - verse: 48
    segments:
      - text: >
