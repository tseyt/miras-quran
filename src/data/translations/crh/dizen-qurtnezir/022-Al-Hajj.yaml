      - text: "Allaһ ğaybnı da, şeadetni de bilicidir. O, muşriklerniñ ortaq qoşqan şeylerinden çoq yuce ve uzaqtır. (Ğayb ve şeadet, eki ayrı bilgi meydanını ifade eter. Ğayb meydanına kirgen malümat, aqıl ve duyğu azalarınıñ idrak kuçüni aşqan, ancaq bir qısım qabiliyetlerniñ bir olçüde seze bilgenleri, bunıñnen beraber, eñ doğru bir şekilde vahiy yolunen bizge kelip yetken bilgilerdir. Esasen ğayb meydanı, bilgiden ziyade, bir iman meydanıdır. Bunıñ kibi, Baqara suresiniñ başında da işaret etilgeni kibi, «Aamentuu» de ifadesini tapqan iman esasları aqqındaki bilgilerimiz - bu çeşit bilgilerdir. Şeadet ise, ğaybnıñ aksine, tecribe ve muşaade saasına kirgen duyğular - alem ile bu alemge ait eşya ve vaqialarnı ifade eter). 93-94. (Resulım!) De ki: «Rabbim! Eger olarğa yoneltilgen tehditni (dünyaviy sıqıntını ve uhreviy azapnı) mıtlaqa maña kosterecek iseñ, bu vaziyette meni zalımlar toplulığı içinde bulundırma, Rabbim!»"
        cid: 0
