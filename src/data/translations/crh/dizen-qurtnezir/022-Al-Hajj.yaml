        cid: 0
  - verse: 13
    segments:
      - text: "Olarnıñ (iftiracılarnıñ) da bu meselede dört şaat ketirüvleri kerekmey edimi? Madam ki, şaatlar ketiralmadılar, oyle ise, olar Allaһnıñ nezdinde, yalancılarnıñ tam ozleridir."
        cid: 0
  - verse: 14
    segments:
      - text: "Eger dünyada ve ahirette Allaһnıñ lütf ve merhameti ustüñizde olmasa edi, içine dalğan bu iftirañızdan tolayı, sizge mıtlaqa buyuk bir azap toqunır edi."
        cid: 0
  - verse: 15
    segments:
      - text: "Çünki, siz bu iftiranı, tilden tilge bir-biriñizge yetiştire, aqqında bilgiñiz olmağan şeyni ağızlarıñızda çaynap turasıñız. Bunı muim sanmaysıñız. Albuki, Allaһ qatında çoq buyuk (bir suç)tır."
        cid: 0
  - verse: 16
    segments:
      - text: "Onı eşitkeniñizde: «Bunı qonuşıp yayuvımız bizge yaqışmaz. Bu, çoq buyuk bir iftiradır», demeli degil ediñizmi?"
        cid: 0
  - verse: 17
    segments:
      - text: "Eger inanğan insalar iseñiz, Allaһ, bir daa buña beñzegen areketni tekrarlavdan sizni saqındırıp tenbiyeler."
