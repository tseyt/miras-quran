          olarnı yaqaladım. Dönüş yalıñız mañadır.
        cid: 0
  - verse: 49
    segments:
      - text: >
          De ki: Ey, insanlar! Men ancaq siz içün ap-açıq bir tenbiyeciyim.
        cid: 0
  - verse: 50
    segments:
      - text: >
          İman etip, salih ameller işlegen kimseler içün mağfiret ve bol rızıq bar.
        cid: 0
  - verse: 51
    segments:
