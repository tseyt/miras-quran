surah_id: 22
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >
          Ey, insanlar! Rabbiñizden qorquñ! Çünki, qıyamet vaqtınıñ tepremi müdhiş bir
          şeydir!
        cid: 0
  - verse: 2
    segments:
      - text: >
          Onı körgen künüñiz, er emizikli qadın emizgen balasını unutır, er yüklü qadınnıñ
          balası tüşer. İnsanlarnı da sarğoş bir alda körersiñ. Albuki, olar sarğoş
          degillerdir; faqat Allahnıñ azabı çoq deşetlidir!
        cid: 0
  - verse: 3
    segments:
      - text: >
          İnsanlardan, bilgisi olmayıp, Allah aqqında tartışmağa kirişken ve er inatçı
          şeytanğa uyğan bir taqım kismeler bar. (Bazı tefsircilerge köre, bu ayetteki
          «şeytan»nıñ manası inkârcılarnıñ ileri kelgenleri, şeytan qadar yoldan azğanları
          da ola bilir).
        cid: 0
  - verse: 4
    segments:
      - text: >
          Onıñ (şeytan) aqqında böyle yazılğan: Kim onı yoldaş etse, bilsin ki, (şeytan)
          onı saptıracaq ve alevli ateş azabına süyrekleycek.
        cid: 0
  - verse: 5
    segments:
      - text: >
          Ey, insanlar! Eger yañıdan tirilüvden şübelenseñiz, şunı biliñ ki, biz sizni
          topraqtan, soñ nutfeden, soñra alaqadan (aşlanğan yımırtadan), soñra azaları
          (evelâ) bellisiz, (soñra belli olğan) canlı et parçasından (azaları vaqtı ile
          yetilgen hamileden) yarattıq ki, sizge (qudretimizni) köstereyik. Ve
          istegenimizni belgilengen bir müddetke qadar rahimlerde bekletirmiz; soñ sizni
          bir sabiy olaraq tışarı çıqarırmız. Soñ küçlü çağıñızğa irişmeñiz içün (sizni
          buyultirmiz). Arañızdan kimisi vefat eter; kene arañızdan kimisi de ömürniñ eñ
          çıqımsız çağına qadar ketirilir; ta ki bilgen bir kimse olğan soñ, bir şeyni
          bilmez alğa kelsin. Sen yer yüzüni de qup-quru ve ölü bir alda körersiñ; faqat
          biz, üzerine yağmur yağdırğanımızda, o qıbırdanır, qabarır ve er çeşitten (ya da
          çiftten) goñül hoşlayıcı ekinler berir. (Allah Taalâ bu ayette ölgenden soñ,
          tekrar tirilmekni inkâr etkenlerge qarşı, evelâ insan yaratılışınıñ ketişatını
          bediiy bir şekilde ifade ete. Bu yerde insannıñ nutfe, yani sperma alından
          başlap, dünyağa kelgenine qadar ki, bu yetilüvni beyan etilgen. «Alaqa» kelimesi
          arapçada «ilişik, ilişki, kilit, sülük, tutunmaq, yaqalanmaq, qatqan qan» kibi
          manalarda qullanılmaqtadır. İnsannıñ yetilüvinde qullanılğan «alaqa» qadınnıñ
          sperma tarafından aşlanğan ve rahimge yerleşken yımırtasıdır).
        cid: 0
  - verse: 6
    segments:
      - text: >
          Çünki, Allah haqnıñ tam özüdir; O, ölülerni tiriltir; kene O, er şeyge haqqı ile
          qadirdir.
        cid: 0
  - verse: 7
    segments:
      - text: >
          Qıyamet vaqtı da kelecek; buña şübe yoq. Ve Allah qabirlerdeki kimselerni
          tiriltip tursatacaq.
        cid: 0
  - verse: 8
    segments:
      - text: >
          İnsanlardan bazısı, bir bilgisi, bir reberi ve (vahiyge tayanğan) aydınlatıcı
          bir kitabı olmağanı alda, yalıñız Allah yolundan saptırmaq içün, yanını
          egip-bükerek (kibir ve azamet içinde), Allah aqqında tartışmağa qalqar. Onıñ
          içün dünyada bir rezillik bardır; qıyamet kününde ise, oña yaqıcı azapnı
          tattıracaqmız.
        cid: 0
  - verse: 9
    segments:
      - text: >
          [8 ayetine baq.]
        cid: 0
  - verse: 10
    segments:
      - text: >
          İşte bu, evelden yapqan-etkenleriñniñ sebebindendir (denilir). Elbette, Allah
          qullarına aqsızlıq etici degildir.
        cid: 0
  - verse: 11
    segments:
      - text: >
          İnsanlardan kimisi Allahqa yalıñız bir taraftan qullıq eter. Yani: Özüne bir
          yahşılıq toqunsa, buña pek memnun olur, bir de musibetke oğrasa, çeresi deñişir
          (dinden yüz çevirir). O, dünyasını da, ahiretini de ğayıp etkendir. İşte bu,
          ap-açıq ziyannıñ tam özüdir. (Bu ayet dinge qalbiy bir inançnen degil de, özüne
          dünyaviy bir fayda ketirecigini ümüt etkenlerni tenqit ete. Bunıñ kibi,
          tevsirlerde aytılğanına köre, bu ayet «earib» denilgen bir qabile aqqında nazil
          olğan. Olar Medinege icret etken ediler. Aralarından biri bedeni sağlam olğanı,
          atları güzel qulunlar bergeni, qadını tendürüst balalar doğurğanı, malı-mülkü
          artqan vaqıtta, «Ne yahşı ettim de, şu dinge kirdim! Bu sayede çoq şeyler
          qazandım!», diyerek sevine edi. Vaziyet tersine dönüp, bir ziyanğa oğrağanda
          ise, «Başıma bir taqım yamanlıqlar keldi!..» kibi sözlernen dinden çıqa edi).
        cid: 0
  - verse: 12
    segments:
      - text: >
          O, Allahnı bıraqıp, özüne ne faydası, ne de zararı toqunacaq şeylerge yalvarır.
          Bu, (haqtan) bus-bütün uzaq olğan sapıqlıqnıñ tam özüdir.
        cid: 0
  - verse: 13
    segments:
      - text: >
          O, zararı faydasından daa (aqılğa) yaqın olğan bir varlıqqa yalvarır. O
          (yalvarğanı), ne fena bir yardımcı, ne fena bir dosttır!
        cid: 0
  - verse: 14
    segments:
      - text: >
          Muaqqaq ki, Allah iman etip, yahşı davranışlarda bulunğan kimselerni zemininde
          irmaqlar aqqan cennetlerge qabul eter. Şübesiz, Allah istegen şeyini yapar.
        cid: 0
  - verse: 15
    segments:
      - text: >
          Er kim, Allah dünya ve ahirette oña (Resulına) asla yardım etmeycegini zan
          etmekte ise, (Allah oña yardım etkenine köre) artıq o kimse tavanğa bir yip
          atsın; (boğazına keçirsin); soñra da (ayağını yerden) kessin! Şimdi bu kimse
          baqsın! Aceba, iylesi (bu yapqanı), öpke duyğan şeyine (Allahnıñ Peyğamberge
          yardımına) aqiqaten mani olacaqmı? (Bu ayet şu manada da añlaşılır: «Er kim
          Allahnıñ Resulına dünya ve ahirette yardım etmeycegini zan etse, bir merdivennen
          kökke çıqsın da, Peyğamberge kelgen vahiyni kessin! Bunı yapalmaycağına köre,
          şimdi baqsın, baqayıq iylesi, öpke duyğan şeyge, yani Allahnıñ Peyğamberge
          yapqan yardımna mani ola bilirmi?»).
        cid: 0
  - verse: 16
    segments:
      - text: >
          İşte, böylece biz o Qur'annı açıq-seçik ayetler alında endirdik. Aqiqat şu ki,
          Allah istegen kimsesini hidayetke iriştirir.
        cid: 0
  - verse: 17
    segments:
      - text: >
          Mü'min olğanlar, yeudiy olğanlar, saabiyler, hristianlar, mecusiyler ve müşrik
          olğanlarğa kelgende, muaqqaq ki, Allah bular arasında qıyamet kününde
          (ayrı-ayrı) ükmini berir. Çünki, Allah er şeyni aqqı ile bilicidir.
        cid: 0
  - verse: 18
    segments:
      - text: >
          Körmezsiñmi ki, köklerde olğanlar ve yerde olğanlar - küneş, ay, yıldızlar,
          dağlar, terekler, ayvanlar ve insanlarnıñ bir çoqu Allahqa secde etmekte; bir
          çoqunıñ üzerine de azap haq olğandır. Allah kimni hor ve haqir etse, artıq onı
          degerli qılacaq bir kimse yoqtır. Şübesiz, Allah istegenini yapar. (Allahnıñ
          yaratqanları şuurlı ve şuursız olmaq üzre, ekige ayırıla bilir. Aqıl ve şuurdan
          marum olğan yaratıqlar ilâhiy qanunlarğa tabiy olaraq, Oña boyun egmekte ve öz
          tillerinen (lisan-ı hal ile) Onı tenzih eterek, tesbihte bulunmaqtadırlar.
          Aqıllı yaratıqlar olğan insanlarda seçüv ürriyeti bardır. Allahqa degil de,
          başqa şeylerge qullıq etüvni üstün körgenler, insanlıq degerlerini ğayıp etken
          olurlar ve bunı olarğa kimse qazandıralmaz. Ayette sayılğan varlıqlarnıñ Allahqa
          secde etüvleriniñ manası içün ayrıca baq. İsraa, 17/44).
        cid: 0
  - verse: 19
    segments:
      - text: >
          Şu eki top, Rabbleri aqqında çekişken eki duşmandır: Şimdi, inkâr etkenler içün,
          ateşten bir urba biçilgendir. Olarnıñ başları üstünden qaynağan suv tökülecek!
        cid: 0
  - verse: 20
    segments:
      - text: >
          Bunıñnen qarınlarınıñ içindeki (azalar) ve terileri iritilecek!
        cid: 0
  - verse: 21
    segments:
      - text: >
          Bir de, olar içün demir qamçılar bardır.
        cid: 0
  - verse: 22
    segments:
      - text: >
          İstiraptan tolayı, o yerden er çıqmağa istegenlerinde, o yerge keri
          qaytırılırlar ve: «Tatıñız bu yaqıcı azapnı!» (denilir).
        cid: 0
  - verse: 23
    segments:
      - text: >
          Muaqqaq ki, Allah, iman etip, yahşı davranışlarda olğanlarnı, zemininden
          irmaqlar aqqan cennetlerge qabul eter. Bular o yerde altın bilezliklernen ve
          incilernen bezenirler. O yerde kiyecekleri ise, yipektir.
        cid: 0
  - verse: 24
    segments:
      - text: >
          Ve olar sözniñ eñ güzeline yöneltilgen, maqtavğa lâyıq Allahnıñ yoluna
          iriştirilgenlerdir. (Tefsircilerniñ çoquna köre, ayetteki «sözniñ eñ güzeli»
          ifadesiniñ manası Kelime-i Tevhid ya da Kelime-i Şeadettir).
        cid: 0
  - verse: 25
    segments:
      - text: >
          İnkâr etkenler, Allahnıñ yolundan ve -yerli, tıştan kelgen- bütün insanlar içün
          bir (qıble ya da mabed) qıldığımız Mescid-i Haramdan (insanlarnı) çetleştirmege
          qalqqanlar (şunı bilmeliler ki) kim o yerde (böyle) zulum ile haqtan sapmaq
          istese, oña accı azaptan tattırırmız.
        cid: 0
  - verse: 26
    segments:
      - text: >
          Bir zamanlar İbrahimge Beytullahnıñ yerini azırlağan ve (oña böyle degen edik):
          Maña iç bir şeyni ortaq tutma; tavaf etkenler, ayaqta ibadet etkenler, ruku ve
          secdege barğanlar içün evimizni temiz tut.
        cid: 0
  - verse: 27
    segments:
      - text: >
          İnsanlar arasında hacnı ilân et ki, ister yayan olaraq, ister nice uzaq yoldan
          kelgen yorğun-arğın develer üstünde, özlerine ait bir taqım faydalarnı yaqından
          körüvleri, Allahnıñ özlerine rızıq olaraq bergen qurbanlıq ayvanları üzerine
          belli künlerde Allahnıñ ismini añuvları (qurban çaluvları içün) saña (Kâbege)
          kelsinler. Artıq ondan em özüñiz aşañ, em de yoqsulğa, faqırğa aşatıñ.
          (Tefsircilerge köre, ayetniñ birinci cumlesinde işaret etilgen faydalar, em
          dünyaviy, em de uhreviydir. Dünyaviyleri, hacnıñ insan üzerinde meydanğa
          ketirgen ahlâqiy tesirlerinen ticariy ve içtimaiy faydalardır. Uhreviyleri ise,
          Allahnıñ hoşnutlığı ve Onıñ mü'minlerge olğan afu ve mağfiretidir.
          Musulmanlarğa, Allahnıñ ismini añaraq, qurban çaluvları emir etilgen «belli
          künler»ge «eyyam-ı nahr - qurban çaluv künleri» denilir ki, bular - Zilhicce
          ayınıñ 10, 11 ve 12-nci künleridir).
        cid: 0
  - verse: 28
    segments:
      - text: >
          [27 ayetine baq.]
        cid: 0
  - verse: 29
    segments:
      - text: >
          Soñra kir-paslardan temizlensinler; adaqalarını yerine ketirsinler ve o Eski
          Evni (Kâbeni) tavaf etsinler. (Hacılarnıñ kir-paslarını temizlevleri demekniñ
          manası - esasen tıraş oluvları, tırnaqlarını kesüvleri, qoltuq astlarını ve
          qasıqlarını temizlevleri ve umumen, bütün bedeniy kirlerden arınuvlarıdır. «Eski
          Evni Tavaf etsinler» demek - «Kâbeniñ etrafını dolaşsınlar» demektir ki, bir
          kere dolaşmağa bir «şavt» denilir. Tavaf yedi şavttan ibarettir. Bulardan dörtü
          farz, üçü vaciptir. Bu, hacnıñ ruknlerinden olğan tavaftır ve oña «tavaf-ı
          ziyaret» denilir. Ayrıca, bir de «tavaf-ı quduum» ve «tavaf-ı sader» bardır ki,
          birincisi, Kâbege ilki barılğanda yapılğan qavuşuv tavafı, digeri de ayırılğanda
          yapılğan veda tavafıdır).
        cid: 0
  - verse: 30
    segments:
      - text: >
          Vaziyet böyle. Er kim Allahnıñ emir ve yasaqlarına sayğı kösterse, bu, Rabbiñniñ
          qatında onıñ içün daa hayırlıdır. (Aram olğanı) sizge oqulğanlardan başqa,
          qalğan ayvanlar sizge elâl qılındı. O alda, pislikten, putlardan saqınıñ; yalan
          sözden saqınıñ.
        cid: 0
  - verse: 31
    segments:
      - text: >
          Kendisine ortaq qoşmadan, Allahnıñ hanifleri (Onıñ birligini tanığan mü'minler
          oluñ). Kim Allahqa ortaq qoşsa, sanki o, kökten tüşip parçalanğan da, özüni
          quşlar qapqan, yahut rüzgâr onı uzaq bir yerge süyreklegen (bir şey) kibidir. (O
          alda, bu ayetke köre, Allahqa ortaq qoşmaq maneviy bir aşşalıqtır. Müşrik olmaq
          öyle telükelidir ki, insannıñ maneviy varlığını parça-parça eter; bir qasırğa
          kibi, onı uçurımlarğa süyrekler).
        cid: 0
  - verse: 32
    segments:
      - text: >
          Vaziyet öyledir. Er kim Allahnıñ ükümlerine sayğı kösterir ise, şübesiz, bu,
          qalplerniñ taqvasındandır.
        cid: 0
  - verse: 33
    segments:
      - text: >
          Olarda (qurbanlıq ayvanlarda ya da hac fiillerinde), siz içün belli bir müddetke
          qadar, bir taqım faydalar bar. Soñra bularnıñ baracaq (bitecek) yerleri, Eski
          Evge (Kâbege) qadardır.
        cid: 0
  - verse: 34
    segments:
      - text: >
          Biz er ümmetke -(qurban çalmağa uyğun) ayvan cınsından özlerine rızıq olaraq
          bergenlerimiz üzerine, Allahnıñ adını añsınlar diye- qurban çalmaqnı kerekli
          yaptıq. Şimdi, İlâhıñız tek bir İlâhtır. Öyle ise, oña teslim oluñ. (Ey,
          Muhammed!) O ihlâslı ve mutevazi insanlarnı müjdele!
        cid: 0
  - verse: 35
    segments:
      - text: >
          Olar öyle kimseler ki, Allah añılğan vaqıtta qalpleri titrer; başlarına kelgenge
          sabır eter, namaz qılar ve özlerine rızıq olaraq bergen şeylerimizden (Allah
          içün) arclarlar.
        cid: 0
  - verse: 36
    segments:
      - text: >
          Biz, iri baş ayvanlarnı da siz içün Allahnıñ (dininiñ) işaretlerinden (qurban)
          yaptıq. Olarda siz içün hayır bar. Şu alda olar, ayaqları üstünde turğanda,
          üzerlerine Allahnıñ ismini añıñ (ve qurban etiñ). Yan üstü yerge tüşkenlerinde
          ise, artıq (canı çıqqanda) olardan em özüñiz aşañ, em de itiyacını
          gizlegen-gizlemegen faqırlarğa aşatıñ. İşte, bu ayvanlarnı biz, şükür etersiñiz
          diye, siziñ faydalanuvıñızğa berdik.
        cid: 0
  - verse: 37
    segments:
      - text: >
          Olarnıñ ne etleri, ne de qanları Allahqa yetişir; faqat Oña sadece siziñ
          taqvañız yetişir. Sizni hidayetke iriştirgeninden tolayı, Allahnı büyük
          tanırsıñız diye, O, bu ayvanlarnı böylece siziñ faydalanmañızğa berdi. (Ey,
          Muhammed!) Güzel davranğanlarnı müjdele! (Bu ayet, umumen, bütün ibadetlerde
          yahşı niyet ve ihlâsnıñ kerekligini ortağa koymaqta. Añlaşıla ki,
          ibadetlerimizde bizni Allah rizasına iriştirecek temel şey, qalplerimizniñ
          taqvası, yani bu ibadetlerni, kösterişten uzaq olaraq, yalıñız Allah rizası içün
          yapmaq ğayretidir. Bunıñ kibi, Az. Peyğamber bir hadislerinde: «Amellerniñ
          qıymeti ancaq niyetlerge köredir. Er kesniñ niyeti ne ise, eline keçecegi de
          odır», buyurğanlar).
        cid: 0
  - verse: 38
    segments:
      - text: >
          Allah iman etkenlerni qorçalar. Şu da muaqqaq ki, Allah, hain ve nankor olğan er
          kesni sevgisinden marum eter.
        cid: 0
  - verse: 39
    segments:
      - text: >
          Olarnen cenk açılğanlarğa (mü'minlerge), zulumğa oğrağanları sebebinen, (cenk
          mezvusında) izin berildi. Şübe yoq ki, Allah olarğa yardımğa mıtlaqa qadirdir.
          (Mekkeli müşrikler Az. Peyğamberge ve arqadaşlarına, hususen, faqır ve kimsesiz
          musulmanlarğa çeşit eskence ve basqıncılıqlar yapa ve bu mazlum insanlar, Az.
          Peyğamberge kelerek, vaziyetten şikâyet ete ediler. Resulullah (s.a.) ise, daa
          cenk izni çıqmağanını ayta, şimdilik sabırlı ve qaviy oluvlarını ögütley edi.
          Abdullah b. Abbasnıñ rivayetine köre, yuqarıdaki ayetnen ilk kere cenkke izin
          berilgen).
        cid: 0
  - verse: 40
    segments:
      - text: >
          Olar, başqa degil, tek «Rabbimiz Allahtır» degenleri içün, aqsız yerde
          yurtlarından çıqarılğan kimselerdir. Eger Allah, bir qısım insanlarnı
          (fenalıqlarını) diger bir qısmınen def etip, ögüni almasa edi, mıtlaqa,
          aralarında Allahnıñ ismi çoq añılğan manastırler, kilseler, havralar ve
          mescitler yıqılıp keter edi. Allah özüne (öz dinine) yardım etkenlerge muaqqaq
          surette yardım eter. İç şübesiz, Allah küçlüdir, ğaliptir.
        cid: 0
  - verse: 41
    segments:
      - text: >
          Olar (o mü'minler) ki, eger özlerine yer yüzünde iqtidar berir isek, namaznı
          qılar, zekâtnı berirler, yahşılıqnı emir eter ve yamanlıqtan uzaqlaştırırlar.
          İşleriniñ soñu Allahqa barır. (Bu ayet, hususen, iqtidarnı elde etken
          musulmanlarnıñ ayatında nizam ve qararlılıq kerekligini ifade etmekte. Ayrıca
          namaz ve zekât vazifeleriniñ aman artından «yahşılıqnı emir etmek ve fenalıqtan
          uzaqlaştırmaq» vazifesine yer berilüvi, içtimaiy ahlâq ve nizamnı qorçalap,
          keliştirgen yolbaşçılarnıñ üstün degerini ifade etmekte).
        cid: 0
  - verse: 42
    segments:
      - text: >
          (Resulım!) Eger olar (inkârcılar) seni yalancığa çıqara iseler, (şunı bilki)
          olardan evel Nuhnıñ qavmı, Aad, Semuud, İbrahimniñ qavmı, Luutnıñ qavmı ve
          Medyen halqı da (peyğamberlerini) yalanladılar. Musa da yalanlanğan edi. İşte,
          men o kâfirlerge müddet berdim, soñ olarnı yaqaladım. Nasıl oldı menim olarnı
          red etüvim (cezalandırıvum)! (Bu yerde «menim red etüvim» şeklinde tercime
          etilgen «Nekiiri»ge tefsirciler tarafından şu mana berilgen: «Nimetni qulfetke,
          ayatnı elâketke ve ma'murlikni yoqsullıqqa çevirüvim»).
        cid: 0
  - verse: 43
    segments:
      - text: >
          [42 ayetine baq.]
        cid: 0
  - verse: 44
    segments:
      - text: >
          [42 ayetine baq.]
        cid: 0
  - verse: 45
    segments:
      - text: >
          Bunıñ kibi, bir çoq memleket bar edi ki, o memleket (halqı) zulum etmekte eken,
          biz olarnı elâk ettik. Şimdi o ülkelerde divarlar, (çökken) tavanlarnıñ üstüne
          yıqılğandır. Nice qullanılmaz alğa kelyen quyular ve (boş qalğan) büyük saraylar
          bardır.
        cid: 0
  - verse: 46
    segments:
      - text: >
          (Saña qarşı çıqqanlar) iç yer yüzünde dolaşmadılarmı? Zira, dolaşsa ediler,
          elbette tüşünecek qalpleri ve eşitecek qulaqları olur edi. Amma, aqiqat şu ki,
