      - text: >-
          (Allah Taalâ bu ayette ölgenden soñ, tekrar tirilmekni inkâr etkenlerge qarşı, evelâ
          insan yaratılışınıñ ketişatını bediiy bir şekilde ifade ete. Bu yerde insannıñ
          nutfe, yani sperma alından başlap, dünyağa kelgenine qadar ki, bu yetilüvni beyan
          etilgen. «Alaqa» kelimesi arapçada «ilişik, ilişki, kilit, sülük, tutunmaq,
          yaqalanmaq, qatqan qan» kibi manalarda qullanılmaqtadır. İnsannıñ yetilüvinde
          qullanılğan «alaqa» qadınnıñ sperma tarafından aşlanğan ve rahimge yerleşken
          yımırtasıdır).
        cid: 0
