surah_id: 22
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "(Bu) Bizim nazil ettigimiz ve (ukümlerini uzeriñizge) farz qıldığımız bir suredir. Belki, tüşünip, ogüt alırsıñız diye, onda açıq-aydın ayetler endirdik."
        cid: 0
  - verse: 2
    segments:
      - text: "Zina etken qadın ve zina etken erkekten er birine yuz sopa urıñ; Allaһqa ve ahiret kunüne inanır iseñiz, Allaһnıñ dininde (ukümlerini tedbiq etkende) olar acıycaq kibi olmañ. Mu’minlerden bir topu da, olarğa berilgen cezağa şaat olsun. (İslâm uquq tilinde bu cezalandıruv şekline «had» denile. Ayette emir etilgen bu tedbiqat yalıñız bekâr olup da, zina etkenler içündir. Eger evli bir erkek ve qadın zina etken olsalar, buña «recsm» cezası tedbiq etilir)."
        cid: 0
  - verse: 3
    segments:
      - text: "Zina etken erkek, zina etken ya da muşrik bir qadından başqasınen evlenmez. Zina etken qadınnen de, ancaq zina etken ya da muşrik erkek evlenir. Bu, mu’minlerge aram qılınğandır. (İslâmda muşrik qadın ve erkeknen evlenmek caiz degil. Ve boyle bir nikâh keçmez. Ayette zina etken musulmannen evelnüvniñ çirkinligi de ifade etilmeknen birlikte, ayetniñ nazil oluv sebebi ve diger deliller diqatqa alınaraq, İslâm alimleriniñ çoqu boyle bir nikâhnıñ keçerli olğanına uküm etkenler)."
        cid: 0
  - verse: 4
    segments:
      - text: "Namuslı qadınlarğa zina iftirasında bulunıp, soñ (buña isbat içün) dört şaat ketiralmağanlarğa seksener sopa urıñ ve artıq olarnıñ şaatlığını iç bir vaqıt qabul etmeñ. Olar tamamen gunahkârlardır."
        cid: 0
  - verse: 5
    segments:
      - text: "Ancaq, bundan soñ tövbe etip, islâh olğanlar istisnadır. Allaһ çoq bağışlayıcı ve merhametlidir. 6-7. Qadınlarına zina iftirasında bulunıp da, ozlerinden başqa şaatları olmağanlarğa kelgende, olarnıñ er biriniñ şaatlığı, ozleriniñ doğru söylegenlerden olğanlarına dair dört defa Allaһ adına yemin eterek, şaatlıq etüvi, beşinci defa da, eger yalan söylegenlerden ise, Allaһnıñ lânetiniñ oz uzerine oluvını tilevidir. 8-9. Qadınnıñ, qocası yalan söylegenlerden olğanına dair dört defa Allaһ adına yemin ve şaatlıq etüvi, beşinci defa da, eger (qocası) doğru söylegenlerden ise, Allaһnıñ ğadabınıñ oz uzerine alğanını tilevi ondan cezanı saqıt eter. (Soñki dört ayetteki tedbiqat, İslâm aile uquqında «liaan» termini ile ifade etilir. Qadınnnıñ zina qabaatı işlegenini idda etken bir qoca, eger iddasını isbat etmek içün dört şaat ketirip olamasa, qadın ve qoca hakim uzurına celp etilerek, liaanğa davet etilir. Er eki taraf da doğrulıqlarını bu ifadelernen beyan etseler, erkek iftira (kazf) cezasından, qadın da, zina cezasından qurtulır, ve bu şekilde, evlilik bağı soñuna yeter)."
        cid: 0
  - verse: 6
    segments:
      - text: "Ya Allaһnıñ sizge bol lütfi ve merhameti olmasa edi ve Allaһ tövbelerni qabul etken uküm ve ikmet saibi olmasa edi (alıñız ne olur edi)!"
        cid: 0
  - verse: 7
    segments:
      - text: "(Peyğamberniñ qadınına) bu ağır iftiranı uydurğanlar, şubesiz, siziñ arañızdan bir topudır. Bunı ozüñiz içün bir fenalıq sanmañ, aksine o, siz içün bir yahşılıqtır. Olardan er bir adamğa, gunah olaraq, ne işlegen ise (onıñ qarşılığı ceza) bardır. Olardan (ilge yolbaşçılıq yapıp) bu gunahnıñ buyukligini arqalağan kimse içün de, çoq buyuk bir azap bardır. (Bu ve aşağıdaki doquz ayetniñ nazil oluvına sebep olğan ve «ifq» (iftira) adisesi» diye bilingen vaqia qısqadan boyledir: Az. Peyğamberniñ bir askeriy seferine Az. Ayşe de qatılğan edi. Qaytqanda, bir ara Az. Ayşe itiyacından qurtulmaq içün çekilgen bir koşede gerdanlığını tüşüre. Soñ, bunıñ farqına barıp, qıdırmağa kete. Bu arada, kervan Az. Ayşeni devesiniñ ustündeki hevdec adı berilgen qapalı, tomalaq ve ustü qubbeli qafesi içinde zan eterek, qonaqlav yerinden ayrılğanı içün, Az. Ayşe o yerde qala. Ordunı artından taqip etmeknen vazifeli bir zat Az. Ayşeni alıp, kervanğa yetiştire. Aralarında munafıqlarnıñ reberlerinden Abdullah b. Ubeyy de olğan bir qaç adam, bu adisege esaslanıp, Az. Ayşenen onı kervanğa yetiştirgen adam arasında alâqa yapılğanı iftirasını uyduralar. Bu iftira Az. Peyğamberni ziyade kederlendire. Bu sırada, zaten raatsız olğan Az. Ayşe aqqında boyle bir iftira uydurılğanını bir muddet soñ bile ve buyuk bir istirapqa tüşe; artıq ozü kibi kederli olğan ailesine, babası Az. Ebu Bekir (r.a.)niñ evine barmaqnı doğru tanıy. Bu arada Az. Peyğamber (s.a.) zaman-zaman Az. Ebu Bekirniñ evine barıp, olardan Az. Ayşeniñ sağlığını, al ve hatirini soray edi. İşte, kene boyle bir ziyaret sırasında ve iftira vaqiasınıñ çıqqanından tahminen bir ay soñ, Ayşe validemizniñ qabaatsızlığını ifade etken bu ayetler nazil oldı:)"
        cid: 0
