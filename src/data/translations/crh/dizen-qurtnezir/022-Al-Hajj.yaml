  - verse: 30
    segments:
      - text: "(Resulım!) Mu’min erkeklerge, kozlerini (aramğa) tikmemelerini, ırızlarını da qorçalavlarını söyle. Çünki bu, ozleri içün daa temiz bir davranıştır. Şubesiz, Allaһ olarnıñ yapayatqanlarından haberdardır."
        cid: 0
  - verse: 31
    segments:
      - text: "Mu’min qadınlarğa da söyle: Kozlerini (aramğa baqmaqtan) qorçalasınlar; namus ve iffetlerini qorçalasınlar. Korüngen qısımları istisna olmaq uzre, ziynetlerini kostermesinler. Baş ortülerini, yaqalarınıñ uzerine (qadar) ortsinler. Qocaları, babaları, qocalarınıñ babaları, oz oğulları, qocalarınıñ oğulları, erkek qardaşları, erkek qardaşlarınıñ oğulları, qız qardaşlarınıñ oğulları, oz qadınları (mu’min qadınlar), elleriniñ altında bulunğanlar (hızmetkârları), erkeklerden, aileniñ qadınına şehvet duymağan hızmetçi ve başqa tabiy kimseler, yahut alâ qadınlarnıñ gizli qadınlıq hususiyetleriniñ farqına barmağan balalardan başqasına, ziynetlerini kostermesinler. Gizlemekte olğan ziynetlerni, añlaşılsın diye, ayaqlarını yerge urmasınlar (diqqatlarnı uzerine çekecek tarzda yurmesinler). Ey, mu’minler! Ep birden Allaһqa tövbe etiñ ki, qurtulışqa irişirsiñiz. (ІOqarıdaki ayette qadınlarğa kosterüvleri yasaqlanğan «ziynet»niñ ne olğanı aqqında çeşit fikirler bar: bir zanğa kore, bu ziynetlerniñ kupe, bilezlik, yuzük ve gerdanlıq kibi süs taqınçaqlarınen sürme, hına kibi şeylerdir. Bu yorumğa kore, bu çeşit ziynet eşyasınıñ bedende kosterilüvi qadınlar içün aramdır. Urbada da, ziynet olmaqnen beraber, gizlenmesi mumkün olmağanı içün, ayette digerlerinden istisna etilgendir. Ancaq, daa esaslı bir noqtai nazarğa kore, ayetteki «ziynet» tabiri qadın vucudını ifade eter ki, buña kore, yasaqlanğan süs eşyalarınıñ kosterilüvi degil, vucutnıñ kosterilüvidir. Bu yasaqlavdan istisna etilgen «korüngen» qısım ise, qadınnıñ yuzü, elleri ve, bir noqtai nazarğa kore, ayaqlarıdır."
        cid: 0
  - verse: 32
    segments:
      - text: "Arañızdaki bekârlarnı erkek ve qadın hızmetkârlarıñızdan elverişli olğanlarnı evlendiriñ. Eger olar faqır iseler, Allaһ oz lütfi ile olarnı zenginleştirir. Allaһ (lütfi) keniş ve (er şeyni) bilicidir."
        cid: 0
  - verse: 33
    segments:
      - text: "Evlenüv imkânını tapalmağanlar ise, Allaһ lütfi ile olarnı varlıqlı etkenge qadar, iffetlerini qorçalasınlar. Elleriñizniñ astında olğanlarından (erkek ve qadın hızmetkârlardan) mukâtebe yapmaq istegenlernen, eger ozlerinde bir hayır (qabiliyet ve işançlılıq) kore iseñiz, aman mukâtebe yapıñ. Allaһnıñ sizge bergen malından siz de olarğa beriñ. Dünya ayatınıñ keçici menfaatlarını elde eteceksiñiz diye, namuslı qalmaq istegen cariyeleriñizni fuhuşqa zorlamañ. Kim olarnı zorbalıq altında bıraqır ise, bilinmelidir ki, zorlanuvlarından soñ, Allaһ (olar içün) çoq bağışlayıcı ve merhametlidir. (Mukâtebe - erkek ya da qadın hızmetkârnen efendisi arasında yapılğan bir qayd olup, bu qaydda hızmetkâr belli bir aq odegeni taqdirde, efendisinden ozüne urriyetini bermesini ister ya da aynı teklifni oña efendisi yapar. Uzerinde añlaşuvğa barılğan bu aq azır ise, hızmetkâr bu aqnı aman odemek, yoq ise, efendisiniñ ozüne belli bir muddet içinde temin etkeninden soñ, odemek şartınen, urriyetine qavuşır. Yuqarıdaki ayette «Allaһnıñ sizge bergen malından siz de olarğa beriñ» buyurulmaqnen, insannıñ elindeki malınıñ asıl saibi Allaһ olğanı, bu alda Allaһnıñ malından hızmetkârğa da bermeknen, olarnıñ urriyetke qavuşuvlarını qolaylaştırmaqnıñ diniy, ahlâqiy ve içtimaiy bir vazife olğanı ortağa çıqmaqta. Bu vazife İslâmnıñ asırlar boyu tedbiq etilip kelingen ve bir anda ortadan qaldırıluvı mumkün olmağan hızmetkârlıq muessisesini ortadan qaldırmaq içün alğan bir sıra tedbirden biridir)."
        cid: 0
