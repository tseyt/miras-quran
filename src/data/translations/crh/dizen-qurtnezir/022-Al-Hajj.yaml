          qalqışmasın. Lâkin, Allah şeytannıñ qatacaq şeyini yoq eter. Soñ, Allah öz
          ayetlerini (söz ve mana noqtai nazarından) sağlam olaraq yerleştirir. Allah
          haqqı ile bilicidir, üküm ve ikmet saibidir. (Bu ayet peyğamberler de yañıla
          bilecegini, ancaq Allah olarnı yañıluvdan ve şeytannıñ vesvesesinden
          qorçalağanını, böylece, peyğamberlerniñ tebliğlerini qusursız bir şekilde yapmaq
          imkânına qavuşqanlarını añlatmaqta. Bir tefsirge köre de, ayetniñ manası
          böyledir: «... O, vahiy etilgenni oquğan vaqıtta, şeytan diñlegenlerniñ
          qalplerine batıl şübe ve ihtimallar ketirir»).
        cid: 0
  - verse: 53
    segments:
      - text: >
