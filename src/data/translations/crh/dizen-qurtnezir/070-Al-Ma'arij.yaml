  - verse: 35
    segments:
      - text: İşte, bular
        cid: 1
      - text: cennetlerde ikramğa nail olğanlardır.
        cid: 2
      - text: >-
          (Maqbul qullarnıñ hususiyetleri sayılır eken, başında ve soñunda namazğa yer
          berilüvi, namaznıñ müimligini açıq bir şekilde ortağa qoymaqta. 22 ve 23- nci
          ayetlerde namazğa devam etmek ve bu meselede tenbellik köstermemek noqtasına işaret
          etilgen edi; 34-nci ayette ise, namaznıñ bütün aqlarını bermekniñ, yani bir
          taraftan, erkânı ve edebine riayet etmekniñ, diger taraftan, namaz tışındaki
          davranışlarında da, namaznıñ qazandırğan ülviy hısletlerini qorçalamaqnıñ müimligine
          işaret etile).
        cid: 0
