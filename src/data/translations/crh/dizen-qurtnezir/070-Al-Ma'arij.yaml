surah_id: 70
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >-
          Birisi, yükselüv dereceleriniñ saibi olğan Allah qatından inkârcılarğa kelecek olğan
          ve iç kimse mani
        cid: 0
      - text: olalmaycaq azapnı istedi!
        cid: 3
      - text: >-
          (Bu yerde qıyametni ve ahiret azabını alayğa alıp, Az.Peyğamberden bir an evel onı
          ketirmesini istegen Nadr b. Haris ve Ebu Cehil kibi müşriklerge işaret etilmekte).
        cid: 0
