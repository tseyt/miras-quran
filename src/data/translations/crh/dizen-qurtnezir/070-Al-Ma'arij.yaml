surah_id: 70
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: "Birisi, yukselüv dereceleriniñ saibi olğan Allaһ qatından inkârcılarğa kelecek olğan ve iç kimse mani olalmaycaq azapnı istedi! (Bu yerde qıyametni ve ahiret azabını alayğa alp, Az.Peyğamberden bir an evel onı ketirmesini istegen Nadr b. Haris ve Ebu Cehil kibi muşriklerge işaret etilmekte)."
        cid: 0
  - verse: 4
    segments:
      - text: "Melekler ve Ruh (Cebrail), o yerge, miqdarı (dünya senesi ile) elli biñ yıl olğan bir kunde yukselip çıqar. (Ayetteki «kun»niñ manası içün baq. Secde, 32/5-niñ izaatı)."
        cid: 0
  - verse: 5
    segments:
      - text: "(Resulım!) Şimdi sen guzelce sabır et."
        cid: 0
  - verse: 6
    segments:
      - text: "Doğrusı, olar, o azapnı (itimaldan) uzaq kormekteler."
        cid: 0
  - verse: 7
    segments:
      - text: "Biz ise, onı yaqın kormektemiz."
        cid: 0
  - verse: 8
    segments:
      - text: "O kunü kok yuzü irigen maden kibi olur."
        cid: 0
  - verse: 9
    segments:
      - text: "Dağlar da atılğan yunge döner."
        cid: 0
  - verse: 10
    segments:
      - text: "Dost, dostnı soramaz."
        cid: 0
  - verse: 11
    segments:
      - text: "Bir-birilerine kosterilirler (faqat er kes oz derdinendir). Gunahkâr kimse ister ki, o kunniñ azabından (qurtulış içün), oğullarını, qadınını, qardaşını, ozüni qorçalap sığındırğan (barındırğan) butün ailesini ve yer yuzünde kim bar ise, episini fidye olaraq bersin de, tek ozüni qurtarsın."
        cid: 0
  - verse: 15
    segments:
      - text: "Faqat mumkünmi! Bilinmeli ki, o (ceennem) alevlengen bir ateştir."
        cid: 0
  - verse: 16
    segments:
      - text: "Terilerni qavurıp sıdırır. («Terilerini» diye mana berilgen «şevaa» esasen qafa terisi demektir. Vucutnıñ, baş, el, ayaq kibi uc azaları manasına da kele)."
        cid: 0
  - verse: 17
    segments:
      - text: "Yuz çevirip, keri döngen, (servet) toplap yığğan kimseni (ozüne) çağırır!"
        cid: 0
  - verse: 19
    segments:
      - text: "Aqiqaten, insan pek hırslı (ve sabırsız) yaratılğandır."
        cid: 0
  - verse: 20
    segments:
      - text: "Oña yamanlıq toqunğanda, sızlanır, feryad eter."
        cid: 0
  - verse: 21
    segments:
      - text: "Oña imkân berilgende ise, saran kesilir."
        cid: 0
  - verse: 22
    segments:
      - text: "Ancaq bular oyle degildir: Namaz qılğanlar, ki olar namazlarında devamlıdırlar (tenbellik etmezler;)"
        cid: 0
  - verse: 24
    segments:
      - text: "Mallarında, istegenge ve (istep olalmağanı içün) mahrum qalğanğa belli bir aq tanığanlar;"
        cid: 0
  - verse: 26
    segments:
      - text: "Ceza (ve esap) kunüniñ doğrulığına inanğanlar;"
        cid: 0
  - verse: 27
    segments:
      - text: "Rabbleriniñ azabından qorqqanlar, ki Rabbleriniñ azabı(na qarşı) emin olunamaz;"
        cid: 0
  - verse: 29
    segments:
      - text: "Irızlarını qorçalağanlar -ancaq qadınlarına ve cariyelerine qarşı istisna; çünki, olar azarlanmaz; bundan başqağa (keçmek) istegenler ise, olar adden aşqanlarnıñ tam ozleridir-;"
        cid: 0
  - verse: 32
    segments:
      - text: "Emanetlerine ve ahtlarına riayet etkenler;"
        cid: 0
  - verse: 33
    segments:
      - text: "Şaatlıqlarını (dos-doğru) yapqanlar;"
        cid: 0
  - verse: 34
    segments:
      - text: "Namazlarını qorçalağanlar;"
        cid: 0
  - verse: 35
    segments:
      - text: "İşte, bular cennetlerde ikramğa nail olğanlardır. (Maqbul qullarnıñ hususiyetleri sayılır eken, başında ve soñunda namazğa yer berilüvi, namaznıñ muimligini açıq bir şekilde ortağa qoymaqta. 22 ve 23nci ayetlerde namazğa devam etmek ve bu meselede tenbellik kostermemek noqtasına işaret etilgen edi; 34-nci ayette ise, namaznıñ butün aqlarını bermekniñ, yani bir taraftan, erkânı ve edebine riayet etmekniñ, diger taraftan, namaz tışındaki davranışlarında da, namaznıñ qazandırğan ulviy hısletlerini qorçalamaqnıñ muimligine işaret etile)."
        cid: 0
  - verse: 36
    segments:
      - text: "(Resulım!) O kâfirlerge ne olmaqta ki, top-top sağdan ve soldan saña doğru çapışmaqtalar."
        cid: 0
  - verse: 38
    segments:
      - text: "Olardan er biri nimet cennetine qoyulacağını umüt etemi? (Muşrikler top-top kelerek, Az.Peyğamberniñ etrafındakilerniñ arasına qarışa, onıñ sözlerini diñlep: «Eger bular, Muһammedniñ degeni kibi, cennetke kirecek isler, biz, elbette olardan evel cennetke kirermiz», diye alay ete ediler)."
        cid: 0
  - verse: 39
    segments:
      - text: "Yoq (iç umüt etmesinler!) Şubesiz, biz olarnı, ozleriniñ de bilgen şeylerinden yarattıq (faqat ibret almadılar, imanğa kelmediler)."
        cid: 0
  - verse: 40
    segments:
      - text: "O alda, (işniñ kerçegi) oyle (umüt etkenleri kibi) degil! Şarqlarnıñ ve ğarplarnıñ Rabbine yemin eterim ki, şubesiz, olarnıñ yerine daa yahşılarını ketirmege bizim kuçümiz yeter. Ve kimse bizim ogümizge keçalmaz."
        cid: 0
  - verse: 42
    segments:
      - text: "Amma, sen olarnı (şimdilik) bıraq da, tehdid etilgen kunlerine qavuşqanğace dalsınlar, oynay tursınlar."
        cid: 0
  - verse: 43
    segments:
      - text: "O kunü olar, sanki tiklengen bir şeyge çapışqan kibi, kozleri horluqtan aşağı engen ve ozleri zilletke burüngen bir alda qabirlerinden fırlap-fırlap çıqarlar. İşte, bu, olarnıñ tehdid etile kelgen kunleridir! («Tikilgen şey» tabınmaq içün tiklengen putlar ya da er angi bir nişan olaraq tefsir etilmekte)."
        cid: 0