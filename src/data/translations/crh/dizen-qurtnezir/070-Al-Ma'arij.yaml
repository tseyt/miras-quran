surah_id: 70
language: crh
author: dizen-qurtnezir
verses:
  - verse: 1
    segments:
      - text: >
          Birisi, yükselüv dereceleriniñ saibi olğan Allah qatından inkârcılarğa kelecek
          olğan ve iç kimse mani olalmaycaq azapnı istedi! (Bu yerde qıyametni ve ahiret
          azabını alayğa alıp, Az.Peyğamberden bir an evel onı ketirmesini istegen Nadr b.
          Haris ve Ebu Cehil kibi müşriklerge işaret etilmekte).
        cid: 0
  - verse: 2
    segments:
      - text: >
          [1 ayetine baq.]
        cid: 0
  - verse: 3
    segments:
      - text: >
          [1 ayetine baq.]
        cid: 0
  - verse: 4
    segments:
      - text: >
          Melekler ve Ruh (Cebrail), o yerge, miqdarı (dünya senesi ile) elli biñ yıl
          olğan bir künde yükselip çıqar. (Ayetteki «kün»niñ manası içün baq. Secde,
          32/5-niñ izaatı).
        cid: 0
  - verse: 5
    segments:
      - text: >
          (Resulım!) Şimdi sen güzelce sabır et.
        cid: 0
  - verse: 6
    segments:
      - text: >
          Doğrusı, olar, o azapnı (itimaldan) uzaq körmekteler.
        cid: 0
  - verse: 7
    segments:
      - text: >
          Biz ise, onı yaqın körmektemiz.
        cid: 0
  - verse: 8
    segments:
      - text: >
          O künü kök yüzü irigen maden kibi olur.
        cid: 0
  - verse: 9
    segments:
      - text: >
          Dağlar da atılğan yünge döner.
        cid: 0
  - verse: 10
    segments:
      - text: >
          Dost, dostnı soramaz.
        cid: 0
  - verse: 11
    segments:
      - text: >
          Bir-birilerine kösterilirler (faqat er kes öz derdinendir). Günahkâr kimse ister
          ki, o künniñ azabından (qurtulış içün), oğullarını, qadınını, qardaşını, özüni
          qorçalap sığındırğan (barındırğan) bütün ailesini ve yer yüzünde kim bar ise,
          episini fidye olaraq bersin de, tek özüni qurtarsın.
        cid: 0
  - verse: 12
    segments:
      - text: >
          [11 ayetine baq.]
        cid: 0
  - verse: 13
    segments:
      - text: >
          [11 ayetine baq.]
        cid: 0
  - verse: 14
    segments:
      - text: >
          [11 ayetine baq.]
        cid: 0
  - verse: 15
    segments:
      - text: >
          Faqat mümkünmi! Bilinmeli ki, o (ceennem) alevlengen bir ateştir.
        cid: 0
  - verse: 16
    segments:
      - text: >
          Terilerni qavurıp sıdırır. («Terilerini» diye mana berilgen «şevaa» esasen qafa
          terisi demektir. Vucutnıñ, baş, el, ayaq kibi uc azaları manasına da kele).
        cid: 0
  - verse: 17
    segments:
      - text: >
          Yüz çevirip, keri döngen, (servet) toplap yığğan kimseni (özüne) çağırır!
        cid: 0
  - verse: 18
    segments:
      - text: >
          [17 ayetine baq.]
        cid: 0
  - verse: 19
    segments:
      - text: >
          Aqiqaten, insan pek hırslı (ve sabırsız) yaratılğandır.
        cid: 0
  - verse: 20
    segments:
      - text: >
          Oña yamanlıq toqunğanda, sızlanır, feryad eter.
        cid: 0
  - verse: 21
    segments:
      - text: >
          Oña imkân berilgende ise, saran kesilir.
        cid: 0
  - verse: 22
    segments:
      - text: >
          Ancaq bular öyle degildir: Namaz qılğanlar, ki olar namazlarında devamlıdırlar
          (tenbellik etmezler;)
        cid: 0
  - verse: 23
    segments:
      - text: >
          [22 ayetine baq.]
        cid: 0
  - verse: 24
    segments:
      - text: >
          Mallarında, istegenge ve (istep olalmağanı içün) mahrum qalğanğa belli bir aq
          tanığanlar;
        cid: 0
  - verse: 25
    segments:
      - text: >
          [24 ayetine baq.]
        cid: 0
  - verse: 26
    segments:
      - text: >
          Ceza (ve esap) kününiñ doğrulığına inanğanlar;
        cid: 0
  - verse: 27
    segments:
      - text: >
          Rabbleriniñ azabından qorqqanlar, ki Rabbleriniñ azabı(na qarşı) emin olunamaz;
        cid: 0
  - verse: 28
    segments:
      - text: >
          [27 ayetine baq.]
        cid: 0
  - verse: 29
    segments:
      - text: >
          Irızlarını qorçalağanlar -ancaq qadınlarına ve cariyelerine qarşı istisna;
          çünki, olar azarlanmaz; bundan başqağa (keçmek) istegenler ise, olar adden
          aşqanlarnıñ tam özleridir-;
        cid: 0
  - verse: 30
    segments:
      - text: >
          [29 ayetine baq.]
        cid: 0
  - verse: 31
    segments:
      - text: >
          [29 ayetine baq.]
        cid: 0
  - verse: 32
    segments:
      - text: >
          Emanetlerine ve ahtlarına riayet etkenler;
        cid: 0
  - verse: 33
    segments:
      - text: >
          Şaatlıqlarını (dos-doğru) yapqanlar;
        cid: 0
  - verse: 34
    segments:
      - text: >
          Namazlarını qorçalağanlar;
        cid: 0
  - verse: 35
    segments:
      - text: >
          İşte, bular cennetlerde ikramğa nail olğanlardır. (Maqbul qullarnıñ
          hususiyetleri sayılır eken, başında ve soñunda namazğa yer berilüvi, namaznıñ
          müimligini açıq bir şekilde ortağa qoymaqta. 22 ve 23- nci ayetlerde namazğa
          devam etmek ve bu meselede tenbellik köstermemek noqtasına işaret etilgen edi;
          34-nci ayette ise, namaznıñ bütün aqlarını bermekniñ, yani bir taraftan, erkânı
          ve edebine riayet etmekniñ, diger taraftan, namaz tışındaki davranışlarında da,
          namaznıñ qazandırğan ülviy hısletlerini qorçalamaqnıñ müimligine işaret etile).
        cid: 0
  - verse: 36
    segments:
      - text: >
          (Resulım!) O kâfirlerge ne olmaqta ki, top-top sağdan ve soldan saña doğru
          çapışmaqtalar.
        cid: 0
  - verse: 37
    segments:
      - text: >
          [36 ayetine baq.]
        cid: 0
  - verse: 38
    segments:
      - text: >
          Olardan er biri nimet cennetine qoyulacağını ümüt etemi? (Müşrikler top-top
          kelerek, Az.Peyğamberniñ etrafındakilerniñ arasına qarışa, onıñ sözlerini
          diñlep: «Eger bular, Muhammedniñ degeni kibi, cennetke kirecek isler, biz,
          elbette olardan evel cennetke kirermiz», diye alay ete ediler).
        cid: 0
  - verse: 39
    segments:
      - text: >
          Yoq (iç ümüt etmesinler!) Şübesiz, biz olarnı, özleriniñ de bilgen şeylerinden
          yarattıq (faqat ibret almadılar, imanğa kelmediler).
        cid: 0
  - verse: 40
    segments:
      - text: >
          O alda, (işniñ kerçegi) öyle (ümüt etkenleri kibi) degil! Şarqlarnıñ ve
          ğarplarnıñ Rabbine yemin eterim ki, şübesiz, olarnıñ yerine daa yahşılarını
          ketirmege bizim küçümiz yeter. Ve kimse bizim ögümizge keçalmaz.
        cid: 0
  - verse: 41
    segments:
      - text: >
          [40 ayetine baq.]
        cid: 0
  - verse: 42
    segments:
      - text: >
          Amma, sen olarnı (şimdilik) bıraq da, tehdid etilgen künlerine qavuşqanğace
          dalsınlar, oynay tursınlar.
        cid: 0
  - verse: 43
    segments:
      - text: >
          O künü olar, sanki tiklengen bir şeyge çapışqan kibi, közleri horluqtan aşağı
          engen ve özleri zilletke bürüngen bir alda qabirlerinden fırlap-fırlap çıqarlar.
          İşte, bu, olarnıñ tehdid etile kelgen künleridir! («Tikilgen şey» tabınmaq içün
          tiklengen putlar ya da er angi bir nişan olaraq tefsir etilmekte).
        cid: 0
  - verse: 44
    segments:
      - text: >
          [43 ayetine baq.]
        cid: 0
