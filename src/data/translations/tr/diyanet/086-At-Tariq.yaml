surah_id: 86
language: tr
author: diyanet
verses:
  - verse: 1
    segments:
      - text: "Göğe ve Tarık'a and olsun;"
        cid: 0
  - verse: 2
    segments:
      - text: "Tarık'ın ne olduğunu sen bilir misin?"
        cid: 0
  - verse: 3
    segments:
      - text: "O, (ışığıyla karanlığı) delen yıldızdır."
        cid: 0
  - verse: 4
    segments:
      - text: "Üzerinde gözetici olmayan kimse yoktur."
        cid: 0
  - verse: 5
    segments:
      - text: "Öyleyse insan neden yaratıldığına bir baksın."
        cid: 0
  - verse: 6
    segments:
      - text: "O, erkek ve kadının beli ile kaburga kemikleri arasından atılagelen bir sudan yaratılmıştır."
        cid: 0
  - verse: 7
    segments:
      - text: "O, erkek ve kadının beli ile kaburga kemikleri arasından atılagelen bir sudan yaratılmıştır."
        cid: 0
  - verse: 8
    segments:
      - text: "Şüphesiz Allah, gizliliklerin ortaya çıkacağı gün, insanı tekrar yaratmaya Kadir'dir."
        cid: 0
  - verse: 9
    segments:
