        cid: 0
  - verse: 10
    segments:
      - text: "O gün, insanın gücü de, yardımcısı da olmaz."
        cid: 0
  - verse: 11
    segments:
      - text: "Dönüşlü göğe ve yarılan yeryüzüne and olsun ki,"
        cid: 0
  - verse: 12
    segments:
      - text: "Dönüşlü göğe ve yarılan yeryüzüne and olsun ki,"
        cid: 0
  - verse: 13
    segments:
      - text: "Doğrusu bu Kuran kesin bir sözdür."
        cid: 0
  - verse: 14
    segments:
      - text: "O, eğlence için değildir."
        cid: 0
  - verse: 15
    segments:
