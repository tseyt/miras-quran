surah_id: 62
language: tr
author: diyanet
verses:
  - verse: 1
    segments:
      - text: "Göklerde olanlar ve yerde bulunanlar, hükümran, çok kutsal, güçlü ve Hakim olan Allah'ı tesbih ederler."
        cid: 0
  - verse: 2
    segments:
      - text: "Kitapsız (okuma-yazma bilmeyen) kimseler arasından, kendilerine ayetlerini okuyan, onları arıtan, onlara Kitabı ve hikmeti öğreten bir Peygamber gönderen O'dur. Onlar, daha önce, şüphesiz apaçık bir sapıklık içinde idiler."
        cid: 0
  - verse: 3
    segments:
      - text: "Onlardan başkalarına da -ki henüz onlara katılmamışlardır- Kitap ve hikmeti öğretmek üzere, Peygamberi gönderen Allah'tır. O, güçlüdür, Hakim'dir."
        cid: 0
  - verse: 4
    segments:
      - text: "Bu, Allah'ın dilediğine verdiği lütfüdür. Allah, büyük lütuf sahibidir."
        cid: 0
  - verse: 5
    segments:
      - text: "Kendilerine Tevrat öğretildiği halde, onun gereğini yapmayanların durumu, sırtına kitap yüklenmiş merkebin durumu gibidir. Allah'ın ayetlerini yalanlayan kimselerin durumu ne kötüdür! Allah zalimleri doğru yola eriştirmez."
        cid: 0
  - verse: 6
    segments:
      - text: "De ki: &quot;Ey Yahudiler! Bütün insanlar bir yana, yalnız kendinizin Allah'ın dostları olduğunuzu iddia ediyorsanız ve bunda samimi iseniz, ölümü dilesenize!&quot;"
        cid: 0
  - verse: 7
    segments:
      - text: "Yaptıklarından ötürü, ölümü asla dileyemezler. Allah, zalimleri bilendir."
        cid: 0
  - verse: 8
    segments:
      - text: "De ki: &quot;Doğrusu kendisinden kaçtığınız ölüm mutlaka karşınıza çıkacaktır; sonra; görüleni de görülmeyeni de bilen Allah'a döndürüleceksiniz, O size işlediklerinizi haber verecektir.&quot;"
        cid: 0
  - verse: 9
    segments:
      - text: "Ey inananlar! Cuma günü namaz için ezan okunduğu zaman Allah'ı anmaya koşun; alım satımı bırakın; bilseniz, bu sizin için daha iyidir."
        cid: 0
  - verse: 10
    segments:
      - text: "Namaz bitince yeryüzüne yayılın; Allah'ın lütfundan rızık isteyin; Allah'ı çok anın ki saadete erişesiniz."
        cid: 0
  - verse: 11
    segments:
      - text: "Onlar bir kazanç veya bir eğlence gördüklerinde, seni ayakta bırakarak oraya yöneldiler. De ki: &quot;Allah katında olan, eğlenceden de kazançtan da hayırlıdır. Allah, rızık verenlerin en iyisidir.&quot;"
        cid: 0