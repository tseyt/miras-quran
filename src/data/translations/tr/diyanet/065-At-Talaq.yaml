surah_id: 65
language: tr
author: diyanet
verses:
  - verse: 1
    segments:
      - text: >-
          Ey Peygamber! Kadınları boşayacağınızda, onları, iddetlerini gözeterek boşayın
          ve iddeti sayın; Rabbiniz olan Allah'tan sakının; onları, apaçık bir hayasızlık
          yapmaları hali bir yana evlerinden çıkarmayın, onlar da çıkmasınlar. Bunlar,
          Allah'ın sınırlarıdır. Allah'ın sınırlarını kim aşarsa, şüphesiz, kendine yazık
          etmiş olur. Bilmezsin, olur ki, Allah bunun ardından bir hal meydana getirir.
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Kadınların iddet süreleri biteceğinde, onları ya uygun bir şekilde alıkoyun, ya
          da onlardan ayrılın; içinizden de iki adil şahit getirin; şahidliği Allah için
          yapın; işte bu, Allah'a ve ahiret gününe inanan kimseye verilen öğüttür. Allah,
          kendisine karşı gelmekten sakınan kimseye kurtuluş yolu sağlar, ona beklemediği
          yerden rızık verir. Allah'a güvenen kimseye O yeter. Allah, buyruğunu yerine
          getirendir. Allah her şey için bir ölçü var etmiştir.
        cid: 0
  - verse: 3
    segments:
      - text: >-
          Kadınların iddet süreleri biteceğinde, onları ya uygun bir şekilde alıkoyun, ya
          da onlardan ayrılın; içinizden de iki adil şahit getirin; şahidliği Allah için
          yapın; işte bu, Allah'a ve ahiret gününe inanan kimseye verilen öğüttür. Allah,
          kendisine karşı gelmekten sakınan kimseye kurtuluş yolu sağlar, ona beklemediği
          yerden rızık verir. Allah'a güvenen kimseye O yeter. Allah, buyruğunu yerine
          getirendir. Allah her şey için bir ölçü var etmiştir.
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Kadınlarınızdan ay hali görmekten kesilenler ile henüz ay hali görmemiş
          olanların iddetleri hususunda şüpheye düşerseniz, bilin ki, onların iddet
          beklemesi üç aydır; gebe olanların iddeti, doğurmaları ile tamamlanır. Allah,
          buyruğuna karşı gelmekten sakınan kimseye işinde kolaylık verir.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Bu, Allah'ın size indirmiş olduğu buyruğudur. Kim Allah'ın buyruğuna karşı
          gelmekten sakınırsa, O, onun kötülüklerini örter, ecrini büyültür.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Boşadığınız, fakat iddeti dolmamış kadınları gücünüz nispetinde, kendi
          oturduğunuz yerde oturtun. Onları sıkıntıya sokmak için zarar vermeye
          kalkışmayın. Eğer hamile iseler, doğurmalarına kadar nafakalarını verin. Çocuğu
          sizin için emzirirlerse, onlara ücretlerini ödeyin; aranızda uygun bir şekilde
          anlaşın; eğer güçlükle karşılaşırsanız çocuğu başka bir kadın emzirebilir.
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Varlıklı olan kimse, nafakayı varlığına göre versin; rızkı ancak kendisine
          yetecek kadar verilmiş olan kimse, Allah'ın kendisine verdiğinden versin; Allah
          kimseye, verdiği rızkı aşan bir yük yüklemez. Allah, güçlükten sonra kolaylık
          verir.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Rablerinin ve O'nun peygamberlerinin buyruğundan çıkan nice kasabalar halkını
          Biz, çetin bir hesaba çekmiş, onları, görülmedik bir azaba uğratmışızdır.
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Onlar, işlerinin karşılığını tattılar; işlerinin sonu hüsran oldu.
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Allah onlara çetin bir azap hazırlamıştır. Ey inanmış olan akıl sahipleri!
          Allah'tan sakının; Allah size Kuran'ı indirmiştir.
        cid: 0
  - verse: 11
    segments:
      - text: >-
          İnanıp yararlı işler işleyenleri karanlıklardan aydınlığa çıkarmak üzere, size
          Allah'ın apaçık ayetlerini okuyan bir Peygamber göndermiştir. Kim Allah'a inanır
          ve yararlı iş işlerse, Allah onu, içinde temelli ve sonsuz kalınacak, içlerinden
          ırmaklarakan cennetlere koyar. Allah ona gerçekten güzel rızık vermiştir.
        cid: 0
  - verse: 12
    segments:
      - text: >-
          Yedi göğü ve yerden de bir o kadarını yaratan Allah'tır, Allah'ın herşeye Kadir
          olduğunu ve Allah'ın ilminin herşeyi kuşattığını bilmeniz için Allah'ın buyruğu
          bunlar arasında iner durur.
        cid: 0