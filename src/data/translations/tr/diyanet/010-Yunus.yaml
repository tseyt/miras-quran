          tapmıyordunuz ki. Allah, sizinle bizim aramızda şahit olarak yeter. Sizin
          tapınmanızdan bizim haberimiz yoktu" derler.
        cid: 0
  - verse: 29
    segments:
      - text: >-
          Onların hepsini bir gün toplarız, sonra, puta tapanlara, "Siz ve putlarınız
