        cid: 0
  - verse: 31
    segments:
      - text: >-
          De ki: "Gökten ve yerden size rızık veren kimdir? Kulak ve gözlerin sahibi
          kimdir? Diriyi ölüden çıkaran, ölüyü de diriden çıkaran kimdir? Her işi
          düzenleyen kimdir?" Onlar: "Allah'tır! " diyecekler. "O halde O'na karşı
          gelmekten sakınmaz mısınız?" de.
        cid: 0
  - verse: 32
    segments:
      - text: >-
          İşte gerçek Rabbiniz Allah budur. Gerçeğin dışında sadece sapıklık vardır.
          Öyleyse nasıl olup da döndürülüyorsunuz?
        cid: 0
  - verse: 33
    segments:
      - text: >-
          Böylece, fasık olanların inanmayacaklarına dair Rabbinin söylediği söz
          gerçekleşti.
        cid: 0
  - verse: 34
    segments:
      - text: >-
          De ki: "Koştuğunuz ortaklardan, önce yaratan, sonra bunu tekrar eden var
          mıdır?" De ki: "Allah önce yaratır, sonra bunu tekrar eder. Nasıl da
          döndürülürsünüz! "
        cid: 0
  - verse: 35
    segments:
      - text: >-
          De ki: "Koştuğunuz ortaklardan gerçeğe eriştiren var mıdır?" De ki: "Ama Allah
          gerçeğe eriştirir. Gerçeğe eriştiren mi, yoksa, birisi götürmezse gidemeyen mi
          uyulmağa daha layıktır? Ne biçim hüküm veriyorsunuz?"
        cid: 0
  - verse: 36
    segments:
      - text: >-
          Onların çoğu zanna uyarlar; gerçekte ise zan, hakikat karşısında bir şey ifade
          etmez. Allah, yaptıklarını şüphesiz bilir.
        cid: 0
  - verse: 37
    segments:
      - text: >-
