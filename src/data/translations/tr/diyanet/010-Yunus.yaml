surah_id: 10
language: tr
author: diyanet
verses:
  - verse: 1
    segments:
      - text: >-
          Elif, Lam, Ra. İşte bunlar hikmetli Kitap'ın ayetleridir.
        cid: 0
  - verse: 2
    segments:
      - text: >-
          İçlerinden birine, "İnsanları uyar ve inananlara, Rableri katında yüksek
          makamlar olduğunu müjdele" diye vahyetmemiz, insanların tuhafına mı gitti ki,
          kafirler: "Bu apaçık bir büyücüdür" dediler?
        cid: 0
  - verse: 3
    segments:
      - text: >-
          Doğrusu sizin Rabbiniz gökleri ve yeri altı günde yaratıp sonra arşa hükmeden,
          işi düzenleyen Allah'tır, izni olmadan kimse şefaat edemez. İşte Rabbiniz olan
          Allah budur. O'na kulluk edin. Nasihat dinlemez misiniz?
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Hepinizin dönüşü, O'nadır. Allah'ın vadi haktır. O, önce yaratır, sonra inanıp
          yararlı işler yapanların ve inkar edenlerin hareketlerinin karşılığını adaletle
          vermek için tekrar diriltir. İnkarcılara, inkarlarından ötürü kızgın bir içecek
          ve can yakıcı azab vardır.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Güneşi ışıklı ve ayı nurlu yapan; yılların sayısını ve hesabı bilmeniz için,
          aya konak yerleri düzenleyen O'dur. Allah bunları ancak gerçeğe göre
          yaratmıştır; bilen millete ayetleri uzun uzadıya açıklıyor.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Gece ile gündüzün birbiri ardınca gelmesinde, Allah'ın göklerde ve yerde
          yarattıklarında, O'na karşı gelmekten sakınan kimseler için ayetler vardır.
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Bizimle karşılaşmayı ummayan ve dünya hayatından hoşnut olup ona bağlananların
          ve ayetlerimizden habersiz bulunanların, işte bunların kazandıklarına karşılık
          varacakları yer cehennemdir.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Bizimle karşılaşmayı ummayan ve dünya hayatından hoşnut olup ona bağlananların
          ve ayetlerimizden habersiz bulunanların, işte bunların kazandıklarına karşılık
          varacakları yer cehennemdir.
        cid: 0
  - verse: 9
    segments:
      - text: >-
          İnananlar ve yararlı iş yapanları, imanlarına karşılık Rableri doğru yola
          eriştirir; nimet cennetlerinde onların altlarından ırmaklar akar.
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Oradaki duaları: "Münezzehsin ey Allah'ım", dirlik temennileri: "Selam size" ve
          dualarının sonu da: "Alemlerin Rabbi Allah'a hamd olsun"dur.
        cid: 0
  - verse: 11
    segments:
      - text: >-
          İyiliği acele isteyen kimselere Allah fenalığı da çarçabuk verseydi, süreleri
          hemen bitmiş olurdu. Bizimle karşılaşmayı ummayanları, azgınlıkları içinde
          bocalayıp dururlarken bırakırız.
        cid: 0
  - verse: 12
    segments:
      - text: >-
          İnsana bir darlık gelince, yan yatarken, oturur veya ayakta iken bize yalvarıp
          yakarır; biz darlığını giderince, başına gelen darlıktan ötürü bize hiç
          yalvarmamışa döner. İşlerinde tutumsuz olanlara, yaptıkları böylece güzel
          görünür.
        cid: 0
  - verse: 13
    segments:
      - text: >-
          And olsun ki, sizden önce nice nesilleri, peygamberleri onlara belgeler
          getirmişken, haksızlık ederek inanmadıkları zaman yok etmiştik. İşte biz suçlu
          milleti böyle cezalandırırız.
        cid: 0
  - verse: 14
    segments:
      - text: >-
          Sonra onların ardından, nasıl davranacağınıza bakmak için sizi yeryüzünde
          onların yerine geçirdik.
        cid: 0
  - verse: 15
    segments:
      - text: >-
          Ayetlerimiz onlara açık açık okununca, bizimle karşılaşmayı ummayanlar, "Bundan
          başka bir Kuran getir veya bunu değiştir" dediler. De ki: "Onu kendiliğimden
          değiştiremem, ben ancak, bana vahyolunana uyarım. Ben Rabbime karşı gelirsem,
          büyük günün azabına uğramaktan korkarım."
        cid: 0
  - verse: 16
    segments:
      - text: >-
          De ki: "Allah dileseydi ben onu size okumazdım, size de bildirmemiş olurdu.
          Daha önce yıllarca aranızda bulundum, hiç düşünmüyor musunuz?"
        cid: 0
  - verse: 17
    segments:
      - text: >-
          Allah'a karşı yalan uyduran veya ayetlerini yalan sayandan daha zalim kim
          olabilir? Suçlular elbette saadete erişemezler.
        cid: 0
  - verse: 18
    segments:
      - text: >-
          Onlar, Allah'ı bırakarak, kendilerine fayda da zarar da veremeyen putlara
          taparlar: "Bunlar, Allah katında bizim şefaatçılarımızdır" derler. De ki:
          "Göklerde ve yerde, Allah'ın bilmediği bir şeyi mi O'na haber veriyorsunuz?"
          Allah, onların ortak koşmalarından münezzeh ve yücedir.
        cid: 0
  - verse: 19
    segments:
      - text: >-
          İnsanlar bir tek ümmettiler, sonra ayrılığa düştüler; şayet Rabbinden, daha
          önce bir takdir geçmemiş olsaydı, aralarında ihtilafa düştükleri şeyler hakkında
          hüküm çoktan verilmiş olurdu.
        cid: 0
  - verse: 20
    segments:
      - text: >-
          "Rabbinden ona (Muhammed'e) bir mucize indirilse ne olur!" derler. Onlara de
          ki: "Gaybı bilmek Allah'a mahsustur; bekleyin, doğrusu ben de sizinle birlikte
          beklemekteyim."
        cid: 0
  - verse: 21
    segments:
      - text: >-
          İnsanlara darlık geldikten sonra onlara bolluğu taddırdığımızda, hemen
          ayetlerimize dil uzatmağa kalkışırlar; onlara de ki: "Hile yapanın cezasını
          vermekte Allah daha çabuktur." Elçi meleklerimiz kurduğunuz tuzakları hiç
          şüphesiz yazmaktadırlar.
        cid: 0
  - verse: 22
    segments:
      - text: >-
          Sizi karada ve denizde yürüten Allah'tır. Bulunduğunuz gemi, içindekileri güzel
          bir rüzgarla götürürken yolcular neşelenirler; bir fırtına çıkıp da onları her
          taraftan dalgaların sardığı ve çepeçevre kuşatıldıklarını sandıkları anda ise
          Allah'ın dinine sarılarak, "Bizi bu tehlikeden kurtarırsan and olsun ki
          şükredenlerden oluruz" diye O'na yalvarırlar.
        cid: 0
  - verse: 23
    segments:
      - text: >-
          Allah onları kurtarınca, hemen yeryüzünde haksız yere taşkınlıklara başlarlar.
          Ey insanlar! Geçici dünya hayatında yaptığınız taşkınlık aleyhinizedir. Sonra
          dönüşünüz Bizedir. Yaptıklarınızı size bildiririz.
        cid: 0
  - verse: 24
    segments:
      - text: >-
          Dünya hayatı gökten indirdiğimiz su gibidir ki, onunla insan ve hayvanların
          yiyeceği bitkiler yetişip birbirine karışmıştır. Yeryüzünün süslenip bezendiği
          ve yerin sahiplerinin bütün bunlara malik olduklarını sandıkları sırada, gece
          veya gündüz buyruğumuz o yere gelmiş ve orayı hiçbir şey bitirmemişe çevirmişiz;
          bir gün önce birşey yokmuş gibi olmuştur. Düşünen millet için ayetleri böylece
          uzun açıklıyoruz.
        cid: 0
  - verse: 25
    segments:
      - text: >-
          Allah, cennete çağırır ve dilediğini doğru yola eriştirir.
        cid: 0
  - verse: 26
    segments:
      - text: >-
          İyi davrananlara; daima daha iyisi ve üstünü verilir. Onların yüzlerine ne bir
          karalık, ne de zillet bulaşır. İşte onlar cennetliklerdir, orada temelli
          kalırlar.
        cid: 0
  - verse: 27
    segments:
      - text: >-
          Kötülük işleyenlere kötülükleri kadar ceza verilir; onların yüzlerini zillet
          bürür; Allah'a karşı onları savunacak yoktur; yüzleri, geceden kara bir parçayla
          örtülmüş gibidir. Bunlar cehennemliklerdir, orada temelli kalırlar.
        cid: 0
  - verse: 28
    segments:
      - text: >-
          Onların hepsini bir gün toplarız, sonra, puta tapanlara, "Siz ve putlarınız
