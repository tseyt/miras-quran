  - verse: 15
    segments:
      - text: >-
          Biz ilk yaratışta yorulduk mu? Hayır; onlar yeniden yaratılmaktan şüphe
          etmektedirler.
        cid: 0
  - verse: 16
    segments:
      - text: >-
          And olsun ki insanı Biz yarattık; nefsinin kendisine fısıldadıklarını biliriz;
          Biz ona şah damarından daha yakınız.
        cid: 0
  - verse: 17
    segments:
      - text: >-
          Sağında ve solunda, onunla beraber oturan iki alıcı melek, yanında hazır birer
          gözcü olarak söylediği her sözü zaptederler.
        cid: 0
  - verse: 18
