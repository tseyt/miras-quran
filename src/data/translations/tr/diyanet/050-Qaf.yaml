surah_id: 50
language: tr
author: diyanet
verses:
  - verse: 1
    segments:
      - text: >-
          Kaf. Şanlı Kuran'a and olsun.
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Kafirler, Aralarından bir uyarıcının gelmesine şaştılar da: "Bu şaşılacak bir
          şey; öldüğümüz ve toprak olduğumuz zaman dirilecek miyiz? Bu, ihtimali olmayan
          bir dönüştür" dediler.
        cid: 0
  - verse: 3
    segments:
      - text: >-
          Kafirler, Aralarından bir uyarıcının gelmesine şaştılar da: "Bu şaşılacak bir
          şey; öldüğümüz ve toprak olduğumuz zaman dirilecek miyiz? Bu, ihtimali olmayan
          bir dönüştür" dediler.
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Onlardan kimlerin ölüp toprağa karıştığını biliyoruz. Katımızda her şeyi
          unutulmaktan koruyan bir kitap vardır.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Hayır; onlar, gerçek kendilerine gelince onu yalanladılar; kararsızlık
          içindedirler.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Onlar, üstlerindeki göğü nasıl yapmışız, süslemişizdir bir bakmazlar mı? Onda
          hiçbir çatlak da yoktur.
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Allah'a yönelen her kula öğüt ve bir belge olarak yeryüzünü yaydık, oraya sabit
          dağlar yerleştirdik, orada her güzel türden yetiştirdik.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Allah'a yönelen her kula öğüt ve bir belge olarak yeryüzünü yaydık, oraya sabit
          dağlar yerleştirdik, orada her güzel türden yetiştirdik.
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Gökten bereketli bir su indirdik, kullara rızık olmak üzere onunla bahçeler,
          biçilecek taneli ekinler, küme küme tomurcukları olan boylu hurma ağaçları
          yetiştirdik. O su ile ölü yeri dirilttik. İşte insanların diriltilmesi de
          böyledir.
        cid: 0
