  - verse: 12
    segments:
      - text: >-
          Onlardan önce Nuh milleti, Ressliler, Semud, Ad, Firavun milletleri, Lut'un
          kardeşleri, Eykeliler, Tubba milleti de yalanlamışlardı; evet bunların hepsi
          peygamberleri yalanlamışlardı da tehdidim gerçekleşmişti.
        cid: 0
