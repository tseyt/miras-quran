        cid: 0
  - verse: 19
    segments:
      - text: >-
          Ölüm sarhoşluğu gerçekten gelir, ey insan, işte bu senin öteden beri korkup
          kaçtığın şeydir.
        cid: 0
  - verse: 20
    segments:
      - text: >-
          Sura üfürülür. İşte bu geleceği söz verilen gündür.
        cid: 0
  - verse: 21
    segments:
      - text: >-
          Her can, kendisiyle beraber bir sürücü ve şahit bulunduğu halde gelir.
        cid: 0
  - verse: 22
    segments:
      - text: >-
          Ona: "And olsun ki, sen, bundan gafildin; işte senden gaflet perdesini
          kaldırdık, bugün artık görüşün keskindir" denir.
        cid: 0
  - verse: 23
    segments:
      - text: >-
          Yanındaki melek: "İşte bu yanımdaki hazırdır" der.
        cid: 0
  - verse: 24
    segments:
