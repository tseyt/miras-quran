        cid: 0
  - verse: 5
    segments:
      - text: "And olsun ki Musa'yı ayetlerimizle, &quot;Milletini karanlıklardan aydınlığa çıkar ve Allah'ın günlerini onlara hatırlat&quot; diye göndermiştik. Bunlarda, çokça sabreden ve şükreden herkes için dersler vardır."
        cid: 0
