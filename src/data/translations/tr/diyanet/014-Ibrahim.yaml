surah_id: 14
language: tr
author: diyanet
verses:
  - verse: 1
    segments:
      - text: "Elif, Lam, Ra; Bu, Allah'ın izniyle, insanları karanlıklardan aydınlığa, güçlü ve övülmeğe layık, göklerde ve yerde olanların sahibi Allah'ın yoluna çıkarman için, sana indirdiğimiz Kitaptır. Uğrayacakları çetin azabdan dolayı vay kafirlerin haline!"
        cid: 0
  - verse: 2
