  - verse: 3
    segments:
      - text: "Onlar dünya hayatını ahirete tercih ederler, Allah'ın yolundan alıkoyup onun eğriliğini isterler. İşte onlar uzak bir sapıklık içindedirler."
        cid: 0
  - verse: 4
    segments:
