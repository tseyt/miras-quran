        cid: 0
  - verse: 40
    segments:
      - text: >-
          Ama kim Rabbinin azametinden korkup da kendini kötülükten alıkoymuşsa, varacağı
          yer şüphesiz cennettir.
        cid: 0
  - verse: 41
