surah_id: 8
language: tr
author: diyanet
verses:
  - verse: 1
    segments:
      - text: >-
          Sana, ganimetlere dair soru sorarlar, de ki: Ganimetler Allah'ın ve
          Peygamberindir. İnanıyorsanız Allah'tan sakının, aranızdaki münasebetleri
          düzeltin, Allah'a ve Peygamberine itaat edin.
        cid: 0
  - verse: 2
    segments:
      - text: >-
          İnananlar ancak, o kimselerdir ki Allah anıldığı zaman kalbleri titrer,
          ayetleri okunduğu zaman bu onların imanlarını artırır. Ve Rablerine güvenirler;
          namaz kılarlar; kendilerine verdiğimiz rızıktan yerli yerince sarf ederler.
        cid: 0
  - verse: 3
    segments:
      - text: >-
          İnananlar ancak, o kimselerdir ki Allah anıldığı zaman kalbleri titrer,
          ayetleri okunduğu zaman bu onların imanlarını artırır. Ve Rablerine güvenirler;
          namaz kılarlar; kendilerine verdiğimiz rızıktan yerli yerince sarf ederler.
        cid: 0
  - verse: 4
    segments:
      - text: >-
          İşte gerçekten inanmış olanlar bunlardır. Onlara Rablerinin katında mertebeler,
          mağfiret ve cömertçe verilmiş rızıklar vardır.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Nitekim, Rabbin seni hak uğrunda evinden savaş için çıkarmıştı, oysa
          müslümanların bir takımı bundan hoşlanmamıştı.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Sanki göz göre göre ölüme sürükleniyorlarmış gibi, gerçek ortaya çıktıktan
          sonra bile seninle tartışıyorlardı.
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Allah bu iki taifeden birini size vadetmişti; siz, kuvvetsiz olanın size
          düşmesini istiyordunuz. Oysa, suçluların hoşuna gitmese de, hakkı ortaya
          çıkarmak ve batılı tepelemek için, Allah sözleriyle hakkı ortaya koymak ve
          inkarcıların kökünü kesmek istiyordu.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Allah bu iki taifeden birini size vadetmişti; siz, kuvvetsiz olanın size
          düşmesini istiyordunuz. Oysa, suçluların hoşuna gitmese de, hakkı ortaya
          çıkarmak ve batılı tepelemek için, Allah sözleriyle hakkı ortaya koymak ve
          inkarcıların kökünü kesmek istiyordu.
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Rabbinizin yardımına sığınıyordunuz. O, "Ben size, birbiri peşinden bin melekle
          yardım ederim" diye cevap vermişti.
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Allah bunu ancak bir müjde olması ve kalblerinizin yatışması için yapmıştı.
          Yardım ancak Allah katındandır. Doğrusu Allah güçlüdür, hakimdir.
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Allah kendi katından bir güven işareti olarak sizi hafif bir uykuya
          daldırmıştı. Sizi arıtmak, sizden şeytan vesvesesini gidermek, kalblerinizi
          pekiştirmek ve sebatınızı artırmak için gökten size su indirmişti.
        cid: 0
  - verse: 12
    segments:
      - text: >-
          Rabbin meleklere, "Ben sizinleyim, inananları destekleyin" diye vahyetti. "Ben
          inkar edenlerin kalblerine korku salacağım, artık vurun onların boyunları
          üstüne, vurun her parmağına" dedi.
        cid: 0
  - verse: 13
    segments:
      - text: >-
          Bu, onların Allah'a ve Peygamberine karşı koymalarındandır. Kim Allah'a ve
          peygamberine karşı koyarsa, bilsin ki, Allah'ın cezası şiddetlidir.
        cid: 0
  - verse: 14
    segments:
      - text: >-
          İşte bunu tadın, inkar edenlere cehennem azabı da vardır.
        cid: 0
  - verse: 15
    segments:
      - text: >-
          Ey İnananlar! Savaş için ilerlerken, inkar edenlerle toplu halde
          karşılaştığınızda onlara arkanızı dönmeyin.
        cid: 0
  - verse: 16
    segments:
      - text: >-
          Tekrar savaşmak için bir tarafa çekilmek veya bir başka topluluğa katılmak
          maksadı dışında, o gün arkasını düşmana dönen kimse Allah'dan bir gazaba uğramış
          olur. Onun varacağı yer cehennemdir. Ne kötü bir dönüştür!
        cid: 0
  - verse: 17
    segments:
      - text: >-
          Onları siz öldürmediniz fakat Allah öldürdü. Attığın zaman da sen atmamıştın,
          fakat Allah atmıştı. Allah bunu, inananları güzel bir imtihana tabi tutmak için
          yapmıştı. Doğrusu O işitir ve bilir.
        cid: 0
  - verse: 18
    segments:
      - text: >-
          İşte bu, Allah'ın inkarcıların düzenini zayıflatıp yok etmesidir.
        cid: 0
  - verse: 19
    segments:
      - text: >-
          Ey inkarcılar! Zafer istiyorsanız, işte zafer geldi (aleyhinize çıktı).
          Peygambere karşı gelmekten vazgeçerseniz sizin iyiliğinize olur, yok tekrar
          dönerseniz biz de döneriz; topluluğunuz çok da olsa size hiçbir fayda vermez.
          Allah inananlarla beraberdir.
        cid: 0
  - verse: 20
    segments:
      - text: >-
          Ey inananlar! Allah'a ve Peygamberine itaat edin, Kuran'ı dinleyip dururken yüz
          çevirmeyin, dinlemedikleri halde "dinledik" diyenler gibi olmayın.
        cid: 0
  - verse: 21
    segments:
      - text: >-
          Ey inananlar! Allah'a ve Peygamberine itaat edin, Kuran'ı dinleyip dururken yüz
