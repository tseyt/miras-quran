        cid: 0
  - verse: 22
    segments:
      - text: >-
          Allah katında, yeryüzündeki canlıların en kötüsü gerçeği akletmeyen sağırlar ve
          dilsizlerdir.
        cid: 0
  - verse: 23
    segments:
      - text: >-
          Allah onlarda bir iyilik görseydi onlara işittirirdi. Onlara işittirmiş olsaydı
