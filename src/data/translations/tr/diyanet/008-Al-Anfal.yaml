    segments:
      - text: >-
          Esirler sana hıyanet etmek isterlerse, bilsinler ki esasen daha önce de Allah'a
          hıyanet etmişlerdi, Allah bundan ötürü onları yenmen için sana imkan verdi.
          Allah Bilen'dir, Hakim'dir.
        cid: 0
  - verse: 72
    segments:
      - text: >-
          Doğrusu inanıp hicret edenler, Allah yolunda mallarıyla canlarıyla cihat
          edenler ve muhacirleri barındırıp onlara yardım edenler, işte bunlar birbirinin
          dostudurlar. İnanıp hicret etmeyenlerle, hicret edene kadar sizin dostluğunuz
          yoktur. Fakat din uğrunda yardım isterlerse, aranızda anlaşma olmayan
          topluluktan başkasına karşı onlara yardım etmeniz gerekir. Allah işlediklerinizi
          görür.
        cid: 0
  - verse: 73
    segments:
      - text: >-
          İnkar edenler birbirlerinin dostlarıdır. Eğer siz aranızda dost olmazsanız
          yeryüzünde kargaşalık, fitne ve büyük bozgun çıkar.
        cid: 0
  - verse: 74
    segments:
      - text: >-
          İnanıp hicret eden, Allah yolunda savaşanlar ve muhacirleri barındırıp onlara
          yardım edenler, işte onlar gerçekten inanmış olanlardır. Onlara mağfiret ve
          cömertçe verilmiş rızıklar vardır.
        cid: 0
  - verse: 75
    segments:
      - text: >-
          Sonra inanıp hicret eden ve sizinle birlikte savaşanlar, işte onlar sizdendir.
          Birbirinin mirasçısı olan akraba, Allah'ın Kitap'ına göre birbirine daha
          yakındır. Doğrusu Allah her şeyi bilir.
        cid: 0