        cid: 0
  - verse: 29
    segments:
      - text: >-
          Ey inananlar! Allah'tan sakınırsanız, O size iyiyi kötüden ayırdedecek bir
          anlayış verir, kötülüklerinizi örter, sizi bağışlar. Allah büyük, bol nimet
          sahibidir.
        cid: 0
  - verse: 30
    segments:
      - text: >-
          İnkar edenler, seni bağlayıp bir yere kapamak veya öldürmek, ya da sürmek için
