        cid: 0
  - verse: 24
    segments:
      - text: >-
          Ey inananlar! Allah ve Peygamber, sizi, hayat verecek şeye çağırdığı zaman
          icabet edin. Allah'ın kişi ile kalbi arasına girdiğini ve sonunda O'nun katında
          toplanacağınızı bilin.
        cid: 0
  - verse: 25
    segments:
      - text: >-
          Aranızdan yalnız zalimlere erişmekle kalmayacak fitneden sakının, Allah'ın
          azabının şiddetli olduğunu bilin.
        cid: 0
  - verse: 26
    segments:
      - text: >-
          Yeryüzünde az sayıda olduğunuz ve zayıf sayıldığınız için insanların sizi esir
          olarak alıp götürmesinden korktuğunuz zamanları, hatırlayın. Allah, şükredesiniz
          diye sizi barındırmış, yardımıyla desteklemiş, temiz şeylerle rızıklandırmıştır.
        cid: 0
  - verse: 27
    segments:
      - text: >-
          Ey inananlar! Allah'a ve Peygambere karşı hainlik etmeyin, size güvenilen
          şeylere bile bile hıyanet etmiş olursunuz.
        cid: 0
  - verse: 28
    segments:
      - text: >-
          Mallarınızın ve çocuklarınızın, aslında bir sınama olduğunu ve büyük ecrin
