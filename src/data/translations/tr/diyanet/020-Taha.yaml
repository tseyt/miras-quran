        cid: 0
  - verse: 5
    segments:
      - text: >-
          Rahman arşa hükmetmektedir.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Göklerde ve yerde, her ikisi arasında ve toprağın altında bulunanlar O'nundur.
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Sen sözü istersen açığa vur, şüphesiz O gizliyi de, gizlinin gizlisini de
          bilir.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Allah'tan başka tanrı yoktur, en güzel isimler O'nundur.
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Musa'nın başından geçen olay sana geldi mi?
        cid: 0
  - verse: 10
    segments:
      - text: >-
          O, bir ateş görmüştü de, ailesine: "Durun, ben bir ateş gördüm, ya ondan size
          bir kor getirir, ya da ateşin yanında bir yol gösteren bulurum" demişti.
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Musa ateşin yanına gelince: "Ey Musa!" diye seslenildi:
        cid: 0
  - verse: 12
    segments:
      - text: >-
          "Ben şüphesiz senin Rabbinim; ayağındakileri çıkar; çünkü sen, kutsal bir vadi
          olan Tuva'dasın."
        cid: 0
  - verse: 13
    segments:
      - text: >-
          "Ben seni seçtim; artık vahyolunanları dinle."
        cid: 0
  - verse: 14
    segments:
      - text: >-
          "Şüphesiz Ben Allah'ım, Benden başka tanrı yoktur; Bana kulluk et; Beni anmak
          için namaz kıl."
        cid: 0
  - verse: 15
    segments:
      - text: >-
          Herkes işlediğinin karşılığını görsün diye, zamanını gizli tuttuğum kıyamet
