surah_id: 20
language: tr
author: diyanet
verses:
  - verse: 1
    segments:
      - text: >-
          Ta, Ha.
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Kuran'ı sana, sıkıntıya düşeşin diye değil, ancak Allah'tan korkanlara bir öğüt
          ve yeri ve yüce gökleri yaratanın katından bir Kitap olarak indirdik.
        cid: 0
