        cid: 0
  - verse: 5
    segments:
      - text: >-
          Bu, babaları uyarılmadığından gafil kalmış bir milleti uyarman için güçlü ve
          merhametli olan Allah'ın indirdiği Kuran'dır.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Bu, babaları uyarılmadığından gafil kalmış bir milleti uyarman için güçlü ve
          merhametli olan Allah'ın indirdiği Kuran'dır.
        cid: 0
  - verse: 7
    segments:
      - text: >-
          And olsun ki, hüküm çoğunun aleyhine gerçekleşmiştir, bunun için artık
          inanmazlar.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Boyunlarına, çenelerine kadar varan demir halkalar geçirmişizdir, bunun için
          başları yukarı kalkıktır.
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Önlerine ve arkalarına sed çekmişizdir. Gözlerini perdelediğimizden artık
          göremezler.
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Onları uyarsan da uyarmasan da birdir, inanmazlar.
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Sen ancak, Kuran'a uyan ve görmediği halde Rahman'dan korkan kimseyi
          uyarabilirsin. Artık o kimseyi, bağışlanma ve cömertçe verilecek bir ecirle
          müjdele.
        cid: 0
  - verse: 12
    segments:
      - text: >-
          Şüphesiz ölüleri dirilten, işlediklerini ve eserlerini yazan Biziz; herşeyi,
          apaçık bir kitabda saymışızdır.
        cid: 0
  - verse: 13
    segments:
      - text: >-
          İnsanlara, halkına elçiler gelen şehri mesel olarak anlat:
        cid: 0
  - verse: 14
    segments:
      - text: >-
          Onlara iki elçi göndermiştik; onu yalanladıkları için üçüncü biriyle
