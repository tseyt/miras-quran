surah_id: 61
language: tr
author: diyanet
verses:
  - verse: 1
    segments:
      - text: "Göklerde olanlar da yerde olanlar da Allah'ı tesbih ederler. O, güçlüdür, Hakim'dir."
        cid: 0
  - verse: 2
    segments:
      - text: "Ey inananlar! Yapmayacağınız şeyi niçin söylersiniz?"
        cid: 0
  - verse: 3
    segments:
      - text: "Yapmayacağınız şeyi söylemeniz, Allah katında büyük gazaba sebep olur."
        cid: 0
  - verse: 4
    segments:
      - text: "Doğrusu Allah, kendi uğrunda, kenetlenmiş bir duvar gibi, saf halinde çarpışanları sever."
        cid: 0
  - verse: 5
    segments:
      - text: "Musa milletine: &quot;Ey milletim! Beni niçin incitirsiniz? Oysa, benim size gönderilmiş Allah'ın bir peygamberi olduğumu biliyorsunuz&quot; demişti. Ama onlar yoldan sapınca, Allah da onların kalblerini saptırmıştı. Allah, yoldan çıkan milleti doğru yola eriştirmez."
        cid: 0
  - verse: 6
    segments:
      - text: "Meryem oğlu İsa: &quot;Ey İsrailoğulları! Doğrusu ben, benden önce gelmiş olan Tevrat'ı doğrulayan, benden sonra gelecek ve adı Ahmet olacak bir peygamberi müjdeleyen, Allah'ın size gönderilmiş bir peygamberiyim&quot; demişti. Ama o elçi, kendilerine belgelerle geldiği zaman: &quot;Bu, apaçık bir sihirdir&quot; demişlerdi."
        cid: 0
  - verse: 7
    segments:
      - text: "Müslüman olmağa çağırılmışken gelmeyip Allah'a karşı yalan uydurandan daha zalim kimdir? Allah, zalim olan milleti doğru yola eriştirmez."
        cid: 0
  - verse: 8
    segments:
      - text: "Ağızlarıyla Allah'ın nurunu söndürmek isterler. İnkarcılar ne kadar istemeseler de, Allah nurunu, dinini tamamlayacaktır."
        cid: 0
  - verse: 9
    segments:
      - text: "Ortak koşanlar istemese de, dinini bütün dinlerden üstün kılmak için, Peygamberini, doğruluk rehberi Kuran ve gerçek dinle gönderen O'dur."
        cid: 0
  - verse: 10
    segments:
      - text: "Ey inananlar! Sizi can yakıcı bir azabdan kurtaracak, kazançlı bir yolu size göstereyim mi?"
        cid: 0
  - verse: 11
    segments:
      - text: "Allah'a ve Peygamberine inanırsınız; Allah yolunda canlarınızla, mallarınızla cihat edersiniz; bilseniz, bu sizin için en iyi yoldur."
        cid: 0
  - verse: 12
    segments:
      - text: "Böyle yaparsanız, Allah günahlarınızı size bağışlar, sizi, içlerinden ırmaklar akan cennetlere, Adn cennetlerinde hoş yerlere koyar. Büyük kurtuluş budur."
        cid: 0
  - verse: 13
    segments:
      - text: "Bundan başka, sevdiğiniz bir şey daha: Allah katından bir yardım ve yakın bir zafer vardır. İnananlara müjde ver."
        cid: 0
  - verse: 14
    segments:
      - text: "Ey inananlar! Allah'ın dininin yardımcıları olun. Nitekim, Meryem oğlu İsa, Havarilere: &quot;Allah'a giden yolda yardımcılarım kimlerdir?&quot; deyince, Havariler: &quot;Allah'ın dininin yardımcıları biziz&quot; demişlerdi. İsrailoğullarının bir takımı böylece inanmış, bir takımı da inkar etmişti; ama Biz, inananları düşmanlarına karşı destekledik de üstün geldiler."
        cid: 0