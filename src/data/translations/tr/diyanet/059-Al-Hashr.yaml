surah_id: 59
language: tr
author: diyanet
verses:
  - verse: 1
    segments:
      - text: >-
          Göklerde olanlar da yerde olanlar da Allah'ı tesbih ederler. O güçlüdür,
          Hakim'dir.
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Kitap ehlinden inkarcı olanları ilk sürgünde yurtlarından çıkaran O'dur. Oysa
          ey inananlar! Çıkacaklarını sanmamıştınız, onlar da, kalelerinin kendilerini
          Allah'tan koruyacağını sanmışlardı. Ama Allah'ın azabı onlara beklemedikleri
          yerden geldi, kalblerine korku saldı; evlerini kendi elleriyle ve inananların
          elleriyle yıkıyorlardı. Ey akıl sahipleri! Ders alın.
        cid: 0
  - verse: 3
    segments:
      - text: >-
          Allah onlara sürülmeyi yazmamış olsaydı, dünyada başka şekilde azap verecekti.
          Ahirette onlara ateş azabı vardır.
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Bu, Allah'a ve Peygamberine karşı gelmelerinden ötürüdür. Kim Allah'a karşı
          gelirse bilsin ki Allah'ın cezalandırması şüphesiz çetindir.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          İnkarcı kitap ehlinin yurtlarında hurma ağaçlarını kesmeniz veya onları
          kesmeyip gövdeleri üzerinde ayakta bırakmanız Allah'ın izniyledir. Allah yoldan
          çıkanları böylece rezilliğe uğratır.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Ey inananlar! Onların mallarından, Allah'ın Peygamberine verdiği şeyler için
          siz ne at ve ne de deve sürdünüz; fakat Allah peygamberlerine, dilediği
          kimselere karşı üstünlük verir. Allah herşeye Kadir'dir.
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Allah'ın, fethedilen memleketler halkının mallarından Peygamberine verdikleri;
          Allah, Peygamber, yakınlar, yetimler, yoksullar ve yolda kalmışlar içindir; ta
          ki içinizdeki zenginler arasında elden ele dolaşan bir devlet olmasın. Peygamber
          size ne verirse onu alın, sizi neden menederse ondan geri durun; Allah'tan
          sakının, doğrusu Allah'ın cezalandırması çetindir.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Allah'ın verdiği bu ganimet malları bilhassa; yurtlarından ve mallarından
          edilmiş olan, Allah'tan bir lütuf ve rıza dileyen, Allah'ın dinine ve
          Peygamberine yardım eden muhacir fakirlerindir. İşte doğru olanlar bunlardır.
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Daha önceden Medine'yi yurt edinmiş ve gönüllerine imanı yerleştirmiş olan
          kimseler, kendilerine hicret edip gelenleri severler; onlara verilenler
          karşısında içlerinde bir çekememezlik hissetmezler; kendileri zaruret içinde
          bulunsalar bile onları kendilerinden önde tutarlar. Nefsinin tamahkarlığından
          korunabilmiş kimseler, işte onlar saadete erenlerdir.
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Onlardan sonra gelenler: "Rabbimiz! Bizi ve bizden önce inanmış olan
          kardeşlerimizi bağışla; kalbimizde müminlere karşı kin bırakma; Rabbimiz!
          Şüphesiz Sen şefkatlisin, merhametlisin" derler.
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Münafıkların, kitap ehlinin inkarcılarından olan kardeşlerine: "Eğer siz
          yurdunuzdan çıkarılırsanız and olsun ki, biz de sizinle beraber çıkarız; sizin
          aleyhinizde kimseye asla uymayız; eğer savaşa tutuşursanız mutlaka size yardım
          ederiz" dediklerini görmedin mi? Allah onların yalancı olduklarına şahidlik
          eder.
        cid: 0
  - verse: 12
    segments:
      - text: >-
          Onlar çıkarılmış olsalar, and olsun ki, onlarla beraber çıkmazlar; savaşa
          tutuşmuş olsalar, and olsun ki, onlara yardıma koşmazlar; onlara yardıma
          gitseler, mutlaka geri dönüp kaçarlar, sonra yardım da görmezler.
        cid: 0
  - verse: 13
    segments:
      - text: >-
          Ey inananlar! Onların yüreklerine korku salan, Allah'tan çok sizlersiniz; çünkü
          onlar, anlamayan kimselerdir.
        cid: 0
  - verse: 14
    segments:
      - text: >-
          Onlar sizinle toplu olarak, ancak surla çevrilmiş kasabalar içinde veya
          duvarlar arkasından savaşı kabul edebilirler. Kendi aralarındaki çekişmeleri ise
          serttir; onları birlik sanırsın, oysa kalbleri birbirinden ayrıdır. Bu,
          akletmeyen bir topluluk olmalarındandır.
        cid: 0
  - verse: 15
    segments:
      - text: >-
          Onların durumu, kendilerinden az zaman önce geçmiş ve işlerinin karşılığını
          tatmış olanların durumu gibidir. Onlara can yakıcı azap vardır.
        cid: 0
  - verse: 16
    segments:
      - text: >-
          İkiyüzlülerin durumu insana: "İnkar et!" deyip, insan da inkar edince: "Doğrusu
          ben senden uzağım; Alemlerin Rabbi olan Allah'tan korkarım" diyen şeytanın
          durumu gibidir.
        cid: 0
  - verse: 17
    segments:
      - text: >-
          İkisinin sonucu da, içinde temelli kalacakları ateş olacaktır. Zalimlerin
          cezası budur.
        cid: 0
  - verse: 18
    segments:
      - text: >-
          Ey inananlar! Allah'tan sakının; herkes yarına ne hazırladığına baksın;
          Allah'tan sakının, çünkü Allah işlediklerinizden haberdardır.
        cid: 0
  - verse: 19
    segments:
      - text: >-
          Allah'ı unutup da, Allah'ın da kendilerini kendilerine unutturduğu kimseler
          gibi olmayın; onlar, yoldan çıkmış kimselerdir.
        cid: 0
  - verse: 20
    segments:
      - text: >-
          Cehennemliklerle cennetlikler bir değildir. Kurtuluşa ermiş kimseler
          cennetliklerdir.
        cid: 0
  - verse: 21
    segments:
      - text: >-
          Eğer Biz Kuran'ı bir dağa indirmiş olsaydık, sen, onun, Allah korkusuyla
          başeğerek parça parça olduğunu görürdün. Bu misalleri, insanlar düşünsünler diye
          veriyoruz.
        cid: 0
  - verse: 22
    segments:
      - text: >-
          O, görüleni de görülmeyeni de bilen, kendisinden başka tanrı olmayan Allah'tır.
          O, acıyıcı olandır, acıyandır.
        cid: 0
  - verse: 23
    segments:
      - text: >-
          O, kendisinden başka tanrı olmayan, hükümran, çok kutsal; esenlik veren,
          güvenlik veren, görüp gözeten, güçlü, buyruğunu herşeye geçiren, ulu olan,
          Allah'tır. Allah onların koştukları eşlerden (ortaklardan) münezzehtir.
        cid: 0
  - verse: 24
    segments:
      - text: >-
          O, vareden, güzel yaratan, yarattıklarına şekil veren, en güzel adlar
          kendisinin olan Allah'tır. Göklerde ve yerde olanlar O'nu tesbih ederler. O
          güçlüdür, Hakim'dir.
        cid: 0