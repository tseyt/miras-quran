surah_id: 113
language: tr
author: diyanet
verses:
  - verse: 1
    segments:
      - text: >-
          De ki: "Yaratıkların şerrinden, bastırdığı zaman karanlığın şerrinden,
          düğümlere nefes eden büyücülerin şerrinden, hased ettiği zaman hasedcilerin
          şerrinden, tan yerini ağartan Rabbe sığınırım."
        cid: 0
