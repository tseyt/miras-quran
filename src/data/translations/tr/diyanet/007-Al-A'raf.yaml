surah_id: 7
language: tr
author: diyanet
verses:
  - verse: 1
    segments:
      - text: >-
          Elif, Lam, Mim, Sad.
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Sana bir Kitap indirildi. Onunla insanları uyarman ve inananlara öğüt vermen
          için kalbine bir darlık gelmesin.
        cid: 0
  - verse: 3
    segments:
      - text: >-
          Rabbinizden size indirilen Kitap'a uyun, O'ndan başka dostlar edinerek onlara
          uymayın. Pek az öğüt dinliyorsunuz.
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Biz nice kentleri yok etmişizdir; geceleyin veya gündüz uykularında iken
          baskınımıza uğramışlardır.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Baskınımıza uğradıklarında, sözleri, "Gerçekten biz haksızdık" demekten ibaret
          kalmıştır.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          And olsun ki, kendilerine peygamber gönderilenlere soracağız, peygamberlere de
          soracağız.
        cid: 0
  - verse: 7
    segments:
      - text: >-
          And olsun ki, yaptıklarını kendilerine bir bir anlatacağız, zira onlardan uzak
          değildik.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Gerçek tartı kıyamet günündedir. Tartıları ağır gelenler, işte onlar
          kurtulanlardır.
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Tartıları hafif gelenler, ayetlerimize yaptıkları haksızlıklardan ötürü
          kendilerini mahvetmiş olanlardır.
        cid: 0
  - verse: 10
    segments:
      - text: >-
