surah_id: 34
language: tr
author: diyanet
verses:
  - verse: 1
    segments:
      - text: >-
          Hamd, göklerde olanlar ve yerde bulunanlar Kendisinin olan Allah'a mahsustur.
          O, Hakim'dir, her şeyden haberdardır.
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Yere gireni ve oradan çıkanı, gökten ineni ve oraya yükseleni bilir. O,
          merhametlidir, mağfiret sahibidir.
        cid: 0
  - verse: 3
    segments:
      - text: >-
          İnkar edenler: "Kıyamet bize gelmeyecektir" dediler. De ki: "Hayır, öyle değil;
          görülmeyeni bilen Rabbim'e and olsun ki, o saat size muhakkak gelecektir.
          Göklerde ve yerde zerre kadar olanlar bile O'nun ilminin dışında değildir.
          Bundan daha küçüğü ve daha büyüğü de şüphesiz apaçık Kitap'tadır."
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Allah'ın, inanıp yararlı iş işleyenlere ki onlar için mağfiret ve cömertçe
          verilmiş rızık vardır ve ayetlerimizi hükümsüz bırakmak için yarışanlara ki
          onlara iğrenç ve can yakıcı azap vardır işlerinin karşılıklarını vermesi için
          kıyamet saati gelecektir.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Allah'ın, inanıp yararlı iş işleyenlere ki onlar için mağfiret ve cömertçe
          verilmiş rızık vardır ve ayetlerimizi hükümsüz bırakmak için yarışanlara ki
          onlara iğrenç ve can yakıcı azap vardır işlerinin karşılıklarını vermesi için
          kıyamet saati gelecektir.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Kendilerine ilim verilenler, sana Rabbinden indirilenin hak olduğunu, güçlü ve
          hamde layık olanın yolunu gösterdiğini bilirler.
        cid: 0
  - verse: 7
    segments:
      - text: >-
          İnkar edenler, insanlara: "Size, siz parça parça dağılıp yok olduğunuz zaman
          yeniden dirileceğinizi haber veren bir adam gösterelim mi? Allah'a karşı yalan
          mı uyduruyor, yoksa kendisinde delilik mi vardır?" derler. Hayır; ahirete
          inanmayanlar, azapta ve derin bir sapıklık içindedirler.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          İnkar edenler, insanlara: "Size, siz parça parça dağılıp yok olduğunuz zaman
          yeniden dirileceğinizi haber veren bir adam gösterelim mi? Allah'a karşı yalan
          mı uyduruyor, yoksa kendisinde delilik mi vardır?" derler. Hayır; ahirete
          inanmayanlar, azapta ve derin bir sapıklık içindedirler.
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Önlerinde ve ardlarında olan göğü ve yeri görmezler mi? Dilesek onları yere
          geçirir veya göğün bir parçasını başlarına indiririz. Bunlarda, Allah'a yönelen
          her kul için dersler vardır.
        cid: 0
  - verse: 10
    segments:
      - text: >-
          "Ey dağlar ve kuşlar! Davud tesbih ettikçe siz de onu tekrarlayın" diyerek and
          olsun ki, ona katımızdan lütufta bulunduk; "geniş zırhlar yap, dokumasını sağlam
          tut" diye ona demiri yumuşak kıldık. Yararlı iş işleyin; doğrusu Ben
          yaptıklarınızı görenim.
        cid: 0
  - verse: 11
    segments:
      - text: >-
          "Ey dağlar ve kuşlar! Davud tesbih ettikçe siz de onu tekrarlayın" diyerek and
          olsun ki, ona katımızdan lütufta bulunduk; "geniş zırhlar yap, dokumasını sağlam
          tut" diye ona demiri yumuşak kıldık. Yararlı iş işleyin; doğrusu Ben
          yaptıklarınızı görenim.
        cid: 0
  - verse: 12
    segments:
      - text: >-
          Gündüz estiğinde bir aylık mesafeye gidip, akşam da bir aylık mesafeden gelen
          rüzgarı Süleyman'ın buyruğu altına verdik. Onun için su gibi erimiş bakır
          akıttık. Rabbinin izniyle, yanında iş gören cinleri onun buyruğu altına verdik
          ki, bunlar içinde buyruğumuzdan çıkan olursa ona alevli ateşin azabını
          tattırırdık.
        cid: 0
  - verse: 13
    segments:
      - text: >-
          Süleyman için, o ne dilerse, mabedler, heykeller, büyük havuzlara benzer
          çanaklar ve taşınması güç kazanlar yaparlardı. "Ey Davud ailesi, şükredin!
          Kullarımdan şükredenler pek azdır."
        cid: 0
  - verse: 14
    segments:
      - text: >-
          Süleyman'ın ölümüne hükmettiğimiz zaman, ancak değneğini yiyen kurt onun
          ölümünü cinlere farkettirdi. O, ölü olarak yere düşünce, ortaya çıktı ki, şayet
          cinler görülmeyeni bilmiş olsalardı alçak düşüren bir azap içinde kalmazlardı.
        cid: 0
  - verse: 15
    segments:
      - text: >-
          Sebelilerin yurtlarında Allah'ın kudretine bir işaret vardır: Sağlı sollu iki
          bahçe vardı. Onlara: "Rabbinizin verdiği rızıktan yiyin ve O'na şükredin. İşte
          hoş bir şehir ve bağışlayan bir Rab" denmişti.
        cid: 0
  - verse: 16
    segments:
      - text: >-
          Fakat onlar yüz çevirdiler; bunun için Biz de üzerlerine Arim selini gönderdik,
          onların bahçelerini, buruk yemişli, ılgınlık ve içinde biraz da sedir ağacı
          bulunan iki bahçeye çevirdik.
        cid: 0
  - verse: 17
    segments:
      - text: >-
          İşte böylece, inkarlarından ötürü onları cezalandırdık. Biz nankörden başkasına
          ceza mı veririz?
        cid: 0
  - verse: 18
    segments:
      - text: >-
          Onlarla, kutlu kıldığımız şehirler arasında, karşıdan karşıya görünen kasabalar
          var etmiş, oraları gezilecek belirli konak yerleri yapmıştık, "Oralarda geceleri
          ve gündüzleri güven içinde gezin" demiştik.
        cid: 0
  - verse: 19
    segments:
      - text: >-
          Ama onlar: "Rabbimiz! Yolculuklarımızın mesafesini uzak kıl" deyip kendilerine
          yazık ettiler. Biz de onları efsane yapıverdik, darmadağın ettik. Doğrusu
          bunlarda, pek sabreden ve çok şükreden kimseler için dersler vardır.
        cid: 0
  - verse: 20
    segments:
      - text: >-
          And olsun ki İblis, onlar hakkındaki görüşünü doğru çıkartmış; inananlardan bir
          topluluk dışında hepsi ona uymuşlardı.
        cid: 0
  - verse: 21
    segments:
      - text: >-
          Oysa İblis'in onlar üzerinde bir nüfuzu yoktu; ama Biz ahirete inanan
          kimselerle ondan şüphede olanları, işte böylece ortaya koyarız. Rabbin her şeyi
          gözetip koruyandır.
        cid: 0
  - verse: 22
    segments:
      - text: >-
          De ki: "Allah'ı bırakıp de göklerde ve yerde zerre kadar bir şeye sahip
          olmadığı, her ikisinde de bir ortaklığı bulunmadığı ve hiçbiri Allah'a yardımcı
          olmadığı halde tanrı olduklarını ileri sürdüklerinizi yardıma çağırsanıza!"
        cid: 0
  - verse: 23
    segments:
      - text: >-
          Allah'ın katında, kendisine izin verilenden başka kimse şefaat edemez. Sonunda,
          gönüllerindeki korku giderilince birbirlerine "Rabbiniz ne söyledi?" diye
          sorarlar; "Hak söyledi" derler. O, yücedir, büyüktür.
        cid: 0
  - verse: 24
    segments:
      - text: >-
          De ki: "Göklerden ve yerden sizi rızıklandıran kimdir?" De ki: "Allah'tır.
          Öyleyse doğru yolda veya apaçık bir sapıklıkta olan ya biziz ya sizsiniz."
        cid: 0
  - verse: 25
    segments:
      - text: >-
          De ki: "İşlediğimiz suçlardan siz sorumlu olmazsınız, sizin yaptıklarınızdan da
          biz sorumlu olmayız"
        cid: 0
  - verse: 26
    segments:
      - text: >-
          De ki: "Rabbimiz sonunda hepimizi toplar, sonra aramızda adaletle hükmeder.
          Adaletle hükmeden, bilen ancak O'dur."
        cid: 0
  - verse: 27
    segments:
      - text: >-
          De ki: "O'na taktığınız ortakları bana gösterin, yoktur ki! O, güçlü olan,
          hakim olan Allah'tır."
        cid: 0
  - verse: 28
    segments:
      - text: >-
          Biz seni bütün insanlara ancak müjdeci ve uyarıcı olarak göndermişizdir; fakat
          insanların çoğu bilmez.
        cid: 0
  - verse: 29
    segments:
      - text: >-
          "Doğru sözlü iseniz söyleyin bu vaad ne zamandır?" derler.
        cid: 0
  - verse: 30
    segments:
      - text: >-
          De ki: "Size, bir gün tayin edilmiştir. Ondan bir saat ne geri kalabilirsiniz
          ne de öne geçebilirsiniz."
        cid: 0
  - verse: 31
    segments:
      - text: >-
          İnkar edenler: "Bu Kuran'a ve ondan öncekilere inanmayacağız" dediler. Sen bu
          zalimleri, Rablerinin huzurunda dikilmiş oldukları zaman, suçu birbirine atıp
          dururken bir görsen! Güçsüz sayılanlar, büyüklük taslayanlara: "Siz olmasaydınız
          biz inanmış olacaktık" derler.
        cid: 0
  - verse: 32
    segments:
      - text: >-
          Büyüklük taslayanlar, Güçsüz sayılanlara: "Size doğruluk rehberi geldikten
          sonra ondan sizi biz mi alıkoyduk? Hayır; zaten suçlu kimselerdiniz" derler.
        cid: 0
  - verse: 33
    segments:
      - text: >-
          Güçsüz sayılanlar da büyüklük taslayanlara: "Hayır gece gündüz hile kuruyor ve
          bize Allah'ı inkar etmemizi, O'na ortaklar koşmamızı emrediyordunuz" derler.
          Azabı gördüklerinde, ettiklerine içleri yanar. İnkar edenlerin boyunlarına demir
          halkalar vururuz. Yaptıklarından başka bir şeyin mi cezasını çekerler?
        cid: 0
  - verse: 34
    segments:
      - text: >-
          Doğrusu uyarıcı göndermiş olduğumuz her kentin varlıklı kimseleri, "Biz sizinle
