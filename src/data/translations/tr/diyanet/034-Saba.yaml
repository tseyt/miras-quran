        cid: 0
  - verse: 9
    segments:
      - text: "Önlerinde ve ardlarında olan göğü ve yeri görmezler mi? Dilesek onları yere geçirir veya göğün bir parçasını başlarına indiririz. Bunlarda, Allah'a yönelen her kul için dersler vardır."
        cid: 0
  - verse: 10
    segments:
      - text: "&quot;Ey dağlar ve kuşlar! Davud tesbih ettikçe siz de onu tekrarlayın&quot; diyerek and olsun ki, ona katımızdan lütufta bulunduk; &quot;geniş zırhlar yap, dokumasını sağlam tut&quot; diye ona demiri yumuşak kıldık. Yararlı iş işleyin; doğrusu Ben yaptıklarınızı görenim."
        cid: 0
  - verse: 11
    segments:
