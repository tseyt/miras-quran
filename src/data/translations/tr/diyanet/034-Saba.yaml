surah_id: 34
language: tr
author: diyanet
verses:
  - verse: 1
    segments:
      - text: "Hamd, göklerde olanlar ve yerde bulunanlar Kendisinin olan Allah'a mahsustur. O, Hakim'dir, her şeyden haberdardır."
        cid: 0
  - verse: 2
    segments:
      - text: "Yere gireni ve oradan çıkanı, gökten ineni ve oraya yükseleni bilir. O, merhametlidir, mağfiret sahibidir."
        cid: 0
  - verse: 3
    segments:
      - text: "İnkar edenler: &quot;Kıyamet bize gelmeyecektir&quot; dediler. De ki: &quot;Hayır, öyle değil; görülmeyeni bilen Rabbim'e and olsun ki, o saat size muhakkak gelecektir. Göklerde ve yerde zerre kadar olanlar bile O'nun ilminin dışında değildir. Bundan daha küçüğü ve daha büyüğü de şüphesiz apaçık Kitap'tadır.&quot;"
        cid: 0
  - verse: 4
    segments:
      - text: "Allah'ın, inanıp yararlı iş işleyenlere ki onlar için mağfiret ve cömertçe verilmiş rızık vardır ve ayetlerimizi hükümsüz bırakmak için yarışanlara ki onlara iğrenç ve can yakıcı azap vardır işlerinin karşılıklarını vermesi için kıyamet saati gelecektir."
        cid: 0
  - verse: 5
    segments:
