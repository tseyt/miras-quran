          destekleyen bir yardımcı olarak benimle gönder, çünkü beni yalanlamalarından
          korkarım" dedi.
        cid: 0
  - verse: 34
    segments:
      - text: >-
          Musa: "Rabbim! Doğrusu ben onlardan bir cana kıydım. Beni öldürmelerinden
