surah_id: 28
language: tr
author: diyanet
verses:
  - verse: 1
    segments:
      - text: >-
          Ta, Sin, Mim.
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Bunlar apaçık Kitap'ın ayetleridir.
        cid: 0
  - verse: 3
    segments:
      - text: >-
          İnanan bir millet için, sana Musa ve Firavun olayını olduğu gibi anlatacağız.
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Firavun memleketin başına geçti ve halkını fırkalara ayırdı. İçlerinden bir
          topluluğu güçsüz bularak onların oğullarını boğazlıyor, kadınları sağ
          bırakıyordu; çünkü o, bozguncunun biriydi.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Biz, memlekette güçsüz sayılanlara iyilikte bulunmak, onları önderler kılmak,
          onları varis yapmak, memlekete yerleştirmek; Firavun, Haman ve her ikisinin
          askerlerine, çekinmekte oldukları şeyleri göstermek istiyorduk.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Biz, memlekette güçsüz sayılanlara iyilikte bulunmak, onları önderler kılmak,
          onları varis yapmak, memlekete yerleştirmek; Firavun, Haman ve her ikisinin
          askerlerine, çekinmekte oldukları şeyleri göstermek istiyorduk.
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Musa'nın annesine: "Çocuğu emzir, başına gelecekten korktuğun zaman onu suya
          bırak; korkma, üzülme; Biz şüphesiz onu sana döndüreceğiz ve peygamber
          yapacağız" diye bildirmiştik.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Firavun'un adamları onu almışlardı. Firavun, Haman ve askerleri, suçlu
          olduklarından, o onlara düşman ve başlarına da dert olacaktı.
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Firavun'un karısı: "Benim de senin de gözün aydın olsun! Onu öldürmeyiniz,
          belki bize faydalı olur yahut onu oğul ediniriz" dedi. Aslında işin farkında
          değillerdi.
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Musa'nın annesi, gönlü bomboş sabahı etti, oğlundan başka bir şey
          düşünemiyordu. Allah'ın vaadine iyice inanması için kalbini pekiştirmeseydik,
          neredeyse saraya alınan çocuğun kendi oğlu olduğunu açığa vuracaktı.
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Musa'nın ablasına: "Onu izle" dedi. O da, kimse farkına varmadan, Musa'yı
          uzaktan gözetledi.
        cid: 0
  - verse: 12
    segments:
      - text: >-
          Önceden, süt annelerin memesini kabul etmemesini sağladık. Musa'nın ablası:
          "Size, sizin adınıza ona bakacak, iyi davranacak bir ev halkını tavsiye edeyim
          mi?" dedi.
        cid: 0
  - verse: 13
    segments:
      - text: >-
          Böylece onu, annesinin gözü aydın olsun, üzülmesin, Allah'ın verdiği sözün
          gerçek olduğunu bilsin diye, ona geri çevirdik. Fakat çoğu bilmezler.
        cid: 0
  - verse: 14
    segments:
      - text: >-
          Musa erginlik çağına gelip olgunlaşınca, ona hikmet ve ilim verdik. İyi
          davrananları böyle mükafatlandırırız.
        cid: 0
  - verse: 15
    segments:
      - text: >-
          Musa, halkının haberi olmadığı bir zamanda, şehre girdi. Biri kendi
          adamlarından, diğeri de düşmanı olan iki adamı döğüşür buldu. Kendi tarafından
          olan kimse, düşmanına karşı ondan yardım istedi. Musa, onun düşmanına bir yumruk
          vurdu; ölümüne sebep oldu. "Bu şeytanin işidir; çünkü o apaçık, saptıran bir
          düşmandır" dedi.
        cid: 0
  - verse: 16
    segments:
      - text: >-
          Musa: "Rabbim! Doğrusu kendime yazık ettim, beni bağışla" dedi. Allah da onu
          bağışladı. O, şüphesiz bağışlayandır, merhamet edendir.
        cid: 0
  - verse: 17
    segments:
      - text: >-
          Musa: "Rabbim! Bana verdiğin nimete and olsun ki, suçlulara asla yardımcı
          olmayacağım" dedi.
        cid: 0
  - verse: 18
    segments:
      - text: >-
          Şehirde, korku içinde etrafı gözetip dolaşarak sabahladı. Dün kendisinden
          yardım isteyen kimse bağırarak ondan yine yardım istiyordu. Musa ona: "Doğrusu
          sen besbelli bir azgınsın" dedi.
        cid: 0
  - verse: 19
    segments:
      - text: >-
          Musa, ikisinin de düşmanı olan kimseyi yakalamak isteyince: "Ey Musa! Dün bir
          cana kıydığın gibi bana da mı kıymak istiyorsun? Sen ıslah edenlerden olmak
          değil, ancak yeryüzünde bir zorba olmak istiyorsun" dedi.
        cid: 0
  - verse: 20
    segments:
      - text: >-
          Şehrin öbür ucundan koşarak bir adam geldi: "Ey Musa! İleri gelenler, seni
          öldürmek için aralarında görüşüyorlar. Hemen uzaklaş. Doğrusu ben sana öğüt
          veriyorum" dedi.
        cid: 0
  - verse: 21
    segments:
      - text: >-
          Musa, korku içinde çevresini gözetleyerek oradan çıktı. "Rabbim! Beni zalim
          milletten kurtar" dedi.
        cid: 0
  - verse: 22
    segments:
      - text: >-
          Medyen'e doğru yöneldiğinde: "Rabbimin bana doğru yolu göstereceğini umarım"
          dedi.
        cid: 0
  - verse: 23
    segments:
      - text: >-
          Medyen suyuna geldiğinde, davarlarını sulayan bir insan topluluğu buldu.
          Onlardan başka, hayvanlarını sudan alıkoyan iki kadın gördü. Onlara: "Derdiniz
          nedir?" dedi. "Çobanlar ayrılana kadar biz sulamayız. Babamız çok yaşlıdır, onun
          için bu işi biz yapıyoruz" dediler.
        cid: 0
  - verse: 24
    segments:
      - text: >-
          Musa onların davarlarını suladı. Sonra gölgeye çekildi: "Rabbim! Doğrusu bana
          indireceğin hayra muhtacım" dedi.
        cid: 0
  - verse: 25
    segments:
      - text: >-
          O sırada, kadınlardan biri utana utana yürüyüp ona geldi: "Babam sana sulama
          ücretini ödemek için seni çağırıyor" dedi. Musa ona gelince, başından geçeni
          anlattı. O: "Korkma, artık zalim milletten kurtuldun" dedi.
        cid: 0
  - verse: 26
    segments:
      - text: >-
          İki kadından biri: "Babacığım! Onu ücretli olarak tut; ücretle tuttuklarının en
          iyisi bu güçlü ve güvenilir adamdır" dedi.
        cid: 0
  - verse: 27
    segments:
      - text: >-
          Kadınların babası: "Bana sekiz yıl çalışmana karşılık bu iki kızımdan birini
          sana nikahlamak istiyorum. Eğer on yıla tamamlarsan o senden bir lütuf olur. Ama
          sana ağırlık vermek istemem. İnşallah beni iyi kimselerden bulacaksın" dedi.
        cid: 0
  - verse: 28
    segments:
      - text: >-
          Musa: "Bu seninle benim aramdadır. Bu iki süreden hangisini doldurursam
          doldurayım bir kötülüğe uğramayacağım. Söylediklerimize Allah vekildir" dedi.
        cid: 0
  - verse: 29
    segments:
      - text: >-
          Musa süreyi doldurunca, ailesiyle birlikte yola çıktı. Tur tarafından bir ateş
