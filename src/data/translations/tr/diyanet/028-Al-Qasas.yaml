          yahut tutuşmuş bir odun getiririm de ısınabilirsiniz" dedi.
        cid: 0
  - verse: 30
    segments:
      - text: >-
          Oraya gelince, kutlu yerdeki vadinin sağ yanındaki ağaç cihetinden: "Ey Musa!
