surah_id: 102
language: tr
author: diyanet
verses:
  - verse: 1
    segments:
      - text: >-
          Çoğunluk olmak iddianız sizi o kadar meşgul etti ki, mezarları ziyaretle
          oradakileri de sayacak kadar oldunuz.
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Çoğunluk olmak iddianız sizi o kadar meşgul etti ki, mezarları ziyaretle
          oradakileri de sayacak kadar oldunuz.
        cid: 0
  - verse: 3
    segments:
      - text: >-
          Hayır; öyle olmayın; yakında bileceksiniz.
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Hayır; gözünüzü açın; yakında bileceksiniz.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Dikkat edin, şayet yaptığınızın sonucunu kesin olarak bir bilseniz!
        cid: 0
  - verse: 6
    segments:
      - text: >-
          And olsun ki, cehennemi göreceksiniz.
        cid: 0
  - verse: 7
    segments:
      - text: >-
          And olsun ki, onu gözünüzle kesin olarak göreceksiniz.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Sonra o gün, size verilmiş olan her nimetten sorguya çekileceksiniz.
        cid: 0