surah_id: 45
language: tr
author: diyanet
verses:
  - verse: 1
    segments:
      - text: >-
          Ha, Mim.
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Kitap'ın indirilmesi, güçlü ve Hakim olan Allah katındandır.
        cid: 0
  - verse: 3
    segments:
      - text: >-
          Göklerde ve yerde inananlara nice dersler vardır.
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Ey insanlar! Sizin yaratılmanızda ve canlıların yeryüzünde yayılmasında, kesin
          olarak inanan kimseler için ibretler vardır.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Gece ile gündüzün birbiri ardından gelmesinde, gökten, Allah'ın rızık vermek
          için yağmur indirip, yeri onunla, ölümünden sonra diriltmesinde, rüzgarları
          yönetmesinde, akleden kimseler için dersler vardır.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          İşte sana gerçek olarak anlattığımız bunlar, Allah'ın varlığının delilleridir.
          Artık Allah'tan ve O'nun delillerinden sonra hangi söze inanırlar?
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Kendine okunan Allah'ın ayetlerini dinleyip, sonra, onları hiç duymamış gibi
          büyüklük taslamakta direnen, yalancı ve günahkar kişinin vay haline! Ona can
          yakıcı bir azap müjdele.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Kendine okunan Allah'ın ayetlerini dinleyip, sonra, onları hiç duymamış gibi
          büyüklük taslamakta direnen, yalancı ve günahkar kişinin vay haline! Ona can
          yakıcı bir azap müjdele.
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Ayetlerimizden bir şey öğrendiğinde onu alaya alır. İşte bunlara alçaltıcı bir
          azap ve ardından da cehennem vardır. Kazandıkları şeyler de, Allah'ı bırakıp
          edindikleri dostlar da onlara bir fayda vermez. Büyük azap onlaradır.
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Ayetlerimizden bir şey öğrendiğinde onu alaya alır. İşte bunlara alçaltıcı bir
          azap ve ardından da cehennem vardır. Kazandıkları şeyler de, Allah'ı bırakıp
          edindikleri dostlar da onlara bir fayda vermez. Büyük azap onlaradır.
        cid: 0
  - verse: 11
    segments:
      - text: >-
          İşte bu Kuran doğruluk rehberidir. Rablerinin ayetlerini inkar edenlere,
          onlara, tiksindiren, can yakan bir azap vardır.
        cid: 0
  - verse: 12
    segments:
      - text: >-
          Emri gereğince denizde yüzmek üzere gemileri, lütfedip verdiği rızkı aramanız
          için denizi buyruğunuz altına veren Allah'tır, belki artık şükredersiniz.
        cid: 0
  - verse: 13
    segments:
      - text: >-
          Göklerde olanları, yerde olanları, hepsini sizin buyruğunuz altına vermiştir.
          Doğrusu bunlarda, düşünen kimseler için dersler vardır.
        cid: 0
  - verse: 14
    segments:
      - text: >-
          İnanmışlara de ki: Allah'ın bir milleti yaptıklarına karşılık cezalandıracağı
          günlerin geleceğini ummayanları şimdilik bağışlasınlar.
        cid: 0
  - verse: 15
    segments:
      - text: >-
          Kim yararlı iş işlerse kendinedir; kim kötülük yaparsa kendi aleyhinedir. Sonra
          Rabbinize döndürülürsünüz.
        cid: 0
  - verse: 16
    segments:
      - text: >-
          And olsun ki Biz, İsrailoğullarına Kitap, hüküm ve peygamberlik verdik; onları
          temiz şeylerle rızıklandırdık; onları dünyalara üstün kıldık.
        cid: 0
  - verse: 17
    segments:
      - text: >-
          Din konusunda, onlara belgeler verdik; ancak, kendilerine ilim geldikten sonra
          birbirini çekememezlikten ayrılığa düştüler. Rabbin kıyamet günü, ayrılığa
          düştükleri şeyler hakkında şüphesiz aralarında hükmedecektir.
        cid: 0
  - verse: 18
    segments:
      - text: >-
          Sonra seni de din konusunda bir şeriat sahibi kıldık, ona uy; bilmeyenlerin
          heveslerine uyma.
        cid: 0
  - verse: 19
    segments:
      - text: >-
          Şüphesiz onlar, seni Allah'tan müstağni kılamazlar. Doğrusu zalimler
          birbirlerinin dostudurlar. Sakınanların dostu ise Allah'tır.
        cid: 0
  - verse: 20
    segments:
      - text: >-
          Bu Kuran, insanlar için açık belgeler; kesin olarak inanan millet için doğruluk
          rehberi ve rahmettir.
        cid: 0
  - verse: 21
    segments:
      - text: >-
          Yoksa, kötülük işleyen kimseler, ölümlerinde ve diriliklerinde kendilerini,
          inanıp yararlı iş işleyen kimseler ile bir mi tutacağımızı sandılar? Ne kötü
          hüküm veriyorlar!
        cid: 0
  - verse: 22
    segments:
      - text: >-
          Allah gökleri ve yeri gerçekle yaratmıştır; her cana, kazandığının karşılığı
          verilir, onlara zulmedilmez.
        cid: 0
  - verse: 23
    segments:
      - text: >-
          Heva ve hevesini tanrı edinen, bilgisi olduğu halde Allah'ın şaşırttığı,
          kulağını ve kalbini mühürlediği, gözünü perdelediği kimseyi gördün mü? Onu
          Allah'tan başka kim doğru yola eriştirebilir? Ey insanlar! Anlamaz mısınız?
        cid: 0
  - verse: 24
    segments:
      - text: >-
          "Hayat, ancak bu dünyadaki hayatımızdır. Ölürüz ve yaşarız; bizi ancak zamanın
          geçişi yokluğa sürükler" derler. Onların bu hususta bir bilgisi yoktur, sadece
          böyle sanırlar.
        cid: 0
  - verse: 25
    segments:
      - text: >-
          Ayetlerimiz onlara açıkça okunduğu zaman, delilleri yalnızca: "Doğru sözlü
          iseniz babalarımızı getirin bakalım" demek olur.
        cid: 0
  - verse: 26
    segments:
      - text: >-
          De ki: "Sizi Allah diriltir, sonra öldürür, sonra sizi şüphe götürmeyen kıyamet
          gününde toplar. Ama insanların çoğu bilmezler."
        cid: 0
  - verse: 27
    segments:
      - text: >-
          Göklerin ve yerin hükümranlığı Allah'ındır. Kıyamet kopacağı gün, işte o gün,
          batıl sözlere uymuş olanlar hüsranda kalırlar.
        cid: 0
  - verse: 28
    segments:
      - text: >-
          Her ümmeti diz üstü çökmüş olarak görürsün. Her ümmet kitabına çağrılır. Onlara
          denir ki: "Bugün, size işlediğinizin karşılığı verilecektir."
        cid: 0
  - verse: 29
    segments:
      - text: >-
          "Bu kitabımız gerçekten sizin aleyhinize konuşur. Biz yaptıklarınızı şüphesiz
          bir bir kaydediyorduk."
        cid: 0
  - verse: 30
    segments:
      - text: >-
          İnanıp, yararlı iş işleyenlere gelince, Rableri onları rahmetine garkeder. İşte
          bu, apaçık kurtuluştur.
        cid: 0
  - verse: 31
    segments:
      - text: >-
          Ama, inkar eden kimselere denir ki: "Ayetlerim size okunmuş, siz de büyüklenip
          suçlu bir millet olmuştunuz değil mi?"
        cid: 0
  - verse: 32
    segments:
      - text: >-
          "Doğrusu Allah'ın verdiği söz gerçektir, kıyamet saati şüphe götürmez" dendiği
          zaman: "Kıyametin ne olduğunu bilmiyoruz, yalnız yoktur sanıyoruz, buna dair
          kesin bir bilgi elde etmiş değiliz" derdiniz.
        cid: 0
  - verse: 33
    segments:
      - text: >-
          İşledikleri kötülükler kendilerine belli oldu ve onları, alaya aldıkları şeyler
          kuşatıp mahvetti.
        cid: 0
  - verse: 34
    segments:
      - text: >-
          Onlara denir ki: "Bugüne kavuşacağınızı unuttuğunuz gibi Biz de sizi unuttuk;
          varacağınız yer ateştir, yardımcılarınız da yoktur."
        cid: 0
  - verse: 35
    segments:
      - text: >-
          "Bu, Allah'ın ayetlerini alaya almanızdan ve dünya hayatının sizi aldatmış
          olmasından ötürüdür." O gün, ne oradan çıkarılırlar ve ne de özürleri dinlenir.
        cid: 0
  - verse: 36
    segments:
      - text: >-
          Övülmek, göklerin Rabbi, yerin Rabbi ve alemlerin Rabbi olan Allah içindir.
        cid: 0
  - verse: 37
    segments:
      - text: >-
          Göklerde ve yerde azamet O'nundur, O, güçlüdür, Hakim'dir.
        cid: 0