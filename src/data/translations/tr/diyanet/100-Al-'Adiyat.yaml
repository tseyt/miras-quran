surah_id: 100
language: tr
author: diyanet
verses:
  - verse: 1
    segments:
      - text: "And olsun Allah yolunda koştukça koşanlara;"
        cid: 0
  - verse: 2
    segments:
      - text: "And olsun kıvılcımlar saçanlara;"
        cid: 0
  - verse: 3
    segments:
      - text: "Sabah sabah akına çıkanlara;"
        cid: 0
  - verse: 4
    segments:
      - text: "Ve tozu dumana katanlara;"
        cid: 0
  - verse: 5
    segments:
      - text: "Düşman topluluğunun içine dalanlara ki:"
        cid: 0
  - verse: 6
    segments:
      - text: "İnsan gerçekten Rabbine karşı pek nankördür."
        cid: 0
  - verse: 7
    segments:
      - text: "Doğrusu kendisi de bunların hepsine şahittir."
        cid: 0
  - verse: 8
    segments:
      - text: "Gerçekten mala da pek düşkündür."
        cid: 0
  - verse: 9
    segments:
      - text: "İnsan, kabirlerde bulunanların çıkarılacağı ve kalblerde olanların ortaya konulacağı bir zamanın geleceğini bilmez mi?"
        cid: 0
  - verse: 10
    segments:
      - text: "İnsan, kabirlerde bulunanların çıkarılacağı ve kalblerde olanların ortaya konulacağı bir zamanın geleceğini bilmez mi?"
        cid: 0
  - verse: 11
    segments:
      - text: "Doğrusu Rableri o gün onların her şeyinden haberdardır."
        cid: 0