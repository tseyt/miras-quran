language: tr
author: diyanet
verses:
  - verse: 1
    segments:
      - text: >-
          Ta, Sin, Mim.
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Bunlar apaçık Kitap'ın ayetleridir.
        cid: 0
  - verse: 3
    segments:
      - text: >-
          İnanmıyorlar diye nerdeyse kendini mahvedeceksin.
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Biz dilesek onlara gökten bir mucize indiririz de ona boyun eğip kalırlar.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Rahman'dan kendilerine gelen her yeni öğütten mutlaka yüz çevirirler.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Evet, yalanladılar; alay edip durdukları şeylerin haberleri kendilerine
          ulaşacaktır.
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Yeryüzüne bakmazlar mı? Orada, bitkilerden nice güzel çiftler yetiştirmişizdir.
        cid: 0
