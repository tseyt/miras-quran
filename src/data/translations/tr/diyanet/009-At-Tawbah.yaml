surah_id: 9
language: tr
author: diyanet
verses:
  - verse: 1
    segments:
      - text: >-
          Allah'tan ve Peygamberinden, kendileriyle andlaşma yaptığınız müşriklere
          ihtardır: Yeryüzünde dört ay daha dolaşabilirsiniz. Allah'ı aciz
          bırakamayacağınızı, Allah'ın inkarcıları rezil edeceğini bilin.
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Allah'tan ve Peygamberinden, kendileriyle andlaşma yaptığınız müşriklere
          ihtardır: Yeryüzünde dört ay daha dolaşabilirsiniz. Allah'ı aciz
          bırakamayacağınızı, Allah'ın inkarcıları rezil edeceğini bilin.
        cid: 0
  - verse: 3
    segments:
      - text: >-
          Allah'ın ve Peygamberinin, ortak koşanlardan uzak olduğunu, büyük hac günü,
          Allah ve peygamberi insanlara ilan eder. Eğer tevbe ederseniz, bu sizin için
          daha hayırlı olur, yüz çevirirseniz, bilin ki siz Allah'ı aciz bırakamazsınız.
          İnkar edenlere can yakıcı azabı müjdele.
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Yalnız, andlaşma hükümlerinde size karşı bir eksiklik yapmayan ve aleyhinizde
          kimseye yardım etmeyen müşriklerle yaptığınız andlaşmaya sonuna kadar riayet
          edin. Allah sakınanları sever.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Hürmetli aylar çıkınca, puta tapanları bulduğunuz yerde öldürün; onları
          yakalayıp hapsedin; her gözetleme yerinde onları bekleyin. Eğer tevbe eder,
          namaz kılar ve zekat verirlerse yollarını serbest bırakın. Doğrusu Allah
          bağışlar ve merhamet eder.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Puta tapanlardan biri sana sığınırsa, onu güvene al; ta ki Allah'ın sözünü
          dinlesin. Sonra onu güven içinde olacağı yere ulaştır. Çünkü onlar bilgisiz bir
          topluluktur.
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Mescidi Haram'ın yanında andlaştıklarınızın dışında, puta tapanların Allah
          katında ve Peygamberi önünde nasıl bir andlaşmaları olabilir. Size doğru
          davrandıkça siz de onlara doğru davranın. Allah, sözleşmelerini bozmaktan
          sakınanları sever.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Nasıl olabilir ki, size üstün gelselerdi ne bir yakınlık, ne de bir ahd
          gözetirlerdi. Kalpleriyle istemezlerken sizi ağızlarıyla hoşnut etmeye
          uğraşırlar; çokları fasıktırlar.
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Allah'ın ayetlerini az bir değere değişip, O'nun yolundan alıkoydular. Onların
          işledikleri gerçekten ne kötüdür!
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Onlar hiçbir müminin yakınlık veya ahdini gözetmezler. İşte aşırı gidenler
          bunlardır.
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Eğer tevbe eder, namaz kılar ve zekat verirlerse, sizin din kardeşiniz olurlar.
          Bilen kimseler için ayetleri uzun uzadıya açıklıyoruz.
        cid: 0
  - verse: 12
    segments:
      - text: >-
          Eğer andlaşmalarından sonra, yeminlerini bozarlar, dininize dil uzatırlarsa,
          inkarda önde gidenlerle savaşın, çünkü onların yeminleri sayılmaz, belki
          vazgeçerler.
        cid: 0
  - verse: 13
    segments:
      - text: >-
          Yeminlerini bozan, Peygamberi sürgüne göndermeye azmeden bir toplumla
          savaşmanız gerekmez mi ki, önce onlar başlamışlardır? Onlardan korkar mısınız?
          Eğer inanıyorsanız bilin ki asıl korkmanız gereken Allah'tır.
        cid: 0
  - verse: 14
    segments:
      - text: >-
          Onlarla savaşın ki Allah sizin elinizle onları azablandırsın, rezil etsin ve
          sizi üstün getirsin de müminlerin gönüllerini ferahlandırsın, kalblerindeki
          öfkeyi gidersin. Allah dilediğinin tevbesini kabul eder. Allah Bilendir,
          Hakimdir.
        cid: 0
  - verse: 15
    segments:
      - text: >-
          Onlarla savaşın ki Allah sizin elinizle onları azablandırsın, rezil etsin ve
          sizi üstün getirsin de müminlerin gönüllerini ferahlandırsın, kalblerindeki
          öfkeyi gidersin. Allah dilediğinin tevbesini kabul eder. Allah Bilendir,
          Hakimdir.
        cid: 0
  - verse: 16
    segments:
      - text: >-
          Allah, içinizden cihat edenleri; Allah'tan, peygamberinden ve inananlardan
          başka sırdaş edinmeyenleri ortaya çıkarmadan sizi kendi halinize bırakacak mı
          zannediyorsunuz? Allah işlediklerinizden haberdardır.
        cid: 0
  - verse: 17
    segments:
      - text: >-
          Puta tapanların kendilerinin inkarcı olduklarını itiraf edip dururken Allah'ın
          mescidlerini onarmaları gerekmez. Onların işledikleri boşa gitmiştir, cehennemde
          temelli kalacaklardır.
        cid: 0
  - verse: 18
    segments:
      - text: >-
          Allah'ın mescidlerini sadece, Allah'a ve ahiret gününe inanan, namaz kılan,
          zekat veren ve ancak Allah'tan korkan kimseler onarır. İşte onlar doğru yolda
          bulunanlardan olabilirler.
        cid: 0
  - verse: 19
    segments:
      - text: >-
          Hacca gelenlere su vermeyi, Mescidi Haramı onarmayı, Allah'a ve ahiret gününe
          inananla, Allah yolunda cihat edenle bir mi tuttunuz? Allah katında bir
          olmazlar; Allah zulmeden milleti doğru yola eriştirmez.
        cid: 0
  - verse: 20
    segments:
      - text: >-
          İnanan, hicret eden ve Allah yolunda mallarıyla, canlarıyla cihat eden
          kimselere Allah katında en büyük dereceler vardır. İşte kurtulanlar onlardır.
        cid: 0
  - verse: 21
    segments:
      - text: >-
          Rableri onlara katından bir rahmet, hoşnutluk ve içinde tükenmez nimetler
          bulunan cennetleri müjdeler. Doğrusu büyük ecir Allah katındadır.
        cid: 0
  - verse: 22
    segments:
      - text: >-
          Rableri onlara katından bir rahmet, hoşnutluk ve içinde tükenmez nimetler
          bulunan cennetleri müjdeler. Doğrusu büyük ecir Allah katındadır.
        cid: 0
  - verse: 23
    segments:
      - text: >-
          Ey inananlar! Babalarınızı, kardeşlerinizi küfrü imana tercih ediyorlarsa dost
          edinmeyin. Sizden onları kim dost edinirse doğrusu kendine yazık etmiş olurlar.
        cid: 0
  - verse: 24
    segments:
      - text: >-
          De ki: "Babalarınız, oğullarınız, kardeşleriniz, eşleriniz, akrabanız, elde
          ettiğiniz mallar, durgun gitmesinden korktuğunuz ticaret, hoşunuza giden evler
          sizce Allah'tan, Peygamberinden ve Allah yolunda savaşmaktan daha sevgili ise,
          Allah'ın buyruğu gelene kadar bekleyin. Allah fasık kimseleri doğru yola
          eriştirmez."
        cid: 0
  - verse: 25
    segments:
      - text: >-
          And olsun ki Allah size birçok yerlerde, ve çokluğunuzun sizi böbürlendirdiği
          fakat bir faydası da olmadığı, yeryüzünün geniş olmasına rağmen size dar gelip
          de bozularak arkanıza döndüğünüz Huneyn gününde yardım etmişti.
        cid: 0
  - verse: 26
    segments:
      - text: >-
          Bozgundan sonra Allah, Peygamberine, müminlere güvenlik verdi ve görmediğiniz
          askerler indirdi; inkar edenleri azaba uğrattı. İnkarcıların cezası budur.
        cid: 0
  - verse: 27
    segments:
      - text: >-
          Allah bundan sonra da dilediğinin tevbesini kabul eder. Allah bağışlar ve
          merhamet eder.
        cid: 0
  - verse: 28
    segments:
      - text: >-
          Ey inananlar! Doğrusu puta tapanlar pistirler, bu sebeple, bu yıllardan sonra
          Mescidi Haram'a yaklaşmasınlar. Eğer fakirlikten korkarsanız, bilin ki Allah
          dilerse sizi bol nimetiyle zenginleştirecektir. Allah şüphesiz bilendir,
          hakimdir.
        cid: 0
  - verse: 29
    segments:
      - text: >-
          Kitap verilenlerden, Allah'a, ahiret gününe inanmayan, Allah'ın ve
          Peygamberinin haram kıldığını haram saymayan, hak dinini din edinmeyenlerle,
          boyunlarını büküp kendi elleriyle cizye verene kadar savaşın.
        cid: 0
  - verse: 30
    segments:
      - text: >-
          Yahudiler, "Üzeyr Allah'ın oğludur" dediler; Hıristiyanlar, "Mesih Allah'ın
          oğludur" dediler. Bu, daha önce inkar edenlerin sözlerine benzeterek ağızlarında
          geveledikleri sözdür. Allah onları yok etsin, nasıl da uyduruyorlar!
        cid: 0
  - verse: 31
    segments:
      - text: >-
          Onlar Allah'ı bırakıp hahamlarını, papazlarını ve Meryem oğlu Mesih'i rableri
          olarak kabul ettiler. Oysa tek Tanrı'dan başkasına kulluk etmemekle
          emrolunmuşlardı. Ondan başka tanrı yoktur. Allah, koştukları eşlerden
          münezzehtir.
        cid: 0
  - verse: 32
    segments:
      - text: >-
          Allah'ın nurunu ağızlarıyla söndürmek isterler. Kafirler istemese de Allah
          nurunu mutlaka tamamlayacaktır.
        cid: 0
  - verse: 33
    segments:
      - text: >-
          Puta tapanlar hoşlanmasa da, dinini bütün dinlerden üstün kılmak üzere,
          Peygamberini doğru yol ve hak dinle gönderen Allah'tır.
        cid: 0
  - verse: 34
    segments:
      - text: >-
          Ey inananlar! Hahamlar ve rahiplerin çoğu, insanların mallarını haksızlıkla
          yerler. Allah yolundan alıkoyarlar. Altın ve gümüşü biriktirip Allah yolunda
          sarf etmeyenlere can yakıcı bir azabı müjdele.
        cid: 0
  - verse: 35
    segments:
      - text: >-
          Bunlar cehennem ateşinde kızdırıldığı gün, alınları, böğürleri ve sırtları
          onlarla dağlanacak, "Bu, kendiniz için biriktirdiğinizdir; biriktirdiğinizi
          tadın" denecek.
        cid: 0
  - verse: 36
    segments:
      - text: >-
          Allah'ın gökleri ve yeri yarattığı günkü yazısında, Allah'a göre ayların sayısı
          onikidir. Bunlardan dördü hürmetli aydır. Bu dosdoğru bir nizamdır. Öyleyse o
          aylar içinde kendinize yazık etmeyin, topyekun sizinle savaşan putperestlerle
          siz de topyekun savaşın, Allah'ın sakınanlarla beraber olduğunu bilin.
        cid: 0
  - verse: 37
    segments:
      - text: >-
          Sapıtmak için hürmetli ayların yerlerini değiştirip geciktirmek, küfürde
          gerçekten ileri gitmekdir. İnkar edenler Allah'ın haram kıldığı ayların sayısına
          uydurmak için, onu bir yıl haram, bir yıl helal sayıyor, böylece Allah'ın haram
          kıldığını helalkılıyorlar. Kötü işleri kendilerine güzel göründü. Allah inkar
          eden toplumu doğru yola eriştirmez.
        cid: 0
  - verse: 38
    segments:
      - text: >-
          Ey inananlar! Size ne oldu ki, "Allah yolunda, savaşa çıkın" dendiği zaman yere
          çöküp kaldınız? Oysa dünya hayatının geçimi ahirete göre pek az bir şeydir.
        cid: 0
  - verse: 39
    segments:
      - text: >-
          Çıkmazsanız Allah size can yakıcı azabla azabeder ve yerinize başka bir millet
          getirir. O'na bir şey de yapamazsınız. Allah her şeye kadirdir.
        cid: 0
  - verse: 40
    segments:
      - text: >-
          Ona (Muhammed'e) yardım etmezseniz, bilin ki, inkar edenler onu Mekke'den
          çıkardıklarında mağarada bulunan iki kişiden biri olarak Allah ona yardım
          etmişti. Arkadaşına (Ebu Bekir'e) "Üzülme, Allah bizimledir" diyordu; Allah da
          ona güven vermiş, görmediğiniz askerlerle onu desteklemiş, inkar edenlerin
          sözünü alçaltmıştı. Ancak Allah'ın sözü yücedir. Allah güçlüdür, hakimdir.
        cid: 0
  - verse: 41
    segments:
      - text: >-
          İsteyen, istemeyen, hepiniz savaşa çıkın. Allah yolunda mallarınızla,
          canlarınızla cihat edin. Bilirseniz bu sizin için hayırlıdır.
        cid: 0
  - verse: 42
    segments:
      - text: >-
          Kolay bir kazanç, normal bir yolculuk olsaydı sana uyarlardı, fakat çıkılacak
          yol onlara uzak geldi, kendilerini helak ederek, "Gücümüz yetseydi sizinle
          beraber çıkardık" diye Allah'a yemin edeceklerdir. Allah, onların yalancı
          olduğunu elbette biliyor.
        cid: 0
  - verse: 43
    segments:
      - text: >-
          Allah seni affetsin; doğrular sana belli olup, yalancıları bilmeden önce, niçin
          onlara izin verdin?
        cid: 0
  - verse: 44
    segments:
      - text: >-
          Allah'a ve ahiret gününe inananlar, mallariyle, canlariyle savaşmak
          istediklerinden ötürü geri kalmak için senden izin istemezler. Allah sakınanları
          bilir.
        cid: 0
  - verse: 45
    segments:
      - text: >-
          Ancak Allah'a ve ahiret gününe inanmayan, kalbleri şüpheye düşüp şüphelerinde
          bocalayan kimseler senden izin isterler.
        cid: 0
  - verse: 46
    segments:
      - text: >-
          Eğer savaşa çıkmak isteselerdi bir hazırlık yaparlardı. Ama Allah
          davranışlarını beğenmedi de onları alıkoydu. "Acizlerle beraber oturun" denildi.
        cid: 0
  - verse: 47
    segments:
      - text: >-
          Aranızda savaşa çıkmış olsalardı, ancak sizi bozmağa çalışırlar ve fitneye
          düşürmek için aranıza sokulurlardı. İçinizde onlara kulak verenler var. Allah
          kendilerine yazık edenleri bilir.
        cid: 0
  - verse: 48
    segments:
      - text: >-
          And olsun ki, daha önce de fitne koparmak istemişlerdi. Sana karşı bir takım
          işler çeviriyorlardı, sonunda onlar istemedikleri halde hak ortaya çıktı,
          Allah'ın emri üstün geldi.
        cid: 0
  - verse: 49
    segments:
      - text: >-
          Onlardan, "Bana izin ver, beni fitneye düşürme" diyen vardır. Bilin ki onlar
          zaten fitneye düşmüşlerdi. Cehennem, inkar edenleri şüphesiz kuşatacaktır.
        cid: 0
  - verse: 50
    segments:
      - text: >-
          Sana bir iyilik gelince onların fenasına gider; bir kötülük gelse, "Biz önceden
          ihtiyatlı davrandık" derler, sevinerek dönüp giderler.
        cid: 0
  - verse: 51
    segments:
      - text: >-
          De ki: "Allah'ın bize yazdığından başkası başımıza gelmez. O bizim Mevlamızdır,
          inananlar Allah'a güvensin."
        cid: 0
  - verse: 52
    segments:
      - text: >-
          De ki: "Bize iki iyiden, gazilik ve şehidlikten başka bir şeyin gelmesini mi
          bekliyorsunuz? Oysa biz Allah'ın kendi katından veya elimizle, sizi bir azaba
          uğratmasını bekliyoruz. Bekleyiniz, doğrusu biz de sizinle birlikte
          beklemekteyiz."
        cid: 0
  - verse: 53
    segments:
      - text: >-
          De ki: "İstekli yahut isteksiz olarak verin, nasıl olsa kabul edilmeyecektir.
          Siz şüphesiz fasık bir topluluksunuz."
        cid: 0
  - verse: 54
    segments:
      - text: >-
          Verdiklerinin kabul olunmasına engel olan, Allah'ı ve Peygamberini inkar
          etmeleri, namaza tembel tembel gelmeleri, istemeye istemeye vermeleridir.
        cid: 0
  - verse: 55
    segments:
      - text: >-
          Artık onların malları ve çocukları seni imrendirmesin. Allah bunlarla onlara
          dünya hayatında azabetmek ve canlarının inkarcı olarak çıkmasını ister.
        cid: 0
  - verse: 56
    segments:
      - text: >-
          Sizden olmadıkları halde, sizinle beraber olduklarına Allah'a yemin ederler.
          Oysa onlar korkak bir topluluktur.
        cid: 0
  - verse: 57
    segments:
      - text: >-
          Bir sığınak veya mağara yahut girecek bir yer bulmuş olsalardı, çarçabuk oraya
          yönelirlerdi.
        cid: 0
  - verse: 58
    segments:
      - text: >-
          Sadakalar hakkında sana dil uzatanlar vardır. Onlara verilirse hoşnut olurlar,
          verilmezse, hemen öfkeleniverirler.
        cid: 0
  - verse: 59
    segments:
      - text: >-
          Eğer onlar, Allah ve Peygamberinin kendilerine vermiş oldukları şeylere razı
          olsalar ve "Allah bize yeter, O ve Peygamberi bol nimetinden bize verecektir;
          doğrusu biz Allah'a gönül bağlayanlardanız" deselerdi daha hayırlı olurdu.
        cid: 0
  - verse: 60
    segments:
      - text: >-
          Zekatlar; Allah'tan bir farz olarak yoksullara, düşkünlere, onu toplayan
          memurlara, kalbleri Müslümanlığa ısındırılacaklara verilir; kölelerin,
          borçluların, Allah yolunda olanların ve yolda kalanların uğrunda sarfedilir.
          Allah bilendir, hakimdir.
        cid: 0
  - verse: 61
    segments:
      - text: >-
          İkiyüzlülerin içinde "O her şeye kulak kesiliyor" diyerek Peygamberi incitenler
          vardır. De ki: "O kulak, Allah'a inanan ve müminlere inanan, sizin için hayırlı
          olan, içinizden inanan kimselere rahmet olan bir kulaktır." Allah'ın
          Peygamberini incitenlere can yakıcı azab vardır.
        cid: 0
  - verse: 62
    segments:
      - text: >-
          Sizi hoşnut etmek için Allah'a yemin ederler. Eğer inanıyorlarsa Allah'ı ve
          Peygamberini hoşnut etmeleri daha gereklidir.
        cid: 0
  - verse: 63
    segments:
      - text: >-
          Allah'a ve Peygamberine karşı koymağa kalkışana, ebedi kalacağı cehennem ateşi
          bulunduğunu bilmezler mi? Büyük rezillik budur.
        cid: 0
  - verse: 64
    segments:
      - text: >-
          İkiyüzlüler, kalblerinde olanı haber verecek bir surenin inmesinden
          çekiniyorlar. De ki: "Alay edin bakalım, Allah çekindiğiniz şeyi ortaya
          koyacaktır."
        cid: 0
  - verse: 65
    segments:
      - text: >-
          Onlara soracak olursan, "Biz and olsun ki, eğlenip oynuyorduk" diyecekler; De
          ki: "Allah'la, ayetleriyle, Peygamberiyle mi alay ediyordunuz?"
        cid: 0
  - verse: 66
    segments:
      - text: >-
          Özür beyan etmeyin, inandıktan sonra inkar ettiniz. İçinizden bir topluluğu
          affetsek bile, suçlarından ötürü bir topluluğa da azab ederiz.
        cid: 0
  - verse: 67
    segments:
      - text: >-
          İkiyüzlü erkek ve kadınlar da birbirlerindendir: Kötülüğü emreder, iyiliğe
          engel olurlar; elleri de sıkıdır; Allah'ı unuttular, bu yüzden Allah da onları
          unuttu. Doğrusu ikiyüzlüler fasıktırlar.
        cid: 0
  - verse: 68
    segments:
      - text: >-
          Allah, ikiyüzlü erkek ve kadınlara ve inkarcılara, ebedi kalacakları cehennem
          ateşini hazırlamıştır. O, onlara yeter. Allah onları lanetlemiştir (rahmetinden
          uzak kılmıştır). Onlara devamlı azab vardır.
        cid: 0
  - verse: 69
    segments:
      - text: >-
          Ey ikiyüzlüler! Siz, sizden önce daha kuvvetli, malları ve çocukları daha çok
          olup, hisselerince bunlardan faydalanan kimseler gibisiniz. Sizden öncekiler,
          hisselerince faydalandıkları gibi siz de hissenizce faydalandınız ve onların
          batıla daldıklarıgibi siz de daldınız. İşte bunlar dünyada ve ahirette işleri
          boşa çıkanlardır, işte bunlar mahvolanlardır.
        cid: 0
  - verse: 70
