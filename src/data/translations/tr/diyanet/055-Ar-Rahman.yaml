        cid: 0
  - verse: 13
    segments:
      - text: >-
          Ey insanlar ve cinler! Öyleyken, Rabbinizin nimetlerinden hangisini
          yalanlarsınız?
        cid: 0
  - verse: 14
    segments:
      - text: >-
