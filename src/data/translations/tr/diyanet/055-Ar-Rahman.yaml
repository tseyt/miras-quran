surah_id: 55
language: tr
author: diyanet
verses:
  - verse: 1
    segments:
      - text: >-
          Rahman olan Allah Kuran'ı öğretti;
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Rahman olan Allah Kuran'ı öğretti;
        cid: 0
  - verse: 3
    segments:
      - text: >-
          İnsanı yarattı, ona konuşmayı öğretti.
        cid: 0
  - verse: 4
    segments:
      - text: >-
          İnsanı yarattı, ona konuşmayı öğretti.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Güneş ve ayın hareketleri bir hesaba göredir.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Bitkiler ve ağaçlar O'nun buyruğuna boyun eğerler.
        cid: 0
  - verse: 7
    segments:
      - text: >-
          O, göğü yükseltmiştir; tartıyı koymuştur.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Artık tartıda tecavüz etmeyin.
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Tartmayı doğru yapın, tartıyı eksik tutmayın.
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Allah, yeri yaratıkları için meydana getirmiştir.
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Orada meyveler, salkımlı hurma ağaçları, kabuklu taneler, güzel kokulu otlar
          vardır.
        cid: 0
  - verse: 12
    segments:
      - text: >-
