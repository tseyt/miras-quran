        cid: 0
  - verse: 8
    segments:
      - text: >-
          Bu inkarcıların, inananlara kızmaları; onların sadece, göklerin ve yerin
          hükümranlığı kendisinin bulunan ve övülmeğe layık ve güçlü olan Allah'a inanmış
          olmalarındandı. Allah her şeye şahiddir.
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Bu inkarcıların, inananlara kızmaları; onların sadece, göklerin ve yerin
          hükümranlığı kendisinin bulunan ve övülmeğe layık ve güçlü olan Allah'a inanmış
          olmalarındandı. Allah her şeye şahiddir.
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Ama inanmış erkek ve kadınlara işkence ederek onları dinlerinden çevirmeğe
          uğraşanlar, eğer tevbe etmezlerse, onlara cehennem azabı vardır. Yakıcı azap da
          onlaradır.
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Şüphesiz inanıp yararlı işler işleyenlere, onlara, içlerinden ırmaklar akan
          cennetler vardır. Bu, büyük kurtuluştur.
        cid: 0
  - verse: 12
    segments:
      - text: >-
          Doğrusu Rabbinin yakalaması amansızdır.
        cid: 0
  - verse: 13
    segments:
      - text: >-
          Önce yaratıp sonra bunu tekrar eden O'dur.
        cid: 0
  - verse: 14
    segments:
      - text: >-
          Yüce arşın sahibi, çok seven, bağışlayan O'dur.
        cid: 0
  - verse: 15
    segments:
      - text: >-
          Yüce arşın sahibi, çok seven, bağışlayan O'dur.
        cid: 0
  - verse: 16
    segments:
      - text: >-
          Her dilediğini mutlaka yapandır.
        cid: 0
  - verse: 17
    segments:
      - text: >-
          Firavun ve Semud ordularının haberi sana geldi mi?
        cid: 0
  - verse: 18
    segments:
      - text: >-
          Firavun ve Semud ordularının haberi sana geldi mi?
        cid: 0
  - verse: 19
    segments:
      - text: >-
          Doğrusu inkar edenler, hep yalanlayagelmişlerdir.
        cid: 0
  - verse: 20
    segments:
      - text: >-
          Oysa Allah onları ardlarından çevirmiştir.
        cid: 0
  - verse: 21
    segments:
      - text: >-
          Doğrusu sana vahyedilen bu Kitap, Levhi Mahfuz'da bulunan şanlı bir Kuran'dır.
        cid: 0
