surah_id: 85
language: tr
author: diyanet
verses:
  - verse: 1
    segments:
      - text: >-
          İçinde burçları bulunan göğe and olsun;
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Söz verilen kıyamet gününe and olsun;
        cid: 0
  - verse: 3
    segments:
      - text: >-
          Şahitlik edene ve edilene and olsun ki, insanlar öldükten sonra
          diriltileceklerdir.
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Hazırladıkları hendekleri, tutuşturulmuş ateşle doldurarak onun çevresinde
          oturup, inanmış kimselere dinlerinden dönmeleri için yaptıkları işkenceleri
          seyredenler kahrolmuştur!
        cid: 0
