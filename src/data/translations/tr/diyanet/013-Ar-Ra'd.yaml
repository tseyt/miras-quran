surah_id: 13
language: tr
author: diyanet
verses:
  - verse: 1
    segments:
      - text: "Elif, Lam, Mim, Ra. Bunlar Kitap'ın ayetleridir. Sana Rabbinden indirilen Kitap haktır; fakat insanların çoğu inanmazlar."
        cid: 0
  - verse: 2
    segments:
      - text: "Gökleri, gördüğünüz gibi, direksiz yükselten, sonra arşa hükmeden, her biri belli bir süreye kadar hareket edecek olan Güneş ve Ay'ı buyruğu altına alan, işleri yürüten, ayetleri uzun uzun açıklayan Allah'tır; ola ki Rabbinize kavuşacağınıza kesin olarak inanırsınız."
        cid: 0
  - verse: 3
    segments:
      - text: "Yeri düzleyen, orada dağlar, nehirler var eden, her türlü üründen çift çift yetiştiren, gündüzü geceyle bürüyen de O'dur. Doğrusu bunlarda, düşünen kimseler için ibretler vardır."
        cid: 0
  - verse: 4
    segments:
      - text: "Yeryüzünde, hepsi de aynı su ile sulanan, birbirine komşu toprak parçaları, tek ve çok köklü üzüm bağları, ekinler, hurma ağaçları vardır. Fakat onları şekil ve lezzetçe birbirinden farklı kılmışızdır. Düşünen kimseler için bunda ibretler vardır."
        cid: 0
  - verse: 5
    segments:
      - text: "Şaşacaksan, onların: &quot;Biz toprak olunca mı yeniden yaratılacağız?&quot; demelerine şaşmak gerekir. İşte onlar Rablerini inkar edenlerdir. İşte onlar boyunlarına demir halkalar vurulanlardır. İşte onlar cehennemliklerdir, orada temelli kalacaklardır."
        cid: 0
  - verse: 6
    segments:
      - text: "Puta tapanlar senden, iyilikten önce kötülük isterler, oysa onlardan önce nice ibret alınacak cezalar verilmiştir. Doğrusu Rabbinin, insanların zulümlerine rağmen onlara mağfireti vardır. Rabbinin cezalandırması çetindir."
        cid: 0
  - verse: 7
    segments:
      - text: "İnkar edenler: &quot;Rabbinden ona bir mucize indirilmeli değil miydi?&quot; derler. Sen ancak bir uyarıcısın. Her milletin bir yol göstereni vardır."
        cid: 0
  - verse: 8
    segments:
      - text: "Allah her dişinin rahminde taşıdığını, rahimlerin düşürdüğünü ve alıkoyduğunu bilir. O'nun katında her şey bir ölçüye göredir."
        cid: 0
  - verse: 9
    segments:
      - text: "Görüleni de görülmeyeni de bilen, yücelerin yücesi büyük Allah'a göre, aranızdan sözü gizleyen ile, açığa vuran ve geceye bürünerek gizlenip gündüzün ortaya çıkan arasında fark yoktur."
        cid: 0
  - verse: 10
    segments:
      - text: "Görüleni de görülmeyeni de bilen, yücelerin yücesi büyük Allah'a göre, aranızdan sözü gizleyen ile, açığa vuran ve geceye bürünerek gizlenip gündüzün ortaya çıkan arasında fark yoktur."
        cid: 0
  - verse: 11
    segments:
      - text: "Ardında ve önünde insanoğlunu takip edenler vardır; Allah'ın emriyle onu gözetirler. Bir millet kendini bozmadıkça Allah onların durumunu değiştirmez. Allah bir milletin fenalığını dileyince artık onun önüne geçilmez. Onlar için Allah'tan başka hamide bulunmaz."
        cid: 0
  - verse: 12
    segments:
      - text: "Korku ve ümide düşürmek için size şimşeği gösteren, yağmurla yüklü bulutları meydana getiren O'dur."
        cid: 0
  - verse: 13
    segments:
      - text: "O'nu, gök gürlemesi hamd ile, melekler de korkularından tesbih ederler. Onlar pek kuvvetli olan Allah hakkında çekişirken, O, yıldırımları gönderir de onlarla dilediğini çarpar."
        cid: 0
  - verse: 14
    segments:
      - text: "Gerçek dua ve ibadet ancak O'nadır. O'ndan başka çağırdıkları putlar kendilerine hiçbir cevap vermezler. Durumları, suyun ağzına gelmesi için avuçlarını ona açmış bekleyen adamın durumu gibidir. Hiçbir zaman suya kavuşamaz. İşte kafirlerin yalvarışıda böyle, boşunadır."
        cid: 0
  - verse: 15
    segments:
      - text: "Yerde ve göklerdeki kimseler de, gölgeleri de, sabah akşam, ister istemez Allah'a secde ederler."
        cid: 0
  - verse: 16
    segments:
      - text: "De ki: &quot;Göklerin ve yerin Rabbi kimdir?&quot;, &quot;Allah'tır&quot; de. &quot;Onu bırakıp, kendilerine bir fayda ve zararı olmayan dostlar mı edindiniz?&quot; de. &quot;Kör ile gören bir olur mu? Veya karanlıkla aydınlık bir midir?&quot; de. Yoksa Allah'a, Allah gibi yaratması olan ortaklar buldular da, yaratmaları birbirine mi benzettiler? De ki: &quot;Her şeyi yaratan Allah'tır. O, her şeye üstün gelen tek Tanrı'dır.&quot;"
        cid: 0
  - verse: 17
    segments:
      - text: "Allah gökten su indirir, dereler onunla dolar taşar. Sel, üste çıkan köpüğü alır götürür. Süslenmek veya faydalanmak için ateşte erittiklerinizin üzerinde de buna benzer bir köpük vardır. Allah, hak ve batıl için şöyle misal verir: Köpük uçup gider, insanlara fayda veren ise yerde kalır. Allah bunun gibi daha nice misaller verir."
        cid: 0
