surah_id: 63
language: tr
author: diyanet
verses:
  - verse: 1
    segments:
      - text: >-
          İkiyüzlüler sana gelince: "Senin şüphesiz Allah'ın Peygamberi olduğuna şehadet
          ederiz" derler. Allah, senin kendisinin peygamberi olduğunu bilir; bunun yanında
          Allah, ikiyüzlülerin yalancı olduklarını da bilir.
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Onlar, yeminlerini kalkan edinerek Allah'ın yolundan alıkoyarlar. İşledikleri
          işler gerçekten ne kötüdür!
        cid: 0
  - verse: 3
    segments:
      - text: >-
          Bu, önce inanıp sonra inkar etmiş olmalarındandır. Bu yüzden kalbleri
          mühürlenmiştir; artık anlamazlar.
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Onlara baktığın zaman cüsseleri hoşuna gider; konuşurlarsa sözlerini dinlersin;
          tıpkı, sıralanmış kof kütük gibidirler; her çığlığı kendi aleyhlerine sayarlar;
          onlar düşmandır, onlardan çekin; Allah canlarını alsın, nasıl da aldatılıp
          döndürülüyorlar.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Onlara: "Gelin de Allah'ın Peygamberi sizin için mağfiret dilesin" dendiği
          zaman, başlarını çevirirler; büyüklük taslayarak yüz çevirdiklerini görürsün.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Onlar için, bağışlanma dilesen de dilemesen de birdir; Allah onları
          bağışlamayacaktır. Doğrusu Allah, yoldan çıkmış milleti doğru yola eriştirmez.
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Bunlar: "Allah'ın Peygamberinin yanında bulunanlara bir şey vermeyin de dağılıp
          gitsinler" diyen kimselerdir. Oysa göklerin ve yerin hazineleri Allah'ındır, ama
          ikiyüzlüler bu gerçeği anlamazlar.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          "Eğer bu savaşdan Medine'ye dönersek, şerefli kimseler alçakları and olsun ki,
          oradan çıkaracaktır" diyorlardı. Oysa, şeref Allah'ın, Peygamberinin ve
          inananlarındır, ama ikiyüzlüler bu gerçeği bilmezler.
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Ey inananlar! Sizi, mallarınız ve çocuklarınız Allah'ı anmaktan alıkoymasın;
          böyle olanlar hüsrana uğrayanlardır.
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Birine ölüm gelip de: "Rabbim! Beni yakın bir süreye kadar ertelesen de, sadaka
          versem, iyilerden olsam" diyeceği zaman gelmezden önce, size verdiğimiz
          rızıklardan sarfedin.
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Bir canın eceli gelip çatınca, Allah onu asla geri bırakmaz; Allah,
          işlediklerinizden haberdardır.
        cid: 0