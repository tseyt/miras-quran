surah_id: 72
language: tr
author: diyanet
verses:
  - verse: 1
    segments:
      - text: >-
          De ki: "Cinlerden bir topluluğun Kuran'ı dinlediği bana vahyolundu; onlar şöyle
          demişlerdir;" "Doğrusu biz, doğru yola götüren, hayrete düşüren bir Kuran
          dinledik de ona inandık; biz, Rabbimize hiçbir şeyi ortak koşmayacağız."
        cid: 0
  - verse: 2
    segments:
      - text: >-
          De ki: "Cinlerden bir topluluğun Kuran'ı dinlediği bana vahyolundu; onlar şöyle
          demişlerdir;" "Doğrusu biz, doğru yola götüren, hayrete düşüren bir Kuran
          dinledik de ona inandık; biz, Rabbimize hiçbir şeyi ortak koşmayacağız."
        cid: 0
  - verse: 3
    segments:
      - text: >-
          "Doğrusu Rabbimizin yüceliği her yücelikten üstündür. O, zevce ve çocuk
          edinmemiştir."
        cid: 0
  - verse: 4
    segments:
      - text: >-
          "Doğrusu aramızdaki beyinsiz, Allah'a karşı yalanlar uyduruyordu."
        cid: 0
  - verse: 5
    segments:
      - text: >-
          "Doğrusu insanların ve cinlerin Allah'a karşı yalan uydurabileceklerini
          sanmazdık."
        cid: 0
  - verse: 6
    segments:
      - text: >-
          "Gerçekten, bir takım insanlar, cinlerin bir takımına sığınırlardı da onların
          azgınlıklarını artırırlardı."
        cid: 0
  - verse: 7
    segments:
      - text: >-
          "Doğrusu, onlar da sizin, Allah'ın kimseyi yeniden diriltmeyeceğinizi
          sandığınız gibi sanıda bulunmuşlardı."
        cid: 0
  - verse: 8
    segments:
      - text: >-
          "Doğrusu biz göğü yokladık; onu sert bekçiler ve kayan ateşlerle (ışınlarla)
          doldurulmuş bulduk."
        cid: 0
  - verse: 9
    segments:
      - text: >-
          "Doğrusu biz, göğün dinleyebileceğimiz bir yerinde otururduk; ama şimdi kim
          dinleyecek olsa, kendisini gözleyen bir ateş (ışın) buluyor."
        cid: 0
  - verse: 10
    segments:
      - text: >-
          "Yeryüzünde olanlara kötülük mü murad edildi, yahut Rableri onlara bir iyilik
          mi dilemiştir, doğrusu biz bilemeyiz."
        cid: 0
  - verse: 11
    segments:
      - text: >-
          "Doğrusu aramızda iyiler de vardır, bundan aşağı bulunanlar da vardır. Biz,
          türlü türlü yolda olan topluluklardık."
        cid: 0
  - verse: 12
    segments:
      - text: >-
          "Yeryüzünde kalsak da Allah'ı aciz bırakamayacağımız, başka yere kaçsak da,
          O'nu aciz kılamayacağımız gerçeğini şüphesiz anladık."
        cid: 0
  - verse: 13
    segments:
      - text: >-
          "Şüphesiz, doğruluk rehberi olan Kuran'ı dinlediğimizde ona inandık; kim
          Rabbine inanırsa, o, ecrinin eksiltileceğinden ve kendisine haksızlık
          edileceğinden korkmaz."
        cid: 0
  - verse: 14
    segments:
      - text: >-
          "İçimizde, kendini Allah'a vermiş olanlar da, yazık edenler de vardır. Kendini
          Allah'a veren kimseler, işte onlar, doğru yolu arayanlar, ona layık olanlardır."
        cid: 0
  - verse: 15
    segments:
      - text: >-
          "Kendilerine yazık edenlere gelince; onlar, cehennemin odunları oldular."
        cid: 0
  - verse: 16
    segments:
      - text: >-
          Ama doğru yola girmiş olsalardı, onları bu hususta denememiz için onlara bol su
          içirirdik; kim Rabbini anmaktan yüz çevirirse, Rabbi onu gittikçe artan bir
          azaba uğratır.
        cid: 0
  - verse: 17
    segments:
      - text: >-
          Ama doğru yola girmiş olsalardı, onları bu hususta denememiz için onlara bol su
          içirirdik; kim Rabbini anmaktan yüz çevirirse, Rabbi onu gittikçe artan bir
          azaba uğratır.
        cid: 0
  - verse: 18
    segments:
      - text: >-
          Mescidler şüphesiz Allah'ındır, öyleyse oralarda Allah'a yalvarırken başkasını
          katmayın.
        cid: 0
  - verse: 19
    segments:
      - text: >-
          Allah'ın kulu Muhammed, O'na yalvarmak, namaz kılmak için kalkınca, nerdeyse,
          çevresinde keçeleşirler, birbirlerine girerlerdi.
        cid: 0
  - verse: 20
    segments:
      - text: >-
          De ki: "Ben sadece Rabbime yalvarırım ve O'na kimseyi ortak koşmam."
        cid: 0
  - verse: 21
    segments:
      - text: >-
          De ki: "Ben size zarar vermeye de iyilik yapmaya da kadir değilim."
        cid: 0
  - verse: 22
    segments:
      - text: >-
          De ki: "Beni kimse Allah'a karşı savunamaz ve ben O'ndan başka bir sığınak
          bulamam."
        cid: 0
  - verse: 23
    segments:
      - text: >-
          "Benim yaptığım yalnız, Allah katından olanı, O'nun gönderdiklerini tebliğdir.
          Allah'a ve Peygamberine kim karşı gelirse ona, içinde sonsuz ve temelli
          kalınacak cehennem ateşi vardır."
        cid: 0
  - verse: 24
    segments:
      - text: >-
          Sonunda, kendilerine söz verileni gördükleri zaman, kimin yardımcısının daha
          güçsüz ve sayısının daha az olduğunu bileceklerdir.
        cid: 0
  - verse: 25
    segments:
      - text: >-
          De ki: Size söz verilen yakın mıdır, yoksa Rabbim onu uzun süreli mi kılmıştır
          ben bilmem."
        cid: 0
  - verse: 26
    segments:
      - text: >-
          Görülmeyeni bilen Allah, görülmeyene kimseyi muttali kılmaz.
        cid: 0
  - verse: 27
    segments:
      - text: >-
          Ancak peygamberlerden, bildirmek istediği bunun dışındadır. Rablerinin
          bildirilerini tebliğ etmelerini ortaya koymak için her peygamberin önünden ve
          ardından gözcüler salar; onların yaptıklarını ilmiyle kuşatır ve herşeyi bir bir
          sayar.
        cid: 0
  - verse: 28
    segments:
      - text: >-
          Ancak peygamberlerden, bildirmek istediği bunun dışındadır. Rablerinin
          bildirilerini tebliğ etmelerini ortaya koymak için her peygamberin önünden ve
          ardından gözcüler salar; onların yaptıklarını ilmiyle kuşatır ve herşeyi bir bir
          sayar.
        cid: 0