  - verse: 13
    segments:
      - text: "Rabbin onları azap kırbacından geçirmiştir."
        cid: 0
  - verse: 14
    segments:
      - text: "Doğrusu Rabbin hep gözetlemektedir."
        cid: 0
  - verse: 15
    segments:
      - text: "Rabbin denemek için bir insana iyilik edip, nimet verdiği zaman, o: &quot;Rabbim beni şerefli kıldı&quot; der."
        cid: 0
  - verse: 16
    segments:
      - text: "Ama onu sınamak için rızkını daraltıp bir ölçüye göre verdiği zaman: &quot;Rabbim bana hor baktı&quot; der."
        cid: 0
  - verse: 17
    segments:
      - text: "Hayır; yetime karşı cömert davranmıyorsunuz."
        cid: 0
  - verse: 18
    segments:
      - text: "Yoksulu yedirmek konusunda birbirinize özenmiyorsunuz."
        cid: 0
  - verse: 19
    segments:
