        cid: 0
  - verse: 20
    segments:
      - text: "Malı pek çok seviyorsunuz."
        cid: 0
  - verse: 21
    segments:
      - text: "Ama yer, çarpılıp paralandığı zaman;"
        cid: 0
  - verse: 22
    segments:
      - text: "Melekler sıra sıra dizilip, Rabbinin buyruğu gelince,"
        cid: 0
  - verse: 23
    segments:
      - text: "O gün, cehennem ortaya konur. O gün insan öğüt almaya çalışır ama artık öğütten ona ne?"
        cid: 0
  - verse: 24
    segments:
