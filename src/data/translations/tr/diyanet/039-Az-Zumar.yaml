surah_id: 39
language: tr
author: diyanet
verses:
  - verse: 1
    segments:
      - text: "Kitap'ın indirilmesi, güçlü ve Hakim olan Allah katındandır."
        cid: 0
  - verse: 2
    segments:
      - text: "Biz sana Kitap'ı gerçekle indirdik. Öyle ise dini Allah için halis kılarak O'na kulluk et."
        cid: 0
  - verse: 3
    segments:
      - text: "Dikkat edin, halis din Allah'ındır; O'nu bırakıp da putlardan dostlar edinenler: &quot;Onlara, bizi Allah'a yaklaştırsınlar diye kulluk ediyoruz&quot; derler. Doğrusu Allah ayrılığa düştükleri şeylerde aralarında hüküm verecektir. Allah şüphesiz yalancı ve inkarcı kimseyi doğru yola eriştirmez."
        cid: 0
  - verse: 4
    segments:
      - text: "Allah çocuk edinmek isteseydi, yaratıklarından dilediğini seçerdi. O münezzehtir, O; gücü her şeye yeten tek Allah'tır."
