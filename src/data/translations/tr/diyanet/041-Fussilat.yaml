        cid: 0
  - verse: 6
    segments:
      - text: >-
          Onlara söyle: "Ben de ancak sizin gibi bir insanım. Bana, tanrınızın tek bir
          Tanrı olduğu vahyolunuyor. Artık O'na yönelin, O'ndan bağışlanma dileyin; vay
          ortak koşanlara!"
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Onlar zekat vermezler; ahireti inkar edenler de yalnız onlardır.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Doğrusu inanıp yararlı iş işleyenlere, onlara kesintisiz bir ecir vardır.
        cid: 0
  - verse: 9
    segments:
      - text: >-
          "Siz yeri iki günde yaratanı mı inkar ediyor ve O'na eşler koşuyorsunuz! O,
          alemlerin Rabbidir" de.
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Yeryüzüne üstünden ağır baskılar (dağlar) yerleştirdi, onu bereketli kıldı;
          arayıp soranlar için gıdalarını tam (toplam) dört gün içinde yetiştirmesi
          kanununu koydu (takdir etti).
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Sonra, duman halinde bulunan göğe yöneldi, ona ve yeryüzüne: "İsteyerek veya
          istemeyerek buyruğuma gelin" dedi. İkisi de: "İsteyerek geldik" dediler.
        cid: 0
  - verse: 12
    segments:
      - text: >-
          Böylece onları, iki gün içinde yedi göğe tamamladı ve her göğün işini kendisine
          bildirdi. Yakın göğü ışıklarla donattık ve bozulmaktan koruduk. İşte bu, bilen,
          güçlü olan Allah'ın kanunudur.
        cid: 0
  - verse: 13
    segments:
      - text: >-
          Eğer yüz çevirirlerse onlara de ki: "İşte sizi, Ad ve Semud'un başına gelen
          yıldırıma benzer bir azap ile uyardım."
        cid: 0
  - verse: 14
    segments:
      - text: >-
          Onlara, önlerinden, artlarından, her yönden: "Allah'tan başkasına kulluk
          etmeyin" diyen peygamberler gelmişti: "Eğer Rabbimiz böyle bir şey dileseydi
          melekler indirirdi. Doğrusu sizinle gönderileni inkar ederiz" demişlerdi.
        cid: 0
  - verse: 15
    segments:
      - text: >-
          Ad milleti, yeryüzünde haksız yere büyüklük taslamış, "Bizden daha kuvvetli kim
          vardır?" demişti. Onlar, kendilerini yaratan Allah'ın onlardan daha kuvvetli
          olduğunu görmüyorlardı değil mi? Ayetlerimizi bile bile inkar ediyorlardı.
        cid: 0
  - verse: 16
    segments:
      - text: >-
          Rezillik azabını onlara dünya hayatında tattırmak için uğursuz günlerde
          üzerlerine dondurucu bir kasırga gönderdik. Ahiret azabı ise daha çok
          alçaltıcıdır ve onlar yardım da görmezler.
        cid: 0
  - verse: 17
    segments:
      - text: >-
          Semud milletine, doğru yolu göstermiştik, ama onlar körlüğü, doğru yolda
          gitmeye tercih ettiler. Kazandıklarının karşılığı olarak onları alçaltıcı azabın
          yıldırımı çarptı.
        cid: 0
  - verse: 18
    segments:
      - text: >-
          İnananları ve Allah'a karşı gelmekten sakınmış olanları kurtardık.
        cid: 0
  - verse: 19
    segments:
      - text: >-
          Allah'ın düşmanları o gün cehenneme sürülürler. Hepsi bir aradadırlar.
        cid: 0
  - verse: 20
    segments:
      - text: >-
          Sonunda oraya varınca, kulakları, gözleri ve derileri, yaptıkları hakkında
          onların aleyhinde şahidlik ederler.
        cid: 0
  - verse: 21
    segments:
      - text: >-
          Derilerine: "Aleyhimize niçin şahidlik ettiniz?" derler. "Bizi, her şeyi
          konuşturan Allah konuşturdu. Sizi önce yaratan O'dur ve O'na döndürülüyorsunuz"
          cevabını verirler.
        cid: 0
  - verse: 22
    segments:
      - text: >-
          Siz, gözleriniz, kulaklarınız ve derilerinizin aleyhinize şahidlik edeceğinden
          korkarak kötü iş işlemekten çekinmiyordunuz. Hayır; Allah'ın, yaptıklarınızın
          çoğunu bilmediğini sanıyordunuz.
        cid: 0
  - verse: 23
    segments:
      - text: >-
          İşte Rabbinizi böyle sanmanız sizi mahvetti de hüsrana uğrayanlardan oldunuz.
        cid: 0
  - verse: 24
    segments:
      - text: >-
          İster sabretsinler ister etmesinler, onların durağı ateştir. Hoş tutulmalarını
          isteseler de artık hoş tutulmazlar.
        cid: 0
  - verse: 25
    segments:
      - text: >-
          Onların yanına bir takım yardakçılar koyarız da geçmişlerini geleceklerini
          onlara güzel gösterirler. Verilen söz, gerek cinlerden ve gerekse insanlardan,
          gelip geçmiş ümmetler içinde, onların aleyhine gerçekleşmiştir. Doğrusu onlar
          hüsranda idiler.
        cid: 0
  - verse: 26
    segments:
      - text: >-
          İnkar edenler: "Bu Kuran'ı dinlemeyin, okunurken gürültü yapın, belki
          bastırırsınız" dediler.
        cid: 0
  - verse: 27
    segments:
      - text: >-
          İnkar edenlere çetin bir azap tattıracağız. İşledikleri en kötü işlere karşılık
          onların cezasını vereceğiz.
        cid: 0
  - verse: 28
    segments:
      - text: >-
          İşte böyle; Allah'ın düşmanlarının cezası ateştir. Ayetlerimizi bile bile inkar
          etmeleri karşılığı orası onların temelli kalacakları yerdir.
        cid: 0
  - verse: 29
    segments:
      - text: >-
          İnkar edenler: "Rabbimiz! Cinlerden ve insanlardan, bizi saptıranları göster,
          onları ayaklarımızın altına alalım da en altta kalanlardan olsunlar" derler.
        cid: 0
  - verse: 30
    segments:
      - text: >-
          "Rabbimiz Allah'tır" deyip sonra da doğrulukta devam edenler, onları, melekler,
          ölümleri anında: "Korkmayınız, üzülmeyiniz, size söz verilen cennetle sevinin,
          biz dünya hayatında da, ahirette de size dostuz. Burada, canlarınızın çektiği,
          umduğunuz şeyler, bağışlayan ve acıyan Allah katından bir ziyafet olarak size
          sunulur" diyerek inerler.
        cid: 0
