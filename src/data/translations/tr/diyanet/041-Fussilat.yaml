surah_id: 41
language: tr
author: diyanet
verses:
  - verse: 1
    segments:
      - text: >-
          Ha, Mim.
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Bu Kitap, merhametli olan Allah katından indirilmedir; bilen bir millet için
          müjdeci ve uyarıcı olmak üzere Arapça okunarak, ayetleri uzun uzun
          açıklanmıştır. Ama insanların çoğu yüz çevirmiştir, onlar işitmezler de: "Bizi
          çağırdığın şeye karşı kalblerimiz kapalıdır, kulaklarımızda ağırlık, bizimle
          senin aranda anlaşmamıza engel vardır; istediğini yap, biz de yapacağız" derler.
        cid: 0
