        cid: 0
  - verse: 33
    segments:
      - text: >-
          "Doğrusu ben, kendini Allah'a verenlerdenim" diyen, yararlı iş işleyen ve
          Allah'a çağıran kimseden daha güzel sözlü kim vardır?
        cid: 0
  - verse: 34
    segments:
      - text: >-
          İyilik ve fenalık bir değildir. Ey inanan kişi: Sen, fenalığı en güzel şekilde
          sav; o zaman, seninle arasında düşmanlık bulunan kişinin yakın bir dost gibi
          olduğunu görürsün.
        cid: 0
  - verse: 35
    segments:
      - text: >-
          Bu, ancak sabredenlere vergidir; bu ancak o büyük hazzı tadanlara vergidir.
        cid: 0
  - verse: 36
    segments:
      - text: >-
          Şeytan seni dürtecek olursa Allah'a sığın; doğrusu O, işitendir, bilendir.
        cid: 0
  - verse: 37
    segments:
      - text: >-
          Gece ile gündüz, güneş ile ay Allah'ın varlığının belgelerindendir. Güneşe ve
          aya secde etmeyin; eğer Allah'a kulluk etmek istiyorsanız, bunları yaratana
          secde edin.
        cid: 0
  - verse: 38
    segments:
      - text: >-
          Eğer büyüklük taslarlarsa kendi aleyhlerinedir. Rabbinin katında bulunanlar hiç
          usanmadan, O'nu gece gündüz tesbih ederler.
        cid: 0
  - verse: 39
    segments:
      - text: >-
          Kupkuru gördüğün yeryüzünün, Biz ona su indirdiğimiz zaman harekete geçmesi,
          kabarması, Allah'ın varlığının belgelerindendir. Ona can veren Allah şüphesiz
          ölüleri de diriltir. Doğrusu O her şeye kadir'dir.
        cid: 0
  - verse: 40
    segments:
      - text: >-
          Ayetlerimizi inkar edenler Bize gizli değillerdir. Kıyamet gününde ateşe atılan
          mı, yoksa güven içinde gelen kimse mi daha iyidir? Dilediğinizi işleyin, doğrusu
          O, yaptıklarınızı gören'dir.
        cid: 0
  - verse: 41
    segments:
      - text: >-
          Kitap kendilerine gelince, onlar, onu inkar etmişlerdir; oysa o, değerli bir
          Kitap'dır. Geçmişte ve gelecekte onu batıl kılacak yoktur. Hakim ve övülmeğe
          layık olan Allah katından indirilmedir.
        cid: 0
  - verse: 42
    segments:
      - text: >-
          Kitap kendilerine gelince, onlar, onu inkar etmişlerdir; oysa o, değerli bir
          Kitap'dır. Geçmişte ve gelecekte onu batıl kılacak yoktur. Hakim ve övülmeğe
          layık olan Allah katından indirilmedir.
        cid: 0
  - verse: 43
    segments:
      - text: >-
          Senin için söylenenler, senden önceki peygamberler için de söylenmişti. Doğrusu
          Rabbin hem bağışlayan ve hem de can yakıcı azap verendir.
        cid: 0
  - verse: 44
    segments:
      - text: >-
          Biz bu Kuran'ı yabancı bir dil ile ortaya koysaydık: "Ayetleri uzun açıklanmalı
          değil miydi? Araba yabancı bir dille söylenir mi?" derlerdi. De ki: "Bu,
          inananlara doğruluk rehberi ve gönüllerine şifadır." İnanmayanların kulaklarında
          ağırlık vardır ve onlara kapalıdır; sanki bunlara uzak bir mesafeden
          sesleniliyor da anlamıyorlar.
        cid: 0
  - verse: 45
    segments:
      - text: >-
          And olsun ki Musa'ya Kitap vermiştik de onda ayrılığa düşmüşlerdi. Rabbinin
          verilmiş bir sözü olmasaydı, aralarında hükmedilmiş olurdu. Doğrusu onlar, onun
          hakkında şüphe ve endişe içindedirler.
        cid: 0
  - verse: 46
    segments:
      - text: >-
          Kim yararlı iş işlerse kendi lehinedir; kim de kötülük işlerse kendi
          aleyhinedir. Rabbin, kullara karşı zalim değildir.
        cid: 0
  - verse: 47
    segments:
      - text: >-
          Kıyametin ne zaman kopacağı bilgisi ona aittir. O'nun bilgisi dışında hiçbir
          ürün kabuğundan çıkmaz, hiçbir dişi gebe kalmaz ve doğurmaz. Onlara: "Bana
          koştuğunuz ortaklar nerede?" diye seslendiği gün: "Sana, buna dair bizden hiçbir
          şahit olmadığınıarzederiz" derler.
        cid: 0
  - verse: 48
    segments:
      - text: >-
          Önceden yalvarıp durdukları şeyler onlardan uzaklaşmıştır. Kendilerinin kaçacak
          yerleri olmadığını anlamışlardır.
        cid: 0
  - verse: 49
    segments:
      - text: >-
          İnsan, iyilik istemekten usanmaz da, kendisine bir kötülük gelince umutsuzluğa
          düşer, meyus olur.
        cid: 0
  - verse: 50
    segments:
      - text: >-
          Başına gelen sıkıntıdan sonra, kendisine katımızdan bir rahmet tattırsak: "Bu
          benim hakkımdır; kıyametin kopacağını sanmıyorum. Rabbime döndürülürsem, O'nun
          katında and olsun ki, benim için daha güzel şeyler vardır" der. İnkar edenlere,
          işlediklerini, and olsun ki bildireceğiz. Onlara and olsun ki çetin bir azap
          tattıracağız.
        cid: 0
  - verse: 51
    segments:
      - text: >-
          İnsana nimet verdiğimiz zaman yüz çevirerek yan çizer; başına bir kötülük
          gelince uzun uzun yalvarır.
        cid: 0
  - verse: 52
    segments:
      - text: >-
          De ki: "Kuran Allah katından gelmiş olup da siz de onu inkar etmişseniz,
          söyleyin bana, derin bir çıkmazda bulunan kimseden daha sapık kim vardır?"
        cid: 0
  - verse: 53
    segments:
      - text: >-
          Onun hak olduğu meydana çıkıncaya kadar varlığımızın belgelerini onlara hem dış
          dünyada ve hem de kendi içlerinde göstereceğiz. Rabbinin her şeye şahit olması
          yetmez mi?
        cid: 0
  - verse: 54
    segments:
      - text: >-
          Dikkat edin; onlar Rablerine kavuşmaktan şüphededirler; dikkat edin; Allah
          şüphesiz her şeyi bilgisiyle kuşatandır.
        cid: 0