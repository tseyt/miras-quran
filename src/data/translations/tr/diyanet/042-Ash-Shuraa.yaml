surah_id: 42
language: tr
author: diyanet
verses:
  - verse: 1
    segments:
      - text: >-
          Ha, Mim.
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Ayn, Sin, Kaf,
        cid: 0
  - verse: 3
    segments:
      - text: >-
          Güçlü olan, Hakim olan Allah, sana da, senden öncekilere de böyle vahyeder.
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Göklerde olanlar da, yerde olanlar da O'nundur. O, çok yücedir ve büyüktür.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Gökler neredeyse üstlerinden çatlayacak. Melekler Rablerini överek tesbih eder
          ve yeryüzünde bulunanlar için O'ndan bağışlanma dilerler. İyi bilin ki Allah
          Şüphesiz bağışlayandır, merhametli olandır.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Allah'ı bırakıp da dostlar edinenlerin işlediklerini Allah gözetlemektedir.
          Sen, onlara vekil olmağa memur değilsin.
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Böylece şehirlerin anası olan Mekke'de ve çevresinde bulunanları uyarman, şüphe
          götürmeyen toplanma günü ile uyarman için sana Arapça okunan bir Kitap
          vahyettik. İnsanların bir takımı cennete, bir takımı da çılgın alevli cehenneme
          girer.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Eğer dilemiş olsaydı hepsini bir tek ümmet yapardı. Ama, O, rahmetine
          dilediğini kavuşturur. Zalimlerin ise bir dost ve yardımcısı olmaz.
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Demek onlar Allah'tan başka dostlar edindiler? Oysa dost, ancak Allah'tır. O,
          ölüleri diriltir. Her şeye Kadir'dir.
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Ayrılığa düştüğünüz herhangi bir şeyde hüküm vermek, Allah'a aittir; "İşte bu
          Allah, benim Rabbimdir. O'na güvenirim ve O'na yönelirim." (demek gerekir)
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Göklerin ve yerin yaratanı, size içinizden eşler, çift çift hayvanlar var
          etmiştir. Bu suretle, çoğalmanızı sağlamıştır. O'nun benzeri hiçbir şey yoktur.
          O, işitendir, görendir.
        cid: 0
  - verse: 12
    segments:
      - text: >-
          Göklerin ve yerin kilitleri O'nundur. Dilediğine rızkı yayar ve isterse kısar,
          bir ölçüye göre verir. Doğrusu O herşeyi bilendir.
        cid: 0
  - verse: 13
    segments:
      - text: >-
          Allah Nuh'a buyurduğu şeyleri size de din olarak buyurmuştur. Sana vahyettik;
          İbrahim'e, Musa'ya ve İsa'ya da buyurduk ki: "Dine bağlı kalın, onda ayrılığa
          düşmeyin." Ortak koşanları çağırdığın şey onların gözünde büyümektedir. Allah
          dilediğini kendine seçer, kendisine yöneleni de doğru yola eriştirir.
        cid: 0
  - verse: 14
    segments:
      - text: >-
          Kendilerine ilim geldikten sonra ayrılığa düşmeleri, ancak, birbirini
          çekememekten oldu. Eğer belirli bir süre için Rabbinin verilmiş bir sözü
          olmasaydı, aralarında hemen hükmedilirdi. Arkalarından Kitaba varis kılınanlar
          da ondan şüphe ve endişe içindedirler.
        cid: 0
  - verse: 15
    segments:
      - text: >-
          Bundan ötürü sen birliğe çağır ve emrolunduğun gibi doğru ol; onların
          heveslerine uyma ve şöyle söyle: "Allah'ın indirdiği Kitap'a inandım; aranızda
          adaletle hükmetmek ile emrolundum; Allah bizim de Rabbimiz, sizin de
          Rabbinizdir; bizim işlediklerimiz bize, sizin işledikleriniz kendinizedir.
          Bizimle sizin aranızda tartışılacak bir şey yoktur. Allah hepimizi bir araya
          toplar; dönüş O'nadır."
        cid: 0
  - verse: 16
    segments:
      - text: >-
          Allah'ın çağrısına icabet eden bulunduktan sonra, O'nun hakkında tartışmağa
          girişenlerin delilleri Rableri katında hükümsüzdür. Onlara bir gazap vardır,
          çetin bir azap da onlar içindir.
        cid: 0
  - verse: 17
    segments:
      - text: >-
          Gerçekten Kitap'ı ve ölçüyü indiren Allah'tır. Ne bilirsin, belki de kıyamet
          saati yakındır.
        cid: 0
  - verse: 18
    segments:
      - text: >-
          O'na inanmayanlar, acele olmasını beklerler; inananlar ise korku ile titrerler
          ve onun gerçek olduğunu bilirler. İyi bilin ki kıyamet günü hakkında tartışanlar
          derin bir sapıklık içindedirler.
        cid: 0
  - verse: 19
    segments:
      - text: >-
          Allah, kullarına lütufta bulunandır. Dilediğini rızıklandırır. Kuvvetli olan da
          güçlü olan da O'dur.
        cid: 0
  - verse: 20
    segments:
      - text: >-
          Ahiret kazancını isteyenin kazancını artırırız; dünya kazancını isteyene de
          ondan veririz; ama ahirette bir payı bulunmaz.
        cid: 0
  - verse: 21
    segments:
      - text: >-
          Yoksa, Allah'ın dinde izin vermediği bir şeyi onlara meşru kılacak ortakları mı
          vardır? Eğer kesin yargı bulunmayacak olsaydı aralarında hemen hükmedilirdi.
          Doğrusu, zalimlere can yakıcı azap vardır.
        cid: 0
  - verse: 22
    segments:
      - text: >-
          Yaptıkları şeyler başlarına gelirken, zalimlerin korkudan titrediklerini
          görürsün. İnanıp yararlı işler işleyenler cennet bahçelerindedirler. Rablerinin
          katında, onlara diledikleri verilir. İşte büyük lütuf budur.
        cid: 0
  - verse: 23
    segments:
      - text: >-
          Allah, inanıp yararlı işler işleyen kullarını bununla müjdeler. De ki: "Ben
          sizden buna karşı yakınlara sevgiden (veya Allah'a yaklaşmaktan) başka bir ücret
          istemem." Kim güzel bir iş işlerse onun güzelliğini arttırırız. Doğrusu Allah
          bağışlayandır, şükrün karşılığını verendir.
        cid: 0
  - verse: 24
    segments:
      - text: >-
          Yoksa senin için "Allah'a karşı yalan yere iftira etti" mi derler? Allah
          dilerse senin kalbini mühürler, batılı da yok eder, hakkı sözleriyle
          gerçekleştirir. Doğrusu O, kalplerde olanı bilendir.
        cid: 0
  - verse: 25
    segments:
      - text: >-
          Kullarının tevbesini kabul eden, kötülükleri affeden, yaptıklarınızı bilen,
          inanıp yararlı işler işleyenlerin duasını kabul eden, lütfuyla onların ecrini
          arttıran O'dur. Ama, inkarcılar için çetin azap vardır.
        cid: 0
  - verse: 26
    segments:
      - text: >-
          Kullarının tevbesini kabul eden, kötülükleri affeden, yaptıklarınızı bilen,
          inanıp yararlı işler işleyenlerin duasını kabul eden, lütfuyla onların ecrini
          arttıran O'dur. Ama, inkarcılar için çetin azap vardır.
        cid: 0
  - verse: 27
    segments:
      - text: >-
          Eğer Allah rızkı kullarının hepsine bol bol verseydi, yeryüzünde azgınlık
          ederlerdi. Ama O, dilediğini bir ölçüye göre indirir. Doğrusu O, kullarından
          haberdardır, onları görendir.
        cid: 0
  - verse: 28
    segments:
      - text: >-
          Umutsuzluğa düşmelerinin ardından yağmuru indiren, rahmetini yayan O'dur. O,
          övülmeğe layık olan dosttur.
        cid: 0
  - verse: 29
    segments:
      - text: >-
          Gökleri, yeri ve ikisinde yaydığı canlıları yaratması varlığının
          delillerindendir.
        cid: 0
  - verse: 30
    segments:
      - text: >-
          Başınıza gelen herhangi bir musibet ellerinizle işlediklerinizden ötürüdür. O,
          yine de çoğunu affeder.
        cid: 0
  - verse: 31
    segments:
      - text: >-
          Yeryüzünde O'nu aciz bırakamazsınız. Allah'tan başka bir dostunuz da
          yardımcınız da yoktur.
        cid: 0
  - verse: 32
    segments:
      - text: >-
          Denizde yüce dağlar gibi gemilerin yürümesi O'nun varlığının delillerindendir.
        cid: 0
  - verse: 33
    segments:
      - text: >-
          O, dilerse rüzgarı durdurur, yelkenle giden gemiler o zaman denizin yüzünde
          durakalır. Bunlarda, sabırlı olan ve çok şükreden kimseler için deliller vardır.
        cid: 0
  - verse: 34
    segments:
      - text: >-
          Yahut yaptıklarına karşılık onları ortadan kaldırır, bir çoğunu da bağışlar.
        cid: 0
  - verse: 35
    segments:
      - text: >-
          Ayetlerimiz üzerinde tartışanlar, kendilerine kaçacak yer olmadığını bilsinler.
        cid: 0
  - verse: 36
    segments:
      - text: >-
          Size verilen herhangi bir şey, sadece dünya hayatının bir geçimliğidir. Allah
          katında olan; inanıp Rablerine güvenen, büyük günahlardan ve hayasızlıklardan
          çekinen, öfkelendiklerinde bile bağışlayanlar, Rablerinin çağrısına cevap
          verenler ve namaz kılanlar için daha iyi ve daha süreklidir. Onların işleri
          aralarında danışma iledir. Kendilerine verdiğimiz rızıktan da sarfederler.
        cid: 0
  - verse: 37
    segments:
      - text: >-
          Size verilen herhangi bir şey, sadece dünya hayatının bir geçimliğidir. Allah
          katında olan; inanıp Rablerine güvenen, büyük günahlardan ve hayasızlıklardan
          çekinen, öfkelendiklerinde bile bağışlayanlar, Rablerinin çağrısına cevap
          verenler ve namaz kılanlar için daha iyi ve daha süreklidir. Onların işleri
          aralarında danışma iledir. Kendilerine verdiğimiz rızıktan da sarfederler.
        cid: 0
  - verse: 38
    segments:
      - text: >-
          Size verilen herhangi bir şey, sadece dünya hayatının bir geçimliğidir. Allah
          katında olan; inanıp Rablerine güvenen, büyük günahlardan ve hayasızlıklardan
          çekinen, öfkelendiklerinde bile bağışlayanlar, Rablerinin çağrısına cevap
          verenler ve namaz kılanlar için daha iyi ve daha süreklidir. Onların işleri
          aralarında danışma iledir. Kendilerine verdiğimiz rızıktan da sarfederler.
        cid: 0
  - verse: 39
    segments:
      - text: >-
          Bir haksızlığa uğradıklarında, üstün gelmek için aralarında yardımlaşırlar.
        cid: 0
  - verse: 40
    segments:
      - text: >-
          Bir kötülüğün karşılığı, aynı şekilde bir kötülüktür. Ama kim affeder ve
          barışırsa, onun ecri Allah'a aittir. Doğrusu O, zulmedenleri sevmez.
        cid: 0
  - verse: 41
    segments:
      - text: >-
          Zulüm gördükten sonra hakkını alan kimselere, işte onların aleyhine bir yol
          yoktur.
        cid: 0
  - verse: 42
    segments:
      - text: >-
          İnsanlara zulmedenlere, yeryüzünde haksız yere taşkınlık edenlere karşı
          durulmalıdır. İşte, can yakıcı azap bunlaradır.
        cid: 0
  - verse: 43
    segments:
      - text: >-
          Ama sabredip bağışlayanın işi, işte bu, azmedilmeye değer işlerdendir.
        cid: 0
  - verse: 44
    segments:
      - text: >-
          Allah kimi saptırırsa, artık onun bundan sonra bir dostu olmaz. Azabı
          gördüklerinde, zalimlerin: "Dönecek bir yol yok mudur?" dediklerini görürsün.
        cid: 0
  - verse: 45
    segments:
      - text: >-
          Aşağılıktan başları öne eğilmiş, göz ucuyla gizli gizli etrafa bakarken, ateşe
          sunulduklarını görürsün. İnananlar: "Hüsranda olanlar, kıyamet günü kendilerini
          de, ailelerini de hüsranda bırakanlardır" derler. İyi bilin ki, zalimler sürekli
          bir azap içindedirler.
        cid: 0
  - verse: 46
    segments:
      - text: >-
          Onların, Allah'tan başka kendilerine yardım edecek dostları da yoktur. Allah'ın
          saptırdığı kimsenin çıkar yolu olmaz.
        cid: 0
  - verse: 47
    segments:
      - text: >-
          Allah katından, geri çevrilemeyecek günün gelmesinden önce Rabbinizin çağrısına
          cevap verin. O gün hiçbirinize sığınacak yer bulunmaz, inkar de edemezsiniz.
        cid: 0
  - verse: 48
    segments:
      - text: >-
          Eğer yüz çevirirlerse bilsinler ki, Biz seni onlara bekçi göndermedik; sana
          düşen sadece tebliğdir. Doğrusu Biz insana katımızdan bir rahmet tattırırsak ona
          sevinir; ama elleriyle yaptıkları yüzünden başlarına bir kötülük gelirse işte o
          zaman görürsün ki insan gerçekten pek nankördür.
        cid: 0
  - verse: 49
    segments:
      - text: >-
          Göklerin ve yerin hükümranlığı Allah'ındır. Dilediğini yaratır, dilediğine kız
          çocuk, dilediğine de erkek çocuk verir.
        cid: 0
  - verse: 50
    segments:
      - text: >-
          Yahut hem kız hem erkek çocuk verir, dilediğini de kısır kılar. O, bilendir,
          her şeye Kadir'dir.
        cid: 0
  - verse: 51
    segments:
      - text: >-
          Allah bir insanla ancak vahiy suretiyle veya perde arkasından konuşur, yahut
          bir elçi gönderir; izniyle, dilediğini vahyeder. Doğrusu O yücedir, Hakim'dir.
        cid: 0
  - verse: 52
    segments:
      - text: >-
          İşte sana da buyruğumuzla Cebrail'i gönderdik; sen Kitap nedir, iman nedir
          önceleri bilmezdin, fakat Biz onu, kullarımızdan dilediğimizi onunla doğru yola
          eriştirdiğimiz bir nur kıldık. Şüphesiz sen de insanlara, göklerde ve yerde ne
          varsa kendisininolan Allah'ın yolunu, doğru yolu göstermektesin. İyi bilin ki
          işler sonunda Allah'a döner.
        cid: 0
  - verse: 53
    segments:
      - text: >-
          İşte sana da buyruğumuzla Cebrail'i gönderdik; sen Kitap nedir, iman nedir
          önceleri bilmezdin, fakat Biz onu, kullarımızdan dilediğimizi onunla doğru yola
          eriştirdiğimiz bir nur kıldık. Şüphesiz sen de insanlara, göklerde ve yerde ne
          varsa kendisininolan Allah'ın yolunu, doğru yolu göstermektesin. İyi bilin ki
          işler sonunda Allah'a döner.
        cid: 0