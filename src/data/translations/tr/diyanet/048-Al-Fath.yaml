surah_id: 48
language: tr
author: diyanet
verses:
  - verse: 1
    segments:
      - text: >-
          Doğrusu Biz sana apaçık bir zafer sağlamışızdır.
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Allah böylece, senin geçmiş ve gelecek günahlarını bağışlar, sana olan nimetini
          tamamlar, seni doğru yola eriştirir.
        cid: 0
  - verse: 3
    segments:
      - text: >-
          Böylece sana, kimsenin güç yetiremeyeceği bir şekilde yardım eder.
        cid: 0
  - verse: 4
    segments:
      - text: >-
          İnananların, imanlarını kat kat artırmaları için, kalblerine güven indiren
          O'dur. Göklerdeki ve yerdeki ordular Allah'ındır. Allah bilendir, Hakim olandır.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          İnanan erkek ve kadınları, içinde temelli kalacakları, içlerinden ırmaklar akan
          cennetlere koyar, onların kötülüklerini örter. Allah katında büyük kurtuluş işte
          budur.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          İnananlara yardım etmez diye Allah'a kötü sanıda bulunan ikiyüzlü erkek ve
          kadınlara, puta tapan erek ve kadınlara Allah azabetsin; kötü sanıları kendi
          baslarına gelsin! Allah onlara gazabetmiş, onları lanetlemiş ve cehennemi
          kendilerine hazırlamıştır. Ne kötü dönüş yeridir!
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Göklerdeki ve yerdeki ordular Allah'ındır. Allah güçlü olandır. Hakim olandır.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Doğrusu seni şahit, müjdeci ve uyarıcı olarak gönderdik. Ey insanlar, siz de
          Allah'a ve Peygamberine inanasınız, ona yardım edesiniz, O'na saygı gösteresiniz
          ve O'nu sabah akşam tesbih edesiniz.
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Doğrusu seni şahit, müjdeci ve uyarıcı olarak gönderdik. Ey insanlar, siz de
          Allah'a ve Peygamberine inanasınız, ona yardım edesiniz, O'na saygı gösteresiniz
          ve O'nu sabah akşam tesbih edesiniz.
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Şüphesiz sana baş eğerek ellerini verenler (biat edenler), Allah'a baş eğip el
          vermiş sayılırlar. Allah'ın eli onların ellerinin üstündedir. Verdiği bu sözden
          dönen, ancak kendi aleyhine dönmüş olur. Allah'a verdiği sözü yerine getirene,
          Allah büyük ecir verecektir.
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Bedevilerin savaştan geri kalmış olanları, sana: "Bizi mallarımız ve
          ailelerimiz alıkoydu. Allah'tan bizim bağışlanmamızı dile" diyecekler.
          Dilleriyle, gönüllerinde bulunmayanı söylerler; de ki: "Allah size bir zarar
          gelmesini dilerse, yahut bir fayda elde etmenizi dilerse, O'na karşı kimin gücü
          bir şeye yeter? Kaldı ki, Allah yaptıklarınızdan haberdardır."
        cid: 0
  - verse: 12
    segments:
      - text: >-
          Aslında siz, Peygamberin ve inananların, ailelerine bir daha dönmeyeceklerini
          sanmıştınız. Bu, gönüllerinize güzel görünmüştü de kötü sanıda bulunmuştunuz.
          Hayırsız bir topluluk oldunuz.
        cid: 0
  - verse: 13
    segments:
      - text: >-
          Allah'a ve Peygamberine kim inanmamışsa bilsin ki, şüphesiz Biz, inkarcılar
          için çılgın alevli cehennemi hazırlamışızdır.
        cid: 0
  - verse: 14
    segments:
      - text: >-
          Göklerin ve yerin hükümranlığı Allah'ındır. O, dilediğini bağışlar, dilediğine
          azabeder. Allah bağışlayandır, merhamet edendir.
        cid: 0
  - verse: 15
    segments:
      - text: >-
          Savaştan geri kalmış olanlar, siz ganimetleri almaya giderken: "Bırakın, biz de
          sizinle gelelim" diyeceklerdir. Onlar Allah'ın sözünü değiştirmek isterler. De
          ki: "Bize uymayacaksınız; Allah sizin için önceden böyle buyurmuştur." Size:
          "Hayır, bizi çekemiyorsunuz" diyecekler. Aksine, kendileri ancak pek az söz
          anlayan kimselerdir.
        cid: 0
  - verse: 16
    segments:
      - text: >-
          Bedevilerden geri kalmış olanlara de ki: "güçlü kuvvetli bir millete karşı,
          onlar müslüman olana kadar savaşmaya çağrılacaksanız; eğer itaat ederseniz Allah
          size güzel ecir verir, ama daha önce döndüğünüz gibi yine dönecek olursanız sizi
          can yakan bir azaba uğratır."
        cid: 0
  - verse: 17
    segments:
      - text: >-
          Ama, gözleri görmeyen kimse savaşa gelmezse ona bir sorumluluk yoktur; topala
          ve hastaya da sorumluluk yoktur. Kim Allah'a ve peygamberine itaat ederse, Allah
          onu, içlerinden ırmaklar akan cennetlere koyar. Kim yüz çevirirse, onu can
          yakıcı azaba uğratır.
        cid: 0
  - verse: 18
    segments:
      - text: >-
          Allah inananlardan, ağaç altında sana baş eğerek el verirlerken, and olsun ki
          hoşnut olmuştur. Gönüllerinde olanı da bilmiş, onlara güvenlik vermiş, onlara
          yakın bir zafer ve ele geçirecekleri bol ganimetler bahşetmiştir. Allah, güçlü
          olandır, Hakim olandır.
        cid: 0
  - verse: 19
    segments:
      - text: >-
          Allah inananlardan, ağaç altında sana baş eğerek el verirlerken, and olsun ki
          hoşnut olmuştur. Gönüllerinde olanı da bilmiş, onlara güvenlik vermiş, onlara
          yakın bir zafer ve ele geçirecekleri bol ganimetler bahşetmiştir. Allah, güçlü
          olandır, Hakim olandır.
        cid: 0
  - verse: 20
    segments:
      - text: >-
          Allah size, ele geçireceğiniz bol bol ganimetler vadetmiştir. İnananlar için
          bir belge olması, sizi doğru yola eriştirmesi için bunları size hemen vermiş ve
          insanların size uzanan ellerini önlemiştir.
        cid: 0
  - verse: 21
    segments:
      - text: >-
          Bundan başka, sizin gücünüzün yetmediği fakat Allah'ın sizin için sakladığı
          ganimetler de vardır. Allah her şeye Kadir olandır.
        cid: 0
  - verse: 22
    segments:
      - text: >-
          İnkar edenler sizinle savaşsalardı yüzgeri döneceklerdi. Sonra bir dost ve
          yardımcı da bulamayacaklardı.
        cid: 0
  - verse: 23
    segments:
      - text: >-
          Allah'ın önceden gelip geçmişlere uyguladığı yasası budur. Allah'ın yasasında
          değişme bulamazsın.
        cid: 0
  - verse: 24
    segments:
      - text: >-
          Sizi onlara üstün kıldıktan sonra, Mekke bölgesinde, onların ellerini sizden,
          sizin ellerinizi onlardan geri tutan, savaşı önleyen O'dur. Allah yaptıklarınızı
          görendir.
        cid: 0
  - verse: 25
    segments:
      - text: >-
          Onlar inkar edenlerdir, sizi Mescidi Haram'ı ziyaretten ve bağlı kurbanları
          yerlerine gitmekten alıkoyanlardır. Eğer, oradaki henüz tanımadığınız inanmış
          erkeklerle inanmış kadınları bilmeyerek ezmek suretiyle üzüntüye kapılmanız
          ihtimali olmasaydı Allah savaşı önlemezdi. Allah, dilediklerine rahmet etmek
          için böyle yapmıştır. Eğer inananlarla inkarcılar birbirinden ayrılmış
          olsalardı, inkar edenleri can yakıcı bir azaba uğratırdık.
        cid: 0
  - verse: 26
    segments:
      - text: >-
          İnkar edenler, gönüllerindeki cahiliyye çağının asabiyet ateşini
          ateşlendirdiklerinde, Allah, Peygamberine ve inananlara huzur indirdi; onların
          takva sözünü tutmalarını sağladı. Onlar, bu söze layık ve ehil kimselerdi. Allah
          her şeyi bilmektedir.
        cid: 0
  - verse: 27
    segments:
      - text: >-
          And olsun ki Allah, Peygamberinin rüyasının gerçek olduğunu tasdik eder. Ey
          inananlar! Siz, Allah dilerse, güven içinde, başlarınızı tıraş etmiş veya
          saçlarınızı kısaltmış olarak, korkmadan Mescidi Haram'a gireceksiniz. Allah,
          sizin bilmediğinizi bilir. Size, bundan başka, yakın zamanda bir zafer
          verecektir.
        cid: 0
  - verse: 28
    segments:
      - text: >-
          Bütün dinlerden üstün kılmak üzere, Peygamberini, doğruluk rehberi Kuran ve hak
          din ile gönderen O'dur. Şahit olarak Allah yeter.
        cid: 0
  - verse: 29
    segments:
      - text: >-
          Muhammed Allah'ın elçisidir. Onun beraberinde bulunanlar, inkarcılara karşı
          sert, birbirlerine merhametlidirler. Onları rükua varırken, secde ederken,
          Allah'tan lütuf ve hoşnudluk dilerken görürsün. Onlar, yüzlerindeki secde izi
          ile tanınırlar. İşte bu, onların Tevrat'ta anlatılan vasıflarıdır. İncil'de de
          şöyle vasıflandırılmışlardı: Filizini çıkarmış, onu kuvvetlendirmiş,
          kalınlaşmış, gövdesi üzerine dikilmiş, ekincilerin hoşuna giden ekin gibidirler.
          Allah böylece bunları çoğaltıp kuvvetlendirmekle inkarcıları öfkelendirir.
          Allah, inanıp yararlı işler işleyenlere, bağışlama ve büyük ecir vadetmiştir.
        cid: 0