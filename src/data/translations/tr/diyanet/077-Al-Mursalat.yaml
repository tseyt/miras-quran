surah_id: 77
language: tr
author: diyanet
verses:
  - verse: 1
    segments:
      - text: >-
          Birbiri ardından gönderilenlere ve görevlerine koştukça koşanlara, Allah'ın
          buyruklarını yaydıkça yayanlara ve hak ile batılın arasını ayırdıkça ayıranlara,
          kötülüğü önlemek veya uyarmak için vahiy getiren meleklere and olsun ki, size
          söz verilen kıyamet şüphesiz kopacaktır.
        cid: 0
