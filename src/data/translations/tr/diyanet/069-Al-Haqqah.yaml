          tanesi yüklenir.
        cid: 0
  - verse: 18
    segments:
      - text: >-
          O gün siz huzura alınırsınız, hiçbir şeyiniz gizli kalmaz.
        cid: 0
  - verse: 19
    segments:
      - text: >-
          Kitabı sağından verilen; "Alın, kitabımı okuyun, doğrusu bir hesaplaşma ile
          karşılaşacağımı umuyordum" der.
