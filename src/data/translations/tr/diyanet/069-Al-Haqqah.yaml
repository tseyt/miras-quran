surah_id: 69
language: tr
author: diyanet
verses:
  - verse: 1
    segments:
      - text: >-
          Gerçekleşecek olan!
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Nedir o gerçekleşecek olan gün?
        cid: 0
  - verse: 3
    segments:
      - text: >-
          Gerçekleşecek olanın ne olduğunu sana ne bildirir?
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Semud ve Ad milletleri tepelerine inecek bu gerçeği yalanladılar.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Bu yüzden Semud milleti zorlu bir sarsıntı ile yok edildi.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Ad milleti de bu yüzden önünde durulmaz, dondurucu bir rüzgarla yok edildi.
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Allah onların kökünü kesmek üzere, üzerlerine o rüzgarı yedi gece sekiz gün,
          estirdi. Halkın, kökünden çıkarılmış hurma kütükleri gibi yere yıkıldıklarını
          görürsün.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Onlardan arda kalmış bir şey görür müsün?
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Firavun, ondan öncekiler ve alt üst olmuş kasabalarda oturanlar da suç
          işlemişlerdi.
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Rabbinin peygamberine baş kaldırmışlardı. Bunun üzerine Rableri onları şiddeti
          arttıkça artan bir şekilde yakaladı.
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Su taştığı vakit, size bir ibret olmak üzere, anlayışlı kulaklar anlasın diye
          süzülen gemide, sizi Biz taşımışızdır.
        cid: 0
  - verse: 12
    segments:
      - text: >-
          Su taştığı vakit, size bir ibret olmak üzere, anlayışlı kulaklar anlasın diye
          süzülen gemide, sizi Biz taşımışızdır.
        cid: 0
  - verse: 13
    segments:
      - text: >-
          Sura bir üfürüş üfürüldüğü, yer ve dağlar kaldırılıp bir vuruşla birbirine
          çarpıldığı zaman, işte o gün olacak olur, kıyamet kopar.
        cid: 0
