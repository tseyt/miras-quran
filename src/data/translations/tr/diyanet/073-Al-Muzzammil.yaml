surah_id: 73
language: tr
author: diyanet
verses:
  - verse: 1
    segments:
      - text: >-
          Ey örtünüp bürünen! Gecenin yarısında, istersen biraz sonra, istersen biraz
          önce bir müddet için kalk ve ağır ağır Kuran oku.
        cid: 0
