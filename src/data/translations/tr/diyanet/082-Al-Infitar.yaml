surah_id: 82
language: tr
author: diyanet
verses:
  - verse: 1
    segments:
      - text: >-
          Gök yarıldığı zaman,
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Yıldızlar dağılıp döküldüğü zaman,
        cid: 0
  - verse: 3
    segments:
      - text: >-
          Denizler kaynaştığı zaman,
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Kabirlerin içi dışa çıktığı zaman,
        cid: 0
  - verse: 5
    segments:
      - text: >-
          İnsanoğlu, ne yaptığını ve ne yapmadığını görür.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Ey insanoğlu! Seni yaratıp sonra şekil veren, düzenleyen, mütenasip kılan,
          istediği şekilde seni terkip eden, çok cömert olan Rabbine karşı seni aldatan
          nedir?
        cid: 0
  - verse: 7
    segments:
