          nedir?
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Ey insanoğlu! Seni yaratıp sonra şekil veren, düzenleyen, mütenasip kılan,
          istediği şekilde seni terkip eden, çok cömert olan Rabbine karşı seni aldatan
          nedir?
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Hayır, hayır; doğrusu siz dini yalanlıyorsunuz.
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Oysa, yaptıklarınızı bilen değerli yazıcılar sizi gözetlemektedirler.
        cid: 0
  - verse: 11
    segments:
