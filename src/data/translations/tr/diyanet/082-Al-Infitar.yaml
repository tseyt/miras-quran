          Oradan bir daha ayrılamazlar.
        cid: 0
  - verse: 17
    segments:
      - text: >-
          Din gününün ne olduğunu sen nereden bilirsin?
        cid: 0
  - verse: 18
    segments:
      - text: >-
          Evet, din gününün ne olduğunu nereden bileceksin?
        cid: 0
  - verse: 19
    segments:
      - text: >-
          O gün, kimsenin kimseye hiçbir fayda sağlamayacağı bir gündür. O gün buyruk,
          yalnız Allah'ındır.
        cid: 0