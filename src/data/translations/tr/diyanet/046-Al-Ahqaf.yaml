surah_id: 46
language: tr
author: diyanet
verses:
  - verse: 1
    segments:
      - text: >-
          Ha, Mim.
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Bu Kitap'ın indirilmesi güçlü olan, Hakim olan Allah katındandır.
        cid: 0
  - verse: 3
    segments:
      - text: >-
          Biz, gökleri, yeri ve ikisinin arasında bulunanları, ancak gerçek üzere ve
          belirli bir süre için yarattık; inkar edenler, uyarıldıkları şeylerden yüz
          çevirmektedirler.
        cid: 0
  - verse: 4
    segments:
      - text: >-
          De ki: "Allah'ı bırakıp taptığınız şeyleri görüyor musunuz? Yeryüzünde ne
          yaratmışlar bana göstersenize! Yoksa Allah'la ortaklıkları göklerde midir? Eğer
          doğru sözlü iseniz, size indirilmiş bir kitap veya intikal etmiş bir bilgi
          kalıntısı varsa bana getirin."
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Allah'ı bırakıp da, kıyamet gününe kadar cevap veremeyecek şeylere yalvarandan
          daha sapık kimdir? Çünkü, yalvardıkları şeyler yalvarışlarından habersizdirler.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Ama, insanlar kıyamet günü toplatılınca, putları onlara düşman olurlar ve
          tapınmalarını inkar ederler.
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Ayetlerimiz onlara açıkça okunduğu zaman inkar edenler, kendilerine gelen
          gerçek için: "Bu, apaçık bir büyüdür" derler.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Veya, "onu uydurdu" derler. De ki: "Eğer onu uydurdumsa, beni Allah'a karşı
          hiçbir şekilde savunamazsınız; O, Kuran için yaptığınız taşkınlıkları daha iyi
          bilir. Benimle sizin aranızda şahit olarak O yeter. O, bağışlayandır, merhamet
          edendir."
        cid: 0
  - verse: 9
    segments:
      - text: >-
          De ki: "Ben peygamberlerin ilki değilim; benim ve sizin başınıza gelecekleri
          bilmem; ben ancak bana vahyolunana uymaktayım; ben sadece apaçık bir
          uyarıcıyım."
        cid: 0
  - verse: 10
    segments:
      - text: >-
          De ki: "Eğer bu Kitap Allah katından ise ve siz de onu inkar etmişseniz;
          İsrailoğullarından bir şahit de bunun böyle olduğuna şehadet edip de inanmışken,
          siz yine de büyüklük taslarsınız, bana söyleyin kendinize yazık etmiş olmaz
          mısınız?" Doğrusu Allah zalim milleti doğru yola eriştirmez.
        cid: 0
  - verse: 11
    segments:
      - text: >-
          İnkar edenler, inananlar için: "Eğer İslamiyet'te bir hayır olsaydı, bu hususta
          bizden öne geçemezlerdi" derler. Bununla doğru yola girmedikleri için de, "Bu,
          eski bir uydurmadır" derler.
        cid: 0
  - verse: 12
    segments:
      - text: >-
          Kuran'dan önce, Musa'nın kitabı (Tevrat), bir rahmet ve rehberdi. Bu Kuran da,
          zulmedenleri uyarmak ve iyi davrananlara müjde olmak üzere Arap diliyle
          indirilmiş, kendinden öncekileri doğrulayan bir Kitap'dır.
        cid: 0
  - verse: 13
    segments:
      - text: >-
          Doğrusu, "Rabbimiz Allah'tır" deyip, sonra da dosdoğru gidenlere korku yoktur,
          onlar üzülmeyeceklerdir.
        cid: 0
  - verse: 14
    segments:
      - text: >-
          İşte onlar, cennetliklerdir; işlediklerine karşılık olarak, içinde temelli
          kalacaklardır.
        cid: 0
  - verse: 15
    segments:
      - text: >-
          Biz insana, anne ve babasına karşı iyi davranmasını tavsiye etmişizdir; zira
          annesi, onu, karnında, zorluğa uğrayarak taşımış; onu güçlükle doğurmuştur.
          Taşınması ve sütten kesilmesi otuz ay sürer. Sonunda erginlik çağına erince ve
          kırk yaşına varınca: "Rabbim! Bana ve anne babama verdiğin nimete şükretmemi ve
          benim hoşnut olacağın yararlı bir işi yapmamı sağla; bana verdiğin gibi soyuma
          da salah ver; doğrusu Sana yöneldim, ben, kendini Sana verenlerdenim" demesi
          gerekir.
        cid: 0
  - verse: 16
    segments:
      - text: >-
          İşte, işlediklerini en güzel şekilde kabul ettiğimiz ve kötülüklerini
          geçtiğimiz bu kimseler, cennetlikler içindedirler. Bu, verilen doğru bir sözdür.
        cid: 0
  - verse: 17
    segments:
      - text: >-
          Annesine babasına: "Of ikinizden; benden önce nice nesiller gelip geçmişken
          beni tekrar diriltilmemle mi tehdit ediyorsunuz?" diyen kimseye, anne babası
          Allah'a sığınarak: "Sana yazıklar olsun! İnan; doğrusu Allah'ın sözü gerçektir"
          dedikleri halde: "Bu, Kuran öncekilerin masallarından başka bir şey değildir"
          diye cevap verenler işte onlar kendilerinden önce cinlerden ve insanlardan gelip
          geçmiş ümmetler içinde, Allah'ın azap vadinin aleyhlerinde gerçekleştiği
          kimselerdir. Doğrusu onlar hüsranda olanlardır.
        cid: 0
  - verse: 18
    segments:
      - text: >-
          Annesine babasına: "Of ikinizden; benden önce nice nesiller gelip geçmişken
          beni tekrar diriltilmemle mi tehdit ediyorsunuz?" diyen kimseye, anne babası
          Allah'a sığınarak: "Sana yazıklar olsun! İnan; doğrusu Allah'ın sözü gerçektir"
          dedikleri halde: "Bu, Kuran öncekilerin masallarından başka bir şey değildir"
          diye cevap verenler işte onlar kendilerinden önce cinlerden ve insanlardan gelip
          geçmiş ümmetler içinde, Allah'ın azap vadinin aleyhlerinde gerçekleştiği
          kimselerdir. Doğrusu onlar hüsranda olanlardır.
        cid: 0
  - verse: 19
    segments:
      - text: >-
          İşlediklerinden ötürü herkesin bir derecesi vardır. Herkese işlediklerinin
          karşılığı ödenir. Kendilerine haksızlık yapılmaz.
        cid: 0
  - verse: 20
    segments:
      - text: >-
          İnkar edenler, ateşe sunuldukları gün, onlara: "Dünyadaki hayatınızda sizin
          için güzel olan her şeyi harcadınız, onların zevkini sürdünüz; ama bugün,
          yeryüzünde haksız yere büyüklük taslamanızın ve yoldan çıkmanızın karşılığında
          alçaltıcı bir azap göreceksiniz"
        cid: 0
  - verse: 21
    segments:
      - text: >-
          Ad milletinin kardeşi Hud'u an; ondan önce ve sonra, "Allah'tan başkasına
          kulluk etmeyin" diyen nice uyarıcılar gelip geçmişken, Ahkaf bölgesindeki
          milletini uyarmış "Doğrusu sizin için, büyük günün azabından korkuyorum"
          demişti.
        cid: 0
  - verse: 22
    segments:
      - text: >-
          "Bize, bizi tanrılarımızdan alıkoymak için mi geldin? Doğru sözlülerden isen,
          bizi tehdit ettiğin şeyi başımıza getir" dediler.
        cid: 0
  - verse: 23
    segments:
      - text: >-
          "Doğrusu bunun ne zaman geleceğini Allah bilir; ben size benimle gönderileni
          tebliğ ediyorum; fakat sizin cahil bir millet olduğunuzu görüyorum." dedi.
        cid: 0
  - verse: 24
    segments:
      - text: >-
          O azabın, yayılarak vadilerine doğru yöneldiğini gördüklerinde: "Bu yaygın
          bulut bize yağmur yağdıracaktır" dediler. Hud: "Hayır, o, acele beklediğiniz
          şeydir; can yakıcı azap veren bir rüzgardır; Rabbinin buyruğu ile her şeyi yok
          eder" dedi. Bunun üzerine evlerinin harabelerinden başka bir şey görünmez oldu.
          Biz, suçlu milleti işte böyle cezalandırırız.
        cid: 0
  - verse: 25
    segments:
      - text: >-
          O azabın, yayılarak vadilerine doğru yöneldiğini gördüklerinde: "Bu yaygın
          bulut bize yağmur yağdıracaktır" dediler. Hud: "Hayır, o, acele beklediğiniz
          şeydir; can yakıcı azap veren bir rüzgardır; Rabbinin buyruğu ile her şeyi yok
          eder" dedi. Bunun üzerine evlerinin harabelerinden başka bir şey görünmez oldu.
          Biz, suçlu milleti işte böyle cezalandırırız.
        cid: 0
  - verse: 26
    segments:
      - text: >-
          And olsun ki onlara, size vermediğimiz servet ve imkanı vermiştik. Onlara
          kulaklar, gözler ve kalbler vermiştik; ama kulakları, gözleri ve kalbleri onlara
          bir fayda sağlamadı, zira, Allah'ın ayetlerini bile bile inkar ediyorlardı,
          alaya aldıkları şeyler onları kuşatıp yokediverdi.
        cid: 0
  - verse: 27
    segments:
      - text: >-
          And olsun ki, çevrenizde bulunan birçok kentleri yok etmişizdir. Belki doğru
          yola dönerler diye ayetleri türlü türlü anlatmışızdır.
        cid: 0
  - verse: 28
    segments:
      - text: >-
          O zamanlar, Allah'ı bırakıp da O'na yakınlık peyda etmek için edindikleri
          tanrılar kendilerine yardım etmeli değil miydi? Ama tanrıları onlardan
          uzaklaştılar. Bu, onların yalanı ve uydurup durdukları şeydir.
        cid: 0
  - verse: 29
    segments:
      - text: >-
          Kuran'ı dinleyecek cinlerden bir takımını sana yöneltmiştik. Onlar Kuran'ı
          dinlemeğe hazır olunca birbirlerine: "Susun" dediler. Kuran'ın okunması bitince,
          her biri birer uyarıcı olarak milletlerine döndüler.
        cid: 0
  - verse: 30
    segments:
      - text: >-
          Şöyle dediler: "Ey milletimiz! Doğrusu biz, Musa'dan sonra indirilen, kendinden
          öncekileri doğrulayan, gerçeği ve doğru yolu gösteren bir kitap dinledik."
        cid: 0
  - verse: 31
    segments:
      - text: >-
          "Ey milletimiz! Allah'a çağırana (Muhammed'e) uyun ve O'na inanın da Allah da
          sizin günahlarınızı bağışlasın ve sizi can yakıcı azabdan korusun."
        cid: 0
  - verse: 32
    segments:
      - text: >-
          Allah'a çağırana uymayan kimse bilsin ki, Allah'ı yeryüzünde aciz bırakamaz;
          onların O'ndan başka dostları da bulunmaz; işte onlar apaçık sapıklıktadırlar.
        cid: 0
  - verse: 33
    segments:
      - text: >-
          Gökleri, yeri yaratan ve onları yaratmaktan yorulmayan Allah'ın, ölüleri
          diriltmeye de kadir olduğunu görmezler mi? Evet; O her şeye Kadir'dir.
        cid: 0
  - verse: 34
    segments:
      - text: >-
          İnkar edenler, ateşe sunuldukları gün onlara: "Bu, gerçek değil miydi?" denir,
          onlar: "Rabbimize and olsun ki evet gerçekti" derler. Allah: "İnkar etmenizden
          ötürü azabı tadın" der.
        cid: 0
  - verse: 35
    segments:
      - text: >-
          Peygamberlerden azim sahibi olanların sabrettiği gibi sen de sabret; inkarcılar
          için acele etme; onlar, kendilerine söz verileni gördükleri gün dünyada sadece
          gündüzün bir müddeti eğlendiklerini sanırlar. Bu bir bildiridir; yoldan çıkmış
          olanlardan başkası mı yok edilir?
        cid: 0