  - verse: 22
    segments:
      - text: >-
          Çok geçmeden Hüdhüd gelip Süleyman'a: "Senin bilmediğin bir şeyi öğrendim. Sana
          Sebe'den doğru bir haber getirdim. Ora halkına hükmeden, herşeyden kendisine
