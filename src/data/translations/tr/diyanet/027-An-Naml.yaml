surah_id: 27
language: tr
author: diyanet
verses:
  - verse: 1
    segments:
      - text: >-
          Ta, Sin, Bunlar Kuran'ın, Kitab-ı Mübin'in ayetleridir.
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Bunlar, namaz kılan, zekat veren ve ahirete de kesin olarak inanan müminlere
          doğruluk rehberi ve müjdedir.
        cid: 0
  - verse: 3
    segments:
      - text: >-
          Bunlar, namaz kılan, zekat veren ve ahirete de kesin olarak inanan müminlere
          doğruluk rehberi ve müjdedir.
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Ahirete inanmayanların yaptıkları işleri kendilerine güzel göstermişizdir; bu
          yüzden körü körüne bocalarlar.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Kötü azap işte bunlaradır. Ahirette en çok kayba uğrayacaklar da bunlardır.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Şüphesiz, Kuran'ı, Hakim ve Alim olan Allah katından almaktasın.
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Musa, ailesine: "Ben bir ateş gördüm; size oradan ya bir haber getireceğim,
          yahut ısınasınız diye tutuşmuş bir odun getireceğim" demişti.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Oraya geldiğinde, kendisine şöyle nida olunmuştu: "Ateşin yanında olan ve
          çevresinde bulunanlar mübarek kılınmıştır. Alemlerin Rabbi olan Allah
          münezzehtir"
        cid: 0
  - verse: 9
    segments:
      - text: >-
          "Ey Musa! Gerçek şu ki, Ben, güçlü ve hakim olan Allah'ım"
        cid: 0
  - verse: 10
    segments:
      - text: >-
          "Değneğini at!" Musa, değneğinin yılan gibi hareketler yaptığını görünce,
          arkasına bakmadan dönüp kaçtı. "Ey Musa! Korkma; Benim katımda peygamberler
          korkmaz; yalnız haksızlık eden bunun dışındadır. Kötü hali iyiliğe çeviren kimse
          bilsin ki Ben şüphesiz bağışlarım, merhamet ederim. Elini koynuna sok, Firavun
          ve milletine gönderilen dokuz mucizeden biri olarak kusursuz, bembeyaz çıksın.
          Gerçekten onlar yoldan çıkmış bir millettir."
        cid: 0
