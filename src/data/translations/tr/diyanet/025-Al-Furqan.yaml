surah_id: 25
language: tr
author: diyanet
verses:
  - verse: 1
    segments:
      - text: >-
          Göklerin ve yerin hükümranlığı kendisinin olan, çocuk edinmeyen, hükümranlıkta
          ortağı bulunmayan, herşeyi yaratıp bir ölçüye göre düzenleyen ve dünyaları
          uyarmak üzere kuluna hakkı batıldan ayırdeden Kuran'ı indiren Allah yücelerin
          yücesidir.
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Göklerin ve yerin hükümranlığı kendisinin olan, çocuk edinmeyen, hükümranlıkta
          ortağı bulunmayan, herşeyi yaratıp bir ölçüye göre düzenleyen ve dünyaları
          uyarmak üzere kuluna hakkı batıldan ayırdeden Kuran'ı indiren Allah yücelerin
          yücesidir.
        cid: 0
  - verse: 3
    segments:
      - text: >-
          Kafirler, O'nu bırakıp, birşey yaratamayan, bilakis kendileri yaratılmış olan,
          kendilerine ne zarar ve ne de fayda verebilen; öldürmeye, diriltmeye ve ölümden
          sonra tekrar canlandırmaya güçleri yetmeyen tanrılar edindiler.
        cid: 0
  - verse: 4
    segments:
      - text: >-
          İnkar edenler: "Bu Kuran uydurmadır, ona başka bir topluluk yardım etmiştir"
          diyerek haksız ve asılsız bir söz uydurdular.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          "Kuran öncekilerin masallarıdır; başkalarına yazdırıp sabah akşam kendisine
          okunmaktadır" dediler.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          De ki: "Onu, göklerin ve yerin sırrını bilen indirmiştir. Şüphesiz O,
          bağışlayandır, merhamet edendir."
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Şöyle dediler: "Bu ne biçim peygamber ki yemek yer, sokaklarda gezer? Ona,
          beraberinde bulunup uyaran bir melek indirilseydi ya! Yahut, kendisine bir
          hazine verilseydi, veya besleneceği bir bahçe olsaydı ya!" Bu zalimler,
          inananlara: "Siz sadece büyülenmiş bir adama uyuyorsunuz" dediler.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Şöyle dediler: "Bu ne biçim peygamber ki yemek yer, sokaklarda gezer? Ona,
          beraberinde bulunup uyaran bir melek indirilseydi ya! Yahut, kendisine bir
          hazine verilseydi, veya besleneceği bir bahçe olsaydı ya!" Bu zalimler,
          inananlara: "Siz sadece büyülenmiş bir adama uyuyorsunuz" dediler.
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Sana nasıl misaller getirdiklerine bir bak! Onlar sapmışlardır, yol bulamazlar.
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Dilerse sana, bunlardan daha iyi olan, içlerinden ırmaklar akan cennetler
          verebilen ve köşkler kurabilen Allah yücelerin yücesidir.
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Zaten onlar, kıyamet saatini de yalanladılar. O saatin geleceğini
          yalanlayanlara çılgın alevli bir ateş hazırlamışızdır.
        cid: 0
  - verse: 12
    segments:
      - text: >-
          Bu ateş, onlara uzak bir yerden gözükünce, onun kaynamasını ve uğultusunu
          işitirler.
        cid: 0
  - verse: 13
    segments:
      - text: >-
          Elleri boyunlarına bağlanarak, dar bir yerden atıldıkları zaman, orada, yok
          olup gitmeyi isterler.
        cid: 0
  - verse: 14
    segments:
      - text: >-
          "Bir kere yok olmayı değil, birçok defa yok olmayı isteyin" denir.
        cid: 0
  - verse: 15
    segments:
      - text: >-
          De ki: "Bu mu iyidir, yoksa Allah'a karşı gelmekten sakınanlara mükafat ve
          gidilecek yer olarak söz verilen ebedi cennet mi daha iyidir?"
        cid: 0
  - verse: 16
    segments:
      - text: >-
          Temelli kalacakları cennette diledikleri şeyleri bulurlar. Bu, Rabbinin yerine
          getirilmesi istenen bir vaadidir.
        cid: 0
  - verse: 17
    segments:
      - text: >-
          O gün Rabbin onları ve Allah'ı bırakıp da taptıkları şeyleri toplar ve: "Bu
          kullarımı siz mi saptırdınız, yoksa kendi kendilerine mi yoldan saptılar?" der.
        cid: 0
  - verse: 18
    segments:
      - text: >-
          Onlar: "Haşa; Seni bırakıp başka dostlar edinmek bize yaraşmaz; fakat Sen
          onlara ve babalarına nimetler verdin de sonunda Seni anmayı unuttular ve helaki
          hak eden bir millet oldular" derler.
        cid: 0
  - verse: 19
    segments:
      - text: >-
          "Söylediklerinizde sizi yalancı çıkardılar, artık kendinizden azabı çeviremez,
          yardım da göremezsiniz. Zulmedenlerinize büyük bir azap tattıracağız" denir.
        cid: 0
  - verse: 20
    segments:
      - text: >-
          Senden önce gönderdiğimiz bütün peygamberler de, şüphesiz, yemek yerler,
          sokaklarda gezerlerdi. Ey insanlar! Sabreder misiniz diye sizi birbirinizle
          sınarız. Rabbin her şeyi görür.
        cid: 0
  - verse: 21
    segments:
      - text: >-
          Bizimle karşılaşmayı ummayanlar: "Bize ya melekler indirilmeli, ya da
          Rabbimiz'i görmeliyiz" derler. And olsun ki kendi kendilerine büyüklenmişler,
          azgınlıkta pek ileri gitmişlerdir.
        cid: 0
  - verse: 22
    segments:
      - text: >-
          Melekleri gördükleri gün, işte o gün, suçlulara iyi haber yoktur. Melekler:
          "İyi haber size yasaktır, yasak!" derler.
        cid: 0
  - verse: 23
    segments:
      - text: >-
          Yaptıkları her işi ele alır, onu toz duman ederiz.
        cid: 0
  - verse: 24
    segments:
      - text: >-
          O gün, cennetliklerin kalacağı yer çok iyi, dinlenecekleri yer çok güzeldir.
        cid: 0
  - verse: 25
    segments:
      - text: >-
          O gün, gök beyaz bulutlar halinde parçalanacak ve melekler bölük bölük
          indirilecektir.
        cid: 0
  - verse: 26
    segments:
      - text: >-
          O gün gerçek hükümdarlık Rahman'ındır. İnkarcılar için yaman bir gündür.
        cid: 0
  - verse: 27
    segments:
      - text: >-
          O gün, zalim kimse ellerini ısırıp: "Keşke Peygamberle beraber bir yol
          tutsaydım, vay başıma gelene; keşke falancayı dost edinmeseydim. And olsun ki
          beni, bana gelen Kuran'dan o saptırdı. Şeytan insanı yalnız ve yardımcısız
          bırakıyor" der.
        cid: 0
  - verse: 28
    segments:
      - text: >-
          O gün, zalim kimse ellerini ısırıp: "Keşke Peygamberle beraber bir yol
          tutsaydım, vay başıma gelene; keşke falancayı dost edinmeseydim. And olsun ki
          beni, bana gelen Kuran'dan o saptırdı. Şeytan insanı yalnız ve yardımcısız
          bırakıyor" der.
        cid: 0
  - verse: 29
    segments:
      - text: >-
          O gün, zalim kimse ellerini ısırıp: "Keşke Peygamberle beraber bir yol
          tutsaydım, vay başıma gelene; keşke falancayı dost edinmeseydim. And olsun ki
          beni, bana gelen Kuran'dan o saptırdı. Şeytan insanı yalnız ve yardımcısız
          bırakıyor" der.
        cid: 0
  - verse: 30
    segments:
      - text: >-
          Peygamber: "Ey Rabbim! Doğrusu milletim bu Kuran'ı terketmişti" der.
        cid: 0
  - verse: 31
    segments:
      - text: >-
          Her peygamber için, böylece suçlulardan bir düşman ortaya koyarız. Doğruyu
          gösterici ve yardımcı olarak, Rabbin yeter.
        cid: 0
  - verse: 32
    segments:
      - text: >-
          İnkar edenler: "Kuran ona bir defada indirilmeliydi" derler. Oysa Biz onu
          böylece senin kalbine yerleştirmek için azar azar indirir ve onu ağır ağır
          okuruz.
        cid: 0
  - verse: 33
    segments:
      - text: >-
          Sana bir misal vermezler ki, Biz onun gerçeğini ve en iyi anlaşılanını sana
          vermemiş olalım.
        cid: 0
  - verse: 34
    segments:
      - text: >-
          Cehennemde yüzü koyun toplanacak olanlar, işte onların yerleri en kötü ve
          yolları da en sapıktır.
        cid: 0
  - verse: 35
    segments:
      - text: >-
          And olsun ki Musa'ya Kitap verdik, kardeşi Harun'u da kendisine vezir yaptık.
        cid: 0
  - verse: 36
    segments:
      - text: >-
          "Ayetlerimizi yalanlayan millete gidin" dedik. Sonunda o milleti yerle bir
          ettik.
        cid: 0
  - verse: 37
    segments:
      - text: >-
          Nuh milletini de, peygamberleri yalanladıkları zaman suda boğduk ve kendilerini
          insanlar için bir ibret kıldık. Zalimlere can yakıcı azap hazırlamışızdır.
        cid: 0
  - verse: 38
    segments:
      - text: >-
          Ad, Semud milletleri ile Ress'lileri ve bunların arasında birçok nesilleri de
          yerle bir ettik.
        cid: 0
  - verse: 39
    segments:
      - text: >-
          Her birine misaller vermiştik ama, dinlemedikleri için hepsini kırdık geçirdik.
        cid: 0
  - verse: 40
    segments:
      - text: >-
          Bu putperestler and olsun ki, bela yağmuruna tutulmuş olan kasabaya
          uğramışlardı. Onu görmediler mi? Hayır; tekrar dirilmeyi ummuyorlardı.
        cid: 0
  - verse: 41
    segments:
      - text: >-
          Seni gördükleri zaman, "Allah'ın gönderdiği elçi bu mudur?" diye alaya almaktan
          başka birşey yapmazlar.
        cid: 0
  - verse: 42
    segments:
      - text: >-
          "Tanrılarımız üzerinde direnmeseydik, doğrusu neredeyse bizi onlardan
          uzaklaştıracaktı" derler. Azabı gördükleri zaman, kimin yolunun sapık olduğunu
          bileceklerdir.
        cid: 0
  - verse: 43
    segments:
      - text: >-
          Hevesini kendine tanrı edineni gördün mü? Ona sen mi vekil olacaksın?
        cid: 0
  - verse: 44
    segments:
      - text: >-
          Yoksa çoklarının söz dinlediklerini veya aklettiklerini mi sanırsın? Onlar
          şüphesiz davarlar gibidir, belki daha da sapık yolludurlar.
        cid: 0
  - verse: 45
    segments:
      - text: >-
          Rabbinin gölgeyi nasıl uzattığını görmez misin? İsteseydi onu durdururdu. Sonra
          Biz güneşi, ona delil kılıp yavaş yavaş kendimize çekmişizdir.
        cid: 0
  - verse: 46
    segments:
      - text: >-
