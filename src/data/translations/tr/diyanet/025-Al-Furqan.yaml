        cid: 0
  - verse: 67
    segments:
      - text: >-
          Onlar, sarfettikleri zaman ne israf ederler ne de cimrilik, ikisi arasında orta
          bir yol tutarlar.
        cid: 0
  - verse: 68
    segments:
      - text: >-
          Onlar, Allah'ın yanında başka tanrı tutup ona yalvarmazlar. Allah'ın haram
          kıldığı cana haksız yere kıymazlar. Zina etmezler. Bunları yapan günaha girmiş
          olur.
        cid: 0
  - verse: 69
    segments:
      - text: >-
          Kıyamet günü azabı kat kat olur, orada, alçaltılarak temelli kalır.
        cid: 0
  - verse: 70
    segments:
      - text: >-
          Ancak tevbe eden, inanıp yararlı iş işleyenlerin, işte Allah onların
          kötülüklerini iyiliklere çevirir. Allah bağışlar ve merhamet eder.
        cid: 0
  - verse: 71
    segments:
      - text: >-
          Kim tevbe edip yararlı iş işlerse, şüphesiz o, Allah'a gereği gibi yönelmiş
          olur.
        cid: 0
  - verse: 72
    segments:
      - text: >-
          Onlar yalan yere şehadet etmezler; faydasız birşeye rastladıkları zaman yüz
          çevirip vakarla geçerler.
        cid: 0
  - verse: 73
    segments:
      - text: >-
          Kendilerine Rablerinin ayetleri hatırlatıldığı zaman, onlara karşı kör ve sağır
          davranmazlar.
        cid: 0
  - verse: 74
    segments:
      - text: >-
          Onlar: "Rabbimiz! Bize eşlerimizden ve çocuklarımızdan gözümüzün aydınlığı
          olacak insanlar ihsan et ve bizi, Allah'a karşı gelmekten sakınanlara önder yap"
          derler.
        cid: 0
  - verse: 75
    segments:
      - text: >-
          İşte onlar, sabrettiklerinden ötürü cennetin en yüksek dereceleriyle
          mükafatlandırılırlar. Orada esenlik ve dirlik dilekleriyle karşılanırlar.
        cid: 0
  - verse: 76
    segments:
      - text: >-
          Orada temellidirler. Orası ne güzel bir yer ve ne güzel duraktır!
        cid: 0
  - verse: 77
    segments:
      - text: >-
          De ki: "İbadetiniz (duanız) olmasa Rabbim size ne diye değer versin?" Ey
          inkarcılar! Yalanladığınız için, azap yakanızı bırakmayacaktır.
        cid: 0