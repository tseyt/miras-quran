          indirmişizdir.
        cid: 0
  - verse: 50
    segments:
      - text: >-
          And olsun ki öğüt almaları için ülkeler arasında yer yer türlü türlü yağmur
          yağdırmışızdır. Buna rağmen insanların çoğu nankörlükte direnmiştir.
        cid: 0
  - verse: 51
    segments:
      - text: >-
          Dileseydik, her kente bir uyarıcı gönderirdik.
        cid: 0
  - verse: 52
    segments:
      - text: >-
          Sen, inkarcılara uyma, onlara karşı olanca gücünle mücadele et.
        cid: 0
  - verse: 53
    segments:
      - text: >-
          Birinin suyu tatlı ve kolay içimli, diğerininki tuzlu ve acı olan iki denizi
          salıverip aralarına da, karışmalarına engel olan bir sınır koyan Allah'tır.
        cid: 0
  - verse: 54
    segments:
      - text: >-
          İnsanı sudan yaratarak, ona soy sop veren O'dur. Rabbin herşeye Kadir'dir.
        cid: 0
  - verse: 55
    segments:
      - text: >-
          Allah'ı bırakıp, kendilerine fayda da zarar da veremeyen şeylere kulluk
          ederler. İnkar eden, Rabbine karşı gelenin (şeytanın) yardımcısıdır.
        cid: 0
  - verse: 56
    segments:
      - text: >-
          Biz seni sadece müjdeci ve uyarıcı olarak gönderdik.
        cid: 0
  - verse: 57
    segments:
      - text: >-
          De ki: "Ben buna karşı sizden bir ücret değil, ancak, Rabbine doğru bir yol
          tutmak dileyen kimseler olmanızı istiyorum."
        cid: 0
  - verse: 58
    segments:
      - text: >-
          Ölümsüz, diri olan Allah'a güven, O'nu överek tesbih et. Kullarının
          günahlarından haberdar olarak kendisi yeter.
        cid: 0
  - verse: 59
    segments:
      - text: >-
          Gökleri, yeri ve ikisinin arasındakileri altı günde yaratan sonra da arşa
          hükmeden Rahman'dır. Bunu bir bilene sor.
        cid: 0
  - verse: 60
    segments:
      - text: >-
          Onlara: "Rahman'a secdeye varın" dendiği zaman "Rahman da nedir? Emrettiğine mi
          secdeye varacağız?" derler. Bu, onların nefretini artırır.
        cid: 0
  - verse: 61
    segments:
      - text: >-
          Gökte burçlar vareden, orada ışık saçan güneş ve aydınlatan ayı yaratan Allah,
          yücelerin yücesidir.
        cid: 0
  - verse: 62
    segments:
      - text: >-
          İbret almak veya şükretmek dileyen kimseler için gece ile gündüzü birbiri
          ardınca getiren O'dur.
        cid: 0
  - verse: 63
    segments:
      - text: >-
          Rahman'ın kulları yeryüzünde mütevazı yürürler. Bilgisizler kendilerine
