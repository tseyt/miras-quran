          Biz güneşi, ona delil kılıp yavaş yavaş kendimize çekmişizdir.
        cid: 0
  - verse: 47
    segments:
      - text: >-
          Size geceyi örtü, uykuyu rahatlık kılan, gündüzü çalışma zamanı yapan
          Allah'tır.
        cid: 0
  - verse: 48
    segments:
      - text: >-
          Rüzgarları rahmetinin önünde müjdeci gönderen O'dur. Ölü bir yeri diriltmek ve
          yarattığımız nice hayvan ve insanları sulamak için gökten tertemiz su
          indirmişizdir.
        cid: 0
  - verse: 49
    segments:
      - text: >-
          Rüzgarları rahmetinin önünde müjdeci gönderen O'dur. Ölü bir yeri diriltmek ve
