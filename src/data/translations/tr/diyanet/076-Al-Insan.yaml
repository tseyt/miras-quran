surah_id: 76
language: tr
author: diyanet
verses:
  - verse: 1
    segments:
      - text: >-
          İnsanoğlu, var edilip bahse değer bir şey olana kadar, şüphesiz, uzun bir zaman
          geçmemiş midir?
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Biz insanı katışık bir nutfeden yaratmışızdır; onu deneriz; bu yüzden, onun
          işitmesini ve görmesini sağlamışızdır.
        cid: 0
  - verse: 3
    segments:
      - text: >-
          Şüphesiz ona yol gösterdik; buna kimi şükreder, kimi de nankörlük.
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Doğrusu, inkarcılar için zincirler, demir halkalar ve çılgın alevli cehennem
          hazırladık.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Şüphesiz iyiler kafur katılmış bir tastan içerler.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Bu ancak Allah'ın kullarının taşıra taşıra içebileceği bir pınardır.
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Onlar verdikleri sözleri yerine getirirler, fenalığı yaygın olan bir günden
          korkarlar.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Onlar içleri çektiği halde, yiyeceği yoksula, öksüze ve esire yedirirler.
        cid: 0
  - verse: 9
    segments:
      - text: >-
          "Biz sizi ancak Allah rızası için doyuruyoruz, bir karşılık ve teşekkür
          beklemiyoruz. Doğrusu biz çok asık suratların bulunacağı bir günde Rabbimizden
          korkarız" derler.
        cid: 0
  - verse: 10
    segments:
      - text: >-
          "Biz sizi ancak Allah rızası için doyuruyoruz, bir karşılık ve teşekkür
          beklemiyoruz. Doğrusu biz çok asık suratların bulunacağı bir günde Rabbimizden
          korkarız" derler.
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Allah da onları bu yüzden o günün fenalığından korur; onların yüzüne parlaklık
          ve neşe verir.
        cid: 0
  - verse: 12
    segments:
      - text: >-
          Sabırlarının karşılığı, cennet ve oradaki ipeklerdir.
        cid: 0
  - verse: 13
    segments:
      - text: >-
          Orada tahtlara yaslanırlar; orada yakıcı sıcak ve dondurucu soğuk görmezler.
        cid: 0
  - verse: 14
    segments:
      - text: >-
          Meyve ağaçlarının gölgeleri üzerlerine sarkmış ve onların koparılması
          kolaylaştırılmıştır.
        cid: 0
  - verse: 15
    segments:
      - text: >-
          Çevrelerinde gümüş kaplar ve billur kaseler dolaştırılır.
        cid: 0
  - verse: 16
    segments:
      - text: >-
          Billurları gümüş gibi parlaktır, onları ölçüp ölçüp dağıtırlar.
        cid: 0
  - verse: 17
    segments:
      - text: >-
          Orada, zencefil karışık bir tasla içirilirler.
        cid: 0
  - verse: 18
    segments:
      - text: >-
          O pınara "Selsebil" denir.
        cid: 0
  - verse: 19
    segments:
      - text: >-
          Yanlarında ölümsüz gençler dolaşır; onları gördüğünde saçılmış birer inci
          sanırsın.
        cid: 0
  - verse: 20
    segments:
      - text: >-
          Oranın neresine baksan, nimet ve büyük bir saltanat görürsün.
        cid: 0
  - verse: 21
    segments:
      - text: >-
          Üzerlerinde ince yeşil ipekli, parlak atlastan elbiseler vardır; gümüş
          bileziklerle süslenmişlerdir Rableri onlara tertemiz içecekler içirir.
        cid: 0
  - verse: 22
    segments:
      - text: >-
          "İşte bu sizin işlediklerinizin karşılığıdır, çalışmalarınız şükre değer"
          denir.
        cid: 0
  - verse: 23
    segments:
      - text: >-
          Kuran'ı sana indiren şüphesiz Biziz.
        cid: 0
  - verse: 24
    segments:
      - text: >-
          Rabbinin hükmüne kadar sabret; onların günah işleyen ve inkarcı olanlarına
          uyma.
        cid: 0
  - verse: 25
    segments:
      - text: >-
          Rabbinin adını sabah akşam an.
        cid: 0
  - verse: 26
    segments:
      - text: >-
          Geceleyin O'na secde et; O'nu geceleri uzun uzun tesbih et.
        cid: 0
  - verse: 27
    segments:
      - text: >-
          Doğrusu insanlar, çabuk elde edilen dünya nimetlerini severler de ağırlığı
          çekilmez günü arkalarında bırakırlar.
        cid: 0
  - verse: 28
    segments:
      - text: >-
          Onları yaratan, mafsallarını pekiştiren Biziz; dilersek onları benzerleri ile
          değiştiriveririz.
        cid: 0
  - verse: 29
    segments:
      - text: >-
          Bu sadece bir öğüttür; dileyen, Rabbine giden yolu tutar.
        cid: 0
  - verse: 30
    segments:
      - text: >-
          Allah dilemedikçe siz dileyemezsiniz. Doğrusu Allah, bilendir, Hakim'dir.
        cid: 0
  - verse: 31
    segments:
      - text: >-
          Dilediğine rahmet eder. Zalimlere, işte onlara, can yakıcı bir azap
          hazırlamıştır.
        cid: 0