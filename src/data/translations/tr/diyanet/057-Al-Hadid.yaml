surah_id: 57
language: tr
author: diyanet
verses:
  - verse: 1
    segments:
      - text: "Göklerde ve yerde olanlar Allah'ı tesbih ederler. O güçlüdür, Hakim'dir."
        cid: 0
  - verse: 2
    segments:
      - text: "Göklerin ve yerin hükümranlığı O'nundur; diriltir, öldürür. O, her şeye Kadir'dir."
        cid: 0
  - verse: 3
    segments:
      - text: "O her şeyden öncedir; kendisinden sonraya hiçbir şeyin kalmayacağı son'dur; varlığı aşikardır; gerçek mahiyeti insan için gizlidir. O her şeyi bilir."
        cid: 0
  - verse: 4
    segments:
