surah_id: 75
language: tr
author: diyanet
verses:
  - verse: 1
    segments:
      - text: >-
          Kıyamet gününe yemin ederim.
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Ve nedamet çeken nefse yemin ederim.
        cid: 0
  - verse: 3
    segments:
      - text: >-
          İnsan, kemiklerini bir araya toplayamayız mı sanıyor?
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Evet, Biz onu, parmak uçlarına varıncaya kadar bütün incelikleriyle yeniden
          yapmaya kadiriz.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Ama, insanoğlu gelecekte de suç işlemek ister de: "Kıyamet günü ne zamanmış! "
          der.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Ama, insanoğlu gelecekte de suç işlemek ister de: "Kıyamet günü ne zamanmış! "
          der.
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Gözün kamaştığı, ayın tutulduğu, güneş ve ayın bir araya getirildiği zaman,
          işte o gün insan: "kaçacak yer nerede?" der.
        cid: 0
