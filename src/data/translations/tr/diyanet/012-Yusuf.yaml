surah_id: 12
language: tr
author: diyanet
verses:
  - verse: 1
    segments:
      - text: >-
          Elif, Lam, Ra. Bunlar, gerçeği açıklayan Kitap'ın ayetleridir.
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Biz onu, anlayasınız diye, Arapça bir Kuran olarak indirdik.
        cid: 0
  - verse: 3
    segments:
      - text: >-
          Biz bu Kuran'ı vahyederek, sana en güzel kıssaları anlatıyoruz.. Oysa daha önce
          sen bunlardan habersizdin.
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Yusuf babasına: "Babacığım! "Rüyamda onbir yıldız, güneş ve ayın bana secde
          ettiklerini gördüm" demişti.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Babası şunları söyledi: "Oğulcuğum! Rüyanı kardeşlerine anlatma, yoksa sana
          tuzak kurarlar; zira şeytan insanın apaçık düşmanıdır".
        cid: 0
  - verse: 6
    segments:
      - text: >-
          "Rabbin seni böylece rüyandaki gibi seçecek, sana rüyaları yorumlamayı
          öğretecek; daha önce, ataların İbrahim ve İshak'a nimetlerini tamamladığı gibi,
          sana ve Yakub soyuna da tamamlayacaktır. Doğrusu Rabbin bilir, hakimdir."
        cid: 0
  - verse: 7
    segments:
      - text: >-
          And olsun ki, Yusuf ve kardeşlerinin olayında, soranlara nice ibretler vardır.
        cid: 0
  - verse: 8
