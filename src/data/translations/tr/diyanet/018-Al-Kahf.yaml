  - verse: 16
    segments:
      - text: >-
          Onlara: "Siz onlardan ve Allah'tan başka taptıklarından ayrıldınız, bunun için
          mağaraya girin ki, Rabbiniz size rahmetini yaysın ve size işinizde kolaylık
