          yaptıklarından dolayı hemen hesaba çekmek isteseydi, azaba uğratmakta acele
          ederdi. Ama onların bir vadesi vardır. Ondan kaçıp sığınacak yer bulamazlar.
        cid: 0
  - verse: 59
    segments:
      - text: >-
