        cid: 0
  - verse: 17
    segments:
      - text: >-
          Baksaydın, güneşin mağaralarının sağ tarafından doğup meylettiğini, sol
          tarafından onlara dokunmadan battığını, onların da mağaranın genişçe bir yerinde
          bulunduğunu görürdün. Bu, Allah'ın mucizelerindendir; Allah'ın doğru yola
          eriştirdiği kimse hak yoldadır. Kimi de saptırırsa artık ona, doğru yola
          götürecek bir rehber bulamazsın.
        cid: 0
  - verse: 18
    segments:
      - text: >-
          Mağara ehli uykuda iken sen onları uyanık sanırdın. Biz onları sağa ve sola
          döndürürdük. Köpekleri dirseklerini eşiğe uzatmıştı. Onları görsen, için
          korkuyla dolar, geri dönüp kaçardın.
        cid: 0
  - verse: 19
    segments:
      - text: >-
          Birbirlerine sorsunlar diye onları uyandırdık. İçlerinden biri: "Ne kadar
          kaldınız?" dedi. "Bir gün veya daha az bir müddet kaldık" dediler. "Ne kadar
          kaldığınızı Rabbiniz daha iyi bilir. Paranızla birinizi şehre gönderin, sakın
          sizi kimseye duyurmasın" dediler.
        cid: 0
  - verse: 20
    segments:
      - text: >-
          "Zira onların sizden haberi olacak olursa, ya taşlayarak öldürürler veya
          dinlerine döndürürler ve bu takdirde asla kurtulamazsınız."
        cid: 0
  - verse: 21
    segments:
      - text: >-
          Böylece, Allah'ın sözünün gerçek olduğunu ve kıyametin kopmasından şüphe
          edilemeyeceğini bilmeleri için, insanların onları bulmalarını sağladık. Nitekim
          halk, bunların hakkında çekişip duruyor: "Onların mağaralarının çevresine bir
          bina kurun" diyorlardı. Oysa, Rableri onları çok iyi bilir. Tartışmayı
          kazananlar: "Onların mağaralarının çevresinde mutlaka bir mescid kuracağız"
          dediler.
        cid: 0
  - verse: 22
    segments:
      - text: >-
          Karanlığa taş atar gibi, "Mağara ehli üçtür, dördüncüleri köpekleridir" derler,
          yahut, "Beştir, altıncıları köpekleridir" derler, yahut "Yedidir, sekizincileri
          köpekleridir" derler. De ki: "Onların sayısını en iyi bilen Rabbim'dir. Onları
          pek az kimseden başkası bilmez." Bunun için, onlar hakkında, bu kısaca
          anlatılanın dışında, kimseyle tartışma ve onlar hakkında kimseden bir şey sorma.
        cid: 0
