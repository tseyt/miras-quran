  - verse: 13
    segments:
      - text: >-
          Onların olayını sana Biz gerçek olarak anlatıyoruz: Onlar Rablerine inanmış
          birkaç gençti. Onların hidayetlerini artırmış ve kalblerini pekiştirmiştik.
          Durup, şöyle demişlerdi: "Rabbimiz göklerin ve yerin Rabbidir, O'nu bırakıp
          başka bir tanrıya yalvarmayız, yoksa and olsun ki, batıl söz söylemiş oluruz. Şu
          bizim milletimiz, Allah'ı bırakıp O'ndan başka tanrılar edindiler. Onların
          gerçek olduğuna apaçık delil getirmeleri gerekmez mi? Allah'a karşı yalan
          uydurandan daha zalim kimdir?"
