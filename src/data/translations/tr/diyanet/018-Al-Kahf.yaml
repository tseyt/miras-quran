  - verse: 5
    segments:
      - text: >-
          Allah'ın çocuk edindiğine dair ne kendilerinin ve ne de babalarının bir bilgisi
          vardır. Ağızlarından çıkan söz ne büyük iftiradır. Onlar yalnız ve yalnız yalan
          söylerler.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Bu söze inanmayanların ardından üzülerek nerdeyse kendini mahvedeceksin!
        cid: 0
  - verse: 7
    segments:
      - text: >-
          İnsanların hangisinin daha iyi iş işlediğini ortaya koyalım diye, yeryüzünde
          olan şeyleri, yeryüzünün süsü yaptık.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Şüphesiz Biz, yeryüzünde olanları kupkuru bir toprak haline getirebiliriz.
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Yoksa sen Mağara ve Kitap ehlini şaşılacak ayetlerimizden mi zannettin?
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Birkaç genç mağaraya sığınmış: "Rabbimiz! Katından bize rahmet ver ve işimizde
          doğruyu göster, bizi başarılı kıl" demişlerdi.
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Mağaranın içinde onları yıllarca uyuttuk; sonra, iki taraftan hangisinin
          bekledikleri sonucu iyi hesaplamış olduğunu belirtmek için onları uyandırdık.
        cid: 0
  - verse: 12
    segments:
