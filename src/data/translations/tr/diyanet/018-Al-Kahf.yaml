surah_id: 18
language: tr
author: diyanet
verses:
  - verse: 1
    segments:
      - text: >-
          Hamd Allah'a mahsustur ki, kendi katından şiddetli bir baskını haber vermek ve
          yararlı iş yapan müminlere, içinde temelli kalacakları güzel bir mükafatı
          müjdelemek ve: "Allah çocuk edindi" diyenleri uyarmak için kuluna eğri bir taraf
          bırakmadığı dosdoğru Kitap'ı indirmiştir.
        cid: 0
