surah_id: 35
language: tr
author: diyanet
verses:
  - verse: 1
    segments:
      - text: >-
          Hamd, gökleri ve yeri yaratan, melekleri ikişer, üçer, dörder kanatlı elçiler
          kılan Allah'a mahsustur. Yaratmada dilediğini artırır. Doğrusu Allah, her şeye
          Kadir olandır.
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Allah'ın insanlara verdiği rahmeti önleyebilecek yoktur. O'nun önlediğini de
          ardından salıverecek yoktur. O, güçlü'dür, Hakim'dir.
        cid: 0
  - verse: 3
    segments:
      - text: >-
          Ey insanlar! Allah'ın size olan nimetini anın; sizi gökten ve yerden
          rızıklandıran Allah'tan başka bir yaratan var mıdır? O'ndan başka tanrı yoktur.
          Nasıl aldatılıp da döndürülürsünüz?
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Seni yalanlıyorlarsa bil ki senden önce de nice peygamberler yalanlanmıştır.
          Bütün işler Allah' a döndürülür.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Ey insanlar! Allah'ın verdiği söz şüphesiz gerçektir; dünya hayatı sizi
          aldatmasın. Allah'ın affına güvendirerek şeytan sizi ayartmasın.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Şeytan şüphesiz sizin düşmanınızdır; siz de onu düşman tutun; o, kendi
          taraftarlarını, çılgın alevli cehennem yaranı olmaya çağırır.
        cid: 0
  - verse: 7
    segments:
      - text: >-
          İnkar eden kimselere çetin azap vardır.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Kötü işi kendisine güzel gösterilip de onu güzel gören kimse, kötülüğü hiç
          işlemeyene benzer mi? Şüphesiz Allah dilediğini saptırır, dilediğini de doğru
          yola eriştirir. Artık onlara üzülerek kendini harabetme; Allah onların
          yaptıklarını şüphesiz bilir.
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Rüzgarları gönderip de bulutları yürüten Allah'tır. Biz bulutları ölü bir yere
          sürüp, onunla toprağı ölümünden sonra diriltiriz. İnsanları diriltmek de
          böyledir.
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Kudret isteyen kimse bilsin ki, kudret, bütünüyle Allah'ındır. Güzel sözler
          O'na yükselir, o sözleri de yararlı iş yükseltir. Kötülük yapmakta düzen
          kuranlara, onlara, çetin azap vardır. İşte bunların kurdukları düzenler boşa
          çıkar.
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Allah sizi topraktan, sonra nutfeden yaratmış, sonra da sizi çiftler halinde
          varetmiştir. Dişinin gebe kalması ve doğurması, ancak O'nun bilgisiyledir. Ömrü
          uzun olanın çok yaşaması ve ömürlerin azalması şüphesiz Kitap'dadır. Doğrusu bu
          Allah'a kolaydır.
        cid: 0
  - verse: 12
    segments:
      - text: >-
          İki deniz bir değildir. Birinin suyu tatlı ve kolay içimlidir; diğeri tuzlu ve
          acıdır. Her birinden taze balık eti yersiniz; takındığınız süsler çıkarırsınız;
          Allah'ın lütfuyla rızık aramanız için gemilerin onu yararak gittiğini görürsün.
          Belki artık şükredersiniz.
        cid: 0
  - verse: 13
    segments:
      - text: >-
          Allah, geceyi gündüze katar, gündüzü geceye katar; belirli bir süre içinde
          hareket eden güneş ve ayı buyruk altına almıştır. İşte bu, Rabbiniz olan
          Allah'tır, hükümranlık O'nundur. O'nu bırakıp taptıklarınız, bir çekirdek
          kabuğuna bile sahip değillerdir.
        cid: 0
  - verse: 14
    segments:
      - text: >-
          Onları çağırırsanız, çağrınızı işitmezler; işitmiş olsalar bile size cevap
          veremezler; ama kıyamet günü sizin ortak koşmanızı inkar ederler. Herşeyden
          haberdar olan Allah gibi, sana kimse haber vermez.
        cid: 0
  - verse: 15
    segments:
      - text: >-
          Ey insanlar! Siz Allah'a muhtaçsınız, Allah ise müstağnidir, övülmeğe layık
          olandır.
        cid: 0
  - verse: 16
    segments:
      - text: >-
          Dilerse sizi yokeder, yeniden başkalarını yaratır.
        cid: 0
  - verse: 17
    segments:
      - text: >-
          Bu, Allah'a göre zor değildir.
        cid: 0
  - verse: 18
    segments:
      - text: >-
          Günahkar kimse diğerinin günahını çekmez. Günah yükü ağır olan kimse, onun
          taşınmasını istese, yakını olsa bile, yükünden birşey taşınmaz. Sen ancak,
          görmediği halde Rablerinden korkanları, namazı kılanları uyarırsın. Kim
          arınırsa, ancak kendisi için arınmış olur; dönüş ancak Allah'adır.
        cid: 0
  - verse: 19
    segments:
      - text: >-
          Kör ile gören, karanlıklar ile ışık ve gölgelikle sıcaklık bir değildir.
        cid: 0
  - verse: 20
    segments:
      - text: >-
          Kör ile gören, karanlıklar ile ışık ve gölgelikle sıcaklık bir değildir.
        cid: 0
  - verse: 21
    segments:
      - text: >-
          Kör ile gören, karanlıklar ile ışık ve gölgelikle sıcaklık bir değildir.
        cid: 0
  - verse: 22
    segments:
      - text: >-
          Dirilerle ölüler de bir değildir. Doğrusu Allah, dilediği kimseye işittirir.
          Sen, kabirlerde olanlara işittiremezsin.
        cid: 0
  - verse: 23
    segments:
      - text: >-
          Sen sadece bir uyarıcısın.
        cid: 0
  - verse: 24
    segments:
      - text: >-
          Şüphesiz Biz seni, müjdeci ve uyarıcı olarak, gerçekle gönderdik. Geçmiş her
          ümmet içinde de mutlaka bir uyarıcı bulunagelmiştir.
        cid: 0
  - verse: 25
    segments:
      - text: >-
          Eğer seni yalancı sayıyorlarsa bil ki, onlardan öncekiler de yalanlamışlardı.
          Peygamberleri onlara belgeler, sayfalar ve nurlu kitaplar getirmişlerdi.
        cid: 0
  - verse: 26
    segments:
      - text: >-
          Sonra Ben, inkar edenleri yakaladım. Beni inkar etmek nasıl olur?
        cid: 0
  - verse: 27
    segments:
      - text: >-
          Allah'ın gökten su indirdiğini görmez misin? Biz onunla türlü türlü renkte
          ürünler yetiştirmiş; dağlarda da beyaz, kırmızı, siyah ve türlü renkte yollar
          varetmişizdir.
        cid: 0
  - verse: 28
    segments:
      - text: >-
          İnsanlar, yerde yürüyenler ve davarlar da böyle türlü türlü renktedirler.
          Allah'ın kulları arasında O'ndan korkan, ancak bilginlerdir. Doğrusu Allah
          güçlüdür, bağışlayandır.
        cid: 0
  - verse: 29
    segments:
      - text: >-
          Allah'ın Kitap'ına uyanlar, namazı kılanlar, kendilerine verdiğimiz rızıktan
          gizli ve açık sarfedenler, tükenmeyecek bir kazanç umabilirler.
        cid: 0
  - verse: 30
    segments:
      - text: >-
          Çünkü Allah bu kimselerin ecirlerini tam verir ve lütfu ile arttırır. Doğrusu
          O, bağışlayandır, şükrün karşılığını bol bol verendir.
        cid: 0
  - verse: 31
    segments:
      - text: >-
          Bu, sana vahyettiğimiz, öncekileri doğrulayan gerçek Kitap'dır. Allah şüphesiz
          kullarından haberdardır, görendir.
        cid: 0
  - verse: 32
    segments:
      - text: >-
          Sonra bu Kitap'ı kullarımızdan seçtiğimiz kimselere miras bırakmışızdır.
          Onlardan kimi kendine yazık eder, kimi orta davranır, kimi de, Allah'ın izniyle,
          iyiliklere koşar. İşte büyük lütuf budur.
        cid: 0
  - verse: 33
    segments:
      - text: >-
          Bunlar, Adn cennetlerine girerler. Orada altın bilezikler ve incilerle
          süslenirler, oradaki elbiseleri de ipektir.
        cid: 0
  - verse: 34
    segments:
      - text: >-
          Derler ki: "Bizden üzüntüyü gideren Allah'a hamdolsun. Doğrusu Rabbimiz
          bağışlayandır, şükrün karşılığını verendir."
        cid: 0
  - verse: 35
    segments:
      - text: >-
          "Bizi lütfuyla, temelli kalınacak cennete O yerleştirdi. Orada bize ne bir
          yorgunluk gelecek ve ne de usanç gelecektir."
        cid: 0
  - verse: 36
    segments:
      - text: >-
          İnkar edenlere cehennem ateşi vardır. Ölümlerine hükmedilmez ki ölsünler;
          kendilerinden cehennemin azabı da hafifletilmez. Her inkarcıyı böylece
          cezalandırırız.
        cid: 0
  - verse: 37
    segments:
      - text: >-
          Orada; "Rabbimiz! Bizi çıkar; yaptığımızdan başka, yararlı iş işleyelim" diye
          bağrışırlar. O zaman onlara şöyle deriz: "Öğüt alacak kişinin öğüt alabileceği
          kadar bir süre sizi yaşatmadık mi? Size uyarıcı da gelmişti. Artık azabı
          tadınız, zalimlerin yardımcısı olmaz."
        cid: 0
  - verse: 38
    segments:
      - text: >-
          Allah şüphesiz, göklerin ve yerin gaybını bilir. Doğrusu O kalplerde olanı
          bilendir.
        cid: 0
  - verse: 39
    segments:
      - text: >-
          Sizleri yeryüzüne de hakim kılan O'dur. İnkar edenin inkarı kendi aleyhinedir.
          İnkarcıların inkarı, Rableri katında yalnız kendilerine olan gazabı arttırır.
          İnkarcıların inkarı, hüsrandan başka birşey arttırmaz.
        cid: 0
  - verse: 40
    segments:
      - text: >-
          De ki: "Allah'ı bırakıp da taptığınız putlarınıza hiç baktınız mı? Bana
          gösterin, onlar yerden hangi şeyi yarattılar?" Yoksa onların Allah'la ortaklığı
          göklerde midir? Yoksa Biz onlara kitap verdik de ondaki delillere mi dayanırlar?
          Hayır; zalimler, birbirlerine sadece aldatıcı söz söylerler.
        cid: 0
  - verse: 41
    segments:
      - text: >-
          Doğrusu, zeval bulmasın diye gökleri ve yeri tutan Allah'tır. Eğer onlar zevale
          uğrarsa O'ndan başka, and olsun ki onları kimse tutamaz. O, şüphesiz Halim'dir,
          bağışlayandır.
        cid: 0
  - verse: 42
    segments:
      - text: >-
          Kendilerine bir uyarıcı gelince, ümmetler içinde en doğru yolda gidenlerden
          biri olacaklarına, and olsun ki, bütün güçleriyle Allah'a yemin etmişlerdi;
          fakat kendilerine uyarıcının gelmesi, yeryüzünde büyüklük taslamak ve kötü düzen
          kurmak ile uğraştıklarından sadece nefretlerini arttırdı. Oysa pis pis kurulan
          kötü tuzağa ancak sahibi düşer. Öncekilere uygulanagelen yasayı görmezler mi?
          Sen Allah'ın yasasında bir değişiklik bulamazsın. Sen Allah'ın yasasında bir
          başkalaşma da bulamazsın.
        cid: 0
  - verse: 43
    segments:
      - text: >-
          Kendilerine bir uyarıcı gelince, ümmetler içinde en doğru yolda gidenlerden
          biri olacaklarına, and olsun ki, bütün güçleriyle Allah'a yemin etmişlerdi;
          fakat kendilerine uyarıcının gelmesi, yeryüzünde büyüklük taslamak ve kötü düzen
          kurmak ile uğraştıklarından sadece nefretlerini arttırdı. Oysa pis pis kurulan
          kötü tuzağa ancak sahibi düşer. Öncekilere uygulanagelen yasayı görmezler mi?
          Sen Allah'ın yasasında bir değişiklik bulamazsın. Sen Allah'ın yasasında bir
          başkalaşma da bulamazsın.
        cid: 0
  - verse: 44
    segments:
      - text: >-
          Yeryüzünde gezip, kendilerinden öncekilerin sonlarının nasıl olduğunu görmezler
          mi? Onlar, kendilerinden daha kuvvetliydiler. Göklerde ve yerde Allah'ı aciz
          bırakabilecek yoktur. Şüphesiz O bilendir, Kadir olandır.
        cid: 0
  - verse: 45
    segments:
      - text: >-
          Allah insanları işlediklerine karşılık hemen yakalayıverseydi, yeryüzünde bir
          canlı bırakmaması gerekirdi. Ama onları belli bir süreye kadar erteler. Süreleri
          gelince gereğini yapar. Doğrusu Allah kullarını görmektedir.
        cid: 0