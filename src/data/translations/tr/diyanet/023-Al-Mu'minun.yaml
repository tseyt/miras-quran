language: tr
author: diyanet
verses:
  - verse: 1
    segments:
      - text: >-
          Müminler saadete ermişlerdir.
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Onlar namazda huşu içindedirler.
        cid: 0
  - verse: 3
    segments:
      - text: >-
          Onlar boş şeylerden yüz çevirirler.
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Onlar zekatlarını verirler.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Onlar, eşleri ve cariyeleri dışında, mahrem yerlerini herkesten korurlar.
          Doğrusu bunlar yerilemezler.
        cid: 0
