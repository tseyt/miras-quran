surah_id: 66
language: tr
author: diyanet
verses:
  - verse: 1
    segments:
      - text: >-
          Eşlerinin rızasını gözeterek, Allah'ın sana helal kıldığı şeyi niçin kendine
          yasak ediyorsun? Allah bağışlayandır, acıyandır.
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Allah şüphesiz size, yeminlerinizi keffaretle geri almanızı meşru kılmıştır.
          Allah sizin dostunuzdur. O, bilendir, Hakim'dir.
        cid: 0
  - verse: 3
    segments:
      - text: >-
          Peygamber, eşlerinden birine gizlice bir söz söylemişti. O, bunu Peygamberin
          diğer bir eşine haber verince, Allah da Peygambere durumu bildirmiş, o da bir
          kısmını yüzüne vurmuş bir kısmını yüzüne vurmaktan geri durmuştu. Eşine, gizlice
          söylediği şeyibaşkasına nakletmiş olduğunu bildirince, eşi: "Bunu sana kim haber
          verdi?" demiş, o da: "Bana, herşeyi bilen ve herşeyden haberdar olan Allah haber
          verdi" demişti.
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Ey Peygamber'in eşleri! Eğer ikiniz de Allah'a tevbe ederseniz, kaymış olan
          kalpleriniz düzelmiş olur. Eğer eşinizin aleyhinde yardımlaşarak bir şey yapmağa
          kalkarsanız, bilin ki Allah onun dostu, bundan başka Cebrail, iyi müminler ve
          melekler de yardımcısıdır.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Ey Peygamber'in eşleri! Eğer o sizi boşarsa, Rabbi ona; sizden daha iyi olan,
          kendini Allah'a veren, inanan, boyun eğen, tevbe eden, kulluk eden, oruç tutan,
          dul ve bakire eşler verebilir.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Ey inananlar! Kendinizi ve çoluk çocuğunuzu cehennem ateşinden koruyun; onun
          yakıtı, insanlar ve taşlardır; görevlileri, Allah'ın kendilerine verdiği
          emirlere baş kaldırmayan, kendilerine buyrulanları yerine getiren pek haşin
          meleklerdir.
        cid: 0
  - verse: 7
    segments:
      - text: >-
          "Ey inkar edenler! Bugün özür beyan etmeyin, ancak işlediklerinizin karşılığını
          görmektesiniz" denir.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Ey inananlar! Yürekten tevbe ederek Allah'a dönün ki, Rabbiniz kötülüklerinizi
          örtsün, sizi, içlerinden ırmaklar akan cennetlere koysun. Allah'ın Peygamberini
          ve onunla beraber olan müminleri utandırmayacağı o gün, ışıkları önlerinde ve
          defterleri sağlarından verilmiş olarak yürürler ve: "Rabbimiz! Işığımızı
          tamamla, bizi bağışla, doğrusu Sen herşeye Kadir'sin" derler.
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Ey Peygamber! İnkarcılarla ve ikiyüzlülerle savaş; onlara karşı sert davran.
          Onların varacakları yer cehennemdir, ne kötü dönüştür!...
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Allah, inkar edenlere, Nuh'un karısıyla Lut'un karısını misal gösterir: Onlar,
          kullarımızdan iki iyi kulun nikahı altında iken onlara karşı hainlik edip
          inkarlarını gizlemişlerdi de iki peygamber Allah'tan gelen azabı onlardan
          savamamışlardı. O iki kadına: "Cehenneme girenlerle beraber siz de girin" dendi.
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Allah, inanlara Firavun'un karısını misal gösterir: O: "Rabbim! Katından bana
          cennette bir ev yap; beni Firavun'dan ve onun işlediklerinden kurtar; beni zalim
          milletten kurtar" demişti.
        cid: 0
  - verse: 12
    segments:
      - text: >-
          Mahrem yerini korumuş olan İmran kızı Meryem de bir misaldir. Ona ruhumuzdan
          üflemiştik; Rabbinin sözlerini ve kitablarını tasdik etmişti; o, Bize gönülden
          itaat edenlerdendi.
        cid: 0