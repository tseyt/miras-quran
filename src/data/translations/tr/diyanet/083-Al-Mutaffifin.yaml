surah_id: 83
language: tr
author: diyanet
verses:
  - verse: 1
    segments:
      - text: >-
          İnsanlardan, kendileri bir şeyi ölçerek aldıkları zaman tam alan; ama onlara
          bir şeyi ölçüp tartarak verdiklerinde eksik tutan kimselerin, vay haline!
        cid: 0
