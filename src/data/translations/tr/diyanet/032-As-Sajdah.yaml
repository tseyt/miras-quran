surah_id: 32
language: tr
author: diyanet
verses:
  - verse: 1
    segments:
      - text: "Elif, Lam, Mim."
        cid: 0
  - verse: 2
    segments:
      - text: "Şüphe götürmeyen Kitap, Alemlerin Rabbi'nin indirdiğidir."
        cid: 0
  - verse: 3
    segments:
      - text: "&quot;Onu peygamberin kendisi uydurdu&quot; diyorlar, öyle mi? Hayır; O, senden önce peygamber gönderilmemiş olan bir milleti uyarman için sana Rabbinden gelen bir gerçektir. Belki artık doğru yolu bulurlar."
        cid: 0
  - verse: 4
    segments:
      - text: "Gökleri, yeri ve ikisinin arasında bulunanları altı günde yaratan, sonra arşa hükmeden Allah'tır. O'ndan başka bir dostunuz ve şefaatçiniz yoktur. Düşünmüyor musunuz?"
        cid: 0
  - verse: 5
    segments:
      - text: "Gökten yere kadar, olan bütün işleri Allah düzenler, sonra, işler sizin hesabınıza göre bin yıl kadar tutan bir gün içinde O'na yükselir."
        cid: 0
  - verse: 6
    segments:
      - text: "O, görülmeyeni de görüleni de bilendir, güçlüdür, merhametlidir."
        cid: 0
  - verse: 7
    segments:
      - text: "Yarattığı her şeyi güzel yaratan, insanı başlangıçta çamurdan yaratan, sonra onun soyunu, bayağı bir suyun özünden yapan, sonra onu şekillendirip ruhundan ona üfleyen Allah'tır. Size kulaklar, gözler, kalbler verilmiştir. Öyleyken, pek az şükrediyorsunuz."
        cid: 0
  - verse: 8
    segments:
      - text: "Yarattığı her şeyi güzel yaratan, insanı başlangıçta çamurdan yaratan, sonra onun soyunu, bayağı bir suyun özünden yapan, sonra onu şekillendirip ruhundan ona üfleyen Allah'tır. Size kulaklar, gözler, kalbler verilmiştir. Öyleyken, pek az şükrediyorsunuz."
        cid: 0
  - verse: 9
    segments:
      - text: "Yarattığı her şeyi güzel yaratan, insanı başlangıçta çamurdan yaratan, sonra onun soyunu, bayağı bir suyun özünden yapan, sonra onu şekillendirip ruhundan ona üfleyen Allah'tır. Size kulaklar, gözler, kalbler verilmiştir. Öyleyken, pek az şükrediyorsunuz."
        cid: 0
  - verse: 10
    segments:
      - text: "Puta tapanlar: &quot;Toprağa karışıp yok olduktan sonra yeniden mi yaratılacağız?&quot; derler. Evet; onlar, Rab'lerine kavuşmayı inkar edenlerdir."
        cid: 0
  - verse: 11
    segments:
      - text: "De ki: &quot;Size vekil kılınan ölüm meleği canınızı alacak, sonra Rabbinize döndürüleceksiniz.&quot;"
        cid: 0
  - verse: 12
    segments:
      - text: "Suçluları Rablerinin huzurunda, başları öne eğilmiş olarak: &quot;Rabbimiz! Gördük, dinledik, artık bizi dünyaya geri çevir de iyi iş işleyelim; doğrusu kesin olarak inandık&quot; derlerken bir görsen!"
        cid: 0
  - verse: 13
    segments:
      - text: "Biz dilesek herkese hidayet verirdik, fakat cehennemi tamamen cin ve insanlarla dolduracağıma dair Benden söz çıkmıştır."
        cid: 0
  - verse: 14
    segments:
      - text: "&quot;Bugüne kavuşmayı unutmanızın karşılığını görün; doğrusu Biz de sizi unuttuk, yaptıklarınıza karşılık ebedi azabı tadın&quot; deriz."
        cid: 0
  - verse: 15
    segments:
      - text: "Ayetlerimize ancak, kendilerine hatırlatıldığı zaman secdeye kapananlar, büyüklük taslamayarak Rablerini överek yüceltenler, vücudlarını yataklardan uzak tutup korkarak ve umarak Rablerine yalvaranlar ve verdiğimiz rızıklardan sarfedenler inanır."
        cid: 0
  - verse: 16
    segments:
      - text: "Ayetlerimize ancak, kendilerine hatırlatıldığı zaman secdeye kapananlar, büyüklük taslamayarak Rablerini överek yüceltenler, vücudlarını yataklardan uzak tutup korkarak ve umarak Rablerine yalvaranlar ve verdiğimiz rızıklardan sarfedenler inanır."
        cid: 0
  - verse: 17
    segments:
      - text: "Yaptıklarına karşılık onlar için saklanan müjdeyi kimse bilmez."
        cid: 0
  - verse: 18
    segments:
      - text: "İnanan kimse yoldan çıkmış kimseye benzer mi? Bunlar bir olamazlar."
        cid: 0
  - verse: 19
    segments:
      - text: "İnanıp yararlı iş işleyenlere gelince, onların yaptıklarına karşılık, varacakları cennet konakları vardır."
        cid: 0
  - verse: 20
    segments:
      - text: "Ama yoldan çıkanların, işte onların varacağı yer ateştir. Oradan çıkmak isteyişlerinin her defasında geri çevrilirler ve onlara: &quot;Yalanlayıp, durduğunuz ateşin azabını tadın&quot; denir."
        cid: 0
  - verse: 21
    segments:
      - text: "Belki yollarından dönerler diye and olsun onlara büyük azabdan önce dünya azabından tattırırız."
        cid: 0
  - verse: 22
    segments:
      - text: "Rabbinin ayetleri kendisine hatırlatılıp da onlardan yüz çeviren kimseden daha zalim var mıdır? Şüphesiz suçlulardan öç alacağız."
        cid: 0
  - verse: 23
    segments:
      - text: "And olsun ki Musa'ya Kitap verdik; Sakın sen ona kavuşacağından şüphe etme. Musa'ya verdiğimizi İsrailoğullarına doğruluk rehberi kıldık."
        cid: 0
  - verse: 24
    segments:
      - text: "Sabredip ayetlerimize kesin olarak inanmalarından ötürü, aralarından, onları buyruğumuzla doğru yola götüren önderler yaptık."
        cid: 0
  - verse: 25
    segments:
      - text: "Muhakkak ki Rabbin ayrılığa düştükleri şeylerde kıyamet günü aralarında hükmedecektir."
        cid: 0
  - verse: 26
    segments:
      - text: "Şimdi yurtlarında gezip dolaştıkları, kendilerinden önceki nice nesilleri yok etmiş olmamız onları doğru yola sevketmez mi? Bunlarda şüphesiz ibretler vardır. Dinlemezler mi?"
        cid: 0
  - verse: 27
    segments:
      - text: "Kuru yerlere suyu gönderip onunla hayvanlarının ve kendilerinin yedikleri ekinleri çıkardığımızı görmezler mi? Görmüyorlar mı?"
        cid: 0
  - verse: 28
    segments:
      - text: "&quot;Doğru söylüyorsanız bildirin bu hüküm ne zaman verilecektir?&quot; derler."
        cid: 0
  - verse: 29
    segments:
      - text: "De ki: &quot;Hükmün verileceği gün inkarcılara ne inanmaları fayda verir ve ne de ertelenirler.&quot;"
        cid: 0
  - verse: 30
    segments:
      - text: "Onları bırak, bekle; zaten onlar da senin akıbetini beklemektedirler."
        cid: 0