        cid: 0
  - verse: 19
    segments:
      - text: >-
          Onlara şöyle denir: "İşlediklerinizden ötürü, dizi dizi tahtlara yaslanarak
          afiyetle yiyin için." Onlara, ceylan gözlü eşler veririz.
        cid: 0
  - verse: 20
    segments:
      - text: >-
          Onlara şöyle denir: "İşlediklerinizden ötürü, dizi dizi tahtlara yaslanarak
          afiyetle yiyin için." Onlara, ceylan gözlü eşler veririz.
        cid: 0
  - verse: 21
    segments:
      - text: >-
          İnanan, soyları da inançta kendilerine uyan kimselere soylarını da katarız.
          Onların işlediklerinden hiçbir şey eksiltmeyiz. Herkes kazancına bağlıdır.
        cid: 0
  - verse: 22
    segments:
      - text: >-
          Cennette olanlara diledikleri meyve ve etten bol bol veririz.
        cid: 0
  - verse: 23
    segments:
      - text: >-
          Orada kadeh tokuştururlar; fakat bunda ne bir saçmalama, ne de bir günaha girme
          vardır.
        cid: 0
  - verse: 24
    segments:
      - text: >-
          Sedefteki inciler gibi olan gençler yanlarında dolaşırlar.
        cid: 0
  - verse: 25
    segments:
      - text: >-
          Birbirlerine dönüp soruşurlar:
        cid: 0
  - verse: 26
    segments:
      - text: >-
          "Doğrusu bundan önce ailemizin yanında bile korku içindeydik; Allah lütfedip
          bizi kavurucu azabdan korudu; doğrusu bundan önce de O'na yalvarıyorduk;
          şüphesiz O, iyilik yapandır, acıyandır" derler.
        cid: 0
  - verse: 27
    segments:
      - text: >-
