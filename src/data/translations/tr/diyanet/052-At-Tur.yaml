surah_id: 52
language: tr
author: diyanet
verses:
  - verse: 1
    segments:
      - text: >-
          Tura, yayılmış ince deri üzerine satır satır dizilmiş Kitap'a, mamur bir ev
          olan Kabe'ye, yükseltilmiş tavan gibi göğe, kaynayacak denize and olsun ki,
          Rabbinin azabı hiç şüphesiz gelecektir. Onu savacak yoktur.
        cid: 0
