        cid: 0
  - verse: 29
    segments:
      - text: >-
          Öğüt ver; Rabbinin nimetiyle sen, ne kahinsin ne de delisin.
        cid: 0
  - verse: 30
    segments:
      - text: >-
          Yoksa senin için şöyle mi derler: "Şairdir, zamanın onun aleyhine dönmesini
          gözlüyoruz."
        cid: 0
  - verse: 31
    segments:
      - text: >-
          De ki: "Gözleyin, doğrusu ben de sizinle beraber gözlemekteyim."
        cid: 0
  - verse: 32
    segments:
      - text: >-
          Bunu onlara akılları mı buyuruyor? Yoksa onlar azgın bir millet midirler?
        cid: 0
  - verse: 33
    segments:
      - text: >-
          Yahut: "Onu kendi uydurdu" diyorlar öyle mi? Hayır, inanmıyorlar.
        cid: 0
  - verse: 34
    segments:
      - text: >-
          Eğer iddialarında samimi iseler Kuran'ın benzeri bir söz meydana getirsinler.
        cid: 0
  - verse: 35
    segments:
      - text: >-
          Onlar, yaratan olmaksızın mı yaratıldılar yoksa yaratanlar kendileri midir?
        cid: 0
  - verse: 36
    segments:
      - text: >-
          Yoksa gökleri ve yeri kendileri mi yarattılar? Hayır, Allah'a kesin olarak
          inanmıyorlar.
        cid: 0
  - verse: 37
    segments:
      - text: >-
          Yoksa Rabbinin hazineleri onların yanında mıdır? Yoksa onlar mı işe
          hakimdirler?
        cid: 0
  - verse: 38
    segments:
      - text: >-
          Yoksa, üzerine çıkıp vahiy dinledikleri bir merdivenleri mi var? Öyleyse,
          dinleyenleri açık bir delil getirsin.
        cid: 0
  - verse: 39
    segments:
      - text: >-
          Demek kızlar Allah'ın, oğullar sizin öyle mi?
        cid: 0
  - verse: 40
    segments:
      - text: >-
          Yahut sen onlardan bir ücret istiyorsun da onlar ağır bir borç altında mı
          kalıyorlar?
        cid: 0
  - verse: 41
    segments:
      - text: >-
          Veya, görülmeyeni bilmek kendilerine aittir de, onlar mı yazıyorlar?
        cid: 0
  - verse: 42
    segments:
      - text: >-
          Yoksa bir tuzak mı kurmak istiyorlar? Ama o tuzağa yakalanacak olanlar inkar
          edenlerdir.
        cid: 0
  - verse: 43
    segments:
      - text: >-
          Yoksa Allah'tan başka bir tanrıları mı vardır? Allah, onların ortak
          koşmalarından münezzehtir.
        cid: 0
  - verse: 44
    segments:
      - text: >-
          Gökten azap olarak düşen bir parça görseler: "Bulut kümesidir" derler.
        cid: 0
  - verse: 45
    segments:
      - text: >-
          Çarpılacakları güne erişmelerine kadar onları bırak.
        cid: 0
  - verse: 46
    segments:
      - text: >-
          O gün, düzenleri kendilerine bir fayda vermez; yardım da görmezler.
        cid: 0
  - verse: 47
    segments:
      - text: >-
          Zulmedenlere, şüphesiz, bundan başka da azap vardır; fakat onların çoğu
          bilmezler.
        cid: 0
  - verse: 48
    segments:
      - text: >-
          Rabbinin hükmü yerine gelinceye kadar sabret; doğrusu sen, Bizim nezaretimiz
          altındasın; kalkarken Rabbini överek tesbih et;
        cid: 0
  - verse: 49
    segments:
      - text: >-
          Geceleyin ve yıldızlar kaybolurken de O'nu tesbih et.
        cid: 0