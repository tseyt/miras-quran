        cid: 0
  - verse: 17
    segments:
      - text: >-
          Allah'a karşı gelmekten sakınanlar, şüphesiz, cennetlerde ve Rablerinin
          kendilerine verdikleriyle zevk duyarak nimetler içindedirler. Rableri onları
          cehennem azabından korumuştur.
        cid: 0
  - verse: 18
    segments:
      - text: >-
