  - verse: 9
    segments:
      - text: >-
          Göğün sarsıldıkça sarsılacağı, dağların yürüdükçe yürüyeceği gün; işte o gün,
          daldıkları yerde eğlenip oyalanarak kıyameti yalanlayanlara yazık olacak!
        cid: 0
