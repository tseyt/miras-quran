  - verse: 15
    segments:
      - text: >-
          Bu bir büyü müdür, yoksa hala görmez misiniz? Girin oraya, sabretseniz de
          sabretmeseniz de artık birdir; ancak işlediklerinizin karşılığını görüyorsunuz"
          denir.
        cid: 0
