surah_id: 88
language: tr
author: diyanet
verses:
  - verse: 1
    segments:
      - text: >-
          Her şeyi kaplayacak kıyametin haberi sana gelmedi mi?
        cid: 0
  - verse: 2
    segments:
      - text: >-
          O gün bir takım yüzler zillete bürünmüştür.
        cid: 0
  - verse: 3
    segments:
      - text: >-
          Zor işler altında bitkin düşmüştür.
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Yakıcı ateşe yaslanırlar.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Kızgın bir kaynaktan içirilirler.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Semirtmeyen, açlığı gidermeyen kötü kokulu (kuru) bir dikenden başka
          yiyecekleri yoktur.
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Semirtmeyen, açlığı gidermeyen kötü kokulu (kuru) bir dikenden başka
          yiyecekleri yoktur.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          İnanmış olanların yüzleri, o gün, pırıl pırıldır.
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Yaptıklarından hoşnuddurlar.
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Yüksek bir cennettedirler.
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Orada boş söz işitmezler.
        cid: 0
  - verse: 12
    segments:
      - text: >-
          Orada akan kaynak vardır.
        cid: 0
  - verse: 13
    segments:
      - text: >-
          Orada, yükseltilmiş tahtlar vardır.
        cid: 0
  - verse: 14
    segments:
      - text: >-
          Yerleştirilmiş kaseler,
        cid: 0
  - verse: 15
    segments:
      - text: >-
          Sıra sıra yastıklar,
        cid: 0
  - verse: 16
    segments:
      - text: >-
          Serilmiş, yumuşak tüylü halılar vardır.
        cid: 0
  - verse: 17
    segments:
      - text: >-
          Bu insanlar, devenin nasıl yaratıldığına, göğün nasıl yükseltildiğine, dağların
          nasıl dikildiğine, yerin nasıl yayıldığına bir bakmazlar mı?
        cid: 0
