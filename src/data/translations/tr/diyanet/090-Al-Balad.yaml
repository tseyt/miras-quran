        cid: 0
  - verse: 3
    segments:
      - text: "Doğurana ve doğurduğuna and olsun ki;"
        cid: 0
  - verse: 4
    segments:
      - text: "İnsanoğlunu, zorluklara katlanacak şekilde yarattık."
        cid: 0
  - verse: 5
    segments:
      - text: "İnsanoğlu, kendisine kimsenin güç yetiremeyeceğini mi sanıyor?"
        cid: 0
  - verse: 6
    segments:
      - text: "&quot;Yığın yığın mal tüketmişimdir&quot; diyor."
        cid: 0
  - verse: 7
    segments:
      - text: "O, kimsenin kendisini görmediğini mi zannediyor?"
        cid: 0
  - verse: 8
    segments:
      - text: "Biz onun için iki göz, bir dil ve iki dudak var etmedik mi?"
        cid: 0
  - verse: 9
    segments:
      - text: "Biz onun için iki göz, bir dil ve iki dudak var etmedik mi?"
        cid: 0
  - verse: 10
    segments:
      - text: "Biz ona eğri ve doğru iki yolu da göstermedik mi?"
        cid: 0
  - verse: 11
    segments:
      - text: "Ama o, zor geçidi aşmaya girişemedi."
        cid: 0
  - verse: 12
    segments:
      - text: "O zor geçidin ne olduğunu sen bilir misin?"
        cid: 0
  - verse: 13
    segments:
      - text: "O geçit, bir köle ve esir azadetmek,"
        cid: 0
  - verse: 14
    segments:
      - text: "Yahut, açlık gününde, yakını olan bir öksüzü, yahut toprağa serilmiş bir yoksulu doyurmaktır."
        cid: 0
