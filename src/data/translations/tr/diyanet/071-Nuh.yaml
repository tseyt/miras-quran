        cid: 0
  - verse: 5
    segments:
      - text: "Nuh dedi ki: &quot;Rabbim! Doğrusu ben, milletimi gece gündüz çağırdım.&quot;"
        cid: 0
  - verse: 6
    segments:
      - text: "&quot;Fakat benim çağırmam, sadece benden uzaklıklarını artırdı.&quot;"
        cid: 0
  - verse: 7
    segments:
      - text: "&quot;Doğrusu ben Senin onları bağışlaman için kendilerini her çağırışımda, parmaklarını kulaklarına tıkadılar, elbiselerine büründüler, direndiler, büyüklendikçe büyüklendiler.&quot;"
        cid: 0
  - verse: 8
    segments:
      - text: "&quot;Sonra, doğrusu ben onları açıkça çağırdım.&quot;"
        cid: 0
  - verse: 9
    segments:
      - text: "&quot;Sonra onlara açıktan açığa, gizliden gizliye de söyledim.&quot;"
        cid: 0
  - verse: 10
    segments:
      - text: "Dedim ki: &quot;Rabbinizden bağışlanma dileyin; doğrusu O, çok bağışlayandır. Size gökten bol bol yağmur indirsin.&quot;"
