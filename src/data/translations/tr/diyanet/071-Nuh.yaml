surah_id: 71
language: tr
author: diyanet
verses:
  - verse: 1
    segments:
      - text: >-
          "Milletine can yakıcı bir azap gelmezden önce onları uyar" diye Nuh'u milletine
          gönderdik.
        cid: 0
  - verse: 2
    segments:
      - text: >-
          O da şöyle söyledi: "Ey Milletim! Şüphesiz ben, size gönderilmiş apaçık bir
          uyarıcıyım."
        cid: 0
  - verse: 3
    segments:
      - text: >-
          "Allah'a kulluk edin; O'ndan sakının ve bana itaat edin ki Allah günahlarınızı
          size bağışlasın ve sizi belli bir süreye kadar ertelesin; doğrusu Allah'ın
          belirttiği süre gelince geri bırakılamaz; keşke bilseniz!"
        cid: 0
  - verse: 4
    segments:
      - text: >-
          "Allah'a kulluk edin; O'ndan sakının ve bana itaat edin ki Allah günahlarınızı
          size bağışlasın ve sizi belli bir süreye kadar ertelesin; doğrusu Allah'ın
          belirttiği süre gelince geri bırakılamaz; keşke bilseniz!"
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Nuh dedi ki: "Rabbim! Doğrusu ben, milletimi gece gündüz çağırdım."
        cid: 0
  - verse: 6
    segments:
      - text: >-
          "Fakat benim çağırmam, sadece benden uzaklıklarını artırdı."
        cid: 0
  - verse: 7
    segments:
      - text: >-
          "Doğrusu ben Senin onları bağışlaman için kendilerini her çağırışımda,
          parmaklarını kulaklarına tıkadılar, elbiselerine büründüler, direndiler,
          büyüklendikçe büyüklendiler."
        cid: 0
  - verse: 8
    segments:
      - text: >-
          "Sonra, doğrusu ben onları açıkça çağırdım."
        cid: 0
  - verse: 9
    segments:
      - text: >-
          "Sonra onlara açıktan açığa, gizliden gizliye de söyledim."
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Dedim ki: "Rabbinizden bağışlanma dileyin; doğrusu O, çok bağışlayandır. Size
          gökten bol bol yağmur indirsin."
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Dedim ki: "Rabbinizden bağışlanma dileyin; doğrusu O, çok bağışlayandır. Size
