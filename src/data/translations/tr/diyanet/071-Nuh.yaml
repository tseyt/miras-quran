surah_id: 71
language: tr
author: diyanet
verses:
  - verse: 1
    segments:
      - text: "&quot;Milletine can yakıcı bir azap gelmezden önce onları uyar&quot; diye Nuh'u milletine gönderdik."
        cid: 0
  - verse: 2
    segments:
      - text: "O da şöyle söyledi: &quot;Ey Milletim! Şüphesiz ben, size gönderilmiş apaçık bir uyarıcıyım.&quot;"
        cid: 0
  - verse: 3
    segments:
      - text: "&quot;Allah'a kulluk edin; O'ndan sakının ve bana itaat edin ki Allah günahlarınızı size bağışlasın ve sizi belli bir süreye kadar ertelesin; doğrusu Allah'ın belirttiği süre gelince geri bırakılamaz; keşke bilseniz!&quot;"
        cid: 0
  - verse: 4
    segments:
