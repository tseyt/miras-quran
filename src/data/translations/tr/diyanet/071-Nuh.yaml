      - text: >-
          "Sonra sizi oraya döndürür ve yine oradan çıkarır."
        cid: 0
  - verse: 19
    segments:
      - text: >-
          "Yeryüzünde dolaşabilmeniz, orada yollar ve geniş geçitlerden geçebilmeniz
