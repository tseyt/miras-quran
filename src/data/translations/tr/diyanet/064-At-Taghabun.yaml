surah_id: 64
language: tr
author: diyanet
verses:
  - verse: 1
    segments:
      - text: "Göklerde olanlar ve yerde bulunanlar Allah'ı tesbih ederler. Hükümranlık O'nundur, Övülmek O'na mahsustur. O herşeye Kadir'dir."
        cid: 0
  - verse: 2
    segments:
      - text: "Sizi yaratan O'dur; kiminiz inkarcı kiminiz mümindir. Allah yaptıklarınızı gören'dir."
        cid: 0
  - verse: 3
    segments:
      - text: "Gökleri ve yeri gerektiği gibi yaratmıştır. Size şekil vermiş ve şeklinizi güzel yapmıştır. Dönüş O'nadır."
        cid: 0
  - verse: 4
    segments:
      - text: "Göklerde ve yerde olanları bilir; gizlediklerinizi de açığa vurduklarınızı da bilir; Allah, kalblerde olanı da bilendir."
        cid: 0
  - verse: 5
    segments:
      - text: "Daha önce inkar edip de, inkarlarının karşılığını tadan kimselerin haberi size gelmedi mi? Onlara, can yakıcı azap vardır."
        cid: 0
  - verse: 6
    segments:
      - text: "Bu, kendilerine peygamberleri belgelerle geldiğinde: &quot;Bizi doğru yola bir insan mı eriştirecek?&quot; diyerek inkar edip gerçeğe yüz çevirmelerinden ötürüdür. Allah hiçbir şeye muhtaç olmadığını ortaya koymuştur. Allah müstağnidir, övülmeğe layık olandır."
        cid: 0
  - verse: 7
    segments:
      - text: "İnkar edenler, tekrar dirilmeyeceklerini ileri sürerler. De ki: &quot;Evet; Rabbime and olsun ki, şüphesiz diriltileceksiniz ve sonra, yaptıklarınız size bildirilecektir. Bu, Allah'a kolaydır.&quot;"
        cid: 0
  - verse: 8
    segments:
      - text: "Öyleyse Allah'a, Peygamberine ve indirdiğimiz nura, Kuran'a inanın; Allah işlediklerinizden haberdardır."
        cid: 0
  - verse: 9
    segments:
      - text: "Toplanma günü için, sizi bir araya getirdiği zaman, işte o, kimin aldandığının ortaya çıkacağı gündür; Allah'a kim inanmış ve yararlı iş işlemişse, Allah onun kötülüklerini örter, onu içinde temelli ve sonsuz kalacağı, içlerinden ırmaklar akan cennetlere koyar; büyük kurtuluş işte budur."
        cid: 0
  - verse: 10
    segments:
      - text: "İnkar edip, ayetlerimizi yalanlayanlar, işte onlar da ateşliklerdir, orada temellidirler. Ne kötü bir dönüştür!"
        cid: 0
  - verse: 11
    segments:
      - text: "Başa gelen hiçbir musibet Allah'ın izni olmaksızın olamaz; Allah'a kim inanırsa onun gönlünü doğruya yöneltir. Allah herşeyi bilendir."
        cid: 0
  - verse: 12
    segments:
      - text: "Allah'a itaat edin; eğer bundan yüz çevirirseniz bilin ki Peygamberimize düşen apaçık tebliğdir."
        cid: 0
  - verse: 13
    segments:
      - text: "Allah vardır, O'ndan başka tanrı yoktur. İnananlar yalnız Allah 'a güvensinler."
        cid: 0
  - verse: 14
    segments:
      - text: "Ey inananlar! Eşleriniz ve çocuklarınızdan size düşmanlık edenler olur, onlardan sakının; ama, siz affeder, suçlarını örter ve bağışlarsanız bilin ki Allah da bağışlar ve acır."
        cid: 0
  - verse: 15
    segments:
      - text: "Doğrusu mallarınız ve çocuklarınız bir imtihandır. Büyük ecir ise Allah katındadır."
        cid: 0
  - verse: 16
    segments:
      - text: "Allah'a karşı gelmekten gücünüzün yettiği kadar sakının, buyruklarını dinleyin, itaat edin; kendinizin iyiliğine olarak mallarınızdan sarfedin; nefsinin tamahkarlığından korunan kimseler, işte onlar saadete erenlerdir."
        cid: 0
  - verse: 17
    segments:
      - text: "Eğer Allah'a güzel bir ödünç takdiminde bulunursanız, onu sizin için kat kat yapar ve sizi bağışlar; Allah, şükrün karşılığını verendir; Halim'dir."
        cid: 0
  - verse: 18
    segments:
      - text: "Görüleni görülmeyeni bilendir, güçlüdür. Hakim'dir."
        cid: 0