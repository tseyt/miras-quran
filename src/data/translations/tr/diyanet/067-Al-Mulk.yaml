surah_id: 67
language: tr
author: diyanet
verses:
  - verse: 1
    segments:
      - text: "Hükümranlık elinde olan Allah yücedir ve O herşeye Kadir'dir."
        cid: 0
  - verse: 2
    segments:
      - text: "Hanginizin daha iyi iş işlediğini belirtmek için, ölümü ve dirimi (hayatı) yaratan O'dur. O, güçlüdür, bağışlayandır."
        cid: 0
  - verse: 3
    segments:
      - text: "Gökleri yedi kat üzerine yaratan O'dur. Rahman'ın bu yaratmasında bir düzensizlik bulamazsın. Gözünü bir çevir bak, bir çatlak görebilir misin?"
        cid: 0
  - verse: 4
    segments:
      - text: "Bir aksaklık bulmak için gözünü tekrar tekrar çevir bak; ama göz umduğunu bulamayıp bitkin ve yorgun düşer."
        cid: 0
  - verse: 5
    segments:
      - text: "And olsun ki, yakın göğü kandillerle donattık, onları şeytanlar için taşlamalar yaptık ve şeytanlara çılgın alev azabını hazırladık."
        cid: 0
  - verse: 6
    segments:
      - text: "Rablerini inkar eden kimseler için cehennem azabı vardır. Ne kötü bir dönüştür!"
        cid: 0
  - verse: 7
    segments:
      - text: "Oraya atıldıkları zaman, onun kaynarken çıkardığı uğultuyu işitirler."
        cid: 0
  - verse: 8
    segments:
      - text: "Nerede ise öfkesinden paralanacak! İçine her bir topluluğun atılmasında, bekçileri onlara: &quot;Size bir uyarıcı gelmemiş miydi?&quot; diye sorarlar."
        cid: 0
  - verse: 9
    segments:
      - text: "Onlar: &quot;Evet; doğrusu bize bir uyarıcı geldi, fakat biz yalanladık ve Allah hiçbir şey indirmemiştir, siz büyük bir sapıklık içindesiniz demiştik&quot; derler."
        cid: 0
  - verse: 10
    segments:
      - text: "&quot;Eğer kulak vermiş veya akletmiş olsaydık, çılgın alevli cehennemlikler içinde olmazdık&quot; derler."
        cid: 0
  - verse: 11
    segments:
      - text: "Böylece, günahlarını itiraf ederler. Çılgın alevli cehennemlikler yok olsunlar!"
        cid: 0
  - verse: 12
    segments:
      - text: "Doğrusu, görünmediği halde Rablerinden korkanlara, onlara, bağışlanma ve büyük ecir vardır."
        cid: 0
  - verse: 13
    segments:
      - text: "Sizler, sözlerinizi gizleseniz de açıklasanız da birdir; O, kalblerde olanı bilir."
        cid: 0
  - verse: 14
    segments:
      - text: "Yaratan bilmez olur mu? O, Latif'tir, haberdardır."
        cid: 0
  - verse: 15
    segments:
      - text: "Yeryüzünü, size boyun eğdiren O'dur; öyleyse yerin sırtlarında dolaşın, Allah'ın verdiği rızıktan yiyin; sonunda dönüş O'nadır."
        cid: 0
  - verse: 16
    segments:
      - text: "Gökte olanın sizi yerin dibine geçirmesinden güvende misiniz? O zaman, yer, sarsıldıkça sarsılır."
        cid: 0
  - verse: 17
    segments:
      - text: "Gökte olanın başınıza taş yağdırmasından güvende misiniz? Benim uyarmamın nasıl olduğunu yakında bileceksiniz."
        cid: 0
  - verse: 18
    segments:
      - text: "And olsun ki, bunlardan öncekiler de yalanlamışlardı. Beni inkar etmek nasılmış?"
        cid: 0
  - verse: 19
    segments:
      - text: "Üzerlerinde kanat çırpan dizi dizi kuşları görmezler mi? Onları havada Rahman olan Allah'tan başkası tutmuyor; doğrusu, O, herşeyi görendir."
        cid: 0
  - verse: 20
    segments:
      - text: "Yahut, Rahman olan Allah'ın dışında size yardımda bulunabilecek taraftarlarınız kimdir? İnkarcılar sadece aldanmaktadırlar."
        cid: 0
  - verse: 21
    segments:
      - text: "Allah size verdiği rızkı kesiverirse, size rızık verecek başka kim vardır? Hayır; onlar, azgınlık ve nefrette direnmektedirler."
        cid: 0
  - verse: 22
    segments:
      - text: "Yüzükoyun sürünen mi, yoksa doğru yolda düpedüz yürüyen mi daha doğru yoldadır?"
        cid: 0
  - verse: 23
    segments:
      - text: "De ki: &quot;Sizi yaratan sizin için kulaklar, gözler ve kalbler var eden O'dur. Ne az şükrediyorsunuz!&quot;"
        cid: 0
  - verse: 24
    segments:
      - text: "Sizi yerde yaratıp yayan O'dur ve O'nun huzurunda toplanacaksınız."
        cid: 0
  - verse: 25
    segments:
      - text: "&quot;Doğru sözlü iseniz bildirin bu azap sözü ne zamandır?&quot; derler."
        cid: 0
  - verse: 26
    segments:
      - text: "De ki: &quot;Onu bilmek ancak Allah'a mahsustur. Ben sadece apaçık bir uyarıcıyım.&quot;"
        cid: 0
  - verse: 27
    segments:
      - text: "Azabı yaklaşırken gördükleri zaman, inkar edenlerin yüzleri çirkinleşip kararır; onlara: &quot;Sizin arayıp durduğunuz işte budur&quot; denir."
        cid: 0
  - verse: 28
    segments:
      - text: "De ki: &quot;Allah, beni ve benimle beraber bulunanları isterse yok eder veya isterse merhamet eder; söyleyin, bu takdirde inkarcıları, can yakıcı azabdan kim alıkoyabilir?&quot;"
        cid: 0
  - verse: 29
    segments:
      - text: "De ki: &quot;Bizim inandığımız ve kendisine güvendiğimiz, Rahman olan Allah'tır. Kimin apaçık bir sapıklıkta olduğunu yakında bileceksiniz.&quot;"
        cid: 0
  - verse: 30
    segments:
      - text: "De ki: &quot;Suyunuz yere batarsa, söyleyin, size kim temiz bir su kaynağı getirebilir?&quot;"
        cid: 0