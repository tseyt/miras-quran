surah_id: 91
language: tr
author: diyanet
verses:
  - verse: 1
    segments:
      - text: >-
          Güneşe ve onun ışığına,
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Ardından gelmekte olan aya,
        cid: 0
  - verse: 3
    segments:
      - text: >-
          Onu ortaya koyan gündüze,
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Onu bürüyen geceye,
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Göğe ve onu yapana,
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Yere ve onu yayana,
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Kişiye ve onu şekillendirene,
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Sonra da ona iyilik ve kötülük kabiliyeti verene and olsun ki:
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Kendini arıtan saadete ermiştir.
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Kendini fenalıklara gömen kimse de ziyana uğramıştır.
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Semud milleti, içlerinden en azgını ileri atılınca, azgınlığı yüzünden
          peygamberleri yalanladı.
        cid: 0
  - verse: 12
    segments:
      - text: >-
          Semud milleti, içlerinden en azgını ileri atılınca, azgınlığı yüzünden
          peygamberleri yalanladı.
        cid: 0
  - verse: 13
    segments:
      - text: >-
          Allah'ın peygamberi onlara, Allah'ın devesini göstermiş ve: "Allah'ın bu
          devesine ve onun su hakkına dokunmayın" demişti.
        cid: 0
  - verse: 14
    segments:
      - text: >-
          Onu yalanladılar ve deveyi boğazladılar. Bunun üzerine Rableri, suçlarından
          dolayı onların üzerine katmerli azap indirdi; yerle bir etti onları.
        cid: 0
  - verse: 15
    segments:
      - text: >-
          Bu işin sonundan O'nun korkusu yoktur.
        cid: 0