surah_id: 98
language: tr
author: diyanet
verses:
  - verse: 1
    segments:
      - text: "Kitap ehlinden ve ortak koşanlardan inkarcılar, kendilerine apaçık bir belge, içinde kesin ve en doğru hükümlerin bulunduğu arınmış sahifeleri okuyan, Allah katından bir Peygamber gelene kadar dinlerinden vazgeçecek değillerdi."
        cid: 0
  - verse: 2
    segments:
      - text: "Kitap ehlinden ve ortak koşanlardan inkarcılar, kendilerine apaçık bir belge, içinde kesin ve en doğru hükümlerin bulunduğu arınmış sahifeleri okuyan, Allah katından bir Peygamber gelene kadar dinlerinden vazgeçecek değillerdi."
        cid: 0
  - verse: 3
    segments:
      - text: "Kitap ehlinden ve ortak koşanlardan inkarcılar, kendilerine apaçık bir belge, içinde kesin ve en doğru hükümlerin bulunduğu arınmış sahifeleri okuyan, Allah katından bir Peygamber gelene kadar dinlerinden vazgeçecek değillerdi."
        cid: 0
  - verse: 4
    segments:
      - text: "Ama, kendilerine kitap verilenler, onlara apaçık belge geldikten sonra ayrılığa düştüler."
        cid: 0
  - verse: 5
    segments:
      - text: "Oysa onlar, doğruya yönelerek, dini yalnız Allah'a has kılarak O'na kulluk etmek, namazı kılmak ve zekatı vermekle emrolunmuşlardı. Dosdoğru olan din de budur."
        cid: 0
  - verse: 6
    segments:
      - text: "Kitap ehlinden ve ortak koşanlardan inkar edenler, şüphesiz içinde temelli kalacakları cehennem ateşindedirler. İşte bunlar, yaratıkların en kötüsüdürler."
        cid: 0
  - verse: 7
    segments:
      - text: "Fakat, inanıp yararlı iş işleyenler, işte onlar da, yaratıkların en iyileridirler."
        cid: 0
  - verse: 8
    segments:
      - text: "Onların Rableri katındaki mükafatı, içinde temelli ve sonsuz kalacakları, içlerinden ırmaklar akan Adn cennetleridir. Allah onlardan razıdır. Onlar da Allah'tan razıdır. Bu, Rabbinden korkan kimseyedir."
        cid: 0