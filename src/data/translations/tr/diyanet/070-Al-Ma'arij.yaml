        cid: 0
  - verse: 8
    segments:
      - text: >-
          Gök, o gün, erimiş maden gibi olur.
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Dağlar da atılmış pamuğa döner.
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Hiç bir dost diğer bir dostunu sormaz.
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Onlar birbirlerine yalnız gösterilirler. Suçlu kimse o günün azabından
          kurtulmak için oğullarını, ailesini, kardeşini, kendisini barındırmış olan
          sülalesini ve yeryüzünde bulunan herkesi feda etmek ve böylece kendisini
          kurtarmak ister.
        cid: 0
