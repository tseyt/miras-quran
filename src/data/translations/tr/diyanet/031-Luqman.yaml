surah_id: 31
language: tr
author: diyanet
verses:
  - verse: 1
    segments:
      - text: >-
          Elif, Lam, Mim.
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Bunlar, iyi davranan kimseler için rahmet ve doğru yol rehberi olan hikmetli
          Kitap'ın ayetleridir.
        cid: 0
  - verse: 3
    segments:
      - text: >-
          Bunlar, iyi davranan kimseler için rahmet ve doğru yol rehberi olan hikmetli
          Kitap'ın ayetleridir.
        cid: 0
  - verse: 4
    segments:
      - text: >-
          O kimseler namazı kılarlar, zekatı verirler; ahirete de yakinen inanırlar.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          İşte onlar Rablerinin yolunda olanlardır, işte onlar saadete erenlerdir.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          İnsanlar arasında, bir bilgisi olmadığı halde Allah yolundan saptırmak için
          gerçeği boş sözlerle değişenler ve Allah yolunu alaya alanlar vardır. İşte
          alçaltıcı azap bunlar içindir.
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Ayetlerimiz sapık kimseye okunduğu zaman sanki kulaklarında ağırlık var da
          işitmiyormuş gibi büyüklenerek sırt çevirir. İşte ona can yakıcı azabı müjde et.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          İnanıp yararlı iş işleyenler için, Allah'ın vadi gereğince temelli kalacakları
          nimet cennetleri vardır. O; güçlüdür, hakim'dir.
        cid: 0
  - verse: 9
    segments:
      - text: >-
          İnanıp yararlı iş işleyenler için, Allah'ın vadi gereğince temelli kalacakları
          nimet cennetleri vardır. O; güçlüdür, hakim'dir.
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Allah gökleri gördüğünüz gibi direksiz yaratmış, sizi sallar diye yeryüzüne
          sabit dağlar koymuş; orada her türlü canlıyı yaymıştır. Gökten su indirip orada
          her hoş çiftten yetiştirmişizdir.
        cid: 0
  - verse: 11
    segments:
      - text: >-
          İşte bu Allah'ın yaratışıdır. Ondan başkasının ne yarattığını Bana gösterin.
          Hayır; gösteremezler, zalimler apaçık sapıklık içindedir.
        cid: 0
  - verse: 12
    segments:
      - text: >-
          And olsun ki, Lokman'a, Allah'a şükretmesi için hikmet verdik. Şükreden kimse
          ancak kendisi için şükretmiş olur. Nankörlük eden ise, bilsin ki, Allah her
          şeyden müstağnidir, övülmeğe layık olandır.
        cid: 0
  - verse: 13
    segments:
      - text: >-
          Lokman, oğluna öğüt vererek: "Ey oğulcuğum! Allah'a eş koşma, doğrusu eş koşmak
          büyük zulümdür" demişti.
        cid: 0
  - verse: 14
    segments:
      - text: >-
          Biz insana, ana ve babasına karşı iyi davranmasını tavsiye etmişizdir. Annesi
          onu, güçsüzlükten güçsüzlüğe uğrayarak karnında taşımıştı. Çocuğun sütten
          kesilmesi iki yıl içinde olur. Bana ve ana babana şükret diye tavsiyede
          bulunmuşuzdur. Dönüş Bana'dır.
        cid: 0
  - verse: 15
    segments:
      - text: >-
          Ey insanoğlu! Ana baba, seni, körü körüne Bana ortak koşman için zorlarlarsa,
          onlara itaat etme; dünya işlerinde onlarla güzel geçin; Bana yönelen kimsenin
          yoluna uy; sonunda dönüşünüz Bana'dır. O zaman, yaptıklarınızı size bildiririm.
        cid: 0
  - verse: 16
    segments:
      - text: >-
          Lokman: "Ey oğulcuğum! İşlediğin şey, bir hardal tanesi ağırlığınca olsa da,
          bir kayanın içinde veya göklerde yahut yerin derinliklerinde bulunsa, Allah onu
          getirip meydana kor. Doğrusu Allah Latif'tir, haberdardır".
        cid: 0
  - verse: 17
    segments:
      - text: >-
          "Ey oğulcuğum! Namazı kıl, uygun olanı buyurup fenalığı önle, başına gelene
          sabret; doğrusu bunlar, azmedilmeğe değer işlerdir."
        cid: 0
  - verse: 18
    segments:
      - text: >-
          "İnsanları küçümseyip yüz çevirme, yeryüzünde böbürlenerek yürüme; Allah,
          kendini beğenip övünen hiç kimseyi şüphesiz ki sevmez."
        cid: 0
  - verse: 19
    segments:
      - text: >-
          "Yürüyüşünde tabii ol; sesini kıs. Seslerin en çirkini şüphesiz merkeblerin
          sesidir."
        cid: 0
  - verse: 20
    segments:
      - text: >-
          Allah'ın göklerde olanları da, yerde olanları da buyruğunuz altına verdiğini,
          nimetlerini açık ve gizli olarak size bolca ihsan ettiğini görmez misiniz?
          İnsanlardan, Allah hakkında hiçbir bilgisi olmadan, doğruluk rehberi ve
          aydınlatıcı bir Kitap bulunmadan tartışanlar vardır.
        cid: 0
  - verse: 21
    segments:
      - text: >-
          Onlara, "Allah'ın indirdiğine uyun" denince: "Babalarımızı üzerinde bulduğumuz
          yola uyarız" derler. Ya şeytan, babalarını alevli ateşin azabına çağırmışsa?
        cid: 0
  - verse: 22
    segments:
      - text: >-
          İyilik yaparak kendini Allah'a veren kimse, şüphesiz en sağlam kulpa sarılmış
          olur. İşlerin sonucu Allah'a aittir.
        cid: 0
  - verse: 23
    segments:
      - text: >-
          İnkar edenin inkarcılığı seni üzmesin; onların dönüşü Bize'dir; o zaman,
          yaptıklarını kendilerine haber veririz. Allah, kalblerde olanı şüphesiz bilir.
        cid: 0
  - verse: 24
    segments:
      - text: >-
          Onları az bir süre geçindiririz, sonra da ağır bir azaba sürükleriz.
        cid: 0
  - verse: 25
    segments:
      - text: >-
          And olsun ki onlara: "Gökleri ve yeri yaratan kimdir?" diye sorsan, "Allah'tır"
          derler. De ki: "Hamd Allah'a mahsustur", ama çoğu bilmezler.
        cid: 0
  - verse: 26
    segments:
      - text: >-
          Göklerde ve yerde olanlar Allah'ındır. Şüphesiz Allah müstağnidir, övülmeğe
          layıktır.
        cid: 0
  - verse: 27
    segments:
      - text: >-
          Eğer yeryüzündeki ağaçlar kalem olsa, denizler mürekkep olsa ve yedi misli
          deniz de yedekte bulunup yazılsa yine de Allah'ın sözleri bitmezdi. Doğrusu
          Allah güçlüdür, hakim'dir.
        cid: 0
  - verse: 28
    segments:
      - text: >-
          Ey insanlar! Sizin yaratılmanız ve tekrar dirilmeniz tek bir nefsin yaratılması
          ve tekrar diriltilmesi gibidir. Şüphesiz Allah işitendir, görendir.
        cid: 0
  - verse: 29
    segments:
      - text: >-
          Allah'ın geceyi gündüze ve gündüzü geceye kattığını, her biri belirli bir
          süreye kadar hareket edecek olan güneşi ve ayı buyruk altında tuttuğunu;
          Allah'ın, yaptıklarınızdan haberdar olduğunu bilmez misin?
        cid: 0
  - verse: 30
    segments:
      - text: >-
          Bu, Allah'ın hak olmasından ve O'ndan başka taptıkları şeylerin batıl
          olmasındandır. Doğrusu Allah yücedir, büyüktür.
        cid: 0
  - verse: 31
    segments:
      - text: >-
          Gemilerin denizde Allah'ın lütfuyla yürüdüğünü görmez misin? Allah böylece size
          varlığının delillerini gösterir. Bunlarda, pek sabırlı ve çok şükreden
          kimselerin hepsine dersler vardır.
        cid: 0
  - verse: 32
    segments:
      - text: >-
          Dağlar gibi dalgalar insanları kuşattığı zaman, dini tamamen Allah'a has
          kılarak O'na yalvarırlar; onları karaya çıkararak kurtardığında, içlerinden bir
          kısmı doğru yolda kalır. Zaten ayetlerimizi bilerek ancak hain nankörler inkar
          eder.
        cid: 0
  - verse: 33
    segments:
      - text: >-
          Ey insanlar! Rabbinize karşı gelmekten sakının. Babanın oğlu, oğulun da babası
          için bir şey ödeyemeyeceği günden korkun. Allah'ın verdiği söz şüphesiz
          gerçektir. Dünya hayatı sakın sizi aldatmasın. Allah'ın affına güvendirerek
          şeytan sizi ayartmasın.
        cid: 0
  - verse: 34
    segments:
      - text: >-
          Kıyamet saatini bilmek ancak Allah'a mahsustur. Yağmuru O indirir, rahimlerde
          bulunanı O bilir, kimse yarın ne kazanacağını bilmez ve hiç kimse nerede
          öleceğini bilemez. Allah şüphesiz bilendir, her şeyden haberdardır.
        cid: 0