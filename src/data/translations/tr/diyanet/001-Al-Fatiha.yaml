surah_id: 1
language: tr
author: diyanet
verses:
  - verse: 1
    segments:
      - text: >-
          Rahman ve Rahim olan Allah'ın adıyla:
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Hamd, Alemlerin Rabbi Allah'a mahsustur.
        cid: 0
  - verse: 3
    segments:
      - text: >-
          O Rahman ve Rahim'dir,
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Din Gününün sahibidir.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Ancak Sana kulluk eder ve yalnız Senden yardım dileriz.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Bizi doğru yola eriştir.
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Nimete erdirdiğin kimselerin yoluna; gazaba uğrayanların, ya da sapıtanların
          yoluna değil.
        cid: 0