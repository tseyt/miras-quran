    segments:
      - text: >-
          Ey inananlar! Allah'tan sakının, dürüst söz söyleyin de Allah işlerinizi
          kendinize yararlı kılsın ve günahlarınızı size bağışlasın. Kim Allah'a ve
          Peygamber'ine itaat ederse, şüphesiz büyük bir kurtuluşa ermiş olur.
        cid: 0
  - verse: 72
    segments:
      - text: >-
          Doğrusu Biz, sorumluluğu (emaneti) göklere, yere, dağlara sunmuşuzdur da onlar
          bunu yüklenmekten çekinmişler ve ondan korkup titremişlerdir; onu insan
          yüklendi. Doğrusu o çok zalim ve çok cahildir. (kabulüne rağmen emanete hıyanet
          etmektedir)
        cid: 0
  - verse: 73
    segments:
      - text: >-
          Bunun sonucu olarak, Allah, ikiyüzlü erkek ve kadınlara, Allah'a ortak koşan
          erkek ve kadınlara azap verecektir. Allah inanan erkek ve kadınların tevbelerini
          kabul buyuracaktır. Allah bağışlar ve merhamet eder.
        cid: 0