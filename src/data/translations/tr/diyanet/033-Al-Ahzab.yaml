surah_id: 33
language: tr
author: diyanet
verses:
  - verse: 1
    segments:
      - text: >-
          Ey peygamber! Allah'tan sakın, inkarcılara ve iki yüzlülere uyma, Allah
          şüphesiz bilendir, hakim'dir.
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Sana Rabbinden vahyolunana uy; şüphesiz Allah, yaptıklarınızdan haberdardır.
        cid: 0
  - verse: 3
    segments:
      - text: >-
          Allah'a güven, Allah, vekil olarak yeter.
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Allah insanın içine iki kalp koymamıştır. Allah, zıhar yapmanız suretiyle
          eşlerinizi, anneleriniz gibi yaratmamıştır; evlatlıklarınızı da öz oğullarınız
          gibi saymanızı meşru kılmamıştır. Bunlar sizin dillerinize doladığınız boş
          sözlerdir. Allah gerçeği söylemektedir, doğru yola O eriştirir.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Evlatlıkları babalarına nisbet edin, bu Allah katında en doğru olandır. Eğer
          babalarının kim olduğunu bilmiyorsanız, bu takdirde onları din kardeşi ve
          dostlarınız olarak kabul edin. İçinizden kasdederek yaptıklarınız bir yana,
          yanılmalarınızda size bir sorumluluk yoktur. Allah, bağışlar ve merhamet eder.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Müminlerin, Peygamberi kendi nefislerinden çok sevmeleri gerekir; onun eşleri
          onların anneleridir; akraba olanlar, miras hususunda, Allah'ın Kitap'ında
          birbirlerine müminler ve muhacirlerden daha yakındırlar. Dostlarınıza
          yapacağınız uygun bir vasiyet bunun dışındadır. Bu Kitap'ta yazılı
          bulunmaktadır.
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Peygamberlerden söz almıştık. Senden, Nuh'dan, İbrahim'den, Musa'dan, Meryem
          oğlu İsa'dan sağlam bir söz almışızdır.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Allah, doğrulardan doğruluklarını sormak ve inkarcılara can yakıcı azap
          hazırlamak için bunu yapmıştır.
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Ey inananlar! Allah'ın size olan nimetini anın; üzerinize ordular gelmişti. Biz
          de onların üzerine rüzgar ve göremediğiniz ordular göndermiştik. Allah,
          yaptıklarınızı görüyordu.
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Onlar size yukarınızdan ve aşağınızdan gelmişlerdi; gözler de dönmüştü,
          yürekler ağızlara gelmişti; Allah için çeşitli tahminlerde bulunuyordunuz.
        cid: 0
  - verse: 11
    segments:
      - text: >-
          İşte orada, inananlar denenmiş ve çok şiddetli sarsıntıya uğratılmışlardı.
        cid: 0
  - verse: 12
    segments:
      - text: >-
          İkiyüzlüler ve kalblerinde hastalık olanlar: "Allah ve Peygamberi bize sadece
          kuru vaadlerde bulundular" diyorlardı.
        cid: 0
  - verse: 13
    segments:
      - text: >-
          İçlerinden bir takımı: "Ey Medineliler! Tutunacak yeriniz yok, geri dönün"
          demişti. İçlerinden bir topluluk da Peygamberden: "Evlerimiz düşmana açıktır"
          diyerek izin istemişlerdi. Oysa evleri açık değildi sadece kaçmak istiyorlardı.
        cid: 0
  - verse: 14
    segments:
      - text: >-
          Eğer Medine'nin etrafından üzerlerine varılmış olsa, sonra da kendilerinden
          fitne çıkarmaları istense hemen buna girişip derhal yapmaktan geri kalmazlardı.
        cid: 0
  - verse: 15
    segments:
      - text: >-
          And olsun ki, daha önce, sırt çevirip kaçmayacaklarına dair Allah'a ahd
          vermişlerdi. Allah'a verilen ahd sorulacaktır.
        cid: 0
  - verse: 16
    segments:
      - text: >-
          De ki: "Eğer ölümden yahut öldürülmekten kaçıyorsanız bilin ki, kaçmak size
          fayda vermeyecektir; kaçsanız bile az bir zamandan fazla yaşatılmazsınız."
        cid: 0
  - verse: 17
    segments:
      - text: >-
          De ki: "Allah size bir kötülük dilese veya bir rahmet istese, O'na karşı kim
          sizi koruyabilir? Allah'tan başka dost ve yardımcı da bulamazsınız."
        cid: 0
  - verse: 18
    segments:
      - text: >-
          Allah, içinizden sizi alıkoyanları, size Allah'ın yardımını kıskanarak,
          kardeşlerine "Bize gelin, zorlanmadıkça savaşa gitmeyin" diyenleri bilir.
          Kalblerine korku gelince ölüm baygınlığı geçiren kimse gibi gözleri dönerek,
          sana baktıklarını görürsün. Korkuları gidince iyiliğinize olanı çekemeyip sivri
          dilleriyle sizi incitirler. Bunlar inanmamışlardır, Allah, bu sebeple işlerini
          boşa çıkarmıştır; bu, Allah için kolaydır.
        cid: 0
  - verse: 19
    segments:
      - text: >-
          Allah, içinizden sizi alıkoyanları, size Allah'ın yardımını kıskanarak,
          kardeşlerine "Bize gelin, zorlanmadıkça savaşa gitmeyin" diyenleri bilir.
          Kalblerine korku gelince ölüm baygınlığı geçiren kimse gibi gözleri dönerek,
          sana baktıklarını görürsün. Korkuları gidince iyiliğinize olanı çekemeyip sivri
          dilleriyle sizi incitirler. Bunlar inanmamışlardır, Allah, bu sebeple işlerini
