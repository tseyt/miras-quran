          haberlerinizi sormayı dilerlerdi. Aranızda olsalar ancak pek az savaşırlardı.
        cid: 0
  - verse: 21
    segments:
      - text: >-
          Ey inananlar! And olsun ki, sizin için, Allah'a ve ahiret gününe kavuşmayı
          umanlar ve Allah'ı çok anan kimseler için Resulullah (Allah'ın Elçisi) en güzel
          örnektir.
        cid: 0
  - verse: 22
    segments:
      - text: >-
          İnananlar, düşman birliklerini gördükleri zaman: "İşte bu, Allah ve
          Peygamberinin bize vadettiğidir; Allah ve Peygamberi doğru söylemiştir" dediler.
          Bu onların ancak imanını ve teslimiyetlerini artırdı.
        cid: 0
  - verse: 23
    segments:
      - text: >-
          İnananlardan, Allah'a verdiği ahdi yerine getiren adamlar vardır. Kimi, bu
          uğurda canını vermiş, kimi de beklemektedir. Ahdlerini hiç değiştirmemişlerdir.
        cid: 0
  - verse: 24
    segments:
      - text: >-
          Bu sebeple Allah, doğruları doğrulukları ile mükafatlandırır; ikiyüzlüleri de
          dilerse azablandırır veya tevbelerini kabul eder. Şüphesiz Allah bağışlayandır,
          merhamet edendir.
        cid: 0
  - verse: 25
    segments:
      - text: >-
          Allah inkar edenleri, kinleriyle geri çevirdi, bir hayra ulaşamadılar; savaşta,
