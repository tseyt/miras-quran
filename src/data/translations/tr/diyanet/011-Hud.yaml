surah_id: 11
language: tr
author: diyanet
verses:
  - verse: 1
    segments:
      - text: >-
          Elif, Lam, Ra. Bu Kitap, hakim ve haberdar olan Allah tarafından, Allah'tan
          başkasına kulluk etmeyesiniz diye ayetleri kesin kılınmış, sonra da uzun uzadıya
          açıklanmış bir Kitap'dır. Ben size, O'nun tarafından gönderilmiş bir uyarıcı ve
          müjdeciyim. Rabbinizden mağfiret dileyin ve O'na tevbe edin ki, belli bir süreye
          kadar sizi güzelce geçindirsin ve her fazilet sahibine faziletinin karşılığını
          versin. Eğer yüz çevirirseniz o zaman ben doğrusu hakkınızda büyük günün
          azabından korkarım.
        cid: 0
