        cid: 0
  - verse: 4
    segments:
      - text: >-
          Dönüşünüz ancak Allah'adır. O her şeye Kadir'dir.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Bilin ki, onlar Kuran okunurken gizlenmek için iki büklüm olurlar. Bilin ki,
          elbiselerine büründüklerinde bile Allah onların gizlediklerini ve açığa
          vurduklarını bilir. Çünkü O, kalblerde olanı bilendir.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Yeryüzünde yaşayan bütün canlıların rızkı ancak Allah'a aittir. O, canlıları
          babaların sulbünde kararlaşmış ve anaların rahminde kararlaşmakta iken de bilir.
          Her şey apaçık bir Kitaptadır.
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Arş'ı su üzerinde iken, hanginizin daha güzel işi işleyeceğini ortaya koymak
          için, gökleri ve yeri altı günde yaratan O'dur. And olsun ki, "Siz gerçekten,
          ölümden sonra dirileceksiniz" desen, inkar edenler: "Bu, apaçık bir sihirden
          başka bir şey değildir" derler.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          And olsun ki, onların azabını sayılı bir süreye kadar ertelesek, "Onu alıkoyan
          nedir?" derler. Bilin ki, onlara azab geldiği gün, artık geri çevrilmez; alaya
          aldıkları şey onları mahvedecektir.
        cid: 0
  - verse: 9
    segments:
      - text: >-
          And olsun ki, insana nimetimizi tattırır sonra onu ondan çekip alırsak, o
          şüphesiz umutsuz bir nanköre döner.
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Başına gelen sıkıntıdan sonra, ona bir nimet tattırırsak, "Musibetler başımdan
          gitti" der; doğrusu o, şımarıp böbürlenen biridir.
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Bunların dışında, sabredip iyi işler işleyen kimseler, işte onlara mağfiret ve
          büyük ecir vardır.
        cid: 0
  - verse: 12
    segments:
      - text: >-
          Putperestlerin: "Ona bir hazine indirilmeli veya yanında bir melek gelmeli
          değil miydi?" demelerinden senin kalbin daralır ve belki de sana vahyolunanın
          bir kısmını terkedecek olursun. Sen ancak bir uyarıcısın, Allah her şeye
          vekildir.
        cid: 0
  - verse: 13
    segments:
      - text: >-
          Senin için: "Onu uydurdu" diyorlar, öyle mi? De ki: "Öyleyse onun surelerine
          benzer uydurma on sure meydana getirin, iddianızda samimi iseniz, Allah'tan
          başka çağırabileceklerinizi de çağırın."
        cid: 0
  - verse: 14
    segments:
      - text: >-
          Söylediğinizi yapamazlarsa, bilin ki o, ancak Allah'ın ilmiyle indirilmiştir.
          O'ndan başka tanrı yoktur, artık müslümansınız değil mi?
        cid: 0
  - verse: 15
    segments:
      - text: >-
          Dünya hayatını ve güzelliklerini isteyenlere, orada işlediklerinin karşılığını
          tastamam veririz; onlar orada bir eksikliğe de uğratılmazlar.
        cid: 0
  - verse: 16
    segments:
      - text: >-
          İşte ahirette onlara ateşten başka bir şey yoktur. İşledikleri şeyler orada
          boşa gitmiştir. Zaten yapmakta oldukları da batıldır.
        cid: 0
  - verse: 17
    segments:
      - text: >-
          Rabbinin katından bir belgesi ve onun arkasından da bir şahidi olanlar,
          önlerinde de Musa'nın Kitap'ı önder ve rahmet olarak bulunanlardır ki, işte
          onlar Kuran'a inanırlar. Hangi topluluk onu inkar ederse yeri ateştir; senin de
          bundan şüphen olmasın. Doğrusu o, Rabbinden bir gerçektir, fakat insanların çoğu
          inanmazlar.
        cid: 0
  - verse: 18
    segments:
      - text: >-
          Yalan söyleyerek Allah'a iftira edenden daha zalim kim vardır? İşte bunlar
          Rablerine götürülürler ve şahidler: "Rablerine yalan söyleyenler bunlardır"
          derler. Bilin ki Allah'ın laneti haksızlık yapanlaradır.
        cid: 0
  - verse: 19
    segments:
      - text: >-
          Bunlar Allah'ın yolundan alıkorlar ve o yolu eğriltmeğe çalışırlar; işte onlar
          ahireti inkar edenlerdir.
        cid: 0
  - verse: 20
    segments:
      - text: >-
          Bunlar yeryüzünde Allah'ı aciz bırakamazlar. Allah'dan başka kendilerini
