  - verse: 8
    segments:
      - text: >-
          O'ndan başka tanrı yoktur; diriltir ve öldürür. Sizin de Rabbiniz önceki
          atalarınızın da Rabbidir.
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Ama inkarcılar, dirilmekten şüphededirler, bunu eğlenceye alırlar.
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Göğün, insanları bürüyecek ve gözle görülecek bir duman çıkaracağı günü bekle;
          bu, can yakan bir azabdır.
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Göğün, insanları bürüyecek ve gözle görülecek bir duman çıkaracağı günü bekle;
          bu, can yakan bir azabdır.
        cid: 0
  - verse: 12
    segments:
      - text: >-
          İnsanlar: "Rabbimiz! Bu azabı bizden kaldır; doğrusu artık biz inananlarız"
          derler.
        cid: 0
  - verse: 13
    segments:
      - text: >-
          Nerde onlarda öğüt almak? Kendilerine gerçeği açıklayan bir peygamber gelmişti
          ve ondan yüz çevirmişler, "Belletilmiş bir deli" demişlerdi.
        cid: 0
  - verse: 14
    segments:
      - text: >-
          Nerde onlarda öğüt almak? Kendilerine gerçeği açıklayan bir peygamber gelmişti
          ve ondan yüz çevirmişler, "Belletilmiş bir deli" demişlerdi.
        cid: 0
  - verse: 15
    segments:
      - text: >-
          Biz sizden azabı az bir süre için kaldıracağız, siz yine de eski
          inkarcılığınıza döneceksiniz.
        cid: 0
  - verse: 16
    segments:
      - text: >-
          Onları çarptıkça çarpacağımız gün öcümüzü şüphesiz alırız.
        cid: 0
  - verse: 17
    segments:
      - text: >-
          And olsun ki, onlardan önce, Firavun milletini denemiştik. Onlara gelen değerli
          bir peygamber demişti ki:
        cid: 0
  - verse: 18
    segments:
      - text: >-
          "Ey Allah'ın kulları! Bana gelin, doğrusu ben size gönderilmiş güvenilir bir
          elçiyim."
        cid: 0
  - verse: 19
    segments:
      - text: >-
          "Allah'a karşı üstün gelmeye kalkışmayın; doğrusu ben size apaçık bir delil
          getirdim."
        cid: 0
  - verse: 20
    segments:
      - text: >-
          "Beni taşlamanızdan ötürü, benim de Rabbim, sizin de Rabbiniz olan Allah'a
          sığındım."
        cid: 0
  - verse: 21
    segments:
      - text: >-
          "Bana inanmazsanız, başımdan çekilin."
        cid: 0
  - verse: 22
    segments:
      - text: >-
          Bunlar, suçlu bir millet olduğu için, Rabbine yardım etmesi için yalvardı.
        cid: 0
  - verse: 23
    segments:
      - text: >-
