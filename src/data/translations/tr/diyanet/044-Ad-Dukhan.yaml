          olunacaksınız."
        cid: 0
  - verse: 24
    segments:
      - text: >-
          "Denizi sakin iken geride bırak, doğrusu onlar suda boğulacak bir ordudur."
        cid: 0
  - verse: 25
    segments:
      - text: >-
          Orada nice bahçeler, pınarlar, ekinler, güzel konaklar, eğlenip durdukları
