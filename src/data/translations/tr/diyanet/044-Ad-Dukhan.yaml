surah_id: 44
language: tr
author: diyanet
verses:
  - verse: 1
    segments:
      - text: >-
          Ha, Mim.
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Apaçık olan Kitap'a and olsun ki, Biz onu, kutlu bir gecede indirdik. Doğrusu
          Biz, insanları uyarmaktayız.
        cid: 0
  - verse: 3
    segments:
      - text: >-
          Apaçık olan Kitap'a and olsun ki, Biz onu, kutlu bir gecede indirdik. Doğrusu
          Biz, insanları uyarmaktayız.
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Katımızdan bir buyrukla, her hikmetli işe o gecede hükmedilir. Doğrusu Biz
          öteden beri peygamberler göndermekteyiz. Eğer kesin olarak inanırsanız bilin ki,
          bu senin Rabbinden, göklerin, yerin ve ikisi arasında bulunanların Rabbinden bir
          rahmettir. O, işitendir, bilendir.
        cid: 0
