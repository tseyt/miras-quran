surah_id: 66
language: tr
author: elmalili
verses:
  - verse: 1
    segments:
      - text: "Ey Peygamber! Eşlerinin rızasını arayarak Allah'ın sana helâl kıldığı şeyi niçin sen kendine haram ediyorsun? Allah çok bağışlayan çok esirgeyendir."
        cid: 0
  - verse: 2
    segments:
      - text: "Allah size yeminlerinizi çözmeyi meşrû kılmıştır. Allah sizin sahibinizdir. O bilendir, hikmetle yönetendir."
        cid: 0
  - verse: 3
    segments:
      - text: "Peygamber, eşlerinden birine gizlice bir söz söylemişti. Fakat eşi, o sözü başkalarına haber verip Allah da bunu Peygamber'e açıklayınca, Peygamber (eşine) bir kısmını bildirmiş bir kısmından da vazgeçmişti. Peygamber bunu ona haber verince eşi: \"Bunu sana kim söyledi?\" dedi. Peygamber \"Bilen, her şeyden haberi olan Allah bana söyledi.\" dedi."
        cid: 0
  - verse: 4
    segments:
      - text: "Eğer ikiniz de Allah'a tevbe ederseniz ne iyi, çünkü kalpleriniz eğildi. Ve eğer Peygamber'e karşı birbirinize arka olursanız (bilin ki) onun dostu ve yardımcısı Allah, Cibrîl ve müminlerin iyileridir. Bunun ardından melekler de ona arkadır."
        cid: 0
  - verse: 5
    segments:
      - text: "Eğer o sizi boşarsa belki de Rabbi ona, sizden daha hayırlı, kendisini Allah'a teslim eden, inanan, gönülden itaat eden, tevbe eden, oruç tutan dul ve bakire eşler verir."
        cid: 0
  - verse: 6
    segments:
      - text: "Ey inananlar! Kendinizi ve ailenizi bir ateşten koruyun ki onun yakıtı insanlar ve taşlardır. Onun başında gayet katı, şiddetli, Allah'ın kendilerine buyurduğuna karşı gelmeyen ve emredildikleri şeyi yapan melekler vardır."
        cid: 0
  - verse: 7
    segments:
      - text: "(İnkâr edenlere): \"Ey kâfirler! Bugün özür dilemeyin. Siz ancak işlediklerinizin cezasını çekeceksiniz.\" (denilir.)"
        cid: 0
  - verse: 8
    segments:
      - text: "Ey iman edenler! Samimi bir tevbe ile Allah'a dönün. Umulur ki Rabbiniz sizin kötülüklerinizi örter, Peygamber'i ve onunla birlikte iman edenleri utandırmayacağı günde Allah sizi, içlerinden ırmaklar akan cennetlere sokar. Çünkü onların nurları, önlerinde ve yanlarında koşar da, \"Ey Rabbimiz! Nurumuzu tamamla, bizi bağışla, çünkü sen her şeye kâdirsin.\" derler."
        cid: 0
  - verse: 9
    segments:
      - text: "Ey Peygamber! Kâfirler ve münafıklarla savaş, onlara karşı sert davran. Onların varacağı yer cehennemdir. O gidilecek yer, ne de kötüdür!"
        cid: 0
  - verse: 10
    segments:
      - text: "Allah, inkâr edenlere, Nuh'un karısı ile Lut'un karısını misal verdi. Bu ikisi, kullarımızdan iki salih kulun (nikahı) altında idiler, onlara hıyanet ettiler. (Kocaları,) Allah'tan hiçbir şeyi onlardan savamadı. (Onlara): \"Haydi girenlerle birlikte siz de ateşe girin!\" denildi."
        cid: 0
  - verse: 11
    segments:
      - text: "Allah, inananlara da Firavun'un karısını örnek gösterdi. O şöyle demişti: \"Rabbim! Bana yanında cennetin içinde bir ev yap, beni Firavun'dan ve onun (kötü) işinden kurtar. Ve beni şu zalim toplumdan kurtar!\""
        cid: 0
  - verse: 12
    segments:
      - text: "Irzını korumuş olan, İmrân kızı Meryem'i de Allah örnek gösterdi. Biz, ona ruhumuzdan üfledik ve Rabbinin sözlerini ve kitaplarını tasdik etti. O, gönülden itaat edenlerdendi."
        cid: 0