surah_id: 96
language: tr
author: elmalili
verses:
  - verse: 1
    segments:
      - text: >-
          Yaratan Rabbinin adıyla oku!
        cid: 0
  - verse: 2
    segments:
      - text: >-
          O, insanı bir alekadan (embriyodan) yarattı.
        cid: 0
  - verse: 3
    segments:
      - text: >-
          Oku! Rabbin sonsuz kerem sahibidir.
        cid: 0
  - verse: 4
    segments:
      - text: >-
          O Rab ki kalemle yazmayı öğretti.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          İnsana bilmediği şeyleri öğretti.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Hayır! Doğrusu (kâfir) insan azgınlık eder.
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Kendisinin muhtaç olmadığını zannettiği için.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Muhakkak ki dönüş mutlaka Rabbinedir.
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Namaz kıldığı zaman, bir kulu engelleyeni gördün mü?
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Namaz kıldığı zaman, bir kulu engelleyeni gördün mü?
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Gördün mü (ne dersin?), ya o (kul) doğru yolda olur,
        cid: 0
  - verse: 12
    segments:
      - text: >-
          Veya kötülüklerden sakınmayı emrederse?
        cid: 0
  - verse: 13
    segments:
      - text: >-
          Gördün mü, ya bu (adam, hakkı) yalanlar, yüzçevirirse,
        cid: 0
  - verse: 14
    segments:
      - text: >-
          O adam, Allah'ın kendini gördüğünü hiç bilmiyor mu?
        cid: 0
  - verse: 15
    segments:
      - text: >-
          Hayır, hayır! Eğer o, bu davranışından vazgeçmezse, and olsun ki biz, onu
          perçeminden, o günahkâr ve yalancı perçeminden tutup cehenneme sürükleriz.
        cid: 0
  - verse: 16
    segments:
      - text: >-
          Hayır, hayır! Eğer o, bu davranışından vazgeçmezse, and olsun ki biz, onu
          perçeminden, o günahkâr ve yalancı perçeminden tutup cehenneme sürükleriz.
        cid: 0
  - verse: 17
    segments:
      - text: >-
          O zaman o taraftarlarını yardıma çağırsın.
        cid: 0
  - verse: 18
    segments:
      - text: >-
          Biz de Zebanileri çağıracağız.
        cid: 0
  - verse: 19
    segments:
      - text: >-
          Sakın onu dinleme de (Rabbine) secde et ve yaklaş.
        cid: 0