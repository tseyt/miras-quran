verses:
  - verse: 1
    segments:
      - text: "Ey iman edenler! Sözleşmeleri yerine getirin. İhramlı iken avlanmayı helal saymamanız şartıyla, çeşitli hayvanlar size helal kılındı. Ancak haram oldukları size okunacak olanlar müstesna. Şüphesiz Allah dilediği hükmü verir."
        cid: 0
  - verse: 2
    segments:
      - text: "Ey iman edenler! Allah'ın alâmetlerine, haram aya, kurbanlık hediyelere, gerdanlıklarına ve Rablerinden lutuf ve rıza bekleyerek Kabe'ye yönelenlere sakın saygısızlık etmeyin. İhramdan çıktığınız zaman avlanabilirsiniz. Sizi Mescidi Haram'dan çevirdiklerinden dolayı bir topluma karşı olan kininiz, sizi saldırıya sevk etmesin. İyilik ve takva üzerinde yardımlaşın, günah ve düşmanlık üzerinde yardımlaşmayın. Allah'tan korkun. Çünkü Allah'ın azabı çetindir."
        cid: 0
  - verse: 3
    segments:
      - text: "Leş, kan, domuz eti, Allah'tan başkasının adı anılarak kesilen; boğulmuş, vurulmuş, yukardan düşmüş, boynuzlanmış, canavar yırtmış olup da canlı iken kesmedikleriniz; dikili taşlar (putlar) üzerine boğazlanan hayvanlar ve fal oklarıyla kısmet (şans) aramanız size haram kılındı. Bunların hepsi doğru yoldan çıkmaktır. Bugün kâfirler, dininize karşı ümitsizliğe düşmüşlerdir. Onlardan korkmayın, benden korkun. Bugün dininizi kemale erdirdim, size nimetimi tamamladım. Size din olarak İslâmı beğendim. Kim açlıktan daralır, günaha istekle yönelmeden bunlardan yemek zorunda kalırsa, ona günah yoktur. Çünkü Allah bağışlayan, merhamet edendir."
        cid: 0
  - verse: 4
    segments:
