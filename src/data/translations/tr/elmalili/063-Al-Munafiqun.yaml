surah_id: 63
language: tr
author: elmalili
verses:
  - verse: 1
    segments:
      - text: >-
          Münafıklar sana geldikleri vakit: "Şahitlik ederiz ki sen muhakkak Allah'ın
          elçisisin." derler. Senin mutlaka kendisinin elçisi olduğunu Allah bilir ve
          Allah münafıkların yalancı olduklarına şahitlik eder.
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Yeminlerini kalkan yapıp (insanları) Allah'ın yolundan çevirdiler. Onların
          yaptıkları ne kötüdür!
        cid: 0
  - verse: 3
    segments:
      - text: >-
          Bunun sebebi şudur: Onlar inandılar, sonra inkar ettiler, bu yüzden kalblerinin
          üzeri mühürlendi. Artık onlar anlamazlar.
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Onları gördüğün zaman kalıpları hoşuna gider, konuşurlarsa sözlerini dinlersin.
          Onlar sanki dayanmış keresteler gibidirler. Her gürültüyü kendi aleyhlerine
          sanırlar. Onlar düşmandır, onlardan sakın. Allah onları kahretsin! Nasıl olup da
          döndürülüyorlar?
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Onlara: "Gelin, Allah'ın Resulü sizin için mağfiret dilesin." denildiği zaman
          başlarını çevirirler ve onların, büyüklük taslayarak yüz çevirdiklerini
          görürsün.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Onlara mağfiret dilesen de, dilemesen de onlar için birdir. Allah onları
          bağışlamayacaktır. Çünkü Allah, yoldan çıkmış bir toplumu yola iletmez.
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Onlar öyle kimselerdir ki: "Allah'ın elçisinin yanında bulunanları beslemeyin
          ki dağılıp gitsinler." diyorlar. Oysa göklerin ve yerin hazineleri Allah'ındır,
          fakat münafıklar anlamazlar.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Diyorlar ki: "Andolsun, eğer Medine'ye dönersek, daha üstün olan, daha alçak
          olanı oradan mutlaka çıkaracaktır." Üstünlük, ancak Allah'a, O'nun elçisine ve
          müminlere mahsustur. Fakat münafıklar bilmezler.
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Ey İnananlar! Mallarınız ve çocuklarınız sizi Allah'ı anmaktan alıkoymasın. Kim
          bunu yaparsa işte onlar ziyana uğrayanlardır.
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Birinize ölüm gelip de: "Rabbim, beni yakın bir süreye kadar erteleseydin de
          sadaka verip iyilerden olsaydım!" demesinden önce, size verdiğimiz rızıktan
          (Allah) için harcayın.
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Allah süresi geldiği zaman hiç bir canı ertelemez. Allah yaptıklarınızdan
          haberdardır.
        cid: 0