        cid: 0
  - verse: 42
    segments:
      - text: "İşte o gün birbirinize ne bir menfaate, ne de bir zarara sahip olabilirsiniz. Ve biz o zulmedenlere: \"Tadın bakalım o yalan deyip durduğunuz ateşin azabını!\" deriz."
        cid: 0
  - verse: 43
    segments:
