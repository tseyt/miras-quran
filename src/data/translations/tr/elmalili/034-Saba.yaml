surah_id: 34
language: tr
author: elmalili
verses:
  - verse: 1
    segments:
      - text: "Hamd, o Allah'ındır ki göklerde ne var, yerde ne varsa hep O'nundur. Ahirette de hamd O'nundur. O hüküm ve himet sahibidir, herşeyden haberdardır."
        cid: 0
  - verse: 2
    segments:
      - text: "Yere ne giriyor ve ondan ne çıkıyor, gökten ne iniyor ve ona ne çıkıyorsa (Allah) hepsini bilir. O çok merhamet edicidir. Çok bağışlayıcıdır."
        cid: 0
  - verse: 3
    segments:
      - text: "İnkâr edenler: \"Bize o kıyamet saati gelmez.\" dediler. De ki: \"Hayır, öyle değil, gaybı bilen Rabbim hakkı için kıyamet size mutlaka gelecektir. O'nun ilminden göklerde ve yerde zerre kadar bir şey kaçmaz. Bundan daha küçük ve daha büyük ne varsa, hepsi muhakkak açık bir kitaptadır.\""
        cid: 0
  - verse: 4
    segments:
      - text: "Çünkü Allah iman edip iyi ameller işleyenlere mükafat verecektir. İşte onlar için bir mağfiret ve cömertçe verilmiş bol rızık vardır."
        cid: 0
  - verse: 5
    segments:
      - text: "Âyetlerimizi hükümsüz bırakmak için yarışanlara gelince, onlar için de pek kötü ve elem verici bir azab vardır."
        cid: 0
  - verse: 6
    segments:
      - text: "Kendilerine ilim verilmiş olanlar görüyorlar ki, Rabbinden sana indirilen Kur'ân, hakkın kendisidir. O, gücüne nihayet olmayan, her hamde lâyık bulunan Allah'ın yolunu gösteriyor."
        cid: 0
  - verse: 7
    segments:
      - text: "Böyle iken inkâr edenler şöyle dediler: \"Siz öldükten sonra, didik didik parçalandığınız vakit, yeniden bir yaratılış içinde bulunacaksınız diye, size birtakım haberler veren kişiyi gösterelim mi?\""
        cid: 0
  - verse: 8
    segments:
      - text: "O, bir yalanı Allah'a iftira mı etti, yoksa kendisinde bir delilik mi var?\" Hayır, doğrusu âhirete inanmayanlar, derin bir sapıklıkla azab içindedirler."
        cid: 0
  - verse: 9
    segments:
      - text: "Ya gökten ve yerden önlerindekine ve arkalarındakine bir bakmazlar mı? Dilesek kendilerini yere geçiriveririz. Yahut gökten üzerlerine parçalar düşürüveririz. Şüphesiz bunda Allah'a yönelen (hakka gönül veren) her kul için bir ibret vardır."
        cid: 0
  - verse: 10
    segments:
      - text: "Andolsun ki, biz Davud'a tarafımızdan bir fazilet verdik. \"Ey dağlar! Onunla beraber tesbih edin.\" dedik ve bunu kuşlara da (emrettik) ve ona demiri yumuşattık."
        cid: 0
  - verse: 11
    segments:
      - text: "Bol bol zırhlar yap ve biçimlemede ölçüyü gözet dedik. Siz de iyi işler yapın, çünkü ben her yapacağınızı gözetiyorum."
        cid: 0
  - verse: 12
    segments:
      - text: "Süleyman'ın emrine de rüzgarı verdik. Sabah gidişi bir aylık, akşam dönüşü bir aylık yol idi. Erimiş bakır menbaını da ona sel gibi akıttık. Hem Rabbi'nin izniyle elinin altında cinlerden de çalışan vardı. Onlardan da kim emrimizden dışarı çıkarsa ona ateş azabından tattırırdık."
        cid: 0
  - verse: 13
    segments:
      - text: "Onlar, ona mihrablar, timsaller (heykeller) ve havuzlar gibi çanaklar ve sâbit kazanlardan her ne isterse yaparlardı. Çalışın ey Davud hanedanı, şükür için çalışın. Ama kullarım içinde şükreden azdır."
        cid: 0
  - verse: 14
    segments:
      - text: "Ne zaman ki Süleyman'a ölümü hükmettik, cinlere onun ölümünü sezdiren olmadı. Yalnız bir güve böceği yere dayandığı asâsını yiyordu. Bu sebeple Süleyman yere yıkılınca ortaya çıktı ki, cinler eğer gaybı bilir olsalar o zilletli azab içinde bekleyip durmazlardı."
        cid: 0
  - verse: 15
    segments:
      - text: "Andolsun ki Sebe' kavmi için oturdukları yerde bir ibret vardı: Sağ ve soldan iki bahçe! (onlara): \"Rabbinizin rızkından yiyin de O'na şükredin, ne güzel bir belde ve çok bağışlayıcı bir Rab!\" (denildi)."
        cid: 0
  - verse: 16
    segments:
      - text: "Fakat onlar (şükürden yüz çevirdiler) bakmadılar. Biz de üzerlerine Arim selini salıverdik ve o güzelim iki bahçelerini buruk yemişli, ılgınlık ve içinde biraz da sidir ağacı bulunan iki harap bahçeye çevirdik."
        cid: 0
  - verse: 17
    segments:
      - text: "Bunu onlara nankörlüklerinin cezası yaptık ve biz hep böyle çok nankör olanları cezalandırırız."
        cid: 0
  - verse: 18
    segments:
      - text: "Biz onlarla o bereket verdiğimiz memleketler arasında, sırt sırta şehirler meydana getirmiştik. Ve onlar da muntazam gidiş geliş düzenledik. (Onlara): Buralarda gecelerce ve gündüzlerce emniyet içinde gezip yürüyün (dedik)."
        cid: 0
  - verse: 19
    segments:
      - text: "Buna karşı onlar: \"Ey Rabbimiz! Seferlerimizin arasını uzaklaştır\" dediler ve nefislerine zulmettiler. Biz de onları efsanelere çevirdik ve tamamen didik didik dağıttık. Şüphesiz ki bunda çok şükredecek her sabırlı için elbette ibretler vardır."
        cid: 0
  - verse: 20
    segments:
      - text: "Yine yemin ederim ki, İblis onlar hakkındaki zannını hakikaten doğru buldu da içlerinde müminlerden ibaret bir gruptan başkası ona uydular."
        cid: 0
  - verse: 21
    segments:
      - text: "Halbuki İblis'in onlar üzerinde hiçbir saltanat kudreti yoktu. Fakat biz ahirete imanı olanı belli edecek, ondan şüphe içinde bulunandan ayırt edecektik. Öyle ya Rabb'in her şeyi gözetleyendir."
        cid: 0
  - verse: 22
    segments:
      - text: "De ki: \"Allah'ı bırakıp da tanrı saydığınız putlarınıza istediğiniz kadar yalvarın. Onların ne göklerde, ne yerde zerre kadar güçleri yetmez. Onların, bunlarda bir ortaklığı da yok. Allah'ın da onlardan bir yardımcısı yoktur.\""
        cid: 0
  - verse: 23
    segments:
      - text: "Allah'ın huzurunda şefaat da fayda vermez. Ancak izin verdiği kimseninki müstesna. Nihayet kalblerinden dehşet giderildiği zaman \"Rabbiniz ne buyurdu?\" derler. (Şefaat sahipleri de): \"Hakkı söyledi\" derler. O, her şeyden yüksek ve büyüktür."
        cid: 0
  - verse: 24
    segments:
      - text: "De ki: \"Size göklerden ve yerden rızık veren kimdir?\" Yine de ki: \"Allah'tır, herhalde ya biz, ya da siz mutlak bir hidayet üzerindeyiz veya açık bir sapıklık içindeyiz.\""
        cid: 0
  - verse: 25
    segments:
      - text: "De ki: \"Siz bizim yaptığımız günahlardan sorumlu tutulmazsınız. Biz de sizin yaptıklarınızdan sorumlu olmayız.\""
        cid: 0
  - verse: 26
    segments:
      - text: "De ki: \"Rabbimiz hepimizi bir araya toplayacak, sonra da hak hükmü ile aramızı ayıracaktır. Asıl hüküm veren ve her şeyi bilen O'dur.\""
        cid: 0
  - verse: 27
    segments:
      - text: "De ki: \"O'na ortak diye takıştırdıklarınızı bana gösterin bakayım! Hayır, öyle şey yoktur, doğrusu güçlü ve hikmet sahibi olan ancak Allah'tır.\""
        cid: 0
  - verse: 28
    segments:
      - text: "Biz seni ancak bütün insanlara bir müjdeci ve bir uyarıcı olarak gönderdik. Fakat insanların çoğu bilmezler."
        cid: 0
  - verse: 29
    segments:
      - text: "Ve: \"Eğer gerçekçiyseniz bu vaad ne zaman olacak?\" diyorlar."
        cid: 0
  - verse: 30
    segments:
      - text: "De ki: \"Size vaad edilen öyle bir gündür ki, ondan ne bir an geri kalabilirsiniz, ne de ileri geçebilirsiniz.\""
        cid: 0
  - verse: 31
    segments:
      - text: "Kâfirler: \"Biz ne bu Kur'ân'a inanırız, ne de ondan öncekilere.\" dediler. Fakat o zalimler yakalanıp Rablerinin huzuruna durduruldukları zaman, birbirlerine söz atarken bir görsen! Bir taraftan zayıf düşürülenler, o büyüklük taslayanlara: \"Siz olmasaydınız biz mutlaka mümin olurduk\" derler."
        cid: 0
  - verse: 32
    segments:
      - text: "Diğer taraftan büyüklük taslayanlar, zayıf düşürülenlere: \"Size hidayet geldikten sonra, sizi ondan biz mi çevirdik? Hayır, siz kendiniz suçluydunuz.\" derler."
        cid: 0
  - verse: 33
    segments:
      - text: "O zayıf düşürülenler de o büyüklük taslayanlara: \"Hayır, (işiniz) gece, gündüz hilekârlıktı. Çünkü siz bize Allah'ı inkâr etmemizi ve O'na eş koşmamızı emrediyordunuz.\" derler. Bunlar azabı gördükleri zaman içlerinden pişmanlık getirmektedirler. Biz de o kâfirlerin boyunlarına demir halkalar geçirmişizdir. Onlar sadece yaptıklarının cezasını çekiyorlardır."
        cid: 0
  - verse: 34
    segments:
      - text: "Biz herhangi bir memlekete tehlikeyi haber veren bir uyarıcı gönderdikse, mutlaka oranın refah ile şımartılmış olanları: \"Biz sizin gönderildiğiniz şeyleri tanımayız.\" dediler."
        cid: 0
  - verse: 35
    segments:
      - text: "Ve yine dediler ki: \"Biz malca da daha çoğuz, evlatça da, bize azab edilmez.\""
        cid: 0
  - verse: 36
    segments:
