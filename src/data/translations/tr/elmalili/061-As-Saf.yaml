surah_id: 61
language: tr
author: elmalili
verses:
  - verse: 1
    segments:
      - text: "Göklerdekilerin ve yerdekilerin hepsi Allah'ı tesbih eder. O, üstündür, hikmet sahibidir."
        cid: 0
  - verse: 2
    segments:
      - text: "Ey iman edenler! Yapmayacağınız şeyi niçin söylüyorsunuz?"
        cid: 0
  - verse: 3
    segments:
      - text: "Yapmayacağınızı söylemeniz, Allah yanında şiddetli bir buğza sebeb olur."
        cid: 0
  - verse: 4
    segments:
      - text: "Allah, kendi yolunda kenetlenmiş bir duvar gibi saf bağlayarak savaşanları sever."
        cid: 0
  - verse: 5
    segments:
      - text: "Bir zaman Musa, kavmine: \"Ey kavmim! Benim, Allah'ın size gönderdiği elçisi olduğumu bildiğiniz halde niçin beni incitiyorsunuz?\" demişti. Onlar eğrilince, Allah da kalblerini eğriltti. Allah fasıkları doğru yola iletmez."
        cid: 0
  - verse: 6
    segments:
      - text: "Meryem oğlu İsa da: \"Ey İsrailoğulları! ben size Allah'ın elçisiyim. benden önce gelen Tevrat'ı doğrulayıcı ve benden sonra gelecek Ahmed adında bir peygamberi müjdeleyici olarak (geldim).\" demişti. Fakat onlara apaçık delillerle gelince \"Bu, apaçık bir büyüdür.\" dediler."
        cid: 0
  - verse: 7
    segments:
      - text: "İslâm'a davet olunduğu halde Allah üzerine yalan uydurandan daha zalim kim olabilir? Allah zalim toplumu doğru yola iletmez."
        cid: 0
  - verse: 8
    segments:
      - text: "Ağızlarıyla Allah'ın nurunu söndürmek istiyorlar. Halbuki kâfirler hoş görmese de Allah nurunu tamamlayacaktır."
        cid: 0
  - verse: 9
    segments:
      - text: "O, Resulünü hidayet ve hak dinle gönderdi ki, müşrikler istemese de onu, bütün dinlerin üstüne çıkarsın."
        cid: 0
  - verse: 10
    segments:
      - text: "Ey İman edenler! Sizi acı bir azabdan kurtaracak ticareti size göstereyim mi?"
        cid: 0
  - verse: 11
    segments:
      - text: "Allah'a ve Resulüne inanırsınız, mallarınızla ve canlarınızla Allah yolunda savaşırsınız. Eğer bilirseniz sizin için en iyisi budur."
        cid: 0
  - verse: 12
    segments:
      - text: "(Eğer böyle yaparsanız Allah) sizin günahlarınızı bağışlar ve sizi altlarından ırmaklar akan cennetlere, Adn cennetlerinde hoş yerlere koyar. İşte büyük kurtuluş budur."
        cid: 0
  - verse: 13
    segments:
      - text: "Seveceğiniz bir şey daha var: Allah'tan yardım ve yakın bir fetih.. Müminleri müjdele."
        cid: 0
  - verse: 14
    segments:
      - text: "Ey inananlar, Allah'ın yardımcıları olun. Nitekim Meryem oğlu İsa da havarilere: \"Allah'a (giden yolda) benim yardımcılarım kimdir?\" demişti. Havariler: \"Allah (yolun)un yardımcıları biziz.\" dediler. İsrail oğullarından bir zümre inandı, bir zümre inkar etti. Biz de inananları, düşmanlarına karşı destekledik, onlar üstün geldiler."
        cid: 0