surah_id: 50
language: tr
author: elmalili
verses:
  - verse: 1
    segments:
      - text: >-
          Kâf. Şanlı ve şerefli Kur'an'a andolsun ki,
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Doğrusu kâfirler kendi içlerinden uyarıcı bir peygamber geldiğine şaşırdılar da
          dediler ki: "Bu şaşılacak bir şeydir!
        cid: 0
  - verse: 3
    segments:
      - text: >-
          Öldüğümüz ve bir toprak olduğumuz vakit mi (tekrar) dirileceğiz? bu dönüş çok
          uzaktır."
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Fakat biz toprağın onlardan neyi eksilttiğini elbette biliyoruz. Yanımızda
          herşeyi kaydedip muhafaza eden bir kitap vardır.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Doğrusu hak kendilerine geldiği zaman yalanladılar da şimdi karmakarışık bir
          ıztırap içindeler.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Artık üstlerindeki göğe bakmazlar mı ki, onu nasıl bina etmiş ve süslemişiz,
          onun hiç bir çatlağı yoktur.
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Yeri de nasıl uzatmış, üzerine sabit dağlar oturtmuşuz. Orada görünüşü güzel
          her çeşit bitkiden çiftler yetiştirdik.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Bunlar, Allah'a yönelen her kula gönül gözünü açmak ve ona ibret vermek
          içindir.
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Bir de gökten bereketli bir su indirip de onunla bağlar, bahçeler ve biçilecek
          taneler bitirmekteyiz.
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Tomurcukları birbiri üzerine dizilmiş uzun boylu hurma ağaçları yetiştirdik.
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Bunları kullara rızık olması için (yetiştirmekteyiz). O su ile ölü bir toprağa
          can verdik, işte hayata çıkış da böyledir.
        cid: 0
  - verse: 12
    segments:
      - text: >-
          Onlardan önce Nuh'un kavmi, Ress halkı ve Semûd da yalanlamıştı.
        cid: 0
  - verse: 13
    segments:
      - text: >-
          Âd, Firavun, Lût'un kardeşleri de (yalanladılar).
        cid: 0
  - verse: 14
    segments:
      - text: >-
          Eyke halkı ve Tübbâ kavmi de, bunların hepsi peygamberleri yalanladılar da
          (onlara) azabım hak oldu.
        cid: 0
  - verse: 15
    segments:
      - text: >-
          Biz ilk yaratmada acizlik mi gösterdik? Doğrusu, onlar yeni bir yaratılıştan
          şüphe içindedirler.
        cid: 0
  - verse: 16
    segments:
      - text: >-
          Andolsun insanı biz yarattık ve nefsinin kendisine fısıldadıklarını biliriz. Ve
          biz ona şah damarından daha yakınız.
        cid: 0
  - verse: 17
    segments:
      - text: >-
          Onun sağında ve solunda oturmuş iki melek zabıt tutarken,
        cid: 0
  - verse: 18
    segments:
      - text: >-
          İnsan hiçbir söz söylemez ki yanında (onu) gözetleyen, dediklerini zapteden bir
          melek hazır bulunmasın.
        cid: 0
  - verse: 19
    segments:
      - text: >-
          Ölüm sarhoşluğu gerçekten geldiğinde, "Ey insan! İşte bu senin öteden beri
          kaçtığın şeydir." denir.
        cid: 0
  - verse: 20
    segments:
      - text: >-
          Sur'a üfürülür, işte bu, tehdid(in gerçekleşme) günüdür.
        cid: 0
  - verse: 21
    segments:
      - text: >-
          Her can, kendisiyle beraber bir sevk memuru ve bir şahid bulunduğu halde gelir.
        cid: 0
  - verse: 22
    segments:
      - text: >-
          (Allah ona) "Andolsun sen bundan gaflet içinde idin. Şimdi senden gaflet
          perdesini kaldırdık. Bugün artık gözün keskindir." der.
        cid: 0
  - verse: 23
    segments:
      - text: >-
          Beraberindeki melek "işte yanımdaki hazır" der.
        cid: 0
  - verse: 24
    segments:
      - text: >-
          (Allah iki meleğe buyurur ki:) "Haydi ikiniz, atın cehenneme her inatçı
          nankörü!
        cid: 0
  - verse: 25
    segments:
      - text: >-
          İyiliklere (sürekli) engel olan, saldırgan, şüpheciyi.
        cid: 0
  - verse: 26
    segments:
      - text: >-
          O ki Allah'ın yanında başka ilâh edinmiştir. Haydi ikiniz birlikte onu şiddetli
          azaba atın."
        cid: 0
  - verse: 27
    segments:
      - text: >-
          Yanındaki arkadaşı (şeytan) der ki: "Rabbimiz! Ben onu azdırmadım. Fakat
          kendisi derin bir sapıklık içindeydi".
        cid: 0
  - verse: 28
    segments:
      - text: >-
          Allah buyurur ki: "Huzurumda çekişmeyin! Ben size daha önce uyarıcı
          göndermiştim."
        cid: 0
  - verse: 29
    segments:
      - text: >-
          Benim huzurumda söz değiştirilmez. Ve ben kullara asla zulmedici değilim.
        cid: 0
  - verse: 30
    segments:
      - text: >-
          Biz O gün cehenneme: "Doldun mu?" diyeceğiz. O da: "Daha fazla var mı?"
          diyecektir.
        cid: 0
  - verse: 31
    segments:
      - text: >-
          Cennet de kötülükten sakınanlara yaklaştırılır. Zaten uzak değildir.
        cid: 0
  - verse: 32
    segments:
      - text: >-
          Onlara denir ki: "İşte size vaad edilen bu cennet, Allah'a yönelen, O'nun
          emirlerine riayet eden, görmediği halde Rahman olan Allah'tan korkan ve O'na
          yönelen bir kalple gelenlere mahsustur.
        cid: 0
  - verse: 33
    segments:
      - text: >-
          Onlara denir ki: "İşte size vaad edilen bu cennet, Allah'a yönelen, O'nun
          emirlerine riayet eden, görmediği halde Rahman olan Allah'tan korkan ve O'na
          yönelen bir kalple gelenlere mahsustur.
        cid: 0
  - verse: 34
    segments:
      - text: >-
          "Şimdi selam ve selametle oraya girin. İşte sonsuzluk günü budur."
        cid: 0
  - verse: 35
    segments:
      - text: >-
          Orada onlara ne isterlerse vardır. Katımızda daha fazlası da vardır.
        cid: 0
  - verse: 36
    segments:
      - text: >-
          Ey Muhammed! Biz onlardan önce kendilerinden daha kuvvetli olan ve beldeleri
          delik deşik eden nice nesilleri helak ettik, hiç kurtuluş var mı?
        cid: 0
  - verse: 37
    segments:
      - text: >-
          Şüphesiz ki bunda kalbi olan ve hazır bulunup kulak veren kimse için elbette
          bir öğüt vardır.
        cid: 0
  - verse: 38
    segments:
      - text: >-
          Andolsun ki biz gökleri, yeri ve ikisi arasındakileri altı günde yarattık, Bize
          hiçbir yorgunluk da dokunmadı.
        cid: 0
  - verse: 39
    segments:
      - text: >-
          Ey Muhammed! Onların söylediklerine karşı sabret. Güneşin doğuşundan önce
          (sabah namazını) ve batışından önce de (öğle ve ikindi namazalarını kılarak)
          Rabbini Hamd ile tesbih et.
        cid: 0
  - verse: 40
    segments:
      - text: >-
          Geceleyin (akşam ve yatsı namazlarını kılarak), namazlardan sonra da (vitir ve
          nafile kılarak) O'nu tesbih et.
        cid: 0
  - verse: 41
    segments:
      - text: >-
          Bir münadinin yakın bir yerden sesleneceği güne kulak ver.
        cid: 0
  - verse: 42
    segments:
      - text: >-
          O gün insanlar, o çağrıyı gerçek olarak duyarlar. İşte bugün, kabirlerden çıkış
          günüdür.
        cid: 0
  - verse: 43
    segments:
      - text: >-
          Gerçekten biz hem yaşatırız, hem öldürürüz. Sonunda dönüş yalnız bizedir.
        cid: 0
  - verse: 44
    segments:
      - text: >-
          O gün yer yarılır, insanlar kabirlerinden çabucak çıkarlar. İşte bu, sadece
          bize göre kolay bir toplanmadır.
        cid: 0
  - verse: 45
    segments:
      - text: >-
          Biz onların söylediklerini daha iyi biliriz. Sen onlara karşı zor kullanacak
          değilsin. O halde sen, benim tehdidimden korkanlara bu Kur'ân ile öğüt ver.
        cid: 0