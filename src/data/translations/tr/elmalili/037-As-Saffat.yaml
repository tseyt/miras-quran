          vardır.
        cid: 0
  - verse: 49
    segments:
      - text: >-
          Sanki onlar örtülüp saklanmış yumurta gibidirler.
        cid: 0
  - verse: 50
    segments:
      - text: >-
          Derken birbirine dönüp sorarlar:
        cid: 0
  - verse: 51
    segments:
      - text: >-
          İçlerinden bir sözcü der ki: "Gerçekten benim bir arkadaşım vardı."
        cid: 0
  - verse: 52
    segments:
      - text: >-
          Derdi ki: "Sen gerçekten inananlardan mısın?"
        cid: 0
  - verse: 53
    segments:
      - text: >-
          "Öldüğümüz ve bir toprakla bir yığın kemik olduğumuz zaman biz hakikaten
