        cid: 0
  - verse: 54
    segments:
      - text: >-
          "Siz onu tanır mısınız?" der.
        cid: 0
  - verse: 55
    segments:
      - text: >-
          Derken bakınır ve onu cehennemin ta ortasında görür.
        cid: 0
  - verse: 56
    segments:
      - text: >-
          Ona şöyle der: "Allah'a yemin ederim ki, doğrusu sen az daha beni helak
          edecektin."
        cid: 0
  - verse: 57
    segments:
      - text: >-
          "Rabbimin nimeti olmasaydı, ben de bu tutuklananlardan olacaktım."
        cid: 0
  - verse: 58
    segments:
      - text: >-
          "Nasılmış bak. Biz ilk ölümümüzden başka bir daha ölmeyecek miymişiz? Biz azaba
          uğratılmayacak mıymışız?
        cid: 0
  - verse: 59
    segments:
      - text: >-
          "Nasılmış bak. Biz ilk ölümümüzden başka bir daha ölmeyecek miymişiz? Biz azaba
          uğratılmayacak mıymışız?
        cid: 0
  - verse: 60
