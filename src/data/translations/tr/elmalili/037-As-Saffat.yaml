surah_id: 37
language: tr
author: elmalili
verses:
  - verse: 1
    segments:
      - text: >-
          Andolsun o saf bağlayıp duranlara.
        cid: 0
  - verse: 2
    segments:
      - text: >-
          O haykırıp da sürenlere.
        cid: 0
  - verse: 3
    segments:
      - text: >-
          Ve o yolda zikir okuyanlara.
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Ki sizin ilâhınız birdir.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          O, göklerin, yerin ve aralarındakilerin Rabbidir, bütün doğuların da Rabbidir.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Gerçekten biz dünya göğünü (o yakın göğü) bir zinetle, yıldızlarla süsledik.
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Onu her inatçı şeytandan koruduk.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Onlar yüksek (melekler) topluluğunu dinleyemezler. Her taraftan kovulup
          atılırlar.
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Uzaklaştırılırlar. Onlara ardı arkası kesilmez bir azab vardır.
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Ancak kulak hırsızlığı yapanlar olur. Onu da yakıcı bir alev takip eder.
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Şimdi onlara sor: "Yaradılışça kendileri mi daha çetin, yoksa bizim
          yarattıklarımız mı?" Gerçekten biz onları cıvık bir çamurdan yarattık.
        cid: 0
  - verse: 12
    segments:
      - text: >-
          Fakat sen onlara şaşıyorsun, ama onlar (seninle) eğleniyorlar.
        cid: 0
  - verse: 13
    segments:
      - text: >-
          Kendilerine hatırlatıldığında da düşünmüyorlar.
        cid: 0
  - verse: 14
    segments:
      - text: >-
          Bir mucize gördükleri zaman da eğlenceye alıyorlar.
        cid: 0
  - verse: 15
    segments:
      - text: >-
          Ve diyorlar ki: "Bu apaçık büyüden başka bir şey değildir."
        cid: 0
  - verse: 16
    segments:
      - text: >-
          "Öldüğümüz ve bir toprakla bir yığın kemik olduğumuz zaman mı biz tekrar
          dirilecekmişiz?"
        cid: 0
  - verse: 17
    segments:
      - text: >-
          "Önceki atalarımız da mı?.."
        cid: 0
  - verse: 18
    segments:
      - text: >-
          De ki: "Evet, hem de sizler çok aşağılanmış olarak (dirileceksiniz)."
        cid: 0
  - verse: 19
    segments:
      - text: >-
          Çünkü O (sura üfürmek) zorlu bir kumandadan ibarettir ki, derhal onların
          gözleri açılıverir.
        cid: 0
  - verse: 20
    segments:
      - text: >-
          "Eyvah bizlere! İşte bu hesap günüdür." derler.
        cid: 0
  - verse: 21
    segments:
      - text: >-
          (Onlara): "İşte bu, sizin yalanlamakta olduğunuz (iyi ve kötüyü) ayırt etme
          günüdür" denir.
        cid: 0
  - verse: 22
    segments:
      - text: >-
          Toplayın mahşere o zulmedenleri, eşlerini ve Allah'tan başka taptıkları
          şeyleri. Toplayın da götürün onları sırata (cehennem köprüsüne) doğru.
        cid: 0
  - verse: 23
    segments:
      - text: >-
          Toplayın mahşere o zulmedenleri, eşlerini ve Allah'tan başka taptıkları
          şeyleri. Toplayın da götürün onları sırata (cehennem köprüsüne) doğru.
        cid: 0
  - verse: 24
    segments:
      - text: >-
          Ve durdurun onları, çünkü sorguya çekilecekler.
        cid: 0
  - verse: 25
    segments:
      - text: >-
          (Onlara): "Ne oldu sizlere de yardımlaşmıyorsunuz?" (denilir.)
        cid: 0
  - verse: 26
    segments:
      - text: >-
          Hayır, bugün onlar teslim olmuşlardır.
        cid: 0
  - verse: 27
    segments:
      - text: >-
          Onlar, birbirine dönmüş soruşuyorlar.
        cid: 0
  - verse: 28
    segments:
      - text: >-
          Onlar: "Siz bize (uğurlu görünerek) sağdan gelir dururdunuz" derler.
        cid: 0
  - verse: 29
    segments:
      - text: >-
          (İleri gelenler de) derler ki: "Hayır, siz inanmamıştınız."
        cid: 0
  - verse: 30
    segments:
      - text: >-
          "Bizim de size karşı bir gücümüz yoktu. Fakat siz azmış bir kavimdiniz."
        cid: 0
  - verse: 31
    segments:
      - text: >-
          "Onun için üzerimize Rabbimizin azab sözü hak oldu. Şüphesiz azabımızı
          tadacağız."
        cid: 0
  - verse: 32
    segments:
      - text: >-
          "Evet biz, sizi kışkırttık. Çünkü biz azgındık."
        cid: 0
  - verse: 33
    segments:
      - text: >-
          O halde hepsi o gün azabda ortaktırlar.
        cid: 0
  - verse: 34
    segments:
      - text: >-
          İşte biz günahkarlara böyle yaparız.
        cid: 0
  - verse: 35
    segments:
      - text: >-
          Çünkü onlar, kendilerine: "Allah'tan başka ilâh yoktur" denildiği zaman kafa
          tutuyorlardı.
        cid: 0
  - verse: 36
    segments:
      - text: >-
          Ve: "Biz, hiçbir mecnun (deli) şair için ilâhlarımızı bırakır mıyız?"
          diyorlardı.
        cid: 0
  - verse: 37
    segments:
      - text: >-
          Hayır o, hak ile geldi ve bütün peygamberleri tasdik etti.
        cid: 0
  - verse: 38
    segments:
      - text: >-
          Elbette siz o acı azabı tadacaksınız.
        cid: 0
  - verse: 39
    segments:
      - text: >-
          Bununla beraber başka değil, hep yaptığınız amellerinizle
          cezalandırılacaksınız.
        cid: 0
  - verse: 40
    segments:
      - text: >-
          Sadece Allah'ın ihlaslı kulları müstesnadır.
        cid: 0
  - verse: 41
    segments:
      - text: >-
          İşte onlar için belli bir rızık vardır.
        cid: 0
  - verse: 42
    segments:
      - text: >-
          Meyveler (vardır), Naîm cennetlerinde onlara hep ikram edilir.
        cid: 0
  - verse: 43
    segments:
      - text: >-
          Meyveler (vardır), Naîm cennetlerinde onlara hep ikram edilir.
        cid: 0
  - verse: 44
    segments:
      - text: >-
          (Onlar) Karşılıklı tahtlar üzerindedirler.
        cid: 0
  - verse: 45
    segments:
      - text: >-
          İçenlere lezzet veren, pınardan doldurulmuş bembeyaz bir kadehle onların
          etrafında dolaşılır.
        cid: 0
  - verse: 46
    segments:
      - text: >-
