surah_id: 30
language: tr
author: elmalili
verses:
  - verse: 1
    segments:
      - text: >-
          Elif, Lâm, Mim.
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Rumlar yenildi.
        cid: 0
  - verse: 3
    segments:
      - text: >-
          (Arapların bulunduğu bölgeye) en yakın bir yerde onlar, bu yenilgilerinin
          ardından mutlaka galib geleceklerdir.
        cid: 0
  - verse: 4
    segments:
      - text: >-
          (Bu da) birkaç yıl içinde (olacaktır). Onların bu yenilgilerinden önce de sonra
          da emir Allah'ındır ve o gün müminler, sevineceklerdir.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          (Bu da) Allah'ın yardımıyla (olacaktır). Allah dilediğine yardım eder, galip
          kılar. O çok güçlüdür, çok merhamet edicidir.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Allah'ın vaadi budur. Allah, vaadinden caymaz. Fakat insanların çoğu bilmezler.
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Onlar, sadece bu dünya hayatının dış yüzünü bilirler. Ahiretten ise onlar hep
          gafildirler.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Kendi içlerinde hiç düşünmediler mi ki, Allah göklerde, yerde ve bu ikisi
          arasında bulunan her şeyi ancak hak ile ve belirlenmiş bir süre için
          yaratmıştır? Gerçekten insanların çoğu, Rablerine kavuşmayı inkâr etmektedirler.
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Onlar, yeryüzünde gezmediler mi ki, kendilerinden öncekilerin sonu nasıl olmuş
          baksınlar? Onlar, kendilerinden daha güçlüydüler. Toprağı sürmüşler ve onu,
          bunların imar ettiklerinden daha çok imar etmişlerdi. Onlara da peygamberleri
          delillerle gelmişlerdi. Demek Allah onlara zulmetmiyordu. Fakat onlar,
          kendilerine zulmediyorlardı.
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Sonra o kötülük edenlerin sonu çok kötü oldu. Çünkü onlar, Allah'ın âyetlerini
          yalan saydılar ve onlarla alay ediyorlardı.
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Allah yaratmayı ilkin yapar, sonra da çevirir, onu yeniden yapar. Sonra hep
          döndürülüp O'na götürüleceksiniz.
        cid: 0
  - verse: 12
    segments:
      - text: >-
          Kıyamet saatinin gelip çattığı gün suçlular, her ümidi keserler.
        cid: 0
  - verse: 13
    segments:
      - text: >-
          Allah'a ortak koştuklarından, kendilerine şefaat edecekler de bulunmaz. Onlar,
          o zaman Allah'a koştukları ortakları inkâr ederler.
        cid: 0
  - verse: 14
    segments:
      - text: >-
          Kıyamet saatinin gelip çattığı gün varya, o gün (inananlarla inanmayanlar)
          ayrılırlar.
        cid: 0
  - verse: 15
    segments:
      - text: >-
          Şimdi iman edip salih ameller yapmış olanlara gelince, onlar bir bahçe içinde
          neşelenirler.
        cid: 0
  - verse: 16
    segments:
      - text: >-
          Âyetlerimizi ve âhiret buluşmasını yalan sayıp da küfredenlere gelince, işte
          onlar o zaman azab içinde hazır bulundurulurlar.
        cid: 0
  - verse: 17
    segments:
      - text: >-
          O halde akşama girdiğiniz zaman da, sabaha girdiğiniz zaman da tesbih
          Allah'ındır. (daima O, tesbih edilir).
        cid: 0
  - verse: 18
    segments:
      - text: >-
          Göklerde ve yerde, ikindileyin de, öğleye erdiğiniz zaman da hamd O'na
          mahsustur.
        cid: 0
  - verse: 19
    segments:
      - text: >-
          O, ölüden diri çıkarır, diriden ölü çıkarır ve toprağa ölümünden sonra hayat
          verir. Sizler de işte öyle çıkarılacaksınız.
        cid: 0
  - verse: 20
    segments:
      - text: >-
          O'nun âyetlerinden (kudretinin delillerinden)dir ki, sizi bir topraktan
          yarattı. Sonra da siz şimdi yeryüzünde dağılıp yayılan insanlar oluverdiniz.
        cid: 0
  - verse: 21
    segments:
      - text: >-
          Yine O'nun âyetlerindendir ki, sizin için nefislerinizden kendilerine
          ısınırsınız diye eşler yaratmış, aranıza bir sevgi ve merhamet koymuştur.
          Şüphesiz ki bunda düşünecek bir kavim için nice ibretler vardır.
        cid: 0
  - verse: 22
    segments:
      - text: >-
          Yine göklerin ve yerin yaratılışı ile dillerinizin ve renklerinizin farklı
          oluşu da O'nun âyetlerindendir. Şüphesiz ki bunda bilenler için nice ibretler
          vardır.
        cid: 0
  - verse: 23
    segments:
      - text: >-
          Yine gecede ve gündüzde uyumanız ve lütfundan nasib aramanız da O'nun
          âyetlerindendir. Şüphesiz ki bunda dinleyecek bir kavim için nice ibretler
          vardır.
        cid: 0
  - verse: 24
    segments:
      - text: >-
          Yine O'nun âyetlerindendir ki, size hem korku ve hem de umut vermek için
          şimşeği gösteriyor. Ve gökten bir su indiriyor da onunla yeryüzüne ölümünden
          sonra hayat veriyor. Şüphesiz ki bunda aklını kullanacak bir kavim için nice
          ibretler vardır.
        cid: 0
  - verse: 25
    segments:
      - text: >-
          Yine göğün ve yerin, emriyle durması da O'nun âyetlerindendir. Sonra sizi bir
          tek çağırışla çağırdığı zaman bir de bakarsınız ki (yerden diriltilip
          çıkarılıyorsunuz).
        cid: 0
  - verse: 26
    segments:
      - text: >-
          Göklerde ve yerde kim varsa hepsi O'nundur. Hepsi de O'na itaat etmektedirler.
        cid: 0
  - verse: 27
    segments:
      - text: >-
          Hem yaratmayı ilkin yapan O'dur. Sonra onu çevirip yeniden yapacak olan da
          O'dur ki, bu O'na çok kolaydır. Göklerde ve yerde en yüksek şan ve şeref
          O'nundur. O çokgüçlüdür, hüküm ve hikmet sahibidir.
        cid: 0
  - verse: 28
    segments:
      - text: >-
          Allah, size kendinizden bir misâl verdi: Hiç size rızık olarak verdiğimiz
          şeylerde elleriniz altındaki kölelerinizden ortaklarınız bulunur da onlarla siz
          eşit olur, aranızda birbirinizi saydığınız gibi, onları da sayar mısınız? İşte
          biz, düşünecek bir kavim için âyetleri böyle açıklıyoruz.
        cid: 0
  - verse: 29
    segments:
      - text: >-
          Fakat zulmedenler, bilgisizce hevalarına uydular. Artık Allah'ın şaşırdığını
          kim yola getirebilir? Onların yardımcıları da yoktur.
        cid: 0
  - verse: 30
    segments:
      - text: >-
          O halde yüzünü, Allah'ı bir tanıyarak dine, Allah'ın insanları üzerine yaratmış
          olduğu fıtratına doğrult. Allah'ın yaratışında değişiklik bulunmaz. Dosdoğru din
          budur. Fakat insanların çoğu bilmezler.
        cid: 0
  - verse: 31
    segments:
      - text: >-
          Başkasından geçerek hep O'na gönül verin ve O'ndan sakının. Namaza devam edin
          ve müşrilerden olmayın.
        cid: 0
  - verse: 32
    segments:
      - text: >-
          O müşriklerden (olmayın ki) onlar, dinlerini ayırıp öbek öbek olmuşlardır. Her
          grup kendilerindekine güvenmektedir.
        cid: 0
  - verse: 33
    segments:
      - text: >-
          Bununla beraber insanlara bir keder dokunduğu zaman her şeyden geçerek
          Rablerine yalvarır, dua ederler; sonra tarafından bir rahmet tattırıverdiği
          zaman da bakarsın onlardan bir kısmı tutar, O Rablerine ortak koşarlar.
        cid: 0
  - verse: 34
    segments:
      - text: >-
          Bunu da kendilerine verdiğimiz nimetlere nankörlük etmek için yaparlar. Haydi
          geçinedurun bakalım, yakında bileceksiniz.
        cid: 0
  - verse: 35
    segments:
      - text: >-
          Yoksa biz onlara bir delil indirmişiz de O'na ortak koşmalarını o mu söylüyor?
        cid: 0
  - verse: 36
    segments:
      - text: >-
          Bir de biz insanlara bir rahmet tattırdığımız zaman ona güveniyorlar da;
          ellerinin önceden yaptığı şeyler sebebiyle başlarına bir fenalık gelirse, hemen
          her ümidi kesiveriyorlar.
        cid: 0
  - verse: 37
    segments:
      - text: >-
          Onlar görmediler mi ki, Allah dilediği kimseye rızkı serer ve daraltır.
          Şüphesiz ki bunda iman edecek bir kavim için ibretler vardır.
        cid: 0
  - verse: 38
    segments:
      - text: >-
          O halde akrabaya da hakkını ver, yoksula da, yolcuya da... Bu, Allah'ın
          rızasını dileyenler için daha hayırlıdır. Kurtuluşa erecek olanlar da işte
          onlardır.
        cid: 0
  - verse: 39
    segments:
      - text: >-
          İnsanların malları içinde artsın diye verdiğiniz faiz, Allah yanında artmaz.
          Allah'ın rızasını dileyerek verdiğiniz zekata gelince, işte onlar, malları kat
          kat artmış olanlardır.
        cid: 0
  - verse: 40
    segments:
      - text: >-
          Allah, O'dur ki, sizi yarattı, sonra da size rızık verdi, sonra sizi öldürür,
          sonra sizi diriltir. Hiç sizin ortak koştuklarınızdan, bunlardan birini yapacak
          olan var mı? Allah, onların ortak koştuklarından münezzeh ve yücedir.
        cid: 0
  - verse: 41
    segments:
      - text: >-
          Yaptıklarının bir kısmını tatsınlar diye insanların kendi ellerinin kazandığı
          şeyler yüzünden karada ve denizde fesat ortaya çıktı. Umulur ki onlar hakka
          dönerler.
        cid: 0
  - verse: 42
    segments:
      - text: >-
          De ki, yeryüzünde bir gezin de bakın, bundan öncekilerin sonu nasıl olmuş!
          Onların pek çoğu müşrik idiler.
        cid: 0
  - verse: 43
    segments:
      - text: >-
          Allah'tan geri çevrilmesine hiçbir çare olmayan bir gün gelmeden önce yüzünü
          dosdoğru, sabit dine çevir. O gün (gelince) insanlar birbirlerinden ayrılırlar.
        cid: 0
  - verse: 44
    segments:
      - text: >-
          Her kim inkâr ederse, inkârı kendi aleyhinedir. Kim de salih amel işlerse,
          onlar kendileri için rahat bir yer hazırlamış olurlar.
        cid: 0
  - verse: 45
    segments:
      - text: >-
          Çünkü O, iman edip salih amel işleyenlere lütfundan mükafat verecektir. Çünkü
          O, kâfirleri sevmez.
        cid: 0
  - verse: 46
    segments:
      - text: >-
          Rüzgarları müjdeciler olarak göndermesi, size rahmetinden tattırması, emriyle
          gemilerin akıp gitmesi ve lütfundan rızık isteyip kazanmanız O'nun
          âyetlerindendir. Hem gerek ki şükredesiniz.
        cid: 0
  - verse: 47
    segments:
      - text: >-
          Andolsun ki biz, senden önce birçok peygamberleri kavimlerine gönderdik de,
          onlara apaçık delillerle vardılar. Onun üzerine günah işleyenlerden intikam
          aldık. Müminlere yardım ise, bizim nezdimizde bir hak oldu.
        cid: 0
  - verse: 48
    segments:
      - text: >-
          Allah O'dur ki, rüzgarları gönderir de bir bulut savururlar. Derken onu
          gökyüzünde nasıl dilerse öyle serer, parça parça da eder. Derken yağmuru
          görürsün, aralarından çıkar. Derken onu kullarından kimlere diliyorsa döküverdi
          mi derhal yüzleri güler.
        cid: 0
  - verse: 49
    segments:
      - text: >-
          Halbuki onlar, daha önce üzerlerine yağmur indirilmeden evvel ümidi
          kesmişlerdi.
        cid: 0
  - verse: 50
    segments:
      - text: >-
          Şimdi bak Allah'ın rahmetinin eserlerine! yeryüzünü ölümünden sonra nasıl
          diriltiyor? Şüphe yok ki O, mutlaka ölüleri diriltir. O her şeye kâdirdir.
        cid: 0
  - verse: 51
    segments:
      - text: >-
          Andolsun ki biz, bir rüzgâr göndersek de onu (rahmetin eseri olan ekini)
          sararmış görseler, mutlaka onun arkasından nankörlüğe başlarlar.
        cid: 0
  - verse: 52
    segments:
      - text: >-
          Çünkü sen ölülere işittiremezsin. O daveti, arkalarını dönmüş giderlerken
          sağırlara da duyuramazsın.
        cid: 0
  - verse: 53
    segments:
      - text: >-
          Körleri de sapıklıklarından hidayete getiremezsin. Sen ancak âyetlerimizi iman
          edeceklere duyurursun da onlar müslüman olur, selâmeti bulurlar.
        cid: 0
  - verse: 54
    segments:
      - text: >-
          Allah O'dur ki, sizi güçsüz olarak yaratır, sonra güçsüzlüğün arkasından kuvvet
          verir. Sonra kuvvetin arkasından yine güçsüzlüğe ve ihtiyarlığa getirir. O
          dilediğini yaratır. Ve O, her şeyi bilir, her şeye gücü yeter.
        cid: 0
  - verse: 55
    segments:
      - text: >-
          Kıyamet kopacağı gün günahkarlar dünyada bir saatten fazla durmadıklarına yemin
          ederler. Onlar önceden de böyle haktan çevriliyorlardı.
        cid: 0
  - verse: 56
    segments:
      - text: >-
          Kendilerine ilim ve iman verilenler de şöyle diyecekler: "Andolsun ki, Allah'ın
          kitabında takdir edilmiş olan tekrar dirilme gününe kadar kaldınız. İşte bu,
          dirilme günüdür. Fakat siz bunu bilmiyordunuz.
        cid: 0
  - verse: 57
    segments:
      - text: >-
          Artık o gün zulmedenlere mazeretleri fayda vermeyecektir. Onların dertlerinin
          çaresine de bakılmayacaktır.
        cid: 0
  - verse: 58
    segments:
      - text: >-
          Andolsun ki, biz insanlar için bu Kur'ân'da her türlü meselden örnekler
          getirdik. Yemin ederim ki, sen onlara başka bir âyet de getirsen o kâfirler
          yine: "Siz yalancılardan (uydurduğunuz sözü Allah'a nispet edenlerden) başkası
          değilsiniz." diyeceklerdir.
        cid: 0
  - verse: 59
    segments:
      - text: >-
          İşte bilmeyenlerin kalblerini Allah böyle mühürler.
        cid: 0
  - verse: 60
    segments:
      - text: >-
          Şimdi sen sabret. Çünkü Allah'ın vaadi mutlaka haktır. Sakın imanı sağlam
          olmayanlar seni hafifliğe sevketmesinler.
        cid: 0