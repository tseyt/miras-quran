surah_id: 104
language: tr
author: elmalili
verses:
  - verse: 1
    segments:
      - text: >-
          Mal toplayıp onu tekrar tekrar sayan, insanları arkadan çekiştirip, kaş göz
          hareketleriyle alay edenlerin (hümeze ve lümezenin) vay haline!
        cid: 0
  - verse: 2
    segments:
