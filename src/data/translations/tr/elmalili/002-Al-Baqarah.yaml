surah_id: 2
language: tr
author: elmalili
verses:
  - verse: 1
    segments:
      - text: Elif, Lam, Mim.
        cid: 0
  - verse: 2
    segments:
      - text: Bu, doğruluğu şüphe götürmeyen ve Allah'a karşı gelmekten sakınanlara yol gösteren Kitap'dır.
        cid: 0
  - verse: 3
    segments:
      - text: Onlar, gaybe inanırlar, namazı kılarlar, kendilerine verdiğimiz rızıktan yerli yerince sarfederler.
        cid: 0
  - verse: 4
    segments:
      - text: Onlar, sana indirilen Kitap'a da, senden önce indirilenlere de inanırlar; ahirete de yalnız onlar kesinlikle inanırlar.
        cid: 0
  - verse: 5
    segments:
      - text: İşte Rab'lerinin yolunda olanlar ve saadete erişenler bunlardır.
        cid: 0
  - verse: 6
    segments:
      - text: Şüphe yok ki, inkar edenleri, başlarına gelecekle uyarsan da uyarmasan da birdir, inanmazlar.
        cid: 0
  - verse: 7
    segments:
      - text: Allah onların kalblerini ve kulaklarını mühürlemiştir, gözlerinde de perde vardır ve büyük azab onlar içindir.
        cid: 0
  - verse: 8
    segments:
      - text: İnsanlardan, inanmadıkları halde, "Allah'a ve ahiret gününe inandık" diyenler vardır.
        cid: 0
  - verse: 9
    segments:
      - text: Bunlar Allah'ı ve inananları aldatmaya çalışırlar, oysa sadece kendilerini aldatırlar da farkında değildirler.
        cid: 0
  - verse: 10
    segments:
      - text: Kalblerinde hastalık vardır, Allah hastalıklarını artırmıştır. Yalan söyleye geldikleri için onlara elem verici azab vardır.
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Kendilerine: "Yeryüzünde bozgunculuk yapmayın" dendiği zaman, "Bizler sadece
          ıslah edicileriz" derler.
        cid: 0
  - verse: 12
    segments:
      - text: İyi bilin ki, asıl bozguncular kendileridir, lakin farkında değillerdir.
        cid: 0
  - verse: 13
    segments:
      - text: Onlara "Müslümanların inandığı gibi siz de inanın" denilince de, "Beyinsizlerin inandığı gibi mi inanalım?" derler; iyi bilin ki asıl beyinsizler kendileridir, fakat bilmezler.
        cid: 0
  - verse: 14
