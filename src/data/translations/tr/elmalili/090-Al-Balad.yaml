surah_id: 90
language: tr
author: elmalili
verses:
  - verse: 1
    segments:
      - text: >-
          Andolsun bu beldeye
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Ki sen bu beldede oturmaktasın.
        cid: 0
  - verse: 3
    segments:
      - text: >-
          Ve and olsun baba ve çocuğuna.
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Biz insanı gerçekten bir sıkıntı içinde yarattık.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          İnsan, kendisine karşı kimse güç yetiremez mi sanıyor?
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Ben, yığın yığın mal yok ettim diyor.
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Kendisini bir gören olmadı mı sanıyor?
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Biz ona iki göz vermedik mi?
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Bir dil ve iki dudak?
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Ona iki yolu gösterdik.
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Fakat o, o sarp yokuşa göğüs veremedi.
        cid: 0
  - verse: 12
    segments:
      - text: >-
          Bildin mi sen, o sarp yokuş nedir?
        cid: 0
  - verse: 13
    segments:
      - text: >-
          Köle azat etmek,
        cid: 0
  - verse: 14
    segments:
      - text: >-
          Veya salgın bir kıtlık gününde yemek yedirmektir,
        cid: 0
  - verse: 15
    segments:
      - text: >-
          Yakınlığı olan bir yetime,
        cid: 0
  - verse: 16
    segments:
      - text: >-
          Veya hiçbir şeyi olmayan yoksula.
        cid: 0
  - verse: 17
    segments:
      - text: >-
          Sonra da iman edip de sabrı tavsiye eden ve merhamet tavsiye edenlerden
          olmaktır.
        cid: 0
  - verse: 18
    segments:
      - text: >-
          İşte bunlar, amel defterleri sağlarından verilenlerdir.
        cid: 0
  - verse: 19
    segments:
      - text: >-
          Âyetlerimizi tanımayanlar ise, onlardır işte amel defterleri sollarından
          verilenler.
        cid: 0
  - verse: 20
    segments:
      - text: >-
          Onların üzerlerine bir ateş bastırılıp kapıları kapanacaktır.
        cid: 0