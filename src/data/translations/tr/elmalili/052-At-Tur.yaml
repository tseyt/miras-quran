surah_id: 52
language: tr
author: elmalili
verses:
  - verse: 1
    segments:
      - text: "Andolsun Tûr'a,"
        cid: 0
  - verse: 2
    segments:
      - text: "Yayılmış ince deri üzerine, satır satır yazılmış kitaba,"
        cid: 0
  - verse: 3
    segments:
      - text: "Yayılmış ince deri üzerine, satır satır yazılmış kitaba,"
        cid: 0
  - verse: 4
    segments:
      - text: "Ma'mur eve,"
        cid: 0
  - verse: 5
    segments:
      - text: "Yükseltilmiş tavana,"
        cid: 0
  - verse: 6
    segments:
      - text: "Kaynatılmış denize, (andolsun ki)"
        cid: 0
  - verse: 7
    segments:
      - text: "Rabbinin azabı mutlaka vuku bulacaktır."
        cid: 0
  - verse: 8
    segments:
      - text: "Ona engel olacak (hiçbir şey de) yoktur."
        cid: 0
  - verse: 9
    segments:
      - text: "O gün gök, bir çalkanış çalkalanır"
        cid: 0
  - verse: 10
    segments:
      - text: "Dağlar da bir yürüyüş yürür."
        cid: 0
  - verse: 11
    segments:
      - text: "Vay haline o gün yalanlayanların!"
        cid: 0
  - verse: 12
    segments:
      - text: "Ki onlar, daldıkları bir batak (bâtıl)da oynayıp duruyorlar."
        cid: 0
  - verse: 13
    segments:
      - text: "O gün onlar cehennem ateşine itilip kakılacaklar."
        cid: 0
  - verse: 14
    segments:
      - text: "(Onlara): \"İşte yalanlayıp durduğunuz ateş budur\" (denilecek)."
        cid: 0
  - verse: 15
    segments:
      - text: "\"Bu da mı bir sihir? Yoksa siz görmüyor musunuz?"
        cid: 0
  - verse: 16
    segments:
      - text: "Girin oraya, ister sabredin ister etmeyin artık sizin için birdir. Siz hep yaptıklarınıza göre cezalandırılacaksınız\" (denilecek)."
        cid: 0
  - verse: 17
    segments:
      - text: "Şüphesiz (günahlardan) korunanlar da cennetlerde, nimetler içindedirler."
        cid: 0
  - verse: 18
    segments:
      - text: "Rablerinin kendilerine verdiği ile zevk ü sefâ sürerler. Rableri onları, cehennem azabından korumuştur."
        cid: 0
  - verse: 19
    segments:
      - text: "(Onlara): \"Yaptıklarınıza karşılık afiyetle yeyin, için\" (denilir.)"
        cid: 0
  - verse: 20
    segments:
      - text: "Sıra sıra dizilmiş koltuklara yaslanırlar. Ayrıca biz onları ceylan gözlü hûrilerle evlendirdik."
        cid: 0
  - verse: 21
    segments:
      - text: "İman edip zürriyetleri de iman ile kendilerine tâbi olanlar (yok mu?); işte biz, onların nesillerini de kendilerine kattık. Kendilerinin amellerinden birşey de eksiltmedik. Herkes kendi kazandığına bağlıdır."
        cid: 0
  - verse: 22
    segments:
      - text: "Onlara canlarının istediği meyvalar ve etlerden bol bol verdik."
        cid: 0
  - verse: 23
    segments:
      - text: "Orada bir kadeh kapışırlar ki, onda ne bir saçmalama vardır, ne de günaha sokma."
        cid: 0
  - verse: 24
    segments:
      - text: "Kendilerine ait bir takım hizmetçiler de onların etrafında dönerler. Bu gençler sanki sedefleri içine gizlenmiş inci gibidirler."
        cid: 0
  - verse: 25
    segments:
      - text: "Birbirlerine yönelip soruyorlar."
        cid: 0
  - verse: 26
    segments:
      - text: "Ve diyorlar ki: \"Gerçekte biz daha önce (dünya hayatında) âilemiz içinde (âkibetimizden) korkardık\"."
        cid: 0
  - verse: 27
    segments:
      - text: "\"Allah bize lutfetti de bizi (vücûdun) içine işleyen (kavurucu) azabdan korudu.\""
        cid: 0
  - verse: 28
    segments:
      - text: "\"Gerçekten biz bundan önce O'na yalvarıyorduk. Çünkü iyilik eden, esirgeyen ancak O'dur.\""
        cid: 0
  - verse: 29
    segments:
      - text: "(Ey Muhammed!) sen hatırlat, öğüt ver. Rabbinin nimeti sayesinde sen ne kâhinsin, ne de mecnûn."
        cid: 0
  - verse: 30
    segments:
      - text: "Yoksa onlar (senin için): \"Bir şâirdir, zamanın felaketlerine çarpılmasını gözetliyoruz.\" mu diyorlar?"
        cid: 0
  - verse: 31
    segments:
      - text: "De ki: Bekleyin, çünkü ben de sizinle beraber bekleyenlerdenim."
        cid: 0
  - verse: 32
    segments:
      - text: "Onların akılları mı bunu emreder yoksa onlar azgın bir topluluk mudur?"
        cid: 0
  - verse: 33
    segments:
      - text: "Yoksa \"Onu uydurdu\" mu diyorlar? Hayır onlar inanmıyorlar."
        cid: 0
  - verse: 34
    segments:
      - text: "Eğer doğru iseler onun benzeri bir söz meydana getirsinler."
        cid: 0
  - verse: 35
    segments:
      - text: "Yoksa onlar, hiçbir şey olmadan (yani yaratıcısız) mı yaratıldılar? Yoksa kendileri yaratıcı mıdırlar?"
        cid: 0
  - verse: 36
    segments:
      - text: "Yoksa gökleri ve yeri onlar mı yarattılar? Hayır, onlar düşünüp hakikati anlamazlar."
        cid: 0
  - verse: 37
    segments:
      - text: "Yoksa Rabbinin hazineleri onların yanında mıdır? Yahut hâkim (her şeyin yöneticisi) kendileri midir?"
        cid: 0
  - verse: 38
    segments:
      - text: "Yoksa kendilerine mahsus (üzerine çıkıp sırları) dinleyecekleri bir merdivenleri mi var? Öyleyse dinleyenleri, açık bir delil getirsin."
        cid: 0
  - verse: 39
    segments:
      - text: "Demek kızlar O'na, oğullar size öyle mi?"
        cid: 0
  - verse: 40
    segments:
      - text: "Yoksa sen kendilerinden bir ücret istiyorsun da, bu yüzden onlar ağır bir borç altında mı kalıyorlar?"
        cid: 0
  - verse: 41
    segments:
      - text: "Yoksa gayb kendilerinin yanında da onlar mı yazıyorlar?"
        cid: 0
  - verse: 42
    segments:
      - text: "Yoksa bir tuzak mı kurmak istiyorlar? Fakat o küfredenlerin kendileri tuzağa düşeceklerdir."
        cid: 0
  - verse: 43
    segments:
      - text: "Yoksa onların Allah'tan başka bir ilâhı mı var? Allah, onların ortak koştukları şeylerden uzaktır."
        cid: 0
  - verse: 44
    segments:
      - text: "Gökten bir parçanın düştüğünü görseler, \"Üst üste yığılmış bulutlardır.\" derler."
        cid: 0
  - verse: 45
    segments:
      - text: "Artık çarpılacakları günlerine kavuşuncaya kadar onları (kendi hallerine) bırak."
        cid: 0
  - verse: 46
    segments:
      - text: "O gün hiçbir tedbirlerinin kendilerine zerre kadar faydası olmayacak ve hiçbir şekilde yardım da görmeyeceklerdir."
        cid: 0
  - verse: 47
    segments:
      - text: "Şüphesiz o zulmedenlere ondan başka da azab vardır. Fakat çokları bilmezler."
        cid: 0
  - verse: 48
    segments:
      - text: "Rabbinin hükmüne sabret. Çünkü sen gözlerimizin önündesin. Kalktığın zaman Rabbini hamd ile tesbih et."
        cid: 0
  - verse: 49
    segments:
      - text: "Gecenin bir kısmında ve yıldızların batışında da O'nu tesbih et"
        cid: 0