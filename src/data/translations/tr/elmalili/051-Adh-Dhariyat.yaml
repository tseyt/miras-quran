surah_id: 51
language: tr
author: elmalili
verses:
  - verse: 1
    segments:
      - text: >-
          O tozdurup savuranlara,
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Derken bir ağırlık taşıyanlara,
        cid: 0
  - verse: 3
    segments:
      - text: >-
          Derken bir kolaylıkla akanlara,
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Derken bir emir taksim edenlere andolsun ki,
        cid: 0
  - verse: 5
    segments:
      - text: >-
          O size vaad edilen elbette doğrudur.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Ceza ve hesap günü şüphesiz olacaktır.
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Yollara sahip göğe andolsun ki,
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Siz elbette çelişkili sözler içindesiniz.
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Ondan çevrilen (imana) çevrilir.
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Kahrolsun (o fikir adına) kendi tahminlerini ileri sürenler!
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Onlar bir sarhoşluk ve cehalet içinde şuursuzdurlar.
        cid: 0
  - verse: 12
    segments:
      - text: >-
          Onlar: "Hesap ve ceza günü ne zaman?" diye soruyorlar.
        cid: 0
  - verse: 13
    segments:
      - text: >-
          O gün, onların ateş üzerinde azap görecekleri gündür.
        cid: 0
  - verse: 14
    segments:
      - text: >-
          Onlara: "Tadın inkarınızın cezasını, işte sizin acele istediğiniz budur!"
          denecektir.
        cid: 0
  - verse: 15
    segments:
      - text: >-
          Şüphesiz ki takva sahipleri Rablerinin kendilerine verdiği sevabı almış olarak
          cennet bahçelerinde ve pınar başlarında bulunacaklardır. Çünkü onlar bundan önce
          iyilik yapıyorlardı.
        cid: 0
  - verse: 16
    segments:
      - text: >-
          Şüphesiz ki takva sahipleri Rablerinin kendilerine verdiği sevabı almış olarak
          cennet bahçelerinde ve pınar başlarında bulunacaklardır. Çünkü onlar bundan önce
          iyilik yapıyorlardı.
        cid: 0
  - verse: 17
    segments:
      - text: >-
          Onlar geceleyin pek az uyurlardı.
        cid: 0
  - verse: 18
    segments:
      - text: >-
          Onlar seher vakitlerinde Allah'tan bağışlanma dilerlerdi.
        cid: 0
  - verse: 19
    segments:
      - text: >-
          Onların mallarında isteyen ve istemeyen yoksullar için bir hak vardı.
        cid: 0
  - verse: 20
    segments:
      - text: >-
          Kesin olarak inananlar için, yeryüzünde ve kendi nefislerinde nice ibretler
          vardır. Hiç görmüyor musunuz?
        cid: 0
  - verse: 21
    segments:
      - text: >-
          Kesin olarak inananlar için, yeryüzünde ve kendi nefislerinde nice ibretler
          vardır. Hiç görmüyor musunuz?
        cid: 0
  - verse: 22
    segments:
      - text: >-
          Sizin rızkınız da size vaad edilen sevap ve ceza da göktedir.
        cid: 0
  - verse: 23
    segments:
      - text: >-
          Gök ve yerin Rabbine andolsun ki size edilen o vaad, herhalde haktır. O tıpkı
          sizin konuşmanız gibi gerçektir.
        cid: 0
  - verse: 24
    segments:
      - text: >-
          Ey Muhammed! İbrahim'in şerefli misafirlerinin haberi sana geldi mi?
        cid: 0
  - verse: 25
    segments:
      - text: >-
          Hani onlar İbrahim'in huzuruna girmişlerdi de "Selam sana!" demişlerdi.
          İbrahim: "Size de selam" demiş, ve içinden: "Bunlar tanınmamış bir topluluk!"
          diye geçirmişti.
        cid: 0
  - verse: 26
    segments:
      - text: >-
          İbrahim, sonra ailesine giderek semiz bir buzağı (eti) getirdi.
        cid: 0
  - verse: 27
    segments:
      - text: >-
          Onu önlerine sürerek: "Yemez misiniz?" dedi.
        cid: 0
  - verse: 28
    segments:
      - text: >-
          Yemediklerini görünce onlardan içine bir korku düştü. Onlar İbrahim'e:
          "Korkma!" dediler ve onu çok bilgili bir oğul ile müjdelediler.
        cid: 0
  - verse: 29
    segments:
      - text: >-
          Bunun üzerine karısı (Sâre) bir çığlık atarak geldi ve elini yüzüne vurarak:
          "Ben kısır bir kocakarıyım, nasıl çocuğum olur?" dedi.
        cid: 0
  - verse: 30
    segments:
      - text: >-
          Misafir melekler: "Evet bu böyledir. Rabbin böyle buyurdu. Gerçekten O hüküm ve
          hikmet sahibidir. Herşeyi hakkıyla bilir." dediler.
        cid: 0
  - verse: 31
    segments:
      - text: >-
          İbrahim, kendisine misafir olarak gelen meleklere: "Acaba sizin asıl önemli
          işiniz nedir ey elçiler?" dedi.
        cid: 0
  - verse: 32
    segments:
      - text: >-
          Onlar: "Gerçekten biz günahkâr bir kavim (olan Lût kavmine) gönderildik.
        cid: 0
  - verse: 33
    segments:
      - text: >-
          Onların üzerine çamurdan pişirilmiş sert taşlar yağdıracağız.
        cid: 0
  - verse: 34
    segments:
      - text: >-
          O taşlardan herbirinin haddi aşanlardan kime isabet edeceği Rabbin katında
          işaretlenmiştir." dediler.
        cid: 0
  - verse: 35
    segments:
      - text: >-
          Nihayet biz müminlerden orada bulunan kimseleri çıkardık.
        cid: 0
  - verse: 36
    segments:
      - text: >-
          Fakat biz orada müslümanlardan bir ev halkından başka kimseyi de bulamadık.
        cid: 0
  - verse: 37
    segments:
      - text: >-
          Biz orada acı bir azabdan korkan kimseler için bir ibret nişanesi bıraktık.
        cid: 0
  - verse: 38
    segments:
      - text: >-
          Musa'nın kıssasında da ibret vardır. Hani biz onu apaçık bir delille Firavun'a
          göndermiştik.
        cid: 0
  - verse: 39
    segments:
      - text: >-
          Firavun ise ordusuyla birlikte yüz çevirmiş, onun hakkında: "Bu bir
          sihirbazdır, ya da bir delidir." demişti.
        cid: 0
  - verse: 40
    segments:
      - text: >-
          Nihayet biz onu ve ordularını yakalayıp hepsini denize attık. Firavun ise o
          sırada (inadından dolayı pişmanlık duyarak) kendi kendini kınıyordu.
        cid: 0
  - verse: 41
    segments:
      - text: >-
          Âd kavminin helâkinde de bir ibret vardır. Hani biz onların üzerine köklerini
          kesecek bir rüzgar göndermiştik.
        cid: 0
  - verse: 42
    segments:
      - text: >-
          O rüzgar üzerine uğradığı hiçbir şeyi bırakmıyor, mutlaka onu kül gibi
          dağıtıyordu.
        cid: 0
  - verse: 43
    segments:
      - text: >-
          Semud kavminin helâkinde de bir ibret vardır. Hani onlara: "Belirli bir süreye
          kadar dünyadan yararalanıp, geçinin!" denmişti.
        cid: 0
  - verse: 44
    segments:
      - text: >-
          Onlarsa Rablerinin emrine karşı büyüklük tasladılar. Bunun üzerine kendilerini,
          bakıp dururlarken yıldırım yakalayıp, çarptı.
        cid: 0
  - verse: 45
    segments:
      - text: >-
          Artık onlar, ne kendi kendilerine ayağa kalkabildiler, ne de yardım gördüler.
        cid: 0
  - verse: 46
    segments:
      - text: >-
          Daha önce de Nuh kavmini helâk etmiştik. Çünkü onlar yoldan çıkmış fâsık bir
          kavimdiler.
        cid: 0
  - verse: 47
    segments:
      - text: >-
          Biz göğü kudretimizle bina ettik. Hiç şüphesiz biz, çok genişlik ve kudret
          sahibiyiz.
        cid: 0
  - verse: 48
    segments:
      - text: >-
          Yeryüzünü de biz döşedik. Bakın biz onu ne güzel döşüyoruz!
        cid: 0
  - verse: 49
    segments:
      - text: >-
          Biz herşeyden iki çift yarattık. Umulur ki, iyice düşünürsünüz.
        cid: 0
  - verse: 50
    segments:
      - text: >-
          Ey Muhammed! de ki: "Öyleyse Allah'a koşun, gerçekten ben size O'nun tarafından
          gönderilmiş apaçık bir uyarıcıyım.
        cid: 0
  - verse: 51
    segments:
      - text: >-
          Allah'la beraber başka bir tanrı uydurmayın (O'na ortak koşmayın). Gerçekten
          ben size O'nun tarafından gönderilmiş apaçık bir uyarıcıyım."
        cid: 0
  - verse: 52
    segments:
      - text: >-
          Böylece onlardan öncekilere de herhangi bir peygamber gelince, onun hakkında da
          mutlaka: "Bir sihirbazdır veya bir delidir." dediler.
        cid: 0
  - verse: 53
    segments:
      - text: >-
          Onlar birbirlerine bunu mu tavsiye ettiler? Hayır onlar azgın bir kavimdir.
        cid: 0
  - verse: 54
    segments:
      - text: >-
          Ey Muhammed! Sen onlardan yüz çevir. Artık sen kınanacak değilsin.
        cid: 0
  - verse: 55
    segments:
      - text: >-
          Sen öğüt verip hatırlat. Çünkü, hatırlatmak müminlere fayda verir.
        cid: 0
  - verse: 56
    segments:
      - text: >-
          Ben cinleri ve insanları ancak bana ibadet etsinler diye yarattım.
        cid: 0
  - verse: 57
    segments:
      - text: >-
          Ben onlardan herhangi bir rızık istemiyorum. Beni yedirmelerini de istemiyorum.
        cid: 0
  - verse: 58
    segments:
      - text: >-
          Şüphesiz ki, rızık veren O sağlam kuvvet sahibi olan Allah'tır.
        cid: 0
  - verse: 59
    segments:
      - text: >-
          Şüphsiz ki, zulmedenlerin geçmiş arkadaşlarının payı gibi, dolgun bir azab payı
          vardır. Ama şimdi onu acele istemesinler.
        cid: 0
  - verse: 60
    segments:
      - text: >-
          Kendilerine vaad edilen günlerinde uğrayacakaları azabdan dolayı vay inkâr
          edenlerin haline!.
        cid: 0