surah_id: 7
language: tr
author: elmalili
verses:
  - verse: 1
    segments:
      - text: >-
          Elif, lâm, mîm, sâd.
        cid: 0
  - verse: 2
    segments:
      - text: >-
          (Bu,) sana indirilen bir Kitab'tır. Onunla (insanları) uyarman ve inananlara
          öğüt (vermen) hususunda göğsünde bir sıkıntı olmasın.
        cid: 0
  - verse: 3
    segments:
      - text: >-
          (Ey insanlar) Rabbinizden, size indirilene uyun ve O'ndan başka dostlara
          uymayın. Ne kadar da az öğüt alıyorsunuz!
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Nice kentler helak ettik. Gece yatarlarken, yahut gündüz uyurlarken, azabımız
          onlara geliverdi.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Azabımız onlara geldiğinde "Biz gerçekten zalimlermişiz!" demelerinden başka
          yalvarışları kalmadı.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Kendilerine elçi gönderilmiş olanlara da soracağız, gönderilen elçilere de
          soracağız.
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Ve elbette onlara, olanbiten herşeyi bir bilgi ile anlatacağız; çünkü biz
          onlardan uzak değiliz.
        cid: 0
  - verse: 8
    segments:
      - text: >-
