surah_id: 74
language: tr
author: elmalili
verses:
  - verse: 1
    segments:
      - text: >-
          Ey örtüsüne bürünen (Peygamber)!
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Kalk artık uyar.
        cid: 0
  - verse: 3
    segments:
      - text: >-
          Sadece Rabbini yücelt.
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Elbiseni temizle.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Pislikten sakın.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Yaptığını çok görerek başa kakma.
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Rabbin için sabret.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          O sûra üflendiği zaman,
        cid: 0
  - verse: 9
    segments:
      - text: >-
          İşte o gün pek zorlu bir gündür.
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Kâfirler için hiç kolay değildir.
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Tek olarak yarattığım o kimseyi bana bırak.
        cid: 0
  - verse: 12
    segments:
      - text: >-
          Hem ona bol servet verdim.
        cid: 0
  - verse: 13
    segments:
      - text: >-
          Hem göz önünde oğullar verdim.
        cid: 0
  - verse: 14
    segments:
      - text: >-
          Hem ona büyük imkânlar sağladım.
        cid: 0
  - verse: 15
    segments:
      - text: >-
          Sonra da şiddetle arzu eder ki daha da artırayım.
        cid: 0
  - verse: 16
    segments:
      - text: >-
          Hayır, çünkü o bizim âyetlerimize karşı bir inatçı kesildi.
        cid: 0
  - verse: 17
    segments:
      - text: >-
          Ben onu dimdik bir yokuşa sardıracağım.
        cid: 0
  - verse: 18
    segments:
      - text: >-
          Çünkü o bir düşündü, ölçtü, biçti.
        cid: 0
  - verse: 19
    segments:
      - text: >-
          Kahrolası nasıl da ölçtü, biçti.
        cid: 0
  - verse: 20
    segments:
      - text: >-
          Yine kahrolası, nasıl ölçtü biçti.
        cid: 0
  - verse: 21
    segments:
      - text: >-
          Sonra baktı.
        cid: 0
  - verse: 22
    segments:
      - text: >-
          Sonra kaşını çattı, surat astı.
        cid: 0
  - verse: 23
    segments:
      - text: >-
          Sonra arkasını döndü ve büyüklük tasladı.
        cid: 0
  - verse: 24
    segments:
      - text: >-
          "Bu, dedi, başka değil öğretilegelen bir sihirdir."
        cid: 0
  - verse: 25
    segments:
      - text: >-
          "Bu, sadece bir insan sözüdür."
        cid: 0
  - verse: 26
    segments:
      - text: >-
          Ben onu Sekar'a (cehenneme) sokacağım.
        cid: 0
  - verse: 27
    segments:
      - text: >-
          Bilir misin sen, nedir o sekar?
        cid: 0
  - verse: 28
    segments:
      - text: >-
          Ne geriye bir şey kor, ne bırakır.
        cid: 0
  - verse: 29
    segments:
      - text: >-
          Durmadan derileri kavurur.
        cid: 0
  - verse: 30
    segments:
      - text: >-
          Üzerinde ondokuz (melek) vardır.
        cid: 0
  - verse: 31
    segments:
      - text: >-
          Biz o ateşin muhafızlarını hep melekler yaptık. Bunların sayılarını da ancak
          kâfirler için bir imtihan kıldık ki, kendilerine kitap verilenler kesin bilgi
          edinsinler, iman edenlerin de imanı artsın. Kendilerine kitap verilenler ve
          müminler şüpheye düşmesinler. Kalplerinde hastalık bulunanlarla kâfirler de:
          "Allah bu misalle ne demek istedi?" desinler. İşte böyle, Allah dilediğini
          şaşırtır, dilediğini de yola getirir. Rabbinin ordularını ancak Rabbin bilir.
          Bu, insanlar için uyarıdan başka bir şey değildir.
        cid: 0
  - verse: 32
    segments:
      - text: >-
          Hayır, andolsun aya,
        cid: 0
  - verse: 33
    segments:
      - text: >-
          Döndüğü an o geceye,
        cid: 0
  - verse: 34
    segments:
      - text: >-
          Ve açtığı sıra o sabaha.
        cid: 0
  - verse: 35
    segments:
      - text: >-
          Kuşkusuz o Sekar, büyük belalardan biridir.
        cid: 0
  - verse: 36
    segments:
      - text: >-
          Uyarmak için insanları..
        cid: 0
  - verse: 37
    segments:
      - text: >-
          İçinizden ileri gitmek veya geri kalmak isteyen kimseleri..
        cid: 0
  - verse: 38
    segments:
      - text: >-
          Her nefis kendi kazancına bağlıdır.
        cid: 0
  - verse: 39
    segments:
      - text: >-
          Ancak amel defterleri sağından verilenler hariç.
        cid: 0
  - verse: 40
    segments:
      - text: >-
          Onlar cennettedirler, sorup dururlar.
        cid: 0
  - verse: 41
    segments:
      - text: >-
          Suçluların durumunu.
        cid: 0
  - verse: 42
    segments:
      - text: >-
          "Nedir sizi Sekar'a sokan?" diye.
        cid: 0
  - verse: 43
    segments:
      - text: >-
          Suçlular der ki: "Biz namaz kılanlardan değildik."
        cid: 0
  - verse: 44
    segments:
      - text: >-
          "Yoksula da yedirmezdik."
        cid: 0
  - verse: 45
    segments:
      - text: >-
          "Boş şeylere dalanlarla dalar giderdik."
        cid: 0
  - verse: 46
    segments:
      - text: >-
          "Ceza gününü yalanlardık."
        cid: 0
  - verse: 47
    segments:
      - text: >-
          "Nihayet bize ölüm gelip çattı."
        cid: 0
  - verse: 48
    segments:
      - text: >-
          Artık onlara şefaatçilerin şefaatı fayda vermez.
        cid: 0
  - verse: 49
    segments:
      - text: >-
          Şimdi o Kur'ân'dan yüz çevirirlerken ne mazeretleri var?
        cid: 0
  - verse: 50
    segments:
      - text: >-
          Sanki onlar ürkmüş yaban eşekleri.
        cid: 0
  - verse: 51
    segments:
      - text: >-
          Arslandan kaçmaktalar.
        cid: 0
  - verse: 52
    segments:
      - text: >-
          Hayır, onlardan her kişi kendisine açılmış sayfalar verilmesini istiyor.
        cid: 0
  - verse: 53
    segments:
      - text: >-
          Yok, yok onlar ahiretten korkmuyorlar.
        cid: 0
  - verse: 54
    segments:
      - text: >-
          Hayır, hayır, O kur'ân kuşkusuz bir öğüttür.
        cid: 0
  - verse: 55
    segments:
      - text: >-
          Dileyen onu düşünür.
        cid: 0
  - verse: 56
    segments:
      - text: >-
          Bununla beraber Allah dilemedikçe onlar öğüt alamazlar. Koruyacak da O'dur,
          bağışlayacak da.
        cid: 0