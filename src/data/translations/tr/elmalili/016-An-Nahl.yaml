surah_id: 16
language: tr
author: elmalili
verses:
  - verse: 1
    segments:
      - text: >-
          Allah'ın emri geldi, sakın onu acele edip istemeyiniz. Allah, müşriklerin
          koştukları ortaklardan münezzeh ve yücedir.
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Kendi emrinden ruh (vahiy) ile melekleri, kullarından dilediği peygamberlere
          indirip şu gerçeği insanlara bildirin, buyuruyor: Benden başka hiçbir ilâh
          yoktur. Ancak benden korkun.
        cid: 0
  - verse: 3
    segments:
      - text: >-
          Allah gökleri ve yeri hikmeti ile yarattı. O, kâfirlerin ortak koştukları
          şeylerden çok yücedir.
        cid: 0
  - verse: 4
    segments:
      - text: >-
          O, insanı bir meniden (spermadan) yarattı. Bir de bakarsın ki o, Rabbine karşı
          apaçık bir düşmandır.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Hayvanları da O yarattı. Onlarda sizi ısıtacak şeyler ve birçok faydalar
          vardır. Ve siz onlardan bir kısmını da yersiniz.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          O hayvanları, akşam vakti getirirken ve sabahleyin salarken, onlarda sizin için
          bir güzellik ve zevk vardır.
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Bu hayvanlar, ancak güçlükle varabileceğiniz bir memlekete yüklerinizi taşır.
          Rabbiniz, şüphesiz çok şefkatlidir, çok merhametlidir.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Hem kendilerine binesiniz, hem de zinet olsun diye atları, katırları, ve
          merkepleri yarattı. Ve şu anda bilemeyeceğiniz daha nice şeyler yaratacak.
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Doğru yolu göstermek Allah'a aittir. Onun eğrisi de vardır. Allah dileseydi,
          sizin hepinizi hidayete erdirirdi.
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Sizin için gökten su indiren O'dur. İçecek su ondandır; hayvanlarınızı
          otlattığınız bitkiler de o su ile yetişir.
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Allah, sizin için, o su ile ekin, zeytin, hurmalıklar, üzümler ve her çeşit
          meyveleri bitirir. Şüphesiz ki bunda düşünecek bir topluluk için büyük bir ibret
          vardır. ()
        cid: 0
  - verse: 12
    segments:
      - text: >-
          Geceyi, gündüzü, güneşi ve ayı sizin hizmetinize O verdi. Bütün yıldızlar da
          O'nun emrine boyun eğmişlerdir. Şüphesiz ki bunda aklını kullanan bir toplum
          için ibretler vardır.
        cid: 0
  - verse: 13
    segments:
      - text: >-
          Yeryüzünde sizin için yarattığı değişik renklerdeki şeyleri de sizin
          hizmetinize sunmuştur. Elbette bunda öğüt alan kimseler için bir ibret vardır.
        cid: 0
  - verse: 14
    segments:
      - text: >-
          Yine denizden taze et (balık) yiyesiniz ve ondan takındığınız süs eşyasını
          çıkarasınız diye, denizi emrinize veren Allah'tır. Gemilerin denizde suyu
          yararak gittiklerini görüyorsun. Lütfundan rızık aramanız ve şükretmeniz için
          Allah böyle yapmıştır.
        cid: 0
  - verse: 15
    segments:
      - text: >-
          Allah, yeryüzü sizi sarsmasın diye oraya sabit dağlar yerleştirdi. Yolunuzu
          bulmanız için de nehirler ve yollar yarattı.
        cid: 0
  - verse: 16
    segments:
      - text: >-
          Daha birçok âlametler yarattı. İnsanlar geceleyin de Allah'ın yarattığı
          yıldızlarla yönlerini bulurlar.
        cid: 0
  - verse: 17
    segments:
      - text: >-
          Hiç yaratan (Allah), yaratmayan (putlar) gibi olur mu? Artık siz düşünmez
          misiniz?
        cid: 0
  - verse: 18
    segments:
      - text: >-
          Halbuki Allah'ın nimetlerini teker teker saymaya kalkışsanız, onları
          sayamazsınız. Muhakkak ki Allah çok bağışlayıcıdır, çok merhametlidir.
        cid: 0
  - verse: 19
    segments:
      - text: >-
          Allah, gizlediğinizi de açıkladığınızı da bilir.
        cid: 0
  - verse: 20
    segments:
      - text: >-
          Kâfirlerin Allah'tan başka yalvardıkları (putlar) ise, hiçbir şey yaratamazlar.
          Çünkü onlar, kendileri yaratılmışlardır.
        cid: 0
  - verse: 21
    segments:
      - text: >-
          O putlar, hep ölüdürler, diri değildirler ve insanların öldükten sonra ne zaman
          dirileceklerini de bilmezler.
        cid: 0
  - verse: 22
    segments:
      - text: >-
          İlâhınız bir tek ilâhtır. Bununla beraber ahirete inanmayanların kalbleri
          inkârcı, kendileri de böbürlenen kimselerdir.
        cid: 0
  - verse: 23
    segments:
      - text: >-
          Şüphesiz ki Allah, onların gizlediklerini de açığa vurduklarını da bilir.
