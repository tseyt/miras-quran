surah_id: 65
language: tr
author: elmalili
verses:
  - verse: 1
    segments:
      - text: >-
          Ey Peygamber! Kadınları boşamak istediğiniz zaman onları iddetleri içinde
          boşayın ve iddeti de sayın. Rabbiniz Allah'tan korkun. Apaçık bir hayasızlık
          yapmaları hali bir yana, onları evlerinden çıkarmayın, kendileri de çıkmasınlar.
          Bunlar Allah'ın sınırlarıdır. Kim Allah'ın sınırlarını aşarsa, şüphesiz kendine
          zulmetmiş olur. Bilmezsin, olur ki Allah, bundan sonra bir durum ortaya
          çıkarıverir.
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Sürelerinin sonuna vardıklarında onları güzelce tutun, yahut güzellikle
          onlardan ayrılın. İçinizden adalet sahibi iki kişiyi şahit tutun. Şahidliği
          Allah için yapın. İşte Allah'a ve son güne inanan kimseye öğütlenen budur. Kim
          Allah'tan korkarsa Allah ona bir çıkış yolu yaratır.
        cid: 0
  - verse: 3
    segments:
      - text: >-
          Ve onu ummadığı yerden rızıklandırır. Kim Allah'a güvenirse O, ona yeter.
          Allah, emrini yerine getirendir. Allah her şey için bir ölçü koymuştur.
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Kadınlarınız içinden âdetten kesilmiş olanlarla, henüz âdetini görmemiş
          bulunanlardan eğer şüphe ederseniz (iddetlerinin nasıl olacağında tereddüt
          ederseniz), onların bekleme süresi üç aydır. Gebe olanların bekleme süresi ise,
          yüklerini bırakmaları, doğum yapmalarıdır. Kim Allah'tan korkarsa, Allah ona
          işinde bir kolaylık verir.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Bu, Allah'ın size indirdiği buyruğudur. Kim Allah'tan korkarsa Allah onun
          kötülüklerini örter ve onun mükafatını büyütür.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          O kadınları, gücünüz ölçüsünde oturduğunuz yerin bir bölümünde oturtun ve
          onları sıkıştırmak için kendilerine zarar vermeye kalkışmayın. Şayet gebe
          iseler, yüklerini bırakıncaya kadar onları besleyin. Sonra sizin için
          emzirirlerse ücretlerini verin ve aranızda güzellikle konuşup danışın. Güçlük
          çekerseniz çocuğu, başka bir kadın emzirecektir.
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Eli geniş olan genişliğine göre nafaka versin. Rızkı kısılmış bulunan da
          Allah'ın kendisine verdiğinden versin. Allah bir kişiye ne vermişse ancak onu
          teklif eder. Allah bir güçlükten sonra bir kolaylık yaratacaktır.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Nice kent var ki Rablerinin ve O'nun elçilerinin emrine başkaldırdı, biz de
          onları çetin bir hesaba çektik ve onlara görülmemiş şekilde azab ettik.
        cid: 0
  - verse: 9
    segments:
      - text: >-
          İşlerinin vebalini tattılar. İşlerinin sonucu tam bir hüsran olmuştur.
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Allah onlara şiddetli bir azap hazırlamıştır. O halde ey inanan aklı selim
          sahipleri! Allah'tan korkun, Allah size bir uyarıcı gönderdi.
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Size Allah'ın açık açık âyetlerini okuyan bir elçi (gönderdi) ki inanıp faydalı
          işler yapanları, karanlıklardan aydınlığa çıkarsın. Kim Allah'a inanır ve
          yararlı iş yaparsa (Allah) onu, altlarından ırmaklar akan, içinde ebedi
          kalacakları cennetlere sokar. Allah ona gerçekten ne güzel rızık vermiştir.
        cid: 0
  - verse: 12
    segments:
      - text: >-
          Allah O'dur ki yedi göğü ve yerden de onlar kadarını yarattı. Emir bunlar
          arasında iner ki Allah'ın her şeye kâdir olduğunu ve Allah'ın bilgisinin, her
          şeyi kuşattığını bilesiniz.
        cid: 0