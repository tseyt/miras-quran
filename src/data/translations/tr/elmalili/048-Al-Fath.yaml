  - verse: 3
    segments:
      - text: "Ve sana Allah, şanlı bir zaferle yardım eder."
        cid: 0
  - verse: 4
    segments:
      - text: "İmanlarına iman katsınlar diye müminlerin kalplerine güven indiren O'dur. Göklerin ve yerin orduları Allah'ındır. Allah bilendir, herşeyi hikmetle yapandır."
        cid: 0
  - verse: 5
    segments:
      - text: "Mümin erkeklerle mümin kadınları, içinde ebedi kalacakları, altlarından ırmaklar akan cennetlere koyması, onların günahlarını örtmesi içindir. İşte bu, Allah katında büyük bir kurtuluştur."
        cid: 0
  - verse: 6
    segments:
      - text: "Ve o Allah hakkında kötü zanda bulunan münâfık erkeklere ve münâfık kadınlara, Allah'a ortak koşan erkeklere ve ortak koşan kadınlara azap etmesi içindir. Kötülük onların başlarına gelmiştir. Allah onlara gazap etmiş, lânetlemiş ve cehennemi kendilerine hazırlamıştır. Orası ne kötü bir yerdir!"
        cid: 0
  - verse: 7
    segments:
      - text: "Göklerin ve yerin orduları Allah'ındır. Allah çok güçlüdür, hüküm ve hikmet sahibidir."
        cid: 0
  - verse: 8
    segments:
      - text: "Şüphesiz biz seni, şâhit, müjdeleyici ve uyarıcı olarak gönderdik."
        cid: 0
  - verse: 9
    segments:
