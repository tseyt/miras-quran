surah_id: 54
language: tr
author: elmalili
verses:
  - verse: 1
    segments:
      - text: >-
          Kıyamet saati yaklaştı, Ay yarıldı.
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Bir mucize görseler hemen yüz çevirirler ve "süregelen bir büyüdür" derler.
        cid: 0
  - verse: 3
    segments:
      - text: >-
          Yalanladılar, nefislerinin arzularına uydular. Halbuki her iş yerini
          bulacaktır.
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Andolsun ki onlara (kötülükten) vazgeçirecek nice önemli haberler gelmiştir.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Bunlar üstün bir hikmettir fakat uyarılar fayda vermiyor.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Sen de onlardan yüz çevir ki, o gün çağırıcı, görülmedik müthiş bir şeye
          çağırır.
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Gözleri düşkün düşkün (zelil ve hakir) kabirlerinden çıkarlar, sanki yayılan
          çekirgeler gibidirler.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          O çağırana koşarak, kâfirler: "Bu çetin bir gündür." derler.
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Onlardan önce Nuh'un kavmi de yalanlamıştı. Kulumuzu yalanladılar ve:
          "Cinlenmiştir." dediler. Ve (Nuh davetten vazgeçmeye) zorlandı.
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Bunun üzerine Rabbine: "Ben yenik düştüm, bana yardım et!" diyerek yalvardı.
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Biz de boşalan bir su ile göğün kapılarını açtık.
        cid: 0
  - verse: 12
    segments:
      - text: >-
          Yeri de kaynaklar halinde fışkırttık, derken sular takdir edilmiş bir iş için
          birleşti.
        cid: 0
  - verse: 13
    segments:
      - text: >-
          Nuh'u da tahtalardan yapılmış, çivilerle (çakılmış gemi) üzerinde taşıdık.
        cid: 0
  - verse: 14
    segments:
      - text: >-
          Nankörlük edilen (kulumuz)e bir mükafat olmak üzere (gemi), gözlerimizin önünde
          akıp gidiyordu.
        cid: 0
  - verse: 15
    segments:
      - text: >-
          Bunu bir ibret olarak bıraktık, ibret alan yok mudur?
        cid: 0
  - verse: 16
    segments:
      - text: >-
          Benim azabım ve uyarılarım nasılmış (görsünler)
        cid: 0
  - verse: 17
    segments:
      - text: >-
          Andolsun biz Kur'ân'ı öğüt almak için kolaylaştırdık. Öğüt alan yok mudur?
        cid: 0
  - verse: 18
    segments:
      - text: >-
          Âd (kavmi) da yalanladı, azabım ve uyarılarım nasıl oldu?
        cid: 0
  - verse: 19
    segments:
      - text: >-
          Biz onların üstüne, uğursuzluğu devam eden bir günde dondurucu bir rüzgar
          gönderdik.
        cid: 0
  - verse: 20
    segments:
      - text: >-
          (O rüzgar) insanları, sökülmüş hurma kütükleri gibi yere seriyordu.
        cid: 0
  - verse: 21
    segments:
      - text: >-
          Nasılmış benim azabım ve uyarım?
        cid: 0
  - verse: 22
    segments:
      - text: >-
          Andolsun biz Kur'ân'ı öğüt almak için kolaylaştırdık. Öğüt alan yok mudur?
        cid: 0
  - verse: 23
    segments:
      - text: >-
          Semûd da o uyarıları yalanladılar.
        cid: 0
  - verse: 24
    segments:
      - text: >-
          "Bizden bir insana mı uyacağız? O takdirde biz apaçık bir sapıklık ve çılgınlık
          içine düşmüş oluruz." dediler.
        cid: 0
  - verse: 25
    segments:
      - text: >-
          "Zikir, aramızdan ona mı bırakıldı? Hayır o, yalancı, küstahın biridir"
          (dediler).
        cid: 0
  - verse: 26
    segments:
      - text: >-
          Yarın onlar, yalancı, küstahın kim olduğunu bilecekler.
        cid: 0
  - verse: 27
    segments:
      - text: >-
          Biz onlara, kendilerini imtihan etmek için dişi deveyi göndereceğiz. Onun için
          sen onları gözet ve sabırlı ol.
        cid: 0
  - verse: 28
    segments:
      - text: >-
          Onlara suyun aralarında paylaştırılacağını haber ver; her içene düşen miktar,
          hazır kılınmıştır.
        cid: 0
  - verse: 29
    segments:
      - text: >-
          Bunun üzerine arkadaşlarına bağırdılar. O da (bıçağı) çekerek (deveyi) kesti.
        cid: 0
  - verse: 30
    segments:
      - text: >-
          Ama azabım ve uyarılarım nasıl oldu.
        cid: 0
  - verse: 31
    segments:
      - text: >-
          Biz onların üzerine tek sayha (korkunç bir ses) gönderdik; ağılcının topladığı
          çalı çırpı kırıntıları gibi kırılıp dökülüverdiler.
        cid: 0
  - verse: 32
    segments:
      - text: >-
          Andolsun biz Kur'ân'ı öğüt almak için kolaylaştırdık. Öğüt alan yok mudur?
        cid: 0
  - verse: 33
    segments:
      - text: >-
          Lût kavmi de uyarıları yalanladı.
        cid: 0
  - verse: 34
    segments:
      - text: >-
          Biz de onların üzerlerine (taşlar savuran) bir fırtına gönderdik. Yalnız Lût
          ailesini seher vakti kurtardık,
        cid: 0
  - verse: 35
    segments:
      - text: >-
          Katımızdan bir nimet olarak. Biz şükredeni böyle mükafatlandırırız.
        cid: 0
  - verse: 36
    segments:
      - text: >-
          (Lût), onları bizim yakalamamıza karşı uyarmıştı. Fakat ikazlara karşı kuşku
          duydular,
        cid: 0
  - verse: 37
    segments:
      - text: >-
          Onun konuklarından murad almaya kalkıştılar. Biz de gözlerini siliverdik.
          "Haydi azabımı ve uyarılarımı tadın!" (dedik).
        cid: 0
  - verse: 38
    segments:
      - text: >-
          Sabah erken, onları kararlı bir azab yakaladı.
        cid: 0
  - verse: 39
    segments:
      - text: >-
          "Azabımı ve uyarılarımı tadın!" (dedik).
        cid: 0
  - verse: 40
    segments:
      - text: >-
          Andolsun biz Kur'ân'ı öğüt almak için kolaylaştırdık. Öğüt alan yok mudur?
        cid: 0
  - verse: 41
    segments:
      - text: >-
          Şüphesiz Firavun ailesine de uyarıcı peygamberler geldi.
        cid: 0
  - verse: 42
    segments:
      - text: >-
          Lakin onlar bütün âyetlerimizi yalanladılar. Biz de onları çok kuvvetli ve
          kudretli bir yakalayışla yakaladık. Bu kıssalardan hisseye gelince;
        cid: 0
  - verse: 43
    segments:
      - text: >-
          Şimdi sizin kâfirleriniz, onlardan hayırlı mı? Yoksa kitaplarda sizin için bir
          beraet mi var?
        cid: 0
  - verse: 44
    segments:
      - text: >-
          Yoksa "Biz birbirimize yardım eden bir topluluğuz." mu diyorlar?
        cid: 0
  - verse: 45
    segments:
      - text: >-
          Her halde o topluluk bozulacak ve geriye dönüp kaçacaklardır.
        cid: 0
  - verse: 46
    segments:
      - text: >-
          Bilakis kıyamet onlara vaad edilen asıl saattir. Saat cidden çok feci ve
          acıdır.
        cid: 0
  - verse: 47
    segments:
      - text: >-
          Muhakkak ki suçlular sapıklık ve çılgınlık içindedirler.
        cid: 0
  - verse: 48
    segments:
      - text: >-
          O gün yüzleri üstü ateşte sürüklenecekler, "Cehennemin dokunuşunu tadın!"
          (denilecek).
        cid: 0
  - verse: 49
    segments:
      - text: >-
          Haberiniz olsun ki, biz her şeyi bir kadere göre yarattık.
        cid: 0
  - verse: 50
    segments:
      - text: >-
          Buyruğumuz yalnız bir tekdir, göz açıp yumma gibidir.
        cid: 0
  - verse: 51
    segments:
      - text: >-
          Andolsun biz, sizin benzerlerinizi hep helak ettik. Öğüt alan yok mudur?
        cid: 0
  - verse: 52
    segments:
      - text: >-
          İşledikleri her şey, kitaplarda mevcuttur.
        cid: 0
  - verse: 53
    segments:
      - text: >-
          Küçük, büyük hepsi satır satır yazılmıştır.
        cid: 0
  - verse: 54
    segments:
      - text: >-
          Takva sahipleri cennetlerde, nur içindedirler.
        cid: 0
  - verse: 55
    segments:
      - text: >-
          Güçlü padişahın huzurunda doğruluk koltuklarındadırlar.
        cid: 0