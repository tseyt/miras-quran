surah_id: 40
language: tr
author: elmalili
verses:
  - verse: 1
    segments:
      - text: >-
          Hâ Mîm.
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Bu kitabın indirilişi, çok güçlü ve her şeyi bilen Allah tarafındandır.
        cid: 0
  - verse: 3
    segments:
      - text: >-
          O, günah bağışlayıcı, tevbe kabul edici, azabı şiddetli, kerem sahibi
          Allah'tandır ki O'ndan başka ilâh yoktur. Hem dönüş O'nadır.
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Allah'ın âyetleri hakkında ancak kâfirler mücadele ederler. Şimdi onların
          beldeler içinde dönüp dolaşmaları seni aldatmasın.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Onlardan önce Nuh kavmi, arkalarından da çeşitli topluluklar yalanlamışlardı.
          Her ümmet, kendi peygamberlerini yakalamak kastında bulundu. Hakkı batılla
          gidermek için boşuna mücadele ettiler. Ben de onları tuttum, alıverdim. (Bak o
          zaman) azabım nasıl oldu?
        cid: 0
  - verse: 6
    segments:
      - text: >-
          İşte o nankörlük eden kâfirlere Rabbinin (azab) sözü öyle hak oldu. Onlar,
          mutlaka cehennemliktirler.
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Arşı taşıyanlar ve onun etrafındakiler, Rablerinin hamdiyle tesbih ederler ve
          O'na inanırlar. İman etmişler için de şöyle bağışlanma dilerler: "Ey Rabbimiz!
          Rahmetin ve ilmin her şeyi kuşatmıştır. O, tevbe edip senin yoluna uyanları
          bağışla, onları cehennem azabından koru."
        cid: 0
  - verse: 8
    segments:
      - text: >-
          "Ey Rabbimiz! Hem onları, hem onların atalarından, zevcelerinden ve
          zürriyetlerinden iyi olanları kendilerine vaad buyurduğun Adn cennetlerine koy.
          Şüphesiz çok güçlü, hüküm ve hikmet sahibi olan sensin."
        cid: 0
  - verse: 9
    segments:
      - text: >-
          "Onları fenalıklardan koru. Sen her kimi fenalıklardan korursan, o gün muhakkak
          onu rahmetinle yarlığamışsındır. İşte asıl büyük kurtuluş da budur."
        cid: 0
  - verse: 10
    segments:
      - text: >-
          O kâfirlere mutlaka şöyle bağırılacaktır: "Elbette Allah'ın buğzu, sizin
          nefislerinize buğzunuzdan daha büyüktür. Çünkü siz imana davet ediliyordunuz da
          inkâr ediyordunuz."
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Kâfirler diyecekler ki: "Ey Rabbimiz! Sen bizi iki defa öldürdün, iki defa
          dirilttin. Şimdi günahlarımızı anladık. Fakat çıkmaya bir yol var mı?"
        cid: 0
  - verse: 12
    segments:
      - text: >-
          (Onlara şöyle cevap verilir): "Bu azab size şu sebeptendir: Siz tek Allah'a
          davet edildiğiniz zaman inkâr ettiniz. Ama O'na ortak koşulunca inandınız. Artık
          hüküm, o yüce ve büyük Allah'ındır."
        cid: 0
  - verse: 13
    segments:
      - text: >-
          Size âyetlerini gösteren, sizin için gökten bir rızık indiren O'dur. Fakat
          onları ancak gönül verip düşünenler anlar.
        cid: 0
  - verse: 14
    segments:
      - text: >-
          O halde siz, dini Allah için halis kılarak hep O'na yalvarın. İsterse kâfirler
          hoşlanmasınlar.
        cid: 0
  - verse: 15
    segments:
      - text: >-
          O dereceleri yükselten Arş'ın sahibi Allah, o buluşma gününün (kıyametin)
          dehşetini haber vermek için kullarından dilediği kimseye emrinden ruh (melek)
          indiriyor.
        cid: 0
  - verse: 16
    segments:
      - text: >-
          O gün onlar kabirlerinden meydana fırlarlar. Kendilerinin hiçbir şeyi Allah'a
          karşı gizli kalmaz. "Bugün mülk kimindir?" (diye sorulur. Cevaben): "Tek ve
          kahhar olan Allah'ındır." (denir).
        cid: 0
  - verse: 17
    segments:
      - text: >-
          Bugün her nefis kazandığı ile cezalanacaktır. Bugün zulüm yoktur. Şüphesiz
          Allah, hesabı çabuk görendir.
        cid: 0
  - verse: 18
    segments:
      - text: >-
          Yaklaşmakta olan o felaket (kıyamet) gününü de onlara haber ver. O dem ki
          yürekler gırtlaklara dayanmıştır, yutkunup dururlar. Zalimler için ne ısınacak
          bir dost vardır, ne de sözü dinlenecek bir şefaatçi.
        cid: 0
  - verse: 19
    segments:
      - text: >-
          Allah, gözlerin hain bakışını da bilir, gönüllerin gizlediğini de.
        cid: 0
  - verse: 20
    segments:
      - text: >-
          Allah hakkı yerine getirir. Onların O'ndan başka yalvardıkları ise hiçbir şeyi
          yerine getiremezler. Çünkü hakkıyla işiten ve gören ancak Allah'tır.
        cid: 0
  - verse: 21
    segments:
      - text: >-
          Yeryüzünde bir gezmediler mi? Baksalar ya kendilerinden öncekilerin sonları
          nasıl olmuş? Onlar yeryüzünde gerek kuvvetçe ve gerek eserce kendilerinden daha
          üstündüler. Öyle iken Allah onları günahları sebebiyle tutup alıverdi.
          Kendilerini Allah'ın azabından koruyacak biri bulunmadı.
        cid: 0
  - verse: 22
    segments:
      - text: >-
          O, şundandı: Onlara peygamberleri apaçık delillerle geliyorlardı. Ama onlar
          inkâr ettiler. Allah da tuttu kendilerini alıverdi. Çünkü O'nun kuvveti çok,
          azabı şiddetlidir.
        cid: 0
  - verse: 23
    segments:
      - text: >-
          Andolsun Musa'yı âyetlerimizle ve açık bir delil ile gönderdik.
        cid: 0
  - verse: 24
    segments:
      - text: >-
          Firavun'a, Hâmân'a ve Karun'a da onlar: "Bu bir sihirbaz, bir yalancıdır"
          dediler.
        cid: 0
  - verse: 25
    segments:
      - text: >-
          Bunun üzerine Musa, kendilerine tarafımızdan hakkı getirince de: "Onunla
          beraber iman etmiş olanların oğullarını öldürün, kadınlarını diri tutun."
          dediler. Fakat o kâfirlerin tuzağı da hep boşa çıkmaktadır.
        cid: 0
  - verse: 26
    segments:
      - text: >-
          Bir de Firavun: "Bırakın beni, öldüreyim Musa'yı da o Rabbine dua etsin. Çünkü
          ben onun, dininizi değiştirmesinden veya yeryüzünde bir bozgunculuk
          çıkarmasından korkuyorum" dedi.
        cid: 0
  - verse: 27
    segments:
      - text: >-
          Musa da: "Ben hesap gününe inanmayan her kibirliden, benim de Rabbim, sizin de
          Rabbiniz olan Allah'a sığınırım" dedi.
        cid: 0
  - verse: 28
    segments:
      - text: >-
          Firavun ailesinden imanını saklayan bir adam da şöyle dedi: "Bir adamı, Rabbim
          Allah dediği için öldürecek misiniz? Halbuki o size Rabbinizden delillerle
          gelmiştir. Hem o bir yalancı ise çok sürmez, yalanı boynuna geçer. Fakat doğru
          ise size yaptığı tehditlerin birkısmı olsun başınıza gelir. Şüphe yok ki Allah
          aşırı giden bir yalancıyı doğru yola çıkarmaz."
        cid: 0
  - verse: 29
    segments:
      - text: >-
          "Ey kavmim! Bugün mülk sizindir. Dünyada yüze çıkmış bulunuyorsunuz. Eğer
          gelecek olursa Allah'ın hışmından bizi kim kurtarır?" Firavun: "Ben size
          görüşümden başkasını göstermiyorum ve herhalde ben size doğru yolu gösteriyorum"
          dedi.
        cid: 0
  - verse: 30
    segments:
      - text: >-
          O iman etmiş olan kimse de: "Ey kavmim! Doğrusu ben sizin hakkınızda Ahzab
          (önceki çeşitli toplumlar)ın günleri gibi bir günden korkuyorum."
        cid: 0
  - verse: 31
    segments:
      - text: >-
          "Nuh Kavmi'nin, Âd'ın, Semud'un ve daha sonrakilerin maceraları gibi (bir günün
          geleceğinden korkuyorum). Allah, kulları için bir zulüm istemez."
        cid: 0
  - verse: 32
    segments:
      - text: >-
          "Ey kavmim! Ben size gelecek o çağrışma gününden (kıyamet gününden)
          korkuyorum."
        cid: 0
  - verse: 33
    segments:
      - text: >-
          "O gün arkanıza dönüp kaçacaksınız. Fakat sizi Allah'tan koruyacak olan yoktur.
          Her kimi Allah şaşırtırsa, artık ona bir yol gösterici bulunmaz."
        cid: 0
  - verse: 34
    segments:
      - text: >-
          Bundan önce size delillerle Yusuf gelmişti. O zaman da onun size getirdiği
          hakikatte şüphe edip durmuştunuz. Nihayet vefat ettiğinde de "Bundan sonra Allah
          asla peygamber göndermez" dediniz. İşte aşırı şüpheci olanları Allah böyle
          şaşırtır.
        cid: 0
  - verse: 35
    segments:
      - text: >-
          Onlar, kendilerine gelmiş bir delil olmaksızın, Allah'ın âyetleri hakkında
          mücadele ederler. Bu durum, Allah katında ve iman edenler yanında büyük bir
          buğzu gerektirir. İşte Allah, her böbürlenen zorbanın kalbini öyle bir tabiat
          ile mühürler.
        cid: 0
  - verse: 36
    segments:
      - text: >-
          Firavun dedi ki: "Ey Hâmân! Bana bir kule yap, belki ben o yollara
          ulaşabilirim."
        cid: 0
  - verse: 37
    segments:
      - text: >-
          "Göklerin yollarına ulaşabilirim de, Musa'nın ilâhının ne olduğunu anlarım. Ben
          onu mutlaka yalancı sanıyorum." İşte böylece Firavun'a kötü ameli süslü
          gösterildi de yoldan çıkarıldı. Çünkü Firavun düzeni hep boşa çıkar.
        cid: 0
  - verse: 38
    segments:
      - text: >-
          O iman etmiş olan kimse dedi ki: "Ey kavmim! Bana uyun ki size doğru yolu
          göstereyim."
        cid: 0
  - verse: 39
    segments:
      - text: >-
          "Ey kavmim! Bu dünya hayatı ancak geçici bir menfaatten ibarettir. Ahiret ise
          durulacak karar yurdudur."
        cid: 0
  - verse: 40
    segments:
      - text: >-
          "Her kim bir kötülük yaparsa, ona ancak yaptığının bir misli ile ceza verilir.
          Erkek veya kadın, her kim de mümin olarak iyi bir amel işlerse, işte onlar
          cennete girerler. Orada kendilerine hesapsız rızık verilir."
        cid: 0
  - verse: 41
    segments:
      - text: >-
          "Hem ey kavmim! Niçin ben sizi kurtuluşa davet ederken, siz beni ateşe davet
          ediyorsunuz?"
        cid: 0
  - verse: 42
    segments:
      - text: >-
          "Siz beni Allah'ı inkâr etmeye ve bence hiç ilimde yeri olmayan şeyleri O'na
          ortak koşmaya davet ediyorsunuz. Ben ise sizi o çok güçlü ve çok bağışlayıcı
          olan Allah'a davet ediyorum."
        cid: 0
  - verse: 43
    segments:
      - text: >-
          "Hiç inkâr edilemez ki, gerçekten sizin beni davet ettiğiniz şeyin dünyada da,
          ahirette de bir davet hakkı yoktur. Hepimizin dönüşü Allah'adır. Şüphesiz haddi
          aşanların hepsi cehennemliktir."
        cid: 0
  - verse: 44
    segments:
      - text: >-
          "Siz benim söylediklerimi sonra anlayacaksınız. Ben işimi Allah'a havale
          ediyorum. Şüphesiz Allah, kullarını görür, gözetir."
        cid: 0
  - verse: 45
    segments:
      - text: >-
          Allah o mümini, onların kurdukları tuzakların kötülüklerinden korudu.
          Firavun'un adamlarını ise, o kötü azab kuşattı.
        cid: 0
  - verse: 46
    segments:
      - text: >-
          Onlar, sabah akşam ateşe arzolunurlar. Kıyamet kopacağı gün de: "Firavun
          hanedanını azabın en şiddetlisine tıkın!" (denilecektir).
        cid: 0
  - verse: 47
    segments:
      - text: >-
          Hele ateş içinde birbirlerini protesto ederlerken, zayıf olanlar, büyüklük
          taslayanlara: "Hani bizler size tabi idik. Şimdi siz bizden bir ateş nöbetini
          savabiliyor musunuz?" derler.
        cid: 0
  - verse: 48
    segments:
      - text: >-
          Büyüklük taslayanlar da şöyle derler: "Evet, hepimiz onun içindeyiz. Allah
          kulları arasında hükmünü vermiştir."
        cid: 0
  - verse: 49
    segments:
      - text: >-
          Ateştekiler, cehennem bekçilerine derler ki: "Rabbinize dua edin de bir gün
          olsun bizden azabı biraz hafifletsin."
        cid: 0
  - verse: 50
    segments:
      - text: >-
          Bekçiler de: "Size peygamberleriniz mucizelerle gelmiyorlar mıydı?" diye
          sorarlar. Onlar: "Evet" derler. Bekçiler: "Öyle ise kendiniz dua edin" derler.
          Kâfirlerin duası ise hep çıkmazdadır.
        cid: 0
  - verse: 51
    segments:
      - text: >-
          Biz peygamberimize ve inananlara hem dünya hayatında hem de şahitlerin şahitlik
          edecekleri günde (kıyamette) elbette yardım ederiz.
        cid: 0
  - verse: 52
    segments:
      - text: >-
          O gün zalimlere özür dilemeleri fayda vermez. Onlara lanet vardır, onlara
          yurdun kötüsü (cehennem) vardır.
        cid: 0
  - verse: 53
    segments:
      - text: >-
          Andolsun ki biz Musa'ya o hidayeti verdik ve İsrailoğullarına o kitabı miras
          kıldık.
        cid: 0
  - verse: 54
    segments:
      - text: >-
          (Bunu) Aklı başında olanlara bir yol gösterici ve bir hatırlatma olsun diye
          (böyle yaptık).
        cid: 0
  - verse: 55
    segments:
      - text: >-
          O halde sabret. Çünkü Allah'ın vaadi haktır. Hem günahından dolayı istiğfar et
          ve akşam sabah Rabbini hamdiyle tesbih et.
        cid: 0
  - verse: 56
    segments:
      - text: >-
          Kendilerine gelmiş kesin bir delil olmaksızın, Allah'ın âyetleri hakkında
          mücadele edenlerin göğüslerinde ancak yetişemeyecekleri bir kibir vardır. Sen
          hemen Allah'a sığın. Çünkü her şeyi işiten ve gören O'dur.
        cid: 0
  - verse: 57
    segments:
      - text: >-
          Elbette göklerin ve yerin yaratılması, insanların yaratılmasından daha
          büyüktür. Fakat insanların çoğu bilmezler.
        cid: 0
  - verse: 58
    segments:
      - text: >-
          Kör ile gören bir olmaz, iman edip salih ameller işleyen kimseler ile kötülük
          yapan da bir değildir. Ne kadar da az düşünüyorsunuz!
        cid: 0
  - verse: 59
    segments:
      - text: >-
          Herhalde o saat (kıyamet) muhakkak gelecektir. Onda şüphe yok. Fakat insanların
          çoğu inanmazlar.
        cid: 0
  - verse: 60
    segments:
      - text: >-
          Halbuki Rabbiniz: "Bana yalvarın, dua edin ki size karşılık vereyim. Çünkü bana
          ibadet etmekten kibirlenip yüz çevirenler yarın horlanmış olarak cehenneme
          gireceklerdir." buyurdu.
        cid: 0
  - verse: 61
    segments:
      - text: >-
          İçinde dinlenesiniz diye geceyi, göz açıcı bir aydınlık olarak da gündüzü sizin
          için yaratan Allah'tır. Gerçekten Allah insanlara karşı bir lütuf sahibidir.
          Fakat insanların çoğu şükretmezler
        cid: 0
  - verse: 62
    segments:
      - text: >-
          İşte Rabbiniz, her şeyin yaratıcısı olan o Allah'tır. O'ndan başka ilâh yoktur.
          O halde (haktan) nasıl çevrilirsiniz?
        cid: 0
  - verse: 63
    segments:
      - text: >-
          İşte Allah'ın âyetlerini inkâr edenler böyle çevriliyorlar.
        cid: 0
  - verse: 64
    segments:
      - text: >-
          Allah, O'dur ki sizin için yeri bir karargâh, göğü de bir bina yapmıştır. Size
          şekil vermiş, sonra şekillerinizi güzelleştirmiştir. Hoş nimetlerden size rızık
          vermiştir. İşte Rabbiniz o Allah'tır. Âlemlerin Rabbi olan Allah ne yücedir!
        cid: 0
  - verse: 65
    segments:
      - text: >-
          Daimî bir hayat sahibi ancak O'dur. O'ndan başka ilâh yoktur. Onun için dini
          halis kılarak O'na, hep O'na yalvarın. Hamd, âlemlerin Rabbi olan Allah'a
          mahsustur.
        cid: 0
  - verse: 66
    segments:
      - text: >-
          De ki: "Bana Rabbimden apaçık deliller geldiği zaman, ben o sizin Allah'ı
          bırakıp taptıklarınıza ibadet etmekten kesinlikle men edildim ve bana âlemlerin
          Rabbine teslim olmam emredildi."
        cid: 0
  - verse: 67
    segments:
      - text: >-
          "Sizi (önce) bir topraktan, sonra bir damla sudan, sonra bir aleka (embriyo)dan
          yaratan, sonra sizi bir bebek olarak çıkaran, sonra güçlü kuvvetli bir çağa
          erişmeniz, sonra da ihtiyarlar olmanız için yaşatıp büyüten O'dur. İçinizden
          kimi de daha önce vefat ettiriliyor. (Bunları Allah) belirli bir süreye
          ulaşasınız ve aklınızı kullanasınız diye (böyle yapıyor)."
        cid: 0
  - verse: 68
    segments:
      - text: >-
          O, hem yaşatır, hem öldürür. O, bir şey yapmak isteyince ona sadece "ol!" der,
          o şey de hemen oluverir.
        cid: 0
  - verse: 69
    segments:
      - text: >-
          Bakmaz mısın şimdi Allah'ın âyetleri hakkında mücadeleye kalkanlara! (Haktan)
          nasıl döndürülüyorlar?
        cid: 0
  - verse: 70
    segments:
      - text: >-
          Kitaba ve Resullerimizi gönderdiğimiz şeylere yalan diyenler, artık ilerde
          bilecekler.
        cid: 0
  - verse: 71
    segments:
      - text: >-
          O zaman boyunlarında halkalar ve zincirler olduğu halde sürükleneceklerdir.
        cid: 0
  - verse: 72
    segments:
      - text: >-
          Kaynar suda, sonra da ateşte kaynatılacaklardır.
        cid: 0
  - verse: 73
    segments:
      - text: >-
          Sonra da onlara: "Nerede o ortak koştuklarınız?" denilecek.
        cid: 0
  - verse: 74
    segments:
      - text: >-
          O Allah'tan başkaları (nerede denilecek). Onlar da diyecekler ki: "Hepsi bizden
          uzaklaşıp gittiler. Daha doğrusu biz bundan önce hiçbir şeye ibadet
          etmiyormuşuz." İşte Allah, o kâfirleri böyle şaşırtır.
        cid: 0
  - verse: 75
    segments:
      - text: >-
          Bunun sebebi şudur: Çünkü siz yeryüzünde haksız yere seviniyor ve
          güveniyordunuz.
        cid: 0
  - verse: 76
    segments:
      - text: >-
          İçlerinde ebedî olarak kalmak üzere cehennemin kapılarından girin. Bak ne kötü
          o kibirlenenlerin yeri?
        cid: 0
  - verse: 77
    segments:
      - text: >-
          Ey Muhammed! Sen sabret, şüphesiz Allah'ın vaadi haktır, mutlaka
          gerçekleşecektir. Onlara yaptığımız tehdidin bir kısmını sana göstersek de veya
          seni vefat ettirsek de onlar mutlaka döndürülüp bize getirileceklerdir.
        cid: 0
  - verse: 78
    segments:
      - text: >-
          Andolsun ki biz senin önünden nice peygamberler göndermişizdir. Onlardan kimini
          sana anlatmışız, kimini de anlatmamışızdır. Hiçbir peygamber, Allah'ın izni
          olmaksızın bir mucize getiremez. Allah'ın emri gelince de hak yerine getirilir.
          Batıl bir dava peşinde koşanlar, işte bu noktada hüsrana uğrarlar.
        cid: 0
  - verse: 79
    segments:
      - text: >-
          Kimine binesiniz, kimini de yiyesiniz diye sizin için o yumuşak başlı
          hayvanları yaratan Allah'tır.
        cid: 0
  - verse: 80
    segments:
      - text: >-
          Sizin için onlarda daha nice menfaatler vardır. Onların üzerinde
          gönüllerinizdeki bir arzuya erersiniz. Hem onlar üzerinde, hem de gemiler
          üzerinde taşınırsınız.
        cid: 0
  - verse: 81
    segments:
      - text: >-
          Allah size âyetlerini gösteriyor. Şimdi Allah'ın âyetlerinin hangisini inkâr
          edersiniz?
        cid: 0
  - verse: 82
    segments:
      - text: >-
          Daha yeryüzünde gezip de bir bakmazlar mı? Kendilerinden öncekilerin sonu nasıl
          olmuş? Onlar kendilerinden hem daha çok, hem de kuvvetçe ve yeryüzündeki
          eserlerinin sağlamlığı bakımından daha çetindiler. Öyle iken o kazandıkları
          şeyler, kendilerini kurtaramadı.
        cid: 0
  - verse: 83
    segments:
      - text: >-
          Çünkü onlara peygamberleri, delillerle geldikleri zaman, kendilerinde bulunan
          ilme güvendiler de o alay ettikleri şey onları kuşatıverdi.
        cid: 0
  - verse: 84
    segments:
      - text: >-
          O zaman hışmımızı gördüklerinde: "Allah'ın birliğine inandık ve O'na şirk
          koştuğumuz şeyleri inkâr ettik" dediler.
        cid: 0
  - verse: 85
    segments:
      - text: >-
          Ama hışmımızı gördükleri zamanki imanları kendilerine fayda verecek değildi.
          Allah'ın, kulları hakkındaki geçe gelen kanunu budur. İşte kâfirler bu noktada
          hüsrana düştüler.
        cid: 0