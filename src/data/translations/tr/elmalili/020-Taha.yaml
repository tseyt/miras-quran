        cid: 0
  - verse: 135
    segments:
      - text: >-
          De ki: "Hepimiz beklemekteyiz, siz de bekleyedurun. Şüphesiz düz yolun
          sahiplerinin kimler olduğunu ve kimlerin doğru yolda bulunduğunu yakında
          bileceksiniz.
