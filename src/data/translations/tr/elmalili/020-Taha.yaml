    segments:
      - text: >-
          (Ey Muhammed!) Sana geçmişin haberlerinden bir kısmını böylece anlatıyoruz.
          Şüphe yok ki, sana katımızdan bir zikir (düşünüp kendisinden ibret alınacak bir
          kitab) verdik.
        cid: 0
  - verse: 100
    segments:
      - text: >-
          Kim ondan yüz çevirirse, şüphesiz o, kıyamet günü bir günah yüklenecektir.
        cid: 0
  - verse: 101
    segments:
      - text: >-
          Devamlı o azabın altında kalacaklar. Kıyamet günü onlar için, bu ne fena bir
          yüktür!
        cid: 0
  - verse: 102
    segments:
      - text: >-
          Sûr'a üfürüleceği gün ki biz suçluları o gün, (gözleri korkudan) göğermiş
          olarak mahşerde toplayacağız.
        cid: 0
  - verse: 103
    segments:
      - text: >-
          "Siz dünyada sadece on(gün) kaldınız" diye kendi aralarında gizli gizli
          konuşurlar.
        cid: 0
  - verse: 104
    segments:
      - text: >-
          Aralarında ne konuşacaklarını biz çok iyi biliriz. Görüşü en üstün olan: "Ancak
          bir gün kaldınız" diyecektir.
        cid: 0
  - verse: 105
    segments:
      - text: >-
          (Ey Muhammed!) Sana dağlar(ın kıyametteki durumunu) sorarlar, de ki: "Rabbim
          onları ufalayıp savuracak."
        cid: 0
  - verse: 106
    segments:
      - text: >-
          "Böylece yerlerini dümdüz boş bir halde bırakacak."
        cid: 0
  - verse: 107
    segments:
      - text: >-
          "Orada ne bir çukur, ne de bir tümsek göreceksin."
        cid: 0
  - verse: 108
    segments:
      - text: >-
          O gün, hiçbir tarafa sapmadan o davetçiye (Sûr'a üfleyenin çağrısına) uyarlar.
          Öyleki, Rahmân'ın heybetinden sesler kısılmıştır. Artık bir fısıltıdan başka
          hiçbir şey işitemezsin.
        cid: 0
  - verse: 109
    segments:
      - text: >-
          O gün, Rahmân'ın kendisine izin verdiği ve sözünden hoşnud olduğu kimselerden
          başkasının şefaatı fayda vermez.
        cid: 0
  - verse: 110
    segments:
      - text: >-
          Allah, onların geleceklerini de, geçmişlerini de bilir. Onlar ise O'nu ilmen
          kavrayamazlar.
        cid: 0
  - verse: 111
    segments:
      - text: >-
          Bütün yüzler, diri ve bütün yarattıklarını gözetip duran Allah'a baş eğmiştir.
          Bir zulüm yüklenen gerçekten hüsrana uğramıştır.
        cid: 0
  - verse: 112
    segments:
      - text: >-
          Her kim de mümin olarak salih amelleri işlerse, artık o, ne bir haksızlıktan ve
          ne de çiğnenmekden korkar.
        cid: 0
  - verse: 113
    segments:
      - text: >-
          İşte böylece biz onu Arapça bir Kur'ân olarak indirdik. Onda tehditlerden nice
          türlüsünü tekrar tekrar açıkladık ki belki sakınırlar, yahut onlara bir ibret ve
          uyanış verir.
        cid: 0
  - verse: 114
    segments:
      - text: >-
          Hükmü her yerde geçerli gerçek hükümdar olan Allah yücedir. (Ey Muhammed!)
          Kur'ân sana vahyedilirken, vahiy bitmeden önce (unutma korkusu ile) Kur'ân'ı
          okumada acele etme; "Rabbim! benim ilmimi artır" de.
        cid: 0
  - verse: 115
    segments:
      - text: >-
          Doğrusu bundan önce Âdem'e (bu ağaçtan yeme diye) emrettik, fakat unuttu ve biz
