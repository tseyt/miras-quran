surah_id: 20
language: tr
author: elmalili
verses:
  - verse: 1
    segments:
      - text: >-
          Tâ, Hâ,
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Ey Muhammed! Kur'ân'ı sana sıkıntıya düşesin diye indirmedik.
        cid: 0
  - verse: 3
    segments:
      - text: >-
          Ancak Allah'tan korkan kimse için bir öğüt olarak (indirdik.)
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Yeri ve yüce gökleri yaratanın katından yavaş yavaş bir indirilişle (onu)
          indirdik.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          O Rahmân (kudret ve hakimiyyetiyle) Arş'a hakim oldu.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Bütün göklerde olanlar, bütün yerdekiler, bu ikisinin arasında ve toprağın
          altıda bulunanlar O'nundur.
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Sen (Allah'a ettiğin dua ve zikirle) sesini yükseltirsen (bilki Allah bundan
          mustağnîdir.). Çünkü O şüphesiz gizliyi de, gizlinin gizlisini de bilir.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Allah O'dur ki, kendisinden başka hiçbir ilâh yoktur. En güzel isimler
          O'nundur.
        cid: 0
  - verse: 9
    segments:
