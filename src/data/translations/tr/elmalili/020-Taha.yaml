        cid: 0
  - verse: 125
    segments:
      - text: >-
          (O zaman Kur'ândan yüz çeviren kimse) "Rabbim! beni niçin kör olarak haşrettin,
          oysa ben gören bir kimseydim" der.
        cid: 0
  - verse: 126
    segments:
      - text: >-
          Allah: "Böyledir, sana âyetlerimiz gelmişti de onları sen unutmuştun, bugün de
