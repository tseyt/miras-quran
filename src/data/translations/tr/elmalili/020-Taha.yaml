        cid: 0
  - verse: 129
    segments:
      - text: >-
          Eğer Rabbinin verdiği bir hüküm ve tayin ettiği bir süre olmasaydı, hemen azaba
          uğrarlardı.
        cid: 0
  - verse: 130
    segments:
      - text: >-
          O halde, dediklerine sabret; güneşin doğmasından önce ve batmasından önce
          Rabbini hamd ile tesbih et. Gecenin bir kısım vakitlerinde ve gündüzün etrafında
          da tesbih et ki hoşnudluğa eresin.
        cid: 0
  - verse: 131
    segments:
      - text: >-
          Kâfirlerden bir kısmına, onları sınamak için dünya hayatının zineti olarak
