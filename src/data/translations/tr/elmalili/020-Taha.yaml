          çeker, perişan olursun)."
        cid: 0
  - verse: 118
    segments:
      - text: >-
          "Doğrusu senin acıkmaman ve çıplak kalmaman (ancak) cennettedir. "
        cid: 0
  - verse: 119
    segments:
      - text: >-
          Ve sen orada ne susarsın, ne de güneşin sıcağında kalırsın"
        cid: 0
  - verse: 120
    segments:
      - text: >-
          Nihayet şeytan ona vesvese verdi. Şöyle dedi: "Ey Âdem! Sana sonsuzluk ağacını
          ve çökmesi olmayan bir saltanatı göstereyim mi?"
        cid: 0
  - verse: 121
    segments:
      - text: >-
          Bunun üzerine ikisi de o ağaçtan yediler. Hemen ayıp yerleri kendilerine açılıp
