        cid: 0
  - verse: 122
    segments:
      - text: >-
          Sonra Rabbi, onu seçti de tevbesini kabul buyurdu ve ona doğru yolu gösterdi.
        cid: 0
  - verse: 123
    segments:
      - text: >-
          Allah (onlara) şöyle dedi: "Birbirinize düşman olmak üzere hepiniz oradan
