        cid: 0
  - verse: 127
    segments:
      - text: >-
          İşte haddi aşanları, Rabbinin âyetlerine inanmayanları biz böyle
          cezalandırırız. Ve muhakkak ki ahiret azabı (dünya azabından) daha şiddetli ve
          daha devamlıdır.
        cid: 0
  - verse: 128
    segments:
      - text: >-
          Onları, yerlerinde gezip durdukları şu kendilerinden önce yok ettiğimiz bunca
