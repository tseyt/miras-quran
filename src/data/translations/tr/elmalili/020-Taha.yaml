        cid: 0
  - verse: 132
    segments:
      - text: >-
          (Ey Muhammed!) Ehline namaz kılmalarını emret, kendin de ona sabırla devam et.
          Biz senden bir rızık istemiyoruz. Seni biz rızıklandırırız. Güzel akibet takva
          sahiplerinindir.
        cid: 0
  - verse: 133
    segments:
      - text: >-
          (İnkâr edenler): "Rabbinden bize bir mucize getirse ya" dediler. Onlara önceki
          kitablarda olan apaçık deliller gelmedi mi?
        cid: 0
  - verse: 134
    segments:
      - text: >-
