surah_id: 81
language: tr
author: elmalili
verses:
  - verse: 1
    segments:
      - text: >-
          Güneş katlanıp dürüldüğünde,
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Yıldızlar bulandığında,
        cid: 0
  - verse: 3
    segments:
      - text: >-
          Dağlar yürütüldüğünde,
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Kıyılmaz mallar bırakıldığında,
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Vahşi hayvanlar bir araya toplandığında,
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Denizler ateşlendiğinde (suları çekilip, volkanlar halinde ateş püskürdüğünde),
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Nefisler eşleştirildiğinde (iyiler iyilerle, kötüler kötülerle bir araya
          toplandığında),
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Diri diri toprağa gömülen kıza sorulduğunda,
        cid: 0
  - verse: 9
    segments:
      - text: >-
          "Hangi günahtan dolayı öldürüldü?" diye.
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Amel defterleri açıldığında,
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Gök sıyrılıp açıldığında,
        cid: 0
  - verse: 12
    segments:
      - text: >-
          Cehennem kızıştırıldığında,
        cid: 0
  - verse: 13
    segments:
      - text: >-
          Ve cennet yaklaştırıldığında,
        cid: 0
  - verse: 14
    segments:
      - text: >-
          Herkes ne getirmiş olduğunu anlar.
        cid: 0
  - verse: 15
    segments:
      - text: >-
          Şimdi yemin ederim o sinenlere (gündüzleri gözden kaybolan yıldızlara),
        cid: 0
  - verse: 16
    segments:
      - text: >-
          O akıp akıp yuvasına gidenlere,
        cid: 0
  - verse: 17
    segments:
      - text: >-
          Yöneldiği an geceye,
        cid: 0
  - verse: 18
    segments:
      - text: >-
          Nefeslendiği (ağardığı) an sabaha ki,
        cid: 0
  - verse: 19
    segments:
      - text: >-
          Kuşkusuz o Kur'an, değerli bir elçinin sözüdür.
        cid: 0
  - verse: 20
    segments:
      - text: >-
          O elçi güçlüdür, Arş'ın sahibinin yanında çok itibarlıdır.
        cid: 0
  - verse: 21
    segments:
      - text: >-
          Orada ona itaat edilir, güvenilir.
        cid: 0
  - verse: 22
    segments:
      - text: >-
          Arkadaşınızı cin çarpmış değildir.
        cid: 0
  - verse: 23
    segments:
      - text: >-
          Andolsun o, Cebrail'i açık ufukta gördü.
        cid: 0
  - verse: 24
    segments:
      - text: >-
          O, gayb hakkında cimri de değildir.
        cid: 0
  - verse: 25
    segments:
      - text: >-
          O, kovulmuş bir şeytanın sözü değildir.
        cid: 0
  - verse: 26
    segments:
      - text: >-
          Hâl böyle iken, siz nereye gidiyorsunuz?
        cid: 0
  - verse: 27
    segments:
      - text: >-
          O, âlemler için öğütten başka bir şey değildir,
        cid: 0
  - verse: 28
    segments:
      - text: >-
          İçinizden doğru gitmek isteyenler için.
        cid: 0
  - verse: 29
    segments:
      - text: >-
          Âlemlerin Rabbi olan Allah dilemeyince, siz dileyemezsiniz.
        cid: 0