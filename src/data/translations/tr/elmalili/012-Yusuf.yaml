        cid: 0
  - verse: 59
    segments:
      - text: "Ne zaman ki onların bütün hazırlıklarını tamamladı, o zaman dedi ki: \"Babanızdan olan öbür kardeşinizi de bana getirin. Görüyorsunuz ya, ben ölçeği tam ölçüyorum ve ben konukseverlerin en hayırlısıyım.\""
        cid: 0
  - verse: 60
    segments:
      - text: "\"Siz eğer onu bana getirmezseniz, bir daha size hiç kile yok, (bir ölçek bile zahire alamazsınız) yanıma da yaklaşmayın\"."
        cid: 0
  - verse: 61
    segments:
      - text: "Dediler ki: \"Onun için babasından izin almaya çalışacağız. Her hâlü kârda bunu yapacağz.\""
        cid: 0
  - verse: 62
    segments:
      - text: "Yusuf bir taraftan da adamlarına tenbih etti: \"Sermayelerini yüklerinin içine koyuverin, belki ailelerinin yanına dönünce farkına varırlar ve belki yine gelirler\" dedi."
        cid: 0
  - verse: 63
    segments:
      - text: "Böylece dönüp babalarına geldikleri vakit, dediler ki: \"Ey babamız! Bizden ölçek menedildi (bize zahire verilmeyecek). Bu kere kardeşimizi de bizimle gönder ki, ölçek alabilelim. Biz onu kesinlikle koruyacağız.\""
        cid: 0
  - verse: 64
    segments:
      - text: "Babaları dedi ki: \"Ben onu size nasıl emanet ederim? Ya bundan önce kardeşini emanet ettiğimde olan gibi olursa! En hayırlı koruyucu Allah'dır ve O, merhamet edenlerin en merhametlisidir.\""
        cid: 0
  - verse: 65
    segments:
      - text: "Derken yüklerini açtılar ve sermayelerini kendilerine geri verilmiş olarak buldular. Dediler ki: \"Ey babamız! Daha ne isteriz? İşte sermayelerimiz de bize iade edilmiş. Bununla yine ailemize zahire alır getiririz, kardeşimizi de koruruz, üstelik biryük daha fazla zahire alırız. Zaten bu aldığımız pek az bir zahiredir.\""
        cid: 0
  - verse: 66
    segments:
      - text: "Babaları dedi ki: \"Hepiniz çaresiz kalmadıkça onu bana mutlaka getireceğinize dair Allah'dan bir yemin vermedikçe, onu, kesinlikle sizinle göndermem\". Onlar da Allah'a and içerek babalarına söz verince, babaları dedi ki: \"Bu söylediklerinize Allah vekildir\"."
        cid: 0
  - verse: 67
    segments:
      - text: "Ve dedi ki: \"Ey yavrularım! (şehre) hepiniz bir kapıdan girmeyin de ayrı ayrı kapılardan girin. Gerçi ben ne yapsam, Allah'ın takdirini sizden engelleyemem. Hüküm yalnızca Allah'ındır. Onun için bütün tevekkül edenler O'na tevekkül etmelidirler.\""
        cid: 0
  - verse: 68
    segments:
      - text: "Ne zaman ki, şehre vardılar, o zaman babalarının kendilerine emrettiği şekilde girdiler. (Gerçi bu şekilde girmeleri) onlar hakında Allah'ın takdir ettiği hiçbir şeyi önleyemezdi, bu sadece Yakub'un içinden geçirdiği bir isteğin yerine getirilmesi oldu. Şüphesiz o, ilim sahibiydi, çünkü ona biz öğretmiştik. Fakat insanların çoğu bunu bilmezler."
        cid: 0
  - verse: 69
    segments:
      - text: "Yusuf'un yanına girdikleri vakit, o, kardeşini (Bünyamin'i) yanında alıkoydu. Dedi ki: \"Bilesin, ben, senin kardeşinim! İşte bundan dolayı onların yapacaklarına sakın üzülme!\""
        cid: 0
  - verse: 70
    segments:
      - text: "Sonra onların bütün hazırlıklarını görünce, su kabını kardeşinin yükünün içine koydu. Sonra bir tellal şöyle bağırdı: \"Hey kervan! Siz hırsızsınız, hırsız!\""
        cid: 0
  - verse: 71
    segments:
      - text: "Bunlara döndüler de dediler ki: \"Ne arıyorsunuz?"
        cid: 0
  - verse: 72
    segments:
      - text: "Onlar da dediler ki: \"Hükümdarın su kabını arıyoruz. Onu bulup getirene bir yük zahire var. Üstelik o tas bana zimmetlidir\"."
        cid: 0
  - verse: 73
    segments:
      - text: "\"Allah'a yemin ederiz ki,\" dediler, \"Muhakkak siz de anlamışsınızdır ya, biz buraya fesat çıkarmak için gelmedik. Biz hırsız da değiliz.\""
        cid: 0
  - verse: 74
    segments:
      - text: "\"Peki yalancı çıkarsanız onun (hırsızlık edenin) cezası nedir?\" dediler."
        cid: 0
  - verse: 75
    segments:
      - text: "\"Kimin yükünde çıkarsa, o kendisi onun cezasıdır. Biz zalimlere işte böyle ceza veririz.\""
        cid: 0
  - verse: 76
    segments:
      - text: "Bunun üzerine Yusuf, kardeşinin eşyalarından önce onların eşyalarını aramaya başladı. Sonra su kabını kardeşinin yükünün içinden çıkardı. İşte Yusuf'a biz böyle bir oyun öğrettik. Melikin kanunlarına göre, kardeşini alıkoymasına imkan yoktu. Ancak Allah dilerse o başka. Biz dilediğimizi derecelerle yükseltiriz. Ve her bilgi sahibinin üstünde bir başka bilen vardır."
        cid: 0
