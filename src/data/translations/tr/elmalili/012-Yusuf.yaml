surah_id: 12
language: tr
author: elmalili
verses:
  - verse: 1
    segments:
      - text: "Elif, Lâm, Râ. İşte bunlar sana o açık seçik kitabın âyetleridir."
        cid: 0
  - verse: 2
    segments:
      - text: "Muhakkak ki, biz onu anlayasınız diye Arapça bir kitap olarak indirdik."
        cid: 0
  - verse: 3
    segments:
      - text: "Sana bu Kur'ân'ı vahyetmekle biz, sana kıssaların en güzelini anlatıyoruz. Gerçek şu ki, daha önce senin bundan hiç haberin yoktu."
        cid: 0
  - verse: 4
    segments:
      - text: "Hani bir vakitler Yusuf, babasına demişti ki: \"Babacığım, ben rüyada onbir yıldızla güneşi ve ayı bana secde ederken gördüm.\""
        cid: 0
  - verse: 5
    segments:
      - text: "(Babası) \"Yavrucuğum! \"dedi, \"rüyanı kardeşlerine anlatma. Sonra sana bir tuzak kurarlar. Çünkü şeytan insanın açıkça düşmanıdır.\""
        cid: 0
  - verse: 6
    segments:
      - text: "\"Ve işte böyle, Rabbin seni seçecek ve sana rüya tabirinden bilgiler öğretecek. Bundan önce ataların İbrahim'e ve İshak'a tamamladığı gibi, nimetini hem sana, hem de Yakup soyuna tamamlayacaktır. Muhakkak ki, Rabbin alîmdir, hakîmdir.\""
        cid: 0
  - verse: 7
    segments:
      - text: "Andolsun ki, Yusuf ve kardeşleri kıssasında soranlara ibret alacak âyetler vardır."
        cid: 0
  - verse: 8
    segments:
      - text: "Hani demişlerdi ki: \"Yusuf ve kardeşi (Bünyamin) babamıza bizden daha sevgili, biz ise güçlü ve tutkun bir grubuz. Doğrusu, babamız belli ki, çok açık bir yanılgı içindedir.\""
        cid: 0
  - verse: 9
    segments:
      - text: "\"Yusuf'u öldürün, ya da bir yere atın ki, babanızın yüzü (sevgisi) size kalsın, sonra yine salih bir kavim olursunuz.\""
        cid: 0
  - verse: 10
    segments:
      - text: "İçlerinden bir söz sahibi şöyle dedi: \"Yusuf'u öldürmeyin, bir kuyunun dibine bırakın da ordan geçen kafilenin biri onu bulup alsın. Eğer yapacaksanız böyle yapın.\""
        cid: 0
  - verse: 11
    segments:
      - text: "Dediler ki: \"Ey babamız! Sen bize Yusuf için neden güvenmiyorsun? Halbuki biz onun iyiliğini istiyoruz.\""
        cid: 0
  - verse: 12
    segments:
      - text: "\"Yarın onu bizimle beraber gönder de gezsin, oynasın. Kesinlikle biz onu koruruz.\""
        cid: 0
  - verse: 13
    segments:
      - text: "Babaları dedi ki: \"Onu götürmeniz beni üzer, korkarım ki onu kurt yer de sizin haberiniz bile olmaz.\""
        cid: 0
  - verse: 14
    segments:
      - text: "Dediler ki: \"Vallahi biz böyle güçlü kuvvetli bir topluluk iken, buna rağmen onu kurt yerse, o zaman biz kesinlikle hüsrana uğrayanlardan olmuş oluruz.\""
        cid: 0
  - verse: 15
    segments:
      - text: "Nihayet kardeşleri, Yusuf'u alıp götürdüler ve kuyunun dibine bırakmaya topluca karar verdiler. Biz de ona şöyle vahyettik: \"Andolsun ki, sen onlara ilerde hiç beklemedikleri bir sırada bu yaptıklarını haber vereceksin\"."
        cid: 0
  - verse: 16
    segments:
      - text: "Ve yatsı vakti, ağlayarak babalarına geldiler."
        cid: 0
  - verse: 17
    segments:
      - text: "Dediler ki: \"Ey babamız! Biz gittik, aramızda yarış yapıyorduk. Yusuf'u da eşyamızın yanına bırakmıştık. Bir de baktık ki, onu kurt yemiş. şu anda biz doğru da söylesek, yine de sen bize inanacak değilsin.\""
        cid: 0
  - verse: 18
    segments:
      - text: "Bir de gömleğinin üzerinde yalandan bir kan getirmişlerdi. Babaları dedi ki: \"Hayır, nefisleriniz aldatmış da size bir iş yaptırtmış. Artık bana güzel bir sabır gerekiyor. Bu anlattıklarınıza karşılık yardımına sığınılacak olan ancak Allah'dır.\""
        cid: 0
  - verse: 19
    segments:
      - text: "Daha sonra bir kafile gelmiş, sucularını da göndermişlerdi. Vardı, kovasını kuyuya saldı, \"Müjde hey, müjde! İşte bir çocuk!\" dedi. Ve onu satılık bir mal olarak gizleyip korudular. Allah ise onların ne yapacaklarını biliyordu."
        cid: 0
  - verse: 20
    segments:
      - text: "Ve onu düşük bir değerle birkaç dirheme sattılar. Ona fazla önem vermemişlerdi."
        cid: 0
  - verse: 21
    segments:
      - text: "Onu satın alan Mısırlı, eşine dedi ki: \"Buna güzel bak. Bize faydalı olabilir, ya da evlat ediniriz.\" Yusuf'u böylece oraya yerleştirdik. Ona rüyaların tabirini de öğrettik. Allah emrinde galiptir. Fakat insanların çoğu bunu bilmezler."
        cid: 0
  - verse: 22
    segments:
      - text: "O, tam erginlik çağına gelince, kendisine ilim ve hüküm verdik. İşte biz, güzel iş yapanları böyle mükafatlandırırız."
        cid: 0
  - verse: 23
    segments:
      - text: "Derken, evinde bulunduğu hanım, onun nefsinden murad alıp yararlanmak istedi. Kapıları kilitledi ve \"Haydi beri gel!\" dedi. Yusuf: \"Allah'a sığınırım! Muhakkak ki, o (kocan), benim efendim, bana çok güzel baktı. Doğrusu zalimler hiç iflah olmazlar\" dedi."
        cid: 0
  - verse: 24
    segments:
      - text: "O hanım, ona gerçekten niyeti bozmuştu. Eğer Rabbinin burhanını görmese idi. Yusuf da ona özenip gitmişti. Aslında ondan fuhşu ve fenalığı uzak tutalım diye böyle olmuştu. Çünkü o bizim ihlasa erdirilmiş kullarımızdan biriydi."
        cid: 0
  - verse: 25
    segments:
      - text: "İkisi de kapıya koştular. Hanım, onun gömleğini arkadan yırttı. Ve kapının yanında hanımın efendisiyle karşı karşıya geldiler. Hanım hemen dedi ki: \"Senin eşine fenalık yapmak isteyenin cezası, zindana atılmaktan veya acı bir azaba uğratılmaktan başka ne olabilir?\""
        cid: 0
  - verse: 26
    segments:
      - text: "Yusuf: \"kendisi benden yararlanmak istedi\" dedi. Hanımın akrabasından biri de şöyle şahitlik etti: \"Eğer gömleği önden yırtılmış ise hanım doğru söylemiştir, o zaman bu, yalancılardandır.\""
        cid: 0
  - verse: 27
    segments:
      - text: "\"Yok eğer gömleği arkadan yırtılmış ise hanım yalan söylemiştir, o zaman bu doğru söyleyenlerdendir.\""
        cid: 0
  - verse: 28
    segments:
      - text: "Ne zaman ki, gömleğin arkadan yırtılmış olduğunu gördü, o zaman dedi ki: \"Bu iş, siz kadınların tuzağındandır. Gerçekten de sizin tuzağınız çok büyüktür\"."
        cid: 0
  - verse: 29
    segments:
      - text: "\"Yusuf! Sakın sen bundan bahsetme! Kadın! Sen de günahından dolayı istiğfar et. Sen gerçekten günahkarlardan oldun\"."
        cid: 0
  - verse: 30
    segments:
      - text: "Şehirde bazı kadınlar da \"Azizin karısı, delikanlısından murad almaya kalkmış, sevgi yüreğini yakıp kavuruyormuş, görüyoruz ki, kadın çıldırmış besbelli...\" dediler."
        cid: 0
  - verse: 31
    segments:
      - text: "Azizin karısı, onların gizliden gizliye dedikodu yaydıklarını işitince, onlara davetçi gönderdi ve onlara mükellef bir sofra hazırladı. Her birine bir bıçak verdi, beri taraftan da Yusuf'a \"çık karşılarına\" dedi. Görür görmez hepsi onu gözlerinde çok büyüttüler ve (şaşkınlıkla) ellerini kestiler. Dediler ki: \"Hâşâ! Allah için, bu bir insan değil, olsa olsa yüce bir melektir.\""
        cid: 0
  - verse: 32
    segments:
      - text: "\"İşte\" dedi, \"bu gördüğünüz, beni hakkında kınadığınız (gençtir). Yemin ederim ki, ben bunun nefsinden yararlanmak istedim de o, namuslu davrandı. Yine yemin ederim ki, emrimi yerine getirmezse, muhakkak zindana atılacak ve kesinlikle zelillerden olacaktır\"."
        cid: 0
  - verse: 33
    segments:
      - text: "Yusuf dedi ki: \"Ey Rabbim! Zindan bana, bunların beni davet ettikleri şeyden daha sevimlidir. Eğer sen, bu kadınların tuzaklarını benden uzak tutmazsan, ben onların tuzağına düşerim ve cahillik edenlerden olurum\"."
        cid: 0
  - verse: 34
    segments:
      - text: "Bunun üzerine Rabbi, onun duasını kabul buyurdu da ondan onların tuzaklarını bertaraf etti. Muhakkak ki O, evet O, hakkiyle işiten, hakkiyle bilendir."
        cid: 0
  - verse: 35
    segments:
      - text: "Bu kadar delili gördükleri halde, sonra yine de Yusuf'u bir süre için zindana atma düşüncesi ağır bastı."
        cid: 0
  - verse: 36
    segments:
      - text: "Zindana onunla birlikte iki delikanlı daha girdi. Birisi dedi ki: \"Rüyada kendimi şarap sıkarken gördüm\". Öteki de dedi ki: \"Ben de başımın üstünde ekmek taşıdığımı, kuşların da ondan yediğini gördüm. Bize bunun yorumunu haber ver. Çünkü biz seni iyilik edenlerden görüyoruz.\""
        cid: 0
  - verse: 37
    segments:
      - text: "Yusuf dedi ki: \"Size yiyecek olarak verilecek bir yemek gelmeden önce onun tabirini size bildiririm. Bu, Rabbimin bana öğrettiği ilimlerdendir. Çünkü ben Allah'a inanmayan ve ahireti inkâr eden bir kavmin dinini terkettim.\""
        cid: 0
  - verse: 38
    segments:
      - text: "\"Atalarım İbrahim, İshak ve Yakub'un dinine uydum. Bizim, Allah'a hiçbir şeyi ortak tutmamız olmaz. Bu, bize ve insanlara Allah'ın bir lutfudur. Fakat insanların çoğu şükretmezler.\""
        cid: 0
  - verse: 39
    segments:
      - text: "\"Ey benim zindan arkadaşlarım! Ayrı ayrı birçok tanrılar mı daha hayırlı, yoksa herşeye hakim ve galip olan bir tek Allah mı?\""
        cid: 0
  - verse: 40
    segments:
      - text: "\"Sizin Allah'ı bırakıp da o taptıklarınız, sizin ve atalarınızın uydurduğu birtakım isimlerden başka bir şey değildir. Bunlara tapmanız için Allah hiçbir delil indirmiş değildir. Hüküm ancak Allah'a aittir: O, size, kendisinden başkasına tapmamanızı emretti. İşte dosdoğru din budur. Fakat insanların çoğu bunu bilmezler.\""
        cid: 0
  - verse: 41
    segments:
      - text: "\"Ey benim zindan arkadaşlarım! Biriniz efendisine yine şarap sunacak. Diğeri de asılacak, kuşlar başından yiyecekler. İşte öğrenmek istediğiniz iş böylece halloldu.\""
        cid: 0
  - verse: 42
    segments:
      - text: "Yusuf, hapisten kurtulacağına inandığı o ikiden birine dedi ki: \"Beni efendinin yanında an\". (Benden söz et ki, beni kurtarsın). Fakat Şeytan, ona, efendisinin yanında anmayı unutturdu. Bu yüzden Yusuf, daha yıllarca zindanda kaldı."
        cid: 0
  - verse: 43
    segments:
      - text: "Bir gün melik (hükümdar) dedi ki: \"Ben rüyamda yedi cılız ineğin yedi semiz ineği yediğini ve yedi yeşil başakla yedi kuru başak görüyorum. Ey ileri gelenler! Siz rüya tabir edebiliyorsanız benim bu rüyamın tabirini bana bildirin.\""
        cid: 0
  - verse: 44
    segments:
      - text: "Dediler ki: \"Rüya dediğin şey karmakarışık hayallerdir. Biz ise böyle karışık hayallerin yorumunu bilemeyiz.\""
        cid: 0
  - verse: 45
    segments:
      - text: "O ikiden kurtulmuş olanı nice zamandan sonra hatırladı da dedi ki: \"Ben size o rüyanın tabirini haber veririm, hemen beni gönderin.\""
        cid: 0
  - verse: 46
    segments:
      - text: "\"Ey Yusuf, ey doğru sözlü! Bize şunu hallet: Yedi semiz ineği, yedi cılız inek yiyor. Ve yedi yeşil başakla diğer yedi kuru başak. Umarım ki, o insanlara doğru cevap ile dönerim, onlar da (senin kadrini) bilirler.\""
        cid: 0
  - verse: 47
    segments:
      - text: "Dedi ki: \"Yedi sene eskisi gibi ekeceksiniz, biçtiklerinizi başağında bırakınız, biraz yiyeceğinizden başka. \""
        cid: 0
  - verse: 48
    segments:
      - text: "\"Sonra onun arkasından yedi kurak sene gelecek, önceki biriktirdiklerinizin biraz saklayacağınızdan başkasını yiyip bitirecek.\""
        cid: 0
  - verse: 49
    segments:
      - text: "\"Sonra da onun arkasından yağışlı bir sene gelecek ki, halk onda sıkıntıdan kurtulacak, (üzüm, zeytin gibi mahsülleri) sıkıp faydalanacak.\""
        cid: 0
  - verse: 50
    segments:
      - text: "O hükümdar \"Onu bana getirin\" dedi. Emir üzerine Yusuf'a gönderilen adam yanına gelince, Yusuf ona dedi ki: \"Haydi efendine geri dön de, ona sor bakalım, o ellerini kesen kadınların maksatları ne imiş? Hiç şüphe yok ki, Rabbim, onların oyunlarını çokiyi bilir.\""
        cid: 0
  - verse: 51
    segments:
      - text: "Hükümdar, o kadınlara \"Derdiniz neydi ki, o vakit Yusuf'un nefsinden murad almaya kalktınız?\" dedi. Onlar \"Hâşâ, Allah için, biz onun aleyhinde hiçbir fenalık bilmiyoruz\" dediler. Aziz'in, karısı da: \"Şimdi hak ve hakikat olduğu gibi ortaya çıktı. Aslında onun nefsinden ben murad almak istedim. O ise şeksiz şüphesiz doğrulardandır\" dedi."
        cid: 0
  - verse: 52
    segments:
      - text: "(Yusuf dedi ki): İşte bu şunun içindir: Bilsin ki, ben ona arkasından hainlik etmedim. Gerçekten Allah hainlerin hilesini başarıya ulaştırmaz."
        cid: 0
  - verse: 53
    segments:
      - text: "Ben yine de nefsimi temize çıkarmıyorum. Çünkü nefis şiddetle kötülüğü emreder. Ancak Rabbimin rahmetiyle yarlığadığı müstesna. Muhakkak ki, Rabbim bağışlayıcı ve merhametlidir."
        cid: 0
  - verse: 54
    segments:
      - text: "Hükümdar dedi ki: \"Onu bana getirin, kendime tahsis edeyim.\" Sonra onunla konuşunca da: \"Sen bugün yanımızda gerçekten büyük bir mevki sahibisin, güvenilir birisin\" dedi."
        cid: 0
  - verse: 55
    segments:
      - text: "O da, ona dedi ki: \"Beni bu ülkenin hazineleri üzerine getir. Çünkü iyi korurum, iyi bilirim.\""
        cid: 0
  - verse: 56
    segments:
      - text: "Ve işte biz böylece Yusuf'u o yerde temkin ettik (yerleştirdik). Neresinde isterse orada makam tutuyordu. Biz rahmetimizi dilediğimize nasip ederiz. Ve iyilik edenlerin mükafatını zayi etmeyiz."
        cid: 0
  - verse: 57
    segments:
