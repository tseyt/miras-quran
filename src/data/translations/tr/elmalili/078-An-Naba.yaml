surah_id: 78
language: tr
author: elmalili
verses:
  - verse: 1
    segments:
      - text: >-
          Birbirlerine neyi soruyorlar?
        cid: 0
  - verse: 2
    segments:
      - text: >-
          O büyük haberden (kıyametten) mi?
        cid: 0
  - verse: 3
    segments:
      - text: >-
          Ki onlar onda ayrılığa düşmektedirler.
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Hayır, ilerde bilecekler.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Hayır hayır, ilerde bilecekler.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Biz yeryüzünü bir beşik yapmadık mı?
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Dağları da birer kazık kılmadık mı?
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Sizleri çift çift yarattık.
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Uykunuzu bir dinlenme yaptık.
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Geceyi bir örtü yaptık.
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Gündüzü de bir geçim zamanı yaptık.
        cid: 0
  - verse: 12
    segments:
      - text: >-
          Üstünüze yedi sağlam bina (gök) çattık.
        cid: 0
  - verse: 13
    segments:
      - text: >-
          İçlerine ışık saçan bir kandil astık.
        cid: 0
  - verse: 14
    segments:
      - text: >-
          Yoğunlaşmış bulutlardan şarıl şarıl bir su indirdik.
        cid: 0
  - verse: 15
    segments:
      - text: >-
          Onunla taneler ve otlar çıkaralım diye.
        cid: 0
  - verse: 16
    segments:
      - text: >-
          Ve sarmaş dolaş bağlar bahçeler (çıkaralım diye).
        cid: 0
  - verse: 17
    segments:
      - text: >-
          Kuşkusuz o hüküm günü kararlaştırılmış bir vakit olmuştur.
        cid: 0
  - verse: 18
    segments:
      - text: >-
          O gün Sûr'a üflenir, bölük bölük gelirsiniz.
        cid: 0
  - verse: 19
    segments:
      - text: >-
          Gök de açılmış, kapı kapı olmuştur.
        cid: 0
  - verse: 20
    segments:
      - text: >-
          Dağlar yürütülmüş, serap olmuştur.
        cid: 0
  - verse: 21
    segments:
      - text: >-
          Kuşkusuz Cehennem gözetleme yeri olmuştur.
        cid: 0
  - verse: 22
    segments:
      - text: >-
          Azgınlar için son varılacak yer olmuştur.
        cid: 0
  - verse: 23
    segments:
      - text: >-
          Orada çağlarca kalacaklardır.
        cid: 0
  - verse: 24
    segments:
      - text: >-
          Orada ne bir serinlik tadacaklar, ne de içecek bir şey.
        cid: 0
  - verse: 25
    segments:
      - text: >-
          Ancak bir kaynar su ve irin (içecekler).
        cid: 0
  - verse: 26
    segments:
      - text: >-
          Bir ceza ki tam yaptıklarına uygun.
        cid: 0
  - verse: 27
    segments:
      - text: >-
          Çünkü onlar hiçbir hesap ummazlardı.
        cid: 0
  - verse: 28
    segments:
      - text: >-
          Âyetlerimizi yalanlaya yalanlaya tam bir yalancı olmuşlardı.
        cid: 0
  - verse: 29
    segments:
      - text: >-
          Biz ise herşeyi sayıp bir kitaba geçirmişiz.
        cid: 0
  - verse: 30
    segments:
      - text: >-
          (Onlara): "Şimdi tadın (cezanızı). Artık size azabınızı artırmaktan başka bir
          şey yapmayacağız" (denir).
        cid: 0
  - verse: 31
    segments:
      - text: >-
          Kuşkusuz takva sahipleri için bir kurtuluş var.
        cid: 0
  - verse: 32
    segments:
      - text: >-
          Bahçeler var, bağlar var.
        cid: 0
  - verse: 33
    segments:
      - text: >-
          Memeleri tomurcuklanmış yaşıt kızlar var.
        cid: 0
  - verse: 34
    segments:
      - text: >-
          Dopdolu kadehler var.
        cid: 0
  - verse: 35
    segments:
      - text: >-
          Orada ne boş bir söz işitirler, ne de bir yalan.
        cid: 0
  - verse: 36
    segments:
      - text: >-
          (Bunlar) Rabbinden yeterli bir bağış olarak (verilir).
        cid: 0
  - verse: 37
    segments:
      - text: >-
          O, göklerin, yerin ve bu ikisi arasındakilerin Rabbidir. Rahmân'dır. Hiç kimse
          ondan bir hitaba mâlik olamaz.
        cid: 0
  - verse: 38
    segments:
      - text: >-
          O gün Ruh ve melekler sıra sıra dururlar. Rahmân'ın izin verdikleri dışında hiç
          kimse konuşamaz. İzin verilen de doğruyu söyler.
        cid: 0
  - verse: 39
    segments:
      - text: >-
          İşte bu hak gündür. Artık dileyen Rabbine bir yol tutar.
        cid: 0
  - verse: 40
    segments:
      - text: >-
          Biz sizi yakın bir azap ile uyardık. O gün kişi ellerinin ne takdim ettiğine
          bakacak ve kâfir diyecek ki: "Ah ne olaydı, ben bir toprak olaydım."
        cid: 0