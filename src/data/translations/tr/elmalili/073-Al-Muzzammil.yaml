surah_id: 73
language: tr
author: elmalili
verses:
  - verse: 1
    segments:
      - text: >-
          Ey örtünen! (Peygamber)
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Gecenin birazı hariç olmak üzere geceleyin kalk (namaz kıl).
        cid: 0
  - verse: 3
    segments:
      - text: >-
          Gecenin yarısında kalk, yahut yarısından biraz eksilt.
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Veya bunu artır ve ağır ağır Kur'ân oku.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Doğrusu biz, senin üzerine ağır bir söz bırakacağız (Kur'an vahyedeceğiz).
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Çünkü gece kalkışı hem daha etkili, hem de söz bakımından daha sağlamdır.
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Çünkü gündüz senin için uzun bir meşguliyet vardır.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Rabbinin adını an ve bütün gönlünle ona yönel.
        cid: 0
  - verse: 9
    segments:
      - text: >-
          O, doğunun ve batının Rabbidir. Ondan başka tanrı yoktur. O halde yalnız O'nu
          vekil tut.
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Başkalarının diyeceklerine sabret, güzellikle onlardan ayrıl.
        cid: 0
  - verse: 11
    segments:
      - text: >-
          O yalanlayıcı zevk ve refah sahiplerini bana bırak, onlara biraz mühlet ver.
        cid: 0
  - verse: 12
    segments:
      - text: >-
          Zira bizim yanımızda bukağılar var, bir cehennem var.
        cid: 0
  - verse: 13
    segments:
      - text: >-
          Boğaza duran bir yiyecek, elem verici bir azap var.
        cid: 0
  - verse: 14
    segments:
      - text: >-
          O gün yer ve dağlar sarsılacak, dağlar erimiş bir kum yığınına dönecek.
        cid: 0
  - verse: 15
    segments:
      - text: >-
          Doğrusu biz size tanıklık edecek bir elçi gönderdik. Nitekim Firavun'a da bir
          elçi göndermiştik.
        cid: 0
  - verse: 16
    segments:
      - text: >-
          Firavun o elçiye isyan etmişti. Biz de onu ağır bir yakalayışla yakaladık.
        cid: 0
  - verse: 17
    segments:
      - text: >-
          Peki inkâr ederseniz, çocukları ihtiyarlatacak o günden (kıyamet gününden)
          kendinizi nasıl kurtaracaksınız?
        cid: 0
  - verse: 18
    segments:
      - text: >-
          O günün dehşetinden gök yarılır. Allah'ın sözü kesinlikle gerçekleşmiştir.
        cid: 0
  - verse: 19
    segments:
      - text: >-
          İşte bu bir öğüttür. Artık dileyen Rabbine bir yol tutar.
        cid: 0
  - verse: 20
    segments:
      - text: >-
          Rabbin, senin gecenin üçte ikisinden daha azında, yarısında ve üçte birinde
          kalktığını, seninle beraber bulunanlardan bir topluluğun da böyle yaptığını
          biliyor. Gece ve gündüzü Allah takdir eder. O, sizin onu sayamayacağınızı bildi
          de sizi affetti. Bundan böyle Kur'ân'dan size ne kolay gelirse okuyun. Allah,
          içinizden hastalar, yeryüzünde gezip Allah'ın lütfunu arayan başka kimseler ve
          Allah yolunda savaşan daha başka insanlar olacağını bilmiştir. Onun için
          Kur'ân'dan kolayınıza geldiği kadar okuyun, namazı kılın, zekatı verin ve
          Allah'a güzel bir borç verin (Hayırlı işlere mal sarfedin). Kendiniz için
          gönderdiğiniz her iyiliği, Allah katında daha hayırlı ve sevapça daha büyük
          olarak bulacaksınız. Allah'tan bağış dileyin. Kuşkusuz Allah bağışlayandır,
          merhamet edendir.
        cid: 0