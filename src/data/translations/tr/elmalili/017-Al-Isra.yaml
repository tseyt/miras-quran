        cid: 0
  - verse: 37
    segments:
      - text: >-
          Yeryüzünde kibir ve azametle yürüme! Çünkü sen asla yeri yaramazsın ve boyca da
          dağlara erişemezsin.
        cid: 0
  - verse: 38
    segments:
      - text: >-
