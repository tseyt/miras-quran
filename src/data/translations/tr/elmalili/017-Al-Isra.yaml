        cid: 0
  - verse: 32
    segments:
      - text: >-
          Zinaya da yaklaşmayın, çünkü o pek çirkindir ve kötü bir yoldur.
        cid: 0
  - verse: 33
    segments:
      - text: >-
          Haklı bir sebep olmadıkça, Allah'ın öldürülmesini haram kıldığı canı
