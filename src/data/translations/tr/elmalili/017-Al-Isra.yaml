    segments:
      - text: >-
          Güneşin batıya kaymasından, gecenin karanlığına kadar (belirli vakitlerde)
          gereği üzere namazı kıl, bir de sabah namazını kıl. Çünkü sabah namazında, gece
          ve gündüz melekleri hazır bulunur.
        cid: 0
  - verse: 79
    segments:
      - text: >-
          Gecenin bir kısmında da sadece sana mahsus bir nafile olmak üzere uykudan kalk,
          Kur'ân ile teheccüd namazı kıl, Rabbinin seni bir makamı mahmuda (şefaat
          makamına) göndermesi kesindir.
        cid: 0
  - verse: 80
    segments:
      - text: >-
          (Ey Muhammed!) De ki: "Rabbim! Beni, takdir ettiğin yere gönül rahatlığı ve
          huzur içinde koy ve çıkacağım yerden de dürüstlükle ve selametle çıkmamı sağla.
          Bana katından yardım edici bir kuvvet ver."
        cid: 0
  - verse: 81
    segments:
      - text: >-
          (Ey Muhammed!) De ki: "Hak geldi, batıl yok oldu. Elbette batıl yok olmaya
          mahkumdur."
        cid: 0
  - verse: 82
    segments:
      - text: >-
          Biz Kur'ân'dan, iman edenler için bir şifa ve rahmet kaynağı olan âyetler
          indiriyoruz. Zalimlerin de ancak zararını artırır.
        cid: 0
  - verse: 83
    segments:
      - text: >-
          Biz insana nimet verdiğimiz zaman, Allah'ı anmaktan yüz çevirip uzaklaşır. Ona
          fenalık dokununca da ümitsizliğe kapılır.
        cid: 0
  - verse: 84
    segments:
      - text: >-
          De ki: "Herkes bulunduğu hal ve niyetine göre iş yapar. Bu durumda kimin en
          doğru yolda olduğunu Rabbiniz daha iyi bilir."
        cid: 0
  - verse: 85
    segments:
      - text: >-
          Ey Muhammed! Sana ruhtan soruyorlar. De ki: "Ruh Rabbimin bildiği bir iştir ve
          size ilimden ancak az bir şey verilmiştir."
        cid: 0
  - verse: 86
    segments:
      - text: >-
          Yemin olsun ki, dilersek sana vahyettiğimizi ortadan kaldırırız; sonra bize
          karşı kendine bir vekil (koruyucu) bulamazsın.
        cid: 0
  - verse: 87
    segments:
      - text: >-
          Fakat Rabbinden bir rahmet olarak (biz bunu yapmadık). Gerçekten O'nun senin
          üzerindeki lütfu çok büyüktür.
        cid: 0
  - verse: 88
    segments:
      - text: >-
          Ey Muhammed! De ki: "Yemin olsun, eğer insanlar ve cinler bu Kur'ân'ın
          benzerini getirmek üzere toplansalar ve birbirlerine yardımcı olsalar bile, yine
          onun bir benzerini meydana getiremeyeceklerdir."
        cid: 0
  - verse: 89
    segments:
      - text: >-
          Yemin olsun ki biz bu Kur'ân'da insanlar için çeşitli misaller vermişizdir.
          Yine de insanların çoğu inkârlarında ısrar ederler.
        cid: 0
  - verse: 90
    segments:
      - text: >-
          Kâfirler şöyle dediler: "Sen, bizim için yerden suyu kesilmeyen bir kaynak
          fışkırtmadıkça sana asla inanmayacağız."
        cid: 0
  - verse: 91
    segments:
      - text: >-
          "Veyahut hurmalıklardan ve üzümlüklerden senin bir bahçen olsun da ortasından
          şarıl şarıl ırmaklar akıtmalısın."
        cid: 0
  - verse: 92
    segments:
      - text: >-
          "Yahut söyleyip zannettiğin gibi, göğü başımıza parça parça düşüresin veya
          Allah'ı ve melekleri söylediğine şahit getiresin. "
        cid: 0
  - verse: 93
    segments:
      - text: >-
          "Yahut altından bir evin olsun, ya da göğe çıkmalısın. Ona çıktığına da asla
          inanmayız. Ta ki bize, okuyacağımız bir kitap indiresin." De ki: "Rabbimi tenzih
          ederim. Nihayet ben de, peygamber olan bir insandan başka bir şey değilim."
        cid: 0
  - verse: 94
    segments:
      - text: >-
          Kendilerine doğru yolu gösteren peygamber gelince, insanların iman etmelerine
          engel olan sebep sadece: "Allah bir insanı mı Peygamber gönderdi?" demeleridir.
        cid: 0
  - verse: 95
    segments:
      - text: >-
          (Ey Muhammed! Mekkelilere) şöyle de: "Eğer yeryüzünde huzur içinde yürüyüp
          duran melekler olsaydı, elbette onlara gökten peygamber olarak bir melek
          indirirdik."
        cid: 0
  - verse: 96
    segments:
      - text: >-
          De ki: "Benimle sizin aranızda şahit olarak Allah yeter. Çünkü O, kullarının
          yaptığından haberdardır, yaptıklarını çok iyi görendir."
        cid: 0
  - verse: 97
    segments:
      - text: >-
          Allah kime hidayet verirse, o doğru yoldadır. Kimi de hidayetten uzak tutarsa,
          artık bunlar için Allah'tan başka hiçbir yardımcı bulamazsın. Ve biz, o
          kâfirleri kıyamet günü kör, dilsiz ve sağır oldukları halde, yüzleri üstü
          sürünerek haşredeceğiz. Varacakları yer cehennemdir; ateşi dindikçe onun ateşini
          artırırız.
        cid: 0
  - verse: 98
    segments:
      - text: >-
          Bu onların cezasıdır! Çünkü onlar, âyetlerimizi inkâr etmişler ve: "Sahi
          bizler, bir yığın kemik ve ufalanmış toz olduğumuz zaman mı, yeni bir
          yaratılışla diriltilmiş olacağız?" demişlerdir.
        cid: 0
  - verse: 99
    segments:
      - text: >-
          Onlar, gökleri ve yeri yaratan Allah'ın, kendilerinin aynı olan insanları
          yaratmaya da kadir olduğunu görüp bilmediler mi? Allah onlar için şüphe
          edilmeyen bir vâde takdir etmiştir. Fakat zalimler, inkârlarında yine de ısrar
          ederler.
        cid: 0
  - verse: 100
    segments:
      - text: >-
          (Ey Muhammed!) De ki: "Eğer siz Rabbimin rahmet hazinelerine sahip olsaydınız,
          fakirlik korkusunu yine de elden bırakmazdınız." Doğrusu insan çok cimridir.
        cid: 0
  - verse: 101
    segments:
      - text: >-
          Andolsun biz Musa'ya apaçık dokuz mucize verdik. (Ey Peygamber!)
          İsrailoğullarına sor, Musa kendilerine geldiğinde Firavun ona: "Ey Musa! Ben
          senin büyülenmiş olduğunu sanıyorum" demişti.
        cid: 0
  - verse: 102
    segments:
      - text: >-
          Musa dedi ki: "Ey Firavun! Pekâlâ bilirsin ki, bu mucizeleri, birer ibret olmak
