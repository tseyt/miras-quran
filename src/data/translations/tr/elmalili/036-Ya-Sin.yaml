surah_id: 36
language: tr
author: elmalili
verses:
  - verse: 1
    segments:
      - text: >-
          Yâsîn.
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Ey Muhammed! Hikmetli Kur'ân'a andolsun ki, sen risâlet görevi ile gönderilen
          peygamberlerdensin.
        cid: 0
  - verse: 3
    segments:
      - text: >-
          Ey Muhammed! Hikmetli Kur'ân'a andolsun ki, sen risâlet görevi ile gönderilen
          peygamberlerdensin.
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Dosdoğru bir yol üzerindesin.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Babaları korkutulmamış ve kendileri de gafil olan bir kavmi, çok güçlü ve çok
          merhametli olan Allah'ın indirdiği (Kur'ân) ile korkutasın.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Babaları korkutulmamış ve kendileri de gafil olan bir kavmi, çok güçlü ve çok
          merhametli olan Allah'ın indirdiği (Kur'ân) ile korkutasın.
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Andolsun ki onların çoğunun üzerine azab sözü hak olmuştur. Onlar imana
          gelmezler.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Çünkü biz onların boyunlarına kelepçeler geçirmişiz. O kelepçeler çenelerine
          dayanmıştır da burunları yukarı, gözleri aşağı somurtmaktadırlar.
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Hem önlerinden bir sed, arkalarından bir sed çekmişiz, kendilerini sarmışızdır.
          Baksalar da görmezler.
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Onları korkutsan da korkutmasan da onlara göre birdir, inanmazlar.
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Sen ancak Kur'ân'a tabi olan ve görünmediği halde Rahman olan Allah'tan korkan
          kimseyi sakındırırsın. İşte onu bir bağışlanma ve çok şerefli bir mükafatla
          müjdele.
        cid: 0
  - verse: 12
    segments:
      - text: >-
          Gerçekten biz ölüleri diriltiriz, onların önceden yapıp gönderdiklerini ve
          bıraktıkları eserlerini yazarız. Zaten biz her şeyi açık bir kütükte, bir "imamı
          mübin"de (ana kitapta, yani Levhi mahfuzda) sayıp tesbit etmişizdir.
        cid: 0
  - verse: 13
    segments:
      - text: >-
          Sen onlara, o şehir halkını örnek ver. Hani oraya peygamberler gelmişti.
        cid: 0
  - verse: 14
    segments:
      - text: >-
          Hani biz onlara iki peygamber göndermiştik, fakat onlar ikisini de
          yalanlamışlardı. Biz de (onları) üçüncü bir peygamberle destekledik. Onlara:
          "Şüphesiz ki biz size gönderilmiş elçileriz." dediler.
        cid: 0
  - verse: 15
    segments:
      - text: >-
          Onlar da: "Siz bizim gibi insandan başka birşey değilsiniz, hem Rahman olan
          Allah, hiçbir şey indirmedi. Siz sadece yalan söylüyorsunuz." dediler.
        cid: 0
  - verse: 16
    segments:
      - text: >-
          Peygamberler dediler ki: "Rabbimiz biliyor ki biz gerçekten size gönderilmiş
          elçileriz."
        cid: 0
  - verse: 17
    segments:
      - text: >-
          "Bize düşen de sadece apaçık tebliğdir."
        cid: 0
  - verse: 18
    segments:
      - text: >-
          Onlar dediler ki: "Herhalde biz sizin yüzünüzden uğursuzluğa uğradık. Eğer bu
          işten vazgeçmezseniz, andolsun ki, sizi hiç tınmadan taşlarız ve mutlaka bizden
          size pek acıklı bir azab dokunur."
        cid: 0
  - verse: 19
    segments:
      - text: >-
          Peygamberler de şöyle cevap verdiler: "Sizin uğursuzluğunuz beraberinizdedir.
          Size öğüt verildi diye mi (uğursuzluğa uğradınız)? Doğrusu siz israfı âdet etmiş
          bir kavimsiniz."
        cid: 0
  - verse: 20
    segments:
      - text: >-
          O sırada şehrin ta ucundan bir adam koşarak geldi ve: "Ey kavmim! Uyun o
          elçilere!"
        cid: 0
  - verse: 21
    segments:
      - text: >-
          "Uyun sizden hiçbir ücret istemeyen o zatlara ki, onlar hidayete ermişlerdir."
        cid: 0
  - verse: 22
    segments:
      - text: >-
          "Bana ne oluyor da kulluk etmeyecekmişim beni yaratana? Hep döndürülüp O'na
          götürüleceksiniz."
        cid: 0
  - verse: 23
    segments:
      - text: >-
          "Hiç ben O'ndan başka ilâhlar edinir miyim? Eğer O Rahman, bana bir zarar
          dileyecek olsa, onların şefaati benden yana hiçbir şeye yaramaz ve onlar beni
          kurtaramazlar."
        cid: 0
  - verse: 24
    segments:
      - text: >-
          "Şüphesiz ki ben, o zaman apaçık bir sapıklık içinde olurum."
        cid: 0
  - verse: 25
    segments:
      - text: >-
          "Şüphesiz ki ben, Rabbinize iman getirdim, gelin dinleyin beni."
        cid: 0
  - verse: 26
    segments:
      - text: >-
          (Sonra ona) "haydi gir cennete!" denildi. O da dedi ki: "Ne olurdu kavmim
          bilseydi!"
        cid: 0
  - verse: 27
    segments:
      - text: >-
          "Rabbimin beni bağışladığını ve beni kendilerine ikram edilen kullarından
          kıldığını."
        cid: 0
  - verse: 28
    segments:
      - text: >-
          Biz arkasından kavminin üzerine bir ordu indirmedik, indirecek de değildik.
        cid: 0
  - verse: 29
    segments:
      - text: >-
          Sadece bir gürültü oldu, onlar da hemen sönüverdiler.
        cid: 0
  - verse: 30
    segments:
      - text: >-
          Yazıklar olsun o kullara ki, kendilerine glen her bir peygamberle mutlaka alay
          ediyorlardı.
        cid: 0
  - verse: 31
    segments:
      - text: >-
          Görmediler mi ki, kendilerinden önce nice kuşakları helak etmişiz. Onlar artık
          kendilerine dönüp gelmiyorlar.
        cid: 0
  - verse: 32
    segments:
      - text: >-
          Onların hepsi toplanıp, sadece bizim huzurumuza getirilmişlerdir.
        cid: 0
  - verse: 33
    segments:
      - text: >-
          Hem bir delildir onlara ölü toprak. Biz ona hayat verdik ve ondan taneler
          çıkardık da ondan yiyip duruyorlar.
        cid: 0
  - verse: 34
    segments:
      - text: >-
          Biz orada hurmalıklardan, üzüm bağlarından bahçeler yaptık. İçlerinde
          pınarlardan sular fışkırttık.
        cid: 0
  - verse: 35
    segments:
      - text: >-
          (Bunu), Onun ürününden ve kendi elleriyle yaptıklarından yesinler diye
          (yaptık). Hâlâ şükretmeyecekler mi?
        cid: 0
  - verse: 36
    segments:
      - text: >-
          Yerin bitkilerinden, kendi nefislerinden ve daha bilemeyecekleri şeylerden
          bütün çiftleri yaratan Allah'ın şanı ne yücedir.
        cid: 0
  - verse: 37
    segments:
      - text: >-
          Gece de onlara bir delildir. Biz ondan gündüzü soyar çıkarırız, bir de bakarlar
          ki karanlığa dalmışlar.
        cid: 0
  - verse: 38
    segments:
      - text: >-
          Güneş de bir delildir ki kendi yolunda akıp gidiyor. İşte bu çok güçlü ve her
          şeyi bilen Allah'ın takdiridir.
        cid: 0
  - verse: 39
    segments:
      - text: >-
          Ay'a gelince, ona menziller tayin ettik. Nihayet o eski hurma salkımının çöpü
          gibi (yay haline) dönmüştür.
        cid: 0
  - verse: 40
    segments:
      - text: >-
          Ne güneşin aya çatması yaraşır, ne de gece gündüzü geçebilir; onların her biri
          kendi yörüngesinde yüzerler.
        cid: 0
  - verse: 41
    segments:
      - text: >-
          Onlar için bir delil de bizim, onların neslini dolu bir gemide taşımamızdır.
        cid: 0
  - verse: 42
    segments:
      - text: >-
          Yine kendileri için onun gibi binecek şeyler yaratmamızdır.
        cid: 0
  - verse: 43
    segments:
      - text: >-
          Eğer dilesek onları boğarız da o zaman ne onların feryadına yetişen bulunur, ne
          de onlar kurtarılır.
        cid: 0
  - verse: 44
    segments:
      - text: >-
          Ancak tarafımızdan bir rahmet ve bir zamana kadar yaşatmak başka.
        cid: 0
  - verse: 45
    segments:
      - text: >-
          Durum böyle iken onlara: "Önünüzdekinden ve arkanızdakinden korkun ki size
          rahmet edilsin" denildiği zaman,
        cid: 0
  - verse: 46
    segments:
      - text: >-
          Ve kendilerine Rablerinin âyetlerinden herhangi bir âyet geldiği zaman mutlaka
          ondan yüz çevirirler.
        cid: 0
  - verse: 47
    segments:
      - text: >-
          Onlara: "Allah'ın size rızık olarak verdiği şeylerden hayra harcayın" dendiği
          zaman, o kâfirler, müminler için: "Allah'ın dileyince doyurabileceği kimseyi biz
          mi doyuracağız? Siz apaçık bir sapıklık içinde değil de nesiniz?" dediler.
        cid: 0
  - verse: 48
    segments:
      - text: >-
          Yine onlar: "Eğer doğru söylüyorsanız bu (kıyamet) vaadi ne zaman?" diyorlar.
        cid: 0
  - verse: 49
    segments:
      - text: >-
          Onlar sadece bir tek çığlığa bakıyorlar, bir çığlık ki, onlar çekişip dururken
          kendilerini yakalayıverir.
        cid: 0
  - verse: 50
    segments:
      - text: >-
          O zaman bir vasiyette bile bulunamazlar. Ailelerine de dönemezler.
        cid: 0
  - verse: 51
    segments:
      - text: >-
          Sûr'a üfürülmüştür, bir de ne baksınlar kabirlerinden Rablerine doğru akın
          ediyorlar.
        cid: 0
  - verse: 52
    segments:
      - text: >-
          Onlar: "Eyvah başımıza gelenlere! Mezarımızdan bizi kim kaldırdı? O Rahmân'ın
          vaad buyurduğu işte bu imiş. Gönderilen peygamberler de doğru söylemişler"
          derler.
        cid: 0
  - verse: 53
    segments:
      - text: >-
          Başka değil, sadece bir tek çığlık olmuş, derhal hepsi toplanmış huzurumuza
          getirilmişlerdir.
        cid: 0
  - verse: 54
    segments:
      - text: >-
          Artık bugün hiç kimseye zerre kadar zulmedilmez. Ancak yaptıklarınızın cezasını
          çekeceksiniz.
        cid: 0
  - verse: 55
    segments:
      - text: >-
          Gerçekten cennetlik olanlar bugün bir meşguliyet içinde zevk etmektedirler.
        cid: 0
  - verse: 56
    segments:
      - text: >-
          Kendileri ve eşleri gölgelerde koltuklar üzerine kurulmuşlardır.
        cid: 0
  - verse: 57
    segments:
      - text: >-
          Onlara orada bir meyve vardır. İsteyecekleri her şey onlarındır.
        cid: 0
  - verse: 58
    segments:
      - text: >-
          (Onlara) Rahîm olan Rab'den "selâm" sözü vardır.
        cid: 0
  - verse: 59
    segments:
      - text: >-
          Ey günahkârlar! Bugün siz bir tarafa ayrılın.
        cid: 0
  - verse: 60
    segments:
      - text: >-
          "Ey Âdemoğulları! Şeytana tapmayın, o size apaçık bir düşmandır ve bana kulluk
          edin, doğru yol budur, diye size and vermedim mi?" (buyurulacak)
        cid: 0
  - verse: 61
    segments:
      - text: >-
          "Ey Âdemoğulları! Şeytana tapmayın, o size apaçık bir düşmandır ve bana kulluk
          edin, doğru yol budur, diye size and vermedim mi?" (buyurulacak)
        cid: 0
  - verse: 62
    segments:
      - text: >-
          Böyle iken o sizden birçok nesilleri yoldan çıkardı. Ya o zaman düşünmüyor
          muydunuz?
        cid: 0
  - verse: 63
    segments:
      - text: >-
          İşte bu size vaad edilen cehennemdir.
        cid: 0
  - verse: 64
    segments:
      - text: >-
          Bugün yaslanın ona bakalım inkâr ettiğiniz için.
        cid: 0
  - verse: 65
    segments:
      - text: >-
          Bugün biz onların ağızlarını mühürleriz de neler kazandıklarını bize elleri
          söyler, ayakları da şahitlik eder.
        cid: 0
  - verse: 66
    segments:
      - text: >-
          Hem dileseydik gözlerini üzerinden silme kör ediverirdik de yola dökülürlerdi.
          Fakat nereden görecekler?
        cid: 0
  - verse: 67
    segments:
      - text: >-
          Yine dileseydik oldukları yerde kılıklarını değiştirirdik de ne ileri
          gidebilirlerdi, ne de geri dönebilirlerdi.
        cid: 0
  - verse: 68
    segments:
      - text: >-
          Bununla beraber kimin ömrünü uzatıyorsak, yaratılışta onu (güç ve kuvvetini
          alarak) tersine çeviriyoruz. Hâlâ akıllanmayacaklar mı?
        cid: 0
  - verse: 69
    segments:
      - text: >-
          Biz ona şiir öğretmedik. Bu ona yaraşmaz da... O sadece bir öğüt ve apaçık bir
          Kur'ân'dır.
        cid: 0
  - verse: 70
    segments:
      - text: >-
          (Bu), diri olanları uyarmak ve kâfirlere de azab sözünün hak olması içindir.
        cid: 0
  - verse: 71
    segments:
      - text: >-
          Şunu da görmediler mi: Biz onlar için kudretimizin meydana getirdiklerinden
          birtakım hayvanlar yaratmışız da onlara sahip bulunuyorlar.
        cid: 0
  - verse: 72
    segments:
      - text: >-
          Onları, kendilerinin hizmetine vermişiz de, hem onlardan binekleri var, hem de
          onlardan yiyorlar.
        cid: 0
  - verse: 73
    segments:
      - text: >-
          Onlarda daha birçok menfaatleri ve türlü içecekleri de var. Hâlâ
          şükretmeyecekler mi?
        cid: 0
  - verse: 74
    segments:
      - text: >-
          Onlar, Allah'tan başka birtakım ilâhlar edindiler. Güya yardım olunacaklar.
        cid: 0
  - verse: 75
    segments:
      - text: >-
          Onların, onlara yardıma güçleri yetmez. Kendileri ise onlar için bazı
          askerlerdir.
        cid: 0
  - verse: 76
    segments:
      - text: >-
          O halde onların sözleri seni üzmesin. Biz onların içlerini de biliriz,
          dışlarını da.
        cid: 0
  - verse: 77
    segments:
      - text: >-
          İnsan, kendisini bir damla sudan yarattığımızı görmedi mi de, şimdi apaçık bir
          hasım kesildi?
        cid: 0
  - verse: 78
    segments:
      - text: >-
          Yaratılışını unutarak bize bir de mesel fırlattı: "Kim diriltecekmiş o çürümüş
          kemikleri?" dedi.
        cid: 0
  - verse: 79
    segments:
      - text: >-
          De ki: "Onları ilk defa yaratan diriltecek ve o her yaratmayı bilir."
        cid: 0
  - verse: 80
    segments:
      - text: >-
          Size o yeşil ağaçtan bir ateş yapan O'dur. Şimdi siz ondan tutuşturmaktasınız.
        cid: 0
  - verse: 81
    segments:
      - text: >-
          Gökleri ve yeri yaratan, onlar gibisini yaratmaya kâdir değil midir? Elbette
          kâdirdir. Çünkü o her şeyi yaratandır, her şeyi bilendir.
        cid: 0
  - verse: 82
    segments:
      - text: >-
          O'nun emri, bir şeyi dileyince ona sadece "Ol!" demektir. O da hemen oluverir.
        cid: 0
  - verse: 83
    segments:
      - text: >-
          O halde her şeyin mülkü ve tasarrufu (hükümranlığı) elinde bulunan Allah'ın
          şanı ne yücedir. Siz de yalnız O'na döndürüleceksiniz.
        cid: 0