          bir rehber ve rahmet olan kitap, Musa'nın kitabı yine onu destekliyor. Böyle
          olanlar Kur'ân'a inanırlar. Hangi hizipten olursa olsun kim onu inkâr ederse,
          ona vaad edilen yer ateştir. İşte bütün bunlardan dolayı sen de bu Kur'ân'dan
          şüphe içinde olma. Kesinlikle o haktır, Rabbindendir. Fakat insanların çoğu iman
          etmezler.
        cid: 0
  - verse: 18
    segments:
