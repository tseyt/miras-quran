surah_id: 11
language: tr
author: elmalili
verses:
  - verse: 1
    segments:
      - text: >-
          ElifLâmRâ. Bu öyle bir kitaptır ki, âyetleri muhkem kılınmış, sonra da
          herşeyden haberdar olan hikmet sahibi Allah tarafından âyetleri ayrıntılı olarak
          açıklanmıştır.
        cid: 0
  - verse: 2
    segments:
      - text: >-
          (Şöyle ki:) Allah'dan başkasına kulluk etmeyin. Ben size O'nun tarafından müjde
          vermek ve uyarmak için gönderilmiş gerçek bir peygamberim.
        cid: 0
  - verse: 3
    segments:
      - text: >-
          Ve Rabbinizin mağfiretini isteyin, sonra ona tevbe edin ki sizi, belli bir
          süreye kadar güzel güzel yaşatsın. Ve her fazilet sahibine layık olduğu ihsanı
          versin. Eğer yüz çevirirseniz, ben sizin için büyük bir günün azabından
          korkarım.
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Dönüşünüz yalnızca Allah'adır. O'nun da herşeye gücü yeter.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Dikkat edin! Görmüyor musunuz, onlar düşmanlıklarını gizlemek için göğüslerini
          çeviriyorlar. İyi bilin ki, onlar örtülerine bürünürlerken, neyi gizleyip, neyi
          açığa vurduklarını Allah biliyor. Muhakkak ki Allah, gönülde gizlenenleri de
          bilir.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Yeryüzünde rızkı Allah'a ait olmayan hiçbir canlı yoktur. O, onların karar
          kıldıkları yerleri de, emaneten durdukları yerleri de bilir. Onların hepsi
          apaçık bir kitaptadır.
        cid: 0
  - verse: 7
    segments:
      - text: >-
          O, öyle bir Allah'dır ki, hanginizin daha güzel amel işleyeceğini imtihan etmek
          için gökleri ve yeri altı günde yarattı. Arşı da su üstündeydi. Onlara "öldükten
          sonra tekrar dirileceksiniz" dersen, o kâfirler de kesinlikle sana: " Bu apaçık
          bir sihirden başka birşey değildir." diyecekler.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Ve eğer bunlardan bir kısmının göreceği azabı belli bir süreye kadar
          erteleyecek olursak, o zaman da "onu engelleyen nedir ki?" diyecekler. İyi bilin
          ki, o azap onlara geldiği gün kendilerinden geri çevrilecek değildir. Ve o alay
          ettikleri şey kendilerini kuşatmış olacaktır.
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Ve şayet insana tarafımızdan bir rahmet tattırır, sonra da onu kendisinden geri
          alırsak, şüphesiz o ümitsiz ve nankör bir kimse olur.
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Ve şayet ona dokunan bir sıkıntıdan sonra bir nimet tattırırsak, "Artık benden
          bütün kötülükler silinip gitti." der, mutlaka böbürlenir ve şımarır.
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Ancak (her iki halde de) sabır gösterip iyi ameller işleyenler müstesnadır.
          İşte onlara bir mağfiret ve büyük bir mükafat vardır.
        cid: 0
  - verse: 12
    segments:
      - text: >-
          (Ey Resulüm!) Şimdi belki sen, "Ona bir hazine indirilse, ya da beraberinde bir
          melek gezip dolaşsa ya!" diyorlar diye sana vahyolunan vahyin bir kısmını
          terkedecek olursun ve bundan dolayı da göğsün daralır. Sen yalnızca bir
          uyarıcısın. Allah ise her şeye vekildir.
        cid: 0
  - verse: 13
    segments:
      - text: >-
          Yoksa "onu kendi uydurdu" mu diyorlar? O halde sen de onlara de ki: "Haydi siz
          de onun gibi uydurulmuş on sûre getirin. Allah'dan başka çağırabileceğiniz kim
          varsa onları da yardıma çağırın. Eğer doğru söylüyorsanız" (bunu yaparsınız).
        cid: 0
  - verse: 14
    segments:
      - text: >-
          Yok eğer bunun üzerine size cevap vermedilerse, artık bilin ki, bu Kur'ân ancak
