          yaptıklarını hazır bulmuşlardır. Senin Rabbin hiç kimseye zulmetmez.
        cid: 0
  - verse: 50
    segments:
      - text: >-
          Yine o vakti hatırla ki biz, meleklere: "Âdem'e secde edin!" demiştik. İblis
