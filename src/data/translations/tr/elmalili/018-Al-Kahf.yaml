          Kâfir olanlar ise hakkı, batılla ortadan kaldırmak için mücadele ediyorlar.
          Onlar, âyetlerimizi ve korkutuldukları azabı da alaya almışlardır.
        cid: 0
  - verse: 57
    segments:
      - text: >-
          Rabbinin âyetleriyle nasihat edilip de onlardan yüz çeviren ve daha önce
          işlediği günahları unutandan daha zalim kim olabilir? Biz onların kalbleri
          üzerine (Kur'ân'ı) anlamalarına engel olan bir ağırlık, kulaklarına da sağırlık
          verdik. Ey Muhammed! Sen onları doğru yola çağırsan da onlar asla hidayete
          ermezler.
        cid: 0
  - verse: 58
    segments:
      - text: >-
          Bununla beraber rahmet sahibi olan Rabbin çok bağışlayıcıdır, tevbe eden
          kullarına rahmeti boldur. Eğer Allah, işledikleri günahlar yüzünden onları hemen
          cezalandıracak olsaydı, onlara hemen azab ederdi. Fakat onlara vaad edilen bir
          zaman vardır ki, o geldiğinde Allah'ın azabından bir kurtuluş yeri bulamazlar.
        cid: 0
  - verse: 59
    segments:
      - text: >-
          İşte zulmettikleri için helak ettiğimiz şehirler! Biz onların helâkleri için de
          belirli bir zaman tayin etmiştik.
        cid: 0
  - verse: 60
    segments:
      - text: >-
          Ey Muhammed! Bir vakit Musa genç adamına demişti ki: "İki denizin birleştiği
