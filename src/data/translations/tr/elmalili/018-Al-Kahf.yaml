        cid: 0
  - verse: 47
    segments:
      - text: >-
          O kıyamet gününü hatırla ki, dağları yürüteceğiz ve yeryüzünü çırılçıplak
          göreceksin. Bütün insanları, mahşerde toplayacağız hiçbir kimseyi
          bırakmayacağız.
        cid: 0
  - verse: 48
    segments:
      - text: >-
          Onlar, saf halinde Rabbine arz edilmişlerdir. Allah, onlara şöyle diyecektir:
