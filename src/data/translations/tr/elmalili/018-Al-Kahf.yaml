        cid: 0
  - verse: 52
    segments:
      - text: >-
          Ve o (kıyamet) günü Allah kâfirlere şöyle buyuracak: "Ortaklarım ve
          şefaatçılarınız diye zannettiğiniz putlarınızı çağırın." Müşrikler onları
