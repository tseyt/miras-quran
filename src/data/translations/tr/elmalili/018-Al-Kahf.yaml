        cid: 0
  - verse: 49
    segments:
      - text: >-
          O gün herkesin amel defteri ortaya konulmuştur. Ey Muhammed! Günahkârların,
          amel defterlerinden korkarak: "Eyvah bize! Bu nasıl deftermiş ki, büyük küçük
