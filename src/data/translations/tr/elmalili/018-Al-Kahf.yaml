        cid: 0
  - verse: 51
    segments:
      - text: >-
          Ben, onları (İblis ve soyunu) ne göklerin ve yerin yaratılışında, ne de
          kendilerinin yaratılışında şahit tutmadım ve hiçbir zaman doğru yoldan çıkanları
