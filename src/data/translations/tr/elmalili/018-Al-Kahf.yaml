surah_id: 18
language: tr
author: elmalili
verses:
  - verse: 1
    segments:
      - text: >-
          Hamd, o Allah'a mahsustur ki kulu (Muhammed'e) kitabı indirdi ve ona hiçbir
          eğrilik koymadı.
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Onu dosdoğru (bir kitap) olarak (indirdi) ki katından gelecek şiddetli azaba
          karşı (insanları) uyarsın ve yararlı işler yapan müminlere kendileri için güzel
          bir mükafat bulunduğunu müjdelesin.
        cid: 0
  - verse: 3
    segments:
      - text: >-
          Onlar orada sürekli kalacaklardır.
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Ve "Allah çocuk edindi" diyenleri de uyarsın.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Bu hususta ne kendilerinin, ne de atalarının hiçbir bilgisi yoktur.
          Ağızlarından çıkan söz ne büyük bir iftiradır. Onlar, yalandan başka bir şey
          söylemiyorlar.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          (Ey Muhammed!) Demek onlar, bu söze (kitaba) inanmazlarsa, onların peşinde
          üzüle üzüle kendini helak edeceksin!
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Biz yeryüzündeki şeyleri kendisine süs olsun diye yarattık ki, insanların
          hangisinin daha güzel amel edeceğini deneyelim.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Şüphesiz biz, yeryüzünde olanları kupkuru bir toprak yapacağız.
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Yoksa sen Ashabı Kehf'i ve Rakim'i (isimlerinin yazılı bulunduğu taş kitabeyi)
          şaşılacak âyetlerimizden mi sandın?
        cid: 0
  - verse: 10
    segments:
      - text: >-
          O gençler mağaraya sığınınca şöyle dediler: "Rabbimiz! Bize katından bir rahmet
          ver ve bizim için şu işimizden bir kurtuluş yolu hazırla."
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Bunun üzerine biz de kulaklarını tıkayarak mağarada onları yıllarca uyuttuk.
        cid: 0
  - verse: 12
    segments:
      - text: >-
          Sonra da iki gruptan hangisinin, onların mağarada kaldıkları süreyi daha iyi
          hesapladığını anlamak için, onları tekrar uyandırdık.
        cid: 0
  - verse: 13
    segments:
      - text: >-
          Biz sana onların kıssalarını gerçek olarak anlatacağız. Hakikaten onlar,
          Rablerine iman eden birkaç genç idi. Biz de onların hidayetlerini artırdık.
        cid: 0
  - verse: 14
    segments:
      - text: >-
          (Oranın hükümdarı karşısında) ayağa kalkarak dediler ki: "Bizim Rabbimiz,
          göklerin ve yerin Rabbidir. Biz, O'ndan başkasına ilâh deyip tapmayız, yoksa
          saçma sapan konuşmuş oluruz.
        cid: 0
  - verse: 15
    segments:
      - text: >-
          Şu bizim kavmimiz, Allah'tan başka ilâh edindiler. Onların ilâh olduğuna dair
          açık bir delil getirselerdi ya! Allah'a karşı yalan uydurandan daha zalim kim
          olabilir?
        cid: 0
  - verse: 16
    segments:
      - text: >-
          (İçlerinden biri şöyle demişti:) "Mademki siz, onlardan ve Allah'tan başka
          taptıkları putlardan ayrıldınız, o halde mağaraya sığının ki, Rabbiniz
          rahmetinden size genişlik versin ve işinizi rast getirip kolaylaştırsın."
        cid: 0
  - verse: 17
    segments:
      - text: >-
          Ey Muhammed! Baksaydın güneşin doğduğu zaman mağaranın sağ tarafına
          yöneldiğini, batarken de sol taraftan onları makaslayıp geçtiğini görürdün.
          Onlar, mağaranın geniş bir yerinde idiler. İşte bu Allah'ın mucizelerindendir.
          Allah kime hidayet ederse, işte o, hakka ulaşmıştır; kimi de hidayetten mahrum
          ederse, artık ona doğru yolu gösterecek bir dost bulamazsın.
        cid: 0
  - verse: 18
    segments:
      - text: >-
          Bir de onları mağarada görseydin uyanık sanırdın. Halbuki onlar uykudadırlar.
          Biz onları sağa sola çevirirdik. Köpekleri de girişte ön ayaklarını ileri doğru
          uzatmıştı. Eğer onları görseydin, arkana bakmadan kaçardın ve için korku ile
          dolardı.
        cid: 0
  - verse: 19
    segments:
      - text: >-
          Onları bir mucize olarak uyuttuğumuz gibi, birbirlerine sorsunlar diye
          kendilerini uyandırdık da içlerinden bir sözcü şöyle dedi: "Ne kadar durup
          kaldınız?" (Kimi) "Bir gün ya da günün bir parçası kadar kaldık" dediler. (Kimi
          de) şöyle dediler: "Ne kadar durduğunuzu, Rabbiniz daha iyi bilir. Şimdi siz
          birinizi, bu gümüş paranızla şehre gönderin de baksın, hangi yiyecek daha temiz
          ise, ondan size azık getirsin. Hem çok dikkatli davransın ve sizi kimseye
          sezdirmesin."
        cid: 0
  - verse: 20
    segments:
      - text: >-
          "Çünkü şehir halkı, sizi ellerine geçirirlerse muhakkak sizi taşlayarak
          öldürürler veya kendi dinlerine çevirirler ki, o zaman siz dünyada da ahirette
          de asla kurtuluşa eremezsiniz."
        cid: 0
  - verse: 21
    segments:
      - text: >-
          Böylece insanları onlardan haberdar kıldık ki, öldükten sonra dirilmenin hak
          olduğunu ve kıyamet gününden şüphe edilemeyeceğini bildirmek için, öylece şehir
          halkına buldurduk. Onları mağarada bulanlar, aralarında durumlarını
          tartışıyorlardı. Dedilerki: "Üstlerine bir bina (kilise) yapın. Bununla beraber
          Rableri, onları daha iyi bilir." Sözlerinde üstün gelen müminler: "Üzerlerine
          muhakkak bir mescid yapacağız." dediler.
        cid: 0
  - verse: 22
    segments:
      - text: >-
          Ashabı Kehf'in sayılarında ihtilaf edenlerden bazıları: Onlar, üç kişidir,
          dördüncüleri köpekleridir" diyecekler. Diğer bazıları da "Onlar, beş kişidir,
          altıncıları köpekleridir " diyecekler. Her ikisi de bilinmeyen hakkında tahmin
          yürütmektir. (kimileri de:) "Onlar, yedi kişidir; sekizincisi köpekleridir"
          derler. De ki: "Onların sayılarını Rabbim daha iyi bilir." Onları ancak pek azı
          bilir, Bu sebeple onlar hakkında bu bildirilenler dışında bir münakaşaya girişme
          ve bunlar hakkında hiç kimseye de bir şey sorma!
        cid: 0
  - verse: 23
    segments:
      - text: >-
          Hiçbir şey için, Allah'ın dilemesi dışında: "Ben yarın onu yapacağım deme"
        cid: 0
  - verse: 24
    segments:
      - text: >-
          Ancak Allah dilerse (yapacağım de). Ve unuttuğun vakit Allah'ı an ve "Umarım
          Rabbim beni, doğruya daha yakın olana eriştirir." de.
        cid: 0
  - verse: 25
    segments:
      - text: >-
          Onlar, mağaralarında üçyüz yıl kadar kaldılar ve dokuz yıl da buna ilave
          etmişlerdir.
        cid: 0
  - verse: 26
    segments:
      - text: >-
          De ki: "Onların ne kadar kaldıklarını Allah daha iyi bilir." Göklerin ve yerin
          gaybı O'na aittir. O ne güzel görendir! O ne mükemmel işitendir! Onların, O'ndan
          başka bir yardımcısı yoktur. O, kendi hükümranlığına kimseyi ortak etmez.
        cid: 0
  - verse: 27
    segments:
      - text: >-
          Rabbinin kitabından sana vahyolunanı oku! Onun sözlerini değiştirecek kimse
          yoktur. Ve O'ndan başka bir sığınılacak da bulamazsın.
        cid: 0
  - verse: 28
    segments:
      - text: >-
          Nefsince de, sabah akşam rızasını isteyerek Rablerine yalvaranlarla beraber
          candan sabret. Sen dünya hayatının süsünü isteyerek onlardan gözlerini ayırma.
          Kalbini, bizi anmaktan gafil kıldığımız, nefsinin kötü arzusuna uymuş ve işi hep
          aşırılık olan kimseye uyma.
        cid: 0
  - verse: 29
    segments:
      - text: >-
          Ve de ki: O hak Rabbimizdendir. Artık dileyen iman etsin, dileyen inkâr etsin.
          Çünkü biz zalimler için öyle bir ateş hazırlamışız ki, duvarları, çepeçevre
          onları içine alacaktır. Eğer feryad edip yardım isteseler, erimiş maden gibi
          yüzleri haşlayan bir su ile cevap verilir. O ne kötü bir içecek ve ne kötü bir
          dayanma yeri!
        cid: 0
  - verse: 30
    segments:
      - text: >-
          İman edip de güzel davranışlarda bulunanlar var ya, şüphe yok ki biz öyle güzel
          işler yapanların mükafatını zayi etmeyiz.
        cid: 0
  - verse: 31
    segments:
      - text: >-
          İşte onlara Adn cennetleri vardır; altlarından ırmaklar akar, orada altın
          bileziklerle süslenecekler, ince ve kalın ipekliden yeşil elbiseler giyerek
          koltuklar üzerine dayanıp kurulacaklar. O ne güzel karşılık ve ne güzel kalma
          yeri!
        cid: 0
  - verse: 32
    segments:
      - text: >-
          Onlara, şu iki adamı misal olarak anlat: Biz bunlardan birine her türlü üzümden
          iki bağ vermişiz, her ikisinin etrafını hurmalarla donatmışız, aralarında da bir
          ekinlik yapmışız.
        cid: 0
  - verse: 33
    segments:
      - text: >-
          İki bağın ikisi de yemişlerini vermiş, hiçbir şey noksan bırakmamış, ikisinin
          ortasından bir de nehir akıtmışız.
        cid: 0
  - verse: 34
    segments:
      - text: >-
          İki bağın sahibinin ayrıca başka geliri vardı. Bundan dolayı bu adam
          arkadaşıyla münakaşa ederken: "Ben malca senden daha zengin ve insan sayısı
          bakımından da senden daha güçlü ve üstünüm" dedi.
        cid: 0
  - verse: 35
    segments:
      - text: >-
          Adam, bu şekilde kendine zulmederek bağına girdi ve şöyle dedi: "Bunun hiç yok
