surah_id: 38
language: tr
author: elmalili
verses:
  - verse: 1
    segments:
      - text: >-
          Sâd. Bu zikirle dolu Kur'ân'a bak!
        cid: 0
  - verse: 2
    segments:
      - text: >-
          O inkâr edenler bir gurur ve ayrılık içindedirler.
        cid: 0
  - verse: 3
    segments:
      - text: >-
          Kendilerinden önce nicelerini helak ettik. Onlar çağrıştılar. Ama artık
          kurtuluş vakti değildi.
        cid: 0
  - verse: 4
    segments:
      - text: >-
          İçlerinden kendilerine uyarıcı bir peygamber geldiğine şaştılar da kâfirler:
          "Bu bir sihirbazdır, yalancıdır" dediler.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          "İlâhları, bir tek ilâh mı kılmış? Bu gerçekten şaşılacak bir şey, çok tuhaf!"
        cid: 0
  - verse: 6
    segments:
      - text: >-
          İçlerinden ileri gelenler fırladılar ve dediler ki: "İlâhlarınız üzerinde sabır
          ve sebat edin. Bu, gerçekten arzu edilen bir murad!"
        cid: 0
  - verse: 7
    segments:
      - text: >-
          "Biz bunu başka bir dinde işitmedik, bu mutlaka bir uydurmadır."
        cid: 0
  - verse: 8
    segments:
      - text: >-
          "Kur'ân aramızdan ona mı indirilmiş?" dediler. Doğrusu onlar benim Kur'ân'ımdan
          bir kuşku içindeler. Ve doğrusu onlar henüz azabımı tatmadılar.
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Yoksa sana o Kur'ân'ı veren çok güçlü ve ihsan sahibi Rabbinin hazineleri
          onların yanında mı?
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Yoksa bütün o göklerin, yerin ve aralarındakilerin mülkü onların mı? Öyle ise
          bütün imkanlarını seferber ederek yükselsinler de görelim!
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Onlar burada çeşitli partilerden (gruplardan) bozguna uğramış bir ordudur.
        cid: 0
  - verse: 12
    segments:
      - text: >-
          Onlardan önce Nuh kavmi, Âd kavmi ve saltanat sahibi Firavun da
          yalanlamışlardı.
        cid: 0
  - verse: 13
    segments:
      - text: >-
          Semûd kavmi, Lut kavmi ve Eykeliler (Şuayb kavmi) de yalanlamışlardı. İşte o
          çeşitli partiler bunlardır.
        cid: 0
  - verse: 14
    segments:
      - text: >-
          Hepsi de gönderilen peygamberleri yalanladılar da azabım böyle hak oldu.
        cid: 0
  - verse: 15
    segments:
      - text: >-
          Onlar da bir tek haykırışa bakıyorlar. Öyle ki onun gecikmesi de yoktur.
        cid: 0
  - verse: 16
    segments:
      - text: >-
          Bir de: "Ey Rabbimiz! Hesap gününden önce bizim azabdan payımızı acele ver"
          dediler.
        cid: 0
  - verse: 17
    segments:
      - text: >-
          Şimdi sen onların dediklerine sabret de kuvvetli kulumuz Davud'u hatırla. Çünkü
          o, zikir ve tesbih ile bize yönelmişti.
        cid: 0
  - verse: 18
    segments:
      - text: >-
          Biz, dağları onun emrine vermiştik. Akşamsabah onunla birlikte tesbih
          ederlerdi.
        cid: 0
  - verse: 19
    segments:
      - text: >-
          Kuşları da toplu olarak onun emrine vermiştik. Hepsi de ona uyarak zikir ve
          tesbih ederlerdi.
        cid: 0
  - verse: 20
    segments:
      - text: >-
          Biz onun mülkünü kuvvetlendirmiş ve kendisine hikmet ve hakkı batıldan ayırt
          etme kabiliyeti vermiştik.
        cid: 0
  - verse: 21
    segments:
      - text: >-
          Bir de davacıların kıssası geldi mi sana? Hani surdan aşarak mihraba
          ulaşmışlardı.
        cid: 0
  - verse: 22
    segments:
      - text: >-
          Davud'un yanına giriverdiler de onlardan telaşe düştü. Ona "Korkma!" dediler,
          biz iki davacıyız. Birimiz, birimize haksızlık etti. Şimdi sen aramızda hak ile
          hüküm ver ve aşırı gitme de bizi doğru yolun ortasına çıkar.
        cid: 0
  - verse: 23
    segments:
      - text: >-
          Biri: "İşte bu benim kardeşim. Onun doksan dokuz dişi koyunu var, benim ise bir
          tek dişi koyunum var. Böyle iken: Onu da bana ver, dedi ve tartışmada beni
          yendi" diye anlattı.
        cid: 0
  - verse: 24
    segments:
      - text: >-
          Davud dedi ki: "Doğrusu senin bir koyununu kendi koyunlarına katmak istemesiyle
          sana zulmetmiştir. Gerçekten bir cemiyette yaşayanların çoğu mutlaka
          birbirlerine haksızlık ediyorlar. Ancak iman edip de salih amel işleyenler
          başka. Ama onlar da pek az." Davud, bizim kendisini imtihan ettiğimizi sanmıştı.
          Hemen Rabbinden mağfiret diledi, rüku ederek yere kapandı, tevbe ile Allah'a
          yöneldi.
        cid: 0
  - verse: 25
    segments:
      - text: >-
          Biz de o zannettiği şeyi kendisine bağışladık. Şüphesiz yanımızda onun bir
          yakınlığı ve güzel bir dönüş yeri vardır.
        cid: 0
  - verse: 26
    segments:
      - text: >-
          Ey Davud! Gerçekten biz seni yeryüzünde bir halife yaptık. Artık insanlar
          arasında hak ile hüküm ver. Keyfe, arzuya uyma ki, seni Allah yolundan
          saptırmasın. Çünkü Allah yolundan sapanlar, hesap gününü unuttukları için
          kendilerine çok şiddetli bir azab vardır.
        cid: 0
  - verse: 27
    segments:
      - text: >-
          Hem o göğü, yeri ve aralarındakileri biz boşuna yaratmadık. O, kâfirlerin
          zannıdır. Onun için vay ateşe girecek olan kâfirlerin haline!
        cid: 0
  - verse: 28
    segments:
      - text: >-
          Yoksa, iman edip de salih amel işleyenleri biz, o yeryüzündeki bozguncular gibi
          yapar mıyız? Yoksa o takva sahiplerini azgın günahkarlar gibi yapar mıyız?
        cid: 0
  - verse: 29
    segments:
      - text: >-
          Bu, sana indirdiğimiz mübarek bir kitaptır ki, insanlar onun âyetlerini
          düşünsünler ve temiz akıl sahipleri ibret alsınlar.
        cid: 0
  - verse: 30
    segments:
      - text: >-
          Bir de Davud'a Süleyman'ı bahşettik. Süleyman ne güzel kuldu. Çünkü o seslice
          tesbih edip Allah'a yönelirdi.
        cid: 0
  - verse: 31
    segments:
      - text: >-
          Hani kendisine bir zaman akşam üstü iyi cins ve rahvan atlar gösterilmişti.
        cid: 0
  - verse: 32
    segments:
      - text: >-
          "Ben, dedi, at sevgisini, Rabbimi anmaktan ötürü tercih ettim." Nihayet atlar
          perdenin arkasına gizlendi.
        cid: 0
  - verse: 33
    segments:
      - text: >-
          "Geri getirin onları bana!" dedi ve artık onların bacaklarını, boyunlarını
          silmeye başladı.
        cid: 0
  - verse: 34
    segments:
      - text: >-
          Andolsun ki Süleyman'ı imtihan da ettik ve tahtının üzerine bir ceset bıraktık.
          Sonra tekrar tevbe ile önceki haline döndü.
        cid: 0
  - verse: 35
    segments:
      - text: >-
          Süleyman: "Ey Rabbim! Beni bağışla ve bana öyle bir mülk ihsan et ki, ardımdan
          hiç kimseye yaraşmasın. Şüphesiz, bütün dilekleri veren sensin." dedi.
        cid: 0
  - verse: 36
    segments:
      - text: >-
          Bunun üzerine biz rüzgarı onun emrine verdik. Onun emriyle istediği yere
          yumuşacık akardı.
        cid: 0
  - verse: 37
    segments:
      - text: >-
          Dalgıç ve yapı ustası şeytanları da.
        cid: 0
  - verse: 38
    segments:
      - text: >-
          Ve daha diğerlerini de zincirlerde bağlı olarak (Onun emrine verdik).
        cid: 0
  - verse: 39
    segments:
      - text: >-
          "İşte bu, bizim ihsanımızdır. Artık sen dilersen başkalarına ver veya verme.
          Bundan hesaba çekilmeyeceksin" dedik.
        cid: 0
  - verse: 40
    segments:
      - text: >-
          Şüphesiz ki ona huzurumuzda bir yakınlık ve güzel bir makam vardır.
        cid: 0
  - verse: 41
    segments:
      - text: >-
          Kulumuz Eyyub'u da an. Bir zaman o, Rabbine şöyle nida etmişti: "Meşakkat ve
          acı ile bana şeytan dokundu."
        cid: 0
  - verse: 42
    segments:
      - text: >-
          (Biz ona): "Ayağını yere vur! İşte sana yıkanılacak ve içilecek soğuk bir su"
          dedik.
        cid: 0
  - verse: 43
    segments:
      - text: >-
          Ve ona, bütün ailesini ve beraberlerinde bir mislini daha tarafımızdan bir
          rahmet olarak bahşettik ki, akıl sahipleri için bir ibret olsun.
        cid: 0
  - verse: 44
    segments:
      - text: >-
          (Bir de dedik ki): "Eline bir demet al da onunla (eşine) vur; yemininde
          durmamazlık etme." Doğrusu biz onu sabırlı bulduk. O ne güzel kul! O hakikaten
          daima Allah'a yönelmektedir.
        cid: 0
  - verse: 45
    segments:
      - text: >-
          Kullarımız İbrahim'i, İshak'ı ve Yakub'u da an. Onlar eller ve gözler sahipleri
          idiler.
        cid: 0
  - verse: 46
    segments:
      - text: >-
          Çünkü biz onları temiz bir hasletle, hâlis yurt (ahiret) düşüncesine ermiş has
          kullarımızdan kılmışızdır.
        cid: 0
  - verse: 47
    segments:
      - text: >-
          Çünkü onlar, nezdimizde seçilmiş en hayırlı kimselerdendir.
        cid: 0
  - verse: 48
    segments:
      - text: >-
          İsmail'i, Elyasa'yı, Zü'lKifl'i de an. Hepsi de en hayırlı kimselerdendir.
        cid: 0
  - verse: 49
    segments:
      - text: >-
          İşte bu bir öğüttür. Şüphesiz korunan müttakiler için herhalde güzel bir
          istikbal (güzel bir dönüş yeri) vardır.
        cid: 0
  - verse: 50
    segments:
      - text: >-
          Bütün kapıları kendilerine açılmış olan Adn cennetleri vardır.
        cid: 0
  - verse: 51
    segments:
      - text: >-
          İçlerine kurularak orada birçok yemişle, bambaşka bir içki isteyeceklerdir.
        cid: 0
  - verse: 52
    segments:
      - text: >-
          Yanlarında da bakışları yalnız kocalarına dönük hep aynı yaşta dilberler
          vardır.
        cid: 0
  - verse: 53
    segments:
      - text: >-
          O hesap günü için size vaad edilen işte budur.
        cid: 0
  - verse: 54
    segments:
      - text: >-
          İşte bu, bizim rızkımız; muhakkak ki ona hiç tükenmek yoktur.
        cid: 0
  - verse: 55
    segments:
      - text: >-
          Bu, böyledir. Şüphesiz azgınlar için de fena bir gelecek vardır.
        cid: 0
  - verse: 56
    segments:
      - text: >-
          Cehennem! Ona yaslanacaklar, fakat o ne çirkin döşektir.
        cid: 0
  - verse: 57
    segments:
      - text: >-
          İşte artık tatsınlar onu ki, o kaynar su ve irindir.
        cid: 0
  - verse: 58
    segments:
      - text: >-
          Ve o şekilden çifter çifter tadacakları diğer acılar da vardır.
        cid: 0
  - verse: 59
    segments:
      - text: >-
          İşte şunlar da sizin peşinize düşenlerdir. Onlara merhaba yok. Çünkü onlar
          cehenneme salınıyorlar.
        cid: 0
  - verse: 60
    segments:
      - text: >-
          (Arkadan gelenler öncekilere:) Derler ki: "Hayır, asıl size merhaba yok. Çünkü
          cehennemi bize siz takdim ettiniz. Bakın o ne kötü yatak!"
        cid: 0
  - verse: 61
    segments:
      - text: >-
          "Ey Rabbimiz! Bize bunu takdim edenin ateşteki azabını kat kat artır" derler.
        cid: 0
  - verse: 62
    segments:
      - text: >-
          Bir de derler ki: "Kötülerden saydığımız birtakım adamları (fakir müminleri)
          niye göremiyoruz?"
        cid: 0
  - verse: 63
    segments:
      - text: >-
          "Onları eğlence yerine tutmuştuk ha! Yoksa bu gözler onlardan kaydı mı?"
        cid: 0
  - verse: 64
    segments:
      - text: >-
          Şüphesiz ki bu haktır. Ateş ehlinin birbiriyle tartışması muhakkak olacaktır.
        cid: 0
  - verse: 65
    segments:
      - text: >-
          De ki: "Ben ancak korkuyu haber veren bir peygamberim. O tek ve kahredici olan
          Allah'tan başka tanrı da yoktur."
        cid: 0
  - verse: 66
    segments:
      - text: >-
          "O, göklerin, yerin ve ikisi arasındakilerin Rabbidir. O çok güçlüdür, çok
          bağışlayıcıdır."
        cid: 0
  - verse: 67
    segments:
      - text: >-
          De ki: "Bu, bir büyük haberdir."
        cid: 0
  - verse: 68
    segments:
      - text: >-
          "Siz ondan yüz çeviriyorsunuz."
        cid: 0
  - verse: 69
    segments:
      - text: >-
          "Münakaşa ederlerken, benim melekler yüksek topluluğuna ait ne bilgim
          olabilirdi?"
        cid: 0
  - verse: 70
    segments:
      - text: >-
          "Ancak ben açıktan açığa korkutmakla görevli olduğum için o bilgi bana
          vahyediliyor."
        cid: 0
  - verse: 71
    segments:
      - text: >-
          Hani Rabbin meleklere demişti ki: "Ben çamurdan bir insan yaratmaktayım."
        cid: 0
  - verse: 72
    segments:
      - text: >-
          "Onu tesviye edip, düzeltip de ruhumdan ona üfledim mi derhal ona secdeye
          kapanın."
        cid: 0
  - verse: 73
    segments:
      - text: >-
          Bunun üzerine meleklerin hepsi toptan secde ettiler.
        cid: 0
  - verse: 74
    segments:
      - text: >-
          Yalnız İblis etmedi, büyüklük tasladı ve kâfirlerden oldu.
        cid: 0
  - verse: 75
    segments:
      - text: >-
          Allah: "Ey İblis! O benim kudretimle yarattığıma secde etmene ne engel oldu?
          Kibirlenmek mi istedin? Yoksa yüksek derecelerde bulunanlardan mı oldun?" dedi.
        cid: 0
  - verse: 76
    segments:
      - text: >-
          İblis dedi ki: "Ben ondan hayırlıyım. Beni ateşten yarattın, onu ise çamurdan
          yarattın."
        cid: 0
  - verse: 77
    segments:
      - text: >-
          Allah: "Hemen çık oradan, artık sen kovuldun."
        cid: 0
  - verse: 78
    segments:
      - text: >-
          "Ve elbette lanetim ceza gününe kadar senin üzerindedir." buyurdu.
        cid: 0
  - verse: 79
    segments:
      - text: >-
          İblis: "Ya Rab! O halde insanların diriltilecekleri güne kadar bana mühlet
          ver." dedi.
        cid: 0
  - verse: 80
    segments:
      - text: >-
          Allah: "Haydi belirli bir vakte kadar mühlet verilenlerdensin" buyurdu.
        cid: 0
  - verse: 81
    segments:
      - text: >-
          Allah: "Haydi belirli bir vakte kadar mühlet verilenlerdensin" buyurdu.
        cid: 0
  - verse: 82
    segments:
      - text: >-
          İblis: "Öyle ise izzet ve şerefine yemin ederim ki, ben onların hepsini mutlaka
          aldatır, saptırırım."
        cid: 0
  - verse: 83
    segments:
      - text: >-
          "Ancak içlerinden ihlas ile seçilmiş has kulların müstesna" dedi.
        cid: 0
  - verse: 84
    segments:
      - text: >-
          Allah buyurdu ki: "O doğru, ben hep doğruyu söylerim."
        cid: 0
  - verse: 85
    segments:
      - text: >-
          "Andolsun ki, cehennemi mutlaka senden ve onların sana uyanlarından, topunuzdan
          tıka basa dolduracağım."
        cid: 0
  - verse: 86
    segments:
      - text: >-
          Ey Muhammed! De ki: "Ben o Kur'ân'a karşı sizden bir ücret istemiyorum. Ve ben
          kendiliğimden bir şey de teklif etmiyorum."
        cid: 0
  - verse: 87
    segments:
      - text: >-
          "O Kur'ân, bütün âlemler için bir zikir, bir öğüttür. "
        cid: 0
  - verse: 88
    segments:
      - text: >-
          "Herhalde onun haberini bir zaman sonra bileceksiniz."
        cid: 0