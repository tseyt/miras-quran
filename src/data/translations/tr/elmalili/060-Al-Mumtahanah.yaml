surah_id: 60
language: tr
author: elmalili
verses:
  - verse: 1
    segments:
      - text: >-
          Ey inananlar! Benim de düşmanım, sizin de düşmanınız olan kimseleri dost
          edinmeyin. Onlar size gelen gerçeği inkar ettikleri, Rabbiniz Allah'a
          inandığınızdan dolayı Resulü ve sizi (yurdunuzdan sürüp) çıkardıkları halde siz
          onlara sevgi ulaştırıyorsunuz. Eğer benim yolumda savaşmak ve benim rızamı
          kazanmak için çıktınızsa içinizde onlara sevgi mi gizliyorsunuz? Oysa ben sizin
          gizlediğiniz ve açığa vurduğunuz her şeyi bilirim. Sizden kim bunu yaparsa doğru
          yoldan sapmış olur.
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Şayet onlar sizi ele geçirirlerse, size düşman kesilecekler, size ellerini ve
          dillerini kötülükle uzatacaklardır. Zaten inkar edivermenizi istemektedirler.
        cid: 0
  - verse: 3
    segments:
      - text: >-
          Kıyamet günü yakınlarınız ve çocuklarınız size fayda vermezler. Çünkü Allah
          aranızı ayırır. Allah yaptıklarınızı görendir.
        cid: 0
  - verse: 4
    segments:
      - text: >-
          İbrahim'de ve onunla beraber bulunanlarda sizin için güzel bir misal vardır,
          onlar kavimlerine demişlerdi ki: "Biz sizden ve sizin Allah'tan başka
          taptıklarınızdan uzağız. Sizi tanımıyoruz. Siz bir tek Allah'a inanıncaya kadar
          sizinle bizim aramızda sürekli bir düşmanlık ve nefret belirmiştir." Yalnız
          İbrahim'in babasına: "Senin için mağfiret dileyeceğim, fakat senin için
          Allah'tan (gelecek) hiçbir şeyi (önlemeye) gücüm yetmez." demesi hariç.
          Rabbimiz! Yalnız sana dayandık, sana yöneldik. Dönüşümüz de ancak sanadır.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          "Rabbimiz! Bizi inkar edenler için bir fitne kılma, (onlara mağlub etme!) bizi
          bağışla! Ey Rabbimiz! Yegane gâlib ve hikmet sahibi ancak sensin."
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Andolsun, onlarda sizin için, Allah'ı ve ahiret gününü arzulayanlara güzel bir
          örnek vardır. Kim yüz çevirirse şüphesiz Allah, zengindir, hamde layık olandır.
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Olur ki Allah sizinle düşmanlarınız arasında yakında bir dostluk meydana
          getirir. Allah gücü yetendir. Allah çok bağışlayan, çok merhamet edendir.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Allah sizi, din hakkında sizinle savaşmayan ve sizi yurtlarınızdan çıkarmayan
          kimselere iyilik etmekten, onlara adaletli davranmaktan men etmez. Çünkü Allah
          adalet yapanları sever.
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Allah sizi, ancak sizinle din hakkında savaşan, sizi yurtlarınızdan çıkaran ve
          çıkarılmanız için yardım eden kimselere dost olmaktan men eder. Kim onlarla dost
          olursa işte zalimler onlardır.
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Ey iman edenler! Mümin kadınlar hicret ederek size geldiği zaman, onları
          imtihan edin. Allah onların imanlarını daha iyi bilir. Eğer siz de onların
          inanmış kadınlar olduğunu öğrenirseniz onları kâfirlere geri döndürmeyin. Bunlar
          onlara helal değildir. Onlar da bunlara helal olmazlar. Onların (kocalarının)
          sarfettiklerini (mehirleri) geri verin. Mehirlerini kendilerine verdiğiniz zaman
          onlarla evlenmenizde size bir günah yoktur. Kâfir kadınları nikâhınızda
          tutmayın, sarfettiğinizi isteyin. Onlarda sarfettiklerini istesinler. Allah'ın
          hükmü budur. Aranızda O, hükmeder, Allah bilendir, hikmet sahibidir.
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Eğer eşlerinizden biri, sizden kâfirlere kaçar da siz de savaşta galip durumda
          olursanız, eşleri gitmiş olanlara ganimetten, harcadıkları kadar verin.
          İnandığınız Allah'a karşı gelmekten sakının.
        cid: 0
  - verse: 12
    segments:
      - text: >-
          Ey Peygamber! İnanmış kadınlar sana gelip Allah'a hiçbir şeyi ortak
          koşmamaları, hırsızlık etmemeleri, zina etmemeleri, çocuklarını öldürmemeleri,
          elleri ile ayakları arasında bir iftira uydurup getirmemeleri, iyi bir işte sana
          karşı gelmemeleri hususunda sana bey'at ederlerse onların bey'atlarını al ve
          onlar için Allah'tan mağfiret dile. Şüphesiz Allah, çok bağışlayan, çok merhamet
          edendir.
        cid: 0
  - verse: 13
    segments:
      - text: >-
          Ey inananlar, Allah'ın gazab ettiği kimselerle dostluk etmeyin. Kâfirler,
          mezarlık halkından nasıl ümidi kesmişse, onlar da ahiretten öyle ümidi
          kesmişlerdi.
        cid: 0