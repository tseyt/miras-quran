surah_id: 82
language: tr
author: elmalili
verses:
  - verse: 1
    segments:
      - text: >-
          Gök çatladığı vakit,
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Yıldızlar döküldüğü vakit,
        cid: 0
  - verse: 3
    segments:
      - text: >-
          Denizler yarılıp akıtıldığı vakit,
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Kabirlerin içi dışına getirildiği vakit,
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Herkes neyi önünden gönderdiğini ve neyi geri bıraktığını bilir.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Ey insan! İhsanı bol Rabb'ine karşı seni aldatan nedir?
        cid: 0
  - verse: 7
    segments:
      - text: >-
          O Allah ki seni yarattı, seni düzgün yapılı kılıp ölçülü bir biçim verdi.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Seni dilediği her hangi bir şekilde parçalardan oluşturdu.
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Hayır hayır, siz cezayı yalanlıyorsunuz.
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Oysa üzerinizde koruyucular var.
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Değerli yazıcılar
        cid: 0
  - verse: 12
    segments:
      - text: >-
          Onlar, siz her ne yaparsanız bilirler
        cid: 0
  - verse: 13
    segments:
      - text: >-
          Kuşkusuz iyiler nimet içindedirler.
        cid: 0
  - verse: 14
    segments:
      - text: >-
          Kötüler de cehennemdedirler.
        cid: 0
  - verse: 15
    segments:
      - text: >-
          Ceza günü ona girecekler.
        cid: 0
  - verse: 16
    segments:
      - text: >-
          Onlar o cehennemin gözünden kaçamazlar.
        cid: 0
  - verse: 17
    segments:
      - text: >-
          Ceza gününün ne olduğunu sen bilir misin?
        cid: 0
  - verse: 18
    segments:
      - text: >-
          Evet, bilir misin nedir acaba o ceza günü?
        cid: 0
  - verse: 19
    segments:
      - text: >-
          O gün, hiç kimsenin başkası için hiçbir şeye sahip olamadığı gündür. O gün
          buyruk yalnız Allah'ındır.
        cid: 0