surah_id: 76
language: tr
author: elmalili
verses:
  - verse: 1
    segments:
      - text: "Gerçekten insan üzerine dehirden (zamandan) öyle bir müddet geldi ki o zaman o, anılmaya değer bir şey değildi."
        cid: 0
  - verse: 2
    segments:
      - text: "Doğrusu biz insanı, imtihan etmek için karışık bir nutfeden (erkek ve kadın sularından) yarattık da onu işitici, görücü yaptık."
        cid: 0
  - verse: 3
    segments:
      - text: "Kuşkusuz biz ona yolu gösterdik; ister şükredici olsun, ister nankör."
        cid: 0
  - verse: 4
    segments:
      - text: "Çünkü biz, kâfirler için zincirler, demir halkalar ve alevli bir ateş hazırlamışızdır."
        cid: 0
  - verse: 5
    segments:
      - text: "Kuşkusuz iyiler de karışımı kâfûr olan dolgun bir kadehten içerler."
        cid: 0
  - verse: 6
    segments:
      - text: "Bir kaynak ki ondan Allah'ın kulları içerler, güzel yollar açarak akıtırlar onu."
        cid: 0
  - verse: 7
    segments:
      - text: "O kullar adaklarını yerine getirirler ve fenalığı salgın (olan) bir günden korkarlar."
        cid: 0
  - verse: 8
    segments:
      - text: "Düşküne, yetime ve esire seve seve yemek yedirirler."
        cid: 0
  - verse: 9
    segments:
      - text: "\"Size sırf Allah rızası için yemek yediriyoruz. Sizden ne bir karşılık, ne de bir teşekkür bekliyoruz.\""
        cid: 0
  - verse: 10
    segments:
      - text: "\"Biz sert ve belalı bir günde Rabbimizden korkarız.\" derler."
        cid: 0
  - verse: 11
    segments:
      - text: "Allah da onları o günün fenalığından korur, yüzlerine parlaklık, gönüllerine sevinç verir."
        cid: 0
  - verse: 12
    segments:
      - text: "Sabırlarına karşılık onlara bir cennet ve ipekten elbiseler verir."
        cid: 0
  - verse: 13
    segments:
      - text: "Orada donatılmış koltuklar üzerine dayanmışlardır: Orada ne yakıcı güneş görürler, ne de şiddetli soğuk."
        cid: 0
  - verse: 14
    segments:
      - text: "Üzerlerine cennet gölgeleri sarkmış, meyveleri bol bol önlerine konmuştur."
        cid: 0
  - verse: 15
    segments:
      - text: "Yanlarında gümüşten kaplar, billur kupalar dolaştırılır."
        cid: 0
  - verse: 16
    segments:
      - text: "Gümüşten öyle kadehler ki onları türlü türlü biçimlere koymuşlardır."
        cid: 0
  - verse: 17
    segments:
      - text: "Onlara orada bir dolu kadeh sunulur ki, karışımı zencefildir."
        cid: 0
  - verse: 18
    segments:
      - text: "Bu orada bir pınardır ki, adına \"selsebil\" derler."
        cid: 0
  - verse: 19
    segments:
      - text: "Etraflarında ölümsüz hizmetçiler dolaşır, onları görünce saçılmış inciler sanırsın."
        cid: 0
  - verse: 20
    segments:
      - text: "Orada nereye baksan bir nimet ve pek büyük bir mülk görürsün."
        cid: 0
  - verse: 21
    segments:
      - text: "Üstlerinde zarif ve yeşil, kalın ipekten bir elbise vardır. Gümüş bileziklerle süslenmişlerdir. Rableri onlara temiz bir içecek içirmiştir."
        cid: 0
  - verse: 22
    segments:
      - text: "(Onlara şöyle denir): \"İşte bu sizin bir mükâfatınızdı. Gayretiniz karşılığını bulmuştur.\""
        cid: 0
  - verse: 23
    segments:
      - text: "Kur'ân'ı sana kısım kısım biz indirdik biz."
        cid: 0
  - verse: 24
    segments:
      - text: "O halde Rabbinin hüküm vermesi için sabret. Onlardan hiçbir günahkâra yahut nanköre itaat etme."
        cid: 0
  - verse: 25
    segments:
      - text: "Sabahakşam Rabbinin ismini an."
        cid: 0
  - verse: 26
    segments:
      - text: "Gecenin bir bölümünde de O'na secde et (akşam ve yatsı namazlarını kıl). Hem de O'nu uzun bir gece tesbih et (teheccüd namazı kıl)."
        cid: 0
  - verse: 27
    segments:
      - text: "Çünkü onlar bu dünyayı seviyorlar ve önlerindeki ağır bir günü arkaya atıyorlar."
        cid: 0
  - verse: 28
    segments:
      - text: "Onları biz yarattık ve mafsallarını sımsıkı bağladık. Dilediğimiz vakit de kılıklarını değiştiririz."
        cid: 0
  - verse: 29
    segments:
      - text: "İşte bu bir öğüttür. Dileyen Rabbine giden yolu tutar."
        cid: 0
  - verse: 30
    segments:
      - text: "Allah dilemedikçe siz dileyemezsiniz. Kuşkusuz Allah, bilendir, hüküm ve hikmet sahibidir."
        cid: 0
  - verse: 31
    segments:
      - text: "Allah dilediğini rahmetine sokar. Zalimlere ise, acıklı bir azap hazırlamıştır."
        cid: 0