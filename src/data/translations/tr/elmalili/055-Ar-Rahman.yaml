surah_id: 55
language: tr
author: elmalili
verses:
  - verse: 1
    segments:
      - text: >-
          Rahmân (çok merhametli olan Allah)
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Kurân'ı öğretti.
        cid: 0
  - verse: 3
    segments:
      - text: >-
          İnsanı yarattı.
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Ona beyanı öğretti.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Güneş de ay da bir hesab iledir.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Bitkiler ve ağaçlar secde etmektedirler.
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Göğü yükseltti ve mizanı koydu.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Sakın tartıda taşkınlık etmeyin.
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Tartıyı adaletle yapın, terazide eksiklik yapmayın.
        cid: 0
  - verse: 10
    segments:
      - text: >-
          (Allah) yeri mahlukat için (aşağıya) koydu.
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Orada meyvalar ve salkımlı hurma ağaçları vardır.
        cid: 0
  - verse: 12
    segments:
      - text: >-
          Yapraklı taneler ve hoş kokulu bitkiler vardır.
        cid: 0
  - verse: 13
    segments:
      - text: >-
          Şimdi Rabbinizin hangi nimetlerini yalanlıyorsunuz?
        cid: 0
  - verse: 14
    segments:
      - text: >-
          Allah insanı, pişmiş bir çamura benzeyen bir balçıktan yarattı.
        cid: 0
  - verse: 15
    segments:
      - text: >-
          Cinleri de hâlis ateşten yarattı.
        cid: 0
  - verse: 16
    segments:
      - text: >-
          Şimdi Rabbinizin hangi nimetlerini yalanlıyorsunuz?
        cid: 0
  - verse: 17
    segments:
      - text: >-
          (O) iki doğunun ve iki batının Rabbidir.
        cid: 0
  - verse: 18
    segments:
      - text: >-
          Şimdi Rabbinizin hangi nimetlerini yalanlıyorsunuz?
        cid: 0
  - verse: 19
    segments:
      - text: >-
          (Acı ve tatlı) iki denizi salıverdi birbirine kavuşuyorlar.
        cid: 0
  - verse: 20
    segments:
      - text: >-
          Fakat aralarında bir engel vardır, birbirlerine geçip karışmıyorlar.
        cid: 0
  - verse: 21
    segments:
      - text: >-
          Şimdi Rabbinizin hangi nimetlerini yalanlıyorsunuz?
        cid: 0
  - verse: 22
    segments:
      - text: >-
          İkisinden de inci ve mercan çıkar.
        cid: 0
  - verse: 23
    segments:
      - text: >-
          Şimdi Rabbinizin hangi nimetlerini yalanlıyorsunuz?
        cid: 0
  - verse: 24
    segments:
      - text: >-
          Denizde koca dağlar gibi yükselen gemiler de onundur.
        cid: 0
  - verse: 25
    segments:
      - text: >-
          Şimdi Rabbinizin hangi nimetlerini yalanlıyorsunuz?
        cid: 0
  - verse: 26
    segments:
      - text: >-
          Yer üzerinde bulunan her şey fânidir.
        cid: 0
  - verse: 27
    segments:
      - text: >-
          Yalnız celâl ve ikram sahibi Rabbinin yüzü (zâtı) baki kalacaktır.
        cid: 0
  - verse: 28
    segments:
      - text: >-
          Şimdi Rabbinizin hangi nimetlerini yalanlıyorsunuz?
        cid: 0
  - verse: 29
    segments:
      - text: >-
          Göklerde ve yerde bulunanlar, O'ndan isterler. O, her gün yeni bir iştedir.
        cid: 0
  - verse: 30
    segments:
      - text: >-
          Şimdi Rabbinizin hangi nimetlerini yalanlıyorsunuz?
        cid: 0
  - verse: 31
    segments:
      - text: >-
          Ey insan ve cin! sizin de hesabınızı ele alacağız.
        cid: 0
  - verse: 32
    segments:
      - text: >-
          Şimdi Rabbinizin hangi nimetlerini yalanlıyorsunuz?
        cid: 0
  - verse: 33
    segments:
      - text: >-
          Ey cin ve insan toplulukları! Göklerin ve yerin çevresinden geçmeye gücünüz
          yeterse geçin gidin. Allah'ın verdiği bir güç olmadan geçemezsiniz.
        cid: 0
  - verse: 34
    segments:
      - text: >-
          Şimdi Rabbinizin hangi nimetlerini yalanlıyorsunuz?
        cid: 0
  - verse: 35
    segments:
      - text: >-
          Üzerinize ateşten alev ve duman gönderilir, kendinizi savunamazsınız.
        cid: 0
  - verse: 36
    segments:
      - text: >-
          Şimdi Rabbinizin hangi nimetlerini yalanlıyorsunuz
        cid: 0
  - verse: 37
    segments:
      - text: >-
          Gök yarılıp da, erimiş yağ gibi kıpkırmızı bir gül olduğu zaman...
        cid: 0
  - verse: 38
    segments:
      - text: >-
          Şimdi Rabbinizin hangi nimetlerini yalanlıyorsunuz?
        cid: 0
  - verse: 39
    segments:
      - text: >-
          İşte o gün, ne insana ne de cinne günahından sorulmaz.
        cid: 0
  - verse: 40
    segments:
      - text: >-
          Şimdi Rabbinizin hangi nimetlerini yalanlıyorsunuz?
        cid: 0
  - verse: 41
    segments:
      - text: >-
          Suçlular simalarından tanınır, alınlarından ve ayaklarından tutulur.
        cid: 0
  - verse: 42
    segments:
      - text: >-
          Şimdi Rabbinizin hangi nimetlerini yalanlıyorsunuz?
        cid: 0
  - verse: 43
    segments:
      - text: >-
          İşte bu, suçluların yalanladığı cehennemdir.
        cid: 0
  - verse: 44
    segments:
      - text: >-
          Onunla kaynar su arasında dolaşırlar.
        cid: 0
  - verse: 45
    segments:
      - text: >-
          Şimdi Rabbinizin hangi nimetlerini yalanlıyorsunuz?
        cid: 0
  - verse: 46
    segments:
      - text: >-
          Rabbinin makamından korkan kimselere iki cennet vardır.
        cid: 0
  - verse: 47
    segments:
      - text: >-
          Şimdi Rabbinizin hangi nimetlerini yalanlıyorsunuz?
        cid: 0
  - verse: 48
    segments:
      - text: >-
          İkisinin de çeşitli ağaçları, meyvaları vardır.
        cid: 0
  - verse: 49
    segments:
      - text: >-
          Şimdi Rabbinizin hangi nimetlerini yalanlıyorsunuz?
        cid: 0
  - verse: 50
    segments:
      - text: >-
          İkisinde de akıp giden iki kaynak vardır.
        cid: 0
  - verse: 51
    segments:
      - text: >-
          Şimdi Rabbinizin hangi nimetlerini yalanlıyorsunuz?
        cid: 0
  - verse: 52
    segments:
      - text: >-
          İkisinde de her türlü meyvadan çift çift vardır.
        cid: 0
  - verse: 53
    segments:
      - text: >-
          Şimdi Rabbinizin hangi nimetlerini yalanlıyorsunuz?
        cid: 0
  - verse: 54
    segments:
      - text: >-
          Astarları atlastan yataklara yaslanırlar. İki cennetin de devşirmesi yakındır.
        cid: 0
  - verse: 55
    segments:
      - text: >-
          Şimdi Rabbinizin hangi nimetlerini yalanlıyorsunuz?
        cid: 0
  - verse: 56
    segments:
      - text: >-
          Oralarda gözlerini yalnız eşlerine çevirmiş dilberler var ki, bunlardan önce
          onlara ne insan ne de cin dokunmuştur.
        cid: 0
  - verse: 57
    segments:
      - text: >-
          Şimdi Rabbinizin hangi nimetlerini yalanlıyorsunuz?
        cid: 0
  - verse: 58
    segments:
      - text: >-
          Sanki onlar yâkut ve mercandırlar.
        cid: 0
  - verse: 59
    segments:
      - text: >-
          Şimdi Rabbinizin hangi nimetlerini yalanlıyorsunuz?
        cid: 0
  - verse: 60
    segments:
      - text: >-
          İyiliğin karşılığı, yalnız iyilik değil midir?
        cid: 0
  - verse: 61
    segments:
      - text: >-
          Şimdi Rabbinizin hangi nimetlerini yalanlıyorsunuz?
        cid: 0
  - verse: 62
    segments:
      - text: >-
          Bu ikisinden başka iki cennet daha vardır.
        cid: 0
  - verse: 63
    segments:
      - text: >-
          Şimdi Rabbinizin hangi nimetlerini yalanlıyorsunuz?
        cid: 0
  - verse: 64
    segments:
      - text: >-
          (Bu cennetler) yemyeşildirler.
        cid: 0
  - verse: 65
    segments:
      - text: >-
          Şimdi Rabbinizin hangi nimetlerini yalanlıyorsunuz?
        cid: 0
  - verse: 66
    segments:
      - text: >-
          İkisinde de fışkıran iki kaynak vardır.
        cid: 0
  - verse: 67
    segments:
      - text: >-
          Şimdi Rabbinizin hangi nimetlerini yalanlıyorsunuz?
        cid: 0
  - verse: 68
    segments:
      - text: >-
          İkisinde de her türlü meyva, hurma ve nar vardır.
        cid: 0
  - verse: 69
    segments:
      - text: >-
          Şimdi Rabbinizin hangi nimetlerini yalanlıyorsunuz?
        cid: 0
  - verse: 70
    segments:
      - text: >-
          İçlerinde güzel huylu, güzel yüzlü kadınlar vardır.
        cid: 0
  - verse: 71
    segments:
      - text: >-
          Şimdi Rabbinizin hangi nimetlerini yalanlıyorsunuz?
        cid: 0
  - verse: 72
    segments:
      - text: >-
          Çadırlar içerisinde gözlerini yalnız kocalarına çevirmiş hûriler vardır.
        cid: 0
  - verse: 73
    segments:
      - text: >-
          Şimdi Rabbinizin hangi nimetlerini yalanlıyorsunuz?
        cid: 0
  - verse: 74
    segments:
      - text: >-
          Bunlardan önce onlara ne insan ne de cin dokunmuştur.
        cid: 0
  - verse: 75
    segments:
      - text: >-
          Şimdi Rabbinizin hangi nimetlerini yalanlıyorsunuz?
        cid: 0
  - verse: 76
    segments:
      - text: >-
          Yeşil yastıklara ve hârikulâde güzel işlemeli döşeklere yaslanırlar.
        cid: 0
  - verse: 77
    segments:
      - text: >-
          Şimdi Rabbinizin hangi nimetlerini yalanlıyorsunuz?
        cid: 0
  - verse: 78
    segments:
      - text: >-
          Büyüklük ve ikram sahibi Rabbinin adı ne yücedir!
        cid: 0