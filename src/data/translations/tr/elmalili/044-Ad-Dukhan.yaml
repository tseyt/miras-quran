surah_id: 44
language: tr
author: elmalili
verses:
  - verse: 1
    segments:
      - text: >-
          Hâ, mîm.
        cid: 0
  - verse: 2
    segments:
      - text: >-
          O apaçık Kitab'a andolsun ki biz onu gerçekten mübarek bir gecede indirdik.
          Çünkü biz onunla insanları uyarmaktayız.
        cid: 0
  - verse: 3
    segments:
      - text: >-
          O apaçık Kitab'a andolsun ki biz onu gerçekten mübarek bir gecede indirdik.
          Çünkü biz onunla insanları uyarmaktayız.
        cid: 0
  - verse: 4
    segments:
      - text: >-
          O gecede her hikmetli iş tarafımızdan bir emirle ayrılır. Gerçekten biz Rabbin
          tarafından bir rahmet olarak peygamberler göndeririz. Şüphesiz ki O, herşeyi
          işitir ve bilir.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          O gecede her hikmetli iş tarafımızdan bir emirle ayrılır. Gerçekten biz Rabbin
          tarafından bir rahmet olarak peygamberler göndeririz. Şüphesiz ki O, herşeyi
          işitir ve bilir.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          O gecede her hikmetli iş tarafımızdan bir emirle ayrılır. Gerçekten biz Rabbin
          tarafından bir rahmet olarak peygamberler göndeririz. Şüphesiz ki O, herşeyi
          işitir ve bilir.
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Siz eğer kesin olarak inanıyorsanız, iyi bilin ki Allah göklerin, yerin ve
          ikisi arasındakilerin Rabbidir.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Ondan başka hiçbir ilâh yoktur. O hem yaşatır, hem öldürür. O sizin de
          Rabbiniz, sizden önceki babalarınızın da Rabbidir.
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Fakat kâfirler bir şüphe içinde oynayıp eğleniyorlar.
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Ey Muhammed! Şimdi sen göğün, insanları bürüyecek açık bir duman getireceği
          günü gözetle. Bu acı bir azabdır.
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Ey Muhammed! Şimdi sen göğün, insanları bürüyecek açık bir duman getireceği
          günü gözetle. Bu acı bir azabdır.
        cid: 0
  - verse: 12
    segments:
      - text: >-
          O gün insanlar: "Ey Rabbimiz! Bizden azabı kaldır. Artık biz inanıyoruz"
          derler.
        cid: 0
  - verse: 13
    segments:
      - text: >-
          Onlar için bunu düşünüp öğüt almak nerede? Oysa kendilerine gerçeği açıklayan
          bir de peygamber gelmişti.
        cid: 0
  - verse: 14
    segments:
      - text: >-
          Sonra onlar, o peygamberden yüz çevirdiler ve: "Bu öğretilmiş bir delidir."
          dediler.
        cid: 0
  - verse: 15
    segments:
      - text: >-
          Biz o azabı sizden birazcık kaldırırız. Ama siz mutlaka eski halinize
          dönersiniz.
        cid: 0
  - verse: 16
    segments:
      - text: >-
          Biz o büyük şiddetle çarptığımız gün mutlaka intikamımızı alırız.
        cid: 0
  - verse: 17
    segments:
      - text: >-
          Andolsun ki, biz onlardan önce Firavun kavmini de denemiştik. Onlara çok
          kıymetli bir peygamber gelmişti.
        cid: 0
  - verse: 18
    segments:
      - text: >-
          O peygamber onlara şöyle demişti: "Esaretiniz altındaki Allah'ın kullarını bana
          teslim edin. Çünkü ben size gönderilmiş güvenilir bir peygamberim.
        cid: 0
  - verse: 19
    segments:
      - text: >-
          Allah'a karşı üstünlük taslamayın. Şüphesiz ki ben size apaçık bir delil
          getiriyorum.
        cid: 0
  - verse: 20
    segments:
      - text: >-
          Gerçekten ben, beni taşlamanızdan dolayı benim de Rabbim, sizin de Rabbiniz
          olan Allah'a sığındım.
        cid: 0
  - verse: 21
    segments:
      - text: >-
          Eğer siz bana iman etmezseniz hemen yanımdan uzaklaşın."
        cid: 0
  - verse: 22
    segments:
      - text: >-
          Musa: "Şüphesiz ki bunlar suçlu bir kavimdir." diyerek yardım etmesi için
          Rabbine yalvardı.
        cid: 0
  - verse: 23
    segments:
      - text: >-
          Allah buyurdu ki: "Kullarımı geceleyin yürüt. Çünkü siz takib edileceksiniz.
        cid: 0
  - verse: 24
    segments:
      - text: >-
          Karşıya geçince denizi olduğu gibi açık bırak. Çünkü onlar suda boğulacak bir
          ordudur."
        cid: 0
  - verse: 25
    segments:
      - text: >-
          Onlar neler bırakmışlardı, ne bahçeler, ne pınarlar!
        cid: 0
  - verse: 26
    segments:
      - text: >-
          Ne ekinler, ne güzel kaynaklar,
        cid: 0
  - verse: 27
    segments:
      - text: >-
          Ve içinde eğlenip durdukları nice nimetler ve refah!
        cid: 0
  - verse: 28
    segments:
      - text: >-
          İşte böylece biz onları başka bir kavme miras bıraktık.
        cid: 0
  - verse: 29
    segments:
      - text: >-
          Gök ve yer onların üzerine ağlamadı. Onlara mühlet de verilmedi.
        cid: 0
  - verse: 30
    segments:
      - text: >-
          Andolsun ki biz İsrailoğullarını o aşağılayıcı azabdan kurtardık.
        cid: 0
  - verse: 31
    segments:
      - text: >-
          Firavun'dan da kurtardık çünkü o üstünlük taslayıp haddi aşan bir zorbaydı.
        cid: 0
  - verse: 32
    segments:
      - text: >-
          Andolsun ki biz onları bilerek o zamanki alemlere üstün kıldık.
        cid: 0
  - verse: 33
    segments:
      - text: >-
          Biz onlara içinde apaçık bir imtihan bulunan mucizeler verdik.
        cid: 0
  - verse: 34
    segments:
      - text: >-
          Gerçekten şu kâfirler diyorlar ki:
        cid: 0
  - verse: 35
    segments:
      - text: >-
          "Bizim ilk ölümümüzden başka bir şey yoktur. Biz tekrar diriltilecek değiliz.
        cid: 0
  - verse: 36
    segments:
      - text: >-
          Eğer siz doğru söyleyen kimselerseniz babalarınızı bize getirin."
        cid: 0
  - verse: 37
    segments:
      - text: >-
          Onlar mı daha hayırlıdır, yoksa Tükba kavmi ile onlardan öncekiler mi? Biz
          onların hepsini de helak ettik. Çünkü onlar suçluydular.
        cid: 0
  - verse: 38
    segments:
      - text: >-
          Biz gökleri, yeri ve ikisi arasındakileri bir oyun ve eğlence olsun diye
          yaratmadık.
        cid: 0
  - verse: 39
    segments:
      - text: >-
          Biz onları hak ve hikmetle yarattık. Fakat onların çoğu bunu bilmezler.
        cid: 0
  - verse: 40
    segments:
      - text: >-
          Şüphesiz ki hakkı batıldan ayırd etme günü onların hepsinin bir araya
          toplanacağı gündür.
        cid: 0
  - verse: 41
    segments:
      - text: >-
          O gün dostun dosta hiçbir faydası olmaz. Onlara yardım da edilmez.
        cid: 0
  - verse: 42
    segments:
      - text: >-
          Ancak Allah'ın merhamet ettiği kimseler böyle değildir. Şüphesiz ki Allah çok
          güçlüdür, çok merhamet edicidir.
        cid: 0
  - verse: 43
    segments:
      - text: >-
          Gerçekten zakkum ağacı,
        cid: 0
  - verse: 44
    segments:
      - text: >-
          Günahkârların yemeğidir.
        cid: 0
  - verse: 45
    segments:
      - text: >-
          O pota gibi karınlarda kaynar.
        cid: 0
  - verse: 46
    segments:
      - text: >-
          O, kızgın bir sıvının kaynaması gibidir.
        cid: 0
  - verse: 47
    segments:
      - text: >-
          Allah meleklere şöyle emreder. "Şunu tutun da Cehennem'in ortasına sürükleyin."
        cid: 0
  - verse: 48
    segments:
      - text: >-
          "Sonra onun başının üstüne kaynar su azabından dökün."
        cid: 0
  - verse: 49
    segments:
      - text: >-
          Ona şöyle denir! "Tat bakalım azabı! hani sen kendine göre çok güçlü ve çok
          üstündün.
        cid: 0
  - verse: 50
    segments:
      - text: >-
          İşte sizin inkâr edip durduğunuz şey budur."
        cid: 0
  - verse: 51
    segments:
      - text: >-
          Şüphesiz ki kötülükten sakınanlar güvenli bir makamdadırlar.
        cid: 0
  - verse: 52
    segments:
      - text: >-
          Bahçelerde ve pınar başlarındadırlar.
        cid: 0
  - verse: 53
    segments:
      - text: >-
          Onlar ince ipekten ve parlak atlastan elbiseler giyerek karşılıklı olarak
          otururlar.
        cid: 0
  - verse: 54
    segments:
      - text: >-
          İşte böyle, biz onları ayrıca iri siyah gözlü hurilerle evlendiririz.
        cid: 0
  - verse: 55
    segments:
      - text: >-
          Onlar orada güven içinde her çeşit meyveyi isteyebilirler.
        cid: 0
  - verse: 56
    segments:
      - text: >-
          Onlar orada ilk ölümden başka bir ölüm tatmazlar. Allah onları cehennem
          azabından korumuştur.
        cid: 0
  - verse: 57
    segments:
      - text: >-
          (Bunların hepsi) Rabbinden bir lütuf olarak (verilmiştir.) İşte büyük kurtuluş
          budur.
        cid: 0
  - verse: 58
    segments:
      - text: >-
          Biz Kur'ân'ı senin dilinle indirip kolaylaştırdık. Umulur ki onlar öğüt
          alırlar.
        cid: 0
  - verse: 59
    segments:
      - text: >-
          Artık sen onların başlarına gelecekleri bekle: Çünkü onlar da bekleyip
          durmaktadırlar.
        cid: 0