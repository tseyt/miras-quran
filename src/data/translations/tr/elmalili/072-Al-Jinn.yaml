surah_id: 72
language: tr
author: elmalili
verses:
  - verse: 1
    segments:
      - text: >-
          Deki: Hakikat bir takım cinnin Kur'ân dinleyip de şöyle dedikleri bana
          vahyedildi. Şüphesiz biz, hayret verici bir Kur'ân dinledik.
        cid: 0
  - verse: 2
    segments:
      - text: >-
          O Kur'ân hidayete erdiriyor, biz de ona iman ettik. Rabbimize hiçbir şeyi ortak
          koşmayacağız.
        cid: 0
  - verse: 3
    segments:
      - text: >-
          Doğrusu, Rabbimizin şanı çok yüksektir. Ne bir arkadaş edinmiştir, ne de bir
          çocuk.
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Meğer bizim beyinsiz (İblis), Allah hakkında saçma şeyler söylüyormuş.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Doğrusu biz insanları ve cinleri Allah'a karşı asla yalan söylemez sanmışız.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Doğrusu insanlardan bazı erkekler, cinlerden bazı erkeklere sığınırlardı da
          onların şımarıklıklarını artırırlardı.
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Doğrusu onlar sizin zannettiğiniz gibi, zannetmişlerdi ki, Allah asla kimseyi
          Peygamber göndermeyecek.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          (Cinler, dediler ki): "Biz göğe dokunduk, onu kuvvetli bekçiler ve alevlerle
          dolu bulduk."
        cid: 0
  - verse: 9
    segments:
      - text: >-
          "Doğrusu biz göğün bazı mevkilerinde dinlemek için otururduk. Fakat şimdi her
          kim dinleyecek olursa kendini gözetleyen parlak bir alev buluyor."
        cid: 0
  - verse: 10
    segments:
      - text: >-
          "Doğrusu biz bilmiyoruz, yeryüzündekilere kötülük mü murat edildi, yoksa
          Rableri onlara bir hayır mı diledi?"
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Doğrusu bizler; bizden iyi olanlar da var, olmayanlar da var. Biz çeşitli
          yollara ayrılmışız.
        cid: 0
  - verse: 12
    segments:
      - text: >-
          "Doğrusu biz anladık ki, Allah'ı yerde acze düşürmemize imkân yok. Kaçmakla da
          O'nu asla âciz bırakamayacağız."
        cid: 0
  - verse: 13
    segments:
      - text: >-
          "Doğrusu biz o hidayet rehberini dinlediğimizde ona iman ettik. Kim Rabbine
          inanırsa, ne hakkının eksik verilmesinden korkar, ne de kendisine kötülük
          edilmesinden."
        cid: 0
  - verse: 14
    segments:
      - text: >-
          "Ve biz, bizlerden müslümanlar da var, hak yoldan sapanlar da var. Müslüman
          olanlar, işte onlar doğru yolu arayanlardır."
        cid: 0
  - verse: 15
    segments:
      - text: >-
          Ama yoldan çıkanlar, işte onlar cehenneme odun olmuşlardır.
        cid: 0
  - verse: 16
    segments:
      - text: >-
          Onlar gerçekten o yol üzere dosdoğru gitselerdi, elbette kendilerine bol bir su
          verirdik.
        cid: 0
  - verse: 17
    segments:
      - text: >-
          Ki onları onunla sınayalım. Kim Rabbini anmaktan yüz çevirirse, Rabbi onu
          gittikçe yükselen bir azaba sokar.
        cid: 0
  - verse: 18
    segments:
      - text: >-
          Mescitler kuşkusuz Allah'ındır. O halde Allah ile birlikte kimseye yalvarmayın.
        cid: 0
  - verse: 19
    segments:
      - text: >-
          Allah'ın kulu (Hz. Peygamber) kalkmış O'na dua ederken, neredeyse (cinler) onun
          etrafında keçe gibi birbirlerine geçeceklerdi.
        cid: 0
  - verse: 20
    segments:
      - text: >-
          De ki: "Ben ancak Rabbime dua eder ve O'na hiçbir şeyi ortak koşmam"
        cid: 0
  - verse: 21
    segments:
      - text: >-
          De ki, "Haberiniz olsun, ben size kendiliğimden ne bir zarar verebilirim, ne de
          bir yol gösterebilirim."
        cid: 0
  - verse: 22
    segments:
      - text: >-
          De ki, "Allah'tan beni kimse kurtaramaz ve ben O'ndan başka bir sığınacak
          bulamam."
        cid: 0
  - verse: 23
    segments:
      - text: >-
          "Benim yapabileceğim, sadece Allah'tan size duyuru yapmak ve O'nun elçilik
          görevlerini yerine getirmektir." Artık kim Allah'a ve onun elçisine baş
          kaldırırsa, ona içinde ebedi kalacakları cehennem ateşi vardır.
        cid: 0
  - verse: 24
    segments:
      - text: >-
          Kendilerine vaad edilen şeyi gördükleri zaman, kimin yardımcısının en zayıf ve
          en az olduğunu bileceklerdir.
        cid: 0
  - verse: 25
    segments:
      - text: >-
          De ki: "Ben bilmem, o size vaad edilen şey yakın mı, yoksa Rabbim onun için
          uzun bir süre mi koyar.."
        cid: 0
  - verse: 26
    segments:
      - text: >-
          O bütün gaybı bilir. Fakat gaybını hiç kimseye açmaz.
        cid: 0
  - verse: 27
    segments:
      - text: >-
          Ancak seçtiği elçiye açar. Çünkü onun önünden ve ardından gözetleyiciler salar.
        cid: 0
  - verse: 28
    segments:
      - text: >-
          Bilsin diye ki, onlar Rablerinin elçiliklerini yerine getirmişlerdir. Allah
          onlarda bulunan her şeyi kuşatmış ve her şeyi bir bir saymıştır
        cid: 0