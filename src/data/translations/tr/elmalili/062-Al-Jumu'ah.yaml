surah_id: 62
language: tr
author: elmalili
verses:
  - verse: 1
    segments:
      - text: >-
          Göklerde ve yerde olanların hepsi padişah, mukaddes, azîz ve hakîm olan Allah'ı
          tesbih etmektedir.
        cid: 0
  - verse: 2
    segments:
      - text: >-
          O'dur ki ümmiler içinde, kendilerinden olan ve onlara Allah'ın âyetlerini
          okuyan, onları temizleyen, onlara kitap ve hikmeti öğreten bir Peygamber
          gönderdi. Oysa onlar, önceden apaçık bir sapıklık içinde idiler.
        cid: 0
  - verse: 3
    segments:
      - text: >-
          Henüz onlara katılmamış bulunan diğer insanlara da (o Peygamberi göndermiştir).
          O, çok güçlüdür, hüküm ve hikmet sahibidir.
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Bu, Allah'ın lütfudur. Allah, büyük lütuf sahibidir.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Kendilerine Tevrat yükletilip de sonra onu taşımayanların durumu, kitaplar
          taşıyan eşeğin durumu gibidir. Allah'ın âyetlerini yalanlayanların durumu ne
          kötüdür. Allah zalim toplumu doğru yola iletmez.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          De ki: "Ey Yahudi olanlar! Eğer insanlar arasında yalnız sizin, Allah'ın
          dostları olduğunuzu sanıyorsanız, o halde ölümü temenni edin, doğru iseniz?"
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Ama onlar, ellerinin (yapıp) öne sürdüğü (işler) yüzünden ölümü asla temenni
          etmezler. Allah zalimleri bilir.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          De ki: "Sizin kendisinden kaçtığınız ölüm, muhakkak sizi bulacaktır. Sonra
          görünmeyeni ve görüneni bilene döndürüleceksiniz. O size (bütün) yaptıklarınızı
          haber verecektir.
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Ey inananlar! Cuma günü namaz için çağrıldığı(nız) zaman, Allah'ı anmaya koşun,
          alışverişi bırakın. Eğer bilirseniz, bu sizin için daha hayırlıdır.
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Namaz kılındıktan sonra yeryüzüne dağılın ve Allah'ın lütfundan (nasibinizi)
          arayın. Allah'ı çok anın ki kurtuluşa eresiniz.
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Bir ticaret ve eğlence gördükleri zaman hemen dağılıp ona gittiler ve seni
          ayakta bıraktılar. De ki: "Allah'ın yanında bulunan, eğlenceden ve ticaretten de
          hayırlıdır. Allah, rızık verenlerin en hayırlısıdır."
        cid: 0