surah_id: 15
language: tr
author: elmalili
verses:
  - verse: 1
    segments:
      - text: >-
          Elif, Lâm, Râ. Bunlar kitabın ve apaçık bir Kur'ân'ın âyetleridir.
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Bir zaman gelecek ki inkâr edenler, keşke müslüman olsaydık temennisinde
          bulunacaklardır.
        cid: 0
  - verse: 3
    segments:
      - text: >-
          Onları bırak yesinler, içsinler, zevk alsınlar; arzu onları oyalasın ilerde
          bileceklerdir.
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Biz hiçbir memleketi (Allah katında) bilinen bir zamanı olmaksızın helak
          etmedik.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Hiçbir millet, ecelinin önüne geçemez ve onu geciktiremez.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Dediler ki: "Ey kendisine Kur'ân indirilen (Muhammed)! Sen mutlaka bir
          mecnunsun."
        cid: 0
  - verse: 7
    segments:
      - text: >-
          "Eğer peygamberlik davanda doğru kimselerdensen, bize melekleri getirmeliydin."
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Biz o melekleri ancak, hak ile indiririz. Ve indirildikleri vakit de onlara
          (kâfirlere) hiç mühlet verilmez.
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Hiç şüphe yok ki, Kur'ân'ı biz indirdik, elbette onu yine biz koruyacağız.
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Andolsun, senden önceki milletler arasında da peygamberler gönderdik.
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Onlara hiçbir peygamber gelmiyordu ki onunla alay etmiş olmasınlar.
        cid: 0
  - verse: 12
    segments:
      - text: >-
          Biz o küfrü suçluların kalbine işte böyle sokarız.
        cid: 0
  - verse: 13
    segments:
      - text: >-
          Kur'âna iman etmezler, halbuki öncekilerin sünneti (inanmadıkları için
          başlarına gelenler) gelip geçmiştir.
        cid: 0
  - verse: 14
    segments:
      - text: >-
          Onlara gökten bir kapı açsak da oradan yukarı çıksalar,
        cid: 0
  - verse: 15
    segments:
      - text: >-
          "Gözlerimiz perdelendi, daha doğrusu bize büyü yapılmıştır" derler.
        cid: 0
  - verse: 16
    segments:
      - text: >-
          Andolsun biz, gökte birtakım burçlar yarattık ve bakanlar için onu süsledik.
        cid: 0
  - verse: 17
    segments:
      - text: >-
          Ve göğü taşlanan bütün şeytanlardan koruduk.
        cid: 0
  - verse: 18
    segments:
      - text: >-
          Ancak kulak hırsızlığı eden şeytan hariç, onu apaçık bir alev sütunu takip
          eder.
        cid: 0
  - verse: 19
    segments:
      - text: >-
          Yeryüzünü düzgün bir şekilde yarattık ve oraya sabit dağlar yerleştirdik. Orada
          hikmetle ölçülmüş her şeyden bitkiler bitirdik.
        cid: 0
  - verse: 20
    segments:
      - text: >-
          Orada hem sizin için, hem de sizin rızıklarını veremediğiniz kimseler için
          geçim yollarını yarattık.
        cid: 0
  - verse: 21
    segments:
      - text: >-
          Her şeyin hazineleri yalnız bizim yanımızdadır. Fakat biz, onu ancak ihtiyaca
          göre, belli ölçülerde veririz.
        cid: 0
  - verse: 22
    segments:
      - text: >-
          Biz rüzgarları aşılayıcı olarak gönderdik ve gökten bir su indirip sizi onunla
          suladık. O suyu hazinelerde tutan da siz değilsiniz.
        cid: 0
  - verse: 23
    segments:
      - text: >-
          Elbette biz diriltiriz ve biz öldürürüz! Ve hepsinin varisleri de biziz.
        cid: 0
  - verse: 24
    segments:
      - text: >-
          Andolsun ki biz, içinizden İslâm'da öne geçmek isteyenleri de biliriz, geri
          kalmak isteyenleri de biliriz.
        cid: 0
  - verse: 25
    segments:
      - text: >-
          Şüphesiz Rabbin O'dur ki, onları kıyamet gününde hesaba çekmek için
          toplayacaktır. O, hikmet sahibidir, bilendir.
        cid: 0
  - verse: 26
    segments:
      - text: >-
          Andolsun ki biz insanı kuru bir çamurdan, şekillenmiş bir balçıktan yarattık.
        cid: 0
  - verse: 27
    segments:
      - text: >-
          Cinleri de daha önce insan vücudunun gözeneklerinden geçebilen güçlü bir
          ateşten yarattık.
        cid: 0
  - verse: 28
    segments:
      - text: >-
          Ey Peygamber! Rabbinin meleklere şöyle dediğini hatırla: "Ben, kuru balçıktan,
          şekil verilmiş kokuşmuş çamurdan bir insan yaratacağım."
        cid: 0
  - verse: 29
    segments:
      - text: >-
          Ben, onun yaratılışını tamamladığım ve ona ruhumdan üflediğim zaman, siz hemen
          onun için secdeye kapanın."
        cid: 0
  - verse: 30
    segments:
      - text: >-
          Bunun üzerine meleklerin hepsi toptan secde ettiler.
        cid: 0
  - verse: 31
    segments:
      - text: >-
          Yalnız İblis hariç. O secde edenlerle beraber olmaktan çekinmişti.
        cid: 0
  - verse: 32
    segments:
      - text: >-
          Allah buyurdu ki: "Ey İblis! Ne oluyor sana da, secde edenlerle beraber
          olmuyorsun?"
        cid: 0
  - verse: 33
    segments:
      - text: >-
          İblis şöyle dedi: "Kuru bir çamurdan, şekillenmiş bir balçıktan yarattığın bir
          insana secde edemezdim."
        cid: 0
  - verse: 34
    segments:
      - text: >-
          Allah şöyle buyurdu: "Öyle ise oradan çık! Sen, artık kovulmuş birisin."
        cid: 0
  - verse: 35
    segments:
      - text: >-
          "Kıyamet gününe kadar lanet senin üzerindedir."
        cid: 0
  - verse: 36
    segments:
      - text: >-
          İblis: "Rabbim! Öyle ise insanların kabirlerinden kaldırılacakları güne
          (kıyamete) kadar bana mühlet ver" dedi.
        cid: 0
  - verse: 37
    segments:
      - text: >-
          Allah buyurdu ki: "Sen mühlet verilenlerdensin."
        cid: 0
  - verse: 38
    segments:
      - text: >-
          "Allah katında bilinen vaktin gününe kadar..."
        cid: 0
  - verse: 39
    segments:
      - text: >-
          İblis şöyle dedi: "Rabbim! Beni saptırdığın için, mutlaka ben de yeryüzünde
          onlara günahları süsleyeceğim ve onların hepsini mutlaka azdıracağım!"
        cid: 0
  - verse: 40
    segments:
      - text: >-
          "Ancak içlerinden ihlaslı kulların müstesnâdır."
        cid: 0
  - verse: 41
    segments:
      - text: >-
          Allah şöyle buyurdu: "İşte bana ulaşan dosdoğru yol budur."
        cid: 0
  - verse: 42
    segments:
      - text: >-
          "Sana uyan azgınlardan başka, kullarımın üzerinde hiçbir nüfuzun yoktur."
        cid: 0
  - verse: 43
    segments:
      - text: >-
          "Şüphesiz ki onların hepsine vaad edilen yer cehennemdir."
        cid: 0
  - verse: 44
    segments:
      - text: >-
          "Cehennemin yedi kapısı vardır. O kapıların herbiri için birer grup
          ayrılmıştır."
        cid: 0
  - verse: 45
    segments:
      - text: >-
          Allahtan korkanlar, elbette cennetlerde ve pınarların başındadırlar.
        cid: 0
  - verse: 46
    segments:
      - text: >-
          Onlara: "Selametle güven içinde oraya girin" denir.
        cid: 0
  - verse: 47
    segments:
      - text: >-
          Biz o cennetliklerin kalblerindeki kinleri çıkarır atarız. Hepsi kardeşler
          olarak sevinç içinde karşılıklı koltuklara otururlar.
        cid: 0
  - verse: 48
    segments:
      - text: >-
          Orada kendilerine hiçbir yorgunluk gelmeyecek. Oradan çıkarılacak da
          değillerdir.
        cid: 0
  - verse: 49
    segments:
      - text: >-
          Kullarıma haber ver ki, gerçekten ben çok bağışlayıcı ve pek merhamet ediciyim.
        cid: 0
  - verse: 50
    segments:
      - text: >-
          Bununla beraber azabım da çok acıklı bir azabdır. Bunları geçmişten bazı
          örneklerle açıklamak üzere:
        cid: 0
  - verse: 51
    segments:
      - text: >-
          Hem o kullara, İbrahim'in misafirlerinden de haber ver.
        cid: 0
  - verse: 52
    segments:
      - text: >-
          Hani melekler, İbrahim'in yanına girdikleri zaman, "selam" demişler, İbrahim de
          onlara: "Biz sizden korkuyoruz" demişti.
        cid: 0
  - verse: 53
    segments:
      - text: >-
          Melekler: "Korkma! Gerçekten biz sana bilgin bir oğul müjdeliyoruz" dediler.
        cid: 0
  - verse: 54
    segments:
      - text: >-
          İbrahim dedi ki: "Bana ihtiyarlık gelmişken, beni mi müjdeliyorsunuz, neye
          dayanarak beni müjdeliyorsunuz?"
        cid: 0
  - verse: 55
    segments:
      - text: >-
          Melekler: "Seni gerçekle müjdeliyoruz. Sakın Allah'ın rahmetinden ümidini
          kesenlerden olma!" dediler.
        cid: 0
  - verse: 56
    segments:
      - text: >-
          İbrahim dedi ki: "Rabbimin rahmetinden, sapıklardan başka kim ümit keser?"
        cid: 0
  - verse: 57
    segments:
      - text: >-
          "Ey elçiler! Başka ne işiniz var?" dedi.
        cid: 0
  - verse: 58
    segments:
      - text: >-
          Melekler şöyle dediler: "Biz suçlu bir kavmi cezalandırmak için gönderildik.
        cid: 0
  - verse: 59
    segments:
      - text: >-
          Ancak Lût ailesi müstesnâdır. Biz, onların hepsini muhakkak kurtaracağız.
        cid: 0
  - verse: 60
    segments:
      - text: >-
          Yalnız Lût'un karısı müstesnâ, çünkü onun helak edilenlerle birlikte yok
          edilmesini takdir ettik.
        cid: 0
  - verse: 61
    segments:
      - text: >-
          Melek olan elçiler, Lût kavmine gelince,
        cid: 0
  - verse: 62
    segments:
      - text: >-
          Lût dedi ki: "Doğrusu siz ürkülecek bir kavimsiniz."
        cid: 0
  - verse: 63
    segments:
      - text: >-
          Elçiler dediler ki: "Bilakis biz sana onların şüphe ettiği azabı getirdik."
        cid: 0
  - verse: 64
    segments:
      - text: >-
          "Sana gerçeği getirdik; biz elbette doğru söylüyoruz."
        cid: 0
  - verse: 65
    segments:
      - text: >-
          "Gecenin bir bölümünde aileni yola çıkar, sen de arkalarından yürü ve sizden
          kimse ardına bakmasın; istenen yere gidin."
        cid: 0
  - verse: 66
    segments:
      - text: >-
          Biz, Lût'a şu kesin emri vahyettik: "Bu kâfirler sabaha çıkarken muhakkak
          kökleri kesilmiş olacaktır."
        cid: 0
  - verse: 67
    segments:
      - text: >-
          Şehir halkı, insan şeklindeki güzel yüzlü melekleri görünce, onlara iğrenç
          işlerini yapabileceklerini düşünüp sevinerek geldiler.
        cid: 0
  - verse: 68
    segments:
      - text: >-
          Lût, kavmine şöyle dedi: "Bunlar benim misafirlerimdir, beni rüsvay etmeyin."
        cid: 0
  - verse: 69
    segments:
      - text: >-
          "Allah'tan korkun! Beni mahcub etmeyin."
        cid: 0
  - verse: 70
    segments:
      - text: >-
          Lût kavmi şöyle dedi: "Biz sana kimsenin koruyuculuğunu yapmamanı söylememiş
          miydik?"
        cid: 0
  - verse: 71
    segments:
      - text: >-
          Lût şöyle dedi: "İşte kızlarım! Düşündüğünüzü yapacaksanız (onlarla evlenin).
        cid: 0
  - verse: 72
    segments:
      - text: >-
          Resulüm! Ömrüne yemin olsun ki gerçekten onlar, sarhoşlukları içinde bocalayıp
          duruyorlardı.
        cid: 0
  - verse: 73
    segments:
      - text: >-
          Güneş doğarken o korkunç çığlık onları yakaladı.
        cid: 0
  - verse: 74
    segments:
      - text: >-
          Biz, onların şehirlerinin üstünü altına geçirdik ve üzerlerine de balçıktan
          pişirilmiş taşlar yağdırdık.
        cid: 0
  - verse: 75
    segments:
      - text: >-
          Gerçekten bunda, düşünen keskin anlayışlılar için ibretler vardır.
        cid: 0
  - verse: 76
    segments:
      - text: >-
          Hem o Lût kavminin bulunduğu şehir harabesi bir yol üzerinde bulunmaktadır.
        cid: 0
  - verse: 77
    segments:
      - text: >-
          Şüphesiz ki, bunda iman edenler için bir ibret vardır.
        cid: 0
  - verse: 78
    segments:
      - text: >-
          Eyke halkı da gerçekten zalimlerdi.
        cid: 0
  - verse: 79
    segments:
      - text: >-
          Biz Eyke halkından da intikâm aldık. İkisi de (Eyke ve Medyen) açık bir yol
          üzerindedir.
        cid: 0
  - verse: 80
    segments:
      - text: >-
          Şüphesiz ki, Hıcr halkı da peygamberleri yalanladılar.
        cid: 0
  - verse: 81
    segments:
      - text: >-
          Biz, onlara âyetlerimizi vermiştik de onlar, yüz çeviriyorlardı
        cid: 0
  - verse: 82
    segments:
      - text: >-
          Onlar, dağlardan emniyetli emniyetli evler yontuyorlardı.
        cid: 0
  - verse: 83
    segments:
      - text: >-
          Onları da sabahleyin korkunç bir çığlık yakaladı.
        cid: 0
  - verse: 84
    segments:
      - text: >-
          Kazanmakta oldukları şeyler, onlardan hiçbir zararı savmadı.
        cid: 0
  - verse: 85
    segments:
      - text: >-
          Biz gökleri, yeri ve aralarındaki varlıkları ancak hak ve hikmetle yarattık ve
          elbette ki, kıyamet kopacaktır. (Ey Peygamber!) Şimdi sen onlara yumuşak davran
          ve güzel muamele et.
        cid: 0
  - verse: 86
    segments:
      - text: >-
          Şüphesiz Rabbin kemaliyle yaratandır ve iyi bilendir.
        cid: 0
  - verse: 87
    segments:
      - text: >-
          Andolsun ki, biz sana tekrarlanan yedi âyeti (Fatihayı) ve yüce Kur'ân'ı
          verdik.
        cid: 0
  - verse: 88
    segments:
      - text: >-
          Sakın o kâfirlerden birtakımlarına verip de kendilerini zevklendirdiğimiz şeye
          (mal ve servete) heveslenip göz dikeyim deme. Onlardan dolayı üzülme. Müminlere
          merhamet kanatlarını indir.
        cid: 0
  - verse: 89
    segments:
      - text: >-
          De ki: "Şüphesiz ben apaçık bir uyarıcıyım."
        cid: 0
  - verse: 90
    segments:
      - text: >-
          (İnanmazsanız başınıza) tıpkı o taksimcilere (yahudi ve hıristiyanlara)
          indirdiğimiz azap gibi (bir azab inecektir).
        cid: 0
  - verse: 91
    segments:
      - text: >-
          Onlar, Kur'ân'ın bir kısmına inanıp bir kısmına inanmayarak onu kısım kısım
          böldüler.
        cid: 0
  - verse: 92
    segments:
      - text: >-
          Rabbin hakkı için biz, mutlaka onların hepsini yaptıklarından dolayı hesaba
          çekeceğiz.
        cid: 0
  - verse: 93
    segments:
      - text: >-
          Rabbin hakkı için biz, mutlaka onların hepsini yaptıklarından dolayı hesaba
          çekeceğiz.
        cid: 0
  - verse: 94
    segments:
      - text: >-
          Şimdi sen emrolunduğunu açıkça tebliğ et. Müşriklerden yüz çevir.
        cid: 0
  - verse: 95
    segments:
      - text: >-
          Muhakkak ki alay edenlere karşı biz sana yeteriz.
        cid: 0
  - verse: 96
    segments:
      - text: >-
          Onlar Allah ile birlikte başkasını ilâh edinenlerdir. Onlar yakında
          bileceklerdir.
        cid: 0
  - verse: 97
    segments:
      - text: >-
          Gerçekten biliriz ki, onların söylediklerine göğsün daralıyor.
        cid: 0
  - verse: 98
    segments:
      - text: >-
          O halde Rabbini hamd ile tesbih et. Ve secde edenlerden ol.
        cid: 0
  - verse: 99
    segments:
      - text: >-
          Ve sana ölüm gelinceye kadar Rabbine ibadet et.
        cid: 0