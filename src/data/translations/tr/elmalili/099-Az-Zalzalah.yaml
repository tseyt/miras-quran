surah_id: 99
language: tr
author: elmalili
verses:
  - verse: 1
    segments:
      - text: "Yer o yaman sarsıntı ile sarsıldığı,"
        cid: 0
  - verse: 2
    segments:
      - text: "Yer, içindeki ağırlıkları çıkarıp dışarı attığı,"
        cid: 0
  - verse: 3
    segments:
      - text: "Ve insan: \"Ona ne oluyor?\" dediği zaman."
        cid: 0
  - verse: 4
    segments:
      - text: "O gün yer, Rabbinin ona vahyetmesiyle haberlerini anlatacaktır."
        cid: 0
  - verse: 5
    segments:
      - text: "O gün yer, Rabbinin ona vahyetmesiyle haberlerini anlatacaktır."
        cid: 0
  - verse: 6
    segments:
      - text: "O gün insanlar, amellerinin karşılığı kendilerine gösterilmek üzere bölük bölük çıkacaklardır."
        cid: 0
  - verse: 7
    segments:
      - text: "Her kim zerre kadar hayır işlemişse onu görecektir."
        cid: 0
  - verse: 8
    segments:
      - text: "Her kim, zerre kadar şer işlemişse onu görecektir."
        cid: 0