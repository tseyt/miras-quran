surah_id: 53
language: tr
author: elmalili
verses:
  - verse: 1
    segments:
      - text: >-
          İnmekte olan yıldıza andolsun ki,
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Arkadaşınız (Muhammed) sapmadı, azmadı.
        cid: 0
  - verse: 3
    segments:
      - text: >-
          O, hevâdan (arzularına göre) konuşmaz.
        cid: 0
  - verse: 4
    segments:
      - text: >-
          O(nun konuşması kendisine ) vahyedilenden başkası değildir.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Onu, müthiş kuvvetleri olan biri öğretti
        cid: 0
  - verse: 6
    segments:
      - text: >-
          (Ki o) akıl ve görüşünde kuvvetli (bir melek)dir. Hemen (gerçek meleklik
          şekliyle) doğruldu.
        cid: 0
  - verse: 7
    segments:
      - text: >-
          O, en yüksek ufukta idi.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Sonra (Cebrail ona) yaklaştı ve (aşağıya doğru) sarktı.
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Onunla arasındaki mesafe, iki yay kadar, yahut daha az kaldı.
        cid: 0
  - verse: 10
    segments:
      - text: >-
          (Allah), kuluna verdiği vahyi verdi.
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Onun gördüğünü kalb(i) yalanlamadı.
        cid: 0
  - verse: 12
    segments:
      - text: >-
          Onun gördükleri hakkında şimdi kendisi ile tartışacak mısınız.
        cid: 0
  - verse: 13
    segments:
      - text: >-
          Andolsun onu bir kez daha görmüştü.
        cid: 0
  - verse: 14
    segments:
      - text: >-
          Sidretü'lMüntehâ'nın yanında.
        cid: 0
  - verse: 15
    segments:
      - text: >-
          Ki Cennetü'lMe'vâ onun yanındadır.
        cid: 0
  - verse: 16
    segments:
      - text: >-
          Sidre'yi kaplayan kaplıyordu.
        cid: 0
  - verse: 17
    segments:
      - text: >-
          (Peygamberin) gözü şaşmadı ve sınırı aşmadı.
        cid: 0
  - verse: 18
    segments:
      - text: >-
          Andolsun ki o, Rabbinin âyetlerinden en büyüğünü gördü.
        cid: 0
  - verse: 19
    segments:
      - text: >-
          Siz de gördünüz değil mi o Lât ve Uzza'yı?
        cid: 0
  - verse: 20
    segments:
      - text: >-
          Ve üçüncü olarak da öteki (put) Menat'ı?
        cid: 0
  - verse: 21
    segments:
      - text: >-
          Size erkek O'na dişi öyle mi?
        cid: 0
  - verse: 22
    segments:
      - text: >-
          Öyle ise bu çok insafsızca bir taksim.
        cid: 0
  - verse: 23
    segments:
      - text: >-
          Onlar hiçbir şey değil, sırf sizin ve babalarınızın taktığınız (boş)
          isimlerdir. Allah onlar hakkında hiçbir delil indirmedi. Onlar yalnız zanna ve
          nefislerin sevdasına uyuyorlar. Halbuki onlara Rableri tarafından yol gösterici
          gelmiştir.
        cid: 0
  - verse: 24
    segments:
      - text: >-
          Yoksa her arzu ettiği şey, insanın kendisinin mi (olacak) dir?
        cid: 0
  - verse: 25
    segments:
      - text: >-
          Son da ilk de (ahiret de dünya da) Allah'ındır.
        cid: 0
  - verse: 26
    segments:
      - text: >-
          Göklerde nice melek var ki Allah'ın dileyip razı olduğuna izin vermeden önce
          onların şefaatları hiç bir işe yaramaz.
        cid: 0
  - verse: 27
    segments:
      - text: >-
          Ahirete iman etmeyenler meleklere dişilerin adlarını takıp duruyorlar
        cid: 0
  - verse: 28
    segments:
      - text: >-
          Onların bu hususta bir bilgileri yoktur. Sadece zanna uyuyorlar. Zan ise,
          şüphesiz hakikat bakımından birşey ifade etmez.
        cid: 0
  - verse: 29
    segments:
      - text: >-
          Onun için bizi anmaktan yüz çeviren ve dünya hayatından başka bir şey
          istemeyenlerden yüz çevir.
        cid: 0
  - verse: 30
    segments:
      - text: >-
          İşte onların ilimden erişebilecekleri (son sınır) budur. Şüphesiz, Rabbin,
          yolundan sapanı da iyi bilir; O, hidayette olanı da iyi bilir.
        cid: 0
  - verse: 31
    segments:
      - text: >-
          Göklerde ve yerde bulunanlar hep Allah'ındır. Akıbet (sonuçta) kötülük
          yapanları yaptıkları ile cezalandıracak, güzel davrananları da daha güzeliyle
          mükafatlandıracaktır.
        cid: 0
  - verse: 32
    segments:
      - text: >-
          Onlar ki günahın büyüklerinden ve çirkin işlerden kaçınırlar, yalnız bazı küçük
          kusurlar hariç. Şüphesiz Rabbinin affı geniştir. O, sizi daha topraktan
          yarattığı zaman ve siz annelerinizin karınlarında bulunduğunuz sırada, sizi en
          iyi bilendir. Bunun için kendinizi temize çıkarmayın. Çünkü O, kötülükten
          sakınanı daha iyi bilir.
        cid: 0
  - verse: 33
    segments:
      - text: >-
          Şimdi gördün mü O yüz çevireni?
        cid: 0
  - verse: 34
    segments:
      - text: >-
          Azıcık verip (sonra vermemekte) direneni?
        cid: 0
  - verse: 35
    segments:
      - text: >-
          Gaybın bilgisi kendi yanındadır da, o mu görüyor?
        cid: 0
  - verse: 36
    segments:
      - text: >-
          Yoksa haber verilmedi mi Musa'nın sahifelerinde yazılı olanlar?
        cid: 0
  - verse: 37
    segments:
      - text: >-
          Ve çok vefakâr olan İbrahim'in sahifelerindekiler?
        cid: 0
  - verse: 38
    segments:
      - text: >-
          Ki hiçbir günahkâr başkasının günah yükünü yüklenmez.
        cid: 0
  - verse: 39
    segments:
      - text: >-
          Doğrusu insana çalışmasından başka bir şey yoktur.
        cid: 0
  - verse: 40
    segments:
      - text: >-
          Ve çalışması da yakında görülecektir.
        cid: 0
  - verse: 41
    segments:
      - text: >-
          Sonra ona karşılığı tastamam verilecektir.
        cid: 0
  - verse: 42
    segments:
      - text: >-
          Ve şüphesiz en son varış, Rabbinedir.
        cid: 0
  - verse: 43
    segments:
      - text: >-
          Doğrusu güldüren de ağlatan da O'dur.
        cid: 0
  - verse: 44
    segments:
      - text: >-
          Öldüren de dirilten de O'dur.
        cid: 0
  - verse: 45
    segments:
      - text: >-
          Şüphesiz erkeği, dişiyi iki eş yaratan O'dur,
        cid: 0
  - verse: 46
    segments:
      - text: >-
          Atıldığı zaman bir nutfeden.
        cid: 0
  - verse: 47
    segments:
      - text: >-
          Şüphesiz tekrar diriltmek de O'na aittir.
        cid: 0
  - verse: 48
    segments:
      - text: >-
          Şüphesiz zengin eden de sermaye veren de O'dur.
        cid: 0
  - verse: 49
    segments:
      - text: >-
          Doğrusu Şi'râ yıldızının Rabbi O'dur.
        cid: 0
  - verse: 50
    segments:
      - text: >-
          O, helak etti önce gelen Âd'ı.
        cid: 0
  - verse: 51
    segments:
      - text: >-
          Ve Semûd'u da bırakmadı.
        cid: 0
  - verse: 52
    segments:
      - text: >-
          Önceden de Nuh kavmini (helak etmişti), çünkü onlar zulmetmiş ve azmıştı.
        cid: 0
  - verse: 53
    segments:
      - text: >-
          Altı üstüne getirilmiş şehirleri devirip yıktı.
        cid: 0
  - verse: 54
    segments:
      - text: >-
          Onları neler kapladı neler!
        cid: 0
  - verse: 55
    segments:
      - text: >-
          O halde Rabbinin hangi nimetinden kuşku duyuyorsun.
        cid: 0
  - verse: 56
    segments:
      - text: >-
          Bu da ilk uyarıcılardan bir uyarıcıdır.
        cid: 0
  - verse: 57
    segments:
      - text: >-
          Yaklaşan yaklaştı.
        cid: 0
  - verse: 58
    segments:
      - text: >-
          Onu Allah'tan başka açığa çıkaracak yoktur.
        cid: 0
  - verse: 59
    segments:
      - text: >-
          Şimdi siz bu sözden mi hayret ediyorsunuz?
        cid: 0
  - verse: 60
    segments:
      - text: >-
          Gülüyorsunuz da ağlamıyorsunuz?
        cid: 0
  - verse: 61
    segments:
      - text: >-
          Ve siz mi kafa tutuyorsunuz ey gafiller?
        cid: 0
  - verse: 62
    segments:
      - text: >-
          Haydi Allah için secdeye kapanın ve O'na kulluk edin.
        cid: 0