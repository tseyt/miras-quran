surah_id: 49
language: tr
author: elmalili
verses:
  - verse: 1
    segments:
      - text: "Ey iman edenler! Allah'ın ve Resulünün huzurunda öne geçmeyin. Allah'tan korkun. Şüphesiz Allah işitendir, bilendir."
        cid: 0
  - verse: 2
    segments:
      - text: "Ey iman edenler! Seslerinizi Peygamber'in sesinden fazla yükseltmeyin. Birbirinize bağırdığınız gibi, Peygamber'e yüksek sesle bağırmayın. Öyle yaparsanız, siz farkına varmadan amelleriniz boşa gider."
        cid: 0
  - verse: 3
    segments:
      - text: "Allah'ın elçisinin huzurunda seslerini kısanlar, şüphesiz Allah'ın kalplerini takva ile imtihan ettiği kimselerdir. Onlara mağfiret ve büyük bir mükâfat vardır."
        cid: 0
  - verse: 4
    segments:
      - text: "(Resülüm!) Sana odaların arkasından bağıranların çokları, aklı ermez kimselerdir."
        cid: 0
  - verse: 5
    segments:
      - text: "Eğer onlar, sen yanlarına çıkıncaya kadar sabretselerdi, elbette kendileri için daha iyi olurdu. Bununla beraber Allah çok bağışlayan, çok merhamet edendir."
        cid: 0
  - verse: 6
    segments:
      - text: "Ey iman edenler! Eğer fasıkın biri size bir haber getirirsen onun doğruluğunu araştırın. Yoksa bilmeden bir topluluğa sataşırsınız da sonra yaptığınızdan pişman olursunuz."
        cid: 0
  - verse: 7
    segments:
      - text: "Hem bilin ki, içinizde Allah'ın elçisi vardır. Şayet o, birçok işlerde size uysaydı, sıkıntıya düşerdiniz. Fakat Allah size imanı sevdirmiş ve onu kalplerinize zinet yapmıştır. Küfrü, fasıklığı ve isyanı da size çirkin göstermiştir. İşte doğru yolda olanlar bunlardır."
        cid: 0
  - verse: 8
    segments:
      - text: "Bu, Allah'tan bir lütuf ve nimettir. Allah herşeyi bilir, hüküm ve hikmet sahibidir."
        cid: 0
  - verse: 9
    segments:
      - text: "Eğer müminlerden iki grup birbirleriyle vuruşurlarsa aralarını düzeltin. Şayet biri ötekine saldırırsa, Allah'ın buyruğuna dönünceye kadar saldıran tarafla savaşın. Eğer dönerse aralarını adaletle düzeltin ve (her işte) adaletli davranın. Şüphesiz ki Allah, adil davrananları sever."
        cid: 0
  - verse: 10
    segments:
      - text: "Müminler ancak kardeştirler. Öyleyse kardeşlerinizin arasını düzeltin ve Allah'tan korkun ki rahmete eresiniz."
        cid: 0
  - verse: 11
    segments:
      - text: "Ey iman edenler! Bir topluluk diğer bir toplulukla alay etmesin. Belki de onlar, kendilerinden daha iyidirler. Kadınlar da kadınları alaya almasınlar. Belki onlar kendilerinden daha iyidirler. Kendi kendinizi ayıplamayın, birbirinizi kötü lakaplarla çağırmayın. İmandan sora fâsıklık ne kötü bir isimdir! Kim de tevbe etmezse işte bu kimseler zalimlerdir."
        cid: 0
  - verse: 12
    segments:
      - text: "Ey iman edenler! Zannın bir çoğundan kaçının. Çünkü zannın bir kısmı günahtır. Birbirinizin kusurunu araştırmayın. Biriniz diğerini arkasından çekiştirmesin. Biriniz, ölmüş kardeşinin etini yemekten hoşlanır mı? İşte bundan tiksindiniz. O halde Allah'tan korkun. Şüphesiz Allah, tevbeyi çok kabul edendir, çok merhamet edendir."
        cid: 0
  - verse: 13
    segments:
      - text: "Ey insanlar! Doğrusu biz sizi bir erkekle bir dişiden yarattık. Ve birbirinizle tanışmanız için sizi milletlere ve kabilelere ayırdık. Muhakkak ki Allah yanında en değerli ve en üstününüz O'ndan en çok korkanınızdır. Şüphesiz Allah bilendir, herşeyden haberdar olandır."
        cid: 0
  - verse: 14
    segments:
      - text: "Bedevîler \"inandık\" dediler. De ki: Siz iman etmediniz ama \"İslâm olduk.\" deyin. Henüz iman kalplerinize yerleşmedi. Eğer Allah'a ve Resulüne itaat ederseniz, Allah işlerinizden hiçbir şeyi eksiltmez. Çünkü Allah çok bağışlayan, çok merhamet edendir."
        cid: 0
  - verse: 15
    segments:
      - text: "Gerçek müminler ancak Allah'a ve Resulüne iman eden, ondan sonra asla şüpheye düşmeyen, Allah yolunda mallarıyla ve canlarıyla savaşanlardır. İşte doğrular ancak onlardır."
        cid: 0
  - verse: 16
    segments:
      - text: "De ki: Siz dininizi Allah'a mı öğretiyorsunuz? Oysa Allah göklerde olanları da bilir, yerde olanları da. Allah herşeyi hakkıyla bilendir."
        cid: 0
  - verse: 17
    segments:
      - text: "Onlar İslâm'a girdikleri için sana minnet ediyorlar. De ki: Müslümanlığınızı benim başıma kakmayın. Bilakis sizi imana erdirdiği için Allah sizin başınıza kakar. Eğer doğrulardan iseniz (Allah'a minnettar olmanız gerekir.)"
        cid: 0
  - verse: 18
    segments:
      - text: "Şüphesiz Allah, göklerin ve yerin görülmeyen esrarını bilir. Allah yaptıklarınızı görür."
        cid: 0