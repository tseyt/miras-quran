surah_id: 95
language: tr
author: elmalili
verses:
  - verse: 1
    segments:
      - text: >-
          Tîn'e ve Zeytun'a,
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Sina dağına
        cid: 0
  - verse: 3
    segments:
      - text: >-
          Ve bu güvenli beldeye andolsun ki,
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Biz insanı en güzel biçimde yarattık.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Sonra da çevirdik aşağıların aşağısına attık.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Ancak iman edip iyi işler yapanlar başka; onlar için kesintisiz bir ecir
          vardır.
        cid: 0
  - verse: 7
    segments:
      - text: >-
          O halde sana dini ne yalanlatır?
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Allah, hakimlerin hakimi değil mi?
        cid: 0