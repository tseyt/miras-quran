surah_id: 98
language: tr
author: elmalili
verses:
  - verse: 1
    segments:
      - text: "Kitap ehlinden ve müşriklerden (Hakk'ı) tanımayanlar, kendilerine açık delil gelinceye kadar inkârlarından ayrılacak değillerdi."
        cid: 0
  - verse: 2
    segments:
      - text: "(Bu delil), tertemiz sayfaları okuyan, Allah tarafından gönderilmiş bir peygamberdir."
        cid: 0
  - verse: 3
    segments:
      - text: "O sayfalarda, en doğru hükümler vardır."
        cid: 0
  - verse: 4
    segments:
      - text: "Kitap ehli, ancak kendilerine apaçık delil geldikten sonra ayrılığa düştüler."
        cid: 0
  - verse: 5
    segments:
      - text: "Halbuki onlar, dini sadece Allah'a tahsis ederek, Allah'ı birleyerek, ancak Allah'a ibadet etmekle, namazı kılmakla ve zekatı vermekle emrolunmuşlardır. İşte dosdoğru din budur."
        cid: 0
  - verse: 6
    segments:
      - text: "Kâfirler, gerek kitap ehlinden olsun gerek puta tapanlardan olsun muhakkak, cehennem ateşindedirler. Orada ebedî olarak kalacaklardır. Onlar, insanların en şerlileridir."
        cid: 0
  - verse: 7
    segments:
      - text: "İnanan ve güzel amel işleyenler de insanların en hayırlılarıdır."
        cid: 0
  - verse: 8
    segments:
      - text: "Rableri katında onların mükâfatı, altlarından ırmaklar akan Adn cennetleridir. Orada ebedî olarak kalacaklardır. Allah onlardan razı olmuş, onlar da O'ndan razı olmuşlardır. İşte bu mükâfat, Rabbine saygı gösterene mahsustur."
        cid: 0