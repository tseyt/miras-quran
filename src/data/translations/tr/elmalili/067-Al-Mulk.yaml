surah_id: 67
language: tr
author: elmalili
verses:
  - verse: 1
    segments:
      - text: >-
          Mutlak hükümranlık elinde bulunan Allah, yüceler yücesidir ve O'nun her şeye
          gücü yeter.
        cid: 0
  - verse: 2
    segments:
      - text: >-
          O, hanginizin daha güzel iş yapacağınızı denemek için ölümü ve hayatı yarattı.
          O, üstündür, bağışlayandır.
        cid: 0
  - verse: 3
    segments:
      - text: >-
          O, yedi göğü, birbiri üzerine yarattı. Rahmân'ın yaratmasında bir aykırılık,
          uygunsuzluk görmezsin. Gözünü döndür de bak, bir bozukluk görüyor musun?
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Sonra gözünü tekrar tekrar döndür (bak). Göz (aradığı bozukluğu bulmaktan) âciz
          ve bitkin halde sana dönecektir.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Andolsun biz, en yakın göğü kandillerle donattık ve onları, şeytanlar için
          taşlamalar yaptık. Ve onlar için alevli ateş azabını hazırladık.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Rablerini inkâr edenler için cehennem azabı vardır. Ne kötü gidilecek yerdir o!
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Oraya atıldıklarında, onun kaynarken çıkardığı uğultuyu işitirler.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Az daha öfkeden çatlayacak. Her ne zaman oraya bir topluluk atılsa, onun
          bekçileri onlara: "Size korkutucu bir peygamber gelmemiş miydi?" diye sorarlar.
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Derler: "Evet, bize uyarıcı geldi ama biz yalanladık ve Allah hiçbir şey
          indirmedi, siz ancak büyük bir sapıklık içindesiniz." dedik.
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Ve derler ki: "Eğer biz dinleseydik, yahut düşünüp anlasaydık şu çılgın ateşin
          halkı arasında bulunmazdık!"
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Böylece günahlarını itiraf ederler. (Artık) o çılgın ateş halkı (Allah'ın
          rahmetinden) uzak olsunlar!
        cid: 0
  - verse: 12
    segments:
      - text: >-
          Fakat daha görmeden Rablerinden korkanlar var ya, işte onlar için bağışlanma ve
          büyük bir mükâfat vardır.
        cid: 0
  - verse: 13
    segments:
      - text: >-
          Sözünüzü ister gizleyin, ister açığa vurun; bilin ki, O, göğüslerin özünü
          bilir.
        cid: 0
  - verse: 14
    segments:
      - text: >-
          Hiç yaratan bilmez mi? O, en ince işleri görüp bilmektedir ve her şeyden
          haberdardır.
        cid: 0
  - verse: 15
    segments:
      - text: >-
          O size yeri boyun eğer kıldı. Haydi onun omuzlarında (dağlarında, tepelerinde)
          yürüyün ve Allah'ın rızkından yeyin. Dönüş ancak O'nadır.
        cid: 0
  - verse: 16
    segments:
      - text: >-
          Her şeyi kuşatmış olan Allah ın yeri sizinle birlikte göçürüvermesinden emin
          misiniz? O zaman yer çalkalanıyordur.
        cid: 0
  - verse: 17
    segments:
      - text: >-
          Yoksa siz, gökte olanın üzerinize taş yağdıran bir kasırga göndermeyeceğinden
          emin misiniz? Tehdidim nasılmış bileceksiniz.
        cid: 0
  - verse: 18
    segments:
      - text: >-
          Andolsun, onlardan öncekiler de yalanladılar. Ama beni inkâr nasıl oldu?
        cid: 0
  - verse: 19
    segments:
      - text: >-
          Üstlerinde kanatlarını açıp yumarak uçan kuşları görmüyorlar mı? Onları
          Rahmân'dan başkası tutmuyor. Doğrusu O, her şeyi görmektedir.
        cid: 0
  - verse: 20
    segments:
      - text: >-
          Rahmân olan Allah'a karşı şu size yardım edecek askerleriniz hani kimlerdir?
          İnkârcılar, ancak derin bir gaflet içinde bulunmaktadırlar.
        cid: 0
  - verse: 21
    segments:
      - text: >-
          Allah size verdiği rızkı kesiverse, size rızık verecek olabilen kimdir? Hayır,
          onlar azgınlık ve nefrette direnip durmaktadırlar.
        cid: 0
  - verse: 22
    segments:
      - text: >-
          Şimdi yüz üstü kapanarak yürüyen mi doğru gider, yoksa dosdoğru yolda yürüyen
          mi?
        cid: 0
  - verse: 23
    segments:
      - text: >-
          De ki: "Sizi yaratan, size kulaklar gözler ve gönüller veren O'dur. Ne kadar az
          şükrediyorsunuz!"
        cid: 0
  - verse: 24
    segments:
      - text: >-
          De ki: "Sizi yerden üreten O'dur ve O'na toplanıp götürüleceksiniz."
        cid: 0
  - verse: 25
    segments:
      - text: >-
          (Onlar): "Doğru iseniz bu tehdit ne zaman olacak?" diyorlar
        cid: 0
  - verse: 26
    segments:
      - text: >-
          De ki: "(O'na ait) bilgi, Allah'ın yanındadır. Ben ancak apaçık bir
          uyarıcıyım."
        cid: 0
  - verse: 27
    segments:
      - text: >-
          Onu yakın görünce inkâr edenlerin yüzleri kötüleşti. Ve: "İşte çağırıp
          durduğunuz şey budur!" dendi.
        cid: 0
  - verse: 28
    segments:
      - text: >-
          De ki: "Baksanıza, eğer Allah beni ve benimle beraber olanları öldürse, yahut
          bize merhamet etse, kâfirleri acı bir azabdan kim kurtarabilir?
        cid: 0
  - verse: 29
    segments:
      - text: >-
          De ki: "O çok merhametlidir. O'na inanmış, O'na dayanmışızdır. Yakında kimin
          apaçık bir sapıklık içinde olduğunu bileceksiniz."
        cid: 0
  - verse: 30
    segments:
      - text: >-
          De ki: "Baksanıza, eğer suyunuz çekilse, size kim bir akarsu getirebilir?"
        cid: 0