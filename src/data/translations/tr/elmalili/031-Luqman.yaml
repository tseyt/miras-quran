surah_id: 31
language: tr
author: elmalili
verses:
  - verse: 1
    segments:
      - text: >-
          Elif, Lâm, Mîm.
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Bunlar, o hikmetli kitabın âyetleridir.
        cid: 0
  - verse: 3
    segments:
      - text: >-
          O, güzellik ve iyilik yapanlar için bir hidayet ve rahmettir.
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Onlar, namazı kılarlar, zekatı verirler, âhirete de kesin olarak inanırlar.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          İşte bunlar, Rableri tarafından bir hidayet üzeredirler. Kurtuluşa erecek
          olanlar da işte onlardır.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Bayağı insanlardan kimi de vardır ki, bilgisizce Allah yolundan saptırmak ve
          onu eğlence yerine tutmak için laf eğlencesi (veya boş söz) satın alırlar. İşte
          onlar için aşağılayıcı bir azab vardır.
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Onun karşısında âyetlerimiz okunduğu zaman da sanki onları işitmemiş, sanki
          kulaklarında bir ağırlık varmış gibi büyüklük taslayarak yüz çevirir. İşte onu,
          acı verecek bir azab ile müjdele.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Fakat iman edip de salih amel işleyenlere gelince, onlar için nimet cennetleri
          vardır.
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Onlar orada ebedî olarak kalacaklardır. Bu, Allah'ın gerçek bir vaadidir. O,
          çok güçlüdür, hüküm ve hikmet sahibidir.
        cid: 0
  - verse: 10
    segments:
      - text: >-
          O, gökleri direksiz yarattı, onları görüyorsunuz. Yeryüzüne de sizi çalkalar
          diye ağır baskılar (sabit ve büyük dağlar) bıraktı ve orada herbir hayvandan
          üretti. Hem biz gökten bir su indirdik de orada her güzel çiftten (veya her hoş
          çeşitten) bitkiler yetiştirdik.
        cid: 0
  - verse: 11
    segments:
      - text: >-
          İşte bu, Allah'ın yarattığıdır. Haydi gösterin bana O'ndan başkaları ne
          yaratmıştır? Fakat o zalimler, apaçık bir sapıklık içindedirler.
        cid: 0
  - verse: 12
    segments:
      - text: >-
          Andolsun ki biz, Lokman'a "Allah'a şükret!" diye hikmet verdik. Kim şükrederse
          kendi iyiliğine eder. Kim de nankörlük ederse, şüphesiz ki Allah, hiçbir şeye
          muhtaç değildir, daima övülmeye layıktır.
        cid: 0
  - verse: 13
    segments:
      - text: >-
          Hani bir zaman Lokman, oğluna öğüt vererek demişti ki: "Yavrucuğum! Allah'a
          ortak koşma, çünkü Allah'a ortak koşmak (şirk), elbette büyük bir zulümdür."
        cid: 0
  - verse: 14
    segments:
      - text: >-
          Gerçi biz insana, anasına ve babasına itaati de tavsiye ettik. Anası onu
          zayıflık üstüne zayıflıkla taşıdı. Onun sütten ayrılması da iki yıl içindedir.
          (Biz insana): "Bana, anana ve babana şükret" diye de tavsiye ettik. Dönüş, ancak
          banadır.
        cid: 0
  - verse: 15
    segments:
      - text: >-
          Bununla beraber eğer her ikisi de bilmediğin bir şeyi, bana ortak koşman
          hususunda seni zorlarsa, onlara itaat etme. Fakat dünyada onlarla iyi geçin ve
          bana yönelenlerin yolunu tut. Sonra dönüşünüz ancak banadır. O zaman ben de size
          yaptıklarınızı haber vereceğim.
        cid: 0
  - verse: 16
    segments:
      - text: >-
          "Yavrucuğum! Haberin olsun ki, yaptığın bir hardal tanesi ağırlığınca olsa da,
          bir kaya içinde veya göklerde, yahut yerin dibinde gizlense, Allah onu getirir,
          mizanına kor. Çünkü Allah en ince şeyleri bilir, her şeyden haberdardır."
        cid: 0
  - verse: 17
    segments:
      - text: >-
          "Yavrucuğum! Namazı kıl, iyiliği emret, kötülükten sakındır. Başına gelenlere
          sabret, çünkü bunlar, azmi gerektiren işlerdendir."
        cid: 0
  - verse: 18
    segments:
      - text: >-
          "Hem insanlara karşı avurdunu şişirme (kibirlenme) ve yeryüzünde çalımla
          yürüme. Çünkü Allah övünen ve kuruntu edenlerin hiçbirini sevmez.
        cid: 0
  - verse: 19
    segments:
      - text: >-
          Yürüyüşünde tabii ol, sesini alçalt, çünkü seslerin en çirkini elbette
          eşeklerin sesidir.
        cid: 0
  - verse: 20
    segments:
      - text: >-
          Görmediniz mi ki, Allah göklerde ve yerde ne varsa hepsini sizin hizmetinize
          vermiş, gizli ve açık olarak nimetlerini üzerinize yaymıştır. Bununla beraber
          insanlar içinde kimi de var ki, ne bir ilme, ne bir mürşide ve ne aydınlatıcı
          bir kitaba dayanmaksızın Allah hakkında mücadele ediyor.
        cid: 0
  - verse: 21
    segments:
      - text: >-
          Onlara: "Allah'ın indirdiğine tabi olun!"dendiği zaman: "Hayır, biz atalarımızı
          neyin üzerinde bulduksa, onun ardınca gideriz." diyorlar. Ya şeytan onları
          cehennnem azabına çağırıyor idiyse de mi onlara uyacaklar?
        cid: 0
  - verse: 22
    segments:
      - text: >-
          Oysa her kim iyilik yaparak yüzünü tertemiz Allah'a tutarsa, o gerçekten en
          sağlam kulpa yapışmıştır. Öyle ya bütün işlerin sonu Allah'a dayanır.
        cid: 0
  - verse: 23
    segments:
      - text: >-
          Kim de inkâr ederse, artık onun inkârı seni üzmesin. Onlar dönüp bize
          gelecekler. O zaman biz onlara bütün yaptıklarını haber vereceğiz. Gerçekten
          Allah, bütün kalblerin özünü bilir.
        cid: 0
  - verse: 24
    segments:
      - text: >-
          Biz onlara biraz zevk ettiririz de sonra kendilerini ağır bir azaba zorlarız.
        cid: 0
  - verse: 25
    segments:
      - text: >-
          Andolsun ki onlara: "Gökleri ve yeri kim yarattı?" diye sorsan, elbette "Allah"
          diyecekler. "Allah'a hamd olsun." de. Fakat onların çoğu bilmezler.
        cid: 0
  - verse: 26
    segments:
      - text: >-
          Göklerde ve yerde ne varsa hepsi Allah'ındır. Gerçekten Allah, hiçbir şeye
          muhtaç değildir, daima övülmeye lâyıktır.
        cid: 0
  - verse: 27
    segments:
      - text: >-
          Eğer yeryüzündeki ağaçlar hep kalem olsa, deniz de arkasından yedi deniz daha
          kendisine destek olduğu halde mürekkep olsa, yine de Allah'ın kelimeleri
          yazmakla tükenmez. Şüphesiz ki Allah çok güçlüdür, hüküm ve hikmet sahibidir.
        cid: 0
  - verse: 28
    segments:
      - text: >-
          Sizin yaratılmanız da tekrar diriltilmeniz de ancak bir tek nefsin yaratılması
          ve tekrar diriltilmesi gibidir. Gerçekten Allah her şeyi işitir ve görür.
        cid: 0
  - verse: 29
    segments:
      - text: >-
          Görmedin mi ki, Allah geceyi gündüze sokuyor, gündüzü geceye sokuyor. Güneş ile
          ayı da emrine boyun eğdirmiştir. Her biri belirli bir süreye kadar akıp gidiyor.
          Şüphesiz ki Allah, yaptıklarınızdan haberdardır.
        cid: 0
  - verse: 30
    segments:
      - text: >-
          Bu da şundandır ki, Allah hakkın ta kendisidir. (İnsanların) O'ndan başka
          taptıkları ise mutlaka batıldır. Şüphesiz ki Allah, çok yücedir, çok büyüktür.
        cid: 0
  - verse: 31
    segments:
      - text: >-
          Görmedin mi ki Allah, âyetlerinden bir kısmını size göstersin diye gemiler,
          Allah'ın nimetiyle denizde akıp gidiyor. Şüphesiz bunda çok sabredenler ve çok
          şükredenler için nice ibretler vardır.
        cid: 0
  - verse: 32
    segments:
      - text: >-
          Onları kara bulutlar gibi bir dalga sardığı zaman, dini yalnız kendisine has
          kılarak Allah'a yalvarırlar. Onları kurtarıp karaya çıkardığı zaman ise
          içlerinden doğru giden de bulunur. Bizim âyetlerimizi öyle nankör gaddarlardan
          başkası inkâr etmez.
        cid: 0
  - verse: 33
    segments:
      - text: >-
          Ey insanlar! Rabbinizden sakının ve bir günden korkun ki, baba çocuğuna hiçbir
          fayda veremez. Çocuk da babasına hiçbir şeyle fayda sağlayacak değildir.
          Şüphesiz Allah'ın vaadi gerçektir. O halde dünya hayatı sizi aldatmasın, sakın o
          çok aldatıcı şeytan sizi Allah'ın affına güvendirerek aldatmasın.
        cid: 0
  - verse: 34
    segments:
      - text: >-
          Şüphesiz ki, kıyamet saatinin bilgisi Allah yanındadır. Yağmuru O yağdırır,
          rahimlerde ne varsa (erkek veya dişi oluşunu, renk ve özelliklerini) O bilir.
          Hiçbir kimse yarın ne kazanacağını bilmez. Hiçbir kimse hangi yerde öleceğini de
          bilemez. Şüphesiz ki Allah her şeyi hakkıyla bilir, her şeyden haberdardır.
        cid: 0