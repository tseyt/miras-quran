surah_id: 46
language: tr
author: elmalili
verses:
  - verse: 1
    segments:
      - text: "Hâ mîm."
        cid: 0
  - verse: 2
    segments:
      - text: "Bu kitabın indirilişi, çok güçlü, hüküm ve hikmet sahibi olan Allah tarafındandır."
        cid: 0
  - verse: 3
    segments:
      - text: "Biz gökleri, yeri ve ikisi arasındakileri ancak hak ile ve belirli bir süre için yarattık. İnkâr edenler uyarıldıkları şeyden yüz çeviriyorlar."
        cid: 0
  - verse: 4
    segments:
      - text: "Ey Muhammed! De ki: \"Allah'tan başka yalvardıklarınızı gördünüz mü? Onlar yerden ne yaratmışlar bana gösterin. Yoksa onların göklerin yaradılışında bir ortaklıkları mı var? Eğer siz doğru söyleyen kimseler iseniz bana bu Kur'an'dan önce indirilmiş bir kitap veya ilimden bir eser getirin.\""
        cid: 0
  - verse: 5
    segments:
      - text: "Allah'ı bırakıp da kıyamet gününe kadar kendisine hiç bir cevap veremeyecek olan putlara dua eden kimseden daha sapık kim olabilir? Oysa taptıkları şeylerin, onların yalvarışlarından haberleri bile yoktur."
        cid: 0
  - verse: 6
    segments:
      - text: "Kıyamet günü insanlar biraraya toplandığı zaman taptıkları şeyler kendilerine düşman kesilirler. Ve onların kendilerine tapmalarını inkâr ederler."
        cid: 0
  - verse: 7
    segments:
      - text: "Bizim âyetlerimiz kendilerine apaçık okunduğu zaman inkâr edenler kendilerine gelen hak kitap için: \"Bu apaçık bir büyüdür.\" dediler."
        cid: 0
  - verse: 8
    segments:
      - text: "Yoksa, \"Onu (Muhammed) uydurdu.\" mu diyorlar? Sen de ki: \"Eğer onu ben uydurmuşsam Allah'tan bana gelecek cezayı savmaya sizin gücünüz yetmez. O sizin yaptığınız taşkınlıkları daha iyi bilir. Sizinle benim aramda şahit olarak Allah yeter. O çok bağışlayıcıdır, çok merhamet edicidir."
        cid: 0
  - verse: 9
    segments:
      - text: "Ey Muhammed! De ki: \"Ben Peygamberlerin ilki değilim. Bana ve size ne yapılacağını da bilmem. Ben ancak bana vahyedilene tabi oluyorum. Ben ancak apaçık bir uyarıcıyım."
        cid: 0
  - verse: 10
    segments:
      - text: "De ki: \"Ne dersiniz, eğer bu Kur'an Allah tarafından ise ve siz de onu inkâr etmişseniz, bununla birlikte İsrailoğulları'ndan bir şahit de onun bir benzerini (Tevrat'ta görüp) inanmışken siz hala büyüklük taslarsanız (haksızlık etmiş olmaz mısınız)? Şüphesiz ki, Allah zalim bir topluluğu doğru yola iletmez.\""
        cid: 0
  - verse: 11
    segments:
      - text: "İnkâr edenler, iman ednler için: \"Eğer İslâm'da bir hayır olsaydı onlar, onu kabulde bizi geçemezlerdi.\" derler. Bununla muvaffak olamayınca da: \"Bu eski bir yalandır.\" diyeceklerdir."
        cid: 0
  - verse: 12
    segments:
      - text: "Kur'ân'dan önce de bir rehber ve rahmet olarak Musa'nın kitabı Tevrat vardı. Bu Kur'ân ise zulmedenleri uyarmak, iyilik yapanları müjdelemek için Arap lisanı ile indirilen ve kendinden öncekileri tasdik eden bir kitaptır."
        cid: 0
  - verse: 13
    segments:
      - text: "\"Gerçekten Rabbimiz Allah'tır.\" deyip, sonra da dosdoğru olanlara gelince onlar için hiçbir korku yoktur ve onlar üzülmeyeceklerdir."
        cid: 0
  - verse: 14
    segments:
      - text: "İşte onlar cennetlikdirler, yaptıklarına karşılık orada ebedi olarak kalacaklardır."
        cid: 0
  - verse: 15
    segments:
      - text: "Biz insana ana ve babasına iyilik yapmayı tavsiye ettik. Anası onu zahmetle karnında taşıdı ve zahmetle doğurdu. Onun ana karnında taşınması ile sütten kesilme süresi otuz aydır. Nihayet insan olgunluk çağına ulaşıp, kırk yaşına geldiğinde der ki: \"Ey Rabbim! Bana ve ana babama ihsan ettiğin nimetlerine şükretmemi ve senin hoşnut olacağın salih amel işlememi ilham et. Benim neslimden gelenleri de salih kimseler kıl. Doğrusu ben tevbe edip sana yöneldim. Ve ben gerçekten müslümanlardanım.\""
        cid: 0
  - verse: 16
    segments:
      - text: "İşte yaptıklarının en güzelini kendilerinden kabul edeceğimiz ve günahlarını bağışlayacağımız bu kimseler cennetlikler arasındadırlar. Bu onlara vaad edilmiş olan dosdoğru bir sözdür."
        cid: 0
  - verse: 17
    segments:
      - text: "Ana ve babasına: \"Öf size! siz bana öldükten sonra tekrar dirilip kabrimden çıkarılacağımı mı vaad ediyorsunuz? Oysa benden önce nice nesiller gelip geçmiştir.\" diyen kimseye ana ve babası Allah'a sığınarak \"Yazıklar olsun sana! Gel iman et, şüphesiz ki, Allah'ın vaadi gerçektir.\" dediklerinde o: \"Bu Kur'ân öncekilerin masallarından başka bir şey değildir\" diyordu."
        cid: 0
  - verse: 18
    segments:
      - text: "İşte onlar kendilerinden önce gelip geçmiş olan cin ve insan toplulukları içerisinde haklarında azab vaadi hak olmuş kimselerdir. Onlar gerçekten hüsrana uğramışlardır."
        cid: 0
  - verse: 19
    segments:
      - text: "Herkesin yaptıklarına göre dereceleri vardır. Allah onlara yaptıklarının karşılığını tam olarak verir. Onlara haksızlık edilmez."
        cid: 0
  - verse: 20
    segments:
      - text: "İnkâr edenler ateşe arzedilecekleri gün onlara: \"Siz dünya hayatınızda bütün güzel şeylerinizi harcadınız, onların zevkini sürdünüz, artık bugün yeryüzünde haksız yere büyüklük taslamanız ve yoldan çıkmış olmanızdan dolayı aşağılayıcı bir azabla cezalandırılacaksınız.\" (denir)."
        cid: 0
  - verse: 21
    segments:
      - text: "Ey Muhammed! Âd kavminin kardeşi Hud'u hatırla. Hani O, Ahkâf denilen yerde kavmini uyarmıştı. O'ndan önce ve sonra da nice peygamberler gelip geçmiştir. Hud, kavmine: \"Allah'tan başkasına kulluk etmeyin. Çünkü ben sizin için büyük bir günün azabından korkuyorum.\" demişti."
        cid: 0
  - verse: 22
    segments:
      - text: "Onlar: \"Sen bizi ilâhlarımızdan çevirmek için mi geldin? Eğer doğru söyleyenlerden isen o bize vaad edip durduğun azabı haydi getir.\" dediler."
        cid: 0
  - verse: 23
    segments:
      - text: "Hud: \"O azabın ne zaman geleceğine dair ilim Allah katındadır. Ben size benimle gönderileni tebliğ ediyorum. Fakat ben sizi cahillik eden bir kavim olarak görüyorum.\" dedi."
        cid: 0
  - verse: 24
    segments:
      - text: "O azabı, vadilerine doğru yayılan bir bulut halinde gördükleri zaman: \"Bu bize yağmur yağdıracak yaygın bir buluttur.\" dediler. Hud ise: \"O sizin acele gelmesini istediğiniz şeydir. O bir rüzgârdır ki, içerisinde acı bir azab vardır."
        cid: 0
  - verse: 25
    segments:
      - text: "O rüzgâr, Rabbinin emri ile herşeyi yıkar mahveder.\" dedi. Nihayet helâk oldular ve evlerinden başka hiçbir şey görünmez oldu. İşte biz günahkâr kavmi böyle cezalandırırız."
        cid: 0
  - verse: 26
    segments:
      - text: "And olsun ki, biz onlara size vermediğimiz imkanlar vermiştik. Onlara kulaklar, gözler ve kalpler vermiştik. Fakat kulakları, gözleri ve kalpleri onlara hiçbir fayda sağlamadı. Çünkü onlar Allah'ın âyetlerini bile bile inkâr ediyorlardı. Alay etmekte oldukları şey de onları sarıp kuşattı."
        cid: 0
  - verse: 27
    segments:
      - text: "Andolsun ki, biz sizin etrafınızda bulunan bir çok memleketleri helak ettik. Belki tevhide dönerler diye ayetlerimizi çeşitli şekillerde açıkladık."
        cid: 0
  - verse: 28
    segments:
      - text: "Allah'ı bırakıp da kendilerine yakınlık sağlamak için edindikleri ilâhları onlara yardım etselerdi ya! Ama hayır, aksine onlardan kaybolup gittiler. İşte bu onların yalanları ve uydurup durdukları iftiralarıdır."
        cid: 0
  - verse: 29
    segments:
      - text: "Ey Muhammed! Hani biz cinlerden bir grubu Kur'ân'ı dinlemeleri için sana yöneltmiştik. Onlar Kur'ân'ı dinlemek için hazır bulundukları zaman birbirlerine \"susun\" dediler. Kur'ân'ın okunması bitince de birer uyarıcı olarak kavimlerine döndüler."
        cid: 0
  - verse: 30
    segments:
      - text: "Onlar kavimlerine şöyle dediler: \"Ey kavmimiz! Gerçekten biz Musa'dan sonra indirilen ve kendisinden öncekileri tasdik eden bir kitap dinledik. O kitap gerçeği ve doğru yolu gösteriyor."
        cid: 0
  - verse: 31
    segments:
      - text: "Ey kavmimiz! Allah'ın davetçisine uyun ve O'na iman edin ki, Allah da sizin günahlarınızı bağışlasın ve sizi acı bir azabdan korusun.\""
        cid: 0
  - verse: 32
    segments:
      - text: "Her kim Allah'ın davetçisine uymazsa bilsin ki, yeryüzünde Allah'ı aciz bırakacak değildir. Onun Allah'tan başka dostları da yoktur. İşte onlar apaçık bir sapıklık içerisindedirler."
        cid: 0
  - verse: 33
    segments:
      - text: "Onlar gökleri ve yeri yaratan ve onları yaratmakla yorulmayan Allah'ın ölüleri diriltmeye de kadir olduğunu görmüyorlar mı? Evet şüphesiz ki, O'nun herşeye gücü yeter."
        cid: 0
  - verse: 34
    segments:
