surah_id: 69
language: tr
author: elmalili
verses:
  - verse: 1
    segments:
      - text: >-
          (Gerçekleşecek) Kıyamet!
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Nedir, o Kıyamet?
        cid: 0
  - verse: 3
    segments:
      - text: >-
          Gerçekleşenin (Kıaymetin) ne olduğunu sen nerden bileceksin?
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Semûd ve Âd, kapılarını çalacak olan o felaketi yalan saymışlardı.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Semûd kavmi korkunç bir sesle yok edildi.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Âd kavmi ise gürültülü ve azgın bir fırtına ile yok edildiler.
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Allah o fırtınayı üzerlerine yedi gece sekiz gündüz musallat etmişti. Öyle ki,
          o kavmi içi boş hurma kütükleri gibi oracıkta yere serilmiş halde görürdün.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Bak şimdi görebilir misin onlardan bir kalıntı?
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Firavun, ondan öncekiler ve altı üstüne getirilen beldeler de hep o hatayı
          işleyegeldiler.
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Hep Rablerinin elçilerine karşı geldiler. O da onları pek şiddetli bir şekilde
          yakalayıverdi.
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Kuşkusuz, sular kabarınca sizi gemide biz taşıdık.
        cid: 0
  - verse: 12
    segments:
      - text: >-
          Onu size bir ibret yapalım ve belleyici kulaklar bellesin diye.
        cid: 0
  - verse: 13
    segments:
      - text: >-
          Sûr'a bir tek üfleme üflendiği,
        cid: 0
  - verse: 14
    segments:
      - text: >-
          Arz ve dağlar yerlerinden kaldırılıp şiddetle birbirine çarpılarak darmadağın
          olduğu zaman,
        cid: 0
  - verse: 15
    segments:
      - text: >-
          İşte o gün olacak olur.
        cid: 0
  - verse: 16
    segments:
      - text: >-
          O gün gök yarılmış, sarkmıştır.
        cid: 0
  - verse: 17
    segments:
      - text: >-
          Melekler de onun etrafındadır, O gün Rabbinin Arşını bunların da üstünde sekiz
          melek yüklenir.
        cid: 0
  - verse: 18
    segments:
      - text: >-
          O gün (hesap için Allah'a) arz olunursunuz, öyle ki gizli bir haliniz kalmaz.
        cid: 0
  - verse: 19
    segments:
      - text: >-
          Kitabı sağından verilen, "alın okuyun kitabımı.."
        cid: 0
  - verse: 20
    segments:
      - text: >-
          "Çünkü ben hesabıma kavuşacağımı sezmiştim" der.
        cid: 0
  - verse: 21
    segments:
      - text: >-
          Artık o hoşnut bir hayattadır.
        cid: 0
  - verse: 22
    segments:
      - text: >-
          Yüksek bir cennettedir.
        cid: 0
  - verse: 23
    segments:
      - text: >-
          Ki o cennetin meyveleri sarkmıştır.
        cid: 0
  - verse: 24
    segments:
      - text: >-
          "Geçmiş günlerde yaptığınız işlerden ötürü afiyetle yeyin, için." (denir).
        cid: 0
  - verse: 25
    segments:
      - text: >-
          Kitabı sol tarafından verilen ise der ki: "Keşke kitabım verilmeseydi de,
        cid: 0
  - verse: 26
    segments:
      - text: >-
          Hesabımın ne olduğunu bilmeseydim,
        cid: 0
  - verse: 27
    segments:
      - text: >-
          Ne olurdu o ölüm, iş bitirici olsaydı.
        cid: 0
  - verse: 28
    segments:
      - text: >-
          Malım bana hiç fayda vermedi.
        cid: 0
  - verse: 29
    segments:
      - text: >-
          Gücüm de benden yok olup gitti."
        cid: 0
  - verse: 30
    segments:
      - text: >-
          (Zebanilere şöyle denir): "Onu yakalayın da bağlayın."
        cid: 0
  - verse: 31
    segments:
      - text: >-
          "Sonra cehenneme atın onu."
        cid: 0
  - verse: 32
    segments:
      - text: >-
          "Sonra da boyu yetmiş arşın zincir içerisinde onu oraya sokun."
        cid: 0
  - verse: 33
    segments:
      - text: >-
          Çünkü o, büyük Allah'a inanmıyordu.
        cid: 0
  - verse: 34
    segments:
      - text: >-
          Yoksula yedirmeye teşvik etmiyordu.
        cid: 0
  - verse: 35
    segments:
      - text: >-
          Bu sebeple bugün burada onun candan bir dostu yoktur.
        cid: 0
  - verse: 36
    segments:
      - text: >-
          Bir irinden başka yiyecek de yok.
        cid: 0
  - verse: 37
    segments:
      - text: >-
          Onu günahkârlardan başkası yemez.
        cid: 0
  - verse: 38
    segments:
      - text: >-
          Andolsun gördüklerinize,
        cid: 0
  - verse: 39
    segments:
      - text: >-
          Ve görmediklerinize..
        cid: 0
  - verse: 40
    segments:
      - text: >-
          Kuşkusuz Kur'ân, şerefli bir peygamberin (Allah'tan) getirdiği sözdür.
        cid: 0
  - verse: 41
    segments:
      - text: >-
          O bir şair sözü değildir, siz çok az inanıyorsunuz.
        cid: 0
  - verse: 42
    segments:
      - text: >-
          Bir kâhin sözü de değildir, ne de az düşünüyorsunuz!
        cid: 0
  - verse: 43
    segments:
      - text: >-
          O, âlemlerin Rabbi tarafından indirilmedir.
        cid: 0
  - verse: 44
    segments:
      - text: >-
          O, bize isnâden bazı sözler uydurmaya kalkışsaydı,
        cid: 0
  - verse: 45
    segments:
      - text: >-
          Elbette biz onu bundan dolayı kuvvetle yakalardık.
        cid: 0
  - verse: 46
    segments:
      - text: >-
          Sonra da onun şah damarını keser atardık.
        cid: 0
  - verse: 47
    segments:
      - text: >-
          O vakit sizden hiçbiriniz ona siper de olamazdınız.
        cid: 0
  - verse: 48
    segments:
      - text: >-
          O hiç kuşkusuz, takva sahipleri için unutulmayacak bir öğüttür.
        cid: 0
  - verse: 49
    segments:
      - text: >-
          Bununla beraber biz biliyoruz ki sizden inanmayanlar var.
        cid: 0
  - verse: 50
    segments:
      - text: >-
          Kuşkusuz bu Kur'ân kafirler için bir pişmanlık vesilesidir.
        cid: 0
  - verse: 51
    segments:
      - text: >-
          Gerçekten o, şüphe götürmez bir bilgidir.
        cid: 0
  - verse: 52
    segments:
      - text: >-
          O halde, haydi tesbih et Rabbinin yüce ismiyle
        cid: 0