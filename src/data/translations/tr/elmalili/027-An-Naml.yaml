      - text: >-
          Görmediler mi ki, dinlensinler diye geceyi yarattık ve (çalışsınlar diye)
          gündüzü apaydınlık yaptık. İman eden bir kavim için elbette bunda ibretler
          vardır.
        cid: 0
  - verse: 87
    segments:
      - text: >-
          Sûr'a üfürüldüğü gün Allah'ın diledikleri müstesna göklerde ve yerde bulunanlar
          hep dehşete kapılır. Hepsi boyunları bükük olarak O'na gelirler.
        cid: 0
  - verse: 88
    segments:
      - text: >-
          Sen dağları görürsün de, yerinde durur sanırsın. Oysa onlar bulutun yürümesi
          gibi yürümektedirler. Bu, her şeyi sapasağlam yapan Allah'ın sanatıdır. Şüphesiz
          ki O, yaptıklarınızdan tamamıyla haberdardır.
        cid: 0
  - verse: 89
    segments:
      - text: >-
          Kim iyilikle gelirse, ona daha iyisi verilir ve onlar o gün korkudan da emin
          kalırlar.
        cid: 0
  - verse: 90
    segments:
      - text: >-
          Her kim de kötülükle gelirse artık yüzleri ateşte sürtülür. "Başka değil ancak
          yaptığınız amellerin cezasını çekeceksiniz." (denir).
        cid: 0
  - verse: 91
    segments:
      - text: >-
          (De ki): "Ben ancak her şeyin sahibi olan ve burayı kutlu kılan bu şehrin
          (Mekke'nin) Rabbine kulluk etmekle emrolundum. Yine bana müslümanlardan olmam
          emredildi."
        cid: 0
  - verse: 92
    segments:
      - text: >-
          "Ve Kur'ân'ı okumam emredildi." Artık kim doğru yola gelirse, yalnız kendisi
          için gelmiş olur; kim de saparsa ona de ki: "Ben sadece uyarıcılardanım."
        cid: 0
  - verse: 93
    segments:
      - text: >-
          Ve şöyle de: Hamd, Allah'a mahsustur. O, âyetlerini size gösterecek, siz de
          onları görüp tanıyacaksınız. Rabbin, yaptıklarınızdan habersiz değildir.
        cid: 0