surah_id: 27
language: tr
author: elmalili
verses:
  - verse: 1
    segments:
      - text: >-
          Tâ, Sîn. Bunlar sana, Kur'ân'ın ve apaçık bir kitabın âyetleridir.
        cid: 0
  - verse: 2
    segments:
      - text: >-
          İman eden müminler için hidayet rehberi ve müjdeci olmak üzere.
        cid: 0
  - verse: 3
    segments:
      - text: >-
          Ki o (müminler) namazı dosdoğru kılarlar, zekatı verirler ve ahirete de kesin
          olarak iman ederler.
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Şüphesiz biz, ahirete inanmayanların işlerini kendilerine süslü gösterdik de
          onlar ilerisini göremezler, kalpleri körelmiştir.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          İşte bunlar, kendileri için oldukça ağır bir azab bulunan kimselerdir, ahirette
          en çok ziyana uğrayacaklar da onlardır.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          (Resulüm!) Şüphesiz ki bu Kur'ân, sana hikmet sahibi ve her şeyi bilen Allah
          tarafından indirilmektedir.
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Hani Musa, ailesine şöyle demişti: "Gerçekten ben bir ateş gördüm, (gidip) size
          oradan bir haber getireceğim yahut bir kor ateş getireyim, umarım ki
          ısınırsınız."
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Oraya geldiğinde şöyle seslenilmişti: "Ateşin bulunduğu yerdeki ve
          çevresindekiler mübarek kılınmıştır! Âlemlerin Rabbi olan Allah, eksikliklerden
          münezzehtir!"
        cid: 0
  - verse: 9
    segments:
      - text: >-
          "Ey Musa! İyi bil ki, ben, mutlak galip ve hikmet sahibi olan Allah'ım!"
        cid: 0
  - verse: 10
    segments:
      - text: >-
          "Asânı at!" (Asâyı atıp) onu yılan gibi deprenir görünce dönüp arkasına
          bakmadan kaçtı. (Dedik ki): "Ey Musa korkma! Çünkü benim huzurumda peygamberler
          korkmaz."
        cid: 0
  - verse: 11
    segments:
      - text: >-
          "Ancak, kim haksızlık yapar, sonra yaptığı kötülüğü iyiliğe çevirirse, bilsin
          ki ben (ona karşı da) çok bağışlayıcıyım, çok merhamet sahibiyim."
        cid: 0
  - verse: 12
    segments:
      - text: >-
          "Elini koynuna sok; kusursuz bembeyaz çıkacaktır. Dokuz mucize ile Firavun ve
          kavmine (git), çünkü onlar yoldan çıkmış bir kavim olmuşlardır."
        cid: 0
  - verse: 13
    segments:
      - text: >-
          Bu şekilde âyetlerimiz onların gözleri önüne serilince, "Bu apaçık bir
          sihirdir" dediler.
        cid: 0
  - verse: 14
    segments:
      - text: >-
          Ve vicdanları bunlar(ın doğruluğun)a tam bir kanaat getirdiği halde, zulüm ve
          kibirlerinden ötürü onları bile bile inkâr ettiler. Bozguncuların sonunun nice
          olduğuna bir bak!
        cid: 0
  - verse: 15
    segments:
      - text: >-
          Andolsun ki biz, Davud'a ve Süleyman'a bir ilim verdik. Onlar: "Bizi mümin
          kullarının birçoğundan üstün kılan Allah'a hamd olsun" dediler.
        cid: 0
  - verse: 16
    segments:
      - text: >-
          Süleyman Davud'a varis olup dedi ki: "Ey insanlar! Bize kuş dili öğretildi ve
          bize her şeyden (nasip) verildi. Doğrusu bu apaçık bir lütuftur."
        cid: 0
  - verse: 17
    segments:
      - text: >-
          Cinlerden, insanlardan ve kuşlardan müteşekkil orduları Süleyman'ın hizmetinde
          toplandı, hepsi bir arada (onun tarafından) düzenli olarak sevkediliyordu.
        cid: 0
  - verse: 18
    segments:
      - text: >-
          Nihayet karınca vâdisine geldikleri zaman, bir karınca: "Ey karıncalar!
          Yuvalarınıza girin; Süleyman ve ordusu farkına varmadan sizi ezmesin!" dedi.
        cid: 0
  - verse: 19
    segments:
      - text: >-
          (Süleyman) onun sözüne gülümseyerek dedi ki: "Ey Rabbim! Bana ve ana babama
          verdiğin nimete şükretmemi ve hoşnut olacağın iyi iş yapmamı gönlüme getir.
          Rahmetinle, beni iyi kulların arasına kat."
        cid: 0
  - verse: 20
    segments:
      - text: >-
          (Süleyman) Kuşları gözden geçirdikten sonra şöyle dedi: "Hüdhüd'ü niçin
          göremiyorum? Yoksa kayıplara mı karıştı?"
        cid: 0
  - verse: 21
    segments:
      - text: >-
          "Ya bana (mazeretini gösteren) apaçık bir delil getirecek, ya da onu şiddetli
          bir azaba uğratacağım, yahut boğazlıyacağım!"
        cid: 0
  - verse: 22
    segments:
      - text: >-
          Çok geçmeden (Hüdhüd) gelip: "Ben, dedi, senin bilmediğin bir şeyi öğrendim.
          Sebe'den sana çok doğru (ve önemli) bir haber getirdim.
        cid: 0
  - verse: 23
    segments:
      - text: >-
          "Gerçekten, onlara (Sebelilere) hükümdarlık eden, kendisine her türlü imkan
