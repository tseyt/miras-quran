        cid: 0
  - verse: 24
    segments:
      - text: >-
          "Onun ve kavminin, Allah'ı bırakıp güneşe secde ettiklerini gördüm. Şeytan,
          kendilerine yaptıklarını süslü göstermiş de onları doğru yoldan alıkoymuş. Bunun
          için hidayete giremiyorlar."
        cid: 0
  - verse: 25
    segments:
      - text: >-
          "Göklerde ve yerde gizleneni açığa çıkaran, gizlediğinizi ve açıkladığınızı
