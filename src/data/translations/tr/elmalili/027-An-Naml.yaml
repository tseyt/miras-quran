        cid: 0
  - verse: 26
    segments:
      - text: >-
          "(Halbuki) O büyük Arş'ın sahibi olan Allah'tan başka tapılacak yoktur."
        cid: 0
  - verse: 27
    segments:
      - text: >-
          (Süleyman Hüdhüd'e) dedi ki: "Doğru mu söyledin, yoksa yalancılardan mısın,
          bakacağız."
        cid: 0
  - verse: 28
    segments:
      - text: >-
          "Şu mektubumu götür, onu kendilerine ver, sonra onlardan biraz çekil de, ne
