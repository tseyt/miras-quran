surah_id: 64
language: tr
author: elmalili
verses:
  - verse: 1
    segments:
      - text: "Göklerde ve yerde ne varsa hepsi Allah'ı tesbih eder. Mülk O'nundur, hamd O'nadır. Her şeye gücü yeten O'dur."
        cid: 0
  - verse: 2
    segments:
      - text: "Sizi O yarattı. Kiminiz kâfirdir, kiminiz mümin. Allah yaptıklarınızı görmektedir."
        cid: 0
  - verse: 3
    segments:
      - text: "Zira gökleri ve yeri hak ile yarattı. Sizi şekillendirdi ve şekillerinizi de güzel yaptı. Dönüş ancak O'nadır."
        cid: 0
  - verse: 4
    segments:
      - text: "Göklerde ve yerde olanları, gizlediğiniz ve açığa vurduğunuz şeyleri bilir. Allah, göğüslerin özünü bilir."
        cid: 0
  - verse: 5
    segments:
      - text: "Önceden inkâr edenlerin haberi size gelmedi mi? (Onlar) işlerinin vebalini tattılar ve onlar için acı bir azap vardır."
        cid: 0
  - verse: 6
    segments:
      - text: "Böyledir, çünkü onlara peygamberleri, açık deliller getirirlerdi, fakat onlar: \"Bir insan mı bize yol gösterecek?\" dediler ve yüz çevirdiler. Allah da muhtaç olmadığını gösterdi. Allah zengindir, övülmeye lâyıktır."
        cid: 0
  - verse: 7
    segments:
      - text: "İnkâr edenler, katiyyen diriltilmeyeceklerini sandılar. De ki: \"Hayır! Rabbim hakkı için mutlaka diriltileceksiniz, sonra yaptıklarınız size haber verilecektir. Bu, Allah'a göre kolaydır\"."
        cid: 0
  - verse: 8
    segments:
      - text: "Artık Allah'a, Resulüne ve indirdiğimiz nura (Kur'ân'a) inanın. Allah yaptıklarınızdan haberdardır."
        cid: 0
  - verse: 9
    segments:
      - text: "Toplanma günü için sizi topladığı zaman var ya, işte o gün, kimin aldandığının açığa çıkacağı aldanma günüdür. Kim Allah'a inanır ve yararlı iş yaparsa, Allah onun kötülüklerini örter ve onu, içinde ebedi kalacakları, altlarından ırmaklar akan cennetlere sokar. İşte büyük kurtuluş budur."
        cid: 0
  - verse: 10
    segments:
      - text: "İnkâr eden ve âyetlerimizi yalanlayanlara gelince, işte onlar cehennem ehlidirler. Orada ebedi kalacaklardır. Ne kötü gidilecek yerdir orası!"
        cid: 0
  - verse: 11
    segments:
      - text: "Allah'ın izni olmayınca hiç bir musibet isabet etmez. Kim Allah'a inanırsa, Allah onun kalbini doğruya götürür. Allah her şeyi bilendir."
        cid: 0
  - verse: 12
    segments:
      - text: "Allah'a itaat edin, Peygamber'e de itaat edin. Yüz çevirirseniz bilin ki, elçimize düşen apaçık bir duyurmadır."
        cid: 0
  - verse: 13
    segments:
      - text: "Allah ki O'ndan başka tanrı yoktur. Müminler Allah'a dayansınlar."
        cid: 0
  - verse: 14
    segments:
      - text: "Ey iman edenler! Eşlerinizden ve çocuklarınızdan size düşman olanlar da vardır. Onlardan sakının. Ama affeder, kusurlarını başlarına kakmaz, hoş görür ve bağışlarsanız, bilin ki Allah çok bağışlayan çok merhamet edendir."
        cid: 0
  - verse: 15
    segments:
      - text: "Doğrusu mallarınız ve çocuklarınız sizin için bir imtihandır. Büyük mükafat ise Allah'ın yanındadır."
        cid: 0
  - verse: 16
    segments:
      - text: "O halde gücünüzün yettiği kadar Allah'tan korkun, dinleyin, itaat edin, kendi iyiliğinize olarak harcayın. Kim nefsinin cimriliğinden korunursa işte onlar kurtuluşa erenlerdir."
        cid: 0
  - verse: 17
    segments:
      - text: "Eğer Allah'a güzel bir borç verirseniz, Allah onu sizin için kat kat yapar ve sizi bağışlar. Allah çok mükafat verendir, halimdir."
        cid: 0
  - verse: 18
    segments:
      - text: "Görünmeyeni ve görüneni bilendir. Üstündür, hikmet sahibidir."
        cid: 0