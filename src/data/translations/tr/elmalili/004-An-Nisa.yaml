surah_id: 4
language: tr
author: elmalili
verses:
  - verse: 1
    segments:
      - text: >-
          Ey insanlar! Sizi bir tek nefisten yaratan ve ondan eşini yaratıp ikisinden bir
          çok erkekler ve kadınlar üreten Rabbinizden korkun; kendi adına birbirinizden
          dilekte bulunduğunuz Allah'dan ve akrabalık (bağlarını kırmak)tan sakının.
          Şüphesiz Allah sizin üzerinizde gözeticidir.
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Öksüzlere mallarını verin ve kötüsünü (onlara vererek) iyisiyle değiştirmeyin.
          Onların mallarını, kendi mallarınıza karıştırıp yemeyin. Zira bu, büyük bir
          günahtır.
        cid: 0
  - verse: 3
    segments:
      - text: >-
          Eğer öksüz kızlarla evlendiğinizde onlara karşı adaletli davranamamaktan
          korkarsanız, hoşunuza giden diğer kadınlardan iki, üç ve dörde kadar
          evlenebilirsiniz. Eğer adaleti gözetmemekten korkarsanız, o zaman bir tane ile
          veya elinizin altındakiyle (sahip olduğunuz câriye ile) yetinin. Doğruluktan
          ayrılmamak için bu daha elverişlidir.
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Kadınlara mehirlerini gönül hoşluğuyla verin. Eğer onlar gönül rızasıyla size
          bir şey bağışlarlarsa onu afiyetle yiyin.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Allah'ın, sizi başına diktiği mallarınızı aklı ermezlere vermeyin; o mallarla
          onları besleyin, giydirin ve onlara güzel söz söyleyin.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Evlenme çağına gelinceye kadar yetimleri gözetip deneyin. Onların akılca
          olgunlaştıklarını görürseniz, mallarını kendilerine teslim edin. "Büyüyecekler
          de mallarına sahip olacaklar" endişesiyle onları israf ederek, tez elden
          yemeyin. Zengin olan, onların malını yemekten çekinsin. Fakir olan ise, meşrû
          sûrette yesin. Mallarını kendilerine verdiğiniz zaman, bunu şahitler karşısında
          yapın. Hesap görücü olarak Allah yeter.
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Ana, baba ve akrabaların miras olarak bıraktıklarında erkeklerin hissesi
          vardır. Kadınların da ana, baba ve akrabaların bıraktıklarında hisseleri vardır.
          Bunlar, az olsun çok olsun, farz kılınmış bir hissedir.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Paylaşma sırasında akrabalar, öksüzler, yoksullar hazır bulunurlarsa, onlara da
          bir şey verin ve onlara güzelce sözler söyleyerek gönüllerini alın.
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Kendileri, geriye zayıf çocuklar bıraktıkları takdirde, onların geleceğinden
          endişe duyacak olanlar, (yetimler hakkında da aynı) endişeyi duysunlar,
          Allah'dan sakınsınlar ve doğru söz söylesinler.
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Yetimlerin mallarını haksız yere yiyenler, muhakkak ki karınlarını ateşle
          doldurmuş olurlar ve cehennemi boylarlar.
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Allah size evlatlarınızın miras taksimini şöyle emrediyor: Çocuklarınızda,
          erkeğe iki kadın payı kadar, eğer hepsi kadın olmak üzere ikiden de fazla
          iseler, bunlara mirasın üçte ikisi ve eğer bir tek kadın ise o zaman ona malın
          yarısı vardır. Eğer ölen, ana ve baba ile birlikte çocuklar da bırakmışsa ana
          babanın her birine ölenin terekesinden altıda bir; şâyet ölenin çocuğu yok da,
          mirasçı olarak ana ve babası kalmışsa, ananın payı üçte birdir. Eğer ölenin
          kardeşleri varsa terekenin altıda biriananındır. Bu paylar, ölenin borçları
          ödenip, vasiyeti de yerine getirildikten sonra hak sahiplerine verilir. Baba ve
          çocuklardan, hangisinin size fayda bakımından daha yakın olduğunu, siz
          bilmezsiniz. Bütün bunlar Allah tarafından farz kılınmıştır. Şüphesiz Allah
          alîmdir, hakîmdir.
        cid: 0
  - verse: 12
    segments:
      - text: >-
          Eğer hanımlarınızın çocukları yoksa, bıraktıkları mirasın yarısı sizindir.
          Şâyet bir çocukları varsa o zaman mirasın dörtte biri sizindir. Bu paylar,
          ölenin vasiyeti yerine getirildikten ve varsa, borcu ödendikten sonra verilir.
          Eğer siz çocuk bırakmadan ölürseniz, geriye bıraktığınız mirasın dörtte biri
          hanımlarınızındır. Şâyet çocuklarınız varsa o zaman bıraktığınız mirasın sekizde
          biri hanımlarınızındır. Bu paylar, yaptığınız vasiyetler yerine getirilip ve
          varsa borcunuz ödendikten sonra verilir. Eğer ölen bir erkek veya kadının çocuğu
          ve babası bulunmadığı halde kelâle olarak (yan koldan) mirasına konuluyor ve
          kendisinin bir erkek veya kızkardeşi bulunuyorsa, bunlardan herbirinin miras
          payı terekenin altıda biridir. Eğer mevcut olan kardeşler bundan daha çok
          iseler, bu takdirde kardeşler mirasın üçte birini zarara uğratılmaksızın
          aralarında eşit olarak taksim ederler. Bu paylar ölenin vasiyeti yerine
          getirilip ve varsa borcu ödendikten sonra verilir. Bunlar, Allah tarafından bir
          emirdir. Allah her şeyi bilen ve yarattıklarına çok yumuşak davranandır.
        cid: 0
  - verse: 13
    segments:
      - text: >-
          İşte bütün bu hükümler, Allah'ın koyduğu hükümler ve çizdiği sınırlardır. Kim
          Allah'a ve Peygamberine itâat ederse Allah onu altlarından ırmaklar akan
          cennetlere koyar. Onlar, orada ebedî olarak kalacaklardır. İşte büyük kurtuluş
          budur.
        cid: 0
  - verse: 14
    segments:
      - text: >-
          Kim de Allah'a ve Peygamberine isyan eder ve Allah'ın koyduğu sınırları aşarsa
          Allah onu da ebedî kalacağı cehennem ateşine koyar. Onun için alçaltıcı bir azab
          vardır.
        cid: 0
  - verse: 15
    segments:
      - text: >-
          Kadınlarınızdan zina edenlere karşı, içinizden dört şahit getirin. Eğer onlar,
          şahitlik yaparlarsa, bu kadınları, ölüm alıp götürünceye kadar veya Allah onlara
          bir çıkış yolu açıncaya kadar evlerde hapsedin.
        cid: 0
  - verse: 16
    segments:
      - text: >-
          Sizlerden zina edenlerin her ikisine de eziyet edin. Eğer onlar tevbe edip
          kendilerini ıslah ederlerse onlardan vazgeçin. Çünkü Allah tevbeleri kabul eden
          ve çok merhamet edendir.
        cid: 0
  - verse: 17
    segments:
      - text: >-
          Ancak Allah'ın kabul etmesini vaad buyurduğu tevbe, o kimseler içindir ki,
          bilmeyerek günah işleyip hemen tevbe edenlerin tevbesidir. İşte Allah bunların
          tevbelerini kabul eder. Allah alîmdir hakîmdir. (Her şeyi bilendir, hikmet
          sahibidir).
        cid: 0
  - verse: 18
    segments:
      - text: >-
          Yoksa günah işleyip de kendisine ölüm gelince: "İşte ben şimdi tevbe ettim."
          diyen kimselerin tevbesi kabul edilmez. Kâfir olarak ölenlerin de tevbeleri
          kabul edilmez. İşte bunlara ahirette can yakıcı bir azap hazırlamışızdır.
        cid: 0
  - verse: 19
    segments:
      - text: >-
          Ey iman edenler! Kadınlara zorla varis olmanız size helal değildir. Verdiğiniz
          mehrin bir kısmını kurtaracaksınız diye, onları sıkıştırmanız da helal değildir.
          Ancak açık bir hayasızlık yapmış olurlarsa başka. Onlarla iyi geçinin. Eğer
          kendilerinden hoşlanmadınızsa, olabilir ki, siz bir şeyden hoşlanmasanız da
          Allah onda bir çok hayır takdir etmiş bulunur.
        cid: 0
  - verse: 20
    segments:
      - text: >-
          Eğer bir eşi bırakıp da yerine diğer bir eş almak isterseniz, öncekine yüklerle
          mehir vermiş de bulunsanız, ondan bir şey geri almayın. O malı bir iftira ve
          açık bir günah isnadı yaparak geri alır mısınız?
        cid: 0
  - verse: 21
    segments:
      - text: >-
          Birbirinizle kaynaşıp başbaşa kalmışken ve onlar sizden kuvvetli bir teminat
          almışken verdiğinizi nasıl geri alabilirsiniz?
        cid: 0
  - verse: 22
    segments:
      - text: >-
          Cahiliye devrinde geçenler müstesna, babalarınızın nikahladığı kadınlarla
          evlenmeyiniz. Şüphe yok ki o, pek çirkindi, iğrenç idi, o ne fena bir âdetti.
        cid: 0
  - verse: 23
    segments:
      - text: >-
          Size şunları nikahlamak haram kılındı: Anneleriniz, kızlarınız, kız
          kardeşleriniz, halalarınız, teyzeleriniz, erkek ve kız kardeşlerinizin kızları,
          sizi emziren süt anneleriniz, süt kızkardeşleriniz ve karılarınızın anneleri, ve
          kendileri ile zifafa girdiğiniz kadınlarınızdan olan ve evlerinizde bulunan üvey
          kızlarınız. Eğer üvey kızlarınızın anneleri ile zifafa girmemişseniz onlarla
          evlenmenizde size bir günah yoktur. Sulbünüzden gelen (öz) oğullarınızın
          hanımları ile evlenmeniz ve iki kız kardeşi birlikte nikahlamanız da haramdır.
          Ancak cahiliyyet devrinde geçen geçmiştir. Şüphesiz ki Allah gafur (çok
          bağışlayıcı) ve çok merhamet edicidir.
        cid: 0
  - verse: 24
    segments:
      - text: >-
          Bir de harb esiri olarak sahibi bulunduğunuz cariyeler müstesna, evli
          kadınlarla evlenmeniz de size haram kılındı. Bütün bunlar Allah'ın üzerinize
          farz kıldığı hükümlerdir. Bunların dışında kalanlar ise iffetli olarak zina
          etmeksizin mallarınızla mehir vermek suretiyle evlenmek istemeniz size helal
          kılındı. O halde onlardan nikah ile faydalanmanıza karşılık mehirlerini
          kendilerine verin ki, bu farzdır. O mehri takdir edip kesinleştirdikten sonra
          birbirinizi razı etmenizde bir mahzur yoktur. Şüphesiz ki Allah her şeyi çok iyi
          bilendir, hüküm ve hikmet sahibidir.
        cid: 0
  - verse: 25
    segments:
      - text: >-
          Sizden her kim hür mümin kadınları nikah edecek bir zenginliğe gücü yetmiyorsa,
          ona da ellerinizin altındaki mümin cariyelerinizden efendilerinin rızası ile
          nikahlamak var. Allah sizin imanınızı daha iyi bilir. Siz birbirinizdensiniz. O
          halde sahiplerinin izni ile ve mehirlerini örfe göre vermek suretiyle
          cariyelerden iffetli olan, zina etmeyen, dost da edinmeyenlerle evlenin.
          Evlendikten sonra bir fuhuş yaparlarsa, o vakit hür kadınlar hakkında gerekli
          bulunan cezanın yarısı kendilerine lazım gelir. Bu hükümler, içinizden günah
          işlemekten korkanlaradır. Sabretmeniz ise, sizin için daha hayırlıdır. Allah
          Gafûrdur, Rahimdir (çok bağışlayıcıdır, çok merhamet edicidir).
        cid: 0
  - verse: 26
    segments:
      - text: >-
          Allah, sizlere bilmediklerinizi bildirmek, sizden öncekilerin yollarını size
          göstermek ve tevbenizi kabul etmek istiyor. Allah, her şeyi çok iyi bilendir,
          hüküm ve hikmet sahibidir.
        cid: 0
  - verse: 27
    segments:
      - text: >-
          Allah sizin tevbenizi kabul etmek istiyor. Halbuki şehvetlerine uyanlar ise,
          sizin doğru yoldan büyük bir meyl ile sapmanızı istiyorlar.
        cid: 0
  - verse: 28
    segments:
      - text: >-
          Allah, din hususundaki ağır teklifleri sizden hafifletmek istiyor. Çünkü insan
          sabır ve tahammül bakımından zayıf yaratılmıştır.
        cid: 0
  - verse: 29
    segments:
      - text: >-
          Ey iman edenler! Mallarınızı aranızda haksızlıkla yemeyin. Ancak kendi
          rızanızla yaptığınız ticaretle yemeniz helaldir. Birbirinizin canına kıymayın.
          Şüphesiz Allah, size karşı çok merhametlidir.
        cid: 0
  - verse: 30
    segments:
      - text: >-
          Kim, zulüm ve tecavüz yolu ile bu yasakları işlerse, yakında onu cehennem
          ateşine atacağız. Onu ateşe atmak da Allah'a pek kolaydır.
        cid: 0
  - verse: 31
    segments:
      - text: >-
          Eğer siz, yasaklandığınız büyük günahlardan sakınırsanız, diğer kusurlarınızı
          örter, sizi güzel bir makama koyarız.
        cid: 0
  - verse: 32
    segments:
      - text: >-
          Bir de Allah'ın bazınıza, diğerinden fazla verdiği şeyleri temenni etmeyin.
          Erkeklere hak ettiklerinden bir pay vardır. Kadınlara da kendi kazandıklarından
          bir pay vardır. İsteklerinizi Allah'ın fazlından ve kereminden isteyin.
          Gerçekten Allah her şeyi hakkıyla bilendir.
        cid: 0
  - verse: 33
    segments:
      - text: >-
          Anne, baba ve akrabaların bıraktıkları her şey için bir mirasçı tayin ettik.
          Yemin akdiyle mirasçı kıldıklarınızın paylarını da verin. Şüphesiz Allah, her
          şeye şahittir.
        cid: 0
  - verse: 34
    segments:
      - text: >-
          Erkekler, kadın üzerine idareci ve hakimdirler. Çünkü Allah birini (cihad,
          imamet, miras gibi işlerde) diğerinden üstün yaratmıştır. Bir de erkekler
          mallarından (aile fertlerine) harcamaktadırlar. İyi kadınlar, itaatkar olanlar
          ve Allah'ın korunmasını emrettiği şeyleri kocalarının bulunmadığı zamanlarda da
          koruyanlardır. Fenalık ve geçimsizliklerinden korktuğunuz kadınlara gelince:
          Önce kendilerine öğüt verin, yataklarından ayrılın. Bunlar da fayda vermezse
          dövün. Eğer size itaat ederlerse kendilerini incitmeye başka bir bahane
          aramayın. Çünkü Allah çok yücedir, çok büyüktür.
        cid: 0
  - verse: 35
    segments:
      - text: >-
          Eğer karıkoca arasının açılmasından endişeye düşerseniz bir hakem erkeğin
          tarafından, bir hakem de kadının ailesinden kendilerine gönderin. Bu arabulucu
          hakemler gerçekten barıştırmak isterlerse, Allah karıkoca arasındaki dargınlık
          yerine geçim verir. Şüphesiz ki Allah hakkıyla bilendir, her şeyin aslından
          haberdardır.
        cid: 0
  - verse: 36
    segments:
      - text: >-
          Allah'a ibadet edin ve O'na hiçbir şeyi ortak koşmayın. Sonra anaya, babaya,
          akrabaya, yetimlere, yoksullara, akraba olan komşulara, yakın komşulara, yanında
          bulunan arkadaşa, yolda kalanlara, sahip olduğunuz kölelere iyilik edin.
          Şüphesiz Allah, kibirlenen ve övünen kimseyi sevmez.
        cid: 0
  - verse: 37
    segments:
      - text: >-
          Onlar ki hem kıskanır, cimrilik ederler, hem de herkese cimrilik tavsiye
          ederler ve Allah'ın kendilerine lütfundan verdiği nimeti gizlerler. Biz
          kâfirlere alçaltıcı bir azap hazırladık.
        cid: 0
  - verse: 38
    segments:
      - text: >-
          Bunlar, Allah'a ve ahiret gününe iman etmedikleri halde mallarını, insanlara
          gösteriş yapmak için harcarlar. Şeytan kimin arkadaşı olursa, o ne kötü
          arkadaştır!
        cid: 0
  - verse: 39
    segments:
      - text: >-
          Bunlar, Allah'a ve ahiret gününe iman etselerdi ve Allah'ın verdiği rızıktan
          gösterişsiz harcasalardı kendilerine ne zarar gelirdi? Allah onların söz ve
          işlerini çok iyi bilendir.
        cid: 0
  - verse: 40
    segments:
      - text: >-
          Şüphesiz ki Allah, hiç kimseye zerre kadar zulüm etmez. Eğer yapılan iyilik
          zerre kadar da olsa, onun sevabını kat kat artırır. Ve kendi katından büyük bir
          mükafat verir.
        cid: 0
  - verse: 41
    segments:
      - text: >-
          Her ümmetten bir şahit getirdiğimiz ve seni de onların üzerine bir şahit
          yaptığımız zaman bakalım kâfirlerin hali ne olacak!..
        cid: 0
  - verse: 42
    segments:
      - text: >-
          Allah'ı, inkar edip peygambere isyan edenler, o kıyamet günü yerle bir olmayı
          isterler. Allah'tan hiçbir sözü gizleyemezler.
        cid: 0
  - verse: 43
    segments:
      - text: >-
          Ey iman edenler! Sarhoş iken ne söylediğinizi bilinceye kadar namaza
          yaklaşmayın. Cünüb iken de yolcu olanlar müstesna gusül edinceye kadar namaza
          yaklaşmayın. Eğer hasta olur, veya yolculukta bulunursanız veyahut biriniz
          abdest bozmaktan gelince veya cinsî münasebette bulunup, su da bulamazsanız o
          zaman tertemiz bir toprak ile teyemmüm edin. Niyetle yüzlerinize ve ellerinize
          sürün. Şüphesiz ki Allah çok affedicidir, çok bağışlayıcıdır.
        cid: 0
  - verse: 44
    segments:
      - text: >-
          Kendilerine kitaptan bir nasib verilmiş olanları görmüyor musun? Onlar,
          sapıklığı satın alıyorlar ve sizin de yoldan sapmanızı istiyorlar.
        cid: 0
  - verse: 45
    segments:
      - text: >-
          Allah sizin düşmanlarınızı çok iyi bilir. Gerçek bir dost olarak Allah yeter.
          Ve yardımcı olarak da Allah yeter.
        cid: 0
  - verse: 46
    segments:
      - text: >-
          Yahudilerden bir kısmı, (Allah'ın kitabındaki) kelimeleri esas mânâsından
          kaydırıp; dillerini eğerek ve dine saldırarak, "Sözünü işittik, emirlerine isyan
          ettik, dinle, dinlemez olası ve râinâ (bizi gözet)" diyorlar. Halbuki onlar,
          "İşittik ve itaatettik; dinle ve bize de bak" deselerdi bu, kendileri için daha
          hayırlı ve daha doğru olurdu. Fakat Allah, küfürleri yüzünden kendilerini
          lanetlemiştir. Artık onlar, pek azı müstesna, iman etmezler.
        cid: 0
  - verse: 47
    segments:
      - text: >-
          Ey kendilerine kitap verilenler! Gelin yanınızda bulunan (Tevrat)ı tasdik etmek
          üzere indirdiğimiz bu kitaba iman edin. Biz birtakım yüzleri silip de enselerine
          çevirmeden yahut cumartesi halkını (yahudileri) lanetlediğimiz gibi onları
          lanetlemeden önce iman edin. Yoksa Allah'ın emri mutlaka yerine gelecektir.
        cid: 0
  - verse: 48
    segments:
      - text: >-
          Doğrusu Allah, kendisine ortak koşulmasını asla affetmez. Ondan başkasını
          (diğer günahları) ise, dilediği kimseler için bağışlar ve mağfiret buyurur. Her
          kim Allah'a şirk koşarsa gerçekten pek büyük bir günah ile iftira etmiş olur.
        cid: 0
  - verse: 49
    segments:
      - text: >-
          Kendi nefislerini temize çıkaranları görmüyor musun? Hayır! Ancak Allah,
          dilediğini temize çıkarır. Onlara kıl kadar zulmedilmez.
        cid: 0
  - verse: 50
    segments:
      - text: >-
          Bak nasıl da Allah'a yalan uyduruyorlar. Apaçık bir günah olarak bu yeter.
        cid: 0
  - verse: 51
    segments:
      - text: >-
          "Şu kendilerine kitaptan (okuma yazmadan) bir nasib verilmiş olanları görmüyor
          musun! Onlar puta ve şeytana inanıyorlar. Ve Allah'ı tanımayanlara, "Bunlar,
          müminlerden daha doğru yoldadır." diyorlar.
        cid: 0
  - verse: 52
    segments:
      - text: >-
          Onlar, Allah'ın lanet ettiği kimselerdir. Allah kime lanet ederse artık ona
          asla bir yardımcı bulamazsın.
        cid: 0
  - verse: 53
    segments:
      - text: >-
