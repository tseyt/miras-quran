surah_id: 97
language: tr
author: elmalili
verses:
  - verse: 1
    segments:
      - text: "Biz o (Kur'ân)nu Kadir gecesinde indirdik."
        cid: 0
  - verse: 2
    segments:
      - text: "Kadir gecesinin ne olduğunu sen nereden bileceksin?"
        cid: 0
  - verse: 3
    segments:
      - text: "Kadir gecesi bin aydan daha hayırlıdır."
        cid: 0
  - verse: 4
    segments:
      - text: "Melekler ve Ruh (Cebrail veya Ruh adındaki melek) o gece Rablerinin izniyle, her iş için inerler."
        cid: 0
  - verse: 5
    segments:
      - text: "O gece, tanyeri ağarıncaya kadar süren bir selâmettir."
        cid: 0