surah_id: 41
language: tr
author: elmalili
verses:
  - verse: 1
    segments:
      - text: "Hâ Mîm."
        cid: 0
  - verse: 2
    segments:
      - text: "Bu Kur'ân Rahmân ve Rahîm olan Allah tarafından indirilmiştir."
        cid: 0
  - verse: 3
    segments:
      - text: "Bu, Arapça bir Kur'an olarak, âyetleri bilen bir kavim için ayırt edilip açıklanmış bir kitaptır."
        cid: 0
  - verse: 4
    segments:
      - text: "O, müjdeleyici ve uyarıcı olarak gönderilmiştir. Fakat insanların çoğu yüz çevirmişlerdir. Artık onlar gerçeği işitmezler."
        cid: 0
  - verse: 5
    segments:
      - text: "Onlar: \"Ey Muhammed! Senin bizi davet ettiğin şeye karşı kalplerimiz kapalıdır. Kulaklarımızda da bir ağırlık vardır. Seninle bizim aramızda anlaşmamıza engel bir de perde vardır. Sen istediğini yap, çünkü biz yapıyoruz\" dediler."
        cid: 0
  - verse: 6
    segments:
      - text: "Ey Muhammed! De ki: \"Ben sadece sizin gibi bir insanım, ancak bana ilâhınızın bir tek ilâh olduğu vahyediliyor. Artık hep O'na yönelin ve O'ndan bağışlanma dileyin. Vay O'na ortak koşanların haline!"
        cid: 0
  - verse: 7
    segments:
      - text: "Onlar, zekatı vermezler, ahireti de inkâr ederler."
        cid: 0
  - verse: 8
    segments:
      - text: "Şüphesiz ki, iman edip, salih amel işleyenler için de bitmez tükenmez bir mükafat vardır."
        cid: 0
  - verse: 9
    segments:
      - text: "De ki: \"Siz yeri iki günde yaratanı gerçekten inkâr edip duracak mısınız? Bir de O'na eşler koşuyorsunuz ha? O bütün âlemlerin Rabbidir.\""
        cid: 0
  - verse: 10
    segments:
      - text: "O, yerin üstünde sabit dağlar yarattı. Orada bereketler meydana getirdi. Orada araştırıp soranlar için rızıkları tam dört günde belli bir seviyede takdir edip, düzene koydu."
        cid: 0
  - verse: 11
    segments:
      - text: "Sonra duman halinde bulunan göğe yöneldi. Ona ve yerküreye: \"İsteyerek veya istemeyerek buyruğuma gelin.\" dedi. Her ikisi de: \"İsteyerek geldik\" dediler."
        cid: 0
  - verse: 12
    segments:
      - text: "Böylece Allah onları iki günde yedi gök olmak üzere yerine koydu. Her göğe kendi işini bildirdi. Biz en yakın göğü kandillerle süsledik ve koruduk. İşte bu çok güçlü ve her şeyi bilen Allah'ın takdiridir."
        cid: 0
  - verse: 13
    segments:
      - text: "Eğer onlar, yine yüz çevirirlerse de ki: \"Ben sizi Âd ve Semud'un başına gelen yıldırıma benzer bir yıldırıma karşı uyardım.\""
        cid: 0
  - verse: 14
    segments:
      - text: "Onlara Allah'tan başkasına kulluk etmeyin diye önlerinden ve arkalarından peygamberler geldiği zaman: \"Eğer Rabbimiz dileseydi mutlaka melekler indirirdi. Biz sizin tebliğ için gönderildiğiniz şeylere inanmayız.\" dediler."
        cid: 0
  - verse: 15
    segments:
      - text: "Âd kavmine gelince onlar yeryüzünde büyüklük tasladılar ve: \"Bizden daha kuvvetli kim vardır?\" dediler. Onlar kendilerini yaratan Allah'ın kendilerinden daha kuvvetli olduğunu görmediler mi? Onlar bizim âyetlerimizi bile bile inkâr ediyorlardı."
        cid: 0
  - verse: 16
    segments:
      - text: "Bu yüzden biz de onlara dünya hayatında rezillik azabını tattırmak için o uğursuz günlerde dondurucu bir kasırga gönderdik. Ahiret azabı ise elbette daha çok rezil edicidir. Onlara yardım da edilmeyecektir."
        cid: 0
  - verse: 17
    segments:
      - text: "Semûd kavmine gelince, biz onlara doğru yolu gösterdik. Fakat onlar körlüğü doğru yola tercih ettiler. Bunun üzerine kazandıkları kötülük yüzünden alçaltıcı azabın yıldırımı onları çarpıverdi."
        cid: 0
  - verse: 18
    segments:
      - text: "Biz iman edenleri ve kötülükten sakınanları ise kurtardık."
        cid: 0
  - verse: 19
    segments:
      - text: "O gün Allah'ın düşmanları cehennem ateşine sürülmek üzere hep bir araya toplanırlar."
        cid: 0
  - verse: 20
    segments:
      - text: "Nihayet oraya vardıkları zaman kulakları, gözleri ve derileri yaptıkları şeyler hakkında onların aleyhinde şahitlik ederler."
        cid: 0
  - verse: 21
    segments:
      - text: "Onlar derilerine: \"Niçin aleyhimize şahitlik ettiniz?\" derler. Derileri de: \"Bizi her şeyi konuşturan Allah konuşturdu, sizi ilk defa yaratan O'dur ve siz yine O'na döndürülüyorsunuz\" derler."
        cid: 0
  - verse: 22
    segments:
      - text: "Siz kulaklarınızın, gözlerinizin ve derilerinizin aleyhinizde şahitlik edeceğinden korkarak kötülükten sakınmıyordunuz. Fakat yaptıklarınızdan birçoğunu Allah'ın bilmeyeceğini zannediyordunuz."
        cid: 0
  - verse: 23
    segments:
      - text: "İşte Rabbiniz hakkında beslediğiniz bu zannınız sizi helak etti de zarara uğrayanlardan oldunuz."
        cid: 0
  - verse: 24
    segments:
      - text: "Şimdi eğer dayanabilirlerse onların yeri ateştir. Yok eğer hoşnutluğa dönmek isterlerse bile artık onlar hoşnut edileceklerden değildirler."
        cid: 0
  - verse: 25
    segments:
      - text: "Biz onlara birtakım arkadaşlar musallat ettik de onlar kendilerine önlerinde ve arkalarında ne varsa hepsini güzel gösterdiler. Böylece kendilerinden önce gelip, geçmiş olan cin ve insan toplulukları hakkındaki, azab sözü onlar için de hak oldu. Doğrusu onların hepsi de kendilerine yazık etmişlerdir."
        cid: 0
  - verse: 26
    segments:
      - text: "İnkâr edenler: \"Bu Kur'ânı dinlemeyin, okunurken gürültü yapın, belki üstün gelirsiniz\" dediler."
        cid: 0
  - verse: 27
    segments:
      - text: "Biz mutlaka inkâr edenlere şiddetli bir azab tattıracağız. Ve onlara yaptıkları amellerin en kötüsünün cezasını vereceğiz."
        cid: 0
  - verse: 28
    segments:
      - text: "İşte Allah'ın düşmanlarının cezası ateştir. Âyetlerimizi bile bile inkâr etmelerinin cezası olarak, onlar için orada ebedî olarak kalacakları cehennem yurdu vardır."
        cid: 0
  - verse: 29
    segments:
      - text: "İnkâr edenler: \"Ey Rabbimiz! Cinlerden ve insanlardan bizi doğru yoldan saptıranları bize göster de onları ayaklarımızın altına alalım, böylece cehennemin en altında kalanlardan olsunlar.\" diyeceklerdir."
        cid: 0
  - verse: 30
    segments:
      - text: "\"Rabbimiz Allah'tır\" deyip, sonra da doğrulukta devam edenlere gelince, onların üzerine melekler iner ve derler ki: \"Korkmayın, üzülmeyin, size vaad edilen cennetle sevinin.\""
        cid: 0
  - verse: 31
    segments:
      - text: "\"Biz dünya hayatında da, ahirette de sizin dostlarınızız. Cennette sizin için canınızın çektiği ve istediğiniz her şey vardır.\""
        cid: 0
  - verse: 32
    segments:
      - text: "Bunlar çok bağışlayıcı ve çok merhametli olan Allah tarafından bir ağırlamadır."
        cid: 0
  - verse: 33
    segments:
      - text: "Allah'a davet eden, salih amel işleyen ve: \"Ben gerçekten müslümanlardanım\" diyen kimseden daha güzel sözlü kim olabilir?"
        cid: 0
  - verse: 34
    segments:
      - text: "Hem iyilik de bir değildir, kötülük de. Kötülüğü en güzel bir şekilde sav. O zaman seninle kendi arasında bir düşmanlık olan kişinin, sanki samimi bir dost gibi olduğunu görürsün."
        cid: 0
  - verse: 35
    segments:
      - text: "Bu olgunluğa ancak sabredenler kavuşturulur, buna ancak hayırdan büyük bir pay sahibi olan kavuşturulur."
        cid: 0
  - verse: 36
    segments:
      - text: "Eğer şeytandan gelen kötü bir düşünce seni dürtecek olursa hemen Allah'a sığın. Çünkü O her şeyi işitir ve bilir."
        cid: 0
  - verse: 37
    segments:
      - text: "Gece ile gündüz ve güneş ile ay Allah'ın kudretinin delillerindendir. Güneşe ve aya secde etmeyin. Eğer sadece Allah'a kulluk yapmak istiyorsanız, onları yaratan Allah'a secde edin."
        cid: 0
  - verse: 38
    segments:
      - text: "Eğer onlar büyüklük taslarlarsa bilsinler ki, Rabbinin yanındaki melekler gece gündüz O'nu tesbih ederler ve hiç usanmazlar."
        cid: 0
  - verse: 39
    segments:
      - text: "Senin yeryüzünü boynu bükük, kupkuru görmen de Allah'ın kudretinin delillerindendir. Biz onun üzerine suyu indirdiğimiz zaman titreşir ve kabarır. Şüphesiz ki ona hayat veren Allah mutlaka ölüleri de diriltir. Doğrusu O'nun her şeye gücü yeter."
        cid: 0
  - verse: 40
    segments:
      - text: "Âyetlerimiz hakkında doğruluktan ayrılıp inkâra sapanlar bize gizli kalmazlar. O halde ateşe atılacak olan mı daha hayırlıdır, yoksa kıyamet günü güven içinde gelecek olan mı? İstediğinizi yapın. Şüphesiz ki Allah, yaptığınız şeyleri hakkıyla görür."
        cid: 0
  - verse: 41
    segments:
      - text: "Kur'ân kendilerine geldiğinde onu inkâr edenler, mutlaka cezalarını çekceklerdir. O gerçekten çok değerli bir kitaptır."
        cid: 0
  - verse: 42
    segments:
      - text: "Ona ne önünden, ne de ardından batıl gelemez. O hüküm ve hikmet sahibi, öğülmeye layık olan Allah tarafından indirilmiştir."
        cid: 0
  - verse: 43
    segments:
      - text: "Ey Muhammed! Sana senden önceki peygamberlere söylenenden başka bir şey söylenmiyor. Şüphesiz ki senin Rabbin hem mağfiret sahibidir hem de acı verecek bir azap sahibidir."
        cid: 0
  - verse: 44
    segments:
      - text: "Eğer biz onu yabancı dilden bir Kur'ân yapsaydık onlar mutlaka: \"Bu kitabın âyetleri genişçe açıklanmalı değil miydi? Arap bir peygambere yabancı dil, öyle mi?\" derlerdi. Sen de ki: \"O, iman edenler için bir hidayet ve şifadır.\" İman etmeyenlerin kulaklarında ise bir ağırlık vardır. Kur'ân onlara göre bir körlüktür. Sanki onlar uzak bir yerden çağrılıyorlar (da duymuyorlar)."
        cid: 0
  - verse: 45
    segments:
      - text: "Andolsun ki biz Musa'ya Tevrat'ı vermiştik de onda ihtilafa düşmüşlerdi. Eğer Rabbin tarafından azabın ertelenmesine dair bir söz geçmeseydi mutlaka aralarında hüküm verilirdi. Gerçekten onlar Kur'ân hakkında bir şüphe ve tereddüt içindedirler."
        cid: 0
  - verse: 46
    segments:
      - text: "Her kim iyi bir iş yaparsa, kendi lehine yapmış olur. Kim de bir kötülük yaparsa, kendi aleyhine yapmış olur. Rabbin kullara zulmedecek değildir."
        cid: 0
  - verse: 47
    segments:
      - text: "Kıyamet zamanını bilmek ancak Allah'a havale edilir. Onun bilgisi dışında hiçbir meyve kabuğundan çıkmaz, hiçbir dişi gebe kalmaz ve doğurmaz. Allah onlara: \"Bana koştuğunuz ortaklarım nerede?\" diye seslendiği gün, onlar: \"Senin ortağın olduğuna dair bizden hiçbir şahit olmadığını sana arz ederiz.\" derler."
        cid: 0
  - verse: 48
    segments:
      - text: "Önceden tapmakta oldukları şeyler, kendilerinden uzaklaşıp kaybolmuştur. Onlar da kendileri için kaçacak bir yer olmadığını anlamışlardır."
        cid: 0
  - verse: 49
    segments:
      - text: "İnsan hayır istemekten usanmaz, fakat kendisine bir kötülük dokununca üzülür ve ümitsizliğe düşer."
        cid: 0
  - verse: 50
    segments:
      - text: "Andolsun ki kendisine dokunan bir zarardan sonra, biz ona tarafımızdan bir rahmet tattırsak, O: \"Bu benim hakkımdır, kıyametin kopacağını da sanmıyorum, Rabbime döndürülmüş olsam bile mutlaka O'nun yanında benim için daha güzel şeyler vardır\" der. Biz o inkâr edenlere yaptıkları şeyleri mutlaka haber vereceğiz ve onlara ağır bir azap tattıracağız."
        cid: 0
  - verse: 51
    segments:
      - text: "Biz insana bir nimet verdiğimiz zaman o yüz çevirir, yan çizer. Ona bir kötülük dokunduğu zaman da uzun uzun yalvarır."
        cid: 0
  - verse: 52
    segments:
      - text: "Ey Muhammed! De ki: \"Ne dersiniz? O Kur'ân Allah tarafından gelmiş olup da sonra siz onu inkâr etmişseniz, o takdirde Hak'tan uzak bir ayrılığa düşenden daha sapık kim olabilir?\""
        cid: 0
  - verse: 53
    segments:
      - text: "Biz onlara hem ufuklarda ve hem kendi nefislerinde delillerimizi göstereceğiz ki, Kur'ân'ın hak olduğu kendilerine açıkça belli olsun. Senin Rabbinin her şeye şahit olması kafi değil mi?"
        cid: 0
  - verse: 54
    segments:
      - text: "İyi bilin ki onlar Rablerine kavuşmaktan bir şüphe içindedirler, yine iyi bilin ki, Allah her şeyi ilmiyle kuşatmıştır."
        cid: 0