surah_id: 26
language: tr
author: elmalili
verses:
  - verse: 1
    segments:
      - text: >-
          Tâ, Sîn, Mîm.
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Bunlar sana apaçık kitabın âyetleridir.
        cid: 0
  - verse: 3
    segments:
      - text: >-
          (Resulüm!) Onlar iman etmiyorlar diye adeta kendine kıyacaksın!
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Biz dilersek onların üzerlerine gökten bir âyet (mucize) indiririz de, ona
          boyunları eğilekalır.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Bununla beraber kendilerine O Rahmân'dan yeni bir öğüt gelmeyedursun, ille
          ondan yüz çevirirler.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Üstelik (ona) "yalandır" dediler; fakat onlara alay edip durdukları şeyin
          haberleri yakında gelecektir.
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Yeryüzüne bir bakmadılar mı? Biz orada her güzel çiftten nice bitkiler
          yetiştirmişiz.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Şüphesiz ki bunda mutlak bir âyet (nişane) vardır; ama onların çoğu iman
          etmezler.
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Ve şüphe yok ki Rabbin, galip ve engin merhamet sahibidir.
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Bir vakit de Rabbin, Musa'ya nida edip "Git o zalim kavme" dedi.
        cid: 0
  - verse: 11
    segments:
      - text: >-
          "Firavun kavmine, hâlâ sakınmayacaklar mı?"
        cid: 0
  - verse: 12
    segments:
      - text: >-
          (Musa) şöyle seslendi: "Ya Rab! Doğrusu ben korkarım ki beni yalancı sayarlar."
        cid: 0
  - verse: 13
    segments:
      - text: >-
          "Ve göğsüm daralır, dilim dönmez, onun için Harun'a da elçilik ver."
        cid: 0
  - verse: 14
    segments:
      - text: >-
          "Hem onların bana isnad ettikleri bir suç var. Ondan dolayı korkarım ki, hemen
          beni öldürürler."
        cid: 0
  - verse: 15
