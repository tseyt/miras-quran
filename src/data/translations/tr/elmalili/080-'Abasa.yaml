surah_id: 80
language: tr
author: elmalili
verses:
  - verse: 1
    segments:
      - text: >-
          (Peygamber) Yüzünü ekşitti ve döndü.
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Kendisine âmâ geldi, diye.
        cid: 0
  - verse: 3
    segments:
      - text: >-
          Ne bilirsin, belki o temizlenecek?
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Veya öğüt belleyecek de öğüt ona fayda verecek.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Ama buna ihtiyaç hissetmeyene gelince,
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Sen ona yöneliyorsun.
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Onun temizlenmemesinden sana ne?
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Ama sana can atarak gelen,
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Allah'tan korkarak gelmişken,
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Sen onunla ilgilenmiyorsun.
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Hayır hayır, sakın. Çünkü o Kur'ân bir öğüttür.
        cid: 0
  - verse: 12
    segments:
      - text: >-
          Artık dileyen onu düşünür.
        cid: 0
  - verse: 13
    segments:
      - text: >-
          O, değerli sahifelerdedir.
        cid: 0
  - verse: 14
    segments:
      - text: >-
          Yüksek tutulan tertemiz sahifelerde.
        cid: 0
  - verse: 15
    segments:
      - text: >-
          Yazıcıların ellerindedir,
        cid: 0
  - verse: 16
    segments:
      - text: >-
          Değerli, iyi yazıcıların.
        cid: 0
  - verse: 17
    segments:
      - text: >-
          O kahrolası insan, ne nankör şey.
        cid: 0
  - verse: 18
    segments:
      - text: >-
          O yaratan onu hangi şeyden yarattı?
        cid: 0
  - verse: 19
    segments:
      - text: >-
          Bir damla sudan, onu yarattı da biçime koydu.
        cid: 0
  - verse: 20
    segments:
      - text: >-
          Sonra ona yolunu kolaylaştırdı.
        cid: 0
  - verse: 21
    segments:
      - text: >-
          Sonra onu öldürdü de kabre koydurdu.
        cid: 0
  - verse: 22
    segments:
      - text: >-
          Sonra dilediği vakit onu tekrar diriltir.
        cid: 0
  - verse: 23
    segments:
      - text: >-
          Hayır hayır, doğrusu o, hiç Allah'ın emrini tam yerine getirmedi,
        cid: 0
  - verse: 24
    segments:
      - text: >-
          Bir de o insan yiyeceğine baksın.
        cid: 0
  - verse: 25
    segments:
      - text: >-
          Biz o suyu bol bol döktük.
        cid: 0
  - verse: 26
    segments:
      - text: >-
          Sonra toprağı nasıl da yardık.
        cid: 0
  - verse: 27
    segments:
      - text: >-
          Bu suretle orada ekinler bitirdik.
        cid: 0
  - verse: 28
    segments:
      - text: >-
          Üzümler, yoncalar,
        cid: 0
  - verse: 29
    segments:
      - text: >-
          Zeytinlikler, hurmalıklar,
        cid: 0
  - verse: 30
    segments:
      - text: >-
          İri ve sık ağaçlı bahçeler,
        cid: 0
  - verse: 31
    segments:
      - text: >-
          Meyveler, çayırlar bitirdik.
        cid: 0
  - verse: 32
    segments:
      - text: >-
          Siz ve hayvanlarınız faydalansın diye.
        cid: 0
  - verse: 33
    segments:
      - text: >-
          Kulakları sağır eden o gürültü geldiğinde,
        cid: 0
  - verse: 34
    segments:
      - text: >-
          O gün kişi kaçar, kardeşinden...
        cid: 0
  - verse: 35
    segments:
      - text: >-
          Anasından, babasından..
        cid: 0
  - verse: 36
    segments:
      - text: >-
          Eşinden ve oğullarından.
        cid: 0
  - verse: 37
    segments:
      - text: >-
          Onlardan her birinin o gün başından aşan işi vardır.
        cid: 0
  - verse: 38
    segments:
      - text: >-
          Yüzler var ki, o gün parıl parıl,
        cid: 0
  - verse: 39
    segments:
      - text: >-
          Güler, sevinir.
        cid: 0
  - verse: 40
    segments:
      - text: >-
          Yüzler de var ki, o gün tozlanmış,
        cid: 0
  - verse: 41
    segments:
      - text: >-
          Onları karanlık bürümüş,
        cid: 0
  - verse: 42
    segments:
      - text: >-
          İşte onlardır kâfirler, haktan sapanlar.
        cid: 0