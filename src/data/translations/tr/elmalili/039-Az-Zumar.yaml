surah_id: 39
language: tr
author: elmalili
verses:
  - verse: 1
    segments:
      - text: >-
          Bu kitabın indirilişi, Azîz ve Hakîm olan Allah tarafındandır.
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Emin ol, biz sana kitabı hakkıyla indirdik. Onun için dini yalnız kendisine
          halis kılarak Allah'a ibadet ve kulluk et.
        cid: 0
  - verse: 3
    segments:
      - text: >-
          İyi bil ki, halis din ancak Allah'ındır. O'ndan başka birtakım dostlar tutanlar
          da şöyle demektedirler: "Biz onlara sadece bizi Allah'a daha çok yaklaştırsınlar
          diye ibadet ediyoruz." Şüphe yok ki Allah, onların aralarında ihtilaf edip
          durdukları şeyde hükmünü verecektir. Herhalde yalancı ve nankör olan kimseyi
          Allah doğru yola çıkarmaz.
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Eğer Allah bir çocuk edinmek isteseydi, elbette yaratacağından, dileyeceğini
          seçecekti. Ama o bundan münezzehtir. O, tek ve kahredici olan Allah'tır.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          O, gökleri ve yeri hak ile yarattı, geceyi gündüzün üstüne sarıyor, gündüzü de
          gecenin üstüne sarıyor. Güneşi ve ay'ı emrine âmade kılmış, her biri belli bir
          süreye kadar akıp gitmektedir. İyi bil ki, çok güçlü ve çok bağışlayıcı olan
          ancak O'dur.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          O, sizi bir nefisten yarattı. Hem sonra onun eşini de ondan var etti. Sizin
          için yumuşak başlı hayvanlardan sekiz çift indirdi. Sizi analarınızın
          karınlarında üç karanlık içinde yaratılıştan yaratılışa yaratıp duruyor. İşte
          Rabbiniz Allah O'dur. Mülk O'nundur, O'ndan başka tanrı yoktur. O halde nasıl
          haktan çevrilirsiniz?
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Eğer inkâr ederseniz, şüphe yok ki Allah'ın size ihtiyacı yoktur. Bununla
          beraber kulları hesabına küfre razı olmaz. Eğer şükrederseniz sizin hesabınıza
          ona razı olur. Hiçbir günahkar da diğerinin günahını çekecek değildir. Sonra
          dönüşünüz, Rabbinizedir. O vakit, O size bütün yaptıklarınızı haber verecektir.
          Çünkü O, bütün kalplerin özünü bilir.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          İnsana bir sıkıntı dokunduğu zaman bütün gönlünü vererek Rabbine dua eder.
          Sonra kendisine tarafından bir nimet lütfettiği zaman da önceden O'na dua ettiği
          hali unutur da, yolundan sapıtmak için Allah'a ortaklar koşmaya başlar. Ey
          Muhammed! De ki: "Küfrünle biraz zevk et, çünkü sen, o ateşliklerdensin."
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Yoksa o, gece saatlerinde kalkan, secdeye kapanıp, kıyama durarak daima
          vazifesini yapan, ahireti hesaba katan ve Rabbinin rahmetini uman kimse gibi
          olur mu? De ki: "Hiç bilenlerle bilmeyenler bir olur mu?" Ancak temiz akıl
          sahibi olanlar anlar.
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Ey Muhammed! Tarafımdan söyle: "Ey iman eden kullarım! Rabbinizden korkun. Bu
          dünyada güzellik yapanlara bir güzellik vardır. Allah'ın yeryüzü geniştir. Ancak
          sabredenlere mükafatları hesapsız ödenecektir."
        cid: 0
  - verse: 11
    segments:
      - text: >-
          De ki: "Bana, dini sadece kendisine halis kılarak Allah'a ibadet etmem
          emredildi."
        cid: 0
  - verse: 12
    segments:
      - text: >-
          "Hem O'nun birliğine teslim olan müslümanların ilki olmam da bana emredildi."
        cid: 0
  - verse: 13
    segments:
      - text: >-
          De ki: "Eğer Rabbime isyan edersem, büyük bir günün azabından korkarım."
        cid: 0
  - verse: 14
    segments:
      - text: >-
          De ki: "Ben dinimi kendisine halis kılarak yalnız Allah'a kulluk ederim."
        cid: 0
  - verse: 15
    segments:
      - text: >-
          "Siz de O'ndan başka dilediğinize kul olun." De ki: "Asıl hüsrana düşenler,
          kıyamet günü kendilerine ve mensuplarına ziyan edenlerdir. Evet, işte asıl açık
          hüsran budur."
        cid: 0
  - verse: 16
    segments:
      - text: >-
          Onların üstlerinde ateşten tabakalar, altlarında yine ateşten tabakalar vardır.
          İşte Allah, kullarını bundan korkutuyor, "Ey kullarım! benden korkun." (diyor).
        cid: 0
  - verse: 17
    segments:
      - text: >-
          Tağuttan, ona kulluk etmekten kaçınıp da tam gönülle Allah'a yönelenlere
          gelince, müjde onlaradır. Haydi müjdele kullarımı.
        cid: 0
  - verse: 18
    segments:
      - text: >-
          O kullarımı ki, onlar sözü dinlerler, sonra da en güzeline uyarlar. İşte onlar,
          Allah'ın kendilerine hidayet verdiği kimselerdir. İşte temiz akıllılar da
          onlardır.
        cid: 0
  - verse: 19
    segments:
      - text: >-
          Ya üzerine azab kelimesi hak olmuş kimse de mi (böyledir)? Artık o ateşteki
          kimseyi sen mi çıkaracaksın?
        cid: 0
  - verse: 20
    segments:
      - text: >-
          Fakat o Rablerine sığınarak korunanlar için altlarından ırmaklar akan,
          üzerlerinden şehnişinler yapılmış, şehnişinli (balkonlu) köşkler vardır. Bu,
          Allah'ın vaadidir. Allah vaadinden caymaz.
        cid: 0
  - verse: 21
    segments:
      - text: >-
          Allah'ın gökten bir su indirip de onu bir yoluyla yeryüzündeki menbalara
          koyduğunu görmedin mi? Sonra onunla türlü renklerde bir ekin çıkarır, sonra onun
          olgunlaşıp sarardığını görürsün. Sonra da onu bir çöpe çevirir. Elbette bunda
          temiz akıllılar için bir ihtar vardır.
        cid: 0
  - verse: 22
    segments:
      - text: >-
          Allah, kimin bağrını İslâm'a açmış ise işte o, Rabbinden bir nur üzerinde değil
          midir? Artık Allah'ın zikri hususunda kalpleri katılaşmış olanların vay haline!
          İşte bunlar, apaçık bir sapıklık içindedirler.
        cid: 0
  - verse: 23
    segments:
      - text: >-
          Allah, kelamın en güzelini ikizli, ahenkli bir kitap olarak indirdi. () Ondan
          Rablerine saygısı olanların derileri ürperir. Sonra derileri de, kalpleri de
          Allah'ın zikrine karşı yumuşar. İşte bu Allah'ın rehberidir. Allah, onunla
          dilediğini doğru yola çıkarır. Her kimi de Allah şaşırtırsa, artık ona doğru
          yolu gösterecek yoktur.
        cid: 0
  - verse: 24
    segments:
      - text: >-
          O halde kıyamet günü zalimlere: "Tadın bakalım kazanıp durduklarınızı!"
          denilirken, o kötü azabdan yüzü ile korunacak kimse ne olur? ()
        cid: 0
  - verse: 25
    segments:
      - text: >-
          Onlardan öncekiler de yalanladılar da kendilerine, hatırlarına gelmez yönden
          azab geliverdi.
        cid: 0
  - verse: 26
    segments:
      - text: >-
          Allah, onlara dünya hayatında zilleti tattırdı. Ahiret azabı ise elbette daha
          büyüktür. Keşke bilselerdi!
        cid: 0
  - verse: 27
    segments:
      - text: >-
          Yemin ederim ki, bu Kur'ân'da insanlar için her türlüsünden temsil getirdik.
          Gerek ki iyi düşünsünler.
        cid: 0
  - verse: 28
    segments:
      - text: >-
          Pürüzsüz Arapça bir Kur'ân (indirdik ki, Allah'ın azabından) korunsunlar.
        cid: 0
  - verse: 29
    segments:
      - text: >-
          Allah, şöyle bir misal vermiştir: Bir adam ve birtakım ortakları var, hırçın
          hırçın çekişip duruyorlar. Bir de yalnız bir kişiye bağlı selamet içinde olan
          bir adam var. Bu ikisinin hali hiç bir olur mu? Hamd Allah'ındır, fakat pek
          çokları bilmezler.
        cid: 0
  - verse: 30
    segments:
      - text: >-
          Sen elbette öleceksin, onlar da elbette öleceklerdir.
        cid: 0
  - verse: 31
    segments:
      - text: >-
          Sonra siz muhakkak kıyamet gününde Rabbinizin huzurunda birbirinizden davacı
          olacaksınız.
        cid: 0
  - verse: 32
    segments:
      - text: >-
          Allah'a karşı yalan söyleyen ve doğru kendisine geldiği zaman onu yalan
          sayandan daha zalim (daha haksız) kim olabilir? Kâfirlerin yeri cehennemde değil
          midir?
        cid: 0
  - verse: 33
    segments:
      - text: >-
          Doğruyu getiren ve onu tasdik edene gelince, işte onlar kötülükten korunan
          müttakilerdir.
        cid: 0
  - verse: 34
    segments:
      - text: >-
          Onlara, Rablerinin yanında ne dilerlerse vardır. İşte bu, iyilik yapanların
          mükafatıdır.
        cid: 0
  - verse: 35
    segments:
      - text: >-
          Çünkü Allah, onların önceden yaptıkları amelin en kötüsünü bile keffaretle
          örtüp, işlemekte bulundukları güzel amellerin en güzeline göre mükafatlarını
          kendilerine verecektir.
        cid: 0
  - verse: 36
    segments:
      - text: >-
          Allah, kuluna kâfi değil midir? Durmuşlar da seni O'ndan başkalarıyla
          korkutuyorlar. Her kimi ki Allah şaşırtırsa, artık ona hidayet edecek yoktur.
        cid: 0
  - verse: 37
    segments:
      - text: >-
          Her kime de Allah hidayet verirse artık onu da şaşırtacak yoktur. Allah aziz
          (çok güçlü) ve intikam sahibi değil midir?
        cid: 0
  - verse: 38
    segments:
      - text: >-
          Andolsun ki onlara: "O gökleri ve yeri kim yarattı?" diye soracak olsan:
          "Elbette Allah!" diyeceklerdir. O halde gördünüz ya Allah'tan başka
          çağırdıklarınızı! Eğer Allah bana bir zarar vermek isterse, onlar O'nun zararını
          giderebilirler mi? Yahut bana bir rahmet dilerse, onlar O'nun rahmetini
          tutabilirler mi? De ki: "Allah, bana yeter." Tevekkül edenler, hep O'na
          dayanırlar.
        cid: 0
  - verse: 39
    segments:
      - text: >-
          De ki: "Ey kavmim! Haliniz üzere çalışın. Ben de kendi halime göre çalışıyorum.
          Artık ileride bileceksiniz."
        cid: 0
  - verse: 40
    segments:
      - text: >-
          "Kendisini rezil edecek azabın kime geleceğini ve sürekli bir azabın kimin
          üzerine konacağını."
        cid: 0
  - verse: 41
    segments:
      - text: >-
          Biz bu kitabı sana, insanlar için hak ile indirdik. O halde kim doğru yola
          gelirse kendi lehinedir. Kim de saparsa, sırf kendi aleyhine olarak sapar. Sen
          onların üzerine vekil değilsin.
        cid: 0
  - verse: 42
    segments:
      - text: >-
          Allah, o canları öldükleri zaman, ölmeyenleri de uyuduklarında alır. Sonra
          haklarında ölüm hükmü verdiklerini alıkor, diğerlerini de takdir edilmiş bir
          süreye kadar salıverir. Şüphesiz ki bunda düşünecek bir kavim için nice ibretler
          vardır.
        cid: 0
  - verse: 43
    segments:
      - text: >-
          Yoksa Allah'tan başka şefaatçiler mi edindiler? De ki: "Onlar hiçbir şeye güç
          yetiremezler ve akıl erdiremezlerse de mi (böyle yapacaksınız)?"
        cid: 0
  - verse: 44
    segments:
      - text: >-
          De ki: "Bütün şefaat Allah'ındır. Göklerin ve yerin mülkü O'nundur. Sonra hep
          döndürülüp O'na götürüleceksiniz."
        cid: 0
  - verse: 45
    segments:
      - text: >-
          Böyle iken, Allah bir olarak anıldığı zaman ahirete inanmayanların yürekleri
          burkulur da, O'ndan başkaları anıldığı zaman derhal yüzleri güler.
        cid: 0
  - verse: 46
    segments:
      - text: >-
          De ki: "Ey gökleri ve yeri yaratan, görüleni ve görülmeyeni bilen Allah'ım!
          Kulların arasında, o ihtilaf edip durdukları şeyler hakkında sen hüküm
          vereceksin."
        cid: 0
  - verse: 47
    segments:
      - text: >-
          Eğer bütün yeryüzündekiler ve bir o kadarı da beraber o zulmedenlerin olsaydı,
          kıyamet günü azabın kötülüğünden kurtulmak için onu mutlaka feda ederlerdi.
          Ancak ne var ki, hiç hesaba katmadıkları şeyler, Allah tarafından karşılarına
          çıkarılır.
        cid: 0
  - verse: 48
    segments:
      - text: >-
          Öyle ki, yaptıkları amellerin kötülükleri karşılarına çıkmış ve alay edip
          durdukları şeyler, kendilerini sarmıştır.
        cid: 0
  - verse: 49
    segments:
      - text: >-
          Fakat insana bir sıkıntı dokunuverince bize yalvarır, sonra kendisine
          tarafımızdan bir nimet bahşettiğimiz zaman da: "O bana bir bilgi üzerine
          verildi." der. Belki bu bir imtihandır, fakat pek çokları bilmezler.
        cid: 0
  - verse: 50
    segments:
      - text: >-
          Onu, bunlardan öncekiler de söyledi. Fakat o kazandıkları, kendilerini
          kurtarmadı.
        cid: 0
  - verse: 51
    segments:
      - text: >-
          Neticede kazandıklarının kötülükleri, başlarına geçti. Şunlardan o
          zulmedenlerin de kazandıkları kötülükleri başlarına geçecektir. Onlar da bunu
          atlatacak değillerdir.
        cid: 0
  - verse: 52
    segments:
      - text: >-
          Hâlâ bilmediler mi ki; Allah, rızkı dilediğine açar ve kısar. Şüphesiz ki bunda
          iman edecek bir kavim için nice ibretler vardır.
        cid: 0
  - verse: 53
    segments:
      - text: >-
          De ki: "Ey haddi aşarak nefislerine karşı israf etmiş olan kullarım! Allah'ın
          rahmetinden ümid kesmeyin. Çünkü Allah, bütün günahları bağışlar. Şüphesiz ki O,
          çok bağışlayıcıdır, çok merhamet edicidir."
        cid: 0
  - verse: 54
    segments:
      - text: >-
          Onun için ümidi kesmeyin de başınıza azab gelmeden önce tevbe ile Rabbinize
          yönelin ve O'na teslim olun. Sonra kurtulamazsınız.
        cid: 0
  - verse: 55
    segments:
      - text: >-
          Haberiniz olmayarak ansızın başınıza azab gelmeden önce (halis müslüman olun
          da) Rabbinizden size indirilenin en güzelini takib ve tatbik edin.
        cid: 0
  - verse: 56
    segments:
      - text: >-
          (O günden sakının ki günahkar) nefis şöyle diyecektir: "Allah'ın yanında
          yaptığım kusurlardan dolayı yazık bana! Doğrusu ben alay edenlerdendim."
        cid: 0
  - verse: 57
    segments:
      - text: >-
          Yahut şöyle diyecektir: "Allah bana doğru yolu gösterseydi, her halde ben
          müttakilerden olurdum."
        cid: 0
  - verse: 58
    segments:
      - text: >-
          Veya azabı gördüğü zaman şöyle diyecektir: "Bana bir geri dönüş olsaydı da ben
          de o iyilik yapanlardan olsaydım."
        cid: 0
  - verse: 59
    segments:
      - text: >-
          (Ona): "Hayır sana âyetlerim geldi de onlara yalan dedin, kibirlenmek istedin
          ve kâfirlerden oldun." (denir.)
        cid: 0
  - verse: 60
    segments:
      - text: >-
          Hem o kıyamet günü görürsün ki, Allah'a karşı yalan söyleyenlerin yüzleri
          kararmıştır. Kibirlenenlerin yeri cehennem değil mi?
        cid: 0
  - verse: 61
    segments:
      - text: >-
          Kötülükten sakınan müttakileri ise Allah başarılarından dolayı kurtuluşa
          çıkarır. Onlara fenalık dokunmaz ve onlar üzülecek de değillerdir.
        cid: 0
  - verse: 62
    segments:
      - text: >-
          Allah, her şeyin yaratıcısıdır. Her şey üzerine vekil de O'dur.
        cid: 0
  - verse: 63
    segments:
      - text: >-
          Bütün göklerin ve yerin kilitleri O'nundur. Allah'ın âyetlerini inkâr edenlere
          gelince, işte onlar, kendilerine yazık edenlerdir.
        cid: 0
  - verse: 64
    segments:
      - text: >-
          De ki: "Ey cahiller! Şimdi bana o Allah'tan başkasına mı kulluk etmemi
          emrediyorsunuz?"
        cid: 0
  - verse: 65
    segments:
      - text: >-
          Andolsun ki, sana da, senden öncekilere de şu vahyedildi: "Yemin ederim ki,
          eğer şirk koşarsan bütün çalışmaların boşa gider ve mutlaka kendine yazık
          edenlerden olursun."
        cid: 0
  - verse: 66
    segments:
      - text: >-
          Hayır, onun için yalnız Allah'a kulluk et ve şükredenlerden ol.
        cid: 0
  - verse: 67
    segments:
      - text: >-
          Allah'ı hakkıyla takdir edemediler. Halbuki bütün yer kıyamet günü O'nun
          avucundadır. Gökler de kudretiyle dürülmüştür. O, onların ortak koştuklarından
          münezzeh ve çok yüksektir.
        cid: 0
  - verse: 68
    segments:
      - text: >-
          Ve sûra üflenmiştir. Göklerde kim var, yerde kim varsa çarpılıp yıkılmıştır.
          Ancak Allah'ın dilediği müstesna. Sonra ona bir daha üflenmiştir. Bu defa da hep
          onlar kalkmışlar bakıyorlardır.
        cid: 0
  - verse: 69
    segments:
      - text: >-
          Yer, Rabbinin nuru ile parlamıştır. Kitap konmuş, peygamberler ve şahitler
          getirilmiş ve aralarında hak ile hüküm verilmektedir. Hem onlara hiç haksızlık
          yapılmaz.
        cid: 0
  - verse: 70
    segments:
      - text: >-
          Herkese ne amel yaptıysa karşılığı tam olarak ödenmiştir. O (Allah), onların
          yaptıklarını en iyi şekilde bilmektedir.
        cid: 0
  - verse: 71
    segments:
      - text: >-
          İnkâr edenler bölük bölük cehenneme sevkedilmektedir. Nihayet oraya
          vardıklarında kapıları açılır ve bekçileri onlara: "İçinizden size Rabbinizin
          âyetlerini okuyan, bu gününüzle karşılaşacağınıza dair sizi uyaran peygamberler
          gelmedi mi?" derler. Onlar da: "Evet geldi" derler. Fakat kâfirler üzerine azab
          kelimesi hak oldu.
        cid: 0
  - verse: 72
    segments:
      - text: >-
          (Onlara): "Ebedî olarak içinde kalmak üzere girin cehennemin kapılarından"
          denir. Bak, büyüklük taslayanların yeri ne kötüdür!
        cid: 0
  - verse: 73
    segments:
      - text: >-
          Rablerinden korkanlar da bölük bölük cennete sevk edilmektedir. Nihayet oraya
          vardıkları zaman kapıları açılır ve bekçileri onlara: "Selâm sizlere, ne
          hoşsunuz! Ebedî olarak içinde kalmak üzere haydi girin oraya!" derler.
        cid: 0
  - verse: 74
    segments:
      - text: >-
          Onlar da: "Hamdolsun o Allah'a ki, bize vaadini doğru çıkardı ve bizi cennet
          arzına varis kıldı. Cennette istediğimiz yerde oturuyoruz" derler. Bak ne
          güzeldir mükafatı o iyi amel işleyenlerin!
        cid: 0
  - verse: 75
    segments:
      - text: >-
          Meleklerin de arşın etrafını kuşatarak, Rablerine hamd ile tesbih ettiklerini
          görürsün. Artık halk arasında hak ile hüküm icra edilip "âlemlerin Rabbi Allah'a
          hamdolsun" denilmektedir.
        cid: 0