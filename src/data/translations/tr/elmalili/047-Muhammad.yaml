surah_id: 47
language: tr
author: elmalili
verses:
  - verse: 1
    segments:
      - text: >-
          İnkâr edenlerin ve Allah yolundan alıkoyanların amellerini Allah boşa çıkarır.
        cid: 0
  - verse: 2
    segments:
      - text: >-
          İman edip salih amel işleyenlerin ve Rableri tarafından bir gerçek olarak
          Muhammed'e indirilen kitaba inananların kötülüklerini Allah örter ve durumlarını
          düzeltir.
        cid: 0
  - verse: 3
    segments:
      - text: >-
          Bu, inkâr edenlerin batıla uymaları ve iman edenlerin de Rablerinden gelen
          gerçeğe tâbi olmalarından dolayı böyledir. İşte böylece Allah insanlara kendi
          misallerini anlatır.
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Savaşta inkâr edenlerle karşılaştığınız zaman hemen boyunlarını vurun. Nihayet
          onlara üstün geldiğiniz zaman bağı sıkı bağlayıp esir alın. Sonra harp
          ağırlıklarını atıp, savaş bitince de onları ya karşılıksız olarak, ya da fidye
          ile salıverin. Allah'ın emri budur. Eğer Allah dileseydi onlardan başka türlü de
          intikam alırdı. Fakat böyle olması sizi birbirinizle denemek içindir. Allah
          yolunda öldürülenlere gelince, Allah onların amellerini asla boşa çıkarmaz.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Allah onları doğru yola iletecek ve durumlarını düzeltecektir.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Onları, kendilerine tanıttığı cennete koyacaktır.
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Ey iman edenler! Eğer siz Allah'ın dinine yardım ederseniz Allah da size yardım
          eder ve ayaklarınızı sabit tutar.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          İnkâr edenlere gelince, artık yıkım onlara. Allah onların amellerini boşa
          çıkarmıştır.
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Bu onların, Allah'ın indirdiklerini beğenmediklerinden dolayıdır. Allah da
          bunun için onların amellerini boşa çıkarmıştır.
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Onlar yeryüzünde bir gezmediler mi? Baksalar ya kendilerinden öncekilerin
          sonları nasıl olmuş? Allah onların üzerlerine helak yağdırmıştır. Bu kâfirlere
          de onların başına gelenlerin benzerleri yaraşır.
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Bu böyledir. Çünkü Allah iman edenlerin yardımcısıdır. İnkâr edenlerin ise
          yardımcısı yoktur.
        cid: 0
  - verse: 12
    segments:
      - text: >-
          Şüphesiz ki, Allah iman edip salih amel işleyenleri, altlarından ırmaklar akan
          cennetlere koyar. İnkâr edenler ise dünyada zevk edip geçinirler. Hayvanların
          yediği gibi yerler. Onların varacakları yer ateştir.
        cid: 0
  - verse: 13
    segments:
      - text: >-
          Ey Muhammed! Seni yurdundan çıkaran şehirden daha kuvvetli olan nice şehirler
          vardı ki biz onları helâk ettik de onlara yardım eden çıkmadı.
        cid: 0
  - verse: 14
    segments:
      - text: >-
          Rabbi tarafından apaçık bir delil üzerinde bulunan kimse, kötü işleri kendisine
          güzel gösterilmiş de heveslerinin peşine düşmüş kimseler gibi olur mu?
        cid: 0
  - verse: 15
    segments:
      - text: >-
          Kötülükten sakınanlara vaad edilen cennetin durumu şöyledir: Orada bozulmayan
          temiz sudan ırmaklar, tadı değişmeyen sütten ırmaklar, içenlere lezzet veren
          şaraptan ırmaklar ve süzme baldan ırmaklar vardır. Onlar için cennette her çeşit
          meyve ve Rablerinden bir bağışlanma vardır. Bunların durumu, ateşte ebedî olarak
          kalacak olan ve bağırsaklarını parçalayacak kaynar su içirilen kimsenin durumu
          gibi olur mu?
        cid: 0
  - verse: 16
    segments:
      - text: >-
          Ey Muhammed! Onlardan seni dinlemeye gelenler de var. Senin yanından çıktıkları
          zaman kendilerine ilim verilen kimselere alay yoluyla: "O demin ne söyledi?"
          diye sorarlar. İşte onlar Allah'ın kalplerini mühürlediği kimselerdir. Onlar
          sadece kendi heva ve heveslerine uyarlar.
        cid: 0
  - verse: 17
    segments:
      - text: >-
          Doğru yola girenlere gelince, Allah onların hidayetlerini artırmış ve onlara
          kötülükten sakınma çarelerini ilham etmiştir.
        cid: 0
  - verse: 18
    segments:
      - text: >-
          Artık onlar, kıyamet saatinin kendilerine ansızın gelivermesine mi bakıyorlar?
          Şüphesiz onun alametleri gelmiştir. Artık kıyamet kendilerine gelip çatınca
          anlamaları neye yarar?
        cid: 0
  - verse: 19
    segments:
      - text: >-
          Ey Muhammed! Bil ki, Allah'tan başka hiçbir ilâh yoktur. Hem kendi günahın
          için, hem de mümin erkekler ve mümin kadınlar için Allah'tan bağışlanma dile.
          Allah, sizin gezip dolaştığınız yeri de duracağınız yeri de bilir.
        cid: 0
  - verse: 20
    segments:
      - text: >-
          İman edenler: "Keşke cihad hakkında bir sûre indirilse." derlerdi. Ama hükmü
          açık bir sûre indirilip de, içerisinde savaş zikredilince kalplerinde hastalık
          olanların ölüm korkusuyla baygınlık geçiren bir kimsenin bakışı gibi sana
          baktığını görürsün. Oysa onlar için ölüm yaşamaktan daha uygundur.
        cid: 0
  - verse: 21
    segments:
      - text: >-
          Onların vazifesi itaat ve güzel söz söylemekti. Sonra iş kesinleşince Allah'ın
          emrine sadakat gösterselerdi, elbette kendileri için daha hayırlı olurdu.
        cid: 0
  - verse: 22
    segments:
      - text: >-
          Demek siz iş başına gelecek olursanız yeryüzünde bozgunculuk çıkaracaksınız ve
          akrabalık bağlarınızı koparacaksınız öyle mi?
        cid: 0
  - verse: 23
    segments:
      - text: >-
          İşte onlar, Allah'ın lanetlediği, kulaklarını sağır, gözlerini kör ettiği
          kimselerdir.
        cid: 0
  - verse: 24
    segments:
      - text: >-
          Onlar Kur'an'ı düşünmüyorlar mı? Yoksa kalplerinin üzerinde kilitleri mi var?
        cid: 0
  - verse: 25
    segments:
      - text: >-
          Gerçekten doğru yol kendilerine açıkça belli olduktan sonra gerisin geri küfre
          dönenlere şeytan, kötülüklerini güzel göstermiş ve onları uzun emellere
          düşürmüştür.
        cid: 0
  - verse: 26
    segments:
      - text: >-
          Çünkü onlar Allah'ın indirdiğini beğenmeyen kimselere: "Bazı işlerde biz size
          itaat edeceğiz." demişlerdi. Oysa Allah onların gizlediklerini biliyordu.
        cid: 0
  - verse: 27
    segments:
      - text: >-
          Melekler onların yüzlerine ve arkalarına vurarak canlarını alırken durumları
          nasıl olacak?
        cid: 0
  - verse: 28
    segments:
      - text: >-
          Bu onların Allah'ı gazablandıran şeylere uymaları ve O'nun rızasına sebep
          olacak şeyleri beğenmemelerinden dolayıdır. Allah onların amellerini boşa
          çıkarmıştır.
        cid: 0
  - verse: 29
    segments:
      - text: >-
          Yoksa kalplerinde hastalık olanlar Allah kendilerinin kinlerini hiç ortaya
          çıkarmaz mı sandılar?
        cid: 0
  - verse: 30
    segments:
      - text: >-
          Ey Muhammed! Eğer biz dileseydik onları sana gösterirdik. Sen de onları
          yüzlerinden tanırdın. Andolsun ki, sen onları sözlerinin üslubundan da tanırsın.
          Allah ise bütün yaptıklarınızı bilir.
        cid: 0
  - verse: 31
    segments:
      - text: >-
          Andolsun ki, biz içinizden cihad edenlerle sabredenleri ortaya çıkarıncaya ve
          yaptıklarınızla ilgili haberlerinizi açıklayıncaya kadar sizi deneyeceğiz.
        cid: 0
  - verse: 32
    segments:
      - text: >-
          Şüphesiz ki, inkâr edenler, Allah yolundan menedenler ve kendilerine doğru yol
          açıkça belli olduktan sonra Peygamber'e karşı gelenler Allah'a hiçbir zarar
          veremeyeceklerdir. Allah onların yaptıklarını boşa çıkaracaktır.
        cid: 0
  - verse: 33
    segments:
      - text: >-
          Ey iman edenler! Allah'a itaat edin, Peygamber'e itaat edin ve amellerinizi
          boşa çıkarmayın.
        cid: 0
  - verse: 34
    segments:
      - text: >-
          Şüphesiz ki, inkâr edip, Allah yolundan saptıran, sonra da kâfir olarak
          ölenlere gelince Allah onları asla bağışlamayacaktır.
        cid: 0
  - verse: 35
    segments:
      - text: >-
          Sakın gevşemeyin ve üstün olduğunuz halde barışa çağırmayın. Allah sizinle
          beraberdir. O sizin amellerinizi eksiltmeyecektir.
        cid: 0
  - verse: 36
    segments:
      - text: >-
          Dünya hayatı ancak bir oyun ve eğlenceden ibarettir. Eğer iman eder kötülükten
          sakınırsanız, Allah size mükâfatınızı verir. Ve sizden bütün mallarınızı
          harcamanızı da istemez.
        cid: 0
  - verse: 37
    segments:
      - text: >-
          Eğer sizden onların tamamını isteyip de sizi zorlasaydı cimrilik ederdiniz. Bu
          da sizin bütün kinlerinizi ortaya çıkarırdı.
        cid: 0
  - verse: 38
    segments:
      - text: >-
          İşte sizler Allah yolunda harcamaya çağrılan kimselersiniz. İçinizden kiminiz
          cimrilik ediyor. Ama cimrilik eden ancak kendi zararına cimrilik eder. Allah
          zengindir, siz ise fakirsiniz. Eğer siz Hakk'tan yüz çevirirseniz Allah yerinize
          başka bir kavim getirir. Sonra onlar sizin gibi olmazlar.
        cid: 0