surah_id: 32
language: tr
author: elmalili
verses:
  - verse: 1
    segments:
      - text: "Elif, Lâm, mim."
        cid: 0
  - verse: 2
    segments:
      - text: "Kendisinde şüphe olmayan bu kitabın indirilişi, âlemlerin Rabbi olan Allah tarafındandır."
        cid: 0
  - verse: 3
    segments:
      - text: "Yoksa onu (Muhammed) uydurdu mu diyorlar? Hayır, o senden önce kendilerine bir uyarıcı gelmemiş olan bir kavmi korkutman için, Rabbin tarafından gelen bir haktır. Gerek ki, hidayeti kabul ederler."
        cid: 0
  - verse: 4
    segments:
      - text: "Allah O'dur ki, gökleri, yeri ve ikisi arasındakileri altı günde yaratmış, sonra Arş üzerine istivâ buyurmuştur (hakim olmuştur). Sizin için O'ndan başka ne bir dost vardır, ne de bir şefaatçi! Artık düşünmeyecek misiniz?"
        cid: 0
  - verse: 5
    segments:
      - text: "O, gökten yere, (yukarıdan aşağıya) işleri düzenler, sonra da o işler, sizin saydıklarınızdan bin yıl kadar olan bir günde O'na yükselir."
        cid: 0
  - verse: 6
    segments:
      - text: "İşte görüleni de görülmeyeni de bilen, her şeye gücü yeten, çok merhametli olan O'dur."
        cid: 0
  - verse: 7
    segments:
      - text: "Yarattığı her şeyi güzel yaratan ve insanı yaratmaya bir çamurdan başlayan O'dur."
        cid: 0
  - verse: 8
    segments:
      - text: "Sonra da onun soyunu süzülmüş bir özden, değersiz bir sudan yaratmıştır."
        cid: 0
  - verse: 9
    segments:
      - text: "Sonra onu düzenli bir şekle sokup, içine kendi ruhundan üfürdü. Ve sizin için kulaklar, gözler ve gönüller var etti. Siz pek az şükrediyorsunuz!"
        cid: 0
  - verse: 10
    segments:
      - text: "Onlar: \"Biz yerde kaybolup gittikten sonra, gerçekten biz mi yeni bir yaratılışta bulunacağız?\" dediler. Fakat onlar Rablerine kavuşmayı (O'nun huzuruna varacaklarını) inkâr eden kâfirlerdir."
        cid: 0
  - verse: 11
    segments:
      - text: "De ki: \"Size vekil kılınmış olan ölüm meleği canınızı alacak, sonra döndürülüp Rabbinize götürüleceksiniz.\""
        cid: 0
  - verse: 12
    segments:
      - text: "Ey Muhammed! Günahkârların, Rablerinin huzurunda başları öne eğilmiş olarak: \"Ey Rabbimiz! Gördük ve dinledik, şimdi bizi geri çevir de salih bir amel işleyelim, çünkü biz artık kesin bir şekilde inanıyoruz.\" derlerken bir görsen!"
        cid: 0
  - verse: 13
    segments:
      - text: "Eğer biz dilemiş olsaydık her nefse hidâyetini verirdik. Fakat benden: \"Bütün insanlar ve cinlerden cehennemi elbette dolduracağım.\" sözü hak olmuştur."
        cid: 0
  - verse: 14
    segments:
      - text: "\"O halde bu gününüzle karşılaşmayı unuttuğunuzdan dolayı tadın azabı! İşte biz de sizi unuttuk. Yapmakta olduğunuz işler yüzünden tadın ebedî azabı!\""
        cid: 0
  - verse: 15
    segments:
      - text: "Bizim âyetlerimize öyle kimseler iman eder ki, onlarla kendilerine öğüt verildiği zaman secdelere kapanırlar ve Rablerine hamd ile tesbih ederler de büyüklük taslamazlar."
        cid: 0
  - verse: 16
    segments:
      - text: "Onların yanları yataklardan uzaklaşır, korku ve ümid içinde Rablerine dua ederler ve kendilerine verdiğimiz rızıklardan hayıra sarfederler."
        cid: 0
  - verse: 17
    segments:
      - text: "Şimdi hiç kimse kendileri için, yaptıklarına karşılık gözler aydınlığı olacak şeylerden neler gizlenmiş olduğunu bilemez."
        cid: 0
  - verse: 18
    segments:
      - text: "Öyle ya iman eden kimse, fâsık olan gibi olur mu? Onlar eşit olamazlar."
        cid: 0
  - verse: 19
    segments:
      - text: "Evet, iman edip de salih amelleri işleyen kimselerin, yaptıklarına karşılık bir konukluk (ağırlanma) olarak me'vâ (barınak) cennetleri vardır."
        cid: 0
  - verse: 20
    segments:
      - text: "Ama fâsıklık etmiş olanların barınakları ateştir. Oradan her çıkmak istediklerinde oraya geri çevrilirler ve kendilerine: \"Haydi tadın o ateşin yalanlayıp durduğunuz azabını!\" denir."
        cid: 0
  - verse: 21
    segments:
      - text: "Şu bir gerçek ki, onlara o en büyük azabdan önce yakın azabdan (dünyada) da tattıracağız. Umulur ki, (kötülükten) dönerler."
        cid: 0
  - verse: 22
    segments:
      - text: "Rabbinin âyetleriyle kendisine öğüt verilip de, sonra onlardan yüz çeviren kimseden daha zalim kim olabilir? Gerçekten biz, günahkârlardan intikam alacağız."
        cid: 0
  - verse: 23
    segments:
      - text: "Andolsun ki biz vaktiyle Musa'ya kitap vermiştik. Şimdi de sen ona (öyle bir kitaba) kavuşmaktan şüphe içinde olma. Biz onu İsrailoğullarına doğru yolu göstren bir rehber kılmıştık."
        cid: 0
  - verse: 24
    segments:
      - text: "Onların içinden, sabrettikleri zaman bizim emrimizle doğru yola ileten önderler yetiştirmiştik. Onlar, bizim âyetlerimize kesin bir şekilde inanıyorlardı."
        cid: 0
  - verse: 25
    segments:
      - text: "Şimdi ihtilafa düştükleri şeyler hakkında şüphesiz ki Rabbin kıyamet günü aralarında ayırıcı hükmü verecektir."
        cid: 0
  - verse: 26
    segments:
      - text: "Kendilerinden önce, yurtlarında gezip dolaşmakta oldukları nice kuşakları helâk etmiş olmamız, daha onları doğru yola iletmedi mi? Şüphesiz bunda nice ibretler vardır. Hâlâ kulak vermeyecekler mi?"
        cid: 0
  - verse: 27
    segments:
      - text: "Ya hiç görmediler mi ki, biz kır yere suyu salıveriyoruz da onunla bir ekin çıkarıyoruz. Ondan hayvanları da yiyor, kendileri de. Hâlâ gözlerini açmayacaklar mı?"
        cid: 0
  - verse: 28
    segments:
      - text: "Bir de \"Ne zaman o fetih, eğer doğru söylüyorsanız?\" diyorlar."
        cid: 0
  - verse: 29
    segments:
      - text: "De ki: \"İnkâr edenlere o fetih günü iman etmeleri fayda vermez ve onlara göz açtırılmaz.\""
        cid: 0
  - verse: 30
    segments:
      - text: "Şimdi sen onlardan yüz çevir de gözet. Çünkü onlar da gözetmektedirler."
        cid: 0