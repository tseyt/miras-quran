surah_id: 6
language: tr
author: elmalili
verses:
  - verse: 1
    segments:
      - text: >-
          Hamd, gökleri ve yeri yaratan, karanlıkları ve aydınlığı var eden Allah'a
          mahsustur. Böyleyken kâfirler hâlâ Rablerine başkalarını eşit sayıyorlar.
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Sizi çamurdan yaratan, sonra size bir ecel takdir eden O'dur. Tayin edilen bir
          ecel de (kıyamet zamanı) O'nun katındadır. Sonra bir de şüphe ediyorsunuz.
        cid: 0
  - verse: 3
    segments:
      - text: >-
          O, göklerde de, yerde de (tek) Allah'tır. Sizin gizlinizi, açığınızı ve ne
          kazandığınızı bilir.
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Onlara Rab'lerinin âyetlerinden hiçbir âyet gelmez ki, ondan yüz çevirmesinler.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Hak, kendilerine gelince onu yalanladılar. Alaya aldıkları şeyin haberi yakında
          kendilerine gelecektir.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Kendilerinden önce nice nesilleri helak ettiğimizi görmediler mi? Yeryüzünde
          size vermediğimiz imkanları onlara vermiştik. Onlara gökten bol bol yağmur
          indirmiş, altlarından ırmaklar akıtmıştık. Fakat onları günahlarından dolayı
          helak ettik. Ve kendilerinden sonra başka bir nesil yarattık.
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Eğer sana kağıtta yazılı bir kitap indirmiş olsak da onu elleriyle tutsalardı,
          yine de o kâfirler: "Muhakkak ki bu, apaçık bir sihirdir" derlerdi.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          "O'na bir melek indirilmeli değil miydi?" dediler. Eğer bir melek indirseydik,
          iş bitirilmiş olurdu, sonra kendilerine hiç göz açtırılmazdı.
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Eğer Peygamberi, biz bir melek yapsaydık, yine de onu bir adam şeklinde
          yapardık ve onları yine düştükleri kuşkuya düşürürdük.
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Senden önce de peygamberlerle alay edilmişti. Fakat onlardan alay edenleri,
          alay ettikleri şey kuşatıverdi.
        cid: 0
  - verse: 11
    segments:
      - text: >-
          De ki: "Yeryüzünde dolaşın da yalanlayanların sonu nasıl olmuş, görün!".
        cid: 0
  - verse: 12
    segments:
      - text: >-
          De ki: "Göklerde ve yerde olanlar kimindir?" "Allah'ındır" de. O, rahmet etmeyi
          kendi nefsine yazmıştır. Sizi, varlığında asla şüphe olmayan kıyamet gününde
          toplayacaktır. Ama kendilerini zarara sokanlar inanmazlar.
        cid: 0
  - verse: 13
    segments:
      - text: >-
          Gecede, gündüzde barınan her şey O'nundur. O, işitendir, bilendir.
        cid: 0
  - verse: 14
    segments:
      - text: >-
          De ki: "Gökleri ve yeri yoktan var eden, besleyen, fakat kendisi beslenmeyen
