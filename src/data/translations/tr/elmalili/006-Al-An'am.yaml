          de ve sakın Allah'a ortak koşanlardan olma.
        cid: 0
  - verse: 15
    segments:
      - text: >-
          De ki: "Eğer Rabbime isyan edersem, büyük bir günün azabından korkarım".
        cid: 0
  - verse: 16
    segments:
      - text: >-
          O gün kimden azab giderilirse, kuşkusuz Allah ona rahmet etmiştir. İşte apaçık
          kurtuluş budur.
        cid: 0
  - verse: 17
    segments:
      - text: >-
          Allah sana bir zarar dokundurursa, onu yine kendisinden başka açacak yoktur. Ve
