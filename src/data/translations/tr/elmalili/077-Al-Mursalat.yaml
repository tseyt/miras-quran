surah_id: 77
language: tr
author: elmalili
verses:
  - verse: 1
    segments:
      - text: >-
          Andolsun birbiri ardınca gönderilenlere,
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Büküp devirenlere,
        cid: 0
  - verse: 3
    segments:
      - text: >-
          Yaydıkça yayanlara,
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Seçip ayıranlara,
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Bir öğüt bırakanlara,
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Gerek özür için olsun, gerek uyarı için,
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Herhalde size vaad olunan kesinlikle olacaktır.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Hani o yıldızlar silindiği zaman,
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Gök yarıldığı zaman,
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Dağlar savrulduğu zaman,
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Elçiler, tayin edilen vakitlerine erdirildikleri zaman,
        cid: 0
  - verse: 12
    segments:
      - text: >-
          Bunlar hangi güne ertelendiler?
        cid: 0
  - verse: 13
    segments:
      - text: >-
          Hüküm gününe..
        cid: 0
  - verse: 14
    segments:
      - text: >-
          Bildin mi, nedir o hüküm günü?
        cid: 0
  - verse: 15
    segments:
      - text: >-
          O gün yalanlayanların vay haline!
        cid: 0
  - verse: 16
    segments:
      - text: >-
          Biz, öncekileri helak etmedik mi?
        cid: 0
  - verse: 17
    segments:
      - text: >-
          Sonra geridekileri de onlara katarız.
        cid: 0
  - verse: 18
    segments:
      - text: >-
          Biz suçlulara böyle yaparız.
        cid: 0
  - verse: 19
    segments:
      - text: >-
          O gün yalanlayanların vah haline!
        cid: 0
  - verse: 20
    segments:
      - text: >-
          Biz sizi âdi bir sudan yaratmadık mı?
        cid: 0
  - verse: 21
    segments:
      - text: >-
          Onu sağlam bir yerde oturttuk.
        cid: 0
  - verse: 22
    segments:
      - text: >-
          Belli bir süreye kadar.
        cid: 0
  - verse: 23
    segments:
      - text: >-
          Demek ki biçimlendirmişiz. Ne güzel biçimlendireniz biz.
        cid: 0
  - verse: 24
    segments:
      - text: >-
          O gün yalanlayanların vay haline!
        cid: 0
  - verse: 25
    segments:
      - text: >-
          Yeryüzünü bir tokat (toplanma yeri) yapmadık mı?
        cid: 0
  - verse: 26
    segments:
      - text: >-
          Gerek diriler, gerekse ölüler için.
        cid: 0
  - verse: 27
    segments:
      - text: >-
          Orada yüksek yüksek dağlar oturtup da size bir tatlı su sunmadık mı?
        cid: 0
  - verse: 28
    segments:
      - text: >-
          O gün yalanlayanların vay haline!
        cid: 0
  - verse: 29
    segments:
      - text: >-
          (Kıyameti yalanlayanlara şöyle denir): "Haydin gidin o yalanladığınız şeye
          doğru."
        cid: 0
  - verse: 30
    segments:
      - text: >-
          "Haydi gidin o üç çatallı gölgeye (cehenneme)."
        cid: 0
  - verse: 31
    segments:
      - text: >-
          O, ne gölgelendirir, ne alevden korur.
        cid: 0
  - verse: 32
    segments:
      - text: >-
          O, saray gibi kıvılcımlar atar.
        cid: 0
  - verse: 33
    segments:
      - text: >-
          Sanki o kıvılcımlar, sarı sarı (erkek deve sürüleridir).
        cid: 0
  - verse: 34
    segments:
      - text: >-
          O gün yalanlayanların vay haline!
        cid: 0
  - verse: 35
    segments:
      - text: >-
          Bugün, konuşamıyacakları gündür.
        cid: 0
  - verse: 36
    segments:
      - text: >-
          Kendilerine izin de verilmez ki, özür beyan etsinler.
        cid: 0
  - verse: 37
    segments:
      - text: >-
          O gün yalanlayanların vay haline!
        cid: 0
  - verse: 38
    segments:
      - text: >-
          Bu, işte o hüküm günüdür. Sizi ve öncekileri bir araya topladık.
        cid: 0
  - verse: 39
    segments:
      - text: >-
          Bir hileniz varsa beni atlatın.
        cid: 0
  - verse: 40
    segments:
      - text: >-
          O gün yalanlayanların vay haline!
        cid: 0
  - verse: 41
    segments:
      - text: >-
          Kuşkusuz takva sahipleri gölgeler altında ve pınar başlarındadır.
        cid: 0
  - verse: 42
    segments:
      - text: >-
          Canlarının çektiğinden türlü meyveler arasındadırlar.
        cid: 0
  - verse: 43
    segments:
      - text: >-
          (Onlara): "Yaptıklarınıza karşılık afiyetle yiyin, için" (denir).
        cid: 0
  - verse: 44
    segments:
      - text: >-
          İşte biz güzel amel işleyenleri böyle mükafatlandırırız.
        cid: 0
  - verse: 45
    segments:
      - text: >-
          O gün yalanlayanların vay haline!
        cid: 0
  - verse: 46
    segments:
      - text: >-
          Yiyin, zevklenin biraz, çünkü siz suçlularsınız.
        cid: 0
  - verse: 47
    segments:
      - text: >-
          O gün yalanlayanların vay haline!
        cid: 0
  - verse: 48
    segments:
      - text: >-
          Onlara: "Rüku edin" denildiği zaman etmezler.
        cid: 0
  - verse: 49
    segments:
      - text: >-
          Vay haline o gün yalanlayanların!
        cid: 0
  - verse: 50
    segments:
      - text: >-
          Artık bundan (Kur'an'dan) sonra hangi söze inanacaklar?
        cid: 0