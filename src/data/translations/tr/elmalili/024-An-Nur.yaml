  - verse: 62
    segments:
      - text: >-
          Müminler ancak, Allah'a ve Resülüne gönülden inanmış kimselerdir. Onlar o
          Peygamber ile birlikte sosyal bir işle meşgul iken ondan izin istemedikçe
          bırakıp gitmezler. (Resulüm!) Şu senden izin isteyenler, hakikaten Allah'a ve
          Resulüne iman etmiş kimselerdir. Öyle ise, bazı işleri için senden izin
          istediklerinde, sen de onlardan dilediğine izin ver; onlar için Allah'tan bağış
          dile; çünkü Allah mağfiret edicidir, merhametlidir.
        cid: 0
  - verse: 63
    segments:
      - text: >-
          (Ey müminler!) Peygamberin davetini, aranızdan bazınızın bazınıza daveti gibi
          zannetmeyin. İçinizden, birini siper ederek sıvışıp gidenleri muhakkak ki Allah
          bilmektedir. Bu sebeple, O'nun emrine aykırı davrananlar, başlarına bir bela
          gelmesinden veya kendilerine çok elemli bir azap isabet etmesinden sakınsınlar.
        cid: 0
  - verse: 64
    segments:
      - text: >-
          Bilmiş olun ki, göklerde ve yerde ne varsa Allah'ındır. O, sizin ne yolda, ne
          durumda olduğunuzu iyi bilir. Huzuruna döndürülecekleri günde ise, yapmış
          olduklarını hemen kendilerine haber verir. Allah, her şeyi hakkıyla bilendir..
