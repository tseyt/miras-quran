surah_id: 24
language: tr
author: elmalili
verses:
  - verse: 1
    segments:
      - text: >-
          (İşte bu âyetler) bizim indirdiğimiz ve (hükümlerini üzerinize) farz kıldığımız
          bir sûredir. Belki düşünüp öğüt alırsınız diye onda açık açık âyetler indirdik.
        cid: 0
  - verse: 2
    segments:
      - text: >-
          Zina eden kadın ve zina eden erkekten her birine yüz sopa vurun; Allah'a ve
          ahiret gününe inanıyorsanız, Allah dini(ni tatbik) hususunda sizi sakın acıma
          duygusu kaplamasın! Müminlerden bir grup da onlara uygulanan cezaya şahit olsun.
        cid: 0
  - verse: 3
    segments:
      - text: >-
          Zina eden erkek, zina eden veya müşrik olan bir kadından başkası ile evlenemez;
          zina eden bir kadınla da ancak zina eden veya müşrik olan erkek evlenebilir. Bu,
          müminlere haram kılınmıştır.
        cid: 0
  - verse: 4
    segments:
      - text: >-
          Namuslu kadınlara zina isnadında bulunup, sonra (bunu ispat için) dört şahit
          getiremeyenlere seksener sopa vurun ve artık onların şahitliğini hiçbir zaman
          kabul etmeyin. Onlar tamamen günahkardırlar.
        cid: 0
  - verse: 5
    segments:
      - text: >-
          Ancak bundan sonra tevbe edip ıslah olanlar müstesnadır. Çünkü Allah çok
          bağışlayıcı ve merhametlidir.
        cid: 0
  - verse: 6
    segments:
      - text: >-
          Eşlerine zina isnadında bulunup da kendilerinden başka şahitleri olmayanlara
          gelince, onların her birinin şahitliği kendisinin doğru söyleyenlerden olduğuna
          dair dört defa Allah adına yemin ederek şahitlik etmesidir.
        cid: 0
  - verse: 7
    segments:
      - text: >-
          Beşinci defa da, eğer yalan söyleyenlerden ise, Allah'ın lanetinin kendi
          üzerine olmasını dilemesidir.
        cid: 0
  - verse: 8
    segments:
      - text: >-
          Kadının, kocasının yalan söyleyenlerden olduğuna dair dört defa Allah adına
          yemin ve şahitlik etmesi,
        cid: 0
  - verse: 9
    segments:
      - text: >-
          Beşinci defa da, eğer (kocası) doğru söyleyenlerden ise, Allah'ın gazabının
          kendi üzerine olmasını dilemesi kendisinden cezayı kaldırır.
        cid: 0
  - verse: 10
    segments:
      - text: >-
          Ya Allah'ın size bol lütfu ve merhameti olmasaydı ve Allah tevbeleri kabul eden
          hüküm ve hikmet sahibi olmasaydı (haliniz nice olurdu.)?
        cid: 0
  - verse: 11
    segments:
      - text: >-
          Haberiniz olsun ki (Muhammed'in eşine) bu ağır ifki (iftirayı) uyduranlar sizin
          içinizden bir gruptur. Bunu kendiniz için bir kötülük saymayın; aksine o, sizin
          için bir iyiliktir. Onlardan herbir kişiye, günah olarak ne işlemişse (onun
          karşılığı ceza) vardır. (Elebaşlılık yapan, bu yüzden de) bu günahın büyüğünü
          yüklenen kimse için de çok büyük bir azap vardır.
        cid: 0
  - verse: 12
    segments:
      - text: >-
          Erkek ve kadın müminlerin, bu iftirayı işittiklerinde kendi vicdanları ile
          hüsnü zanda bulunup da, "bu apaçık bir iftiradır" demeleri gerekmez miydi?
        cid: 0
  - verse: 13
    segments:
      - text: >-
          (Bu iddiayı ortaya atanların) da bu konuda dört şahit getirmeleri gerekmez
          miydi? Madem ki şahitler getirip ispat edemediler, öyle ise onlar Allah nezdinde
          yalancıların ta kendisidirler.
        cid: 0
  - verse: 14
    segments:
      - text: >-
          Eğer dünyada ve ahirette Allah'ın lütuf ve merhameti üstünüzde olmasaydı, size
          mutlaka büyük bir azab isabet ederdi.
        cid: 0
  - verse: 15
    segments:
      - text: >-
          Çünkü siz bu iftirayı, gelişi güzel birbirinizin ağzından alıyor ve hakkında
          bilgi sahibi olmadığınız (bu uydurma haberi) ağızlarınızda geveleyip
          duruyorsunuz. Bunun önemsiz olduğunu sanıyorsunuz. Halbuki bu, Allah katında çok
          büyük bir suçtur.
        cid: 0
  - verse: 16
    segments:
      - text: >-
          Onu duyduğunuzda "Bunu konuşup yaymamız bize yakışmaz. Haşâ! Bu, çok büyük bir
          iftiradır..." demeli değil miydiniz?
        cid: 0
  - verse: 17
    segments:
      - text: >-
          Eğer inanmış insanlarsanız, Allah, bir daha buna benzer tutumu tekrarlamaktan
          sizi sakındırıp uyarıyor.
        cid: 0
  - verse: 18
    segments:
      - text: >-
          Ve Allah âyetlerini size açıklıyor. Allah, (işin iç yüzünü) çok iyi bilir, tam
          bir hüküm ve hikmet sahibidir.
        cid: 0
  - verse: 19
    segments:
      - text: >-
          İnananlar arasında kötü söz ve davranışın yayılmasını arzulayan kimseler için
          dünyada da, ahirette de acı veren bir azab vardır. (Her şeyi) Allah bilir; siz
          bilmezsiniz.
        cid: 0
  - verse: 20
    segments:
      - text: >-
          Ya sizin üstünüze Allah'ın lütuf ve merhameti olmasaydı; Allah çok şefkatli ve
          merhametli olmasaydı (haliniz nice olurdu)?
        cid: 0
  - verse: 21
    segments:
      - text: >-
          Ey iman edenler! Şeytanın adımlarını takip etmeyin. Kim şeytanın adımlarını
          takip ederse, şunu bilsin ki o, edepsizlikleri ve kötülüğü emreder. Eğer
          üstünüzde Allah'ın lütuf ve merhameti olmasaydı, içinizden hiçbir kimse temize
          çıkmazdı. Fakat Allah, dilediğini arındırır. Allah işitir ve bilir.
        cid: 0
  - verse: 22
    segments:
      - text: >-
          İçinizden faziletli ve servet sahibi kimseler akrabaya, yoksullara, Allah
          yolunda göç edenlere (mallarından) vermeyeceklerine yemin etmesinler;
          bağışlasınlar, feragat göstersinler. Allah'ın sizi bağışlamasını arzulamaz
          mısınız? Allah çok bağışlayandır, çok merhametlidir.
        cid: 0
  - verse: 23
    segments:
      - text: >-
          Namuslu, kötülüklerden habersiz mümin kadınlara zina isnadında bulunanlar,
          dünya ve ahirette lanetlenmişlerdir. Onlar için çok büyük bir azab vardır.
        cid: 0
  - verse: 24
    segments:
      - text: >-
          O gün dilleri, elleri ve ayakları, yapmış olduklarından dolayı aleyhlerinde
          şahitlik edecektir.
        cid: 0
  - verse: 25
    segments:
      - text: >-
          O gün Allah onlara gerçek cezalarını tastamam verecek ve onlar Allah'ın gerçek
          olduğunu anlayacaklar.
        cid: 0
  - verse: 26
    segments:
      - text: >-
          Kötü kadınlar, kötü erkeklere, kötü erkekler ise kötü kadınlara; temiz kadınlar
          temiz erkeklere, temiz erkekler de temiz kadınlara yaraşır. İşte bu temiz olan,
          (iftiracıların) söylediklerinden çok uzaktırlar. Kendileri için bağışlanma ve
          güzel bir rızık vardır.
        cid: 0
  - verse: 27
    segments:
      - text: >-
          Ey iman edenler! Kendi evinizden başka evlere, geldiğinizi farkettirip ev
          halkına selam vermedikçe girmeyin. Bu sizin için daha iyidir. Herhalde (bunu)
          düşünüp anlarsınız.
        cid: 0
  - verse: 28
    segments:
      - text: >-
          Orada kimse bulamazsanız, size izin verilinceye kadar oraya girmeyin. Eğer
          size, "Geri dönün!" denilirse, hemen dönün. Çünkü bu, sizin için daha temiz bir
          davranıştır. Allah, yaptığınızı bilir.
        cid: 0
  - verse: 29
    segments:
      - text: >-
          İçinde kendinize ait bir şeylerin bulunduğu oturulmayan bir eve girmenizde
          herhangi bir sakınca yoktur. Allah, sizin açığa vurduklarınızı da,
          gizlediklerinizi de bilir.
        cid: 0
  - verse: 30
    segments:
      - text: >-
          (Resulüm!) Mümin erkeklere, gözlerini (harama) dikmemelerini, ırzlarını da
          korumalarını söyle. Çünkü bu, kendileri için daha temiz bir davranıştır.
          Şüphesiz Allah, onların yapmakta olduklarından haberdardır.
        cid: 0
  - verse: 31
    segments:
      - text: >-
          Mümin kadınlara da söyle: Gözlerini (harama bakmaktan) korusunlar; namus ve
          iffetlerini esirgesinler. Görünen kısımları müstesna olmak üzere, zinetlerini
          teşhir etmesinler. Baş örtülerini, yakalarının üzerine (kadar) örtsünler.
          Kocaları, babaları, kocalarının babaları, kendi oğulları, kocalarının oğulları,
          erkek kardeşleri, erkek kardeşlerinin oğulları, kız kardeşlerinin oğulları,
          kendi kadınları (mümin kadınlar), ellerinin altında bulunan (köleleri),
          erkeklerden, kadına ihtiyacı kalmamış (cinsî güçten düşmüş) hizmetçiler, yahut
          henüz kadınların gizli kadınlık hususiyetlerinin farkında olmayan çocuklardan
          başkasına zinetlerini göstermesinler. Gizlemekte oldukları zinetleri anlaşılsın
          diye, ayaklarını yere vurmasınlar. Ey müminler! Hep birden Allah'a tevbe ediniz
          ki, kurtuluşa eresiniz.
        cid: 0
  - verse: 32
    segments:
      - text: >-
          Aranızdaki bekarları, kölelerinizden ve cariyelerinizden iyi davranışta
          olanları evlendirin. Eğer bunlar fakir iseler, Allah kendi lütfu ile onları
          zenginleştirir. Allah, (lütfu) geniş olan ve (her şeyi) bilendir.
        cid: 0
  - verse: 33
    segments:
      - text: >-
          Evlenme imkanını bulamayanlar ise, Allah, lütfu ile kendilerini varlıklı
          kılıncaya kadar iffetlerini korusunlar. Ellerinizin altında bulunanlardan
          (köleler ve cariyelerden) mükatebe yapmak isteyenlerle, eğer kendilerinde
          (hürriyete kavuşmalarında kendileri için) bir iyilik görüyorsanız, hemen
          mükatebe yapın. Allah'ın size vermiş olduğu malından siz de onlara verin. Dünya
          hayatının geçici menfaatlerini elde edeceksiniz diye, namuslu kalmak isteyen
          cariyelerinizi fuhşa zorlamayın. Kim onları zor altında bırakırsa, bilinmelidir
          ki, zorlanmalarından sonra Allah (onlar için) çok bağışlayıcı ve merhametlidir.
        cid: 0
  - verse: 34
    segments:
      - text: >-
          Andolsun ki biz size açık açık bildiren âyetler, sizden önce yaşayıp gitmiş
          olanlardan örnekler ve takvaya ulaşmış kimseler için öğütler indirdik.
        cid: 0
  - verse: 35
    segments:
      - text: >-
          Allah, göklerin ve yerin nurudur (aydınlatıcısıdır). O'nun nurunun temsili,
          içinde lamba bulunan bir kandil gibidir. O lamba bir billur içindedir; o billur
          da sanki inciye benzer bir yıldız gibidir ki, doğuya da batıya da nisbet
          edilemeyen mübarek bir ağaçtan çıkan yağdan tutuşturulur. (Bu öyle bir ağaç ki)
          yağı, nerdeyse, kendisine ateş değmese bile ışık verir. (Bu ışık) nur üstüne
          nurdur. Allah dilediği kimseyi nuruyla hidayete iletir. Allah insanlara (işte
          böyle) misal verir; Allah her şeyi bilir.
        cid: 0
  - verse: 36
    segments:
      - text: >-
          (Bu kandil) birtakım evlerdedir ki, Allah (o evlerin) yücelmesine ve içlerinde
          isminin okunmasına izin vermiştir. Orada sabah akşam O'nu tesbih ederler.
        cid: 0
  - verse: 37
    segments:
      - text: >-
          Birtakım insanlar (Allahı tesbih ederler) ki, ne ticaret ne de alış veriş
          onları Allah'ı anmaktan, namaz kılmaktan ve zekat vermekten alıkoymaz. Onlar,
          kalplerin ve gözlerin allak bullak olduğu bir günden korkarlar.
        cid: 0
  - verse: 38
    segments:
      - text: >-
          Çünkü Allah, kendilerine işledikleri amellerin en güzeli ile ecir verecek,
          lütfundan fazlasını da bahşedecektir ve Allah, dilediğine hesapsız rızık verir.
        cid: 0
  - verse: 39
    segments:
      - text: >-
          Küfredenlere gelince, onların amelleri, ıssız çöllerdeki serap gibidir ki,
          susayan onu su zanneder, nihayet ona vardığında orada herhangi bir şey
          bulamamış, üstelik yanıbaşında da (inanmadığı, kendisinden sakınmadığı) Allah'ı
          bulmuştur. Allah ise onun hesabını tastamam görmüştür. Allah hesabı çok çabuk
          görür.
        cid: 0
  - verse: 40
    segments:
      - text: >-
          Yahut (o kâfirlerin duygu, düşünce ve davranışları) engin bir denizdeki yoğun
          karanlıklar gibidir ki, onu dalga üstüne dalga kaplıyor; üstünde de bulut. Bir
          biri üstüne karanlıklar... İnsan, elini çıkarıp uzatsa, nerdeyse onu dahi
          göremez. Bir kimseye Allah, nur vermemişse, artık o kimsenin ışık ve aydınlıktan
          nasibi yoktur.
        cid: 0
  - verse: 41
    segments:
      - text: >-
          Görmez misin ki, göklerde ve yerde bulunanlarla dizi dizi kanat çırpıp uçan
          kuşların Allah'ı tesbih ettiklerini? Her biri kendi tesbihini ve duâsını
          bilmiştir. Allah, onların yapmakta olduklarını hakkıyla bilir.
        cid: 0
  - verse: 42
    segments:
      - text: >-
          Göklerin ve yerin mülkü Allah'ındır; dönüş de ancak O'nadır.
        cid: 0
  - verse: 43
    segments:
      - text: >-
          Görmez misin ki Allah bulutları (dilediği yere) sürüklüyor; sonra onları
          biraraya getirip üstüste yığıyor. İşte görüyorsun ki bunlar arasında yağmur
          çıkıyor. O, gökten, sanki oradaki dağlardan da dolu indirir. Artık onu
          dilediğine isabet ettirir; dilediğinden de onu uzak tutar; bu bulutlardan çıkan
          şimşeğin parıltısı nerdeyse gözleri alır!
        cid: 0
  - verse: 44
    segments:
      - text: >-
          Allah gece ile gündüzü evirip çeviriyor. Şüphesiz bunda (hakikatı gören)
          gözlere sahip olanlar için mutlak bir ibret vardır.
        cid: 0
  - verse: 45
    segments:
      - text: >-
          Allah, her hayvanı sudan yarattı. İşte bunlardan kimi karnı üstünde sürünür,
          kimi iki yağı üstünde yürür, kimi dört ayağı üstünde yürür... Allah dilediğini
          yapar; çünkü Allah her şeye kâdirdir.
        cid: 0
  - verse: 46
    segments:
      - text: >-
          Andolsun biz (her şeyi) apaçık bildiren âyetler indirdik. Allah dilediğini
          doğru yola iletir.
        cid: 0
  - verse: 47
    segments:
      - text: >-
          Bir de "Allah'a ve Resulüne inandık ve itaat ettik" diyorlar da, sonra bunun
          arkasından yan çiziyorlar; bunlar mümin değillerdir.
        cid: 0
  - verse: 48
    segments:
      - text: >-
          Aralarında hükmetmesi için Allah'a ve Resulüne çağrıldıkları zaman, bakarsın
          ki, içlerinden birkısmı yüz çevirip dönerler.
        cid: 0
  - verse: 49
    segments:
      - text: >-
          Ama, eğer (Allah ve Resulünün hükmettiği) hak kendi lehlerine ise, ona,
          gönülden bağlı olarak saygı ile gelirler.
        cid: 0
  - verse: 50
    segments:
      - text: >-
          Kalplerinde bir hastalık mı var? Yoksa şüphe ve tereddüd içinde midirler? Yoksa
          Allah ve Resulünün kendilerine zulüm ve haksızlık edeceğinden mi korkuyorlar?
          Hayır, asıl zalimler kendileridir!
        cid: 0
  - verse: 51
    segments:
      - text: >-
          Aralarında hüküm vermesi için Allah'a ve Resulüne davet edildiklerinde
          müminlerin sözü ancak "işittik ve itaat ettik" demeleridir. İşte bunlar asıl
          kurtuluşa erenlerdir.
        cid: 0
  - verse: 52
    segments:
      - text: >-
          Her kim Allah'a ve Resulüne itaat eder, Allah'a saygı duyar ve O'ndan
          sakınırsa, işte asıl bunlar bedbahtlıktan kurtulanlardır.
        cid: 0
  - verse: 53
    segments:
      - text: >-
          Ötekiler (münafıklar), sen hakikaten kendilerine emrettiğin takdirde mutlaka
          (savaşa) çıkacaklarına dair, en ağır yeminleri ile Allah'a yemin ettiler. De ki:
          Yemin etmeyin. İtaatiniz malumdur! Bilin ki Allah, yaptıklarınızdan haberdardır.
        cid: 0
  - verse: 54
    segments:
      - text: >-
          De ki: Allah'a itaat edin; Peygambere de itaat edin. Eğer yüz çevirirseniz şunu
          bilin ki, Peygamberin sorumluluğu kendine yüklenen, sizin sorumluğunuz da size
          yüklenendir. Eğer ona itaat ederseniz, doğru yolu bulmuş olursunuz. Peygambere
          düşen, sadece açık açık duyurmaktır.
        cid: 0
  - verse: 55
    segments:
      - text: >-
          Allah, sizlerden iman edip iyi davranışlarda bulunanlara, kendilerinden
          öncekileri sahip ve hakim kıldığı gibi, kendilerini de yeryüzüne sahip ve hakim
          kılacağını, onlar için beğenip seçtiği dini (İslâm'ı) onların iyiliğine
          yerleştirip koruyacağını ve geçirdikleri korku döneminden sonra, bunun yerine
          onlara güven sağlayacağnı vaad etti. Çünkü onlar bana kulluk ederler. Hiçbir
          şeyi bana eş tutmazlar. Artık bundan sonra kim inkâr ederse, işte bunlar asıl
          büyük günahkarlardır.
        cid: 0
  - verse: 56
    segments:
      - text: >-
          Hem namazı kılın, zekatı verin ve peygambere itaat edin ki rahmete eresiniz.
        cid: 0
  - verse: 57
    segments:
      - text: >-
          İnkâr edenlerin, yeryüzünde (Allah'ı) aciz bırakacaklarını sanmayasın! Onların
          varacağı yer cehennemdir. Ne kötü varış yeridir orası!
        cid: 0
  - verse: 58
    segments:
      - text: >-
          Ey iman edenler! Ellerinizin altında bulunan (köle ve cariyeleriniz) ve
          içinizden henüz erginlik çağına girmemiş olanlar, sabah namazından önce, öğleyin
          soyunduğunuz vakit ve yatsı namazından sonra (yanınıza gireceklerinde) sizden üç
          defa izin istesinler. Bunlar mahrem halde bulunabileceğiniz üç vakittir. Bu
          vakitlerin dışında ne sizin için, ne de onlar için bir mahzur yoktur.
          (Birbirinizin yanına girip çıkabilirsiniz.) İşte Allah, âyetlerini size böyle
          açıklar. Allah her şeyi bilendir, hüküm ve hikmet sahibidir.
        cid: 0
  - verse: 59
    segments:
      - text: >-
          Sizden olan çocuklarınız erginlik çağına girdiklerinde, kendilerinden öncekiler
          (büyükleri) izin istedikleri gibi, onlar da izin istesinler. İşte Allah,
          âyetlerini size böyle açıklar. Allah her şeyi bilendir, hüküm ve hikmet
          sahibidir.
        cid: 0
  - verse: 60
    segments:
      - text: >-
          Bir nikah ümidi kalmayan, çocuktan kesilmiş yaşlı kadınların ise, zinetlerini
          (yabancı erkeklere) göstermeksizin dış elbiselerini çıkarmalarında kendilerine
          bir vebal yoktur. Yine de iffetli olmaları kendileri için daha hayırlıdır. Allah
          işitendir, bilendir.
        cid: 0
  - verse: 61
    segments:
      - text: >-
          A'maya güçlük yoktur; topala güçlük yoktur; hastaya da güçlük yoktur. Sizin
          için de gerek kendi evlerinizden, gerekse babalarınızın evlerinden,
          annelerinizin evlerinden, erkek kardeşlerinizin evlerinden, kız kardeşlerinizin
          evlerinden, amcalarınızın evlerinden halalarınızın evlerinden, dayılarınızın
          evlerinden, teyzelerinizin evlerinden veya anahtarlarına malik olduğunuz
          yerlerden, yahut dostlarınızın evlerinden yemenizde bir sakınca yoktur. Toplu
          halde veya ayrı ayrı yemenizde de bir güçlük ve günah yoktur. Evlere girdiğiniz
          zaman Allah tarafından mübarek ve güzel bir yaşama dileği olarak kendinize
          (birbirinize) selam verin. İşte Allah düşünüp anlayasınız diye size âyetlerini
          böyle açıklar.
