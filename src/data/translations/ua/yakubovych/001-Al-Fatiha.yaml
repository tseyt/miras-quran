surah_id: 1
language: ua
author: yakubovych
verses:
  - verse: 1
    segments:
      - text: "Іменем"
        cid: 1
      - text: "Аллага,"
        cid: 2
      - text: "Всемилостивого,"
        cid: 3
      - text: "Милосердного!"
        cid: 4
  - verse: 2
    segments:
      - text: "Хвала"
        cid: 1
      - text: "Аллагу —"
        cid: 2
      - text: "Господу"
        cid: 3
      - text: "світів!"
        cid: 4
  - verse: 3
    segments:
      - text: "Всемилостивому,"
        cid: 1
      - text: "Милосердному!"
        cid: 2
  - verse: 4
    segments:
      - text: "Царю"
        cid: 1
      - text: "Судного"
        cid: 2
      - text: "Дня!"
        cid: 3
  - verse: 5
    segments:
      - text: "Лише Тобі"
        cid: 1
      - text: "поклоняємось"
        cid: 2
      - text: "і лише в Тебе"
        cid: 3
      - text: "просимо допомоги!"
        cid: 4
  - verse: 6
    segments:
      - text: "Вкажи нам"
        cid: 1
      - text: "шлях"
        cid: 2
      - text: "прямий!"
        cid: 3
  - verse: 7
    segments:
      - text: "Шлях"
        cid: 1
      - text: "тих, кого Ти благодіяв,"
        cid: 2
      - text: "а не тих, на кого Ти розгнівався,"
        cid: 3
      - text: "і не заблукалих!"
        cid: 4
